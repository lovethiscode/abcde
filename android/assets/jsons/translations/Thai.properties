The first Game Center sign-in claims unbound offline medals once. Later offline results belong to the last bound player; switching accounts does not transfer games or queues. Game Center syncs completed medals. iCloud syncs extra cross-game facts when configured; use the same accounts on both devices. Medal sharing never invents game dates, turns or battle results. = การลงชื่อเข้า Game Center ครั้งแรกผูกเหรียญออฟไลน์ที่ยังไม่มีเจ้าของเพียงครั้งเดียว ผลออฟไลน์หลังจากนั้นเป็นของผู้เล่นที่ผูกล่าสุด การเปลี่ยนบัญชีไม่ย้ายเกมหรือคิว Game Center ซิงค์เหรียญที่สำเร็จ iCloud ซิงค์ข้อเท็จจริงข้ามเกมเพิ่มเติมเมื่อกำหนดค่าแล้ว ใช้บัญชีเดียวกันทั้งสองอุปกรณ์ การแชร์เหรียญไม่แต่งวันที่ ตา หรือผลการรบขึ้นเอง
