Harun al-Rashid = ฮารูน อัล-ราชิด
The world will be more beautiful without you. Prepare for war. = โลกจะงดงามกว่านี้หากไม่มีท่าน เตรียมทำสงคราม
Fool! You will soon regret dearly! I swear it! = คนโง่! อีกไม่นานท่านจะเสียใจอย่างหนัก ข้าสาบาน!
You have won, congratulations. My palace is now in your possession, and I beg that you care well for the peacock. = ท่านชนะแล้ว ยินดีด้วย วังข้าเป็นของท่านแล้ว ขอให้ดูแลนกยูงให้ดี
Our future battle will be glorious. = การรบของเราในอนาคตจะรุ่งโรจน์
Welcome foreigner, I am Harun Al-Rashid, Caliph of the Arabs. Come and tell me about your empire. = ยินดีต้อนรับชาวต่างแดน ข้าคือฮารูน อัล-ราชิด เคาะลีฟะฮ์แห่งชาวอาหรับ มาเล่าเรื่องจักรวรรดิของท่านให้ข้าฟัง
Come forth, let's do business. = เข้ามา เรามาค้าขายกัน
Peace be upon you. = ขอสันติจงมีแด่ท่าน
Trade Caravans = กองคาราวานการค้า
Blessings of the Great God be upon you, O great caliph Harun al-Rashid, leader of the mighty Arabian people! The Muslim Empire, the Caliphate, born from chaos after the death of the prophet Muhammad in 632 AD, intended to apply the rule of God to all Earth. And by the will of God, the caliphate reached its full power, ruling Spain, North Africa, the Middle East, Anatolia, the Balkans and Persia, to even surpass the Great Roman Empire. The arts and sciences were a holy gift of Arabia during the Middle Ages, as the infidel lands of Europe delved deep into ignorance and chaos. Lasting for six hundred years, the Caliphate finally fell before the Mongols, the plague of the civilized world. = ขอพระผู้เป็นเจ้าประทานพรแก่ท่าน เคาะลีฟะฮ์ฮารูน อัล-ราชิดผู้ยิ่งใหญ่ ผู้นำชาวอาหรับอันเกรียงไกร! จักรวรรดิมุสลิมหรือรัฐเคาะลีฟะฮ์ถือกำเนิดจากความวุ่นวายหลังศาสดามุฮัมมัดสิ้นในปี ค.ศ. 632 และมุ่งนำกฎของพระเจ้ามาใช้ทั่วโลก ด้วยพระประสงค์ของพระองค์ รัฐเคาะลีฟะฮ์จึงรุ่งเรืองสูงสุด ครองสเปน แอฟริกาเหนือ ตะวันออกกลาง อนาโตเลีย บอลข่าน และเปอร์เซีย จนยิ่งใหญ่กว่าจักรวรรดิโรมัน ในยุคกลาง ศิลปะและวิทยาศาสตร์เป็นของขวัญศักดิ์สิทธิ์จากอาหรับ ขณะที่ยุโรปต่างศาสนาจมในความไม่รู้และความวุ่นวาย หลังยืนยงหกร้อยปี รัฐเคาะลีฟะฮ์ก็ล่มสลายต่อชาวมองโกล ภัยพิบัติแห่งโลกอารยะ
Great Caliph Harun al Rashid, all Arabian people long for greatness! Arabia must be once again the land of arts and knowledge, which under the radiant law of God, will fear no enemy! Will your new empire shine through the ages of history? = เคาะลีฟะฮ์ฮารูน อัล-ราชิดผู้ยิ่งใหญ่ ชาวอาหรับทุกคนโหยหาความยิ่งใหญ่! อาระเบียต้องเป็นดินแดนแห่งศิลปะและความรู้อีกครั้ง ภายใต้กฎอันเจิดจรัสของพระเจ้าและไม่หวั่นศัตรูใด! จักรวรรดิใหม่ของท่านจะส่องประกายผ่านยุคสมัยแห่งประวัติศาสตร์หรือไม่?
