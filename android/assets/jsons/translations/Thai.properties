Darius I = ดาริอุสที่หนึ่ง
Your continue existence is an embarrassment to all leaders everywhere! You must be destroyed! = การที่ท่านยังมีชีวิตเป็นความอับอายแก่ผู้นำทุกแห่ง! ท่านต้องถูกทำลาย!
Curse you! You are beneath me, son of a donkey driver! I will crush you! = สาปแช่งท่าน! ท่านต่ำกว่าข้า ลูกคนจูงลา! ข้าจะบดขยี้ท่าน!
You mongrel! Cursed be you! The world will long lament your heinous crime! = ไอ้พันทาง! ขอให้ท่านถูกสาป! โลกจะคร่ำครวญถึงอาชญากรรมชั่วร้ายของท่านไปอีกนาน!
Peace be on you! I am Darius, the great and outstanding king of kings of great Persia... but I suppose you knew that. = ขอสันติจงมีแด่ท่าน! ข้าคือดาริอุส ราชันเหนือราชันผู้ยิ่งใหญ่แห่งมหาเปอร์เซีย... แต่ข้าคิดว่าท่านรู้อยู่แล้ว
In my endless magnanimity, I am making you this offer. You agree, of course? = ด้วยความใจกว้างอันไร้ขอบเขต ข้าขอเสนอข้อตกลงนี้ แน่นอนว่าท่านยอมรับใช่หรือไม่?
Good day to you! = สวัสดี!
Ahh... you... = อา... ท่าน...
Achaemenid Legacy = มรดกอะคีเมนิด
Great King Darius of Persia, the heaven casts its light upon you! Persian people are strong and wise, as their leader. In old ages, the great Persian king Cyrus fought back the mighty Median empire and finally destroyed the Medes in 550 BC. Cunning diplomacy and military achievements helped then to conquer the wealthy Lydia and the powerful Babylon, Cyrus' son conquering the eternal Egypt some years later. At the height of its power, the Persian Empire reached the shores of Macedonia, at the very door of the upstart Greek city-states. Persia would have prospered for centuries if Alexander of Macedon hadn't brutally destroyed the great empire in one violent strike. = กษัตริย์ดาริอุสผู้ยิ่งใหญ่แห่งเปอร์เซีย สวรรค์ส่องแสงเหนือท่าน! ชาวเปอร์เซียเข้มแข็งและชาญฉลาดเช่นผู้นำ ในอดีต กษัตริย์ไซรัสต่อสู้จักรวรรดิมีเดียและทำลายชาวมีดส์ในปี 550 ก่อนคริสตกาล การทูตอันแยบยลและผลงานทางทหารช่วยพิชิตลิเดียอันมั่งคั่งกับบาบิโลนอันทรงพลัง และโอรสของไซรัสพิชิตอียิปต์อันยืนยงในอีกไม่กี่ปี ที่จุดสูงสุด จักรวรรดิเปอร์เซียไปถึงชายฝั่งมาซิโดเนีย หน้าประตูนครรัฐกรีกที่เพิ่งรุ่งขึ้น เปอร์เซียคงรุ่งเรืองอีกหลายศตวรรษ หากอเล็กซานเดอร์แห่งมาซิโดเนียไม่ทำลายจักรวรรดิใหญ่อย่างรุนแรงในคราวเดียว
King Darius, the people of Persia await, longing for its past glory and power! Persia of the Immortals must reborn, to punish its foes and rebuild the gleaming Persepolis! Will your new empire shine through the ages of history? = กษัตริย์ดาริอุส ชาวเปอร์เซียกำลังรอคอยและโหยหาเกียรติยศกับอำนาจในอดีต! เปอร์เซียแห่งนักรบอมตะต้องเกิดใหม่ ลงโทษศัตรูและสร้างเปอร์เซโปลิสอันเจิดจรัส! จักรวรรดิใหม่ของท่านจะส่องประกายผ่านยุคสมัยแห่งประวัติศาสตร์หรือไม่?
