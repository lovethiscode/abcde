Great King Alexander, leader of the mighty Greek nation, you are truly blessed by the gods. In 480 BC, quarrelsome city-states such as Athens, Sparta, Thebes, found a way to join their forces, allowing Greece to defeat the mighty Persia in the 5th century BC, both on land and sea. Following their example, you lead a Greek coalition and finally struck down the Persian Empire in 331 BC. You conquered almost all the known world, and from Europe to Africa to India, you built an empire unmatched by any before it. = กษัตริย์อเล็กซานเดอร์ผู้ยิ่งใหญ่ ผู้นำชนชาติกรีกอันเกรียงไกร ท่านได้รับพรจากเทพเจ้าอย่างแท้จริง ในปี 480 ก่อนคริสตกาล นครรัฐที่เคยทะเลาะกัน เช่น เอเธนส์ สปาร์ตา และธีบส์ ร่วมกำลังกัน ทำให้กรีซเอาชนะเปอร์เซียทั้งบนบกและในทะเลในศตวรรษที่ 5 ก่อนคริสตกาล ท่านนำแนวร่วมกรีกตามแบบอย่างนั้นและโค่นจักรวรรดิเปอร์เซียในปี 331 ก่อนคริสตกาล ท่านพิชิตโลกที่รู้จักเกือบทั้งหมด จากยุโรปสู่อัฟริกาและอินเดีย สร้างจักรวรรดิที่ไม่เคยมีใครเทียบได้
Megalexandros, son of Zeus, will you ride Bucephalas again, to gift the world with the brightness of the Greek culture? Will your new empire shine through the ages of history? = เมกาเล็กซานดรอส โอรสแห่งซุส ท่านจะขี่บูเคฟาลัสอีกครั้งเพื่อนำความรุ่งเรืองของวัฒนธรรมกรีกมอบแก่โลกหรือไม่? จักรวรรดิใหม่ของท่านจะส่องประกายผ่านยุคสมัยแห่งประวัติศาสตร์หรือไม่?
