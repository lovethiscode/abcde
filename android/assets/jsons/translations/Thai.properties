On Emperor difficulty or higher, enable One City Challenge and win a Scientific Victory without ever owning a second city, even temporarily. = ระดับจักรพรรดิขึ้นไป: เปิดท้าทายเมืองเดียวและชนะวิทยาศาสตร์ โดยไม่เคยครองเมืองที่สองแม้ชั่วครู่
On Emperor difficulty or higher, win a Cultural Victory without ever owning a World Wonder, whether built, captured or received. National Wonders are allowed. = ระดับจักรพรรดิขึ้นไป: ชนะวัฒนธรรมโดยไม่เคยครองสิ่งมหัศจรรย์ของโลกไม่ว่าจากสร้าง ยึด หรือรับ อนุญาตสิ่งมหัศจรรย์แห่งชาติ
On Emperor difficulty or higher, win any formal victory, including Time. = ระดับจักรพรรดิขึ้นไป: ชนะอย่างเป็นทางการแบบใดก็ได้ รวมด้านเวลา
On Prince difficulty or higher, build 8 different World Wonders in one game. = ระดับเจ้าชายขึ้นไป: สร้างสิ่งมหัศจรรย์ของโลกต่างกัน 8 แห่งในเกมเดียว
One City, Many Stars = เมืองเดียวถึงดวงดาว
One city holds the dreams of countless people. = เมืองหนึ่งรองรับความฝันของผู้คนนับไม่ถ้วน
Only qualifying new games started with this new achievement catalog count. Old saves cannot gain eligibility by copying, importing or resaving. Use a built-in ruleset, one human major civilization, a generated map and an Ancient-era start, without mods or editor scenarios. = นับเฉพาะเกมใหม่ที่เข้าเงื่อนไขและเริ่มบันทึกด้วยรายการความสำเร็จใหม่นี้ การคัดลอก นำเข้า หรือบันทึกเกมเก่าใหม่ไม่ทำให้มีสิทธิ์ ใช้กฎในตัว อารยธรรมหลักที่มนุษย์ควบคุมเพียงหนึ่งแห่ง แผนที่สร้างโดยเกม และเริ่มยุคโบราณ โดยไม่มีม็อดหรือฉากจากตัวแก้ไข
Ordinary save loading restores that branch's challenge history; earned medals stay unlocked. God mode, state-changing debug commands and full AI autoplay permanently disqualify that game, even after loading an older save. Normal Worker automation and exploration are allowed. The first formal victory or your defeat ends contributions; playing another turn does not count. = การโหลดปกติคืนประวัติของสาขาบันทึกนั้น แต่เหรียญที่ปลดล็อกแล้วยังคงอยู่ โหมดเทพ คำสั่งแก้จุดบกพร่องที่เปลี่ยนสถานะ และ AI เล่นแทนทั้งเกมทำให้เกมนั้นหมดสิทธิ์ถาวร แม้โหลดบันทึกก่อนหน้า อนุญาตคนงานอัตโนมัติและสำรวจอัตโนมัติตามปกติ เมื่อมีชัยชนะทางการครั้งแรกหรือคุณแพ้จะหยุดนับ เล่นอีกตาก็ไม่นับ
