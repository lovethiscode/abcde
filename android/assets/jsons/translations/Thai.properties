Ramkhamhaeng = รามคำแหง
You lowly, arrogant fool! I will make you regret of your insolence! = ต่ำช้ายิ่ง! ข้าจะสั่งสอนเจ้าผู้ต่ำทรามอวดดีให้ราบคาบ!
You scoundrel! I shall prepare to fend you off! = พวกผีร้าย! ข้าจะขจัดมารผจญในตัวท่านในรุ่งเร็ววัน!
Although I lost, my honor shall endure. I wish you good luck. = แม้สยามจะสิ้นแต่จะมิสิ้นเสียชื่อ, ขออวยพรท่านให้ฤกษ์ดี
I, Pho Kun Ramkhamhaeng, King of Siam, consider it a great honor that you have walked to visit my country of Siam. = ข้าพเจ้าพ่อขุนรามคำแหงมหาราช, กษัตริย์แห่งกรุงสยาม, ถือเป็นเกียรติยิ่งนักสำหรับการมาเยือนของท่าน ณ อาณาจักรสยาม.
Greetings. I believe this is a fair proposal for both parties. What do you think? = กราบสวัสดี. ข้าเชื่อว่าข้อเสนออันดีในครั้งนี้จะสร้างประโยชน์แก่ทั้งสองชาติ, ท่านคิดเช่นไร?
Welcome. = ยินดีต้อนรับ.
Father Governs Children = พ่อปกครองลูก
O Great King Ramkhamhaeng, the Siamese people obey you with respect and fear! The beautiful and mysterious land of Siam is an ancient country in the heart of Southeast Asia, which was besieged by many foes, plagued by bloody war and great poverty, but eventually the smart and loyal Siamese people have endured and triumphed. Siam was a part of the Khmer Empire until the 13th century AD, before its brave people took arms and led a revolution to form the small Sukhothai kingdom. After many battles and diplomacy prowess, this tiny kingdom became a mighty empire, which would dominate South East Asia for more than a century. = พ่อขุนรามคำแหงมหาราช ชาวสยามน้อมเชื่อฟังด้วยความเคารพและยำเกรง! สยามอันงดงามและลึกลับคือประเทศโบราณกลางเอเชียตะวันออกเฉียงใต้ เคยถูกรุมล้อมด้วยศัตรู สงครามนองเลือดและความยากจน แต่ชาวสยามที่ฉลาดและภักดียืนหยัดจนมีชัย สยามเคยเป็นส่วนหนึ่งของจักรวรรดิขอมจนถึงคริสต์ศตวรรษที่ 13 ก่อนประชาชนผู้กล้าลุกขึ้นปฏิวัติและก่อตั้งอาณาจักรสุโขทัยอันเล็ก หลังการรบและการทูตอันชาญฉลาด อาณาจักรเล็กนี้กลายเป็นจักรวรรดิทรงอำนาจที่ครองเอเชียตะวันออกเฉียงใต้นานกว่าศตวรรษ
Wise and powerful King Ramkhamhaeng, your people want to revive these days of glory! Can you make a new dawn break on Siam? Will your new empire shine through the ages of history? = พ่อขุนรามคำแหงผู้ทรงปัญญาและอำนาจ ประชาชนต้องการฟื้นวันแห่งความรุ่งโรจน์! ท่านจะทำให้อรุณใหม่ส่องสยามได้หรือไม่? จักรวรรดิใหม่ของท่านจะส่องประกายผ่านยุคสมัยแห่งประวัติศาสตร์หรือไม่?
