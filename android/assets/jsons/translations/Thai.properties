This Game Center player's records belong to a different iCloud account. Return to that iCloud account to resume syncing. = บันทึกของผู้เล่น Game Center นี้ผูกกับบัญชี iCloud อื่น กลับไปใช้บัญชีนั้นเพื่อซิงค์ต่อ
