#################### Lines from Quests from Civ V - Vanilla ####################

Route = เส้นทาง
Build a road to connect your capital to our city. = สร้างถนนเชื่อมเมืองหลวงของท่านกับเมืองของเรา

Clear Barbarian Camp = กำจัดค่ายคนเถื่อน
We feel threatened by a Barbarian Camp near our city. Please take care of it. = เรารู้สึกถูกค่ายคนเถื่อนใกล้เมืองคุกคาม โปรดจัดการให้ด้วย

Connect Resource = เชื่อมทรัพยากร
In order to make our civilizations stronger, connect [tileResource] to your trade network. = เพื่อให้อารยธรรมเราแข็งแกร่งขึ้น จงเชื่อม [tileResource] เข้ากับเครือข่ายการค้าของท่าน

Construct Wonder = สร้างสิ่งมหัศจรรย์
We recommend you to start building [wonder] to show the whole world your civilization strength. = เราขอแนะนำให้เริ่มสร้าง [wonder] เพื่อแสดงพลังอารยธรรมของท่านแก่ทั้งโลก

Acquire Great Person = รับบุคคลผู้ยิ่งใหญ่
Great People can change the course of a Civilization! You will be rewarded for acquiring a new [greatPerson]. = บุคคลผู้ยิ่งใหญ่เปลี่ยนเส้นทางอารยธรรมได้! ท่านจะได้รางวัลเมื่อได้รับ [greatPerson] คนใหม่

Conquer City State = พิชิตนครรัฐ
It's time to erase the City-State of [cityState] from the map. You will be greatly rewarded for conquering them! = ถึงเวลาลบนครรัฐ [cityState] ออกจากแผนที่ ท่านจะได้รางวัลใหญ่เมื่อพิชิตพวกเขา!

Find Player = ค้นหาผู้เล่น
You have yet to discover where [civName] set up their cities. You will be rewarded for finding their territories. = ท่านยังไม่พบว่า [civName] ตั้งเมืองไว้ที่ใด ท่านจะได้รางวัลเมื่อพบดินแดนของพวกเขา

Find Natural Wonder = ค้นหาสิ่งมหัศจรรย์ทางธรรมชาติ
Send your best explorers on a quest to discover Natural Wonders. Nobody knows the location of [naturalWonder] yet. = ส่งนักสำรวจที่ดีที่สุดไปค้นพบสิ่งมหัศจรรย์ทางธรรมชาติ ยังไม่มีใครรู้ที่ตั้งของ [naturalWonder]

Give Gold = มอบทอง
We are suffering great poverty after being robbed by [civName], and unless we receive a sum of Gold, it's only a matter of time before we collapse. = เรายากจนอย่างหนักหลังถูก [civName] ปล้น หากไม่ได้รับทองจำนวนหนึ่ง อีกไม่นานเราจะล่มสลาย

Pledge to Protect = ให้คำมั่นคุ้มครอง
We need your protection to stop the aggressions of [civName]. By signing a Pledge of Protection, you'll confirm the bond that ties us. = เราต้องการการคุ้มครองเพื่อหยุดการรุกรานของ [civName] การลงนามคำมั่นคุ้มครองจะยืนยันสายสัมพันธ์ของเรา

Contest Culture = แข่งขันวัฒนธรรม
The civilization with the largest Culture growth will gain a reward. = อารยธรรมที่เพิ่มวัฒนธรรมได้มากที่สุดจะได้รางวัล

Contest Faith = แข่งขันความเชื่อ
The civilization with the largest Faith growth will gain a reward. = อารยธรรมที่เพิ่มความเชื่อได้มากที่สุดจะได้รางวัล

Contest Technologies = แข่งขันเทคโนโลยี
The civilization with the largest number of new Technologies researched will gain a reward. = อารยธรรมที่วิจัยเทคโนโลยีใหม่ได้มากที่สุดจะได้รางวัล

Invest = ลงทุน
Our people are rejoicing thanks to a tourism boom. For a certain amount of time, any Gold donation will yield [50]% extra Influence. = ประชาชนเรายินดีเพราะการท่องเที่ยวเฟื่องฟู ในช่วงเวลาหนึ่ง การบริจาคทองทุกครั้งจะให้อิทธิพลเพิ่ม [50]%

Bully City State = ข่มขู่นครรัฐ
We are tired of the pretensions of [cityState]. If someone were to put them in their place by Demanding Tribute from them, they would be rewarded. = เราเบื่อคำอวดอ้างของ [cityState] หากใครสั่งสอนพวกเขาด้วยการเรียกบรรณาการ ผู้นั้นจะได้รางวัล

Denounce Civilization = ประณามอารยธรรม
We have been forced to pay tribute to [civName]! We need you to tell the world of their ill deeds. = เราถูกบังคับให้ส่งบรรณาการแก่ [civName]! เราต้องการให้ท่านบอกโลกถึงความชั่วของพวกเขา

We have heard the tenets of [religionName] and are most curious. Will you send missionaries to teach us about your religion? = เราได้ยินหลักคำสอนของ [religionName] และสนใจมาก ท่านจะส่งผู้เผยแผ่ศาสนามาสอนเราได้หรือไม่?


