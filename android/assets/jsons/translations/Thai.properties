Harald Bluetooth = ฮารัลด์ บลูทูท
If I am to be honest, I tire of those pointless charades. Why don't we settle our disputes on the field of battle, like true men? Perhaps the skalds will sing of your valor... or mine! = พูดตรง ๆ ข้าเบื่อการแสดงไร้สาระแล้ว ทำไมเราไม่ตัดสินข้อพิพาทในสนามรบอย่างลูกผู้ชาย? บางทีกวีอาจขับขานความกล้าของท่าน... หรือของข้า!
Ahahah! You seem to show some skills of a true Viking! Too bad that I'll probably kill you! = ฮ่า ๆ! ท่านดูมีฝีมือไวกิงแท้อยู่บ้าง! น่าเสียดายที่ข้าคงฆ่าท่าน!
Loki must have stood by you, for a common man alone could not have defeated me... Oh well! I will join the einherjar in Valhalla and feast, while you toil away here. = โลกิคงอยู่ข้างท่าน เพราะคนธรรมดาลำพังไม่มีทางชนะข้า... เอาเถอะ! ข้าจะร่วมงานเลี้ยงกับนักรบไอน์เฮอร์ยาร์ในวัลฮัลลา ขณะที่ท่านตรากตรำอยู่ที่นี่
Our future battle will be glorious! = การรบของเราในอนาคตจะรุ่งโรจน์!
Harald Bluetooth bids you welcome to his lands, a Viking unlike any the seas and lands have ever known! Hah, are you afraid? = ฮารัลด์ บลูทูทขอต้อนรับท่านสู่ดินแดนของเขา ไวกิงที่ทะเลและแผ่นดินไม่เคยพบผู้ใดเหมือน! ฮ่า ท่านกลัวหรือ?
This is a fine deal! Even a drunk beggar would agree! = ข้อตกลงนี้ดีนัก! แม้ขอทานขี้เมายังยอมรับ!
Hail to you. = ขอคารวะท่าน
Viking Fury = โทสะแห่งไวกิง
Skal, Harald Bluetooth Gormsson, son of King Gorm of the Old and Thyra Dannebod! After crushing the armies of Norway, you achieved great construction projects all across the land of mighty Denmark. Numerous Ring Fortresses were built under your reign to protect the people from foreign invasions, but also from local quarrels. In 983 AD, you successfully repelled several waves of German settlers trying to colonize your land, and then always kept your kingdom free from any foreign pressure. = สกอล ฮารัลด์ บลูทูท กอร์มส์สัน โอรสของกษัตริย์กอร์มผู้เฒ่าและธีรา ดันเนโบด! หลังบดขยี้กองทัพนอร์เวย์ ท่านสร้างโครงการใหญ่ทั่วเดนมาร์กอันเกรียงไกร ป้อมวงแหวนมากมายสร้างในรัชกาลเพื่อป้องกันการรุกรานและความขัดแย้งในท้องถิ่น ในปี ค.ศ. 983 ท่านผลักดันชาวเยอรมันที่พยายามตั้งอาณานิคมหลายระลอก และรักษาอาณาจักรให้พ้นแรงกดดันต่างชาติเสมอมา
As a true Viking, who knows not fear, time has come to unleash mighty armies of Northsmen to bring despair upon your enemies! By the will of the Gods, it will be either a glorious triumph or a sumptuous feast in the Valhalla! Will your new empire shine through the ages of history? = ในฐานะไวกิงแท้ผู้ไม่รู้จักความกลัว ถึงเวลาปลดปล่อยกองทัพชาวเหนือเพื่อนำความสิ้นหวังสู่ศัตรู! ด้วยพระประสงค์แห่งเทพ จะเป็นชัยชนะอันรุ่งโรจน์หรืองานเลี้ยงหรูหราในวัลฮัลลา! จักรวรรดิใหม่ของท่านจะส่องประกายผ่านยุคสมัยแห่งประวัติศาสตร์หรือไม่?
