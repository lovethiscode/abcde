Most achievements allow any difficulty and need at least 1 AI opponent. Only N30, N36, N37, N38 and N39 require the stated difficulty and at least 3 AI opponents. You need not enable all victory routes. All game speeds are allowed. Any victory includes Time. Religion achievements require religion to be enabled. = ความสำเร็จส่วนใหญ่เล่นได้ทุกระดับและต้องมีคู่แข่ง AI อย่างน้อย 1 ราย เฉพาะ N30, N36, N37, N38 และ N39 ต้องใช้ระดับที่ระบุและ AI อย่างน้อย 3 ราย ไม่จำเป็นต้องเปิดชัยชนะทุกแบบ เล่นได้ทุกความเร็ว ชัยชนะใดก็ได้รวมชัยชนะด้านเวลา ความสำเร็จทางศาสนาต้องเปิดศาสนา
N38 forbids ever owning a second city, including founding, conquest, puppets, trades and brief ownership. N39 forbids ever owning a World Wonder by any means; losing it later does not erase that branch's history. N26 collects 8 distinct self-built World Wonders across qualifying new games. N40 requires the other 39 new medals; old medals never substitute for them. = N38 ห้ามเป็นเจ้าของเมืองที่สอง รวมการก่อตั้ง พิชิต เมืองหุ่นเชิด การค้า และถือครองชั่วครู่ N39 ห้ามครอบครองสิ่งมหัศจรรย์ของโลกไม่ว่าทางใด การเสียไปภายหลังไม่ลบประวัติสาขา N26 สะสมสิ่งมหัศจรรย์ที่สร้างเอง 8 ชนิดข้ามเกมใหม่ที่เข้าเงื่อนไข N40 ต้องมีเหรียญใหม่อีก 39 เหรียญ เหรียญเก่าใช้แทนไม่ได้
