Vive Napoleon I, First Consul and Emperor of France! After the glorious Revolution which suppressed the centuries-old monarchy, the French nation stood at the heart of Europe as a Republic, and intended to export its ideals to the entire European continent, either by diplomacy or war. The French Capital Paris was more than ever the world center of Culture, Arts, and Letters. With its Great Army, reputed as one of the greatest in the History, France fought gloriously all surrounding enemies, but eventually fell against the coalition of other European powers. = นโปเลียนที่หนึ่ง กงสุลคนแรกและจักรพรรดิแห่งฝรั่งเศสจงเจริญ! หลังการปฏิวัติอันรุ่งโรจน์ล้มระบอบกษัตริย์อายุหลายศตวรรษ ชาติฝรั่งเศสยืนอยู่กลางยุโรปในฐานะสาธารณรัฐ และมุ่งเผยแพร่อุดมคติไปทั่วทวีปด้วยการทูตหรือสงคราม ปารีส เมืองหลวงฝรั่งเศส ยิ่งเป็นศูนย์กลางวัฒนธรรม ศิลปะ และวรรณกรรมของโลก ด้วยมหากองทัพที่ขึ้นชื่อว่ายิ่งใหญ่ที่สุดกองทัพหนึ่งในประวัติศาสตร์ ฝรั่งเศสรบกับศัตรูโดยรอบอย่างรุ่งโรจน์ แต่สุดท้ายพ่ายต่อพันธมิตรมหาอำนาจยุโรป
Napoleon Bonaparte, ruler of the French people, will you rebuild the Empire to take revenge on your foes, and make again of its Capital the City of Lights? Will your new empire shine through the ages of history? = นโปเลียน โบนาปาร์ต ผู้ปกครองชาวฝรั่งเศส ท่านจะสร้างจักรวรรดิขึ้นใหม่เพื่อล้างแค้นศัตรู และทำให้เมืองหลวงเป็นนครแห่งแสงสว่างอีกครั้งหรือไม่? จักรวรรดิใหม่ของท่านจะส่องประกายผ่านยุคสมัยแห่งประวัติศาสตร์หรือไม่?
