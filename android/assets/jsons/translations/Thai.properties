You are in my way, you must be destroyed. = ท่านขวางทางข้า ท่านต้องถูกทำลาย
As a matter of fact I too grow weary of peace. = อันที่จริงข้าก็เริ่มเบื่อสันติภาพเช่นกัน
You have somehow become my undoing! What kind of beast are you? = ท่านกลับกลายเป็นผู้ทำลายข้าได้อย่างไร! ท่านเป็นสัตว์ร้ายชนิดใดกัน?
The Gods frown upon your foolishness. = เหล่าเทพไม่พอใจความโง่เขลาของท่าน
