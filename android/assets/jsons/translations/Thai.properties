Theodora = ธีโอโดรา
It is always a shame to destroy a thing of beauty. Happily, you are not one. = การทำลายสิ่งงดงามน่าเสียดายเสมอ โชคดีที่ท่านไม่ใช่
Now darling, tantrums are most unbecoming. I shall have to teach you a lesson. = ที่รัก การอาละวาดไม่งามเลย ข้าคงต้องสั่งสอนท่าน
Like a child playing with toys you are. My people will never love you, nor suffer this indignation gracefully. = ท่านเหมือนเด็กเล่นของเล่น ประชาชนข้าจะไม่มีวันรักท่านหรือทนความอัปยศนี้อย่างสงบ
My, isn't this a pleasant surprise - what may I call you, oh mysterious stranger? I am Theodora, beloved of Byzantium. = โอ้ ช่างประหลาดใจน่ายินดี ข้าควรเรียกท่านว่าอะไร คนแปลกหน้าลึกลับ? ข้าคือธีโอโดรา ผู้เป็นที่รักแห่งไบแซนไทน์
I have heard that you adept at certain kinds of ... interactions. Show me. = ข้าได้ยินว่าท่านชำนาญการ...ปฏิสัมพันธ์บางอย่าง แสดงให้ข้าดู
Hello again. = สวัสดีอีกครั้ง
Patriarchate of Constantinople = สังฆมณฑลคอนสแตนติโนเปิล
Magnificent Empress Theodora, beloved of Byzantium and of Rome, your people salute you! With your beauty and intelligence, you rose up from actress and courtesan to the rank of the most powerful woman in the Roman Empire, as wife of Justinian I. In the late 520's AD, you helped your husband engage in spiritual and legal reforms, promugalting numerous laws to improve women's status and treatment in the empire. You also made of Constantinople the jewel of the Eastern Roman Empire with the restoration and construction of many aqueducts, bridges, and churches, its beauty culminating with the creation of the Hagia Sophia, one of the most splendid pieces of architecture in the world. = จักรพรรดินีธีโอโดราผู้งดงาม เป็นที่รักของไบแซนไทน์และโรม ประชาชนขอคารวะ! ด้วยความงามและปัญญา ท่านขึ้นจากนักแสดงและคณิกาเป็นสตรีทรงอำนาจที่สุดในจักรวรรดิโรมัน ในฐานะชายาของจัสติเนียนที่หนึ่ง ช่วงปลายทศวรรษ ค.ศ. 520 ท่านช่วยพระสวามีปฏิรูปศาสนาและกฎหมาย ออกกฎหมายมากมายยกสถานะและการปฏิบัติต่อสตรี ท่านยังทำให้คอนสแตนติโนเปิลเป็นอัญมณีแห่งโรมันตะวันออก ฟื้นฟูและสร้างสะพานส่งน้ำ สะพาน และโบสถ์มากมาย ความงามสูงสุดคือฮาเกียโซเฟีย หนึ่งในสถาปัตยกรรมงามที่สุดของโลก
Beautiful Empress,the Byzantine Empire's magnificence is intact in all memories, and ready to reborn as the new jewel of humankind. Will your new empire shine through the ages of history? = จักรพรรดินีผู้งดงาม ความโอ่อ่าของไบแซนไทน์ยังสมบูรณ์ในความทรงจำ พร้อมเกิดใหม่เป็นอัญมณีของมนุษยชาติ จักรวรรดิใหม่ของท่านจะส่องประกายผ่านยุคสมัยแห่งประวัติศาสตร์หรือไม่?
