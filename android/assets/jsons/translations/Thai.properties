O great Ramesses, Pharaoh of Egypt, bright as the Sun and mighty as the Nile! Lord of all living things, you lead the greatest of all civilizations, which has gifted the world with writing, advanced mathematics, sculpture, and architecture. Egyptian monuments and culture will continue to amaze the world for thousands of years. = รามเสสผู้ยิ่งใหญ่ ฟาโรห์แห่งอียิปต์ สว่างดุจดวงอาทิตย์และทรงพลังดุจแม่น้ำไนล์! เจ้าแห่งสรรพชีวิต ท่านนำอารยธรรมอันยิ่งใหญ่ที่สุด ผู้มอบอักษร คณิตศาสตร์ขั้นสูง ประติมากรรม และสถาปัตยกรรมแก่โลก อนุสรณ์และวัฒนธรรมอียิปต์จะทำให้โลกตื่นตาต่อไปอีกหลายพันปี
Mighty and eternal Ramesses, Egypt lasted for millenia, whereas other civilisations disappeared into dust after a few centuries. Amun-Ra blesses you again to lead Egypt and its people on the path of light. Will your new empire shine through the ages of history? = รามเสสผู้ทรงอำนาจและเป็นนิรันดร์ อียิปต์ยืนยงนับพันปี ขณะที่อารยธรรมอื่นกลายเป็นฝุ่นในไม่กี่ศตวรรษ อามุน-ราประทานพรให้ท่านอีกครั้งเพื่อนำอียิปต์และประชาชนบนเส้นทางแห่งแสงสว่าง จักรวรรดิใหม่ของท่านจะส่องประกายผ่านยุคสมัยแห่งประวัติศาสตร์หรือไม่?
