Genghis Khan = เจงกิสข่าน
You stand in the way of my armies. Let us solve this like warriors! = ท่านขวางกองทัพข้า เรามาตัดสินกันอย่างนักรบ!
No more words. Today, Mongolia charges toward your defeat. = พอคำพูดแล้ว วันนี้มองโกเลียจะบุกสู่ความพ่ายแพ้ของท่าน
You have hobbled the Mongolian clans. My respect for you nearly matches the loathing. I am waiting for my execution. = ท่านทำให้เผ่ามองโกลหมดกำลัง ความนับถือที่ข้ามีต่อท่านเกือบเท่าความเกลียด ข้ากำลังรอการประหาร
Your bravery must be commended. = ความกล้าของท่านสมควรได้รับคำชม
I am Temuujin, conqueror of cities and countries. Before me lie future Mongolian lands. Behind me is the only cavalry that matters. = ข้าคือเตมูจิน ผู้พิชิตนครและประเทศ เบื้องหน้าข้าคือดินแดนมองโกลในอนาคต เบื้องหลังข้าคือกองม้าเพียงหนึ่งเดียวที่สำคัญ
I am not always this generous, but we hope you take this rare opportunity we give you. = ข้าไม่ได้ใจกว้างเช่นนี้เสมอไป แต่เราหวังว่าท่านจะรับโอกาสหายากที่มอบให้
So what now? = แล้วจะเอาอย่างไร?
Mongol Terror = ความหวาดกลัวแห่งมองโกล
O great Temuujin, immortal leader of the mighty Mongol Empire! Your name alone was enough to make cities crumble, and the sound of the mighty Mongol cavalry to make your enemies flee! O Great Khan! Once Northern Asia united into a mighty people, producing one of the greatest armies the world has ever known, your skillful mounted archers conquered in only a few years, most of China, Eastern Asia, and even reached the gates of Europe at the West. With cunning diplomacy and brilliant warfare, you swept your enemies one after another, creating the greatest empire ever seen, reducing Roman or Greek conquests to minor achievements. = เตมูจินผู้ยิ่งใหญ่ ผู้นำอมตะแห่งจักรวรรดิมองโกลอันเกรียงไกร! เพียงชื่อของท่านก็ทำให้เมืองล่มสลาย เสียงกองม้ามองโกลก็ทำให้ศัตรูหนี! มหาข่าน! เมื่อเอเชียเหนือรวมเป็นชนชาติอันเข้มแข็ง สร้างกองทัพยิ่งใหญ่ที่สุดกองหนึ่งของโลก พลธนูม้าฝีมือดีของท่านพิชิตจีนส่วนใหญ่ เอเชียตะวันออก และไปถึงประตูยุโรปทางตะวันตกในไม่กี่ปี ด้วยการทูตแยบยลและการรบยอดเยี่ยม ท่านกวาดศัตรูทีละราย สร้างจักรวรรดิใหญ่ที่สุดจนชัยชนะโรมันหรือกรีกดูเป็นเรื่องเล็ก
Divine Temuujin, battles and conquests run through the veins of the Mongols. Are you ready to shatter the will of your enemies? Will your cavalry ride in the steppes once again and strike as lightning and thunder? Will your new empire shine through the ages of history? = เตมูจินผู้เป็นดุจเทพ การรบและการพิชิตอยู่ในสายเลือดมองโกล ท่านพร้อมทำลายเจตจำนงศัตรูหรือไม่? กองม้าจะขี่บนทุ่งหญ้าอีกครั้งและโจมตีดั่งสายฟ้าฟ้าร้องหรือไม่? จักรวรรดิใหม่ของท่านจะส่องประกายผ่านยุคสมัยแห่งประวัติศาสตร์หรือไม่?
