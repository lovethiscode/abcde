Ragusa = Ragusa

I have to do this, for the sake of progress if nothing else. You must be opposed! = ข้าต้องทำเช่นนี้ อย่างน้อยก็เพื่อความก้าวหน้า เราต้องต่อต้านท่าน!
You can see how fruitless this will be for you... right? = ท่านคงเห็นว่าสิ่งนี้จะไร้ผลสำหรับท่าน... ใช่หรือไม่?
May God grant me these last wishes - peace and prosperity for Brazil. = ขอพระเจ้าประทานคำขอสุดท้าย คือสันติและความรุ่งเรืองแก่บราซิล
Rio de Janeiro = Rio de Janeiro

Perhaps, in another world, we could have been friends... = บางทีในอีกโลกหนึ่ง เราอาจเป็นสหายกัน...
Singapore = Singapore

After thorough deliberation, Australia finds itself at a crossroads. Prepare yourself, for war is upon us. = หลังไตร่ตรองถี่ถ้วน ออสเตรเลียมาถึงทางแยก จงเตรียมตัว สงครามมาถึงเราแล้ว
We will mobilize every means of resistance to stop this transgression against our nation! = เราจะระดมทุกวิธีต่อต้านเพื่อหยุดการล่วงละเมิดชาตินี้!
The principles for which we have fought will survive longer than any nation you could ever build. = หลักการที่เราต่อสู้เพื่อจะยืนยงกว่าชาติใดที่ท่านสร้างได้
Sydney = Sydney

I will enjoy hearing your last breath as you witness the destruction of your realm! = ข้าจะรื่นรมย์กับลมหายใจสุดท้ายของท่าน ขณะที่ท่านเห็นอาณาจักรถูกทำลาย!
Why do we fight? Because Inanna demands it. Now, witness the power of the Sumerians! = เรารบทำไม? เพราะอินันนาต้องการ บัดนี้จงดูพลังของชาวสุเมเรียน!
What treachery has struck us? No, what evil? = กลอุบายใดเล่นงานเรา? ไม่สิ ความชั่วใดกัน?
Ur = Ur

In responding to the unstinting malignancy that has heretofore defined your relationship with Canada, we can have no recourse but war! = เพื่อตอบโต้ความมุ่งร้ายไม่หยุดที่ท่านมีต่อแคนาดามาจนบัดนี้ เราไม่มีทางเลือกนอกจากสงคราม!
As we can reach no peaceful resolution with you, Canada must turn, with reluctance, to war. = เมื่อหาทางยุติอย่างสันติกับท่านไม่ได้ แคนาดาจึงต้องหันสู่สงครามอย่างไม่เต็มใจ
I regret not defending my country to the last, although it was not of use. = ข้าเสียใจที่ไม่ได้ปกป้องประเทศจนถึงที่สุด แม้จะไม่ช่วยอะไร
Vancouver = Vancouver

You have revealed your purposes a bit too early, my friend... = ท่านเผยจุดประสงค์เร็วไปหน่อย สหาย...
A wrong calculation, on my part. = เป็นการคำนวณผิดของข้าเอง
Venice = Venice

They will write songs of this.... pray that they shall be in your favor. = พวกเขาจะเขียนเพลงถึงเรื่องนี้... จงภาวนาให้เป็นเพลงสรรเสริญท่าน
Antwerp = Antwerp

May the Heavens forgive you for inflicting this humiliation to our people. = ขอสวรรค์ให้อภัยที่ท่านทำให้ประชาชนเราอับอาย
Zanzibar = Zanzibar

How could we fall to the likes of you?! = เราพ่ายคนอย่างท่านได้อย่างไร?!
Almaty = Almaty

Let's have a nice little War, shall we? = เรามาทำสงครามเล็ก ๆ สนุก ๆ กันดีไหม?
If you need your nose bloodied, we'll happily serve. = ถ้าท่านอยากเลือดกำเดาไหล เรายินดีช่วย
The serbian guerilla will never stop haunting you! = กองโจรเซอร์เบียจะไม่มีวันหยุดตามหลอกหลอนท่าน!
Belgrade = Belgrade

Budapest = Budapest

War lingers in our hearts. Why carry on with a false peace? = สงครามค้างอยู่ในใจ ทำไมต้องรักษาสันติภาพจอมปลอม?
You gormless radger! You'll dine on your own teeth before you set foot in Ireland! = ไอ้คนบ้าไร้สมอง! ท่านจะได้กินฟันตัวเองก่อนเหยียบไอร์แลนด์!
A lonely wind blows through the highlands today. A dirge for Ireland. Can you hear it? = วันนี้ลมเดียวดายพัดผ่านที่ราบสูง เป็นเพลงไว้อาลัยไอร์แลนด์ ท่านได้ยินหรือไม่?
Dublin = Dublin

You shall stain this land no longer with your vileness! To arms, my countrymen - we ride to war! = ความชั่วของท่านจะไม่เปื้อนแผ่นดินนี้อีก! หยิบอาวุธ เพื่อนร่วมชาติ เราจะขี่ม้าไปทำศึก!
Traitorous man! The Celtic peoples will not stand for such wanton abuse and slander - I shall have your head! = คนทรยศ! ชาวเคลต์จะไม่ทนการข่มเหงและใส่ร้ายตามอำเภอใจ ข้าจะเอาหัวท่าน!
Vile ruler, know that you 'won' this war in name only! = ผู้ปกครองชั่ว จงรู้ว่าท่าน ‘ชนะ’ สงครามนี้เพียงในนาม!
Edinburgh = Edinburgh

So this is how it feels to die... = ความตายรู้สึกอย่างนี้เอง...
Hanoi = Hanoi

Do you really think you can walk over us so easily? I will not let it happen. Not to Kongo - not to my people! = ท่านคิดจริงหรือว่าจะเหยียบย่ำเราง่าย ๆ? ข้าไม่ยอมให้เกิดขึ้น ไม่ใช่กับคองโก ไม่ใช่กับประชาชนข้า!
We are no strangers to war. You have strayed from the right path, and now we will correct it. = เราไม่แปลกหน้าต่อสงคราม ท่านหลงจากทางที่ถูก และบัดนี้เราจะทำให้ถูกต้อง
You are nothing but a glorified barbarian. Cruel, and ruthless. = ท่านก็แค่คนเถื่อนที่ถูกยกย่อง โหดร้ายและไร้ปรานี
M'Banza-Kongo = M'Banza-Kongo

What a fine battle! Sidon is willing to serve you! = ช่างเป็นศึกที่ดี! ไซดอนยินดีรับใช้ท่าน!
Sidon = Sidon

We never fully trusted you from the start. = เราไม่เคยไว้ใจท่านเต็มที่ตั้งแต่ต้น
Tyre = Tyre

We don't like your face. To arms! = เราไม่ชอบหน้าท่าน หยิบอาวุธ!
You will see you have just bitten off more than you can chew. = ท่านจะรู้ว่ารับเรื่องเกินกำลังไปแล้ว
This ship may sink, but our spirits will linger. = เรือลำนี้อาจจม แต่จิตวิญญาณเราจะยังอยู่
Valletta = Valletta


