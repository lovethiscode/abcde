#################### Lines from Global Tutorials ####################

Welcome to Unciv!\nBecause this is a complex game, there are basic tasks to help familiarize you with the game.\nThese are completely optional, and you're welcome to explore the game on your own! = ยินดีต้อนรับสู่ Unciv!\nเกมนี้ซับซ้อน จึงมีงานพื้นฐานช่วยให้คุ้นเคยกับเกม\nงานเหล่านี้เป็นทางเลือกทั้งหมด และคุณสำรวจเกมด้วยตัวเองได้ตามสบาย!

Welcome to Unciv! = ยินดีต้อนรับสู่ Unciv!
Because this is a complex game, there are some tutorials to help familiarize you with it. These can be disabled in the Options -> Display menu, but please hang on if you're new here! = เกมนี้ซับซ้อน จึงมีบทสอนช่วยให้คุ้นเคย ปิดได้ในเมนูตัวเลือก -> การแสดงผล แต่ถ้าเพิ่งเริ่มเล่น โปรดลองอ่านก่อน!
Your first mission is to found your capital city. This is actually an important task because your capital city will probably be your most prosperous. Many game bonuses apply only to your capital city, and it will be the center of your empire. = ภารกิจแรกคือตั้งเมืองหลวง นี่เป็นงานสำคัญ เพราะเมืองหลวงน่าจะเป็นเมืองที่รุ่งเรืองที่สุด โบนัสหลายอย่างใช้กับเมืองหลวงเท่านั้น และจะเป็นศูนย์กลางจักรวรรดิ
How do you know a city location is appropriate? Luckily, the game has already chosen a good location for you. You can settle in this place, or maybe move a turn to found on a Hill (for Production and defence) or next to a Mountain (to gain access to the Observatory building later on). = จะรู้ได้อย่างไรว่าที่ตั้งเมืองเหมาะสม? โชคดีที่เกมเลือกที่ดีไว้แล้ว คุณตั้งเมืองที่นี่ได้ หรืออาจย้ายหนึ่งเทิร์นไปตั้งบนเนินเขาเพื่อการผลิตและการป้องกัน หรือข้างภูเขาเพื่อสร้างหอดูดาวได้ภายหลัง
You'll likely want more cities later on. For these cities, you must go and find a good place. Looking for and founding on or near Luxury resources is a good rule of thumb. = ต่อไปคุณคงอยากมีเมืองเพิ่ม ต้องออกไปหาที่เหมาะสม หลักง่าย ๆ คือมองหาทรัพยากรฟุ่มเฟือยแล้วตั้งเมืองบนหรือใกล้ทรัพยากรนั้น
Luxury resources are tiles that have things like Gems, Cotton, or Silk (indicated by a yellow background of the resource icon). These resources make your civilization happy. You should also keep an eye out for resources needed to build units, such as Iron. Cities cannot be built within 3 tiles of existing cities, which is another thing to keep in mind! = ทรัพยากรฟุ่มเฟือยคือช่องที่มีสิ่งอย่างอัญมณี ฝ้าย หรือไหม โดยไอคอนทรัพยากรมีพื้นหลังสีเหลือง ทรัพยากรเหล่านี้เพิ่มความสุขแก่อารยธรรม และควรมองหาทรัพยากรสร้างยูนิต เช่น เหล็กด้วย อย่าลืมว่าตั้งเมืองภายในระยะ 3 ช่องจากเมืองที่มีอยู่ไม่ได้!
Cities will house Citizens, which can work tiles up to 3 tiles away from the city. This means you don’t have to settle cities right on or next to good tiles. Let’s say, for example, that you want access to some Iron – but the resource is in a desert area. You don’t have to settle your city in the desert. You can settle a few tiles away in more prosperous lands. Your city will grow and eventually gain access to the resource. You only need to settle right on top of resources if you need them immediately. = เมืองมีพลเมืองที่ทำงานในช่องห่างจากเมืองได้ถึง 3 ช่อง จึงไม่ต้องตั้งเมืองบนหรือชิดช่องดีเสมอไป เช่น หากอยากได้เหล็กแต่ทรัพยากรอยู่ในทะเลทราย ก็ไม่ต้องตั้งเมืองในทะเลทราย ตั้งห่างออกมาบนดินอุดมสักสองสามช่องได้ เมืองจะขยายจนเข้าถึงทรัพยากรในที่สุด ต้องตั้งทับทรัพยากรเฉพาะเมื่อต้องการทันทีเท่านั้น
The first thing coming out of your city depends on the strategy you want to follow, but the 'classic' build order is to build first two Scouts, then a Shrine, and three Settlers, and adopt Tradition, to explore the map quickly (Scouts ignore terrain cost), and to get an early Pantheon (if you're playing with religion enabled). = สิ่งแรกที่สร้างขึ้นอยู่กับกลยุทธ์ แต่ลำดับ ‘คลาสสิก’ คือทหารสอดแนมสองยูนิต ตามด้วยศาลเจ้าและผู้ตั้งถิ่นฐานสามยูนิต พร้อมรับประเพณี เพื่อสำรวจแผนที่เร็วเพราะทหารสอดแนมไม่คิดค่าเคลื่อนที่ตามภูมิประเทศ และได้ความเชื่อเทพเจ้ากลุ่มแรกเร็วหากเปิดศาสนา
But feel free to experiment with your own build orders! = แต่ลองลำดับสร้างของตัวเองได้ตามสบาย!

In your first couple of turns, you will have very little options, but as your civilization grows, so do the number of things requiring your attention. = สองสามเทิร์นแรกมีตัวเลือกน้อย แต่เมื่ออารยธรรมเติบโต สิ่งที่ต้องใส่ใจก็เพิ่มขึ้น

Culture and Policies = วัฒนธรรมและนโยบาย
Each turn, the culture you gain from all your cities is added to your Civilization's culture.\nWhen you have enough culture, you may pick a Social Policy, each one giving you a certain bonus. = ทุกเทิร์น วัฒนธรรมที่ได้จากทุกเมืองจะรวมเป็นวัฒนธรรมอารยธรรม\nเมื่อมีวัฒนธรรมพอ คุณเลือกนโยบายสังคมได้ แต่ละนโยบายให้โบนัสอย่างหนึ่ง
The policies are organized into branches, with each branch providing a bonus ability when all policies in the branch have been adopted. = นโยบายแบ่งเป็นสาขา เมื่อรับทุกนโยบายในสาขาแล้วจะได้ความสามารถโบนัส
With each policy adopted, and with each city built,\n  the cost of adopting another policy rises - so choose wisely! = ทุกครั้งที่รับนโยบายและสร้างเมือง\n  ค่ารับนโยบายถัดไปจะเพิ่มขึ้น จงเลือกอย่างรอบคอบ!

City Expansion = การขยายเมือง
Once a city has gathered enough Culture, it will expand into a neighboring tile.\nYou have no control over the tile it will expand into, but tiles with resources and higher yields are prioritized. = เมื่อเมืองสะสมวัฒนธรรมพอ จะขยายไปยังช่องข้างเคียง\nคุณควบคุมไม่ได้ว่าจะขยายช่องใด แต่ช่องที่มีทรัพยากรและผลผลิตสูงจะได้รับความสำคัญก่อน
Each additional tile will require more culture, but generally your first cities will eventually expand to a wide tile range. = แต่ละช่องเพิ่มต้องใช้วัฒนธรรมมากขึ้น แต่โดยทั่วไปเมืองแรก ๆ จะขยายครอบคลุมพื้นที่กว้างในที่สุด
Although your city will keep expanding forever, your citizens can only work 3 tiles away from city center.\nThis should be taken into account when placing new cities. = แม้เมืองจะขยายต่อไปได้ไม่สิ้นสุด พลเมืองทำงานได้ไกลเพียง 3 ช่องจากศูนย์กลางเมือง\nควรคำนึงถึงเรื่องนี้เมื่อตั้งเมืองใหม่

Food is the resource fundamental to your Cities', and as a result Nation's, population and health. = อาหารเป็นทรัพยากรพื้นฐานต่อประชากรและสุขภาวะของเมือง และส่งผลถึงทั้งชาติ
Every Citizen in each City consumes Food per turn. Any left over is considered Growth and is stored in the City Center. Once enough accumulates, the City Grows and a new Citizen is added. = พลเมืองทุกคนในแต่ละเมืองบริโภคอาหารทุกเทิร์น ส่วนที่เหลือถือเป็นการเติบโตและเก็บไว้ในศูนย์กลางเมือง เมื่อสะสมพอ เมืองจะโตและมีพลเมืองใหม่
Initially your main source of Food is the City Center itself and working a surrounding tile with a Citizen. You can increase how much is generated by gaining more Citizens to work more tiles, improving the tiles so that they yield more Food, and eventually Buildings and Policies. = เริ่มแรก แหล่งอาหารหลักคือศูนย์กลางเมืองและพลเมืองทำงานในช่องโดยรอบ เพิ่มอาหารได้ด้วยประชากรที่ทำงานหลายช่องขึ้น ปรับปรุงช่องให้ได้อาหารมากขึ้น และต่อมาด้วยอาคารกับนโยบาย
Since a city's number of Citizens, or Population, determines how many tiles a City can work, Food is often the most important Resource. = เพราะจำนวนพลเมืองหรือประชากรกำหนดจำนวนช่องที่เมืองทำงานได้ อาหารจึงมักเป็นทรัพยากรสำคัญที่สุด

Production is the resource that lets a City Center build new things. = การผลิตคือทรัพยากรที่ทำให้ศูนย์กลางเมืองสร้างสิ่งใหม่ได้
This can be new Buildings that are added to the City Center, or new Units that can go out across the World Map to advance your Nation's goals. = อาจเป็นอาคารใหม่ที่เพิ่มในศูนย์กลางเมือง หรือยูนิตใหม่ที่ออกไปทั่วแผนที่โลกเพื่อบรรลุเป้าหมายของชาติ
Everything you can build has a Production Cost. Every turn each City generates a certain amount of Production and puts it towards whatever is at the top of the Build Queue. Once the total cost is collected, the Building or Unit is built! = ทุกสิ่งที่สร้างได้มีค่าการผลิต แต่ละเทิร์นแต่ละเมืองสร้างการผลิตจำนวนหนึ่งให้สิ่งที่อยู่บนสุดของคิว เมื่อสะสมครบค่า อาคารหรือยูนิตก็สร้างเสร็จ!
Any excess Production after something is built is overflowed to the next thing the City builds. Up to it's total Production Cost. = การผลิตส่วนเกินหลังสร้างเสร็จจะส่งต่อไปยังสิ่งถัดไปที่เมืองสร้าง โดยสูงสุดเท่าค่าการผลิตทั้งหมดของสิ่งถัดไปนั้น
Since this determines how quickly you can build more stuff, your Nation's Production Capacity is crucial to it's advancement and survival. = เพราะการผลิตกำหนดความเร็วในการสร้าง กำลังผลิตของชาติจึงสำคัญต่อความก้าวหน้าและการอยู่รอด

⍾Science is the resource that unlocks new and exciting Technologies for your Nation. = ⍾วิทยาศาสตร์เป็นทรัพยากรที่ปลดล็อกเทคโนโลยีใหม่อันน่าตื่นเต้นให้ประเทศของคุณ
Once you've Founded your Capital, you'll be prompted to Pick a Technology to Research. = เมื่อก่อตั้งเมืองหลวงแล้ว เกมจะให้คุณเลือกเทคโนโลยีที่จะวิจัย
Every Technology costs an amount of ⍾Science. Every turn the ⍾Science your Nation produces is paid towards Researching your chosen Technology. = เทคโนโลยีแต่ละอย่างต้องใช้ ⍾วิทยาศาสตร์จำนวนหนึ่ง ในแต่ละเทิร์น ⍾วิทยาศาสตร์ที่ประเทศผลิตได้จะนำไปใช้วิจัยเทคโนโลยีที่เลือก
Once a Technology has it's cost fully paid, you unlock the benefits for your Nation! This could be new Units, Buildings, or other advantages. Any surplus will overflow into the next Technology you pick to Research. = เมื่อสะสมครบตามค่าของเทคโนโลยี ประเทศของคุณจะได้รับประโยชน์ที่ปลดล็อก! อาจเป็นยูนิต สิ่งปลูกสร้าง หรือข้อได้เปรียบอื่น ๆ ส่วนที่เกินจะนำไปใช้กับเทคโนโลยีถัดไปที่เลือกวิจัย
Researching a Technology in the next Era will advance you into that Era and trigger a notification to other Nations about how amazing you are! = การวิจัยเทคโนโลยีในยุคถัดไปจะพาคุณเข้าสู่ยุคนั้น และแจ้งให้ประเทศอื่นรู้ถึงความก้าวหน้าของคุณ!
Since new Technologies tend to give access to better Units, Buildings, and even unlock powerful new Policies, staying ahead of the competition is one of the best ways to secure your Victory! = เทคโนโลยีใหม่มักเปิดให้ใช้ยูนิตและสิ่งปลูกสร้างที่ดีขึ้น รวมถึงปลดล็อกนโยบายใหม่ที่ทรงพลัง การวิจัยให้ล้ำหน้าคู่แข่งจึงเป็นหนทางสำคัญสู่ชัยชนะ!

Ah Gold. The Universal Medium of Exchange. Everyone loves Gold! They say it can't buy Happiness, but nuclear submarines are almost as good. = ทองคำ สื่อกลางการแลกเปลี่ยนที่ทุกคนยอมรับ ใคร ๆ ก็รักทองคำ! ว่ากันว่าซื้อความสุขไม่ได้ แต่เรือดำน้ำนิวเคลียร์ก็ใกล้เคียงอยู่นะ
You can earn more Gold from Tiles, Resources, Improvements, and eventually Buildings, Specialists, and Trade Routes. Ancient Ruins, meeting new City-States, and Pillaging are also great sources of Gold. During a Golden Age every Tile that already yields Gold will yield an additional Gold! = คุณหาเงินทองได้มากขึ้นจากช่องแผนที่ ทรัพยากร สิ่งปรับปรุง และในภายหลังจากสิ่งปลูกสร้าง ผู้เชี่ยวชาญ และเส้นทางการค้า ซากโบราณ การพบนครรัฐใหม่ และการปล้นสะดมก็เป็นแหล่งทองคำที่ดี ในยุคทอง ทุกช่องที่ให้ทองคำอยู่แล้วจะให้ทองคำเพิ่มอีก!
Gold is how you pay for Building Maintenance, Transportation Upkeep, and Unit Upkeep. If you run out of Gold, first you'll receive penalties to your ⍾Science production, then eventually your Units will start Disbanding as you can't pay their upkeep. = ทองคำใช้จ่ายค่าบำรุงรักษาสิ่งปลูกสร้าง เส้นทางขนส่ง และยูนิต หากทองคำหมด คุณจะถูกลดการผลิต ⍾วิทยาศาสตร์ก่อน และท้ายที่สุดยูนิตจะเริ่มถูกยุบเพราะไม่สามารถจ่ายค่าบำรุงรักษาได้
Gold can be used to Buy Buildings and Units, helping bring up a new City or quickly build an Army. It can also buy Tiles to add to your City. It's also used to Upgrade your units from their older, obsolete forms to new, stronger versions. And investing it into a Research Agreement is a great way to convert it into ⍾Science. = ทองคำใช้ซื้อสิ่งปลูกสร้างและยูนิต ช่วยพัฒนาเมืองใหม่หรือจัดตั้งกองทัพได้อย่างรวดเร็ว ใช้ซื้อช่องแผนที่ให้เมือง และอัปเกรดยูนิตที่ล้าสมัยให้แข็งแกร่งขึ้นได้ การลงทุนในข้อตกลงวิจัยก็เป็นวิธีที่ดีในการเปลี่ยนทองคำเป็น ⍾วิทยาศาสตร์
Gold is also very valuable in Diplomacy. You can directly Gift Gold to City-States to gain their favor. Use it to balance a Trade Deal with other Nations. Or demand every last drop after a successful war and your enemy sues for peace. = ทองคำยังสำคัญต่อการทูต คุณมอบทองคำให้นครรัฐเพื่อสร้างไมตรี ใช้ปรับข้อเสนอแลกเปลี่ยนกับประเทศอื่นให้สมดุล หรือเรียกทองคำทั้งหมดจากศัตรูที่ขอสันติภาพหลังคุณชนะสงครามได้
Ironically, some may consider Gold to be one of the less important Resources. But it's flexible nature and importance to keep your Nation running makes it a precious thing to pay attention to. After all, everyone loves Gold. = น่าแปลกที่บางคนอาจมองว่าทองคำสำคัญน้อยกว่าทรัพยากรอื่น แต่ความยืดหยุ่นและบทบาทในการค้ำจุนประเทศทำให้มันมีค่าควรใส่ใจ เพราะใคร ๆ ก็รักทองคำ
Not to be confused with the Resource of the same name, Gold Ore = อย่าสับสนกับทรัพยากรชื่อคล้ายกัน คือแร่ทองคำ
Trade Route = เส้นทางการค้า
See also: [param] = ดูเพิ่มเติม: [param]
Research Agreements = ข้อตกลงวิจัย

As cities grow in size and influence, you have to deal with a happiness mechanic that is no longer tied to each individual city.\nInstead, your entire empire shares the same level of satisfaction.\nAs your cities grow in population you’ll find that it is more and more difficult to keep your empire happy. = เมื่อเมืองเติบโตทั้งขนาดและอิทธิพล คุณจะต้องจัดการความสุขที่ไม่ได้แยกตามแต่ละเมืองอีกต่อไป\nทั้งจักรวรรดิจะใช้ระดับความพึงพอใจร่วมกัน\nเมื่อประชากรเพิ่มขึ้น การรักษาความสุขของจักรวรรดิก็จะยากขึ้นเรื่อย ๆ
In addition, you can’t even build any city improvements that increase happiness until you’ve done the appropriate research.\nIf your empire’s happiness ever goes below zero the growth rate of your cities will be hurt.\nIf your empire becomes severely unhappy (as indicated by the smiley-face icon at the top of the interface)\n  your armies will have a big penalty slapped on to their overall combat effectiveness. = นอกจากนี้ คุณยังสร้างสิ่งปรับปรุงเมืองที่เพิ่มความสุขไม่ได้จนกว่าจะวิจัยเทคโนโลยีที่เกี่ยวข้อง\nหากความสุขของจักรวรรดิต่ำกว่าศูนย์ อัตราการเติบโตของเมืองจะลดลง\nหากจักรวรรดิไม่มีความสุขอย่างรุนแรง (ดูได้จากไอคอนใบหน้าด้านบนของหน้าจอ)\n  ประสิทธิภาพการรบโดยรวมของกองทัพจะถูกลดลงอย่างมาก
This means that it is very difficult to expand quickly in Unciv.\nIt isn’t impossible, but as a new player you probably shouldn't do it.\nSo what should you do? Chill out, scout, and improve the land that you do have by building Workers.\nOnly build new cities once you have found a spot that you believe is appropriate. = นั่นหมายความว่าการขยายดินแดนอย่างรวดเร็วใน Unciv เป็นเรื่องยากมาก\nแม้จะทำได้ แต่ผู้เล่นใหม่ยังไม่ควรรีบทำ\nแล้วควรทำอย่างไร? ค่อย ๆ สำรวจ และสร้างคนงานมาพัฒนาที่ดินที่มีอยู่\nสร้างเมืองใหม่เมื่อพบทำเลที่เห็นว่าเหมาะสมแล้วเท่านั้น

 # Requires translation!
Unhappiness = ความทุกข์
It seems that your citizens are unhappy!\nWhile unhappy, your civilization will suffer many detrimental effects, increasing in severity as unhappiness gets higher. = ดูเหมือนว่าพลเมืองของคุณไม่มีความสุข!\nอารยธรรมจะได้รับผลเสียหลายอย่าง และยิ่งไม่มีความสุขมาก ผลเสียก็ยิ่งรุนแรง
Unhappiness has two main causes: Population and cities.\n  Each city causes 3 unhappiness, and each population, 1 = ความทุกข์มีสาเหตุหลักสองอย่าง คือประชากรและเมือง\n  แต่ละเมืองก่อความทุกข์ 3 หน่วย และประชากรแต่ละคนก่อความทุกข์ 1 หน่วย
There are 2 main ways to combat unhappiness:\n  by building happiness buildings for your population\n  or by having improved luxury resources within your borders. = มีวิธีหลัก 2 วิธีในการลดความทุกข์:\n  สร้างสิ่งปลูกสร้างที่เพิ่มความสุขให้ประชากร\n  หรือปรับปรุงทรัพยากรฟุ่มเฟือยภายในพรมแดน

You have entered a Golden Age!\nGolden age points are accumulated each turn by the total happiness \n  of your civilization\nWhen in a golden age, culture and production generation increases +20%,\n  and every tile already providing at least one gold will provide an extra gold. = คุณเข้าสู่ยุคทองแล้ว!\nคะแนนยุคทองสะสมในแต่ละเทิร์นจากความสุขทั้งหมด\n  ของอารยธรรม\nในยุคทอง การผลิตวัฒนธรรมและการผลิตเพิ่มขึ้น +20%\n  และทุกช่องที่ให้ทองคำอย่างน้อยหนึ่งหน่วยอยู่แล้วจะให้เพิ่มอีกหนึ่งหน่วย

Roads and Railroads = ถนนและทางรถไฟ
Roads reduce the Movement Points required to move between two tiles connected by Roads. = ถนนช่วยลดคะแนนเคลื่อนที่ที่ใช้เดินระหว่างช่องที่เชื่อมด้วยถนน
Railroads improve this reduction even more! = ทางรถไฟช่วยลดคะแนนที่ต้องใช้ได้มากยิ่งขึ้น!
This greatly improves the speed you can get Units around the map. = จึงช่วยให้ยูนิตเดินทางทั่วแผนที่ได้รวดเร็วขึ้นมาก
Until you research the technology that removes it, Roads do not cross Rivers = ถนนจะยังไม่เชื่อมข้ามแม่น้ำจนกว่าคุณจะวิจัยเทคโนโลยีที่ยกเลิกข้อจำกัดนี้
Connecting your cities to the capital by Roads and/or Railroads will generate Gold via the Trade Route. = การเชื่อมเมืองกับเมืองหลวงด้วยถนนและ/หรือทางรถไฟจะสร้างทองคำผ่านเส้นทางการค้า
However, since each Road and Railroad have a Maintenance Cost, it may be more economical to wait until the cities grow and only place where needed. = แต่ถนนและทางรถไฟทุกช่องมีค่าบำรุงรักษา การรอให้เมืองเติบโตแล้วค่อยสร้างเฉพาะที่จำเป็นจึงอาจคุ้มค่ากว่า

Connecting your cities to the capital by Roads and/or Railroads will generate Gold via the Trade Route. You earn more Gold the more Population the City and your Capital has. = การเชื่อมเมืองกับเมืองหลวงด้วยถนนและ/หรือทางรถไฟจะสร้างทองคำผ่านเส้นทางการค้า ยิ่งเมืองนั้นและเมืองหลวงมีประชากรมาก ก็ยิ่งได้ทองคำมาก
Note that each road costs 1 Gold Maintenance per turn, and each Railroad costs 2 Gold, so it may be more economical to wait until the cities grow! = โปรดจำไว้ว่า ถนนแต่ละช่องมีค่าบำรุงรักษา 1 ทองคำต่อเทิร์น และทางรถไฟแต่ละช่องใช้ 2 ทองคำ การรอให้เมืองเติบโตก่อนจึงอาจประหยัดกว่า!
Railroads connecting a city to the Capital also provide a 25% Production Boost to the City, but not the Capital. = ทางรถไฟที่เชื่อมเมืองกับเมืองหลวงยังเพิ่มการผลิตให้เมืองนั้น 25% แต่ไม่เพิ่มให้เมืองหลวง
Trade Routes are also connected over Water via certain buildings like the Harbor. As long as there is a chain that can reach the Capital, there's a Trade Route. Look for this symbol in Yellow below the City Name to mean you have an active Trade Route to your Capital. = สิ่งปลูกสร้างบางชนิด เช่น ท่าเรือ ยังเชื่อมเส้นทางการค้าทางน้ำได้ ตราบใดที่มีเครือข่ายเชื่อมไปถึงเมืองหลวง ก็มีเส้นทางการค้า มองหาสัญลักษณ์นี้เป็นสีเหลืองใต้ชื่อเมืองเพื่อยืนยันว่าเชื่อมกับเมืองหลวงแล้ว
Trade Routes can get broken either by Blockades or by Removing/Pillaging the connecting Road/Railroad chain. = เส้นทางการค้าอาจขาดจากการปิดล้อม หรือการรื้อถอน/ปล้นสะดมถนนหรือทางรถไฟที่เชื่อมต่อกัน
City Blockade = การปิดล้อมเมือง

Once you’ve settled 3-4 cities and build universities, you’re probably already 100 to 150 turns into the game.\nNow is a good time to start thinking about how, exactly, you want to win – if you haven’t already. = เมื่อคุณตั้งเมือง 3-4 เมืองและสร้างมหาวิทยาลัยแล้ว เกมน่าจะผ่านไปประมาณ 100 ถึง 150 เทิร์น\nหากยังไม่ได้คิด ตอนนี้เหมาะที่จะเริ่มเลือกว่าคุณต้องการชนะด้วยวิธีใด
There are four ways to win in Unciv. They are:\n - Cultural Victory: Complete 5 Social Policy Trees and build the Utopia Project\n - Domination Victory: Conquer the original capital of all other Major civs\n - Science Victory: Be the first to construct a Spaceship\n - Diplomatic Victory: Build the United Nations and win the vote = Unciv มีหนทางสู่ชัยชนะสี่แบบ:\n - ชัยชนะทางวัฒนธรรม: รับนโยบายสังคมครบ 5 สาย และสร้างโครงการยูโทเปีย\n - ชัยชนะด้วยการครองโลก: ยึดเมืองหลวงดั้งเดิมของอารยธรรมหลักอื่นทุกแห่ง\n - ชัยชนะทางวิทยาศาสตร์: สร้างยานอวกาศเป็นรายแรก\n - ชัยชนะทางการทูต: สร้างองค์การสหประชาชาติและชนะการลงคะแนน
So to sum it up, these are the basics of Unciv – Found a prosperous first city, expand slowly to manage happiness, and set yourself up for the victory condition you wish to pursue.\nObviously, there is much more to it than that, but it is important not to jump into the deep end before you know how to swim. = หลักพื้นฐานของ Unciv จึงเป็นการก่อตั้งเมืองแรกให้รุ่งเรือง ค่อย ๆ ขยายเพื่อควบคุมความสุข และเตรียมอารยธรรมให้พร้อมสำหรับชัยชนะที่ต้องการ\nแน่นอนว่ายังมีรายละเอียดอีกมาก แต่ควรเรียนรู้การว่ายน้ำก่อนกระโดดลงน้ำลึก

Enemy City = เมืองศัตรู
Cities can be conquered by reducing their health to 1, and entering the city with a melee unit.\nSince cities heal each turn, it is best to attack with ranged units and use your melee units to defend them until the city has been defeated! = คุณยึดเมืองได้โดยลดพลังชีวิตให้เหลือ 1 แล้วนำยูนิตโจมตีระยะประชิดเข้าเมือง\nเนื่องจากเมืองฟื้นพลังชีวิตทุกเทิร์น ควรใช้ยูนิตโจมตีระยะไกลยิง และใช้ยูนิตระยะประชิดคุ้มกันจนเมืองพ่ายแพ้!

Luxury Resource = ทรัพยากรฟุ่มเฟือย
Luxury resources within your domain and with their specific improvement are connected to your trade network.\nEach unique Luxury resource you have adds 5 happiness to your civilization, but extra resources of the same type don't add anything, so use them for trading with other civilizations! = ทรัพยากรฟุ่มเฟือยในดินแดนที่มีสิ่งปรับปรุงตรงชนิดจะเชื่อมเข้ากับเครือข่ายการค้า\nทรัพยากรฟุ่มเฟือยแต่ละชนิดที่ไม่ซ้ำกันเพิ่มความสุขให้อารยธรรม 5 หน่วย แต่ชนิดเดียวกันที่มีเพิ่มจะไม่เพิ่มความสุข จึงควรนำไปแลกเปลี่ยนกับอารยธรรมอื่น!

Strategic Resource = ทรัพยากรยุทธศาสตร์
Strategic resources within your domain and with their specific improvement are connected to your trade network.\nStrategic resources allow you to train units and construct buildings that require those specific resources, for example the Horseman requires Horses. = ทรัพยากรยุทธศาสตร์ในดินแดนที่มีสิ่งปรับปรุงตรงชนิดจะเชื่อมเข้ากับเครือข่ายการค้า\nทรัพยากรเหล่านี้ใช้ฝึกยูนิตและสร้างสิ่งปลูกสร้างที่ต้องใช้ทรัพยากรชนิดนั้น เช่น ทหารม้าต้องใช้ม้า
Unlike Luxury Resources, each Strategic Resource on the map provides more than one of that resource.\nThe top bar keeps count of how many unused strategic resources you own.\nA full drilldown of resources is available in the Resources tab in the Overview screen. = ทรัพยากรยุทธศาสตร์แต่ละแหล่งบนแผนที่ให้ทรัพยากรมากกว่าหนึ่งหน่วย ต่างจากทรัพยากรฟุ่มเฟือย\nแถบด้านบนแสดงจำนวนทรัพยากรยุทธศาสตร์ที่ยังไม่ได้ใช้\nดูรายละเอียดทรัพยากรทั้งหมดได้ในแท็บทรัพยากรของหน้าภาพรวม

The city can no longer put up any resistance!\nHowever, to conquer it, you must enter the city with a melee unit = เมืองนี้ไม่สามารถต้านทานได้อีกแล้ว!\nแต่หากต้องการยึดเมือง คุณต้องนำยูนิตโจมตีระยะประชิดเข้าไป

After Conquering = หลังยึดเมือง
When conquering a city, you can choose to liberate, annex, puppet, or raze the city. = When conquering a city, you can choose to liberate, annex, puppet, or raze the city. (Translation update needed!)
\nLiberating the city will return it to its original owner, giving you a massive diplomatic boost with them!\n\nAnnexing the city will give you full control over it, but also increase the citizens' unhappiness to 2x!\nThis can be mitigated by building a courthouse in the city, returning the citizen's unhappiness to normal.\n\nPuppeting the city will mean that you have no control on the city's production.\nThe city will not increase your tech or policy cost.\nA puppeted city can be annexed at any time, but annexed cities cannot be returned to a puppeted state!\n\nRazing the city will lower its population by 1 each turn until the city is destroyed!\nYou cannot raze a city that is either the starting capital of a civilization or the holy city of a religion. = \nการปลดปล่อยเมืองจะคืนเมืองให้เจ้าของเดิม และเพิ่มความสัมพันธ์ทางการทูตกับเจ้าของเดิมอย่างมาก!\n\nการผนวกเมืองทำให้คุณควบคุมได้เต็มที่ แต่ความทุกข์ของพลเมืองจะเพิ่มเป็น 2 เท่า!\nคุณลดผลนี้ได้โดยสร้างศาลในเมือง เพื่อให้ความทุกข์ของพลเมืองกลับสู่ระดับปกติ\n\nการตั้งเมืองหุ่นเชิดทำให้คุณควบคุมการผลิตของเมืองไม่ได้\nเมืองจะไม่เพิ่มค่าวิจัยเทคโนโลยีหรือค่านโยบาย\nคุณผนวกเมืองหุ่นเชิดได้ทุกเมื่อ แต่เปลี่ยนเมืองที่ผนวกแล้วกลับเป็นเมืองหุ่นเชิดไม่ได้!\n\nการเผาทำลายเมืองจะลดประชากรลง 1 คนทุกเทิร์นจนเมืองถูกทำลาย!\nคุณเผาทำลายเมืองหลวงดั้งเดิมของอารยธรรมหรือเมืองศักดิ์สิทธิ์ของศาสนาไม่ได้

You have encountered a barbarian unit!\nBarbarians attack everyone indiscriminately, so don't let your \n  civilian units go near them, and be careful of your scout! = คุณพบยูนิตอนารยชนแล้ว!\nอนารยชนโจมตีทุกฝ่ายอย่างไม่เลือกหน้า อย่าให้\n  ยูนิตพลเรือนเข้าใกล้ และระวังหน่วยลาดตระเวนของคุณด้วย!

You have encountered another civilization!\nOther civilizations start out peaceful, and you can trade with them,\n  but they may choose to declare war on you later on = คุณพบอารยธรรมอื่นแล้ว!\nในตอนแรกอารยธรรมอื่นจะอยู่ร่วมอย่างสันติและคุณแลกเปลี่ยนกับพวกเขาได้\n  แต่ในภายหลังพวกเขาอาจเลือกประกาศสงครามกับคุณ

Injured Units = ยูนิตบาดเจ็บ
Injured units deal less damage, but recover after turns that they have been inactive.\nUnits heal 10 health per turn in enemy territory or neutral land,\n  20 inside your territory and 25 in your cities. = ยูนิตบาดเจ็บสร้างความเสียหายได้น้อยลง แต่จะฟื้นตัวหลังเทิร์นที่ไม่ได้ทำอะไร\nยูนิตฟื้นพลังชีวิต 10 ต่อเทิร์นในดินแดนศัตรูหรือดินแดนเป็นกลาง\n  20 ในดินแดนของคุณ และ 25 ในเมืองของคุณ

Workers = คนงาน
Workers are vital to your cities' growth, since only they can construct improvements on tiles.\nImprovements raise the yield of your tiles, allowing your city to produce more and grow faster while working the same amount of tiles! = คนงานจำเป็นต่อการเติบโตของเมือง เพราะมีเพียงคนงานที่สร้างสิ่งปรับปรุงบนช่องแผนที่ได้\nสิ่งปรับปรุงเพิ่มผลผลิตของช่อง ทำให้เมืองผลิตได้มากขึ้นและเติบโตเร็วขึ้นโดยใช้จำนวนช่องเท่าเดิม!

Embarking = การลงเรือ
Once a certain tech is researched, your land units can embark, allowing them to traverse water tiles.\nEntering or leaving water takes the entire turn. = เมื่อวิจัยเทคโนโลยีที่กำหนดแล้ว ยูนิตบนบกจะลงเรือเพื่อเดินทางผ่านช่องน้ำได้\nการลงน้ำหรือขึ้นบกใช้เวลาทั้งเทิร์น
Units are defenseless while embarked (cannot use modifiers), and have a fixed Defending Strength based on your tech Era, so be careful!\nRanged Units can't attack, Melee Units have a Strength penalty, and all have limited vision. = เมื่อลงเรือ ยูนิตจะป้องกันตัวไม่ได้ (ใช้ตัวปรับค่าไม่ได้) และมีกำลังป้องกันคงที่ตามยุคเทคโนโลยี โปรดระวัง!\nยูนิตระยะไกลโจมตีไม่ได้ ยูนิตระยะประชิดถูกลดกำลัง และทุกยูนิตมองเห็นได้จำกัด

Idle Units = ยูนิตว่าง
Clicking 'Next unit' moves to the next idle unit in the queue (as listed in Overview -> Units). After issuing an order to a unit, if 'Auto Unit Cycle' in Options -> Gameplay is enabled, you will automatically select the next idle unit. = การกด 'ยูนิตถัดไป' จะเลือกยูนิตว่างตัวถัดไปตามลำดับ (ดูได้ใน ภาพรวม -> ยูนิต) เมื่อสั่งการยูนิตแล้ว หากเปิด 'วนเลือกยูนิตอัตโนมัติ' ใน ตัวเลือก -> การเล่นเกม ระบบจะเลือกยูนิตว่างตัวถัดไปให้
If you don't want to move a unit this turn, you can skip it by clicking 'Next unit' again, or command the unit to 'Skip turn'. = หากไม่ต้องการย้ายยูนิตในเทิร์นนี้ คุณข้ามได้ด้วยการกด 'ยูนิตถัดไป' อีกครั้ง หรือสั่งยูนิตให้ 'ข้ามเทิร์น'
If you want to disable the 'Next unit' feature entirely, you can toggle it in Options -> Gameplay -> Check for idle units. = หากต้องการปิดคุณสมบัติ 'ยูนิตถัดไป' ทั้งหมด ให้เปลี่ยนที่ ตัวเลือก -> การเล่นเกม -> ตรวจสอบยูนิตว่าง
If you'd rather 'Next unit' cycle the units and not mark them as Done, you can change it in the Options -> Gameplay menu. = หากต้องการให้ 'ยูนิตถัดไป' วนเลือกยูนิตโดยไม่ทำเครื่องหมายว่าเสร็จแล้ว ให้เปลี่ยนในเมนู ตัวเลือก -> การเล่นเกม
You can also cycle through the idle units using the left and right triangles on the Unit Table in the lower left of the screen. Or by default using the Cycle button next to the 'Next Unit' button. = คุณยังวนเลือกยูนิตว่างด้วยปุ่มสามเหลี่ยมซ้ายและขวาบนแผงยูนิตมุมล่างซ้าย หรือใช้ปุ่มวนเลือกข้างปุ่ม 'ยูนิตถัดไป' ตามค่าเริ่มต้น

 # Requires translation!
Contact Me = ติดต่อฉัน
Hi there! If you've played this far, you've probably seen that the game is currently incomplete.\n Unciv will remain open-source forever. = สวัสดี! หากคุณเล่นมาถึงจุดนี้ คุณคงสังเกตเห็นแล้วว่าเกมยังไม่สมบูรณ์ในขณะนี้\n Unciv จะยังคงเป็นโอเพนซอร์สตลอดไป
What motivates me to keep working on it, \n  besides the fact I think it's amazingly cool that I can,\n  is the support from the players - you guys are the best! = สิ่งที่ทำให้ฉันมีแรงทำงานนี้ต่อไป \n  นอกจากความจริงที่ว่าฉันคิดว่าการที่ฉันทำได้มันเจ๋งมากแล้ว\n  ก็คือการสนับสนุนจากผู้เล่น - พวกคุณยอดเยี่ยมที่สุด!
If you like Unciv, please rate and review it in the App Store.\n If you find a problem or have a suggestion, open a GitHub issue and help us make the game even better! = หากคุณชอบ Unciv โปรดให้คะแนนและเขียนรีวิวใน App Store\nหากพบปัญหาหรือมีข้อเสนอแนะ โปรดเปิด Issue บน GitHub และช่วยกันทำให้เกมดียิ่งขึ้น!

Pillaging = การปล้นสะดม
Military units can pillage improvements, which heals them 25 health and ruins the improvement.\nThe tile can still be worked, but advantages from the improvement - stat bonuses and resources - will be lost.\nWorkers can repair these improvements, which takes less time than building the improvement from scratch.\nPillaging certain improvements will result in your units looting gold from the improvement. = ยูนิตทหารปล้นสะดมสิ่งปรับปรุงได้ โดยจะฟื้นพลังชีวิต 25 และทำให้สิ่งปรับปรุงเสียหาย\nช่องนั้นยังใช้ทำงานได้ แต่จะเสียประโยชน์จากสิ่งปรับปรุง ทั้งโบนัสผลผลิตและทรัพยากร\nคนงานซ่อมสิ่งปรับปรุงได้โดยใช้เวลาน้อยกว่าสร้างใหม่\nการปล้นสะดมสิ่งปรับปรุงบางชนิดทำให้ยูนิตได้ทองคำจากที่นั่น

Experience = ประสบการณ์
Units that enter combat gain experience, which can then be used on promotions for that unit.\nUnits gain more experience when in Melee combat than Ranged, and more when attacking than when defending. = ยูนิตที่เข้ารบจะได้รับประสบการณ์ ซึ่งใช้เลื่อนขั้นยูนิตนั้นได้\nยูนิตได้ประสบการณ์จากการรบระยะประชิดมากกว่าระยะไกล และจากการโจมตีมากกว่าการป้องกัน
Units can only gain up to 30 XP from Barbarian units - meaning up to 2 promotions. After that, Barbarian units will provide no experience. = ยูนิตได้รับประสบการณ์จากอนารยชนได้สูงสุด 30 XP เท่านั้น หรือประมาณ 2 การเลื่อนขั้น หลังจากนั้นอนารยชนจะไม่ให้ประสบการณ์อีก

Combat = การรบ
Unit and cities are worn down by combat, which is affected by a number of different values.\nEach unit has a certain 'base' combat value, which can be improved by certain conditions, promotions and locations. = ยูนิตและเมืองอ่อนกำลังลงจากการรบ ซึ่งได้รับผลจากค่าต่าง ๆ\nยูนิตแต่ละตัวมีค่ากำลังรบพื้นฐานที่เพิ่มขึ้นได้จากเงื่อนไข การเลื่อนขั้น และตำแหน่งที่ตั้ง
Units use the 'Strength' value as the base combat value when melee attacking and when defending.\nWhen using a ranged attack, they will the use the 'Ranged Strength' value instead. = ยูนิตใช้ค่า 'กำลัง' เป็นค่าพื้นฐานเมื่อโจมตีระยะประชิดและเมื่อป้องกัน\nเมื่อโจมตีระยะไกล จะใช้ค่า 'กำลังโจมตีระยะไกล' แทน
Ranged attacks can be done from a distance, dependent on the 'Range' value of the unit.\nWhile melee attacks allow the defender to damage the attacker in retaliation, ranged attacks do not. = ยูนิตโจมตีระยะไกลได้ตามค่า 'ระยะ' ของยูนิต\nการโจมตีระยะประชิดเปิดโอกาสให้ฝ่ายป้องกันสร้างความเสียหายตอบโต้ แต่การโจมตีระยะไกลไม่เปิดโอกาสนี้

Embassies = สถานทูต
Establishing an embassy in other players' Capital city shows the location of their Capital, likewise other players who establish an embassy in your Capital can see location of your Capital. = การตั้งสถานทูตในเมืองหลวงของผู้เล่นอื่นจะเปิดเผยตำแหน่งเมืองหลวงของเขา เช่นเดียวกับผู้เล่นอื่นที่ตั้งสถานทูตในเมืองหลวงคุณ ก็จะเห็นตำแหน่งเมืองหลวงของคุณ
Embassies thus allow Spies to be placed in another players' Capital City if Espionage is enabled. = สถานทูตจึงช่วยให้ส่งสายลับไปประจำเมืองหลวงของผู้เล่นอื่นได้ หากเปิดระบบจารกรรม
Mutual embassies are required to allow trading open borders and to sign Research Agreement and Defensive Pact. = ต้องตั้งสถานทูตซึ่งกันและกันก่อน จึงแลกเปลี่ยนการเปิดพรมแดนและลงนามข้อตกลงวิจัยหรือสนธิสัญญาป้องกันร่วมได้
Declaring war on another player or denouncing them will remove embassies from both players' Capitals. You will have to re-establish them to use their effect. = การประกาศสงครามหรือประณามผู้เล่นอื่นจะยกเลิกสถานทูตในเมืองหลวงของทั้งสองฝ่าย คุณต้องตั้งใหม่เพื่อรับผลของสถานทูต
Re-establishing an embassy after denunciation from either side becomes available next turn, while re-establishing them when at war requires a peace treaty. = หลังฝ่ายใดฝ่ายหนึ่งประณามกัน จะตั้งสถานทูตใหม่ได้ในเทิร์นถัดไป แต่หากอยู่ในสงคราม ต้องทำสนธิสัญญาสันติภาพก่อน
Be cautious when accepting embassy from other players because they can spy on your capital, or worse may start planning to attack you. = โปรดระวังเมื่อยอมรับสถานทูตของผู้เล่นอื่น เพราะเขาอาจส่งสายลับมายังเมืองหลวง หรืออาจเริ่มวางแผนโจมตีคุณ
Note that before you can offer an embassy, you need the required Technology. = คุณต้องมีเทคโนโลยีที่กำหนดก่อนจึงจะเสนอจัดตั้งสถานทูตได้
Embassies are available using the Gods and Kings ruleset. = สถานทูตใช้ได้ในชุดกฎเทพเจ้าและกษัตริย์
Defensive Pacts = สนธิสัญญาป้องกันร่วม

Open Borders from other player and vice versa allow units to freely pass through their territory. = การเปิดพรมแดนจากผู้เล่นอื่นและในทางกลับกัน ทำให้ยูนิตเดินทางผ่านดินแดนของอีกฝ่ายได้อย่างอิสระ
They also let Missionaries to enter other players' territory without suffering attrition. = ยังช่วยให้มิชชันนารีเข้าดินแดนผู้เล่นอื่นได้โดยไม่สูญเสียกำลัง
Open Borders expire depending on game speed and are canceled upon Declaration of War, the closure however takes effect only after war ends and need to be traded again. = การเปิดพรมแดนหมดอายุตามความเร็วเกม และถูกยกเลิกเมื่อประกาศสงคราม แต่การปิดพรมแดนจะมีผลเมื่อสงครามจบแล้ว จากนั้นต้องแลกเปลี่ยนข้อตกลงใหม่
You gain diplomatic boost with other AI player if you both have Open Borders to each other = หากคุณและผู้เล่น AI เปิดพรมแดนให้กันทั้งสองฝ่าย จะได้รับผลดีทางการทูต
Be cautious when giving Open Borders because other player may settle a City near your lands in an area you are planning to use, they may also use your territory to attack your friends or City State allies. = โปรดระวังเมื่อเปิดพรมแดน เพราะผู้เล่นอื่นอาจตั้งเมืองใกล้ดินแดนของคุณในพื้นที่ที่คุณวางแผนจะใช้ หรือใช้ดินแดนคุณโจมตีเพื่อนและนครรัฐพันธมิตร
Note that before you can offer or accept open borders, both Nations need the required Technology. = ทั้งสองประเทศต้องมีเทคโนโลยีที่กำหนดก่อนจึงจะเสนอหรือยอมรับการเปิดพรมแดนได้
When playing with the Gods and Kings ruleset mutual embassies need to be established before Open Borders can be traded. = เมื่อใช้ชุดกฎเทพเจ้าและกษัตริย์ ต้องตั้งสถานทูตซึ่งกันและกันก่อนจึงจะแลกเปลี่ยนการเปิดพรมแดนได้

In Research Agreements, you and another civilization decide to jointly research technology.\nAt the end of the agreement, you will both receive a 'lump sum' of ⍾Science, which will go towards one of your unresearched technologies. = ในข้อตกลงวิจัย คุณและอีกอารยธรรมตกลงร่วมกันวิจัยเทคโนโลยี\nเมื่อข้อตกลงสิ้นสุด ทั้งสองฝ่ายจะได้รับ ⍾วิทยาศาสตร์ก้อนหนึ่งเพื่อนำไปใช้กับเทคโนโลยีที่ยังไม่ได้วิจัย
The amount of ⍾Science you receive at the end is dependent on the ⍾Science generated by your cities and the other civilization's cities during the agreement - the more, the better! = จำนวน ⍾วิทยาศาสตร์ที่ได้รับตอนสิ้นสุดขึ้นอยู่กับ ⍾วิทยาศาสตร์ที่เมืองของคุณและอีกอารยธรรมผลิตระหว่างข้อตกลง ยิ่งมากยิ่งดี!
Note that before you can invest in a research agreement, you must have a Declaraction of Friendship, both Nations need the required Technology, and both Nations need enough Gold on hand for the agreement. = ก่อนลงทุนในข้อตกลงวิจัย ต้องมีคำประกาศมิตรภาพ ทั้งสองประเทศต้องมีเทคโนโลยีที่กำหนด และมีทองคำเพียงพอสำหรับข้อตกลง
When playing with the Gods and Kings ruleset mutual embassies need to be established before a Research Agreement can be signed. = เมื่อใช้ชุดกฎเทพเจ้าและกษัตริย์ ต้องตั้งสถานทูตซึ่งกันและกันก่อนจึงจะลงนามข้อตกลงวิจัยได้

Defensive pacts allow you and another civ to protect one another from aggressors.\nOnce the defensive pact is signed, you will be drawn into their future defensive wars, just as they will be drawn into your future defensive wars. Declaring war on any Civ will remove all of your defensive pacts. You will have to re-sign them to use their effect. = สนธิสัญญาป้องกันร่วมทำให้คุณและอีกอารยธรรมคุ้มครองกันจากผู้รุกราน\nเมื่อลงนามแล้ว คุณจะเข้าร่วมสงครามป้องกันในอนาคตของอีกฝ่าย และเขาจะเข้าร่วมสงครามป้องกันของคุณเช่นกัน การประกาศสงครามกับอารยธรรมใดก็ตามจะยกเลิกสนธิสัญญาป้องกันร่วมทั้งหมดของคุณ ต้องลงนามใหม่เพื่อใช้ผลของสนธิสัญญา
Be cautious when signing defensive pacts because they can bring you into wars that you might not want to be in. = โปรดระวังเมื่อลงนามสนธิสัญญาป้องกันร่วม เพราะอาจดึงคุณเข้าสู่สงครามที่ไม่ต้องการ
The AI is very careful and will not accept defensive pacts with less than 80 influence. = AI จะระมัดระวังมาก และจะไม่ยอมรับสนธิสัญญาป้องกันร่วมหากอิทธิพลต่ำกว่า 80
Note that before you can sign a defensive pact, you must have a Declaraction of Friendship, and both Nations need the required Technology. = ก่อนลงนามสนธิสัญญาป้องกันร่วม ต้องมีคำประกาศมิตรภาพ และทั้งสองประเทศต้องมีเทคโนโลยีที่กำหนด
When playing with the Gods and Kings ruleset mutual embassies need to be established before a Defensive Pact can be signed. = เมื่อใช้ชุดกฎเทพเจ้าและกษัตริย์ ต้องตั้งสถานทูตซึ่งกันและกันก่อนจึงจะลงนามสนธิสัญญาป้องกันร่วมได้

Not all nations are contending with you for victory.\nCity-States are nations that can't win, can't be traded with, and instead confer certain bonuses to friendly civilizations. = ไม่ใช่ทุกประเทศที่จะแข่งขันกับคุณเพื่อชัยชนะ\nนครรัฐเป็นประเทศที่ชนะเกมไม่ได้ แลกเปลี่ยนด้วยไม่ได้ แต่จะมอบโบนัสบางอย่างให้อารยธรรมที่เป็นมิตร
Instead, diplomatic relations with City-States are determined by Influence - a meter of 'how much the City-State likes you'.\nInfluence can be increased by attacking their enemies, liberating their city, and giving them sums of gold. = ความสัมพันธ์กับนครรัฐกำหนดด้วยอิทธิพล ซึ่งเป็นมาตรวัดว่า 'นครรัฐชอบคุณมากแค่ไหน'\nคุณเพิ่มอิทธิพลได้ด้วยการโจมตีศัตรูของนครรัฐ ปลดปล่อยเมือง และมอบทองคำให้
Certain bonuses are given when you are at above 30 influence.\nWhen you have above 60 Influence, and you have the highest influence with them of all civilizations, you are considered their 'Ally', and gain further bonuses and access to the Luxury and Strategic resources in their lands. = เมื่ออิทธิพลสูงกว่า 30 คุณจะได้รับโบนัสบางอย่าง\nเมื่ออิทธิพลสูงกว่า 60 และสูงที่สุดในบรรดาอารยธรรมทั้งหมด คุณจะเป็น 'พันธมิตร' ของนครรัฐ ได้โบนัสเพิ่ม และเข้าถึงทรัพยากรฟุ่มเฟือยกับทรัพยากรยุทธศาสตร์ในดินแดนของเขา

While working the land is good, eventually your Citizens will want to Specialize. = แม้การทำงานบนที่ดินจะเป็นประโยชน์ แต่ในที่สุดพลเมืองของคุณก็จะต้องการทำงานเฉพาะทาง
Certain Buildings will also provide Specialist Slots. These slots will show up in the Citizen Management within the City Screen under Specialists. Each slot can be filled with a Citizen which will then become a Specialist. = สิ่งปลูกสร้างบางชนิดมีช่องผู้เชี่ยวชาญด้วย ช่องเหล่านี้อยู่ในส่วนผู้เชี่ยวชาญของการจัดการพลเมืองบนหน้าเมือง คุณใส่พลเมืองหนึ่งคนในแต่ละช่องเพื่อให้เป็นผู้เชี่ยวชาญได้
Each Specialist will generate a certain amount of yield as indicated to the right of the available slots. = ผู้เชี่ยวชาญแต่ละคนให้ผลผลิตตามจำนวนที่แสดงด้านขวาของช่องที่มีอยู่
While these are a great way to specialize the yield production of a City outside of the surrounding Tile Yields, Specialists have an additional value. Each one also generates Great Person Points each turn. With enough of them, a new Great Person will join your Nation. = ผู้เชี่ยวชาญช่วยให้เมืองเน้นผลผลิตเฉพาะทางนอกเหนือจากช่องแผนที่รอบเมือง และยังมีประโยชน์อีกอย่าง คือสร้างคะแนนบุคคลสำคัญทุกเทิร์น เมื่อสะสมมากพอ บุคคลสำคัญคนใหม่จะเข้าร่วมประเทศของคุณ
Great People = บุคคลสำคัญ

Certain buildings, and specialists in cities, generate Great Person points per turn.\nThere are several types of Great People, and their points accumulate separately.\nThe number of points per turn and accumulated points can be viewed in the Overview screen. = สิ่งปลูกสร้างบางชนิดและผู้เชี่ยวชาญในเมืองสร้างคะแนนบุคคลสำคัญทุกเทิร์น\nบุคคลสำคัญมีหลายประเภท และแต่ละประเภทสะสมคะแนนแยกกัน\nดูคะแนนต่อเทิร์นและคะแนนสะสมได้ที่หน้าภาพรวม
Alternatively, the Great Person points breakdown per city can be viewed in each City Screen (see UI Tips article). = หรือดูรายละเอียดคะแนนบุคคลสำคัญของแต่ละเมืองได้ในหน้าเมืองนั้น (ดูบทความเคล็ดลับส่วนติดต่อผู้ใช้)
Once enough points have been accumulated, a Great Person of that type will be created!\nEach Great Person can construct a certain Great Improvement which gives large yields over time, or immediately consumed to provide a certain bonus now. = เมื่อสะสมคะแนนเพียงพอ บุคคลสำคัญประเภทนั้นจะปรากฏ!\nบุคคลสำคัญแต่ละคนสร้างสิ่งปรับปรุงพิเศษที่ให้ผลผลิตสูงในระยะยาว หรือใช้ตัวบุคคลทันทีเพื่อรับโบนัสบางอย่างได้
Great Improvements also provide any strategic resources that are under them, so you don't need to worry if resources are revealed underneath your improvements! = สิ่งปรับปรุงพิเศษยังให้ทรัพยากรยุทธศาสตร์ที่อยู่ข้างใต้ด้วย จึงไม่ต้องกังวลหากค้นพบทรัพยากรใต้สิ่งปรับปรุงเหล่านี้!

Removing Terrain Features = การกำจัดลักษณะภูมิประเทศ
Certain tiles have terrain features - like Flood plains or Forests -  on top of them. Some of these layers, like Jungle, Marsh and Forest, can be removed by workers.\nRemoving the terrain feature does not remove any resources in the tile, and is usually required in order to add improvements exploiting those resources. = บางช่องมีลักษณะภูมิประเทศอยู่ด้านบน เช่น ที่ราบน้ำท่วมหรือป่า บางชนิด เช่น ป่าดงดิบ บึง และป่า ให้คนงานกำจัดออกได้\nการกำจัดลักษณะภูมิประเทศไม่ลบทรัพยากรในช่อง และมักจำเป็นก่อนสร้างสิ่งปรับปรุงเพื่อใช้ทรัพยากรนั้น

Natural Wonders, such as the Mt. Fuji, the Rock of Gibraltar and the Great Barrier Reef, are unique, impassable terrain features, masterpieces of mother Nature, which possess exceptional qualities that make them very different from the average terrain.\nThey benefit by giving you large sums of Culture, ⍾Science, Gold or Production if worked by your Cities, which is why you might need to bring them under your empire as soon as possible. = สิ่งมหัศจรรย์ทางธรรมชาติ เช่น ภูเขาไฟฟูจิ โขดหินยิบรอลตาร์ และเกรตแบร์ริเออร์รีฟ เป็นลักษณะภูมิประเทศที่มีเอกลักษณ์และผ่านไม่ได้ เป็นผลงานชิ้นเอกของธรรมชาติที่แตกต่างจากภูมิประเทศทั่วไปอย่างมาก\nหากเมืองส่งพลเมืองไปทำงาน จะให้วัฒนธรรม ⍾วิทยาศาสตร์ ทองคำ หรือการผลิตจำนวนมาก คุณจึงอาจต้องรีบนำพื้นที่เหล่านี้เข้าสู่จักรวรรดิ

Keyboard = แป้นพิมพ์
If you have a keyboard, some shortcut keys become available. Unit command or improvement picker keys, for example, are shown directly in their corresponding buttons. = หากมีแป้นพิมพ์ คุณใช้ปุ่มลัดบางอย่างได้ เช่น ปุ่มลัดคำสั่งยูนิตและตัวเลือกสิ่งปรับปรุงจะแสดงบนปุ่มที่เกี่ยวข้องโดยตรง
On the world screen the hotkeys are as follows: = ปุ่มลัดบนหน้าแผนที่โลกมีดังนี้:
Space or 'N' - Next unit or turn\n'E' - Empire overview (last viewed page)\n'+', '-' - Zoom in / out\nHome - center on capital or open its City Screen if already centered = Space หรือ 'N' - ยูนิตหรือเทิร์นถัดไป\n'E' - ภาพรวมจักรวรรดิ (หน้าที่ดูล่าสุด)\n'+', '-' - ซูมเข้า / ออก\nHome - จัดกึ่งกลางที่เมืองหลวง หรือเปิดหน้าเมืองหลวงหากอยู่กึ่งกลางแล้ว
F1 - Open Civilopedia\nF2 - Empire overview Trades\nF3 - Empire overview Units\nF4 - Empire overview Diplomacy\nF5 - Social policies\nF6 - Technologies\nF7 - Empire overview Cities\nF8 - Victory Progress\nF9 - Empire overview Stats\nF10 - Empire overview Resources\nF11 - Quicksave\nF12 - Quickload = F1 - เปิดสารานุกรมอารยธรรม\nF2 - ภาพรวมจักรวรรดิ: การแลกเปลี่ยน\nF3 - ภาพรวมจักรวรรดิ: ยูนิต\nF4 - ภาพรวมจักรวรรดิ: การทูต\nF5 - นโยบายสังคม\nF6 - เทคโนโลยี\nF7 - ภาพรวมจักรวรรดิ: เมือง\nF8 - ความคืบหน้าชัยชนะ\nF9 - ภาพรวมจักรวรรดิ: สถิติ\nF10 - ภาพรวมจักรวรรดิ: ทรัพยากร\nF11 - บันทึกด่วน\nF12 - โหลดด่วน
Ctrl-R - Toggle tile resource display\nCtrl-Y - Toggle tile yield display\nCtrl-O - Game options\nCtrl-S - Save game\nCtrl-L - Load game\nCtrl-U - Toggle UI (World Screen only) = Ctrl-R - แสดง/ซ่อนทรัพยากรบนช่อง\nCtrl-Y - แสดง/ซ่อนผลผลิตของช่อง\nCtrl-O - ตัวเลือกเกม\nCtrl-S - บันทึกเกม\nCtrl-L - โหลดเกม\nCtrl-U - แสดง/ซ่อนส่วนติดต่อ (เฉพาะหน้าแผนที่โลก)
All of these can be reassigned. = คุณกำหนดปุ่มเหล่านี้ใหม่ได้ทั้งหมด

This is where you spend most of your time playing Unciv. See the world, control your units, access other screens from here. = คุณจะใช้เวลาเล่น Unciv ส่วนใหญ่อยู่ที่นี่ ดูโลก ควบคุมยูนิต และเปิดหน้าอื่น ๆ ได้จากหน้านี้
①: The menu button - civilopedia, save, load, options... = ①: ปุ่มเมนู - สารานุกรม บันทึก โหลด ตัวเลือก...
②: The player/nation whose turn it is - click for diplomacy overview. = ②: ผู้เล่น/ประเทศที่กำลังเล่นเทิร์นนี้ - กดเพื่อดูภาพรวมการทูต
③: The Technology Button - shows the tech tree which allows viewing or researching technologies. = ③: ปุ่มเทคโนโลยี - เปิดผังเทคโนโลยีเพื่อดูหรือเลือกวิจัย
④: The Social Policies Button - shows enacted and selectable policies, and with enough culture points you can enact new ones. = ④: ปุ่มนโยบายสังคม - แสดงนโยบายที่รับแล้วและที่เลือกได้ เมื่อมีวัฒนธรรมเพียงพอ คุณรับนโยบายใหม่ได้
⑤: The Diplomacy Button - shows the diplomacy manager where you can talk to other civilizations. = ⑤: ปุ่มการทูต - เปิดหน้าจัดการการทูตเพื่อพูดคุยกับอารยธรรมอื่น
⑥: Unit Action Buttons - while a unit is selected its possible actions appear here. = ⑥: ปุ่มคำสั่งยูนิต - เมื่อเลือกยูนิต คำสั่งที่ใช้ได้จะแสดงที่นี่
⑦: The unit/city info pane - shows information about a selected unit or city. = ⑦: แผงข้อมูลยูนิต/เมือง - แสดงข้อมูลของยูนิตหรือเมืองที่เลือก
⑧: The name (and unit icon) of the selected unit or city, with current health if wounded. Clicking a unit name or icon will open its civilopedia entry. = ⑧: ชื่อ (และไอคอนยูนิต) ของยูนิตหรือเมืองที่เลือก พร้อมพลังชีวิตปัจจุบันหากบาดเจ็บ กดชื่อหรือไอคอนยูนิตเพื่อเปิดข้อมูลในสารานุกรม
⑨: The arrow buttons allow jumping to the next/previous idle unit. = ⑨: ปุ่มลูกศรใช้ข้ามไปยังยูนิตว่างตัวถัดไป/ก่อนหน้า
⑩: For a selected unit, its promotions appear here, and clicking leads to the promotions screen for that unit. = ⑩: เมื่อเลือกยูนิต การเลื่อนขั้นจะแสดงที่นี่ กดเพื่อเปิดหน้าการเลื่อนขั้นของยูนิตนั้น
⑪: Remaining/per turn movement points, strength and experience / XP needed for promotion. For cities, you get its combat strength. = ⑪: คะแนนเคลื่อนที่คงเหลือ/ต่อเทิร์น กำลัง ประสบการณ์ และ XP ที่ต้องใช้เพื่อเลื่อนขั้น สำหรับเมืองจะแสดงกำลังรบ
⑫: This button closes the selected unit/city info pane. = ⑫: ปุ่มนี้ปิดแผงข้อมูลยูนิต/เมืองที่เลือก
⑬: This pane appears when you order a unit to attack an enemy. On top are attacker and defender with their respective base strengths. = ⑬: แผงนี้ปรากฏเมื่อคุณสั่งยูนิตโจมตีศัตรู ด้านบนแสดงผู้โจมตีและผู้ป้องกันพร้อมกำลังพื้นฐานของแต่ละฝ่าย
⑭: Below that are strength bonuses or penalties and health bars projecting before / after the attack. = ⑭: ด้านล่างแสดงโบนัสหรือโทษต่อกำลัง และแถบพลังชีวิตก่อน/หลังการโจมตีที่คาดการณ์ไว้
⑮: The Attack Button - let blood flow! = ⑮: ปุ่มโจมตี - เริ่มศึกได้!
⑯: The minimap shows an overview over the world, with known cities, terrain and fog of war. Clicking will position the main map. = ⑯: แผนที่ย่อแสดงภาพรวมโลก พร้อมเมืองที่รู้จัก ภูมิประเทศ และหมอกสงคราม กดเพื่อย้ายตำแหน่งแผนที่หลัก
⑰: To the side of the minimap are display feature toggling buttons - tile yield, worked indicator, show/hide resources. These mirror setting on the options screen and are hidden if you deactivate the minimap. = ⑰: ด้านข้างแผนที่ย่อมีปุ่มเปิด/ปิดการแสดงผลผลิตของช่อง ตัวบ่งชี้การทำงาน และทรัพยากร ปุ่มเหล่านี้ตรงกับการตั้งค่าในหน้าตัวเลือก และจะซ่อนเมื่อปิดแผนที่ย่อ
⑱: Tile information for the selected hex - current or potential yield, terrain, effects, present units, city located there and such. Where appropriate, clicking a line opens the corresponding civilopedia entry. = ⑱: ข้อมูลช่องหกเหลี่ยมที่เลือก เช่น ผลผลิตปัจจุบันหรือที่เป็นไปได้ ภูมิประเทศ ผลพิเศษ ยูนิต และเมืองในช่อง กดบางบรรทัดเพื่อเปิดข้อมูลที่เกี่ยวข้องในสารานุกรม
⑲: Notifications - what happened during the last 'next turn' phase. Some are clickable to show a relevant place on the map, some even show several when you click repeatedly. = ⑲: การแจ้งเตือน - เหตุการณ์ที่เกิดในช่วง 'เทิร์นถัดไป' ล่าสุด บางรายการกดเพื่อดูตำแหน่งบนแผนที่ได้ และบางรายการกดซ้ำเพื่อวนดูหลายตำแหน่ง
⑳: The Next Turn Button - unless there are things to do, in which case the label changes to 'next unit', 'pick policy' and so on. = ⑳: ปุ่มเทิร์นถัดไป - หากยังมีสิ่งที่ต้องทำ ข้อความจะเปลี่ยนเป็น 'ยูนิตถัดไป' 'เลือกนโยบาย' เป็นต้น
㉑: The Multiplayer Button - Here you can easily check your active multiplayer games. = ㉑: ปุ่มผู้เล่นหลายคน - ใช้ตรวจดูเกมผู้เล่นหลายคนที่กำลังเล่นอยู่ได้สะดวก
ⓐ: The overview button leads to the empire overview screen with various tabs (the last one viewed is remembered) holding vital information about the state of your civilization in the world. = ⓐ: ปุ่มภาพรวมเปิดหน้าภาพรวมจักรวรรดิพร้อมแท็บต่าง ๆ (จดจำแท็บที่ดูล่าสุด) ซึ่งมีข้อมูลสำคัญเกี่ยวกับสถานะอารยธรรมของคุณในโลก
ⓑ: The ♪Culture icon shows accumulated ♪Culture and ♪Culture needed for the next policy - in this case, the exclamation mark tells us a next policy can be enacted. Clicking is another way to the policies manager. = ⓑ: ไอคอน ♪วัฒนธรรม แสดง ♪วัฒนธรรมสะสมและ ♪วัฒนธรรมที่ต้องใช้สำหรับนโยบายถัดไป เครื่องหมายอัศเจรีย์ในตัวอย่างหมายความว่ารับนโยบายใหม่ได้แล้ว กดเพื่อเปิดหน้าจัดการนโยบายได้อีกทาง
ⓒ: Your known strategic resources are displayed here with the available (usage already deducted) number - click to go to the resources overview screen. = ⓒ: ทรัพยากรยุทธศาสตร์ที่รู้จักแสดงที่นี่พร้อมจำนวนที่ยังใช้ได้ (หักที่ใช้อยู่แล้ว) กดเพื่อเปิดภาพรวมทรัพยากร
ⓓ: Happiness/unhappiness balance and either golden age with turns left or accumulated happiness with amount needed for a golden age is shown next to the smiley. Clicking also leads to the resources overview screen as luxury resources are a way to improve happiness. = ⓓ: ข้างรูปหน้ายิ้มแสดงสมดุลความสุข/ความทุกข์ พร้อมเทิร์นยุคทองที่เหลือ หรือความสุขสะสมเทียบกับที่ต้องใช้เพื่อเข้าสู่ยุคทอง กดเพื่อเปิดภาพรวมทรัพยากรได้เช่นกัน เพราะทรัพยากรฟุ่มเฟือยช่วยเพิ่มความสุข
ⓔ: The ⍾Science icon shows the number of ⍾Science points produced per turn. Clicking leads to the technology tree. = ⓔ: ไอคอน ⍾วิทยาศาสตร์ แสดงคะแนน ⍾วิทยาศาสตร์ที่ผลิตต่อเทิร์น กดเพื่อเปิดผังเทคโนโลยี
ⓕ: Number of turns played with translation into calendar years. Click to see the victory overview. = ⓕ: จำนวนเทิร์นที่เล่น พร้อมปีปฏิทินที่เทียบเท่า กดเพื่อดูภาพรวมชัยชนะ
ⓖ: The number of gold coins in your treasury and income. Clicks lead to the Stats overview screen. = ⓖ: จำนวนทองคำในคลังและรายได้ กดเพื่อดูภาพรวมสถิติ
ⓗ: The quantity of ☮Faith your citizens have generated, or 'off' if religion is disabled. Clicking it makes you go to the religion overview screen. = ⓗ: ปริมาณ ☮ศรัทธาที่พลเมืองสร้าง หรือคำว่า 'ปิด' หากปิดศาสนา กดเพื่อดูภาพรวมศาสนา
ⓧ: In the center of all this - the world map! Here, the "X" marks a spot outside the map. Yes, unless the wrap option was used, Unciv worlds are flat. Don't worry, your ships won't fall off the edge. = ⓧ: ใจกลางของทุกอย่างคือแผนที่โลก! ในตัวอย่าง 'X' อยู่ภายนอกแผนที่ ใช่แล้ว โลกของ Unciv แบนหากไม่ได้เปิดตัวเลือกแผนที่วนรอบ ไม่ต้องห่วง เรือของคุณจะไม่ตกขอบโลก
ⓨ: By the way, here's how an empire border looks like - it's in the national colours of the nation owning the territory. = ⓨ: และนี่คือลักษณะพรมแดนจักรวรรดิ ซึ่งใช้สีประจำประเทศที่เป็นเจ้าของดินแดน
ⓩ: And this is the red targeting circle that led to the attack pane back under ⑬. = ⓩ: ส่วนนี่คือวงกลมเล็งสีแดงที่เปิดแผงโจมตีตามข้อ ⑬
What you don't see: The phone/tablet's back button will pop the question whether you wish to leave Unciv and go back to Real Life. On desktop versions, you can use the ESC key. = สิ่งที่ไม่เห็นในภาพ: ปุ่มย้อนกลับของโทรศัพท์/แท็บเล็ตจะถามว่าคุณต้องการออกจาก Unciv กลับสู่ชีวิตจริงหรือไม่ ในรุ่นเดสก์ท็อปใช้ปุ่ม ESC ได้

When at later stages of the game, you might have a lot of units but only a little to do. To help you we have implemented an AutoPlay feature that lets you use the AI to play part or all of your turn. = ช่วงท้ายเกม คุณอาจมียูนิตจำนวนมากแต่มีเรื่องให้ทำเพียงเล็กน้อย เราจึงมีคุณสมบัติเล่นอัตโนมัติ ให้ AI เล่นบางส่วนหรือทั้งหมดของเทิร์นแทนคุณได้
To enable AutoPlay, go to options and open the AutoPlay tab and press "Show AutoPlay button". = หากต้องการเปิดเล่นอัตโนมัติ ให้เปิดตัวเลือก ไปแท็บเล่นอัตโนมัติ แล้วกด "แสดงปุ่มเล่นอัตโนมัติ"
Clicking on the AutoPlay button opens a popup menue for choosing to AutoPlay parts or all of your turn. = กดปุ่มเล่นอัตโนมัติเพื่อเปิดเมนูเลือกให้เล่นบางส่วนหรือทั้งหมดของเทิร์นแทนคุณ
Clicking Start AutoPlay in the pop-up menue or long pressing the AutoPlay button begins the multi-turn AutoPlay. This will play your next turns as if you were an AI. = กดเริ่มเล่นอัตโนมัติในเมนู หรือกดปุ่มเล่นอัตโนมัติค้างไว้ เพื่อเริ่มเล่นอัตโนมัติหลายเทิร์น ระบบจะเล่นเทิร์นถัด ๆ ไปเสมือนคุณเป็น AI
To cancel multi-turn AutoPlay you can press the AutoPlay button, next turn button or open the options menue. = ยกเลิกการเล่นอัตโนมัติหลายเทิร์นได้ด้วยการกดปุ่มเล่นอัตโนมัติ ปุ่มเทิร์นถัดไป หรือเปิดเมนูตัวเลือก
Multi-turn AutoPlay is not advised on harder difficulty levels as your AI will not play better against an AI with modifiers. = ไม่แนะนำให้เล่นอัตโนมัติหลายเทิร์นในระดับยาก เพราะ AI ของคุณไม่ได้เล่นเหนือกว่า AI คู่แข่งที่มีตัวปรับค่า
Multi-turn AutoPlay for multiplayer is not yet supported. = ยังไม่รองรับการเล่นอัตโนมัติหลายเทิร์นในเกมผู้เล่นหลายคน

After building a shrine, your civilization will start generating ☮Faith. = เมื่อสร้างศาลเจ้าแล้ว อารยธรรมของคุณจะเริ่มผลิต ☮ศรัทธา
When enough ☮Faith has been generated, you will be able to found a pantheon. = เมื่อสะสม ☮ศรัทธาเพียงพอ คุณจะก่อตั้งความเชื่อเทพเจ้าได้
A pantheon will provide a small bonus for your civilization that will apply to all cities that have it as a majority religion. = ความเชื่อเทพเจ้าให้โบนัสเล็กน้อยแก่อารยธรรม โดยมีผลต่อทุกเมืองที่มีความเชื่อนั้นเป็นศาสนาหลัก
Each civilization can only choose a single pantheon belief, and each pantheon can only be chosen once. = แต่ละอารยธรรมเลือกความเชื่อเทพเจ้าได้เพียงหนึ่งอย่าง และแต่ละความเชื่อมีผู้เลือกได้เพียงครั้งเดียว
Generating more ☮Faith will allow you to found a religion. = การผลิต ☮ศรัทธามากขึ้นจะทำให้คุณก่อตั้งศาสนาได้

Keep generating ☮Faith, and eventually a great prophet will be born in one of your cities. = ผลิต ☮ศรัทธาต่อไป แล้วในที่สุดศาสดาผู้ยิ่งใหญ่จะถือกำเนิดในเมืองหนึ่งของคุณ
This great prophet can be used for multiple things: Constructing a holy site, founding a religion and spreading your religion. = ศาสดาผู้ยิ่งใหญ่ใช้ได้หลายอย่าง ทั้งสร้างสถานที่ศักดิ์สิทธิ์ ก่อตั้งศาสนา และเผยแผ่ศาสนาของคุณ
When founding your religion, you may choose another two beliefs. The founder belief will only apply to you, while the follower belief will apply to all cities following your religion. = เมื่อก่อตั้งศาสนา คุณเลือกหลักความเชื่อได้อีกสองอย่าง หลักผู้ก่อตั้งมีผลเฉพาะคุณ ส่วนหลักผู้ศรัทธามีผลต่อทุกเมืองที่นับถือศาสนาของคุณ
Additionally, the city where you used your great prophet will become the holy city of that religion. = นอกจากนี้ เมืองที่คุณใช้ศาสดาผู้ยิ่งใหญ่จะเป็นเมืองศักดิ์สิทธิ์ของศาสนานั้น
Once you have founded a religion, great prophets will keep being born every so often, though the amount of Faith☮ you have to save up will be higher. = เมื่อก่อตั้งศาสนาแล้ว ศาสดาผู้ยิ่งใหญ่จะเกิดเป็นระยะ แต่ต้องสะสมศรัทธา☮ มากขึ้น
One of these great prophets can then be used to enhance your religion. = คุณใช้ศาสดาผู้ยิ่งใหญ่คนหนึ่งเพื่อเสริมศาสนาให้เข้มแข็งได้
This will allow you to choose another follower belief, as well as an enhancer belief, that only applies to you. = คุณจะเลือกหลักผู้ศรัทธาเพิ่มอีกหนึ่งอย่าง และหลักเสริมศาสนาที่มีผลเฉพาะคุณได้
Do take care founding a religion soon, only about half the players in the game are able to found a religion! = ควรรีบก่อตั้งศาสนา เพราะมีผู้เล่นเพียงประมาณครึ่งหนึ่งในเกมเท่านั้นที่ก่อตั้งศาสนาได้!

Religion inside cities = ศาสนาภายในเมือง
When founding a city, it won't follow a religion immediately. = เมืองที่เพิ่งก่อตั้งจะยังไม่นับถือศาสนาใดทันที
The religion a city follows depends on the total pressure each religion has within the city. = ศาสนาที่เมืองนับถือขึ้นอยู่กับแรงกดดันรวมของแต่ละศาสนาในเมือง
Followers are allocated in the same proportions as these pressures, and these followers can be viewed in the City Screen. = จำนวนผู้ศรัทธาแบ่งตามสัดส่วนของแรงกดดันเหล่านี้ และดูได้ในหน้าเมือง
You are allowed to check religious followers and pressures in cities you do not own by selecting them. = คุณเลือกเมืองที่ไม่ใช่ของคุณเพื่อตรวจดูผู้ศรัทธาและแรงกดดันทางศาสนาได้
In both places, a tap/click on the icon of a religion will show detailed information with its effects. = ทั้งสองจุดสามารถแตะ/คลิกไอคอนศาสนาเพื่อดูรายละเอียดและผลของศาสนานั้น
Based on this, you can get a feel for which religions have a lot of pressure built up in the city, and which have almost none. = จึงช่วยให้คุณทราบว่าศาสนาใดมีแรงกดดันสะสมในเมืองมาก และศาสนาใดแทบไม่มี
The city follows a religion if a majority of its population follows that religion, and will only then receive the effects of Follower and Pantheon beliefs of that religion. = เมืองจะนับถือศาสนาเมื่อประชากรส่วนใหญ่นับถือศาสนานั้น และจะได้รับผลของหลักผู้ศรัทธาและความเชื่อเทพเจ้าของศาสนานั้นเมื่อเป็นเช่นนี้เท่านั้น

Spreading Religion = การเผยแผ่ศาสนา
Spreading religion happens naturally, but can be sped up using missionaries or great prophets. = ศาสนาเผยแผ่เองตามธรรมชาติ แต่เร่งได้ด้วยมิชชันนารีหรือศาสดาผู้ยิ่งใหญ่
Missionaries can be bought in cities following a major religion, and will take the religion of that city. = คุณซื้อมิชชันนารีในเมืองที่นับถือศาสนาหลักได้ และมิชชันนารีจะนับถือศาสนาของเมืองนั้น
So do take care where you are buying them! If another civilization has converted one of your cities to their religion, missionaries bought there will follow their religion. = จึงต้องระวังเมืองที่ซื้อ! หากอารยธรรมอื่นเปลี่ยนศาสนาของเมืองคุณ มิชชันนารีที่ซื้อที่นั่นก็จะนับถือศาสนาของเขา
Great prophets always have your religion when they appear, even if they are bought in cities following other religions, but captured great prophets do retain their original religion. = ศาสดาผู้ยิ่งใหญ่ที่เกิดจะนับถือศาสนาของคุณเสมอ แม้ซื้อในเมืองที่นับถือศาสนาอื่น แต่ศาสดาที่ถูกยึดจะคงศาสนาเดิมไว้
Both great prophets and missionaries are able to spread religion to cities when they are inside its borders, even cities of other civilizations. = ทั้งศาสดาผู้ยิ่งใหญ่และมิชชันนารีเผยแผ่ศาสนาในเมืองได้เมื่ออยู่ภายในพรมแดนของเมือง แม้เป็นเมืองของอารยธรรมอื่น
These two units can even enter tiles of civilizations with whom you don't have an open borders agreement! = ยูนิตสองชนิดนี้เข้าไปในช่องของอารยธรรมที่ไม่ได้มีข้อตกลงเปิดพรมแดนกับคุณได้ด้วย!
But do take care, missionaries will lose 250 religious strength each turn they end while in foreign lands. = แต่ต้องระวัง มิชชันนารีจะเสียพลังศาสนา 250 ทุกครั้งที่จบเทิร์นในดินแดนต่างชาติ
This diminishes their effectiveness when spreading religion, and if their religious strength ever reaches 0, they have lost their faith and disappear. = พลังที่ลดลงทำให้เผยแผ่ศาสนาได้ผลน้อยลง และเมื่อพลังศาสนาเหลือ 0 มิชชันนารีจะสูญเสียศรัทธาและหายไป
When you do spread your religion, the religious strength of the unit is added as pressure for that religion. = เมื่อเผยแผ่ศาสนา พลังศาสนาของยูนิตจะถูกเพิ่มเป็นแรงกดดันของศาสนานั้น
Cities also passively add pressure of their majority religion to nearby cities. = เมืองยังเพิ่มแรงกดดันของศาสนาหลักให้เมืองใกล้เคียงโดยอัตโนมัติ
Each city provides +6 pressure per turn to all cities within 10 tiles, though the exact amount of pressure depends on the game speed. = แต่ละเมืองให้แรงกดดัน +6 ต่อเทิร์นแก่ทุกเมืองภายใน 10 ช่อง แต่ค่าที่แน่นอนขึ้นอยู่กับความเร็วเกม
This pressure can also be seen in the City Screen, and gives you an idea of how religions in your cities will evolve if you don't do anything. = คุณดูแรงกดดันนี้ในหน้าเมืองได้ เพื่อคาดการณ์ว่าศาสนาในเมืองจะเปลี่ยนไปอย่างไรหากคุณไม่ทำอะไร
Holy cities also provide +30 pressure of the religion founded there to themselves, making it very difficult to effectively convert a holy city. = เมืองศักดิ์สิทธิ์ยังให้แรงกดดัน +30 ของศาสนาที่ก่อตั้งในเมืองแก่ตัวเอง ทำให้เปลี่ยนศาสนาเมืองศักดิ์สิทธิ์ได้ยากมาก
Lastly, before founding a religion, new cities you settle will start with 200 pressure for your pantheon. = สุดท้าย ก่อนก่อตั้งศาสนา เมืองใหม่ที่คุณตั้งจะเริ่มด้วยแรงกดดัน 200 ของความเชื่อเทพเจ้าของคุณ
This way, all your cities will starting following your pantheon as long as you haven't founded a religion yet. = ด้วยวิธีนี้ เมืองทั้งหมดของคุณจะเริ่มนับถือความเชื่อเทพเจ้าของคุณ ตราบใดที่ยังไม่ได้ก่อตั้งศาสนา

Inquisitors = ผู้ไต่สวนศาสนา
Inquisitors are the last religious unit, and their strength is removing other religions. = ผู้ไต่สวนศาสนาเป็นยูนิตศาสนาชนิดสุดท้าย มีความสามารถเด่นในการกำจัดศาสนาอื่น
They can remove all other religions from one of your own cities, removing any pressures built up. = พวกเขากำจัดศาสนาอื่นทั้งหมดจากเมืองหนึ่งของคุณ พร้อมลบแรงกดดันที่สะสมไว้ได้
Great prophets also have this ability, and remove all other religions in the city when spreading their religion. = ศาสดาผู้ยิ่งใหญ่ก็ทำได้เช่นกัน โดยจะกำจัดศาสนาอื่นทั้งหมดในเมืองเมื่อเผยแผ่ศาสนาของตน
Often this results in the city immediately converting to their religion = จึงมักทำให้เมืองเปลี่ยนมานับถือศาสนาของพวกเขาทันที
Additionally, when an inquisitor is stationed in or directly next to a city center, units of other religions cannot spread their faith there, though natural spread is unaffected. = นอกจากนี้ เมื่อผู้ไต่สวนอยู่ในหรืออยู่ติดใจกลางเมือง ยูนิตศาสนาอื่นจะเผยแผ่ศาสนาที่นั่นไม่ได้ แต่การเผยแผ่ตามธรรมชาติยังเกิดได้ตามปกติ

The Mayan unique ability, 'The Long Count', comes with a side effect: = ความสามารถเฉพาะของชาวมายา 'ปฏิทินนับยาว' มีผลเพิ่มเติมดังนี้:
Once active, the game's year display will use mayan notation. = เมื่อความสามารถทำงาน การแสดงปีในเกมจะใช้รูปแบบมายา
The Maya measured time in days from what we would call 11th of August, 3114 BCE. A day is called K'in, 20 days are a Winal, 18 Winals are a Tun, 20 Tuns are a K'atun, 20 K'atuns are a B'ak'tun, 20 B'ak'tuns a Piktun, and so on. = ชาวมายานับเวลาจากวันที่เราเรียกว่า 11 สิงหาคม 3114 ปีก่อนคริสตกาล วันหนึ่งเรียกว่า K'in, 20 วันเป็น Winal, 18 Winal เป็น Tun, 20 Tun เป็น K'atun, 20 K'atun เป็น B'ak'tun, 20 B'ak'tun เป็น Piktun และต่อไปเรื่อย ๆ
Unciv only displays ය B'ak'tuns, ඹ K'atuns and ම Tuns (from left to right) since that is enough to approximate gregorian calendar years. The Maya numerals are pretty obvious to understand. Have fun deciphering them! = Unciv แสดงเพียง ය B'ak'tun, ඹ K'atun และ ම Tun (จากซ้ายไปขวา) เพราะเพียงพอสำหรับเทียบปีปฏิทินเกรกอเรียนโดยประมาณ ตัวเลขมายาเข้าใจได้ไม่ยาก ขอให้สนุกกับการถอดรหัส!

Your cities will periodically demand different luxury goods to satisfy their desire for new things in life. = เมืองของคุณจะร้องขอสินค้าฟุ่มเฟือยต่างชนิดเป็นระยะ เพื่อเติมเต็มความต้องการสิ่งใหม่ในชีวิต
If you manage to acquire the demanded luxury by trade, expansion, or conquest, the city will celebrate We Love The King Day for 20 turns. = หากได้ทรัพยากรฟุ่มเฟือยที่ต้องการจากการแลกเปลี่ยน ขยายดินแดน หรือพิชิต เมืองจะฉลองวันเรารักพระราชาเป็นเวลา 20 เทิร์น
During the We Love The King Day, the city will grow 25% faster. = ระหว่างวันเรารักพระราชา เมืองจะเติบโตเร็วขึ้น 25%
This means exploration and trade is important to grow your cities! = นั่นหมายความว่าการสำรวจและการแลกเปลี่ยนสำคัญต่อการเติบโตของเมือง!

Air Combat and Interception = การรบทางอากาศและการสกัดกั้น
Air Combat is very similar to normal Combat, with a few wrinkles. Damage is still dealt using the same equations based on the relative Strength of the Attacking and Defending Unit. = การรบทางอากาศคล้ายการรบทั่วไป แต่มีรายละเอียดเพิ่มเติมเล็กน้อย ความเสียหายยังคำนวณด้วยสมการเดียวกันจากกำลังสัมพัทธ์ของยูนิตโจมตีและยูนิตป้องกัน
However, before the Attacker and Defender fight, there is an added combat phase called Interception. If there is any unit with Interception Range that covers the target attacked tile, then it will attempt to Intercept the Attacking Air Unit. If multiple units can Intercept, the one with higher Intercept chance does it. = แต่ก่อนทั้งสองฝ่ายจะต่อสู้กัน จะมีช่วงเพิ่มเติมเรียกว่าการสกัดกั้น หากมียูนิตที่มีระยะสกัดกั้นครอบคลุมช่องเป้าหมาย จะพยายามสกัดกั้นยูนิตอากาศที่โจมตี หากมีหลายยูนิตที่สกัดกั้นได้ ยูนิตที่มีโอกาสสำเร็จสูงกว่าจะทำหน้าที่
Generally Land/Naval Units have an Intercept Range of 2 Tiles, and Air Units have an Intercept Range of their Attack Range. = โดยทั่วไป ยูนิตบก/เรือมีระยะสกัดกั้น 2 ช่อง และยูนิตอากาศมีระยะสกัดกั้นเท่ากับระยะโจมตี
Ground and Naval Units don't require movement points to Intercept, just Attacks. Air Units cannot have moved nor attacked in the preceding turn. = ยูนิตบกและเรือไม่ต้องใช้คะแนนเคลื่อนที่ในการสกัดกั้น ใช้เพียงจำนวนครั้งโจมตี ส่วนยูนิตอากาศต้องไม่ได้เคลื่อนที่หรือโจมตีในเทิร์นก่อนหน้า
The Intercepting Unit rolls to see if it hits. Whether it hits or not costs an Attack, and most units (without Promotions) can only Attack Once per Nation's Turn. It does NOT cost Movement Points, but Air Units that have used their Movement cannot Intercept between turns. = ยูนิตสกัดกั้นจะสุ่มว่าจะยิงโดนหรือไม่ ไม่ว่าจะโดนหรือพลาดก็ใช้การโจมตีหนึ่งครั้ง ยูนิตส่วนใหญ่ที่ไม่มีการเลื่อนขั้นโจมตีได้ครั้งเดียวต่อเทิร์นของประเทศ การสกัดกั้นไม่ใช้คะแนนเคลื่อนที่ แต่ยูนิตอากาศที่ใช้การเคลื่อนที่แล้วจะสกัดกั้นระหว่างเทิร์นไม่ได้
If the Intercepting Unit Hits, it deals damage according to the Combat Strength calculation to the Attacking Air Unit, potentially with any Strength Bonuses that apply to Interception. It does not receive damage from the Attacking Air Unit. = หากยูนิตสกัดกั้นยิงโดน จะสร้างความเสียหายแก่ยูนิตอากาศที่โจมตีตามการคำนวณกำลังรบ โดยอาจรวมโบนัสกำลังสกัดกั้นที่เกี่ยวข้อง ยูนิตสกัดกั้นจะไม่ได้รับความเสียหายจากยูนิตอากาศที่โจมตี
After Interception resolves, the Attacking Air Unit and the Defending Unit in the targeted tile do Combat as normal, with damage dealt to both sides. = หลังจบการสกัดกั้น ยูนิตอากาศที่โจมตีและยูนิตป้องกันในช่องเป้าหมายจะต่อสู้ตามปกติ และทั้งสองฝ่ายได้รับความเสียหาย
To help deal with Interceptions, see Air Sweeps. = ดูการกวาดล้างทางอากาศเพื่อช่วยรับมือการสกัดกั้น

Air Sweeps = การกวาดล้างทางอากาศ
Fighter units are able to perform Air Sweeps over a tile helping clear out potential enemy Air, Sea, or Land Interceptions that can reach that tile. = เครื่องบินขับไล่กวาดล้างทางอากาศเหนือช่องหนึ่งได้ เพื่อกำจัดโอกาสสกัดกั้นจากยูนิตอากาศ เรือ หรือบกของศัตรูที่ครอบคลุมช่องนั้น
While this Action will take an Attack, the benefit is drawing out Interceptions to help protect your other Air Units. Especially your Bombers. = แม้คำสั่งนี้ใช้การโจมตีหนึ่งครั้ง แต่จะล่อให้ศัตรูสกัดกั้น เพื่อช่วยปกป้องยูนิตอากาศอื่นของคุณ โดยเฉพาะเครื่องบินทิ้งระเบิด
Your unit will always draw an Interception, if one can reach the target tile, even if the Intercepting unit has a chance to miss. = หากการสกัดกั้นไปถึงช่องเป้าหมายได้ ยูนิตของคุณจะล่อให้เกิดการสกัดกั้นเสมอ แม้ยูนิตสกัดกั้นอาจยิงพลาดก็ตาม
If the Interceptor is not an Air Unit (eg Land or Sea), the Air Sweeping unit and Interceptor take no damage! = หากผู้สกัดกั้นไม่ใช่ยูนิตอากาศ เช่น เป็นยูนิตบกหรือเรือ ทั้งยูนิตกวาดล้างทางอากาศและผู้สกัดกั้นจะไม่ได้รับความเสียหาย!
If the Interceptor is an Air Unit, the two units will damage each other in a straight fight with no Interception bonuses. And only the Attacking Air Sweep Unit gets any Air Sweep strength bonuses. = หากผู้สกัดกั้นเป็นยูนิตอากาศ ทั้งสองฝ่ายจะสร้างความเสียหายต่อกันในการต่อสู้โดยตรงโดยไม่มีโบนัสสกัดกั้น และเฉพาะยูนิตกวาดล้างทางอากาศฝ่ายโจมตีเท่านั้นที่ได้รับโบนัสกำลังกวาดล้างทางอากาศ

Fortify, Guard, Withdraw = ตั้งรับ เฝ้าระวัง ถอนตัว
Most Land units have the ability to Fortify. As they spend time without moving, they will slowly gain a Fortification Bonus to their Combat Strength representing digging in and preparing in case of an attack. = ยูนิตบกส่วนใหญ่ตั้งรับได้ เมื่ออยู่กับที่เป็นระยะเวลาหนึ่ง จะค่อย ๆ ได้โบนัสกำลังรบจากการตั้งรับ เสมือนขุดที่มั่นเตรียมรับการโจมตี
Some units have the ability to Withdraw before a melee attack is struck. However, perhaps you wish for them to stand their ground to protect a particular tile. If you do, then give them the Guard command and they will stay fixed until they die or you give them fresh orders. = ยูนิตบางชนิดถอนตัวก่อนถูกโจมตีระยะประชิดได้ แต่คุณอาจต้องการให้ยืนหยัดคุ้มครองช่องหนึ่ง หากเป็นเช่นนั้น ให้สั่งเฝ้าระวัง ยูนิตจะอยู่ที่เดิมจนตายหรือได้รับคำสั่งใหม่
This is NOT the same as Fortify but they will still gain the Fortification Bonus. They will simply not utilize their Withdraw ability. Fortified units with the Withdraw ability will try to flee when attacked. = คำสั่งนี้ไม่เหมือนตั้งรับ แม้จะยังได้โบนัสตั้งรับ แต่ยูนิตจะไม่ใช้ความสามารถถอนตัว ส่วนยูนิตที่ตั้งรับและมีความสามารถถอนตัวยังจะพยายามหนีเมื่อถูกโจมตี

City Tile Blockade = การปิดล้อมช่องเมือง
One of your tiles is blocked by an enemy: when an enemy unit stands on a tile you own, the tile will not produce yields and cannot be worked by a city this turn. City will reallocate population from a blocked tile automatically. = ช่องหนึ่งของคุณถูกศัตรูยึดกั้น: เมื่อยูนิตศัตรูอยู่บนช่องของคุณ ช่องนั้นจะไม่ให้ผลผลิตและเมืองส่งพลเมืองไปทำงานไม่ได้ในเทิร์นนี้ เมืองจะจัดสรรพลเมืองจากช่องที่ถูกกั้นใหม่โดยอัตโนมัติ
Enemy military land units block tiles they are standing on. Enemy military naval units additionally block adjacent water tiles. To protect your tiles from blockade, place a friendly military unit on it or fight off invaders. = ยูนิตทหารบกศัตรูกั้นช่องที่ตนยืนอยู่ ส่วนยูนิตทหารเรือศัตรูยังกั้นช่องน้ำที่ติดกันด้วย ป้องกันการปิดล้อมได้โดยวางยูนิตทหารฝ่ายเดียวกันในช่อง หรือขับไล่ผู้รุกราน

One of your cities is under a naval blockade! When all adjacent water tiles of a coastal city are blocked - city loses harbor connection to all other cities, including capital. Make sure to de-blockade cities by deploying friendly military naval units to fight off invaders. = เมืองหนึ่งของคุณถูกปิดล้อมทางเรือ! เมื่อช่องน้ำติดเมืองชายฝั่งทั้งหมดถูกกั้น เมืองจะเสียการเชื่อมต่อผ่านท่าเรือกับเมืองอื่นทั้งหมดรวมถึงเมืองหลวง ส่งยูนิตทหารเรือฝ่ายเดียวกันไปขับไล่ผู้รุกรานเพื่อยกเลิกการปิดล้อม

Spies! = สายลับ!
The first time a civ reaches the Renaissance era each nation gets one spy. Every time a civ reaches an era afterwards they get one more spy. = ครั้งแรกที่อารยธรรมใดเข้าสู่ยุคฟื้นฟูศิลปวิทยา ทุกประเทศจะได้สายลับหนึ่งคน หลังจากนั้นแต่ละครั้งที่อารยธรรมหนึ่งเข้าสู่ยุคใหม่ อารยธรรมนั้นจะได้สายลับเพิ่มอีกหนึ่งคน
Spies can be sent out to foreign cities to steal technology, rigging elections or stage coups. Place them in your own cities to do counter-intelligence work. = คุณส่งสายลับไปเมืองต่างชาติเพื่อขโมยเทคโนโลยี แทรกแซงการเลือกตั้ง หรือก่อรัฐประหารได้ หรือส่งไปเมืองของคุณเพื่อทำงานต่อต้านจารกรรม
Only one spy per civ is allowed in each city. Spies that are not in any city are on vacation in your spy hideout. = แต่ละอารยธรรมมีสายลับในเมืองหนึ่งได้เพียงคนเดียว สายลับที่ไม่ได้อยู่ในเมืองใดจะพักร้อนที่ฐานลับของคุณ
Spies set up in cities of major civilizations will try to steal technology at a rate which is based off of the science production in the city. Succeeding to steal technology will level up your spy. Failing to succeed will level up the defending spy if it is present. = สายลับในเมืองอารยธรรมหลักจะพยายามขโมยเทคโนโลยี โดยมีอัตราขึ้นอยู่กับการผลิตวิทยาศาสตร์ของเมือง เมื่อขโมยสำเร็จ สายลับของคุณจะเลื่อนระดับ หากล้มเหลว สายลับฝ่ายป้องกันจะเลื่อนระดับหากมีอยู่
Spies set in city-states will try to rig the elections in order to gain influence and reduce the influence of other civilizations. Only one spy partaking in rigging the election can win. = สายลับในนครรัฐจะพยายามแทรกแซงการเลือกตั้งเพื่อเพิ่มอิทธิพลของคุณและลดอิทธิพลอารยธรรมอื่น สายลับที่เข้าร่วมแทรกแซงการเลือกตั้งชนะได้เพียงคนเดียว
A spy that is rigging an election in a city-state may also stage a coup. The likelihood of success for the coup depends on your relative influence to the current ally of the city-state, your spy level, and the level of the spy that the current ally has in the city-state if present. Succeeding a coup will make you their new ally and reduce the influence of all other civs. Failing a coup will kill your spy and level up the defending spy if present. = สายลับที่แทรกแซงการเลือกตั้งในนครรัฐยังก่อรัฐประหารได้ โอกาสสำเร็จขึ้นอยู่กับอิทธิพลของคุณเทียบกับพันธมิตรปัจจุบัน ระดับสายลับของคุณ และระดับสายลับพันธมิตรที่ประจำอยู่หากมี หากสำเร็จ คุณจะเป็นพันธมิตรใหม่และลดอิทธิพลอารยธรรมอื่นทั้งหมด หากล้มเหลว สายลับคุณจะตายและสายลับฝ่ายป้องกันจะเลื่อนระดับหากมีอยู่
Spies that are set up in your own cities will be conducting counter-intelligence. They reduce the success chance of other spies trying to steal your technology. = สายลับในเมืองของคุณทำงานต่อต้านจารกรรม โดยลดโอกาสสำเร็จของสายลับอื่นที่พยายามขโมยเทคโนโลยี
Spies at a higher rank have a higher chance of success. The max rank a spy can reach is rank 3. After a spy is killed it will revive after a certain amount of turns back at rank 1. = สายลับระดับสูงมีโอกาสสำเร็จมากกว่า ระดับสูงสุดคือ 3 เมื่อสายลับถูกฆ่า จะกลับมาเกิดใหม่หลังผ่านไปจำนวนเทิร์นหนึ่ง โดยเริ่มที่ระดับ 1
Building buildings like the constabulary and police station will reduce the technology steal rate of spies in that city. = การสร้างสิ่งปลูกสร้าง เช่น กองสารวัตรและสถานีตำรวจ จะลดอัตราขโมยเทคโนโลยีของสายลับในเมืองนั้น
Espionage is available using the Gods and Kings ruleset. To enable it in a new game click advanced settings, then click on the Enable Espionage option. = ระบบจารกรรมใช้ได้กับชุดกฎเทพเจ้าและกษัตริย์ หากต้องการเปิดในเกมใหม่ ให้กดการตั้งค่าขั้นสูง แล้วเลือกเปิดใช้การจารกรรม

Keyboard Bindings = การกำหนดปุ่มแป้นพิมพ์
Limitations = ข้อจำกัด
 # Requires translation!
This is a work in progress. = นี่คืองานที่อยู่ระหว่างดำเนินการ
For technical reasons, only direct keys or Ctrl-Letter combinations can be used. = ด้วยเหตุผลทางเทคนิค ใช้ได้เฉพาะปุ่มเดี่ยวหรือ Ctrl ร่วมกับตัวอักษรเท่านั้น
Using the Keys page = การใช้หน้าปุ่ม
Each binding has a button with an image looking like this: = การกำหนดปุ่มแต่ละรายการมีปุ่มภาพลักษณะนี้:
While hovering the mouse over the key button, you can press a desired key directly to assign it. = ขณะชี้เมาส์เหนือปุ่ม คุณกดปุ่มแป้นพิมพ์ที่ต้องการเพื่อกำหนดได้ทันที
Double-click the image to reset the binding to default. = ดับเบิลคลิกที่ภาพเพื่อคืนการกำหนดปุ่มเป็นค่าเริ่มต้น
Bindings mapped to their default keys are displayed in gray, those reassigned by you in white. = รายการที่ใช้ปุ่มเริ่มต้นแสดงเป็นสีเทา ส่วนรายการที่คุณเปลี่ยนจะแสดงเป็นสีขาว
Conflicting assignments are marked red. Conflicts can exist across categories, like World Screen / Unit Actions. Note that at the moment, the game does not prevent saving conflicting assignments, though the result may be unexpected. = การกำหนดที่ขัดแย้งกันแสดงเป็นสีแดง ความขัดแย้งอาจเกิดข้ามหมวด เช่น หน้าแผนที่โลก / คำสั่งยูนิต ปัจจุบันเกมยังไม่ป้องกันการบันทึกปุ่มที่ขัดแย้งกัน และผลอาจไม่เป็นไปตามคาด
For discussion about missing entries, see the linked github issue. = ดูการอภิปรายเกี่ยวกับรายการที่ขาดได้ในประเด็น GitHub ที่เชื่อมโยงไว้

Welcome to the Civilopedia! = ยินดีต้อนรับสู่สารานุกรมอารยธรรม!
Here you can find information - general help, rules, and what makes up the game world. = ที่นี่มีข้อมูล ทั้งความช่วยเหลือทั่วไป กฎ และองค์ประกอบของโลกในเกม
How to find information = วิธีค้นหาข้อมูล
Select categories with the buttons on top of the screen. Also up there is the button to leave Civilopedia and go back to where you were before. = เลือกหมวดด้วยปุ่มด้านบนหน้าจอ บริเวณเดียวกันยังมีปุ่มออกจากสารานุกรมเพื่อกลับไปหน้าก่อนหน้า
Each category has a list of entries on the left of the screen, sorted alphabetically (with few exceptions). Clicking an entry will update the center pane were you are currently reading this. = แต่ละหมวดมีรายชื่อบทความทางซ้าย เรียงตามตัวอักษรโดยมีข้อยกเว้นเล็กน้อย กดรายการเพื่อเปลี่ยนข้อมูลในแผงกลางที่คุณกำลังอ่านอยู่
Lines can link to other Civilopedia entries, they are marked with a chain link symbol like this one. You can click anywhere on the line to follow the link. = บางบรรทัดเชื่อมไปบทความอื่นในสารานุกรม โดยมีสัญลักษณ์โซ่เช่นนี้ คุณกดตรงไหนก็ได้บนบรรทัดเพื่อไปตามลิงก์
The current category is special - all articles on general concepts are here. It is called 'Tutorials' because you can revisit these here, too. = หมวดปัจจุบันเป็นหมวดพิเศษที่รวมบทความแนวคิดทั่วไป ชื่อว่า 'บทสอน' เพราะคุณกลับมาอ่านบทสอนที่นี่ได้ด้วย
What information can I find = มีข้อมูลอะไรบ้าง
The data shown is not dependent on your current game's situation, e.g. bonuses for the nation you are playing or difficulty modifiers will not affect the numbers. = ข้อมูลที่แสดงไม่ขึ้นอยู่กับสถานการณ์เกมปัจจุบัน เช่น โบนัสของประเทศที่คุณเล่นหรือตัวปรับค่าความยากจะไม่เปลี่ยนตัวเลขที่แสดง
However, it will reflect the mods you are playing! The combination of base ruleset and extension mods you select define the rules of a game, what objects exist and how they interact, and the Civilopedia mirrors these rules. = แต่ข้อมูลจะตรงกับม็อดที่คุณใช้! ชุดกฎพื้นฐานและม็อดเสริมที่เลือกกำหนดกฎของเกม สิ่งที่มีอยู่ และปฏิสัมพันธ์ระหว่างกัน ซึ่งสารานุกรมจะแสดงตามกฎเหล่านี้
If you opened the Civilopedia from the main menu, the "Ruleset" will be that of the last game you started. = หากเปิดสารานุกรมจากเมนูหลัก ชุดกฎที่ใช้จะเป็นของเกมล่าสุดที่คุณเริ่ม
Letters can select categories, and when there are multiple categories matching the same letter, you can press that repeatedly to cycle between these. = คุณใช้ปุ่มตัวอักษรเลือกหมวดได้ หากมีหลายหมวดใช้ตัวอักษรเดียวกัน กดซ้ำเพื่อวนเลือกหมวดเหล่านั้น
The arrow keys allow navigation as well - left/right for categories, up/down for entries. = ใช้ปุ่มลูกศรนำทางได้เช่นกัน ซ้าย/ขวาเปลี่ยนหมวด ขึ้น/ลงเปลี่ยนรายการ

UI Tips = เคล็ดลับส่วนติดต่อ
World screen = หน้าแผนที่โลก
Skip all units to end a turn quickly = ข้ามทุกยูนิตเพื่อจบเทิร์นอย่างรวดเร็ว
Right-click or long press the "Next unit" button to open a popup menu which allows to end a turn without having to cycle through all units. If some units are automated, a dedicated button is available to move them before ending the turn. = คลิกขวาหรือกดปุ่ม "ยูนิตถัดไป" ค้างไว้เพื่อเปิดเมนูที่ให้จบเทิร์นโดยไม่ต้องวนผ่านทุกยูนิต หากมียูนิตอัตโนมัติ จะมีปุ่มเฉพาะให้เคลื่อนที่ยูนิตเหล่านั้นก่อนจบเทิร์น
Toggle notification list display = แสดง/ซ่อนรายการแจ้งเตือน
On the World screen, swipe the notification list to the right to temporarily hide it. Click the "Bell" button to display them again. = บนหน้าแผนที่โลก ปัดรายการแจ้งเตือนไปทางขวาเพื่อซ่อนชั่วคราว กดปุ่ม "กระดิ่ง" เพื่อแสดงอีกครั้ง
The default state for the notification list can be set in Options > Display > UI - Notifications on world screen. = ตั้งค่าสถานะเริ่มต้นของรายการแจ้งเตือนได้ที่ ตัวเลือก > การแสดงผล > ส่วนติดต่อ - การแจ้งเตือนบนหน้าแผนที่โลก
Entering a City Screen quickly = เปิดหน้าเมืองอย่างรวดเร็ว
You can Right-click or long press a city button on the World screen. The result is the same as tapping it twice - once to select and move the button, again to trigger a reaction: show the City Screen (if the city is yours to inspect), or offer the foreign city info popup. = คุณคลิกขวาหรือกดปุ่มเมืองบนหน้าแผนที่โลกค้างไว้ได้ ผลเหมือนแตะสองครั้ง คือครั้งแรกเลือกและย้ายปุ่ม ครั้งที่สองเปิดหน้าเมือง (หากเป็นเมืองของคุณที่ตรวจดูได้) หรือหน้าต่างข้อมูลเมืองต่างชาติ
Upgrade multiple units of the same type = อัปเกรดยูนิตชนิดเดียวกันหลายตัว
On the World screen, select a unit that can be upgraded, then right-click or long press the "Upgrade" button to open a popup menu allowing to upgrade all units of this type at once. = บนหน้าแผนที่โลก เลือกยูนิตที่อัปเกรดได้ แล้วคลิกขวาหรือกดปุ่ม "อัปเกรด" ค้างไว้เพื่อเปิดเมนูอัปเกรดยูนิตชนิดนี้ทั้งหมดในครั้งเดียว
In the Units overview, the same upgrade menu is available by clicking the unit icon in the "Upgrade" column. When a unit is upgradeable, the icon is lit if conditions are met (enough gold and/or resources), otherwise it is dimmed. = ในภาพรวมยูนิต คุณเปิดเมนูอัปเกรดเดียวกันได้โดยกดไอคอนยูนิตในคอลัมน์ "อัปเกรด" เมื่ออัปเกรดได้ ไอคอนจะสว่างหากเงื่อนไขครบ (มีทองคำและ/หรือทรัพยากรพอ) มิฉะนั้นจะเป็นสีจาง
Additional controls for the construction queue = คำสั่งเพิ่มเติมสำหรับคิวก่อสร้าง
Right-click or long press a construction item to open a popup menu with additional controls, allowing to manage production of the same item in all cities, by issuing the commands from the same City Screen. = คลิกขวาหรือกดรายการก่อสร้างค้างไว้เพื่อเปิดเมนูคำสั่งเพิ่มเติม ช่วยจัดการการผลิตรายการเดียวกันในทุกเมืองได้จากหน้าเมืองเดียว
The "Disable" option (in a single city or all cities) moves an item to a separated "Disabled" tab, to prevent its automatic queueing by the "Auto-assign city production" option or to remove irrelevant objects from the production planning. To move a disabled item back to its initial place, re-enter its popup menu, and choose "Enable". = ตัวเลือก "ปิดใช้" (ในเมืองเดียวหรือทุกเมือง) ย้ายรายการไปแท็บ "ปิดใช้" แยกต่างหาก เพื่อป้องกัน "กำหนดการผลิตเมืองอัตโนมัติ" เพิ่มเข้าคิว หรือเอารายการที่ไม่เกี่ยวข้องออกจากแผนการผลิต หากต้องการคืนรายการ ให้เปิดเมนูของรายการนั้นอีกครั้งแล้วเลือก "เปิดใช้"
Disabled items are set for the current game only and are carried over when founding a new city. = รายการที่ปิดใช้มีผลเฉพาะเกมปัจจุบัน และจะใช้กับเมืองใหม่ที่ก่อตั้งด้วย
Show Great Person Points breakdown = แสดงรายละเอียดคะแนนบุคคลสำคัญ
In the right sidepanel, click a Great People row to display the details of Great Person Points (GPP) accumulated each turn by the current city, for this type of Great People. = ในแผงด้านขวา กดแถวบุคคลสำคัญเพื่อดูรายละเอียดคะแนนบุคคลสำคัญ (GPP) ประเภทนั้นที่เมืองปัจจุบันสะสมต่อเทิร์น
Click any of the Great People icons to display all GPP accumulated each turn by the current city, for all types of Great People. = กดไอคอนบุคคลสำคัญใดก็ได้เพื่อดู GPP ทุกประเภทที่เมืองปัจจุบันสะสมต่อเทิร์น
Tech screen = หน้าเทคโนโลยี
Queue multiple technologies in different branches = จัดคิวหลายเทคโนโลยีจากต่างสาย
On the Tech screen, right-click or long press a technology to automatically queue it, even if this tech is in another branch than the item currently researched. Prerequisite techs to research will also be automatically queued. = บนหน้าเทคโนโลยี คลิกขวาหรือกดเทคโนโลยีค้างไว้เพื่อจัดคิวอัตโนมัติ แม้จะอยู่คนละสายกับที่กำลังวิจัย เทคโนโลยีเงื่อนไขก่อนหน้าที่จำเป็นจะถูกเพิ่มเข้าคิวด้วย
Right-click or long press multiple techs to append them to the research queue, whatever their branch is. = คลิกขวาหรือกดหลายเทคโนโลยีค้างไว้เพื่อเพิ่มต่อท้ายคิววิจัย ไม่ว่าอยู่สายใด
Overview screens = หน้าภาพรวม
Reveal known resources on world screen = แสดงทรัพยากรที่รู้จักบนแผนที่โลก
In the Resources overview, click on a resource icon to center the world screen on tiles already discovered and providing this resource. = ในภาพรวมทรัพยากร กดไอคอนทรัพยากรเพื่อจัดแผนที่โลกให้อยู่กึ่งกลางช่องที่ค้นพบแล้วและให้ทรัพยากรชนิดนี้
Alternatively, click on the "Unimproved" number to center the world screen only on owned (by you or your allied City-states) tiles where the resource is not improved. = หรือกดตัวเลข "ยังไม่ปรับปรุง" เพื่อจัดกึ่งกลางเฉพาะช่องของคุณหรือนครรัฐพันธมิตรที่ยังไม่ได้ปรับปรุงทรัพยากร
If more than one tile is available, click repeatedly on the notification to cycle through all of them. = หากมีหลายช่อง กดการแจ้งเตือนซ้ำเพื่อวนดูทุกช่อง
Show diagram line colors = แสดงสีเส้นในแผนภาพ
In Politics overview > Show diagram, you can click anywhere inside the diagram to display a table listing all relationship line colors and their meaning. = ในภาพรวมการเมือง > แสดงแผนภาพ กดที่ใดก็ได้ในแผนภาพเพื่อดูตารางสีเส้นความสัมพันธ์และความหมาย
Reading "Toast" popups = การอ่านข้อความแจ้งสั้น
"Toasts" can be clicked to make them stay on the screen for easier reading. = คุณกดข้อความแจ้งสั้นให้ค้างบนหน้าจอได้ เพื่ออ่านได้สะดวกขึ้น
Click it again to close (or use the close button). = กดอีกครั้งเพื่อปิด หรือใช้ปุ่มปิด
Miscellaneous = เบ็ดเตล็ด
External links = ลิงก์ภายนอก
External links support right-click or long press to copy the link to the clipboard instead of launching the browser. = คลิกขวาหรือกดลิงก์ภายนอกค้างไว้เพื่อคัดลอกลงคลิปบอร์ดแทนการเปิดเบราว์เซอร์
Example: The 'Open Github page' button on the Mod management screen. = ตัวอย่าง: ปุ่ม 'เปิดหน้า GitHub' ในหน้าจัดการม็อด
View change log = ดูบันทึกการเปลี่ยนแปลง
After updating, you might want to see what has changed. The "About" in "Options" has the version number linked to the change log. You can also see that info by clicking the version number on the main menu. = หลังอัปเดต คุณอาจต้องการดูสิ่งที่เปลี่ยนไป ใน "เกี่ยวกับ" ของ "ตัวเลือก" หมายเลขเวอร์ชันเชื่อมไปยังบันทึกการเปลี่ยนแปลง คุณยังกดหมายเลขเวอร์ชันในเมนูหลักเพื่อดูข้อมูลนี้ได้

Differences from Civilization V = ความแตกต่างจาก Civilization V
Production Focus\nIn Civilization V, the Food yield in a city is calculated first, then population grows by consuming stored food (growth), then production is calculated, and so on one by one the other stats are calculated. Thus, citizens can produce yields in the same turn as they are born. The city focus is set to Production to assign the newborn citizen to a hill so they'll contribute Production, and then manually reassigned to a growth tile on the next turn. Alternatively, you can set city focus to Gold (e.g. with Cerro de Potosi), Faith (e.g. with Mount Sinai) or whatever gains the most yields. In Unciv, citizens only start producing yields on the next turn, so you can ignore this whole concept. = เน้นการผลิต\nใน Civilization V จะคำนวณอาหารของเมืองก่อน แล้วประชากรเติบโตโดยใช้อาหารสะสม จากนั้นคำนวณการผลิตและค่าอื่นทีละอย่าง พลเมืองจึงให้ผลผลิตได้ในเทิร์นที่เกิด คุณอาจตั้งเมืองให้เน้นการผลิตเพื่อส่งพลเมืองใหม่ไปเนินเขาให้ผลิตทันที แล้วค่อยย้ายไปช่องอาหารในเทิร์นถัดไป หรือเน้นทองคำ (เช่น เซร์โรเดโปโตซี) ศรัทธา (เช่น ภูเขาซีนาย) หรือสิ่งที่ให้ผลผลิตสูงสุด ใน Unciv พลเมืองเริ่มให้ผลผลิตในเทิร์นถัดไป จึงไม่ต้องใช้วิธีนี้
Science Queueing\nIn Civilization V, Science yield is calculated after production, so if you finish an item and have Science (or Gold) queued as a perpetual construction, the Production overflow from item will be converted into Science (or Gold), but the Production is not consumed, as this will only happen again on the next turn. By immediately swapping out your perpetual construction for an item on the next turn, you'll get this Science (or Gold) for free. This doesn't apply to Unciv, so don't bother. = จัดคิววิทยาศาสตร์\nใน Civilization V จะคำนวณวิทยาศาสตร์หลังการผลิต ดังนั้นหากสร้างรายการหนึ่งเสร็จและมีโครงการวิทยาศาสตร์ (หรือทองคำ) แบบต่อเนื่องอยู่ถัดไปในคิว การผลิตที่ล้นมาจะถูกแปลงเป็นวิทยาศาสตร์ (หรือทองคำ) แต่การผลิตจะยังไม่ถูกใช้จนถึงเทิร์นถัดไป หากเปลี่ยนโครงการต่อเนื่องเป็นรายการอื่นทันทีในเทิร์นถัดไป คุณจะได้วิทยาศาสตร์ (หรือทองคำ) นี้ฟรี วิธีนี้ใช้ไม่ได้ใน Unciv จึงไม่ต้องทำ
Double Aqueducts\nIn Civilization V, the game sells existing copies of the building for you before providing a free copy of the building. So, if you build an aqueduct in a city, and then in the turn of adopting Tradition Complete you sell a cheap building (e.g a shrine) beforehand, the game is unable to sell more than 1 building per turn, and thus you'll keep your aqueduct, together with the new free aqueduct. Not applicable to Unciv. = ท่อส่งน้ำสองแห่ง\nใน Civilization V เกมจะขายสิ่งปลูกสร้างเดิมก่อนมอบสิ่งปลูกสร้างชนิดเดียวกันให้ฟรี หากสร้างท่อส่งน้ำไว้แล้ว และในเทิร์นที่รับนโยบายจารีตครบ คุณขายสิ่งปลูกสร้างราคาถูก (เช่น ศาลเจ้า) ก่อน เกมจะขายมากกว่า 1 สิ่งปลูกสร้างต่อเทิร์นไม่ได้ จึงเก็บท่อส่งน้ำเดิมไว้ได้พร้อมท่อส่งน้ำฟรีใหม่ วิธีนี้ใช้ไม่ได้ใน Unciv
Legalism Oxford\nIn Civilization V, national wonders such as Oxford University are considered culture buildings, so you can get them for free with Legalism. Not applicable to Unciv. = ออกซฟอร์ดจากนิตินิยม\nใน Civilization V สิ่งมหัศจรรย์แห่งชาติ เช่น มหาวิทยาลัยออกซฟอร์ด นับเป็นสิ่งปลูกสร้างวัฒนธรรม จึงรับฟรีจากนโยบายนิตินิยมได้ วิธีนี้ใช้ไม่ได้ใน Unciv
Roads and Forts\nIn Civilization V, you can't use roads and forts in enemy territory. In Unciv, you can use them, so instead of mindlessly constructing them everywhere when at war, you need to decide if and when they'll benefit you more than your opponents. = ถนนและป้อม\nใน Civilization V คุณใช้ถนนและป้อมในดินแดนศัตรูไม่ได้ แต่ใน Unciv ใช้ได้ ดังนั้นแทนที่จะสร้างทุกแห่งโดยไม่คิดในสงคราม คุณต้องพิจารณาว่าจะเป็นประโยชน์แก่คุณมากกว่าศัตรูหรือไม่และเมื่อใด
Citizen Conversion\nIn Civilization V, a citizen is born religious if the parent city is already converted. This is not the case in Unciv, which can lead to temporary deconversion of a city when it grows. = ศาสนาของพลเมืองใหม่\nใน Civilization V พลเมืองที่เกิดใหม่จะนับถือศาสนาหากเมืองนับถือศาสนาแล้ว แต่ Unciv ไม่เป็นเช่นนั้น เมืองจึงอาจเสียสถานะนับถือศาสนาชั่วคราวเมื่อเติบโต
Unassigned Citizens\nIn Civilization V, unassigned citizens are considered specialists, and subject to the same type of bonuses (e.g. Korea's ability). It can be worthwhile to leave citizens unassigned, instead of being assigned to a tile. Not applicable to Unciv. = พลเมืองที่ไม่ได้มอบหมายงาน\nใน Civilization V พลเมืองที่ไม่ได้มอบหมายงานถือเป็นผู้เชี่ยวชาญและได้โบนัสแบบเดียวกัน (เช่น ความสามารถของเกาหลี) บางครั้งจึงคุ้มกว่าจะไม่ส่งพลเมืองไปทำงานบนช่อง วิธีนี้ใช้ไม่ได้ใน Unciv
Settler Construction\nIn Civilization V, cities can't starve when constructing settlers, so you can assign all citizens to production tiles and none to food tiles. In Unciv, citizens keep consuming two food per turn. = การสร้างผู้ตั้งถิ่นฐาน\nใน Civilization V เมืองจะไม่อดอยากขณะสร้างผู้ตั้งถิ่นฐาน คุณจึงส่งพลเมืองทั้งหมดไปช่องการผลิตแทนช่องอาหารได้ แต่ใน Unciv พลเมืองยังใช้อาหารสองหน่วยต่อเทิร์น
Water Melee Attack\nAs result of a Discord poll, Water Melee units can attack military land units on the shore, unlike in Civilization V. = การโจมตีประชิดจากน้ำ\nจากผลสำรวจใน Discord ยูนิตเรือระยะประชิดโจมตียูนิตทหารบกบนชายฝั่งได้ ต่างจาก Civilization V
Tile improvements\nIn Civilzation V, workers start working on an improvement-under-construction at the beginning of movement. Unciv changes this, to allow players to assign workers to tiles, and then reconsider and change improvement or move them elsewhere. = สิ่งปรับปรุงช่องแผนที่\nใน Civilization V คนงานเริ่มทำงานกับสิ่งปรับปรุงที่อยู่ระหว่างก่อสร้างตั้งแต่ต้นการเคลื่อนที่ Unciv เปลี่ยนพฤติกรรมนี้ เพื่อให้ผู้เล่นส่งคนงานไปช่องต่าง ๆ แล้วพิจารณาใหม่ เปลี่ยนสิ่งปรับปรุง หรือย้ายไปที่อื่นได้
Forest and Jungle Visibility\nIn Unciv, forests and jungles are visible 1 tile outside visibility range. In Civilization V, this is the behaviour of hills and mountains, but not of forests and jungles, yet jungle and forest can block hills, and hill + forest can block mountain, indicating they're on the same elevation. This is considered to be a bug in the otherwise well-structured visibility logic in Civilization V. = ทัศนวิสัยของป่าและป่าดงดิบ\nใน Unciv มองเห็นป่าและป่าดงดิบได้ไกลเกินระยะมองเห็น 1 ช่อง ใน Civilization V พฤติกรรมนี้ใช้กับเนินเขาและภูเขา แต่ไม่ใช้กับป่าและป่าดงดิบ ทั้งที่ป่าและป่าดงดิบบังเนินเขาได้ และเนินเขารวมกับป่าบังภูเขาได้ ซึ่งบ่งชี้ว่ามีระดับความสูงเท่ากัน นี่ถือเป็นข้อบกพร่องในตรรกะการมองเห็นของ Civilization V ที่ส่วนอื่นจัดวางไว้อย่างดี
City razing\nIn Civilization V, the player can never raze any of the cities he/she founded. Not applicable to Unciv. = การเผาทำลายเมือง\nใน Civilization V ผู้เล่นเผาทำลายเมืองที่ตนก่อตั้งเองไม่ได้เลย แต่ข้อจำกัดนี้ไม่มีใน Unciv

Founding Cities\nThe Settler is a unit that can found a new city. You can build a Settler unit in a city with at least 2 population, and then move them to a good location to found a new city. This will usually be your main way of acquiring more cities. = การก่อตั้งเมือง\nผู้ตั้งถิ่นฐานเป็นยูนิตที่ก่อตั้งเมืองใหม่ได้ คุณสร้างผู้ตั้งถิ่นฐานในเมืองที่มีประชากรอย่างน้อย 2 คน แล้วส่งไปทำเลที่ดีเพื่อก่อตั้งเมืองใหม่ วิธีนี้มักเป็นหนทางหลักในการเพิ่มเมืองของคุณ
Food conversion to Production\nDuring the construction of a Settler, the city will not grow. Instead, the 1st, 2nd, 4th, and from there on every 4th, excess Food (Growth) is converted into Production, with the rest of the excess Food being lost. = การแปลงอาหารเป็นการผลิต\nในระหว่างการก่อสร้าง Settler เมืองจะไม่เติบโต ในทางกลับกัน อาหารส่วนเกิน (การเติบโต) จะถูกแปลงเป็นการผลิตในวันที่ 1, 2, 4 และทุกๆ 4 วัน

Default Promotions = การเลื่อนขั้นเริ่มต้น
Allow the player to apply a set of promotions when a unit is built. = ให้ผู้เล่นกำหนดชุดการเลื่อนขั้นที่จะใช้เมื่อสร้างยูนิต
