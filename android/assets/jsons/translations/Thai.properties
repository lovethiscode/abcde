Ramesses II = รามเสสที่สอง
You are but a pest on this Earth, prepare to be eliminated! = ท่านเป็นเพียงแมลงร้ายบนโลก จงเตรียมถูกกำจัด!
You are a fool who evokes pity. You have brought my hostility upon yourself and your repulsive civilization! = ท่านเป็นคนโง่ที่น่าสมเพช ท่านนำความเป็นศัตรูของข้ามาสู่ตัวเองและอารยธรรมอันน่ารังเกียจของท่าน!
Strike me down and my soul will torment yours forever, you have won nothing. = โค่นข้าเสีย แล้ววิญญาณข้าจะทรมานท่านตลอดกาล ท่านไม่ได้ชนะอะไรเลย
