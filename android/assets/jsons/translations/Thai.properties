Greetings to the wise and brave Prince William of Orange, who freed the Netherlands and gave strength to the Dutch people. In 1568, you led a rebellion against Spanish dominion, to gain freedom for your people, and therefore starting the Eighty Years' War. Your actions were all aimed to create one of Europe's first modern republics, the Seven United Provinces. The rebellion was the meaning of your very life and death, as it was also the cause of your assassination in 1584. But your death has given even more pride and courage to your people, to fight for liberty against any oppressors. Carved in history as the 'Father of the Fatherland', your name is a symbol of Dutch independence for eternity. = ขอคารวะเจ้าชายวิลเลียมแห่งออเรนจ์ผู้ทรงปัญญาและกล้าหาญ ผู้ปลดปล่อยเนเธอร์แลนด์และเสริมพลังชาวดัตช์ ในปี 1568 ท่านนำการกบฏต่อสเปนเพื่อเสรีภาพ เปิดสงครามแปดสิบปี ทุกการกระทำมุ่งสร้างสาธารณรัฐสมัยใหม่แห่งแรก ๆ ของยุโรป คือเจ็ดมณฑลรวม การกบฏเป็นความหมายแห่งชีวิตและความตาย และเป็นเหตุให้ท่านถูกลอบสังหารในปี 1584 แต่ความตายกลับเพิ่มความภูมิใจและกล้าแก่ประชาชนให้สู้ผู้กดขี่เพื่อเสรีภาพ ประวัติศาสตร์จารึกท่านเป็น ‘บิดาแห่งมาตุภูมิ’ ชื่อท่านคือสัญลักษณ์เอกราชดัตช์ชั่วนิรันดร์
Brave Prince, your people ask for your wisdom to gain its freedom once more, and to illuminate the world with progressive and modern ideas. Will your new empire shine through the ages of history? = เจ้าชายผู้กล้า ประชาชนขอปัญญาจากท่านเพื่ออิสรภาพอีกครั้ง และส่องโลกด้วยแนวคิดก้าวหน้าทันสมัย จักรวรรดิใหม่ของท่านจะส่องประกายผ่านยุคสมัยแห่งประวัติศาสตร์หรือไม่?
