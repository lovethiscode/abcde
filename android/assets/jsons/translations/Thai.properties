From the magnificence of Topkapi, the Ottoman nation greets you, stranger! I'm Suleiman, Kayser-I Rum, and I bestow upon you my welcome! = จากความโอ่อ่าแห่งทอปกาปี ชาติออตโตมันขอต้อนรับคนแปลกหน้า! ข้าคือสุลัยมาน ซีซาร์แห่งโรม และข้าขอต้อนรับท่าน!
Let us do business! Would you be interested? = เรามาค้าขายกัน! ท่านสนใจหรือไม่?
Barbary Corsairs = โจรสลัดบาร์บารี
O Great Sultan Suleiman, may the God bless you! You are revered for your power, wealth and generosity, and you truly deserves to be called the 'Magnificent'! The Ottoman Empire was born in Bithynia, starting as a small country in Eastern Anatolia in 12th century, then expanded to west into Anatolia. Over the next century, your people vanquished the empire of Byzantium, annexing Turkey and the Balkans, and smartly assimilating all wonders and knowledge of the Byzantine civilization. In the mid 15th century, the Ottomans added Constantinople to their empire, establishing a strategic link between Europe and the Middle East. The Empire would continue to expand for centuries reaching North Africa, Middle East and Eastern Europe at its height, but brutally disappeared in the chaos of the first world war, in early 20th century. = สุลต่านสุลัยมานผู้ยิ่งใหญ่ ขอพระเจ้าประทานพร! ท่านได้รับการเคารพด้านอำนาจ ความมั่งคั่ง และความใจกว้าง สมฉายา ‘ผู้เกรียงไกร’! จักรวรรดิออตโตมันถือกำเนิดในบิทิเนีย เริ่มเป็นรัฐเล็กในอนาโตเลียตะวันออกในศตวรรษที่ 12 แล้วขยายไปทางตะวันตกในอนาโตเลีย ศตวรรษถัดมา ประชาชนของท่านปราบจักรวรรดิไบแซนไทน์ ผนวกตุรกีและบอลข่าน พร้อมรับสิ่งมหัศจรรย์และความรู้ของไบแซนไทน์อย่างชาญฉลาด กลางศตวรรษที่ 15 ออตโตมันยึดคอนสแตนติโนเปิล สร้างจุดเชื่อมยุทธศาสตร์ระหว่างยุโรปกับตะวันออกกลาง จักรวรรดิขยายต่อหลายศตวรรษ สูงสุดถึงแอฟริกาเหนือ ตะวันออกกลาง และยุโรปตะวันออก แต่สูญสลายอย่างรุนแรงในความวุ่นวายของสงครามโลกครั้งแรก ต้นศตวรรษที่ 20
Mighty Caliph, your people ask you to build again the Empire, to the level of power and glory it once achieved, and beyond! Will you revive the Ottoman golden age? Will your new empire shine through the ages of history? = เคาะลีฟะฮ์ผู้ทรงอำนาจ ประชาชนขอให้ท่านสร้างจักรวรรดิขึ้นใหม่ให้ทรงพลังและรุ่งเรืองเท่าเดิมหรือยิ่งกว่า! ท่านจะฟื้นยุคทองออตโตมันหรือไม่? จักรวรรดิใหม่ของท่านจะส่องประกายผ่านยุคสมัยแห่งประวัติศาสตร์หรือไม่?
