Dido = ดีโด
Tell me, do you all know how numerous my armies, elephants and the gdadons are? No? Today, you shall find out! = บอกข้า ท่านรู้หรือไม่ว่ากองทัพ ช้าง และกดาดอนของข้ามีมากเพียงใด? ไม่รู้หรือ? วันนี้จะได้รู้!
Fate is against you. You earned the animosity of Carthage in your exploration. Your days are numbered. = ชะตาต้านท่าน การสำรวจทำให้ท่านได้ความเป็นศัตรูจากคาร์เธจ วันเวลาท่านเหลือน้อยแล้ว
The fates became to hate me. This is it? You wouldn't destroy us so without their help. = เหล่าเทพชะตาเกลียดข้าแล้ว นี่จบหรือ? หากไร้ความช่วยเหลือของพวกเขา ท่านคงทำลายเราไม่ได้
You aren't meeting my expectations. You can do so much better. = ท่านยังไม่เป็นอย่างที่ข้าคาดหวัง ท่านทำได้ดีกว่านี้มาก
The Phoenicians welcome you to this most pleasant kingdom. I am Dido, the queen of Carthage and all that belongs to it. = ชาวฟินิเชียขอต้อนรับสู่อาณาจักรแสนรื่นรมย์ ข้าคือดีโด ราชินีแห่งคาร์เธจและทุกสิ่งที่อยู่ใต้อำนาจ
I just had the marvelous idea, and I think you'll appreciate it too. = ข้าเพิ่งมีความคิดวิเศษ และคิดว่าท่านจะชอบเช่นกัน
What is it now? = คราวนี้อะไรอีก?
Phoenician Heritage = มรดกฟินิเชีย
Greetings to you, revered Queen Dido, ruler of the legendary kingdom of Carthage. The great poet Virgil related your great history, how your husband Acerbas was murdered by your own brother, King Pygmalion of Tyre, to steal the treasures of your family that were rightfully yours. But you endured his pressure until you and your compatriots decided to flee and sail for new lands. The gods led you to the shores of North Africa, and with cunning diplomacy, you expanded the territory of your new home, and laid the basis for the future kingdom of Carthage. = ขอคารวะราชินีดีโดผู้เป็นที่เคารพ ผู้ครองคาร์เธจในตำนาน มหากวีเวอร์จิลเล่าประวัติท่านว่า อาเซอร์บัส พระสวามี ถูกพระเจ้าพิกมาเลียนแห่งไทร์ พระเชษฐาของท่านสังหาร เพื่อขโมยทรัพย์ครอบครัวที่เป็นสิทธิของท่าน แต่ท่านทนแรงกดดันจนตัดสินใจพาพวกพ้องหนีลงเรือหาดินแดนใหม่ เหล่าเทพนำสู่ชายฝั่งแอฟริกาเหนือ และด้วยการทูตแยบยล ท่านขยายบ้านใหม่ วางรากฐานคาร์เธจในอนาคต
Clever and proud Dido, the storm is coming and your people look for a shelter under your wise and powerful protection. Can you create a new and radiant Carthage able to cleave the darkness? Will your new empire shine through the ages of history? = ดีโดผู้ฉลาดและภาคภูมิ พายุกำลังมา ประชาชนแสวงหาที่หลบใต้การคุ้มครองอันชาญฉลาดทรงพลัง ท่านจะสร้างคาร์เธจใหม่อันเจิดจรัสให้แหวกความมืดได้หรือไม่? จักรวรรดิใหม่ของท่านจะส่องประกายผ่านยุคสมัยแห่งประวัติศาสตร์หรือไม่?
