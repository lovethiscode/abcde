# Capturing a city

What would you like to do with the city of [cityName]? = คุณต้องการจัดการเมือง [cityName] อย่างไร?
Annex = ผนวก
Annexed cities become part of your regular empire. = เมืองที่ผนวกจะเป็นส่วนปกติของจักรวรรดิ
Their citizens generate 2x the unhappiness, unless you build a courthouse. = พลเมืองจะสร้างความทุกข์ 2 เท่า เว้นแต่คุณสร้างศาล
Your civilization may not annex this city. = อารยธรรมของคุณผนวกเมืองนี้ไม่ได้
Puppet = ตั้งหุ่นเชิด
Puppeted cities do not increase your tech or policy cost. = เมืองหุ่นเชิดไม่เพิ่มค่าวิจัยเทคโนโลยีหรือค่านโยบาย
You have no control over the the production of puppeted cities. = คุณควบคุมการผลิตของเมืองหุ่นเชิดไม่ได้
