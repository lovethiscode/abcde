Curious. = น่าสนใจ
Hello, I am Mohandas Gandhi. My people call me Bapu, but please, call me friend. = สวัสดี ข้าคือโมฮันดาส คานธี ประชาชนเรียกข้าว่าบาปู แต่ขอให้ท่านเรียกข้าว่าสหาย
My friend, are you interested in this arrangement? = สหาย ท่านสนใจข้อตกลงนี้หรือไม่?
I wish you peace. = ข้าขอให้ท่านมีสันติ
Population Growth = การเติบโตของประชากร
Wise Mahatma Gandhi, great leader of India, we honor you! India is one of the oldest countries in the world with 10,000 years of history, built on spirit and religion, as three of the world's great religions - Hinduism, Buddhism and Jainism - appeared on this sacred land. Every aspect of India society reveres art, music and color, showing great wealth but also grinding poverty. For centuries, India was torn between local kingdoms fighting each other but also repelling invaders. In the 12th century AD, Muslim Turks tried to conquer India, then the Mongols took their place. In the early 17th century, India, still fragmented, was colonized by the English and their diplomacy and technological superiority. After two centuries of British dominion, Indian nationalism woke up, and you, Great Mahatma, have led a peaceful and victorious rebellion never seen anywhere in history! = มหาตมาคานธีผู้ทรงปัญญา ผู้นำยิ่งใหญ่แห่งอินเดีย เราขอคารวะ! อินเดียเป็นหนึ่งในประเทศเก่าแก่ที่สุด มีประวัติศาสตร์ 10,000 ปี ตั้งอยู่บนจิตวิญญาณและศาสนา ศาสนาใหญ่สามศาสนา คือฮินดู พุทธ และเชน ล้วนถือกำเนิดบนแผ่นดินศักดิ์สิทธิ์นี้ ทุกด้านของสังคมยกย่องศิลปะ ดนตรี และสีสัน แสดงทั้งความมั่งคั่งและความยากจนแสนสาหัส หลายศตวรรษอินเดียแตกเป็นอาณาจักรท้องถิ่นที่รบกันและต่อต้านผู้รุกราน ในคริสต์ศตวรรษที่ 12 ชาวเติร์กมุสลิมพยายามพิชิตอินเดีย แล้วมองโกลก็เข้ามาแทน ต้นศตวรรษที่ 17 อินเดียที่ยังแตกแยกตกเป็นอาณานิคมอังกฤษด้วยการทูตและเทคโนโลยีที่เหนือกว่า หลังอยู่ใต้อังกฤษสองศตวรรษ ชาตินิยมอินเดียตื่นขึ้น และท่านมหาตมานำการลุกฮืออย่างสันติจนมีชัยอย่างที่ไม่เคยมีในประวัติศาสตร์!
Gandhi, your people ask again to be led on the path of freedom. Under protection of Ganesha and Surya, can India accomplish its great potential? Will your new empire shine through the ages of history? = คานธี ประชาชนขอให้ท่านนำทางสู่อิสรภาพอีกครั้ง ภายใต้การคุ้มครองของพระพิฆเนศและพระสุริยะ อินเดียจะบรรลุศักยภาพอันยิ่งใหญ่ได้หรือไม่? จักรวรรดิใหม่ของท่านจะส่องประกายผ่านยุคสมัยแห่งประวัติศาสตร์หรือไม่?
