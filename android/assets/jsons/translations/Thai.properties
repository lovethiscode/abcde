Heaven itself bends before your beauty, Empress Wu Zetian, ruler of eternal China! You lead one of the oldest and greatest civilization of humanity. In your time, China stood at the forefront of science and technology, bringing the world such contributions as gunpowder, the printing press, and the world of Confucius, and this, long before the rest of the world was mature enough to make the same discoveries! = แม้สวรรค์ยังน้อมต่อความงามของท่าน จักรพรรดินีบูเช็กเทียน ผู้ปกครองจีนอันเป็นนิรันดร์! ท่านนำอารยธรรมที่เก่าแก่และยิ่งใหญ่ที่สุดอารยธรรมหนึ่งของมนุษย์ ในสมัยของท่าน จีนอยู่แนวหน้าด้านวิทยาศาสตร์และเทคโนโลยี มอบดินปืน แท่นพิมพ์ และโลกแห่งคำสอนขงจื๊อให้โลก นานก่อนที่ส่วนอื่นของโลกจะพร้อมค้นพบเช่นเดียวกัน!
