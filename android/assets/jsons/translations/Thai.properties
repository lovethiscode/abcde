Shame that it has come this far. But ye wished it so. Next time, be so good, choose your words more wisely. = น่าเสียดายที่มาถึงขั้นนี้ แต่ท่านต้องการเอง คราวหน้าโปรดเลือกคำพูดให้ฉลาดกว่านี้
What a fool ye are! Ye will end swiftly and miserably. = ท่านช่างโง่! ท่านจะจบอย่างรวดเร็วและน่าอนาถ
The world is pitiful! There's no beauty in it, no wisdom. I am almost glad to go. = โลกช่างน่าสมเพช! ไม่มีความงาม ไม่มีปัญญา ข้าแทบยินดีที่จะจากไป
The archduchess of Austria welcomes your Eminence to... Oh let's get this over with! I have a luncheon at four o'clock. = อาร์ชดัชเชสแห่งออสเตรียขอต้อนรับท่านสู่... เอาเถอะ รีบให้เสร็จ! ข้ามีนัดอาหารกลางวันตอนสี่โมง
I see you admire my new damask. Nobody should say that I am an unjust woman. Let's reach an agreement! = ข้าเห็นท่านชื่นชมผ้าดามัสก์ใหม่ ไม่มีใครควรพูดว่าข้าไม่ยุติธรรม มาตกลงกัน!
Oh, it's ye! = อ้อ ท่านเอง!
Diplomatic Marriage = อภิเษกทางการทูต
Noble and pious Queen Maria Theresa, Holy Roman Empress and sovereign of Austria, the people revere your grace. After the death of your father King Charles VI, you inherited the throne of Austria during difficult economic and military times. But you used your wisdom and unflinching determination to fend off your foes and resolve any obstacles to stability and prosperity. With your husband Francis Stephen at your side as co-ruler, you assured your place as Empress of the Holy Roman Empire. During your reign, you reformed Austria in several domains, as you gifted it with a powerful army, a stable economic model, and an improved educational system. = ราชินีมาเรีย เทเรซาผู้สูงศักดิ์และเคร่งศาสนา จักรพรรดินีโรมันอันศักดิ์สิทธิ์และผู้ครองออสเตรีย ประชาชนเคารพพระเมตตา หลังพระเจ้าชาร์ลส์ที่หก พระบิดาสิ้น ท่านสืบบัลลังก์ในยามเศรษฐกิจและทหารยากลำบาก แต่ใช้ปัญญาและความมุ่งมั่นไม่หวั่นไหวต้านศัตรูและขจัดอุปสรรคสู่ความมั่นคงรุ่งเรือง ฟรานซิส สตีเฟน พระสวามีร่วมปกครองเคียงข้าง ทำให้ฐานะจักรพรรดินีมั่นคง ในรัชสมัย ท่านปฏิรูปออสเตรียหลายด้าน มอบกองทัพเข้มแข็ง แบบจำลองเศรษฐกิจมั่นคง และระบบการศึกษาที่ดีขึ้น
O Great Queen, proud and dignified, by the will of God and the Divine right, can you reach the height of prosperity and splendor the kingdom of Austria deserves? Will your new empire shine through the ages of history? = มหาราชินีผู้ภาคภูมิและสง่างาม ด้วยพระประสงค์และเทวสิทธิ์ ท่านจะนำออสเตรียสู่ความรุ่งเรืองและโอ่อ่าที่สมควรได้หรือไม่? จักรวรรดิใหม่ของท่านจะส่องประกายผ่านยุคสมัยแห่งประวัติศาสตร์หรือไม่?
