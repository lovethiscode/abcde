#################### Lines from Events from Civ V - Gods & Kings ####################

Tutorial Task: [Move unit] = ภารกิจสอนเล่น: [Move unit]
Move a unit! = เคลื่อนพล!
Click on a unit → Click on a destination → Click the arrow popup. = แตะยูนิต → แตะจุดหมาย → แตะลูกศรที่ปรากฏ

Found a city! = ค้นพบเมือง!
Select the Settler → Click on 'Found city'. = เลือกผู้ตั้งถิ่นฐาน → แตะ ‘ตั้งเมือง’

Enter the city screen! = เข้าสู่หน้าจอเมือง!
Click the city button twice. = กดปุ่มรูปเมืองสองครั้ง

Pick a technology to research! = เลือกเทคโนโลยีในการวิจัย!
Click on the tech button → Select technology → Click 'Research' (bottom right). = แตะปุ่มเทคโนโลยี → เลือกเทคโนโลยี → แตะ ‘วิจัย’ ที่มุมขวาล่าง

Pick a construction! = เลือกสิ่งปลูกสร้าง!
Enter city screen → Click on a unit or building → Click 'add to queue'. = เข้าสู่หน้าจอเมือง → แตะยูนิตหรืออาคาร → แตะ ‘เพิ่มเข้าคิว’

Pass a turn! = ข้ามเทิร์น!
Cycle through units with 'Next unit' → Click 'Next turn'. = สลับยูนิตด้วย ‘ยูนิตถัดไป’ → แตะ ‘เทิร์นถัดไป’

Reassign worked tiles! = จัดช่องที่มีคนทำงานใหม่!
Enter city screen → Click the assigned tile to unassign → Click an unassigned tile to assign population. = เข้าสู่หน้าจอเมือง → แตะช่องที่มอบหมายแล้วเพื่อยกเลิก → แตะช่องที่ยังไม่มอบหมายเพื่อส่งประชากรไปทำงาน

 # Requires translation!
Got it = เข้าใจแล้ว
Meet another civilization! = พบอารยธรรมอื่น!
Explore the map until you encounter another civilization! = สำรวจแผนที่จนพบอารยธรรมอื่น!

Open the options dialog! = เปิดหน้าต่างตัวเลือก!
Click the menu button (top left) → Click 'Options'. = แตะปุ่มเมนูที่มุมซ้ายบน → แตะ ‘ตัวเลือก’

Construct an improvement! = สร้างสิ่งปรับปรุง!
Construct a Worker unit → Move it to a Plains or Grassland tile → Click 'Construct improvement' → Choose the farm → Leave the worker there until it's finished. = สร้างคนงาน → ย้ายไปช่องที่ราบหรือทุ่งหญ้า → แตะ ‘สร้างสิ่งปรับปรุง’ → เลือกไร่นา → ให้คนงานอยู่จนทำเสร็จ

Create a trade route! = สร้างเส้นทางการค้า!
Construct roads between your capital and another city. Or, automate your worker and let him get to that eventually. = สร้างถนนระหว่างเมืองหลวงกับอีกเมือง หรือสั่งคนงานอัตโนมัติแล้วปล่อยให้เขาทำในที่สุด

Conquer a city! = พิชิตเมือง!
Bring an enemy city down to low health → Enter the city with a melee unit. = ลดพลังชีวิตเมืองศัตรูให้ต่ำ → นำยูนิตประชิดเข้าเมือง

Move an air unit! = เคลื่อนพลอพลอากาศ!
Select an air unit → Select another city within range → Move the unit to the other city. = เลือกยูนิตอากาศ → เลือกอีกเมืองในระยะ → ย้ายยูนิตไปเมืองนั้น

See your stats breakdown! = ดูรายละเอียดค่าสถิติ!
Enter the Overview screen (top right corner) → Click on 'Stats'. = เข้าสู่หน้าจอภาพรวมที่มุมขวาบน → แตะ ‘ค่าสถิติ’


