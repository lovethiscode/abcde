Hiawatha = ไฮอะวาธา
You are a plague upon Mother Earth! Prepare for battle! = ท่านเป็นภัยพิบัติต่อพระแม่ธรณี! เตรียมรบ!
You evil creature! My braves will slaughter you! = สิ่งชั่วร้าย! นักรบของข้าจะสังหารท่าน!
You have defeated us... but our spirits will never be vanquished! We shall return! = ท่านเอาชนะเราแล้ว... แต่จิตวิญญาณเราจะไม่มีวันพ่าย! เราจะกลับมา!
Words alone cannot shake the roots of peace I have planted among my people. = คำพูดล้วน ๆ ไม่อาจสั่นคลอนรากแห่งสันติที่ข้าปลูกไว้ในหมู่ประชาชน
Greetings, stranger. I am Hiawatha, speaker for the Iroquois. We seek peace with all, but we do not shrink from war. = สวัสดีคนแปลกหน้า ข้าคือไฮอะวาธา ผู้พูดแทนอิโรควัวส์ เราแสวงหาสันติกับทุกคน แต่ไม่หนีสงคราม
Does this trade work for you, my friend? = การค้านี้เหมาะกับท่านหรือไม่ สหาย?
The Great Warpath = เส้นทางศึกอันยิ่งใหญ่
Greetings, noble Hiawatha, leader of the mighty Iroquois nations! Your people lived near the great and holy lake Ontario since the ancient ages, on a land that will be later known as New York city. Long ago, the five peoples of Seneca, Onondaga, Mohawks, Cayugas and Oneida became one nation, the Haudenosaunee, the Iroquois. Although not having a written language, the wise Iroquois created the Great Law of Peace, which can be considered the first established constitution. For decades, your people fought powerful enemies, such as the Huron, and then the French and English colonists. With less warriors and inferior weaponry, the Iroquois still survived and walk on the path of peace and harmony, until their way of living faded away under the crush of the newborn United States nation. = ขอคารวะไฮอะวาธาผู้สูงศักดิ์ ผู้นำชนชาติอิโรควัวส์อันเกรียงไกร! ประชาชนอาศัยใกล้ทะเลสาบออนแทรีโออันใหญ่และศักดิ์สิทธิ์มาตั้งแต่โบราณ บนดินแดนที่จะรู้จักภายหลังว่านครนิวยอร์ก นานมาแล้ว เซเนกา โอนอนดากา โมฮอว์ก คายูกา และโอไนดารวมเป็นชาติเดียว คือเฮาเดโนโชนีหรืออิโรควัวส์ แม้ไร้อักษร ปราชญ์อิโรควัวส์สร้างมหากฎแห่งสันติที่ถือได้ว่าเป็นรัฐธรรมนูญฉบับแรก หลายทศวรรษประชาชนรบกับศัตรูทรงอำนาจ เช่น ฮูรอน แล้วต่อสู้ชาวอาณานิคมฝรั่งเศสและอังกฤษ แม้นักรบน้อยและอาวุธด้อยกว่า อิโรควัวส์ยังอยู่รอดบนทางแห่งสันติและสามัคคี จนวิถีชีวิตเลือนหายใต้แรงบดขยี้ของสหรัฐอเมริกาที่เกิดใหม่
Great Sachem Hiawatha, do you hear the complaints of your people? Can you light the path leading to the ancient Iroquois union? Will your new empire shine through the ages of history? = หัวหน้าไฮอะวาธาผู้ยิ่งใหญ่ ท่านได้ยินเสียงทุกข์ของประชาชนหรือไม่? ท่านจะส่องทางไปสู่สหภาพอิโรควัวส์โบราณได้หรือไม่? จักรวรรดิใหม่ของท่านจะส่องประกายผ่านยุคสมัยแห่งประวัติศาสตร์หรือไม่?
