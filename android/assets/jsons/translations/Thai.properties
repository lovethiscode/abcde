All hail Great King Gustavus Adolphus, founder of the Swedish Empire, and one of the most famous military tacticians. In the early 17th century, Sweden emerged as a great power in Europe under your reign, thanks to your wisdom, both in diplomacy and warfare. As king, you decided to reform Swedish laws to bring economic stability and prosperity to your people. Your allies, and also your enemies, called you the 'Lion of the North', witnessing your modern vision of warfare, and the prowess of your armies on the battlefield. As you triumphed in the Thirty Years' War, your name will be forever remembered as one of history's greatest generals. = ขอคารวะกษัตริย์กุสตาวัส อดอลฟัสผู้ยิ่งใหญ่ ผู้ก่อตั้งจักรวรรดิสวีเดนและหนึ่งในยอดนักยุทธวิธี ต้นศตวรรษที่ 17 สวีเดนขึ้นเป็นมหาอำนาจยุโรปใต้รัชสมัยด้วยปัญญาด้านการทูตและการรบ ท่านปฏิรูปกฎหมายเพื่อเศรษฐกิจมั่นคงและประชาชนรุ่งเรือง ทั้งมิตรและศัตรูเรียกท่านว่า ‘สิงโตแห่งเหนือ’ เมื่อเห็นวิสัยทัศน์การรบสมัยใหม่และฝีมือกองทัพ เมื่อมีชัยในสงครามสามสิบปี ชื่อท่านจะถูกจดจำเป็นแม่ทัพยิ่งใหญ่ที่สุดคนหนึ่งในประวัติศาสตร์
