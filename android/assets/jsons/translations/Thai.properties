You won't ever be able to bother me again. Go meet Yama. = ท่านจะไม่มีวันรบกวนข้าได้อีก จงไปพบพญายมเสีย
Fool! I will disembowel you all! = คนโง่! ข้าจะควักไส้พวกท่านให้หมด!
You have proven to be a cunning and competent adversary. I congratulate you on your victory. = ท่านพิสูจน์แล้วว่าเป็นคู่ต่อสู้ที่หลักแหลมและมีความสามารถ ข้าขอแสดงความยินดีกับชัยชนะของท่าน
Greetings, I am Empress Wu Zetian. China desires peace and development. You leave us alone, we'll leave you alone. = สวัสดี ข้าคือจักรพรรดินีบูเช็กเทียน จีนต้องการสันติภาพและการพัฒนา หากท่านไม่ยุ่งกับเรา เราก็จะไม่ยุ่งกับท่าน
