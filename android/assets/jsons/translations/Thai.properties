Kamehameha I = คาเมฮาเมฮาที่หนึ่ง
The ancient fire flashing across the sky is what proclaimed that this day would come, though I had foolishly hoped for a different outcome. = ไฟโบราณที่แลบผ่านฟากฟ้าบอกว่าวันนี้จะมาถึง แม้ข้าจะหวังอย่างโง่เขลาให้ผลต่างออกไป
It is obvious now that I misjudged you and your true intentions. = บัดนี้ชัดแล้วว่าข้าประเมินท่านและเจตนาที่แท้จริงผิดไป
The hard-shelled crab yields, and the lion lies down to sleep. Kanaloa comes for me now. = ปูกระดองแข็งยอมแพ้ และสิงโตเอนกายหลับ คานาโลอามารับข้าแล้ว
The ocean's tide may rise and fall, but my resolve stands steady. = น้ำขึ้นน้ำลงได้ แต่ปณิธานข้ามั่นคง
Aloha! Greetings and blessings upon you, friend. I am Kamehameha, Great King of this strand of islands. = อโลฮา! ขอทักทายและอวยพรท่าน สหาย ข้าคือคาเมฮาเมฮา มหาราชแห่งหมู่เกาะสายนี้
Come, let our people feast together! = มาเถิด ให้ประชาชนเราร่วมงานเลี้ยงกัน!
Welcome, friend! = ยินดีต้อนรับ สหาย!
Wayfinding = การนำทาง
Aloha to Kamehameha the Great, who the heavens allowed to unite your people! O great King, under your reign, the Big Island of Hawai'i became one in 1791 AD, and many other islands joined your vision of union in 1810. As the first King of Hawai'i, law and taxation systems were stabilized, and you promoted the Kanawai Mamalahoe, an edict to protect civilian people in times of war. Unification and sovereignty of all the islands continued thanks to your fair laws and deeds, even after you joined your ancestors in paradise in 1819. = อโลฮาแด่คาเมฮาเมฮามหาราช ผู้ที่สวรรค์ให้รวมประชาชนเป็นหนึ่ง! ใต้รัชสมัยท่าน เกาะใหญ่ฮาวายรวมเป็นหนึ่งในปี ค.ศ. 1791 และเกาะอื่นมากมายร่วมวิสัยทัศน์แห่งเอกภาพในปี 1810 ในฐานะกษัตริย์ฮาวายองค์แรก ท่านทำระบบกฎหมายและภาษีให้มั่นคง และส่งเสริมกฎหมายคานาวาอี มามาลาโฮเอเพื่อปกป้องพลเรือนยามสงคราม เอกภาพและอธิปไตยของหมู่เกาะดำรงต่อด้วยกฎหมายและการกระทำที่เป็นธรรม แม้หลังท่านไปอยู่กับบรรพชนในสวรรค์เมื่อปี 1819
Wise and benevolent King, will you unite your people once again by wearing the bright mantle of the Lion of the Pacific? Will your new empire shine through the ages of history? = กษัตริย์ผู้ทรงปัญญาและเมตตา ท่านจะสวมเสื้อคลุมอันเจิดจรัสแห่งสิงโตแปซิฟิกเพื่อรวมประชาชนอีกครั้งหรือไม่? จักรวรรดิใหม่ของท่านจะส่องประกายผ่านยุคสมัยแห่งประวัติศาสตร์หรือไม่?
