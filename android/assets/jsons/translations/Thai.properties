The day of judgement has come to us. But rest assured, the same will go for you! = วันพิพากษามาถึงเราแล้ว แต่วางใจเถิด ท่านก็จะพบเช่นเดียวกัน!
Helsinki = Helsinki

Ah, Gods! Why have you forsaken us? = โอ้ เหล่าเทพ! เหตุใดทอดทิ้งเรา?
Manila = Manila

Congratulations, conqueror. This tribe serves you now. = ยินดีด้วย ผู้พิชิต เผ่านี้รับใช้ท่านแล้ว
