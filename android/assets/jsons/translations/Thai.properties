Askia = อัสเกีย
You are an abomination to heaven and earth, the chief of ignorant savages! You must be destroyed! = ท่านเป็นสิ่งน่ารังเกียจต่อฟ้าและดิน เป็นหัวหน้าคนเถื่อนไร้ความรู้! ท่านต้องถูกทำลาย!
Fool! You have doomed your people to fire and destruction! = คนโง่! ท่านพาประชาชนไปสู่ไฟและความพินาศ!
We have been consumed by the fires of hatred and rage. Enjoy your victory in this world - you shall pay a heavy price in the next! = เราถูกไฟแห่งความเกลียดชังและโทสะเผาผลาญ จงชื่นชมชัยชนะในโลกนี้เถิด ท่านจะชดใช้อย่างหนักในโลกหน้า!
This insult shall cost you. = คำดูหมิ่นนี้จะทำให้ท่านต้องชดใช้
I am Askia of the Songhai. We are a fair people - but those who cross us will find only destruction. You would do well to avoid repeating the mistakes others have made in the past. = ข้าคืออัสเกียแห่งซองไฮ เราเป็นชนที่ยุติธรรม แต่ผู้ขวางเราจะพบเพียงความพินาศ ท่านควรหลีกเลี่ยงความผิดพลาดที่ผู้อื่นเคยทำ
Can I interest you in this deal? = ข้อตกลงนี้น่าสนใจสำหรับท่านหรือไม่?
River Warlord = ขุนศึกแห่งสายน้ำ
Askia, leader of the Songhai people and greatest of all, may God watch your path towards glory! Songhai was under the rule of the mighty West African state of Mali until the middle of the 14th century. Great King Sunni Ali Ber fought for independance, and showed to all Songhai's power, by conquering territories and repelling many foes who sought to destroy the rising kingdom. Ultimately, conquest of the wealthy cities of Timbuktu and Jenne made Songhai an empire with enough economic power to survive for a century, until the empire bowed down before foes with advanced technology - muskets against spearmen. = อัสเกีย ผู้นำชาวซองไฮผู้ยิ่งใหญ่ที่สุด ขอพระเจ้าคุ้มครองเส้นทางสู่เกียรติยศ! ซองไฮอยู่ใต้รัฐมาลีอันทรงพลังแห่งแอฟริกาตะวันตกจนกลางศตวรรษที่ 14 กษัตริย์ซุนนี อาลี แบร์ต่อสู้เพื่อเอกราช แสดงอำนาจด้วยการพิชิตดินแดนและผลักศัตรูที่มุ่งทำลายอาณาจักรใหม่ สุดท้าย การยึดเมืองมั่งคั่งอย่างทิมบักตูและเจนเนทำให้ซองไฮเป็นจักรวรรดิที่มีพลังเศรษฐกิจพอยืนยงหนึ่งศตวรรษ จนพ่ายศัตรูเทคโนโลยีเหนือกว่า เป็นปืนคาบศิลาต่อสู้พลหอก
King Askia, your people know there's still hope, that the hour of revenge is coming. Give them wealth and power, give them mighty weapons of iron and fire, to destroy any foe, for Songhai to revive! Will your new empire shine through the ages of history? = กษัตริย์อัสเกีย ประชาชนรู้ว่ายังมีหวังและเวลาล้างแค้นกำลังมา จงมอบทรัพย์และอำนาจ อาวุธเหล็กและไฟอันทรงพลัง เพื่อทำลายทุกศัตรูและฟื้นซองไฮ! จักรวรรดิใหม่ของท่านจะส่องประกายผ่านยุคสมัยแห่งประวัติศาสตร์หรือไม่?
