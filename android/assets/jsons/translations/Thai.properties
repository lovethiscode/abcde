Haile Selassie = ไฮเล เซลาสซี
I have tried all other avenues, but yet you persist in this madness. I hope, for your sake, your end is swift. = ข้าลองทุกทางแล้ว แต่ท่านยังบ้าคลั่งต่อไป เพื่อประโยชน์ของท่านเอง ข้าหวังว่าจุดจบจะรวดเร็ว
It is silence that allows evil to triumph. We will not stand mute and allow you to continue on this mad quest unchecked. = ความเงียบทำให้ความชั่วชนะ เราจะไม่เงียบปล่อยท่านทำภารกิจบ้าคลั่งต่อโดยไร้การยับยั้ง
God and history will remember your actions this day. I hope you are ready for your impending judgment. = พระเจ้าและประวัติศาสตร์จะจำการกระทำวันนี้ หวังว่าท่านพร้อมรับการพิพากษาที่กำลังมา
What a waste of time. = ช่างเสียเวลา
