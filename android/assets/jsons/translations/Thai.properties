Montezuma I = มอนเตซูมาที่หนึ่ง
Xi-miqa-can! Xi-miqa-can! Xi-miqa-can! (Die, die, die!) = Xi-miqa-can! Xi-miqa-can! Xi-miqa-can! (ตาย ตาย ตาย!)
Excellent! Let the blood flow in raging torrents! = ยอดเยี่ยม! ให้เลือดไหลเป็นกระแสเชี่ยว!
Monster! Who are you to destroy my greatness? = ปีศาจ! ท่านเป็นใครจึงมาทำลายความยิ่งใหญ่ของข้า?
What do I see before me? Another beating heart for my sacrificial fire. = ข้าเห็นสิ่งใดเบื้องหน้า? หัวใจที่ยังเต้นอีกดวงสำหรับไฟบูชายัญของข้า
Accept this agreement or suffer the consequences. = ยอมรับข้อตกลงนี้ หรือรับผลที่จะตามมา
Welcome, friend. = ยินดีต้อนรับ สหาย
Sacrificial Captives = เชลยบูชายัญ
O divine Montezuma, your people welcome you! May your magnificence inspire all living things! The mighty Aztecs were nomads until the 12th century, when they choose to settle in the mesa central, which would later be called Mexico. Wars were frequent with other tribes to control the rich land surrounding the sacred lakes of Texcoco, Xaltocan and Zampango. In some 200 years, double-sided alliances and martial prowess made of the Aztecs the dominant power in the Central American basin, forming a mighty empire stretching from sea to sea. Alas, the empire fell under the assault of foreign devils - the Spaniards and many curses they brought with them! Wars between tribes and weaponry of doom used by the invaders made the great Aztec civilization crumble in only a few decades. = มอนเตซูมาผู้เป็นดุจเทพ ประชาชนต้อนรับท่าน! ขอความยิ่งใหญ่ของท่านดลใจทุกชีวิต! ชาวแอซเท็กเคยเร่ร่อนจนศตวรรษที่ 12 จึงตั้งถิ่นฐานบนที่ราบสูงตอนกลางซึ่งต่อมาคือเม็กซิโก พวกเขารบกับเผ่าอื่นบ่อยเพื่อครองดินแดนอุดมรอบทะเลสาบศักดิ์สิทธิ์เตซโกโก ซัลโตกัน และซัมปังโก ในราว 200 ปี พันธมิตรที่เปลี่ยนฝ่ายและฝีมือรบทำให้แอซเท็กครองแอ่งอเมริกากลาง สร้างจักรวรรดิจากทะเลถึงทะเล อนิจจา จักรวรรดิพ่ายปีศาจต่างแดน คือชาวสเปนและคำสาปที่นำมา! สงครามระหว่างเผ่าและอาวุธล้างผลาญของผู้รุกรานทำให้อารยธรรมใหญ่ล่มสลายในไม่กี่ทศวรรษ
O mighty King Montezuma, do you hear the call of your people seeking for revenge? Will you lead them to victory under the light of the Five Suns? Will your new empire shine through the ages of history? = กษัตริย์มอนเตซูมาผู้ทรงอำนาจ ท่านได้ยินประชาชนเรียกร้องการล้างแค้นหรือไม่? ท่านจะนำพวกเขาสู่ชัยชนะใต้แสงแห่งดวงอาทิตย์ทั้งห้าหรือไม่? จักรวรรดิใหม่ของท่านจะส่องประกายผ่านยุคสมัยแห่งประวัติศาสตร์หรือไม่?
