#################### Lines from VictoryTypes from Civ V - Vanilla ####################

Complete all the spaceship parts to win! = สร้างชิ้นส่วนยานอวกาศทั้งหมดเพื่อชนะ!
spaceship parts = ชิ้นส่วนยานอวกาศ
You have achieved victory through mastery of Science! You have conquered the mysteries of nature and led your people on a voyage to a brave new world! Your triumph will be remembered as long as the stars burn in the night sky! = ท่านคว้าชัยด้วยความเชี่ยวชาญทางวิทยาศาสตร์! ท่านไขความลับธรรมชาติและนำประชาชนเดินทางสู่โลกใหม่อันกล้าหาญ! ชัยชนะนี้จะถูกจดจำตราบที่ดวงดาวยังส่องในท้องฟ้าราตรี!

Complete 5 policy branches and build the Utopia Project to win! = รับนโยบายครบ 5 สาขาและสร้างโครงการยูโทเปียเพื่อชนะ!
You have achieved victory through the awesome power of your Culture. Your civilization's greatness - the magnificence of its monuments and the power of its artists - have astounded the world! Poets will honor you as long as beauty brings gladness to a weary heart. = ท่านคว้าชัยด้วยพลังวัฒนธรรมอันยิ่งใหญ่ ความรุ่งเรืองของอารยธรรม ทั้งอนุสรณ์อันโอ่อ่าและพลังศิลปิน ทำให้โลกตื่นตะลึง! กวีจะยกย่องท่านตราบที่ความงามยังนำความสุขสู่ใจอันเหนื่อยล้า

Capture all enemy Capitals to win! = ยึดเมืองหลวงศัตรูทั้งหมดเพื่อชนะ!
The world has been convulsed by war. Many great and powerful civilizations have fallen, but you have survived - and emerged victorious! The world will long remember your glorious triumph! = โลกสั่นสะเทือนด้วยสงคราม อารยธรรมยิ่งใหญ่และทรงพลังมากมายล่มสลาย แต่ท่านอยู่รอดและมีชัย! โลกจะจดจำชัยชนะอันรุ่งโรจน์นี้ไปอีกนาน!

Build the UN and be voted world leader to win! = สร้างสหประชาชาติและได้รับเลือกเป็นผู้นำโลกเพื่อชนะ!
Anyone should build [buildingFilter] = ผู้ใดก็ได้ต้องสร้าง [buildingFilter]
Win diplomatic vote = ชนะการลงคะแนนทางการทูต
You have triumphed over your foes through the art of diplomacy! Your cunning and wisdom have earned you great friends - and divided and sown confusion among your enemies! Forever will you be remembered as the leader who brought peace to this weary world! = ท่านมีชัยเหนือศัตรูด้วยศิลปะการทูต! ความหลักแหลมและปัญญาทำให้ได้มิตรผู้ยิ่งใหญ่ และแบ่งแยกสร้างความสับสนแก่ศัตรู! ท่านจะถูกจดจำตลอดไปว่าเป็นผู้นำที่นำสันติสู่โลกอันเหนื่อยล้า!

Do things to win! = ทำสิ่งต่าง ๆ เพื่อชนะ!
Have highest score after max turns = มีคะแนนสูงสุดเมื่อครบจำนวนเทิร์นสูงสุด


