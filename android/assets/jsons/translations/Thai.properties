To disable default promotions for a unit, uncheck 'Use default promotions' under the buy button for the unit. = หากต้องการปิดการเลื่อนขั้นเริ่มต้นสำหรับยูนิต ให้ยกเลิก 'ใช้การเลื่อนขั้นเริ่มต้น' ใต้ปุ่มซื้อยูนิต
Default promotion only applies to the same units that you selected. It only applies per cities. It can't be used in puppeted cities or cities that you don't own. = 
If the city doesn't have enough XP it will not apply all the promotions. And default promotions doesn't affect the civ AI in anyway. = หากเมืองมี XP ไม่พอ จะไม่ได้รับการเลื่อนขั้นครบทั้งหมด และการเลื่อนขั้นเริ่มต้นไม่มีผลต่อ AI ของอารยธรรม
