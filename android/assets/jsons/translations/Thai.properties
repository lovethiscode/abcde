Oda Nobunaga = โอดะ โนบุนากะ
I hereby inform you of our intention to wipe out your civilization from this world. = ข้าขอแจ้งเจตนาของเราที่จะลบอารยธรรมของท่านออกจากโลกนี้
Pitiful fool! Now we shall destroy you! = ไอ้สารเลว! บัดนี้ดาบของข้าจะบั่นหัวเจ้า!
You were much wiser than I thought. = ฉลาดกว่าที่คิดหนิ.
I expected more for you from. = ข้าเคยคาดหวังจากท่านมากกว่านี้
We hope for a fair and just relationship with you, who are renowned for military bravery. = เราหวังจะมีความสัมพันธ์ที่เป็นธรรมและเที่ยงตรงกับท่าน ผู้ขึ้นชื่อด้านความกล้าหาญในการรบ
I would be grateful if you agreed on the following proposal. = จะเป็นเกียรติอย่างยิ่งหากท่านตอบรับคำเสนอของข้า
Oh, it's you... = แกอีกแล้วเรอะ...
Bushido = บูชิโด
Lord Oda Nobunaga, ruler of Japan, the land of the Rising Sun is at your command! Through history, Japanese people lived and died with honor, proud of their rich culture of arts and letters. Years of bloody civil wars, invasions of foreign powers, wealth but also great poverty, have never altered the strong will of the Rising Sun island, as the Bushido spirit has imbued the fields of battle and the Japanese society for millenia. At the end of the 19th century, under foreign influence, your people took the path of modernity, and in a few decades, made of Japan a land of technological innovation and powerful industry, with which only few nations can compete. = ท่านโอดะ โนบุนางะ ผู้ปกครองญี่ปุ่น ดินแดนอาทิตย์อุทัยอยู่ในบัญชาท่าน! ตลอดประวัติศาสตร์ ชาวญี่ปุ่นอยู่และตายอย่างมีเกียรติ ภาคภูมิในวัฒนธรรมศิลปะและอักษรอันมั่งคั่ง สงครามกลางเมืองนองเลือด การรุกรานจากต่างชาติ ความมั่งคั่งและความยากจน ไม่เคยเปลี่ยนเจตจำนงของเกาะอาทิตย์อุทัย จิตวิญญาณบูชิโดหล่อหลอมสนามรบและสังคมญี่ปุ่นนับพันปี ปลายศตวรรษที่ 19 ภายใต้อิทธิพลต่างชาติ ประชาชนเดินสู่ความทันสมัย และในไม่กี่ทศวรรษทำให้ญี่ปุ่นเป็นดินแดนนวัตกรรมเทคโนโลยีและอุตสาหกรรมทรงพลังที่น้อยชาติจะทัดเทียม
O great daimyo, will you take on your hands the Japan destiny, for the Rising Sun to light the world? Will your new empire shine through the ages of history? = ไดเมียวผู้ยิ่งใหญ่ ท่านจะรับชะตาญี่ปุ่นไว้ในมือ เพื่อให้อาทิตย์อุทัยส่องสว่างแก่โลกหรือไม่? จักรวรรดิใหม่ของท่านจะส่องประกายผ่านยุคสมัยแห่งประวัติศาสตร์หรือไม่?
