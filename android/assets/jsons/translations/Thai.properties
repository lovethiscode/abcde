Otto von Bismarck = อ็อทโท ฟ็อน บิสมาร์ค
I cannot wait until ye grow even mightier. Therefore, prepare for war! = ข้ารอให้ท่านแข็งแกร่งขึ้นกว่านี้ไม่ได้ จงเตรียมทำสงคราม!
Corrupted villain! We will bring you into the ground! = วายร้ายทุจริต! เราจะทำให้ท่านจมดิน!
Germany has been destroyed. I weep for the future generations. = เยอรมนีถูกทำลายแล้ว ข้าร่ำไห้ให้คนรุ่นหลัง
That wild bravado? It's a ticking time bomb, especially when you're all bark and no bite! = ความอวดกล้าบ้าบิ่นนั่นหรือ? มันคือระเบิดเวลา โดยเฉพาะเมื่อท่านได้แต่เห่าไม่กัด!
Guten Tag. In the name of the great German people, I bid you welcome. = สวัสดี ในนามชาวเยอรมันผู้ยิ่งใหญ่ ข้าขอต้อนรับท่าน
It would be in your best interest, to carefully consider this proposal. = การพิจารณาข้อเสนอนี้อย่างรอบคอบย่อมเป็นประโยชน์สูงสุดแก่ท่าน
What now? = คราวนี้อะไรอีก?
So, out with it! = เอาละ ว่ามา!
Furor Teutonicus = ความเกรี้ยวกราดของทิวทัน
All hail to Otto von Bismarck, first chancellor of Germany and its empire! During the ancient era, Germany was a land fragmented in several tribes but already showed great promise as the Roman Empire itself struggled to bend the Germans to its will. Germany, as one nation, was slowly built on the ruins of the Holy Roman Empire, and waited 1871 to be finally unified after the glorious victory on France and Napoleon III. The German people are creative, intelligent, industrious and proven to be talented warriors through history. Despite great catastrophes and failures in the first half of the 20th century, Germany can always rely on its people will and strength to be among the greatest and powerful nations in the world. = ขอคารวะอ็อทโท ฟ็อน บิสมาร์ค นายกรัฐมนตรีคนแรกแห่งเยอรมนีและจักรวรรดิ! ในยุคโบราณ เยอรมนีแตกเป็นหลายเผ่าแต่แสดงศักยภาพอันยิ่งใหญ่ เพราะแม้จักรวรรดิโรมันยังปราบชาวเยอรมันได้ยาก เยอรมนีค่อย ๆ ก่อเป็นชาติบนซากจักรวรรดิโรมันอันศักดิ์สิทธิ์ และรวมเป็นหนึ่งในปี 1871 หลังชัยชนะอันรุ่งโรจน์เหนือฝรั่งเศสกับนโปเลียนที่สาม ชาวเยอรมันสร้างสรรค์ ฉลาด ขยัน และพิสูจน์ฝีมือนักรบมาตลอดประวัติศาสตร์ แม้เกิดภัยพิบัติและความล้มเหลวใหญ่ในครึ่งแรกของศตวรรษที่ 20 เยอรมนียังพึ่งเจตจำนงและพลังของประชาชนเพื่ออยู่ในหมู่ชาติยิ่งใหญ่และทรงอำนาจที่สุดได้เสมอ
Great Prince Bismarck, glory and power are at the heart of the German nation. Your people are bright, and lend you their iron will to lead Germany once again. Will your new empire shine through the ages of history? = เจ้าชายบิสมาร์คผู้ยิ่งใหญ่ เกียรติยศและอำนาจคือหัวใจของชาติเยอรมัน ประชาชนปราดเปรื่องและมอบเจตจำนงเหล็กให้ท่านนำเยอรมนีอีกครั้ง จักรวรรดิใหม่ของท่านจะส่องประกายผ่านยุคสมัยแห่งประวัติศาสตร์หรือไม่?
