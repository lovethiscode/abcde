Unlock the other 39 achievements in this catalog. Old-catalog medals do not count. = ปลดล็อกความสำเร็จใหม่อีก 39 รายการในชุดนี้ ไม่นับตัวเองหรือเหรียญเก่า
Unlock the other 39 achievements in this new catalog. This achievement itself and old-catalog medals do not count. = ปลดล็อกความสำเร็จใหม่อีก 39 รายการในชุดนี้ ไม่นับตัวเองหรือเหรียญเก่า
