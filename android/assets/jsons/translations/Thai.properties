Boudicca = บูดิกกา
You shall stain this land no longer with your vileness! To arms, my countrymen. We ride to war! = ความชั่วของท่านจะไม่เปื้อนแผ่นดินนี้อีก! หยิบอาวุธ เพื่อนร่วมชาติ เราจะขี่ม้าไปทำศึก!
Traitorous man! The Celtic peoples will not stand for such wanton abuse and slander - I shall have your balls! = คนทรยศ! ชาวเคลต์จะไม่ทนการข่มเหงและใส่ร้ายตามอำเภอใจ ข้าจะเอาลูกอัณฑะท่าน!
Vile ruler, know you have won this war in name alone. Your cities lie buried and your troops defeated. I have my own victory. = ผู้ปกครองชั่ว จงรู้ว่าท่านชนะเพียงในนาม เมืองท่านถูกฝังและทหารพ่าย ข้ามีชัยของข้าเอง
Don't forget who you're dealing with. Arrogant moves can get you in danger. = อย่าลืมว่ารับมือใคร การอวดดีทำให้ท่านตกอันตรายได้
I am Boudicca, Queen of the Celts. Let no-one underestimate me! = ข้าคือบูดิกกา ราชินีแห่งเคลต์ อย่าให้ใครดูถูกข้า!
Let us join our forces together and reap the rewards. = เรามาร่วมกำลังและรับผลตอบแทนด้วยกัน
God has given good to you. = พระเจ้าประทานสิ่งดีแก่ท่าน
Druidic Lore = ภูมิปัญญาดรูอิด
May glory and honor always be upon you, Warrior Queen! In a time dominated by men, you successfully claimed the throne and the power, but also valiantly defied the mighty Roman Empire. Punished and humiliated by the hand of the Roman bloody invaders, you united your people and led a terrible revolt, to seek revenge. Many legions fell under your fierce attacks and you burned the city of London with your anger. While the Romans still kept ownership of your land after your final defeat, your actions nonetheless showed Rome that this land could never be fully conquered, making Nero himself consider to withdraw all troops and leaving Britain forever. = ขอเกียรติยศอยู่กับท่านเสมอ ราชินีนักรบ! ในยุคที่บุรุษครองอำนาจ ท่านยึดบัลลังก์และอำนาจสำเร็จ อีกทั้งท้าทายจักรวรรดิโรมันอย่างกล้าหาญ หลังถูกผู้รุกรานโรมันลงโทษและหยามเกียรติ ท่านรวมประชาชนนำกบฏรุนแรงเพื่อล้างแค้น หลายลีเจียนพ่ายการโจมตีดุเดือด และท่านเผาลอนดอนด้วยโทสะ แม้โรมันยังครองแผ่นดินหลังท่านพ่ายครั้งสุดท้าย การกระทำก็แสดงว่าแผ่นดินนี้ไม่มีวันถูกพิชิตหมด จนเนโรคิดถอนทหารทั้งหมดจากบริเตนตลอดกาล
O raging lioness, will you lead the Celts again under the glory of your name, to spread the fires of liberty, and achieve a final victory? Will your new empire shine through the ages of history? = สิงโตสาวผู้เกรี้ยวกราด ท่านจะนำชาวเคลต์อีกครั้งใต้เกียรติแห่งชื่อ เพื่อเผยไฟเสรีภาพและคว้าชัยสุดท้ายหรือไม่? จักรวรรดิใหม่ของท่านจะส่องประกายผ่านยุคสมัยแห่งประวัติศาสตร์หรือไม่?
