George Washington = จอร์จ วอชิงตัน
Your wanton aggression leaves us no choice. Prepare for war! = เราไม่มีทางเลือกมากนักกับความป่าเถื่อนของท่าน. เตรียมตัวสำหรับสงครามได้เลย!
You have mistaken our love of peace for weakness. You shall regret this! = ท่านเข้าใจผิดว่าความรักสันติของเราเป็นความอ่อนแอ ท่านจะเสียใจ!
The day...is yours. I hope you will be merciful in your triumph. = วันนี้...เป็นของท่าน หวังว่าท่านจะเมตตาเมื่อมีชัย
The people of the United States of America welcome you. = อเมริกาชนต้อนรับคุณเสมอ.
Is the following trade of interest to you? = ท่านสนใจการค้าต่อไปนี้หรือไม่?
Well? = โอ้?
Manifest Destiny = เทพลิขิต
President Washington, we salute you and the proud American civilization! Freed from the British dominion in the 18th century, then cleansed and reborn after a terrible civil war, the United States nation was ready to play its great role in the 20th century. At the height of its power, triumphant after two terrible world wars, United States of America, a land of immigration, opportunities, optimism and determination, has risen above all other weakening nations, unable to equal such power. = ประธานาธิบดีวอชิงตัน เราขอคารวะท่านและอารยธรรมอเมริกันอันภาคภูมิ! หลังเป็นอิสระจากอังกฤษในศตวรรษที่ 18 และผ่านการชำระล้างเกิดใหม่จากสงครามกลางเมืองอันเลวร้าย สหรัฐอเมริกาก็พร้อมมีบทบาทยิ่งใหญ่ในศตวรรษที่ 20 เมื่ออำนาจถึงจุดสูงสุดและมีชัยหลังสงครามโลกอันน่ากลัวสองครั้ง สหรัฐอเมริกา ดินแดนแห่งผู้อพยพ โอกาส ความหวัง และความมุ่งมั่น ก็ผงาดเหนือชาติอื่นที่อ่อนกำลังและไม่อาจเทียบอำนาจนี้ได้
President Washington, will you show to the world the legitimacy of the American way of life, and spread the flame of liberty to all mankind? Will your new empire shine through the ages of history? = ประธานาธิบดีวอชิงตัน ท่านจะแสดงความชอบธรรมของวิถีอเมริกันแก่โลก และเผยเปลวไฟแห่งเสรีภาพแก่มนุษยชาติหรือไม่? จักรวรรดิใหม่ของท่านจะส่องประกายผ่านยุคสมัยแห่งประวัติศาสตร์หรือไม่?
