Sejong = เซจง
Jip-hyun-jun (Hall of Worthies) will no longer tolerate your irksome behavior. We will liberate the citizens under your oppression even with force, and enlighten them! = ชิบฮยอนจอนหรือหอปราชญ์จะไม่ทนพฤติกรรมน่ารำคาญของท่านอีก เราจะปลดปล่อยประชาชนที่ท่านกดขี่แม้ต้องใช้กำลัง และให้ความรู้แก่พวกเขา!
Foolish, miserable wretch! You will be crushed by this country's magnificent scientific power! = คนโง่ผู้ต่ำต้อย! ท่านจะถูกบดขยี้ด้วยพลังวิทยาศาสตร์อันยิ่งใหญ่ของประเทศนี้!
Now the question is who will protect my people. A dark age has come. = บัดนี้คำถามคือใครจะปกป้องประชาชนของข้า ยุคมืดมาถึงแล้ว
Your words reveal more of your own prejudice than any fault in my own. = คำพูดของท่านเผยอคติของตัวท่านเองมากกว่าความผิดของข้า
Welcome to the palace of Choson, stranger. I am the learned King Sejong, who looks after his great people. = ยินดีต้อนรับสู่วังโชซอน คนแปลกหน้า ข้าคือกษัตริย์เซจงผู้ใฝ่รู้ ผู้ดูแลประชาชนอันยิ่งใหญ่
We have many things to discuss and have much to benefit from each other. = เรามีเรื่องต้องหารือมากมายและต่างได้รับประโยชน์จากกันได้มาก
Oh, it's you = อ้อ ท่านเอง
Scholars of the Jade Hall = ปราชญ์แห่งหอหยก
Greetings to you, King Sejong the Great, heir of the Choson Dynasty! Prosperity and benevolence towards the common man are the principles of your reign, and made of you the most beloved Korean king. You always aimed to provide a fair and equal society for all your people, and also to favor knowledge and technological discoveries. Your wisdom and intelligence imbued all the Korean society, and the scholars of the Jade Hall developed Korea's first written language, Hangul, sharing further literature and science to the people after centuries of darkness. = ขอคารวะพระเจ้าเซจงมหาราช ทายาทราชวงศ์โชซอน! ความรุ่งเรืองและเมตตาต่อสามัญชนเป็นหลักการครองราชย์ ทำให้ท่านเป็นกษัตริย์เกาหลีที่ผู้คนรักที่สุด ท่านมุ่งสร้างสังคมยุติธรรมเท่าเทียม พร้อมส่งเสริมความรู้และการค้นพบเทคโนโลยี ปัญญาของท่านแผ่ทั่วสังคมเกาหลี ปราชญ์แห่งหอหยกพัฒนาอักษรแรกของเกาหลีคือฮันกึล ทำให้วรรณกรรมและวิทยาศาสตร์เข้าถึงประชาชนหลังความมืดมนหลายศตวรรษ
Wise Sejong, will you gift your people with the radiance of harmony and knowledge to dispel the darkness once again? Will your new empire shine through the ages of history? = เซจงผู้ทรงปัญญา ท่านจะมอบแสงแห่งความสามัคคีและความรู้แก่ประชาชนเพื่อขจัดความมืดอีกครั้งหรือไม่? จักรวรรดิใหม่ของท่านจะส่องประกายผ่านยุคสมัยแห่งประวัติศาสตร์หรือไม่?
