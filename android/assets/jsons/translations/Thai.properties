Great Attila, mighty warrior and leader of the Hunnic empire, your men bow down before you. During the 5th century, you and your brother Bleda have conquered many lands, forged a mighty empire and commanded the most powerful and frightening force of antiquity. You inspired fear to the Roman Emperors themselves, who called you 'Flagellum Dei', the 'Scourge of God', as you took kingdom after kingdom in the Balkans, invaded Eastern Roman Empire, into Gaul and Northern Italy, and planned to conquer Rome itself. Your empire didn't survive long after your death, but your name and your legend have, for millenia to come. = อัตติลาผู้ยิ่งใหญ่ นักรบทรงพลังและผู้นำจักรวรรดิฮัน ทหารน้อมคำนับท่าน ในศตวรรษที่ 5 ท่านและเบลดาผู้พี่พิชิตดินแดนมากมาย สร้างจักรวรรดิและบัญชากำลังอันทรงพลังน่ากลัวที่สุดแห่งยุคโบราณ แม้จักรพรรดิโรมันยังหวาดกลัว เรียกท่านว่า ‘Flagellum Dei’ หรือ ‘แส้แห่งพระเจ้า’ เมื่อท่านยึดอาณาจักรแล้วอาณาจักรเล่าในบอลข่าน รุกรานโรมันตะวันออก กอล และอิตาลีเหนือ พร้อมวางแผนพิชิตโรม จักรวรรดิอยู่ไม่นานหลังท่านตาย แต่ชื่อและตำนานยืนยงนับพันปี
