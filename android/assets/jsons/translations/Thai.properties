Augustus Caesar = ออกัสตัส ซีซาร์
My treasury contains little and my soldiers are getting impatient... (sigh) ...therefore you must die. = ท้องพระคลังข้ามีน้อย และทหารเริ่มหมดความอดทน... เฮ้อ... ดังนั้นท่านต้องตาย
So brave, yet so stupid! If only you had a brain similar to your courage. = กล้าหาญนัก แต่ก็โง่นัก! หากสมองท่านดีเท่าความกล้าคงจะดี
The gods have deprived Rome of their favour. We have been defeated. = เหล่าเทพถอนความโปรดปรานจากโรม เราพ่ายแพ้แล้ว
I wasn't sure, but it seems you do have some grit. = ข้าไม่แน่ใจนัก แต่ดูเหมือนท่านจะมีความทรหดอยู่บ้าง
I greet you. I am Augustus, Imperator and Pontifex Maximus of Rome. If you are a friend of Rome, you are welcome. = สวัสดี ข้าคือออกัสตัส จักรพรรดิและมหาปุโรหิตสูงสุดแห่งโรม หากท่านเป็นมิตรกับโรม ก็ยินดีต้อนรับ
I offer this, for your consideration. = ข้าเสนอสิ่งนี้ให้ท่านพิจารณา
Hail. = ขอคารวะ
What do you want? = ท่านต้องการอะไร?
The Glory of Rome = เกียรติยศแห่งโรม
Ave Caesar Augustus, Emperor of Rome and Dominus of the Roman Empire! Your empire was the most powerful and feared of all in Western civilization. The Roman people crafted so brilliantly its culture, law, art, and warfare, that no one could contest the supremacy of Rome. Force and Honor led to glorious conquests, a domination of all the lands from Spain in the west to Syria in the east, even reaching the remote barbarian lands of England and Germany. Roman art and architecture have been praised for millenia and have been envied by all lesser civilizations who have followed. = ขอคารวะซีซาร์ออกัสตัส จักรพรรดิแห่งโรมและเจ้าแห่งจักรวรรดิโรมัน! จักรวรรดิของท่านทรงอำนาจและเป็นที่หวาดเกรงที่สุดในอารยธรรมตะวันตก ชาวโรมันสร้างวัฒนธรรม กฎหมาย ศิลปะ และการสงครามอย่างยอดเยี่ยมจนไม่มีผู้ใดท้าทายความเป็นใหญ่ได้ กำลังและเกียรติยศนำสู่การพิชิตอันรุ่งโรจน์ ครองดินแดนจากสเปนทางตะวันตกถึงซีเรียทางตะวันออก และไปถึงดินแดนคนเถื่อนอันไกลโพ้นในอังกฤษและเยอรมนี ศิลปะและสถาปัตยกรรมโรมันได้รับคำสรรเสริญนับพันปี และเป็นที่อิจฉาของอารยธรรมที่เล็กกว่าซึ่งตามมา
O glorious Imperator, your people celebrate you and ask for the glory of Rome! In these times of darkness, the Pax Romana will be a beacon of light for all! Will your new empire shine through the ages of history? = จักรพรรดิผู้รุ่งโรจน์ ประชาชนยกย่องท่านและเรียกร้องเกียรติยศแห่งโรม! ในยุคมืดนี้ สันติภาพโรมันจะเป็นประทีปแก่ทุกคน! จักรวรรดิใหม่ของท่านจะส่องประกายผ่านยุคสมัยแห่งประวัติศาสตร์หรือไม่?
