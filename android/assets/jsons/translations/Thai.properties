May the gods bless you, great Nebuchadnezzar, ruler of ancient Babylon! Built 5000 years ago, Babylon emerged as an empire in 1800 BC, thanks to godlike Hammurabi, The Giver of Law. Falling under the Kassites assaults then the Assyrian domination, Babylon was reborn from its ashes, gaining back its independance, and became the beacon for Arts and Learning in the ancient world. O Nebuchadnezzar, after your death, Babylon quickly fell, conquered by the mighty Persians, and then by the Greeks, until the great city disappeared forever in 141 BC. = ขอเทพเจ้าทรงอวยพรท่าน เนบูคัดเนสซาร์ผู้ยิ่งใหญ่ ผู้ปกครองบาบิโลนโบราณ! บาบิโลนสร้างขึ้นเมื่อ 5000 ปีก่อน และกลายเป็นจักรวรรดิในปี 1800 ก่อนคริสตกาลด้วยพระปรีชาของฮัมมูราบีผู้ประทานกฎหมาย หลังพ่ายการโจมตีของคัสไซต์และอยู่ใต้อำนาจอัสซีเรีย บาบิโลนฟื้นคืนจากเถ้าถ่าน ได้เอกราชกลับมา และเป็นประทีปแห่งศิลปะกับการเรียนรู้ในโลกโบราณ หลังท่านสิ้นพระชนม์ บาบิโลนก็ล่มสลายอย่างรวดเร็ว ถูกเปอร์เซียอันยิ่งใหญ่และต่อมาชาวกรีกยึดครอง จนเมืองใหญ่หายไปตลอดกาลในปี 141 ก่อนคริสตกาล
Great Nebuchadnezzar, Babylon's glory still lives through you and your people. Will you create a spark to enlighten the world again? Will your new empire shine through the ages of history? = เนบูคัดเนสซาร์ผู้ยิ่งใหญ่ เกียรติยศของบาบิโลนยังอยู่ผ่านท่านและประชาชน ท่านจะจุดประกายให้โลกสว่างอีกครั้งหรือไม่? จักรวรรดิใหม่ของท่านจะส่องประกายผ่านยุคสมัยแห่งประวัติศาสตร์หรือไม่?
