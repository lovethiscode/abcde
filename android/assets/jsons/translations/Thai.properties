# Refactored menu and window localization
1. Tap Create room, choose the rules and map, then share the invitation. = 1. แตะสร้างห้อง เลือกกฎและแผนที่ จากนั้นแชร์คำเชิญ
1. The Android player copies their Player ID from Multiplayer and sends it to the iOS host. = 1. เครื่องเล่น Android คัดลอก ID ผู้เล่นจาก Multiplayer และส่งไปยังโฮสต์ iOS
2. In an empty player seat, the host taps Add player manually, pastes the Player ID, taps the portrait to choose a civilization, then taps Mark ready. = 2. ในที่นั่งผู้เล่นว่าง เจ้าบ้านแตะเพิ่มผู้เล่นด้วยตนเอง วาง ID ผู้เล่น แตะรูปคนเพื่อเลือกอารยธรรม จากนั้นแตะทำเครื่องหมายว่าพร้อม
2. Other iOS players open the invitation or paste it in Join by invitation, tap their civilization portrait to choose, then tap Ready. = 2. ผู้เล่น iOS คนอื่นๆ เปิดคำเชิญหรือวางลงในเข้าร่วมตามคำเชิญ แตะรูปภาพอารยธรรมของพวกเขาเพื่อเลือก จากนั้นแตะพร้อม
3. After starting, the Game ID is copied automatically. Send it to the Android player to add the game in Multiplayer. = 3. หลังจากเริ่มต้น รหัสเกมจะถูกคัดลอกโดยอัตโนมัติ ส่งไปยังเครื่องเล่น Android เพื่อเพิ่มเกมใน Multiplayer
3. The host is ready automatically. When everyone is ready, the host taps Start game. No Player ID or Game ID exchange is needed. = 3. โฮสต์จะพร้อมโดยอัตโนมัติ เมื่อทุกคนพร้อม พิธีกรก็แตะเริ่มเกม ไม่จำเป็นต้องแลกเปลี่ยน ID ผู้เล่นหรือ ID เกม
