Fastlane_short_description = เกมสร้างอารยธรรมแบบ 4X ที่เป็นโอเพนซอร์ส

# Documentation: https://f-droid.org/en/docs/Build_Metadata_Reference/#Description
# English to translate: https://github.com/yairm210/Unciv/blob/master/fastlane/metadata/android/en-US/full_description.txt
Fastlane_full_description = การนำเกมสร้างอารยธรรมที่โด่งดังที่สุดตลอดกาลมาสร้างใหม่แบบโอเพนซอร์ส — รวดเร็วและมีขนาดเล็ก!\n\nสร้างอารยธรรมของคุณ วิจัยเทคโนโลยี ขยายเมือง และเอาชนะศัตรู!\n\nมีข้อเสนอแนะ? พบข้อผิดพลาด? อยากช่วยพัฒนา? ดูรายการงานของแอปได้ที่ https://github.com/jerry8870/Unciv4iOS\n\nมีคำถามหรือความคิดเห็น? เข้าร่วม Discord ของเราได้ที่ https://discord.gg/bjrB4Xw ;)\n\nอยากช่วยแปลเกมเป็นภาษาของคุณ? ดูคำแนะนำที่ https://yairm210.github.io/Unciv/Translating/Translating/\n\nโลกกำลังรอคุณอยู่! คุณจะสร้างอารยธรรมให้กลายเป็นจักรวรรดิที่ยืนหยัดผ่านบททดสอบแห่งกาลเวลาได้หรือไม่?\n\nสิทธิ์ "เข้าถึงเครือข่ายได้อย่างเต็มรูปแบบ" จำเป็นสำหรับการดาวน์โหลดที่ผู้ใช้เป็นผู้เริ่มต้นและฟีเจอร์ผู้เล่นหลายคน สิทธิ์อื่นทั้งหมดที่แสดงจะถูกรวมโดยอัตโนมัติจาก API ที่ใช้แจ้งเตือนเทิร์นของเกมผู้เล่นหลายคน สิทธิ์เครือข่ายใช้สำหรับแสดงรายการม็อด ดาวน์โหลดม็อด ดาวน์โหลดเพลง และอัปโหลด/ดาวน์โหลดเกมผู้เล่นหลายคนเท่านั้น Unciv จะไม่เริ่มการสื่อสารทางอินเทอร์เน็ตอื่นใด


