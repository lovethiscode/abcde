Not now = ไม่ใช่ตอนนี้
Purchase not completed = การซื้อยังไม่เสร็จสมบูรณ์
The purchase could not be completed. You can try again later. = ไม่สามารถดำเนินการซื้อให้เสร็จได้ คุณสามารถลองอีกครั้งในภายหลัง
Purchase pending = การซื้ออยู่ระหว่างรอดำเนินการ
StoreKit is waiting for approval. If it completes later, Unciv will recover it automatically. = StoreKit กำลังรอการอนุมัติ หากเสร็จสิ้นในภายหลัง Unciv จะกู้คืนให้อัตโนมัติ
Purchase cancelled = ยกเลิกการซื้อแล้ว
No purchase was made. = ไม่มีการซื้อเกิดขึ้น
StoreKit returned an unknown purchase result. No submission was created. = StoreKit ส่งคืนผลการซื้อที่ไม่ทราบ ไม่ได้สร้างข้อมูลที่จะส่ง
Purchase could not be verified = ไม่สามารถยืนยันการซื้อได้
The transaction was not finished or submitted. Please try again later. = ธุรกรรมยังไม่เสร็จหรือยังไม่ได้ส่ง โปรดลองอีกครั้งในภายหลัง
The verified transaction did not match an Unciv support product. = ธุรกรรมที่ยืนยันแล้วไม่ตรงกับผลิตภัณฑ์สนับสนุน Unciv
Purchase needs attention = การซื้อต้องได้รับการตรวจสอบ
The verified purchase could not be saved locally, so StoreKit has not finished it. Reopen Unciv to retry. = ไม่สามารถบันทึกการซื้อที่ยืนยันแล้วในเครื่องได้ StoreKit จึงยังไม่ดำเนินการให้เสร็จ เปิด Unciv อีกครั้งเพื่อลองใหม่
The local support queue is unavailable. No purchase was started. = คิวการสนับสนุนในเครื่องไม่พร้อมใช้งาน จึงไม่ได้เริ่มการซื้อ
A public nickname submission is waiting for iCloud and will retry automatically. = การส่งชื่อเล่นสาธารณะกำลังรอ iCloud และจะลองใหม่โดยอัตโนมัติ
Thank you for supporting Unciv! = ขอบคุณที่สนับสนุน Unciv!
Your public nickname submission was saved. = บันทึกข้อมูลชื่อเล่นสาธารณะที่จะส่งแล้ว
Sign in to iCloud = ลงชื่อเข้าใช้ iCloud
Your purchase is complete. The public nickname is queued locally and will retry after you sign in to iCloud. = การซื้อเสร็จสมบูรณ์ ชื่อเล่นสาธารณะอยู่ในคิวของเครื่องและจะลองอีกครั้งหลังจากคุณลงชื่อเข้าใช้ iCloud
iCloud is unavailable = iCloud ไม่พร้อมใช้งาน
Your purchase is complete. The public nickname is queued locally and will retry automatically. = การซื้อเสร็จสมบูรณ์ ชื่อเล่นสาธารณะอยู่ในคิวของเครื่องและจะลองใหม่โดยอัตโนมัติ
Your purchase is complete. The public nickname remains queued; reopen the support screen to retry. = การซื้อเสร็จสมบูรณ์ ชื่อเล่นสาธารณะยังอยู่ในคิว เปิดหน้าจอสนับสนุนอีกครั้งเพื่อลองใหม่
Submission needs attention = ข้อมูลที่ส่งต้องได้รับการตรวจสอบ
A different CloudKit record already uses this transaction ID. The local submission was kept for a safe retry. = ระเบียน CloudKit อื่นใช้ ID ธุรกรรมนี้แล้ว ข้อมูลที่ส่งในเครื่องถูกเก็บไว้เพื่อให้ลองใหม่ได้อย่างปลอดภัย
Submission queued = ข้อมูลที่ส่งอยู่ในคิว
The nickname choice could not be saved locally. Reopen Unciv to retry. = ไม่สามารถบันทึกตัวเลือกชื่อเล่นในเครื่องได้ เปิด Unciv อีกครั้งเพื่อลองใหม่
Enter a nickname, or choose Skip public nickname. = ป้อนชื่อเล่น หรือเลือก ข้ามชื่อเล่นสาธารณะ
Nickname must be at most 30 characters. = ชื่อเล่นต้องมีความยาวไม่เกิน 30 อักขระ
Nickname cannot contain line breaks or control characters. = ชื่อเล่นต้องไม่มีตัวแบ่งบรรทัดหรืออักขระควบคุม
Nickname cannot be an email address. = ชื่อเล่นต้องไม่ใช่ที่อยู่อีเมล
Nickname cannot contain a web address. = ชื่อเล่นต้องไม่มีที่อยู่เว็บ
Default music download is unavailable in this build. = การดาวน์โหลดเพลงเริ่มต้นไม่พร้อมใช้งานในบิลด์นี้
Sync saves now = ซิงค์เซฟตอนนี้
Restore saves from iCloud = กู้คืนเซฟจาก iCloud
Sync local and iCloud saves now?\nA changed save may replace the same-named version\non the other side.\nConflicting versions are kept separately. = ซิงค์เซฟในเครื่องและ iCloud ตอนนี้หรือไม่\nเซฟที่เปลี่ยนแปลงอาจแทนที่เวอร์ชันชื่อเดียวกัน\nที่อยู่อีกฝั่ง\nเวอร์ชันที่ขัดแย้งกันจะถูกเก็บแยกกัน
Restore saves from iCloud now?\nSaves deleted only on this device return\nif they still exist in iCloud.\nOther changes still sync both ways;\na same-named version may be replaced.\nConflicts are kept separately. = กู้คืนเซฟจาก iCloud ตอนนี้หรือไม่\nเซฟที่ลบเฉพาะในอุปกรณ์นี้จะกลับมา\nหากยังอยู่ใน iCloud\nการเปลี่ยนแปลงอื่นยังคงซิงค์ทั้งสองทาง\nเวอร์ชันชื่อเดียวกันอาจถูกแทนที่\nรายการที่ขัดแย้งกันจะถูกเก็บแยกกัน
Checking iCloud availability... = กำลังตรวจสอบความพร้อมใช้งานของ iCloud...
iCloud is available. = iCloud พร้อมใช้งาน
Sign in to iCloud to sync saves. = ลงชื่อเข้าใช้ iCloud เพื่อซิงค์เซฟ
iCloud access is restricted. = การเข้าถึง iCloud ถูกจำกัด
iCloud account changed. Tap Sync saves now to use the current account. = บัญชี iCloud เปลี่ยนแล้ว แตะ ซิงค์เซฟตอนนี้ เพื่อใช้บัญชีปัจจุบัน
Waiting to retry iCloud save sync. = กำลังรอลองซิงค์เซฟ iCloud ใหม่
Syncing saves with iCloud... = กำลังซิงค์เซฟกับ iCloud...
iCloud save sync failed. = ซิงค์เซฟ iCloud ไม่สำเร็จ
Saves are synced with iCloud. = เซฟซิงค์กับ iCloud แล้ว
Last successful iCloud sync: = ซิงค์ iCloud สำเร็จล่าสุด:
Are you sure you want to delete this save from this device? It will remain in iCloud. = คุณแน่ใจหรือไม่ว่าต้องการลบเซฟนี้ออกจากอุปกรณ์ เซฟจะยังคงอยู่ใน iCloud
[] deleted from this device. = ลบ [] ออกจากอุปกรณ์นี้แล้ว

# iOS foreground multiplayer, recovery, document picker, and API v1 errors
Could not store the multiplayer password securely. = ไม่สามารถจัดเก็บรหัสผ่านผู้เล่นหลายคนได้อย่างปลอดภัย
Some saved multiplayer passwords could not be moved to secure storage. They were removed from settings; authenticate again when prompted. = ไม่สามารถย้ายรหัสผ่านผู้เล่นหลายคนที่บันทึกไว้บางรายการไปยังพื้นที่จัดเก็บที่ปลอดภัยได้ รหัสผ่านเหล่านั้นถูกลบออกจากการตั้งค่าแล้ว โปรดยืนยันตัวตนอีกครั้งเมื่อได้รับแจ้ง
Install the same version of every required ruleset and mod before joining. Automatic mod downloads are unavailable in this build. = ติดตั้งชุดกฎและม็อดที่จำเป็นทุกชุดให้เป็นเวอร์ชันเดียวกันก่อนเข้าร่วม บิลด์นี้ไม่รองรับการดาวน์โหลดม็อดโดยอัตโนมัติ
Online multiplayer servers are operated by third parties. The selected server receives your player ID, IP address, and game save data. Its availability, retention, deletion, and remote game saves are not guaranteed by Unciv. All players must use the same Unciv version and have the exact same versions of every mod installed. = เซิร์ฟเวอร์ผู้เล่นหลายคนออนไลน์ดำเนินการโดยบุคคลที่สาม เซิร์ฟเวอร์ที่เลือกจะได้รับ Player ID ที่อยู่ IP และข้อมูลเซฟเกมของคุณ Unciv ไม่รับประกันความพร้อมใช้งาน การเก็บรักษาหรือการลบข้อมูล และเซฟเกมระยะไกลของเซิร์ฟเวอร์ ผู้เล่นทุกคนต้องใช้ Unciv เวอร์ชันเดียวกันและติดตั้งม็อดทุกตัวเป็นเวอร์ชันเดียวกันอย่างครบถ้วน
Recovery saved = บันทึกสำเนากู้คืนแล้ว
Creation stopped before upload because a local recovery copy could not be saved. = หยุดการสร้างก่อนอัปโหลด เนื่องจากไม่สามารถบันทึกสำเนากู้คืนในเครื่องได้
Remote creation could not be confirmed. The Game ID was copied and a local recovery copy was saved. Open that Multiplayer entry to resume this exact game; do not start another one. = ไม่สามารถยืนยันการสร้างระยะไกลได้ คัดลอก Game ID และบันทึกสำเนากู้คืนในเครื่องแล้ว เปิดรายการผู้เล่นหลายคนนั้นเพื่อเล่นเกมนี้ต่อโดยตรง อย่าเริ่มเกมอื่น
Server limit reached! Please wait for [time] seconds. The Game ID was copied; open its saved Multiplayer entry to retry. = ถึงขีดจำกัดเซิร์ฟเวอร์แล้ว โปรดรอ [time] วินาที คัดลอก Game ID แล้ว เปิดรายการผู้เล่นหลายคนที่บันทึกไว้เพื่อลองอีกครั้ง
Creation was interrupted and the Game ID was copied, but a local recovery copy could not be saved. = การสร้างถูกขัดจังหวะและคัดลอก Game ID แล้ว แต่ไม่สามารถบันทึกสำเนากู้คืนในเครื่องได้
The full game was uploaded before creation was interrupted. The Game ID was copied and a local recovery copy was saved. = อัปโหลดเกมฉบับเต็มก่อนการสร้างถูกขัดจังหวะแล้ว คัดลอก Game ID และบันทึกสำเนากู้คืนในเครื่องแล้ว
Remote creation could not be confirmed. The Game ID was copied and a local recovery copy was saved. Open that Multiplayer entry to resume this exact game. = ไม่สามารถยืนยันการสร้างระยะไกลได้ คัดลอก Game ID และบันทึกสำเนากู้คืนในเครื่องแล้ว เปิดรายการผู้เล่นหลายคนนั้นเพื่อเล่นเกมนี้ต่อโดยตรง
Could not upload game. The Game ID was copied; open its saved Multiplayer entry to retry this exact game. = ไม่สามารถอัปโหลดเกมได้ คัดลอก Game ID แล้ว เปิดรายการผู้เล่นหลายคนที่บันทึกไว้เพื่อลองเล่นเกมนี้อีกครั้งโดยตรง
Game created and ID copied, but its turn preview is not confirmed. Submitting the first turn will retry it. = สร้างเกมและคัดลอก ID แล้ว แต่ยังไม่ยืนยันตัวอย่างตาเล่น การส่งตาแรกจะลองดำเนินการอีกครั้ง
Could not persist the latest server state locally. = ไม่สามารถบันทึกสถานะล่าสุดของเซิร์ฟเวอร์ไว้ในเครื่องได้
Turn upload is unconfirmed because its background time expired. Retry after returning to the game. = ยังไม่ยืนยันการอัปโหลดตาเล่นเนื่องจากหมดเวลาทำงานเบื้องหลัง โปรดลองอีกครั้งหลังกลับเข้าสู่เกม
Server limit reached! Please wait for [time] seconds before retrying. = ถึงขีดจำกัดเซิร์ฟเวอร์แล้ว โปรดรอ [time] วินาทีก่อนลองอีกครั้ง
Turn upload is unconfirmed. Reason: [reason] = ยังไม่ยืนยันการอัปโหลดตาเล่น เหตุผล: [reason]
Could not open authentication. The turn upload is unconfirmed. = ไม่สามารถเปิดการยืนยันตัวตนได้ ยังไม่ยืนยันการอัปโหลดตาเล่น
Authentication was cancelled. The turn upload is unconfirmed. = ยกเลิกการยืนยันตัวตนแล้ว ยังไม่ยืนยันการอัปโหลดตาเล่น
The server no longer has the game. The pending turn was kept and was not uploaded. = เกมไม่มีอยู่บนเซิร์ฟเวอร์แล้ว ตาเล่นที่รอดำเนินการถูกเก็บไว้และไม่ได้อัปโหลด
Could not confirm the previous turn upload. Reason: [reason] = ไม่สามารถยืนยันการอัปโหลดตาก่อนหน้าได้ เหตุผล: [reason]
The server's full game could not be verified. The pending turn was kept and was not uploaded. = ไม่สามารถตรวจสอบเกมฉบับเต็มบนเซิร์ฟเวอร์ได้ ตาเล่นที่รอดำเนินการถูกเก็บไว้และไม่ได้อัปโหลด
The server confirmed the turn, but it could not be saved locally. Retry to recover safely. = เซิร์ฟเวอร์ยืนยันตาเล่นแล้ว แต่ไม่สามารถบันทึกไว้ในเครื่องได้ โปรดลองอีกครั้งเพื่อกู้คืนอย่างปลอดภัย
The pending turn could not be stored or recovered safely. It was not uploaded. = ไม่สามารถจัดเก็บหรือกู้คืนตาเล่นที่รอดำเนินการได้อย่างปลอดภัย จึงไม่ได้อัปโหลด
Dropbox storage is no longer available. Use an Unciv API v1 server instead. = พื้นที่จัดเก็บ Dropbox ไม่พร้อมใช้งานแล้ว โปรดใช้เซิร์ฟเวอร์ Unciv API v1 แทน
Could not persist the multiplayer server for this game. = ไม่สามารถบันทึกเซิร์ฟเวอร์ผู้เล่นหลายคนสำหรับเกมนี้ได้
The multiplayer server address is invalid. = ที่อยู่เซิร์ฟเวอร์ผู้เล่นหลายคนไม่ถูกต้อง
This build requires a public HTTPS multiplayer server address. = บิลด์นี้ต้องใช้ที่อยู่เซิร์ฟเวอร์ผู้เล่นหลายคน HTTPS แบบสาธารณะ
The multiplayer server attempted an unsafe redirect. = เซิร์ฟเวอร์ผู้เล่นหลายคนพยายามเปลี่ยนเส้นทางที่ไม่ปลอดภัย
The multiplayer server redirected too many times. = เซิร์ฟเวอร์ผู้เล่นหลายคนเปลี่ยนเส้นทางหลายครั้งเกินไป
The multiplayer server address could not be resolved. = ไม่สามารถแปลงที่อยู่เซิร์ฟเวอร์ผู้เล่นหลายคนได้
A secure connection to the multiplayer server could not be established. = ไม่สามารถสร้างการเชื่อมต่อที่ปลอดภัยกับเซิร์ฟเวอร์ผู้เล่นหลายคนได้
Connecting to the multiplayer server timed out. = หมดเวลาการเชื่อมต่อกับเซิร์ฟเวอร์ผู้เล่นหลายคน
The multiplayer server took too long to respond. = เซิร์ฟเวอร์ผู้เล่นหลายคนใช้เวลาตอบกลับนานเกินไป
The multiplayer request was cancelled. = ยกเลิกคำขอผู้เล่นหลายคนแล้ว
The multiplayer server could not be reached. = ไม่สามารถเข้าถึงเซิร์ฟเวอร์ผู้เล่นหลายคนได้
The multiplayer server returned an invalid response. = เซิร์ฟเวอร์ผู้เล่นหลายคนส่งคืนการตอบกลับที่ไม่ถูกต้อง
The multiplayer server failed with status [statusCode]. = เซิร์ฟเวอร์ผู้เล่นหลายคนล้มเหลวด้วยสถานะ [statusCode]
The multiplayer server rejected the request with status [statusCode]. = เซิร์ฟเวอร์ผู้เล่นหลายคนปฏิเสธคำขอด้วยสถานะ [statusCode]
Authentication validation was cancelled = ยกเลิกการตรวจสอบการยืนยันตัวตนแล้ว
The game was uploaded, but its multiplayer preview is not confirmed. = อัปโหลดเกมแล้ว แต่ยังไม่ยืนยันตัวอย่างผู้เล่นหลายคน
The multiplayer server may have stored the game, but did not confirm the upload. = เซิร์ฟเวอร์ผู้เล่นหลายคนอาจจัดเก็บเกมไว้แล้ว แต่ไม่ได้ยืนยันการอัปโหลด
The document picker returned no save location = ตัวเลือกเอกสารไม่ได้ส่งคืนตำแหน่งบันทึก
The document picker returned no file = ตัวเลือกเอกสารไม่ได้ส่งคืนไฟล์
Another document picker is already open = ตัวเลือกเอกสารอื่นเปิดอยู่แล้ว
