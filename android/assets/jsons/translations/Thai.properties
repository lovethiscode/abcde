survivors (adds population to a city) = ผู้รอดชีวิต (เพิ่มประชากรให้เมือง)

a stash of gold = ทองที่ซ่อนไว้

discover a lost technology = ค้นพบเทคโนโลยีที่สูญหาย

Our unit finds advanced weaponry hidden in the ruins! = ยูนิตเราพบอาวุธล้ำสมัยซ่อนอยู่ในซากโบราณ!
advanced weaponry for your explorer = อาวุธล้ำสมัยสำหรับนักสำรวจของท่าน

You find evidence of Barbarian activity. Nearby Barbarian camps are revealed! = ท่านพบหลักฐานความเคลื่อนไหวของคนเถื่อน ค่ายคนเถื่อนใกล้เคียงถูกเปิดเผย!
reveal nearby Barbarian camps = เปิดเผยค่ายคนเถื่อนใกล้เคียง

find a crudely-drawn map = พบแผนที่วาดอย่างหยาบ


