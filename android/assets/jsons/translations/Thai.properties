Pachacuti = ปาชากูตี
Resistance is futile! You cannot hope to stand against the mighty Incan empire. If you will not surrender immediately, then prepare for war! = ต่อต้านไปก็ไร้ผล! ท่านไม่มีหวังต้านจักรวรรดิอินคาอันยิ่งใหญ่ หากไม่ยอมจำนนทันที ก็เตรียมทำสงคราม!
Declare war on me?!? You can't, because I declare war on you first! = ประกาศสงครามกับข้าหรือ?!? ท่านทำไม่ได้ เพราะข้าประกาศสงครามกับท่านก่อน!
How did you darken the sun? I ruled with diligence and mercy—see that you do so as well. = ท่านทำให้ดวงอาทิตย์มืดลงได้อย่างไร? ข้าปกครองด้วยความขยันและเมตตา จงทำเช่นเดียวกัน
How are you? You stand before Pachacuti Inca Yupanqui. = ท่านเป็นอย่างไรบ้าง? ท่านยืนต่อหน้าปาชากูตี อินคา ยูปังกี
The Incan people offer this fair trade. = ชาวอินคาขอเสนอการค้าที่เป็นธรรมนี้
How are you doing? = ท่านเป็นอย่างไรบ้าง?
What do you want now? = คราวนี้ท่านต้องการอะไร?
Great Andean Road = มหาถนนแอนดีส
King Pachacuti Sapa Inca, maker of the world and ruler of Tawantinsuyu and the Inca people, your loyal subjects greet you! In the beginning, the small state of Cusco already showed the Incans were promised for greatness. They won many wars against powerful enemies, relentlessly crushing any army that dared oppose them, and forged a mighty empire stretching from Ecuador to Chile, the greatest ever seen in pre-Columbian America. Not just undaunted soldiers, Inca people were accomplished builders and artists, their magnificient and unequalled culture still fascinating the world today. = กษัตริย์ปาชากูตี ซาปาอินคา ผู้สร้างโลก ผู้ปกครองตาวันตินซูยูและชาวอินคา ราษฎรภักดีขอต้อนรับ! ตั้งแต่ต้น รัฐกุสโกอันเล็กแสดงว่าอินคามีชะตายิ่งใหญ่ พวกเขาชนะศัตรูทรงพลังหลายสงคราม บดขยี้ทุกกองทัพที่กล้าต่อต้าน และสร้างจักรวรรดิจากเอกวาดอร์ถึงชิลี ใหญ่ที่สุดในอเมริกาก่อนโคลัมบัส ชาวอินคาไม่เพียงเป็นทหารกล้า แต่เป็นช่างก่อสร้างและศิลปินชั้นยอด วัฒนธรรมอันงดงามไร้เทียมทานยังดึงดูดโลกทุกวันนี้
O Emperor Pachacuti, honor your name of 'Earth Shaker'! Will you once again summon the power of the earth to unite all Incan people under the protection of Sapa Inca, the Son of the Sun? Will your new empire shine through the ages of history? = จักรพรรดิปาชากูตี จงสมชื่อ ‘ผู้เขย่าโลก’! ท่านจะเรียกพลังแผ่นดินมารวมชาวอินคาใต้การคุ้มครองของซาปาอินคา โอรสแห่งดวงอาทิตย์ อีกครั้งหรือไม่? จักรวรรดิใหม่ของท่านจะส่องประกายผ่านยุคสมัยแห่งประวัติศาสตร์หรือไม่?
