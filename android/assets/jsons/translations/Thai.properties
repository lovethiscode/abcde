Catherine = แคทเธอรีน
You've behaved yourself very badly, you know it. Now it's payback time. = ท่านประพฤติตัวเลวร้ายมาก ท่านก็รู้ บัดนี้ถึงเวลาชดใช้
You've mistaken my passion for a weakness, you'll regret about this. = ท่านเข้าใจผิดว่าความกระตือรือร้นของข้าเป็นความอ่อนแอ ท่านจะเสียใจ
We were defeated, so this makes me your prisoner. I suppose there are worse fates. = เราพ่ายแพ้แล้ว ข้าจึงเป็นเชลยของท่าน คิดว่าคงมีชะตาที่แย่กว่านี้
Fine then. It's your call. = ก็ได้ ท่านเลือกเองแล้วกัน
I greet you, stranger! If you are as intelligent and tactful as you are attractive, we'll get along just fine. = ข้าขอต้อนรับคนแปลกหน้า! หากท่านฉลาดและรู้กาลเทศะเท่าความมีเสน่ห์ของท่าน เราคงเข้ากันได้ดี
How would you like it if I propose this kind of exchange? = ท่านจะว่าอย่างไรหากข้าเสนอการแลกเปลี่ยนเช่นนี้?
Hello! = สวัสดี!
What do you need?! = ท่านต้องการอะไร?!
Siberian Riches = ทรัพย์แห่งไซบีเรีย
Hail to Imperial Majesty Catherine, Empress of all Russians. Living in the largest country in the world, from the Pacific Ocean in the east to the Baltic Sea in the west, your people endured wars, droughts, and many disasters, imbuing the Russian society with heroism and tenacity, and producing artists and scientists among the best in the world. Russia is a powerful empire which rightfully claims its place in the world concert of superpowers. = ขอถวายพระพรจักรพรรดินีแคทเธอรีนแห่งรัสเซียทั้งปวง ประชาชนของท่านอาศัยในประเทศที่ใหญ่ที่สุดในโลก ตั้งแต่มหาสมุทรแปซิฟิกทางตะวันออกถึงทะเลบอลติกทางตะวันตก ผ่านสงคราม ภัยแล้ง และภัยพิบัติมากมาย จนสังคมรัสเซียเปี่ยมด้วยความกล้าหาญและทรหด สร้างศิลปินและนักวิทยาศาสตร์ชั้นยอดของโลก รัสเซียคือจักรวรรดิทรงอำนาจที่สมควรมีที่ยืนในหมู่มหาอำนาจโลก
Empress Catherine, your people are eager for Russian glory, to revive the sacred light of the Motherland. Will your new empire shine through the ages of history? = จักรพรรดินีแคทเธอรีน ประชาชนโหยหาเกียรติยศรัสเซียและการฟื้นแสงศักดิ์สิทธิ์แห่งมาตุภูมิ จักรวรรดิใหม่ของท่านจะส่องประกายผ่านยุคสมัยแห่งประวัติศาสตร์หรือไม่?
