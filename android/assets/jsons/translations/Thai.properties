Isabella = อิซาเบลลา
God will probably forgive you... but I shall not. Prepare for war. = พระเจ้าอาจให้อภัยท่าน... แต่ข้าไม่ เตรียมทำสงคราม
Repugnant spawn of the devil! You will pay! = ลูกสมุนปีศาจอันน่ารังเกียจ! ท่านจะต้องชดใช้!
If my defeat is, without any doubt, the will of God, then I will accept it. = หากความพ่ายแพ้ของข้าเป็นพระประสงค์ของพระเจ้าโดยไร้ข้อสงสัย ข้าก็ยอมรับ
God blesses those who deserve it. I am Isabel of Spain. = พระเจ้าอวยพรผู้สมควรได้รับ ข้าคืออิซาเบลแห่งสเปน
I hope this deal will receive your blessing. = ข้าหวังว่าข้อตกลงนี้จะได้รับพรจากท่าน
Seven Cities of Gold = เจ็ดนครทองคำ
Holy Isabella, envoy of God, Great Queen of Castille and León, your people celebrate you! Spain is a beautiful and ancient country, a link between Europe and Africa, one shore on the Mediterranean and the other on the mighty Atlantic Ocean. The Spanish culture had taken the best of the Christian and Muslim worlds, and was ready to dominate the world for centuries. Powerful Spanish military fleets and brave explorers found and conquered much of the New World. Exploiting a whole new continent and its riches, Spain reached a state of power few could compete with for hundreds of years. = อิซาเบลลาผู้ศักดิ์สิทธิ์ ทูตแห่งพระเจ้า มหาราชินีแห่งกัสติยาและเลออน ประชาชนยกย่องท่าน! สเปนเป็นประเทศงดงามและเก่าแก่ เชื่อมยุโรปกับแอฟริกา ฝั่งหนึ่งติดเมดิเตอร์เรเนียน อีกฝั่งติดมหาสมุทรแอตแลนติกอันยิ่งใหญ่ วัฒนธรรมสเปนรับสิ่งดีที่สุดจากโลกคริสต์และมุสลิม พร้อมครองโลกหลายศตวรรษ กองเรืออันทรงพลังและนักสำรวจผู้กล้าค้นพบและพิชิตโลกใหม่ส่วนใหญ่ การใช้ประโยชน์จากทวีปใหม่และทรัพย์สินทำให้สเปนมีอำนาจที่น้อยชาติเทียบได้อยู่นับร้อยปี
O splendid and virtuous Isabella! By the will of the heavens, will Spain reborn to achieve its holy destiny and become a new El Dorado? Will your new empire shine through the ages of history? = อิซาเบลลาผู้งดงามและทรงคุณธรรม! ด้วยพระประสงค์แห่งสวรรค์ สเปนจะเกิดใหม่เพื่อบรรลุชะตาศักดิ์สิทธิ์และเป็นเอลโดราโดแห่งใหม่หรือไม่? จักรวรรดิใหม่ของท่านจะส่องประกายผ่านยุคสมัยแห่งประวัติศาสตร์หรือไม่?
