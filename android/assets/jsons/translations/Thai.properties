Skip public nickname = ข้ามชื่อเล่นสาธารณะ
Public nickname consent = ความยินยอมให้แสดงชื่อเล่นสาธารณะ
I agree that my nickname may be displayed publicly in Unciv and its GitHub supporter list. The nickname and verified purchase submission will be stored in the public CloudKit database. = ฉันยินยอมให้แสดงชื่อเล่นของฉันต่อสาธารณะใน Unciv และรายชื่อผู้สนับสนุนบน GitHub ชื่อเล่นและข้อมูลการซื้อที่ยืนยันแล้วจะถูกเก็บไว้ในฐานข้อมูล CloudKit สาธารณะ
Agree and submit = ยอมรับและส่ง
