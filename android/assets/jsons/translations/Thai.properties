攻坚有序 = เหล่าทัพประสาน
不限难度。在与守城主要文明的同一场战争中，先由己方攻城单位或远程海军对城市造成正数伤害，再由另一支具备近战占城能力的部队战斗占领该城并完成归属选择。允许跨回合；议和或城市中途转手后重新开始。交易取得、直接解放不计。 = ที่ความยากใดก็ได้ ระหว่างสงครามเดียวกันกับอารยธรรมหลักฝ่ายป้องกัน ใช้ยูนิตล้อมเมืองหรือเรือโจมตีระยะไกลของคุณสร้างความเสียหายแก่เมืองมากกว่าศูนย์ก่อน แล้วใช้ยูนิตอื่นที่โจมตีประชิดได้ยึดเมืองผ่านการรบและเลือกความเป็นเจ้าของจนเสร็จ ทำข้ามเทิร์นได้ หากมีสันติภาพหรือเมืองเปลี่ยนเจ้าของระหว่างนั้นต้องเริ่มลำดับใหม่ การแลกเปลี่ยนเมืองและปลดปล่อยโดยตรงไม่นับ
让攻城单位或远程海军先伤害敌城，再由另一支部队战斗占领。 = ทำความเสียหายเมืองศัตรูด้วยยูนิตล้อมเมืองหรือเรือโจมตีระยะไกล แล้วใช้ยูนิตอื่นยึดเมือง
让支援与攻城各司其职 = ผสานการสนับสนุนกับการบุกยึด
选择支援火力和夺城部队，组织真正的联合攻坚；允许轮换和损失，不用留残血给指定兵种。 = ให้การยิงสนับสนุนและยูนิตเข้ายึดเมืองทำหน้าที่เสริมกัน
战后新生 = เมืองฟื้นคืน
不限难度。战斗取得一座其他主要文明建立的城市并持续保有；抵抗结束时记录人口基准。此后在该城已连接首都的结算中，以正常粮食增长使人口超过该基准。无抵抗时以收城结算后人口为基准；直接赠送人口不能单独完成。 = ที่ความยากใดก็ได้ ยึดเมืองที่อารยธรรมหลักอื่นก่อตั้งผ่านการรบและถือครองต่อเนื่อง บันทึกประชากรเมื่อต่อต้านจบ หรือหลังประมวลผลการยึดหากไม่มีการต่อต้าน ในการประมวลผลภายหลังขณะที่เชื่อมกับเมืองหลวง ประชากรต้องเติบโตจากอาหารตามปกติสูงกว่าค่าตั้งต้นนั้น การได้รับประชากรโดยตรงอย่างเดียวทำเงื่อนไขนี้ไม่สำเร็จ
保有战斗取得的城市，抵抗结束后连接首都，并让人口以粮食增长超过基准。 = เก็บเมืองที่พิชิตมา ยุติการต่อต้าน เชื่อมกับเมืองหลวง และใช้อาหารให้ประชากรโตเกินค่าตั้งต้น
让战后的城市重新生长 = ให้เมืองเติบโตอีกครั้งหลังสงคราม
从拿下城市转向让城市重新发展，安排交通、粮食和治理。无需同时维持全帝国财政、幸福等多重指标。 = เปลี่ยนชัยชนะทางทหารเป็นเมืองที่ทำงานและเติบโตได้
罗马传承 = มรดกโรมัน
不限难度，使用罗马。在两座不同自建分城各通过正常生产完成一座普通建筑；各自至少一次实际生产结算因首都已有相应建筑而获得罗马加成，完成时加成条件仍有效。建筑可不同；直接购买完成、世界及国家奇观不计。分城可以先开工，不必等首都先完成才排队。 = เล่นเป็นโรมที่ความยากใดก็ได้ ผลิตสิ่งปลูกสร้างทั่วไปจนเสร็จตามปกติในเมืองที่คุณตั้งเองนอกเหนือจากเมืองหลวงสองแห่งที่ต่างกัน แต่ละแห่งต้องได้รับโบนัสโรมันในการประมวลผลการผลิตจริง เพราะเมืองหลวงมีสิ่งปลูกสร้างชนิดเดียวกัน และเงื่อนไขนี้ต้องยังเป็นจริงเมื่อสร้างเสร็จ สิ่งปลูกสร้างต่างชนิดกันได้ ไม่นับการซื้อ สิ่งมหัศจรรย์โลก และสิ่งมหัศจรรย์แห่งชาติ เริ่มสร้างก่อนเมืองหลวงสร้างเสร็จได้
让两座自建分城各通过实际享受罗马加成的普通生产完成一座建筑。 = ใช้โบนัสการผลิตโรมันผลิตสิ่งปลูกสร้างตามปกติให้เสร็จในเมืองรองที่ตั้งเองสองแห่ง แห่งละหนึ่งสิ่ง
让首都的积累惠及分城 = ให้เมืองหลวงช่วยเมืองใหม่
用首都积累带动分城建设，按各城需求选择建筑。体现罗马能力，不要求五城都造兵营或等十人口。 = ใช้เมืองหลวงสนับสนุนเมืองที่มีความต้องการต่างกัน
连弩初试 = หน้าไม้ยิงซ้ำ
不限难度，使用中国。同一支诸葛弩在一个己方回合内，对主要文明军事单位或城市完成两次主动攻击，两次均造成正数伤害，并持续归己方、存活至下一己方回合开始。可以攻击同一目标，不要求击杀或实战晋升；两次攻击均须发生在诸葛弩形态。若本局先取得正式胜利，则在胜利结算时核对剩余观察条件。 = เล่นเป็นจีนที่ความยากใดก็ได้ ใช้ชูโกนูตัวเดียวลงมือโจมตียูนิตทหารหรือเมืองของอารยธรรมหลักสองครั้งในเทิร์นเดียว โดยสร้างความเสียหายมากกว่าศูนย์ทั้งสองครั้ง ยูนิตต้องรอดและเป็นของคุณต่อเนื่องจนเริ่มเทิร์นถัดไป โจมตีเป้าหมายเดิมซ้ำได้ ไม่จำเป็นต้องสังหารหรือได้รับการเลื่อนขั้น ทั้งสองครั้งต้องอยู่ในรูปชูโกนู หากชัยชนะอย่างเป็นทางการจบเกมก่อน จะตรวจเงื่อนไขติดตามที่เหลือเมื่อประมวลผลชัยชนะนั้น
同一支诸葛弩本回合主动攻击两次并造成伤害，存活至下一己方回合。 = ใช้ชูโกนูตัวเดียวโจมตีให้เกิดความเสียหายสองครั้งในเทิร์นเดียว และเก็บไว้ถึงเทิร์นถัดไป
让连弩接连出击，带它平安归来 = โจมตีสองครั้งแล้วพายูนิตกลับ
决定第二次攻击打谁，以及如何保护射击后的部队。直接体验连射能力，不用先养经验、喂两个残血目标。 = เลือกเป้าหมายที่สองพร้อมวางแผนคุ้มครองผู้โจมตี
山间粮仓 = ยุ้งฉางภูเขา
不限难度，使用印加。在自建城市可工作范围内完成一处邻接至少两座山脉的梯田，并让市民在至少一次实际粮食结算中工作该地块；结算时梯田未被掠夺、仍属己方。不限城市人口，不要求三处梯田。 = เล่นเป็นอินคาที่ความยากใดก็ได้ สร้างนาขั้นบันไดที่ติดภูเขาอย่างน้อยสองแห่งในเขตทำงานของเมืองที่ตั้งเองจนเสร็จ พลเมืองต้องทำงานที่นั่นในการประมวลผลอาหารจริงอย่างน้อยหนึ่งครั้ง ขณะที่ยังเป็นของคุณและไม่ถูกปล้น ไม่กำหนดประชากรขั้นต่ำและไม่ต้องมีฟาร์มเพิ่ม
建成一处邻接两座山脉的梯田，并让市民实际工作它一次。 = สร้างนาขั้นบันไดติดภูเขาอย่างน้อยสองแห่ง และทำงานในการประมวลผลอาหารจริง
在群山之间收获粮食 = เก็บเกี่ยวอาหารระหว่างภูเขา
识别合适的山间丘陵，把地形限制变为粮食优势。只在已经发现合适位置时推荐。 = มองหาภูมิประเทศที่เปลี่ยนข้อจำกัดของภูเขาเป็นอาหาร
来去如风 = ควบดังสายลม
不限难度，使用蒙古。同一支怯薛骑兵在一个己方回合中，先主动攻击主要文明军事单位或城市并造成正数伤害，再主动移动到另一格，并持续归己方、存活至下一己方回合开始。攻击和移动均发生在怯薛形态；强制传送不计。若本局先取得正式胜利，则在胜利结算时核对剩余观察条件。 = เล่นเป็นมองโกเลียที่ความยากใดก็ได้ ใช้เคชิกตัวเดียวลงมือโจมตียูนิตทหารหรือเมืองของอารยธรรมหลักให้เกิดความเสียหายมากกว่าศูนย์ แล้วเคลื่อนที่โดยสมัครใจไปช่องอื่นในเทิร์นเดียวกัน ยูนิตต้องรอดและเป็นของคุณต่อเนื่องจนเริ่มเทิร์นถัดไป ทั้งสองคำสั่งต้องอยู่ในรูปเคชิก ไม่นับการย้ายตำแหน่งแบบบังคับ หากชัยชนะอย่างเป็นทางการจบเกมก่อน จะตรวจเงื่อนไขติดตามที่เหลือเมื่อประมวลผลชัยชนะนั้น
同一支怯薛骑兵攻击造成伤害后主动换格，存活至下一己方回合。 = โจมตีด้วยเคชิกหนึ่งตัว ย้ายไปช่องอื่น และเก็บไว้จนถึงเทิร์นถัดไป
射击之后，寻找下一处阵地 = หาตำแหน่งใหม่หลังยิง
预留移动力，在射击后选择撤离、侧移、让路或继续推进；完成一次即可，不把后撤规定为唯一正确解法。 = สำรองการเคลื่อนที่ไว้ถอย เปลี่ยนตำแหน่ง เปิดทาง หรือรุกต่อ
殊途同归 = เส้นทางที่แตกต่าง
不限难度。三个不同合格自由对局分别取得三种不同的非时间胜利，从科技、文化、征服、外交中任选三种。同一局游戏 只贡献首个正式终局结果；重载、复制存档不增加局数或胜利种类。 = ที่ความยากใดก็ได้ ชนะสามประเภทที่ต่างกันและไม่ใช่ตามเวลา จากวิทยาศาสตร์ วัฒนธรรม ครองโลก และการทูต โดยแต่ละครั้งต้องมาจากเกมเล่นอิสระที่เข้าเกณฑ์ต่างเกมกัน นับเฉพาะผลจบอย่างเป็นทางการครั้งแรกของแต่ละ ID เกม การโหลดซ้ำหรือคัดลอกบันทึกไม่เพิ่มจำนวนเกมหรือประเภทชัยชนะ
在三个不同的合格对局中，取得三种不同的非时间胜利。 = ชนะสามประเภทที่ต่างกันและไม่ใช่ตามเวลา ในเกมเข้าเกณฑ์สามเกมต่างกัน
用三种方式走向胜利 = ค้นหาสามเส้นทางสู่ชัยชนะ
走出熟悉的一种打法，体验三种不同战略。次数对应策略种类，不是把同一局再刷两遍。 = สำรวจกลยุทธ์ที่แตกต่าง แทนการทำเส้นทางที่คุ้นเคยซ้ำ
五波之后 = หลังห้าระลอก
无尽，轻松或野蛮均可。同一次挑战首次在期限内清除第一关全部五波，进入关卡完成结算，且核心仍归己方。 = ในโหมดไม่สิ้นสุดจังหวะสบายหรือดุเดือด ผ่านทั้งห้าระลอกของด่านแรกภายในกำหนดในการเล่นครั้งเดียว และถึงการประมวลผลจบด่านโดยยังครอบครองแกนกลาง
在期限内清除第一关的五波敌军，并保有核心城市。 = ผ่านห้าระลอกของด่านแรกก่อนกำหนด โดยยังรักษาแกนกลางไว้
守过第一关的五波来敌 = ยืนหยัดผ่านห้าระลอกแรก
将布防、资源与波次处理贯穿一整个关卡，获得清楚的首次通关反馈。 = บริหารการวางกำลัง ทรัพยากร และรับมือระลอกศัตรูตลอดหนึ่งด่านเต็ม
三城同守 = สามเมืองยืนหยัด
无尽，轻松或野蛮均可。已解锁三城容量；某关第一波出现前已拥有三座城市，从第一波出现到该关按时完成，这三城持续归己方。不限必须哪一关完成，不限制部队损失和关间奖励选择。 = ในโหมดไม่สิ้นสุดทั้งสองจังหวะ ปลดล็อกความจุสามเมืองและครอบครองสามเมืองก่อนระลอกแรกของด่านปรากฏ รักษาทั้งสามไว้ต่อเนื่องจนจบด่านภายในเวลา ด่านใดก็เข้าเกณฑ์ ไม่จำกัดการสูญเสียยูนิตหรือตัวเลือกรางวัลระหว่างด่าน
一关首波来临前已有三城，持续保有这三城直到按时过关。 = มีสามเมืองก่อนเริ่มด่าน และรักษาไว้ต่อเนื่องจนผ่านด่านภายในเวลา
让三座城市一同守到关末 = รักษาสามเมืองให้ยืนหยัดจนจบ
主动扩张后承担更复杂的防线，安排机动支援与城市分工；不是要求所有玩家都建满三城。 = รับมือทางเลือกการป้องกันที่เกิดจากการขยาย และแบ่งกำลังสนับสนุนระหว่างเมือง
不息战线 = แนวรบไม่ขาดสาย
无尽，野蛮节奏。在同一次挑战中完成前三关。允许正常领取金币或增援；不同挑战的通关数不能相加。 = ในโหมดไม่สิ้นสุดจังหวะดุเดือด จบด่านหนึ่งถึงสามในการเล่นครั้งเดียว รับรางวัลทองคำและกำลังเสริมตามปกติได้ นำด่านจากต่างครั้งมารวมกันไม่ได้
在同一次野蛮节奏挑战中，完成前三关。 = จบสามด่านแรกในการเล่นจังหวะดุเดือดครั้งเดียว
在野蛮节奏中连过三关 = ผ่านสามด่านในจังหวะดุเดือด
在没有关间休整的节奏中管理资源与兵力，准备连续作战，而非跨局凑次数。 = บริหารกำลังและทรัพยากรตลอดการรบต่อเนื่อง
Could not copy to clipboard! = คัดลอกลงคลิปบอร์ดไม่ได้!
Add Modifier = เพิ่มตัวปรับค่า
No known values = ไม่มีค่าที่รู้จัก
Errors: = ข้อผิดพลาด:
No errors! = ไม่มีข้อผิดพลาด!
Pick language = เลือกภาษา
What would you like to do with the city? = คุณต้องการจัดการเมืองอย่างไร?
Will perform an extra ranged attack = จะโจมตีระยะไกลเพิ่มอีกครั้ง
Friends = เพื่อน
No friends added yet = ยังไม่ได้เพิ่มเพื่อน
Map Name = ชื่อแผนที่
Work in progress = กำลังพัฒนา
Quicksaving... = กำลังบันทึกด่วน...
Quicksave successful. = บันทึกด่วนสำเร็จ
Quickloading... = กำลังโหลดด่วน...
Quickload successful. = โหลดด่วนสำเร็จ
Generate screenshots = สร้างภาพหน้าจอ
Open unique builder = เปิดตัวสร้างคุณสมบัติพิเศษ
