# Fastlane
# These will be automatically copied to the fastlane descriptions used by F-Droid. Their keys are not as usual the english original, please read those directly as linked.

# Documentation: https://f-droid.org/en/docs/Build_Metadata_Reference/#Summary
# English to translate: https://github.com/yairm210/Unciv/blob/master/fastlane/metadata/android/en-US/short_description.txt
Fastlane_short_description = Joc 4X de construire a civilizației

# Documentation: https://f-droid.org/en/docs/Build_Metadata_Reference/#Description
# English to translate: https://github.com/yairm210/Unciv/blob/master/fastlane/metadata/android/en-US/full_description.txt
Fastlane_full_description = O reimplementare a celui mai faimos joc de construire a civilizației din toate timpurile - rapid, mic, fără reclame, gratuit pentru totdeauna!\n\nConstruiește-ți civilizația, cercetează tehnologii, extinde-ți orașele și învinge-ți dușmanii!\n\nCereri? Bug-uri? Lista de toate pentru aplicație este https://github.com/jerry8870/Unciv4iOS, fiecare mic ajutor este binevenit!\n\nÎntrebări? Comentarii? Doar plictisit? Alăturați-vă nouă pe https://discord.gg/bjrB4Xw.\n\nVrei să ajuți la traducerea jocului în limba ta? Trimite-mi un e-mail la yairm210@hotmail.com.\n\nGrok Java sau Kotlin? Alăturați-vă nouă la https://github.com/yairm210/Unciv.\n\nLumea așteaptă! Îți vei construi civilizația într-un imperiu care va rezista testului timpului?\n\nPermisiunea „a avea acces complet la rețea” este necesară pentru descărcări inițiate de utilizator și pentru caracteristica multiplayer. Toate celelalte permisiuni enumerate sunt incluse automat de API-ul utilizat pentru implementarea notificărilor de turnare pentru multiplayer. Permisiunile de rețea sunt folosite pentru a lista mod-uri, a descărca mod-uri, a descărca muzică și pentru a încărca/descărca jocuri multiplayer. Nicio altă comunicare pe internet nu este inițiată de Unciv.


