Unciv is made by an open-source community. This iOS version needs ongoing work to adapt to new systems, fix issues, and improve the controls. = kulupu li pali e Unciv. jan ale li ken lukin e nasin ilo ona li ken ante e ona. ilo musi iOS ni li wile e pali awen: ona o pona lon ilo sin, o jo ala e pakala, o pona tawa luka sina.
If you enjoy playing, you can support future iOS maintenance with a voluntary, one-time contribution. All game content and features are the same for everyone. = musi li pona tawa sina la sina ken pana e mani lon tenpo wan lon wile sina tawa awen pi ilo iOS. musi en ken ale ona li sama tawa jan ale.
