Online multiplayer servers are operated by third parties. The selected server receives your player ID, IP address, and game save data. Its availability, retention, deletion, and remote game saves are not guaranteed by Unciv. All players must use the same Unciv version and have the exact same versions of every mod installed. = jan ante li lawa e ilo linja pi musi jan mute. ilo linja wile li kama jo e Player ID sina e IP address sina e sona lipu awen. Unciv li ken ala pana e lon pona pi ilo ni e awen sona e weka sona e lipu awen lon linja. jan musi ale li wile kepeken pali sama pi Unciv en pali sama pi nasin ante ale.
