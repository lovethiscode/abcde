# Capturing a city

What would you like to do with the city of [cityName]? = Ufuna ukwenzani ngedolobha i-[cityName]?
Annex = Hlanganisa embusweni
Annexed cities become part of your regular empire. = Amadolobha ahlanganisiwe aba yingxenye evamile yombuso wakho.
Their citizens generate 2x the unhappiness, unless you build a courthouse. = Izakhamuzi zawo zikhiqiza ukungajabuli okungu-2x, ngaphandle uma wakha inkantolo.
Your civilization may not annex this city. = Impucuko yakho ayikwazi ukuhlanganisa leli dolobha embusweni.
Puppet = Beka umbuso wonodoli
Puppeted cities do not increase your tech or policy cost. = Amadolobha anemibuso yonodoli awenyusi izindleko zakho zobuchwepheshe noma zezinqubomgomo.
You have no control over the the production of puppeted cities. = Awukulawuli ukukhiqiza kwamadolobha anemibuso yonodoli.
Puppeted cities also generate 25% less Science and Culture. = Amadolobha anemibuso yonodoli aphinde akhiqize Isayensi neSiko okungaphansi ngo-25%.
A puppeted city can be annexed at any time. = Idolobha elinombuso wonodoli lingahlanganiswa embusweni noma nini.
Liberate (city returns to [originalOwner]) = Khulula (idolobha libuyela ku-[originalOwner])
Liberating a city returns it to its original owner, giving you a massive relationship boost with them! = Ukukhulula idolobha kulibuyisela kumnikazi walo wokuqala, kukhulise kakhulu ubudlelwano bakho naye!
Raze = Bhidliza
Razing the city annexes it, and starts burning the city to the ground. = Ukubhidliza idolobha kulihlanganisa embusweni bese kuqala ukulishisa liqedwe nya.
Razing the city puppets it, and starts burning the city to the ground. = Ukubhidliza idolobha kulenza umbuso wonodoli bese kuqala ukulishisa liqedwe nya.
The population will gradually dwindle until the city is destroyed. = Abantu bazoncipha kancane kancane kuze kubhujiswe idolobha.
Original capitals and holy cities cannot be razed. = Izinhlokodolobha zokuqala namadolobha angcwele akunakubhidlizwa.
Destroy = Bhubhisa
Destroying the city instantly razes the city to the ground. = Ukubhubhisa idolobha kuliqeda nya ngaso leso sikhathi.
Keep it = Ligcine
Remove your troops in our border immediately! = Khipha amabutho akho emngceleni wethu ngokushesha!
Sorry. = Ngiyaxolisa.
