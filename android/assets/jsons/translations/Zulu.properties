# Refactored menu and window localization
1. Tap Create room, choose the rules and map, then share the invitation. = 1. Thepha okuthi Dala igumbi, khetha imithetho nemephu, bese wabelane ngesimemo.
1. The Android player copies their Player ID from Multiplayer and sends it to the iOS host. = 1. Isidlali se-Android sikopisha i-ID yomdlali wabo kubadlali abaningi bese siyithumela kubasingathi be-iOS.
2. In an empty player seat, the host taps Add player manually, pastes the Player ID, taps the portrait to choose a civilization, then taps Mark ready. = 2. Esihlalweni sesidlali esingenalutho, umsingathi uthepha Engeza isidlali mathupha, unamathisele i-ID Yomdlali, acofe isithombe ukuze ukhethe impucuko, bese ethinta Maka ngomumo.
2. Other iOS players open the invitation or paste it in Join by invitation, tap their civilization portrait to choose, then tap Ready. = 2. Abanye abadlali be-iOS bavula isimemo noma banamathisele kokuthi Joyina ngesimemo, bachofoze isithombe sabo sempucuko ukuze bakhethe, bese ucindezela u-Ready.
3. After starting, the Game ID is copied automatically. Send it to the Android player to add the game in Multiplayer. = 3. Ngemva kokuqala, i-Game ID ikopishwa ngokuzenzakalelayo. Ithumele kusidlali se-Android ukuze ungeze igeyimu kubadlali abaningi.
3. The host is ready automatically. When everyone is ready, the host taps Start game. No Player ID or Game ID exchange is needed. = 3. Umsingathi uzilungele ngokuzenzakalelayo. Uma wonke umuntu eselungile, umsingathi uthepha okuthi Qala umdlalo. Akudingeki i-ID yomdlali noma i-ID yegeyimu.
