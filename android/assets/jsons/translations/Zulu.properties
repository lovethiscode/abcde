Learn about support = Funda ngokweseka
Continue playing = Qhubeka nokudlala
Unciv is made by an open-source community. This iOS version needs ongoing work to adapt to new systems, fix issues, and improve the controls. = I-Unciv yenziwa umphakathi wekhodi evulekile. Le nguqulo ye-iOS idinga umsebenzi oqhubekayo wokuhambisana nezinhlelo ezintsha, ukulungisa izinkinga nokuthuthukisa izilawuli.
If you enjoy playing, you can support future iOS maintenance with a voluntary, one-time contribution. All game content and features are the same for everyone. = Uma ukujabulela ukudlala, ungasekela ukunakekelwa kwe-iOS esikhathini esizayo ngomnikelo wokuzithandela wesikhathi esisodwa. Konke okuqukethwe nezici zomdlalo kuyafana kubo bonke.
