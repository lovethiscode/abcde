They promised not to settle near us ([turns] turns remaining) = Bafunge ukunga qali amadolobha eduzane nathi ([turns] turns remaining)

### DoNotAttackUs 

We have noticed substantial military activity near our borders. How should we interpret this? = Siqaphele ukusebenza kwamabutho okuningi eduze kwemingcele yethu. Kufanele sikuhumushe kanjani lokhu?
Do not worry. Our soldiers are merely passing by. = Ungakhathazeki. Amasosha ethu ayadlula nje.
Our military stands ready to finish what diplomacy could not! (DECLARE WAR) = Amabutho ethu alungele ukuqedela lokho ezombusazwe ezehlulekile ukukwenza! (MEMEZELA IMPI)
You have exposed yourself as a treacherous warmonger. = Uziveze njengomphembi wempi okhohlisayo.
