# These will be automatically copied to the fastlane descriptions used by F-Droid. Their keys are not as usual the english original, please read those directly as linked.

# Documentation: https://f-droid.org/en/docs/Build_Metadata_Reference/#Summary
# English to translate: https://github.com/yairm210/Unciv/blob/master/fastlane/metadata/android/en-US/short_description.txt
Fastlane_short_description = Umdlalo we-4X womthombo ovulekile wokwakha impucuko

# Documentation: https://f-droid.org/en/docs/Build_Metadata_Reference/#Description
# English to translate: https://github.com/yairm210/Unciv/blob/master/fastlane/metadata/android/en-US/full_description.txt
Fastlane_full_description = Ukuqaliswa kabusha komthombo ovulekile komdlalo wokwakha impucuko owaziwa kakhulu owake waba khona - okusheshayo nokuncane!\n\nYakha impucuko yakho, cwaninga ubuchwepheshe, nweba amadolobha akho futhi unqobe izitha zakho!\n\nUnezicelo? Uthole amaphutha? Ufuna ukusiza ekuthuthukiseni? Uhlu lwemisebenzi yohlelo lokusebenza luku-https://github.com/jerry8870/Unciv4iOS\n\nUnemibuzo noma imibono? Joyina i-Discord yethu ku-https://discord.gg/bjrB4Xw ;)\n\nUfuna ukusiza ukuhumushela umdlalo olimini lwakho? Bheka https://yairm210.github.io/Unciv/Translating/Translating/\n\nUmhlaba ulindile! Ingabe uzokwakha impucuko yakho ibe umbuso oyomelana novivinyo lwesikhathi?\n\nImvume "yokufinyelela ngokugcwele kunethiwekhi" iyadingeka ekulandeni okuqalwa ngumsebenzisi nasesicini sabadlali abaningi. Zonke ezinye izimvume ezisohlwini zifakwa ngokuzenzakalela yi-API esetshenziselwa izaziso zamathuba omdlalo wabadlali abaningi. Izimvume zenethiwekhi zisetshenziselwa ukufaka ohlwini ama-mod, ukulanda ama-mod, ukulanda umculo kanye nokulayisha noma ukulanda imidlalo yabadlali abaningi. Unciv ayiqalisi okunye ukuxhumana nge-inthanethi.


