When at later stages of the game, you might have a lot of units but only a little to do. To help you we have implemented an AutoPlay feature that lets you use the AI to play part or all of your turn. = When at later stages of the game, you might have a lot of units but only a little to do. To help you we have implemented an AutoPlay feature that lets you use the AI to play part or all of your turn.
To enable AutoPlay, go to options and open the AutoPlay tab and press "Show AutoPlay button". = To enable AutoPlay, go to options and open the AutoPlay tab and press "Show AutoPlay button".
Clicking on the AutoPlay button opens a popup menue for choosing to AutoPlay parts or all of your turn. = Clicking on the AutoPlay button opens a popup menue for choosing to AutoPlay parts or all of your turn.
Clicking Start AutoPlay in the pop-up menue or long pressing the AutoPlay button begins the multi-turn AutoPlay. This will play your next turns as if you were an AI. = Clicking Start AutoPlay in the pop-up menue or long pressing the AutoPlay button begins the multi-turn AutoPlay. This will play your next turns as if you were an AI.
To cancel multi-turn AutoPlay you can press the AutoPlay button, next turn button or open the options menue. = To cancel multi-turn AutoPlay you can press the AutoPlay button, next turn button or open the options menue.
Multi-turn AutoPlay is not advised on harder difficulty levels as your AI will not play better against an AI with modifiers. = Multi-turn AutoPlay is not advised on harder difficulty levels as your AI will not play better against an AI with modifiers.
Multi-turn AutoPlay for multiplayer is not yet supported. = Multi-turn AutoPlay for multiplayer is not yet supported.

After building a shrine, your civilization will start generating ☮Faith. = After building a shrine, your civilization will start generating ☮Faith.
When enough ☮Faith has been generated, you will be able to found a pantheon. = When enough ☮Faith has been generated, you will be able to found a pantheon.
A pantheon will provide a small bonus for your civilization that will apply to all cities that have it as a majority religion. = A pantheon will provide a small bonus for your civilization that will apply to all cities that have it as a majority religion.
Each civilization can only choose a single pantheon belief, and each pantheon can only be chosen once. = Each civilization can only choose a single pantheon belief, and each pantheon can only be chosen once.
Generating more ☮Faith will allow you to found a religion. = Generating more ☮Faith will allow you to found a religion.

Keep generating ☮Faith, and eventually a great prophet will be born in one of your cities. = Keep generating ☮Faith, and eventually a great prophet will be born in one of your cities.
This great prophet can be used for multiple things: Constructing a holy site, founding a religion and spreading your religion. = This great prophet can be used for multiple things: Constructing a holy site, founding a religion and spreading your religion.
When founding your religion, you may choose another two beliefs. The founder belief will only apply to you, while the follower belief will apply to all cities following your religion. = When founding your religion, you may choose another two beliefs. The founder belief will only apply to you, while the follower belief will apply to all cities following your religion.
Additionally, the city where you used your great prophet will become the holy city of that religion. = Additionally, the city where you used your great prophet will become the holy city of that religion.
Once you have founded a religion, great prophets will keep being born every so often, though the amount of Faith☮ you have to save up will be higher. = Once you have founded a religion, great prophets will keep being born every so often, though the amount of Faith☮ you have to save up will be higher.
One of these great prophets can then be used to enhance your religion. = One of these great prophets can then be used to enhance your religion.
This will allow you to choose another follower belief, as well as an enhancer belief, that only applies to you. = This will allow you to choose another follower belief, as well as an enhancer belief, that only applies to you.
Do take care founding a religion soon, only about half the players in the game are able to found a religion! = Do take care founding a religion soon, only about half the players in the game are able to found a religion!

Religion inside cities = Religion inside cities
When founding a city, it won't follow a religion immediately. = When founding a city, it won't follow a religion immediately.
The religion a city follows depends on the total pressure each religion has within the city. = The religion a city follows depends on the total pressure each religion has within the city.
Followers are allocated in the same proportions as these pressures, and these followers can be viewed in the City Screen. = Followers are allocated in the same proportions as these pressures, and these followers can be viewed in the City Screen.
You are allowed to check religious followers and pressures in cities you do not own by selecting them. = You are allowed to check religious followers and pressures in cities you do not own by selecting them.
In both places, a tap/click on the icon of a religion will show detailed information with its effects. = In both places, a tap/click on the icon of a religion will show detailed information with its effects.
Based on this, you can get a feel for which religions have a lot of pressure built up in the city, and which have almost none. = Based on this, you can get a feel for which religions have a lot of pressure built up in the city, and which have almost none.
The city follows a religion if a majority of its population follows that religion, and will only then receive the effects of Follower and Pantheon beliefs of that religion. = The city follows a religion if a majority of its population follows that religion, and will only then receive the effects of Follower and Pantheon beliefs of that religion.

Spreading Religion = Spreading Religion
Spreading religion happens naturally, but can be sped up using missionaries or great prophets. = Spreading religion happens naturally, but can be sped up using missionaries or great prophets.
Missionaries can be bought in cities following a major religion, and will take the religion of that city. = Missionaries can be bought in cities following a major religion, and will take the religion of that city.
So do take care where you are buying them! If another civilization has converted one of your cities to their religion, missionaries bought there will follow their religion. = So do take care where you are buying them! If another civilization has converted one of your cities to their religion, missionaries bought there will follow their religion.
Great prophets always have your religion when they appear, even if they are bought in cities following other religions, but captured great prophets do retain their original religion. = Great prophets always have your religion when they appear, even if they are bought in cities following other religions, but captured great prophets do retain their original religion.
Both great prophets and missionaries are able to spread religion to cities when they are inside its borders, even cities of other civilizations. = Both great prophets and missionaries are able to spread religion to cities when they are inside its borders, even cities of other civilizations.
These two units can even enter tiles of civilizations with whom you don't have an open borders agreement! = These two units can even enter tiles of civilizations with whom you don't have an open borders agreement!
But do take care, missionaries will lose 250 religious strength each turn they end while in foreign lands. = But do take care, missionaries will lose 250 religious strength each turn they end while in foreign lands.
This diminishes their effectiveness when spreading religion, and if their religious strength ever reaches 0, they have lost their faith and disappear. = This diminishes their effectiveness when spreading religion, and if their religious strength ever reaches 0, they have lost their faith and disappear.
When you do spread your religion, the religious strength of the unit is added as pressure for that religion. = When you do spread your religion, the religious strength of the unit is added as pressure for that religion.
Cities also passively add pressure of their majority religion to nearby cities. = Cities also passively add pressure of their majority religion to nearby cities.
Each city provides +6 pressure per turn to all cities within 10 tiles, though the exact amount of pressure depends on the game speed. = Each city provides +6 pressure per turn to all cities within 10 tiles, though the exact amount of pressure depends on the game speed.
This pressure can also be seen in the City Screen, and gives you an idea of how religions in your cities will evolve if you don't do anything. = This pressure can also be seen in the City Screen, and gives you an idea of how religions in your cities will evolve if you don't do anything.
Holy cities also provide +30 pressure of the religion founded there to themselves, making it very difficult to effectively convert a holy city. = Holy cities also provide +30 pressure of the religion founded there to themselves, making it very difficult to effectively convert a holy city.
Lastly, before founding a religion, new cities you settle will start with 200 pressure for your pantheon. = Lastly, before founding a religion, new cities you settle will start with 200 pressure for your pantheon.
This way, all your cities will starting following your pantheon as long as you haven't founded a religion yet. = This way, all your cities will starting following your pantheon as long as you haven't founded a religion yet.

Inquisitors = Inquisitors
Inquisitors are the last religious unit, and their strength is removing other religions. = Inquisitors are the last religious unit, and their strength is removing other religions.
They can remove all other religions from one of your own cities, removing any pressures built up. = They can remove all other religions from one of your own cities, removing any pressures built up.
Great prophets also have this ability, and remove all other religions in the city when spreading their religion. = Great prophets also have this ability, and remove all other religions in the city when spreading their religion.
Often this results in the city immediately converting to their religion = Often this results in the city immediately converting to their religion
Additionally, when an inquisitor is stationed in or directly next to a city center, units of other religions cannot spread their faith there, though natural spread is unaffected. = Additionally, when an inquisitor is stationed in or directly next to a city center, units of other religions cannot spread their faith there, though natural spread is unaffected.

The Mayan unique ability, 'The Long Count', comes with a side effect: = The Mayan unique ability, 'The Long Count', comes with a side effect:
Once active, the game's year display will use mayan notation. = Once active, the game's year display will use mayan notation.
The Maya measured time in days from what we would call 11th of August, 3114 BCE. A day is called K'in, 20 days are a Winal, 18 Winals are a Tun, 20 Tuns are a K'atun, 20 K'atuns are a B'ak'tun, 20 B'ak'tuns a Piktun, and so on. = The Maya measured time in days from what we would call 11th of August, 3114 BCE. A day is called K'in, 20 days are a Winal, 18 Winals are a Tun, 20 Tuns are a K'atun, 20 K'atuns are a B'ak'tun, 20 B'ak'tuns a Piktun, and so on.
Unciv only displays ය B'ak'tuns, ඹ K'atuns and ම Tuns (from left to right) since that is enough to approximate gregorian calendar years. The Maya numerals are pretty obvious to understand. Have fun deciphering them! = Unciv only displays ය B'ak'tuns, ඹ K'atuns and ම Tuns (from left to right) since that is enough to approximate gregorian calendar years. The Maya numerals are pretty obvious to understand. Have fun deciphering them!

Your cities will periodically demand different luxury goods to satisfy their desire for new things in life. = Your cities will periodically demand different luxury goods to satisfy their desire for new things in life.
If you manage to acquire the demanded luxury by trade, expansion, or conquest, the city will celebrate We Love The King Day for 20 turns. = If you manage to acquire the demanded luxury by trade, expansion, or conquest, the city will celebrate We Love The King Day for 20 turns.
During the We Love The King Day, the city will grow 25% faster. = During the We Love The King Day, the city will grow 25% faster.
This means exploration and trade is important to grow your cities! = This means exploration and trade is important to grow your cities!

Air Combat and Interception = Air Combat and Interception
Air Combat is very similar to normal Combat, with a few wrinkles. Damage is still dealt using the same equations based on the relative Strength of the Attacking and Defending Unit. = Air Combat is very similar to normal Combat, with a few wrinkles. Damage is still dealt using the same equations based on the relative Strength of the Attacking and Defending Unit.
However, before the Attacker and Defender fight, there is an added combat phase called Interception. If there is any unit with Interception Range that covers the target attacked tile, then it will attempt to Intercept the Attacking Air Unit. If multiple units can Intercept, the one with higher Intercept chance does it. = However, before the Attacker and Defender fight, there is an added combat phase called Interception. If there is any unit with Interception Range that covers the target attacked tile, then it will attempt to Intercept the Attacking Air Unit. If multiple units can Intercept, the one with higher Intercept chance does it.
Generally Land/Naval Units have an Intercept Range of 2 Tiles, and Air Units have an Intercept Range of their Attack Range. = Generally Land/Naval Units have an Intercept Range of 2 Tiles, and Air Units have an Intercept Range of their Attack Range.
Ground and Naval Units don't require movement points to Intercept, just Attacks. Air Units cannot have moved nor attacked in the preceding turn. = Ground and Naval Units don't require movement points to Intercept, just Attacks. Air Units cannot have moved nor attacked in the preceding turn.
The Intercepting Unit rolls to see if it hits. Whether it hits or not costs an Attack, and most units (without Promotions) can only Attack Once per Nation's Turn. It does NOT cost Movement Points, but Air Units that have used their Movement cannot Intercept between turns. = The Intercepting Unit rolls to see if it hits. Whether it hits or not costs an Attack, and most units (without Promotions) can only Attack Once per Nation's Turn. It does NOT cost Movement Points, but Air Units that have used their Movement cannot Intercept between turns.
If the Intercepting Unit Hits, it deals damage according to the Combat Strength calculation to the Attacking Air Unit, potentially with any Strength Bonuses that apply to Interception. It does not receive damage from the Attacking Air Unit. = If the Intercepting Unit Hits, it deals damage according to the Combat Strength calculation to the Attacking Air Unit, potentially with any Strength Bonuses that apply to Interception. It does not receive damage from the Attacking Air Unit.
After Interception resolves, the Attacking Air Unit and the Defending Unit in the targeted tile do Combat as normal, with damage dealt to both sides. = After Interception resolves, the Attacking Air Unit and the Defending Unit in the targeted tile do Combat as normal, with damage dealt to both sides.
To help deal with Interceptions, see Air Sweeps. = To help deal with Interceptions, see Air Sweeps.

Air Sweeps = Air Sweeps
Fighter units are able to perform Air Sweeps over a tile helping clear out potential enemy Air, Sea, or Land Interceptions that can reach that tile. = Fighter units are able to perform Air Sweeps over a tile helping clear out potential enemy Air, Sea, or Land Interceptions that can reach that tile.
While this Action will take an Attack, the benefit is drawing out Interceptions to help protect your other Air Units. Especially your Bombers. = While this Action will take an Attack, the benefit is drawing out Interceptions to help protect your other Air Units. Especially your Bombers.
Your unit will always draw an Interception, if one can reach the target tile, even if the Intercepting unit has a chance to miss. = Your unit will always draw an Interception, if one can reach the target tile, even if the Intercepting unit has a chance to miss.
If the Interceptor is not an Air Unit (eg Land or Sea), the Air Sweeping unit and Interceptor take no damage! = If the Interceptor is not an Air Unit (eg Land or Sea), the Air Sweeping unit and Interceptor take no damage!
If the Interceptor is an Air Unit, the two units will damage each other in a straight fight with no Interception bonuses. And only the Attacking Air Sweep Unit gets any Air Sweep strength bonuses. = If the Interceptor is an Air Unit, the two units will damage each other in a straight fight with no Interception bonuses. And only the Attacking Air Sweep Unit gets any Air Sweep strength bonuses.

Fortify, Guard, Withdraw = Fortify, Guard, Withdraw
Most Land units have the ability to Fortify. As they spend time without moving, they will slowly gain a Fortification Bonus to their Combat Strength representing digging in and preparing in case of an attack. = Most Land units have the ability to Fortify. As they spend time without moving, they will slowly gain a Fortification Bonus to their Combat Strength representing digging in and preparing in case of an attack.
Some units have the ability to Withdraw before a melee attack is struck. However, perhaps you wish for them to stand their ground to protect a particular tile. If you do, then give them the Guard command and they will stay fixed until they die or you give them fresh orders. = Some units have the ability to Withdraw before a melee attack is struck. However, perhaps you wish for them to stand their ground to protect a particular tile. If you do, then give them the Guard command and they will stay fixed until they die or you give them fresh orders.
This is NOT the same as Fortify but they will still gain the Fortification Bonus. They will simply not utilize their Withdraw ability. Fortified units with the Withdraw ability will try to flee when attacked. = This is NOT the same as Fortify but they will still gain the Fortification Bonus. They will simply not utilize their Withdraw ability. Fortified units with the Withdraw ability will try to flee when attacked.

City Tile Blockade = City Tile Blockade
One of your tiles is blocked by an enemy: when an enemy unit stands on a tile you own, the tile will not produce yields and cannot be worked by a city this turn. City will reallocate population from a blocked tile automatically. = One of your tiles is blocked by an enemy: when an enemy unit stands on a tile you own, the tile will not produce yields and cannot be worked by a city this turn. City will reallocate population from a blocked tile automatically.
Enemy military land units block tiles they are standing on. Enemy military naval units additionally block adjacent water tiles. To protect your tiles from blockade, place a friendly military unit on it or fight off invaders. = Enemy military land units block tiles they are standing on. Enemy military naval units additionally block adjacent water tiles. To protect your tiles from blockade, place a friendly military unit on it or fight off invaders.

One of your cities is under a naval blockade! When all adjacent water tiles of a coastal city are blocked - city loses harbor connection to all other cities, including capital. Make sure to de-blockade cities by deploying friendly military naval units to fight off invaders. = One of your cities is under a naval blockade! When all adjacent water tiles of a coastal city are blocked - city loses harbor connection to all other cities, including capital. Make sure to de-blockade cities by deploying friendly military naval units to fight off invaders.

Spies! = Spies!
The first time a civ reaches the Renaissance era each nation gets one spy. Every time a civ reaches an era afterwards they get one more spy. = The first time a civ reaches the Renaissance era each nation gets one spy. Every time a civ reaches an era afterwards they get one more spy.
Spies can be sent out to foreign cities to steal technology, rigging elections or stage coups. Place them in your own cities to do counter-intelligence work. = Spies can be sent out to foreign cities to steal technology, rigging elections or stage coups. Place them in your own cities to do counter-intelligence work.
Only one spy per civ is allowed in each city. Spies that are not in any city are on vacation in your spy hideout. = Only one spy per civ is allowed in each city. Spies that are not in any city are on vacation in your spy hideout.
Spies set up in cities of major civilizations will try to steal technology at a rate which is based off of the science production in the city. Succeeding to steal technology will level up your spy. Failing to succeed will level up the defending spy if it is present. = Spies set up in cities of major civilizations will try to steal technology at a rate which is based off of the science production in the city. Succeeding to steal technology will level up your spy. Failing to succeed will level up the defending spy if it is present.
Spies set in city-states will try to rig the elections in order to gain influence and reduce the influence of other civilizations. Only one spy partaking in rigging the election can win. = Spies set in city-states will try to rig the elections in order to gain influence and reduce the influence of other civilizations. Only one spy partaking in rigging the election can win.
A spy that is rigging an election in a city-state may also stage a coup. The likelihood of success for the coup depends on your relative influence to the current ally of the city-state, your spy level, and the level of the spy that the current ally has in the city-state if present. Succeeding a coup will make you their new ally and reduce the influence of all other civs. Failing a coup will kill your spy and level up the defending spy if present. = A spy that is rigging an election in a city-state may also stage a coup. The likelihood of success for the coup depends on your relative influence to the current ally of the city-state, your spy level, and the level of the spy that the current ally has in the city-state if present. Succeeding a coup will make you their new ally and reduce the influence of all other civs. Failing a coup will kill your spy and level up the defending spy if present.
Spies that are set up in your own cities will be conducting counter-intelligence. They reduce the success chance of other spies trying to steal your technology. = Spies that are set up in your own cities will be conducting counter-intelligence. They reduce the success chance of other spies trying to steal your technology.
Spies at a higher rank have a higher chance of success. The max rank a spy can reach is rank 3. After a spy is killed it will revive after a certain amount of turns back at rank 1. = Spies at a higher rank have a higher chance of success. The max rank a spy can reach is rank 3. After a spy is killed it will revive after a certain amount of turns back at rank 1.
Building buildings like the constabulary and police station will reduce the technology steal rate of spies in that city. = Building buildings like the constabulary and police station will reduce the technology steal rate of spies in that city.
Espionage is available using the Gods and Kings ruleset. To enable it in a new game click advanced settings, then click on the Enable Espionage option. = Espionage is available using the Gods and Kings ruleset. To enable it in a new game click advanced settings, then click on the Enable Espionage option.

