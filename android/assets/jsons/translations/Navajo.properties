原创战役共有四章十六关。每关至少获得一颗星，解锁下一关。\n完成本章获得章节完成记录；全部三星可获得精通勋章。\n各关的局势与目标独立，已通关关卡可反复挑战。 = The original campaign has four chapters and sixteen missions. Earn at least one star to unlock the next mission.\nComplete a chapter to record your progress; earn every star for its mastery medal.\nEach mission has its own situation and objectives. Completed missions can be replayed.
