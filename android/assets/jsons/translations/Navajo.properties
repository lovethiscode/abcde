本关发生归属中断，可在后续关卡重新尝试。 = Ownership was interrupted; try again in a later stage.
三城连续归属观察中，按时完成本关后核对。 = Observing continuous ownership; checked at timely stage completion.
达到三城容量并在首波前建立三城，可在后续关卡尝试。 = Unlock three-city capacity and own three cities before a future stage's first wave.
把长期发展转化为完整终局，纪念第一次亲自完成一场胜利。 = Bring long-term development to a complete ending and commemorate your first victory.
选择第二座城的位置，在资源、地形和扩张成本之间作第一次取舍。 = Choose the site of your second city and balance resources, terrain and expansion costs.
第一次为文明选择发展方向，感受政策带来的长期差异。 = Choose a direction for your civilization and discover the lasting effects of policies.
协调两座城市的生产与黄金时代时机；争夺奇观的风险，让排期本身成为决策。 = Coordinate production in two cities with the timing of a Golden Age. Competition for wonders makes scheduling a strategic choice.
围绕一座奇观安排科技和生产，体验与其他文明争夺同一目标。 = Plan technology and production around a wonder and compete with other civilizations to build it.
认识移动、攻击与生存的基本关系，获得第一次真实交锋的反馈。 = Learn how movement, attack and survival fit together through your first real battle.
把地图上的土地变成实际产出，理解工人与城市发展的关系。 = Turn land into productive tiles and learn how Workers support city development.
把分散的城市组织成网络，选择道路、海港或两者组合，而非只追求城市数量。 = Connect scattered cities into a network with roads, Harbors or both, rather than focusing only on city count.
让粮食、人口与教育设施相互支持，形成一座有清楚用途的学术中心。 = Combine food, population and educational buildings to create a dedicated center of learning.
比较不同城邦类型的收益，决定把有限外交投入放在哪里。 = Compare the benefits of different city-state types and decide where to invest your limited diplomatic resources.
把创教转为本土社会的共同信仰，体验城市布局、自然传播和主动传教的配合。 = Spread your founded religion at home by combining city placement, natural spread and active conversion.
在未知地图中获得发现的惊喜。作为自然探索纪念，不要求为三处奇观反复重开。 = Enjoy discoveries on an unfamiliar map. This exploration milestone does not require restarting repeatedly to find three wonders.
以有限城市投入科研，依靠质量和发展效率完成太空目标。允许防卫战争，限制的是指定战斗占城。 = Focus a limited number of cities on efficient research to reach space. Defensive wars are allowed; the restriction concerns the specified military captures.
在有限城市规模下集中积累文化，安排政策、建设与胜利项目的先后。 = Concentrate culture in a small empire and plan the order of policies, buildings and the victory project.
改变扩张来源：不继续自行建城，以军事实力和占领后的管理建立帝国。 = Expand through conquest rather than founding more cities, and build an empire through military strength and city management.
用有限城市支撑政策专精，选择两条适合当前战略的政策路线。 = Support focused policy development with a limited number of cities and choose two branches that suit your strategy.
围绕外国首都组织宗教影响力，选择传播对象与时机，承担跨国竞争。 = Build religious influence around foreign capitals, choosing where and when to spread it amid international competition.
利用埃及建造优势，把一座城市经营成奇观中心，在科技、生产与抢建风险之间取舍。自选重投入专项。 = Use Egypt’s building advantage to make one city a center of wonders, balancing research, production and competition. This is an optional challenge requiring substantial investment.
预先协调多条战线和占城部队，让几场局部战斗汇成同一回合的战略突破。 = Coordinate several fronts and capture units so that separate battles become a strategic breakthrough in one turn.
围绕波斯黄金时代的持续时间与战斗优势准备攻势，在有效窗口集中兑现实力。自选进阶专项。 = Prepare an offensive around the duration and combat advantages of Persia’s Golden Age. This is an optional advanced challenge.
用小国规模应对更高难度，挑选一条适合的非时间胜利路线，而非依靠不断扩张。 = Face a higher difficulty with a small empire and choose a suitable non-Time victory route instead of relying on constant expansion.
检验对整体战略、时机和局势判断的掌握；是玩家主动选择的高手目标。 = Test your command of strategy, timing and the situation. This expert challenge is optional.
让唯一城市承担科研、经济与防卫，寻找单城条件下的完整发展解法。 = Use one city for research, the economy and defense, and develop a complete strategy within that limit.
主动放弃世界奇观这条优势来源，探索政策、城市发展与文化胜利之间的其他组合。 = Forgo World Wonders and explore other ways to combine policies, city development and cultural victory.
