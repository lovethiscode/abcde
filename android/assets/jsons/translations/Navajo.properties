尝试不同文明的独特能力 = Explore each civilization's unique abilities
选择一条自己的胜利道路 = Find your own path to victory
无尽 · [p1] = Endless · [p1]
及以上 =  or higher
不限难度 = Any difficulty
开局至少 [p1] 个 AI = Start with at least [p1] AI opponents
单城挑战 = One City Challenge
启用宗教 = Religion enabled
初尝胜果 = First Taste of Victory
赢得任意一种正式胜利，包含时间胜利。 = Win any official victory, including a Time victory.
让文明走向胜利 = Lead your civilization to victory
让你的文明，\n迎来第一次胜利。 = Let your civilization\ncelebrate its first victory.
拓荒者 = Pioneer
自行建立首都之后的第二座城市；占领、获赠城市不计。 = Found your second city after the capital yourself; conquered or gifted cities do not count.
在远方建立新城 = Found a new city far from home
让一座新的城市，\n在首都之外升起。 = Let a new city rise\nbeyond your capital.
文化萌芽 = Seeds of Culture
首次采用一项社会政策；政策树的开门政策也计入。 = Adopt your first social policy; opening a policy tree also counts.
作出第一项政策选择 = Make your first policy choice
文明的思想，\n从一项选择开始。 = The ideas of a civilization\nbegin with a choice.
双城盛典 = Festival of Two Cities
王子及以上难度，开局至少3个 AI 对手。在同一段连续黄金时代内，于两座不同己方城市各自行建成至少一座世界奇观；黄金时代中断后重新计算。 = Prince difficulty or higher; start with at least 3 AI opponents. During one uninterrupted Golden Age, build at least one World Wonder yourself in each of two different cities you own; the count resets if the Golden Age ends.
在同一段连续黄金时代内，于两座不同己方城市各自行建成至少一座世界奇观；黄金时代中断后重新计算。 = During one uninterrupted Golden Age, build at least one World Wonder yourself in each of two different cities you own; the count resets if the Golden Age ends.
让黄金时代照亮两座奇观 = Let a Golden Age illuminate two wonders
在同一段黄金时代，\n让两座城各留下一座奇观。 = During the same Golden Age,\nleave a wonder in each of two cities.
奇迹初成 = A First Wonder
自行建成第一座世界奇观；允许大工程师加速，国家奇观不计。 = Build your first World Wonder yourself; Great Engineer assistance is allowed, but National Wonders do not count.
留下第一座世界奇观 = Build your first World Wonder
为这个时代，\n亲手留下一座世界奇观。 = With your own hands,\nleave this age a World Wonder.
初试锋芒 = First Clash
通过战斗消灭一支敌方军事单位；蛮族计入，俘获平民不计。 = Destroy an enemy military unit in combat; Barbarians count, but capturing civilians does not.
在交锋中消灭敌军 = Destroy an enemy in battle
让一次真正的交锋，\n见证你的锋芒。 = Let a true clash of arms\nreveal your strength.
耕耘大地 = Working the Land
由己方工人新建一处农场、矿井或牧场；修复旧设施不计。 = Have your own Worker build a new Farm, Mine or Pasture; repairing an existing improvement does not count.
亲手开垦一块土地 = Cultivate a piece of land yourself
让你的工人，\n第一次改变这片土地。 = Let your Worker\nchange this land for the first time.
四通八达 = All Roads Connected
王子及以上难度，开局至少3个 AI 对手。回合结束时，至少三座自建分城同时通过游戏认可的道路或海港连接首都；首都不计入三座分城。 = Prince difficulty or higher; start with at least 3 AI opponents. At turn end, at least 3 cities you founded besides the capital must simultaneously have game-recognized road or harbor connections to the capital; the capital does not count toward the 3.
回合结束时，至少三座自建分城同时通过游戏认可的道路或海港连接首都；首都不计入三座分城。 = At turn end, at least 3 cities you founded besides the capital must simultaneously have game-recognized road or harbor connections to the capital; the capital does not count toward the 3.
将三座分城连向首都 = Connect three founded cities to the capital
让三座亲手建立的分城，\n与首都连成一体。 = Let three cities you founded\njoin your capital in one network.
学城崛起 = A City of Learning
王子及以上难度，开局至少3个 AI 对手。回合结束时，一座自建城市人口至少十五，并同时拥有图书馆和大学。 = Prince difficulty or higher; start with at least 3 AI opponents. At turn end, a city you founded must have at least 15 population and both a Library and a University.
回合结束时，一座自建城市人口至少十五，并同时拥有图书馆和大学。 = At turn end, a city you founded must have at least 15 population and both a Library and a University.
让十五人口之城拥有大学 = Give a city of fifteen a university
在十五人口的城中，\n让图书馆与大学共同生长。 = In a city of fifteen,\nlet a Library and University flourish together.
城邦圆桌 = City-State Round Table
王子及以上难度，开局至少3个 AI 对手。回合结束时，同时成为至少三个不同类型城邦的盟友；已灭亡城邦不计。 = Prince difficulty or higher; start with at least 3 AI opponents. At turn end, simultaneously be allied with city-states of at least 3 different types; eliminated city-states do not count.
回合结束时，同时成为至少三个不同类型城邦的盟友；已灭亡城邦不计。 = At turn end, simultaneously be allied with city-states of at least 3 different types; eliminated city-states do not count.
与三种城邦结盟 = Ally with three types of city-state
让三种不同的城邦，\n同时选择与你结盟。 = Let three kinds of city-state\nchoose your alliance together.
信仰扎根 = Faith Takes Root
王子及以上难度，开局至少3个 AI 对手。须启用宗教。自行创立一个正式宗教，回合结束时它同时成为至少三座自建城市的多数宗教；仅建立万神殿不计。 = Prince difficulty or higher; start with at least 3 AI opponents. Religion must be enabled. Found a full religion yourself and, at turn end, make it the majority religion in at least 3 cities you founded simultaneously; a Pantheon alone does not count.
自行创立一个正式宗教，回合结束时它同时成为至少三座自建城市的多数宗教；仅建立万神殿不计。 = Found a full religion yourself and, at turn end, make it the majority religion in at least 3 cities you founded simultaneously; a Pantheon alone does not count.
让自创宗教扎根三城 = Establish your religion in three founded cities
让你创立的宗教，\n在三座自建城中成为多数。 = Let the religion you founded\nbecome the majority in three cities you founded.
博览山河 = Wonders of Nature
王子及以上难度，开局至少3个 AI 对手。同一局中探索发现三种不同的自然奇观；同一种只计一次。 = Prince difficulty or higher; start with at least 3 AI opponents. Discover 3 different types of Natural Wonder through exploration in one game; each type counts only once.
同一局中探索发现三种不同的自然奇观；同一种只计一次。 = Discover 3 different types of Natural Wonder through exploration in one game; each type counts only once.
发现三种自然奇观 = Discover three types of Natural Wonder
越过视野之外，\n寻找三种山河奇迹。 = Journey beyond the horizon\nto find three wonders of nature.
精密星程 = A Precise Path to the Stars
国王及以上难度，开局至少3个 AI 对手。获得科技胜利，且整局同时拥有的城市从未超过四座，也从未通过战斗攻占其他主要文明建立的城市。 = King difficulty or higher; start with at least 3 AI opponents. Win a Scientific victory without ever owning more than 4 cities at once or capturing in battle a city founded by another major civilization during the entire game.
获得科技胜利，且整局同时拥有的城市从未超过四座，也从未通过战斗攻占其他主要文明建立的城市。 = Win a Scientific victory without ever owning more than 4 cities at once or capturing in battle a city founded by another major civilization during the entire game.
以至多四城抵达星空 = Reach the stars with at most four cities
不靠攻城，不越四城，\n让科技带你走向胜利。 = Take no cities in battle; own no more than four.\nLet science carry you to victory.
四城华章 = A Four-City Masterpiece
国王及以上难度，开局至少3个 AI 对手。获得文化胜利，且整局同时拥有的城市从未超过四座；曾短暂拥有后丢弃的城市也计入上限。 = King difficulty or higher; start with at least 3 AI opponents. Win a Cultural victory without ever owning more than 4 cities at once during the entire game; cities briefly owned and then abandoned still count toward the limit.
获得文化胜利，且整局同时拥有的城市从未超过四座；曾短暂拥有后丢弃的城市也计入上限。 = Win a Cultural victory without ever owning more than 4 cities at once during the entire game; cities briefly owned and then abandoned still count toward the limit.
以至多四城赢得文化胜利 = Win through culture with at most four cities
将疆土留在四城之内，\n让文化赢得世界。 = Keep your realm within four cities\nand let culture win the world.
孤城出征 = One City's Campaign
国王及以上难度，开局至少3个 AI 对手。获得征服胜利，且整局只自行建立过首都这一座城市；允许攻占其他城市，不能先建分城再丢弃。 = King difficulty or higher; start with at least 3 AI opponents. Win a Domination victory having founded only your capital throughout the entire game. Capturing other cities is allowed; founding and then abandoning another city is not.
获得征服胜利，且整局只自行建立过首都这一座城市；允许攻占其他城市，不能先建分城再丢弃。 = Win a Domination victory having founded only your capital throughout the entire game. Capturing other cities is allowed; founding and then abandoning another city is not.
只建一城，征服世界 = Found only one city and conquer the world
只亲手建立一座城，\n从这里走向征服。 = Found just one city yourself,\nand set out from there to conquer.
专精之道 = The Path of Mastery
王子及以上难度，开局至少3个 AI 对手。完整采用两棵社会政策树，且截至达成时，整局同时拥有的城市从未超过三座。 = Prince difficulty or higher; start with at least 3 AI opponents. Fully adopt 2 social policy trees, having never owned more than 3 cities at once in the game up to that moment.
完整采用两棵社会政策树，且截至达成时，整局同时拥有的城市从未超过三座。 = Fully adopt 2 social policy trees, having never owned more than 3 cities at once in the game up to that moment.
在三城之内完成两棵政策树 = Complete two policy trees within three cities
将疆土收在三城以内，\n让两棵政策树枝叶完满。 = Keep your realm within three cities\nand let two policy trees fully bloom.
一教三邦 = One Faith, Three Nations
国王及以上难度，开局至少3个 AI 对手。须启用宗教。自行创立并强化一个宗教，回合结束时它成为至少三个不同其他主要文明现有首都的多数宗教。 = King difficulty or higher; start with at least 3 AI opponents. Religion must be enabled. Found and enhance a religion yourself. At turn end, it must be the majority religion in the current capitals of at least 3 different other major civilizations.
自行创立并强化一个宗教，回合结束时它成为至少三个不同其他主要文明现有首都的多数宗教。 = Found and enhance a religion yourself. At turn end, it must be the majority religion in the current capitals of at least 3 different other major civilizations.
让信仰走进三国首都 = Bring your faith to three foreign capitals
强化自己的宗教，\n让三国首都信奉它。 = Enhance your own religion\nand let three foreign capitals embrace it.
尼罗天际 = Skyline of the Nile
国王及以上难度，开局至少3个 AI 对手。使用埃及，在同一座当前仍属己方的城市中自行建成五种不同世界奇观；接收城市时已有的奇观不计。 = King difficulty or higher; start with at least 3 AI opponents. As Egypt, build 5 different types of World Wonder yourself in the same city, which you must still own; wonders already present when you acquired the city do not count.
使用埃及，在同一座当前仍属己方的城市中自行建成五种不同世界奇观；接收城市时已有的奇观不计。 = As Egypt, build 5 different types of World Wonder yourself in the same city, which you must still own; wonders already present when you acquired the city do not count.
为埃及一城建造五种奇观 = Build five kinds of wonder in one Egyptian city
让埃及的一座城，\n亲手建起五种世界奇观。 = Let one city of Egypt\nbuild five kinds of World Wonder.
三城破晓 = Dawn over Three Cities
国王及以上难度，开局至少3个 AI 对手。在己方同一回合，通过战斗完成对三座不同城市的占领；这些城市须由其他主要文明建立，同城反复易手、交易和直接解放不计。 = King difficulty or higher; start with at least 3 AI opponents. During the same turn of your own, capture 3 different cities in battle, all founded by other major civilizations. Repeated captures of the same city, trades and direct liberation do not count.
在己方同一回合，通过战斗完成对三座不同城市的占领；这些城市须由其他主要文明建立，同城反复易手、交易和直接解放不计。 = During the same turn of your own, capture 3 different cities in battle, all founded by other major civilizations. Repeated captures of the same city, trades and direct liberation do not count.
在同一回合攻下三座敌城 = Capture three enemy cities in one turn
在同一个回合，\n拿下三座不同的敌城。 = In one turn,\ntake three different enemy cities.
波斯长昼 = Persia's Long Day
皇帝及以上难度，开局至少4个 AI 对手。使用波斯，在同一段连续黄金时代内，通过战斗攻占四座不同城市，且这些城市的建立者包含至少两个其他主要文明；延长黄金时代有效，中断后重新计算。 = Emperor difficulty or higher; start with at least 4 AI opponents. As Persia, during one uninterrupted Golden Age, capture 4 different cities in battle whose founders include at least 2 other major civilizations. Extending the Golden Age counts; the count resets if it ends.
使用波斯，在同一段连续黄金时代内，通过战斗攻占四座不同城市，且这些城市的建立者包含至少两个其他主要文明；延长黄金时代有效，中断后重新计算。 = As Persia, during one uninterrupted Golden Age, capture 4 different cities in battle whose founders include at least 2 other major civilizations. Extending the Golden Age counts; the count resets if it ends.
在波斯长昼中夺取四城 = Take four cities in Persia's long day
让波斯的黄金时代，\n见证跨越两个文明的四城远征。 = Let Persia's Golden Age witness\na four-city campaign across two civilizations.
小国问鼎 = A Small Nation's Triumph
皇帝及以上难度，开局至少4个 AI 对手。获得一次非时间胜利，整局同时拥有的城市从未超过三座，且从未通过战斗攻占其他主要文明建立的城市。 = Emperor difficulty or higher; start with at least 4 AI opponents. Win a victory other than Time without ever owning more than 3 cities at once or capturing in battle a city founded by another major civilization during the entire game.
获得一次非时间胜利，整局同时拥有的城市从未超过三座，且从未通过战斗攻占其他主要文明建立的城市。 = Win a victory other than Time without ever owning more than 3 cities at once or capturing in battle a city founded by another major civilization during the entire game.
以至多三城问鼎世界 = Triumph with at most three cities
不越三城，不靠攻城，\n在时间之外，赢下一场胜利。 = Own no more than three cities; take none in battle.\nWin a victory other than Time.
逆神而胜 = Victory against the Gods
天神及以上难度，开局至少4个 AI 对手。获得一次非时间胜利；科技、文化、征服和外交胜利均可。 = Deity difficulty or higher; start with at least 4 AI opponents. Win a victory other than Time; Scientific, Cultural, Domination and Diplomatic victories all count.
获得一次非时间胜利；科技、文化、征服和外交胜利均可。 = Win a victory other than Time; Scientific, Cultural, Domination and Diplomatic victories all count.
在天神难度战胜列国 = Defeat your rivals on Deity
从天神难度的起点，\n赢得一场非时间胜利。 = Begin on Deity difficulty\nand win a victory other than Time.
一城群星 = One City among the Stars
皇帝及以上难度，开局至少4个 AI 对手。开启单城挑战并获得科技胜利，整局同时拥有的城市从未超过一座；短暂获得第二座城市也不符合条件。 = Emperor difficulty or higher; start with at least 4 AI opponents. Enable One City Challenge and win a Scientific victory without ever owning more than 1 city at once during the entire game; even briefly acquiring a second city disqualifies the game.
开启单城挑战并获得科技胜利，整局同时拥有的城市从未超过一座；短暂获得第二座城市也不符合条件。 = Enable One City Challenge and win a Scientific victory without ever owning more than 1 city at once during the entire game; even briefly acquiring a second city disqualifies the game.
在单城挑战中走向群星 = Reach the stars in One City Challenge
在单城挑战中，\n让唯一的城市赢得科技胜利。 = In One City Challenge,\nlet your only city win a Scientific victory.
无碑华章 = Culture without Wonders
皇帝及以上难度，开局至少4个 AI 对手。获得文化胜利，且整局从未拥有过任何世界奇观，包括占领或接收城市带来的奇观；国家奇观不受限制。 = Emperor difficulty or higher; start with at least 4 AI opponents. Win a Cultural victory without ever owning any World Wonder throughout the entire game, including wonders in conquered or acquired cities; National Wonders are unrestricted.
获得文化胜利，且整局从未拥有过任何世界奇观，包括占领或接收城市带来的奇观；国家奇观不受限制。 = Win a Cultural victory without ever owning any World Wonder throughout the entire game, including wonders in conquered or acquired cities; National Wonders are unrestricted.
不拥奇观，赢得文化胜利 = Win through culture without owning World Wonders
一座世界奇观也不曾拥有。\n让文化本身带你走向胜利。 = Never own a single World Wonder.\nLet culture itself carry you to victory.
海峡两岸 = Across the Water
不限难度。自行在与当前首都不同的连通陆地区域建立分城，为其建成海港或等价建筑；己方回合结算时，该城通过包含海路的有效连接接通首都。允许首都经道路连接本土港口后出海，不要求首都沿海。 = At any difficulty, found a non-capital city on a connected landmass different from that of your current capital and build a Harbor or equivalent there. At your turn-end settlement, the city must have a game-recognized connection to the capital that includes a sea route. The capital may connect by road to a domestic port; it need not be coastal.
在另一块陆地自建城市，建成海港，让海路将它接入首都。 = Found a city on another landmass and connect it to the capital by sea through a Harbor.
让海洋连接你的城市 = Connect your cities across the sea
选择值得投入的海外城址，安排港口和交通，让海洋成为发展通道。 = Balance expansion across the sea against the cost of connecting a distant settlement.
互通有无 = Something to Trade
不限难度。与一个主要文明完成一份有效交易：出口本国来源的重复奢侈品，换入交易前本国没有可用供应的一种奢侈品；交易后出口品仍至少保留一份，换入品已可用。允许金币等补差价，不要求总幸福非负或额外等待。 = At any difficulty, complete an effective trade with a major civilization: export a duplicate luxury from domestic sources and import a luxury for which you had no usable supply before the trade. Afterward, retain at least one usable copy of the exported luxury and have usable supply of the imported one. Gold or other balancing terms are allowed. Nonnegative total happiness and additional waiting are not required.
用本国的重复奢侈品，换入此前没有供应的一种奢侈品，且出口后保留一份。 = Trade a surplus domestic luxury for a luxury you did not have, retaining one of the exported luxury.
用富余资源换来新的选择 = Trade a surplus for a new choice
把富余资源转化为新的选择，寻找互利交易对象。阿拉伯可用大巴扎增加的资源份数达成。 = Turn surplus resources into a useful diplomatic choice.
重归故土 = Return to the Homeland
不限难度。通过战斗夺取一座其他主要文明或城邦建立的城市，选择解放并完成归还原建立者的结算；玩家此前没有正式拥有过该城。直接解放流程中的临时归属不算此前占有；不要求结盟或后续存活。 = At any difficulty, capture through combat a city founded by another major civilization or a city-state, choose liberation, and complete its return to the original founder. You must never have formally owned the city before. Temporary ownership during direct liberation does not count as prior possession. An alliance or subsequent survival is not required.
战斗夺取一座从未正式拥有过的外国城市，将它解放归还原建立者。 = Capture a foreign city you have never formally owned and liberate it to its founder.
将一座城市归还故土 = Return a city to its founder
在得到城市与归还城市之间作选择，留下外交意义上的战争故事。只在自然出现机会时尝试。 = Choose restoration instead of adding every conquest to your empire.
城下解围 = Relief at the Gates
不限难度。己方回合开始时，一座自建城市的相邻格有可见的敌对主要文明军事单位；本回合由己方部队或城市击败其中至少一支。到下一己方回合开始，该城始终归己方，且相邻格已没有任何可见的敌对主要文明军事单位。若本局先取得正式胜利，则在胜利结算时核对剩余观察条件。 = At any difficulty, a visible hostile major-civilization military unit must be adjacent to a self-founded city at the start of your turn. Your units or city must defeat at least one such unit during that turn. By the start of your next turn, the city must have remained continuously yours and have no visible hostile major-civilization military units adjacent. If an official victory ends the game first, the remaining observation conditions are checked at that victory settlement.
击败回合开始时邻接自建城市的一支敌军，下一己方回合确认解围。 = Defeat an enemy beside a self-founded city and confirm its relief next turn.
为城下的危机画上句号 = Bring a siege to an end
把兵力和城市火力集中到眼前危机，解除局部压力。不必等别人宣战、凑三杀或故意让城市受伤。 = Coordinate a counterattack and protect the city through the enemy response.
攻坚有序 = Combined Arms
不限难度。在与守城主要文明的同一场战争中，先由己方攻城单位或远程海军对城市造成正数伤害，再由另一支具备近战占城能力的部队战斗占领该城并完成归属选择。允许跨回合；议和或城市中途转手后重新开始。交易取得、直接解放不计。 = At any difficulty, during the same war against the defending major civilization, first deal positive damage to a city with your siege unit or ranged naval unit, then capture it through combat with a different melee-capable unit and complete the ownership choice. Actions may span turns. Peace or an intervening ownership change resets the sequence. Trades and direct liberation do not qualify.
让攻城单位或远程海军先伤害敌城，再由另一支部队战斗占领。 = Damage an enemy city with siege or ranged naval fire, then capture it with another unit.
让支援与攻城各司其职 = Let support and assault work together
选择支援火力和夺城部队，组织真正的联合攻坚；允许轮换和损失，不用留残血给指定兵种。 = Give supporting fire and the capturing unit complementary roles.
战后新生 = A City Reborn
不限难度。战斗取得一座其他主要文明建立的城市并持续保有；抵抗结束时记录人口基准。此后在该城已连接首都的结算中，以正常粮食增长使人口超过该基准。无抵抗时以收城结算后人口为基准；直接赠送人口不能单独完成。 = At any difficulty, capture through combat a city founded by another major civilization and retain it continuously. Record its population when resistance ends, or after capture settlement if there is no resistance. In a later settlement while connected to the capital, normal food-driven growth must raise population above that baseline. Directly granted population cannot complete the condition by itself.
保有战斗取得的城市，抵抗结束后连接首都，并让人口以粮食增长超过基准。 = Keep a conquered city, end its resistance, connect it to the capital and grow it with food beyond its baseline.
让战后的城市重新生长 = Let a city grow again after war
从拿下城市转向让城市重新发展，安排交通、粮食和治理。无需同时维持全帝国财政、幸福等多重指标。 = Turn military success into a functioning, growing city.
罗马传承 = Roman Inheritance
不限难度，使用罗马。在两座不同自建分城各通过正常生产完成一座普通建筑；各自至少一次实际生产结算因首都已有相应建筑而获得罗马加成，完成时加成条件仍有效。建筑可不同；直接购买完成、世界及国家奇观不计。分城可以先开工，不必等首都先完成才排队。 = As Rome at any difficulty, complete an ordinary building through normal production in each of two different self-founded non-capital cities. Each must have received the Roman bonus in an actual production settlement because the capital owned its matching building; that condition must still hold at completion. Buildings may differ. Purchases, world wonders and national wonders do not count. Starting construction before the capital finishes is allowed.
让两座自建分城各通过实际享受罗马加成的普通生产完成一座建筑。 = Complete a normally produced building in each of two self-founded satellite cities using the Roman production bonus.
让首都的积累惠及分城 = Let the capital help new cities
用首都积累带动分城建设，按各城需求选择建筑。体现罗马能力，不要求五城都造兵营或等十人口。 = Use the capital to support cities with different needs.
连弩初试 = The Repeating Crossbow
不限难度，使用中国。同一支诸葛弩在一个己方回合内，对主要文明军事单位或城市完成两次主动攻击，两次均造成正数伤害，并持续归己方、存活至下一己方回合开始。可以攻击同一目标，不要求击杀或实战晋升；两次攻击均须发生在诸葛弩形态。若本局先取得正式胜利，则在胜利结算时核对剩余观察条件。 = As China at any difficulty, one Chu-Ko-Nu must make two active attacks in a single turn against major-civilization military units or cities, dealing positive damage each time. It must remain alive and continuously yours until your next turn starts. The same target may be attacked twice; kills and earned promotions are not required. Both attacks must occur in Chu-Ko-Nu form. If an official victory ends the game first, the remaining observation conditions are checked at that victory settlement.
同一支诸葛弩本回合主动攻击两次并造成伤害，存活至下一己方回合。 = Make two damaging attacks with one Chu-Ko-Nu in a turn and keep it until your next turn.
让连弩接连出击，带它平安归来 = Strike twice and bring the unit home
决定第二次攻击打谁，以及如何保护射击后的部队。直接体验连射能力，不用先养经验、喂两个残血目标。 = Choose a second target while planning how to protect the attacker.
山间粮仓 = Mountain Granary
不限难度，使用印加。在自建城市可工作范围内完成一处邻接至少两座山脉的梯田，并让市民在至少一次实际粮食结算中工作该地块；结算时梯田未被掠夺、仍属己方。不限城市人口，不要求三处梯田。 = As the Inca at any difficulty, complete a Terrace Farm adjacent to at least two mountains in the workable area of a self-founded city. A citizen must work it for at least one actual food settlement while it remains yours and unpillaged. No population threshold or additional farms are required.
建成一处邻接两座山脉的梯田，并让市民实际工作它一次。 = Build a Terrace Farm beside at least two mountains and work it for an actual food settlement.
在群山之间收获粮食 = Harvest food between the mountains
识别合适的山间丘陵，把地形限制变为粮食优势。只在已经发现合适位置时推荐。 = Recognize terrain that turns mountain constraints into food.
来去如风 = Ride Like the Wind
不限难度，使用蒙古。同一支怯薛骑兵在一个己方回合中，先主动攻击主要文明军事单位或城市并造成正数伤害，再主动移动到另一格，并持续归己方、存活至下一己方回合开始。攻击和移动均发生在怯薛形态；强制传送不计。若本局先取得正式胜利，则在胜利结算时核对剩余观察条件。 = As Mongolia at any difficulty, one Keshik must actively attack a major-civilization military unit or city for positive damage, then voluntarily move to a different tile in the same turn. It must stay alive and continuously yours until your next turn starts. Both actions must occur in Keshik form; forced teleportation does not count. If an official victory ends the game first, the remaining observation conditions are checked at that victory settlement.
同一支怯薛骑兵攻击造成伤害后主动换格，存活至下一己方回合。 = Attack with one Keshik, move to another tile and keep it until your next turn.
射击之后，寻找下一处阵地 = Find another position after firing
预留移动力，在射击后选择撤离、侧移、让路或继续推进；完成一次即可，不把后撤规定为唯一正确解法。 = Reserve movement for retreat, repositioning, opening a lane or advancing.
殊途同归 = Different Roads
不限难度。三个不同合格自由对局分别取得三种不同的非时间胜利，从科技、文化、征服、外交中任选三种。同一局游戏 只贡献首个正式终局结果；重载、复制存档不增加局数或胜利种类。 = At any difficulty, win three different non-Time victory types from Scientific, Cultural, Domination and Diplomatic, each in a different eligible free-play game. Only the first formal final result of each game ID counts. Reloaded or copied saves add neither games nor victory types.
在三个不同的合格对局中，取得三种不同的非时间胜利。 = Win three distinct non-Time victory types in three different eligible games.
用三种方式走向胜利 = Find three paths to victory
走出熟悉的一种打法，体验三种不同战略。次数对应策略种类，不是把同一局再刷两遍。 = Explore distinct strategies instead of repeating one familiar route.
五波之后 = After Five Waves
无尽，轻松或野蛮均可。同一次挑战首次在期限内清除第一关全部五波，进入关卡完成结算，且核心仍归己方。 = In Endless at Relaxed or Brutal pace, clear all five waves of the first stage within its deadline in one attempt and reach stage-completion settlement while the core remains yours.
在期限内清除第一关的五波敌军，并保有核心城市。 = Clear all five waves of stage one before its deadline while retaining the core.
守过第一关的五波来敌 = Hold through the first five waves
将布防、资源与波次处理贯穿一整个关卡，获得清楚的首次通关反馈。 = Carry deployment, resources and wave handling through a complete stage.
三城同守 = Three Cities Stand
无尽，轻松或野蛮均可。已解锁三城容量；某关第一波出现前已拥有三座城市，从第一波出现到该关按时完成，这三城持续归己方。不限必须哪一关完成，不限制部队损失和关间奖励选择。 = In Endless at either pace, unlock three-city capacity and own three cities before the first wave of a stage appears. Keep all three continuously until that stage is completed on time. Any stage may qualify; unit losses and inter-stage reward choices are unrestricted.
一关首波来临前已有三城，持续保有这三城直到按时过关。 = Own three cities before a stage starts and retain them continuously until clearing it on time.
让三座城市一同守到关末 = Keep three cities standing to the end
主动扩张后承担更复杂的防线，安排机动支援与城市分工；不是要求所有玩家都建满三城。 = Accept the defensive choices created by expansion and divide support among cities.
不息战线 = An Unbroken Front
无尽，野蛮节奏。在同一次挑战中完成前三关。允许正常领取金币或增援；不同挑战的通关数不能相加。 = In Endless at Brutal pace, complete stages one through three in the same attempt. Normal gold and reinforcement rewards are allowed. Stages from different attempts cannot be added together.
在同一次野蛮节奏挑战中，完成前三关。 = Complete the first three stages in a single Brutal-pace attempt.
在野蛮节奏中连过三关 = Clear three stages at Brutal pace
在没有关间休整的节奏中管理资源与兵力，准备连续作战，而非跨局凑次数。 = Manage forces and resources across continuous fighting.
