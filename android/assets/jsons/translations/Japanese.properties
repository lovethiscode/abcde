Have one living military unit earn 5 XP promotions. Free ones do not count; upgrades preserve progress. = 同じ生存中の軍事ユニットが経験値による昇進を 5 回得る。無料・初期昇進は除外し、通常のアップグレードは記録を保持する。
Have one living military unit earn 5 experience promotions. Free and starting promotions do not count; normal upgrades preserve its record. = 同じ生存中の軍事ユニットが経験値による昇進を 5 回得る。無料・初期昇進は除外し、通常のアップグレードは記録を保持する。
Have your Worker build a new Farm, Mine or Pasture. = 自分の労働者で農場、鉱山、牧草地のいずれかを新設する。修復は対象外。
Have your own Worker build a new Farm, Mine or Pasture. Repairs do not count. = 自分の労働者で農場、鉱山、牧草地のいずれかを新設する。修復は対象外。
Have your own founded religion be the majority religion in 10 cities at once, including 3 currently owned by other major civilizations. Passive spread counts. = 自ら創始した宗教が同時に 10 都市以上の多数派となり、うち 3 都市以上を他の主要文明が現在所有している。自然伝播も可。
Hold 2,000 Gold at once. = ゴールドを同時に 2,000 以上保有する。過去の収入は累計しない。
Hold 500 Gold at once. = ゴールドを同時に 500 以上保有する。使用済みの分は足さない。
Hold at least 2,000 Gold at once. Historical income does not count. = ゴールドを同時に 2,000 以上保有する。過去の収入は累計しない。
Hold at least 500 Gold at once. Previously spent Gold does not count. = ゴールドを同時に 500 以上保有する。使用済みの分は足さない。
Light of Civilization = 文明の光
Most achievements allow any difficulty and need at least 1 AI opponent. Only N30, N36, N37, N38 and N39 require the stated difficulty and at least 3 AI opponents. You need not enable all victory routes. All game speeds are allowed. Any victory includes Time. Religion achievements require religion to be enabled. = 大半の実績は難易度不問で、AI の対戦相手が 1 文明以上必要です。N30、N36、N37、N38、N39 のみ指定難易度と AI 3 文明以上が必要です。すべての勝利条件を有効にする必要はありません。速度は不問。「任意の勝利」には時間勝利も含みます。宗教の実績では宗教を有効にしてください。
N38 forbids ever owning a second city, including founding, conquest, puppets, trades and brief ownership. N39 forbids ever owning a World Wonder by any means; losing it later does not erase that branch's history. N26 collects 8 distinct self-built World Wonders across qualifying new games. N40 requires the other 39 new medals; old medals never substitute for them. = N38 では建設、征服、傀儡、取引、一時的な所有を含め、2 つ目の都市を一度も所有してはいけません。N39 では入手方法を問わず世界遺産の所有を禁じ、後に失ってもその分岐の履歴は消えません。N26 は対象となる新規ゲームをまたいで自ら建てた世界遺産を 8 種類集めます。N40 は他の新実績 39 個が必要で、旧メダルでは代用できません。
Nature's Gift = 自然の贈り物
