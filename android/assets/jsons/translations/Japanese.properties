Before the bowstring rests, the enemy line has broken. = 弦が休まる前に、敵の戦列は崩れました。
Belief crosses the border and takes root far away. = 信仰は国境を越え、遠い地に根付きました。
Beyond the Stars = 星の彼方
Beyond the border, another banner rises. = 境界の向こうに、新たな旗が掲げられました。
Book of Civilizations = 文明全書
Border Guardian = 国境の守り手
Build 8 different World Wonders across qualifying new games. Each type counts once, even across repeated saves. = 対象となる新規ゲームをまたいで、異なる世界遺産を 8 種類自ら建設する。同種や重複セーブは再計上しない。
Build 8 different World Wonders across qualifying new games; each type counts once. = 対象となる新規ゲームをまたいで、異なる世界遺産を 8 種類自ら建設する。同種や重複セーブは再計上しない。
Build World Wonders yourself in any city you own; Great Engineer acceleration is allowed. National Wonders and wonders already present in acquired cities do not count as built. Different wonders are counted by type. Foreign cities were founded by other major civilizations; repeated captures of the same city count once. = 自分が所有する都市で世界遺産を自ら建設してください。大技術者による加速は可能です。国家遺産や、取得した都市に元から存在する世界遺産は建設数に含みません。遺産は種類別に数えます。外国都市とは他の主要文明が建設した都市です。同じ都市を繰り返し占領しても 1 度だけ数えます。
Build a World Wonder. Great Engineers count; National Wonders do not. = 初めて世界遺産を自ら建設する。大技術者による加速は可、国家遺産は対象外。
Build your first World Wonder. Great Engineer acceleration counts; National Wonders do not. = 初めて世界遺産を自ら建設する。大技術者による加速は可、国家遺産は対象外。
By the Nile, stone begins to tell the story of your age. = ナイルのほとりで、石があなたの時代を語ります。
Capture 2 different foreign cities in combat during one of your turns. Losing military units does not disqualify you. = 同じ自分のターン中に、異なる外国都市を 2 つ戦闘で占領する。軍事損失はあってもよい。
Capture 2 different foreign cities in combat in one turn. Military losses are allowed. = 同じ自分のターン中に、異なる外国都市を 2 つ戦闘で占領する。軍事損失はあってもよい。
Capture a city founded by another major civilization in combat. = 他の主要文明が建設した都市を戦闘で占領する。
Capture in combat a city founded by another major civilization. = 他の主要文明が建設した都市を戦闘で占領する。
China: Breaking the Line = 中国：連弩の突破
China: one Chu-Ko-Nu destroys 2 different military units of other major civilizations in one turn. = 中国で、同じ連弩兵が同じ自分のターン中に、他の主要文明の異なる軍事ユニットを 2 体撃破する。
