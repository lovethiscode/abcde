Only qualifying new games started with this new achievement catalog count. Old saves cannot gain eligibility by copying, importing or resaving. Use a built-in ruleset, one human major civilization, a generated map and an Ancient-era start, without mods or editor scenarios. = 新しい実績一覧の記録に対応した、条件を満たす新規ゲームだけが対象です。古いセーブデータをコピー、インポート、再保存しても対象にはなりません。内蔵ルール、人間の主要文明 1 つ、自動生成マップ、太古からの開始を使用し、Mod やエディターのシナリオは使わないでください。
