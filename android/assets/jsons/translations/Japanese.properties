# Updated multiplayer help
Play with iOS players = iOSプレイヤーと遊ぶ
2. Other iOS players open the invitation or paste it in Join by invitation, tap their civilization portrait to choose, then tap Ready. = 2. 他のiOSプレイヤーは招待リンクを開くか「招待から参加」に貼り付け、文明のアイコンをタップして文明を選び、「準備完了」をタップします。
3. The host is ready automatically. When everyone is ready, the host taps Start game. No Player ID or Game ID exchange is needed. = 3. ホストは自動的に準備完了になります。全員の準備ができたら、ホストが「ゲーム開始」をタップします。Player IDやGame IDの交換は不要です。
Play with Android players = Androidプレイヤーと遊ぶ
1. The Android player copies their Player ID from Multiplayer and sends it to the iOS host. = 1. Androidプレイヤーは「マルチプレイ」で自分のPlayer IDをコピーし、iOSのホストに送ります。
2. In an empty player seat, the host taps Add player manually, pastes the Player ID, taps the portrait to choose a civilization, then taps Mark ready. = 2. ホストは空いているプレイヤー枠で「プレイヤーを手動で追加」をタップし、Player IDを貼り付け、アイコンから文明を選び、「準備完了にする」をタップします。
3. After starting, the Game ID is copied automatically. Send it to the Android player to add the game in Multiplayer. = 3. ゲーム開始後、Game IDが自動的にコピーされます。Androidプレイヤーに送り、「マルチプレイ」でゲームを追加してもらいます。
Android players join the started game by Game ID; they do not join the waiting room through its invitation link. = AndroidプレイヤーはGame IDで開始済みのゲームに参加します。待機ルームの招待リンクからは参加しません。
If Android hosts, send them your Player ID, then paste their Game ID in Join by invitation. = Androidプレイヤーがホストの場合は、自分のPlayer IDを送り、相手から届いたGame IDを「招待から参加」に貼り付けます。
After the game starts = ゲーム開始後の遊び方
Multiplayer is asynchronous and turn-based. When it is your turn, download the latest save, play, then end your turn to upload it. = マルチプレイは非同期のターン制です。自分のターンになったら最新のセーブデータをダウンロードしてプレイし、ターンを終了してアップロードします。
All players must use the same game server and compatible game versions and rulesets. = 全員が同じゲームサーバーと、互換性のあるゲームバージョンおよびルールセットを使う必要があります。
