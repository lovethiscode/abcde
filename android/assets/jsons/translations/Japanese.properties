Except N26 and N40, complete each achievement in one game. Process achievements do not require victory. All numerical targets are minimums. Population, Gold, connections, allies and religious majorities are checked together at your turn end or the settled game ending. Other actions count only after the entire operation finishes. = N26 と N40 を除き、条件は同じゲーム内で達成します。途中の行動に関する実績は勝利不要です。数値目標はいずれも最低条件です。人口、ゴールド、接続、同盟、宗教の多数派は、自分のターン終了時か全処理完了後の終局時に同時に確認します。その他の行動は、一連の操作が完了してから判定します。
