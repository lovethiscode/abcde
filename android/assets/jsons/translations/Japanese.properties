Achievements = 実績
Across the ages, your monuments remain. = 幾つもの時代に、あなたの記念碑が残っています。
Adopt a social policy, including a branch opener. = 初めて社会制度を採用する。制度ツリーの開放も含む。
Adopt your first social policy. Opening a policy branch counts. = 初めて社会制度を採用する。制度ツリーの開放も含む。
Against mighty opponents, you still write your own ending. = 強大な相手を前に、あなたは自ら結末を記しました。
Age of Wonders = 遺産の時代
An empire's greatness takes root in every city. = 帝国の偉大さは、一つ一つの都市に根付いています。
Art of Governance = 統治の技
As China, have the same Chu-Ko-Nu destroy 2 different military units belonging to other major civilizations during one of your turns. = 中国で、同じ連弩兵が同じ自分のターン中に、他の主要文明の異なる軍事ユニットを 2 体撃破する。
As Egypt, build 3 different World Wonders in one game. Winning is not required. = エジプトで、同じゲーム中に異なる世界遺産を 3 つ自ら建設する。勝利は不要。
As Persia, capture 3 different foreign cities in combat during one continuous Golden Age. Extending that Golden Age still counts as the same period. = ペルシャで、一続きの黄金時代中に異なる外国都市を 3 つ戦闘で占領する。黄金時代の延長は同じ期間とみなす。
As Rome, simultaneously own 4 self-founded cities that each have a Monument and a Granary. The capital and purchased buildings count. = ローマで、自ら建設した 4 都市を同時に所有し、すべてにモニュメントと穀物庫を備える。首都や購入した建物も可。
Battle capture counts after combat and the occupation choice finish and the city belongs to you. Trades, gifts, direct liberation to a third party and city destruction do not count. Experience promotions exclude free and starting promotions; normal upgrades preserve the same unit's record. Simultaneous conditions cannot be added across different moments. = 戦闘による占領は、戦闘と占領方法の選択が完了し、実際に自分の都市になった時点で数えます。取引、贈与、第三者への直接解放、都市の破壊は対象外です。経験値による昇進には無料や初期の昇進を含めません。通常のアップグレードでは同じユニットの記録を保持します。同時達成の条件を別々の時点から足し合わせることはできません。
Battle-Hardened = 百戦の勇士
