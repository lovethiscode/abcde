Discover a Natural Wonder. Revealing it is enough; no unit needs to enter its tile. = 自然遺産を発見する。視界に入ればよく、ユニットがそのタイルに入る必要はない。
Discover a Natural Wonder; entering its tile is unnecessary. = 自然遺産を発見する。視界に入ればよく、ユニットがそのタイルに入る必要はない。
Earn a medal in a qualifying new game to share it here. = 対象となる新規ゲームでメダルを獲得すると、ここから共有できます。
Egypt: Epic in Stone = エジプト：石の叙事詩
Egypt: build 3 different World Wonders in one game; no victory required. = エジプトで、同じゲーム中に異なる世界遺産を 3 つ自ら建設する。勝利は不要。
Emperor+: win Culture without ever owning a World Wonder. National Wonders are allowed. = 皇帝以上で、建設・占領・譲渡などを通じて一度も世界遺産を所有せずに文化勝利する。国家遺産は可。
Emperor+: win Science with One City Challenge enabled, never owning a second city, even briefly. = 皇帝以上でワンシティチャレンジを有効にして科学勝利する。開始から勝利まで、一瞬でも第 2 都市を所有してはならない。
Emperor+: win any victory, including Time. = 皇帝以上で、時間勝利を含む任意の正式な勝利を達成する。
Enter a Golden Age for the first time, through any normal game mechanism. = 通常のゲーム機構により、初めて黄金時代に入る。
