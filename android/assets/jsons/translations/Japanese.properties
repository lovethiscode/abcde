# iOS maintenance support
Support iOS maintenance = iOS 版の保守を支援
Purchase records are unavailable. No purchase was started. Please reopen the app. = 購入記録を読み込めません。購入は開始されていません。アプリを開き直してください。
Congratulations on your victory! = 勝利おめでとうございます！
Enjoying this iOS version? Optional support helps with ongoing compatibility and maintenance. All game content and features stay the same whether you contribute or not. = この iOS 版を楽しんでいますか？任意のご支援は継続的な対応と保守に役立ちます。支援の有無でゲームの内容や機能は変わりません。
Learn about support = 支援について
Continue playing = ゲームを続ける
Unciv is made by an open-source community. This iOS version needs ongoing work to adapt to new systems, fix issues, and improve the controls. = Unciv はオープンソースコミュニティの協力で作られています。この iOS 版には、新しいシステムへの対応、不具合の修正、操作性の改善が継続的に必要です。
If you enjoy playing, you can support future iOS maintenance with a voluntary, one-time contribution. All game content and features are the same for everyone. = 楽しく遊べたら、任意の一回限りの支援で今後の iOS 版の保守を応援できます。ゲームの内容や機能は、すべての方に同じように提供されます。
Processing your purchase... = 購入を処理中…
Thank you for supporting iOS maintenance! = iOS 版の保守をご支援いただき、ありがとうございます！
Purchase cancelled. No purchase was made. = 購入はキャンセルされました。支払いは完了していません。
Waiting for Apple's approval. If approved later, your support will be recorded automatically. = Apple の承認を待っています。後で承認された場合、ご支援は自動的に記録されます。
The purchase could not be completed. Please try again later. = 購入を完了できませんでした。後でもう一度お試しください。
The purchase could not be verified. Reopen the app to retry recovery. = 購入を検証できませんでした。アプリを開き直して取引の復旧を再試行してください。
Your purchase needs local recovery. Do not pay again; reopen the app to retry saving and finishing the transaction. = この購入は端末内での復旧が必要です。再度支払わず、アプリを開き直して取引の保存と完了を再試行してください。

