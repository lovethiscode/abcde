On Emperor difficulty or higher, win a Cultural Victory without ever owning a World Wonder, whether built, captured or received. National Wonders are allowed. = 皇帝以上で、建設・占領・譲渡などを通じて一度も世界遺産を所有せずに文化勝利する。国家遺産は可。
On Emperor difficulty or higher, win any formal victory, including Time. = 皇帝以上で、時間勝利を含む任意の正式な勝利を達成する。
On Prince difficulty or higher, build 8 different World Wonders in one game. = 皇子以上で、同じゲーム中に異なる世界遺産を 8 つ自ら建設する。
One City, Many Stars = 一都で星をつかむ
