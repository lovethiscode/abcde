'1. A robot may not injure a human being or, through inaction, allow a human being to come to harm. 2. A robot must obey any orders given to it by human beings, except when such orders would conflict with the First Law. 3. A robot must protect its own existence as long as such protection does not conflict with the First or Second Law.' - Isaac Asimov = «1. Robot nabāyad be ensān āsib beresānad yā bā bi-amali ejaze dahad ensān āsib bebinad. 2. Robot bāyad az har dastoor e ensān hā peyrovi konad, magar dastoori ke bā Ğanoon e Avval dar tanāğoz bāšad. 3. Robot bāyad az vojood e ḵod hefāzat konad, tā vağti in hefāzat bā Ğanoon e Avval yā Dovvom dar tanāğoz nabāšad.» - Isāc Asimov
Robotics = Robātik
'Now, somehow, in some new way, the sky seemed almost alien.' - Lyndon B. Johnson = «Aknoon be nahvi, be raveši jadid, āsemān tağriban bigāne be nazar miresid.» - Lyndon B. Johnson
Satellites = Māhvāre hā
'Be extremely subtle, even to the point of formlessness, be extremely mysterious, even to the point of soundlessness. Thereby you can be the director of the opponent's fate.' - Sun Tzu = «Besyār latif bāš, hatta tā bi-šekli; besyār raz-ālood bāš, hatta tā bi-sedāyi. Čenin mitavāni modir e sarnevešt e harif bāši.» - Sun Tzu
Stealth = Penhānkāri
'Our scientific power has outrun our spiritual power, we have guided missiles and misguided men.' – Martin Luther King Jr. = «Ğodrat e elmi ye mā az ğodrat e mānavi ye mā piši gerefte ast; moošak hāye hedāyatšode va ensān hāye gomrāh dārim.» - Martin Luther King Jr.
