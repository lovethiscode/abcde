Kamehameha I = Kamehameha I
The ancient fire flashing across the sky is what proclaimed that this day would come, though I had foolishly hoped for a different outcome. = Ātaš e kohan ke dar āsemān deraḵšid ḵabar dād ke in rooz ḵāhad resid, harčand nādānāne be sar-anjāmi digar omid dāštam.
It is obvious now that I misjudged you and your true intentions. = Aknoon rošan ast ke dar bāre ye to va niyat hāye vāğei-at eštebāh ğezavat kardam.
The hard-shelled crab yields, and the lion lies down to sleep. Kanaloa comes for me now. = Ḵarčang e saḵtpoost taslim mišavad va šir barāye ḵāb derāz mikešād. Kanaloa aknoon be sorağ e man miyāyad.
The ocean's tide may rise and fall, but my resolve stands steady. = Mado-jazr e oğyānoos šāyad bālā va pāyin ravad, amma azm e man ostovār mimānad.
Aloha! Greetings and blessings upon you, friend. I am Kamehameha, Great King of this strand of islands. = Aloha! Dorood va barakat bar to, doost. Man Kamehameha, Šāh e bozorg e in rešte ye jazāyer, hastam.
Come, let our people feast together! = Biyā, begozār mardomān e mā bā ham jašn begirand!
Welcome, friend! = Ḵoš oomadi, rafiğ!
Wayfinding = Masiryābi
Aloha to Kamehameha the Great, who the heavens allowed to unite your people! O great King, under your reign, the Big Island of Hawai'i became one in 1791 AD, and many other islands joined your vision of union in 1810. As the first King of Hawai'i, law and taxation systems were stabilized, and you promoted the Kanawai Mamalahoe, an edict to protect civilian people in times of war. Unification and sovereignty of all the islands continued thanks to your fair laws and deeds, even after you joined your ancestors in paradise in 1819. = Aloha be Kamehameha ye Bozorg, ke āsemān be oo ejaze dād mardomaš rā yeki konad! Ey Šāh e bozorg, dar farmānravāyi ye to Jazire ye Bozorg e Hawai'i dar 1791 milādi yeki šod va besyāri az jazāyer e digar dar 1810 be royaye ettehād e to peyvastand. Be onvān e avvalin Šāh e Hawai'i, nezām hāye ğanoon va māliyāt sābet šodand va to Kanawai Mamalahoe, farmāni barāye hefāzat az mardom e ğeyr e nezami dar zamān e jang, rā tarvij kardi. Be lotf e ğavānin va āmāl e ādelane ye to, ettehād va hākemiyat e hame ye jazāyer edāme yāft, hatta pas az ān ke dar 1819 dar behešt be niākānat peyvasti.
Wise and benevolent King, will you unite your people once again by wearing the bright mantle of the Lion of the Pacific? Will your new empire shine through the ages of history? = Ey Šāh e dānā va nik-ḵāh, āyā bā poošidan e redāye deraḵšān e Šir e Oğyānoos e Ārām dobāre mardomat rā yeki mikoni? Āyā emperātoori ye jadidat dar asr hāye tāriḵ ḵāhad deraḵšid?
