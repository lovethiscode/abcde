Ramkhamhaeng = Ramḵamhaeng
You lowly, arrogant fool! I will make you regret of your insolence! = Nādān e past va mağroor! Az gostāḵi-at pašimānat ḵāham kard!
You scoundrel! I shall prepare to fend you off! = Foroomāye! Barāye daf e to āmāde ḵāham šod!
Although I lost, my honor shall endure. I wish you good luck. = Harčand šekast ḵordam, šarafam pāydār ḵāhad mānd. Barāyat ḵoš-šānsi ārezoo mikonam.
I, Pho Kun Ramkhamhaeng, King of Siam, consider it a great honor that you have walked to visit my country of Siam. = Man, Pho Kun Ramḵamhaeng, Šāh e Siam, in rā šarafi bozorg midānam ke barāye didār be kešvar e man Siam āmāde i.
Greetings. I believe this is a fair proposal for both parties. What do you think? = Dorood. Gomān mikonam in pišnahād barāye har do taraf monsefāne ast. Nazar e šomā čist?
Welcome. = Ḵoš āmadi.
Father Governs Children = Pedar bar Farzandān Hokoomat Mikonad
O Great King Ramkhamhaeng, the Siamese people obey you with respect and fear! The beautiful and mysterious land of Siam is an ancient country in the heart of Southeast Asia, which was besieged by many foes, plagued by bloody war and great poverty, but eventually the smart and loyal Siamese people have endured and triumphed. Siam was a part of the Khmer Empire until the 13th century AD, before its brave people took arms and led a revolution to form the small Sukhothai kingdom. After many battles and diplomacy prowess, this tiny kingdom became a mighty empire, which would dominate South East Asia for more than a century. = Ey Šāh e bozorg Ramḵamhaeng, mardom e Siam bā ehterām va tars az to peyrovi mikonand! Sarzamin e zibā va raz-ālood e Siam kešvari kohan dar ğalb e Jonoob e Šarği ye Āsiyāst, ke došmanān e besyār ān rā mohāsere kardand va jang e ḵoonin va fağr e bozorg ān rā āzord; amma sar-anjām mardom e bāhooš va vafādār e Siam pāyidand va pirooz šodand. Siam tā sade ye 13 milādi baḵši az Emperātoori ye Ḵmer bood, piš az ān ke mardom e delavaraš selāh bargirand va bā enğelāb pādešāhi ye koočak e Suḵothai rā besāzand. Pas az jang hāye besyār va siyāsat e māherāne, in pādešāhi ye koočak be emperātoori ye niroomandi tabdil šod ke biš az yek sade bar Jonoob e Šarği ye Āsiyā hokoomat kard.
Wise and powerful King Ramkhamhaeng, your people want to revive these days of glory! Can you make a new dawn break on Siam? Will your new empire shine through the ages of history? = Ey Šāh e dānā va niroomand Ramḵamhaeng, mardomat miḵāhand ān rooz hāye šokooh rā zende konand! Āyā mitavāni sepidam e jadidi bar Siam bedāmi? Āyā emperātoori ye jadidat dar asr hāye tāriḵ ḵāhad deraḵšid?
