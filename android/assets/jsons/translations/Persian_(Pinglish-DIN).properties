'And homeless near a thousand homes I stood, and near a thousand tables pined and wanted food.' - William Wordsworth = «Bi-ḵāne nazdik e hezār ḵāne istādam va kenār e hezār sofre dar hasrat e ğazā ranj bordam.» - William Wordsworth
