I have tried all other avenues, but yet you persist in this madness. I hope, for your sake, your end is swift. = Hame ye rāhhāye digar rā āzmoodam, amma hanooz bar in divānegi esrār mikoni. Barāye ḵāter e ḵodet omidvāram pāyānat zood beresad.
It is silence that allows evil to triumph. We will not stand mute and allow you to continue on this mad quest unchecked. = Sokoot ast ke be badi ejāze ye piroozi midahad. Sāket nemiistim tā in talāš e divānevār rā bedoon e jologiri edāme dahid.
God and history will remember your actions this day. I hope you are ready for your impending judgment. = Ḵodā va tāriḵ kārhāye emroozat rā be yād ḵāhand dāšt. Omidvāram barāye dāvari ye nazdik āmāde bāši.
What a waste of time. = Če etlāf e vağti.
A thousand welcomes to our fair nation. I am Selassie, the Ras Tafari Makonnen and Emperor of Ethiopia, your humble servant. = Hezār bār be mihan e zibāye mā ḵoš āmadid. Man Selāse, Rās Tāfāri Makonnen va emperātor e Etiyoopi, ḵedmatgozār e forootan e šomā hastam.
I request that you consider this offer between our two peoples. I believe it will do us both good. = Az šomā miḵāhamin pišnahād e beyne do mardomemān rā barrasi konid. Bāvar dāram barāye har do mā soodmand ḵāhad bood.
Spirit of Adwa = Rooh e Advā
May God bless you, wise and righteous Emperor of Ethiopia, Haile Selassie. As one of Ethiopia's greatest rulers and a spiritual leader of the Rastafarian movement, your good influence on diplomacy and political cooperation are praised throughout the world. You created Ethiopia's first written constitution, and favorized democracy for years to come, your great wisdom making Ethiopia enter as a charter member in the United Nations. Always aiming to reform and modernize your nation, you changed Ethiopian destiny for the best. = Ḵodā to rā barkat dahad, Hāyle Selāse, emperātor e dānā va dādgar e Etiyoopi. Be onvān e yeki az bozorgtarin farmānravāyān e Etiyoopi va rahbar e ma'navi ye jonbeš e Rāstafāri, tāsir e nik e to bar diplomāsi va hamkāri ye siyāsi dar sarāsar e jahān setāyeš mišavad. Naḵostin ğānoon e asāsi ye nevešte ye Etiyoopi rā sāḵti va barāye sālhāye āyande az mardomsālāri poštibāni kardi; ḵerad e bozorgat Etiyoopi rā be ozvi ye bonyangozār e Sāzmān e Melal e Mottahed dar āvard. Hamvāre ḵāhān e eslāh va novsāzi ye mihanat boodi va sarnevešt e Etiyoopi rā behtar kardi.
Revered King, your knowledge and intelligence are required once again to protect your people from many threats in the world. Will you secure peace and stability, with benevolence and authority, in the radiance of the Kebra Nagast? Will your new empire shine through the ages of history? = Pādešāh e mohtaram, dāneš va hoošat dobāre barāye hefāzat az mardomat dar barābar e tahdidhāye besyār e jahān lāzem ast. Āyā bā mehrabāni va eğtedār, dar partov e Kebra Nāgast, solh va sobāt rā tazmin mikoni? Āyā emperātoori ye jadidat dar tool e asrhāye tāriḵ ḵāhad deraḵšid?
