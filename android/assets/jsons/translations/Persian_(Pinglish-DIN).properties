'Ben, I want to say one word to you, just one word: plastics.' - Buck Henry and Calder Willingham, The Graduate = «Ben, miḵāham yek kalame be to begooyam, fağat yek kalame: plāstik.» - Buck Henry va Calder Willinğam, The Graduate
