#################### Lines from Global Tutorials ####################

Welcome to Unciv!\nBecause this is a complex game, there are basic tasks to help familiarize you with the game.\nThese are completely optional, and you're welcome to explore the game on your own! = Be Unciv ḵoš āmadid!\nČon in bāzi pičide ast, tamrinhāye pāye barāye āšnāyi bā bāzi vojood dārand.\nInhā kāmelan eḵtiyāri hastand va mitavānid bāzi rā ḵodetān kāvoš konid!

Welcome to Unciv! = Be Unciv ḵoš āmadid!
Because this is a complex game, there are some tutorials to help familiarize you with it. These can be disabled in the Options -> Display menu, but please hang on if you're new here! = Čon in bāzi pičide ast, āmoozešhāyi barāye āšnāyi bā ān vojood dārand. Mitavān ānhā rā dar Tanzimāt -> Namāyeš ğeyrefa'āl kard, amma agar tāze āmadid lotfan kami sabr konid!
Your first mission is to found your capital city. This is actually an important task because your capital city will probably be your most prosperous. Many game bonuses apply only to your capital city, and it will be the center of your empire. = Naḵostin ma'mooriyat e šomā bonyangozari ye pāytaḵt ast. In kār mohem ast čon pāytaḵt e šomā ehtemālan ābādtarin šahr e šomā ḵāhad bood. Besyāri az emtiyāžāye bāzi fağat barāye pāytaḵt hastand va ān markaz e emperātoori ye šomā ḵāhad bood.
How do you know a city location is appropriate? Luckily, the game has already chosen a good location for you. You can settle in this place, or maybe move a turn to found on a Hill (for Production and defence) or next to a Mountain (to gain access to the Observatory building later on). = Az kojā mifahmid ke makān e šahr monāseb ast? Ḵošbaḵtāne bāzi az ğabl makān e ḵoobi barāye šomā enteḵāb karde ast. Mitavānid hamin jā sāken šavid, yā yek nobat harekat konid tā rooye Tappe barāye Tolid va defā', yā kenār e Kooh barāye dastresi ye ba'di be sāḵtemān e Rasadḵāne, šahr besāzid.
You'll likely want more cities later on. For these cities, you must go and find a good place. Looking for and founding on or near Luxury resources is a good rule of thumb. = Ehtemālan ba'dan šahrhāye bištari miḵāhid. Barāye ānhā bāyad beravid va jāye ḵoobi peydā konid. Jostojoo ye manābe e tajammoli va sāḵtan e šahr rooye ānhā yā dar nazdiki ye ānhā rāhnamā ye ḵoobi ast.
Luxury resources are tiles that have things like Gems, Cotton, or Silk (indicated by a yellow background of the resource icon). These resources make your civilization happy. You should also keep an eye out for resources needed to build units, such as Iron. Cities cannot be built within 3 tiles of existing cities, which is another thing to keep in mind! = Manābe e tajammoli zaminhāyi hastand ke čižāyi mānand e Javāher, Panbe yā Abrišam dārand; paszamine ye zard e nemād e manba' ānhā rā nešān midahad. In manābe tamaddon e šomā rā rāzi mikonand. Hamčenin morāğeb e manābe e lāzem barāye sāḵt e niroohā, mānand e Āhan, bāšid. Šahrhā rā nemitavān tā fāsele ye 3 ḵāne az šahrhāye mojood sāḵt; in rā ham be yād dāšte bāšid!
Cities will house Citizens, which can work tiles up to 3 tiles away from the city. This means you don’t have to settle cities right on or next to good tiles. Let’s say, for example, that you want access to some Iron – but the resource is in a desert area. You don’t have to settle your city in the desert. You can settle a few tiles away in more prosperous lands. Your city will grow and eventually gain access to the resource. You only need to settle right on top of resources if you need them immediately. = Šahrhā makān e zendegi ye Šahrvandān hastand ke mitavānand rooye zaminhāye tā 3 ḵāne door az šahr kār konand. Pas lāzem nist šahr rā dorost rooye zamin e ḵoob yā kenāreš besāzid. Masalan, miḵāhid be Āhan dastresi dāšte bāšid amma manba' dar biyābān ast. Lāzem nist šahr rā dar biyābān besāzid. Mitavānid čand ḵāne doortar, dar sarzamin e ābādtar, sāken šavid. Šahr rošd mikonad va saranjām be manba' dastresi miyābad. Fağat zamani bāyad dorost rooye manābe šahr besāzid ke ānhā rā fori lāzem dārid.
The first thing coming out of your city depends on the strategy you want to follow, but the 'classic' build order is to build first two Scouts, then a Shrine, and three Settlers, and adopt Tradition, to explore the map quickly (Scouts ignore terrain cost), and to get an early Pantheon (if you're playing with religion enabled). = Naḵostin čizi ke šahr e šomā misāzad be rāhbord e delḵāh bastegi dārad, amma tartib e «kelāsik» in ast: avval do Pišāhang, sepas yek Neyāyešgāh va se Šahraknešin besāzid va Sonnat rā bepazirid, tā nağše rā zood kāvoš konid (pišāhanğā hazine ye zamin rā nādide migirand) va zood be Panteon beresid, agar din fa'āl ast.
But feel free to experiment with your own build orders! = Amma āzādāne tartibhāye sāḵt e ḵodetān rā āzmāyeš konid!

In your first couple of turns, you will have very little options, but as your civilization grows, so do the number of things requiring your attention. = Dar čand nobat e avval gozine hāye kami dārid, amma bā rošd e tamaddon, tedād e kārhāyi ke be tavajjoh e šomā niyāz dārand ham ziyād mišavad.

Culture and Policies = Farhang va Siyāsathā
Each turn, the culture you gain from all your cities is added to your Civilization's culture.\nWhen you have enough culture, you may pick a Social Policy, each one giving you a certain bonus. = Har nobat, Farhang e be dast āmade az hame ye šahrhā be Farhang e tamaddon e šomā afzoode mišavad.\nVağti Farhang e kāfi dāštid, mitavānid yek Siyāsat e ejtemāyi enteḵāb konid ke har kodām emtiyāz e ḵāsi midahad.
The policies are organized into branches, with each branch providing a bonus ability when all policies in the branch have been adopted. = Siyāsathā be šāḵehā tağsim šode and; har šāḵe pas az pazireš e hame ye siyāsathāyaš yek tavānāyi ye ezāfi midahad.
With each policy adopted, and with each city built,\n  the cost of adopting another policy rises - so choose wisely! = Bā pazireš e har siyāsat va sāḵt e har šahr,\n  hazine ye siyāsat e ba'adi afzāyeš miyābad; pas ḵeradmandāne enteḵāb konid!

City Expansion = Gostareš e Šahr
Once a city has gathered enough Culture, it will expand into a neighboring tile.\nYou have no control over the tile it will expand into, but tiles with resources and higher yields are prioritized. = Pas az ān ke šahr Farhang e kāfi jam' kard, be yek zamin e hamsāye gostareš miyābad.\nŠomā zamin e gostareš rā enteḵāb nemikonid, amma zaminhāye dārāye manba' va bāzdehi ye bištar olaviyat dārand.
Each additional tile will require more culture, but generally your first cities will eventually expand to a wide tile range. = Har zamin e ezāfi Farhang e bištari lāzem dārad, amma mamoolan šahrhāye avval saranjām be gostāre ye bozorgi az zaminhā miresand.
Although your city will keep expanding forever, your citizens can only work 3 tiles away from city center.\nThis should be taken into account when placing new cities. = Har čand šahr barāye hamiše gostareš miyābad, šahrvandān fağat tā 3 ḵāne az markaz e šahr mitavānand kār konand.\nDar jāygozāri ye šahrhāye tāze be in nokte tavajjoh konid.

Food is the resource fundamental to your Cities', and as a result Nation's, population and health. = Ğazā manba' e asāsi barāye jam'iyat va salāmati ye šahrhā va dar natije kešvar e šomā ast.
Every Citizen in each City consumes Food per turn. Any left over is considered Growth and is stored in the City Center. Once enough accumulates, the City Grows and a new Citizen is added. = Har šahrvand dar har šahr, dar har nobat Ğazā masraf mikonad. Bağimānde barāye Rošd dar markaz e šahr zaḵire mišavad. Bā jam' šodan e Ğazā ye kāfi, šahr rošd mikonad va yek šahrvand e tāze afzoode mišavad.
Initially your main source of Food is the City Center itself and working a surrounding tile with a Citizen. You can increase how much is generated by gaining more Citizens to work more tiles, improving the tiles so that they yield more Food, and eventually Buildings and Policies. = Dar āğāz, manba' e asli ye Ğazā ḵod e markaz e šahr va kār e yek šahrvand rooye zamin e hamsāye ast. Bā afzāyeš e šahrvandān barāye kār rooye zaminhāye bištar, behsāzi ye zaminhā barāye Ğazā ye bištar va sepas Sāḵtemānhā va Siyāsathā mitavānid Tolid rā ziyād konid.
Since a city's number of Citizens, or Population, determines how many tiles a City can work, Food is often the most important Resource. = Čon tedād e Šahrvandān yā Jam'iyat e šahr mošaḵḵas mikonad ke rooye čand zamin mitavān kār kard, Ğazā ağlab mohemtarin manba' ast.

Production is the resource that lets a City Center build new things. = Tolid manba'i ast ke be markaz e šahr ejāze midahad čižāye tāze besāzad.
This can be new Buildings that are added to the City Center, or new Units that can go out across the World Map to advance your Nation's goals. = In mitavānad Sāḵtemānhāye tāze barāye markaz e šahr yā Niroohāye tāze bāšad ke dar Nağše ye Jahān barāye hadafhāye kešvar harekat mikonand.
Everything you can build has a Production Cost. Every turn each City generates a certain amount of Production and puts it towards whatever is at the top of the Build Queue. Once the total cost is collected, the Building or Unit is built! = Har čizi ke misāzid hazine ye Tolid dārad. Har nobat, har šahr meğdār e mošaḵḵasi Tolid mikonad va ān rā sarf e čizi mikonad ke bālā ye Saf e Sāḵt ast. Vağti hazine ye kāmel jam' šod, Sāḵtemān yā Niroo sāḵte mišavad!
Any excess Production after something is built is overflowed to the next thing the City builds. Up to it's total Production Cost. = Tolid e ezāfi pas az sāḵt e yek čiz be čiz e ba'adi ke šahr misāzad montağel mišavad, tā hadde hazine ye kāmel e Tolid e ān.
Since this determines how quickly you can build more stuff, your Nation's Production Capacity is crucial to it's advancement and survival. = Čon in meğdār sor'at e sāḵt e čižāye bištar rā ta'yin mikonad, zarfiyat e Tolid e kešvar barāye pišraft va bağāye ān hayāti ast.

⍾Science is the resource that unlocks new and exciting Technologies for your Nation. = ⍾Elm manba'i ast ke Fannāvarihāye tāze va heyjānangiz rā barāye kešvar e šomā bāz mikonad.
Once you've Founded your Capital, you'll be prompted to Pick a Technology to Research. = Pas az bonyangozari ye Pāytaḵt, az šomā ḵāste mišavad Fannāvariyi barāye Pažooheš enteḵāb konid.
Every Technology costs an amount of ⍾Science. Every turn the ⍾Science your Nation produces is paid towards Researching your chosen Technology. = Har Fannāvari meğdāri ⍾Elm hazine dārad. Har nobat, ⍾Elm e tolidšode dar kešvar sarf e Pažooheš e Fannāvari ye enteḵābi mišavad.
Once a Technology has it's cost fully paid, you unlock the benefits for your Nation! This could be new Units, Buildings, or other advantages. Any surplus will overflow into the next Technology you pick to Research. = Bā pardāḵt e kāmel e hazine ye yek Fannāvari, soodhāye ān barāye kešvar bāz mišavad! In mitavānad Niroo, Sāḵtemān yā emtiyāžāye digar bāšad. Māzād be Fannāvari ye ba'adi ke barāye Pažooheš enteḵāb mikonid montağel mišavad.
Researching a Technology in the next Era will advance you into that Era and trigger a notification to other Nations about how amazing you are! = Pažooheš e Fannāvariyi dar Asr e ba'adi šomā rā vāred e ān Asr mikonad va bā yek payām be kešvarhāye digar migooyad čeğadr šegeftangiz hastid!
Since new Technologies tend to give access to better Units, Buildings, and even unlock powerful new Policies, staying ahead of the competition is one of the best ways to secure your Victory! = Čon Fannāvarihāye jadid mamoolan Niroohā va Sāḵtemānhāye behtar va hatta Siyāsathāye tāze ye niroomand rā bāz mikonand, jelo māndan az rağibān yeki az behtarin rāhhāye tazmin e Piroozi ast!

Ah Gold. The Universal Medium of Exchange. Everyone loves Gold! They say it can't buy Happiness, but nuclear submarines are almost as good. = Āh, Talā. Abzār e hamagāni ye mobādele. Hame Talā rā doost dārand! Migooyand Rezāyat nemiḵarad, amma zirdaryāyi ye haste'i tağriban hamān ğadr ḵoob ast.
You can earn more Gold from Tiles, Resources, Improvements, and eventually Buildings, Specialists, and Trade Routes. Ancient Ruins, meeting new City-States, and Pillaging are also great sources of Gold. During a Golden Age every Tile that already yields Gold will yield an additional Gold! = Az Zaminhā, Manābe, Behsāzihā va sepas Sāḵtemānhā, Moteḵassesān va Masirhāye Tejāri mitavānid Talā ye bištari be dast āvarid. Virānehāye Bāstān, āšnāyi bā Šahr-dowlathāye tāze va Ğārat niz manābe e ḵoob e Talā hastand. Dar Asr e Talāi har Zamin ke az ğabl Talā midahad yek Talā ye ezāfi ḵāhad dād!
Gold is how you pay for Building Maintenance, Transportation Upkeep, and Unit Upkeep. If you run out of Gold, first you'll receive penalties to your ⍾Science production, then eventually your Units will start Disbanding as you can't pay their upkeep. = Bā Talā hazine ye Negahdāri ye Sāḵtemān, Hamm-o-nağl va Niroo rā mipardāzid. Agar Talā tamām šavad, naḵost Tolid e ⍾Elm jarime mišavad va saranjām Niroohā be dalil e adam e pardāḵt e negahdāri šoroo be Monhal šodan mikonand.
Gold can be used to Buy Buildings and Units, helping bring up a new City or quickly build an Army. It can also buy Tiles to add to your City. It's also used to Upgrade your units from their older, obsolete forms to new, stronger versions. And investing it into a Research Agreement is a great way to convert it into ⍾Science. = Talā barāye Ḵarid e Sāḵtemān va Niroo be kār miravad va be rošd e šahr e tāze yā sāḵt e sari' e arteš komak mikonad. Bā ān mitavān Zamin ḵarid va be šahr afzood. Hamčenin barāye Erteğā ye niroo az šekl e ğadimi va mansooḵ be nosḵe ye jadid va ğavitar estefāde mišavad. Sarmayegozāri dar Tavāfoğ e Pažooheš niz rāhi āli barāye tabdil e ān be ⍾Elm ast.
Gold is also very valuable in Diplomacy. You can directly Gift Gold to City-States to gain their favor. Use it to balance a Trade Deal with other Nations. Or demand every last drop after a successful war and your enemy sues for peace. = Talā dar Diplomāsi niz besyār arzešmand ast. Mitavānid mostağiman be Šahr-dowlathā Talā Hadiye dahid tā nazar e mosā'ed e ānhā rā jalb konid. Bā ān Mo'āmele ye Tejāri bā kešvarhāye digar rā mota'ādel konid, yā pas az jang e movaffağ va darḵāst e solh e došman, āḵarin sekke rā ham tağāzā konid.
Ironically, some may consider Gold to be one of the less important Resources. But it's flexible nature and importance to keep your Nation running makes it a precious thing to pay attention to. After all, everyone loves Gold. = Šāyad barḵi Talā rā yeki az manābe e kam ahammiyattar bedānand. Amma en'etāf va ahammiyat e ān barāye edāre ye kešvar, ān rā be čizi gerānbahā tabdil mikonad ke bāyad be ān tavajjoh kard. Harče bāšad, hame Talā rā doost dārand.
Not to be confused with the Resource of the same name, Gold Ore = Bā manba' e hamnām, Sang e Talā, eštebāh našavad
Trade Route = Masir e Tejāri
See also: [param] = Hamčenin bebinid: [param]
Research Agreements = Tavāfoğhāye Pažooheš

As cities grow in size and influence, you have to deal with a happiness mechanic that is no longer tied to each individual city.\nInstead, your entire empire shares the same level of satisfaction.\nAs your cities grow in population you’ll find that it is more and more difficult to keep your empire happy. = Bā rošd e andāze va nofooz e šahrhā, bāyad bā sāzokār e rezāyati rooberoo šavid ke digar be har šahr be tanhāyi vābaste nist.\nBe jāye ān, hame ye emperātoori yek sat'h e Rezāyat dārad.\nBā afzāyeš e jam'iyat e šahrhā, rāzi negah dāštan e emperātoori saḵttar mišavad.
In addition, you can’t even build any city improvements that increase happiness until you’ve done the appropriate research.\nIf your empire’s happiness ever goes below zero the growth rate of your cities will be hurt.\nIf your empire becomes severely unhappy (as indicated by the smiley-face icon at the top of the interface)\n  your armies will have a big penalty slapped on to their overall combat effectiveness. = Tāze, tā pažooheš e lāzem rā anjām nadahid nemitavānid behsāzihāye šahri ye afzāyande ye rezāyat besāzid.\nAgar Rezāyat e emperātoori az sefr pāyintar beravad, sor'at e rošd e šahrhā āsib mibinad.\nAgar emperātoori besyār nārāzi šavad, ke nemād e labḵand dar bālā ye vāset nešān midahad,\n  kārāyi ye koli ye jangi ye arteš e šomā jarime ye bozorgi migirad.
This means that it is very difficult to expand quickly in Unciv.\nIt isn’t impossible, but as a new player you probably shouldn't do it.\nSo what should you do? Chill out, scout, and improve the land that you do have by building Workers.\nOnly build new cities once you have found a spot that you believe is appropriate. = Pas gostareš e sari' dar Unciv besyār došvār ast.\nĞeyr e momken nist, amma barāye bāzikon e tāze šāyad monāseb nabāšad.\nPas če konid? Ārām bāšid, kāvoš konid va bā sāḵt e Kāregar, zamin e mojood rā behsāzi konid.\nTanhā pas az yāftan e makāni ke monāseb midānid šahr e tāze besāzid.

 # Requires translation!
Unhappiness = Nārāziyati
It seems that your citizens are unhappy!\nWhile unhappy, your civilization will suffer many detrimental effects, increasing in severity as unhappiness gets higher. = Be nazar miresad šahrvandān e šomā nārāzi hastand!\nDar in vaz'iyat, tamaddon az āthār e ziyānbār e besyāri āsib mibinad ke bā afzāyeš e nārāziyati šedidtar mišavand.
Unhappiness has two main causes: Population and cities.\n  Each city causes 3 unhappiness, and each population, 1 = Nārāziyati do ellat e asli dārad: Jam'iyat va šahrhā.\n  Har šahr 3 nārāziyati va har vāhed e jam'iyat 1 nārāziyati ijād mikonad
There are 2 main ways to combat unhappiness:\n  by building happiness buildings for your population\n  or by having improved luxury resources within your borders. = Barāye mobāreze bā nārāziyati 2 rāh e asli vojood dārad:\n  sāḵt e sāḵtemānhāye rezāyat barāye jam'iyat\n  yā dāštan e manābe e tajammoli ye behsāzišode dar maržā.

You have entered a Golden Age!\nGolden age points are accumulated each turn by the total happiness \n  of your civilization\nWhen in a golden age, culture and production generation increases +20%,\n  and every tile already providing at least one gold will provide an extra gold. = Vāred e Asr e Talāi šodid!\nEmtiyāžāye Asr e Talāi har nobat az Rezāyat e kol\n  e tamaddon jam' mišavand\nDar Asr e Talāi, Tolid e Farhang va Tolid +20% ziyād mišavad,\n  va har zamin ke az ğabl hadd ağal yek Talā midahad, yek Talā ye ezāfi ḵāhad dād.

Roads and Railroads = Jādde va Rāh āhan
Roads reduce the Movement Points required to move between two tiles connected by Roads. = Jāddehā Emtiyāz e Harekat e lāzem barāye raftan beyne do zamin e vaslšode bā Jādde rā kam mikonand.
Railroads improve this reduction even more! = Rāhāhan in kāheš rā bištar ham mikonad!
This greatly improves the speed you can get Units around the map. = In sor'at e jābejāyi ye Niroohā dar nağše rā besyār afzāyeš midahad.
Until you research the technology that removes it, Roads do not cross Rivers = Tā pažooheš e fannāvari ye lāzem barāye hazf e in mahdoodiyat, Jāddehā az Roodḵānehā nemigozarand
Connecting your cities to the capital by Roads and/or Railroads will generate Gold via the Trade Route. = Vasl e šahrhā be pāytaḵt bā Jādde va/yā Rāhāhan az rāh e Masir e Tejāri Talā tolid mikonad.
However, since each Road and Railroad have a Maintenance Cost, it may be more economical to wait until the cities grow and only place where needed. = Amma čon har Jādde va Rāhāhan hazine ye Negahdāri dārad, šāyad behtar bāšad tā rošd e šahrhā sabr konid va fağat dar jāye lāzem besāzid.

Connecting your cities to the capital by Roads and/or Railroads will generate Gold via the Trade Route. You earn more Gold the more Population the City and your Capital has. = Vasl e šahrhā be pāytaḵt bā Jādde va/yā Rāhāhan az rāh e Masir e Tejāri Talā tolid mikonad. Harče Jam'iyat e šahr va Pāytaḵt bištar bāšad, Talā ye bištari migirid.
Note that each road costs 1 Gold Maintenance per turn, and each Railroad costs 2 Gold, so it may be more economical to wait until the cities grow! = Be yād dāšte bāšid har jādde dar har nobat 1 Talā va har Rāhāhan 2 Talā Negahdāri hazine dārad; pas šāyad sabr tā rošd e šahrhā be sarfetar bāšad!
Railroads connecting a city to the Capital also provide a 25% Production Boost to the City, but not the Capital. = Rāhāhan e vaslkonande ye šahr be Pāytaḵt, Tolid e ān šahr rā 25% afzāyeš midahad, amma na Tolid e Pāytaḵt rā.
Trade Routes are also connected over Water via certain buildings like the Harbor. As long as there is a chain that can reach the Capital, there's a Trade Route. Look for this symbol in Yellow below the City Name to mean you have an active Trade Route to your Capital. = Masirhāye Tejāri az rooye Āb ham bā sāḵtemānhāyi mānand e Bandar vasl mišavand. Tā zamani ke zanjire i be Pāytaḵt beresad, Masir e Tejāri vojood dārad. Nemād e Zard e zir e Nām e Šahr nešāne ye Masir e Tejāri ye fa'āl be Pāytaḵt ast.
Trade Routes can get broken either by Blockades or by Removing/Pillaging the connecting Road/Railroad chain. = Masirhāye Tejāri bā Mohāsere yā Hazf/Ğārat e zanjire ye vaslkonande ye Jādde/Rāhāhan ğat' mišavand.
City Blockade = Mohāsere ye Šahr

Once you’ve settled 3-4 cities and build universities, you’re probably already 100 to 150 turns into the game.\nNow is a good time to start thinking about how, exactly, you want to win – if you haven’t already. = Vağti 3-4 šahr sāḵte va dānešgāh besāzid, ehtemālan 100 tā 150 nobat az bāzi gozašte ast.\nHalā vağt e ḵoobi ast ke agar hanooz nakarde id, be raveš e dağiğ e piroozi fekr konid.
There are four ways to win in Unciv. They are:\n - Cultural Victory: Complete 5 Social Policy Trees and build the Utopia Project\n - Domination Victory: Conquer the original capital of all other Major civs\n - Science Victory: Be the first to construct a Spaceship\n - Diplomatic Victory: Build the United Nations and win the vote = Dar Unciv čahār rāh e piroozi vojood dārad:\n - Piroozi ye Farhangi: 5 deraḵt e Siyāsat e Ejtemāyi rā takmil va Porože ye Ootoopiyā rā besāzid\n - Piroozi ye Solte: Pāytaḵt e asli ye hame ye tamaddonhāye bozorg e digar rā fath konid\n - Piroozi ye Elmi: Naḵostin sāzande ye Fazāpeymā bāšid\n - Piroozi ye Diplomatik: Sāzmān e Melal e Mottahed rā besāzid va dar rāygiri barande šavid
So to sum it up, these are the basics of Unciv – Found a prosperous first city, expand slowly to manage happiness, and set yourself up for the victory condition you wish to pursue.\nObviously, there is much more to it than that, but it is important not to jump into the deep end before you know how to swim. = Pas pāyehāye Unciv in ast: šahr e avval e ābādi besāzid, barāye modiriyat e Rezāyat ārām gostareš yābid va ḵod rā barāye šarāyet e piroozi ye delḵāh āmāde konid.\nĀškār ast ke bāzi besyār farātar az in ast, amma mohem ast piš az yādgiri ye šenā dar āb e amiğ naparid.

Enemy City = Šahr e Došman
Cities can be conquered by reducing their health to 1, and entering the city with a melee unit.\nSince cities heal each turn, it is best to attack with ranged units and use your melee units to defend them until the city has been defeated! = Bā kāheš e salāmati ye šahr be 1 va vorood e yek niroo ye nazdikzan, mitavān ān rā fath kard.\nČon šahrhā har nobat tarmim mišavand, behtar ast bā niroohāye doorbord hamle konid va tā šekast e šahr, bā niroohāye nazdikzan az ānhā defā' konid!

Luxury Resource = Manba' e Tajammoli
Luxury resources within your domain and with their specific improvement are connected to your trade network.\nEach unique Luxury resource you have adds 5 happiness to your civilization, but extra resources of the same type don't add anything, so use them for trading with other civilizations! = Manābe e tajammoli ye dar maržā ke behsāzi ye ḵās e ḵod rā dārand, be šabake ye tejāri vasl mišavand.\nHar noe e motefāvet e manba' e Tajammoli 5 Rezāyat be tamaddon miafzāyad, amma nosḵehāye ezāfi ye hamān noe čizi ezāfe nemikonand; pas bā tamaddonhāye digar tejārat konid!

Strategic Resource = Manba' e Rāhbordi
Strategic resources within your domain and with their specific improvement are connected to your trade network.\nStrategic resources allow you to train units and construct buildings that require those specific resources, for example the Horseman requires Horses. = Manābe e rāhbordi ye dar maržā ke behsāzi ye ḵās e ḵod rā dārand, be šabake ye tejāri vasl mišavand.\nManābe e Rāhbordi sāḵt e niroo va sāḵtemān e niyāzmand e ānhā rā momken mikonand; masalan Asbsavār be Asb niyāz dārad.
Unlike Luxury Resources, each Strategic Resource on the map provides more than one of that resource.\nThe top bar keeps count of how many unused strategic resources you own.\nA full drilldown of resources is available in the Resources tab in the Overview screen. = Bar ḵalāf e Manābe e Tajammoli, har manba' e Rāhbordi dar nağše biš az yek vāhed az ān manba' midahad.\nNavār e bālā meğdār e manābe e rāhbordi ye masrafnašode ye šomā rā mišomārad.\nJoziyāt e kāmel e manābe dar zabāne ye Manābe dar safhe ye Moroor ast.

The city can no longer put up any resistance!\nHowever, to conquer it, you must enter the city with a melee unit = Šahr digar nemitavānad moğāvemat konad!\nAmma barāye fath e ān bāyad bā yek niroo ye nazdikzan vāred šavid

After Conquering = Pas az Fath
When conquering a city, you can choose to liberate, annex, puppet, or raze the city. = Hengām e fath e šahr mitavānid āzādsāzi, elhāğ, dastnešāndegi yā virānsāzi rā enteḵāb konid.
\nLiberating the city will return it to its original owner, giving you a massive diplomatic boost with them!\n\nAnnexing the city will give you full control over it, but also increase the citizens' unhappiness to 2x!\nThis can be mitigated by building a courthouse in the city, returning the citizen's unhappiness to normal.\n\nPuppeting the city will mean that you have no control on the city's production.\nThe city will not increase your tech or policy cost.\nA puppeted city can be annexed at any time, but annexed cities cannot be returned to a puppeted state!\n\nRazing the city will lower its population by 1 each turn until the city is destroyed!\nYou cannot raze a city that is either the starting capital of a civilization or the holy city of a religion. = \nĀzādsāzi, šahr rā be mālik e asli barmigardānad va ravābet e diplomatik rā besyār behbood midahad!\n\nElhāğ, kontrol e kāmel e šahr rā midahad amma nārāziyati ye šahrvandān rā be 2x miresānad!\nBā sāḵt e dādgāh dar šahr, nārāziyati ye šahrvandān be ādi barmigardad.\n\nDastnešānde kardan ya'ni kontrol e Tolid e šahr rā nadārid.\nŠahr hazine ye fannāvari yā siyāsat rā ziyād nemikonad.\nŠahr e dastnešānde rā har zamān mitavān elhāğ kard, amma šahr e elhāğšode rā nemitavān dobāre dastnešānde kard!\n\nVirānsāzi har nobat Jam'iyat e šahr rā 1 kam mikonad tā šahr nābood šavad!\nŠahr e pāytaḵt e āğāzin e yek tamaddon yā šahr e moğaddas e yek din rā nemitavān virān kard.

You have encountered a barbarian unit!\nBarbarians attack everyone indiscriminately, so don't let your \n  civilian units go near them, and be careful of your scout! = Bā yek niroo ye barbar rooberoo šodid!\nBarbarhā be hame bitafāvot hamle mikonand; pas nagzārid\n  niroohāye ğeyr e nezāmi be ānhā nazdik šavand va morāğeb e pišāhang bāšid!

You have encountered another civilization!\nOther civilizations start out peaceful, and you can trade with them,\n  but they may choose to declare war on you later on = Bā tamaddon e digari rooberoo šodid!\nTamaddonhāye digar dar āğāz solh joo hastand va mitavānid bā ānhā tejārat konid,\n  amma šāyad ba'dan be šomā e'lām e jang konand

Injured Units = Niroohāye Zaḵmi
Injured units deal less damage, but recover after turns that they have been inactive.\nUnits heal 10 health per turn in enemy territory or neutral land,\n  20 inside your territory and 25 in your cities. = Niroohāye zaḵmi āsib e kamtari mizanand, amma pas az nobathāye bi fa'āliyat behbood miyāband.\nNiroohā har nobat dar ḵāk e došman yā sarzamin e bitaraf 10 salāmati,\n  dar ḵāk e šomā 20 va dar šahrhāye šomā 25 salāmati bāz miyāband.

Workers = Kāregarhā
Workers are vital to your cities' growth, since only they can construct improvements on tiles.\nImprovements raise the yield of your tiles, allowing your city to produce more and grow faster while working the same amount of tiles! = Kāregarhā barāye rošd e šahrhā hayāti hastand, čon fağat ānhā mitavānand behsāzi rooye zaminhā besāzand.\nBehsāzihā bāzdehi ye zamin rā afzāyeš midahand tā šahr bā hamān tedād zamin Tolid e bištar va rošd e sari'tar dāšte bāšad!

Embarking = Savār e Kešti Šodan
Once a certain tech is researched, your land units can embark, allowing them to traverse water tiles.\nEntering or leaving water takes the entire turn. = Pas az pažooheš e fannāvari ye ḵās, niroohāye zamini mitavānand savār e kešti šavand va az zaminhāye ābi bogzarand.\nVorood be āb yā ḵorooj az ān yek nobat e kāmel tool mikešad.
Units are defenseless while embarked (cannot use modifiers), and have a fixed Defending Strength based on your tech Era, so be careful!\nRanged Units can't attack, Melee Units have a Strength penalty, and all have limited vision. = Niroohā hengām e savār e kešti boodan bi-defā' hastand, modifikatorhā rā nemitavānand be kār bebarand va Ğodrat e Defā'i ye sābeti bar pāye ye Asr e fannāvari dārand; pas morāğeb bāšid!\nNiroohāye Doorbord nemitavānand hamle konand, Niroohāye Nazdikzan jarime ye Ğodrat dārand va did e hame mahdood ast.

Idle Units = Niroohāye Bikār
Clicking 'Next unit' moves to the next idle unit in the queue (as listed in Overview -> Units). After issuing an order to a unit, if 'Auto Unit Cycle' in Options -> Gameplay is enabled, you will automatically select the next idle unit. = Zadan e «Niroo ye ba'adi» niroo ye bikār e ba'adi dar saf rā enteḵāb mikonad, hamān fehrest e Moroor -> Niroohā. Pas az dastoor be yek niroo, agar «Gardeš e Ḵodkār e Niroo» dar Tanzimāt -> Raveš e bāzi fa'āl bāšad, niroo ye bikār e ba'adi ḵodkār enteḵāb mišavad.
If you don't want to move a unit this turn, you can skip it by clicking 'Next unit' again, or command the unit to 'Skip turn'. = Agar nemiḵāhid in nobat nirooyi rā harekat dahid, mitavānid dobāre «Niroo ye ba'adi» rā bezanid yā dastoor e «Rad kardan e nobat» bedahid.
If you want to disable the 'Next unit' feature entirely, you can toggle it in Options -> Gameplay -> Check for idle units. = Barāye ğeyrefa'āl kardan e kāmel e «Niroo ye ba'adi», gozine ye Tanzimāt -> Raveš e bāzi -> Barrasi ye niroohāye bikār rā avaz konid.
If you'd rather 'Next unit' cycle the units and not mark them as Done, you can change it in the Options -> Gameplay menu. = Agar tarjih midahid «Niroo ye ba'adi» fağat beyne niroohā begardad va ānhā rā Anjāmšode nešāne nazanad, ān rā dar Tanzimāt -> Raveš e bāzi tağyir dahid.
You can also cycle through the idle units using the left and right triangles on the Unit Table in the lower left of the screen. Or by default using the Cycle button next to the 'Next Unit' button. = Bā mosallas e čap va rāst e Jadval e Niroo dar pāyin e čap e safhe niz mitavānid beyne niroohāye bikār begardid. Yā be toor e pišfarz bā dokme ye Gardeš dar kenār e «Niroo ye ba'adi».

 # Requires translation!
Contact Me = Tamās bā man
 # Requires translation!
Hi there! If you've played this far, you've probably seen that the game is currently incomplete.\n Unciv will remain open-source forever. = Salām! Agar tā injā bāzi karde-id, ehtemālan dide-id ke bāzi hanuz kāmel nist.\nUnciv hamishe bāz-matn ḵāhad mānd.
 # Requires translation!
What motivates me to keep working on it, \n  besides the fact I think it's amazingly cool that I can,\n  is the support from the players - you guys are the best! = Čizi ke man rā barāye edāme-ye kār ru-ye ān bā-angiyeze mikonad, \n  gheyr az inke fekr mikonam inke mitavānam ān rā anjām daham foghol’āde ast,\n  hemāyat-e bāzikonān ast — šomā behtarin hastid!
 # Requires translation!
If you like Unciv, please rate and review it in the App Store.\n If you find a problem or have a suggestion, open a GitHub issue and help us make the game even better! = Agar Unciv rā dust dārid, lotfan dar App Store be ān emtiāz dahid va nazar benevisid.\nAgar moshkeli didid yā pishnahādi dārid, yek GitHub issue bāz konid va be mā komak konid bāzi rā behtar konim!

Pillaging = Ğārat
Military units can pillage improvements, which heals them 25 health and ruins the improvement.\nThe tile can still be worked, but advantages from the improvement - stat bonuses and resources - will be lost.\nWorkers can repair these improvements, which takes less time than building the improvement from scratch.\nPillaging certain improvements will result in your units looting gold from the improvement. = Niroohāye nezāmi mitavānand behsāzihā rā ğārat konand; in kār 25 salāmati be ānhā barmigardānad va behsāzi rā virān mikonad.\nHanooz mitavān rooye zamin kār kard, amma soodhāye behsāzi, ya'ni emtiyāžāye āmār va manābe, az dast miravand.\nKāregarhā mitavānand in behsāzihā rā dar zamāni kamtar az sāḵt e az no ta'mir konand.\nĞārat e ba'zi behsāzihā bā'es mišavad niroohā Talā be dast āvarand.

Experience = Tajrobe
Units that enter combat gain experience, which can then be used on promotions for that unit.\nUnits gain more experience when in Melee combat than Ranged, and more when attacking than when defending. = Niroohāyi ke vāred e jang mišavand tajrobe migirand ke barāye erteğā ye ān niroo estefāde mišavad.\nDar jang e Nazdikzan bištar az Doorbord, va dar Hamle bištar az Defā' tajrobe kasb mikonand.
Units can only gain up to 30 XP from Barbarian units - meaning up to 2 promotions. After that, Barbarian units will provide no experience. = Niroohā fağat tā 30 XP az Barbarhā kasb mikonand, ya'ni tā 2 erteğā. Pas az ān, niroohāye Barbar hič tajrobe i nemidahand.

Combat = Nabard
Unit and cities are worn down by combat, which is affected by a number of different values.\nEach unit has a certain 'base' combat value, which can be improved by certain conditions, promotions and locations. = Niroo va šahrhā dar jang farsoode mišavand va jang az meğdārhāye goonāgoon tāsir migirad.\nHar niroo meğdār e jangi ye «pāye» dārad ke bā šarāyet, erteğā va makānhāye ḵās behtar mišavad.
Units use the 'Strength' value as the base combat value when melee attacking and when defending.\nWhen using a ranged attack, they will the use the 'Ranged Strength' value instead. = Niroohā dar hamle ye nazdik va hengām e defā' az «Ğodrat» be onvān e meğdār e jangi ye pāye estefāde mikonand.\nDar hamle ye doorbord be jāye ān «Ğodrat e Doorbord» rā be kār mibarand.
Ranged attacks can be done from a distance, dependent on the 'Range' value of the unit.\nWhile melee attacks allow the defender to damage the attacker in retaliation, ranged attacks do not. = Hamle ye doorbord az fāsele momken ast va be meğdār e «Bord» e niroo bastegi dārad.\nHamle ye nazdik be modāfe' ejāze midahad dar pāsoḵ be mohājem āsib bezanad, amma hamle ye doorbord čenin nist.

Embassies = Sefāratḵānehā
Establishing an embassy in other players' Capital city shows the location of their Capital, likewise other players who establish an embassy in your Capital can see location of your Capital. = Ta'sis e sefārat dar Pāytaḵt e bāzikon e digar, makān e Pāytaḵt e oo rā nešān midahad. Be hamin tartib, digarān bā sefārat dar Pāytaḵt e šomā makān e ān rā mibinand.
Embassies thus allow Spies to be placed in another players' Capital City if Espionage is enabled. = Pas agar Jāsoosi fa'āl bāšad, sefāratḵānehā ğarārdādan e Jāsoos dar Pāytaḵt e bāzikon e digar rā momken mikonand.
Mutual embassies are required to allow trading open borders and to sign Research Agreement and Defensive Pact. = Barāye mo'āmele ye maržāye bāz va emzā ye Tavāfoğ e Pažooheš va Peymān e Defā'i, sefāratḵānehāye dogāne lāzem ast.
Declaring war on another player or denouncing them will remove embassies from both players' Capitals. You will have to re-establish them to use their effect. = E'lām e jang yā mahkoom kardan e bāzikon e digar sefāratḵānehāye har do Pāytaḵt rā hazf mikonad. Barāye sood e ānhā bāyad dobāre ta'sis konid.
Re-establishing an embassy after denunciation from either side becomes available next turn, while re-establishing them when at war requires a peace treaty. = Pas az mahkoomiyat az har taraf, az nobat e ba'adi mitavān sefārat rā dobāre ta'sis kard; dar jang barāye in kār be peymān e solh niyāz ast.
Be cautious when accepting embassy from other players because they can spy on your capital, or worse may start planning to attack you. = Dar pazireš e sefārat e digarān ehtiyāt konid, čon mitavānand az pāytaḵt jāsoosi konand yā badtar, barnāme ye hamle berizand.
Note that before you can offer an embassy, you need the required Technology. = Be yād dāšte bāšid piš az pišnahād e sefārat, Fannāvari ye lāzem rā niyāz dārid.
Embassies are available using the Gods and Kings ruleset. = Sefāratḵānehā dar ğavānin e Ḵodāyān va Pādešāhān dar dastres hastand.
Defensive Pacts = Peymānhāye Defā'i

Open Borders from other player and vice versa allow units to freely pass through their territory. = Maržāye Bāz e bāzikon e digar va bar'aks, be niroohā ejāze midahand āzādāne az ḵāk e ham bogzarand.
They also let Missionaries to enter other players' territory without suffering attrition. = Hamčenin Moballeğān mitavānand bedoon e farsāyeš vāred e ḵāk e digarān šavand.
Open Borders expire depending on game speed and are canceled upon Declaration of War, the closure however takes effect only after war ends and need to be traded again. = Maržāye Bāz bar pāye ye sor'at e bāzi monğazi mišavand va bā E'lām e Jang lağv mišavand; amma baste šodan fağat pas az pāyān e jang ejrā mišavad va bāyad dobāre mo'āmele šavand.
You gain diplomatic boost with other AI player if you both have Open Borders to each other = Agar šomā va yek bāzikon e Hooš e Masnoo'i maržāye bāz e dogāne dāšte bāšid, ravābet e diplomatik behtar mišavad
Be cautious when giving Open Borders because other player may settle a City near your lands in an area you are planning to use, they may also use your territory to attack your friends or City State allies. = Dar dādan e Maržāye Bāz ehtiyāt konid, čon bāzikon e digar šāyad dar nazdiki ye ḵāk e šomā, dar jāyi ke niyāz dārid, šahr besāzad yā az ḵāk e šomā barāye hamle be doostān yā Šahr-dowlathāye mottahed estefāde konad.
Note that before you can offer or accept open borders, both Nations need the required Technology. = Be yād dāšte bāšid piš az pišnahād yā pazireš e maržāye bāz, har do kešvar Fannāvari ye lāzem rā niyāz dārand.
When playing with the Gods and Kings ruleset mutual embassies need to be established before Open Borders can be traded. = Dar ğavānin e Ḵodāyān va Pādešāhān, piš az mo'āmele ye Maržāye Bāz bāyad sefāratḵānehāye dogāne ta'sis šavand.

In Research Agreements, you and another civilization decide to jointly research technology.\nAt the end of the agreement, you will both receive a 'lump sum' of ⍾Science, which will go towards one of your unresearched technologies. = Dar Tavāfoğ e Pažooheš, šomā va tamaddon e digar tasmim migirid ke fannāvari rā moštarak pažooheš konid.\nDar pāyān e tavāfoğ, har do meğdār e yekjāyi az ⍾Elm migirid ke sarf e yeki az fannāvarihāye pažoohešnašode mišavad.
The amount of ⍾Science you receive at the end is dependent on the ⍾Science generated by your cities and the other civilization's cities during the agreement - the more, the better! = Meğdār e ⍾Elm e nahāyi be ⍾Elm e tolidšode dar šahrhāye šomā va tamaddon e digar dar tool e tavāfoğ bastegi dārad; harče bištar, behtar!
Note that before you can invest in a research agreement, you must have a Declaraction of Friendship, both Nations need the required Technology, and both Nations need enough Gold on hand for the agreement. = Piš az sarmayegozāri dar tavāfoğ e pažooheš, bāyad E'lāmiye ye Doosti dāšte bāšid, har do kešvar Fannāvari ye lāzem va Talā ye kāfi barāye tavāfoğ dāšte bāšand.
When playing with the Gods and Kings ruleset mutual embassies need to be established before a Research Agreement can be signed. = Dar ğavānin e Ḵodāyān va Pādešāhān, piš az emzā ye Tavāfoğ e Pažooheš bāyad sefāratḵānehāye dogāne ta'sis šavand.

Defensive pacts allow you and another civ to protect one another from aggressors.\nOnce the defensive pact is signed, you will be drawn into their future defensive wars, just as they will be drawn into your future defensive wars. Declaring war on any Civ will remove all of your defensive pacts. You will have to re-sign them to use their effect. = Peymānhāye Defā'i be šomā va tamaddon e digar ejāze midahand az ham dar barābar e mohājemān defā' konid.\nPas az emzā, šomā vāred e janğāye defā'i ye āyande ye ānhā mišooyd va ānhā niz vāred e janğāye defā'i ye šomā mišavand. E'lām e jang be har tamaddon hame ye peymānhāye defā'i rā hazf mikonad. Barāye sood e ānhā bāyad dobāre emzā šavand.
Be cautious when signing defensive pacts because they can bring you into wars that you might not want to be in. = Dar emzā ye peymān e defā'i ehtiyāt konid, čon momken ast šomā rā vāred e jang e nāḵāste konad.
The AI is very careful and will not accept defensive pacts with less than 80 influence. = Hooš e Masnoo'i besyār ehtiyāt mikonad va bā nofooz e kamtar az 80 peymān e defā'i nemipazirad.
Note that before you can sign a defensive pact, you must have a Declaraction of Friendship, and both Nations need the required Technology. = Piš az emzā ye peymān e defā'i bāyad E'lāmiye ye Doosti dāšte bāšid va har do kešvar Fannāvari ye lāzem rā dāšte bāšand.
When playing with the Gods and Kings ruleset mutual embassies need to be established before a Defensive Pact can be signed. = Dar ğavānin e Ḵodāyān va Pādešāhān, piš az emzā ye Peymān e Defā'i bāyad sefāratḵānehāye dogāne ta'sis šavand.

Not all nations are contending with you for victory.\nCity-States are nations that can't win, can't be traded with, and instead confer certain bonuses to friendly civilizations. = Hame ye kešvarhā barāye piroozi bā šomā reğābat nemikonand.\nŠahr-dowlathā nemitavānand barande šavand yā tejārat konand; be jāye ān, be tamaddonhāye doost emtiyāžāyi midahand.
Instead, diplomatic relations with City-States are determined by Influence - a meter of 'how much the City-State likes you'.\nInfluence can be increased by attacking their enemies, liberating their city, and giving them sums of gold. = Ravābet e diplomatik bā Šahr-dowlathā az rāh e Nofooz ta'yin mišavad; me'yāri az in ke «Šahr-dowlat čeğadr šomā rā doost dārad».\nBā hamle be došmanānešān, āzādsāzi ye šahr va dādan e Talā mitavān Nofooz rā afzāyeš dād.
Certain bonuses are given when you are at above 30 influence.\nWhen you have above 60 Influence, and you have the highest influence with them of all civilizations, you are considered their 'Ally', and gain further bonuses and access to the Luxury and Strategic resources in their lands. = Bā nofooz e bālā ye 30 emtiyāžāye ḵāsi migirid.\nAgar Nofooz bālā ye 60 va az hame ye tamaddonhā bištar bāšad, «Mottahed» e ānhā hastid va emtiyāžāye bištar va dastresi be manābe e Tajammoli va Rāhbordi ye ḵākešān migirid.

While working the land is good, eventually your Citizens will want to Specialize. = Har čand kār rooye zamin ḵoob ast, saranjām Šahrvandān miḵāhand Moteḵasses šavand.
Certain Buildings will also provide Specialist Slots. These slots will show up in the Citizen Management within the City Screen under Specialists. Each slot can be filled with a Citizen which will then become a Specialist. = Barḵi Sāḵtemānhā Jāygāh e Moteḵasses midahand. In jāygāhhā dar Modiriyat e Šahrvandān dar safhe ye šahr, zir e Moteḵassesān, nešān dāde mišavand. Har jāygāh rā mitavān bā yek šahrvand por kard ke sepas Moteḵasses mišavad.
Each Specialist will generate a certain amount of yield as indicated to the right of the available slots. = Har Moteḵasses meğdār e ḵāsi bāzdehi tolid mikonad ke dar samt e rāst e jāygāhhāye mojood nevešte ast.
While these are a great way to specialize the yield production of a City outside of the surrounding Tile Yields, Specialists have an additional value. Each one also generates Great Person Points each turn. With enough of them, a new Great Person will join your Nation. = In rāh e ḵoobi barāye taḵassosi kardan e Tolid e šahr farātar az bāzdehi ye zaminhāye atrāf ast, amma Moteḵassesān arzeš e digari ham dārand. Har yek har nobat Emtiyāz e Fard e Bozorg ham midahad. Bā meğdār e kāfi, yek Fard e Bozorg e tāze be kešvar mipeyvandad.
Great People = Ensān hāye Bozorg

Certain buildings, and specialists in cities, generate Great Person points per turn.\nThere are several types of Great People, and their points accumulate separately.\nThe number of points per turn and accumulated points can be viewed in the Overview screen. = Barḵi sāḵtemānhā va moteḵassesān e šahr har nobat emtiyāz e Fard e Bozorg tolid mikonand.\nFardhāye Bozorg anvā' e moḵtalef dārand va emtiyāžāyešān jodāgāne jam' mišavad.\nMeğdār e har nobat va kol e jam'šode rā dar safhe ye Moroor mitavān did.
Alternatively, the Great Person points breakdown per city can be viewed in each City Screen (see UI Tips article). = Yā mitavān joziyāt e emtiyāz e Fard e Bozorg e har šahr rā dar safhe ye hamān šahr did; mağāle ye Nekāte Vāset rā bebinid.
Once enough points have been accumulated, a Great Person of that type will be created!\nEach Great Person can construct a certain Great Improvement which gives large yields over time, or immediately consumed to provide a certain bonus now. = Vağti emtiyāz e kāfi jam' šod, yek Fard e Bozorg az hamān noe sāḵte mišavad!\nHar Fard e Bozorg mitavānad Behsāzi ye Bozorg e ḵāsi besāzad ke dar tool e zamān bāzdehi ye besyār midahad, yā fori masraf šavad tā hamin alān emtiyāz e ḵāsi bedahad.
Great Improvements also provide any strategic resources that are under them, so you don't need to worry if resources are revealed underneath your improvements! = Behsāzihāye Bozorg har manba' e rāhbordi ye zir e ḵod rā ham ta'min mikonand; pas agar manba'i zir e behsāzi āškār šod, negarān nabāšid!

Removing Terrain Features = Hazf e Vižegihāye Zamin
Certain tiles have terrain features - like Flood plains or Forests -  on top of them. Some of these layers, like Jungle, Marsh and Forest, can be removed by workers.\nRemoving the terrain feature does not remove any resources in the tile, and is usually required in order to add improvements exploiting those resources. = Barḵi zaminhā rooye ḵod vižegihāyi mānand e Dašt e Selābi yā Jangal dārand. Kāregarhā mitavānand barḵi lāyehā, mānand e Jangal e Hārre, Mordāb va Jangal, rā hazf konand.\nHazf e vižegi ye zamin manābe rā hazf nemikonad va mamoolan barāye sāḵt e behsāzi ye esteḵrāj e ān manābe lāzem ast.

Natural Wonders, such as the Mt. Fuji, the Rock of Gibraltar and the Great Barrier Reef, are unique, impassable terrain features, masterpieces of mother Nature, which possess exceptional qualities that make them very different from the average terrain.\nThey benefit by giving you large sums of Culture, ⍾Science, Gold or Production if worked by your Cities, which is why you might need to bring them under your empire as soon as possible. = Ojoobehāye Tabi'i, mānand e Kooh e Fooji, Saḵre ye Jebroltāreğ va Ābsang e Bozorg, vižegihāye yegāne va ğeyr e ğābel e oboor va šāhkārhāye Tabiat hastand ke bā zamin e mamooli tafāvot e bozorgi dārand.\nAgar šahrhā rooyešān kār konand, Farhang, ⍾Elm, Talā yā Tolid e besyāri midahand; pas šāyad bāyad harče zoodtar ānhā rā be emperātoori beyāfzāyid.

Keyboard = Kibord
If you have a keyboard, some shortcut keys become available. Unit command or improvement picker keys, for example, are shown directly in their corresponding buttons. = Agar safhekelid dārid, miyānborhāyi dar dastres hastand. Masalan kelidhāye dastoor e niroo yā enteḵāb e behsāzi rooye dokme ye marboot nešān dāde mišavand.
On the world screen the hotkeys are as follows: = Miyānborhāye safhe ye jahān inhā hastand:
Space or 'N' - Next unit or turn\n'E' - Empire overview (last viewed page)\n'+', '-' - Zoom in / out\nHome - center on capital or open its City Screen if already centered = Space yā 'N' - Niroo yā nobat e ba'adi\n'E' - Moroor e emperātoori, āḵarin safhe ye dide šode\n'+', '-' - Bozorgnamāyi / koočaknamāyi\nHome - Markaz bar pāytaḵt, yā agar az ğabl markaz ast bāz kardan e safhe ye šahr
F1 - Open Civilopedia\nF2 - Empire overview Trades\nF3 - Empire overview Units\nF4 - Empire overview Diplomacy\nF5 - Social policies\nF6 - Technologies\nF7 - Empire overview Cities\nF8 - Victory Progress\nF9 - Empire overview Stats\nF10 - Empire overview Resources\nF11 - Quicksave\nF12 - Quickload = F1 - Bāz kardan e Tamaddon-nāme\nF2 - Tejārat e moroor e emperātoori\nF3 - Niroohāye moroor e emperātoori\nF4 - Diplomāsi ye moroor e emperātoori\nF5 - Siyāsathāye ejtemāyi\nF6 - Fannāvarihā\nF7 - Šahrhāye moroor e emperātoori\nF8 - Pišraft e piroozi\nF9 - Āmār e moroor e emperātoori\nF10 - Manābe e moroor e emperātoori\nF11 - Zaḵire ye sari'\nF12 - Bārgiri ye sari'
Ctrl-R - Toggle tile resource display\nCtrl-Y - Toggle tile yield display\nCtrl-O - Game options\nCtrl-S - Save game\nCtrl-L - Load game\nCtrl-U - Toggle UI (World Screen only) = Ctrl-R - Tağyir e namāyeš e manābe e zamin\nCtrl-Y - Tağyir e namāyeš e bāzdehi ye zamin\nCtrl-O - Tanzimāt e bāzi\nCtrl-S - Zaḵire ye bāzi\nCtrl-L - Bārgiri ye bāzi\nCtrl-U - Tağyir e namāyeš e vāset, fağat safhe ye jahān
All of these can be reassigned. = Hame ye inhā rā mitavān dobāre taḵsis dād.

This is where you spend most of your time playing Unciv. See the world, control your units, access other screens from here. = Bištar e zamāne bāzi ye Unciv rā injā migzarānid. Jahān rā bebinid, niroohā rā kontrol konid va az injā be safhehāye digar beravid.
①: The menu button - civilopedia, save, load, options... = ①: Dokme ye fehrest — Tamaddon-nāme, zaḵire, bārgiri, tanzimāt...
②: The player/nation whose turn it is - click for diplomacy overview. = ②: Bāzikon/kešvari ke nobat e oost — barāye moroor e diplomāsi bezanid.
③: The Technology Button - shows the tech tree which allows viewing or researching technologies. = ③: Dokme ye Fannāvari — deraḵt e fannāvari rā barāye didan yā pažooheš nešān midahad.
④: The Social Policies Button - shows enacted and selectable policies, and with enough culture points you can enact new ones. = ④: Dokme ye Siyāsathāye Ejtemāyi — siyāsathāye pazirofte va ğābel e enteḵāb rā nešān midahad; bā Farhang e kāfi mitavān siyāsat e tāze paziroft.
⑤: The Diplomacy Button - shows the diplomacy manager where you can talk to other civilizations. = ⑤: Dokme ye Diplomāsi — modiriyat e diplomāsi rā nešān midahad tā bā tamaddonhāye digar sohbat konid.
⑥: Unit Action Buttons - while a unit is selected its possible actions appear here. = ⑥: Dokmehāye Amaliyyat e Niroo — hengām e enteḵāb e niroo, kārhāye momken injā miyāyand.
⑦: The unit/city info pane - shows information about a selected unit or city. = ⑦: Panjare ye ettelā'āt e niroo/šahr — joziyāt e niroo yā šahr e enteḵābi rā nešān midahad.
⑧: The name (and unit icon) of the selected unit or city, with current health if wounded. Clicking a unit name or icon will open its civilopedia entry. = ⑧: Nām va nemād e niroo yā šahr e enteḵābi, bā salāmati ye fe'li agar zaḵmi ast. Zadan e nām yā nemād e niroo, madḵal e Tamaddon-nāme ye ān rā bāz mikonad.
⑨: The arrow buttons allow jumping to the next/previous idle unit. = ⑨: Dokmehāye peykān be niroo ye bikār e ba'adi/ğabli miravand.
⑩: For a selected unit, its promotions appear here, and clicking leads to the promotions screen for that unit. = ⑩: Erteğāhāye niroo ye enteḵābi injā hastand; bā zadan, safhe ye erteğā ye ān niroo bāz mišavad.
⑪: Remaining/per turn movement points, strength and experience / XP needed for promotion. For cities, you get its combat strength. = ⑪: Emtiyāžāye harekat e bağimānde/har nobat, ğodrat va tajrobe / XP e lāzem barāye erteğā. Barāye šahr, ğodrat e jangi nešān dāde mišavad.
⑫: This button closes the selected unit/city info pane. = ⑫: In dokme panjare ye ettelā'āt e niroo/šahr e enteḵābi rā mibandad.
⑬: This pane appears when you order a unit to attack an enemy. On top are attacker and defender with their respective base strengths. = ⑬: In panjare hengām e dastoor e hamle ye yek niroo be došman miyāyad. Dar bālā mohājem va modāfe' bā ğodrat e pāye ye har kodām hastand.
⑭: Below that are strength bonuses or penalties and health bars projecting before / after the attack. = ⑭: Dar zir, emtiyāžā yā jarimehāye ğodrat va navārhāye salāmati ye pišbini šode ye ğabl/ba'd az hamle hastand.
⑮: The Attack Button - let blood flow! = ⑮: Dokme ye Hamle — ḵoon rā ravān konid!
⑯: The minimap shows an overview over the world, with known cities, terrain and fog of war. Clicking will position the main map. = ⑯: Nağše ye koočak, did e koli az jahān bā šahrhāye šenāḵte, zamin va meh e jang nešān midahad. Bā zadan, jāye nağše ye asli tağyir mikonad.
⑰: To the side of the minimap are display feature toggling buttons - tile yield, worked indicator, show/hide resources. These mirror setting on the options screen and are hidden if you deactivate the minimap. = ⑰: Kenār e nağše ye koočak dokmehāye tağyir e namāyeš hastand: bāzdehi ye zamin, nešāngar e kāršode va namāyeš/penhān e manābe. Inhā bā tanzimāt e safhe ye Tanzimāt yeki hastand va bā ḵāmooš kardan e nağše ye koočak penhān mišavand.
⑱: Tile information for the selected hex - current or potential yield, terrain, effects, present units, city located there and such. Where appropriate, clicking a line opens the corresponding civilopedia entry. = ⑱: Ettelā'āt e zamin e šešgooš e enteḵābi: bāzdehi ye fe'li yā momken, zamin, āthār, niroohāye hāzer, šahr e mojood va mānand e ān. Dar mavāred e monāseb, zadan e yek satr madḵal e marboot e Tamaddon-nāme rā bāz mikonad.
⑲: Notifications - what happened during the last 'next turn' phase. Some are clickable to show a relevant place on the map, some even show several when you click repeatedly. = ⑲: E'lānhā — ettefāğāt e marhale ye āḵar e «Nobat e ba'adi». Barḵi bā zadan jāye marboot rā dar nağše nešān midahand va barḵi bā zadan e tekrāri čand jā rā nešān midahand.
⑳: The Next Turn Button - unless there are things to do, in which case the label changes to 'next unit', 'pick policy' and so on. = ⑳: Dokme ye Nobat e Ba'adi — magar kāri mānde bāšad ke dar ān soorat barčasb be «Niroo ye ba'adi», «Enteḵāb e siyāsat» va ğeyre tağyir mikonad.
㉑: The Multiplayer Button - Here you can easily check your active multiplayer games. = ㉑: Dokme ye Čandnafare — injā mitavānid bāzihāye čandnafare ye fa'āl rā be āsāni barrasi konid.
ⓐ: The overview button leads to the empire overview screen with various tabs (the last one viewed is remembered) holding vital information about the state of your civilization in the world. = ⓐ: Dokme ye moroor be safhe ye moroor e emperātoori bā zabānehāye goonāgoon miravad; āḵarin zabāne be yād mimānad. Ettelā'āt e hayāti e vaz'iyat e tamaddon dar jahān injāst.
ⓑ: The ♪Culture icon shows accumulated ♪Culture and ♪Culture needed for the next policy - in this case, the exclamation mark tells us a next policy can be enacted. Clicking is another way to the policies manager. = ⓑ: Nemād e ♪Farhang, ♪Farhang e jam'šode va ♪Farhang e lāzem barāye siyāsat e ba'adi rā nešān midahad; dar in mesāl alāmat e ta'ajjob ya'ni mitavān siyāsat e tāze paziroft. Zadan e ān rāh e digari be modiriyat e siyāsathā ast.
ⓒ: Your known strategic resources are displayed here with the available (usage already deducted) number - click to go to the resources overview screen. = ⓒ: Manābe e rāhbordi ye šenāḵte bā tedād e dar dastres, pas az kasr e masraf, injā hastand; barāye moroor e manābe bezanid.
ⓓ: Happiness/unhappiness balance and either golden age with turns left or accumulated happiness with amount needed for a golden age is shown next to the smiley. Clicking also leads to the resources overview screen as luxury resources are a way to improve happiness. = ⓓ: Tavāzon e Rezāyat/Nārāziyati va Asr e Talāi bā nobathāye bağimānde yā Rezāyat e jam'šode va niyāz e Asr e Talāi kenār e labḵand nešān dāde mišavad. Zadan e ān be moroor e manābe miravad, čon manābe e tajammoli rāhi barāye afzāyeš e Rezāyat hastand.
ⓔ: The ⍾Science icon shows the number of ⍾Science points produced per turn. Clicking leads to the technology tree. = ⓔ: Nemād e ⍾Elm emtiyāz e ⍾Elm e tolidšode dar har nobat rā nešān midahad. Bā zadan be deraḵt e fannāvari miravid.
ⓕ: Number of turns played with translation into calendar years. Click to see the victory overview. = ⓕ: Tedād e nobathāye bāzišode bā tabdil be sāl e tağvimi. Barāye moroor e piroozi bezanid.
ⓖ: The number of gold coins in your treasury and income. Clicks lead to the Stats overview screen. = ⓖ: Tedād e sekkehāye Talā dar ḵazāne va darāmad. Zadan e ān moroor e Āmār rā bāz mikonad.
ⓗ: The quantity of ☮Faith your citizens have generated, or 'off' if religion is disabled. Clicking it makes you go to the religion overview screen. = ⓗ: Meğdār e ☮Imān ke šahrvandān tolid karde and, yā «Ḵāmooš» agar din ğeyrefa'āl ast. Bā zadan e ān be moroor e din miravid.
ⓧ: In the center of all this - the world map! Here, the "X" marks a spot outside the map. Yes, unless the wrap option was used, Unciv worlds are flat. Don't worry, your ships won't fall off the edge. = ⓧ: Dar markaz e hame ye inhā — nağše ye jahān! Injā «X» jāyi biroon az nağše rā nešān midahad. Bale, magar gozine ye gardeš estefāde šode bāšad, jahān e Unciv taḵt ast. Negarān nabāšid, keštihā az labe nemioftand.
ⓨ: By the way, here's how an empire border looks like - it's in the national colours of the nation owning the territory. = ⓨ: Rāsti, marz e emperātoori in šekli ast — be ranğāye melli ye kešvar e mālik e sarzamin ast.
ⓩ: And this is the red targeting circle that led to the attack pane back under ⑬. = ⓩ: Va in dāyere ye sorḵ e hadafgiri ast ke panjare ye hamle rā dar ⑬ bāz kard.
What you don't see: The phone/tablet's back button will pop the question whether you wish to leave Unciv and go back to Real Life. On desktop versions, you can use the ESC key. = Čizi ke nemibinid: dokme ye bargašt e gooši/tablet miporsad āyā miḵāhid Unciv rā tark konid va be Zendegi ye Vāğe'i bargardid. Dar nosḵe ye roomeezi, kelid e ESC niz kār mikonad.

When at later stages of the game, you might have a lot of units but only a little to do. To help you we have implemented an AutoPlay feature that lets you use the AI to play part or all of your turn. = Dar marhalehāye ba'di, šāyad niroohāye besyār amma kār e kami dāšte bāšid. Barāye komak, Bāzi ye Ḵodkār rā sāḵte im tā bā Hooš e Masnoo'i baḵši yā hame ye nobat rā bāzi konid.
To enable AutoPlay, go to options and open the AutoPlay tab and press "Show AutoPlay button". = Barāye fa'āl kardan e Bāzi ye Ḵodkār, dar tanzimāt zabāne ye ān rā bāz va «Namāyeš e dokme ye Bāzi ye Ḵodkār» rā bezanid.
Clicking on the AutoPlay button opens a popup menue for choosing to AutoPlay parts or all of your turn. = Zadan e dokme ye Bāzi ye Ḵodkār fehreste bozorgšavande i barāye enteḵāb e baḵšhā yā hame ye nobat bāz mikonad.
Clicking Start AutoPlay in the pop-up menue or long pressing the AutoPlay button begins the multi-turn AutoPlay. This will play your next turns as if you were an AI. = Zadan e Āğāz e Bāzi ye Ḵodkār dar fehrest yā negah dāštan e dokme ye ān, Bāzi ye Ḵodkār e čandnobati rā āğāz mikonad. Nobathāye ba'adi mānand e yek Hooš e Masnoo'i bāzi mišavand.
To cancel multi-turn AutoPlay you can press the AutoPlay button, next turn button or open the options menue. = Barāye lağv e Bāzi ye Ḵodkār e čandnobati mitavānid dokme ye ān, Nobat e ba'adi yā fehrest e tanzimāt rā bezanid.
Multi-turn AutoPlay is not advised on harder difficulty levels as your AI will not play better against an AI with modifiers. = Bāzi ye Ḵodkār e čandnobati dar darajehāye saḵttar tosiye nemišavad, čon Hooš e Masnoo'i ye šomā dar barābar e Hooš e Masnoo'i ye dārāye modifikator behtar bāzi nemikonad.
Multi-turn AutoPlay for multiplayer is not yet supported. = Bāzi ye Ḵodkār e čandnobati barāye čandnafare hanooz poštibāni nemišavad.

After building a shrine, your civilization will start generating ☮Faith. = Pas az sāḵt e Neyāyešgāh, tamaddon e šomā šoroo be tolid e ☮Imān mikonad.
When enough ☮Faith has been generated, you will be able to found a pantheon. = Bā tolid e ☮Imān e kāfi mitavānid yek panteon bonyangozari konid.
A pantheon will provide a small bonus for your civilization that will apply to all cities that have it as a majority religion. = Panteon emtiyāz e koočaki be tamaddon midahad ke dar hame ye šahrhāye dārāye ān be onvān e din e aksariyat ejrā mišavad.
Each civilization can only choose a single pantheon belief, and each pantheon can only be chosen once. = Har tamaddon fağat yek bāvar e panteon enteḵāb mikonad va har panteon fağat yek bār enteḵāb mišavad.
Generating more ☮Faith will allow you to found a religion. = Tolid e bištar e ☮Imān bonyangozari ye din rā momken mikonad.

Keep generating ☮Faith, and eventually a great prophet will be born in one of your cities. = Be tolid e ☮Imān edāme dahid tā saranjām Payāmbar e Bozorgi dar yeki az šahrhā motavalled šavad.
This great prophet can be used for multiple things: Constructing a holy site, founding a religion and spreading your religion. = In Payāmbar e Bozorg čand kārbord dārad: sāḵt e makān e moğaddas, bonyangozari ye din va gostareš e din.
When founding your religion, you may choose another two beliefs. The founder belief will only apply to you, while the follower belief will apply to all cities following your religion. = Hengām e bonyangozari ye din do bāvar e digar enteḵāb mikonid. Bāvar e bonyangozār fağat barāye šomāst va bāvar e peyro dar hame ye šahrhāye peyro ye din ejrā mišavad.
Additionally, the city where you used your great prophet will become the holy city of that religion. = Hamčenin šahri ke Payāmbar e Bozorg rā dar ān be kār bordid, Šahr e Moğaddas e ān din mišavad.
Once you have founded a religion, great prophets will keep being born every so often, though the amount of Faith☮ you have to save up will be higher. = Pas az bonyangozari ye din, Payāmbarān e Bozorg har az gāhi motavalled mišavand, amma meğdār e Imān☮ ke bāyad zaḵire konid bištar mišavad.
One of these great prophets can then be used to enhance your religion. = Mitavān yeki az in Payāmbarān e Bozorg rā barāye Tağviyat e din be kār bord.
This will allow you to choose another follower belief, as well as an enhancer belief, that only applies to you. = In kār ejāze midahad yek bāvar e peyro ye digar va yek bāvar e tağviyatkonande ke fağat barāye šomāst enteḵāb konid.
Do take care founding a religion soon, only about half the players in the game are able to found a religion! = Din rā zood bonyangozari konid; fağat hodood e nimi az bāzikonān mitavānand din bonyangozari konand!

Religion inside cities = Din daroon e šahr hā
When founding a city, it won't follow a religion immediately. = Šahr e tāze ba'd az bonyangozari fori peyro ye din nist.
The religion a city follows depends on the total pressure each religion has within the city. = Din e šahr be kol e fešār e har din dar ān šahr bastegi dārad.
Followers are allocated in the same proportions as these pressures, and these followers can be viewed in the City Screen. = Peyroān be nesbat e in fešārhā tağsim mišavand va mitavān ānhā rā dar safhe ye Šahr did.
You are allowed to check religious followers and pressures in cities you do not own by selecting them. = Bā enteḵāb e šahrhāye digarān niz mitavānid peyroān va fešārhāye dini rā barrasi konid.
In both places, a tap/click on the icon of a religion will show detailed information with its effects. = Dar har do jā, zadan e nemād e din ettelā'āt e kāmel va āthār e ān rā nešān midahad.
Based on this, you can get a feel for which religions have a lot of pressure built up in the city, and which have almost none. = Az in rāh mifahmid kodām din dar šahr fešār e ziyādi dārad va kodām tağriban hič fešāri nadārad.
The city follows a religion if a majority of its population follows that religion, and will only then receive the effects of Follower and Pantheon beliefs of that religion. = Agar aksariyat e jam'iyat peyro ye yek din bāšad, šahr peyro ye ān ast va fağat dar ān soorat āthār e bāvarhāye Peyro va Panteon e ān din rā migirad.

Spreading Religion = Gostareš e Din
Spreading religion happens naturally, but can be sped up using missionaries or great prophets. = Din be toor e tabi'i gostareš miyābad, amma Moballeğān yā Payāmbarān e Bozorg ān rā tondtar mikonand.
Missionaries can be bought in cities following a major religion, and will take the religion of that city. = Moballeğān rā mitavān dar šahrhāye peyro ye yek din e asli ḵarid va ānhā din e hamān šahr rā migirand.
So do take care where you are buying them! If another civilization has converted one of your cities to their religion, missionaries bought there will follow their religion. = Pas morāğeb e jāye ḵarid bāšid! Agar tamaddon e digar yeki az šahrhā rā be din e ḵod gardānde bāšad, moballeğ e ḵaridšode ānjā peyro ye din e ānhā ḵāhad bood.
Great prophets always have your religion when they appear, even if they are bought in cities following other religions, but captured great prophets do retain their original religion. = Payāmbarān e Bozorg hengām e peydāyeš hamiše din e šomā rā dārand, hatta agar dar šahri peyro ye din e digar ḵaride šavand; amma Payāmbarān e Bozorg e asiršode din e asli ye ḵod rā negah midārand.
Both great prophets and missionaries are able to spread religion to cities when they are inside its borders, even cities of other civilizations. = Har do, Payāmbar e Bozorg va Moballeğ, daroon e marz e šahr mitavānand din rā gostareš dahand, hatta dar šahr e tamaddon e digar.
These two units can even enter tiles of civilizations with whom you don't have an open borders agreement! = In do niroo hatta bedoon e tavāfoğ e maržāye bāz mitavānand vāred e zamin e tamaddonhāye digar šavand!
But do take care, missionaries will lose 250 religious strength each turn they end while in foreign lands. = Amma morāğeb bāšid: moballeğān dar har nobat ke dar ḵāk e bigāne pāyān dahand, 250 ğodrat e dini az dast midahand.
This diminishes their effectiveness when spreading religion, and if their religious strength ever reaches 0, they have lost their faith and disappear. = In kārāyi ye gostareš e din rā kam mikonad va agar ğodrat e dini be 0 beresad, Imān rā az dast dāde va nāpadid mišavand.
When you do spread your religion, the religious strength of the unit is added as pressure for that religion. = Hengām e gostareš e din, ğodrat e dini ye niroo be onvān e fešār e ān din ezāfe mišavad.
Cities also passively add pressure of their majority religion to nearby cities. = Šahrhā niz ḵod be ḵod fešār e din e aksariyat e ḵod rā be šahrhāye nazdik ezāfe mikonand.
Each city provides +6 pressure per turn to all cities within 10 tiles, though the exact amount of pressure depends on the game speed. = Har šahr har nobat +6 fešār be hame ye šahrhāye dar bord e 10 ḵāne midahad, amma meğdār e dağiğ be sor'at e bāzi bastegi dārad.
This pressure can also be seen in the City Screen, and gives you an idea of how religions in your cities will evolve if you don't do anything. = In fešār dar safhe ye Šahr ham didani ast va nešān midahad agar kāri nakonid din e šahrhā čegoone tağyir mikonad.
Holy cities also provide +30 pressure of the religion founded there to themselves, making it very difficult to effectively convert a holy city. = Šahrhāye Moğaddas be ḵod +30 fešār az din e bonyangozārišode dar ānjā midahand; pas tağyir e mo'asser e din e šahr e moğaddas besyār saḵt ast.
Lastly, before founding a religion, new cities you settle will start with 200 pressure for your pantheon. = Dar pāyān, piš az bonyangozari ye din, šahrhāye tāze bā 200 fešār barāye panteon e šomā āğāz mišavand.
This way, all your cities will starting following your pantheon as long as you haven't founded a religion yet. = Be in tartib tā piš az bonyangozari ye din, hame ye šahrhā peyro ye panteon ḵāhand šod.

Inquisitors = Bāzporsān e Ağidati
Inquisitors are the last religious unit, and their strength is removing other religions. = Bāzporsān e Ağidati āḵarin niroo ye dini hastand va tavānāyi ye ānhā hazf e adyān e digar ast.
They can remove all other religions from one of your own cities, removing any pressures built up. = Mitavānand hame ye adyān e digar va fešār e jam'šode ye ānhā rā az yeki az šahrhāye šomā hazf konand.
Great prophets also have this ability, and remove all other religions in the city when spreading their religion. = Payāmbarān e Bozorg hamin tavānāyi rā dārand va hengām e gostareš e din, hame ye adyān e digar e šahr rā hazf mikonand.
Often this results in the city immediately converting to their religion = In ağlab bā'es mišavad din e šahr fori be din e ānhā tağyir konad
Additionally, when an inquisitor is stationed in or directly next to a city center, units of other religions cannot spread their faith there, though natural spread is unaffected. = Hamčenin agar Bāzpors e Ağidati dar markaz e šahr yā dorost kenār e ān bāšad, niroohāye adyān e digar nemitavānand din rā ānjā gostareš dahand; amma gostareš e tabi'i tāsir nemigirad.

The Mayan unique ability, 'The Long Count', comes with a side effect: = Tavānāyi ye viže ye Māyā, «Šomāreš e Boland», yek āsar e jānebi dārad:
Once active, the game's year display will use mayan notation. = Pas az fa'āl šodan, namāyeš e sāl az raveš e Māyā estefāde mikonad.
The Maya measured time in days from what we would call 11th of August, 3114 BCE. A day is called K'in, 20 days are a Winal, 18 Winals are a Tun, 20 Tuns are a K'atun, 20 K'atuns are a B'ak'tun, 20 B'ak'tuns a Piktun, and so on. = Māyā zamān rā az roozi ke mā 11 e Oot e 3114 piš az milād mināmim be rooz mišomārd. Har rooz K'in ast; 20 rooz yek Winal, 18 Winal yek Tun, 20 Tun yek K'atun, 20 K'atun yek B'ak'tun, 20 B'ak'tun yek Piktun va be hamin tartib.
Unciv only displays ය B'ak'tuns, ඹ K'atuns and ම Tuns (from left to right) since that is enough to approximate gregorian calendar years. The Maya numerals are pretty obvious to understand. Have fun deciphering them! = Unciv fağat ය B'ak'tun, ඹ K'atun va ම Tun rā az čap be rāst nešān midahad, čon barāye taḵmin e sālhāye tağvim e milādi kāfi ast. Adadhā ye Māyā nesbatan rošan hastand. Az ramzgošāyi lezzat bebarid!

Your cities will periodically demand different luxury goods to satisfy their desire for new things in life. = Šahrhā har az gāhi kālā hāye tajammoli ye moḵtalef darḵāst mikonand tā niyāz be čižāye tāze dar zendegi rā bar āvarde konand.
If you manage to acquire the demanded luxury by trade, expansion, or conquest, the city will celebrate We Love The King Day for 20 turns. = Agar tajammoli ye darḵāstšode rā bā tejārat, gostareš yā fath peydā konid, šahr 20 nobat Rooz e Doosti ye Pādešāh rā jašn migirad.
During the We Love The King Day, the city will grow 25% faster. = Dar Rooz e Doosti ye Pādešāh, šahr 25% sari'tar rošd mikonad.
This means exploration and trade is important to grow your cities! = Pas kāvoš va tejārat barāye rošd e šahrhā mohem ast!

Air Combat and Interception = Nabard e Havāyi va Rahgiri
Air Combat is very similar to normal Combat, with a few wrinkles. Damage is still dealt using the same equations based on the relative Strength of the Attacking and Defending Unit. = Nabard e Havāyi besyār šabih e Nabard e mamooli ast, bā čand tafāvot. Āsib hamāna bā hamān mo'ādelehā bar pāye ye Ğodrat e nesbi ye Niroo ye Mohājem va Modāfe' hesāb mišavad.
However, before the Attacker and Defender fight, there is an added combat phase called Interception. If there is any unit with Interception Range that covers the target attacked tile, then it will attempt to Intercept the Attacking Air Unit. If multiple units can Intercept, the one with higher Intercept chance does it. = Amma piš az jang e Mohājem va Modāfe', marhale ye ezāfi ye Rahgiri vojood dārad. Agar nirooyi bord e rahgiri ye poošānande ye zamin e hadaf dāšte bāšad, talāš mikonad Niroo ye Havāyi ye Mohājem rā Rahgiri konad. Agar čand niroo betavānand rahgiri konand, niroo ye bā šāns e bištar in kār rā mikonad.
Generally Land/Naval Units have an Intercept Range of 2 Tiles, and Air Units have an Intercept Range of their Attack Range. = Mamoolan Niroohāye Zamini/Daryāyi bord e rahgiri ye 2 ḵāne dārand va bord e rahgiri ye Niroo ye Havāyi barābar bā bord e Hamle ye ān ast.
Ground and Naval Units don't require movement points to Intercept, just Attacks. Air Units cannot have moved nor attacked in the preceding turn. = Niroohāye Zamini va Daryāyi barāye Rahgiri be emtiyāz e harekat niyāz nadārand, fağat be Hamle. Niroohāye Havāyi nabāyad dar nobat e ğabl harekat yā hamle karde bāšand.
The Intercepting Unit rolls to see if it hits. Whether it hits or not costs an Attack, and most units (without Promotions) can only Attack Once per Nation's Turn. It does NOT cost Movement Points, but Air Units that have used their Movement cannot Intercept between turns. = Niroo ye Rahgir šāns e barḵord rā miāzmāyad. Če bezanad če na, yek Hamle masraf mišavad va bištar e niroohā bedoon e Erteğā dar har Nobat e Kešvar fağat yek bār Hamle mikonand. Emtiyāz e Harekat masraf NEMIŠAVAD, amma Niroo ye Havāyi ke harekat karde nemitavānad beyne nobathā Rahgiri konad.
If the Intercepting Unit Hits, it deals damage according to the Combat Strength calculation to the Attacking Air Unit, potentially with any Strength Bonuses that apply to Interception. It does not receive damage from the Attacking Air Unit. = Agar Rahgir bezanad, bar pāye ye hesāb e Ğodrat e Nabard va emtiyāžāye marboot be Rahgiri, be Niroo ye Havāyi ye Mohājem āsib mizanad. Az Niroo ye Havāyi ye Mohājem āsib nemigirad.
After Interception resolves, the Attacking Air Unit and the Defending Unit in the targeted tile do Combat as normal, with damage dealt to both sides. = Pas az Rahgiri, Niroo ye Havāyi ye Mohājem va Niroo ye Modāfe' dar zamin e hadaf mamooli mijangand va har do āsib mibinand.
To help deal with Interceptions, see Air Sweeps. = Barāye moğābele bā Rahgiri, Pāksāzi ye Havāyi rā bebinid.

Air Sweeps = Pāksāzi ye Havāyi
Fighter units are able to perform Air Sweeps over a tile helping clear out potential enemy Air, Sea, or Land Interceptions that can reach that tile. = Niroohāye Jangande mitavānand rooye yek zamin Pāksāzi ye Havāyi konand tā Rahgiri ye havāyi, daryāyi yā zamini ye ehtemāli ye došman ke be ān zamin miresad masraf šavad.
While this Action will take an Attack, the benefit is drawing out Interceptions to help protect your other Air Units. Especially your Bombers. = In kār yek Hamle masraf mikonad, amma Rahgirihā rā biroon mikešad tā az Niroohāye Havāyi ye digar, be viže Bombafkanhā, hefāzat konad.
Your unit will always draw an Interception, if one can reach the target tile, even if the Intercepting unit has a chance to miss. = Agar Rahgiri be zamin e hadaf beresad, niroo ye šomā hamiše ān rā fa'āl mikonad, hatta agar Rahgir šāns e ḵatā dāšte bāšad.
If the Interceptor is not an Air Unit (eg Land or Sea), the Air Sweeping unit and Interceptor take no damage! = Agar Rahgir Niroo ye Havāyi nabāšad, masalan Zamini yā Daryāyi, hič yek az Rahgir va niroo ye Pāksāzi āsib nemibinand!
If the Interceptor is an Air Unit, the two units will damage each other in a straight fight with no Interception bonuses. And only the Attacking Air Sweep Unit gets any Air Sweep strength bonuses. = Agar Rahgir Niroo ye Havāyi bāšad, har do dar nabard e mostağim bedoon e emtiyāžāye Rahgiri be ham āsib mizanand. Fağat niroo ye Mohājem e Pāksāzi emtiyāžāye ğodrat e Pāksāzi rā migirad.

Fortify, Guard, Withdraw = Sangargiri, Negahbāni, Ağabnešini
Most Land units have the ability to Fortify. As they spend time without moving, they will slowly gain a Fortification Bonus to their Combat Strength representing digging in and preparing in case of an attack. = Bištar e niroohāye Zamini mitavānand Sangar begirand. Bā gozarāndan e zamān bedoon e harekat, āheste Emtiyāz e Sangar be Ğodrat e Nabard migirand; ya'ni kandan e sangar va āmāde šodan barāye hamle.
Some units have the ability to Withdraw before a melee attack is struck. However, perhaps you wish for them to stand their ground to protect a particular tile. If you do, then give them the Guard command and they will stay fixed until they die or you give them fresh orders. = Barḵi niroohā piš az hamle ye nazdik mitavānand Ağabnešini konand. Amma šāyad miḵāhid barāye hefāzat az zamin istādegi konand. Pas dastoor e Negahbāni bedahid tā tā marg yā dastoor e tāze dar jā bemānand.
This is NOT the same as Fortify but they will still gain the Fortification Bonus. They will simply not utilize their Withdraw ability. Fortified units with the Withdraw ability will try to flee when attacked. = In bā Sangargiri yeki NIST, amma hanooz Emtiyāz e Sangar migirand. Fağat tavānāyi ye Ağabnešini rā be kār nemibarand. Niroo ye sangargerefte ye dārāye Ağabnešini hengām e hamle talāš e farār mikonad.

City Tile Blockade = Mohāsere ye Zamin e Šahr
One of your tiles is blocked by an enemy: when an enemy unit stands on a tile you own, the tile will not produce yields and cannot be worked by a city this turn. City will reallocate population from a blocked tile automatically. = Yeki az zaminhā bā došman masdood ast: vağti niroo ye došman rooye zamin e šomā biistad, ān zamin in nobat bāzdehi nadārad va šahr nemitavānad rooyaš kār konad. Šahr jam'iyat rā az zamin e baste ḵodkār dobāre taḵsis midahad.
Enemy military land units block tiles they are standing on. Enemy military naval units additionally block adjacent water tiles. To protect your tiles from blockade, place a friendly military unit on it or fight off invaders. = Niroo ye nezāmi ye zamini ye došman zamin e zir e pā rā masdood mikonad. Niroo ye nezāmi ye daryāyi hamčenin zaminhāye ābi ye hamsāye rā mibandad. Barāye jologiri az mohāsere, niroo ye nezāmi ye doost rooye zamin begozārid yā mohājemān rā berānid.

One of your cities is under a naval blockade! When all adjacent water tiles of a coastal city are blocked - city loses harbor connection to all other cities, including capital. Make sure to de-blockade cities by deploying friendly military naval units to fight off invaders. = Yeki az šahrhāye šomā dar Mohāsere ye Daryāyi ast! Agar hame ye zaminhāye ābi ye hamsāye ye šahr e sāheli masdood bāšand, šahr ertebāt e Bandari bā hame ye šahrhā, hatta pāytaḵt, rā az dast midahad. Bā niroohāye nezāmi ye daryāyi ye doost, mohājemān rā berānid va mohāsere rā beškanid.

Spies! = Jāsoos hā!
The first time a civ reaches the Renaissance era each nation gets one spy. Every time a civ reaches an era afterwards they get one more spy. = Har tamaddoni ke barāye avvalin bār be asre ronesāns beresad yek jāsoos be har mellat ezāfe mišavad. Har bār tamaddoni be asre ba’di beresad ānhā yek jāsoose digar migirand.
Spies can be sent out to foreign cities to steal technology, rigging elections or stage coups. Place them in your own cities to do counter-intelligence work. = Jāsoošā rā mitavān barāye dozdidan e fannāvari, tağallob e enteḵābāt yā koodetā be šahrhāye bigāne ferestād. Dar šahrhāye ḵod barāye zedd e jāsoosi be kār bebarid.
Only one spy per civ is allowed in each city. Spies that are not in any city are on vacation in your spy hideout. = Az har tamaddon dar har šahr fağat yek jāsoos mojāz ast. Jāsoos e bi-šahr dar panāhgāh e jāsoosi be moraḵḵasi miravad.
Spies set up in cities of major civilizations will try to steal technology at a rate which is based off of the science production in the city. Succeeding to steal technology will level up your spy. Failing to succeed will level up the defending spy if it is present. = Jāsoos e mostağar dar šahr e tamaddon e bozorg bā sor'ati bar pāye ye Tolid e Elm e šahr, fannāvari midozdad. Movaffağiyat dar dozdidan, sat'h e jāsoos rā bālā mibarad. Šekast, sat'h e jāsoos e modāfe' rā agar bāšad bālā mibarad.
Spies set in city-states will try to rig the elections in order to gain influence and reduce the influence of other civilizations. Only one spy partaking in rigging the election can win. = Jāsoos e dar Šahr-dowlat barāye kasb e nofooz va kāheš e nofooz e tamaddonhāye digar, enteḵābāt rā dastkāri mikonad. Fağat yek jāsoos e šerkatkonande mitavānad barande šavad.
A spy that is rigging an election in a city-state may also stage a coup. The likelihood of success for the coup depends on your relative influence to the current ally of the city-state, your spy level, and the level of the spy that the current ally has in the city-state if present. Succeeding a coup will make you their new ally and reduce the influence of all other civs. Failing a coup will kill your spy and level up the defending spy if present. = Jāsoos e dastkār e enteḵābāt dar Šahr-dowlat mitavānad koodetā ham konad. Šāns e movaffağiyat be nofooz e šomā nesbat be mottahed e fe'li, sat'h e jāsoos e šomā va sat'h e jāsoos e mottahed e fe'li dar ān šahr agar vojood dāšte bāšad bastegi dārad. Koodetā ye movaffağ šomā rā mottahed e jadid mikonad va nofooz e hame ye digarān rā kam mikonad. Šekast, jāsoos e šomā rā mikošad va jāsoos e modāfe' rā agar bāšad erteğā midahad.
Spies that are set up in your own cities will be conducting counter-intelligence. They reduce the success chance of other spies trying to steal your technology. = Jāsoošā dar šahrhāye ḵod zedd e jāsoosi mikonand. Šāns e movaffağiyat e jāsoošāye dozd e fannāvari rā kam mikonand.
Spies at a higher rank have a higher chance of success. The max rank a spy can reach is rank 3. After a spy is killed it will revive after a certain amount of turns back at rank 1. = Jāsoos e dāraye rotbe ye bālātar šāns e movaffağiyat e bištari dārad. Bālātarin rotbe 3 ast. Pas az marg, jāsoos ba'd az tedādi nobat bā rotbe ye 1 dobāre barmigardad.
Building buildings like the constabulary and police station will reduce the technology steal rate of spies in that city. = Sāḵtemānhāyi mānand e Žāndārmeri va Kalāntari sor'at e dozdidan e fannāvari dar ān šahr rā kam mikonand.
Espionage is available using the Gods and Kings ruleset. To enable it in a new game click advanced settings, then click on the Enable Espionage option. = Jāsoosi dar ğavānin e Ḵodāyān va Pādešāhān mojood ast. Barāye fa'āl kardan dar bāzi ye tāze, tanzimāt e pišrafte va sepas Fa'ālsāzi ye Jāsoosi rā bezanid.

Keyboard Bindings = Taḵsišāye Safhekelid
Limitations = Mahdoodiyat hā
 # Requires translation!
This is a work in progress. = In dar hāl e sāḵt ast.
For technical reasons, only direct keys or Ctrl-Letter combinations can be used. = Be dalil e fanni, fağat kelidhāye mostağim yā tarkib e Ctrl-Harf ğābel e estefāde hastand.
Using the Keys page = Estefāde az safhe ye Kelidhā
Each binding has a button with an image looking like this: = Har taḵsis dokme i bā tasviri šabih e in dārad:
While hovering the mouse over the key button, you can press a desired key directly to assign it. = Hengāmi ke moošvāre rooye dokme ye kelid ast, kelid e delḵāh rā mostağiman bezanid tā taḵsis yābad.
Double-click the image to reset the binding to default. = Barāye bāzgardāni be pišfarz, rooye tasvir do bār bezanid.
Bindings mapped to their default keys are displayed in gray, those reassigned by you in white. = Taḵsišāye pišfarz ḵākestari hastand va taḵsišāye tağyirdāde šode sefid.
Conflicting assignments are marked red. Conflicts can exist across categories, like World Screen / Unit Actions. Note that at the moment, the game does not prevent saving conflicting assignments, though the result may be unexpected. = Taḵsišāye mota'ārez sorḵ hastand. Ta'aroz mitavānad beyne dastehā, mānand e Safhe ye Jahān / Amaliyyat e Niroo, bāšad. Bāzi fe'lan az zaḵire ye ta'aroz jologiri nemikonad, har čand natije šāyad nāḵāste bāšad.
For discussion about missing entries, see the linked github issue. = Barāye goftegoo dar bāre ye mavāred e jāoftāde, mas'ale ye Github e peyvandšode rā bebinid.

Welcome to the Civilopedia! = Be Tamaddon-nāme ḵoš āmadid!
Here you can find information - general help, rules, and what makes up the game world. = Injā ettelā'āt, rāhnamā ye omoomi, ğavānin va sāzandehāye jahān e bāzi rā miyābid.
How to find information = Čegoone ettelā’āt rā peydā konim
Select categories with the buttons on top of the screen. Also up there is the button to leave Civilopedia and go back to where you were before. = Bā dokmehāye bālā ye safhe dastehā rā enteḵāb konid. Dokme ye tark e Tamaddon-nāme va bargašt be jāye ğabli hamānjāst.
Each category has a list of entries on the left of the screen, sorted alphabetically (with few exceptions). Clicking an entry will update the center pane were you are currently reading this. = Har daste dar čap fehresti az madḵalhā be tartib e alefbā dārad, bā čand estesnā. Zadan e madḵal, panjare ye markazi rā ke halā miḵānid be rooz mikonad.
Lines can link to other Civilopedia entries, they are marked with a chain link symbol like this one. You can click anywhere on the line to follow the link. = Satrhā mitavānand be madḵalhāye digar e Tamaddon-nāme peyvand dāšte bāšand; nemād e zanjir ānhā rā mošaḵḵas mikonad. Har jāye satr rā bezanid tā peyvand rā donbāl konid.
The current category is special - all articles on general concepts are here. It is called 'Tutorials' because you can revisit these here, too. = Daste ye fe'li viže ast: hame ye mağālehāye mafāhim e omoomi injāst. «Āmoozeš» nām dārad čon mitavānid āmoozešhā rā niz dobāre injā bebinid.
What information can I find = Če ettelā’āti rā mitavānam peydā konam
The data shown is not dependent on your current game's situation, e.g. bonuses for the nation you are playing or difficulty modifiers will not affect the numbers. = Dādehāye namāyešdāde šode be vaz'iyat e bāzi ye fe'li bastegi nadārand; masalan emtiyāz e kešvar e šomā yā modifikator e došvāri adadhā rā tağyir nemidahad.
However, it will reflect the mods you are playing! The combination of base ruleset and extension mods you select define the rules of a game, what objects exist and how they interact, and the Civilopedia mirrors these rules. = Amma modhāye šomā rā bāztāb midahad! Tarkib e ğavānin e pāye va modhāye gostareš ke enteḵāb mikonid, ğavānin, mojoodiyat e ašyā va raveš e ta'āmol e ānhā rā ta'yin mikonad; Tamaddon-nāme in ğavānin rā nešān midahad.
If you opened the Civilopedia from the main menu, the "Ruleset" will be that of the last game you started. = Agar Tamaddon-nāme rā az fehrest e asli bāz konid, «Majmoo'e ye ğavānin» az āḵarin bāzi ye āğāzšode ḵāhad bood.
Letters can select categories, and when there are multiple categories matching the same letter, you can press that repeatedly to cycle between these. = Harfhā dastehā rā enteḵāb mikonand; agar čand daste bā yek harf šoroo šavand, ān harf rā tekrar konid tā beyne ānhā begardid.
The arrow keys allow navigation as well - left/right for categories, up/down for entries. = Kelidhāye peykān ham barāye peymāyeš hastand: čap/rāst barāye dastehā va bālā/pāyin barāye madḵalhā.

UI Tips = Nekāte Vāset
World screen = Safhe ye jahān
Skip all units to end a turn quickly = Barāye pāyān e sari' e nobat, hame ye niroohā rā rad konid
Right-click or long press the "Next unit" button to open a popup menu which allows to end a turn without having to cycle through all units. If some units are automated, a dedicated button is available to move them before ending the turn. = Rooye dokme ye «Niroo ye ba'adi» rāstklik yā negah dārid tā fehreste pāyān e nobat bedoon e gardeš dar hame ye niroohā bāz šavad. Agar nirooyi ḵodkār ast, dokme ye viže i barāye harekat e ānhā piš az pāyān vojood dārad.
Toggle notification list display = Tağyir e namāyeš e fehrest e e'lānhā
On the World screen, swipe the notification list to the right to temporarily hide it. Click the "Bell" button to display them again. = Dar Safhe ye Jahān, fehrest e e'lānhā rā be rāst bekešid tā movağat penhān šavad. Dokme ye «Zang» rā barāye namāyeš e dobāre bezanid.
The default state for the notification list can be set in Options > Display > UI - Notifications on world screen. = Vaz'iyat e pišfarz e fehrest e e'lānhā rā dar Tanzimāt > Namāyeš > Vāset - E'lānhāye safhe ye jahān ta'yin konid.
Entering a City Screen quickly = Vorood e sari' be safhe ye Šahr
You can Right-click or long press a city button on the World screen. The result is the same as tapping it twice - once to select and move the button, again to trigger a reaction: show the City Screen (if the city is yours to inspect), or offer the foreign city info popup. = Mitavānid dar Safhe ye Jahān rooye dokme ye šahr rāstklik yā negah dārid. Mānand e do bār zadan ast: avval enteḵāb va jābejāyi ye dokme, sepas vākoneš: safhe ye Šahr agar šahr barāye barrasi az ān e šomā ast, yā panjare ye ettelā'āt e šahr e bigāne.
Upgrade multiple units of the same type = Erteğā ye čand niroo az yek noe
On the World screen, select a unit that can be upgraded, then right-click or long press the "Upgrade" button to open a popup menu allowing to upgrade all units of this type at once. = Dar Safhe ye Jahān, niroo ye ğābel e erteğā rā enteḵāb va dokme ye «Erteğā» rā rāstklik yā negah dārid tā fehrest e erteğā ye hame ye niroohāye hamnoe yekja bāz šavad.
In the Units overview, the same upgrade menu is available by clicking the unit icon in the "Upgrade" column. When a unit is upgradeable, the icon is lit if conditions are met (enough gold and/or resources), otherwise it is dimmed. = Dar moroor e Niroohā, zadan e nemād e niroo dar sotoon e «Erteğā» hamān fehrest rā midahad. Agar niroo ğābel e erteğā va šarāyet, Talā va/yā manābe ye kāfi, mohayyā bāšad nemād rošan ast, vagarna kamrang ast.
Additional controls for the construction queue = Kontrolhāye bištar e saf e sāḵt
Right-click or long press a construction item to open a popup menu with additional controls, allowing to manage production of the same item in all cities, by issuing the commands from the same City Screen. = Rooye yek mored e sāḵt rāstklik yā negah dārid tā fehrest e kontrolhāye bištar bāz šavad; az hamān safhe ye Šahr mitavānid Tolid e ān mored dar hame ye šahrhā rā modiriyat konid.
The "Disable" option (in a single city or all cities) moves an item to a separated "Disabled" tab, to prevent its automatic queueing by the "Auto-assign city production" option or to remove irrelevant objects from the production planning. To move a disabled item back to its initial place, re-enter its popup menu, and choose "Enable". = Gozine ye «Ğeyrefa'āl» dar yek yā hame ye šahrhā, mored rā be zabāne ye jodā ye «Ğeyrefa'āl» mibarad tā «Taḵsis e ḵodkār e Tolid e šahr» ān rā ḵodkār be saf nagozārad yā ašyā ye nāmarboot az barnamerizi ye Tolid hazf šavand. Barāye bargašt be jāye asli, fehrest e ān rā dobāre bāz va «Fa'āl» rā enteḵāb konid.
Disabled items are set for the current game only and are carried over when founding a new city. = Mav āred e ğeyrefa'āl fağat barāye bāzi ye fe'li hastand va be šahr e tāze niz montağel mišavand.
Show Great Person Points breakdown = Namāyeš e joziyāt e Emtiyāz e Fard e Bozorg
In the right sidepanel, click a Great People row to display the details of Great Person Points (GPP) accumulated each turn by the current city, for this type of Great People. = Dar panjare ye rāst, rooye satr e Fardhāye Bozorg bezanid tā joziyāt e Emtiyāz e Fard e Bozorg (GPP) e jam'šode dar har nobat e šahr e fe'li barāye ān noe nešān dāde šavad.
Click any of the Great People icons to display all GPP accumulated each turn by the current city, for all types of Great People. = Rooye har nemād e Fardhāye Bozorg bezanid tā hame ye GPP e jam'šode dar har nobat e šahr barāye hame ye anvā' nešān dāde šavad.
Tech screen = Safhe ye Fannāvari
Queue multiple technologies in different branches = Gozāštan e čand fannāvari dar saf az šāḵehāye moḵtalef
On the Tech screen, right-click or long press a technology to automatically queue it, even if this tech is in another branch than the item currently researched. Prerequisite techs to research will also be automatically queued. = Dar safhe ye Fannāvari, rooye fannāvari rāstklik yā negah dārid tā ḵodkār be saf beravad, hatta agar dar šāḵe ye digari az fannāvari ye fe'li bāšad. Fannāvarihāye pišniyāz niz ḵodkār be saf miravand.
Right-click or long press multiple techs to append them to the research queue, whatever their branch is. = Rooye čand fannāvari rāstklik yā negah dārid tā bedoon e tavajjoh be šāḵe, be saf e pažooheš ezāfe šavand.
Overview screens = Safhehāye Moroor
Reveal known resources on world screen = Āškār kardan e manābe e šenāḵte dar safhe ye jahān
In the Resources overview, click on a resource icon to center the world screen on tiles already discovered and providing this resource. = Dar moroor e Manābe, nemād e manba' rā bezanid tā safhe ye jahān rooye zaminhāye āškār va ta'minkonande ye ān manba' markaz šavad.
Alternatively, click on the "Unimproved" number to center the world screen only on owned (by you or your allied City-states) tiles where the resource is not improved. = Yā adad e «Behsāzinašode» rā bezanid tā safhe fağat rooye zaminhāye šomā yā Šahr-dowlathāye mottahed ke manba' behsāzi našode markaz šavad.
If more than one tile is available, click repeatedly on the notification to cycle through all of them. = Agar biš az yek zamin ast, e'lān rā tekrar bezanid tā beyne hame begardid.
Show diagram line colors = Namāyeš e rang e ḵotoot e nemoodār
In Politics overview > Show diagram, you can click anywhere inside the diagram to display a table listing all relationship line colors and their meaning. = Dar moroor e Siyāsat > Namāyeš e nemoodār, har jāye nemoodār rā bezanid tā jadval e rang e hame ye ḵotoot e ravābet va ma'nā ye ānhā bāz šavad.
Reading "Toast" popups = Ḵāndan e payāmhāye gozarā
"Toasts" can be clicked to make them stay on the screen for easier reading. = Payāmhāye gozarā rā mitavān zad tā barāye ḵāndan e āsāntar rooye safhe bemānand.
Click it again to close (or use the close button). = Barāye bastan dobāre bezanid yā dokme ye bastan rā estefāde konid.
Miscellaneous = Goonāgoon
External links = Peyvandhāye birooni
External links support right-click or long press to copy the link to the clipboard instead of launching the browser. = Peyvandhāye birooni bā rāstklik yā negah dāštan, be jāye bāz kardan e moroorgar, dar hāfeze ye movağat kopi mišavand.
Example: The 'Open Github page' button on the Mod management screen. = Mesāl: dokme ye «Bāz kardan e safhe ye Github» dar safhe ye modiriyat e Mod.
View change log = Didan e fehrest e tağyirāt
After updating, you might want to see what has changed. The "About" in "Options" has the version number linked to the change log. You can also see that info by clicking the version number on the main menu. = Pas az be roozresāni šāyad beḵāhid tağyirāt rā bebinid. Dar «Dar bāre» ye «Tanzimāt», šomāre ye nosḵe be fehrest e tağyirāt peyvand dārad. Bā zadan e šomāre ye nosḵe dar fehrest e asli hamin ettelā'āt rā mibinid.

Differences from Civilization V = Tafāvothāye bā Civilization V
Production Focus\nIn Civilization V, the Food yield in a city is calculated first, then population grows by consuming stored food (growth), then production is calculated, and so on one by one the other stats are calculated. Thus, citizens can produce yields in the same turn as they are born. The city focus is set to Production to assign the newborn citizen to a hill so they'll contribute Production, and then manually reassigned to a growth tile on the next turn. Alternatively, you can set city focus to Gold (e.g. with Cerro de Potosi), Faith (e.g. with Mount Sinai) or whatever gains the most yields. In Unciv, citizens only start producing yields on the next turn, so you can ignore this whole concept. = Tamarkoz e Tolid\nDar Civilization V, avval bāzdehi ye Ğazā hesāb mišavad, sepas jam'iyat bā masraf e ğazā ye zaḵire rošd mikonad, sepas Tolid va ba'd sāyer e āmār yeki yeki hesāb mišavand. Pas šahrvand dar hamān nobat e tavallod mitavānad bāzdehi tolid konad. Tamarkoz e šahr rā rooye Tolid migozārand tā šahrvand e tāze rooye tappe Tolid bedahad va nobat e ba'ad dasti be zamin e rošd montağel mikonand. Yā mitavān tamarkoz rā rooye Talā, masalan bā Cerro de Potosi, Imān, masalan bā Kooh e Sinā, yā har čiz e dārāye bištarin bāzdehi gozāšt. Dar Unciv, šahrvand fağat az nobat e ba'ad tolid mikonad; pas in mafhoom rā mitavānid nādide begirid.
Science Queueing\nIn Civilization V, Science yield is calculated after production, so if you finish an item and have Science (or Gold) queued as a perpetual construction, the Production overflow from item will be converted into Science (or Gold), but the Production is not consumed, as this will only happen again on the next turn. By immediately swapping out your perpetual construction for an item on the next turn, you'll get this Science (or Gold) for free. This doesn't apply to Unciv, so don't bother. = Saf e Elm\nDar Civilization V, bāzdehi ye Elm pas az Tolid hesāb mišavad. Agar yek mored rā tamām konid va Elm yā Talā be onvān e sāḵt e dāyemi dar saf bāšad, Tolid e māzād be Elm yā Talā tabdil mišavad amma masraf nemišavad, čon in kār nobat e ba'ad dobāre roḵ midahad. Bā tağyir e fori ye sāḵt e dāyemi be yek mored dar nobat e ba'ad, in Elm yā Talā rā rāygān migirid. Dar Unciv čenin nist; pas talāš nakonid.
Double Aqueducts\nIn Civilization V, the game sells existing copies of the building for you before providing a free copy of the building. So, if you build an aqueduct in a city, and then in the turn of adopting Tradition Complete you sell a cheap building (e.g a shrine) beforehand, the game is unable to sell more than 1 building per turn, and thus you'll keep your aqueduct, together with the new free aqueduct. Not applicable to Unciv. = Ābrooye Dogān e\nDar Civilization V, bāzi piš az dādan e nosḵe ye rāygān e sāḵtemān, nosḵehāye mojood rā miforoošad. Agar dar šahr Ābroo besāzid va dar nobat e Takmil e Sonnat, ğabl az ān yek sāḵtemān e arzān mānand e Neyāyešgāh beforoošid, bāzi čon biš az 1 sāḵtemān dar nobat nemiforoošad, Ābrooye šomā rā negah midārad va Ābrooye rāygān ham ezāfe mišavad. Dar Unciv kār nemikonad.
Legalism Oxford\nIn Civilization V, national wonders such as Oxford University are considered culture buildings, so you can get them for free with Legalism. Not applicable to Unciv. = Āksford e Ğānoongerāyi\nDar Civilization V, ojoobehāye melli mānand e Dānešgāh e Āksford sāḵtemān e farhangi hesāb mišavand; pas bā Ğānoongerāyi mitavān rāygān gereft. Dar Unciv kār nemikonad.
Roads and Forts\nIn Civilization V, you can't use roads and forts in enemy territory. In Unciv, you can use them, so instead of mindlessly constructing them everywhere when at war, you need to decide if and when they'll benefit you more than your opponents. = Jāddehā va Dežhā\nDar Civilization V nemitavānid az jādde va dež e ḵāk e došman estefāde konid. Dar Unciv mitavānid; pas be jāye sāḵt e bi fekr e ānhā dar hame jā dar jang, bāyad tasmim begirid āyā va če zamān barāye šomā bištar az došman sood dārand.
Citizen Conversion\nIn Civilization V, a citizen is born religious if the parent city is already converted. This is not the case in Unciv, which can lead to temporary deconversion of a city when it grows. = Tağyir e Din e Šahrvand\nDar Civilization V, agar šahr tağyir e din dāde bāšad šahrvand e tāze dini motavalled mišavad. Dar Unciv čenin nist va rošd mitavānad movağat aksariyat e dini ye šahr rā az beyn bebarad.
Unassigned Citizens\nIn Civilization V, unassigned citizens are considered specialists, and subject to the same type of bonuses (e.g. Korea's ability). It can be worthwhile to leave citizens unassigned, instead of being assigned to a tile. Not applicable to Unciv. = Šahrvandān e Bi-taḵsis\nDar Civilization V, šahrvand e bi-taḵsis Moteḵasses ast va hamān emtiyāžā, mānand e tavānāyi ye Kore, rā migirad. Šāyad behtar bāšad be jāye taḵsis be zamin, bi-taḵsis bemānad. Dar Unciv kār nemikonad.
Settler Construction\nIn Civilization V, cities can't starve when constructing settlers, so you can assign all citizens to production tiles and none to food tiles. In Unciv, citizens keep consuming two food per turn. = Sāḵt e Šahraknešin\nDar Civilization V, šahr hengām e sāḵt e Šahraknešin nemitavānad gorosne šavad; pas hame ye šahrvandān rā mitavān be Tolid va hič kas rā be Ğazā taḵsis dād. Dar Unciv, šahrvandān hamčenān har nobat do Ğazā masraf mikonand.
Water Melee Attack\nAs result of a Discord poll, Water Melee units can attack military land units on the shore, unlike in Civilization V. = Hamle ye Nazdik e Ābi\nBar pāye ye nazarsanji ye Discord, Niroohāye Nazdikzan e Ābi mitavānand be niroohāye nezāmi ye zamini dar sāhel hamle konand; bar ḵalāf e Civilization V.
Tile improvements\nIn Civilzation V, workers start working on an improvement-under-construction at the beginning of movement. Unciv changes this, to allow players to assign workers to tiles, and then reconsider and change improvement or move them elsewhere. = Behsāzi ye Zamin\nDar Civilization V, kāregar hengām e āğāz e harekat rooye behsāzi ye dar dast e sāḵt kār mikonad. Unciv in rā avaz karde tā bāzikon kāregar rā be zamin befrestad va sepas betavānad tağyir e nazar dahad, behsāzi rā avaz konad yā oo rā be jāye digar bebarad.
Forest and Jungle Visibility\nIn Unciv, forests and jungles are visible 1 tile outside visibility range. In Civilization V, this is the behaviour of hills and mountains, but not of forests and jungles, yet jungle and forest can block hills, and hill + forest can block mountain, indicating they're on the same elevation. This is considered to be a bug in the otherwise well-structured visibility logic in Civilization V. = Did e Jangal va Jangal e Hārre\nDar Unciv, jangal va jangal e hārre 1 ḵāne biroon az bord e did ham didani hastand. Dar Civilization V in raftār e tappe va kooh ast, na jangalhā; amma jangal mitavānad tappe va tappe + jangal mitavānad kooh rā bepoošānad, ya'ni dar hamān ertefā' hastand. In rā ḵatāyi dar manteğ e dar ğeyr e in mored monazzam e did e Civilization V midānand.
City razing\nIn Civilization V, the player can never raze any of the cities he/she founded. Not applicable to Unciv. = Virānsāzi ye Šahr\nDar Civilization V, bāzikon hargez nemitavānad šahri rā ke ḵod sāḵte virān konad. Dar Unciv čenin mahdoodiyati nist.

Founding Cities\nThe Settler is a unit that can found a new city. You can build a Settler unit in a city with at least 2 population, and then move them to a good location to found a new city. This will usually be your main way of acquiring more cities. = Bonyangozari ye Šahr\nŠahraknešin nirooyi ast ke mitavānad šahr e jadid besāzad. Dar šahri bā hadd ağal 2 jam'iyat yek Šahraknešin besāzid va oo rā be makān e ḵoob bebarid tā šahr e tāze besāzad. In mamoolan rāh e asli ye dāštan e šahrhāye bištar ast.
Food conversion to Production\nDuring the construction of a Settler, the city will not grow. Instead, the 1st, 2nd, 4th, and from there on every 4th, excess Food (Growth) is converted into Production, with the rest of the excess Food being lost. = Tabdil e Ğazā be Tolid\nDar tool e sāḵt e Šahraknešin, šahr rošd nemikonad. Be jāye ān, Ğazā ye ezāfi ye 1om, 2om, 4om va pas az ān har 4omin Ğazā ye ezāfi be Tolid tabdil mišavad va bağiye az dast miravad.

