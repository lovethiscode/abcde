'Any man who can drive safely while kissing a pretty girl is simply not giving the kiss the attention it deserves.' - Albert Einstein = «Har mardi ke dar hāl e boosidan e doḵtari zibā betavānad bā imeni rānandegi konad, be sādegi be boose tavajjoh e šāyeste nemikonad.» - Albert Einstein
