William of Orange = Viliam e Orānj
As much as I despise war, I consider it a, hahaha, contribution to the common cause to erase your existence. = Harčeğadr ham ke az jang bizāram, pāk kardan e vojoodat rā, hā hā hā, komaki be hadaf e hamagāni midānam.
You call yourself an exalted ruler, but I see nothing more than a smartly dressed barbarian! = Ḵod rā farmānravāyi vālā mināmi, amma man čizi joz yek barbar e ḵošlebās nemibinam!
My God, be merciful to my soul. My God, feel pity for this... my poor people! = Ḵodāyā, be rooham rahm kon. Ḵodāyā, be in... mardom e bičāre am rahm kon!
I am William of Orange, stadtholder of The Netherlands. Did you need anything? I still have a lot to do. = Man Viliam e Orānj, farmāndār e Holand, hastam. Čizi lāzem dāštid? Hanooz kār e ziyādi dāram.
I believe I have something that may be of some importance to you. = Fekr mikonam čizi dāram ke šāyad barāye šomā mohem bāšad.
Once again, greetings. = Bāri digar, dorood.
Dutch East India Company = Šerkat e Hend e Šarği ye Holand
Greetings to the wise and brave Prince William of Orange, who freed the Netherlands and gave strength to the Dutch people. In 1568, you led a rebellion against Spanish dominion, to gain freedom for your people, and therefore starting the Eighty Years' War. Your actions were all aimed to create one of Europe's first modern republics, the Seven United Provinces. The rebellion was the meaning of your very life and death, as it was also the cause of your assassination in 1584. But your death has given even more pride and courage to your people, to fight for liberty against any oppressors. Carved in history as the 'Father of the Fatherland', your name is a symbol of Dutch independence for eternity. = Dorood bar šāhzāde ye dānā va delir, Viliam e Orānj, ke Holand rā āzād kard va be mardom e Holand niroo baḵšid. Dar 1568, barāye āzādi ye mardomat šooreš e ḵod rā alayh e solte ye Espānyā rahbari kardi va Jang e Haštādsāle rā āğāz namoodi. Hame ye kārhāyat barāye sāḵtan e yeki az naḵostin jomhoorihāye novin e Ooroopā, Haft Ostān e Mottahed, bood. Šooreš ma'nā ye zendegi va margat bood, čerā ke ellat e teroorat dar 1584 niz šod. Amma margat ğoroor va deliri ye bištari be mardomat baḵšid tā barāye āzādi alayh e har setamgari bejangand. Bā onvān e «Pedar e Mihan» dar tāriḵ hak šodi va nāmat tā abad nemād e esteğlāl e Holand ast.
Brave Prince, your people ask for your wisdom to gain its freedom once more, and to illuminate the world with progressive and modern ideas. Will your new empire shine through the ages of history? = Šāhzāde ye delir, mardomat barāye bāzyāftan e āzādi, dobāre ḵeradat rā miḵāhand va miḵāhand bā andišehāye pišro va novin jahān rā rošan konand. Āyā emperātoori ye jadidat dar tool e asrhāye tāriḵ ḵāhad deraḵšid?
