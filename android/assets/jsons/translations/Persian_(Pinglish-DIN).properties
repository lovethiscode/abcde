# Capturing a city

What would you like to do with the city of [cityName]? = Bā šahr e [cityName] če miḵāhid bokonid?
Annex = Zamime
Annexed cities become part of your regular empire. = Šahr hāye zamime šode baḵši az emperātoori e āddi e šomā mišavand.
Their citizens generate 2x the unhappiness, unless you build a courthouse. = Šahrvandān e ānhā 2 barābar Nārezāyati toolid mikonand, magar inke yek dādgāh besāzid
Your civilization may not annex this city. = Tamaddon e šomā nemitavānad in šahr rā zamime konad.
Puppet = Mosta’emere
Puppeted cities do not increase your tech or policy cost. = Šahr hāye dast-nešānde hazine ye teknoloji yā siyāsat e šomā rā afzāyeš nemidahand.
You have no control over the the production of puppeted cities. = Šomā hič kontoroli be sāḵt-o-sāz e šahr hāye mosta’emere nadārid.
Puppeted cities also generate 25% less Science and Culture. = Šahr hāye dast-nešānde hamčenin 25% Elm va Farhang e kamtar tolid mikonand.
A puppeted city can be annexed at any time. = Yek šahr e mosta’emere harvağti mitavānad zamime šavad.
Liberate (city returns to [originalOwner]) = Āzādsazi (šahr be [originalOwner] barmigardad)
Liberating a city returns it to its original owner, giving you a massive relationship boost with them! = Āzād kardan e yek šahr ān rā be sāheb e asli aš bar migardānad, yek komak bozorg dar ravābet e šomā bā ānhā mikonad!
Raze = Virān Kardan
Razing the city annexes it, and starts burning the city to the ground. = Virān karadn e šahr ānrā zamime mikonad, sepas šoro be virān kardan mikonad tā bā ḵāk yeksān šavad.
Razing the city puppets it, and starts burning the city to the ground. = Virān kardan e šahr ān rā dast-nešānde mikonad va soozāndan e ān rā āğāz mikonad.
The population will gradually dwindle until the city is destroyed. = Jame’iat
Original capitals and holy cities cannot be razed. = Pāytaḵt hāye asli va šahr hāye moğaddas virān nemišavand.
Destroy = Nabood kardan
Destroying the city instantly razes the city to the ground. = Nābood kardan e šahr bilāfāsele ān rā bā ḵāk yeksān mikonad.
Keep it = Negahaš dār
Remove your troops in our border immediately! = Jame’iat be tadrij kāheš miyābad tā vağti ke šahr nābood šavad.
Sorry. = Bebaḵšid.
Never! = Hargez!
Those lands were not yours to take. This has not gone unnoticed. = Ān zamin hā az ān e šomā nabood ke begirid. In az češm door namānd.

