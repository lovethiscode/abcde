'Every particle of matter is attracted by or gravitates to every other particle of matter with a force inversely proportional to the squares of their distances.' - Isaac Newton = «Har zarre ye mādde bā niroo yi be har zarre ye digar jazb mišavad ke bā morabba e fāsele ye ānhā nesbat e vāroone dārad.» - Isāc Newton
Particle Physics = Fizik e Zarrāt
'The release of atomic energy has not created a new problem. It has readily made more urgent the necessity of solving an existing one.' - Albert Einstein = «Rahāsazi ye enerji ye atomi moškel e jadidi ijād nakarde ast; fağat zaroorat e hal e moškeli mojood rā fori-tar karde ast.» - Albert Einstein
