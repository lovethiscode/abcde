'I once sent a dozen of my friends a telegram saying 'flee at once-all is discovered!' They all left town immediately.' - Mark Twain = «Yek bār be davāzdah doostam telegram ferestādam ke fori farār konid, hame čiz āškār šode ast! Hame bilāfāsele šahr rā tark kardand.» - Mark Twain
