Heaven itself bends before your beauty, Empress Wu Zetian, ruler of eternal China! You lead one of the oldest and greatest civilization of humanity. In your time, China stood at the forefront of science and technology, bringing the world such contributions as gunpowder, the printing press, and the world of Confucius, and this, long before the rest of the world was mature enough to make the same discoveries! = Āsemān ham dar barābar e zibā'i-at ḵam mišavad, ey Emperātris Wu Zetian, farmanravāye Čin e jāvdān! To yeki az kohantarin va bozorgtarin tamaddon hāye bašar rā rahbari mikoni. Dar zamān e to Čin dar pišgāh e Elm va teknoloji bood va bāroot, čāp va jahān e Confucius rā be bašariyat hediye kard; ān ham moddat hā piš az ān ke baği ye jahān be boloo-ğ e kāfi barāye hamān kašf hā beresad!
Great Queen, can you make China prevail again, using your divine intelligence and beauty? China stands for greatness, and all its enemies will be dazzled soon enough! Will your new empire shine through the ages of history? = Ey Malake ye bozorg, āyā bā hooš va zibā'i ye elāhi-at Čin rā dobāre pirooz mikoni? Čin namād e bozorgi ast va be zoodi hame ye došmanānaš ḵire ḵāhand šod! Āyā emperātoori ye jadidat dar asr hāye tāriḵ ḵāhad deraḵšid?
