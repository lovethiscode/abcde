Most achievements allow any difficulty and need at least 1 AI opponent. Only N30, N36, N37, N38 and N39 require the stated difficulty and at least 3 AI opponents. You need not enable all victory routes. All game speeds are allowed. Any victory includes Time. Religion achievements require religion to be enabled. = Bištar e dastāvardhā dar har došvāri mojāz va niyāzmand e hadd ağal 1 rağib e Hooš e Masnoo'i hastand. Fağat N30, N36, N37, N38 va N39 došvāri ye nevešte va hadd ağal 3 rağib e Hooš e Masnoo'i miḵāhand. Fa'āl kardan e hame ye rāhhāye piroozi lāzem nist. Hame ye sor'athāye bāzi mojāzand. Har piroozi šāmel e Zamāni ast. Dastāvardhāye dini din e fa'āl miḵāhand.
