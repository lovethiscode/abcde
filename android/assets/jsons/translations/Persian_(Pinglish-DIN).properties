The world will be more beautiful without you. Prepare for war. = Jahān bedoon e to zibātar ḵāhad bood. Barāye jang āmāde bāš.
Fool! You will soon regret dearly! I swear it! = Nādān! Be zoodi saḵt pašimān ḵāhi šod! Sogand miḵoram!
You have won, congratulations. My palace is now in your possession, and I beg that you care well for the peacock. = To pirooz šodi, tabrik migooyam. Kāḵam aknoon dar mālekiyat e to ast; temannā mikonam az tāvoos ḵoob morāğebat koni.
Our future battle will be glorious. = Jang e āyande ye mā bāšokooh ḵāhad bood.
Welcome foreigner, I am Harun Al-Rashid, Caliph of the Arabs. Come and tell me about your empire. = Ḵoš āmadid, bigāne. Man Harun Al-Rašid, Ḵalife ye Arab hā, hastam. Biyā va az emperātoori-at barāyam begoo.
Come forth, let's do business. = Piš biyā, tejārat konim.
Peace be upon you. = Solh bar šomā bād.
Trade Caravans = Kārevān Hāye Bāzargāni
Blessings of the Great God be upon you, O great caliph Harun al-Rashid, leader of the mighty Arabian people! The Muslim Empire, the Caliphate, born from chaos after the death of the prophet Muhammad in 632 AD, intended to apply the rule of God to all Earth. And by the will of God, the caliphate reached its full power, ruling Spain, North Africa, the Middle East, Anatolia, the Balkans and Persia, to even surpass the Great Roman Empire. The arts and sciences were a holy gift of Arabia during the Middle Ages, as the infidel lands of Europe delved deep into ignorance and chaos. Lasting for six hundred years, the Caliphate finally fell before the Mongols, the plague of the civilized world. = Barakat e Ḵodāye bozorg bar to bād, ey Ḵalife ye bozorg Harun al-Rašid, rahbar e mardom e niroomand e Arab! Emperātoori ye Mosalmān, yā Ḵelāfat, az āšoob e pas az marg e Payāmbar Mohammad dar 632 milādi zāde šod va ḵāst ğanoon e Ḵodā rā bar tamām e zamin emāl konad. Be ḵāst e Ḵodā, Ḵelāfat be owj e ğodrat resid va bar Espāniyā, Šomāl e Āfriqā, Ḵāvar e Miyāne, Ānātoli, Bālkān va Iran hokoomat kard va az Emperātoori ye bozorg e Rom niz piši gereft. Honar va dāneš hediye ye moğaddas e Arabestān dar Ğoroon e Vostā bood, dar hāli ke sarzamin hāye kafer e Ooroopā dar nādāni va āšoob foroo miraftand. Ḵelāfat šešsad sāl pāyid va sar-anjām dar barābar e Moğol hā, balāye jahān e motamadden, soğoot kard.
Great Caliph Harun al Rashid, all Arabian people long for greatness! Arabia must be once again the land of arts and knowledge, which under the radiant law of God, will fear no enemy! Will your new empire shine through the ages of history? = Ey Ḵalife ye bozorg Harun al Rašid, hame ye mardom e Arab moštāğ e bozorgi and! Arabestān bāyad dobāre sarzamin e honar va dāneš šavad, ke zire ğanoon e noorani ye Ḵodā az hič došmani natarsad! Āyā emperātoori ye jadidat dar asr hāye tāriḵ ḵāhad deraḵšid?
