Gustavus Adolphus = Goostāv Adolf
The Hakkapeliittas will ride again and your men will fall just at the sight of my cavalry! God with us! = Hākapeliitā hā dobāre asbsavāri ḵāhand kard va mardānat tanhā bā didan e savāre-nezām e man az pā dar miāyand! Ḵodā bā māst!
Ha ha ha, captain Gars will be very glad to head out to war again. = Hā hā hā, nāḵodā Gars besyār ḵošhāl ḵāhad šod ke dobāre be jang beravad.
I am Sweden's king. You can take my lands, my people, my kingdom, but you will never reach the House of Vasa. = Man pādešāh e Soo'ed hastam. Mitavāni zaminam, mardomam va pādešāhiam rā begiri, amma hargez be ḵāndān e Vāzā naḵāhi resid.
You actually seem sharper than what I had originally thought. = Dar vāğe' zehnet tiztar az ān čizi ast ke az āğāz fekr mikardam.
Stranger, welcome to the Snow King's kingdom! I am Gustavus Adolphus, member of the esteemed House of Vasa = Bigāne, be pādešāhi ye Šāh e Barf ḵoš āmadid! Man Goostāv Adolf, ozv e ḵāndān e mohtaram e Vāzā, hastam
My friend, it is my belief that this settlement can benefit both our peoples. = Doost e man, bāvar dāram ke in tavāfoğ mitavānad be sood e har do mardom bāšad.
Oh, welcome! = Oh, ḵoš āmadi!
Oh, it is you. = Oh, in šomāyi.
Nobel Prize = Jāyeze Nobel
All hail Great King Gustavus Adolphus, founder of the Swedish Empire, and one of the most famous military tacticians. In the early 17th century, Sweden emerged as a great power in Europe under your reign, thanks to your wisdom, both in diplomacy and warfare. As king, you decided to reform Swedish laws to bring economic stability and prosperity to your people. Your allies, and also your enemies, called you the 'Lion of the North', witnessing your modern vision of warfare, and the prowess of your armies on the battlefield. As you triumphed in the Thirty Years' War, your name will be forever remembered as one of history's greatest generals. = Dorood bar Pādešāh e Bozorg Goostāv Adolf, bonyangozār e Emperātoori ye Soo'ed va yeki az mašhoortarin taktisienhāye nezāmi. Dar āvāyel e sade ye 17, Soo'ed dar zamāndāri ye to, be lotf e ḵeradat dar diplomāsi va jang, be yek ğodrat e bozorg dar Ooroopā tabdil šod. Be onvān e pādešāh, tasmim gerefti ğavānin e Soo'ed rā eslāh koni tā sobāt e eğtesādi va refāh barāye mardomat farāham šavad. Mottahedān va hatta došmanānat to rā «Šir e Šomāl» mināmidand, čon negāh e novin e to be jang va mahārat e artešat dar meydān e nabard rā mididand. Bā piroozi at dar Jang e Sisāle, nāmat barāye hamiše be onvān e yeki az bozorgtarin sardāran e tāriḵ be yād ḵāhad mānd.
O noble King, will you lend your leadership and brilliant ideas to Sweden once again, to conceive strategies never seen before? Will your new empire shine through the ages of history? = Ey pādešāh e najib, āyā dobāre rahbari va andišehāye deraḵšānat rā be Soo'ed mibaḵši tā rāhbordhāyi nādide besāzi? Āyā emperātoori ye jadidat dar tool e asrhāye tāriḵ ḵāhad deraḵšid?
