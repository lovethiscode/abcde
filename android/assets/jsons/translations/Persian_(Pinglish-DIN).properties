Build World Wonders yourself in any city you own; Great Engineer acceleration is allowed. National Wonders and wonders already present in acquired cities do not count as built. Different wonders are counted by type. Foreign cities were founded by other major civilizations; repeated captures of the same city count once. = Dar har šahr e ḵod, Ojoobehāye Jahāni rā ḵodetān besāzid; tasri' bā Mohandes e Bozorg mojāz ast. Ojoobehāye Melli va ojoobehāye az ğabl mojood dar šahr e kasbšode, sāḵte hesāb nemišavand. Anvā' e motefāvet e ojoobe hesāb mišavand. Šahr e bigāne rā tamaddon e bozorg e digar bonyan gozāšte; fath e tekrāri ye hamān šahr yek bār hesāb mišavad.
