[civName] has promised not to attack us! = [civName] va'de dāde ast be mā hamle nakonad!
[civName] declared war on us after we questioned the positioning of their military! = [civName] pas az porseš e mā dar bāre ye makān e arteš e ānhā be mā e'lām e jang kard!
