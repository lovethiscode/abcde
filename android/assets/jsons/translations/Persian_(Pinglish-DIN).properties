Vive Napoleon I, First Consul and Emperor of France! After the glorious Revolution which suppressed the centuries-old monarchy, the French nation stood at the heart of Europe as a Republic, and intended to export its ideals to the entire European continent, either by diplomacy or war. The French Capital Paris was more than ever the world center of Culture, Arts, and Letters. With its Great Army, reputed as one of the greatest in the History, France fought gloriously all surrounding enemies, but eventually fell against the coalition of other European powers. = Zende bād Napoleon I, konsool e avval va Emperātoor e Farānse! Pas az enğelāb e bāšokoohi ke saltanat e čand-sadsāle rā sarnegoon kard, mellat e Farānse be onvān e jomhoori dar ğalb e Ooroopā istād va ḵāst ārmān hāye ḵod rā az rāh e siyāsat yā jang be tamām e ğārre sodoor konad. Pāytaḵt e Farānse, Paris, biš az har zamān markaz e jahāni ye Farhang, honar va adabiyāt bood. Bā arteš e bozorgaš, ke az bozorgtarin arteš hāye tāriḵ šomorde mišod, Farānse bā šokooh bā hame ye došmanān e atrāf jangid, amma sar-anjām dar barābar e ettehād e digar ğodrat hāye Ooroopāyi soğoot kard.
Napoleon Bonaparte, ruler of the French people, will you rebuild the Empire to take revenge on your foes, and make again of its Capital the City of Lights? Will your new empire shine through the ages of history? = Ey Napoleon Bonaparte, farmanravāye mardom e Farānse, āyā emperātoori rā dobāre ḵāhi sāḵt tā az došmanānt enteğām begiri va pāytaḵtaš rā bāz Šahr e Noor koni? Āyā emperātoori ye jadidat dar asr hāye tāriḵ ḵāhad deraḵšid?
