My treasury contains little and my soldiers are getting impatient... (sigh) ...therefore you must die. = Ḵazāne am kam dārad va sarbāzānam betāb mišavand… (āh)… pas to bāyad bemiri.
So brave, yet so stupid! If only you had a brain similar to your courage. = Inğadr delavar va bā in hāl nādān! Kāš āğli ham-pāye šojā'atet dāšti.
The gods have deprived Rome of their favour. We have been defeated. = Ḵodāyān lotf e ḵod rā az Rom gerefte and. Mā šekast ḵorde im.
I wasn't sure, but it seems you do have some grit. = Motmaen naboodam, amma be nazar miresad kami jasārat dāri.
I greet you. I am Augustus, Imperator and Pontifex Maximus of Rome. If you are a friend of Rome, you are welcome. = Dorood bar to. Man Augustus, Imperator va Pontifex Maximus e Rom hastam. Agar doost e Rom hasti, ḵoš āmadid.
I offer this, for your consideration. = In rā barāye barrasi ye šomā pišnahād mikonam.
Hail. = Dorood.
What do you want? = Či miḵay?
The Glory of Rome = Šokooh e Rom
Ave Caesar Augustus, Emperor of Rome and Dominus of the Roman Empire! Your empire was the most powerful and feared of all in Western civilization. The Roman people crafted so brilliantly its culture, law, art, and warfare, that no one could contest the supremacy of Rome. Force and Honor led to glorious conquests, a domination of all the lands from Spain in the west to Syria in the east, even reaching the remote barbarian lands of England and Germany. Roman art and architecture have been praised for millenia and have been envied by all lesser civilizations who have followed. = Dorood bar Caesar Augustus, Emperātoor e Rom va sarvare Emperātoori ye Rom! Emperātoori ye to niroomandtarin va tarsnāktarin dar tamaddon e ğarbi bood. Mardom e Rom Farhang, ğanoon, honar va honar e jang rā čonān deraḵšān parvardand ke hič kas nemitavānest bartari ye Rom rā be čaleš bekešad. Zoor va šaraf be fath hāye bāšokooh anjāmid: solte bar hame ye sarzamin hā az Espāniyā dar ğarb tā Sooriye dar šarğ, va hatta tā sarzamin hāye door e barbar e Engelestān va Ālmān. Honar va me'māri ye Rom hezārān sāl setoode šode va hame ye tamaddon hāye koočaktar e bādi be ān hasrat ḵorde and.
O glorious Imperator, your people celebrate you and ask for the glory of Rome! In these times of darkness, the Pax Romana will be a beacon of light for all! Will your new empire shine through the ages of history? = Ey Imperator e bāšokooh, mardomat to rā jašn migirand va šokooh e Rom rā miḵāhand! Dar in roozgāre tārik, Pax Romana čerāğ e rošanāyi barāye hame ḵāhad bood! Āyā emperātoori ye jadidat dar asr hāye tāriḵ ḵāhad deraḵšid?
