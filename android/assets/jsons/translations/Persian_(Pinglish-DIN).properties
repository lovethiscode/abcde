Xi-miqa-can! Xi-miqa-can! Xi-miqa-can! (Die, die, die!) = Xi-miqa-can! Xi-miqa-can! Xi-miqa-can! (Bemir, bemir, bemir!)
Excellent! Let the blood flow in raging torrents! = Āli! Begozar ḵoon dar seyl hāye ḵoroošān jāri šavad!
Monster! Who are you to destroy my greatness? = Heyoolā! To kisti ke bozorgi ye man rā nābood koni?
What do I see before me? Another beating heart for my sacrificial fire. = Dar barābaram če mibinam? Ğalbi tapande ye digar barāye ātaš e ğorbāni-am.
Accept this agreement or suffer the consequences. = In tavāfoğ rā bepazir yā payāmad hāyaš rā tahammol kon.
Welcome, friend. = Ḵoš āmadi, rafiğ.
Sacrificial Captives = Asirān e ğorbāni
O divine Montezuma, your people welcome you! May your magnificence inspire all living things! The mighty Aztecs were nomads until the 12th century, when they choose to settle in the mesa central, which would later be called Mexico. Wars were frequent with other tribes to control the rich land surrounding the sacred lakes of Texcoco, Xaltocan and Zampango. In some 200 years, double-sided alliances and martial prowess made of the Aztecs the dominant power in the Central American basin, forming a mighty empire stretching from sea to sea. Alas, the empire fell under the assault of foreign devils - the Spaniards and many curses they brought with them! Wars between tribes and weaponry of doom used by the invaders made the great Aztec civilization crumble in only a few decades. = Ey Montezuma ye ḵodāgoon, mardomat be to ḵoš-āmad migooyand! Šokooh e to ilhāmbaḵše hame ye jāndarān bād! Aztec hāye niroomand tā sade ye 12 kooč-nešin boodand; sepas dar falāt e markazi ke bādan Mexico nām gereft sāken šodand. Barāye kontorol e zamin hāye ğani ye dore daryāče hāye moğaddas e Texcoco, Xaltocan va Zampango bā ğabile hāye digar jang hā besyār bood. Dar hodood e 200 sāl, ettehād hāye dosooye va maharat e jang Aztec hā rā be ğodrat e mosallat e howze ye Āmrikāye Markazi tabdil kard va emperātoori yi niroomand az daryā tā daryā sāḵt. Afsos ke emperātoori zire hamle ye šeytān hāye bigāne, Espāniyāyi hā va nafrin hāye besyāri ke bā ḵod āvardand, soğoot kard! Jang hāye beyn e ğabile hā va selāh hāye virān-gar e hamlevarān tamaddon e bozorg e Aztec rā tanhā dar čand dahe foroo-pāšid.
O mighty King Montezuma, do you hear the call of your people seeking for revenge? Will you lead them to victory under the light of the Five Suns? Will your new empire shine through the ages of history? = Ey Šāh Montezuma ye niroomand, āyā sedāye mardomat rā ke enteğām miḵāhand mišenavi? Āyā zire noor e Panj Ḵoršid ānhā rā be piroozi rahbari mikoni? Āyā emperātoori ye jadidat dar asr hāye tāriḵ ḵāhad deraḵšid?
