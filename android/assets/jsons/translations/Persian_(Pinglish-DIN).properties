'There's a basic principle about consumer electronics: it gets more powerful all the time and it gets cheaper all the time.' - Trip Hawkins = «Dar bāre ye elektronik e masrafi asli pāye vojood dārad: hamiše niroomandtar va hamiše arzāntar mišavad.» - Trip Hawkins
Electronics = Elekteronik
'The speed of communications is wondrous to behold, it is also true that speed does multiply the distribution of information that we know to be untrue.' – Edward R. Murrow = «Sorat e ertebāt šegeft-angiz ast; in ham dorost ast ke sorat, paḵš e ettelāati rā ke midānim dorost nist čand barabar mikonad.» - Edward R. Murrow
