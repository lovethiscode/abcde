已记录正数支援伤害的城市：[p1]；由另一支部队占城并完成归属后核对。 = Šahrhāye bā āsib e poštibāni ye sabtšode: [p1]; pas az fath e šahr bā niroo ye digar va tasbit e mālikiyat barrasi mišavad.
