Isabella = Izābel
God will probably forgive you... but I shall not. Prepare for war. = Ḵodā šāyad to rā bebaḵšad… amma man naḵāham baḵšid. Barāye jang āmāde bāš.
Repugnant spawn of the devil! You will pay! = Zāde ye nafrat-angiz e šeytān! Tavān ḵāhi dād!
If my defeat is, without any doubt, the will of God, then I will accept it. = Agar šekast e man bi hič šak erāde ye Ḵodā ast, ān rā mipaziram.
God blesses those who deserve it. I am Isabel of Spain. = Ḵodā be šāyestegān barakat midahad. Man Isabel e Espāniyā hastam.
I hope this deal will receive your blessing. = Omidvāram in tavāfoğ az barakat e šomā barḵordār šavad.
Seven Cities of Gold = Haft Šahr e Talā
Holy Isabella, envoy of God, Great Queen of Castille and León, your people celebrate you! Spain is a beautiful and ancient country, a link between Europe and Africa, one shore on the Mediterranean and the other on the mighty Atlantic Ocean. The Spanish culture had taken the best of the Christian and Muslim worlds, and was ready to dominate the world for centuries. Powerful Spanish military fleets and brave explorers found and conquered much of the New World. Exploiting a whole new continent and its riches, Spain reached a state of power few could compete with for hundreds of years. = Ey Isabella ye moğaddas, ferestāde ye Ḵodā, Malake ye bozorg e Castille va Leon, mardomat to rā jašn migirand! Espāniyā kešvari zibā va kohan, peyvandi miyān e Ooroopā va Āfriqā, bā yek sāhel bar Mediterāne va sāheli digar bar Oğyānoos e niroomand e Atlas ast. Farhang e Espāniyā behtarin hāye jahān e Masihi va Mosalmān rā gerefte bood va barāye solte bar jahān dar sade hāye āyande āmāde bood. Nāvgān hāye nezami ye niroomand va kāveš-garān e delavar e Espāniyā baḵš e bozorgi az Jahān e No rā kašf va tasḵir kardand. Bā bahrebardāri az yek ğārre ye jadid va servat hāye ān, Espāniyā be ğodrati resid ke barāye sad hā sāl kam kasi mitavānest bā ān reğābat konad.
O splendid and virtuous Isabella! By the will of the heavens, will Spain reborn to achieve its holy destiny and become a new El Dorado? Will your new empire shine through the ages of history? = Ey Isabella ye deraḵšān va pākdāman! Āyā be ḵāst e āsemān Espāniyā dobāre zāde mišavad tā sarnevešt e moğaddas e ḵod rā beja āvarad va El Dorado ye jadidi šavad? Āyā emperātoori ye jadidat dar asr hāye tāriḵ ḵāhad deraḵšid?
