After thorough deliberation, Australia finds itself at a crossroads. Prepare yourself, for war is upon us. = Pas az andiše ye firāvān, Ostrāliyā ḵod rā bar sarāhi do rāh mibinad. Āmāde bāš, ke jang az rāh resid.
