Sejong = Sejong
Jip-hyun-jun (Hall of Worthies) will no longer tolerate your irksome behavior. We will liberate the citizens under your oppression even with force, and enlighten them! = Jip-hyun-jun (Tālāre Šāyestegān) digar raftār e āzār-dahande ye šomā rā tahammol nemikonad. Šahrvandān e zire setam e šomā rā hatta be zoor āzād va rošan ḵāhim kard!
Foolish, miserable wretch! You will be crushed by this country's magnificent scientific power! = Bi-navāye nādān va badbaḵt! Zire ğodrat e elmi ye bāšokooh e in kešvar ḵord ḵāhi šod!
Now the question is who will protect my people. A dark age has come. = Aknoon porseš in ast ke če kasi az mardomam hefāzat ḵāhad kard. Asri tārik farā-reside ast.
Your words reveal more of your own prejudice than any fault in my own. = Harf hāyat biš az har aibi dar man, ta'assob e ḵodet rā āškār mikonad.
Welcome to the palace of Choson, stranger. I am the learned King Sejong, who looks after his great people. = Be kāḵ e Čoson ḵoš āmadid, bigāne. Man Šāh Sejong e dānešmand hastam, ke az mardom e bozorg e ḵod morāğebat mikonad.
We have many things to discuss and have much to benefit from each other. = Čiz hāye besyāri barāye goftegoo dārim va mitavānim besyār az yekdigar bahre bebarim.
Oh, it's you = Oh, in toyi
Scholars of the Jade Hall = Pažoohešgarān e Tālār e Jeyd
Greetings to you, King Sejong the Great, heir of the Choson Dynasty! Prosperity and benevolence towards the common man are the principles of your reign, and made of you the most beloved Korean king. You always aimed to provide a fair and equal society for all your people, and also to favor knowledge and technological discoveries. Your wisdom and intelligence imbued all the Korean society, and the scholars of the Jade Hall developed Korea's first written language, Hangul, sharing further literature and science to the people after centuries of darkness. = Dorood bar to, Šāh Sejong e Bozorg, vāres e selesele ye Čoson! Ronāğ va nik-ḵāhi be mardom e ādi osool e farmānravāyi ye to and va to rā mahboobtarin šāh e Kore karde and. Hamiše ḵāsti jāmee yi ādelane va barābar barāye hame ye mardomat farāham koni va az dāneš va kašf hāye teknoloji hemāyat koni. Ḵerad va hooš e to hame ye jāmee ye Kore rā por kard; dānešvarān e Tālāre Yašm noḵostin zabān e neveštāri ye Kore, Hangul, rā parvareš dādand va pas az sade hā tāriki, adabiyāt va Elm rā bištar bā mardom dar miyān gozāštand.
Wise Sejong, will you gift your people with the radiance of harmony and knowledge to dispel the darkness once again? Will your new empire shine through the ages of history? = Ey Sejong e dānā, āyā dobāre ba hediye ye noor e hamāhangi va dāneš be mardomat tāriki rā ḵāhi zodood? Āyā emperātoori ye jadidat dar asr hāye tāriḵ ḵāhad deraḵšid?
