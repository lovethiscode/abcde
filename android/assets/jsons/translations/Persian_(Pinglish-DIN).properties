Hi there! If you've played this far, you've probably seen that the game is currently incomplete.\n Unciv is meant to be open-source and free, forever.\n That means no ads or any other nonsense. = Salām! Agar tā injā bāzi karde id, ehtemālan dide id ke bāzi hanooz nātamām ast.\n Unciv hamiše matnbāz va rāygān ḵāhad mānd.\n Ya'ni bedoon e tabliğ yā har čiz e bihoode ye digar.
Every rating and review that I get puts a smile on my face =)\n  So contact me! Send me an email, review, Github issue\n  or mail pigeon, and let's figure out how to make the game \n  even more awesome!\n(Contact info is in the Play Store) = Har emtiyāz va nağdi ke migiram labḵandi rooye sooratam miāvarad =)\n  Pas bā man tamās begirid! Rāyānāme, nağd, mas'ale ye Github\n  yā kabootar e nāmebar befrestid tā befahmim čegoone bāzi rā\n  bāz ham šegeftangiztar konim!\n(Ettelā'āt e tamās dar Play Store ast)
