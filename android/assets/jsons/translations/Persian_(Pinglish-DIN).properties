You shall stain this land no longer with your vileness! To arms, my countrymen. We ride to war! = Digar in sarzamin rā bā palidi at āloode naḵāhi kard! Hammiha nān, be salāh! Be jang miravim!
Traitorous man! The Celtic peoples will not stand for such wanton abuse and slander - I shall have your balls! = Mard e ḵiyānatkār! Mardom e Selt in badraftāri va bohtān e bi-dalil rā tahammol naḵāhand kard — toḵmhāyat rā ḵāham gereft!
Vile ruler, know you have won this war in name alone. Your cities lie buried and your troops defeated. I have my own victory. = Farmānravā ye palid, bedān ke fağat dar nām in jang rā borde i. Šahrhāyat zir e āvārand va niroohāyat šekast ḵorde and. Man piroozi ye ḵod rā dāram.
Don't forget who you're dealing with. Arrogant moves can get you in danger. = Farāmooš nakon bā če kasi taraf hasti. Harekat e mağroorāne mitavānad to rā be ḵatar biandāzad.
I am Boudicca, Queen of the Celts. Let no-one underestimate me! = Man Boodikā, malake ye Selthā, hastam. Hič kas marā dast e kam nagirad!
Let us join our forces together and reap the rewards. = Biyāyid niroohāyemān rā yeki konim va pādāš begirim.
God has given good to you. = Ḵodā be to neki baḵšide ast.
Druidic Lore = Dāneš e Drooidi
May glory and honor always be upon you, Warrior Queen! In a time dominated by men, you successfully claimed the throne and the power, but also valiantly defied the mighty Roman Empire. Punished and humiliated by the hand of the Roman bloody invaders, you united your people and led a terrible revolt, to seek revenge. Many legions fell under your fierce attacks and you burned the city of London with your anger. While the Romans still kept ownership of your land after your final defeat, your actions nonetheless showed Rome that this land could never be fully conquered, making Nero himself consider to withdraw all troops and leaving Britain forever. = Ey malake ye jangāvar, šokooh va efteḵār hamiše bā to bād! Dar roozegāri ke mardān hokoomat mikardand, bā movaffağiyat taḵt va ğodrat rā be dast āvardi va delirāne dar barābar e Emperātoori ye niroomand e Room istādi. Be dast e mohājemān e ḵoonriz e Room mojāzāt va tahğir šodi; mardomat rā mottahed kardi va barāye enteğām šooreš e bozorgi rāh andāḵti. Legionhāye besyāri dar hamlehāye saḵt e to foroo riḵtand va šahr e Landan rā bā ḵašmat soozāndi. Har čand Roomihān pas az šekast e nahāyi at hamāna mālik e sarzaminat māndand, kārhāyat be Room nešān dād ke in sarzamin hargez be toor e kāmel fath šodani nist, tā jāyi ke ḵod e Nero be fekr e biroon kešidan e hame ye niroohā va tark e hamišegi ye Britāniyā oftād.
O raging lioness, will you lead the Celts again under the glory of your name, to spread the fires of liberty, and achieve a final victory? Will your new empire shine through the ages of history? = Ey šir e māde ye ḵašmgin, āyā dobāre Selthā rā dar šokooh e nāmat rahbari mikoni tā ātašhāye āzādi rā begostarānand va piroozi ye nahāyi be dast āvarand? Āyā emperātoori ye jadidat dar tool e asrhāye tāriḵ ḵāhad deraḵšid?
