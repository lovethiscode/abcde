'The whole country was tied together by radio. We all experienced the same heroes and comedians and singers. They were giants.' - Woody Allen = «Rādio tamām e kešvar rā be ham peyvand dād. Hame ye mā hamān ğahremānān, tanzpardazān va ḵāneandegān rā tajrobe kardim. Ānhā bozorgān boodand.» - Woody Allen
