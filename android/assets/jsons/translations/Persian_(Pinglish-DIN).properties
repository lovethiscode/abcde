Friend, I believe I may have found a way to save us all! Look, look and accept my offering! = Doost e man, fekr mikonam šāyad rāhi barāye nejāt e hame ye mā yāfte am! Bebin, bebin va piškešam rā bepazir!
A fine day, it helps you. = Roozi ḵoš ast, be to komak mikonad.
The Long Count = Šomāreš e Boland
Kneel before King Pacal the Great, son of the gods and protector of the Palenque domain! After your kingdom has been harassed for years by neighboring rivals, you struck back at the enemies of your people, defeating each of them and sacrificing their leaders as a retribution to the insults made to your ancestors. Your wisdom and hard will not only restored the glory of Palenque, but turned it into a magnificient city, as your people built the greatest monuments and architecture the world has ever known. = Dar barābar e Pādešāh Pākāl e Bozorg, pesar e ḵodāyān va negahbān e sarzamin e Palenke, zānoo bezanid! Pas az sālhā āzār e pādešāhi at be dast e rağibān e hamsāye, be došmanān e mardomat hamle kardi, hame rā šekast dādi va rahbarānešān rā dar pāsoḵ be tohin be niyākānat ğorbāni kardi. Ḵerad va erāde ye āhaninat na tanhā šokooh e Palenke rā bāzgardānd, balke ān rā be šahri bāšokooh tabdil kard, čon mardomat bozorgtarin yādboodhā va memārihāyi rā ke jahān tā konoon šenāḵte sāḵtand.
Absolute King, your people need you to save the great Mayan culture and knowledge. Will you be able to read the movement of the stars, and find in the heavens the power to repel any foes? Will your new empire shine through the ages of history? = Pādešāh e motlağ, mardomat barāye nejāt e farhang va dāneš e bozorg e Māyā be to niyāz dārand. Āyā mitavāni harekat e setāregān rā beḵāni va dar āsemān nirooyi barāye rāndan e har došman biyābi? Āyā emperātoori ye jadidat dar tool e asrhāye tāriḵ ḵāhad deraḵšid?
