# Refactored menu and window localization
1. Tap Create room, choose the rules and map, then share the invitation. = 1. «Sāḵtan-e otāğ» rā bezanid, ğavānin va nağše rā enteḵāb konid, sepas dāvat rā be ešterāk begozārid.
1. The Android player copies their Player ID from Multiplayer and sends it to the iOS host. = 1. Bāzikon-e Android ID-ye ḵod rā az «Čand-nafare» kopi mikonad va barāye mizbān-e iOS mifrestad.
2. In an empty player seat, the host taps Add player manually, pastes the Player ID, taps the portrait to choose a civilization, then taps Mark ready. = 2. Dar yek jāygāh-e ḵāli, mizbān «Afzudan-e dasti-ye bāzikon» rā mizanad, ID-ye bāzikon rā migozārad, barāye enteḵāb-e tamaddon ruye tasvir mizanad va sepas «Āmāde» rā enteḵāb mikonad.
2. Other iOS players open the invitation or paste it in Join by invitation, tap their civilization portrait to choose, then tap Ready. = 2. Bāzikonhāye digar-e iOS dāvat rā bāz mikonand ya ān rā dar «Peyvastan bā dāvat» migozārand. Barāye enteḵāb-e tamaddon ruye tasvir mizanand va sepas «Āmāde» rā mizanand.
3. After starting, the Game ID is copied automatically. Send it to the Android player to add the game in Multiplayer. = 3. Pas az šoru, ID-ye bāzi ḵodkār kopi mišavad. Ān rā barāye bāzikon-e Android befrestid tā bāzi rā dar «Čand-nafare» ezāfe konad.
3. The host is ready automatically. When everyone is ready, the host taps Start game. No Player ID or Game ID exchange is needed. = 3. Mizbān ḵodkār āmāde ast. Vağti hame āmāde šodand, mizbān «Šoru-e bāzi» rā mizanad. Tabādol-e ID-ye bāzikon ya bāzi lāzem nist.
