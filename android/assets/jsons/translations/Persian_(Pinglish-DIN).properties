Resistance is futile! You cannot hope to stand against the mighty Incan empire. If you will not surrender immediately, then prepare for war! = Moğāvemat bi-fāyede ast! Nemitavāni dar barābar e Emperātoori ye niroomand e Inka omid e istādegi dāšte bāši. Agar fori taslim našavi, barāye jang āmāde bāš!
Declare war on me?!? You can't, because I declare war on you first! = Be man e'lām e jang mikoni?!? Nemitavāni, čon man avval be to e'lām e jang mikonam!
How did you darken the sun? I ruled with diligence and mercy—see that you do so as well. = Čegoone ḵoršid rā tārik kardi? Man bā pooštkār va rahm hokoomat kardam; to niz čenin kon.
How are you? You stand before Pachacuti Inca Yupanqui. = Hāl e šomā četor ast? Dar barābar e Pačacuti Inca Yupanqui istāde id.
The Incan people offer this fair trade. = Mardom e Inka in mo'āmele ye monsefāne rā pišnahād mikonand.
How are you doing? = Hālet četore?
What do you want now? = Hālā či miḵāy?
Great Andean Road = Jāde ye Azim e Kooh hāye Ānd
King Pachacuti Sapa Inca, maker of the world and ruler of Tawantinsuyu and the Inca people, your loyal subjects greet you! In the beginning, the small state of Cusco already showed the Incans were promised for greatness. They won many wars against powerful enemies, relentlessly crushing any army that dared oppose them, and forged a mighty empire stretching from Ecuador to Chile, the greatest ever seen in pre-Columbian America. Not just undaunted soldiers, Inca people were accomplished builders and artists, their magnificient and unequalled culture still fascinating the world today. = Ey Šāh Pačacuti Sapa Inca, sāzande ye jahān va farmanravāye Tawantinsuyu va mardom e Inka, ra'iyat e vafādārat be to dorood migooyand! Az āğāz, dowlat e koočak e Cusco nešān midād ke bozorgi dar entezar e Inka hā ast. Ānhā dar jang hāye besyār došmanān e niroomand rā šekast dādand, har arteš e jorat-konande be moğāvemat rā bi-amān ḵord kardand va emperātoori yi az Ecuador tā Čile sāḵtand, bozorgtarin dar Āmrikāye piš az Columbus. Mardom e Inka na tanhā sarbāzān e bitars, balke sāzandegān va honarmandān e māher boodand va Farhang e bāšokooh va bi-hamtā ye ānhā emrooz niz jahān rā šegeftzade mikonad.
O Emperor Pachacuti, honor your name of 'Earth Shaker'! Will you once again summon the power of the earth to unite all Incan people under the protection of Sapa Inca, the Son of the Sun? Will your new empire shine through the ages of history? = Ey Emperātoor Pačacuti, šāyeste ye nāmat «Larzānande ye zamin» bāš! Āyā dobāre ğodrat e zamin rā farā miḵāni tā hame ye Inka hā rā zire hemāyat e Sapa Inca, Pesare Ḵoršid, yeki koni? Āyā emperātoori ye jadidat dar asr hāye tāriḵ ḵāhad deraḵšid?
