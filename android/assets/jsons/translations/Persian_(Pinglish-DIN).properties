# iOS maintenance support
Support iOS maintenance = Hemāyat az negahdāri-ye iOS
Purchase records are unavailable. No purchase was started. Please reopen the app. = Savābeq-e ḵarid dar dastres nist. Hič ḵaridi āḡāz našode ast. Barnāme rā dobāre bāz konid.
Congratulations on your victory! = Piruzitān rā tabrik miguyim!
Enjoying this iOS version? Optional support helps with ongoing compatibility and maintenance. All game content and features stay the same whether you contribute or not. = Az in nosḵe-ye iOS lezzat mibarid? Hemāyat-e eḵtiyāri be sāzegāri va negahdāri-ye peyvaste komak mikonad. Čeh komak konid čeh nakonid, hame-ye mohtavā va emkānāt-e bāzi yeksān mimānad.
Learn about support = Āšnāyi bā hemāyat
Continue playing = Edāme-ye bāzi
Unciv is made by an open-source community. This iOS version needs ongoing work to adapt to new systems, fix issues, and improve the controls. = Unciv hāsel-e kār-e yek jāme'e-ye matn-bāz ast. In nosḵe-ye iOS barāye sāzegāri bā sistemhā-ye jadid, raf'-e moškelāt va behbud-e kontrolhā be kār-e peyvaste niyāz dārad.
If you enjoy playing, you can support future iOS maintenance with a voluntary, one-time contribution. All game content and features are the same for everyone. = Agar az bāzi lezzat mibarid, mitavānid bā yek komak-e eḵtiyāri va yekbāre az negahdāri-ye āyande-ye iOS hemāyat konid. Hame-ye mohtavā va emkānāt-e bāzi barāye hame yeksān ast.
Processing your purchase... = Ḵarid-e šomā dar hāl-e pardāzeš ast…
Thank you for supporting iOS maintenance! = Az hemāyat-e šomā az negahdāri-ye iOS sepāsgozārim!
Purchase cancelled. No purchase was made. = Ḵarid laḡv šod. Hič ḵaridi anjām našod.
Waiting for Apple's approval. If approved later, your support will be recorded automatically. = Dar entezār-e ta'yid-e Apple hastim. Agar ba'dan ta'yid šavad, hemāyat-e šomā ḵodkār sabt mišavad.
The purchase could not be completed. Please try again later. = Ḵarid takmil našod. Lotfan ba'dan dobāre talāš konid.
The purchase could not be verified. Reopen the app to retry recovery. = Ḵarid ta'yid našod. Barnāme rā dobāre bāz konid tā bāzyābi-ye tarākoneš dobāre emtehān šavad.
Your purchase needs local recovery. Do not pay again; reopen the app to retry saving and finishing the transaction. = In ḵarid be bāzyābi ru-ye dastgāh niyāz dārad. Dobāre pardāḵt nakonid; barnāme rā dobāre bāz konid tā zaḵire va takmil-e tarākoneš dobāre emtehān šavad.

