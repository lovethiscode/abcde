Suleiman I = Suleiman I
Your continued insolence and failure to recognize our preeminence leads us to war. = Gostāḵi ye peyvaste va napaziroftan e bartari ye mā, mā rā be jang mikešānad.
Good. The world shall witness the incontestable might of my armies and the glory of the Empire. = Ḵoob ast. Jahān ğodrat e bi-čon-o-čerāye arteš hāyam va šokooh e Emperātoori rā ḵāhad did.
Ruin! Ruin! Istanbul becomes Iram of the Pillars, remembered only by the melancholy poets. = Virāni! Virāni! Istanbul be Iram e Sotoon hā tabdil mišavad, ke tanhā šāerān e ğamgin ān rā be yād dārand.
From the magnificence of Topkapi, the Ottoman nation greets you, stranger! I'm Suleiman, Kayser-I Rum, and I bestow upon you my welcome! = Az šokooh e Topkapi, mellat e Osmāni be to dorood migooyad, bigāne! Man Suleiman, Kayser-I Rum, hastam va be to ḵoš-āmad migooyam!
Let us do business! Would you be interested? = Biyā tejārat konim! Alāğe dāri?
Barbary Corsairs = Dozdān Daryāi e Barbar
O Great Sultan Suleiman, may the God bless you! You are revered for your power, wealth and generosity, and you truly deserves to be called the 'Magnificent'! The Ottoman Empire was born in Bithynia, starting as a small country in Eastern Anatolia in 12th century, then expanded to west into Anatolia. Over the next century, your people vanquished the empire of Byzantium, annexing Turkey and the Balkans, and smartly assimilating all wonders and knowledge of the Byzantine civilization. In the mid 15th century, the Ottomans added Constantinople to their empire, establishing a strategic link between Europe and the Middle East. The Empire would continue to expand for centuries reaching North Africa, Middle East and Eastern Europe at its height, but brutally disappeared in the chaos of the first world war, in early 20th century. = Ey Soltān e bozorg Suleiman, Ḵodā to rā barakat dahad! To be ğodrat, servat va baḵšandegi gerāmi hasti va be rāsti šāyeste ye nām e «Bāšokooh» hasti! Emperātoori ye Osmāni dar Bithynia zāde šod: dar sade ye 12 az kešvari koočak dar šarğ e Ānātoli šoroo kard va sepas be ğarb dar Ānātoli gostāreš yāft. Dar sade ye bād, mardomat Emperātoori ye Bizans rā šekast dādand, Torkiye va Bālkān rā zamime kardand va hoošmandāne hame ye šegefti hā va dāneš e tamaddon e Bizans rā jazb kardand. Dar miyāne ye sade ye 15, Osmāni hā Constantinople rā be emperātoori afzoodand va peyvandi rāhbordi miyān e Ooroopā va Ḵāvar e Miyāne sāḵtand. Emperātoori barāye sade hā gostāreš yāft va dar owj be Šomāl e Āfriqā, Ḵāvar e Miyāne va Šarğ e Ooroopā resid, amma dar āšoob e jang e jahāni ye avval dar āğāz e sade ye 20 be šeddat az miyān raft.
Mighty Caliph, your people ask you to build again the Empire, to the level of power and glory it once achieved, and beyond! Will you revive the Ottoman golden age? Will your new empire shine through the ages of history? = Ey Ḵalife ye niroomand, mardomat miḵāhand emperātoori rā dobāre be sath e ğodrat va šokooh e gozašte va farātar az ān besāzi! Āyā asr e talāi ye Osmāni rā zende mikoni? Āyā emperātoori ye jadidat dar asr hāye tāriḵ ḵāhad deraḵšid?
