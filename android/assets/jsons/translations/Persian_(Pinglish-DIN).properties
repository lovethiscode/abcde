In responding to the unstinting malignancy that has heretofore defined your relationship with Canada, we can have no recourse but war! = Dar pāsoḵ be badḵāhi ye bipayān ke tā konoon rābete ye šomā bā Canada rā šekl dāde ast, rāhi joz jang nadārim!
As we can reach no peaceful resolution with you, Canada must turn, with reluctance, to war. = Čon be rāh-hall e solh-āmizi bā šomā nemiresim, Canada nāčār va bā bi-meyli be jang roo miyāvarad.
