Dido = Didoo
Tell me, do you all know how numerous my armies, elephants and the gdadons are? No? Today, you shall find out! = Begooyid, āyā hametān midānid artešhā, filhā va gadādonhāye man čeğadr ziyādand? Na? Emrooz ḵāhid fahmid!
Fate is against you. You earned the animosity of Carthage in your exploration. Your days are numbered. = Sarnevešt bar alayh e tost. Dar kāvošhāyat došmani ye Kārtāž rā kasb kardi. Roožāyat šomārde šode and.
The fates became to hate me. This is it? You wouldn't destroy us so without their help. = Sarnevešthā az man bizār šodand. Hamin ast? Bedoon e komak e ānhā nemitavānesti mā rā in čenin nābood koni.
You aren't meeting my expectations. You can do so much better. = Entezārāt e man rā bar āvarde nemikoni. Mitavāni besyār behtar bāši.
The Phoenicians welcome you to this most pleasant kingdom. I am Dido, the queen of Carthage and all that belongs to it. = Finiğihā be šomā dar in pādešāhi ye besyār delpazir ḵoš āmad migooyand. Man Didoo, malake ye Kārtāž va hame ye dārayihāye ān, hastam.
I just had the marvelous idea, and I think you'll appreciate it too. = Hamin alān andiše ye šegeftangizi be zehnam resid va fekr mikonam to hamān rā ḵoš ḵāhi dāšt.
What is it now? = Halā če šode ast?
Phoenician Heritage = Mirās e Finiği
Greetings to you, revered Queen Dido, ruler of the legendary kingdom of Carthage. The great poet Virgil related your great history, how your husband Acerbas was murdered by your own brother, King Pygmalion of Tyre, to steal the treasures of your family that were rightfully yours. But you endured his pressure until you and your compatriots decided to flee and sail for new lands. The gods led you to the shores of North Africa, and with cunning diplomacy, you expanded the territory of your new home, and laid the basis for the future kingdom of Carthage. = Dorood bar malake ye mohtaram Didoo, farmānravā ye pādešāhi ye afsāne i ye Kārtāž. Šā'er e bozorg Viržil dāstān e bozorgat rā bazgoo kard: čegoone hamsarat Akerbās be dast e barādar e ḵodet, Pādešāh Pigmālion e Soor, košte šod tā ganjhāye ḵāndānat rā ke be hağ az ān e to bood bedozdad. Amma fešār e oo rā tahammol kardi tā ḵod va hammihanānat tasmim gereftid begorizid va be sarzaminhāye tāze safar e daryāyi konid. Ḵodāyān to rā be savāhel e Šomāl e Āfriğā rahnemoon šodand va bā diplomāsi ye hoošmandāne, sarzamin e ḵāne ye jadidat rā gostareš dādi va pāyehāye pādešāhi ye āyande ye Kārtāž rā gozāšti.
Clever and proud Dido, the storm is coming and your people look for a shelter under your wise and powerful protection. Can you create a new and radiant Carthage able to cleave the darkness? Will your new empire shine through the ages of history? = Didooye bā hooš va sarboland, toofān dar rāh ast va mardomat dar zir e hefāzat e ḵeradmand va niroomand e to panāh mijooyand. Āyā mitavāni Kārtāži tāze va deraḵšān besāzi ke tāriki rā beškāfad? Āyā emperātoori ye jadidat dar tool e asrhāye tāriḵ ḵāhad deraḵšid?
