'Only within the moment of time represented by the present century has one species, man, acquired significant power to alter the nature of his world.' - Rachel Carson = «Fağat dar lahze yi az zamān ke sade ye hāzer nemayandegi mikonad, yek goone, ensān, ğodrat e ğābel e tavajjohi barāye tağyir e tabi'at e jahān e ḵod be dast āvarde ast.» - Račel Carson
