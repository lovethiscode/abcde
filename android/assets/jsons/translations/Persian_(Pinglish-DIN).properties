Theodora = Teoodoorā
It is always a shame to destroy a thing of beauty. Happily, you are not one. = Nābood kardan e čizi zibā hamiše afsoos dārad. Ḵošbaḵtāne to zibā nisti.
Now darling, tantrums are most unbecoming. I shall have to teach you a lesson. = Halā azizam, badḵolği aslan berāzande nist. Majbooram darsi be to bedaham.
Like a child playing with toys you are. My people will never love you, nor suffer this indignation gracefully. = Mānand e koodaki hasti ke bā asbāb-bāzi bāzi mikonad. Mardomam hargez doostat naḵāhand dāšt va in tahğir rā bā ārāmeš tahammol naḵāhand kard.
My, isn't this a pleasant surprise - what may I call you, oh mysterious stranger? I am Theodora, beloved of Byzantium. = Oh, če ğāfelgiri ye delpaziri — to rā če benāmam, ey bigāne ye rāzālood? Man Teoodoorā, mahboob e Bizāns, hastam.
I have heard that you adept at certain kinds of ... interactions. Show me. = Šenide am ke dar barḵi az ... barhamkonešhā māheri. Nešānam bede.
Hello again. = Salām e dobāre.
Patriarchate of Constantinople = Patriyārḵnešini ye Ğestantaniye
Magnificent Empress Theodora, beloved of Byzantium and of Rome, your people salute you! With your beauty and intelligence, you rose up from actress and courtesan to the rank of the most powerful woman in the Roman Empire, as wife of Justinian I. In the late 520's AD, you helped your husband engage in spiritual and legal reforms, promugalting numerous laws to improve women's status and treatment in the empire. You also made of Constantinople the jewel of the Eastern Roman Empire with the restoration and construction of many aqueducts, bridges, and churches, its beauty culminating with the creation of the Hagia Sophia, one of the most splendid pieces of architecture in the world. = Emperātorbānoo ye bāšokooh Teoodoorā, mahboob e Bizāns va Room, mardomat be to dorood migooyand! Bā zibāyi va hoošat, az bāzigari va fāhešegi be jāygāh e niroomandtarin zan e Emperātoori ye Room, be onvān e hamsar e Žoostinian e I, residi. Dar avāḵer e dahe ye 520 milādi, be hamsarat dar eslāhāt e ma'navi va hoğooği komak kardi va ğavānin e besyāri barāye behbood e jāygāh va raftār bā zanān dar emperātoori e'lām kardi. Hamčenin bā bāzsāzi va sāḵt e ābrohā, polhā va kelisā hāye besyār, Ğestantaniye rā be gohar e Emperātoori ye Room e Šarği tabdil kardi; zibāyi ye ān bā sāḵt e Ayā Soofyā, yeki az bāšokoohtarin āthār e memāri ye jahān, be ooj resid.
Beautiful Empress,the Byzantine Empire's magnificence is intact in all memories, and ready to reborn as the new jewel of humankind. Will your new empire shine through the ages of history? = Emperātorbānoo ye zibā, šokooh e Emperātoori ye Bizāns dar hame ye yādhā dastnaḵoorde ast va āmāde ast tā be onvān e gohar e jadid e bašariyat dobāre zāde šavad. Āyā emperātoori ye jadidat dar tool e asrhāye tāriḵ ḵāhad deraḵšid?
