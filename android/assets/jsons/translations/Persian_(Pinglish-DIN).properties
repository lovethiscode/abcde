Battle capture counts after combat and the occupation choice finish and the city belongs to you. Trades, gifts, direct liberation to a third party and city destruction do not count. Experience promotions exclude free and starting promotions; normal upgrades preserve the same unit's record. Simultaneous conditions cannot be added across different moments. = Fath e jangi fağat pas az takmil e nabard va enteḵāb e ešğāl va mālikiyat e šahr hesāb mišavad. Tejārat, hadiye, āzādsāzi ye mostağim be taraf e sevvom va nāboodi ye šahr hesāb nemišavand. Erteğā ye tajrobe i, erteğāhāye rāygān va āğāzin rā šāmel nemišavad; behsāzi ye mamooli sābeğe ye hamān niroo rā hefz mikonad. Šarāyet e hamzamān rā nemitavān az lahzehāye moḵtalef jam' kard.
