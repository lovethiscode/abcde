The day...is yours. I hope you will be merciful in your triumph. = Emrooz… az ān e to ast. Omidvāram dar piroozi-at mehrabān bāši.
The people of the United States of America welcome you. = Mardom e Eyālāt e Mottahede ye Āmrikā be šomā ḵoš-āmad migooyand.
Is the following trade of interest to you? = Āyā in tejārat nazarat rā jalb karde ast?
Well? = Ḵob?
Manifest Destiny = Sarnevešt e Āšekār
President Washington, we salute you and the proud American civilization! Freed from the British dominion in the 18th century, then cleansed and reborn after a terrible civil war, the United States nation was ready to play its great role in the 20th century. At the height of its power, triumphant after two terrible world wars, United States of America, a land of immigration, opportunities, optimism and determination, has risen above all other weakening nations, unable to equal such power. = Ey Ra'is-jomhoor Wašington, be to va tamaddon e sarafrāz e Āmrikā dorood miferestim! Pas az rahāyi az solte ye Britāniyā dar sade ye 18, va sepas pākšodan va nowzāyi pas az jangi dāḵeli va vahšatnāk, mellat e Eyālāt e Mottahede āmāde bood nağš e bozorg e ḵod rā dar sade ye 20 ifā konad. Dar owj e ğodrat va pirooz pas az do jang e jahāni ye vahšatnāk, Eyālāt e Mottahede ye Āmrikā, sarzamin e mohājerat, forsat hā, ḵošbini va azm, bar tamām e mellat hāye roobe-za'f ke tavān e barābari bā ān rā nadāštand bartari yāft.
President Washington, will you show to the world the legitimacy of the American way of life, and spread the flame of liberty to all mankind? Will your new empire shine through the ages of history? = Ey Ra'is-jomhoor Wašington, āyā haqāniyat e raveš e zendegi ye Āmrikāyi rā be jahān nešān ḵāhi dād va šo'le ye āzādi rā be hame ye bašar gostāreš ḵāhi dād? Āyā emperātoori ye jadidat dar asr hāye tāriḵ ḵāhad deraḵšid?
