Oda Nobunaga = Oda Nobunaga
I hereby inform you of our intention to wipe out your civilization from this world. = Bedin vasile šomā rā az ğasd e ḵod barāye pāk kardan e tamaddon e šomā az in jahān āgāh mikonam.
Pitiful fool! Now we shall destroy you! = Nādān e tarahhom-angiz! Aknoon nāboodat mikonim!
You were much wiser than I thought. = Besyār dānātar az ān boodi ke fekr mikardam.
I expected more for you from. = Az to entezār e bištari dāštam.
We hope for a fair and just relationship with you, who are renowned for military bravery. = Omidvārim bā šomā, ke be delavari ye nezami šoh-rat dārid, rābete yi monsefāne va ādelane dāšte bāšim.
I would be grateful if you agreed on the following proposal. = Agar bā pišnahād e zir movāfeğat konid sepāsgozār ḵāham bood.
Oh, it's you... = Oh, in toyi...
Bushido = Boošido
Lord Oda Nobunaga, ruler of Japan, the land of the Rising Sun is at your command! Through history, Japanese people lived and died with honor, proud of their rich culture of arts and letters. Years of bloody civil wars, invasions of foreign powers, wealth but also great poverty, have never altered the strong will of the Rising Sun island, as the Bushido spirit has imbued the fields of battle and the Japanese society for millenia. At the end of the 19th century, under foreign influence, your people took the path of modernity, and in a few decades, made of Japan a land of technological innovation and powerful industry, with which only few nations can compete. = Ey Arbāb Oda Nobunaga, farmanravāye Žāpon, sarzamin e Ḵoršid e Tābān dar farman e to ast! Dar tool e tāriḵ, mardom e Žāpon bā šaraf ziste va morde and va be Farhang e ğani ye honar va adabiyāt e ḵod bālide and. Sāl hā jang e dāḵeli ye ḵoonin, hamle ye ğodrat hāye bigāne, servat va hamčenin fağr e šadid hargaz erāde ye niroomand e jazire ye Ḵoršid e Tābān rā tağyir nadād; roohe Bušido hezārān sāl meydan hāye jang va jāmee ye Žāpon rā por karde bood. Dar pāyān e sade ye 19, zire ta'sir e bigāne, mardomat rāh e nowgarāyi rā piš gereftand va dar čand dahe Žāpon rā be sarzamin e now-āvari ye teknoloji va san'at e niroomand tabdil kardand, ke mellat hāye kami tavān e reğābat bā ān rā dārand.
O great daimyo, will you take on your hands the Japan destiny, for the Rising Sun to light the world? Will your new empire shine through the ages of history? = Ey Daimyo ye bozorg, āyā sarnevešt e Žāpon rā dar dast migiri tā Ḵoršid e Tābān jahān rā rošan konad? Āyā emperātoori ye jadidat dar asr hāye tāriḵ ḵāhad deraḵšid?
