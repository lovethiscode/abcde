If I am to be honest, I tire of those pointless charades. Why don't we settle our disputes on the field of battle, like true men? Perhaps the skalds will sing of your valor... or mine! = Rāstaš az in namāyeš hāye bifoode ḵaste am. Čerā eḵtelāf rā dar meydan e jang, mānand e mardān e vāğei, hal nakonim? Šāyad šāerān az delavari ye to… yā man beḵānand!
Ahahah! You seem to show some skills of a true Viking! Too bad that I'll probably kill you! = Hāhāhā! Engār kami maharat e yek Viking e vāğei dāri! Heyf ke ehtemālan to rā ḵāham košt!
Loki must have stood by you, for a common man alone could not have defeated me... Oh well! I will join the einherjar in Valhalla and feast, while you toil away here. = Loki bāyad kenār e to boode bāšad, čon mardi ādi be tanhāyi nemitavānest marā šekast dahad… Besyār ḵoob! Man be Einherjar dar Valhalla mipeyvandam va jašn migiram, dar hāli ke to injā ranj mibari.
Our future battle will be glorious! = Jang e āyande ye mā bāšokooh ḵāhad bood!
Harald Bluetooth bids you welcome to his lands, a Viking unlike any the seas and lands have ever known! Hah, are you afraid? = Harald Bluetooth be to dar sarzaminaš ḵoš-āmad migooyad; Viking i ke daryā hā va ḵoški hā hargaz hamtāyaš rā nadide and! Hā, mitarsi?
This is a fine deal! Even a drunk beggar would agree! = In mo'āmele yi āli ast! Hatta gedāye mast ham movāfeğat mikonad!
Hail to you. = Dorood bar šomā.
Viking Fury = Ḵašt Vāyking hā
Skal, Harald Bluetooth Gormsson, son of King Gorm of the Old and Thyra Dannebod! After crushing the armies of Norway, you achieved great construction projects all across the land of mighty Denmark. Numerous Ring Fortresses were built under your reign to protect the people from foreign invasions, but also from local quarrels. In 983 AD, you successfully repelled several waves of German settlers trying to colonize your land, and then always kept your kingdom free from any foreign pressure. = Skal, Harald Bluetooth Gormsson, pesare Šāh Gorm e Kohan va Thyra Dannebod! Pas az ḵord kardan e arteš hāye Norvež, porože hāye sāḵt e bozorgi dar sar-tāsar e Dānemārk e niroomand anjām dādi. Dež hāye halğe yi ye besyāri dar farmānravāyi-at sāḵte šod tā mardom rā ham az hamle ye bigāne va ham az setize hāye mahalli hefz konad. Dar 983 milādi čand mowj e mohājer e Ālmāni rā ke estemār e sarzaminat rā miḵāstand movaffağāne daf kardi va pas az ān hamiše pādešāhi rā az har fešār e bigāne āzād negāh dāšti.
As a true Viking, who knows not fear, time has come to unleash mighty armies of Northsmen to bring despair upon your enemies! By the will of the Gods, it will be either a glorious triumph or a sumptuous feast in the Valhalla! Will your new empire shine through the ages of history? = Čon Viking i vāğei ke tars nemišenāsad, zamān e raha kardan e arteš hāye niroomand e mardom e šomāl ast tā došmanānt rā nomaid koni! Be ḵāst e ḵodāyān, yā piroozi yi bāšokooh ḵāhad bood yā ziyafati šāhāne dar Valhalla! Āyā emperātoori ye jadidat dar asr hāye tāriḵ ḵāhad deraḵšid?
