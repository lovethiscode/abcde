Maria Theresa = Māriyā Terezā
Shame that it has come this far. But ye wished it so. Next time, be so good, choose your words more wisely. = Afsoos ke kār be injā resid. Amma ḵodet in rā ḵāsti. Bār e ba'ad, lotfan vāžehāyat rā ḵeradmandānetar enteḵāb kon.
What a fool ye are! Ye will end swiftly and miserably. = Čeğadr ahmaği! Be zoodi va bā badbaḵti pāyān ḵāhi yāft.
The world is pitiful! There's no beauty in it, no wisdom. I am almost glad to go. = Jahān tarahhom angiz ast! Na zibāyi dārad, na ḵerad. Kamobiš ḵošhālam ke miravam.
The archduchess of Austria welcomes your Eminence to... Oh let's get this over with! I have a luncheon at four o'clock. = Arčdoks e Otriš be ālijanāb e šomā ḵoš āmad migooyad be... Oh, biyāyid tamāmaš konim! Sā'at e čahār mehmāni ye nāhār dāram.
I see you admire my new damask. Nobody should say that I am an unjust woman. Let's reach an agreement! = Mibinam ke kamḵā ye jadidam rā tahsin mikonid. Hič kas nabāyad begooyad ke man zani bi-ensāfam. Biyāyid be tavāfoğ beresim!
Oh, it's ye! = Oh, ḵodeti!
Diplomatic Marriage = Ezdevāj e Siyāsi
Noble and pious Queen Maria Theresa, Holy Roman Empress and sovereign of Austria, the people revere your grace. After the death of your father King Charles VI, you inherited the throne of Austria during difficult economic and military times. But you used your wisdom and unflinching determination to fend off your foes and resolve any obstacles to stability and prosperity. With your husband Francis Stephen at your side as co-ruler, you assured your place as Empress of the Holy Roman Empire. During your reign, you reformed Austria in several domains, as you gifted it with a powerful army, a stable economic model, and an improved educational system. = Malake ye najib va pārsā Māriyā Terezā, emperātorbānoo ye Room e Moğaddas va farmānravā ye Otriš, mardom az lotfat setāyeš mikonand. Pas az marg e pedarat, Šāh Kārl e VI, dar roozegār e došvār e eğtesādi va nezāmi vāres e taḵt e Otriš šodi. Amma bā ḵerad va erāde ye ḵalalnāpazirat došmanānat rā rāndi va har māne' e sobāt va refāh rā bartaraf kardi. Bā hamsarat Frānsis Estefan dar kenāret be onvān e hamfarmānravā, jāygāhat rā be onvān e emperātorbānoo ye Room e Moğaddas tahkim kardi. Dar tool e farmānravāyi, Otriš rā dar čand zamine eslāh kardi va be ān arteši niroomand, olgoo ye eğtesādi ye pāydār va sāmāne ye āmoozeši ye behtaryāfte baḵšidi.
O Great Queen, proud and dignified, by the will of God and the Divine right, can you reach the height of prosperity and splendor the kingdom of Austria deserves? Will your new empire shine through the ages of history? = Ey malake ye bozorg, sarboland va bā veğār, āyā be ḵāst e Ḵodā va hağ e elāhi mitavāni be ooje refāh va šokoohi beresi ke pādešāhi ye Otriš sazāvār e ān ast? Āyā emperātoori ye jadidat dar tool e asrhāye tāriḵ ḵāhad deraḵšid?
