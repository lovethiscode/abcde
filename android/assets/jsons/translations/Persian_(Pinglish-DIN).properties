'A good rule for rocket experimenters to follow is this: always assume that it will explode.' - Astronautics Magazine, 1937 = «Ğāede ye ḵoob barāye āzmāyeš-garān e moošak in ast: hamiše farz konid ke monfajer ḵāhad šod.» - Majalle ye Astronautics, 1937
