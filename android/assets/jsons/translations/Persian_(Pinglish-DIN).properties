Sun Never Sets = Ḵoršid Hičvağt Ğoroob Nemikonad
Long live to Your Highness, Queen Elizabeth Gloriana, leader and protector of the glorious England! Through history, enduring many invasions, England strengthened its will, playing smartly with diplomacy, cunning, and military power, to eventually rose as one of the most dominant Empires the world has ever known. Their matchless navy, brilliant scientists and artists, and powerful merchants, have shaped the known world for centuries. = Zende bād Āliha-zrat, Malake Elizabeth Gloriana, rahbar va negāhbān e Engelestān e bāšokooh! Dar tool e tāriḵ bā tahammol e hamle hāye besyār, Engelestān erāde ye ḵod rā tağviyat kard va bā siyāsat, ziraki va ğodrat e nezami hoošmandāne amal kard tā sar-anjām be yeki az mosallattarin emperātoori hāye tāriḵ tabdil šod. Nirooye daryāyi ye bi-hamtā, dānešmandān va honarmandān e deraḵšān va bāzargānan e niroomand e ān, jahān e šenāḵte-šode rā barāye sade hā šekl dāde and.
Queen Elizabeth, will England cast once more its brightness upon all lands and seas of the world? Will your new empire shine through the ages of history? = Ey Malake Elizabeth, āyā Engelestān dobāre rošanāyi ye ḵod rā bar hame ye ḵoški hā va daryā hāye jahān ḵāhad tābānd? Āyā emperātoori ye jadidat dar asr hāye tāriḵ ḵāhad deraḵšid?
