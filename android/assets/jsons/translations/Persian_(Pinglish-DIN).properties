We were defeated, so this makes me your prisoner. I suppose there are worse fates. = Mā šekast ḵordim, pas man asir e to hastam. Gomān mikonam sarnevešt hāye badtari ham hast.
Fine then. It's your call. = Besyār ḵoob. Tasmim bā to ast.
I greet you, stranger! If you are as intelligent and tactful as you are attractive, we'll get along just fine. = Dorood, bigāne! Agar be hamān andāze ke jazzāb hasti bāhooš va bātadbir bāši, bā ham besyār ḵoob kenār ḵāhim āmad.
How would you like it if I propose this kind of exchange? = Agar čenin mo'āmele yi pišnahād konam če nazari dāri?
Hello! = Salām!
What do you need?! = Či niyāz dāri?!
Siberian Riches = Servatmandān e Siberiai
Hail to Imperial Majesty Catherine, Empress of all Russians. Living in the largest country in the world, from the Pacific Ocean in the east to the Baltic Sea in the west, your people endured wars, droughts, and many disasters, imbuing the Russian society with heroism and tenacity, and producing artists and scientists among the best in the world. Russia is a powerful empire which rightfully claims its place in the world concert of superpowers. = Dorood bar Āliha-zrat e emperātoori Catherine, Emperātris e hame ye Roos hā. Dar bozorgtarin kešvar e jahān, az Oğyānoos e Ārām dar šarğ tā Daryāye Baltic dar ğarb, mardomat jang hā, ḵošksāli hā va balāyāye besyār rā tahammol karde and; inhā be jāmee ye Roos delavari va pāydāri baḵšide va honarmandān va dānešmandāni az behtarin hāye jahān parvareš dāde ast. Roosiye emperātoori yi niroomand ast ke be hağ jāygāh e ḵod rā dar jam e abarğodrat hāye jahān miḵāhad.
Empress Catherine, your people are eager for Russian glory, to revive the sacred light of the Motherland. Will your new empire shine through the ages of history? = Ey Emperātris Catherine, mardomat moštāğ e šokooh e Roosiye and tā noor e moğaddas e mihan rā dobāre zende konand. Āyā emperātoori ye jadidat dar asr hāye tāriḵ ḵāhad deraḵšid?
