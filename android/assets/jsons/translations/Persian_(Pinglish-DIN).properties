You stand in the way of my armies. Let us solve this like warriors! = Sar e rāh e arteš hāyam istāde i. Biāyid in rā mānand e jangjooyān hal konim!
No more words. Today, Mongolia charges toward your defeat. = Digar harfi nist. Emrooz Moğolestān barāye šekast e to hamle mikonad.
You have hobbled the Mongolian clans. My respect for you nearly matches the loathing. I am waiting for my execution. = Ğabile hāye Moğol rā nātavān kardi. Ehterāmam be to nazdik be nafratam ast. Montazer e e'dāmam hastam.
Your bravery must be commended. = Delavari-at šāyeste ye setayeš ast.
I am Temuujin, conqueror of cities and countries. Before me lie future Mongolian lands. Behind me is the only cavalry that matters. = Man Temuujin, fāteh e šahr hā va kešvar hā, hastam. Dar piš e man sarzamin hāye āyande ye Moğol ast. Pošt e man tanhā savāre-nezām e bā-ahammiyat ast.
I am not always this generous, but we hope you take this rare opportunity we give you. = Hamiše in ğadr baḵšande nistam, amma omidvārim az in forsat e nāder ke midahim estefāde koni.
So what now? = Ḵob hālā či?
Mongol Terror = Tars az Moğol
O great Temuujin, immortal leader of the mighty Mongol Empire! Your name alone was enough to make cities crumble, and the sound of the mighty Mongol cavalry to make your enemies flee! O Great Khan! Once Northern Asia united into a mighty people, producing one of the greatest armies the world has ever known, your skillful mounted archers conquered in only a few years, most of China, Eastern Asia, and even reached the gates of Europe at the West. With cunning diplomacy and brilliant warfare, you swept your enemies one after another, creating the greatest empire ever seen, reducing Roman or Greek conquests to minor achievements. = Ey Temuujin e bozorg, rahbar e jāvdāne ye Emperātoori ye niroomand e Moğol! Tanhā nāmat barāye foroo-paši ye šahr hā kāfi bood va sedāye savāre-nezām e niroomand e Moğol došmanānt rā farrari midād! Ey Ḵān e bozorg! Pas az yek-pārčegi ye Šomāl e Āsiyā be mardomi niroomand va tolid e yeki az bozorgtarin arteš hāye tāriḵ, tirandāzān e savār e māher e to tanhā dar čand sāl bištar e Čin va Šarğ e Āsiyā rā tasḵir kardand va dar ğarb hatta be darvāze hāye Ooroopā residand. Bā siyāsat e zirakāne va jang e deraḵšān, došmanānt rā yeki pas az digari zire pā gozāšti va bozorgtarin emperātoori ye dide-šode rā sāḵti, čonān ke fath hāye Rom yā Yoonān dastāvardi koočak šod.
Divine Temuujin, battles and conquests run through the veins of the Mongols. Are you ready to shatter the will of your enemies? Will your cavalry ride in the steppes once again and strike as lightning and thunder? Will your new empire shine through the ages of history? = Ey Temuujin e ḵodāgoon, jang va fath dar rag hāye Moğol hā jāri ast. Āyā āmāde i erāde ye došmanānt rā beškani? Āyā savāre-nezāmat dobāre dar dašt hā ḵāhad tāḵt va čon ra'd-o-barğ zarbe ḵāhad zad? Āyā emperātoori ye jadidat dar asr hāye tāriḵ ḵāhad deraḵšid?
