#################### Lines from demands #######################


### DontSpyOnUs 

Stop spying on us. = Jāsoosi e mā rā motevağef konid.
We see our people are not welcome in your lands... we will take our attention elsewhere. = Mibinim ke mardom e mā dar sarzamin e šomā estegbāl nemišavand… tavajjoh e ḵod rā be jāye digar mibarim.
I'll do what's necessary for my empire to survive. = Man harče barāye bağāye emperātoori am lāzem bāšad anjām midaham.
Take back your spy and your broken promises. = Jāsoos hā va ğol hāye šekaste at rā bargardān.
[civName] agreed to stop spying on us! = [civName] bā tavaqqof e jāsoosi az mā movāfeğat kard!
[civName] refused to stop spying on us! = [civName] az tavaqqof e jāsoosi az mā sar bāz zad!
We promised not to send spies to them ([turns] turns remaining) = Va'de dādim be ānhā jāsoos naferestim ([turns] nobat bāği ast)
They promised not to send spies to us ([turns] turns remaining) = Ānhā va'de dādand be mā jāsoos naferestand ([turns] nobat bāği ast)

### DoNotSpreadReligion 

Please don't spread your religion to us. = Lotfan dinetān rā beyn e mā paḵš nakonid.
Very well, we shall spread our faith elsewhere. = Ḵeyle ḵob, behtare dinemān rā jāye digari paḵš konim.
We shall do as we please. = Mā har kāri delemān beḵāhad anjām midahim.
We noticed you have continued spreading your religion to us, despite your promise. This will have....consequences. = Motavajjeh šodim ke bā vojood e va'de, be gostāreš e din e ḵod be mā edāme dāde id. In… payāmad ḵāhad dāšt.
[civName] agreed to stop spreading religion to us! = [civName] bā tavaqqof e gostāreš e din be mā movāfeğat kard!
[civName] refused to stop spreading religion to us! = [civName] az tavaqqof e gostāreš e din be mā sar bāz zad!
We promised not to spread religion to them ([turns] turns remaining) = Va'de dādim din rā be ānhā gostāreš nadahim ([turns] nobat bāği ast)
They promised not to spread religion to us ([turns] turns remaining) = Ānhā va'de dādand din rā be mā gostāreš nadahand ([turns] nobat bāği ast)

### DoNotSettleNearUs 

Please don't settle new cities near us. = Lotfan nazdik e mā šahr jadid nasāzid.
Very well, we shall look for new lands to settle. = ḵeyle ḵob, mā donbāl e zamin hāye jadid barāye mostağar šodan ḵāhim gašt.
We noticed your new city near our borders, despite your promise. This will have....implications. = Mā motevajje šodim alā-rağm e ğoli ke dādid nazdik e marz hāye mā šahr sāḵte id. In... payāmad hāyi ḵāhad dāšt.
[civName] agreed to stop settling cities near us! = [civName] ğabool kard ke nazdik e mā šahr nasāzad!
[civName] refused to stop settling cities near us! = [civName] ğabool nakard ke nazdik e mā šahr nasāzad!
We promised not to settle near them ([turns] turns remaining) = Ma peyman bastim ke nazdik anha šahr nasazim ([turns] nobat bağimande)
They promised not to settle near us ([turns] turns remaining) = Anha peyman bastand ke nazdik e ma šahr e jadid nasazand ([turns] nobat bağimande)

### DoNotAttackUs 

We have noticed substantial military activity near our borders. How should we interpret this? = Fa'āliyat e nezami ye ğābel e tavajjohi nazdik e marz hāye ḵod dide im. In rā čegoone tafsir konim?
Do not worry. Our soldiers are merely passing by. = Negarān nabāšid. Sarbāzān e mā fağat dar hāl e oboorand.
Our military stands ready to finish what diplomacy could not! (DECLARE WAR) = Arteš e mā āmāde ast ānče rā siyāsat natavānest be pāyān beresānad! (E'LĀM E JANG)
