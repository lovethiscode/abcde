尚无符合条件的解放归还记录。 = Āzādsāzi va bāzgardāni ye vājed e šarāyet sabt našode.
本关发生归属中断，可在后续关卡重新尝试。 = Mālikiyat ğat' šod; dar marhale ye ba'di dobāre talāš konid.
三城连续归属观察中，按时完成本关后核对。 = Mālikiyat e peyvaste zir e nazar ast; dar takmil e be moğe' e marhale barrasi mišavad.
达到三城容量并在首波前建立三城，可在后续关卡尝试。 = Zarfiyat e se šahr rā bāz va piš az mowj e avval e yek marhale ye āyande, se šahr dāšte bāšid.
把长期发展转化为完整终局，纪念第一次亲自完成一场胜利。 = Tose'e ye bolandmoddat rā be pāyān e kāmel beresānid va naḵostin piroozi rā gerāmi bedārid.
选择第二座城的位置，在资源、地形和扩张成本之间作第一次取舍。 = Makān e šahr e dovvom rā enteḵāb va manābe, zamin va hazine ye gostareš rā mota'ādel konid.
第一次为文明选择发展方向，感受政策带来的长期差异。 = Barāye tamaddon jahat enteḵāb va āthār e pāydār e siyāsathā rā kašf konid.
协调两座城市的生产与黄金时代时机；争夺奇观的风险，让排期本身成为决策。 = Tolid e do šahr rā bā zamānbandi ye Asr e Talāi hamāhang konid. Reğābat e ojoobehā, zamānbandi rā be enteḵāb e rāhbordi tabdil mikonad.
围绕一座奇观安排科技和生产，体验与其他文明争夺同一目标。 = Fannāvari va Tolid rā pirāmoon e yek ojoobe barnāmerizi va barāye sāḵt e ān bā tamaddonhā reğābat konid.
认识移动、攻击与生存的基本关系，获得第一次真实交锋的反馈。 = Az naḵostin nabard e vāğe'i, hamāhangi ye harekat, hamle va zende māndan rā biyāmoozid.
把地图上的土地变成实际产出，理解工人与城市发展的关系。 = Zamin rā porbāzde konid va biyāmoozid Kāregar čegoone az tose'e ye šahr poštibāni mikonad.
把分散的城市组织成网络，选择道路、海港或两者组合，而非只追求城市数量。 = Be jāye fağat šomār e šahr, bā jādde, Bandar yā har do, šahrhāye parākande rā be šabake vasl konid.
让粮食、人口与教育设施相互支持，形成一座有清楚用途的学术中心。 = Ğazā, jam'iyat va sāḵtemānhāye āmoozeši rā barāye markazi viže ye yādgiri tarkib konid.
比较不同城邦类型的收益，决定把有限外交投入放在哪里。 = Sood e anvā' e Šahr-dowlat rā moğāyese va tasmim begirid manābe e mahdood e diplomatik rā kojā sarmayegozāri konid.
把创教转为本土社会的共同信仰，体验城市布局、自然传播和主动传教的配合。 = Bā tarkib e makān e šahr, gostareš e tabi'i va tağyir e din e fa'āl, din e ḵod rā dar mihan begostarānid.
在未知地图中获得发现的惊喜。作为自然探索纪念，不要求为三处奇观反复重开。 = Az kašf dar nağše ye nāšenāḵte lezzat bebarid. In hadaf e kāvoš be āğāz e tekrāri barāye yāftan e se ojoobe niyāz nadārad.
以有限城市投入科研，依靠质量和发展效率完成太空目标。允许防卫战争，限制的是指定战斗占城。 = Tedād e mahdoodi šahr rā bar pažooheš e kārā barāye residan be fazā motemarkez konid. Jang e defā'i mojāz ast; mahdoodiyat marboot be fathhāye nezāmi ye mošaḵḵas ast.
在有限城市规模下集中积累文化，安排政策、建设与胜利项目的先后。 = Farhang rā dar emperātoori ye koočak motemarkez va tartib e siyāsat, sāḵtemān va porože ye piroozi rā barnāmerizi konid.
改变扩张来源：不继续自行建城，以军事实力和占领后的管理建立帝国。 = Be jāye bonyan e šahrhāye bištar, bā fath gostareš yābid va bā ğodrat e nezāmi va modiriyat e šahr emperātoori besāzid.
用有限城市支撑政策专精，选择两条适合当前战略的政策路线。 = Bā tedād e mahdoodi šahr, tose'e ye motemarkez e siyāsat rā poštibāni va do šāḵe ye monāseb e rāhbord enteḵāb konid.
围绕外国首都组织宗教影响力，选择传播对象与时机，承担跨国竞争。 = Pirāmoon e pāytaḵt e bigāne nofooz e dini besāzid va dar reğābat e beynolmelali makān va zamān e gostareš rā enteḵāb konid.
利用埃及建造优势，把一座城市经营成奇观中心，在科技、生产与抢建风险之间取舍。自选重投入专项。 = Az bartari ye sāḵt e Mesr estefāde konid tā yek šahr markaz e ojoobehā šavad; pažooheš, Tolid va reğābat rā mota'ādel konid. In čāleš eḵtiyāri va niyāzmand e sarmayegozāri ye bozorg ast.
预先协调多条战线和占城部队，让几场局部战斗汇成同一回合的战略突破。 = Čand jebhe va asir kardan e niroohā rā hamāhang konid tā nabardhāye jodā dar yek nobat be šekast e rāhbordi ye došman tabdil šavand.
围绕波斯黄金时代的持续时间与战斗优势准备攻势，在有效窗口集中兑现实力。自选进阶专项。 = Bā tavajjoh be moddat va bartarihāye jangi ye Asr e Talāi ye Iran, tahājom āmāde konid. In čāleš e pišrafte eḵtiyāri ast.
用小国规模应对更高难度，挑选一条适合的非时间胜利路线，而非依靠不断扩张。 = Bā emperātoori ye koočak bā došvāri ye bālātar rooberoo va be jāye gostareš e dāyemi, masir e piroozi ye ğeyr e Zamāni ye monāseb enteḵāb konid.
检验对整体战略、时机和局势判断的掌握；是玩家主动选择的高手目标。 = Tasallot e ḵod bar rāhbord, zamānbandi va vaz'iyat rā biyāzmāyid. In čāleš e herfe i eḵtiyāri ast.
让唯一城市承担科研、经济与防卫，寻找单城条件下的完整发展解法。 = Yek šahr rā barāye pažooheš, eğtesād va defā' be kār bebarid va dar in mahdoodiyat rāhbord e kāmel besāzid.
主动放弃世界奇观这条优势来源，探索政策、城市发展与文化胜利之间的其他组合。 = Az Ojoobehāye Jahāni sarf e nazar va rāhhāye digar e tarkib e siyāsat, tose'e ye šahr va piroozi ye farhangi rā kāvoš konid.
