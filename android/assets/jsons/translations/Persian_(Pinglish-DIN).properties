You are but a pest on this Earth, prepare to be eliminated! = To tanhā āfati rooye in zamin hasti; barāye nāboodi āmāde bāš!
You are a fool who evokes pity. You have brought my hostility upon yourself and your repulsive civilization! = To nādāni tarahhom-angiz hasti. Došmani ye man rā bar ḵod va tamaddon e nafrat-angiz e ḵod barāngizooḵti!
Strike me down and my soul will torment yours forever, you have won nothing. = Marā bekoš va roohe man tā abad roohe to rā āzār ḵāhad dād; to hič naborde i.
Greetings, I am Ramesses the god. I am the living embodiment of Egypt, mother and father of all civilizations. = Dorood, man Ramesses e ḵodā hastam. Man tajassom e zende ye Mesr, mādar va pedar e hame ye tamaddon hā, hastam.
Generous Egypt makes you this offer. = Mesr e seḵāvatmand in pišnahād rā be šomā midahad.
Good day. = Rooz beḵeyr.
Oh, it's you. = Oh, in toyi.
Monument Builders = Sāzandegan e Āsār e Yādbood
O great Ramesses, Pharaoh of Egypt, bright as the Sun and mighty as the Nile! Lord of all living things, you lead the greatest of all civilizations, which has gifted the world with writing, advanced mathematics, sculpture, and architecture. Egyptian monuments and culture will continue to amaze the world for thousands of years. = Ey Ramesses e bozorg, Fara'on e Mesr, rošan čon ḵoršid va niroomand čon Nil! Sarvare hame ye jāndarān, to bozorgtarin tamaddon rā rahbari mikoni, ke neveštār, riyāziyāt e pišrafte, peykartarāši va me'māri rā be jahān hediye karde ast. Yādbood hā va Farhang e Mesr hezārān sāl jahān rā be šegefti ḵāhad āvard.
Mighty and eternal Ramesses, Egypt lasted for millenia, whereas other civilisations disappeared into dust after a few centuries. Amun-Ra blesses you again to lead Egypt and its people on the path of light. Will your new empire shine through the ages of history? = Ey Ramesses e niroomand va jāvdān, Mesr hezārān sāl pāyid, dar hāli ke tamaddon hāye digar pas az čand sade be ḵāk tabdil šodand. Amun-Ra dobāre to rā barakat midahad tā Mesr va mardomaš rā dar rāh e rošanāyi rahbari koni. Āyā emperātoori ye jadidat dar asr hāye tāriḵ ḵāhad deraḵšid?
