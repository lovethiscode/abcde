Darius I = Daryooš I
Your continue existence is an embarrassment to all leaders everywhere! You must be destroyed! = Edāme ye vojood e šomā barāye hame ye rahbarān dar har jā šarm-āvar ast! Bāyad nābood šavid!
Curse you! You are beneath me, son of a donkey driver! I will crush you! = La'nat bar to! Az man pasti, ey pesare ḵarbān! To rā ḵord ḵāham kard!
You mongrel! Cursed be you! The world will long lament your heinous crime! = Dorage! La'nat bar to! Jahān tā moddat hā barāye jenāyat e nafrat-angiz e to soogvāri ḵāhad kard!
Peace be on you! I am Darius, the great and outstanding king of kings of great Persia... but I suppose you knew that. = Dorood bar to! Man Dāryooš, šāhanšāh e bozorg va barjaste ye Iran e bozorg hastam… amma gomān mikonam in rā midānesti.
In my endless magnanimity, I am making you this offer. You agree, of course? = Dar baḵšandegi ye bipayān e ḵod in pišnahād rā midaham. Albatte movāfeği?
Good day to you! = Roozat beḵeyr!
Ahh... you... = Āoo... to...
Achaemenid Legacy = Mirās e Haḵāmaneši
Great King Darius of Persia, the heaven casts its light upon you! Persian people are strong and wise, as their leader. In old ages, the great Persian king Cyrus fought back the mighty Median empire and finally destroyed the Medes in 550 BC. Cunning diplomacy and military achievements helped then to conquer the wealthy Lydia and the powerful Babylon, Cyrus' son conquering the eternal Egypt some years later. At the height of its power, the Persian Empire reached the shores of Macedonia, at the very door of the upstart Greek city-states. Persia would have prospered for centuries if Alexander of Macedon hadn't brutally destroyed the great empire in one violent strike. = Ey Šāh e bozorg Dāryooš e Iran, āsemān noor e ḵod rā bar to mitāband! Mardom e Iran hamčon rahbar e ḵod niroomand va dānā and. Dar roozgāre kohan, Šāh e bozorg e Iran Koorooš bā emperātoori ye niroomand e Mād jangid va sar-anjām dar 550 piš az milādi Mād hā rā nābood kard. Siyāsat e zirakāne va dastāvard hāye nezami sepas be tasḵir e Lydia ye servatmand va Bābel e niroomand komak kard; pesare Koorooš čand sāl bād Mesr e jāvdān rā tasḵir kard. Dar owj e ğodrat, Emperātoori ye Iran be sāhel hāye Macedonia, dorost be darvāze ye šahr-dowlat hāye nowḵ-āste ye Yoonāni, resid. Iran mitavānest barāye sade hā ronāğ yābad agar Alexander e Macedon ān emperātoori ye bozorg rā bā yek zarbe ye ḵošoonatbār nābood nakarde bood.
King Darius, the people of Persia await, longing for its past glory and power! Persia of the Immortals must reborn, to punish its foes and rebuild the gleaming Persepolis! Will your new empire shine through the ages of history? = Ey Šāh Dāryooš, mardom e Iran moštāğ e šokooh va ğodrat e gozašte montazerand! Iran e Jāvdānān bāyad dobāre zāde šavad tā došmana-naš rā keifar dahad va Persepolis e deraḵšān rā besāzad! Āyā emperātoori ye jadidat dar asr hāye tāriḵ ḵāhad deraḵšid?
