Otto von Bismarck = Otto von Bismarck
I cannot wait until ye grow even mightier. Therefore, prepare for war! = Nemitavānam sabr konam tā hanooz niroomandtar šavi. Pas barāye jang āmāde bāš!
Corrupted villain! We will bring you into the ground! = Tabahkār e fāsed! To rā bā ḵāk yeksān mikonim!
Germany has been destroyed. I weep for the future generations. = Ālmān nābood šod. Barāye nasl hāye āyande migeryam.
That wild bravado? It's a ticking time bomb, especially when you're all bark and no bite! = Ān lāf e gostāḵāne? Yek bomb e sāti ast, be viže vağti hame aš harf ast va amal nadārad!
Guten Tag. In the name of the great German people, I bid you welcome. = Rooz beḵeyr. Be nām e mardom e bozorg e Ālmān, be šomā ḵoš-āmad migooyam.
It would be in your best interest, to carefully consider this proposal. = Be sood e šomā ast ke in pišnahād rā bā değat barrasi konid.
What now? = Hālā či?
So, out with it! = Pas begoo!
Furor Teutonicus = Ḵašm e Ālmāni
All hail to Otto von Bismarck, first chancellor of Germany and its empire! During the ancient era, Germany was a land fragmented in several tribes but already showed great promise as the Roman Empire itself struggled to bend the Germans to its will. Germany, as one nation, was slowly built on the ruins of the Holy Roman Empire, and waited 1871 to be finally unified after the glorious victory on France and Napoleon III. The German people are creative, intelligent, industrious and proven to be talented warriors through history. Despite great catastrophes and failures in the first half of the 20th century, Germany can always rely on its people will and strength to be among the greatest and powerful nations in the world. = Dorood bar Otto von Bismarck, avvalin sadr e a'zam e Ālmān va emperātoori ye ān! Dar asr e bāstān, Ālmān sarzamini parākande dar čand ğabile bood, amma az hamān zamān nešane hāye bozorgi dāšt: hatta Emperātoori ye Rom barāye motii kardan e Ālmāni hā saḵt talāš mikard. Ālmān be onvān e yek mellat āheste bar virāne hāye Emperātoori ye Moğaddas e Rom sāḵte šod va tā 1871 montazer mānd tā pas az piroozi ye bāšokooh bar Farānse va Napoleon III sar-anjām yeki šavad. Mardom e Ālmān ḵallāğ, bāhooš va saḵtkooš and va dar tāriḵ jangjooyāni bā-este'dād boode and. Bā vojood e balāyā va šekast hāye bozorg dar nime ye avval e sade ye 20, Ālmān hamiše mitavānad bar erāde va ğodrat e mardom e ḵod teki-ye konad tā az bozorgtarin va niroomandtarin mellat hāye jahān bāšad.
Great Prince Bismarck, glory and power are at the heart of the German nation. Your people are bright, and lend you their iron will to lead Germany once again. Will your new empire shine through the ages of history? = Ey Šāhzāde ye bozorg Bismarck, šokooh va ğodrat dar ğalb e mellat e Ālmān ast. Mardomat bāhooš and va erāde ye āhanin e ḵod rā be to misepārand tā Ālmān rā dobāre rahbari koni. Āyā emperātoori ye jadidat dar asr hāye tāriḵ ḵāhad deraḵšid?
