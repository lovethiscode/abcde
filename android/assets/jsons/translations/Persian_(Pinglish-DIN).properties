Hiawatha = Hiawatha
You are a plague upon Mother Earth! Prepare for battle! = Šomā balāyi bar Mādar e Zamin hastid! Barāye jang āmāde šavid!
You evil creature! My braves will slaughter you! = Maḵlooğ e šarir! Delavarānam šomā rā ḵāhand košt!
You have defeated us... but our spirits will never be vanquished! We shall return! = Mā rā šekast dādi… amma rooh hāye mā hargaz mağloob nemišavand! Bāz ḵāhim gašt!
Words alone cannot shake the roots of peace I have planted among my people. = Harf e tanhā nemitavānad riše hāye solhi rā ke miyān e mardomam kāšte am belarzānad.
Greetings, stranger. I am Hiawatha, speaker for the Iroquois. We seek peace with all, but we do not shrink from war. = Dorood, bigāne. Man Hiawatha, soḵangooye Iroquois hastam. Bā hame solh miḵāhim, amma az jang nemiharāsim.
Does this trade work for you, my friend? = Doost e man, in mo'āmele barāyat soodmand ast?
The Great Warpath = Jangjooye Bozorg
Greetings, noble Hiawatha, leader of the mighty Iroquois nations! Your people lived near the great and holy lake Ontario since the ancient ages, on a land that will be later known as New York city. Long ago, the five peoples of Seneca, Onondaga, Mohawks, Cayugas and Oneida became one nation, the Haudenosaunee, the Iroquois. Although not having a written language, the wise Iroquois created the Great Law of Peace, which can be considered the first established constitution. For decades, your people fought powerful enemies, such as the Huron, and then the French and English colonists. With less warriors and inferior weaponry, the Iroquois still survived and walk on the path of peace and harmony, until their way of living faded away under the crush of the newborn United States nation. = Dorood, Hiawatha ye najib, rahbar e mellat hāye niroomand e Iroquois! Mardomat az asr hāye bāstāni nazdik e daryāče ye bozorg va moğaddas e Ontario, rooye sarzamini ke bādan New York nām gereft, zendegi mikardand. Dar roozgāre door, panj mellat e Seneca, Onondaga, Mohawks, Cayugas va Oneida yek mellat šodand: Haudenosaunee yā Iroquois. Bā ān ke zabān e neveštāri nadāštand, Iroquois e dānā Ğanoon e Bozorg e Solh rā āfaridand, ke mitavān ān rā noḵostin ğanoon e asāsi dānest. Barāye dahe hā, mardomat bā došmanān e niroomandi čon Huron va sepas mostamerečiyan e Farānsavi va Engelisi jangidand. Bā jangjooyān e kamtar va aslehe ye za'iftar, Iroquois hanooz pāyidand va rāh e solh va hamāhangi rā raftand, tā raveš e zendegi ye ānhā zire fešār e mellat e nowzāde ye Eyālāt e Mottahede kamrang šod.
Great Sachem Hiawatha, do you hear the complaints of your people? Can you light the path leading to the ancient Iroquois union? Will your new empire shine through the ages of history? = Ey Sāčem e bozorg Hiawatha, āyā šekāyat e mardomat rā mišenavi? Āyā mitavāni rāh e ettehād e bāstāni ye Iroquois rā rošan koni? Āyā emperātoori ye jadidat dar asr hāye tāriḵ ḵāhad deraḵšid?
