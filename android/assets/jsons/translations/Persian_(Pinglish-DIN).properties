Attila the Hun = Ātilāye Hoon
I grow tired of this throne. I think I should like to have yours instead. = Az in taḵt ḵaste mišavam. Fekr mikonam taḵt e to rā be jāye ān beḵāham.
Now what is this?! You ask me to add your riches to my great avails. The invitation is accepted. = Halā in digar čist?! Az man miḵāhi servatat rā be darāmadhāye bozorgam ezāfe konam. Da'vat pazirofte šod.
My people will mourn me not with tears, but with human blood. = Mardomam na bā ašk, balke bā ḵoon e ensān barāyam azādāri mikonand.
Do you know who you're dealing with? = Midāni bā če kasi taraf hasti?
You are in the presence of Attila, scourge of Rome. Do not let hubris be your downfall as well. = Dar hozoor e Ātila, balāye Room, hasti. Nagzār ğoroor to rā ham be zamin bezanad.
This is better than you deserve, but let it not be said that I am an unfair man. = In behtar az čizi ast ke sazāvāri, amma nabayad begooyand ke man mard e bi-ensāfi hastam.
Good day to you. = Roozetān ḵoš.
Scourge of God = Tāziyāne ye Ḵodā
Great Attila, mighty warrior and leader of the Hunnic empire, your men bow down before you. During the 5th century, you and your brother Bleda have conquered many lands, forged a mighty empire and commanded the most powerful and frightening force of antiquity. You inspired fear to the Roman Emperors themselves, who called you 'Flagellum Dei', the 'Scourge of God', as you took kingdom after kingdom in the Balkans, invaded Eastern Roman Empire, into Gaul and Northern Italy, and planned to conquer Rome itself. Your empire didn't survive long after your death, but your name and your legend have, for millenia to come. = Ātilāye bozorg, jangāvar e niroomand va rahbar e emperātoori ye Hoon, mardānat dar barābarat sar ḵam mikonand. Dar sade ye 5, to va barādarat Bleda sarzaminhāye bisyāri rā fath kardid, emperātoori ye niroomandi sāḵtid va niroomandtarin va tarsnāktarin niroo ye roozegār e bāstān rā farmāndehi kardid. Hatta emperātoorān e Room rā tarsāndi; ānhā to rā «Flagellum Dei», «Tāziyāne ye Ḵodā», mināmidand, čerā ke pādešāhihā ye Balkan rā yeki pas az digari gerefti, be Emperātoori ye Room e Šarği, Gol va Šomāl e Itāliā hamle kardi va ğasd e fath e ḵod e Room rā dāšti. Emperātoori at pas az margat ziyād davām nayāvard, amma nām va afsāne at barāye hezārehāye ba'adi bāği mānd.
Fearsome General, your mighty hordes are at your command, waiting to crush your foes once again and to conquer all the riches the world has to offer! Will your new empire shine through the ages of history? = Sardār e vahšat-āvar, ordoohāye niroomandat dar farmān e to hastand, montazerand tā dobāre došmanānat rā dar ham beškanand va hame ye servati rā ke jahān arze mikonad fath konand! Āyā emperātoori ye jadidat dar tool e asrhāye tāriḵ ḵāhad deraḵšid?
