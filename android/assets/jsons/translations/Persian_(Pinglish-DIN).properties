Tutorial Task: [Move unit] = Tamrin e āmoozeši: [Move unit]
Move a unit! = Yek niroo rā harekat dahid!
Click on a unit → Click on a destination → Click the arrow popup. = Rooye yek niroo bezanid → Rooye mağsad bezanid → Rooye panjare ye peykān bezanid.

Found a city! = Yek šahr besāzid!
Select the Settler → Click on 'Found city'. = Šahraknešin rā enteḵāb konid → Rooye «Sāḵt e šahr» bezanid.

Enter the city screen! = Vāred e safhe ye šahr šavid!
Click the city button twice. = Dokme ye šahr rā do bār bezanid.

Pick a technology to research! = Yek fannāvari barāye pažooheš enteḵāb konid!
Click on the tech button → Select technology → Click 'Research' (bottom right). = Rooye dokme ye fannāvari bezanid → Fannāvari rā enteḵāb konid → Rooye «Pažooheš» dar pāyin e rāst bezanid.

Pick a construction! = Yek sāḵt-o-sāz enteḵāb konid!
Enter city screen → Click on a unit or building → Click 'add to queue'. = Vāred e safhe ye šahr šavid → Rooye yek niroo yā sāḵtemān bezanid → Rooye «Ezāfe kardan be saf» bezanid.

Pass a turn! = Yek nobat rā begzarānid!
Cycle through units with 'Next unit' → Click 'Next turn'. = Bā «Niroo ye ba'adi» beyne niroohā begardid → Rooye «Nobat e ba'adi» bezanid.

Reassign worked tiles! = Zaminhāye kāršode rā dobāre taḵsis dahid!
Enter city screen → Click the assigned tile to unassign → Click an unassigned tile to assign population. = Vāred e safhe ye šahr šavid → Barāye hazf e taḵsis, rooye zamin e taḵsisyāfte bezanid → Barāye taḵsis e jam'iyat, rooye yek zamin e āzād bezanid.

 # Requires translation!
Got it = Motavajjeh šodam
Meet another civilization! = Bā tamaddon e digari āšnā šavid!
Explore the map until you encounter another civilization! = Nağše rā kāvoš konid tā bā tamaddon e digari rooberoo šavid!

Open the options dialog! = Panjare ye tanzimāt rā bāz konid!
Click the menu button (top left) → Click 'Options'. = Dokme ye fehrest dar bālā ye čap rā bezanid → Rooye «Tanzimāt» bezanid.

Construct an improvement! = Yek behsāzi besāzid!
Construct a Worker unit → Move it to a Plains or Grassland tile → Click 'Construct improvement' → Choose the farm → Leave the worker there until it's finished. = Yek Kāregar besāzid → Ān rā be zamin e Dašt yā Alafzār bebarid → Rooye «Behbood baḵšidan» bezanid → Mazra'e rā enteḵāb konid → Kāregar rā ānjā negah dārid tā kār tamām šavad.

Create a trade route! = Yek masir e tejāri besāzid!
Construct roads between your capital and another city. Or, automate your worker and let him get to that eventually. = Beyne pāytaḵt va šahr e digar jādde besāzid. Yā kāregar rā ḵodkār konid tā saranjām in kār rā anjām dahad.

Conquer a city! = Yek šahr rā fath konid!
Bring an enemy city down to low health → Enter the city with a melee unit. = Salāmati ye šahr e došman rā kam konid → Bā yek niroo ye nazdikzan vāred e šahr šavid.

Move an air unit! = Yek niroo ye havāyi rā harekat dahid!
Select an air unit → Select another city within range → Move the unit to the other city. = Yek niroo ye havāyi enteḵāb konid → Šahr e digari dar bord rā enteḵāb konid → Niroo rā be šahr e digar bebarid.

See your stats breakdown! = Joziyāt e āmār e ḵod rā bebinid!
Enter the Overview screen (top right corner) → Click on 'Stats'. = Vāred e safhe ye moroor dar gooše ye bālā ye rāst šavid → Rooye «Āmār» bezanid.


