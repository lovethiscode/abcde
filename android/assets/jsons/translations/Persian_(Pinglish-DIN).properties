Askia = Askia
You are an abomination to heaven and earth, the chief of ignorant savages! You must be destroyed! = To nafrin e āsemān va zamin, sarvare vahši hāye nādān hasti! Bāyad nābood šavi!
Fool! You have doomed your people to fire and destruction! = Nādān! Mardomat rā be ātaš va virāni mahkoom kardi!
We have been consumed by the fires of hatred and rage. Enjoy your victory in this world - you shall pay a heavy price in the next! = Ātaš e nafrat va ḵašm mā rā bal'ide ast. Dar in jahān az piroozi-at lezzat bebar; dar jahān e bād hazine ye sangini ḵāhi pardāḵt!
This insult shall cost you. = In tohin barāyat gerān tamām ḵāhad šod.
I am Askia of the Songhai. We are a fair people - but those who cross us will find only destruction. You would do well to avoid repeating the mistakes others have made in the past. = Man Askia az Sonğai hastam. Mā mardomi monsef hastim, amma ānhā ke bā mā dar-oftand tanhā virāni ḵāhand yāft. Behtar ast eštebāh hāye gozašte ye digarān rā tekrār nakoni.
Can I interest you in this deal? = Mitavānam šomā rā be in mo'āmele alāğemand konam?
River Warlord = Sepahbod e Daryā hā
Askia, leader of the Songhai people and greatest of all, may God watch your path towards glory! Songhai was under the rule of the mighty West African state of Mali until the middle of the 14th century. Great King Sunni Ali Ber fought for independance, and showed to all Songhai's power, by conquering territories and repelling many foes who sought to destroy the rising kingdom. Ultimately, conquest of the wealthy cities of Timbuktu and Jenne made Songhai an empire with enough economic power to survive for a century, until the empire bowed down before foes with advanced technology - muskets against spearmen. = Ey Askia, rahbar e mardom e Sonğai va bozorgtar az hame, Ḵodā negāhbān e rāh e to be šokooh bād! Sonğai tā miyāne ye sade ye 14 zire hokoomat e dowlat e niroomand e Māli dar Ğarb e Āfriqā bood. Šāh e bozorg Sunni Ali Ber barāye esteğlāl jangid va bā tasḵir e sarzamin hā va daf e došmanān e besyāri ke nāboodi ye pādešāhi ye dar hāl e rošd rā miḵāstand, ğodrat e Sonğai rā be hame nešān dād. Sar-anjām tasḵir e šahr hāye servatmand e Timbuktu va Jenne, Sonğai rā be emperātoori yi bā ğodrat e eğtesādi ye kāfi barāye yek sade bağā tabdil kard, tā vağti dar barābar e došmanāni bā teknoloji ye pišrafte sar ḵam kard: tofang hā dar barābar e neyzedār hā.
King Askia, your people know there's still hope, that the hour of revenge is coming. Give them wealth and power, give them mighty weapons of iron and fire, to destroy any foe, for Songhai to revive! Will your new empire shine through the ages of history? = Ey Šāh Askia, mardomat midānand hanooz omid hast va zamān e enteğām miresad. Be ānhā servat va ğodrat bede, selāh hāye niroomand e āhan va ātaš bede tā har došmani rā nābood konand va Sonğai zende šavad! Āyā emperātoori ye jadidat dar asr hāye tāriḵ ḵāhad deraḵšid?
