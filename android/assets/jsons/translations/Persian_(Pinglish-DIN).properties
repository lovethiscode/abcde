原创战役共有四章十六关。每关至少获得一颗星，解锁下一关。\n完成本章获得章节完成记录；全部三星可获得精通勋章。\n各关的局势与目标独立，已通关关卡可反复挑战。 = Kārzār e asli čahār fasl va šānzdah ma'mooriyat dārad. Hadd ağal yek setāre begirid tā ma'mooriyat e ba'adi bāz šavad.\nFasl rā takmil konid tā pišraft sabt šavad; hame ye setārehā rā barāye medāl e ostādi begirid.\nHar ma'mooriyat vaz'iyat va hadafhāye ḵod rā dārad. Ma'mooriyathāye takmilšode ğābel e tekrar hastand.
让第一座城，在河谷中生根。 = Bogzārid naḵostin šahr dar darre riše begirānad.
越过边境，建立繁荣的国家。 = Az marz bogzarid va mellati ābād besāzid.
从第一场交锋，到夺取要塞。 = Az naḵostin dargiri tā fath e yek dež.
把你的策略，连成完整的胜利。 = Rāhbord rā barāye piroozi yekpārče konid.
