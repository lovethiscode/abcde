Gandhi = Gāndi
I have just received a report that large numbers of my troops have crossed your borders. = Hamin al-ān gozāreš resid ke tedād e ziyādi az sarbāzānam az marz hāye šomā gozašte and.
My attempts to avoid violence have failed. An eye for an eye only makes the world blind. = Talāš hāyam barāye parhiz az ḵošoonat nākām mānd. Češm dar barābar e češm fağat jahān rā koor mikonad.
You can chain me, you can torture me, you can even destroy this body, but you will never imprison my mind. = Mitavāni be zanjiram bekeši, šekanje am koni va hatta in tan rā nābood koni, amma hargaz zeh-nam rā zendāni naḵāhi kard.
Curious. = Jāleb ast.
Hello, I am Mohandas Gandhi. My people call me Bapu, but please, call me friend. = Salām, man Mohandas Gandhi hastam. Mardomam marā Bapu mināmand, amma lotfan marā doost ḵitāb kon.
My friend, are you interested in this arrangement? = Doost e man, be in tavāfoğ alāğe dāri?
I wish you peace. = Barāyat solh ārezoo mikonam.
Population Growth = Rošd e Jame’iat
Wise Mahatma Gandhi, great leader of India, we honor you! India is one of the oldest countries in the world with 10,000 years of history, built on spirit and religion, as three of the world's great religions - Hinduism, Buddhism and Jainism - appeared on this sacred land. Every aspect of India society reveres art, music and color, showing great wealth but also grinding poverty. For centuries, India was torn between local kingdoms fighting each other but also repelling invaders. In the 12th century AD, Muslim Turks tried to conquer India, then the Mongols took their place. In the early 17th century, India, still fragmented, was colonized by the English and their diplomacy and technological superiority. After two centuries of British dominion, Indian nationalism woke up, and you, Great Mahatma, have led a peaceful and victorious rebellion never seen anywhere in history! = Ey Mahatma Gandhi ye dānā, rahbar e bozorg e Hend, to rā gerāmi midārim! Hend yeki az kohantarin kešvar hāye jahān bā 10,000 sāl tāriḵ ast, binā šode bar rooh va din; se din e bozorg e jahān, Hendoo, Boodāyi va Jain, dar in sarzamin e moğaddas peydā šodand. Hame ye jahat hāye jāmee ye Hend honar, moosiği va rang rā gerāmi midārad va servat e besyār va fağr e farsā-yande rā hamzamān nešān midahad. Barāye sade hā, Hend miyān e pādešāhi hāye mahalli ke bā ham mijangidand va bā hamlevarān ham moğābele mikardand pāre-pāre bood. Dar sade ye 12 milādi, Tork hāye Mosalmān barāye tasḵir e Hend talāš kardand; sepas Moğol hā jāy e ānhā rā gereftand. Dar āğāz e sade ye 17, Hend ke hanooz parākande bood, bā siyāsat va bartari ye teknoloji ye Engelisi hā mostamare šod. Pas az do sade solte ye Britāniyā, mellatgerāyi ye Hend bidār šod va to, ey Mahatma ye bozorg, šoreši solh-āmiz va pirooz rā rahbari kardi ke hič jāye tāriḵ hamānand nadāšt!
Gandhi, your people ask again to be led on the path of freedom. Under protection of Ganesha and Surya, can India accomplish its great potential? Will your new empire shine through the ages of history? = Ey Gandhi, mardomat dobāre miḵāhand dar rāh e āzādi rahbari šavand. Zire hemāyat e Ganeša va Surya, āyā Hend mitavānad este'dād e bozorg e ḵod rā tahağğoğ baḵšad? Āyā emperātoori ye jadidat dar asr hāye tāriḵ ḵāhad deraḵšid?
