You are but a pest on this Earth, prepare to be eliminated! = Вы ўсяго толькі шкоднік на гэтай Зямлі, рыхтуйцеся да знішчэння!
You are a fool who evokes pity. You have brought my hostility upon yourself and your repulsive civilization! = Ты дурань, які выклікае жаль. Ты наклікаў маю варожасць на сябе і сваю агідную цывілізацыю!
Strike me down and my soul will torment yours forever, you have won nothing. = Убей мяне, і мая душа будзе вечна мучыць тваю, ты нічога не выйграў.
Greetings, I am Ramesses the god. I am the living embodiment of Egypt, mother and father of all civilizations. = Вітаю, я бог Рамзес. Я жывое ўвасабленне Егіпта, маці і бацькі ўсіх цывілізацый.
Generous Egypt makes you this offer. = Шчодры Егіпет робіць вам гэтую прапанову.
