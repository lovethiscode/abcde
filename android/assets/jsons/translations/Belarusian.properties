Gandhi = Гандзі
I have just received a report that large numbers of my troops have crossed your borders. = Я толькі што атрымаў паведамленне, што вялікая колькасць маіх войскаў перасекла вашу мяжу.
My attempts to avoid violence have failed. An eye for an eye only makes the world blind. = Мае спробы пазбегнуць гвалту не ўвянчаліся поспехам. Вока за вока толькі робіць свет сляпым.
You can chain me, you can torture me, you can even destroy this body, but you will never imprison my mind. = Вы можаце закаваць мяне ў кайданы, вы можаце катаваць мяне, вы можаце нават знішчыць гэтае цела, але вы ніколі не зняволіце мой розум.
Curious. = Цікаўны.
Hello, I am Mohandas Gandhi. My people call me Bapu, but please, call me friend. = Прывітанне, я Махандас Гандзі. Мае людзі называюць мяне Бапу, але, калі ласка, называйце мяне сябрам.
My friend, are you interested in this arrangement? = Мой сябар, цябе цікавіць гэтая дамоўленасць?
I wish you peace. = Жадаю міру.
Population Growth = Рост насельніцтва
Wise Mahatma Gandhi, great leader of India, we honor you! India is one of the oldest countries in the world with 10,000 years of history, built on spirit and religion, as three of the world's great religions - Hinduism, Buddhism and Jainism - appeared on this sacred land. Every aspect of India society reveres art, music and color, showing great wealth but also grinding poverty. For centuries, India was torn between local kingdoms fighting each other but also repelling invaders. In the 12th century AD, Muslim Turks tried to conquer India, then the Mongols took their place. In the early 17th century, India, still fragmented, was colonized by the English and their diplomacy and technological superiority. After two centuries of British dominion, Indian nationalism woke up, and you, Great Mahatma, have led a peaceful and victorious rebellion never seen anywhere in history! = Мудры Махатма Гандзі, вялікі лідэр Індыі, мы шануем цябе! Індыя - адна з найстарэйшых краін свету з 10 000-гадовай гісторыяй, заснаванай на духу і рэлігіі, бо на гэтай святой зямлі з'явіліся тры найвялікшыя сусветныя рэлігіі - індуізм, будызм і джайнізм. Усе аспекты індыйскага грамадства паважаюць мастацтва, музыку і колеры, дэманструючы вялікае багацце, але таксама і жахлівую беднасць. На працягу стагоддзяў Індыя была раздзіраная паміж мясцовымі каралеўствамі, якія змагаліся паміж сабой, але таксама адбівалі захопнікаў. У 12 стагоддзі нашай эры туркі-мусульмане спрабавалі заваяваць Індыю, затым іх месца занялі манголы. У пачатку 17-га стагоддзя Індыя, усё яшчэ раздробненая, была каланізавана англічанамі і іх дыпламатыяй і тэхналагічнай перавагай. Пасля двух стагоддзяў брытанскага панавання прачнуўся індыйскі нацыяналізм, і ты, Вялікі Махатма, узначаліў мірнае і пераможнае паўстанне, якога ніколі не было ў гісторыі!
Gandhi, your people ask again to be led on the path of freedom. Under protection of Ganesha and Surya, can India accomplish its great potential? Will your new empire shine through the ages of history? = Гандзі, твой народ зноў просіць, каб яго вялі па шляху свабоды. Ці зможа Індыя рэалізаваць свой вялікі патэнцыял пад абаронай Ганеші і Сурьі? Ці будзе ваша новая імперыя ззяць праз вякі гісторыі?
