# Refactored menu and window localization
1. Tap Create room, choose the rules and map, then share the invitation. = 1. Націсніце «Стварыць пакой», выберыце правілы і карту, затым падзяліцеся запрашэннем.
1. The Android player copies their Player ID from Multiplayer and sends it to the iOS host. = 1. Прайгравальнік Android капіюе свой ідэнтыфікатар гульца з мультыплэера і адпраўляе яго хосту iOS.
2. In an empty player seat, the host taps Add player manually, pastes the Player ID, taps the portrait to choose a civilization, then taps Mark ready. = 2. На пустым месцы гульца вядучы націскае «Дадаць гульца» ўручную, устаўляе ідэнтыфікатар гульца, націскае на партрэт, каб выбраць цывілізацыю, затым націскае «Пазначыць гатовым».
2. Other iOS players open the invitation or paste it in Join by invitation, tap their civilization portrait to choose, then tap Ready. = 2. Іншыя гульцы iOS адкрываюць запрашэнне або ўстаўляюць яго ў Join by invitation, дакранаюцца партрэта сваёй цывілізацыі, каб выбраць, затым дакранаюцца Ready.
3. After starting, the Game ID is copied automatically. Send it to the Android player to add the game in Multiplayer. = 3. Пасля запуску ідэнтыфікатар гульні капіюецца аўтаматычна. Адпраўце яго гульцу Android, каб дадаць гульню ў шматкарыстальніцкі рэжым.
3. The host is ready automatically. When everyone is ready, the host taps Start game. No Player ID or Game ID exchange is needed. = 3. Хост гатовы аўтаматычна. Калі ўсе будуць гатовыя, вядучы націскае Пачаць гульню. Ідэнтыфікатар гульца або абмен ідэнтыфікатарам гульні не патрабуецца.
