Oda Nobunaga = Ода Нобунага
I hereby inform you of our intention to wipe out your civilization from this world. = Гэтым я паведамляю вам аб нашым намеры знішчыць вашу цывілізацыю з гэтага свету.
Pitiful fool! Now we shall destroy you! = Няшчасны дурань! Зараз мы вас знішчым!
You were much wiser than I thought. = Ты быў нашмат мудрэйшы, чым я думаў.
I expected more for you from. = Я чакаў ад цябе большага.
We hope for a fair and just relationship with you, who are renowned for military bravery. = Спадзяёмся на сумленныя і справядлівыя адносіны з вамі, якія славяцца ваеннай адвагай.
I would be grateful if you agreed on the following proposal. = Буду ўдзячны, калі вы пагадзіцеся на наступную прапанову.
Oh, it's you... = А, гэта ты...
Bushido = Бушыдо
Lord Oda Nobunaga, ruler of Japan, the land of the Rising Sun is at your command! Through history, Japanese people lived and died with honor, proud of their rich culture of arts and letters. Years of bloody civil wars, invasions of foreign powers, wealth but also great poverty, have never altered the strong will of the Rising Sun island, as the Bushido spirit has imbued the fields of battle and the Japanese society for millenia. At the end of the 19th century, under foreign influence, your people took the path of modernity, and in a few decades, made of Japan a land of technological innovation and powerful industry, with which only few nations can compete. = Лорд Ода Нобунага, кіраўнік Японіі, краіна ўзыходзячага сонца ў вашым распараджэнні! На працягу ўсёй гісторыі японцы жылі і паміралі з гонарам, ганарыўшыся сваёй багатай культурай мастацтва і літаратуры. Гады кровапралітных грамадзянскіх войнаў, уварвання замежных дзяржаў, багацце, але таксама вялікая беднасць ніколі не змянялі моцную волю вострава Узыходзячага сонца, бо дух бусідо прасякнуў поля бітваў і японскае грамадства на працягу тысячагоддзяў. У канцы 19 стагоддзя пад замежным уплывам ваш народ стаў на шлях сучаснасці і за некалькі дзесяцігоддзяў ператварыў Японію ў краіну тэхналагічных інавацый і магутнай прамысловасці, з якой могуць канкураваць толькі нешматлікія краіны.
O great daimyo, will you take on your hands the Japan destiny, for the Rising Sun to light the world? Will your new empire shine through the ages of history? = О вялікі даймё, ці возьмеш ты на сябе лёс Японіі, каб Узыходзячае сонца асвятліла свет? Ці будзе ваша новая імперыя ззяць праз вякі гісторыі?
