Greetings, I am Empress Wu Zetian. China desires peace and development. You leave us alone, we'll leave you alone. = Вітаю, я імператрыца У Цзэцянь. Кітай жадае міру і развіцця. Вы пакіньце нас у спакоі, мы пакінем вас у спакоі.
