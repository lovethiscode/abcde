O great Ramesses, Pharaoh of Egypt, bright as the Sun and mighty as the Nile! Lord of all living things, you lead the greatest of all civilizations, which has gifted the world with writing, advanced mathematics, sculpture, and architecture. Egyptian monuments and culture will continue to amaze the world for thousands of years. = О вялікі Рамзэс, фараон Егіпта, яркі, як сонца, і магутны, як Ніл! Уладар усяго жывога, ты кіруеш найвялікшай з усіх цывілізацый, якая падарыла свету пісьменнасць, перадавую матэматыку, скульптуру і архітэктуру. Егіпецкія помнікі і культура будуць працягваць здзіўляць свет на працягу тысяч гадоў.
Mighty and eternal Ramesses, Egypt lasted for millenia, whereas other civilisations disappeared into dust after a few centuries. Amun-Ra blesses you again to lead Egypt and its people on the path of light. Will your new empire shine through the ages of history? = Магутны і вечны Рамзес, Егіпет праіснаваў тысячагоддзі, а іншыя цывілізацыі знікалі ў пылу праз некалькі стагоддзяў. Амон-Ра зноў дабраслаўляе вас весці Егіпет і яго народ па шляху святла. Ці будзе ваша новая імперыя ззяць праз вякі гісторыі?
