George Washington = Джордж Вашынгтон
Your wanton aggression leaves us no choice. Prepare for war! = Ваша бязвольная агрэсія не пакідае нам выбару. Рыхтуйцеся да вайны!
You have mistaken our love of peace for weakness. You shall regret this! = Вы прынялі нашу любоў да міру за слабасць. Вы пашкадуеце аб гэтым!
The day...is yours. I hope you will be merciful in your triumph. = Дзень...твой. Я спадзяюся, што вы будзеце міласэрныя ў вашым трыумфе.
The people of the United States of America welcome you. = Народ Злучаных Штатаў Амерыкі вітае вас.
Is the following trade of interest to you? = Вас цікавіць наступны гандаль?
Well? = добра?
Manifest Destiny = Маніфест лёсу
President Washington, we salute you and the proud American civilization! Freed from the British dominion in the 18th century, then cleansed and reborn after a terrible civil war, the United States nation was ready to play its great role in the 20th century. At the height of its power, triumphant after two terrible world wars, United States of America, a land of immigration, opportunities, optimism and determination, has risen above all other weakening nations, unable to equal such power. = Прэзідэнт Вашынгтон, мы вітаем вас і гордую амерыканскую цывілізацыю! Вызваленая ад брытанскага панавання ў 18 стагоддзі, затым ачышчаная і адроджаная пасля жудаснай грамадзянскай вайны, нацыя Злучаных Штатаў была гатовая адыграць сваю вялікую ролю ў 20 стагоддзі. На піку сваёй магутнасці, трыумфуючы пасля дзвюх жудасных сусветных войнаў, Злучаныя Штаты Амерыкі, краіна іміграцыі, магчымасцей, аптымізму і рашучасці, узвышаліся над усімі іншымі слабелымі нацыямі, не здольнымі параўнацца з такой моцай.
President Washington, will you show to the world the legitimacy of the American way of life, and spread the flame of liberty to all mankind? Will your new empire shine through the ages of history? = Прэзідэнт Вашынгтон, вы пакажаце свету законнасць амерыканскага ладу жыцця і распаўсюдзіце полымя свабоды на ўсё чалавецтва? Ці будзе ваша новая імперыя ззяць праз вякі гісторыі?
