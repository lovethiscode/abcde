Darius I = Дарый I
Your continue existence is an embarrassment to all leaders everywhere! You must be destroyed! = Ваша далейшае існаванне - гэта збянтэжанасць для ўсіх лідэраў паўсюль! Вы павінны быць знішчаны!
Curse you! You are beneath me, son of a donkey driver! I will crush you! = Праклён табе! Ніжэй ты мяне, сын асла! Я цябе раздушу!
You mongrel! Cursed be you! The world will long lament your heinous crime! = Двухпароднік! Будзь ты пракляты! Свет будзе доўга аплакваць ваша гнюснае злачынства!
Peace be on you! I am Darius, the great and outstanding king of kings of great Persia... but I suppose you knew that. = Мір вам! Я Дарый, вялікі і выбітны кароль цароў вялікай Персіі... але я мяркую, што вы гэта ведалі.
In my endless magnanimity, I am making you this offer. You agree, of course? = У сваёй бясконцай велікадушнасці я раблю вам гэтую прапанову. Вы, вядома, згодны?
Good day to you! = Добры дзень вам!
Ahh... you... = Ах... ты...
Achaemenid Legacy = Спадчына Ахеменідаў
Great King Darius of Persia, the heaven casts its light upon you! Persian people are strong and wise, as their leader. In old ages, the great Persian king Cyrus fought back the mighty Median empire and finally destroyed the Medes in 550 BC. Cunning diplomacy and military achievements helped then to conquer the wealthy Lydia and the powerful Babylon, Cyrus' son conquering the eternal Egypt some years later. At the height of its power, the Persian Empire reached the shores of Macedonia, at the very door of the upstart Greek city-states. Persia would have prospered for centuries if Alexander of Macedon hadn't brutally destroyed the great empire in one violent strike. = Вялікі цар Персіі Дарый, нябёсы асвятляюць цябе! Персідскі народ моцны і мудры, як і яго правадыр. У старасці вялікі персідскі цар Кір адбіваў магутную Мідыйскую імперыю і канчаткова знішчыў мідзян у 550 г. да н. Хітрая дыпламатыя і ваенныя дасягненні дапамаглі тады заваяваць багатую Лідыю і магутны Вавілон, сын Кіра праз некалькі гадоў заваяваў вечны Егіпет. На піку сваёй магутнасці Персідская імперыя дасягнула берагоў Македоніі, ля самых дзвярэй пачаткоўцаў грэчаскіх гарадоў-дзяржаў. Персія квітнела б на працягу многіх стагоддзяў, калі б Аляксандр Македонскі не знішчыў вялікую імперыю адным жорсткім ударам.
King Darius, the people of Persia await, longing for its past glory and power! Persia of the Immortals must reborn, to punish its foes and rebuild the gleaming Persepolis! Will your new empire shine through the ages of history? = Караля Дарыя, народ Персіі чакае, прагнучы сваёй былой славы і магутнасці! Персія Бессмяротных павінна адрадзіцца, каб пакараць сваіх ворагаў і аднавіць бліскучы Персепаль! Ці будзе ваша новая імперыя ззяць праз вякі гісторыі?
