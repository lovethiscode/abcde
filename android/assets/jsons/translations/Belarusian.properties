Suleiman I = Сулейман І
Your continued insolence and failure to recognize our preeminence leads us to war. = Ваша працяглая нахабства і непрызнанне нашай перавагі вядуць нас да вайны.
Good. The world shall witness the incontestable might of my armies and the glory of the Empire. = Добра. Свет стане сведкам бясспрэчнай моцы маіх армій і славы Імперыі.
Ruin! Ruin! Istanbul becomes Iram of the Pillars, remembered only by the melancholy poets. = Руіны! Руіны! Стамбул становіцца Ірамам Слупоў, пра які памятаюць толькі меланхалічныя паэты.
From the magnificence of Topkapi, the Ottoman nation greets you, stranger! I'm Suleiman, Kayser-I Rum, and I bestow upon you my welcome! = З пышнасці Топкапы асманскі народ вітае цябе, чужынец! Я Сулейман, Кайсер-І Рам, і я вітаю вас!
Let us do business! Would you be interested? = Давайце рабіць бізнес! Вам было б цікава?
Barbary Corsairs = Варварскія карсары
O Great Sultan Suleiman, may the God bless you! You are revered for your power, wealth and generosity, and you truly deserves to be called the 'Magnificent'! The Ottoman Empire was born in Bithynia, starting as a small country in Eastern Anatolia in 12th century, then expanded to west into Anatolia. Over the next century, your people vanquished the empire of Byzantium, annexing Turkey and the Balkans, and smartly assimilating all wonders and knowledge of the Byzantine civilization. In the mid 15th century, the Ottomans added Constantinople to their empire, establishing a strategic link between Europe and the Middle East. The Empire would continue to expand for centuries reaching North Africa, Middle East and Eastern Europe at its height, but brutally disappeared in the chaos of the first world war, in early 20th century. = О вялікі султан Сулейман, хай дабраславіць цябе Бог! Цябе шануюць за моц, багацце і шчодрасць, і ты сапраўды заслугоўваеш таго, каб цябе называлі "Цудоўным"! Асманская імперыя зарадзілася ў Віфініі, пачынаючы з невялікай краіны ва Усходняй Анатоліі ў 12 стагоддзі, затым пашырылася на захад у Анатолію. На працягу наступнага стагоддзя ваш народ перамог Візантыйскую імперыю, далучыўшы Турцыю і Балканы, і разумна засвоіўшы ўсе цуды і веды візантыйскай цывілізацыі. У сярэдзіне XV стагоддзя асманы далучылі Канстанцінопаль да сваёй імперыі, усталяваўшы стратэгічную сувязь паміж Еўропай і Блізкім Усходам. Імперыя будзе працягваць пашырацца на працягу стагоддзяў, дасягнуўшы Паўночнай Афрыкі, Блізкага Усходу і Усходняй Еўропы ў самым росквіце, але жорстка знікла ў хаосе Першай сусветнай вайны ў пачатку 20-га стагоддзя.
Mighty Caliph, your people ask you to build again the Empire, to the level of power and glory it once achieved, and beyond! Will you revive the Ottoman golden age? Will your new empire shine through the ages of history? = Магутны халіф, твой народ просіць цябе зноў пабудаваць Імперыю да ўзроўню магутнасці і славы, якіх яна калісьці дасягнула, і далей! Ці адродзіце вы асманскі залаты век? Ці будзе ваша новая імперыя ззяць праз вякі гісторыі?
