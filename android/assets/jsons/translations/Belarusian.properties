Heaven itself bends before your beauty, Empress Wu Zetian, ruler of eternal China! You lead one of the oldest and greatest civilization of humanity. In your time, China stood at the forefront of science and technology, bringing the world such contributions as gunpowder, the printing press, and the world of Confucius, and this, long before the rest of the world was mature enough to make the same discoveries! = Само неба схіляецца перад прыгажосцю тваёй, імператрыца У Цзэцянь, валадарка вечнага Кітая! Вы кіруеце адной з найстарэйшых і найвялікшых цывілізацый чалавецтва. У ваш час Кітай стаяў у авангардзе навукі і тэхнікі, прыносячы свету такі ўклад, як порах, друкарскі станок і свет Канфуцыя, і гэта задоўга да таго, як астатні свет быў дастаткова сталым, каб зрабіць такія ж адкрыцці!
Great Queen, can you make China prevail again, using your divine intelligence and beauty? China stands for greatness, and all its enemies will be dazzled soon enough! Will your new empire shine through the ages of history? = Вялікая Каралева, ці можаце вы прымусіць Кітай зноў пераважаць, выкарыстоўваючы свой боскі розум і прыгажосць? Кітай выступае за веліч, і ўсе яго ворагі хутка будуць ашаломлены! Ці будзе ваша новая імперыя ззяць праз вякі гісторыі?
