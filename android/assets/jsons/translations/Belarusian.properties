Augustus Caesar = Аўгуст Цэзар
My treasury contains little and my soldiers are getting impatient... (sigh) ...therefore you must die. = У маёй скарбніцы мала, і мае салдаты становяцца нецярплівымі... (уздых) ...таму ты павінен памерці.
So brave, yet so stupid! If only you had a brain similar to your courage. = Такі смелы, але такі дурны! Калі б у вас быў мозг, падобны да вашай мужнасці.
The gods have deprived Rome of their favour. We have been defeated. = Багі пазбавілі Рым сваёй ласкі. Мы пацярпелі паразу.
I wasn't sure, but it seems you do have some grit. = Я не быў упэўнены, але, здаецца, у вас ёсць цвёрдасць.
I greet you. I am Augustus, Imperator and Pontifex Maximus of Rome. If you are a friend of Rome, you are welcome. = Вітаю вас. Я Аўгуст, Імператар і Пантыфік Максім Рыма. Калі вы сябар Рыма, калі ласка.
I offer this, for your consideration. = Прапаную гэта на ваш разгляд.
Hail. = Град.
What do you want? = Што вы хочаце?
The Glory of Rome = Слава Рыму
Ave Caesar Augustus, Emperor of Rome and Dominus of the Roman Empire! Your empire was the most powerful and feared of all in Western civilization. The Roman people crafted so brilliantly its culture, law, art, and warfare, that no one could contest the supremacy of Rome. Force and Honor led to glorious conquests, a domination of all the lands from Spain in the west to Syria in the east, even reaching the remote barbarian lands of England and Germany. Roman art and architecture have been praised for millenia and have been envied by all lesser civilizations who have followed. = Аве Цэзар Аўгуст, імператар Рыма і дамінус Рымскай імперыі! Ваша імперыя была самай магутнай і страшнай з усіх у заходняй цывілізацыі. Рымскі народ так бліскуча стварыў сваю культуру, права, мастацтва і ваенныя дзеянні, што ніхто не мог аспрэчыць вяршэнства Рыма. Сіла і Гонар прывялі да слаўных заваяванняў, панавання над усімі землямі ад Іспаніі на захадзе да Сірыі на ўсходзе, нават да аддаленых варварскіх зямель Англіі і Германіі. Рымскае мастацтва і архітэктура ўсхваляліся тысячагоддзямі, і ім зайздросцілі ўсе ніжэйшыя цывілізацыі.
O glorious Imperator, your people celebrate you and ask for the glory of Rome! In these times of darkness, the Pax Romana will be a beacon of light for all! Will your new empire shine through the ages of history? = О слаўны Імператар, народ твой славіць цябе і просіць славы Рыма! У гэтыя цёмныя часы Pax Romana будзе маяком святла для ўсіх! Ці будзе ваша новая імперыя ззяць праз вякі гісторыі?
