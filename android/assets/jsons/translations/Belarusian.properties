# Capturing a city

What would you like to do with the city of [cityName]? = Што б вы хацелі зрабіць з горадам [cityName]?
Annex = Дадатак
Annexed cities become part of your regular empire. = Далучаныя гарады становяцца часткай вашай звычайнай імперыі.
Their citizens generate 2x the unhappiness, unless you build a courthouse. = Іх грамадзяне ствараюць удвая больш няшчасцяў, калі толькі вы не пабудуеце будынак суда.
Your civilization may not annex this city. = Ваша цывілізацыя можа не анексаваць гэты горад.
Puppet = Лялечны
Puppeted cities do not increase your tech or policy cost. = Лялечныя гарады не павялічваюць кошт вашых тэхналогій або палітыкі.
You have no control over the the production of puppeted cities. = Вы не можаце кантраляваць вытворчасць марыянетачных гарадоў.
Puppeted cities also generate 25% less Science and Culture. = Лялечныя гарады таксама ствараюць на 25% менш навукі і культуры.
A puppeted city can be annexed at any time. = Лялечны горад можа быць анэксаваны ў любы момант.
Liberate (city returns to [originalOwner]) = Вызвалі (горад вяртаецца ў [originalOwner])
Liberating a city returns it to its original owner, giving you a massive relationship boost with them! = Вызваленне горада вяртае яго першапачатковаму ўладальніку, даючы вам значнае развіццё адносін з ім!
Raze = Знішчыць
Razing the city annexes it, and starts burning the city to the ground. = Разбураючы горад, анэксуе яго і пачынае спальваць горад дашчэнту.
Razing the city puppets it, and starts burning the city to the ground. = Разбураючы горад марыянетка, і пачынае спальваць горад дашчэнту.
The population will gradually dwindle until the city is destroyed. = Насельніцтва будзе паступова змяншацца, пакуль горад не будзе разбураны.
Original capitals and holy cities cannot be razed. = Першапачатковыя сталіцы і святыя гарады не могуць быць знішчаны.
Destroy = Знішчыць
Destroying the city instantly razes the city to the ground. = Знішчэнне горада імгненна зраўноўвае горад з зямлёй.
Keep it = Трымайце яго
Remove your troops in our border immediately! = Неадкладна прыбярыце свае войскі ў нашу мяжу!
Sorry. = Прабачце.
Never! = ніколі!
Those lands were not yours to take. This has not gone unnoticed. = Не табе было браць тыя землі. Гэта не засталося незаўважаным.

