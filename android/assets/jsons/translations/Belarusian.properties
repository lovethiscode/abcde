You've behaved yourself very badly, you know it. Now it's payback time. = Вы паводзілі сябе вельмі дрэнна, вы гэта ведаеце. Цяпер час расплаты.
You've mistaken my passion for a weakness, you'll regret about this. = Ты прыняў маё захапленне за слабасць, ты пашкадуеш аб гэтым.
We were defeated, so this makes me your prisoner. I suppose there are worse fates. = Мы пацярпелі паражэнне, таму я стаў вашым палонным. Мяркую, бываюць і горшыя лёсы.
Fine then. It's your call. = Тады добра. Гэта ваш званок.
I greet you, stranger! If you are as intelligent and tactful as you are attractive, we'll get along just fine. = Вітаю цябе, чужынец! Калі вы такі ж разумны і тактоўны, як і прывабны, мы будзем выдатна ладзіць.
How would you like it if I propose this kind of exchange? = Як вы спадабаецеся, калі я прапаную такі абмен?
Hello! = Прывітанне!
What do you need?! = Што табе трэба?!
Siberian Riches = Сібірскія багацці
Hail to Imperial Majesty Catherine, Empress of all Russians. Living in the largest country in the world, from the Pacific Ocean in the east to the Baltic Sea in the west, your people endured wars, droughts, and many disasters, imbuing the Russian society with heroism and tenacity, and producing artists and scientists among the best in the world. Russia is a powerful empire which rightfully claims its place in the world concert of superpowers. = Вітаем Імператарскую Вялікасць Кацярыну, Імператрыцу ўсяе Русі. Жывучы ў самай вялікай краіне свету, ад Ціхага акіяна на ўсходзе да Балтыйскага мора на захадзе, ваш народ перажыў войны, засухі і многія бедствы, напоўніўшы рускае грамадства гераізмам і стойкасцю, выпусціўшы дзеячаў мастацтва і вучоных у ліку лепшых у свеце. Расія - магутная імперыя, якая па праву прэтэндуе на сваё месца ў сусветным канцэрце звышдзяржаў.
Empress Catherine, your people are eager for Russian glory, to revive the sacred light of the Motherland. Will your new empire shine through the ages of history? = Імператрыца Кацярына, твой народ прагне славы рускай, адрадзіць святое святло Радзімы. Ці будзе ваша новая імперыя ззяць праз вякі гісторыі?
