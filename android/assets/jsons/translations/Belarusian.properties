Long live to Your Highness, Queen Elizabeth Gloriana, leader and protector of the glorious England! Through history, enduring many invasions, England strengthened its will, playing smartly with diplomacy, cunning, and military power, to eventually rose as one of the most dominant Empires the world has ever known. Their matchless navy, brilliant scientists and artists, and powerful merchants, have shaped the known world for centuries. = Няхай жыве Ваша Высокасць, Каралева Лізавета Гларыяна, правадыр і абаронца слаўнай Англіі! На працягу гісторыі, вытрымліваючы мноства ўварванняў, Англія ўмацавала сваю волю, спрытна гуляючы з дыпламатыяй, хітрасцю і ваеннай моцай, каб у рэшце рэшт стаць адной з самых дамінуючых імперый, якія калі-небудзь ведаў свет. Іх неперасягнены флот, бліскучыя навукоўцы і мастакі, а таксама магутныя гандляры на працягу стагоддзяў фармавалі вядомы свет.
