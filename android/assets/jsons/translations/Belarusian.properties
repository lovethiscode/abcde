Vive Napoleon I, First Consul and Emperor of France! After the glorious Revolution which suppressed the centuries-old monarchy, the French nation stood at the heart of Europe as a Republic, and intended to export its ideals to the entire European continent, either by diplomacy or war. The French Capital Paris was more than ever the world center of Culture, Arts, and Letters. With its Great Army, reputed as one of the greatest in the History, France fought gloriously all surrounding enemies, but eventually fell against the coalition of other European powers. = Жыве Напалеон I, першы консул і імператар Францыі! Пасля слаўнай рэвалюцыі, якая здушыла шматвяковую манархію, французская нацыя стаяла ў цэнтры Еўропы як рэспубліка і мела намер экспартаваць свае ідэалы на ўвесь еўрапейскі кантынент альбо з дапамогай дыпламатыі, альбо праз вайну. Сталіца Францыі Парыж, як ніколі, быў сусветным цэнтрам культуры, мастацтва і літаратуры. Са сваёй Вялікай арміяй, вядомай як адна з найвялікшых у гісторыі, Францыя слаўна змагалася з усімі навакольнымі ворагамі, але ў рэшце рэшт пала супраць кааліцыі іншых еўрапейскіх дзяржаў.
Napoleon Bonaparte, ruler of the French people, will you rebuild the Empire to take revenge on your foes, and make again of its Capital the City of Lights? Will your new empire shine through the ages of history? = Напалеон Банапарт, правіцель французскага народа, ты адбудуеш імперыю, каб адпомсціць сваім ворагам і зноў ператварыць яе сталіцу ў горад агнёў? Ці будзе ваша новая імперыя ззяць праз вякі гісторыі?
