Harun al-Rashid = Харун ар-Рашыд
The world will be more beautiful without you. Prepare for war. = Без цябе свет стане прыгажэй. Рыхтуйцеся да вайны.
Fool! You will soon regret dearly! I swear it! = Дурань! Вы хутка моцна пашкадуеце! Клянуся!
You have won, congratulations. My palace is now in your possession, and I beg that you care well for the peacock. = Вы выйгралі, віншую. Мой палац цяпер у вашай уласнасці, і я прашу вас добра клапаціцца пра паўліна.
Our future battle will be glorious. = Наша будучая бітва будзе слаўнай.
Welcome foreigner, I am Harun Al-Rashid, Caliph of the Arabs. Come and tell me about your empire. = Сардэчна запрашаем іншаземец, я Харун Аль-Рашыд, халіф арабаў. Хадзі і раскажы мне пра сваю імперыю.
Come forth, let's do business. = Выходзьце, будзем рабіць справы.
Peace be upon you. = Мір вам.
Trade Caravans = Гандлёвыя караваны
Blessings of the Great God be upon you, O great caliph Harun al-Rashid, leader of the mighty Arabian people! The Muslim Empire, the Caliphate, born from chaos after the death of the prophet Muhammad in 632 AD, intended to apply the rule of God to all Earth. And by the will of God, the caliphate reached its full power, ruling Spain, North Africa, the Middle East, Anatolia, the Balkans and Persia, to even surpass the Great Roman Empire. The arts and sciences were a holy gift of Arabia during the Middle Ages, as the infidel lands of Europe delved deep into ignorance and chaos. Lasting for six hundred years, the Caliphate finally fell before the Mongols, the plague of the civilized world. = Блаславенне Вялікага Бога на табе, о вялікі халіф Гарун ар-Рашыд, правадыр магутнага арабскага народа! Мусульманская імперыя, Халіфат, народжаная з хаосу пасля смерці прарока Мухамеда ў 632 г. нашай эры, мела намер прымяніць праўленне Бога на ўсёй Зямлі. І па волі Божай халіфат дасягнуў сваёй поўнай магутнасці, кіруючы Іспаніяй, Паўночнай Афрыкай, Блізкім Усходам, Анатоліяй, Балканамі і Персіяй, нават перасягнуўшы Вялікую Рымскую імперыю. Мастацтва і навука былі святым дарам Аравіі ў Сярэднявеччы, калі няверныя землі Еўропы глыбока пагрузіліся ў невуцтва і хаос. Праіснаваўшы шэсцьсот гадоў, халіфат урэшце паў перад манголамі, чумой цывілізаванага свету.
Great Caliph Harun al Rashid, all Arabian people long for greatness! Arabia must be once again the land of arts and knowledge, which under the radiant law of God, will fear no enemy! Will your new empire shine through the ages of history? = Вялікі халіф Гарун аль-Рашыд, усе арабскія людзі прагнуць велічы! Аравія зноў павінна стаць краінай мастацтваў і ведаў, якая, згодна з прамяністым законам Божым, не будзе баяцца ворагаў! Ці будзе ваша новая імперыя ззяць праз вякі гісторыі?
