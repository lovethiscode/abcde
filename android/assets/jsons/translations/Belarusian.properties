Otto von Bismarck = Ота фон Бісмарк
I cannot wait until ye grow even mightier. Therefore, prepare for war! = Я не магу чакаць, пакуль ты станеш яшчэ мацней. Таму рыхтуйцеся да вайны!
Corrupted villain! We will bring you into the ground! = Разбэшчаны злыдзень! Мы цябе ў зямлю скінем!
Germany has been destroyed. I weep for the future generations. = Германія разбурана. Я плачу аб будучых пакаленнях.
That wild bravado? It's a ticking time bomb, especially when you're all bark and no bite! = Гэтая дзікая бравада? Гэта бомба запаволенага дзеяння, асабліва калі ты ўвесь гаўкаеш і не кусаешся!
Guten Tag. In the name of the great German people, I bid you welcome. = Guten Tag. Ад імя вялікага нямецкага народа вітаю вас.
It would be in your best interest, to carefully consider this proposal. = Было б у вашых інтарэсах уважліва разгледзець гэтую прапанову.
What now? = Што цяпер?
So, out with it! = Такім чынам, прэч!
Furor Teutonicus = Furor Teutonicus
All hail to Otto von Bismarck, first chancellor of Germany and its empire! During the ancient era, Germany was a land fragmented in several tribes but already showed great promise as the Roman Empire itself struggled to bend the Germans to its will. Germany, as one nation, was slowly built on the ruins of the Holy Roman Empire, and waited 1871 to be finally unified after the glorious victory on France and Napoleon III. The German people are creative, intelligent, industrious and proven to be talented warriors through history. Despite great catastrophes and failures in the first half of the 20th century, Germany can always rely on its people will and strength to be among the greatest and powerful nations in the world. = Слава Ота фон Бісмарку, першаму канцлеру Германіі і яе імперыі! У антычную эпоху Германія была зямлёй, раздробненай на некалькі плямёнаў, але ўжо дэманстравала вялікія перспектывы, бо сама Рымская імперыя з усіх сіл схіляла германцаў да сваёй волі. Германія, як адна нацыя, павольна будавалася на руінах Свяшчэннай Рымскай імперыі і чакала 1871 года, каб канчаткова аб'яднацца пасля слаўнай перамогі над Францыяй і Напалеонам III. Нямецкі народ крэатыўны, разумны, працавіты і даказаны гісторыяй як таленавітыя воіны. Нягледзячы на ​​вялікія катастрофы і няўдачы ў першай палове 20-га стагоддзя, Германія заўсёды можа разлічваць на волю і сілу свайго народа, каб быць адной з найвялікшых і магутных краін свету.
Great Prince Bismarck, glory and power are at the heart of the German nation. Your people are bright, and lend you their iron will to lead Germany once again. Will your new empire shine through the ages of history? = Вялікі князь Бісмарк, слава і моц ляжаць у цэнтры нямецкай нацыі. Вашы людзі яркія, і яны пазычаць вам сваю жалезную волю, каб зноў узначаліць Германію. Ці будзе ваша новая імперыя ззяць праз вякі гісторыі?
Berlin = Berlin
