Great King Alexander, leader of the mighty Greek nation, you are truly blessed by the gods. In 480 BC, quarrelsome city-states such as Athens, Sparta, Thebes, found a way to join their forces, allowing Greece to defeat the mighty Persia in the 5th century BC, both on land and sea. Following their example, you lead a Greek coalition and finally struck down the Persian Empire in 331 BC. You conquered almost all the known world, and from Europe to Africa to India, you built an empire unmatched by any before it. = Вялікі цар Аляксандр, правадыр магутнай грэчаскай нацыі, ты сапраўды дабраславёны багамі. У 480 г. да н.э. сварлівыя гарады-дзяржавы, такія як Афіны, Спарта, Фівы, знайшлі спосаб аб'яднаць свае сілы, што дазволіла Грэцыі перамагчы магутную Персію ў 5 стагоддзі да н.э. як на сушы, так і на моры. Прытрымліваючыся іх прыкладу, вы ўзначальваеце грэцкую кааліцыю і, нарэшце, разбілі Персідскую імперыю ў 331 г. да н. Вы заваявалі амаль увесь вядомы свет, ад Еўропы да Афрыкі і Індыі, вы пабудавалі імперыю, якой няма роўных раней.
Megalexandros, son of Zeus, will you ride Bucephalas again, to gift the world with the brightness of the Greek culture? Will your new empire shine through the ages of history? = Мегалександр, сын Зеўса, ты зноў сядзеш на Буцэфала, каб падарыць свету яркасць грэцкай культуры? Ці будзе ваша новая імперыя ззяць праз вякі гісторыі?
