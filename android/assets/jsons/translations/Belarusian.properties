Hiawatha = Гаявата
You are a plague upon Mother Earth! Prepare for battle! = Вы - чума на маці-зямлі! Рыхтуйцеся да бою!
You evil creature! My braves will slaughter you! = Ты злая істота! Мае адважныя заб'юць вас!
You have defeated us... but our spirits will never be vanquished! We shall return! = Вы перамаглі нас... але наш дух ніколі не будзе пераможаны! Мы вернемся!
Words alone cannot shake the roots of peace I have planted among my people. = Адны толькі словы не могуць пахіснуць карані міру, якія я пусціў сярод свайго народа.
Greetings, stranger. I am Hiawatha, speaker for the Iroquois. We seek peace with all, but we do not shrink from war. = Вітаю, незнаёмец. Я Гаявата, прамоўца ад іракезаў. Мы шукаем міру з усімі, але мы не цураемся вайны.
Does this trade work for you, my friend? = Ці працуе гэты гандаль для вас, мой сябар?
The Great Warpath = Вялікі Ваенны Шлях
Greetings, noble Hiawatha, leader of the mighty Iroquois nations! Your people lived near the great and holy lake Ontario since the ancient ages, on a land that will be later known as New York city. Long ago, the five peoples of Seneca, Onondaga, Mohawks, Cayugas and Oneida became one nation, the Haudenosaunee, the Iroquois. Although not having a written language, the wise Iroquois created the Great Law of Peace, which can be considered the first established constitution. For decades, your people fought powerful enemies, such as the Huron, and then the French and English colonists. With less warriors and inferior weaponry, the Iroquois still survived and walk on the path of peace and harmony, until their way of living faded away under the crush of the newborn United States nation. = Вітаю, высакародны Гаявата, правадыр магутных іракезскіх народаў! Ваш народ жыў каля вялікага і святога возера Антарыё са старажытных стагоддзяў, на зямлі, якая пазней будзе вядомая як горад Нью-Ёрк. Даўным-даўно пяць народаў Сенека, Анондага, іракезы, Каюга і Онейда сталі адной нацыяй, Гаудэнасауні, Іракезы. Не маючы пісьменства, мудрыя іракезы стварылі Вялікі закон міру, які можна лічыць першай усталяванай канстытуцыяй. На працягу дзесяцігоддзяў ваш народ змагаўся з магутнымі ворагамі, такімі як гуроны, а затым з французскімі і англійскімі каланістамі. Маючы менш воінаў і горшую зброю, іракезы ўсё яшчэ выжывалі і ішлі шляхам міру і згоды, пакуль іх лад жыцця не знік пад націскам нованароджанай нацыі Злучаных Штатаў.
Great Sachem Hiawatha, do you hear the complaints of your people? Can you light the path leading to the ancient Iroquois union? Will your new empire shine through the ages of history? = Вялікі Сакем Гаявата, ты чуеш скаргі свайго народа? Ці можаце вы асвятліць шлях, які вядзе да старажытнага саюза іракезаў? Ці будзе ваша новая імперыя ззяць праз вякі гісторыі?
