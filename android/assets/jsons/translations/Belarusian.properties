# iOS maintenance support
Support iOS maintenance = Падтрымаць суправаджэнне iOS
Purchase records are unavailable. No purchase was started. Please reopen the app. = Запісы аб пакупках недаступныя. Пакупка не была пачатая. Адкрыйце праграму зноў.
Congratulations on your victory! = Віншуем з перамогай!
Enjoying this iOS version? Optional support helps with ongoing compatibility and maintenance. All game content and features stay the same whether you contribute or not. = Падабаецца гэтая версія для iOS? Добраахвотная падтрымка дапамагае з далейшай адаптацыяй і суправаджэннем. Усё змесціва і функцыі гульні аднолькавыя незалежна ад вашага ўнёску.
Learn about support = Даведацца пра падтрымку
Continue playing = Працягнуць гульню
Unciv is made by an open-source community. This iOS version needs ongoing work to adapt to new systems, fix issues, and improve the controls. = Unciv ствараецца супольнасцю адкрытага зыходнага кода. Гэтая версія для iOS патрабуе сталай працы: падтрымкі новых сістэм, выпраўлення праблем і паляпшэння кіравання.
If you enjoy playing, you can support future iOS maintenance with a voluntary, one-time contribution. All game content and features are the same for everyone. = Калі вам падабаецца гуляць, вы можаце падтрымаць далейшае суправаджэнне iOS добраахвотным аднаразовым унёскам. Усё змесціва і функцыі гульні аднолькавыя для ўсіх.
