Sejong = Седжонг
Jip-hyun-jun (Hall of Worthies) will no longer tolerate your irksome behavior. We will liberate the citizens under your oppression even with force, and enlighten them! = Джып-хён-джун (Зала годных) больш не будзе цярпець вашых надакучлівых паводзін. Мы нават сілай вызвалім грамадзян, якія знаходзяцца пад вашым прыгнётам, і прасьвятым іх!
Foolish, miserable wretch! You will be crushed by this country's magnificent scientific power! = Дурны, няшчасны нягоднік! Вы будзеце раздушаны цудоўнай навуковай сілай гэтай краіны!
Now the question is who will protect my people. A dark age has come. = Цяпер пытанне ў тым, хто абароніць мой народ. Настаў цёмны век.
Your words reveal more of your own prejudice than any fault in my own. = Вашы словы больш раскрываюць вашу ўласную прадузятасць, чым любую маю ўласную віну.
Welcome to the palace of Choson, stranger. I am the learned King Sejong, who looks after his great people. = Сардэчна запрашаем у палац Чосон, незнаёмец. Я вучоны кароль Седжон, які клапоціцца пра свой вялікі народ.
We have many things to discuss and have much to benefit from each other. = Нам ёсць што абмеркаваць, і мы маем шмат карысці адзін ад аднаго.
Oh, it's you = Ах, гэта ты
Scholars of the Jade Hall = Вучоныя Нефрытавай залы
Greetings to you, King Sejong the Great, heir of the Choson Dynasty! Prosperity and benevolence towards the common man are the principles of your reign, and made of you the most beloved Korean king. You always aimed to provide a fair and equal society for all your people, and also to favor knowledge and technological discoveries. Your wisdom and intelligence imbued all the Korean society, and the scholars of the Jade Hall developed Korea's first written language, Hangul, sharing further literature and science to the people after centuries of darkness. = Вітаю цябе, кароль Седжон Вялікі, спадчыннік дынастыі Чосан! Росквіт і добразычлівасць да простага чалавека з'яўляюцца прынцыпамі вашага праўлення, і зрабілі з вас самым любімым карэйскім каралём. Вы заўсёды імкнуліся стварыць справядлівае і роўнае грамадства для ўсіх вашых людзей, а таксама спрыяць ведам і тэхналагічным адкрыццям. Ваша мудрасць і розум прасякнулі ўсё карэйскае грамадства, і навукоўцы з Нефрытавай залы распрацавалі першую пісьмовую мову Карэі, хангыль, падзяліўшыся літаратурай і навукай з людзьмі пасля стагоддзяў цемры.
Wise Sejong, will you gift your people with the radiance of harmony and knowledge to dispel the darkness once again? Will your new empire shine through the ages of history? = Мудры Седжон, ты адарыш свой народ ззяннем гармоніі і ведаў, каб зноў рассеяць цемру? Ці будзе ваша новая імперыя ззяць праз вякі гісторыі?
