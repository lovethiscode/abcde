# Documentation: https://f-droid.org/en/docs/Build_Metadata_Reference/#Summary
# English to translate: https://github.com/yairm210/Unciv/blob/master/fastlane/metadata/android/en-US/short_description.txt
Fastlane_short_description = 4X гульня пра будаванне цывілізацыі

# Documentation: https://f-droid.org/en/docs/Build_Metadata_Reference/#Description
# English to translate: https://github.com/yairm210/Unciv/blob/master/fastlane/metadata/android/en-US/full_description.txt
Fastlane_full_description = Рэалізацыя самых знакамітых гульняў пра будаванне цывілізацыі калі-небудзь - хуткая, маленькая, няма рэкламы, даравана назаужды.\n\nПабудуйце вашу цывілізацыю, даследуйце тэхналогіі, пашырайце вашыя гарады і перамагайце ворагаў!\n\nПрапановы? Багі? Спіс задач для распрацоўкі https://github.com/jerry8870/Unciv4iOS, любая дапамога вітаецца!\n\nПытанні? Каментарыі? Або проста сумна? Далучайцеся да нас: https://discord.gg/bjrB4Xw.\n\nХочаце дапамоч перавесці гульню на вашу мову? Адпраўце мне email на адрас yairm210@hotmail.com\n\nРазбіраецеся ў Java або Kotlin? Далучайцеся да нас: https://github.com/yairm210/Unciv.\n\nСвет чакае! Ці атрымаецца ў вас перабудавайь цывілізацыю ў імперыю якая вытрымае націск часу?\n\nДазвол на 'поўны доступ да сеткі' патрабуецца для карыстальніцкіх усталёвак і для шматгульцовай падтрымкі. Усе астатнія дазволы, ўключаныя аўтаматычна ад API, выкарыстоўваюцца для паведамлення а зробленым ходзе. Сеткавыя дазовлы выкарыстоўваюцца для работы спісу мадыфікацый, усталёўкі мадыфікацый, усталёўкі музыкі і для загрузкі/усталёўкі шматгульцовых гульняў. Больш няма сеткавых камунікацый ініцыялізаваных ад Unciv.


