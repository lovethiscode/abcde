### DontSpyOnUs 

Stop spying on us. = Ieqfu tnemmsu fostna.
We see our people are not welcome in your lands... we will take our attention elsewhere. = Issa indunajna li ma nistgħux nafdawkom iktar... ħa nagħtu l-attenzjoni tagħna xi mkien ieħor.
I'll do what's necessary for my empire to survive. = Se nagħmlu dak li għandna bżonn biex l-imperu tagħna jgħix.
Take back your spy and your broken promises. = Ħu lura l-ispjun tiegħek u terġax tagħmilha.
