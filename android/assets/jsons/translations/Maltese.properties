Sejong = Sejong 
Jip-hyun-jun (Hall of Worthies) will no longer tolerate your irksome behavior. We will liberate the citizens under your oppression even with force, and enlighten them! = Il-Jip-hyun-jun (is-Sala tal-Ġusti) ma jibqax jittollera l-insolenza tiegħek. Se neħilsu liċ-ċittadini oppressi tiegħek, anke bil-forza, u ndawluhom!
Foolish, miserable wretch! You will be crushed by this country's magnificent scientific power! = Ja nisel iblah ta' xebba! Se tinqered mill-qawwa xjentifika magnifika ta' pajjiżi!
Now the question is who will protect my people. A dark age has come. = Ir-riċerka xjentifika bla heda tiegħi għamietni għat-theddida li kienet qed titfaċċa fuq in-nazzjon tiegħi... sakemm kien tard wisq. Fejn jista' jiġu in-nies tiegħi issa għall-gwida? Żminijiet mudlama laqtuna.
Your words reveal more of your own prejudice than any fault in my own. = Kliemek jikxef aktar il-preġudizzju tiegħek milli xi ħtija tiegħi.
Welcome to the palace of Choson, stranger. I am the learned King Sejong, who looks after his great people. = Merħba fil-qorti ta' Choson, barrani onorat. Jiena r-Re Sejong l-Għarfien, il-mexxej imdawwal u l-ħakkiem ta' dawn l-artijiet u dawn in-nies. Għamilt ħafna għan-nisel tiegħi: tista' tgħid l-istess?
We have many things to discuss and have much to benefit from each other. = Għandna ħafna x'niddiskutu u ħafna x'niggwadanjaw minn xulxin.
Oh, it's you = Ew, ġejt int
Scholars of the Jade Hall = Għorrief tas-Sala tal-Ġada
Greetings to you, King Sejong the Great, heir of the Choson Dynasty! Prosperity and benevolence towards the common man are the principles of your reign, and made of you the most beloved Korean king. You always aimed to provide a fair and equal society for all your people, and also to favor knowledge and technological discoveries. Your wisdom and intelligence imbued all the Korean society, and the scholars of the Jade Hall developed Korea's first written language, Hangul, sharing further literature and science to the people after centuries of darkness. = Sliem għalik, Re magnifiku Sejong il-Kbir, qaddej tal-poplu u protettur tad-Dinastija Choshon. Il-viżjoni glorjuża tiegħek ta' prosperità u l-benevolenza bla qies tiegħek lejn in-nies komuni għamluk l-aktar monarku Korean maħbub. Mill-ewwel jiem tar-renju tiegħek, l-isforzi tiegħek biex tistabbilixxi soċjetà bilanċjata u ġusta għal kulħadd ġew megħluba biss mill-iskoperti u l-innovazzjonijiet teknoloġiċi introdotti permezz tal-għatx insazjabbli tiegħek għall-għarfien. Iggwidati mill-għerf tiegħek, l-istudjużi tas-Sala tal-Ġada żviluppaw l-ewwel alfabett Korean, Hangul, li dawwal lill-mases bid-dawl tal-letteratura u x-xjenza wara sekli ta' dlam.
Wise Sejong, will you gift your people with the radiance of harmony and knowledge to dispel the darkness once again? Will your new empire shine through the ages of history? = Onorat Sejong, in-nies tiegħek iduru lejk għal darba oħra għall-gwida! Se taħtaf din l-opportunità biex iġġib l-armonija u l-fehim fost in-nies tagħna? Tista' terġa' tirrestawra r-renju tiegħek għal għoli daqshekk stordut? Tista' toħloq ċivilizzazzjoni li tiflaħ għat-test taż-żmien?
