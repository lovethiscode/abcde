George Washington = George Washington
Your wanton aggression leaves us no choice. Prepare for war! = Ittamajt li ma kont se nagħmel li ħa nagħmel... imma l-idea tiegħek ta' paċi ma tagħtinix għażla oħra!
You have mistaken our love of peace for weakness. You shall regret this! = Ħawwadt l-imħabba tagħna għall-paċi mad-dgħufija. Jekk irrid nagħżel bejn il-ġustizzja u l-paċi... nagħżel il-ġustizzja!
The day...is yours. I hope you will be merciful in your triumph. = Ir-rebħa hija tiegħek. Nittama li tkun ħanin f'trijonfek.
The people of the United States of America welcome you. = Nilqagħkom f'isem il-poplu tal-Istati Uniti tal-Amerika.
Is the following trade of interest to you? = Forsi tkun interessat f'dan il-ftehim kummerċjali?
Well? = Kollox sew jew?
Manifest Destiny = Destin Manifestat
President Washington, we salute you and the proud American civilization! Freed from the British dominion in the 18th century, then cleansed and reborn after a terrible civil war, the United States nation was ready to play its great role in the 20th century. At the height of its power, triumphant after two terrible world wars, United States of America, a land of immigration, opportunities, optimism and determination, has risen above all other weakening nations, unable to equal such power. = Merħba, President Washington! Inti tmexxi ċ-ċiviltà Amerikana ħabrieka, li nħolqot wara r-Rivoluzzjoni fis-seklu 18 u li ġiet mgħaddsa, bħala nazzjon żagħżugħ ta' bilkemm seklu, fin-nassa terribbli tal-Gwerra Ċivili li heddet li taqsmu għal dejjem. Iżda ftit wara, fis-seklu 20, l-Istati Uniti laħqu l-quċċata tal-poter tagħhom, billi ħarġu vittorjużi u dejjem aktar b'saħħithom wara ż-żewg Gwerer Dinjija terribbli li raw il-mewt ta' tant ġnus kbar.
President Washington, will you show to the world the legitimacy of the American way of life, and spread the flame of liberty to all mankind? Will your new empire shine through the ages of history? = President, l-Istati Uniti huma pajjiż t'immigranti, mimlija ottimiżmu u determinazzjoni. Kull ma jonqsilhom huwa mexxej li jgħinhom jirrealizzaw il-potenzjal tagħhom. President Washington, tista' tmexxi l-Amerika għall-kobor? Tista' tifforma ċivilizzazzjoni li tista' tiflaħ għal tant snin oħra?
