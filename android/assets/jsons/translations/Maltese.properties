尚无符合条件的解放归还记录。 = Ebda ħelsien u ritorn eliġibbli rreġistrati.
本关发生归属中断，可在后续关卡重新尝试。 = Il-pussess ġie interrott; erġa' pprova fi stadju aktar tard.
三城连续归属观察中，按时完成本关后核对。 = Qed jiġi osservat pussess kontinwu; jiġi ċċekkjat meta l-istadju jitlesta fil-ħin.
达到三城容量并在首波前建立三城，可在后续关卡尝试。 = Iftaħ kapaċità ta' tliet bliet u kun sid ta' tliet bliet qabel l-ewwel mewġa ta' stadju futur.
把长期发展转化为完整终局，纪念第一次亲自完成一场胜利。 = Wassal l-iżvilupp fit-tul għal tmiem sħiħ u fakkar l-ewwel rebħa tiegħek.
选择第二座城的位置，在资源、地形和扩张成本之间作第一次取舍。 = Agħżel fejn twaqqaf it-tieni belt tiegħek u ibbilanċja r-riżorsi, it-terren u l-ispejjeż tal-espansjoni.
第一次为文明选择发展方向，感受政策带来的长期差异。 = Agħżel direzzjoni għaċ-ċiviltà tiegħek u skopri l-effetti dejjiema tal-politiki.
协调两座城市的生产与黄金时代时机；争夺奇观的风险，让排期本身成为决策。 = Ikkoordina l-produzzjoni f'żewġt ibliet mal-ħin ta' Żmien tad-Deheb. Il-kompetizzjoni għall-meravilji tagħmel l-iskedar għażla strateġika.
围绕一座奇观安排科技和生产，体验与其他文明争夺同一目标。 = Ippjana t-teknoloġija u l-produzzjoni madwar meravilja u kkompeti ma' ċiviltajiet oħra biex tibniha.
认识移动、攻击与生存的基本关系，获得第一次真实交锋的反馈。 = Tgħallem kif il-moviment, l-attakk u s-sopravivenza jaħdmu flimkien permezz tal-ewwel battalja vera tiegħek.
把地图上的土地变成实际产出，理解工人与城市发展的关系。 = Biddel l-art f'madum produttiv u tgħallem kif il-Ħaddiema jgħinu l-iżvilupp tal-belt.
把分散的城市组织成网络，选择道路、海港或两者组合，而非只追求城市数量。 = Qabbad bliet imxerrda f'netwerk b'toroq, Portijiet jew it-tnejn, minflok tiffoka biss fuq l-għadd ta' bliet.
让粮食、人口与教育设施相互支持，形成一座有清楚用途的学术中心。 = Għaqqad l-ikel, il-popolazzjoni u l-bini edukattiv biex toħloq ċentru ddedikat għat-tagħlim.
比较不同城邦类型的收益，决定把有限外交投入放在哪里。 = Qabbel il-benefiċċji tat-tipi differenti ta' bliet-stati u iddeċiedi fejn tinvesti r-riżorsi diplomatiċi limitati tiegħek.
把创教转为本土社会的共同信仰，体验城市布局、自然传播和主动传教的配合。 = Xerred ir-reliġjon li waqqaft f'artek billi tgħaqqad il-pożizzjoni tal-bliet, it-tixrid naturali u l-konverżjoni attiva.
在未知地图中获得发现的惊喜。作为自然探索纪念，不要求为三处奇观反复重开。 = Gawdi l-iskoperti fuq mappa mhux familjari. Dan il-pass tal-esplorazzjoni ma jeħtieġx li tibda mill-ġdid ripetutament biex issib tliet meravilji.
以有限城市投入科研，依靠质量和发展效率完成太空目标。允许防卫战争，限制的是指定战斗占城。 = Iffoka għadd limitat ta' bliet fuq riċerka effiċjenti biex tilħaq l-ispazju. Gwerer difensivi huma permessi; ir-restrizzjoni tikkonċerna l-qbid militari speċifikat.
在有限城市规模下集中积累文化，安排政策、建设与胜利项目的先后。 = Ikkonċentra l-kultura f'imperu żgħir u ippjana l-ordni tal-politiki, il-bini u l-proġett tar-rebħa.
改变扩张来源：不继续自行建城，以军事实力和占领后的管理建立帝国。 = Espandi permezz tal-konkwista minflok twaqqaf aktar bliet, u ibni imperu bis-saħħa militari u l-ġestjoni tal-bliet.
用有限城市支撑政策专精，选择两条适合当前战略的政策路线。 = Appoġġja żvilupp iffokat tal-politiki b'għadd limitat ta' bliet u agħżel żewġ fergħat li jaqblu mal-istrateġija tiegħek.
围绕外国首都组织宗教影响力，选择传播对象与时机，承担跨国竞争。 = Ibni influwenza reliġjuża madwar kapitali barranin, billi tagħżel fejn u meta xxerred ir-reliġjon fost il-kompetizzjoni internazzjonali.
利用埃及建造优势，把一座城市经营成奇观中心，在科技、生产与抢建风险之间取舍。自选重投入专项。 = Uża l-vantaġġ tal-bini tal-Eġittu biex tagħmel belt waħda ċentru tal-meravilji, waqt li tibbilanċja r-riċerka, il-produzzjoni u l-kompetizzjoni. Din hija sfida fakultattiva li teħtieġ investiment sostanzjali.
预先协调多条战线和占城部队，让几场局部战斗汇成同一回合的战略突破。 = Ikkoordina diversi fronti u aqbad unitajiet biex battalji separati jsiru żblokk strateġiku f'dawra waħda.
围绕波斯黄金时代的持续时间与战斗优势准备攻势，在有效窗口集中兑现实力。自选进阶专项。 = Ħejji offensiva madwar it-tul u l-vantaġġi tal-ġlied taż-Żmien tad-Deheb tal-Persja. Din hija sfida avvanzata fakultattiva.
用小国规模应对更高难度，挑选一条适合的非时间胜利路线，而非依靠不断扩张。 = Affaċċja diffikultà ogħla b'imperu żgħir u agħżel rotta ta' rebħa xierqa li mhix tal-Ħin minflok tiddependi fuq espansjoni kontinwa.
检验对整体战略、时机和局势判断的掌握；是玩家主动选择的高手目标。 = Ittestja l-ħakma tiegħek tal-istrateġija, tal-ħin u tas-sitwazzjoni. Din l-isfida esperta hija fakultattiva.
让唯一城市承担科研、经济与防卫，寻找单城条件下的完整发展解法。 = Uża belt waħda għar-riċerka, l-ekonomija u d-difiża, u żviluppa strateġija sħiħa f'dak il-limitu.
主动放弃世界奇观这条优势来源，探索政策、城市发展与文化胜利之间的其他组合。 = Iċċaħħad mill-Meravilji Dinjija u esplora modi oħra kif tgħaqqad il-politiki, l-iżvilupp tal-belt u r-rebħa kulturali.
