Fine then. It's your call. = Orrajt mela. Għidli int.
I greet you, stranger! If you are as intelligent and tactful as you are attractive, we'll get along just fine. = Kif int, barrani! Jekk int intelliġenti daqs kemm int mazza, se naħdmu sew flimkien żgur.
