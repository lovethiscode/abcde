Strike me down and my soul will torment yours forever, you have won nothing. = Oqtolni u ruħi se tittormentak għal dejjem, xejn mhinti se tikseb minni
Greetings, I am Ramesses the god. I am the living embodiment of Egypt, mother and father of all civilizations. = Merħba, jiena l-alla Ramesse. Jiena nirrappreżenta lill-Eġittu, l-omm u l-missier ta' kull ċivilizizazzjoni.
