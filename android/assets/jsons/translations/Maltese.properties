在单城挑战中走向群星 = Ilħaq il-kwiekeb fl-Isfida: Belt Waħda Biss
在单城挑战中，\n让唯一的城市赢得科技胜利。 = Fl-Isfida: Belt Waħda Biss,\nħalli l-unika belt tiegħek tirbaħ rebħa Xjentifika.
无碑华章 = Kultura Mingħajr Meravilji
皇帝及以上难度，开局至少4个 AI 对手。获得文化胜利，且整局从未拥有过任何世界奇观，包括占领或接收城市带来的奇观；国家奇观不受限制。 = Diffikultà Imperatur jew ogħla; ibda b'mill-inqas 4 avversarji tal-IA. Irbaħ rebħa Kulturali mingħajr qatt tkun sid ta' xi Meravilja Dinjija matul il-logħba kollha, inklużi meravilji fi bliet maħkuma jew miksuba; Meravilji Nazzjonali m'għandhomx restrizzjonijiet.
获得文化胜利，且整局从未拥有过任何世界奇观，包括占领或接收城市带来的奇观；国家奇观不受限制。 = Irbaħ rebħa Kulturali mingħajr qatt tkun sid ta' xi Meravilja Dinjija matul il-logħba kollha, inklużi meravilji fi bliet maħkuma jew miksuba; Meravilji Nazzjonali m'għandhomx restrizzjonijiet.
不拥奇观，赢得文化胜利 = Irbaħ bil-kultura mingħajr tkun sid ta' Meravilji Dinjija
一座世界奇观也不曾拥有。\n让文化本身带你走向胜利。 = Qatt tkun sid ta' ebda Meravilja Dinjija.\nĦalli l-kultura nnifisha twasslek għar-rebħa.
海峡两岸 = Lil Hinn mill-Ilma
不限难度。自行在与当前首都不同的连通陆地区域建立分城，为其建成海港或等价建筑；己方回合结算时，该城通过包含海路的有效连接接通首都。允许首都经道路连接本土港口后出海，不要求首都沿海。 = Fuq kwalunkwe diffikultà, waqqaf belt mhux kapitali fuq massa ta' art konnessa differenti minn dik tal-kapitali kurrenti tiegħek u ibni Port jew ekwivalenti hemmhekk. Fil-kalkolu ta' tmiem id-dawra tiegħek, il-belt irid ikollha konnessjoni mal-kapitali rikonoxxuta mil-logħba li tinkludi rotta bil-baħar. Il-kapitali tista' tkun konnessa bit-triq ma' port domestiku; m'għandhiex għalfejn tkun mal-kosta.
在另一块陆地自建城市，建成海港，让海路将它接入首都。 = Waqqaf belt fuq massa ta' art oħra u qabbadha mal-kapitali bil-baħar permezz ta' Port.
让海洋连接你的城市 = Qabbad il-bliet tiegħek minn naħa għal oħra tal-baħar
选择值得投入的海外城址，安排港口和交通，让海洋成为发展通道。 = Ibbilanċja l-espansjoni lil hinn mill-baħar mal-ispiża tal-konnessjoni ta' insedjament imbiegħed.
互通有无 = Xi Ħaġa x'Tinnegozja
不限难度。与一个主要文明完成一份有效交易：出口本国来源的重复奢侈品，换入交易前本国没有可用供应的一种奢侈品；交易后出口品仍至少保留一份，换入品已可用。允许金币等补差价，不要求总幸福非负或额外等待。 = Fuq kwalunkwe diffikultà, lesti skambju effettiv ma' ċiviltà ewlenija: esporta riżorsa ta' lussu doppja minn sorsi domestiċi u importa riżorsa ta' lussu li ma kellekx provvista użabbli tagħha qabel l-iskambju. Wara, żomm mill-inqas kopja użabbli waħda tar-riżorsa ta' lussu esportata u ikollok provvista użabbli ta' dik importata. Deheb jew termini oħra għall-bilanċ huma permessi. Mhumiex meħtieġa kuntentizza totali mhux negattiva jew stennija addizzjonali.
用本国的重复奢侈品，换入此前没有供应的一种奢侈品，且出口后保留一份。 = Innegozja riżorsa ta' lussu żejda domestika għal waħda li ma kellekx, waqt li żżomm waħda minn dik esportata.
用富余资源换来新的选择 = Innegozja eċċess għal għażla ġdida
把富余资源转化为新的选择，寻找互利交易对象。阿拉伯可用大巴扎增加的资源份数达成。 = Biddel riżorsi żejda f'għażla diplomatika utli.
重归故土 = Ritorn lejn l-Art Twelid
不限难度。通过战斗夺取一座其他主要文明或城邦建立的城市，选择解放并完成归还原建立者的结算；玩家此前没有正式拥有过该城。直接解放流程中的临时归属不算此前占有；不要求结盟或后续存活。 = Fuq kwalunkwe diffikultà, aqbad fil-ġlied belt imwaqqfa minn ċiviltà ewlenija oħra jew belt-stat, agħżel il-ħelsien, u lesti r-ritorn tagħha lill-fundatur oriġinali. Qatt ma trid tkun kont formalment sid il-belt qabel. Pussess temporanju waqt ħelsien dirett ma jgħoddx bħala pussess preċedenti. Alleanza jew sopravivenza sussegwenti mhumiex meħtieġa.
战斗夺取一座从未正式拥有过的外国城市，将它解放归还原建立者。 = Aqbad belt barranija li qatt ma kienet formalment tiegħek u eħlisha lura lill-fundatur tagħha.
将一座城市归还故土 = Irritorna belt lill-fundatur tagħha
在得到城市与归还城市之间作选择，留下外交意义上的战争故事。只在自然出现机会时尝试。 = Agħżel ir-restawr minflok iżżid kull konkwista mal-imperu tiegħek.
城下解围 = Għajnuna fil-Bibien
不限难度。己方回合开始时，一座自建城市的相邻格有可见的敌对主要文明军事单位；本回合由己方部队或城市击败其中至少一支。到下一己方回合开始，该城始终归己方，且相邻格已没有任何可见的敌对主要文明军事单位。若本局先取得正式胜利，则在胜利结算时核对剩余观察条件。 = Fuq kwalunkwe diffikultà, unità militari ostili viżibbli ta' ċiviltà ewlenija trid tkun maġenb belt li waqqaft int fil-bidu tad-dawra tiegħek. L-unitajiet jew il-belt tiegħek iridu jegħlbu mill-inqas unità bħal dik matul dik id-dawra. Sal-bidu tad-dawra tiegħek li jmiss, il-belt trid tkun baqgħet tiegħek kontinwament u ma jkollhiex unitajiet militari ostili viżibbli ta' ċiviltajiet ewlenin maġenbha. Jekk rebħa uffiċjali ttemm il-logħba qabel, il-kundizzjonijiet ta' osservazzjoni li fadal jiġu ċċekkjati fil-kalkolu ta' dik ir-rebħa.
击败回合开始时邻接自建城市的一支敌军，下一己方回合确认解围。 = Egħleb għadu ħdejn belt li waqqaft int u kkonferma l-ħelsien tal-assedju fid-dawra li jmiss.
为城下的危机画上句号 = Temm assedju
把兵力和城市火力集中到眼前危机，解除局部压力。不必等别人宣战、凑三杀或故意让城市受伤。 = Ikkoordina kontrattakk u pproteġi l-belt matul ir-risposta tal-għadu.
攻坚有序 = Armi Magħquda
不限难度。在与守城主要文明的同一场战争中，先由己方攻城单位或远程海军对城市造成正数伤害，再由另一支具备近战占城能力的部队战斗占领该城并完成归属选择。允许跨回合；议和或城市中途转手后重新开始。交易取得、直接解放不计。 = Fuq kwalunkwe diffikultà, matul l-istess gwerra kontra ċ-ċiviltà ewlenija difensiva, l-ewwel agħmel ħsara pożittiva lil belt bl-unità ta' assedju jew unità navali mill-bogħod tiegħek, imbagħad aqbadha fil-ġlied b'unità differenti li tista' tiġġieled mill-qrib u lesti l-għażla tal-pussess. L-azzjonijiet jistgħu jestendu fuq dawriet differenti. Paċi jew bidla fil-pussess bejniethom jerġgħu jibdew is-sekwenza. Skambji u ħelsien dirett ma jikkwalifikawx.
让攻城单位或远程海军先伤害敌城，再由另一支部队战斗占领。 = Agħmel ħsara lil belt tal-għadu b'nar ta' assedju jew navali mill-bogħod, imbagħad aqbadha b'unità oħra.
让支援与攻城各司其职 = Ħalli l-appoġġ u l-assalt jaħdmu flimkien
选择支援火力和夺城部队，组织真正的联合攻坚；允许轮换和损失，不用留残血给指定兵种。 = Agħti rwoli komplementari lin-nar ta' appoġġ u lill-unità li taqbad il-belt.
战后新生 = Belt Imwielda mill-Ġdid
不限难度。战斗取得一座其他主要文明建立的城市并持续保有；抵抗结束时记录人口基准。此后在该城已连接首都的结算中，以正常粮食增长使人口超过该基准。无抵抗时以收城结算后人口为基准；直接赠送人口不能单独完成。 = Fuq kwalunkwe diffikultà, aqbad fil-ġlied belt imwaqqfa minn ċiviltà ewlenija oħra u żommha kontinwament. Irreġistra l-popolazzjoni tagħha meta tintemm ir-reżistenza, jew wara l-konklużjoni tal-qbid jekk m'hemmx reżistenza. F'kalkolu sussegwenti waqt li tkun konnessa mal-kapitali, tkabbir normali mill-ikel irid jgħolli l-popolazzjoni 'l fuq minn dik il-bażi. Popolazzjoni mogħtija direttament ma tistax tlesti l-kundizzjoni waħedha.
保有战斗取得的城市，抵抗结束后连接首都，并让人口以粮食增长超过基准。 = Żomm belt maħkuma, temm ir-reżistenza tagħha, qabbadha mal-kapitali u kabbarha bl-ikel lil hinn mill-bażi tagħha.
让战后的城市重新生长 = Ħalli belt terġa' tikber wara l-gwerra
从拿下城市转向让城市重新发展，安排交通、粮食和治理。无需同时维持全帝国财政、幸福等多重指标。 = Biddel suċċess militari f'belt funzjonali li qed tikber.
罗马传承 = Wirt Ruman
不限难度，使用罗马。在两座不同自建分城各通过正常生产完成一座普通建筑；各自至少一次实际生产结算因首都已有相应建筑而获得罗马加成，完成时加成条件仍有效。建筑可不同；直接购买完成、世界及国家奇观不计。分城可以先开工，不必等首都先完成才排队。 = Bħala Ruma fuq kwalunkwe diffikultà, lesti bini ordinarju permezz ta' produzzjoni normali f'kull waħda minn żewġ bliet differenti mhux kapitali li waqqaft int. Kull waħda trid tkun irċeviet il-bonus Ruman f'kalkolu reali tal-produzzjoni għax il-kapitali kellha l-bini korrispondenti; dik il-kundizzjoni trid tibqa' valida mat-tlestija. Il-bini jista' jkun differenti. Xiri, Meravilji Dinjija u Meravilji Nazzjonali ma jgħoddux. Huwa permess tibda l-kostruzzjoni qabel ma l-kapitali tlesti l-bini korrispondenti tagħha.
让两座自建分城各通过实际享受罗马加成的普通生产完成一座建筑。 = Lesti bini prodott normalment f'kull waħda minn żewġ bliet satelliti li waqqaft int billi tuża l-bonus tal-produzzjoni Ruman.
让首都的积累惠及分城 = Ħalli l-kapitali tgħin bliet ġodda
用首都积累带动分城建设，按各城需求选择建筑。体现罗马能力，不要求五城都造兵营或等十人口。 = Uża l-kapitali biex tappoġġja bliet bi bżonnijiet differenti.
连弩初试 = Il-Ballesta Ripetittiva
不限难度，使用中国。同一支诸葛弩在一个己方回合内，对主要文明军事单位或城市完成两次主动攻击，两次均造成正数伤害，并持续归己方、存活至下一己方回合开始。可以攻击同一目标，不要求击杀或实战晋升；两次攻击均须发生在诸葛弩形态。若本局先取得正式胜利，则在胜利结算时核对剩余观察条件。 = Bħala ċ-Ċina fuq kwalunkwe diffikultà, Chu-Ko-Nu waħda trid tagħmel żewġ attakki attivi f'dawra waħda kontra unitajiet militari jew bliet ta' ċiviltajiet ewlenin, u tagħmel ħsara pożittiva kull darba. Trid tibqa' ħajja u kontinwament tiegħek sakemm tibda d-dawra tiegħek li jmiss. L-istess mira tista' tiġi attakkata darbtejn; qtil u promozzjonijiet miksuba mhumiex meħtieġa. Iż-żewġ attakki jridu jsiru fil-forma Chu-Ko-Nu. Jekk rebħa uffiċjali ttemm il-logħba qabel, il-kundizzjonijiet ta' osservazzjoni li fadal jiġu ċċekkjati fil-kalkolu ta' dik ir-rebħa.
同一支诸葛弩本回合主动攻击两次并造成伤害，存活至下一己方回合。 = Agħmel żewġ attakki li jagħmlu ħsara b'Chu-Ko-Nu waħda f'dawra u żommha sad-dawra tiegħek li jmiss.
让连弩接连出击，带它平安归来 = Attakka darbtejn u ġib l-unità lura d-dar
决定第二次攻击打谁，以及如何保护射击后的部队。直接体验连射能力，不用先养经验、喂两个残血目标。 = Agħżel mira oħra waqt li tippjana kif tipproteġi lill-attakkant.
山间粮仓 = Maħżen tal-Qamħ tal-Muntanji
不限难度，使用印加。在自建城市可工作范围内完成一处邻接至少两座山脉的梯田，并让市民在至少一次实际粮食结算中工作该地块；结算时梯田未被掠夺、仍属己方。不限城市人口，不要求三处梯田。 = Bħala l-Inka fuq kwalunkwe diffikultà, lesti Razzett Imtarraġ maġenb mill-inqas żewġ muntanji fiż-żona li tista' tinħadem ta' belt li waqqaft int. Ċittadin irid jaħdmu għal mill-inqas kalkolu reali wieħed tal-ikel waqt li jibqa' tiegħek u mhux misruq. Mhumiex meħtieġa limitu ta' popolazzjoni jew irziezet addizzjonali.
建成一处邻接两座山脉的梯田，并让市民实际工作它一次。 = Ibni Razzett Imtarraġ ħdejn mill-inqas żewġ muntanji u aħdmu għal kalkolu reali tal-ikel.
在群山之间收获粮食 = Aħsad l-ikel bejn il-muntanji
识别合适的山间丘陵，把地形限制变为粮食优势。只在已经发现合适位置时推荐。 = Agħraf it-terren li jbiddel ir-restrizzjonijiet tal-muntanji f'ikel.
来去如风 = Irkeb Bħar-Riħ
不限难度，使用蒙古。同一支怯薛骑兵在一个己方回合中，先主动攻击主要文明军事单位或城市并造成正数伤害，再主动移动到另一格，并持续归己方、存活至下一己方回合开始。攻击和移动均发生在怯薛形态；强制传送不计。若本局先取得正式胜利，则在胜利结算时核对剩余观察条件。 = Bħala l-Mongolja fuq kwalunkwe diffikultà, Keshik waħda trid tattakka attivament unità militari jew belt ta' ċiviltà ewlenija għal ħsara pożittiva, imbagħad tiċċaqlaq volontarjament għal maduma differenti fl-istess dawra. Trid tibqa' ħajja u kontinwament tiegħek sakemm tibda d-dawra tiegħek li jmiss. Iż-żewġ azzjonijiet iridu jsiru fil-forma Keshik; teleportazzjoni sfurzata ma tgħoddx. Jekk rebħa uffiċjali ttemm il-logħba qabel, il-kundizzjonijiet ta' osservazzjoni li fadal jiġu ċċekkjati fil-kalkolu ta' dik ir-rebħa.
同一支怯薛骑兵攻击造成伤害后主动换格，存活至下一己方回合。 = Attakka b'Keshik waħda, mexxiha għal maduma oħra u żommha sad-dawra tiegħek li jmiss.
射击之后，寻找下一处阵地 = Sib pożizzjoni oħra wara li tispara
预留移动力，在射击后选择撤离、侧移、让路或继续推进；完成一次即可，不把后撤规定为唯一正确解法。 = Żomm moviment għall-irtirar, tibdil tal-pożizzjoni, ftuħ ta' mogħdija jew avvanz.
殊途同归 = Toroq Differenti
不限难度。三个不同合格自由对局分别取得三种不同的非时间胜利，从科技、文化、征服、外交中任选三种。同一局游戏 只贡献首个正式终局结果；重载、复制存档不增加局数或胜利种类。 = Fuq kwalunkwe diffikultà, irbaħ tliet tipi differenti ta' rebħa mhux tal-Ħin minn fost Xjentifika, Kulturali, Dominazzjoni u Diplomatika, kull waħda f'logħba libera eliġibbli differenti. Jgħodd biss l-ewwel riżultat finali formali ta' kull ID tal-logħba. Sejvs mgħobbija mill-ġdid jew ikkupjati ma jżidux logħob jew tipi ta' rebħa.
在三个不同的合格对局中，取得三种不同的非时间胜利。 = Irbaħ tliet tipi distinti ta' rebħa mhux tal-Ħin fi tliet logħbiet eliġibbli differenti.
用三种方式走向胜利 = Sib tliet rotot lejn ir-rebħa
走出熟悉的一种打法，体验三种不同战略。次数对应策略种类，不是把同一局再刷两遍。 = Esplora strateġiji distinti minflok tirrepeti rotta familjari waħda.
五波之后 = Wara Ħames Mewġiet
无尽，轻松或野蛮均可。同一次挑战首次在期限内清除第一关全部五波，进入关卡完成结算，且核心仍归己方。 = F'Difiża bla tmiem bir-ritmu Rilassat jew Selvaġġ, għeleb il-ħames mewġiet kollha tal-ewwel stadju fil-ħin tiegħu fi prova waħda u ilħaq il-kalkolu tat-tlestija tal-istadju waqt li l-qalba tibqa' tiegħek.
在期限内清除第一关的五波敌军，并保有核心城市。 = Egħleb il-ħames mewġiet kollha tal-ewwel stadju qabel l-iskadenza tiegħu waqt li żżomm il-qalba.
守过第一关的五波来敌 = Żomm sod matul l-ewwel ħames mewġiet
将布防、资源与波次处理贯穿一整个关卡，获得清楚的首次通关反馈。 = Wassal l-iskjerament, ir-riżorsi u l-immaniġġjar tal-mewġiet tul stadju sħiħ.
三城同守 = Tliet Bliet Jibqgħu Sodi
无尽，轻松或野蛮均可。已解锁三城容量；某关第一波出现前已拥有三座城市，从第一波出现到该关按时完成，这三城持续归己方。不限必须哪一关完成，不限制部队损失和关间奖励选择。 = F'Difiża bla tmiem bi kwalunkwe ritmu, iftaħ kapaċità ta' tliet bliet u kun sid ta' tliet bliet qabel tidher l-ewwel mewġa ta' stadju. Żomm it-tlieta kontinwament sakemm dak l-istadju jitlesta fil-ħin. Kwalunkwe stadju jista' jikkwalifika; telf ta' unitajiet u għażliet ta' premjijiet bejn l-istadji m'għandhomx restrizzjonijiet.
一关首波来临前已有三城，持续保有这三城直到按时过关。 = Kun sid ta' tliet bliet qabel jibda stadju u żommhom kontinwament sakemm tlestih fil-ħin.
让三座城市一同守到关末 = Żomm tliet bliet sodi sat-tmiem
主动扩张后承担更复杂的防线，安排机动支援与城市分工；不是要求所有玩家都建满三城。 = Aċċetta l-għażliet difensivi maħluqa mill-espansjoni u qassam l-appoġġ fost il-bliet.
不息战线 = Front Mhux Miksur
