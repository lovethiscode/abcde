Boudicca = Budikka
You shall stain this land no longer with your vileness! To arms, my countrymen. We ride to war! = Jiena u n-niesi għajjejna mill-biża' tagħkom! 'Il quddiem, ħuti! Ejjew nimxu għall-gwerra!
Traitorous man! The Celtic peoples will not stand for such wanton abuse and slander - I shall have your balls! = Ja bniedem mistmerr! Qatt mhu se naħfirlek ir-regħba tiegħek! Irrid nieħu rasek... u l-bajd tiegħek!
Vile ruler, know you have won this war in name alone. Your cities lie buried and your troops defeated. I have my own victory. = Ja ħakkiem vili, kun af li rbaħt dil-gwerra biss bl-isem. Darba minnhom, l-armati tiegħek ukoll se jinqerdu, u l-bliet tiegħek se jaqgħu fir-ramel.
Don't forget who you're dealing with. Arrogant moves can get you in danger. = Tinsiex ma' min qed titkellem. L-atti arroganti huma dejjem sorsi ta' periklu.
I am Boudicca, Queen of the Celts. Let no-one underestimate me! = Jiena Budikka, ir-reġina tat-tribù Keltika. Ara ma tistħajjilnix bniedem kwiet, għax malajr tara qawwiti.
Let us join our forces together and reap the rewards. = Anke jekk ma naqsmux ix-xwabel kontra għadu komuni, ningħaqdu flimkien għal ftehim komuni.
God has given good to you. = Alla tak il-ġid.
Druidic Lore = Drawwa Druwidistika
May glory and honor always be upon you, Warrior Queen! In a time dominated by men, you successfully claimed the throne and the power, but also valiantly defied the mighty Roman Empire. Punished and humiliated by the hand of the Roman bloody invaders, you united your people and led a terrible revolt, to seek revenge. Many legions fell under your fierce attacks and you burned the city of London with your anger. While the Romans still kept ownership of your land after your final defeat, your actions nonetheless showed Rome that this land could never be fully conquered, making Nero himself consider to withdraw all troops and leaving Britain forever. = Tifħir u glorja eterna lilek, reġina gwerriera qalila u vendikattiva! F'epoka ddominata mill-irġiel, int mhux biss assigurajt it-tron u l-poter assolut tiegħek, iżda rnexxielek ukoll tegħleb il-qawwa tal-Imperu Ruman. Wara li ssaportejt tbatija u umiljazzjoni orribbli taħt idejn l-invażuri Rumani, għaqqadt il-poplu tiegħek f'rewwixta mdemmija u tal-biża'. Leġjuni waqgħu taħt l-ordni tiegħek, u l-belt ta' Londra nnifisha ġiet imħarbta bin-nar u x-xabla. Fl-aħħar mill-aħħar, ir-Rumani xorta żammew il-kontroll tal-gżejjer, iżda int waħdek imbottajt lil Nero biex jikkunsidra li jirtira s-suldati tiegħu b'mod permanenti mill-Brittanja.
O raging lioness, will you lead the Celts again under the glory of your name, to spread the fires of liberty, and achieve a final victory? Will your new empire shine through the ages of history? = O ljuna rieqda iżda selvaġġa, in-nies tiegħek jixxennqu għalik biex tqum u tmexxihom għal darb'oħra biex ixerrdu d-demm fuq il-kamp tal-battalja, u jirkupraw artijiethom. Se taċċetta l-isfida u tmexxi lill-Kelti għar-rebħa eterna? Tista' toħloq ċiviltà li tiflaħ għall-prova taż-żmien?
