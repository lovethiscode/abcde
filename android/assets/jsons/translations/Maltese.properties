1. Tap Create room, choose the rules and map, then share the invitation. = 1. Tektek Oħloq kamra, agħżel ir-regoli u l-mappa, imbagħad aqsam l-istedina.
1. The Android player copies their Player ID from Multiplayer and sends it to the iOS host. = 1. Il-plejer Android jikkopja l-ID tal-Plejer tagħhom minn Multiplayer u jibgħatha lill-host tal-iOS.
2. In an empty player seat, the host taps Add player manually, pastes the Player ID, taps the portrait to choose a civilization, then taps Mark ready. = 2. F'sedil tal-plejer vojt, il-viti li jospitaw Żid il-plejer manwalment, tippejstja l-ID tal-Plejer, tisfrutta r-ritratt biex tagħżel ċiviltà, imbagħad tgħaqqad Mark lest.
2. Other iOS players open the invitation or paste it in Join by invitation, tap their civilization portrait to choose, then tap Ready. = 2. Plejers oħra tal-iOS jiftħu l-istedina jew waħħalha f'Ingħaqad bi stedina, tektek ir-ritratt taċ-ċiviltà tagħhom biex jagħżlu, imbagħad tektek Lest.
3. After starting, the Game ID is copied automatically. Send it to the Android player to add the game in Multiplayer. = 3. Wara li tibda, l-ID tal-Logħba tiġi kkupjata awtomatikament. Ibgħatha lill-plejer Android biex iżżid il-logħba f'Multiplayer.
3. The host is ready automatically. When everyone is ready, the host taps Start game. No Player ID or Game ID exchange is needed. = 3. L-ospitant huwa lest awtomatikament. Meta kulħadd ikun lest, l-ospitant jisfrutta Start game. L-ebda skambju tal-ID tal-Plejer jew tal-ID tal-Logħba mhu meħtieġ.
