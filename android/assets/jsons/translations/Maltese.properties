Hail to Imperial Majesty Catherine, Empress of all Russians. Living in the largest country in the world, from the Pacific Ocean in the east to the Baltic Sea in the west, your people endured wars, droughts, and many disasters, imbuing the Russian society with heroism and tenacity, and producing artists and scientists among the best in the world. Russia is a powerful empire which rightfully claims its place in the world concert of superpowers. = Sliema lill-Maestà Imperjali Katerina, Imperatriċi tar-Russi kollha. Ħabba li ngħixu fl-akbar pajjiż fid-dinja, mill-Oċean Paċifiku fl-Lvant sal-Baħar Baltiku fil-Punent, il-poplu tiegħek għadda minn gwerer, nixfiet, u ħafna diżastri, imlew lis-soċjetà Russa bl-erojiżmu u t-tenaċità, u pproduċew artisti u xjenzati tal-aqwa fid-dinja. Ir-Russja hija imperu qawwi li bi dritt jitlob postu fil-kunċert dinji tas-superpotenzi.
Empress Catherine, your people are eager for Russian glory, to revive the sacred light of the Motherland. Will your new empire shine through the ages of history? = Imperatriċi Katerina, il-poplu tiegħek huwa ħerqan għall-glorja Russa, biex jerġa' jqajjem id-dawl sagru t'artek. Se jiddi l-imperu l-ġdid tiegħek matul iż-żminijiet tal-istorja?
