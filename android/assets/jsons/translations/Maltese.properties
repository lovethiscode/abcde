Harun al-Rashid = Ħarun al-Raxid
The world will be more beautiful without you. Prepare for war. = Id-dinja tgwadi mingħajrek. Ipprepara għat-tbatija
Fool! You will soon regret dearly! I swear it! = Iblaħ! Naqra oħra tixgħof għalija bil-kbir! U naħlifha!
You have won, congratulations. My palace is now in your possession, and I beg that you care well for the peacock. = Irbaħtilna, ħaqqek. Palazzi issa sar tiegħek, iżda nitolbok tagħti kas il-pagun.
Our future battle will be glorious. = Tajjeb. Il-battalja li ġejja tkun glorjuża
Welcome foreigner, I am Harun Al-Rashid, Caliph of the Arabs. Come and tell me about your empire. = Sliem għalik, jiena Ħarun al-Raxid, Kalif tal-Għarab. Ejja sal-palazz u għidli fuq ir-renju tal-imperu tiegħek
Come forth, let's do business. = Allah jitlobna biex infittxu l-kooperazzjoni u l-kummerċ ma' sħabna l-ħin kollhu.
Peace be upon you. = Paċi miegħek.
Trade Caravans = Karavanni Kummerċjali
Blessings of the Great God be upon you, O great caliph Harun al-Rashid, leader of the mighty Arabian people! The Muslim Empire, the Caliphate, born from chaos after the death of the prophet Muhammad in 632 AD, intended to apply the rule of God to all Earth. And by the will of God, the caliphate reached its full power, ruling Spain, North Africa, the Middle East, Anatolia, the Balkans and Persia, to even surpass the Great Roman Empire. The arts and sciences were a holy gift of Arabia during the Middle Ages, as the infidel lands of Europe delved deep into ignorance and chaos. Lasting for six hundred years, the Caliphate finally fell before the Mongols, the plague of the civilized world. = Jalla l-barka ta' Allah tkun fuqek, O Kalif kbir Harun al-Rashid, mexxej tal-poplu Għarbi devot! L-imperu Musulman, il-Kalifat, qam fis-snin turbolenti wara l-mewt tal-Profeta Muħammed fis-sena 632 WK; is-segwaċi tiegħu kellhom il-ħsieb li jestendu s-saltna ta' Allah lill-popli kollha tad-dinja. U l-Kalifat tabilħaqq kiber dejjem aktar b'saħħtu, u fl-aqwa tiegħu kkontrolla Spanja, l-Afrika ta' Fuq, il-Lvant Nofsani, l-Anatolja, il-Balkani u l-Persja; imperu kbir ħafna, jekk mhux akbar mill-Imperu Ruman. Fil-Medjuevu, filwaqt li l-ġnus tal-Ewropa għerqu fl-injoranza u fil-ġenn, fl-Arabja l-arti u x-xjenzi ffjorixxew. Il-Kalifat dam għal 600 sena, sakemm ċeda għall-attakk tal-Mongoli, dawk il-qerrieda misħuta ta' tant imperi oħra.
Great Caliph Harun al Rashid, all Arabian people long for greatness! Arabia must be once again the land of arts and knowledge, which under the radiant law of God, will fear no enemy! Will your new empire shine through the ages of history? = Gran Kalif Harun al-Rashid, il-poplu tiegħek idur lejk biex tirrestawra l-kobor ta' qabel tagħha, biex tagħmel l-Arabja art imdawla bl-arti u l-għarfien, nazzjon qawwi li m'għandu jibża' minn ħadd. O Kalif, se tlaħħaq mal-isfida? Tista' toħloq ċivilizzazzjoni kapaċi tiflaħ għall-prova taż-żmien?
