The world keeps a wonder for those who explore. = Id-dinja żżomm meravilja għal dawk li jesploraw.
This Game Center player's records belong to a different iCloud account. Return to that iCloud account to resume syncing. = Ir-rekords ta' dan il-plejer ta' Game Center jappartjenu lil kont iCloud differenti. Erġa' lura għal dak il-kont iCloud biex tkompli s-sinkronizzazzjoni.
