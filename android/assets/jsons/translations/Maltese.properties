Most achievements allow any difficulty and need at least 1 AI opponent. Only N30, N36, N37, N38 and N39 require the stated difficulty and at least 3 AI opponents. You need not enable all victory routes. All game speeds are allowed. Any victory includes Time. Religion achievements require religion to be enabled. = Il-biċċa l-kbira tal-kisbiet jippermettu kwalunkwe diffikultà u jeħtieġu mill-inqas 1 avversarju tal-IA. N30, N36, N37, N38 u N39 biss jeħtieġu d-diffikultà msemmija u mill-inqas 3 avversarji tal-IA. M'għandekx għalfejn tattiva r-rotot kollha tar-rebħa. Il-veloċitajiet kollha tal-logħba huma permessi. Kwalunkwe rebħa tinkludi l-Ħin. Kisbiet reliġjużi jeħtieġu li r-reliġjon tkun attivata.
N38 forbids ever owning a second city, including founding, conquest, puppets, trades and brief ownership. N39 forbids ever owning a World Wonder by any means; losing it later does not erase that branch's history. N26 collects 8 distinct self-built World Wonders across qualifying new games. N40 requires the other 39 new medals; old medals never substitute for them. = N38 jipprojbixxi li qatt tkun sid tat-tieni belt, inkluż permezz ta' twaqqif, konkwista, pupazzi, skambji u pussess qasir. N39 jipprojbixxi li qatt tkun sid ta' Meravilja Dinjija bi kwalunkwe mezz; li titlifha aktar tard ma jħassarx l-istorja ta' dik il-fergħa. N26 jiġbor 8 Meravilji Dinjija distinti mibnija minnek f'logħob ġdid li jikkwalifika. N40 jeħtieġ id-39 midalja ġdida l-oħra; midalji qodma qatt ma jissostitwixxuhom.
Nature's Gift = Rigal tan-Natura
On Deity difficulty, win any formal victory, including Time. = Fid-diffikultà Divinità, irbaħ kwalunkwe rebħa formali, inkluż il-Ħin.
On Emperor difficulty or higher, enable One City Challenge and win a Scientific Victory without ever owning a second city, even temporarily. = Fid-diffikultà Imperatur jew ogħla, attiva l-Isfida: Belt Waħda Biss u irbaħ Rebħa Xjentifika mingħajr qatt tkun sid tat-tieni belt, lanqas temporanjament.
On Emperor difficulty or higher, win a Cultural Victory without ever owning a World Wonder, whether built, captured or received. National Wonders are allowed. = Fid-diffikultà Imperatur jew ogħla, irbaħ Rebħa Kulturali mingħajr qatt tkun sid ta' Meravilja Dinjija, kemm jekk bnejtha, qbadt jew irċevejtha. Meravilji Nazzjonali huma permessi.
On Emperor difficulty or higher, win any formal victory, including Time. = Fid-diffikultà Imperatur jew ogħla, irbaħ kwalunkwe rebħa formali, inkluż il-Ħin.
On Prince difficulty or higher, build 8 different World Wonders in one game. = Fid-diffikultà Prinċep jew ogħla, ibni 8 Meravilji Dinjija differenti f'logħba waħda.
One City, Many Stars = Belt Waħda, Ħafna Kwiekeb
One city holds the dreams of countless people. = Belt waħda żżomm il-ħolm ta' għadd bla qies ta' nies.
Only qualifying new games started with this new achievement catalog count. Old saves cannot gain eligibility by copying, importing or resaving. Use a built-in ruleset, one human major civilization, a generated map and an Ancient-era start, without mods or editor scenarios. = Jgħodd biss logħob ġdid li jikkwalifika u li nbeda b'dan il-katalgu ġdid tal-kisbiet. Sejvs qodma ma jistgħux isiru eliġibbli billi jiġu kkupjati, importati jew issejvjati mill-ġdid. Uża sett ta' regoli integrat, ċiviltà ewlenija waħda umana, mappa ġġenerata u bidu fi Żmien l-Antik, mingħajr mods jew xenarji tal-editur.
Ordinary save loading restores that branch's challenge history; earned medals stay unlocked. God mode, state-changing debug commands and full AI autoplay permanently disqualify that game, even after loading an older save. Normal Worker automation and exploration are allowed. The first formal victory or your defeat ends contributions; playing another turn does not count. = It-tagħbija normali ta' sejv tirrestawra l-istorja tal-isfidi ta' dik il-fergħa; midalji miksuba jibqgħu miksuba. Il-mod ta' Alla, kmandi ta' debug li jbiddlu l-istat u logħob awtomatiku sħiħ mill-IA jiskwalifikaw dik il-logħba b'mod permanenti, anke wara li tillowdja sejv eqdem. Awtomazzjoni u esplorazzjoni normali tal-Ħaddiem huma permessi. L-ewwel rebħa formali jew it-telfa tiegħek itemmu l-kontribuzzjonijiet; li tilgħab dawra oħra ma jgħoddx.
Own a city with at least 10 population. = Kun sid ta' belt b'mill-inqas 10 popolazzjoni.
