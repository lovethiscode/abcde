Heaven itself bends before your beauty, Empress Wu Zetian, ruler of eternal China! You lead one of the oldest and greatest civilization of humanity. In your time, China stood at the forefront of science and technology, bringing the world such contributions as gunpowder, the printing press, and the world of Confucius, and this, long before the rest of the world was mature enough to make the same discoveries! = Il-Ġenna stess titfaxxa bil-qawwa tiegħek, Imperatriċi Wu Zetian, l-iktar segħtana mil-mexxeja taċ-Ċina! Qed tmexxi waħda mill-eqdem u l-akbar ċiviltà tad-dinja kollha. F'żmienek, iċ-Ċina kienet fl-aqwa tagħha, b'żvilluppi kbar fix-xjenza u t-teknoloġija, fosthom il-porvli, l-istamperija u d-dinja ta' Konfuċju. Dan kollu u iktar ħafna iktar filwaqt li l-bqija tad-dinja kienu għadhom mweħħlin fil-passat! In your time, China stood at the forefront of science and technology, bringing the world such contributions as gunpowder, the printing press, and the world of Confucius, and this, long before the rest of the world was mature enough to make the same discoveries!
Great Queen, can you make China prevail again, using your divine intelligence and beauty? China stands for greatness, and all its enemies will be dazzled soon enough! Will your new empire shine through the ages of history? = Ja Reġina Glorjuża, tista' terġa tqawwa liċ-Ċina bl-intelliġenza divina tiegħek? Iċ-Ċina trid l-kobor, u l-għedewwa kollha tagħha dalwaqt se jkunu mgħammxa! Se jiddi l-imperu l-ġdid tiegħek matul iż-żminijiet tal-istorja?
