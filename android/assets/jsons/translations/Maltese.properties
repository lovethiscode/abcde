Vive Napoleon I, First Consul and Emperor of France! After the glorious Revolution which suppressed the centuries-old monarchy, the French nation stood at the heart of Europe as a Republic, and intended to export its ideals to the entire European continent, either by diplomacy or war. The French Capital Paris was more than ever the world center of Culture, Arts, and Letters. With its Great Army, reputed as one of the greatest in the History, France fought gloriously all surrounding enemies, but eventually fell against the coalition of other European powers. = Viva Napuljun I, l-Ewwel Konslu u Imperatur ta' Franza! Wara r-Rivoluzzjoni glorjuża li soppressat il-monarkija ta' sekli sħaħ, in-nazzjon Franċiż kien fil-qalba tal-Ewropa bħala Repubblika, u kellha l-ħsieb li tesporta l-ideali tagħha lill-kontinent Ewropew kollu, jew bid-diplomazija jew bil-gwerra. Il-Belt Kapitali Franċiża, Pariġi, kienet aktar minn qatt qabel iċ-ċentru dinji tal-Kultura, l-Arti u l-Ittri. Bl-Armata l-Kbira tagħha, magħrufa bħala waħda mill-akbar fl-Istorja, Franza ġġieldet b'mod glorjuż kontra l-għedewwa kollha ta' madwarha, iżda eventwalment waqgħet kontra l-koalizzjoni tal-poteri Ewropej l-oħra.
Napoleon Bonaparte, ruler of the French people, will you rebuild the Empire to take revenge on your foes, and make again of its Capital the City of Lights? Will your new empire shine through the ages of history? = Napuljun Bonaparte, ħakkiem tal-poplu Franċiż, se tibni mill-ġdid l-Imperu tiegħek biex tagħti tagħlima lill-għedewwa tiegħek, u terġa' tagħmel il-kapitali l-Belt tad-Dwal? Se jiddi l-imperu l-ġdid tiegħek matul iż-żminijiet tal-istorja?
