Your people begin to understand the world through a shared belief. = In-nies tiegħek jibdew jifhmu d-dinja permezz ta' twemmin komuni.
Your religion is the majority in 10 cities at once, with 3 owned by other major civilizations. Passive spread counts. = Ir-reliġjon tiegħek hija tal-maġġoranza f'10 bliet fl-istess ħin, bi 3 ta' ċiviltajiet ewlenin oħra. Tixrid passiv jgħodd.

Default promotion only applies to the same units that you selected. It only applies per cities. It can't be used In puppeted cities or cities that you don't own. = Promozzjoni default tapplika biss għall-istess unitajiet li għażilt. Tapplika għal kull belt separatament. Ma tistax tintuża fi bliet pupazzi jew bliet li mhumiex tiegħek.


# Campaign mode

1861 年 7 月 16 日，联邦军准备从华盛顿向南推进。你固定指挥联邦，保卫华盛顿并夺取里士满。地图与部队是基于历史地理的游戏化压缩，不强制重演历史战果。 = Fis-16 ta’ Lulju, 1861, il-forzi tal-Unjoni jippreparaw biex javvanzaw lejn in-nofsinhar minn Washington. Int tikkmanda l-Unjoni: tiddefendi Washington u aqbad Richmond. Il-mappa u l-armati jikkondensaw il-ġeografija storika għal gameplay; ir-riżultati storiċi tal-battalja mhumiex infurzati.
