Great King Alexander, leader of the mighty Greek nation, you are truly blessed by the gods. In 480 BC, quarrelsome city-states such as Athens, Sparta, Thebes, found a way to join their forces, allowing Greece to defeat the mighty Persia in the 5th century BC, both on land and sea. Following their example, you lead a Greek coalition and finally struck down the Persian Empire in 331 BC. You conquered almost all the known world, and from Europe to Africa to India, you built an empire unmatched by any before it. = Ja re kbir Alessandru, mexxej tan-nazzjon Grieg setgħan, int tassew imbierek mill-allat. Fis-sena 480 QK, bliet-stati ġelliedin bħal Ateni, Sparta u Tebe, sabu mod kif jgħaqdu l-forzi tagħhom, u b'hekk il-Greċja setgħet tegħleb lill-Persja setgħana fis-seklu 5 QK, kemm fuq l-art kif ukoll fuq il-baħar. Wara l-eżempju tagħhom, int mexxejt koalizzjoni Griega u fl-aħħar qridt l-Imperu Persjan fis-sena 331 QK. Int ikkonkwistajt kważi d-dinja kollha magħrufa, u mill-Ewropa sal-Afrika u sal-Indja, bnejt imperu li ħadd ma kien imqabbel ma ħadd qablek.
Megalexandros, son of Zeus, will you ride Bucephalas again, to gift the world with the brightness of the Greek culture? Will your new empire shine through the ages of history? = Alessandru, in-nies tiegħek lesti biex jimmarċjaw għall-gwerra biex ixerrdu l-kultura Griega madwar id-dinja u jġibulek glorja dejjiema. Lest int li taċċetta d-destin tiegħek, Re Alessandru? Se tmexxi lin-nies tiegħek għat-trijonf u l-kobor fuq Buċefalu l-għażiż tiegħek? Tista' toħloq ċivilizzazzjoni kapaċi tiflaħ għat-test taż-żmien?
