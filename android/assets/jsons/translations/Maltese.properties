Oda Nobunaga = Oda Nobunaga
I hereby inform you of our intention to wipe out your civilization from this world. = Bħala samurai, aħna nies onesti, u nsibuha ta' onestà li rridu nesprimu l-intenzjoni tagħna li nħassrukom minn wiċċ id-dinja b'dan il-messaġġ.
Pitiful fool! Now we shall destroy you! = Ejja! Il-kamikaże tipproteġina, u se taqa' bħal dawk ta' qablek!
You were much wiser than I thought. = Urejt kuraġġ u ħila notevoli, tant li wieħed kważi jaħseb li int Ġappuniż. Issa kull ma fadal hu li ttemm id-diżunur li ġibt fuq il-familja u n-nies tiegħi...missek tistħi.
I expected more for you from. = Stennejt iktar minnek.
We hope for a fair and just relationship with you, who are renowned for military bravery. = Tassew, is-sema tbissilmna, u wasslitna għall-preżenza tiegħek. Jiena Oda Nobunaga, il-kap tal-klann il-kbir Oda. Nixtieq relazzjonijiet ġusti u ugwali bejn il-popli tagħna.
I would be grateful if you agreed on the following proposal. = Inkun grat jekk taċċetta l-offerta tiegħi.
Oh, it's you... = Eh, int... 
Bushido = Bushido
Lord Oda Nobunaga, ruler of Japan, the land of the Rising Sun is at your command! Through history, Japanese people lived and died with honor, proud of their rich culture of arts and letters. Years of bloody civil wars, invasions of foreign powers, wealth but also great poverty, have never altered the strong will of the Rising Sun island, as the Bushido spirit has imbued the fields of battle and the Japanese society for millenia. At the end of the 19th century, under foreign influence, your people took the path of modernity, and in a few decades, made of Japan a land of technological innovation and powerful industry, with which only few nations can compete. = Sliem għalik, nobbli Oda Nobunaga, ħakkiem tal-art fejn titla' x-xemx: jalla timxi fit-tul fost il-mergħat bil-fjuri tagħha. Inti l-ħakkiem tal-Ġappun, l-Art tax-Xemx Tiżreġ. Il-Ġappuniżi huma poplu insulari, kburi u devot, b'kultura artistika u letterarja rikka, u ċ-ċiviltà tagħhom għandha eluf ta' snin. Dawn kienu snin ta' battalji mdemmija, ta' espansjoni u iżolament, ta' ġid kbir u faqar kbir. Minbarra l-ħila tagħhom fuq il-kamp tal-battalja, il-poplu tiegħek jista' jiftaħar b'ħeġġa tal-għaġeb. Is-superjorità teknoloġika tagħhom u l-fabbriki grandjużi tagħhom huma l-għira ta' popli oħra kullimkien.
O great daimyo, will you take on your hands the Japan destiny, for the Rising Sun to light the world? Will your new empire shine through the ages of history? = O daimyo leġġendarju, se tieħu r-riedni tad-destin f'idejk? Se ġġib glorja u unur lill-familja u lin-nies tiegħek? Se tieħu x-xabla u t-tarka tiegħek u timmarċja għal darb'oħra lejn it-trijonf? Tista' tifforma ċiviltà li hija kapaċi tiflaħ għat-test taż-żmien?
