Good day. = Il-ġurnata t-tajba.
Oh, it's you. = Ew, int.
Monument Builders = Benneja tal-Mfakar
O great Ramesses, Pharaoh of Egypt, bright as the Sun and mighty as the Nile! Lord of all living things, you lead the greatest of all civilizations, which has gifted the world with writing, advanced mathematics, sculpture, and architecture. Egyptian monuments and culture will continue to amaze the world for thousands of years. = O Ramesse l-kbir, Fargħun tal-Eġittu, qawwi bħax-Xemx u setgħan bħan-Nil! Sid tal-ħlejjaq ħajjin kollha, inti tmexxi l-akbar fost iċ-ċiviltajiet kollha, li tat lid-dinja l-kitba, il-matematika avvanzata, l-iskultura, u l-arkitettura. Il-mfakar u l-kultura Eġizzjana se jkomplu jissorprendu lid-dinja għal eluf ta' snin.
Mighty and eternal Ramesses, Egypt lasted for millenia, whereas other civilisations disappeared into dust after a few centuries. Amun-Ra blesses you again to lead Egypt and its people on the path of light. Will your new empire shine through the ages of history? = Ramesse setgħan u etern, l-Eġittu dam għal millenji, filwaqt li ċiviltajiet oħra sparixxew fit-trab wara ftit sekli. Amun-Ra jbierek mill-ġdid biex tmexxi l-Eġittu u lin-nies tiegħu fit-triq tad-dawl. Se jiddi l-imperu l-ġdid tiegħek matul l-etajiet tal-istorja?
