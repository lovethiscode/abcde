Sign in to Game Center in Settings to view and sync achievements. Offline achievements remain saved on this device. = Idħol f'Game Center fis-Settings biex tara u tissinkronizza l-kisbiet. Kisbiet mingħajr konnessjoni jibqgħu ssejvjati fuq dan l-apparat.
Sign in to iCloud to sync unfinished cross-game challenges between devices. = Idħol f'iCloud biex tissinkronizza sfidi bejn logħbiet li għadhom ma tlestewx bejn l-apparati.
Simultaneously own 4 self-founded cities with at least 15 population each, while your civilization's Happiness is at least 0. = Kun sid fl-istess ħin ta' 4 bliet li waqqaft int, kull waħda b'mill-inqas 15 popolazzjoni, waqt li l-Kuntentizza taċ-ċiviltà tiegħek tkun mill-inqas 0.
Small acts of stewardship build a generous reserve. = Atti żgħar ta' ġestjoni jibnu riżerva ġeneruża.
Some earned medals are waiting to sync. You can keep playing. = Xi midalji miksuba qed jistennew is-sinkronizzazzjoni. Tista' tkompli tilgħab.
The first Game Center sign-in claims unbound offline medals once. Later offline results belong to the last bound player; switching accounts does not transfer games or queues. Game Center syncs completed medals. iCloud syncs extra cross-game facts when configured; use the same accounts on both devices. Medal sharing never invents game dates, turns or battle results. = L-ewwel dħul f'Game Center jorbot darba biss midalji mingħajr konnessjoni li għadhom mhumiex marbuta. Riżultati sussegwenti mingħajr konnessjoni jappartjenu lill-aħħar plejer marbut; il-bdil tal-kontijiet ma jittrasferix logħob jew kjuwijiet. Game Center jissinkronizza midalji mitmuma. iCloud jissinkronizza fatti addizzjonali bejn logħbiet meta jkun ikkonfigurat; uża l-istess kontijiet fuq iż-żewġ apparati. Il-qsim tal-midalji qatt ma jivvinta dati tal-logħob, dawriet jew riżultati tal-battalji.
The land begins to reward its people's care. = L-art tibda tippremja l-kura tan-nies tagħha.
The lights of one city can still reach the stars. = Id-dwal ta' belt waħda xorta jistgħu jilħqu l-kwiekeb.
The share image could not be created. Please try again. = L-immaġni għall-qsim ma setgħetx tinħoloq. Erġa' pprova.
