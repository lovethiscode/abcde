原创战役共有四章十六关。每关至少获得一颗星，解锁下一关。\n完成本章获得章节完成记录；全部三星可获得精通勋章。\n各关的局势与目标独立，已通关关卡可反复挑战。 = Il-kampanja oriġinali għandha erba' kapitli u sittax-il missjoni. Aqla' mill-inqas stilla waħda biex tiftaħ il-missjoni li jmiss.\nLesti kapitlu biex tirreġistra l-progress tiegħek; aqla' kull stilla għall-midalja tal-ħakma tiegħu.\nKull missjoni għandha s-sitwazzjoni u l-għanijiet tagħha. Missjonijiet mitmuma jistgħu jerġgħu jintlagħbu.
让第一座城，在河谷中生根。 = Ħalli l-ewwel belt tiegħek taqbad l-għeruq fil-wied.
越过边境，建立繁荣的国家。 = Aqsam il-fruntiera u ibni nazzjon prosperu.
从第一场交锋，到夺取要塞。 = Mill-ewwel ġlieda tiegħek sal-qbid ta' fortizza.
把你的策略，连成完整的胜利。 = Għaqqad l-istrateġija tiegħek għar-rebħa.
