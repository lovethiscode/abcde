You've behaved yourself very badly, you know it. Now it's payback time. = L-imġieba tiegħek mhijiex mill aħjar, u tafha. Issa l-ħin biex tpatti għaliha
You've mistaken my passion for a weakness, you'll regret about this. = Ħawwadt il-passjoni tiegħi mad-dgħufiti, m'inix se nħalliha tgħaddi mingħajr ma tieħu tgħalima.
