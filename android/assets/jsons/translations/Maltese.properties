Otto von Bismarck = Otto von Bismark
I cannot wait until ye grow even mightier. Therefore, prepare for war! = Ma nistax inħallik tissaħħaħ aktar. Lesti għall-gwerra!
Corrupted villain! We will bring you into the ground! = Ħalliel korott! Lesti biex tindifen!
Germany has been destroyed. I weep for the future generations. = Il-Ġermanja ġiet meqruda. Nibki għall-ġenerazzjonijiet futuri.
That wild bravado? It's a ticking time bomb, especially when you're all bark and no bite! = Tippretendix li int kuraġġuż: dan l-att se jisplodi f'wiċċek f'daqqa ta' rabja!
Guten Tag. In the name of the great German people, I bid you welcome. = Guten Tag. F'isem il-poplu Ġermaniż il-kbir, nilqgħek.
It would be in your best interest, to carefully consider this proposal. =  Il-kummerċ huwa wieħed mill-ħafna modi kif imperu jista' jissaħħaħ. X'taħseb dwar din l-offerta?
What now? = Issa x'ħa tagħmel?
So, out with it! = Itlaq!
Furor Teutonicus = Furor Teutonicus
All hail to Otto von Bismarck, first chancellor of Germany and its empire! During the ancient era, Germany was a land fragmented in several tribes but already showed great promise as the Roman Empire itself struggled to bend the Germans to its will. Germany, as one nation, was slowly built on the ruins of the Holy Roman Empire, and waited 1871 to be finally unified after the glorious victory on France and Napoleon III. The German people are creative, intelligent, industrious and proven to be talented warriors through history. Despite great catastrophes and failures in the first half of the 20th century, Germany can always rely on its people will and strength to be among the greatest and powerful nations in the world. = Merħba, Bismarck setgħan, l-ewwel kanċillier tal-Ġermanja u l-imperu tagħha! Għalkemm l-istorja tagħha tmur lura għal żmien ir-Rumani bħala konfederazzjoni ta' tribujiet fi gwerra, il-Ġermanja hija waħda mill-iżgħar nies, li qamet mill-irmied tal-Imperu Ruman Imqaddes u ngħaqdet fl-1871, ftit aktar minn seklu ilu, grazzi għar-rebħa fuq Franza ta' Napuljun III. Il-poplu Ġermaniż wera ruħu kreattiv, ħabrieki, u feroċi fil-gwerra. Minkejja l-katastrofi li sofrew fl-ewwel nofs tas-seklu 20, il-Ġermanja rnexxielha tistabbilixxi ruħha bħala waħda mill-aktar pajjiż importanti f'termini ekonomiċi, artistiċi, u teknoloġiċi.
Great Prince Bismarck, glory and power are at the heart of the German nation. Your people are bright, and lend you their iron will to lead Germany once again. Will your new empire shine through the ages of history? = Prinċep il-Kbir Bismarck, il-poplu Ġermaniż iħares lejk għal jiem ġodda ta' glorja. Qawwija hija d-determinazzjoni tiegħu li int, il-Kanċillier tal-Ħadid maħbub, terġa' tmexxi n-nazzjon. Se tagħżel li taħkem bid-demm u l-azzar, jew se tkun ċampjun tal-arti u l-industrija? Tista' toħloq ċivilizzazzjoni li tiflaħ għat-test taż-żmien?
