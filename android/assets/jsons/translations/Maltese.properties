Haile Selassie = Ħajle Selassje
I have tried all other avenues, but yet you persist in this madness. I hope, for your sake, your end is swift. = Ippruvajt kull triq, iżda int tippersisti fil-bluha tiegħek. Nittama, għall-ġid tiegħek, li dak li se nagħmel se jkun biżżejjed biex jbiddlek.
It is silence that allows evil to triumph. We will not stand mute and allow you to continue on this mad quest unchecked. = Huwa s-silenzju li jippermetti lill-ħażen jirbaħ. Mhux se nibqa' sieket u nħallik tkompli dan il-pjan miġnun tiegħek bla xkiel.
God and history will remember your actions this day. I hope you are ready for your impending judgment. = Alla u l-istorja se jiftakru l-azzjonijiet tiegħek illum. Nittama li int lest għall-ġudizzju finali.
What a waste of time. = X'ħela ta' ħin.
A thousand welcomes to our fair nation. I am Selassie, the Ras Tafari Makonnen and Emperor of Ethiopia, your humble servant. = Merħba mill-qalb fin-nazzjon sabiħ tagħna. Jiena Ħajle Selassje, Iljun Konkwistatur tat-tribù ta' Ġuda, Ras Tafari Makonnen u Imperatur tal-Etjopja.
I request that you consider this offer between our two peoples. I believe it will do us both good. = Nitolbok tikkunsidra din l-offerta bejn il-popli tagħna. Nemmen li se tkun ta' benefiċċju għat-tnejn.
Spirit of Adwa = L-Ispirtu t'Adwa
May God bless you, wise and righteous Emperor of Ethiopia, Haile Selassie. As one of Ethiopia's greatest rulers and a spiritual leader of the Rastafarian movement, your good influence on diplomacy and political cooperation are praised throughout the world. You created Ethiopia's first written constitution, and favorized democracy for years to come, your great wisdom making Ethiopia enter as a charter member in the United Nations. Always aiming to reform and modernize your nation, you changed Ethiopian destiny for the best. = Ħafna barkiet ikunu fuqek, Imperatur onorabbli u ġust tal-Etjopja, Ħajle Selassje. Il-monark l-kbir tiegħek u l-mexxej spiritwali tal-moviment Rastafarju huwa megħlub biss mill-influwenza tiegħek fix-xena politika u diplomatika globali. Meta daħħalt l-ewwel kostituzzjoni miktuba tal-Etjopja, int żrajt iż-żerriegħa tad-demokrazija, żerriegħa li kellha trabbi l-għeruq fis-snin li ġejjin. L-għerf tiegħek u l-fehim profond tiegħek tal-affarijiet tad-dinja żguraw is-sħubija tal-Etjopja fil-Ġnus Maqgħudu. Matul ir-renju tiegħek, int ħdimt biex tirriforma u timmodernizza ġensek, u b'hekk sawwart għal dejjem l-istorja tal-Etjopja.
Revered King, your knowledge and intelligence are required once again to protect your people from many threats in the world. Will you secure peace and stability, with benevolence and authority, in the radiance of the Kebra Nagast? Will your new empire shine through the ages of history? = Sultan onorat, il-kondotta mkejla tiegħek ipproteġiet lill-poplu tiegħek mill-ħafna kunflitti li jolqtu l-ġnus tal-bnedmin. Illum, is-saltna titolbok biex terġa' tiżgura l-paċi. Se tonora lill-poplu tiegħek bil-kuraġġ u l-awtorità, u tmexxihom lejn epoka ġdida? Tista' toħloq ċiviltà li kapaċi tiflaħ għall-prova taż-żmien?
