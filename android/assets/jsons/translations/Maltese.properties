#################### Lines from Events from Civ V - Gods & Kings ####################

Tutorial Task: [Move unit] = Xogħol tat-Turorjal: [Move unit]
Move a unit! = Mexxi unità!
Click on a unit → Click on a destination → Click the arrow popup. = Agħfas fuq unità → Agħfas fuq id-destinazzjoni → Agħfas l-popup bil-vleġġa

Found a city! = Oħloq Belt!
Select the Settler → Click on 'Found city'. = Agħżel il-Kolonista → Agħfas fuq 'Oħloq Belt'.

Enter the city screen! = Idħol fl-iskrin tal-belt!
Click the city button twice. = Agħfas darbtejn fuq il-buttuna b'isem il-belt.

Pick a technology to research! = Irriċerca teknoloġija!
Click on the tech button → Select technology → Click 'Research' (bottom right). = Agħfas l-buttuna tat-teknoloġija → Agħżel teknoloġija → Agħfas 'Irriċerka' (in-naħa t'isfel tal-lemin).

Pick a construction! = Agħżel binja!
Enter city screen → Click on a unit or building → Click 'add to queue'. = Idħol fl-iskrin tal-belt → Agħfas fuq unità jew binja → Agħfas 'Żid mal-kju'.

Pass a turn! = Għaddi dawra!
Cycle through units with 'Next unit' → Click 'Next turn'. = Agħfas 'L-Unità li Jmiss' u mexxihom kollha → Agħfas 'Mur għad-dawra li Jmiss'.

Reassign worked tiles! = Erġa' assenja il-madumiet mħaddma!
Enter city screen → Click the assigned tile to unassign → Click an unassigned tile to assign population. = Idħol fl-iskrin tal-belt > Agħfas fuq maduma mħaddma biex teħlisha → Agħfas fuq maduma mhux mħaddma biex tassenja raħħal għaliha.

Got it = Fhimt
Meet another civilization! = Iltaqa' ma' ċiviltà oħra!
Explore the map until you encounter another civilization! = Esplora l-mappa sakemm issib ċiviltà oħra!

Open the options dialog! = Iftaħ il-menù tal-għażliet!
Click the menu button (top left) → Click 'Options'. = Agħfas fuq il-buttuna tal-menù (in-naħa ta' fuq tax-xellug) → Agħfas 'Għażliet'.

Construct an improvement! = Ibni titjiba!
Construct a Worker unit → Move it to a Plains or Grassland tile → Click 'Construct improvement' → Choose the farm → Leave the worker there until it's finished. = Ġib Ħaddiem → Mexxih fuq Pjanura jew Bur→ Agħżel 'Ibni Titjiba' → Agħżel 'Razzett' → Ħalli l-Ħaddiem hemm sakemm ilestiha.

Create a trade route! = Oħloq rotta kummerċjali!
Construct roads between your capital and another city. Or, automate your worker and let him get to that eventually. = Ibni triq bejn il-belt kapitali tiegħek u belt oħra, jew awtomatizza ħaddiem biex jagħmel waħda.

Conquer a city! = Aħkem belt!
Bring an enemy city down to low health → Enter the city with a melee unit. = Naqqas is-saħħa tal-belt tal-għadu għal żero → Idħol fil-belt b'unità qarraba

Move an air unit! = Mexxi unità tal-ajru!
Select an air unit → Select another city within range → Move the unit to the other city. = Agħżel unità tal-ajru → Agħżel belt oħra fir-raġġ tagħha → Mexxi l-unità lejn dik il-belt l-oħra.

See your stats breakdown! =  Ara l-istatistika tiegħek!
Enter the Overview screen (top right corner) → Click on 'Stats'. =  Mur fl-iskrin tal-Ħarsa Ġenerali tiegħek (fuq ix-xellug) → Agħfas fuq 'Statistika'


