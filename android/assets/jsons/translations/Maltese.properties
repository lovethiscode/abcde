Win diplomatic vote = Irbaħ il-vot diplomatiku
You have triumphed over your foes through the art of diplomacy! Your cunning and wisdom have earned you great friends - and divided and sown confusion among your enemies! Forever will you be remembered as the leader who brought peace to this weary world! = Irbaħt fuq l-għedewwa tiegħek permezz tal-arti tad-diplomazija! Il-makakkerija u l-għerf tiegħek kisbuk ħbieb kbar - u separaw u żergħu l-konfużjoni fost l-għedewwa tiegħek! Għal dejjem tibqa' mfakkar bħala l-mexxej li ġab il-paċi f'din id-dinja mimżuġa!

Do things to win! = Agħmel xi ħaġa biex tirbaħ
