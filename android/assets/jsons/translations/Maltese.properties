Complete all the spaceship parts to win! = Għaqqad il-biċċiet kollha tal-vettura spazzjali biex tirbaħ!
spaceship parts = parti tal-vettura spazzjali
You have achieved victory through mastery of Science! You have conquered the mysteries of nature and led your people on a voyage to a brave new world! Your triumph will be remembered as long as the stars burn in the night sky! = Ksibt ir-rebħa permezz tal-brillanza tiegħek fix-Xjenza! Egħlibt il-misteri tan-natura u mexxejt lin-nies tiegħek fil-vjaġġ lejn dinja ġdida u kuraġġuża! It-trijonf tiegħek jibqa' mfaħħar sakemm il-kwiekeb jixegħlu fis-sema tal-lejl! 

Complete 5 policy branches and build the Utopia Project to win! = Lesti 5 fergħat politiki u ibni il-Proġett tal-Utopja biex tirbaħ!
You have achieved victory through the awesome power of your Culture. Your civilization's greatness - the magnificence of its monuments and the power of its artists - have astounded the world! Poets will honor you as long as beauty brings gladness to a weary heart. = Ksibt ir-rebħa permezz tal-qawwa tal-Kultura tiegħek. Il-kobor taċ-ċivilizzazzjoni tiegħek - l-għaġeb tal-mfakar tiegħek u l-qawwa tal-artisti tagħna - stagħġbu lid-dinja! Il-poeti jonorawk sakemm is-sbuħija ġġib il-ferħ lil qalb dgħajfa.

Capture all enemy Capitals to win! = Aħkem kull Kapitali tal-għadu għar-rebħa!
The world has been convulsed by war. Many great and powerful civilizations have fallen, but you have survived - and emerged victorious! The world will long remember your glorious triumph! = Id-dinja ntlaqtet mill-gwerra. Ħafna ċiviltajiet kbar u qawwija waqgħu, imma int irnexxielek tibqa' ħaj - u ħriġt rebbieħ! Id-dinja se tiftakar it-trijonf glorjuż tiegħek għal żmien twil!

