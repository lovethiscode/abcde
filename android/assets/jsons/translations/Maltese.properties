My treasury contains little and my soldiers are getting impatient... (sigh) ...therefore you must die. = It-teżor tiegħi fih ftit u s-suldati tiegħi qed jiddejqu... (daqqa ta' nifs) ...allura għandek bżonn tinqered.
So brave, yet so stupid! If only you had a brain similar to your courage. = Daqstant qalbieni, imma daqshekk stupidu! Li kieku kelli intelliġenza daqs kemm għandek kuraġġ
The gods have deprived Rome of their favour. We have been defeated. = L-allat ċaħħdulna il-favur tagħhom. Għelibtuna.
I wasn't sure, but it seems you do have some grit. = Ma kontx ċert, imma issa naf li għandek naqra tħajjin
I greet you. I am Augustus, Imperator and Pontifex Maximus of Rome. If you are a friend of Rome, you are welcome. = Insellilmek. Jiena Awgustu, Imperatur u Pontifex Maximus ta' Ruma. Jekk inti ħabib ta' Ruma, int tkun milqugħa.
I offer this, for your consideration. = Noffrik dan, għall-konsiderazzjoni tiegħek
Hail. = Merħba.
What do you want? = Xi trid minni?
The Glory of Rome = Il-Glorja ta' Ruma
Ave Caesar Augustus, Emperor of Rome and Dominus of the Roman Empire! Your empire was the most powerful and feared of all in Western civilization. The Roman people crafted so brilliantly its culture, law, art, and warfare, that no one could contest the supremacy of Rome. Force and Honor led to glorious conquests, a domination of all the lands from Spain in the west to Syria in the east, even reaching the remote barbarian lands of England and Germany. Roman art and architecture have been praised for millenia and have been envied by all lesser civilizations who have followed. = Ave Caesar Augustus, Imperatur ta' Ruma u Dominus tal-Imperu Ruman! L-imperu tiegħek kien l-aktar wieħed b'saħħtu u wieħed li kulħadd kien jibża' minnu, l-iktar miċ-ċiviltajiet kollha tal-Punent. Il-poplu Ruman ħoloq b'mod tant brillanti l-kultura, il-liġi, l-arti u l-gwerra tiegħu, li ħadd ma seta' jikkontesta s-supremazija ta' Ruma. Il-Forza u l-Unur wasslu għal konkwisti glorjużi, dominazzjoni tal-artijiet kollha minn Spanja fil-punent sas-Sirja fl-lvant, u saħansitra laħqu l-artijiet barbari remoti tal-Ingilterra u l-Ġermanja. L-arti u l-arkitettura Rumana ġew imfaħħra għal millenji u ġew għira miċ-ċiviltajiet inferjuri kollha li ġew warajhom.
O glorious Imperator, your people celebrate you and ask for the glory of Rome! In these times of darkness, the Pax Romana will be a beacon of light for all! Will your new empire shine through the ages of history? = O Imperatur glorjuż, il-poplu tiegħek jiċċelebrawk u jitolbu għall-glorja ta' Ruma! F'dawn iż-żminijiet ta' dlam, il-Pax Romana se tkun xempju ta' dawl għal kulħadd! Se jiddi l-imperu l-ġdid tiegħek matul iż-żminijiet tal-istorja?
