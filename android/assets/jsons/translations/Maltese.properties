Theodora = Tejodora
It is always a shame to destroy a thing of beauty. Happily, you are not one. = Dejjem hija ħasra li teqred oġġett sabiħ... imma ninsab kuntenta li int m'intix.
Now darling, tantrums are most unbecoming. I shall have to teach you a lesson. = Naħseb li wasal iż-żmien li turi l-kuluri veri tiegħek miegħi. Se jkun skambju pjaċevoli, jekk nista' nsejjaħlu hekk; kun ċert li int lestejt għalih.
Like a child playing with toys you are. My people will never love you, nor suffer this indignation gracefully. = Int bħal tifel li jaf biss kif jarmi ġugarell qadim. In-nies tiegħi qatt mhu se jħobbuk, u lanqas mhu se jaċċettaw dan l-għajb bi grazzja.
My, isn't this a pleasant surprise - what may I call you, oh mysterious stranger? I am Theodora, beloved of Byzantium. = Eh, xi sorpriża pjaċevoli! Kif nista' nsejjaħlek, barrani misterjuż? Jiena Tejodora, l-Imperatriċi maħbuba ta' Biżantju.
I have heard that you adept at certain kinds of ... interactions. Show me. = Smajt li int tajjeb f'ċerti tipi ta'... negozju. Urihomli, jekk jogħġbok.
Hello again. = Merħba.
Patriarchate of Constantinople = Patrijarku ta' Konstantinopli
Magnificent Empress Theodora, beloved of Byzantium and of Rome, your people salute you! With your beauty and intelligence, you rose up from actress and courtesan to the rank of the most powerful woman in the Roman Empire, as wife of Justinian I. In the late 520's AD, you helped your husband engage in spiritual and legal reforms, promugalting numerous laws to improve women's status and treatment in the empire. You also made of Constantinople the jewel of the Eastern Roman Empire with the restoration and construction of many aqueducts, bridges, and churches, its beauty culminating with the creation of the Hagia Sophia, one of the most splendid pieces of architecture in the world. = Unur lill-Imperatriċi magnifika u magnanima Tejodora, adorata minn Biżanzju u Ruma! Mill-pożizzjoni umli ta' attriċi u kurtiġjana, int tlajt biex issir l-aktar mara b'saħħitha fl-Imperu Ruman, mart Ġustinjanu I. Fl-aħħar tas-sena 1520, int, flimkien ma' żewġek, bdejt sensiela ta' riformi legali u spiritwali importanti, billi ġibt ħafna liġijiet li għollew l-istatus tan-nisa u ppromwovew l-ugwaljanza bejn is-sessi fl-imperu kollu. Int rajt ukoll il-bini u r-restawr ta' ħafna swieqi, pontijiet u knejjes f'Kostantinopli, li laħqu l-qofol tagħhom fil-bini tal-Ħagja Sofija, waħda mill-akbar meravilji fl-arkitettura fid-dinja.
Beautiful Empress,the Byzantine Empire's magnificence is intact in all memories, and ready to reborn as the new jewel of humankind. Will your new empire shine through the ages of history? = Imperatriċi Splendida, Biżanzju teħtieġ is-saħħa u l-għerf tiegħek: mingħajr id-dawl tiegħek biex jiggwidahom, in-niesek huma mitlufa. L-Imperu Biżantin ġa waqa' darba, iżda l-ispirtu tiegħu jibqa' qawwi u sħiħ biex iqum mill-irmied. Tista' tirrestawra lil Biżanzju għall-glorja ta' qabel tagħha? Tista' toħloq ċiviltà kapaċi tiflaħ għall-prova taż-żmien?
