Pacal = Pakal
A sacrifice unlike all others must be made! = Sagrifiċċju qatt bħalu se jsir illum! Ejja, u onoraw lill-allat!
Muahahahahahaha! = Illalu! Ġejja tiegħek!
Today comes a great searing pain. With you comes the path to the black storm. = Gawdi s-saltna miżerabbli tiegħek sakemm tista', għax miegħek tiġi t-trejqa għall-maltemp
Greetings, wayward one. I am known as Pacal. = Tislijiet, barrani. Jisimni Pakal, ħakkiem tal-poplu nobbli Maja.
Friend, I believe I may have found a way to save us all! Look, look and accept my offering! = Tislijiet, barrani. Jisimni Pacal, ħakkiem tal-poplu nobbli Maya.
A fine day, it helps you. = Jalla l-allat jitbissmulek
The Long Count = L-Għadd Twil
Kneel before King Pacal the Great, son of the gods and protector of the Palenque domain! After your kingdom has been harassed for years by neighboring rivals, you struck back at the enemies of your people, defeating each of them and sacrificing their leaders as a retribution to the insults made to your ancestors. Your wisdom and hard will not only restored the glory of Palenque, but turned it into a magnificient city, as your people built the greatest monuments and architecture the world has ever known. = Il-poplu tiegħek jinżel quddiemek, l-aktar Re għoli Pakal il-Kbir, iben favorit tal-allat u tarka taċ-ċittadini ta' Palenke. Wara snin ta' turment minn idejn ir-renji ġirien, int bdejt attakk fuq l-għedewwa tal-poplu tiegħek, billi offrejt il-mexxejja tagħhom bħala sagrifiċċji biex tpatti għall-insult mogħti lil ta' qablek. Palenke reġgħet lura għall-glorja taħt it-tmexxija għaqlija tiegħek, grazzi għal pjan vast ta' rikostruzzjoni għall-belt u l-ħolqien ta' wħud mill-akbar mfakar li l-poplu tiegħek - u d-dinja nnifisha - qatt rat.
Absolute King, your people need you to save the great Mayan culture and knowledge. Will you be able to read the movement of the stars, and find in the heavens the power to repel any foes? Will your new empire shine through the ages of history? = Monark assolut, il-poplu tiegħek idur lejk għal darb'oħra għall-gwida u parir. Se tinterpreta r-rieda tal-allat u tirrestawra r-renju nobbli tiegħek għall-glorja ta' qabel? Se tibni mfakar ġodda biex tgħożż għal dejjem il-memorja tal-poplu tiegħek bħal santwarju? Tista' toħloq ċiviltà li kapaċi tiflaħ għall-prova taż-żmien?
