Fastlane_full_description = Immaġinazzjoni mill-ġdid open-source tal-aktar logħba popolari ta' ġestjoni taċ-ċivilizzazzjoni li qatt saret; veloċi, ħafifa, bla reklami, u b'xejn għal dejjem!\n\nIbni l-imperu tiegħek, irriċerka teknoloġiji differenti, espandi l-bliet tiegħek, u elimina l-avversarji tiegħek!\n\nSuġġerimenti? Bugs? Il-lista ta' kwistjonijiet miftuħa tista' tinstab fuq il-<a href="https://github.com/jerry8870/Unciv4iOS">paġna tal-Github fuq il-Kwistjonijiet</a>. Kull għajnuna hija milqugħa!\n\nXi mistoqsijiet? Kummenti? Jew għandek ħafna ħin liberu biex tinvesti? Ejja tkellem magħna fuq is-<a href="https://discord.gg/bjrB4Xw">server tal-Unciv fuq Discord</a>.\n\nTrid tgħin fit-traduzzjoni tal-logħba fil-lingwa tiegħek? Segwi l-istruzzjonijiet fl-<a href="https://yairm210.github.io/Unciv/Translating/Translating">artiklu tal-wiki</a> għat-tradutturi.\n\nKotlin u/jew Java m'għandhom l-ebda sigriet għalik? Mela ejja tipparteċipa fl-iżvilupp fuq il-<a href="https://github.com/yairm210/Unciv">paġna tal-Github</a>!\n\nId-dinja qed tistenniek! Ħa tibni ċivilizzazzjoni li tista' tgħix għal sekli?\n\nIl-permess "Ippermetti aċċess sħiħ għan-netwerk" huwa meħtieġ għall-karatteristiċi li ġejjin:\n- Listing u tniżżil ta' mods disponibbli\n- Tniżżil ta' mużika u ħsejjes\n- Tlugħ u tniżżil tal-istatus tal-logħba mal-oħrajn onlajn\nIl-permessi l-oħra kollha msemmija huma mmaniġġjati awtomatikament mill-API għall-karatteristika ta' notifika tad-dawra tal-multiplejer.


