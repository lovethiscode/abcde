Long live to Your Highness, Queen Elizabeth Gloriana, leader and protector of the glorious England! Through history, enduring many invasions, England strengthened its will, playing smartly with diplomacy, cunning, and military power, to eventually rose as one of the most dominant Empires the world has ever known. Their matchless navy, brilliant scientists and artists, and powerful merchants, have shaped the known world for centuries. = Viva l-Altezza Tiegħek, Reġina Eliżabetta Gloriana, mexxejja u protettriċi tal-Ingilterra glorjuża! Matul l-istorja, billi għamlet ħafna invażjonijiet, l-Ingilterra saħħet ir-rieda tagħha, billi lagħbet b'intelliġenza bid-diplomazija, il-makakkerija, u l-qawwa militari, biex eventwalment telgħet bħala wieħed mill-aktar Imperi dominanti fid-dinja. Il-flotta navali inkomparabbli tagħhom, ix-xjenztisti u l-artisti brillanti, u l-merkanti qawwija, iffurmaw id-dinja magħrufa għal sekli sħaħ.
Queen Elizabeth, will England cast once more its brightness upon all lands and seas of the world? Will your new empire shine through the ages of history? = Reġina Eliżabetta, l-Ingilterra se titfa' d-dija tagħha għal darb'oħra fuq l-artijiet u l-ibħra kollha tad-dinja? Se jiddi l-imperu l-ġdid tiegħek matul iż-żminijiet tal-istorja?
