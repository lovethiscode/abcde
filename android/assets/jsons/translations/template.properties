山间粮仓 = 
不限难度，使用印加。在自建城市可工作范围内完成一处邻接至少两座山脉的梯田，并让市民在至少一次实际粮食结算中工作该地块；结算时梯田未被掠夺、仍属己方。不限城市人口，不要求三处梯田。 = 
建成一处邻接两座山脉的梯田，并让市民实际工作它一次。 = 
在群山之间收获粮食 = 
