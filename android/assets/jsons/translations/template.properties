连弩初试 = 
不限难度，使用中国。同一支诸葛弩在一个己方回合内，对主要文明军事单位或城市完成两次主动攻击，两次均造成正数伤害，并持续归己方、存活至下一己方回合开始。可以攻击同一目标，不要求击杀或实战晋升；两次攻击均须发生在诸葛弩形态。若本局先取得正式胜利，则在胜利结算时核对剩余观察条件。 = 
同一支诸葛弩本回合主动攻击两次并造成伤害，存活至下一己方回合。 = 
让连弩接连出击，带它平安归来 = 
