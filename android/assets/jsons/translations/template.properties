战后新生 = 
不限难度。战斗取得一座其他主要文明建立的城市并持续保有；抵抗结束时记录人口基准。此后在该城已连接首都的结算中，以正常粮食增长使人口超过该基准。无抵抗时以收城结算后人口为基准；直接赠送人口不能单独完成。 = 
保有战斗取得的城市，抵抗结束后连接首都，并让人口以粮食增长超过基准。 = 
