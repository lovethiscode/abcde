城下解围 = 
不限难度。己方回合开始时，一座自建城市的相邻格有可见的敌对主要文明军事单位；本回合由己方部队或城市击败其中至少一支。到下一己方回合开始，该城始终归己方，且相邻格已没有任何可见的敌对主要文明军事单位。若本局先取得正式胜利，则在胜利结算时核对剩余观察条件。 = 
