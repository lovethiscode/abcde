攻坚有序 = 
不限难度。在与守城主要文明的同一场战争中，先由己方攻城单位或远程海军对城市造成正数伤害，再由另一支具备近战占城能力的部队战斗占领该城并完成归属选择。允许跨回合；议和或城市中途转手后重新开始。交易取得、直接解放不计。 = 
让攻城单位或远程海军先伤害敌城，再由另一支部队战斗占领。 = 
让支援与攻城各司其职 = 
