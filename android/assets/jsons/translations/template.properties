射击之后，寻找下一处阵地 = 
预留移动力，在射击后选择撤离、侧移、让路或继续推进；完成一次即可，不把后撤规定为唯一正确解法。 = 
殊途同归 = 
不限难度。三个不同合格自由对局分别取得三种不同的非时间胜利，从科技、文化、征服、外交中任选三种。同一局游戏 只贡献首个正式终局结果；重载、复制存档不增加局数或胜利种类。 = 
在三个不同的合格对局中，取得三种不同的非时间胜利。 = 
用三种方式走向胜利 = 
走出熟悉的一种打法，体验三种不同战略。次数对应策略种类，不是把同一局再刷两遍。 = 
五波之后 = 
无尽，轻松或野蛮均可。同一次挑战首次在期限内清除第一关全部五波，进入关卡完成结算，且核心仍归己方。 = 
在期限内清除第一关的五波敌军，并保有核心城市。 = 
守过第一关的五波来敌 = 
将布防、资源与波次处理贯穿一整个关卡，获得清楚的首次通关反馈。 = 
三城同守 = 
无尽，轻松或野蛮均可。已解锁三城容量；某关第一波出现前已拥有三座城市，从第一波出现到该关按时完成，这三城持续归己方。不限必须哪一关完成，不限制部队损失和关间奖励选择。 = 
一关首波来临前已有三城，持续保有这三城直到按时过关。 = 
让三座城市一同守到关末 = 
主动扩张后承担更复杂的防线，安排机动支援与城市分工；不是要求所有玩家都建满三城。 = 
不息战线 = 
无尽，野蛮节奏。在同一次挑战中完成前三关。允许正常领取金币或增援；不同挑战的通关数不能相加。 = 
在同一次野蛮节奏挑战中，完成前三关。 = 
在野蛮节奏中连过三关 = 
