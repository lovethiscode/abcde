# Refactored menu and window localization
1. Tap Create room, choose the rules and map, then share the invitation. = 1. Докоснете Създаване на стая, изберете правилата и картата, след което споделете поканата.
1. The Android player copies their Player ID from Multiplayer and sends it to the iOS host. = 1. Android плейърът копира техния Player ID от Multiplayer и го изпраща на iOS хоста.
2. In an empty player seat, the host taps Add player manually, pastes the Player ID, taps the portrait to choose a civilization, then taps Mark ready. = 2. На празно място на играч домакинът докосва ръчно добавяне на играч, поставя ID на играча, докосва портрета, за да избере цивилизация, след което докосва Маркиране като готов.
2. Other iOS players open the invitation or paste it in Join by invitation, tap their civilization portrait to choose, then tap Ready. = 2. Други играчи на iOS отворете поканата или я поставете в Join by invitation, докоснете техния цивилизационен портрет, за да изберете, след което докоснете Ready.
3. After starting, the Game ID is copied automatically. Send it to the Android player to add the game in Multiplayer. = 3. След стартиране ID на играта се копира автоматично. Изпратете го до плейъра на Android, за да добавите играта в мултиплейър.
3. The host is ready automatically. When everyone is ready, the host taps Start game. No Player ID or Game ID exchange is needed. = 3. Хостът е готов автоматично. Когато всички са готови, домакинът докосва Старт на играта. Не е необходим обмен на ID на играч или ID на игра.
