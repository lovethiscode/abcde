Fastlane_short_description = 4X Игра: Градене на цивилизация

# Documentation: https://f-droid.org/en/docs/Build_Metadata_Reference/#Description
# English to translate: https://github.com/yairm210/Unciv/blob/master/fastlane/metadata/android/en-US/full_description.txt
Fastlane_full_description = Реимплементация на най-известната игра за градене на цивилизация някога - бърза, малка, без реклами, безплатна завинаги!\n\nПострой своята цивилизация, проучвай технологии, разшири своите градове и победи враговете си!\n\nЗаявки? Бъгове? Списъкът със задачи за приложението е https://github.com/jerry8870/Unciv4iOS, всяка малка помощ е добре дошла!\n\nВъпроси? Коментари? Просто скучаеш? Присъедини се към нас на https://discord.gg/bjrB4Xw.\n\nИскаш да помогнеш с превода на играта на своя език? Изпрати ми имейл до yairm210@hotmail.com.\n\nGrok Java или Kotlin? Присъедини се на https://github.com/yairm210/Unciv.\n\nСветът те очаква! Ще изградиш ли своята цивилизация в империя, която ще издържи изпитанието на времето?\n\nПозволението "пълен достъп до интернет/мрежата" се изисква за инициирани от потребителя изтегляния и функцията за мултиплейър. Всички други изброени разрешения се включват автоматично от API, използван за внедряване на известия за ход на мултиплейър. Мрежовите разрешения се използват за изброяване на модове, изтегляне на музика и за качване/изтегляне на мултиплейър игри. Никаква друга интернет комуникация не е инициирана от Unciv.


