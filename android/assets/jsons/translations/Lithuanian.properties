# iOS maintenance support
Support iOS maintenance = Paremti iOS priežiūrą
Purchase records are unavailable. No purchase was started. Please reopen the app. = Pirkimų įrašai nepasiekiami. Pirkimas nepradėtas. Iš naujo atverkite programėlę.
Congratulations on your victory! = Sveikiname laimėjus!
Enjoying this iOS version? Optional support helps with ongoing compatibility and maintenance. All game content and features stay the same whether you contribute or not. = Patinka ši iOS versija? Savanoriška parama padeda nuolat ją pritaikyti ir prižiūrėti. Visas žaidimo turinys ir funkcijos lieka tokie patys, nesvarbu, ar prisidedate.
Learn about support = Sužinoti apie paramą
Continue playing = Žaisti toliau
Unciv is made by an open-source community. This iOS version needs ongoing work to adapt to new systems, fix issues, and improve the controls. = Unciv kuria atvirojo kodo bendruomenė. Šiai iOS versijai reikia nuolatinio darbo: pritaikymo naujoms sistemoms, problemų taisymo ir valdymo gerinimo.
If you enjoy playing, you can support future iOS maintenance with a voluntary, one-time contribution. All game content and features are the same for everyone. = Jei jums patinka žaisti, galite paremti būsimą iOS priežiūrą savanorišku vienkartiniu įnašu. Visas žaidimo turinys ir funkcijos visiems vienodi.
