Great People = Didieji žmonės

Certain buildings, and specialists in cities, generate Great Person points per turn.\nThere are several types of Great People, and their points accumulate separately.\nThe number of points per turn and accumulated points can be viewed in the Overview screen. = Kai kurie pastatai ir specialistai kas ėjimą miestuose generuoja Didžių žmonių taškus. \nYra keletas tipų Didžių žmonių, ir kievienam tipui taškai kaupiami atskirai. \nApžvalgos ekrane galima pažiūrėti kiek tų taškų prikaupta ir kiek pasipildo per ėjimą. 
 # Requires translation!
Alternatively, the Great Person points breakdown per city can be viewed in each City Screen (see UI Tips article). = 
Once enough points have been accumulated, a Great Person of that type will be created!\nEach Great Person can construct a certain Great Improvement which gives large yields over time, or immediately consumed to provide a certain bonus now. = Kai bus sukaupta pakankamai taškų, mieste atsiras atitinkamo tipo Didis žmogus! \nKiekvienas Didis žmogus gali pastatyti tam tikrą Didįjį patobulinimą, kuris duoda naudą einant laikui, arba panaudoti Didį žmogų, kad nedelsiant gauti tam tikrą vienkartinę naudą.
Great Improvements also provide any strategic resources that are under them, so you don't need to worry if resources are revealed underneath your improvements! = Didžių žmonių Patobulinimai taip pat duoda ir strateginius resursus ant kurių laukelio yra pastatyti. Jei naujai atrastas resursas yra po tokiu Patobulinimu, jis automatiškai pridedamas į jūsų prekybos tinklą.

Removing Terrain Features = Vietovės ypatumų šalinimas
Certain tiles have terrain features - like Flood plains or Forests -  on top of them. Some of these layers, like Jungle, Marsh and Forest, can be removed by workers.\nRemoving the terrain feature does not remove any resources in the tile, and is usually required in order to add improvements exploiting those resources. = Kai kurie laukeliai turi vietovės ypatumų - tokie kaip Užliejamos pievos arba Miškas - viršum laukelio. Kai kurie ypatumai, kaip Džiunglės, Pelkės arba Miškas, gali būti pašalinti darbininkų pagalba.\nVietovės ypatumų šalinimas nepašalina laukelyje esančių resursų, ir dažnai tai tiesiog būtina, kad sukurti Patobulinimą, naudojantį šį resursą.

