1. Tap Create room, choose the rules and map, then share the invitation. = 1. Bakstelėkite Sukurti kambarį, pasirinkite taisykles ir žemėlapį, tada bendrinkite kvietimą.
1. The Android player copies their Player ID from Multiplayer and sends it to the iOS host. = 1. Android grotuvas nukopijuoja savo žaidėjo ID iš kelių žaidėjų ir siunčia jį į iOS pagrindinį kompiuterį.
2. In an empty player seat, the host taps Add player manually, pastes the Player ID, taps the portrait to choose a civilization, then taps Mark ready. = 2. Tuščioje žaidėjo vietoje šeimininkas bakstelėja Pridėti žaidėją rankiniu būdu, įklijuoja žaidėjo ID, bakstelėja portretą, kad pasirinktų civilizaciją, tada bakstelėkite Pažymėti paruoštą.
2. Other iOS players open the invitation or paste it in Join by invitation, tap their civilization portrait to choose, then tap Ready. = 2. Kiti iOS grotuvai atidaro kvietimą arba įklijuoja jį į Join by invitation, bakstelėkite savo civilizacijos portretą, kad pasirinktumėte, tada bakstelėkite Ready.
3. After starting, the Game ID is copied automatically. Send it to the Android player to add the game in Multiplayer. = 3. Paleidus žaidimo ID nukopijuojamas automatiškai. Nusiųskite jį į „Android“ grotuvą, kad pridėtumėte žaidimą kelių žaidėjų režime.
3. The host is ready automatically. When everyone is ready, the host taps Start game. No Player ID or Game ID exchange is needed. = 3. Priegloba yra paruošta automatiškai. Kai visi yra pasiruošę, šeimininkas bakstelėja Pradėti žaidimą. Nereikia keisti žaidėjo ID ar žaidimo ID.
