Server limit reached! Please wait for [time] seconds. The Game ID was copied; open its saved Multiplayer entry to retry. = Pasiektas serverio limitas! Palaukite [time] sekundžių. Game ID nukopijuotas; norėdami bandyti dar kartą, atidarykite išsaugotą Tinklo žaidimo įrašą.
Creation was interrupted and the Game ID was copied, but a local recovery copy could not be saved. = Kūrimas nutrauktas ir Game ID nukopijuotas, bet vietinės atkūrimo kopijos išsaugoti nepavyko.
The full game was uploaded before creation was interrupted. The Game ID was copied and a local recovery copy was saved. = Visas žaidimas išsiųstas prieš nutraukiant kūrimą. Game ID nukopijuotas ir vietinė atkūrimo kopija išsaugota.
Remote creation could not be confirmed. The Game ID was copied and a local recovery copy was saved. Open that Multiplayer entry to resume this exact game. = Nuotolinio sukūrimo patvirtinti nepavyko. Game ID nukopijuotas ir vietinė atkūrimo kopija išsaugota. Atidarykite tą Tinklo žaidimo įrašą, kad tęstumėte būtent šį žaidimą.
Could not upload game. The Game ID was copied; open its saved Multiplayer entry to retry this exact game. = Žaidimo išsiųsti nepavyko. Game ID nukopijuotas; norėdami dar kartą bandyti būtent šį žaidimą, atidarykite išsaugotą Tinklo žaidimo įrašą.
