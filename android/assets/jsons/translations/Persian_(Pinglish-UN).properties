#################### Lines from Events from Civ V - Gods & Kings ####################

Tutorial Task: [Move unit] = Tamrin e aamoozeshi: [Move unit]
Move a unit! = Yek niroo raa harekat dahid!
Click on a unit → Click on a destination → Click the arrow popup. = Rooye yek niroo bezanid → Rooye maghsad bezanid → Rooye panjare ye peykaan bezanid.

Found a city! = Yek shahr besaazid!
Select the Settler → Click on 'Found city'. = Shahrakneshin raa entekhaab konid → Rooye «Saakht e shahr» bezanid.

Enter the city screen! = Vaared e safhe ye shahr shavid!
Click the city button twice. = Dokme ye shahr raa do baar bezanid.

Pick a technology to research! = Yek fannaavari baraaye pazhoohesh entekhaab konid!
Click on the tech button → Select technology → Click 'Research' (bottom right). = Rooye dokme ye fannaavari bezanid → Fannaavari raa entekhaab konid → Rooye «Pazhoohesh» dar paayin e raast bezanid.

Pick a construction! = Yek saakht-o-saaz entekhaab konid!
Enter city screen → Click on a unit or building → Click 'add to queue'. = Vaared e safhe ye shahr shavid → Rooye yek niroo yaa saakhtemaan bezanid → Rooye «Ezaafe kardan be saf» bezanid.

Pass a turn! = Yek nobat raa begzaraanid!
Cycle through units with 'Next unit' → Click 'Next turn'. = Baa «Niroo ye ba'adi» beyne niroohaa begardid → Rooye «Nobat e ba'adi» bezanid.

Reassign worked tiles! = Zaminhaaye kaarshode raa dobaare takhsis dahid!
Enter city screen → Click the assigned tile to unassign → Click an unassigned tile to assign population. = Vaared e safhe ye shahr shavid → Baraaye hazf e takhsis, rooye zamin e takhsisyaafte bezanid → Baraaye takhsis e jam'iyat, rooye yek zamin e aazaad bezanid.

 # Requires translation!
Got it = Motavajeh shodam
Meet another civilization! = Baa tamaddon e digari aashnaa shavid!
Explore the map until you encounter another civilization! = Naghshe raa kaavosh konid taa baa tamaddon e digari rooberoo shavid!

Open the options dialog! = Panjare ye tanzimaat raa baaz konid!
Click the menu button (top left) → Click 'Options'. = Dokme ye fehrest dar baalaa ye chap raa bezanid → Rooye «Tanzimaat» bezanid.

Construct an improvement! = Yek behsaazi besaazid!
Construct a Worker unit → Move it to a Plains or Grassland tile → Click 'Construct improvement' → Choose the farm → Leave the worker there until it's finished. = Yek Kaaregar besaazid → Aan raa be zamin e Dasht yaa Alafzaar bebarid → Rooye «Behbood bakhshidan» bezanid → Mazra'e raa entekhaab konid → Kaaregar raa aanjaa negah daarid taa kaar tamaam shavad.

Create a trade route! = Yek masir e tejaari besaazid!
Construct roads between your capital and another city. Or, automate your worker and let him get to that eventually. = Beyne paaytakht va shahr e digar jaadde besaazid. Yaa kaaregar raa khodkaar konid taa saranjaam in kaar raa anjaam dahad.

Conquer a city! = Yek shahr raa fath konid!
Bring an enemy city down to low health → Enter the city with a melee unit. = Salaamati ye shahr e doshman raa kam konid → Baa yek niroo ye nazdikzan vaared e shahr shavid.

Move an air unit! = Yek niroo ye havaayi raa harekat dahid!
Select an air unit → Select another city within range → Move the unit to the other city. = Yek niroo ye havaayi entekhaab konid → Shahr e digari dar bord raa entekhaab konid → Niroo raa be shahr e digar bebarid.

See your stats breakdown! = Joziyaat e aamaar e khod raa bebinid!
Enter the Overview screen (top right corner) → Click on 'Stats'. = Vaared e safhe ye moroor dar gooshe ye baalaa ye raast shavid → Rooye «Aamaar» bezanid.


