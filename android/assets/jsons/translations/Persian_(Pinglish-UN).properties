Ramkhamhaeng = Ramkhamhaeng
You lowly, arrogant fool! I will make you regret of your insolence! = Naadaan e past va maghroor! Az gostaakhi-at pashimaanat khaaham kard!
You scoundrel! I shall prepare to fend you off! = Foroomaaye! Baraaye daf e to aamaade khaaham shod!
Although I lost, my honor shall endure. I wish you good luck. = Harchand shekast khordam, sharafam paaydaar khaahad maand. Baraayat khosh-shaansi aarezoo mikonam.
I, Pho Kun Ramkhamhaeng, King of Siam, consider it a great honor that you have walked to visit my country of Siam. = Man, Pho Kun Ramkhamhaeng, Shaah e Siam, in raa sharafi bozorg midaanam ke baraaye didaar be keshvar e man Siam aamaade i.
Greetings. I believe this is a fair proposal for both parties. What do you think? = Dorood. Gomaan mikonam in pishnahaad baraaye har do taraf monsefaane ast. Nazar e shomaa chist?
Welcome. = Khosh aamadi.
Father Governs Children = Pedar bar Farzandaan Hokoomat Mikonad
O Great King Ramkhamhaeng, the Siamese people obey you with respect and fear! The beautiful and mysterious land of Siam is an ancient country in the heart of Southeast Asia, which was besieged by many foes, plagued by bloody war and great poverty, but eventually the smart and loyal Siamese people have endured and triumphed. Siam was a part of the Khmer Empire until the 13th century AD, before its brave people took arms and led a revolution to form the small Sukhothai kingdom. After many battles and diplomacy prowess, this tiny kingdom became a mighty empire, which would dominate South East Asia for more than a century. = Ey Shaah e bozorg Ramkhamhaeng, mardom e Siam baa ehteraam va tars az to peyrovi mikonand! Sarzamin e zibaa va raz-aalood e Siam keshvari kohan dar ghalb e Jonoob e Sharghi ye Aasiyaast, ke doshmanaan e besyaar aan raa mohaasere kardand va jang e khoonin va faghr e bozorg aan raa aazord; amma sar-anjaam mardom e baahoosh va vafaadaar e Siam paayidand va pirooz shodand. Siam taa sade ye 13 milaadi bakhshi az Emperaatoori ye Khmer bood, pish az aan ke mardom e delavarash selaah bargirand va baa enghelaab paadeshaahi ye koochak e Sukhothai raa besaazand. Pas az jang haaye besyaar va siyaasat e maaheraane, in paadeshaahi ye koochak be emperaatoori ye niroomandi tabdil shod ke bish az yek sade bar Jonoob e Sharghi ye Aasiyaa hokoomat kard.
Wise and powerful King Ramkhamhaeng, your people want to revive these days of glory! Can you make a new dawn break on Siam? Will your new empire shine through the ages of history? = Ey Shaah e daanaa va niroomand Ramkhamhaeng, mardomat mikhaahand aan rooz haaye shokooh raa zende konand! Aayaa mitavaani sepidam e jadidi bar Siam bedaami? Aayaa emperaatoori ye jadidat dar asr haaye taarikh khaahad derakhshid?
