Nickname cannot contain a web address. = Naam-e mosteaar nemitavaanad aadres-e web daashte baashad.
Sync saves now = Hamgaam-saazi-ye zakhire-haa
Restore saves from iCloud = Baazgardaandan-e zakhire-haa az iCloud
Sync local and iCloud saves now?\nA changed save may replace the same-named version\non the other side.\nConflicting versions are kept separately. = Zakhire-haa-ye mahalli va iCloud halaa hamgaam shavand?\nZakhire-ye taghyir-yaafte momken ast noskhe-ye ham-naam-e taraf-e digar raa jaaygozin konad.\nNoskhe-haa-ye mota'araz joda negah daashte mishavand.
Restore saves from iCloud now?\nSaves deleted only on this device return\nif they still exist in iCloud.\nOther changes still sync both ways;\na same-named version may be replaced.\nConflicts are kept separately. = Zakhire-haa halaa az iCloud baazgardand?\nZakhire-haa-i ke faghat dar in dastgaah hazf shode-and, agar dar iCloud baashand baazmikhardand.\nTaghyir-haa-ye digar do-tarafe hamgaam mishavand; noskhe-ye ham-naam momken ast jaaygozin shavad.\nNoskhe-haa-ye mota'araz joda negah daashte mishavand.
Checking iCloud availability... = Dar haal-e barrasi-ye dastresi be iCloud…
iCloud is available. = iCloud dar dastres ast.
Sign in to iCloud to sync saves. = Baraaye hamgaam-saazi-ye zakhire-haa be iCloud vaared shavid.
iCloud access is restricted. = Dastresi be iCloud mahdood ast.
iCloud account changed. Tap Sync saves now to use the current account. = Hesaab-e iCloud avaz shod. Baraaye estefaade az hesaab-e konooni, Hamgaam-saazi-ye zakhire-haa raa bezanid.
Waiting to retry iCloud save sync. = Dar entezar-e talaash-e dobaare-ye hamgaam-saazi-ye iCloud.
Syncing saves with iCloud... = Hamgaam-saazi-ye zakhire-haa baa iCloud…
iCloud save sync failed. = Hamgaam-saazi-ye zakhire-haa baa iCloud naamoafagh bood.
Saves are synced with iCloud. = Zakhire-haa baa iCloud hamgaam hastand.
Last successful iCloud sync: = Aakharin hamgaam-saazi-ye moafagh-e iCloud:
Are you sure you want to delete this save from this device? It will remain in iCloud. = In zakhire az dastgaah hazf shavad? Dar iCloud mimaanad.
[] deleted from this device. = [] az in dastgaah hazf shod.
Could not store the multiplayer password securely. = Ramz-e chand-nafare be-shekl-e amn zakhire nashod.
Some saved multiplayer passwords could not be moved to secure storage. They were removed from settings; authenticate again when prompted. = Barkhi ramz-haa-ye zakhire-shode-ye chand-nafare be zakhire-saazi-ye amn montaghel nashodand. Az tanzimaat hazf shodand; vaghti darkhaast shod dobaare ehraaz-e hoviyat konid.
Install the same version of every required ruleset and mod before joining. Automatic mod downloads are unavailable in this build. = Pish az peyvastan, noskhe-ye yeksaan-e hame-ye ruleset-haa va mod-haa-ye laazem raa nasb konid. Download-e khodkaar-e mod dar in build dar dastres nist.
Online multiplayer servers are operated by third parties. The selected server receives your player ID, IP address, and game save data. Its availability, retention, deletion, and remote game saves are not guaranteed by Unciv. All players must use the same Unciv version and have the exact same versions of every mod installed. = Sarvar-haa-ye chand-nafare-ye online ra taraf-haa-ye sevvom edaare mikonand. Sarvar-e entekhaabi Player ID, aadres-e IP va daade-haa-ye zakhire-ye shomaa raa migirad. Unciv dastresi, negahdaari, hazf yaa zakhire-haa-ye door-e aan raa tazmin nemikonad. Hame-ye baazikonaan baayad az noskhe-ye yeksaan-e Unciv va daghighan noskhe-ye yeksaan-e har mod estefaade konand.
Recovery saved = Baazyaabi zakhire shod
Creation stopped before upload because a local recovery copy could not be saved. = Saakht pish az upload motevaghef shod, chon kopi-ye mahalli-ye baazyaabi zakhire nashod.
Remote creation could not be confirmed. The Game ID was copied and a local recovery copy was saved. Open that Multiplayer entry to resume this exact game; do not start another one. = Saakht-e door ta'yid nashod. Game ID kopi va kopi-ye mahalli-ye baazyaabi zakhire shod. Hamaan mored-e chand-nafare raa baaz konid taa daghighan in baazi edaame yaabad; baazi-ye digari shoroo nakonid.
Server limit reached! Please wait for [time] seconds. The Game ID was copied; open its saved Multiplayer entry to retry. = Had-e sarvar por shod! [time] saaniye sabr konid. Game ID kopi shod; mored-e chand-nafare-ye zakhire-shode raa baraaye talaash-e dobaare baaz konid.
Creation was interrupted and the Game ID was copied, but a local recovery copy could not be saved. = Saakht ghat' shod va Game ID kopi shod, ama kopi-ye mahalli-ye baazyaabi zakhire nashod.
The full game was uploaded before creation was interrupted. The Game ID was copied and a local recovery copy was saved. = Baazi-ye kaamel pish az ghat'-e saakht upload shod. Game ID kopi va kopi-ye mahalli-ye baazyaabi zakhire shod.
Remote creation could not be confirmed. The Game ID was copied and a local recovery copy was saved. Open that Multiplayer entry to resume this exact game. = Saakht-e door ta'yid nashod. Game ID kopi va kopi-ye mahalli-ye baazyaabi zakhire shod. Hamaan mored-e chand-nafare raa baaz konid taa daghighan in baazi edaame yaabad.
Could not upload game. The Game ID was copied; open its saved Multiplayer entry to retry this exact game. = Baazi upload nashod. Game ID kopi shod; mored-e chand-nafare-ye zakhire-shode raa baaz konid taa daghighan in baazi dobaare talaash shavad.
Game created and ID copied, but its turn preview is not confirmed. Submitting the first turn will retry it. = Baazi saakhte va ID kopi shod, ama pish-namaayesh-e nobat ta'yid nashode ast. Ersaal-e nobat-e avval aan raa dobaare talaash mikonad.
Could not persist the latest server state locally. = Aakharin vaziyat-e sarvar mahalli zakhire nashod.
Turn upload is unconfirmed because its background time expired. Retry after returning to the game. = Upload-e nobat ta'yid nashode, chon zamaan-e pas-zamine tamaam shod. Pas az baazgasht be baazi dobaare talaash konid.
Server limit reached! Please wait for [time] seconds before retrying. = Had-e sarvar por shod! Pish az talaash-e dobaare [time] saaniye sabr konid.
Turn upload is unconfirmed. Reason: [reason] = Upload-e nobat ta'yid nashode ast. Dalil: [reason]
Could not open authentication. The turn upload is unconfirmed. = Ehraaz-e hoviyat baaz nashod. Upload-e nobat ta'yid nashode ast.
Authentication was cancelled. The turn upload is unconfirmed. = Ehraaz-e hoviyat laghv shod. Upload-e nobat ta'yid nashode ast.
The server no longer has the game. The pending turn was kept and was not uploaded. = Baazi digar rooye sarvar nist. Nobat-e montazer negah daashte shod va upload nashod.
Could not confirm the previous turn upload. Reason: [reason] = Upload-e nobat-e ghabli ta'yid nashod. Dalil: [reason]
The server's full game could not be verified. The pending turn was kept and was not uploaded. = Baazi-ye kaamel-e sarvar ta'yid nashod. Nobat-e montazer negah daashte shod va upload nashod.
The server confirmed the turn, but it could not be saved locally. Retry to recover safely. = Sarvar nobat raa ta'yid kard, ama mahalli zakhire nashod. Baraaye baazyaabi-ye amn dobaare talaash konid.
The pending turn could not be stored or recovered safely. It was not uploaded. = Nobat-e montazer be-shekl-e amn zakhire yaa baazyaabi nashod. Upload nashod.
Dropbox storage is no longer available. Use an Unciv API v1 server instead. = Zakhire-saazi-ye Dropbox digar dar dastres nist. Be-jaaye aan az sarvar-e Unciv API v1 estefaade konid.
Could not persist the multiplayer server for this game. = Sarvar-e chand-nafare baraaye in baazi zakhire nashod.
The multiplayer server address is invalid. = Aadres-e sarvar-e chand-nafare naadorost ast.
This build requires a public HTTPS multiplayer server address. = In build be yek aadres-e omoomi-ye HTTPS baraaye sarvar-e chand-nafare niyaz daarad.
The multiplayer server attempted an unsafe redirect. = Sarvar-e chand-nafare sa'y kard be-shekl-e naa-amn taghyir-e masir dahad.
The multiplayer server redirected too many times. = Sarvar-e chand-nafare bis az had taghyir-e masir daad.
The multiplayer server address could not be resolved. = Aadres-e sarvar-e chand-nafare peydaa nashod.
A secure connection to the multiplayer server could not be established. = Ertebaat-e amn baa sarvar-e chand-nafare bargharaar nashod.
Connecting to the multiplayer server timed out. = Zamaan-e ertebaat baa sarvar-e chand-nafare tamaam shod.
The multiplayer server took too long to respond. = Paasokh-e sarvar-e chand-nafare bis az had tool keshid.
The multiplayer request was cancelled. = Darkhaast-e chand-nafare laghv shod.
The multiplayer server could not be reached. = Sarvar-e chand-nafare dar dastres nabood.
The multiplayer server returned an invalid response. = Sarvar-e chand-nafare paasokh-e naadorost daad.
The multiplayer server failed with status [statusCode]. = Sarvar-e chand-nafare baa vaziyat-e [statusCode] khataa daad.
The multiplayer server rejected the request with status [statusCode]. = Sarvar-e chand-nafare darkhaast raa baa vaziyat-e [statusCode] rad kard.
Authentication validation was cancelled = Barrasi-ye ehraaz-e hoviyat laghv shod
The game was uploaded, but its multiplayer preview is not confirmed. = Baazi upload shod, ama pish-namaayesh-e chand-nafare-ye aan ta'yid nashode ast.
The multiplayer server may have stored the game, but did not confirm the upload. = Momken ast sarvar-e chand-nafare baazi raa zakhire karde baashad, ama upload raa ta'yid nakard.
The document picker returned no save location = Entekhaabgar-e sanad hich mahal-e zakhire-i barnagardaand
The document picker returned no file = Entekhaabgar-e sanad hich file-i barnagardaand
Another document picker is already open = Entekhaabgar-e sanad-e digari baaz ast
No active iOS view controller is available = Hich controller-e namaayesh-e fa'aal-e iOS dar dastres nist
The selected document could not be read = Sanad-e entekhaab-shode khaande nashod
The iOS temporary directory is unavailable = Pooshe-ye movaghat-e iOS dar dastres nist
There is not enough free space to export this save = Fazaa-ye khaali baraaye khorooji-ye in zakhire kaafi nist
Could not create a temporary export directory = Pooshe-ye movaghat-e khorooji saakhte nashod
Click = Sedaaye klik
Whoosh = Sedaaye voosh
