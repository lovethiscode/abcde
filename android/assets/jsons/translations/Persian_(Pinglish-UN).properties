I hereby inform you of our intention to wipe out your civilization from this world. = Bedin vasile shomaa raa az ghasd e khod baraaye paak kardan e tamaddon e shomaa az in jahaan aagaah mikonam.
Pitiful fool! Now we shall destroy you! = Naadaan e tarahhom-angiz! Aknoon naaboodat mikonim!
You were much wiser than I thought. = Besyaar daanaatar az aan boodi ke fekr mikardam.
I expected more for you from. = Az to entezaar e bishtari daashtam.
We hope for a fair and just relationship with you, who are renowned for military bravery. = Omidvaarim baa shomaa, ke be delavari ye nezami shoh-rat daarid, raabete yi monsefaane va aadelane daashte baashim.
I would be grateful if you agreed on the following proposal. = Agar baa pishnahaad e zir movaafeghat konid sepaasgozaar khaaham bood.
Oh, it's you... = Oh, in toyi...
Bushido = Booshido
Lord Oda Nobunaga, ruler of Japan, the land of the Rising Sun is at your command! Through history, Japanese people lived and died with honor, proud of their rich culture of arts and letters. Years of bloody civil wars, invasions of foreign powers, wealth but also great poverty, have never altered the strong will of the Rising Sun island, as the Bushido spirit has imbued the fields of battle and the Japanese society for millenia. At the end of the 19th century, under foreign influence, your people took the path of modernity, and in a few decades, made of Japan a land of technological innovation and powerful industry, with which only few nations can compete. = Ey Arbaab Oda Nobunaga, farmanravaaye Zhaapon, sarzamin e Khorshid e Taabaan dar farman e to ast! Dar tool e taarikh, mardom e Zhaapon baa sharaf ziste va morde and va be Farhang e ghani ye honar va adabiyaat e khod baalide and. Saal haa jang e daakheli ye khoonin, hamle ye ghodrat haaye bigaane, servat va hamchenin faghr e shadid hargaz eraade ye niroomand e jazire ye Khorshid e Taabaan raa taghyir nadaad; roohe Bushido hezaaraan saal meydan haaye jang va jaamee ye Zhaapon raa por karde bood. Dar paayaan e sade ye 19, zire ta'sir e bigaane, mardomat raah e nowgaraayi raa pish gereftand va dar chand dahe Zhaapon raa be sarzamin e now-aavari ye teknoloji va san'at e niroomand tabdil kardand, ke mellat haaye kami tavaan e reghaabat baa aan raa daarand.
O great daimyo, will you take on your hands the Japan destiny, for the Rising Sun to light the world? Will your new empire shine through the ages of history? = Ey Daimyo ye bozorg, aayaa sarnevesht e Zhaapon raa dar dast migiri taa Khorshid e Taabaan jahaan raa roshan konad? Aayaa emperaatoori ye jadidat dar asr haaye taarikh khaahad derakhshid?
