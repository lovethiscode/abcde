The verified purchase could not be saved locally, so StoreKit has not finished it. Reopen Unciv to retry. = Kharid-e ta'yid-shode mahalli zakhire nashod, pas StoreKit aan raa tamaam nakarde ast. Unciv raa dobaare baaz konid.
