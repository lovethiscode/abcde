Alexander the Great, born in Macedon, was one of the most skilled generals, even more by his young age, and in only 17 years he conquered all the Greek known world. = Eskandar e Bozorg, zaade ye Maghedooniye, yeki az maahertarin sardaaraan bood, be vizhe baa tavajjoh be sen e kamesh, va tanhaa dar 17 saal hame ye jahaan e shenaakhte ye Yoonaaniyaan raa fath kard.

Ashurbanipal = Aashoorbaanipaal

The general Askia turned the Songhai nation into the most powerful state of West Africa, bringing a golden age of religion and knowledge. = Sardaar Askia, tamaddon e Songaay raa be niroomandtarin dolat e Aafrighaa ye Gharbi tabdil kard va asri talaayi az din va daanesh be armaghaan aavard.

'The Scourge of God' united the Hunnic tribes, and led them to great wealth and glory, antagonizing the Romans across his borders relentlessly. = «Taaziyaane ye Khodaa» ghabilehaaye Hoon raa mottahed kard va aanhaa raa be servat va shokooh e bozorg resaand va Roomihaaye aan sooye marzhaayash raa bi-vaghfe aazaar daad.

The creator of the Pax Romana and the Roman Empire, who ended a long civil war and brought peace to the entire Mediterranean, possibly the greatest emperor of Rome. = Aafarinande ye Pax Romana va Emperaatoori ye Room, ke jang e daakheli ye deraazi raa paayaan daad va baraaye hame ye Mediteraane solh aavard; shaayad bozorgtarin emperaator e Room.

The successful political career of the Iron Chancellor cannot be undermined, for he united Germany as we know it today, in his own way. = Movaffaghiyat e kaarname ye siyaasi ye Sadr e Aazam e Aahanin raa nemitavaan naadide gereft, cheraa ke oo baa ravesh e khod Aalmaan raa be shekli ke emrooz mishenaasim mottahed kard.

The noble warrior fought with bravery and courage to gain the freedom of the Celtic people from the Roman subjugation, inspiring many others after her. = Jangaavar e najib baa deliri va shojaa'at baraaye aazaadi ye mardom e Selt az band e Room jangid va elhaambakhsh e besyaari az pasiniyaan shod.

