May the gods bless you, great Nebuchadnezzar, ruler of ancient Babylon! Built 5000 years ago, Babylon emerged as an empire in 1800 BC, thanks to godlike Hammurabi, The Giver of Law. Falling under the Kassites assaults then the Assyrian domination, Babylon was reborn from its ashes, gaining back its independance, and became the beacon for Arts and Learning in the ancient world. O Nebuchadnezzar, after your death, Babylon quickly fell, conquered by the mighty Persians, and then by the Greeks, until the great city disappeared forever in 141 BC. = Khodaayaan to raa barakat dahand, ey Nebuchadnezzar e bozorg, farmanravaaye Baabel e baastaani! Baabel 5000 saal pish saakhte shod va dar 1800 pish az milaadi be lotf e Hammurabi ye khodaagoon, ghanoongozar, be emperaatoori tabdil shod. Pas az hamle haaye Kassites va sepas solte ye Ashoor, Baabel az khaakestar e khod dobaare barkhaast, esteghlaal e khod raa baazyaaft va cheraagh e honar va daanesh dar jahaan e baastaan shod. Ey Nebuchadnezzar, pas az marg e to Baabel be sorat soghoot kard: avval be dast e Iraniyaan e niroomand va sepas Yoonaani-aan taskhir shod, taa aan shahr e bozorg dar 141 pish az milaadi baraaye hamishe naapa-did shod.
