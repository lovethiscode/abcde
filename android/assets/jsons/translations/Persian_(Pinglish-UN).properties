William of Orange = Viliam e Oraanj
As much as I despise war, I consider it a, hahaha, contribution to the common cause to erase your existence. = Harcheghadr ham ke az jang bizaaram, paak kardan e vojoodat raa, haa haa haa, komaki be hadaf e hamagaani midaanam.
You call yourself an exalted ruler, but I see nothing more than a smartly dressed barbarian! = Khod raa farmaanravaayi vaalaa minaami, amma man chizi joz yek barbar e khoshlebaas nemibinam!
My God, be merciful to my soul. My God, feel pity for this... my poor people! = Khodaayaa, be rooham rahm kon. Khodaayaa, be in... mardom e bichaare am rahm kon!
I am William of Orange, stadtholder of The Netherlands. Did you need anything? I still have a lot to do. = Man Viliam e Oraanj, farmaandaar e Holand, hastam. Chizi laazem daashtid? Hanooz kaar e ziyaadi daaram.
I believe I have something that may be of some importance to you. = Fekr mikonam chizi daaram ke shaayad baraaye shomaa mohem baashad.
Once again, greetings. = Baari digar, dorood.
Dutch East India Company = Sherkat e Hend e Sharghi ye Holand
Greetings to the wise and brave Prince William of Orange, who freed the Netherlands and gave strength to the Dutch people. In 1568, you led a rebellion against Spanish dominion, to gain freedom for your people, and therefore starting the Eighty Years' War. Your actions were all aimed to create one of Europe's first modern republics, the Seven United Provinces. The rebellion was the meaning of your very life and death, as it was also the cause of your assassination in 1584. But your death has given even more pride and courage to your people, to fight for liberty against any oppressors. Carved in history as the 'Father of the Fatherland', your name is a symbol of Dutch independence for eternity. = Dorood bar shaahzaade ye daanaa va delir, Viliam e Oraanj, ke Holand raa aazaad kard va be mardom e Holand niroo bakhshid. Dar 1568, baraaye aazaadi ye mardomat shooresh e khod raa alayh e solte ye Espaanyaa rahbari kardi va Jang e Hashtaadsaale raa aaghaaz namoodi. Hame ye kaarhaayat baraaye saakhtan e yeki az nakhostin jomhoorihaaye novin e Ooroopaa, Haft Ostaan e Mottahed, bood. Shooresh ma'naa ye zendegi va margat bood, cheraa ke ellat e teroorat dar 1584 niz shod. Amma margat ghoroor va deliri ye bishtari be mardomat bakhshid taa baraaye aazaadi alayh e har setamgari bejangand. Baa onvaan e «Pedar e Mihan» dar taarikh hak shodi va naamat taa abad nemaad e esteghlaal e Holand ast.
Brave Prince, your people ask for your wisdom to gain its freedom once more, and to illuminate the world with progressive and modern ideas. Will your new empire shine through the ages of history? = Shaahzaade ye delir, mardomat baraaye baazyaaftan e aazaadi, dobaare kheradat raa mikhaahand va mikhaahand baa andishehaaye pishro va novin jahaan raa roshan konand. Aayaa emperaatoori ye jadidat dar tool e asrhaaye taarikh khaahad derakhshid?
