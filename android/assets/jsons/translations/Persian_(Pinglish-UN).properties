Harun al-Rashid = Harun al-Rashid
The world will be more beautiful without you. Prepare for war. = Jahaan bedoon e to zibaatar khaahad bood. Baraaye jang aamaade baash.
Fool! You will soon regret dearly! I swear it! = Naadaan! Be zoodi sakht pashimaan khaahi shod! Sogand mikhoram!
You have won, congratulations. My palace is now in your possession, and I beg that you care well for the peacock. = To pirooz shodi, tabrik migooyam. Kaakham aknoon dar maalekiyat e to ast; temannaa mikonam az taavoos khoob moraaghebat koni.
Our future battle will be glorious. = Jang e aayande ye maa baashokooh khaahad bood.
Welcome foreigner, I am Harun Al-Rashid, Caliph of the Arabs. Come and tell me about your empire. = Khosh aamadid, bigaane. Man Harun Al-Rashid, Khalife ye Arab haa, hastam. Biyaa va az emperaatoori-at baraayam begoo.
Come forth, let's do business. = Pish biyaa, tejaarat konim.
Peace be upon you. = Solh bar shomaa baad.
Trade Caravans = Kaarevaan Haaye Baazargaani
Blessings of the Great God be upon you, O great caliph Harun al-Rashid, leader of the mighty Arabian people! The Muslim Empire, the Caliphate, born from chaos after the death of the prophet Muhammad in 632 AD, intended to apply the rule of God to all Earth. And by the will of God, the caliphate reached its full power, ruling Spain, North Africa, the Middle East, Anatolia, the Balkans and Persia, to even surpass the Great Roman Empire. The arts and sciences were a holy gift of Arabia during the Middle Ages, as the infidel lands of Europe delved deep into ignorance and chaos. Lasting for six hundred years, the Caliphate finally fell before the Mongols, the plague of the civilized world. = Barakat e Khodaaye bozorg bar to baad, ey Khalife ye bozorg Harun al-Rashid, rahbar e mardom e niroomand e Arab! Emperaatoori ye Mosalmaan, yaa Khelaafat, az aashoob e pas az marg e Payaambar Mohammad dar 632 milaadi zaade shod va khaast ghanoon e Khodaa raa bar tamaam e zamin emaal konad. Be khaast e Khodaa, Khelaafat be owj e ghodrat resid va bar Espaaniyaa, Shomaal e Aafriqaa, Khaavar e Miyaane, Aanaatoli, Baalkaan va Iran hokoomat kard va az Emperaatoori ye bozorg e Rom niz pishi gereft. Honar va daanesh hediye ye moghaddas e Arabestaan dar Ghoroon e Vostaa bood, dar haali ke sarzamin haaye kafer e Ooroopaa dar naadaani va aashoob foroo miraftand. Khelaafat sheshsad saal paayid va sar-anjaam dar baraabar e Moghol haa, balaaye jahaan e motamadden, soghoot kard.
Great Caliph Harun al Rashid, all Arabian people long for greatness! Arabia must be once again the land of arts and knowledge, which under the radiant law of God, will fear no enemy! Will your new empire shine through the ages of history? = Ey Khalife ye bozorg Harun al Rashid, hame ye mardom e Arab moshtaagh e bozorgi and! Arabestaan baayad dobaare sarzamin e honar va daanesh shavad, ke zire ghanoon e noorani ye Khodaa az hich doshmani natarsad! Aayaa emperaatoori ye jadidat dar asr haaye taarikh khaahad derakhshid?
