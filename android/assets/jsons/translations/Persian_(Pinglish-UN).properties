Suleiman I = Suleiman I
Your continued insolence and failure to recognize our preeminence leads us to war. = Gostaakhi ye peyvaste va napaziroftan e bartari ye maa, maa raa be jang mikeshaanad.
Good. The world shall witness the incontestable might of my armies and the glory of the Empire. = Khoob ast. Jahaan ghodrat e bi-chon-o-cheraaye artesh haayam va shokooh e Emperaatoori raa khaahad did.
Ruin! Ruin! Istanbul becomes Iram of the Pillars, remembered only by the melancholy poets. = Viraani! Viraani! Istanbul be Iram e Sotoon haa tabdil mishavad, ke tanhaa shaaeraan e ghamgin aan raa be yaad daarand.
From the magnificence of Topkapi, the Ottoman nation greets you, stranger! I'm Suleiman, Kayser-I Rum, and I bestow upon you my welcome! = Az shokooh e Topkapi, mellat e Osmaani be to dorood migooyad, bigaane! Man Suleiman, Kayser-I Rum, hastam va be to khosh-aamad migooyam!
Let us do business! Would you be interested? = Biyaa tejaarat konim! Alaaghe daari?
Barbary Corsairs = Dozdaan Daryaai e Barbar
O Great Sultan Suleiman, may the God bless you! You are revered for your power, wealth and generosity, and you truly deserves to be called the 'Magnificent'! The Ottoman Empire was born in Bithynia, starting as a small country in Eastern Anatolia in 12th century, then expanded to west into Anatolia. Over the next century, your people vanquished the empire of Byzantium, annexing Turkey and the Balkans, and smartly assimilating all wonders and knowledge of the Byzantine civilization. In the mid 15th century, the Ottomans added Constantinople to their empire, establishing a strategic link between Europe and the Middle East. The Empire would continue to expand for centuries reaching North Africa, Middle East and Eastern Europe at its height, but brutally disappeared in the chaos of the first world war, in early 20th century. = Ey Soltaan e bozorg Suleiman, Khodaa to raa barakat dahad! To be ghodrat, servat va bakhshandegi geraami hasti va be raasti shaayeste ye naam e «Baashokooh» hasti! Emperaatoori ye Osmaani dar Bithynia zaade shod: dar sade ye 12 az keshvari koochak dar shargh e Aanaatoli shoroo kard va sepas be gharb dar Aanaatoli gostaaresh yaaft. Dar sade ye baad, mardomat Emperaatoori ye Bizans raa shekast daadand, Torkiye va Baalkaan raa zamime kardand va hooshmandaane hame ye shegefti haa va daanesh e tamaddon e Bizans raa jazb kardand. Dar miyaane ye sade ye 15, Osmaani haa Constantinople raa be emperaatoori afzoodand va peyvandi raahbordi miyaan e Ooroopaa va Khaavar e Miyaane saakhtand. Emperaatoori baraaye sade haa gostaaresh yaaft va dar owj be Shomaal e Aafriqaa, Khaavar e Miyaane va Shargh e Ooroopaa resid, amma dar aashoob e jang e jahaani ye avval dar aaghaaz e sade ye 20 be sheddat az miyaan raft.
Mighty Caliph, your people ask you to build again the Empire, to the level of power and glory it once achieved, and beyond! Will you revive the Ottoman golden age? Will your new empire shine through the ages of history? = Ey Khalife ye niroomand, mardomat mikhaahand emperaatoori raa dobaare be sath e ghodrat va shokooh e gozashte va faraatar az aan besaazi! Aayaa asr e talaai ye Osmaani raa zende mikoni? Aayaa emperaatoori ye jadidat dar asr haaye taarikh khaahad derakhshid?
