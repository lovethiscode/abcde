Hiawatha = Hiawatha
You are a plague upon Mother Earth! Prepare for battle! = Shomaa balaayi bar Maadar e Zamin hastid! Baraaye jang aamaade shavid!
You evil creature! My braves will slaughter you! = Makhloogh e sharir! Delavaraanam shomaa raa khaahand kosht!
You have defeated us... but our spirits will never be vanquished! We shall return! = Maa raa shekast daadi… amma rooh haaye maa hargaz maghloob nemishavand! Baaz khaahim gasht!
Words alone cannot shake the roots of peace I have planted among my people. = Harf e tanhaa nemitavaanad rishe haaye solhi raa ke miyaan e mardomam kaashte am belarzaanad.
Greetings, stranger. I am Hiawatha, speaker for the Iroquois. We seek peace with all, but we do not shrink from war. = Dorood, bigaane. Man Hiawatha, sokhangooye Iroquois hastam. Baa hame solh mikhaahim, amma az jang nemiharaasim.
Does this trade work for you, my friend? = Doost e man, in mo'aamele baraayat soodmand ast?
The Great Warpath = Jangjooye Bozorg
Greetings, noble Hiawatha, leader of the mighty Iroquois nations! Your people lived near the great and holy lake Ontario since the ancient ages, on a land that will be later known as New York city. Long ago, the five peoples of Seneca, Onondaga, Mohawks, Cayugas and Oneida became one nation, the Haudenosaunee, the Iroquois. Although not having a written language, the wise Iroquois created the Great Law of Peace, which can be considered the first established constitution. For decades, your people fought powerful enemies, such as the Huron, and then the French and English colonists. With less warriors and inferior weaponry, the Iroquois still survived and walk on the path of peace and harmony, until their way of living faded away under the crush of the newborn United States nation. = Dorood, Hiawatha ye najib, rahbar e mellat haaye niroomand e Iroquois! Mardomat az asr haaye baastaani nazdik e daryaache ye bozorg va moghaddas e Ontario, rooye sarzamini ke baadan New York naam gereft, zendegi mikardand. Dar roozgaare door, panj mellat e Seneca, Onondaga, Mohawks, Cayugas va Oneida yek mellat shodand: Haudenosaunee yaa Iroquois. Baa aan ke zabaan e neveshtaari nadaashtand, Iroquois e daanaa Ghanoon e Bozorg e Solh raa aafaridand, ke mitavaan aan raa nokhostin ghanoon e asaasi daanest. Baraaye dahe haa, mardomat baa doshmanaan e niroomandi chon Huron va sepas mostamerechiyan e Faraansavi va Engelisi jangidand. Baa jangjooyaan e kamtar va aslehe ye za'iftar, Iroquois hanooz paayidand va raah e solh va hamaahangi raa raftand, taa ravesh e zendegi ye aanhaa zire feshaar e mellat e nowzaade ye Eyaalaat e Mottahede kamrang shod.
Great Sachem Hiawatha, do you hear the complaints of your people? Can you light the path leading to the ancient Iroquois union? Will your new empire shine through the ages of history? = Ey Saachem e bozorg Hiawatha, aayaa shekaayat e mardomat raa mishenavi? Aayaa mitavaani raah e ettehaad e baastaani ye Iroquois raa roshan koni? Aayaa emperaatoori ye jadidat dar asr haaye taarikh khaahad derakhshid?
