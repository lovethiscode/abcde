Ordinary save loading restores that branch's challenge history; earned medals stay unlocked. God mode, state-changing debug commands and full AI autoplay permanently disqualify that game, even after loading an older save. Normal Worker automation and exploration are allowed. The first formal victory or your defeat ends contributions; playing another turn does not count. = Baargiri ye mamooli ye zakhire saabeghe ye chaalesh e hamaan shaakhe raa barmigardaanad; medaalhaaye kasbshode baaz mimaanand. Haalat e Khodaa, farmaanhaaye eshkaalzodaayi ye taghyir e vaz'iyat va baazi ye kaamel e khodkaar e Hoosh e Masnoo'i, aan baazi raa baraaye hamishe rad e salaahiyat mikonand, hatta pas az baargiri ye zakhire ye ghadimitar. Khodkaarsaazi ye mamooli ye Kaaregar va kaavosh mojaaz ast. Nakhostin piroozi ye rasmi yaa shekast e shomaa sabt raa paayaan midahad; nobat e ezaafi hesaab nemishavad.
