A sacrifice unlike all others must be made! = Baayad ghorbaaniyi na hamanand e digar ghorbaanihaa anjaam shavad!
Muahahahahahaha! = Moohaa haa haa haa haa!
Today comes a great searing pain. With you comes the path to the black storm. = Emrooz dardi bozorg va soozaan miaayad. Baa to raah e toofaan e siyaah miaayad.
Greetings, wayward one. I am known as Pacal. = Dorood, gomraah. Mara be naam e Paakaal mishenaasand.
Friend, I believe I may have found a way to save us all! Look, look and accept my offering! = Doost e man, fekr mikonam shaayad raahi baraaye nejaat e hame ye maa yaafte am! Bebin, bebin va pishkesham raa bepazir!
A fine day, it helps you. = Roozi khosh ast, be to komak mikonad.
The Long Count = Shomaaresh e Boland
Kneel before King Pacal the Great, son of the gods and protector of the Palenque domain! After your kingdom has been harassed for years by neighboring rivals, you struck back at the enemies of your people, defeating each of them and sacrificing their leaders as a retribution to the insults made to your ancestors. Your wisdom and hard will not only restored the glory of Palenque, but turned it into a magnificient city, as your people built the greatest monuments and architecture the world has ever known. = Dar baraabar e Paadeshaah Paakaal e Bozorg, pesar e khodaayaan va negahbaan e sarzamin e Palenke, zaanoo bezanid! Pas az saalhaa aazaar e paadeshaahi at be dast e raghibaan e hamsaaye, be doshmanaan e mardomat hamle kardi, hame raa shekast daadi va rahbaraaneshaan raa dar paasokh be tohin be niyaakaanat ghorbaani kardi. Kherad va eraade ye aahaninat na tanhaa shokooh e Palenke raa baazgardaand, balke aan raa be shahri baashokooh tabdil kard, chon mardomat bozorgtarin yaadboodhaa va memaarihaayi raa ke jahaan taa konoon shenaakhte saakhtand.
Absolute King, your people need you to save the great Mayan culture and knowledge. Will you be able to read the movement of the stars, and find in the heavens the power to repel any foes? Will your new empire shine through the ages of history? = Paadeshaah e motlagh, mardomat baraaye nejaat e farhang va daanesh e bozorg e Maayaa be to niyaaz daarand. Aayaa mitavaani harekat e setaaregaan raa bekhaani va dar aasemaan nirooyi baraaye raandan e har doshman biyaabi? Aayaa emperaatoori ye jadidat dar tool e asrhaaye taarikh khaahad derakhshid?
