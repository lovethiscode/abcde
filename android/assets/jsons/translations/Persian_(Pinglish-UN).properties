Otto von Bismarck = Otto von Bismarck
I cannot wait until ye grow even mightier. Therefore, prepare for war! = Nemitavaanam sabr konam taa hanooz niroomandtar shavi. Pas baraaye jang aamaade baash!
Corrupted villain! We will bring you into the ground! = Tabahkaar e faased! To raa baa khaak yeksaan mikonim!
Germany has been destroyed. I weep for the future generations. = Aalmaan naabood shod. Baraaye nasl haaye aayande migeryam.
That wild bravado? It's a ticking time bomb, especially when you're all bark and no bite! = Aan laaf e gostaakhaane? Yek bomb e saati ast, be vizhe vaghti hame ash harf ast va amal nadaarad!
Guten Tag. In the name of the great German people, I bid you welcome. = Rooz bekheyr. Be naam e mardom e bozorg e Aalmaan, be shomaa khosh-aamad migooyam.
It would be in your best interest, to carefully consider this proposal. = Be sood e shomaa ast ke in pishnahaad raa baa deghat barrasi konid.
What now? = Haalaa chi?
So, out with it! = Pas begoo!
Furor Teutonicus = Khashm e Aalmaani
All hail to Otto von Bismarck, first chancellor of Germany and its empire! During the ancient era, Germany was a land fragmented in several tribes but already showed great promise as the Roman Empire itself struggled to bend the Germans to its will. Germany, as one nation, was slowly built on the ruins of the Holy Roman Empire, and waited 1871 to be finally unified after the glorious victory on France and Napoleon III. The German people are creative, intelligent, industrious and proven to be talented warriors through history. Despite great catastrophes and failures in the first half of the 20th century, Germany can always rely on its people will and strength to be among the greatest and powerful nations in the world. = Dorood bar Otto von Bismarck, avvalin sadr e a'zam e Aalmaan va emperaatoori ye aan! Dar asr e baastaan, Aalmaan sarzamini paraakande dar chand ghabile bood, amma az hamaan zamaan neshane haaye bozorgi daasht: hatta Emperaatoori ye Rom baraaye motii kardan e Aalmaani haa sakht talaash mikard. Aalmaan be onvaan e yek mellat aaheste bar viraane haaye Emperaatoori ye Moghaddas e Rom saakhte shod va taa 1871 montazer maand taa pas az piroozi ye baashokooh bar Faraanse va Napoleon III sar-anjaam yeki shavad. Mardom e Aalmaan khallaagh, baahoosh va sakhtkoosh and va dar taarikh jangjooyaani baa-este'daad boode and. Baa vojood e balaayaa va shekast haaye bozorg dar nime ye avval e sade ye 20, Aalmaan hamishe mitavaanad bar eraade va ghodrat e mardom e khod teki-ye konad taa az bozorgtarin va niroomandtarin mellat haaye jahaan baashad.
Great Prince Bismarck, glory and power are at the heart of the German nation. Your people are bright, and lend you their iron will to lead Germany once again. Will your new empire shine through the ages of history? = Ey Shaahzaade ye bozorg Bismarck, shokooh va ghodrat dar ghalb e mellat e Aalmaan ast. Mardomat baahoosh and va eraade ye aahanin e khod raa be to misepaarand taa Aalmaan raa dobaare rahbari koni. Aayaa emperaatoori ye jadidat dar asr haaye taarikh khaahad derakhshid?
