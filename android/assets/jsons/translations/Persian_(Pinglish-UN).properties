Gustavus Adolphus = Goostaav Adolf
The Hakkapeliittas will ride again and your men will fall just at the sight of my cavalry! God with us! = Haakapeliitaa haa dobaare asbsavaari khaahand kard va mardaanat tanhaa baa didan e savaare-nezaam e man az paa dar miaayand! Khodaa baa maast!
Ha ha ha, captain Gars will be very glad to head out to war again. = Haa haa haa, naakhodaa Gars besyaar khoshhaal khaahad shod ke dobaare be jang beravad.
I am Sweden's king. You can take my lands, my people, my kingdom, but you will never reach the House of Vasa. = Man paadeshaah e Soo'ed hastam. Mitavaani zaminam, mardomam va paadeshaahiam raa begiri, amma hargez be khaandaan e Vaazaa nakhaahi resid.
You actually seem sharper than what I had originally thought. = Dar vaaghe' zehnet tiztar az aan chizi ast ke az aaghaaz fekr mikardam.
Stranger, welcome to the Snow King's kingdom! I am Gustavus Adolphus, member of the esteemed House of Vasa = Bigaane, be paadeshaahi ye Shaah e Barf khosh aamadid! Man Goostaav Adolf, ozv e khaandaan e mohtaram e Vaazaa, hastam
My friend, it is my belief that this settlement can benefit both our peoples. = Doost e man, baavar daaram ke in tavaafogh mitavaanad be sood e har do mardom baashad.
Oh, welcome! = Oh, khosh aamadi!
Oh, it is you. = Oh, in shomaayi.
Nobel Prize = Jaayeze Nobel
All hail Great King Gustavus Adolphus, founder of the Swedish Empire, and one of the most famous military tacticians. In the early 17th century, Sweden emerged as a great power in Europe under your reign, thanks to your wisdom, both in diplomacy and warfare. As king, you decided to reform Swedish laws to bring economic stability and prosperity to your people. Your allies, and also your enemies, called you the 'Lion of the North', witnessing your modern vision of warfare, and the prowess of your armies on the battlefield. As you triumphed in the Thirty Years' War, your name will be forever remembered as one of history's greatest generals. = Dorood bar Paadeshaah e Bozorg Goostaav Adolf, bonyangozaar e Emperaatoori ye Soo'ed va yeki az mashhoortarin taktisienhaaye nezaami. Dar aavaayel e sade ye 17, Soo'ed dar zamaandaari ye to, be lotf e kheradat dar diplomaasi va jang, be yek ghodrat e bozorg dar Ooroopaa tabdil shod. Be onvaan e paadeshaah, tasmim gerefti ghavaanin e Soo'ed raa eslaah koni taa sobaat e eghtesaadi va refaah baraaye mardomat faraaham shavad. Mottahedaan va hatta doshmanaanat to raa «Shir e Shomaal» minaamidand, chon negaah e novin e to be jang va mahaarat e arteshat dar meydaan e nabard raa mididand. Baa piroozi at dar Jang e Sisaale, naamat baraaye hamishe be onvaan e yeki az bozorgtarin sardaaraan e taarikh be yaad khaahad maand.
O noble King, will you lend your leadership and brilliant ideas to Sweden once again, to conceive strategies never seen before? Will your new empire shine through the ages of history? = Ey paadeshaah e najib, aayaa dobaare rahbari va andishehaaye derakhshaanat raa be Soo'ed mibakhshi taa raahbordhaayi naadide besaazi? Aayaa emperaatoori ye jadidat dar tool e asrhaaye taarikh khaahad derakhshid?
