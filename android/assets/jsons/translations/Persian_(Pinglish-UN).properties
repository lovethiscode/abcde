Hi there! If you've played this far, you've probably seen that the game is currently incomplete.\n Unciv is meant to be open-source and free, forever.\n That means no ads or any other nonsense. = Salaam! Agar taa injaa baazi karde id, ehtemaalan dide id ke baazi hanooz naatamaam ast.\n Unciv hamishe matnbaaz va raaygaan khaahad maand.\n Ya'ni bedoon e tabligh yaa har chiz e bihoode ye digar.
Every rating and review that I get puts a smile on my face =)\n  So contact me! Send me an email, review, Github issue\n  or mail pigeon, and let's figure out how to make the game \n  even more awesome!\n(Contact info is in the Play Store) = Har emtiyaaz va naghdi ke migiram labkhandi rooye sooratam miaavarad =)\n  Pas baa man tamaas begirid! Raayaanaame, naghd, mas'ale ye Github\n  yaa kabootar e naamebar befrestid taa befahmim chegoone baazi raa\n  baaz ham shegeftangiztar konim!\n(Ettelaa'aat e tamaas dar Play Store ast)
