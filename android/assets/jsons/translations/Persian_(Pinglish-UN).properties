Genghis Khan = Changiz Khaan
You stand in the way of my armies. Let us solve this like warriors! = Sar e raah e artesh haayam istaade i. Biaayid in raa maanand e jangjooyaan hal konim!
No more words. Today, Mongolia charges toward your defeat. = Digar harfi nist. Emrooz Mogholestaan baraaye shekast e to hamle mikonad.
You have hobbled the Mongolian clans. My respect for you nearly matches the loathing. I am waiting for my execution. = Ghabile haaye Moghol raa naatavaan kardi. Ehteraamam be to nazdik be nafratam ast. Montazer e e'daamam hastam.
Your bravery must be commended. = Delavari-at shaayeste ye setayesh ast.
I am Temuujin, conqueror of cities and countries. Before me lie future Mongolian lands. Behind me is the only cavalry that matters. = Man Temuujin, faateh e shahr haa va keshvar haa, hastam. Dar pish e man sarzamin haaye aayande ye Moghol ast. Posht e man tanhaa savaare-nezaam e baa-ahammiyat ast.
I am not always this generous, but we hope you take this rare opportunity we give you. = Hamishe in ghadr bakhshande nistam, amma omidvaarim az in forsat e naader ke midahim estefaade koni.
So what now? = Khob haalaa chi?
Mongol Terror = Tars az Moghol
O great Temuujin, immortal leader of the mighty Mongol Empire! Your name alone was enough to make cities crumble, and the sound of the mighty Mongol cavalry to make your enemies flee! O Great Khan! Once Northern Asia united into a mighty people, producing one of the greatest armies the world has ever known, your skillful mounted archers conquered in only a few years, most of China, Eastern Asia, and even reached the gates of Europe at the West. With cunning diplomacy and brilliant warfare, you swept your enemies one after another, creating the greatest empire ever seen, reducing Roman or Greek conquests to minor achievements. = Ey Temuujin e bozorg, rahbar e jaavdaane ye Emperaatoori ye niroomand e Moghol! Tanhaa naamat baraaye foroo-pashi ye shahr haa kaafi bood va sedaaye savaare-nezaam e niroomand e Moghol doshmanaant raa farrari midaad! Ey Khaan e bozorg! Pas az yek-paarchegi ye Shomaal e Aasiyaa be mardomi niroomand va tolid e yeki az bozorgtarin artesh haaye taarikh, tirandaazaan e savaar e maaher e to tanhaa dar chand saal bishtar e Chin va Shargh e Aasiyaa raa taskhir kardand va dar gharb hatta be darvaaze haaye Ooroopaa residand. Baa siyaasat e zirakaane va jang e derakhshaan, doshmanaant raa yeki pas az digari zire paa gozaashti va bozorgtarin emperaatoori ye dide-shode raa saakhti, chonaan ke fath haaye Rom yaa Yoonaan dastaavardi koochak shod.
Divine Temuujin, battles and conquests run through the veins of the Mongols. Are you ready to shatter the will of your enemies? Will your cavalry ride in the steppes once again and strike as lightning and thunder? Will your new empire shine through the ages of history? = Ey Temuujin e khodaagoon, jang va fath dar rag haaye Moghol haa jaari ast. Aayaa aamaade i eraade ye doshmanaant raa beshkani? Aayaa savaare-nezaamat dobaare dar dasht haa khaahad taakht va chon ra'd-o-bargh zarbe khaahad zad? Aayaa emperaatoori ye jadidat dar asr haaye taarikh khaahad derakhshid?
