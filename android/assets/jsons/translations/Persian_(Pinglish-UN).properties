Harald Bluetooth = Harald Bluetooth
If I am to be honest, I tire of those pointless charades. Why don't we settle our disputes on the field of battle, like true men? Perhaps the skalds will sing of your valor... or mine! = Raastash az in namaayesh haaye bifoode khaste am. Cheraa ekhtelaaf raa dar meydan e jang, maanand e mardaan e vaaghei, hal nakonim? Shaayad shaaeraan az delavari ye to… yaa man bekhaanand!
Ahahah! You seem to show some skills of a true Viking! Too bad that I'll probably kill you! = Haahaahaa! Engaar kami maharat e yek Viking e vaaghei daari! Heyf ke ehtemaalan to raa khaaham kosht!
Loki must have stood by you, for a common man alone could not have defeated me... Oh well! I will join the einherjar in Valhalla and feast, while you toil away here. = Loki baayad kenaar e to boode baashad, chon mardi aadi be tanhaayi nemitavaanest maraa shekast dahad… Besyaar khoob! Man be Einherjar dar Valhalla mipeyvandam va jashn migiram, dar haali ke to injaa ranj mibari.
Our future battle will be glorious! = Jang e aayande ye maa baashokooh khaahad bood!
Harald Bluetooth bids you welcome to his lands, a Viking unlike any the seas and lands have ever known! Hah, are you afraid? = Harald Bluetooth be to dar sarzaminash khosh-aamad migooyad; Viking i ke daryaa haa va khoshki haa hargaz hamtaayash raa nadide and! Haa, mitarsi?
This is a fine deal! Even a drunk beggar would agree! = In mo'aamele yi aali ast! Hatta gedaaye mast ham movaafeghat mikonad!
Hail to you. = Dorood bar shomaa.
Viking Fury = Khasht Vaayking haa
Skal, Harald Bluetooth Gormsson, son of King Gorm of the Old and Thyra Dannebod! After crushing the armies of Norway, you achieved great construction projects all across the land of mighty Denmark. Numerous Ring Fortresses were built under your reign to protect the people from foreign invasions, but also from local quarrels. In 983 AD, you successfully repelled several waves of German settlers trying to colonize your land, and then always kept your kingdom free from any foreign pressure. = Skal, Harald Bluetooth Gormsson, pesare Shaah Gorm e Kohan va Thyra Dannebod! Pas az khord kardan e artesh haaye Norvezh, porozhe haaye saakht e bozorgi dar sar-taasar e Daanemaark e niroomand anjaam daadi. Dezh haaye halghe yi ye besyaari dar farmaanravaayi-at saakhte shod taa mardom raa ham az hamle ye bigaane va ham az setize haaye mahalli hefz konad. Dar 983 milaadi chand mowj e mohaajer e Aalmaani raa ke estemaar e sarzaminat raa mikhaastand movaffaghaane daf kardi va pas az aan hamishe paadeshaahi raa az har feshaar e bigaane aazaad negaah daashti.
As a true Viking, who knows not fear, time has come to unleash mighty armies of Northsmen to bring despair upon your enemies! By the will of the Gods, it will be either a glorious triumph or a sumptuous feast in the Valhalla! Will your new empire shine through the ages of history? = Chon Viking i vaaghei ke tars nemishenaasad, zamaan e raha kardan e artesh haaye niroomand e mardom e shomaal ast taa doshmanaant raa nomaid koni! Be khaast e khodaayaan, yaa piroozi yi baashokooh khaahad bood yaa ziyafati shaahaane dar Valhalla! Aayaa emperaatoori ye jadidat dar asr haaye taarikh khaahad derakhshid?
