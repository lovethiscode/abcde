#################### Lines from Global Tutorials ####################

Welcome to Unciv!\nBecause this is a complex game, there are basic tasks to help familiarize you with the game.\nThese are completely optional, and you're welcome to explore the game on your own! = Be Unciv khosh aamadid!\nChon in baazi pichide ast, tamrinhaaye paaye baraaye aashnaayi baa baazi vojood daarand.\nInhaa kaamelan ekhtiyaari hastand va mitavaanid baazi raa khodetaan kaavosh konid!

Welcome to Unciv! = Be Unciv khosh aamadid!
Because this is a complex game, there are some tutorials to help familiarize you with it. These can be disabled in the Options -> Display menu, but please hang on if you're new here! = Chon in baazi pichide ast, aamoozeshhaayi baraaye aashnaayi baa aan vojood daarand. Mitavaan aanhaa raa dar Tanzimaat -> Namaayesh gheyrefa'aal kard, amma agar taaze aamadid lotfan kami sabr konid!
Your first mission is to found your capital city. This is actually an important task because your capital city will probably be your most prosperous. Many game bonuses apply only to your capital city, and it will be the center of your empire. = Nakhostin ma'mooriyat e shomaa bonyangozari ye paaytakht ast. In kaar mohem ast chon paaytakht e shomaa ehtemaalan aabaadtarin shahr e shomaa khaahad bood. Besyaari az emtiyaazhaaye baazi faghat baraaye paaytakht hastand va aan markaz e emperaatoori ye shomaa khaahad bood.
How do you know a city location is appropriate? Luckily, the game has already chosen a good location for you. You can settle in this place, or maybe move a turn to found on a Hill (for Production and defence) or next to a Mountain (to gain access to the Observatory building later on). = Az kojaa mifahmid ke makaan e shahr monaaseb ast? Khoshbakhtaane baazi az ghabl makaan e khoobi baraaye shomaa entekhaab karde ast. Mitavaanid hamin jaa saaken shavid, yaa yek nobat harekat konid taa rooye Tappe baraaye Tolid va defaa', yaa kenaar e Kooh baraaye dastresi ye ba'di be saakhtemaan e Rasadkhaane, shahr besaazid.
You'll likely want more cities later on. For these cities, you must go and find a good place. Looking for and founding on or near Luxury resources is a good rule of thumb. = Ehtemaalan ba'dan shahrhaaye bishtari mikhaahid. Baraaye aanhaa baayad beravid va jaaye khoobi peydaa konid. Jostojoo ye manaabe e tajammoli va saakhtan e shahr rooye aanhaa yaa dar nazdiki ye aanhaa raahnamaa ye khoobi ast.
Luxury resources are tiles that have things like Gems, Cotton, or Silk (indicated by a yellow background of the resource icon). These resources make your civilization happy. You should also keep an eye out for resources needed to build units, such as Iron. Cities cannot be built within 3 tiles of existing cities, which is another thing to keep in mind! = Manaabe e tajammoli zaminhaayi hastand ke chizhaayi maanand e Javaaher, Panbe yaa Abrisham daarand; paszamine ye zard e nemaad e manba' aanhaa raa neshaan midahad. In manaabe tamaddon e shomaa raa raazi mikonand. Hamchenin moraagheb e manaabe e laazem baraaye saakht e niroohaa, maanand e Aahan, baashid. Shahrhaa raa nemitavaan taa faasele ye 3 khaane az shahrhaaye mojood saakht; in raa ham be yaad daashte baashid!
Cities will house Citizens, which can work tiles up to 3 tiles away from the city. This means you don’t have to settle cities right on or next to good tiles. Let’s say, for example, that you want access to some Iron – but the resource is in a desert area. You don’t have to settle your city in the desert. You can settle a few tiles away in more prosperous lands. Your city will grow and eventually gain access to the resource. You only need to settle right on top of resources if you need them immediately. = Shahrhaa makaan e zendegi ye Shahrvandaan hastand ke mitavaanand rooye zaminhaaye taa 3 khaane door az shahr kaar konand. Pas laazem nist shahr raa dorost rooye zamin e khoob yaa kenaaresh besaazid. Masalan, mikhaahid be Aahan dastresi daashte baashid amma manba' dar biyaabaan ast. Laazem nist shahr raa dar biyaabaan besaazid. Mitavaanid chand khaane doortar, dar sarzamin e aabaadtar, saaken shavid. Shahr roshd mikonad va saranjaam be manba' dastresi miyaabad. Faghat zamani baayad dorost rooye manaabe shahr besaazid ke aanhaa raa fori laazem daarid.
The first thing coming out of your city depends on the strategy you want to follow, but the 'classic' build order is to build first two Scouts, then a Shrine, and three Settlers, and adopt Tradition, to explore the map quickly (Scouts ignore terrain cost), and to get an early Pantheon (if you're playing with religion enabled). = Nakhostin chizi ke shahr e shomaa misaazad be raahbord e delkhaah bastegi daarad, amma tartib e «kelaasik» in ast: avval do Pishaahang, sepas yek Neyaayeshgaah va se Shahrakneshin besaazid va Sonnat raa bepazirid, taa naghshe raa zood kaavosh konid (pishaahanghaa hazine ye zamin raa naadide migirand) va zood be Panteon beresid, agar din fa'aal ast.
But feel free to experiment with your own build orders! = Amma aazaadaane tartibhaaye saakht e khodetaan raa aazmaayesh konid!

In your first couple of turns, you will have very little options, but as your civilization grows, so do the number of things requiring your attention. = Dar chand nobat e avval gozine haaye kami daarid, amma baa roshd e tamaddon, tedaad e kaarhaayi ke be tavajjoh e shomaa niyaaz daarand ham ziyaad mishavad.

Culture and Policies = Farhang va Siyaasathaa
Each turn, the culture you gain from all your cities is added to your Civilization's culture.\nWhen you have enough culture, you may pick a Social Policy, each one giving you a certain bonus. = Har nobat, Farhang e be dast aamade az hame ye shahrhaa be Farhang e tamaddon e shomaa afzoode mishavad.\nVaghti Farhang e kaafi daashtid, mitavaanid yek Siyaasat e ejtemaayi entekhaab konid ke har kodaam emtiyaaz e khaasi midahad.
The policies are organized into branches, with each branch providing a bonus ability when all policies in the branch have been adopted. = Siyaasathaa be shaakhehaa taghsim shode and; har shaakhe pas az paziresh e hame ye siyaasathaayash yek tavaanaayi ye ezaafi midahad.
With each policy adopted, and with each city built,\n  the cost of adopting another policy rises - so choose wisely! = Baa paziresh e har siyaasat va saakht e har shahr,\n  hazine ye siyaasat e ba'adi afzaayesh miyaabad; pas kheradmandaane entekhaab konid!

City Expansion = Gostaresh e Shahr
Once a city has gathered enough Culture, it will expand into a neighboring tile.\nYou have no control over the tile it will expand into, but tiles with resources and higher yields are prioritized. = Pas az aan ke shahr Farhang e kaafi jam' kard, be yek zamin e hamsaaye gostaresh miyaabad.\nShomaa zamin e gostaresh raa entekhaab nemikonid, amma zaminhaaye daaraaye manba' va baazdehi ye bishtar olaviyat daarand.
Each additional tile will require more culture, but generally your first cities will eventually expand to a wide tile range. = Har zamin e ezaafi Farhang e bishtari laazem daarad, amma mamoolan shahrhaaye avval saranjaam be gostaare ye bozorgi az zaminhaa miresand.
Although your city will keep expanding forever, your citizens can only work 3 tiles away from city center.\nThis should be taken into account when placing new cities. = Har chand shahr baraaye hamishe gostaresh miyaabad, shahrvandaan faghat taa 3 khaane az markaz e shahr mitavaanand kaar konand.\nDar jaaygozaari ye shahrhaaye taaze be in nokte tavajjoh konid.

Food is the resource fundamental to your Cities', and as a result Nation's, population and health. = Ghazaa manba' e asaasi baraaye jam'iyat va salaamati ye shahrhaa va dar natije keshvar e shomaa ast.
Every Citizen in each City consumes Food per turn. Any left over is considered Growth and is stored in the City Center. Once enough accumulates, the City Grows and a new Citizen is added. = Har shahrvand dar har shahr, dar har nobat Ghazaa masraf mikonad. Baghimaande baraaye Roshd dar markaz e shahr zakhire mishavad. Baa jam' shodan e Ghazaa ye kaafi, shahr roshd mikonad va yek shahrvand e taaze afzoode mishavad.
Initially your main source of Food is the City Center itself and working a surrounding tile with a Citizen. You can increase how much is generated by gaining more Citizens to work more tiles, improving the tiles so that they yield more Food, and eventually Buildings and Policies. = Dar aaghaaz, manba' e asli ye Ghazaa khod e markaz e shahr va kaar e yek shahrvand rooye zamin e hamsaaye ast. Baa afzaayesh e shahrvandaan baraaye kaar rooye zaminhaaye bishtar, behsaazi ye zaminhaa baraaye Ghazaa ye bishtar va sepas Saakhtemaanhaa va Siyaasathaa mitavaanid Tolid raa ziyaad konid.
Since a city's number of Citizens, or Population, determines how many tiles a City can work, Food is often the most important Resource. = Chon tedaad e Shahrvandaan yaa Jam'iyat e shahr moshakhkhas mikonad ke rooye chand zamin mitavaan kaar kard, Ghazaa aghlab mohemtarin manba' ast.

Production is the resource that lets a City Center build new things. = Tolid manba'i ast ke be markaz e shahr ejaaze midahad chizhaaye taaze besaazad.
This can be new Buildings that are added to the City Center, or new Units that can go out across the World Map to advance your Nation's goals. = In mitavaanad Saakhtemaanhaaye taaze baraaye markaz e shahr yaa Niroohaaye taaze baashad ke dar Naghshe ye Jahaan baraaye hadafhaaye keshvar harekat mikonand.
Everything you can build has a Production Cost. Every turn each City generates a certain amount of Production and puts it towards whatever is at the top of the Build Queue. Once the total cost is collected, the Building or Unit is built! = Har chizi ke misaazid hazine ye Tolid daarad. Har nobat, har shahr meghdaar e moshakhkhasi Tolid mikonad va aan raa sarf e chizi mikonad ke baalaa ye Saf e Saakht ast. Vaghti hazine ye kaamel jam' shod, Saakhtemaan yaa Niroo saakhte mishavad!
Any excess Production after something is built is overflowed to the next thing the City builds. Up to it's total Production Cost. = Tolid e ezaafi pas az saakht e yek chiz be chiz e ba'adi ke shahr misaazad montaghel mishavad, taa hadde hazine ye kaamel e Tolid e aan.
Since this determines how quickly you can build more stuff, your Nation's Production Capacity is crucial to it's advancement and survival. = Chon in meghdaar sor'at e saakht e chizhaaye bishtar raa ta'yin mikonad, zarfiyat e Tolid e keshvar baraaye pishraft va baghaaye aan hayaati ast.

⍾Science is the resource that unlocks new and exciting Technologies for your Nation. = ⍾Elm manba'i ast ke Fannaavarihaaye taaze va heyjaanangiz raa baraaye keshvar e shomaa baaz mikonad.
Once you've Founded your Capital, you'll be prompted to Pick a Technology to Research. = Pas az bonyangozari ye Paaytakht, az shomaa khaaste mishavad Fannaavariyi baraaye Pazhoohesh entekhaab konid.
Every Technology costs an amount of ⍾Science. Every turn the ⍾Science your Nation produces is paid towards Researching your chosen Technology. = Har Fannaavari meghdaari ⍾Elm hazine daarad. Har nobat, ⍾Elm e tolidshode dar keshvar sarf e Pazhoohesh e Fannaavari ye entekhaabi mishavad.
Once a Technology has it's cost fully paid, you unlock the benefits for your Nation! This could be new Units, Buildings, or other advantages. Any surplus will overflow into the next Technology you pick to Research. = Baa pardaakht e kaamel e hazine ye yek Fannaavari, soodhaaye aan baraaye keshvar baaz mishavad! In mitavaanad Niroo, Saakhtemaan yaa emtiyaazhaaye digar baashad. Maazaad be Fannaavari ye ba'adi ke baraaye Pazhoohesh entekhaab mikonid montaghel mishavad.
Researching a Technology in the next Era will advance you into that Era and trigger a notification to other Nations about how amazing you are! = Pazhoohesh e Fannaavariyi dar Asr e ba'adi shomaa raa vaared e aan Asr mikonad va baa yek payaam be keshvarhaaye digar migooyad cheghadr shegeftangiz hastid!
Since new Technologies tend to give access to better Units, Buildings, and even unlock powerful new Policies, staying ahead of the competition is one of the best ways to secure your Victory! = Chon Fannaavarihaaye jadid mamoolan Niroohaa va Saakhtemaanhaaye behtar va hatta Siyaasathaaye taaze ye niroomand raa baaz mikonand, jelo maandan az raghibaan yeki az behtarin raahhaaye tazmin e Piroozi ast!

Ah Gold. The Universal Medium of Exchange. Everyone loves Gold! They say it can't buy Happiness, but nuclear submarines are almost as good. = Aah, Talaa. Abzaar e hamagaani ye mobaadele. Hame Talaa raa doost daarand! Migooyand Rezaayat nemikharad, amma zirdaryaayi ye haste'i taghriban hamaan ghadr khoob ast.
You can earn more Gold from Tiles, Resources, Improvements, and eventually Buildings, Specialists, and Trade Routes. Ancient Ruins, meeting new City-States, and Pillaging are also great sources of Gold. During a Golden Age every Tile that already yields Gold will yield an additional Gold! = Az Zaminhaa, Manaabe, Behsaazihaa va sepas Saakhtemaanhaa, Motekhassesaan va Masirhaaye Tejaari mitavaanid Talaa ye bishtari be dast aavarid. Viraanehaaye Baastaan, aashnaayi baa Shahr-dowlathaaye taaze va Ghaarat niz manaabe e khoob e Talaa hastand. Dar Asr e Talaai har Zamin ke az ghabl Talaa midahad yek Talaa ye ezaafi khaahad daad!
Gold is how you pay for Building Maintenance, Transportation Upkeep, and Unit Upkeep. If you run out of Gold, first you'll receive penalties to your ⍾Science production, then eventually your Units will start Disbanding as you can't pay their upkeep. = Baa Talaa hazine ye Negahdaari ye Saakhtemaan, Hamm-o-naghl va Niroo raa mipardaazid. Agar Talaa tamaam shavad, nakhost Tolid e ⍾Elm jarime mishavad va saranjaam Niroohaa be dalil e adam e pardaakht e negahdaari shoroo be Monhal shodan mikonand.
Gold can be used to Buy Buildings and Units, helping bring up a new City or quickly build an Army. It can also buy Tiles to add to your City. It's also used to Upgrade your units from their older, obsolete forms to new, stronger versions. And investing it into a Research Agreement is a great way to convert it into ⍾Science. = Talaa baraaye Kharid e Saakhtemaan va Niroo be kaar miravad va be roshd e shahr e taaze yaa saakht e sari' e artesh komak mikonad. Baa aan mitavaan Zamin kharid va be shahr afzood. Hamchenin baraaye Erteghaa ye niroo az shekl e ghadimi va mansookh be noskhe ye jadid va ghavitar estefaade mishavad. Sarmayegozaari dar Tavaafogh e Pazhoohesh niz raahi aali baraaye tabdil e aan be ⍾Elm ast.
Gold is also very valuable in Diplomacy. You can directly Gift Gold to City-States to gain their favor. Use it to balance a Trade Deal with other Nations. Or demand every last drop after a successful war and your enemy sues for peace. = Talaa dar Diplomaasi niz besyaar arzeshmand ast. Mitavaanid mostaghiman be Shahr-dowlathaa Talaa Hadiye dahid taa nazar e mosaa'ed e aanhaa raa jalb konid. Baa aan Mo'aamele ye Tejaari baa keshvarhaaye digar raa mota'aadel konid, yaa pas az jang e movaffagh va darkhaast e solh e doshman, aakharin sekke raa ham taghaazaa konid.
Ironically, some may consider Gold to be one of the less important Resources. But it's flexible nature and importance to keep your Nation running makes it a precious thing to pay attention to. After all, everyone loves Gold. = Shaayad barkhi Talaa raa yeki az manaabe e kam ahammiyattar bedaanand. Amma en'etaaf va ahammiyat e aan baraaye edaare ye keshvar, aan raa be chizi geraanbahaa tabdil mikonad ke baayad be aan tavajjoh kard. Harche baashad, hame Talaa raa doost daarand.
Not to be confused with the Resource of the same name, Gold Ore = Baa manba' e hamnaam, Sang e Talaa, eshtebaah nashavad
Trade Route = Masir e Tejaari
See also: [param] = Hamchenin bebinid: [param]
Research Agreements = Tavaafoghhaaye Pazhoohesh

As cities grow in size and influence, you have to deal with a happiness mechanic that is no longer tied to each individual city.\nInstead, your entire empire shares the same level of satisfaction.\nAs your cities grow in population you’ll find that it is more and more difficult to keep your empire happy. = Baa roshd e andaaze va nofooz e shahrhaa, baayad baa saazokaar e rezaayati rooberoo shavid ke digar be har shahr be tanhaayi vaabaste nist.\nBe jaaye aan, hame ye emperaatoori yek sat'h e Rezaayat daarad.\nBaa afzaayesh e jam'iyat e shahrhaa, raazi negah daashtan e emperaatoori sakhttar mishavad.
In addition, you can’t even build any city improvements that increase happiness until you’ve done the appropriate research.\nIf your empire’s happiness ever goes below zero the growth rate of your cities will be hurt.\nIf your empire becomes severely unhappy (as indicated by the smiley-face icon at the top of the interface)\n  your armies will have a big penalty slapped on to their overall combat effectiveness. = Taaze, taa pazhoohesh e laazem raa anjaam nadahid nemitavaanid behsaazihaaye shahri ye afzaayande ye rezaayat besaazid.\nAgar Rezaayat e emperaatoori az sefr paayintar beravad, sor'at e roshd e shahrhaa aasib mibinad.\nAgar emperaatoori besyaar naaraazi shavad, ke nemaad e labkhand dar baalaa ye vaaset neshaan midahad,\n  kaaraayi ye koli ye jangi ye artesh e shomaa jarime ye bozorgi migirad.
This means that it is very difficult to expand quickly in Unciv.\nIt isn’t impossible, but as a new player you probably shouldn't do it.\nSo what should you do? Chill out, scout, and improve the land that you do have by building Workers.\nOnly build new cities once you have found a spot that you believe is appropriate. = Pas gostaresh e sari' dar Unciv besyaar doshvaar ast.\nGheyr e momken nist, amma baraaye baazikon e taaze shaayad monaaseb nabaashad.\nPas che konid? Aaraam baashid, kaavosh konid va baa saakht e Kaaregar, zamin e mojood raa behsaazi konid.\nTanhaa pas az yaaftan e makaani ke monaaseb midaanid shahr e taaze besaazid.

 # Requires translation!
Unhappiness = Naaraaziyati
It seems that your citizens are unhappy!\nWhile unhappy, your civilization will suffer many detrimental effects, increasing in severity as unhappiness gets higher. = Be nazar miresad shahrvandaan e shomaa naaraazi hastand!\nDar in vaz'iyat, tamaddon az aathaar e ziyaanbaar e besyaari aasib mibinad ke baa afzaayesh e naaraaziyati shedidtar mishavand.
Unhappiness has two main causes: Population and cities.\n  Each city causes 3 unhappiness, and each population, 1 = Naaraaziyati do ellat e asli daarad: Jam'iyat va shahrhaa.\n  Har shahr 3 naaraaziyati va har vaahed e jam'iyat 1 naaraaziyati ijaad mikonad
There are 2 main ways to combat unhappiness:\n  by building happiness buildings for your population\n  or by having improved luxury resources within your borders. = Baraaye mobaareze baa naaraaziyati 2 raah e asli vojood daarad:\n  saakht e saakhtemaanhaaye rezaayat baraaye jam'iyat\n  yaa daashtan e manaabe e tajammoli ye behsaazishode dar marzhaa.

You have entered a Golden Age!\nGolden age points are accumulated each turn by the total happiness \n  of your civilization\nWhen in a golden age, culture and production generation increases +20%,\n  and every tile already providing at least one gold will provide an extra gold. = Vaared e Asr e Talaai shodid!\nEmtiyaazhaaye Asr e Talaai har nobat az Rezaayat e kol\n  e tamaddon jam' mishavand\nDar Asr e Talaai, Tolid e Farhang va Tolid +20% ziyaad mishavad,\n  va har zamin ke az ghabl hadd aghal yek Talaa midahad, yek Talaa ye ezaafi khaahad daad.

Roads and Railroads = Jaadde va Raah aahan
Roads reduce the Movement Points required to move between two tiles connected by Roads. = Jaaddehaa Emtiyaaz e Harekat e laazem baraaye raftan beyne do zamin e vaslshode baa Jaadde raa kam mikonand.
Railroads improve this reduction even more! = Raahaahan in kaahesh raa bishtar ham mikonad!
This greatly improves the speed you can get Units around the map. = In sor'at e jaabejaayi ye Niroohaa dar naghshe raa besyaar afzaayesh midahad.
Until you research the technology that removes it, Roads do not cross Rivers = Taa pazhoohesh e fannaavari ye laazem baraaye hazf e in mahdoodiyat, Jaaddehaa az Roodkhaanehaa nemigozarand
Connecting your cities to the capital by Roads and/or Railroads will generate Gold via the Trade Route. = Vasl e shahrhaa be paaytakht baa Jaadde va/yaa Raahaahan az raah e Masir e Tejaari Talaa tolid mikonad.
However, since each Road and Railroad have a Maintenance Cost, it may be more economical to wait until the cities grow and only place where needed. = Amma chon har Jaadde va Raahaahan hazine ye Negahdaari daarad, shaayad behtar baashad taa roshd e shahrhaa sabr konid va faghat dar jaaye laazem besaazid.

Connecting your cities to the capital by Roads and/or Railroads will generate Gold via the Trade Route. You earn more Gold the more Population the City and your Capital has. = Vasl e shahrhaa be paaytakht baa Jaadde va/yaa Raahaahan az raah e Masir e Tejaari Talaa tolid mikonad. Harche Jam'iyat e shahr va Paaytakht bishtar baashad, Talaa ye bishtari migirid.
Note that each road costs 1 Gold Maintenance per turn, and each Railroad costs 2 Gold, so it may be more economical to wait until the cities grow! = Be yaad daashte baashid har jaadde dar har nobat 1 Talaa va har Raahaahan 2 Talaa Negahdaari hazine daarad; pas shaayad sabr taa roshd e shahrhaa be sarfetar baashad!
Railroads connecting a city to the Capital also provide a 25% Production Boost to the City, but not the Capital. = Raahaahan e vaslkonande ye shahr be Paaytakht, Tolid e aan shahr raa 25% afzaayesh midahad, amma na Tolid e Paaytakht raa.
Trade Routes are also connected over Water via certain buildings like the Harbor. As long as there is a chain that can reach the Capital, there's a Trade Route. Look for this symbol in Yellow below the City Name to mean you have an active Trade Route to your Capital. = Masirhaaye Tejaari az rooye Aab ham baa saakhtemaanhaayi maanand e Bandar vasl mishavand. Taa zamani ke zanjire i be Paaytakht beresad, Masir e Tejaari vojood daarad. Nemaad e Zard e zir e Naam e Shahr neshaane ye Masir e Tejaari ye fa'aal be Paaytakht ast.
Trade Routes can get broken either by Blockades or by Removing/Pillaging the connecting Road/Railroad chain. = Masirhaaye Tejaari baa Mohaasere yaa Hazf/Ghaarat e zanjire ye vaslkonande ye Jaadde/Raahaahan ghat' mishavand.
City Blockade = Mohaasere ye Shahr

Once you’ve settled 3-4 cities and build universities, you’re probably already 100 to 150 turns into the game.\nNow is a good time to start thinking about how, exactly, you want to win – if you haven’t already. = Vaghti 3-4 shahr saakhte va daaneshgaah besaazid, ehtemaalan 100 taa 150 nobat az baazi gozashte ast.\nHalaa vaght e khoobi ast ke agar hanooz nakarde id, be ravesh e daghigh e piroozi fekr konid.
There are four ways to win in Unciv. They are:\n - Cultural Victory: Complete 5 Social Policy Trees and build the Utopia Project\n - Domination Victory: Conquer the original capital of all other Major civs\n - Science Victory: Be the first to construct a Spaceship\n - Diplomatic Victory: Build the United Nations and win the vote = Dar Unciv chahaar raah e piroozi vojood daarad:\n - Piroozi ye Farhangi: 5 derakht e Siyaasat e Ejtemaayi raa takmil va Porozhe ye Ootoopiyaa raa besaazid\n - Piroozi ye Solte: Paaytakht e asli ye hame ye tamaddonhaaye bozorg e digar raa fath konid\n - Piroozi ye Elmi: Nakhostin saazande ye Fazaapeymaa baashid\n - Piroozi ye Diplomatik: Saazmaan e Melal e Mottahed raa besaazid va dar raaygiri barande shavid
So to sum it up, these are the basics of Unciv – Found a prosperous first city, expand slowly to manage happiness, and set yourself up for the victory condition you wish to pursue.\nObviously, there is much more to it than that, but it is important not to jump into the deep end before you know how to swim. = Pas paayehaaye Unciv in ast: shahr e avval e aabaadi besaazid, baraaye modiriyat e Rezaayat aaraam gostaresh yaabid va khod raa baraaye sharaayet e piroozi ye delkhaah aamaade konid.\nAashkaar ast ke baazi besyaar faraatar az in ast, amma mohem ast pish az yaadgiri ye shenaa dar aab e amigh naparid.

Enemy City = Shahr e Doshman
Cities can be conquered by reducing their health to 1, and entering the city with a melee unit.\nSince cities heal each turn, it is best to attack with ranged units and use your melee units to defend them until the city has been defeated! = Baa kaahesh e salaamati ye shahr be 1 va vorood e yek niroo ye nazdikzan, mitavaan aan raa fath kard.\nChon shahrhaa har nobat tarmim mishavand, behtar ast baa niroohaaye doorbord hamle konid va taa shekast e shahr, baa niroohaaye nazdikzan az aanhaa defaa' konid!

Luxury Resource = Manba' e Tajammoli
Luxury resources within your domain and with their specific improvement are connected to your trade network.\nEach unique Luxury resource you have adds 5 happiness to your civilization, but extra resources of the same type don't add anything, so use them for trading with other civilizations! = Manaabe e tajammoli ye dar marzhaa ke behsaazi ye khaas e khod raa daarand, be shabake ye tejaari vasl mishavand.\nHar noe e motefaavet e manba' e Tajammoli 5 Rezaayat be tamaddon miafzaayad, amma noskhehaaye ezaafi ye hamaan noe chizi ezaafe nemikonand; pas baa tamaddonhaaye digar tejaarat konid!

Strategic Resource = Manba' e Raahbordi
Strategic resources within your domain and with their specific improvement are connected to your trade network.\nStrategic resources allow you to train units and construct buildings that require those specific resources, for example the Horseman requires Horses. = Manaabe e raahbordi ye dar marzhaa ke behsaazi ye khaas e khod raa daarand, be shabake ye tejaari vasl mishavand.\nManaabe e Raahbordi saakht e niroo va saakhtemaan e niyaazmand e aanhaa raa momken mikonand; masalan Asbsavaar be Asb niyaaz daarad.
Unlike Luxury Resources, each Strategic Resource on the map provides more than one of that resource.\nThe top bar keeps count of how many unused strategic resources you own.\nA full drilldown of resources is available in the Resources tab in the Overview screen. = Bar khalaaf e Manaabe e Tajammoli, har manba' e Raahbordi dar naghshe bish az yek vaahed az aan manba' midahad.\nNavaar e baalaa meghdaar e manaabe e raahbordi ye masrafnashode ye shomaa raa mishomaarad.\nJoziyaat e kaamel e manaabe dar zabaane ye Manaabe dar safhe ye Moroor ast.

The city can no longer put up any resistance!\nHowever, to conquer it, you must enter the city with a melee unit = Shahr digar nemitavaanad moghaavemat konad!\nAmma baraaye fath e aan baayad baa yek niroo ye nazdikzan vaared shavid

After Conquering = Pas az Fath
When conquering a city, you can choose to liberate, annex, puppet, or raze the city. = Hengaam e fath e shahr mitavaanid aazaadsaazi, elhaagh, dastneshaandegi yaa viraansaazi raa entekhaab konid.
\nLiberating the city will return it to its original owner, giving you a massive diplomatic boost with them!\n\nAnnexing the city will give you full control over it, but also increase the citizens' unhappiness to 2x!\nThis can be mitigated by building a courthouse in the city, returning the citizen's unhappiness to normal.\n\nPuppeting the city will mean that you have no control on the city's production.\nThe city will not increase your tech or policy cost.\nA puppeted city can be annexed at any time, but annexed cities cannot be returned to a puppeted state!\n\nRazing the city will lower its population by 1 each turn until the city is destroyed!\nYou cannot raze a city that is either the starting capital of a civilization or the holy city of a religion. = \nAazaadsaazi, shahr raa be maalik e asli barmigardaanad va ravaabet e diplomatik raa besyaar behbood midahad!\n\nElhaagh, kontrol e kaamel e shahr raa midahad amma naaraaziyati ye shahrvandaan raa be 2x miresaanad!\nBaa saakht e daadgaah dar shahr, naaraaziyati ye shahrvandaan be aadi barmigardad.\n\nDastneshaande kardan ya'ni kontrol e Tolid e shahr raa nadaarid.\nShahr hazine ye fannaavari yaa siyaasat raa ziyaad nemikonad.\nShahr e dastneshaande raa har zamaan mitavaan elhaagh kard, amma shahr e elhaaghshode raa nemitavaan dobaare dastneshaande kard!\n\nViraansaazi har nobat Jam'iyat e shahr raa 1 kam mikonad taa shahr naabood shavad!\nShahr e paaytakht e aaghaazin e yek tamaddon yaa shahr e moghaddas e yek din raa nemitavaan viraan kard.

You have encountered a barbarian unit!\nBarbarians attack everyone indiscriminately, so don't let your \n  civilian units go near them, and be careful of your scout! = Baa yek niroo ye barbar rooberoo shodid!\nBarbarhaa be hame bitafaavot hamle mikonand; pas nagzaarid\n  niroohaaye gheyr e nezaami be aanhaa nazdik shavand va moraagheb e pishaahang baashid!

You have encountered another civilization!\nOther civilizations start out peaceful, and you can trade with them,\n  but they may choose to declare war on you later on = Baa tamaddon e digari rooberoo shodid!\nTamaddonhaaye digar dar aaghaaz solh joo hastand va mitavaanid baa aanhaa tejaarat konid,\n  amma shaayad ba'dan be shomaa e'laam e jang konand

Injured Units = Niroohaaye Zakhmi
Injured units deal less damage, but recover after turns that they have been inactive.\nUnits heal 10 health per turn in enemy territory or neutral land,\n  20 inside your territory and 25 in your cities. = Niroohaaye zakhmi aasib e kamtari mizanand, amma pas az nobathaaye bi fa'aaliyat behbood miyaaband.\nNiroohaa har nobat dar khaak e doshman yaa sarzamin e bitaraf 10 salaamati,\n  dar khaak e shomaa 20 va dar shahrhaaye shomaa 25 salaamati baaz miyaaband.

Workers = Kaaregarhaa
Workers are vital to your cities' growth, since only they can construct improvements on tiles.\nImprovements raise the yield of your tiles, allowing your city to produce more and grow faster while working the same amount of tiles! = Kaaregarhaa baraaye roshd e shahrhaa hayaati hastand, chon faghat aanhaa mitavaanand behsaazi rooye zaminhaa besaazand.\nBehsaazihaa baazdehi ye zamin raa afzaayesh midahand taa shahr baa hamaan tedaad zamin Tolid e bishtar va roshd e sari'tar daashte baashad!

Embarking = Savaar e Keshti Shodan
Once a certain tech is researched, your land units can embark, allowing them to traverse water tiles.\nEntering or leaving water takes the entire turn. = Pas az pazhoohesh e fannaavari ye khaas, niroohaaye zamini mitavaanand savaar e keshti shavand va az zaminhaaye aabi bogzarand.\nVorood be aab yaa khorooj az aan yek nobat e kaamel tool mikeshad.
Units are defenseless while embarked (cannot use modifiers), and have a fixed Defending Strength based on your tech Era, so be careful!\nRanged Units can't attack, Melee Units have a Strength penalty, and all have limited vision. = Niroohaa hengaam e savaar e keshti boodan bi-defaa' hastand, modifikatorhaa raa nemitavaanand be kaar bebarand va Ghodrat e Defaa'i ye saabeti bar paaye ye Asr e fannaavari daarand; pas moraagheb baashid!\nNiroohaaye Doorbord nemitavaanand hamle konand, Niroohaaye Nazdikzan jarime ye Ghodrat daarand va did e hame mahdood ast.

Idle Units = Niroohaaye Bikaar
Clicking 'Next unit' moves to the next idle unit in the queue (as listed in Overview -> Units). After issuing an order to a unit, if 'Auto Unit Cycle' in Options -> Gameplay is enabled, you will automatically select the next idle unit. = Zadan e «Niroo ye ba'adi» niroo ye bikaar e ba'adi dar saf raa entekhaab mikonad, hamaan fehrest e Moroor -> Niroohaa. Pas az dastoor be yek niroo, agar «Gardesh e Khodkaar e Niroo» dar Tanzimaat -> Ravesh e baazi fa'aal baashad, niroo ye bikaar e ba'adi khodkaar entekhaab mishavad.
If you don't want to move a unit this turn, you can skip it by clicking 'Next unit' again, or command the unit to 'Skip turn'. = Agar nemikhaahid in nobat nirooyi raa harekat dahid, mitavaanid dobaare «Niroo ye ba'adi» raa bezanid yaa dastoor e «Rad kardan e nobat» bedahid.
If you want to disable the 'Next unit' feature entirely, you can toggle it in Options -> Gameplay -> Check for idle units. = Baraaye gheyrefa'aal kardan e kaamel e «Niroo ye ba'adi», gozine ye Tanzimaat -> Ravesh e baazi -> Barrasi ye niroohaaye bikaar raa avaz konid.
If you'd rather 'Next unit' cycle the units and not mark them as Done, you can change it in the Options -> Gameplay menu. = Agar tarjih midahid «Niroo ye ba'adi» faghat beyne niroohaa begardad va aanhaa raa Anjaamshode neshaane nazanad, aan raa dar Tanzimaat -> Ravesh e baazi taghyir dahid.
You can also cycle through the idle units using the left and right triangles on the Unit Table in the lower left of the screen. Or by default using the Cycle button next to the 'Next Unit' button. = Baa mosallas e chap va raast e Jadval e Niroo dar paayin e chap e safhe niz mitavaanid beyne niroohaaye bikaar begardid. Yaa be toor e pishfarz baa dokme ye Gardesh dar kenaar e «Niroo ye ba'adi».

 # Requires translation!
Contact Me = Tamaas baa man
 # Requires translation!
Hi there! If you've played this far, you've probably seen that the game is currently incomplete.\n Unciv will remain open-source forever. = Salaam! Agar taa injaa baazi karde-id, ehtemaalan dide-id ke baazi hanooz kaamel nist.\nUnciv hamishe baaz-matn khaahad maand.
 # Requires translation!
What motivates me to keep working on it, \n  besides the fact I think it's amazingly cool that I can,\n  is the support from the players - you guys are the best! = Chizi ke man raa baraaye edaameye kaar rooye aan ba-angiyeze mikonad, \n  gheyr az inke fekr mikonam inke mitavaanam aan raa anjaam daham foghol'aade ast,\n  hemaayat e baazikonaan ast — shomaa behtarin hastid!
 # Requires translation!
If you like Unciv, please rate and review it in the App Store.\n If you find a problem or have a suggestion, open a GitHub issue and help us make the game even better! = Agar Unciv raa doost daarid, lotfan dar App Store be aan emtiaaz dahid va nazar benevisid.\nAgar moshkeli didid yaa pishnahaadi daarid, yek GitHub issue baaz konid va be maa komak konid baazi raa behtar konim!

Pillaging = Ghaarat
Military units can pillage improvements, which heals them 25 health and ruins the improvement.\nThe tile can still be worked, but advantages from the improvement - stat bonuses and resources - will be lost.\nWorkers can repair these improvements, which takes less time than building the improvement from scratch.\nPillaging certain improvements will result in your units looting gold from the improvement. = Niroohaaye nezaami mitavaanand behsaazihaa raa ghaarat konand; in kaar 25 salaamati be aanhaa barmigardaanad va behsaazi raa viraan mikonad.\nHanooz mitavaan rooye zamin kaar kard, amma soodhaaye behsaazi, ya'ni emtiyaazhaaye aamaar va manaabe, az dast miravand.\nKaaregarhaa mitavaanand in behsaazihaa raa dar zamaani kamtar az saakht e az no ta'mir konand.\nGhaarat e ba'zi behsaazihaa baa'es mishavad niroohaa Talaa be dast aavarand.

Experience = Tajrobe
Units that enter combat gain experience, which can then be used on promotions for that unit.\nUnits gain more experience when in Melee combat than Ranged, and more when attacking than when defending. = Niroohaayi ke vaared e jang mishavand tajrobe migirand ke baraaye erteghaa ye aan niroo estefaade mishavad.\nDar jang e Nazdikzan bishtar az Doorbord, va dar Hamle bishtar az Defaa' tajrobe kasb mikonand.
Units can only gain up to 30 XP from Barbarian units - meaning up to 2 promotions. After that, Barbarian units will provide no experience. = Niroohaa faghat taa 30 XP az Barbarhaa kasb mikonand, ya'ni taa 2 erteghaa. Pas az aan, niroohaaye Barbar hich tajrobe i nemidahand.

Combat = Nabard
Unit and cities are worn down by combat, which is affected by a number of different values.\nEach unit has a certain 'base' combat value, which can be improved by certain conditions, promotions and locations. = Niroo va shahrhaa dar jang farsoode mishavand va jang az meghdaarhaaye goonaagoon taasir migirad.\nHar niroo meghdaar e jangi ye «paaye» daarad ke baa sharaayet, erteghaa va makaanhaaye khaas behtar mishavad.
Units use the 'Strength' value as the base combat value when melee attacking and when defending.\nWhen using a ranged attack, they will the use the 'Ranged Strength' value instead. = Niroohaa dar hamle ye nazdik va hengaam e defaa' az «Ghodrat» be onvaan e meghdaar e jangi ye paaye estefaade mikonand.\nDar hamle ye doorbord be jaaye aan «Ghodrat e Doorbord» raa be kaar mibarand.
Ranged attacks can be done from a distance, dependent on the 'Range' value of the unit.\nWhile melee attacks allow the defender to damage the attacker in retaliation, ranged attacks do not. = Hamle ye doorbord az faasele momken ast va be meghdaar e «Bord» e niroo bastegi daarad.\nHamle ye nazdik be modaafe' ejaaze midahad dar paasokh be mohaajem aasib bezanad, amma hamle ye doorbord chenin nist.

Embassies = Sefaaratkhaanehaa
Establishing an embassy in other players' Capital city shows the location of their Capital, likewise other players who establish an embassy in your Capital can see location of your Capital. = Ta'sis e sefaarat dar Paaytakht e baazikon e digar, makaan e Paaytakht e oo raa neshaan midahad. Be hamin tartib, digaraan baa sefaarat dar Paaytakht e shomaa makaan e aan raa mibinand.
Embassies thus allow Spies to be placed in another players' Capital City if Espionage is enabled. = Pas agar Jaasoosi fa'aal baashad, sefaaratkhaanehaa gharaardaadan e Jaasoos dar Paaytakht e baazikon e digar raa momken mikonand.
Mutual embassies are required to allow trading open borders and to sign Research Agreement and Defensive Pact. = Baraaye mo'aamele ye marzhaaye baaz va emzaa ye Tavaafogh e Pazhoohesh va Peymaan e Defaa'i, sefaaratkhaanehaaye dogaane laazem ast.
Declaring war on another player or denouncing them will remove embassies from both players' Capitals. You will have to re-establish them to use their effect. = E'laam e jang yaa mahkoom kardan e baazikon e digar sefaaratkhaanehaaye har do Paaytakht raa hazf mikonad. Baraaye sood e aanhaa baayad dobaare ta'sis konid.
Re-establishing an embassy after denunciation from either side becomes available next turn, while re-establishing them when at war requires a peace treaty. = Pas az mahkoomiyat az har taraf, az nobat e ba'adi mitavaan sefaarat raa dobaare ta'sis kard; dar jang baraaye in kaar be peymaan e solh niyaaz ast.
Be cautious when accepting embassy from other players because they can spy on your capital, or worse may start planning to attack you. = Dar paziresh e sefaarat e digaraan ehtiyaat konid, chon mitavaanand az paaytakht jaasoosi konand yaa badtar, barnaame ye hamle berizand.
Note that before you can offer an embassy, you need the required Technology. = Be yaad daashte baashid pish az pishnahaad e sefaarat, Fannaavari ye laazem raa niyaaz daarid.
Embassies are available using the Gods and Kings ruleset. = Sefaaratkhaanehaa dar ghavaanin e Khodaayaan va Paadeshaahaan dar dastres hastand.
Defensive Pacts = Peymaanhaaye Defaa'i

Open Borders from other player and vice versa allow units to freely pass through their territory. = Marzhaaye Baaz e baazikon e digar va bar'aks, be niroohaa ejaaze midahand aazaadaane az khaak e ham bogzarand.
They also let Missionaries to enter other players' territory without suffering attrition. = Hamchenin Moballeghaan mitavaanand bedoon e farsaayesh vaared e khaak e digaraan shavand.
Open Borders expire depending on game speed and are canceled upon Declaration of War, the closure however takes effect only after war ends and need to be traded again. = Marzhaaye Baaz bar paaye ye sor'at e baazi monghazi mishavand va baa E'laam e Jang laghv mishavand; amma baste shodan faghat pas az paayaan e jang ejraa mishavad va baayad dobaare mo'aamele shavand.
You gain diplomatic boost with other AI player if you both have Open Borders to each other = Agar shomaa va yek baazikon e Hoosh e Masnoo'i marzhaaye baaz e dogaane daashte baashid, ravaabet e diplomatik behtar mishavad
Be cautious when giving Open Borders because other player may settle a City near your lands in an area you are planning to use, they may also use your territory to attack your friends or City State allies. = Dar daadan e Marzhaaye Baaz ehtiyaat konid, chon baazikon e digar shaayad dar nazdiki ye khaak e shomaa, dar jaayi ke niyaaz daarid, shahr besaazad yaa az khaak e shomaa baraaye hamle be doostaan yaa Shahr-dowlathaaye mottahed estefaade konad.
Note that before you can offer or accept open borders, both Nations need the required Technology. = Be yaad daashte baashid pish az pishnahaad yaa paziresh e marzhaaye baaz, har do keshvar Fannaavari ye laazem raa niyaaz daarand.
When playing with the Gods and Kings ruleset mutual embassies need to be established before Open Borders can be traded. = Dar ghavaanin e Khodaayaan va Paadeshaahaan, pish az mo'aamele ye Marzhaaye Baaz baayad sefaaratkhaanehaaye dogaane ta'sis shavand.

In Research Agreements, you and another civilization decide to jointly research technology.\nAt the end of the agreement, you will both receive a 'lump sum' of ⍾Science, which will go towards one of your unresearched technologies. = Dar Tavaafogh e Pazhoohesh, shomaa va tamaddon e digar tasmim migirid ke fannaavari raa moshtarak pazhoohesh konid.\nDar paayaan e tavaafogh, har do meghdaar e yekjaayi az ⍾Elm migirid ke sarf e yeki az fannaavarihaaye pazhooheshnashode mishavad.
The amount of ⍾Science you receive at the end is dependent on the ⍾Science generated by your cities and the other civilization's cities during the agreement - the more, the better! = Meghdaar e ⍾Elm e nahaayi be ⍾Elm e tolidshode dar shahrhaaye shomaa va tamaddon e digar dar tool e tavaafogh bastegi daarad; harche bishtar, behtar!
Note that before you can invest in a research agreement, you must have a Declaraction of Friendship, both Nations need the required Technology, and both Nations need enough Gold on hand for the agreement. = Pish az sarmayegozaari dar tavaafogh e pazhoohesh, baayad E'laamiye ye Doosti daashte baashid, har do keshvar Fannaavari ye laazem va Talaa ye kaafi baraaye tavaafogh daashte baashand.
When playing with the Gods and Kings ruleset mutual embassies need to be established before a Research Agreement can be signed. = Dar ghavaanin e Khodaayaan va Paadeshaahaan, pish az emzaa ye Tavaafogh e Pazhoohesh baayad sefaaratkhaanehaaye dogaane ta'sis shavand.

Defensive pacts allow you and another civ to protect one another from aggressors.\nOnce the defensive pact is signed, you will be drawn into their future defensive wars, just as they will be drawn into your future defensive wars. Declaring war on any Civ will remove all of your defensive pacts. You will have to re-sign them to use their effect. = Peymaanhaaye Defaa'i be shomaa va tamaddon e digar ejaaze midahand az ham dar baraabar e mohaajemaan defaa' konid.\nPas az emzaa, shomaa vaared e janghaaye defaa'i ye aayande ye aanhaa mishooyd va aanhaa niz vaared e janghaaye defaa'i ye shomaa mishavand. E'laam e jang be har tamaddon hame ye peymaanhaaye defaa'i raa hazf mikonad. Baraaye sood e aanhaa baayad dobaare emzaa shavand.
Be cautious when signing defensive pacts because they can bring you into wars that you might not want to be in. = Dar emzaa ye peymaan e defaa'i ehtiyaat konid, chon momken ast shomaa raa vaared e jang e naakhaaste konad.
The AI is very careful and will not accept defensive pacts with less than 80 influence. = Hoosh e Masnoo'i besyaar ehtiyaat mikonad va baa nofooz e kamtar az 80 peymaan e defaa'i nemipazirad.
Note that before you can sign a defensive pact, you must have a Declaraction of Friendship, and both Nations need the required Technology. = Pish az emzaa ye peymaan e defaa'i baayad E'laamiye ye Doosti daashte baashid va har do keshvar Fannaavari ye laazem raa daashte baashand.
When playing with the Gods and Kings ruleset mutual embassies need to be established before a Defensive Pact can be signed. = Dar ghavaanin e Khodaayaan va Paadeshaahaan, pish az emzaa ye Peymaan e Defaa'i baayad sefaaratkhaanehaaye dogaane ta'sis shavand.

Not all nations are contending with you for victory.\nCity-States are nations that can't win, can't be traded with, and instead confer certain bonuses to friendly civilizations. = Hame ye keshvarhaa baraaye piroozi baa shomaa reghaabat nemikonand.\nShahr-dowlathaa nemitavaanand barande shavand yaa tejaarat konand; be jaaye aan, be tamaddonhaaye doost emtiyaazhaayi midahand.
Instead, diplomatic relations with City-States are determined by Influence - a meter of 'how much the City-State likes you'.\nInfluence can be increased by attacking their enemies, liberating their city, and giving them sums of gold. = Ravaabet e diplomatik baa Shahr-dowlathaa az raah e Nofooz ta'yin mishavad; me'yaari az in ke «Shahr-dowlat cheghadr shomaa raa doost daarad».\nBaa hamle be doshmanaaneshaan, aazaadsaazi ye shahr va daadan e Talaa mitavaan Nofooz raa afzaayesh daad.
Certain bonuses are given when you are at above 30 influence.\nWhen you have above 60 Influence, and you have the highest influence with them of all civilizations, you are considered their 'Ally', and gain further bonuses and access to the Luxury and Strategic resources in their lands. = Baa nofooz e baalaa ye 30 emtiyaazhaaye khaasi migirid.\nAgar Nofooz baalaa ye 60 va az hame ye tamaddonhaa bishtar baashad, «Mottahed» e aanhaa hastid va emtiyaazhaaye bishtar va dastresi be manaabe e Tajammoli va Raahbordi ye khaakeshaan migirid.

While working the land is good, eventually your Citizens will want to Specialize. = Har chand kaar rooye zamin khoob ast, saranjaam Shahrvandaan mikhaahand Motekhasses shavand.
Certain Buildings will also provide Specialist Slots. These slots will show up in the Citizen Management within the City Screen under Specialists. Each slot can be filled with a Citizen which will then become a Specialist. = Barkhi Saakhtemaanhaa Jaaygaah e Motekhasses midahand. In jaaygaahhaa dar Modiriyat e Shahrvandaan dar safhe ye shahr, zir e Motekhassesaan, neshaan daade mishavand. Har jaaygaah raa mitavaan baa yek shahrvand por kard ke sepas Motekhasses mishavad.
Each Specialist will generate a certain amount of yield as indicated to the right of the available slots. = Har Motekhasses meghdaar e khaasi baazdehi tolid mikonad ke dar samt e raast e jaaygaahhaaye mojood neveshte ast.
While these are a great way to specialize the yield production of a City outside of the surrounding Tile Yields, Specialists have an additional value. Each one also generates Great Person Points each turn. With enough of them, a new Great Person will join your Nation. = In raah e khoobi baraaye takhassosi kardan e Tolid e shahr faraatar az baazdehi ye zaminhaaye atraaf ast, amma Motekhassesaan arzesh e digari ham daarand. Har yek har nobat Emtiyaaz e Fard e Bozorg ham midahad. Baa meghdaar e kaafi, yek Fard e Bozorg e taaze be keshvar mipeyvandad.
Great People = Ensaan haaye Bozorg

Certain buildings, and specialists in cities, generate Great Person points per turn.\nThere are several types of Great People, and their points accumulate separately.\nThe number of points per turn and accumulated points can be viewed in the Overview screen. = Barkhi saakhtemaanhaa va motekhassesaan e shahr har nobat emtiyaaz e Fard e Bozorg tolid mikonand.\nFardhaaye Bozorg anvaa' e mokhtalef daarand va emtiyaazhaayeshaan jodaagaane jam' mishavad.\nMeghdaar e har nobat va kol e jam'shode raa dar safhe ye Moroor mitavaan did.
Alternatively, the Great Person points breakdown per city can be viewed in each City Screen (see UI Tips article). = Yaa mitavaan joziyaat e emtiyaaz e Fard e Bozorg e har shahr raa dar safhe ye hamaan shahr did; maghaale ye Nekaate Vaaset raa bebinid.
Once enough points have been accumulated, a Great Person of that type will be created!\nEach Great Person can construct a certain Great Improvement which gives large yields over time, or immediately consumed to provide a certain bonus now. = Vaghti emtiyaaz e kaafi jam' shod, yek Fard e Bozorg az hamaan noe saakhte mishavad!\nHar Fard e Bozorg mitavaanad Behsaazi ye Bozorg e khaasi besaazad ke dar tool e zamaan baazdehi ye besyaar midahad, yaa fori masraf shavad taa hamin alaan emtiyaaz e khaasi bedahad.
Great Improvements also provide any strategic resources that are under them, so you don't need to worry if resources are revealed underneath your improvements! = Behsaazihaaye Bozorg har manba' e raahbordi ye zir e khod raa ham ta'min mikonand; pas agar manba'i zir e behsaazi aashkaar shod, negaraan nabaashid!

Removing Terrain Features = Hazf e Vizhegihaaye Zamin
Certain tiles have terrain features - like Flood plains or Forests -  on top of them. Some of these layers, like Jungle, Marsh and Forest, can be removed by workers.\nRemoving the terrain feature does not remove any resources in the tile, and is usually required in order to add improvements exploiting those resources. = Barkhi zaminhaa rooye khod vizhegihaayi maanand e Dasht e Selaabi yaa Jangal daarand. Kaaregarhaa mitavaanand barkhi laayehaa, maanand e Jangal e Haarre, Mordaab va Jangal, raa hazf konand.\nHazf e vizhegi ye zamin manaabe raa hazf nemikonad va mamoolan baraaye saakht e behsaazi ye estekhraaj e aan manaabe laazem ast.

Natural Wonders, such as the Mt. Fuji, the Rock of Gibraltar and the Great Barrier Reef, are unique, impassable terrain features, masterpieces of mother Nature, which possess exceptional qualities that make them very different from the average terrain.\nThey benefit by giving you large sums of Culture, ⍾Science, Gold or Production if worked by your Cities, which is why you might need to bring them under your empire as soon as possible. = Ojoobehaaye Tabi'i, maanand e Kooh e Fooji, Sakhre ye Jebroltaaregh va Aabsang e Bozorg, vizhegihaaye yegaane va gheyr e ghaabel e oboor va shaahkaarhaaye Tabiat hastand ke baa zamin e mamooli tafaavot e bozorgi daarand.\nAgar shahrhaa rooyeshaan kaar konand, Farhang, ⍾Elm, Talaa yaa Tolid e besyaari midahand; pas shaayad baayad harche zoodtar aanhaa raa be emperaatoori beyaafzaayid.

Keyboard = Kibord
If you have a keyboard, some shortcut keys become available. Unit command or improvement picker keys, for example, are shown directly in their corresponding buttons. = Agar safhekelid daarid, miyaanborhaayi dar dastres hastand. Masalan kelidhaaye dastoor e niroo yaa entekhaab e behsaazi rooye dokme ye marboot neshaan daade mishavand.
On the world screen the hotkeys are as follows: = Miyaanborhaaye safhe ye jahaan inhaa hastand:
Space or 'N' - Next unit or turn\n'E' - Empire overview (last viewed page)\n'+', '-' - Zoom in / out\nHome - center on capital or open its City Screen if already centered = Space yaa 'N' - Niroo yaa nobat e ba'adi\n'E' - Moroor e emperaatoori, aakharin safhe ye dide shode\n'+', '-' - Bozorgnamaayi / koochaknamaayi\nHome - Markaz bar paaytakht, yaa agar az ghabl markaz ast baaz kardan e safhe ye shahr
F1 - Open Civilopedia\nF2 - Empire overview Trades\nF3 - Empire overview Units\nF4 - Empire overview Diplomacy\nF5 - Social policies\nF6 - Technologies\nF7 - Empire overview Cities\nF8 - Victory Progress\nF9 - Empire overview Stats\nF10 - Empire overview Resources\nF11 - Quicksave\nF12 - Quickload = F1 - Baaz kardan e Tamaddon-naame\nF2 - Tejaarat e moroor e emperaatoori\nF3 - Niroohaaye moroor e emperaatoori\nF4 - Diplomaasi ye moroor e emperaatoori\nF5 - Siyaasathaaye ejtemaayi\nF6 - Fannaavarihaa\nF7 - Shahrhaaye moroor e emperaatoori\nF8 - Pishraft e piroozi\nF9 - Aamaar e moroor e emperaatoori\nF10 - Manaabe e moroor e emperaatoori\nF11 - Zakhire ye sari'\nF12 - Baargiri ye sari'
Ctrl-R - Toggle tile resource display\nCtrl-Y - Toggle tile yield display\nCtrl-O - Game options\nCtrl-S - Save game\nCtrl-L - Load game\nCtrl-U - Toggle UI (World Screen only) = Ctrl-R - Taghyir e namaayesh e manaabe e zamin\nCtrl-Y - Taghyir e namaayesh e baazdehi ye zamin\nCtrl-O - Tanzimaat e baazi\nCtrl-S - Zakhire ye baazi\nCtrl-L - Baargiri ye baazi\nCtrl-U - Taghyir e namaayesh e vaaset, faghat safhe ye jahaan
All of these can be reassigned. = Hame ye inhaa raa mitavaan dobaare takhsis daad.

This is where you spend most of your time playing Unciv. See the world, control your units, access other screens from here. = Bishtar e zamaane baazi ye Unciv raa injaa migzaraanid. Jahaan raa bebinid, niroohaa raa kontrol konid va az injaa be safhehaaye digar beravid.
①: The menu button - civilopedia, save, load, options... = ①: Dokme ye fehrest — Tamaddon-naame, zakhire, baargiri, tanzimaat...
②: The player/nation whose turn it is - click for diplomacy overview. = ②: Baazikon/keshvari ke nobat e oost — baraaye moroor e diplomaasi bezanid.
③: The Technology Button - shows the tech tree which allows viewing or researching technologies. = ③: Dokme ye Fannaavari — derakht e fannaavari raa baraaye didan yaa pazhoohesh neshaan midahad.
④: The Social Policies Button - shows enacted and selectable policies, and with enough culture points you can enact new ones. = ④: Dokme ye Siyaasathaaye Ejtemaayi — siyaasathaaye pazirofte va ghaabel e entekhaab raa neshaan midahad; baa Farhang e kaafi mitavaan siyaasat e taaze paziroft.
⑤: The Diplomacy Button - shows the diplomacy manager where you can talk to other civilizations. = ⑤: Dokme ye Diplomaasi — modiriyat e diplomaasi raa neshaan midahad taa baa tamaddonhaaye digar sohbat konid.
⑥: Unit Action Buttons - while a unit is selected its possible actions appear here. = ⑥: Dokmehaaye Amaliyyat e Niroo — hengaam e entekhaab e niroo, kaarhaaye momken injaa miyaayand.
⑦: The unit/city info pane - shows information about a selected unit or city. = ⑦: Panjare ye ettelaa'aat e niroo/shahr — joziyaat e niroo yaa shahr e entekhaabi raa neshaan midahad.
⑧: The name (and unit icon) of the selected unit or city, with current health if wounded. Clicking a unit name or icon will open its civilopedia entry. = ⑧: Naam va nemaad e niroo yaa shahr e entekhaabi, baa salaamati ye fe'li agar zakhmi ast. Zadan e naam yaa nemaad e niroo, madkhal e Tamaddon-naame ye aan raa baaz mikonad.
⑨: The arrow buttons allow jumping to the next/previous idle unit. = ⑨: Dokmehaaye peykaan be niroo ye bikaar e ba'adi/ghabli miravand.
⑩: For a selected unit, its promotions appear here, and clicking leads to the promotions screen for that unit. = ⑩: Erteghaahaaye niroo ye entekhaabi injaa hastand; baa zadan, safhe ye erteghaa ye aan niroo baaz mishavad.
⑪: Remaining/per turn movement points, strength and experience / XP needed for promotion. For cities, you get its combat strength. = ⑪: Emtiyaazhaaye harekat e baghimaande/har nobat, ghodrat va tajrobe / XP e laazem baraaye erteghaa. Baraaye shahr, ghodrat e jangi neshaan daade mishavad.
⑫: This button closes the selected unit/city info pane. = ⑫: In dokme panjare ye ettelaa'aat e niroo/shahr e entekhaabi raa mibandad.
⑬: This pane appears when you order a unit to attack an enemy. On top are attacker and defender with their respective base strengths. = ⑬: In panjare hengaam e dastoor e hamle ye yek niroo be doshman miyaayad. Dar baalaa mohaajem va modaafe' baa ghodrat e paaye ye har kodaam hastand.
⑭: Below that are strength bonuses or penalties and health bars projecting before / after the attack. = ⑭: Dar zir, emtiyaazhaa yaa jarimehaaye ghodrat va navaarhaaye salaamati ye pishbini shode ye ghabl/ba'd az hamle hastand.
⑮: The Attack Button - let blood flow! = ⑮: Dokme ye Hamle — khoon raa ravaan konid!
⑯: The minimap shows an overview over the world, with known cities, terrain and fog of war. Clicking will position the main map. = ⑯: Naghshe ye koochak, did e koli az jahaan baa shahrhaaye shenaakhte, zamin va meh e jang neshaan midahad. Baa zadan, jaaye naghshe ye asli taghyir mikonad.
⑰: To the side of the minimap are display feature toggling buttons - tile yield, worked indicator, show/hide resources. These mirror setting on the options screen and are hidden if you deactivate the minimap. = ⑰: Kenaar e naghshe ye koochak dokmehaaye taghyir e namaayesh hastand: baazdehi ye zamin, neshaangar e kaarshode va namaayesh/penhaan e manaabe. Inhaa baa tanzimaat e safhe ye Tanzimaat yeki hastand va baa khaamoosh kardan e naghshe ye koochak penhaan mishavand.
⑱: Tile information for the selected hex - current or potential yield, terrain, effects, present units, city located there and such. Where appropriate, clicking a line opens the corresponding civilopedia entry. = ⑱: Ettelaa'aat e zamin e sheshgoosh e entekhaabi: baazdehi ye fe'li yaa momken, zamin, aathaar, niroohaaye haazer, shahr e mojood va maanand e aan. Dar mavaared e monaaseb, zadan e yek satr madkhal e marboot e Tamaddon-naame raa baaz mikonad.
⑲: Notifications - what happened during the last 'next turn' phase. Some are clickable to show a relevant place on the map, some even show several when you click repeatedly. = ⑲: E'laanhaa — ettefaaghaat e marhale ye aakhar e «Nobat e ba'adi». Barkhi baa zadan jaaye marboot raa dar naghshe neshaan midahand va barkhi baa zadan e tekraari chand jaa raa neshaan midahand.
⑳: The Next Turn Button - unless there are things to do, in which case the label changes to 'next unit', 'pick policy' and so on. = ⑳: Dokme ye Nobat e Ba'adi — magar kaari maande baashad ke dar aan soorat barchasb be «Niroo ye ba'adi», «Entekhaab e siyaasat» va gheyre taghyir mikonad.
㉑: The Multiplayer Button - Here you can easily check your active multiplayer games. = ㉑: Dokme ye Chandnafare — injaa mitavaanid baazihaaye chandnafare ye fa'aal raa be aasaani barrasi konid.
ⓐ: The overview button leads to the empire overview screen with various tabs (the last one viewed is remembered) holding vital information about the state of your civilization in the world. = ⓐ: Dokme ye moroor be safhe ye moroor e emperaatoori baa zabaanehaaye goonaagoon miravad; aakharin zabaane be yaad mimaanad. Ettelaa'aat e hayaati e vaz'iyat e tamaddon dar jahaan injaast.
ⓑ: The ♪Culture icon shows accumulated ♪Culture and ♪Culture needed for the next policy - in this case, the exclamation mark tells us a next policy can be enacted. Clicking is another way to the policies manager. = ⓑ: Nemaad e ♪Farhang, ♪Farhang e jam'shode va ♪Farhang e laazem baraaye siyaasat e ba'adi raa neshaan midahad; dar in mesaal alaamat e ta'ajjob ya'ni mitavaan siyaasat e taaze paziroft. Zadan e aan raah e digari be modiriyat e siyaasathaa ast.
ⓒ: Your known strategic resources are displayed here with the available (usage already deducted) number - click to go to the resources overview screen. = ⓒ: Manaabe e raahbordi ye shenaakhte baa tedaad e dar dastres, pas az kasr e masraf, injaa hastand; baraaye moroor e manaabe bezanid.
ⓓ: Happiness/unhappiness balance and either golden age with turns left or accumulated happiness with amount needed for a golden age is shown next to the smiley. Clicking also leads to the resources overview screen as luxury resources are a way to improve happiness. = ⓓ: Tavaazon e Rezaayat/Naaraaziyati va Asr e Talaai baa nobathaaye baghimaande yaa Rezaayat e jam'shode va niyaaz e Asr e Talaai kenaar e labkhand neshaan daade mishavad. Zadan e aan be moroor e manaabe miravad, chon manaabe e tajammoli raahi baraaye afzaayesh e Rezaayat hastand.
ⓔ: The ⍾Science icon shows the number of ⍾Science points produced per turn. Clicking leads to the technology tree. = ⓔ: Nemaad e ⍾Elm emtiyaaz e ⍾Elm e tolidshode dar har nobat raa neshaan midahad. Baa zadan be derakht e fannaavari miravid.
ⓕ: Number of turns played with translation into calendar years. Click to see the victory overview. = ⓕ: Tedaad e nobathaaye baazishode baa tabdil be saal e taghvimi. Baraaye moroor e piroozi bezanid.
ⓖ: The number of gold coins in your treasury and income. Clicks lead to the Stats overview screen. = ⓖ: Tedaad e sekkehaaye Talaa dar khazaane va daraamad. Zadan e aan moroor e Aamaar raa baaz mikonad.
ⓗ: The quantity of ☮Faith your citizens have generated, or 'off' if religion is disabled. Clicking it makes you go to the religion overview screen. = ⓗ: Meghdaar e ☮Imaan ke shahrvandaan tolid karde and, yaa «Khaamoosh» agar din gheyrefa'aal ast. Baa zadan e aan be moroor e din miravid.
ⓧ: In the center of all this - the world map! Here, the "X" marks a spot outside the map. Yes, unless the wrap option was used, Unciv worlds are flat. Don't worry, your ships won't fall off the edge. = ⓧ: Dar markaz e hame ye inhaa — naghshe ye jahaan! Injaa «X» jaayi biroon az naghshe raa neshaan midahad. Bale, magar gozine ye gardesh estefaade shode baashad, jahaan e Unciv takht ast. Negaraan nabaashid, keshtihaa az labe nemioftand.
ⓨ: By the way, here's how an empire border looks like - it's in the national colours of the nation owning the territory. = ⓨ: Raasti, marz e emperaatoori in shekli ast — be ranghaaye melli ye keshvar e maalik e sarzamin ast.
ⓩ: And this is the red targeting circle that led to the attack pane back under ⑬. = ⓩ: Va in daayere ye sorkh e hadafgiri ast ke panjare ye hamle raa dar ⑬ baaz kard.
What you don't see: The phone/tablet's back button will pop the question whether you wish to leave Unciv and go back to Real Life. On desktop versions, you can use the ESC key. = Chizi ke nemibinid: dokme ye bargasht e gooshi/tablet miporsad aayaa mikhaahid Unciv raa tark konid va be Zendegi ye Vaaghe'i bargardid. Dar noskhe ye roomeezi, kelid e ESC niz kaar mikonad.

When at later stages of the game, you might have a lot of units but only a little to do. To help you we have implemented an AutoPlay feature that lets you use the AI to play part or all of your turn. = Dar marhalehaaye ba'di, shaayad niroohaaye besyaar amma kaar e kami daashte baashid. Baraaye komak, Baazi ye Khodkaar raa saakhte im taa baa Hoosh e Masnoo'i bakhshi yaa hame ye nobat raa baazi konid.
To enable AutoPlay, go to options and open the AutoPlay tab and press "Show AutoPlay button". = Baraaye fa'aal kardan e Baazi ye Khodkaar, dar tanzimaat zabaane ye aan raa baaz va «Namaayesh e dokme ye Baazi ye Khodkaar» raa bezanid.
Clicking on the AutoPlay button opens a popup menue for choosing to AutoPlay parts or all of your turn. = Zadan e dokme ye Baazi ye Khodkaar fehreste bozorgshavande i baraaye entekhaab e bakhshhaa yaa hame ye nobat baaz mikonad.
Clicking Start AutoPlay in the pop-up menue or long pressing the AutoPlay button begins the multi-turn AutoPlay. This will play your next turns as if you were an AI. = Zadan e Aaghaaz e Baazi ye Khodkaar dar fehrest yaa negah daashtan e dokme ye aan, Baazi ye Khodkaar e chandnobati raa aaghaaz mikonad. Nobathaaye ba'adi maanand e yek Hoosh e Masnoo'i baazi mishavand.
To cancel multi-turn AutoPlay you can press the AutoPlay button, next turn button or open the options menue. = Baraaye laghv e Baazi ye Khodkaar e chandnobati mitavaanid dokme ye aan, Nobat e ba'adi yaa fehrest e tanzimaat raa bezanid.
Multi-turn AutoPlay is not advised on harder difficulty levels as your AI will not play better against an AI with modifiers. = Baazi ye Khodkaar e chandnobati dar darajehaaye sakhttar tosiye nemishavad, chon Hoosh e Masnoo'i ye shomaa dar baraabar e Hoosh e Masnoo'i ye daaraaye modifikator behtar baazi nemikonad.
Multi-turn AutoPlay for multiplayer is not yet supported. = Baazi ye Khodkaar e chandnobati baraaye chandnafare hanooz poshtibaani nemishavad.

After building a shrine, your civilization will start generating ☮Faith. = Pas az saakht e Neyaayeshgaah, tamaddon e shomaa shoroo be tolid e ☮Imaan mikonad.
When enough ☮Faith has been generated, you will be able to found a pantheon. = Baa tolid e ☮Imaan e kaafi mitavaanid yek panteon bonyangozari konid.
A pantheon will provide a small bonus for your civilization that will apply to all cities that have it as a majority religion. = Panteon emtiyaaz e koochaki be tamaddon midahad ke dar hame ye shahrhaaye daaraaye aan be onvaan e din e aksariyat ejraa mishavad.
Each civilization can only choose a single pantheon belief, and each pantheon can only be chosen once. = Har tamaddon faghat yek baavar e panteon entekhaab mikonad va har panteon faghat yek baar entekhaab mishavad.
Generating more ☮Faith will allow you to found a religion. = Tolid e bishtar e ☮Imaan bonyangozari ye din raa momken mikonad.

Keep generating ☮Faith, and eventually a great prophet will be born in one of your cities. = Be tolid e ☮Imaan edaame dahid taa saranjaam Payaambar e Bozorgi dar yeki az shahrhaa motavalled shavad.
This great prophet can be used for multiple things: Constructing a holy site, founding a religion and spreading your religion. = In Payaambar e Bozorg chand kaarbord daarad: saakht e makaan e moghaddas, bonyangozari ye din va gostaresh e din.
When founding your religion, you may choose another two beliefs. The founder belief will only apply to you, while the follower belief will apply to all cities following your religion. = Hengaam e bonyangozari ye din do baavar e digar entekhaab mikonid. Baavar e bonyangozaar faghat baraaye shomaast va baavar e peyro dar hame ye shahrhaaye peyro ye din ejraa mishavad.
Additionally, the city where you used your great prophet will become the holy city of that religion. = Hamchenin shahri ke Payaambar e Bozorg raa dar aan be kaar bordid, Shahr e Moghaddas e aan din mishavad.
Once you have founded a religion, great prophets will keep being born every so often, though the amount of Faith☮ you have to save up will be higher. = Pas az bonyangozari ye din, Payaambaraan e Bozorg har az gaahi motavalled mishavand, amma meghdaar e Imaan☮ ke baayad zakhire konid bishtar mishavad.
One of these great prophets can then be used to enhance your religion. = Mitavaan yeki az in Payaambaraan e Bozorg raa baraaye Taghviyat e din be kaar bord.
This will allow you to choose another follower belief, as well as an enhancer belief, that only applies to you. = In kaar ejaaze midahad yek baavar e peyro ye digar va yek baavar e taghviyatkonande ke faghat baraaye shomaast entekhaab konid.
Do take care founding a religion soon, only about half the players in the game are able to found a religion! = Din raa zood bonyangozari konid; faghat hodood e nimi az baazikonaan mitavaanand din bonyangozari konand!

Religion inside cities = Din daroon e shahr haa
When founding a city, it won't follow a religion immediately. = Shahr e taaze ba'd az bonyangozari fori peyro ye din nist.
The religion a city follows depends on the total pressure each religion has within the city. = Din e shahr be kol e feshaar e har din dar aan shahr bastegi daarad.
Followers are allocated in the same proportions as these pressures, and these followers can be viewed in the City Screen. = Peyroaan be nesbat e in feshaarhaa taghsim mishavand va mitavaan aanhaa raa dar safhe ye Shahr did.
You are allowed to check religious followers and pressures in cities you do not own by selecting them. = Baa entekhaab e shahrhaaye digaraan niz mitavaanid peyroaan va feshaarhaaye dini raa barrasi konid.
In both places, a tap/click on the icon of a religion will show detailed information with its effects. = Dar har do jaa, zadan e nemaad e din ettelaa'aat e kaamel va aathaar e aan raa neshaan midahad.
Based on this, you can get a feel for which religions have a lot of pressure built up in the city, and which have almost none. = Az in raah mifahmid kodaam din dar shahr feshaar e ziyaadi daarad va kodaam taghriban hich feshaari nadaarad.
The city follows a religion if a majority of its population follows that religion, and will only then receive the effects of Follower and Pantheon beliefs of that religion. = Agar aksariyat e jam'iyat peyro ye yek din baashad, shahr peyro ye aan ast va faghat dar aan soorat aathaar e baavarhaaye Peyro va Panteon e aan din raa migirad.

Spreading Religion = Gostaresh e Din
Spreading religion happens naturally, but can be sped up using missionaries or great prophets. = Din be toor e tabi'i gostaresh miyaabad, amma Moballeghaan yaa Payaambaraan e Bozorg aan raa tondtar mikonand.
Missionaries can be bought in cities following a major religion, and will take the religion of that city. = Moballeghaan raa mitavaan dar shahrhaaye peyro ye yek din e asli kharid va aanhaa din e hamaan shahr raa migirand.
So do take care where you are buying them! If another civilization has converted one of your cities to their religion, missionaries bought there will follow their religion. = Pas moraagheb e jaaye kharid baashid! Agar tamaddon e digar yeki az shahrhaa raa be din e khod gardaande baashad, moballegh e kharidshode aanjaa peyro ye din e aanhaa khaahad bood.
Great prophets always have your religion when they appear, even if they are bought in cities following other religions, but captured great prophets do retain their original religion. = Payaambaraan e Bozorg hengaam e peydaayesh hamishe din e shomaa raa daarand, hatta agar dar shahri peyro ye din e digar kharide shavand; amma Payaambaraan e Bozorg e asirshode din e asli ye khod raa negah midaarand.
Both great prophets and missionaries are able to spread religion to cities when they are inside its borders, even cities of other civilizations. = Har do, Payaambar e Bozorg va Moballegh, daroon e marz e shahr mitavaanand din raa gostaresh dahand, hatta dar shahr e tamaddon e digar.
These two units can even enter tiles of civilizations with whom you don't have an open borders agreement! = In do niroo hatta bedoon e tavaafogh e marzhaaye baaz mitavaanand vaared e zamin e tamaddonhaaye digar shavand!
But do take care, missionaries will lose 250 religious strength each turn they end while in foreign lands. = Amma moraagheb baashid: moballeghaan dar har nobat ke dar khaak e bigaane paayaan dahand, 250 ghodrat e dini az dast midahand.
This diminishes their effectiveness when spreading religion, and if their religious strength ever reaches 0, they have lost their faith and disappear. = In kaaraayi ye gostaresh e din raa kam mikonad va agar ghodrat e dini be 0 beresad, Imaan raa az dast daade va naapadid mishavand.
When you do spread your religion, the religious strength of the unit is added as pressure for that religion. = Hengaam e gostaresh e din, ghodrat e dini ye niroo be onvaan e feshaar e aan din ezaafe mishavad.
Cities also passively add pressure of their majority religion to nearby cities. = Shahrhaa niz khod be khod feshaar e din e aksariyat e khod raa be shahrhaaye nazdik ezaafe mikonand.
Each city provides +6 pressure per turn to all cities within 10 tiles, though the exact amount of pressure depends on the game speed. = Har shahr har nobat +6 feshaar be hame ye shahrhaaye dar bord e 10 khaane midahad, amma meghdaar e daghigh be sor'at e baazi bastegi daarad.
This pressure can also be seen in the City Screen, and gives you an idea of how religions in your cities will evolve if you don't do anything. = In feshaar dar safhe ye Shahr ham didani ast va neshaan midahad agar kaari nakonid din e shahrhaa chegoone taghyir mikonad.
Holy cities also provide +30 pressure of the religion founded there to themselves, making it very difficult to effectively convert a holy city. = Shahrhaaye Moghaddas be khod +30 feshaar az din e bonyangozaarishode dar aanjaa midahand; pas taghyir e mo'asser e din e shahr e moghaddas besyaar sakht ast.
Lastly, before founding a religion, new cities you settle will start with 200 pressure for your pantheon. = Dar paayaan, pish az bonyangozari ye din, shahrhaaye taaze baa 200 feshaar baraaye panteon e shomaa aaghaaz mishavand.
This way, all your cities will starting following your pantheon as long as you haven't founded a religion yet. = Be in tartib taa pish az bonyangozari ye din, hame ye shahrhaa peyro ye panteon khaahand shod.

Inquisitors = Baazporsaan e Aghidati
Inquisitors are the last religious unit, and their strength is removing other religions. = Baazporsaan e Aghidati aakharin niroo ye dini hastand va tavaanaayi ye aanhaa hazf e adyaan e digar ast.
They can remove all other religions from one of your own cities, removing any pressures built up. = Mitavaanand hame ye adyaan e digar va feshaar e jam'shode ye aanhaa raa az yeki az shahrhaaye shomaa hazf konand.
Great prophets also have this ability, and remove all other religions in the city when spreading their religion. = Payaambaraan e Bozorg hamin tavaanaayi raa daarand va hengaam e gostaresh e din, hame ye adyaan e digar e shahr raa hazf mikonand.
Often this results in the city immediately converting to their religion = In aghlab baa'es mishavad din e shahr fori be din e aanhaa taghyir konad
Additionally, when an inquisitor is stationed in or directly next to a city center, units of other religions cannot spread their faith there, though natural spread is unaffected. = Hamchenin agar Baazpors e Aghidati dar markaz e shahr yaa dorost kenaar e aan baashad, niroohaaye adyaan e digar nemitavaanand din raa aanjaa gostaresh dahand; amma gostaresh e tabi'i taasir nemigirad.

The Mayan unique ability, 'The Long Count', comes with a side effect: = Tavaanaayi ye vizhe ye Maayaa, «Shomaaresh e Boland», yek aasar e jaanebi daarad:
Once active, the game's year display will use mayan notation. = Pas az fa'aal shodan, namaayesh e saal az ravesh e Maayaa estefaade mikonad.
The Maya measured time in days from what we would call 11th of August, 3114 BCE. A day is called K'in, 20 days are a Winal, 18 Winals are a Tun, 20 Tuns are a K'atun, 20 K'atuns are a B'ak'tun, 20 B'ak'tuns a Piktun, and so on. = Maayaa zamaan raa az roozi ke maa 11 e Oot e 3114 pish az milaad minaamim be rooz mishomaard. Har rooz K'in ast; 20 rooz yek Winal, 18 Winal yek Tun, 20 Tun yek K'atun, 20 K'atun yek B'ak'tun, 20 B'ak'tun yek Piktun va be hamin tartib.
Unciv only displays ය B'ak'tuns, ඹ K'atuns and ම Tuns (from left to right) since that is enough to approximate gregorian calendar years. The Maya numerals are pretty obvious to understand. Have fun deciphering them! = Unciv faghat ය B'ak'tun, ඹ K'atun va ම Tun raa az chap be raast neshaan midahad, chon baraaye takhmin e saalhaaye taghvim e milaadi kaafi ast. Adadhaa ye Maayaa nesbatan roshan hastand. Az ramzgoshaayi lezzat bebarid!

Your cities will periodically demand different luxury goods to satisfy their desire for new things in life. = Shahrhaa har az gaahi kaalaa haaye tajammoli ye mokhtalef darkhaast mikonand taa niyaaz be chizhaaye taaze dar zendegi raa bar aavarde konand.
If you manage to acquire the demanded luxury by trade, expansion, or conquest, the city will celebrate We Love The King Day for 20 turns. = Agar tajammoli ye darkhaastshode raa baa tejaarat, gostaresh yaa fath peydaa konid, shahr 20 nobat Rooz e Doosti ye Paadeshaah raa jashn migirad.
During the We Love The King Day, the city will grow 25% faster. = Dar Rooz e Doosti ye Paadeshaah, shahr 25% sari'tar roshd mikonad.
This means exploration and trade is important to grow your cities! = Pas kaavosh va tejaarat baraaye roshd e shahrhaa mohem ast!

Air Combat and Interception = Nabard e Havaayi va Rahgiri
Air Combat is very similar to normal Combat, with a few wrinkles. Damage is still dealt using the same equations based on the relative Strength of the Attacking and Defending Unit. = Nabard e Havaayi besyaar shabih e Nabard e mamooli ast, baa chand tafaavot. Aasib hamaana baa hamaan mo'aadelehaa bar paaye ye Ghodrat e nesbi ye Niroo ye Mohaajem va Modaafe' hesaab mishavad.
However, before the Attacker and Defender fight, there is an added combat phase called Interception. If there is any unit with Interception Range that covers the target attacked tile, then it will attempt to Intercept the Attacking Air Unit. If multiple units can Intercept, the one with higher Intercept chance does it. = Amma pish az jang e Mohaajem va Modaafe', marhale ye ezaafi ye Rahgiri vojood daarad. Agar nirooyi bord e rahgiri ye pooshaanande ye zamin e hadaf daashte baashad, talaash mikonad Niroo ye Havaayi ye Mohaajem raa Rahgiri konad. Agar chand niroo betavaanand rahgiri konand, niroo ye baa shaans e bishtar in kaar raa mikonad.
Generally Land/Naval Units have an Intercept Range of 2 Tiles, and Air Units have an Intercept Range of their Attack Range. = Mamoolan Niroohaaye Zamini/Daryaayi bord e rahgiri ye 2 khaane daarand va bord e rahgiri ye Niroo ye Havaayi baraabar baa bord e Hamle ye aan ast.
Ground and Naval Units don't require movement points to Intercept, just Attacks. Air Units cannot have moved nor attacked in the preceding turn. = Niroohaaye Zamini va Daryaayi baraaye Rahgiri be emtiyaaz e harekat niyaaz nadaarand, faghat be Hamle. Niroohaaye Havaayi nabaayad dar nobat e ghabl harekat yaa hamle karde baashand.
The Intercepting Unit rolls to see if it hits. Whether it hits or not costs an Attack, and most units (without Promotions) can only Attack Once per Nation's Turn. It does NOT cost Movement Points, but Air Units that have used their Movement cannot Intercept between turns. = Niroo ye Rahgir shaans e barkhord raa miaazmaayad. Che bezanad che na, yek Hamle masraf mishavad va bishtar e niroohaa bedoon e Erteghaa dar har Nobat e Keshvar faghat yek baar Hamle mikonand. Emtiyaaz e Harekat masraf NEMISHAVAD, amma Niroo ye Havaayi ke harekat karde nemitavaanad beyne nobathaa Rahgiri konad.
If the Intercepting Unit Hits, it deals damage according to the Combat Strength calculation to the Attacking Air Unit, potentially with any Strength Bonuses that apply to Interception. It does not receive damage from the Attacking Air Unit. = Agar Rahgir bezanad, bar paaye ye hesaab e Ghodrat e Nabard va emtiyaazhaaye marboot be Rahgiri, be Niroo ye Havaayi ye Mohaajem aasib mizanad. Az Niroo ye Havaayi ye Mohaajem aasib nemigirad.
After Interception resolves, the Attacking Air Unit and the Defending Unit in the targeted tile do Combat as normal, with damage dealt to both sides. = Pas az Rahgiri, Niroo ye Havaayi ye Mohaajem va Niroo ye Modaafe' dar zamin e hadaf mamooli mijangand va har do aasib mibinand.
To help deal with Interceptions, see Air Sweeps. = Baraaye moghaabele baa Rahgiri, Paaksaazi ye Havaayi raa bebinid.

Air Sweeps = Paaksaazi ye Havaayi
Fighter units are able to perform Air Sweeps over a tile helping clear out potential enemy Air, Sea, or Land Interceptions that can reach that tile. = Niroohaaye Jangande mitavaanand rooye yek zamin Paaksaazi ye Havaayi konand taa Rahgiri ye havaayi, daryaayi yaa zamini ye ehtemaali ye doshman ke be aan zamin miresad masraf shavad.
While this Action will take an Attack, the benefit is drawing out Interceptions to help protect your other Air Units. Especially your Bombers. = In kaar yek Hamle masraf mikonad, amma Rahgirihaa raa biroon mikeshad taa az Niroohaaye Havaayi ye digar, be vizhe Bombafkanhaa, hefaazat konad.
Your unit will always draw an Interception, if one can reach the target tile, even if the Intercepting unit has a chance to miss. = Agar Rahgiri be zamin e hadaf beresad, niroo ye shomaa hamishe aan raa fa'aal mikonad, hatta agar Rahgir shaans e khataa daashte baashad.
If the Interceptor is not an Air Unit (eg Land or Sea), the Air Sweeping unit and Interceptor take no damage! = Agar Rahgir Niroo ye Havaayi nabaashad, masalan Zamini yaa Daryaayi, hich yek az Rahgir va niroo ye Paaksaazi aasib nemibinand!
If the Interceptor is an Air Unit, the two units will damage each other in a straight fight with no Interception bonuses. And only the Attacking Air Sweep Unit gets any Air Sweep strength bonuses. = Agar Rahgir Niroo ye Havaayi baashad, har do dar nabard e mostaghim bedoon e emtiyaazhaaye Rahgiri be ham aasib mizanand. Faghat niroo ye Mohaajem e Paaksaazi emtiyaazhaaye ghodrat e Paaksaazi raa migirad.

Fortify, Guard, Withdraw = Sangargiri, Negahbaani, Aghabneshini
Most Land units have the ability to Fortify. As they spend time without moving, they will slowly gain a Fortification Bonus to their Combat Strength representing digging in and preparing in case of an attack. = Bishtar e niroohaaye Zamini mitavaanand Sangar begirand. Baa gozaraandan e zamaan bedoon e harekat, aaheste Emtiyaaz e Sangar be Ghodrat e Nabard migirand; ya'ni kandan e sangar va aamaade shodan baraaye hamle.
Some units have the ability to Withdraw before a melee attack is struck. However, perhaps you wish for them to stand their ground to protect a particular tile. If you do, then give them the Guard command and they will stay fixed until they die or you give them fresh orders. = Barkhi niroohaa pish az hamle ye nazdik mitavaanand Aghabneshini konand. Amma shaayad mikhaahid baraaye hefaazat az zamin istaadegi konand. Pas dastoor e Negahbaani bedahid taa taa marg yaa dastoor e taaze dar jaa bemaanand.
This is NOT the same as Fortify but they will still gain the Fortification Bonus. They will simply not utilize their Withdraw ability. Fortified units with the Withdraw ability will try to flee when attacked. = In baa Sangargiri yeki NIST, amma hanooz Emtiyaaz e Sangar migirand. Faghat tavaanaayi ye Aghabneshini raa be kaar nemibarand. Niroo ye sangargerefte ye daaraaye Aghabneshini hengaam e hamle talaash e faraar mikonad.

City Tile Blockade = Mohaasere ye Zamin e Shahr
One of your tiles is blocked by an enemy: when an enemy unit stands on a tile you own, the tile will not produce yields and cannot be worked by a city this turn. City will reallocate population from a blocked tile automatically. = Yeki az zaminhaa baa doshman masdood ast: vaghti niroo ye doshman rooye zamin e shomaa biistad, aan zamin in nobat baazdehi nadaarad va shahr nemitavaanad rooyash kaar konad. Shahr jam'iyat raa az zamin e baste khodkaar dobaare takhsis midahad.
Enemy military land units block tiles they are standing on. Enemy military naval units additionally block adjacent water tiles. To protect your tiles from blockade, place a friendly military unit on it or fight off invaders. = Niroo ye nezaami ye zamini ye doshman zamin e zir e paa raa masdood mikonad. Niroo ye nezaami ye daryaayi hamchenin zaminhaaye aabi ye hamsaaye raa mibandad. Baraaye jologiri az mohaasere, niroo ye nezaami ye doost rooye zamin begozaarid yaa mohaajemaan raa beraanid.

One of your cities is under a naval blockade! When all adjacent water tiles of a coastal city are blocked - city loses harbor connection to all other cities, including capital. Make sure to de-blockade cities by deploying friendly military naval units to fight off invaders. = Yeki az shahrhaaye shomaa dar Mohaasere ye Daryaayi ast! Agar hame ye zaminhaaye aabi ye hamsaaye ye shahr e saaheli masdood baashand, shahr ertebaat e Bandari baa hame ye shahrhaa, hatta paaytakht, raa az dast midahad. Baa niroohaaye nezaami ye daryaayi ye doost, mohaajemaan raa beraanid va mohaasere raa beshkanid.

Spies! = Jaasoos haa!
The first time a civ reaches the Renaissance era each nation gets one spy. Every time a civ reaches an era afterwards they get one more spy. = Har tamaddoni ke baraaye avvalin baar be asre ronesaans beresad yek jaasoos be har mellat ezaafe mishavad. Har baar tamaddoni be asre ba’di beresad aanhaa yek jaasoose digar migirand.
Spies can be sent out to foreign cities to steal technology, rigging elections or stage coups. Place them in your own cities to do counter-intelligence work. = Jaasooshaa raa mitavaan baraaye dozdidan e fannaavari, taghallob e entekhaabaat yaa koodetaa be shahrhaaye bigaane ferestaad. Dar shahrhaaye khod baraaye zedd e jaasoosi be kaar bebarid.
Only one spy per civ is allowed in each city. Spies that are not in any city are on vacation in your spy hideout. = Az har tamaddon dar har shahr faghat yek jaasoos mojaaz ast. Jaasoos e bi-shahr dar panaahgaah e jaasoosi be morakhkhasi miravad.
Spies set up in cities of major civilizations will try to steal technology at a rate which is based off of the science production in the city. Succeeding to steal technology will level up your spy. Failing to succeed will level up the defending spy if it is present. = Jaasoos e mostaghar dar shahr e tamaddon e bozorg baa sor'ati bar paaye ye Tolid e Elm e shahr, fannaavari midozdad. Movaffaghiyat dar dozdidan, sat'h e jaasoos raa baalaa mibarad. Shekast, sat'h e jaasoos e modaafe' raa agar baashad baalaa mibarad.
Spies set in city-states will try to rig the elections in order to gain influence and reduce the influence of other civilizations. Only one spy partaking in rigging the election can win. = Jaasoos e dar Shahr-dowlat baraaye kasb e nofooz va kaahesh e nofooz e tamaddonhaaye digar, entekhaabaat raa dastkaari mikonad. Faghat yek jaasoos e sherkatkonande mitavaanad barande shavad.
A spy that is rigging an election in a city-state may also stage a coup. The likelihood of success for the coup depends on your relative influence to the current ally of the city-state, your spy level, and the level of the spy that the current ally has in the city-state if present. Succeeding a coup will make you their new ally and reduce the influence of all other civs. Failing a coup will kill your spy and level up the defending spy if present. = Jaasoos e dastkaar e entekhaabaat dar Shahr-dowlat mitavaanad koodetaa ham konad. Shaans e movaffaghiyat be nofooz e shomaa nesbat be mottahed e fe'li, sat'h e jaasoos e shomaa va sat'h e jaasoos e mottahed e fe'li dar aan shahr agar vojood daashte baashad bastegi daarad. Koodetaa ye movaffagh shomaa raa mottahed e jadid mikonad va nofooz e hame ye digaraan raa kam mikonad. Shekast, jaasoos e shomaa raa mikoshad va jaasoos e modaafe' raa agar baashad erteghaa midahad.
Spies that are set up in your own cities will be conducting counter-intelligence. They reduce the success chance of other spies trying to steal your technology. = Jaasooshaa dar shahrhaaye khod zedd e jaasoosi mikonand. Shaans e movaffaghiyat e jaasooshaaye dozd e fannaavari raa kam mikonand.
Spies at a higher rank have a higher chance of success. The max rank a spy can reach is rank 3. After a spy is killed it will revive after a certain amount of turns back at rank 1. = Jaasoos e daaraye rotbe ye baalaatar shaans e movaffaghiyat e bishtari daarad. Baalaatarin rotbe 3 ast. Pas az marg, jaasoos ba'd az tedaadi nobat baa rotbe ye 1 dobaare barmigardad.
Building buildings like the constabulary and police station will reduce the technology steal rate of spies in that city. = Saakhtemaanhaayi maanand e Zhaandaarmeri va Kalaantari sor'at e dozdidan e fannaavari dar aan shahr raa kam mikonand.
Espionage is available using the Gods and Kings ruleset. To enable it in a new game click advanced settings, then click on the Enable Espionage option. = Jaasoosi dar ghavaanin e Khodaayaan va Paadeshaahaan mojood ast. Baraaye fa'aal kardan dar baazi ye taaze, tanzimaat e pishrafte va sepas Fa'aalsaazi ye Jaasoosi raa bezanid.

Keyboard Bindings = Takhsishaaye Safhekelid
Limitations = Mahdoodiyat haa
This is a work in progress. = In dar haal e saakht ast.
For technical reasons, only direct keys or Ctrl-Letter combinations can be used. = Be dalil e fanni, faghat kelidhaaye mostaghim yaa tarkib e Ctrl-Harf ghaabel e estefaade hastand.
Using the Keys page = Estefaade az safhe ye Kelidhaa
Each binding has a button with an image looking like this: = Har takhsis dokme i baa tasviri shabih e in daarad:
While hovering the mouse over the key button, you can press a desired key directly to assign it. = Hengaami ke mooshvaare rooye dokme ye kelid ast, kelid e delkhaah raa mostaghiman bezanid taa takhsis yaabad.
Double-click the image to reset the binding to default. = Baraaye baazgardaani be pishfarz, rooye tasvir do baar bezanid.
Bindings mapped to their default keys are displayed in gray, those reassigned by you in white. = Takhsishaaye pishfarz khaakestari hastand va takhsishaaye taghyirdaade shode sefid.
Conflicting assignments are marked red. Conflicts can exist across categories, like World Screen / Unit Actions. Note that at the moment, the game does not prevent saving conflicting assignments, though the result may be unexpected. = Takhsishaaye mota'aarez sorkh hastand. Ta'aroz mitavaanad beyne dastehaa, maanand e Safhe ye Jahaan / Amaliyyat e Niroo, baashad. Baazi fe'lan az zakhire ye ta'aroz jologiri nemikonad, har chand natije shaayad naakhaaste baashad.
For discussion about missing entries, see the linked github issue. = Baraaye goftegoo dar baare ye mavaared e jaaoftaade, mas'ale ye Github e peyvandshode raa bebinid.

Welcome to the Civilopedia! = Be Tamaddon-naame khosh aamadid!
Here you can find information - general help, rules, and what makes up the game world. = Injaa ettelaa'aat, raahnamaa ye omoomi, ghavaanin va saazandehaaye jahaan e baazi raa miyaabid.
How to find information = Chegoone ettelaa’aat raa peydaa konim
Select categories with the buttons on top of the screen. Also up there is the button to leave Civilopedia and go back to where you were before. = Baa dokmehaaye baalaa ye safhe dastehaa raa entekhaab konid. Dokme ye tark e Tamaddon-naame va bargasht be jaaye ghabli hamaanjaast.
Each category has a list of entries on the left of the screen, sorted alphabetically (with few exceptions). Clicking an entry will update the center pane were you are currently reading this. = Har daste dar chap fehresti az madkhalhaa be tartib e alefbaa daarad, baa chand estesnaa. Zadan e madkhal, panjare ye markazi raa ke halaa mikhaanid be rooz mikonad.
Lines can link to other Civilopedia entries, they are marked with a chain link symbol like this one. You can click anywhere on the line to follow the link. = Satrhaa mitavaanand be madkhalhaaye digar e Tamaddon-naame peyvand daashte baashand; nemaad e zanjir aanhaa raa moshakhkhas mikonad. Har jaaye satr raa bezanid taa peyvand raa donbaal konid.
The current category is special - all articles on general concepts are here. It is called 'Tutorials' because you can revisit these here, too. = Daste ye fe'li vizhe ast: hame ye maghaalehaaye mafaahim e omoomi injaast. «Aamoozesh» naam daarad chon mitavaanid aamoozeshhaa raa niz dobaare injaa bebinid.
What information can I find = Che ettelaa’aati raa mitavaanam peydaa konam
The data shown is not dependent on your current game's situation, e.g. bonuses for the nation you are playing or difficulty modifiers will not affect the numbers. = Daadehaaye namaayeshdaade shode be vaz'iyat e baazi ye fe'li bastegi nadaarand; masalan emtiyaaz e keshvar e shomaa yaa modifikator e doshvaari adadhaa raa taghyir nemidahad.
However, it will reflect the mods you are playing! The combination of base ruleset and extension mods you select define the rules of a game, what objects exist and how they interact, and the Civilopedia mirrors these rules. = Amma modhaaye shomaa raa baaztaab midahad! Tarkib e ghavaanin e paaye va modhaaye gostaresh ke entekhaab mikonid, ghavaanin, mojoodiyat e ashyaa va ravesh e ta'aamol e aanhaa raa ta'yin mikonad; Tamaddon-naame in ghavaanin raa neshaan midahad.
If you opened the Civilopedia from the main menu, the "Ruleset" will be that of the last game you started. = Agar Tamaddon-naame raa az fehrest e asli baaz konid, «Majmoo'e ye ghavaanin» az aakharin baazi ye aaghaazshode khaahad bood.
Letters can select categories, and when there are multiple categories matching the same letter, you can press that repeatedly to cycle between these. = Harfhaa dastehaa raa entekhaab mikonand; agar chand daste baa yek harf shoroo shavand, aan harf raa tekrar konid taa beyne aanhaa begardid.
The arrow keys allow navigation as well - left/right for categories, up/down for entries. = Kelidhaaye peykaan ham baraaye peymaayesh hastand: chap/raast baraaye dastehaa va baalaa/paayin baraaye madkhalhaa.

UI Tips = Nekaate Vaaset
World screen = Safhe ye jahaan
Skip all units to end a turn quickly = Baraaye paayaan e sari' e nobat, hame ye niroohaa raa rad konid
Right-click or long press the "Next unit" button to open a popup menu which allows to end a turn without having to cycle through all units. If some units are automated, a dedicated button is available to move them before ending the turn. = Rooye dokme ye «Niroo ye ba'adi» raastklik yaa negah daarid taa fehreste paayaan e nobat bedoon e gardesh dar hame ye niroohaa baaz shavad. Agar nirooyi khodkaar ast, dokme ye vizhe i baraaye harekat e aanhaa pish az paayaan vojood daarad.
Toggle notification list display = Taghyir e namaayesh e fehrest e e'laanhaa
On the World screen, swipe the notification list to the right to temporarily hide it. Click the "Bell" button to display them again. = Dar Safhe ye Jahaan, fehrest e e'laanhaa raa be raast bekeshid taa movaghat penhaan shavad. Dokme ye «Zang» raa baraaye namaayesh e dobaare bezanid.
The default state for the notification list can be set in Options > Display > UI - Notifications on world screen. = Vaz'iyat e pishfarz e fehrest e e'laanhaa raa dar Tanzimaat > Namaayesh > Vaaset - E'laanhaaye safhe ye jahaan ta'yin konid.
Entering a City Screen quickly = Vorood e sari' be safhe ye Shahr
You can Right-click or long press a city button on the World screen. The result is the same as tapping it twice - once to select and move the button, again to trigger a reaction: show the City Screen (if the city is yours to inspect), or offer the foreign city info popup. = Mitavaanid dar Safhe ye Jahaan rooye dokme ye shahr raastklik yaa negah daarid. Maanand e do baar zadan ast: avval entekhaab va jaabejaayi ye dokme, sepas vaakonesh: safhe ye Shahr agar shahr baraaye barrasi az aan e shomaa ast, yaa panjare ye ettelaa'aat e shahr e bigaane.
Upgrade multiple units of the same type = Erteghaa ye chand niroo az yek noe
On the World screen, select a unit that can be upgraded, then right-click or long press the "Upgrade" button to open a popup menu allowing to upgrade all units of this type at once. = Dar Safhe ye Jahaan, niroo ye ghaabel e erteghaa raa entekhaab va dokme ye «Erteghaa» raa raastklik yaa negah daarid taa fehrest e erteghaa ye hame ye niroohaaye hamnoe yekja baaz shavad.
In the Units overview, the same upgrade menu is available by clicking the unit icon in the "Upgrade" column. When a unit is upgradeable, the icon is lit if conditions are met (enough gold and/or resources), otherwise it is dimmed. = Dar moroor e Niroohaa, zadan e nemaad e niroo dar sotoon e «Erteghaa» hamaan fehrest raa midahad. Agar niroo ghaabel e erteghaa va sharaayet, Talaa va/yaa manaabe ye kaafi, mohayyaa baashad nemaad roshan ast, vagarna kamrang ast.
Additional controls for the construction queue = Kontrolhaaye bishtar e saf e saakht
Right-click or long press a construction item to open a popup menu with additional controls, allowing to manage production of the same item in all cities, by issuing the commands from the same City Screen. = Rooye yek mored e saakht raastklik yaa negah daarid taa fehrest e kontrolhaaye bishtar baaz shavad; az hamaan safhe ye Shahr mitavaanid Tolid e aan mored dar hame ye shahrhaa raa modiriyat konid.
The "Disable" option (in a single city or all cities) moves an item to a separated "Disabled" tab, to prevent its automatic queueing by the "Auto-assign city production" option or to remove irrelevant objects from the production planning. To move a disabled item back to its initial place, re-enter its popup menu, and choose "Enable". = Gozine ye «Gheyrefa'aal» dar yek yaa hame ye shahrhaa, mored raa be zabaane ye jodaa ye «Gheyrefa'aal» mibarad taa «Takhsis e khodkaar e Tolid e shahr» aan raa khodkaar be saf nagozaarad yaa ashyaa ye naamarboot az barnamerizi ye Tolid hazf shavand. Baraaye bargasht be jaaye asli, fehrest e aan raa dobaare baaz va «Fa'aal» raa entekhaab konid.
Disabled items are set for the current game only and are carried over when founding a new city. = Mav aared e gheyrefa'aal faghat baraaye baazi ye fe'li hastand va be shahr e taaze niz montaghel mishavand.
Show Great Person Points breakdown = Namaayesh e joziyaat e Emtiyaaz e Fard e Bozorg
In the right sidepanel, click a Great People row to display the details of Great Person Points (GPP) accumulated each turn by the current city, for this type of Great People. = Dar panjare ye raast, rooye satr e Fardhaaye Bozorg bezanid taa joziyaat e Emtiyaaz e Fard e Bozorg (GPP) e jam'shode dar har nobat e shahr e fe'li baraaye aan noe neshaan daade shavad.
Click any of the Great People icons to display all GPP accumulated each turn by the current city, for all types of Great People. = Rooye har nemaad e Fardhaaye Bozorg bezanid taa hame ye GPP e jam'shode dar har nobat e shahr baraaye hame ye anvaa' neshaan daade shavad.
Tech screen = Safhe ye Fannaavari
Queue multiple technologies in different branches = Gozaashtan e chand fannaavari dar saf az shaakhehaaye mokhtalef
On the Tech screen, right-click or long press a technology to automatically queue it, even if this tech is in another branch than the item currently researched. Prerequisite techs to research will also be automatically queued. = Dar safhe ye Fannaavari, rooye fannaavari raastklik yaa negah daarid taa khodkaar be saf beravad, hatta agar dar shaakhe ye digari az fannaavari ye fe'li baashad. Fannaavarihaaye pishniyaaz niz khodkaar be saf miravand.
Right-click or long press multiple techs to append them to the research queue, whatever their branch is. = Rooye chand fannaavari raastklik yaa negah daarid taa bedoon e tavajjoh be shaakhe, be saf e pazhoohesh ezaafe shavand.
Overview screens = Safhehaaye Moroor
Reveal known resources on world screen = Aashkaar kardan e manaabe e shenaakhte dar safhe ye jahaan
In the Resources overview, click on a resource icon to center the world screen on tiles already discovered and providing this resource. = Dar moroor e Manaabe, nemaad e manba' raa bezanid taa safhe ye jahaan rooye zaminhaaye aashkaar va ta'minkonande ye aan manba' markaz shavad.
Alternatively, click on the "Unimproved" number to center the world screen only on owned (by you or your allied City-states) tiles where the resource is not improved. = Yaa adad e «Behsaazinashode» raa bezanid taa safhe faghat rooye zaminhaaye shomaa yaa Shahr-dowlathaaye mottahed ke manba' behsaazi nashode markaz shavad.
If more than one tile is available, click repeatedly on the notification to cycle through all of them. = Agar bish az yek zamin ast, e'laan raa tekrar bezanid taa beyne hame begardid.
Show diagram line colors = Namaayesh e rang e khotoot e nemoodaar
In Politics overview > Show diagram, you can click anywhere inside the diagram to display a table listing all relationship line colors and their meaning. = Dar moroor e Siyaasat > Namaayesh e nemoodaar, har jaaye nemoodaar raa bezanid taa jadval e rang e hame ye khotoot e ravaabet va ma'naa ye aanhaa baaz shavad.
Reading "Toast" popups = Khaandan e payaamhaaye gozaraa
"Toasts" can be clicked to make them stay on the screen for easier reading. = Payaamhaaye gozaraa raa mitavaan zad taa baraaye khaandan e aasaantar rooye safhe bemaanand.
Click it again to close (or use the close button). = Baraaye bastan dobaare bezanid yaa dokme ye bastan raa estefaade konid.
Miscellaneous = Goonaagoon
External links = Peyvandhaaye birooni
External links support right-click or long press to copy the link to the clipboard instead of launching the browser. = Peyvandhaaye birooni baa raastklik yaa negah daashtan, be jaaye baaz kardan e moroorgar, dar haafeze ye movaghat kopi mishavand.
Example: The 'Open Github page' button on the Mod management screen. = Mesaal: dokme ye «Baaz kardan e safhe ye Github» dar safhe ye modiriyat e Mod.
View change log = Didan e fehrest e taghyiraat
After updating, you might want to see what has changed. The "About" in "Options" has the version number linked to the change log. You can also see that info by clicking the version number on the main menu. = Pas az be roozresaani shaayad bekhaahid taghyiraat raa bebinid. Dar «Dar baare» ye «Tanzimaat», shomaare ye noskhe be fehrest e taghyiraat peyvand daarad. Baa zadan e shomaare ye noskhe dar fehrest e asli hamin ettelaa'aat raa mibinid.

Differences from Civilization V = Tafaavothaaye baa Civilization V
Production Focus\nIn Civilization V, the Food yield in a city is calculated first, then population grows by consuming stored food (growth), then production is calculated, and so on one by one the other stats are calculated. Thus, citizens can produce yields in the same turn as they are born. The city focus is set to Production to assign the newborn citizen to a hill so they'll contribute Production, and then manually reassigned to a growth tile on the next turn. Alternatively, you can set city focus to Gold (e.g. with Cerro de Potosi), Faith (e.g. with Mount Sinai) or whatever gains the most yields. In Unciv, citizens only start producing yields on the next turn, so you can ignore this whole concept. = Tamarkoz e Tolid\nDar Civilization V, avval baazdehi ye Ghazaa hesaab mishavad, sepas jam'iyat baa masraf e ghazaa ye zakhire roshd mikonad, sepas Tolid va ba'd saayer e aamaar yeki yeki hesaab mishavand. Pas shahrvand dar hamaan nobat e tavallod mitavaanad baazdehi tolid konad. Tamarkoz e shahr raa rooye Tolid migozaarand taa shahrvand e taaze rooye tappe Tolid bedahad va nobat e ba'ad dasti be zamin e roshd montaghel mikonand. Yaa mitavaan tamarkoz raa rooye Talaa, masalan baa Cerro de Potosi, Imaan, masalan baa Kooh e Sinaa, yaa har chiz e daaraaye bishtarin baazdehi gozaasht. Dar Unciv, shahrvand faghat az nobat e ba'ad tolid mikonad; pas in mafhoom raa mitavaanid naadide begirid.
Science Queueing\nIn Civilization V, Science yield is calculated after production, so if you finish an item and have Science (or Gold) queued as a perpetual construction, the Production overflow from item will be converted into Science (or Gold), but the Production is not consumed, as this will only happen again on the next turn. By immediately swapping out your perpetual construction for an item on the next turn, you'll get this Science (or Gold) for free. This doesn't apply to Unciv, so don't bother. = Saf e Elm\nDar Civilization V, baazdehi ye Elm pas az Tolid hesaab mishavad. Agar yek mored raa tamaam konid va Elm yaa Talaa be onvaan e saakht e daayemi dar saf baashad, Tolid e maazaad be Elm yaa Talaa tabdil mishavad amma masraf nemishavad, chon in kaar nobat e ba'ad dobaare rokh midahad. Baa taghyir e fori ye saakht e daayemi be yek mored dar nobat e ba'ad, in Elm yaa Talaa raa raaygaan migirid. Dar Unciv chenin nist; pas talaash nakonid.
Double Aqueducts\nIn Civilization V, the game sells existing copies of the building for you before providing a free copy of the building. So, if you build an aqueduct in a city, and then in the turn of adopting Tradition Complete you sell a cheap building (e.g a shrine) beforehand, the game is unable to sell more than 1 building per turn, and thus you'll keep your aqueduct, together with the new free aqueduct. Not applicable to Unciv. = Aabrooye Dogaan e\nDar Civilization V, baazi pish az daadan e noskhe ye raaygaan e saakhtemaan, noskhehaaye mojood raa miforooshad. Agar dar shahr Aabroo besaazid va dar nobat e Takmil e Sonnat, ghabl az aan yek saakhtemaan e arzaan maanand e Neyaayeshgaah beforooshid, baazi chon bish az 1 saakhtemaan dar nobat nemiforooshad, Aabrooye shomaa raa negah midaarad va Aabrooye raaygaan ham ezaafe mishavad. Dar Unciv kaar nemikonad.
Legalism Oxford\nIn Civilization V, national wonders such as Oxford University are considered culture buildings, so you can get them for free with Legalism. Not applicable to Unciv. = Aaksford e Ghaanoongeraayi\nDar Civilization V, ojoobehaaye melli maanand e Daaneshgaah e Aaksford saakhtemaan e farhangi hesaab mishavand; pas baa Ghaanoongeraayi mitavaan raaygaan gereft. Dar Unciv kaar nemikonad.
Roads and Forts\nIn Civilization V, you can't use roads and forts in enemy territory. In Unciv, you can use them, so instead of mindlessly constructing them everywhere when at war, you need to decide if and when they'll benefit you more than your opponents. = Jaaddehaa va Dezhhaa\nDar Civilization V nemitavaanid az jaadde va dezh e khaak e doshman estefaade konid. Dar Unciv mitavaanid; pas be jaaye saakht e bi fekr e aanhaa dar hame jaa dar jang, baayad tasmim begirid aayaa va che zamaan baraaye shomaa bishtar az doshman sood daarand.
Citizen Conversion\nIn Civilization V, a citizen is born religious if the parent city is already converted. This is not the case in Unciv, which can lead to temporary deconversion of a city when it grows. = Taghyir e Din e Shahrvand\nDar Civilization V, agar shahr taghyir e din daade baashad shahrvand e taaze dini motavalled mishavad. Dar Unciv chenin nist va roshd mitavaanad movaghat aksariyat e dini ye shahr raa az beyn bebarad.
Unassigned Citizens\nIn Civilization V, unassigned citizens are considered specialists, and subject to the same type of bonuses (e.g. Korea's ability). It can be worthwhile to leave citizens unassigned, instead of being assigned to a tile. Not applicable to Unciv. = Shahrvandaan e Bi-takhsis\nDar Civilization V, shahrvand e bi-takhsis Motekhasses ast va hamaan emtiyaazhaa, maanand e tavaanaayi ye Kore, raa migirad. Shaayad behtar baashad be jaaye takhsis be zamin, bi-takhsis bemaanad. Dar Unciv kaar nemikonad.
Settler Construction\nIn Civilization V, cities can't starve when constructing settlers, so you can assign all citizens to production tiles and none to food tiles. In Unciv, citizens keep consuming two food per turn. = Saakht e Shahrakneshin\nDar Civilization V, shahr hengaam e saakht e Shahrakneshin nemitavaanad gorosne shavad; pas hame ye shahrvandaan raa mitavaan be Tolid va hich kas raa be Ghazaa takhsis daad. Dar Unciv, shahrvandaan hamchenaan har nobat do Ghazaa masraf mikonand.
Water Melee Attack\nAs result of a Discord poll, Water Melee units can attack military land units on the shore, unlike in Civilization V. = Hamle ye Nazdik e Aabi\nBar paaye ye nazarsanji ye Discord, Niroohaaye Nazdikzan e Aabi mitavaanand be niroohaaye nezaami ye zamini dar saahel hamle konand; bar khalaaf e Civilization V.
Tile improvements\nIn Civilzation V, workers start working on an improvement-under-construction at the beginning of movement. Unciv changes this, to allow players to assign workers to tiles, and then reconsider and change improvement or move them elsewhere. = Behsaazi ye Zamin\nDar Civilization V, kaaregar hengaam e aaghaaz e harekat rooye behsaazi ye dar dast e saakht kaar mikonad. Unciv in raa avaz karde taa baazikon kaaregar raa be zamin befrestad va sepas betavaanad taghyir e nazar dahad, behsaazi raa avaz konad yaa oo raa be jaaye digar bebarad.
Forest and Jungle Visibility\nIn Unciv, forests and jungles are visible 1 tile outside visibility range. In Civilization V, this is the behaviour of hills and mountains, but not of forests and jungles, yet jungle and forest can block hills, and hill + forest can block mountain, indicating they're on the same elevation. This is considered to be a bug in the otherwise well-structured visibility logic in Civilization V. = Did e Jangal va Jangal e Haarre\nDar Unciv, jangal va jangal e haarre 1 khaane biroon az bord e did ham didani hastand. Dar Civilization V in raftaar e tappe va kooh ast, na jangalhaa; amma jangal mitavaanad tappe va tappe + jangal mitavaanad kooh raa bepooshaanad, ya'ni dar hamaan ertefaa' hastand. In raa khataayi dar mantegh e dar gheyr e in mored monazzam e did e Civilization V midaanand.
City razing\nIn Civilization V, the player can never raze any of the cities he/she founded. Not applicable to Unciv. = Viraansaazi ye Shahr\nDar Civilization V, baazikon hargez nemitavaanad shahri raa ke khod saakhte viraan konad. Dar Unciv chenin mahdoodiyati nist.

Founding Cities\nThe Settler is a unit that can found a new city. You can build a Settler unit in a city with at least 2 population, and then move them to a good location to found a new city. This will usually be your main way of acquiring more cities. = Bonyangozari ye Shahr\nShahrakneshin nirooyi ast ke mitavaanad shahr e jadid besaazad. Dar shahri baa hadd aghal 2 jam'iyat yek Shahrakneshin besaazid va oo raa be makaan e khoob bebarid taa shahr e taaze besaazad. In mamoolan raah e asli ye daashtan e shahrhaaye bishtar ast.
Food conversion to Production\nDuring the construction of a Settler, the city will not grow. Instead, the 1st, 2nd, 4th, and from there on every 4th, excess Food (Growth) is converted into Production, with the rest of the excess Food being lost. = Tabdil e Ghazaa be Tolid\nDar tool e saakht e Shahrakneshin, shahr roshd nemikonad. Be jaaye aan, Ghazaa ye ezaafi ye 1om, 2om, 4om va pas az aan har 4omin Ghazaa ye ezaafi be Tolid tabdil mishavad va baghiye az dast miravad.

Default Promotions = Erteghaahaaye Pishfarz
Allow the player to apply a set of promotions when a unit is built. = Be baazikon ejaaze midahad pas az saakht e niroo yek majmoo'e erteghaa raa ejraa konad.
To make a promotion the default, check 'Default promotions for [unit]' then click 'Pick promotions'. = Baraaye pishfarz kardan e erteghaa, «Erteghaahaaye pishfarz baraaye [unit]» raa alaamat bezanid va sepas «Entekhaab e erteghaa» raa bezanid.
To disable default promotions for a unit, uncheck 'Use default promotions' under the buy button for the unit. = Baraaye gheyrefa'aal kardan e erteghaa ye pishfarz e niroo, alaamat e «Estefaade az erteghaa ye pishfarz» raa zir e dokme ye kharid e niroo bardaarid.
Default promotion only applies to the same units that you selected. It only applies per cities. It can't be used in puppeted cities or cities that you don't own. = 
If the city doesn't have enough XP it will not apply all the promotions. And default promotions doesn't affect the civ AI in anyway. = Agar shahr XP e kaafi nadaashte baashad, hame ye erteghaahaa ejraa nemishavand. Erteghaa ye pishfarz hich taasiri bar Hoosh e Masnoo'i ye tamaddon nadaarad.
