文明，从这里\n开始生长。 = Tamaddon e shomaa\naz injaa aaghaaz mishavad.
沿河谷出发，穿过未知边境。\n四个章节，十六次策略抉择。 = Darre raa be sooye naashenaakhte donbaal konid.\nChahaar fasl. Shaanzdah chaalesh e raahbordi.
