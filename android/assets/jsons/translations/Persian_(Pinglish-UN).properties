Pachacuti = Pachacuti
Resistance is futile! You cannot hope to stand against the mighty Incan empire. If you will not surrender immediately, then prepare for war! = Moghaavemat bi-faayede ast! Nemitavaani dar baraabar e Emperaatoori ye niroomand e Inka omid e istaadegi daashte baashi. Agar fori taslim nashavi, baraaye jang aamaade baash!
Declare war on me?!? You can't, because I declare war on you first! = Be man e'laam e jang mikoni?!? Nemitavaani, chon man avval be to e'laam e jang mikonam!
How did you darken the sun? I ruled with diligence and mercy—see that you do so as well. = Chegoone khorshid raa taarik kardi? Man baa pooshtkaar va rahm hokoomat kardam; to niz chenin kon.
How are you? You stand before Pachacuti Inca Yupanqui. = Haal e shomaa chetor ast? Dar baraabar e Pachacuti Inca Yupanqui istaade id.
The Incan people offer this fair trade. = Mardom e Inka in mo'aamele ye monsefaane raa pishnahaad mikonand.
How are you doing? = Haalet chetore?
What do you want now? = Haalaa chi mikhaay?
Great Andean Road = Jaade ye Azim e Kooh haaye Aand
King Pachacuti Sapa Inca, maker of the world and ruler of Tawantinsuyu and the Inca people, your loyal subjects greet you! In the beginning, the small state of Cusco already showed the Incans were promised for greatness. They won many wars against powerful enemies, relentlessly crushing any army that dared oppose them, and forged a mighty empire stretching from Ecuador to Chile, the greatest ever seen in pre-Columbian America. Not just undaunted soldiers, Inca people were accomplished builders and artists, their magnificient and unequalled culture still fascinating the world today. = Ey Shaah Pachacuti Sapa Inca, saazande ye jahaan va farmanravaaye Tawantinsuyu va mardom e Inka, ra'iyat e vafaadaarat be to dorood migooyand! Az aaghaaz, dowlat e koochak e Cusco neshaan midaad ke bozorgi dar entezar e Inka haa ast. Aanhaa dar jang haaye besyaar doshmanaan e niroomand raa shekast daadand, har artesh e jorat-konande be moghaavemat raa bi-amaan khord kardand va emperaatoori yi az Ecuador taa Chile saakhtand, bozorgtarin dar Aamrikaaye pish az Columbus. Mardom e Inka na tanhaa sarbaazaan e bitars, balke saazandegaan va honarmandaan e maaher boodand va Farhang e baashokooh va bi-hamtaa ye aanhaa emrooz niz jahaan raa shegeftzade mikonad.
O Emperor Pachacuti, honor your name of 'Earth Shaker'! Will you once again summon the power of the earth to unite all Incan people under the protection of Sapa Inca, the Son of the Sun? Will your new empire shine through the ages of history? = Ey Emperaatoor Pachacuti, shaayeste ye naamat «Larzaanande ye zamin» baash! Aayaa dobaare ghodrat e zamin raa faraa mikhaani taa hame ye Inka haa raa zire hemaayat e Sapa Inca, Pesare Khorshid, yeki koni? Aayaa emperaatoori ye jadidat dar asr haaye taarikh khaahad derakhshid?
