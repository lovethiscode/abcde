Dido = Didoo
Tell me, do you all know how numerous my armies, elephants and the gdadons are? No? Today, you shall find out! = Begooyid, aayaa hametaan midaanid arteshhaa, filhaa va gadaadonhaaye man cheghadr ziyaadand? Na? Emrooz khaahid fahmid!
Fate is against you. You earned the animosity of Carthage in your exploration. Your days are numbered. = Sarnevesht bar alayh e tost. Dar kaavoshhaayat doshmani ye Kaartaazh raa kasb kardi. Roozhaayat shomaarde shode and.
The fates became to hate me. This is it? You wouldn't destroy us so without their help. = Sarneveshthaa az man bizaar shodand. Hamin ast? Bedoon e komak e aanhaa nemitavaanesti maa raa in chenin naabood koni.
You aren't meeting my expectations. You can do so much better. = Entezaaraat e man raa bar aavarde nemikoni. Mitavaani besyaar behtar baashi.
The Phoenicians welcome you to this most pleasant kingdom. I am Dido, the queen of Carthage and all that belongs to it. = Finighihaa be shomaa dar in paadeshaahi ye besyaar delpazir khosh aamad migooyand. Man Didoo, malake ye Kaartaazh va hame ye daarayihaaye aan, hastam.
I just had the marvelous idea, and I think you'll appreciate it too. = Hamin alaan andishe ye shegeftangizi be zehnam resid va fekr mikonam to hamaan raa khosh khaahi daasht.
What is it now? = Halaa che shode ast?
Phoenician Heritage = Miraas e Finighi
Greetings to you, revered Queen Dido, ruler of the legendary kingdom of Carthage. The great poet Virgil related your great history, how your husband Acerbas was murdered by your own brother, King Pygmalion of Tyre, to steal the treasures of your family that were rightfully yours. But you endured his pressure until you and your compatriots decided to flee and sail for new lands. The gods led you to the shores of North Africa, and with cunning diplomacy, you expanded the territory of your new home, and laid the basis for the future kingdom of Carthage. = Dorood bar malake ye mohtaram Didoo, farmaanravaa ye paadeshaahi ye afsaane i ye Kaartaazh. Shaa'er e bozorg Virzhil daastaan e bozorgat raa bazgoo kard: chegoone hamsarat Akerbaas be dast e baraadar e khodet, Paadeshaah Pigmaalion e Soor, koshte shod taa ganjhaaye khaandaanat raa ke be hagh az aan e to bood bedozdad. Amma feshaar e oo raa tahammol kardi taa khod va hammihanaanat tasmim gereftid begorizid va be sarzaminhaaye taaze safar e daryaayi konid. Khodaayaan to raa be savaahel e Shomaal e Aafrighaa rahnemoon shodand va baa diplomaasi ye hooshmandaane, sarzamin e khaane ye jadidat raa gostaresh daadi va paayehaaye paadeshaahi ye aayande ye Kaartaazh raa gozaashti.
Clever and proud Dido, the storm is coming and your people look for a shelter under your wise and powerful protection. Can you create a new and radiant Carthage able to cleave the darkness? Will your new empire shine through the ages of history? = Didooye baa hoosh va sarboland, toofaan dar raah ast va mardomat dar zir e hefaazat e kheradmand va niroomand e to panaah mijooyand. Aayaa mitavaani Kaartaazhi taaze va derakhshaan besaazi ke taariki raa beshkaafad? Aayaa emperaatoori ye jadidat dar tool e asrhaaye taarikh khaahad derakhshid?
