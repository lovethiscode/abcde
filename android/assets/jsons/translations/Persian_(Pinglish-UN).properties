Sejong = Sejong
Jip-hyun-jun (Hall of Worthies) will no longer tolerate your irksome behavior. We will liberate the citizens under your oppression even with force, and enlighten them! = Jip-hyun-jun (Taalaare Shaayestegaan) digar raftaar e aazaar-dahande ye shomaa raa tahammol nemikonad. Shahrvandaan e zire setam e shomaa raa hatta be zoor aazaad va roshan khaahim kard!
Foolish, miserable wretch! You will be crushed by this country's magnificent scientific power! = Bi-navaaye naadaan va badbakht! Zire ghodrat e elmi ye baashokooh e in keshvar khord khaahi shod!
Now the question is who will protect my people. A dark age has come. = Aknoon porsesh in ast ke che kasi az mardomam hefaazat khaahad kard. Asri taarik faraa-reside ast.
Your words reveal more of your own prejudice than any fault in my own. = Harf haayat bish az har aibi dar man, ta'assob e khodet raa aashkaar mikonad.
Welcome to the palace of Choson, stranger. I am the learned King Sejong, who looks after his great people. = Be kaakh e Choson khosh aamadid, bigaane. Man Shaah Sejong e daaneshmand hastam, ke az mardom e bozorg e khod moraaghebat mikonad.
We have many things to discuss and have much to benefit from each other. = Chiz haaye besyaari baraaye goftegoo daarim va mitavaanim besyaar az yekdigar bahre bebarim.
Oh, it's you = Oh, in toyi
Scholars of the Jade Hall = Pazhooheshgaraan e Taalaar e Jeyd
Greetings to you, King Sejong the Great, heir of the Choson Dynasty! Prosperity and benevolence towards the common man are the principles of your reign, and made of you the most beloved Korean king. You always aimed to provide a fair and equal society for all your people, and also to favor knowledge and technological discoveries. Your wisdom and intelligence imbued all the Korean society, and the scholars of the Jade Hall developed Korea's first written language, Hangul, sharing further literature and science to the people after centuries of darkness. = Dorood bar to, Shaah Sejong e Bozorg, vaares e selesele ye Choson! Ronaagh va nik-khaahi be mardom e aadi osool e farmaanravaayi ye to and va to raa mahboobtarin shaah e Kore karde and. Hamishe khaasti jaamee yi aadelane va baraabar baraaye hame ye mardomat faraaham koni va az daanesh va kashf haaye teknoloji hemaayat koni. Kherad va hoosh e to hame ye jaamee ye Kore raa por kard; daaneshvaraan e Taalaare Yashm nokhostin zabaan e neveshtaari ye Kore, Hangul, raa parvaresh daadand va pas az sade haa taariki, adabiyaat va Elm raa bishtar baa mardom dar miyaan gozaashtand.
Wise Sejong, will you gift your people with the radiance of harmony and knowledge to dispel the darkness once again? Will your new empire shine through the ages of history? = Ey Sejong e daanaa, aayaa dobaare ba hediye ye noor e hamaahangi va daanesh be mardomat taariki raa khaahi zodood? Aayaa emperaatoori ye jadidat dar asr haaye taarikh khaahad derakhshid?
