I have just received a report that large numbers of my troops have crossed your borders. = Hamin al-aan gozaaresh resid ke tedaad e ziyaadi az sarbaazaanam az marz haaye shomaa gozashte and.
My attempts to avoid violence have failed. An eye for an eye only makes the world blind. = Talaash haayam baraaye parhiz az khoshoonat naakaam maand. Cheshm dar baraabar e cheshm faghat jahaan raa koor mikonad.
You can chain me, you can torture me, you can even destroy this body, but you will never imprison my mind. = Mitavaani be zanjiram bekeshi, shekanje am koni va hatta in tan raa naabood koni, amma hargaz zeh-nam raa zendaani nakhaahi kard.
Curious. = Jaaleb ast.
Hello, I am Mohandas Gandhi. My people call me Bapu, but please, call me friend. = Salaam, man Mohandas Gandhi hastam. Mardomam maraa Bapu minaamand, amma lotfan maraa doost khitaab kon.
My friend, are you interested in this arrangement? = Doost e man, be in tavaafogh alaaghe daari?
I wish you peace. = Baraayat solh aarezoo mikonam.
Population Growth = Roshd e Jame’iat
Wise Mahatma Gandhi, great leader of India, we honor you! India is one of the oldest countries in the world with 10,000 years of history, built on spirit and religion, as three of the world's great religions - Hinduism, Buddhism and Jainism - appeared on this sacred land. Every aspect of India society reveres art, music and color, showing great wealth but also grinding poverty. For centuries, India was torn between local kingdoms fighting each other but also repelling invaders. In the 12th century AD, Muslim Turks tried to conquer India, then the Mongols took their place. In the early 17th century, India, still fragmented, was colonized by the English and their diplomacy and technological superiority. After two centuries of British dominion, Indian nationalism woke up, and you, Great Mahatma, have led a peaceful and victorious rebellion never seen anywhere in history! = Ey Mahatma Gandhi ye daanaa, rahbar e bozorg e Hend, to raa geraami midaarim! Hend yeki az kohantarin keshvar haaye jahaan baa 10,000 saal taarikh ast, binaa shode bar rooh va din; se din e bozorg e jahaan, Hendoo, Boodaayi va Jain, dar in sarzamin e moghaddas peydaa shodand. Hame ye jahat haaye jaamee ye Hend honar, moosighi va rang raa geraami midaarad va servat e besyaar va faghr e farsaa-yande raa hamzamaan neshaan midahad. Baraaye sade haa, Hend miyaan e paadeshaahi haaye mahalli ke baa ham mijangidand va baa hamlevaraan ham moghaabele mikardand paare-paare bood. Dar sade ye 12 milaadi, Tork haaye Mosalmaan baraaye taskhir e Hend talaash kardand; sepas Moghol haa jaay e aanhaa raa gereftand. Dar aaghaaz e sade ye 17, Hend ke hanooz paraakande bood, baa siyaasat va bartari ye teknoloji ye Engelisi haa mostamare shod. Pas az do sade solte ye Britaaniyaa, mellatgeraayi ye Hend bidaar shod va to, ey Mahatma ye bozorg, shoreshi solh-aamiz va pirooz raa rahbari kardi ke hich jaaye taarikh hamaanand nadaasht!
Gandhi, your people ask again to be led on the path of freedom. Under protection of Ganesha and Surya, can India accomplish its great potential? Will your new empire shine through the ages of history? = Ey Gandhi, mardomat dobaare mikhaahand dar raah e aazaadi rahbari shavand. Zire hemaayat e Ganesha va Surya, aayaa Hend mitavaanad este'daad e bozorg e khod raa tahaghghogh bakhshad? Aayaa emperaatoori ye jadidat dar asr haaye taarikh khaahad derakhshid?
