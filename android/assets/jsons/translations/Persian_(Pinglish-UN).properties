Maria Theresa = Maariyaa Terezaa
Shame that it has come this far. But ye wished it so. Next time, be so good, choose your words more wisely. = Afsoos ke kaar be injaa resid. Amma khodet in raa khaasti. Baar e ba'ad, lotfan vaazhehaayat raa kheradmandaanetar entekhaab kon.
What a fool ye are! Ye will end swiftly and miserably. = Cheghadr ahmaghi! Be zoodi va baa badbakhti paayaan khaahi yaaft.
The world is pitiful! There's no beauty in it, no wisdom. I am almost glad to go. = Jahaan tarahhom angiz ast! Na zibaayi daarad, na kherad. Kamobish khoshhaalam ke miravam.
The archduchess of Austria welcomes your Eminence to... Oh let's get this over with! I have a luncheon at four o'clock. = Archdoks e Otrish be aalijanaab e shomaa khosh aamad migooyad be... Oh, biyaayid tamaamash konim! Saa'at e chahaar mehmaani ye naahaar daaram.
I see you admire my new damask. Nobody should say that I am an unjust woman. Let's reach an agreement! = Mibinam ke kamkhaa ye jadidam raa tahsin mikonid. Hich kas nabaayad begooyad ke man zani bi-ensaafam. Biyaayid be tavaafogh beresim!
Oh, it's ye! = Oh, khodeti!
Diplomatic Marriage = Ezdevaaj e Siyaasi
Noble and pious Queen Maria Theresa, Holy Roman Empress and sovereign of Austria, the people revere your grace. After the death of your father King Charles VI, you inherited the throne of Austria during difficult economic and military times. But you used your wisdom and unflinching determination to fend off your foes and resolve any obstacles to stability and prosperity. With your husband Francis Stephen at your side as co-ruler, you assured your place as Empress of the Holy Roman Empire. During your reign, you reformed Austria in several domains, as you gifted it with a powerful army, a stable economic model, and an improved educational system. = Malake ye najib va paarsaa Maariyaa Terezaa, emperaatorbaanoo ye Room e Moghaddas va farmaanravaa ye Otrish, mardom az lotfat setaayesh mikonand. Pas az marg e pedarat, Shaah Kaarl e VI, dar roozegaar e doshvaar e eghtesaadi va nezaami vaares e takht e Otrish shodi. Amma baa kherad va eraade ye khalalnaapazirat doshmanaanat raa raandi va har maane' e sobaat va refaah raa bartaraf kardi. Baa hamsarat Fraansis Estefan dar kenaaret be onvaan e hamfarmaanravaa, jaaygaahat raa be onvaan e emperaatorbaanoo ye Room e Moghaddas tahkim kardi. Dar tool e farmaanravaayi, Otrish raa dar chand zamine eslaah kardi va be aan arteshi niroomand, olgoo ye eghtesaadi ye paaydaar va saamaane ye aamoozeshi ye behtaryaafte bakhshidi.
O Great Queen, proud and dignified, by the will of God and the Divine right, can you reach the height of prosperity and splendor the kingdom of Austria deserves? Will your new empire shine through the ages of history? = Ey malake ye bozorg, sarboland va baa veghaar, aayaa be khaast e Khodaa va hagh e elaahi mitavaani be ooje refaah va shokoohi beresi ke paadeshaahi ye Otrish sazaavaar e aan ast? Aayaa emperaatoori ye jadidat dar tool e asrhaaye taarikh khaahad derakhshid?
