Multiplayer in three steps = Chand-nafare dar se gaam
There is no waiting lobby; the game starts as soon as the creator finishes setup. = Lobby-ye entezar vojood nadaarad; baazi be-mahz-e paayaan-e tanzimaat-e saazande shoroo mishavad.
1. Each player copies their Player ID and sends it to the game creator. = 1. Har baazikon Player ID-e khod raa kopi mikonad va baraaye saazande-ye baazi miferestad.
2. The creator opens New game, enables online multiplayer, and assigns each human civilization its Player ID. = 2. Saazande Baazi-ye jadid raa baaz mikonad, chand-nafare-ye online raa fa'aal mikonad va Player ID-e har tamaddon-e ensaani raa ta'yin mikonad.
3. The creator shares the Game ID; other players add it here and download the latest save. = 3. Saazande Game ID raa be eshteraak migozaarad; baazikonaan-e digar aan raa injaa ezafe mikonand va aakharin zakhire raa download mikonand.
