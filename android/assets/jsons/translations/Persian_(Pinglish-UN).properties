尚无符合条件的解放归还记录。 = Aazaadsaazi va baazgardaani ye vaajed e sharaayet sabt nashode.
本关发生归属中断，可在后续关卡重新尝试。 = Maalikiyat ghat' shod; dar marhale ye ba'di dobaare talaash konid.
三城连续归属观察中，按时完成本关后核对。 = Maalikiyat e peyvaste zir e nazar ast; dar takmil e be moghe' e marhale barrasi mishavad.
达到三城容量并在首波前建立三城，可在后续关卡尝试。 = Zarfiyat e se shahr raa baaz va pish az mowj e avval e yek marhale ye aayande, se shahr daashte baashid.
把长期发展转化为完整终局，纪念第一次亲自完成一场胜利。 = Tose'e ye bolandmoddat raa be paayaan e kaamel beresaanid va nakhostin piroozi raa geraami bedaarid.
选择第二座城的位置，在资源、地形和扩张成本之间作第一次取舍。 = Makaan e shahr e dovvom raa entekhaab va manaabe, zamin va hazine ye gostaresh raa mota'aadel konid.
第一次为文明选择发展方向，感受政策带来的长期差异。 = Baraaye tamaddon jahat entekhaab va aathaar e paaydaar e siyaasathaa raa kashf konid.
协调两座城市的生产与黄金时代时机；争夺奇观的风险，让排期本身成为决策。 = Tolid e do shahr raa baa zamaanbandi ye Asr e Talaai hamaahang konid. Reghaabat e ojoobehaa, zamaanbandi raa be entekhaab e raahbordi tabdil mikonad.
围绕一座奇观安排科技和生产，体验与其他文明争夺同一目标。 = Fannaavari va Tolid raa piraamoon e yek ojoobe barnaamerizi va baraaye saakht e aan baa tamaddonhaa reghaabat konid.
认识移动、攻击与生存的基本关系，获得第一次真实交锋的反馈。 = Az nakhostin nabard e vaaghe'i, hamaahangi ye harekat, hamle va zende maandan raa biyaamoozid.
把地图上的土地变成实际产出，理解工人与城市发展的关系。 = Zamin raa porbaazde konid va biyaamoozid Kaaregar chegoone az tose'e ye shahr poshtibaani mikonad.
把分散的城市组织成网络，选择道路、海港或两者组合，而非只追求城市数量。 = Be jaaye faghat shomaar e shahr, baa jaadde, Bandar yaa har do, shahrhaaye paraakande raa be shabake vasl konid.
让粮食、人口与教育设施相互支持，形成一座有清楚用途的学术中心。 = Ghazaa, jam'iyat va saakhtemaanhaaye aamoozeshi raa baraaye markazi vizhe ye yaadgiri tarkib konid.
比较不同城邦类型的收益，决定把有限外交投入放在哪里。 = Sood e anvaa' e Shahr-dowlat raa moghaayese va tasmim begirid manaabe e mahdood e diplomatik raa kojaa sarmayegozaari konid.
把创教转为本土社会的共同信仰，体验城市布局、自然传播和主动传教的配合。 = Baa tarkib e makaan e shahr, gostaresh e tabi'i va taghyir e din e fa'aal, din e khod raa dar mihan begostaraanid.
在未知地图中获得发现的惊喜。作为自然探索纪念，不要求为三处奇观反复重开。 = Az kashf dar naghshe ye naashenaakhte lezzat bebarid. In hadaf e kaavosh be aaghaaz e tekraari baraaye yaaftan e se ojoobe niyaaz nadaarad.
以有限城市投入科研，依靠质量和发展效率完成太空目标。允许防卫战争，限制的是指定战斗占城。 = Tedaad e mahdoodi shahr raa bar pazhoohesh e kaaraa baraaye residan be fazaa motemarkez konid. Jang e defaa'i mojaaz ast; mahdoodiyat marboot be fathhaaye nezaami ye moshakhkhas ast.
在有限城市规模下集中积累文化，安排政策、建设与胜利项目的先后。 = Farhang raa dar emperaatoori ye koochak motemarkez va tartib e siyaasat, saakhtemaan va porozhe ye piroozi raa barnaamerizi konid.
改变扩张来源：不继续自行建城，以军事实力和占领后的管理建立帝国。 = Be jaaye bonyan e shahrhaaye bishtar, baa fath gostaresh yaabid va baa ghodrat e nezaami va modiriyat e shahr emperaatoori besaazid.
用有限城市支撑政策专精，选择两条适合当前战略的政策路线。 = Baa tedaad e mahdoodi shahr, tose'e ye motemarkez e siyaasat raa poshtibaani va do shaakhe ye monaaseb e raahbord entekhaab konid.
围绕外国首都组织宗教影响力，选择传播对象与时机，承担跨国竞争。 = Piraamoon e paaytakht e bigaane nofooz e dini besaazid va dar reghaabat e beynolmelali makaan va zamaan e gostaresh raa entekhaab konid.
利用埃及建造优势，把一座城市经营成奇观中心，在科技、生产与抢建风险之间取舍。自选重投入专项。 = Az bartari ye saakht e Mesr estefaade konid taa yek shahr markaz e ojoobehaa shavad; pazhoohesh, Tolid va reghaabat raa mota'aadel konid. In chaalesh ekhtiyaari va niyaazmand e sarmayegozaari ye bozorg ast.
预先协调多条战线和占城部队，让几场局部战斗汇成同一回合的战略突破。 = Chand jebhe va asir kardan e niroohaa raa hamaahang konid taa nabardhaaye jodaa dar yek nobat be shekast e raahbordi ye doshman tabdil shavand.
围绕波斯黄金时代的持续时间与战斗优势准备攻势，在有效窗口集中兑现实力。自选进阶专项。 = Baa tavajjoh be moddat va bartarihaaye jangi ye Asr e Talaai ye Iran, tahaajom aamaade konid. In chaalesh e pishrafte ekhtiyaari ast.
用小国规模应对更高难度，挑选一条适合的非时间胜利路线，而非依靠不断扩张。 = Baa emperaatoori ye koochak baa doshvaari ye baalaatar rooberoo va be jaaye gostaresh e daayemi, masir e piroozi ye gheyr e Zamaani ye monaaseb entekhaab konid.
检验对整体战略、时机和局势判断的掌握；是玩家主动选择的高手目标。 = Tasallot e khod bar raahbord, zamaanbandi va vaz'iyat raa biyaazmaayid. In chaalesh e herfe i ekhtiyaari ast.
让唯一城市承担科研、经济与防卫，寻找单城条件下的完整发展解法。 = Yek shahr raa baraaye pazhoohesh, eghtesaad va defaa' be kaar bebarid va dar in mahdoodiyat raahbord e kaamel besaazid.
主动放弃世界奇观这条优势来源，探索政策、城市发展与文化胜利之间的其他组合。 = Az Ojoobehaaye Jahaani sarf e nazar va raahhaaye digar e tarkib e siyaasat, tose'e ye shahr va piroozi ye farhangi raa kaavosh konid.
