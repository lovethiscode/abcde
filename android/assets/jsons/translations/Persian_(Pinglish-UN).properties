Great Attila, mighty warrior and leader of the Hunnic empire, your men bow down before you. During the 5th century, you and your brother Bleda have conquered many lands, forged a mighty empire and commanded the most powerful and frightening force of antiquity. You inspired fear to the Roman Emperors themselves, who called you 'Flagellum Dei', the 'Scourge of God', as you took kingdom after kingdom in the Balkans, invaded Eastern Roman Empire, into Gaul and Northern Italy, and planned to conquer Rome itself. Your empire didn't survive long after your death, but your name and your legend have, for millenia to come. = Aatilaaye bozorg, jangaavar e niroomand va rahbar e emperaatoori ye Hoon, mardaanat dar baraabarat sar kham mikonand. Dar sade ye 5, to va baraadarat Bleda sarzaminhaaye bisyaari raa fath kardid, emperaatoori ye niroomandi saakhtid va niroomandtarin va tarsnaaktarin niroo ye roozegaar e baastaan raa farmaandehi kardid. Hatta emperaatooraan e Room raa tarsaandi; aanhaa to raa «Flagellum Dei», «Taaziyaane ye Khodaa», minaamidand, cheraa ke paadeshaahihaa ye Balkan raa yeki pas az digari gerefti, be Emperaatoori ye Room e Sharghi, Gol va Shomaal e Itaaliaa hamle kardi va ghasd e fath e khod e Room raa daashti. Emperaatoori at pas az margat ziyaad davaam nayaavard, amma naam va afsaane at baraaye hezaarehaaye ba'adi baaghi maand.
Fearsome General, your mighty hordes are at your command, waiting to crush your foes once again and to conquer all the riches the world has to offer! Will your new empire shine through the ages of history? = Sardaar e vahshat-aavar, ordoohaaye niroomandat dar farmaan e to hastand, montazerand taa dobaare doshmanaanat raa dar ham beshkanand va hame ye servati raa ke jahaan arze mikonad fath konand! Aayaa emperaatoori ye jadidat dar tool e asrhaaye taarikh khaahad derakhshid?
