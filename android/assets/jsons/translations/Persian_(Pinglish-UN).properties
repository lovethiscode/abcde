Isabella = Izaabel
God will probably forgive you... but I shall not. Prepare for war. = Khodaa shaayad to raa bebakhshad… amma man nakhaaham bakhshid. Baraaye jang aamaade baash.
Repugnant spawn of the devil! You will pay! = Zaade ye nafrat-angiz e sheytaan! Tavaan khaahi daad!
If my defeat is, without any doubt, the will of God, then I will accept it. = Agar shekast e man bi hich shak eraade ye Khodaa ast, aan raa mipaziram.
God blesses those who deserve it. I am Isabel of Spain. = Khodaa be shaayestegaan barakat midahad. Man Isabel e Espaaniyaa hastam.
I hope this deal will receive your blessing. = Omidvaaram in tavaafogh az barakat e shomaa barkhordaar shavad.
Seven Cities of Gold = Haft Shahr e Talaa
Holy Isabella, envoy of God, Great Queen of Castille and León, your people celebrate you! Spain is a beautiful and ancient country, a link between Europe and Africa, one shore on the Mediterranean and the other on the mighty Atlantic Ocean. The Spanish culture had taken the best of the Christian and Muslim worlds, and was ready to dominate the world for centuries. Powerful Spanish military fleets and brave explorers found and conquered much of the New World. Exploiting a whole new continent and its riches, Spain reached a state of power few could compete with for hundreds of years. = Ey Isabella ye moghaddas, ferestaade ye Khodaa, Malake ye bozorg e Castille va Leon, mardomat to raa jashn migirand! Espaaniyaa keshvari zibaa va kohan, peyvandi miyaan e Ooroopaa va Aafriqaa, baa yek saahel bar Mediteraane va saaheli digar bar Oghyaanoos e niroomand e Atlas ast. Farhang e Espaaniyaa behtarin haaye jahaan e Masihi va Mosalmaan raa gerefte bood va baraaye solte bar jahaan dar sade haaye aayande aamaade bood. Naavgaan haaye nezami ye niroomand va kaavesh-garaan e delavar e Espaaniyaa bakhsh e bozorgi az Jahaan e No raa kashf va taskhir kardand. Baa bahrebardaari az yek ghaarre ye jadid va servat haaye aan, Espaaniyaa be ghodrati resid ke baraaye sad haa saal kam kasi mitavaanest baa aan reghaabat konad.
O splendid and virtuous Isabella! By the will of the heavens, will Spain reborn to achieve its holy destiny and become a new El Dorado? Will your new empire shine through the ages of history? = Ey Isabella ye derakhshaan va paakdaaman! Aayaa be khaast e aasemaan Espaaniyaa dobaare zaade mishavad taa sarnevesht e moghaddas e khod raa beja aavarad va El Dorado ye jadidi shavad? Aayaa emperaatoori ye jadidat dar asr haaye taarikh khaahad derakhshid?
