George Washington = Jorj Vaashington
Your wanton aggression leaves us no choice. Prepare for war! = Tajaavoz e bikheradaane ye shomaa entekhaabi baraaye maa nemigozaarad. Baraaye jang aamaade shavid!
You have mistaken our love of peace for weakness. You shall regret this! = Solh-doosti ye maa raa baa za'f eshtebaah gerefte id. Pashimaan khaahid shod!
The day...is yours. I hope you will be merciful in your triumph. = Emrooz… az aan e to ast. Omidvaaram dar piroozi-at mehrabaan baashi.
The people of the United States of America welcome you. = Mardom e Eyaalaat e Mottahede ye Aamrikaa be shomaa khosh-aamad migooyand.
Is the following trade of interest to you? = Aayaa in tejaarat nazarat raa jalb karde ast?
Well? = Khob?
Manifest Destiny = Sarnevesht e Aashekaar
President Washington, we salute you and the proud American civilization! Freed from the British dominion in the 18th century, then cleansed and reborn after a terrible civil war, the United States nation was ready to play its great role in the 20th century. At the height of its power, triumphant after two terrible world wars, United States of America, a land of immigration, opportunities, optimism and determination, has risen above all other weakening nations, unable to equal such power. = Ey Ra'is-jomhoor Washington, be to va tamaddon e sarafraaz e Aamrikaa dorood miferestim! Pas az rahaayi az solte ye Britaaniyaa dar sade ye 18, va sepas paakshodan va nowzaayi pas az jangi daakheli va vahshatnaak, mellat e Eyaalaat e Mottahede aamaade bood naghsh e bozorg e khod raa dar sade ye 20 ifaa konad. Dar owj e ghodrat va pirooz pas az do jang e jahaani ye vahshatnaak, Eyaalaat e Mottahede ye Aamrikaa, sarzamin e mohaajerat, forsat haa, khoshbini va azm, bar tamaam e mellat haaye roobe-za'f ke tavaan e baraabari baa aan raa nadaashtand bartari yaaft.
President Washington, will you show to the world the legitimacy of the American way of life, and spread the flame of liberty to all mankind? Will your new empire shine through the ages of history? = Ey Ra'is-jomhoor Washington, aayaa haqaaniyat e ravesh e zendegi ye Aamrikaayi raa be jahaan neshaan khaahi daad va sho'le ye aazaadi raa be hame ye bashar gostaaresh khaahi daad? Aayaa emperaatoori ye jadidat dar asr haaye taarikh khaahad derakhshid?
