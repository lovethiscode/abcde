The ancient fire flashing across the sky is what proclaimed that this day would come, though I had foolishly hoped for a different outcome. = Aatash e kohan ke dar aasemaan derakhshid khabar daad ke in rooz khaahad resid, harchand naadaanaane be sar-anjaami digar omid daashtam.
It is obvious now that I misjudged you and your true intentions. = Aknoon roshan ast ke dar baare ye to va niyat haaye vaaghei-at eshtebaah ghezavat kardam.
The hard-shelled crab yields, and the lion lies down to sleep. Kanaloa comes for me now. = Kharchang e sakhtpoost taslim mishavad va shir baraaye khaab deraaz mikeshaad. Kanaloa aknoon be soragh e man miyaayad.
The ocean's tide may rise and fall, but my resolve stands steady. = Mado-jazr e oghyaanoos shaayad baalaa va paayin ravad, amma azm e man ostovaar mimaanad.
Aloha! Greetings and blessings upon you, friend. I am Kamehameha, Great King of this strand of islands. = Aloha! Dorood va barakat bar to, doost. Man Kamehameha, Shaah e bozorg e in reshte ye jazaayer, hastam.
Come, let our people feast together! = Biyaa, begozaar mardomaan e maa baa ham jashn begirand!
Welcome, friend! = Khosh oomadi, rafigh!
Wayfinding = Masiryaabi
Aloha to Kamehameha the Great, who the heavens allowed to unite your people! O great King, under your reign, the Big Island of Hawai'i became one in 1791 AD, and many other islands joined your vision of union in 1810. As the first King of Hawai'i, law and taxation systems were stabilized, and you promoted the Kanawai Mamalahoe, an edict to protect civilian people in times of war. Unification and sovereignty of all the islands continued thanks to your fair laws and deeds, even after you joined your ancestors in paradise in 1819. = Aloha be Kamehameha ye Bozorg, ke aasemaan be oo ejaze daad mardomash raa yeki konad! Ey Shaah e bozorg, dar farmaanravaayi ye to Jazire ye Bozorg e Hawai'i dar 1791 milaadi yeki shod va besyaari az jazaayer e digar dar 1810 be royaye ettehaad e to peyvastand. Be onvaan e avvalin Shaah e Hawai'i, nezaam haaye ghanoon va maaliyaat saabet shodand va to Kanawai Mamalahoe, farmaani baraaye hefaazat az mardom e gheyr e nezami dar zamaan e jang, raa tarvij kardi. Be lotf e ghavaanin va aamaal e aadelane ye to, ettehaad va haakemiyat e hame ye jazaayer edaame yaaft, hatta pas az aan ke dar 1819 dar behesht be niaakaanat peyvasti.
Wise and benevolent King, will you unite your people once again by wearing the bright mantle of the Lion of the Pacific? Will your new empire shine through the ages of history? = Ey Shaah e daanaa va nik-khaah, aayaa baa pooshidan e redaaye derakhshaan e Shir e Oghyaanoos e Aaraam dobaare mardomat raa yeki mikoni? Aayaa emperaatoori ye jadidat dar asr haaye taarikh khaahad derakhshid?
