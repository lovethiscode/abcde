I have tried all other avenues, but yet you persist in this madness. I hope, for your sake, your end is swift. = Hame ye raahhaaye digar raa aazmoodam, amma hanooz bar in divaanegi esraar mikoni. Baraaye khaater e khodet omidvaaram paayaanat zood beresad.
It is silence that allows evil to triumph. We will not stand mute and allow you to continue on this mad quest unchecked. = Sokoot ast ke be badi ejaaze ye piroozi midahad. Saaket nemiistim taa in talaash e divaanevaar raa bedoon e jologiri edaame dahid.
God and history will remember your actions this day. I hope you are ready for your impending judgment. = Khodaa va taarikh kaarhaaye emroozat raa be yaad khaahand daasht. Omidvaaram baraaye daavari ye nazdik aamaade baashi.
What a waste of time. = Che etlaaf e vaghti.
A thousand welcomes to our fair nation. I am Selassie, the Ras Tafari Makonnen and Emperor of Ethiopia, your humble servant. = Hezaar baar be mihan e zibaaye maa khosh aamadid. Man Selaase, Raas Taafaari Makonnen va emperaator e Etiyoopi, khedmatgozaar e forootan e shomaa hastam.
I request that you consider this offer between our two peoples. I believe it will do us both good. = Az shomaa mikhaahamin pishnahaad e beyne do mardomemaan raa barrasi konid. Baavar daaram baraaye har do maa soodmand khaahad bood.
Spirit of Adwa = Rooh e Advaa
May God bless you, wise and righteous Emperor of Ethiopia, Haile Selassie. As one of Ethiopia's greatest rulers and a spiritual leader of the Rastafarian movement, your good influence on diplomacy and political cooperation are praised throughout the world. You created Ethiopia's first written constitution, and favorized democracy for years to come, your great wisdom making Ethiopia enter as a charter member in the United Nations. Always aiming to reform and modernize your nation, you changed Ethiopian destiny for the best. = Khodaa to raa barkat dahad, Haayle Selaase, emperaator e daanaa va daadgar e Etiyoopi. Be onvaan e yeki az bozorgtarin farmaanravaayaan e Etiyoopi va rahbar e ma'navi ye jonbesh e Raastafaari, taasir e nik e to bar diplomaasi va hamkaari ye siyaasi dar saraasar e jahaan setaayesh mishavad. Nakhostin ghaanoon e asaasi ye neveshte ye Etiyoopi raa saakhti va baraaye saalhaaye aayande az mardomsaalaari poshtibaani kardi; kherad e bozorgat Etiyoopi raa be ozvi ye bonyangozaar e Saazmaan e Melal e Mottahed dar aavard. Hamvaare khaahaan e eslaah va novsaazi ye mihanat boodi va sarnevesht e Etiyoopi raa behtar kardi.
Revered King, your knowledge and intelligence are required once again to protect your people from many threats in the world. Will you secure peace and stability, with benevolence and authority, in the radiance of the Kebra Nagast? Will your new empire shine through the ages of history? = Paadeshaah e mohtaram, daanesh va hooshat dobaare baraaye hefaazat az mardomat dar baraabar e tahdidhaaye besyaar e jahaan laazem ast. Aayaa baa mehrabaani va eghtedaar, dar partov e Kebra Naagast, solh va sobaat raa tazmin mikoni? Aayaa emperaatoori ye jadidat dar tool e asrhaaye taarikh khaahad derakhshid?
