Most achievements allow any difficulty and need at least 1 AI opponent. Only N30, N36, N37, N38 and N39 require the stated difficulty and at least 3 AI opponents. You need not enable all victory routes. All game speeds are allowed. Any victory includes Time. Religion achievements require religion to be enabled. = Bishtar e dastaavardhaa dar har doshvaari mojaaz va niyaazmand e hadd aghal 1 raghib e Hoosh e Masnoo'i hastand. Faghat N30, N36, N37, N38 va N39 doshvaari ye neveshte va hadd aghal 3 raghib e Hoosh e Masnoo'i mikhaahand. Fa'aal kardan e hame ye raahhaaye piroozi laazem nist. Hame ye sor'athaaye baazi mojaazand. Har piroozi shaamel e Zamaani ast. Dastaavardhaaye dini din e fa'aal mikhaahand.
N38 forbids ever owning a second city, including founding, conquest, puppets, trades and brief ownership. N39 forbids ever owning a World Wonder by any means; losing it later does not erase that branch's history. N26 collects 8 distinct self-built World Wonders across qualifying new games. N40 requires the other 39 new medals; old medals never substitute for them. = N38 hich maalikiyat e shahr e dovvom, az raah e bonyan, fath, dastneshaandegi, tejaarat yaa maalikiyat e kootaah, raa nemipazirad. N39 hich maalikiyat e Ojoobe ye Jahaani az hich raahi raa nemipazirad; az dast daadan e ba'di saabeghe ye shaakhe raa paak nemikonad. N26, 8 Ojoobe ye Jahaani ye motefaavet e khodsaakhte dar baazihaaye taaze ye vaajed e sharaayet jam' mikonad. N40 be 39 medaal e jadid e digar niyaaz daarad; medaalhaaye ghadimi hargez jaaygozin nemishavand.
