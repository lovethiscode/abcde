Darius I = Daryoosh I
Your continue existence is an embarrassment to all leaders everywhere! You must be destroyed! = Edaame ye vojood e shomaa baraaye hame ye rahbaraan dar har jaa sharm-aavar ast! Baayad naabood shavid!
Curse you! You are beneath me, son of a donkey driver! I will crush you! = La'nat bar to! Az man pasti, ey pesare kharbaan! To raa khord khaaham kard!
You mongrel! Cursed be you! The world will long lament your heinous crime! = Dorage! La'nat bar to! Jahaan taa moddat haa baraaye jenaayat e nafrat-angiz e to soogvaari khaahad kard!
Peace be on you! I am Darius, the great and outstanding king of kings of great Persia... but I suppose you knew that. = Dorood bar to! Man Daaryoosh, shaahanshaah e bozorg va barjaste ye Iran e bozorg hastam… amma gomaan mikonam in raa midaanesti.
In my endless magnanimity, I am making you this offer. You agree, of course? = Dar bakhshandegi ye bipayaan e khod in pishnahaad raa midaham. Albatte movaafeghi?
Good day to you! = Roozat bekheyr!
Ahh... you... = Aaoo... to...
Achaemenid Legacy = Miraas e Hakhaamaneshi
Great King Darius of Persia, the heaven casts its light upon you! Persian people are strong and wise, as their leader. In old ages, the great Persian king Cyrus fought back the mighty Median empire and finally destroyed the Medes in 550 BC. Cunning diplomacy and military achievements helped then to conquer the wealthy Lydia and the powerful Babylon, Cyrus' son conquering the eternal Egypt some years later. At the height of its power, the Persian Empire reached the shores of Macedonia, at the very door of the upstart Greek city-states. Persia would have prospered for centuries if Alexander of Macedon hadn't brutally destroyed the great empire in one violent strike. = Ey Shaah e bozorg Daaryoosh e Iran, aasemaan noor e khod raa bar to mitaaband! Mardom e Iran hamchon rahbar e khod niroomand va daanaa and. Dar roozgaare kohan, Shaah e bozorg e Iran Kooroosh baa emperaatoori ye niroomand e Maad jangid va sar-anjaam dar 550 pish az milaadi Maad haa raa naabood kard. Siyaasat e zirakaane va dastaavard haaye nezami sepas be taskhir e Lydia ye servatmand va Baabel e niroomand komak kard; pesare Kooroosh chand saal baad Mesr e jaavdaan raa taskhir kard. Dar owj e ghodrat, Emperaatoori ye Iran be saahel haaye Macedonia, dorost be darvaaze ye shahr-dowlat haaye nowkh-aaste ye Yoonaani, resid. Iran mitavaanest baraaye sade haa ronaagh yaabad agar Alexander e Macedon aan emperaatoori ye bozorg raa baa yek zarbe ye khoshoonatbaar naabood nakarde bood.
King Darius, the people of Persia await, longing for its past glory and power! Persia of the Immortals must reborn, to punish its foes and rebuild the gleaming Persepolis! Will your new empire shine through the ages of history? = Ey Shaah Daaryoosh, mardom e Iran moshtaagh e shokooh va ghodrat e gozashte montazerand! Iran e Jaavdaanaan baayad dobaare zaade shavad taa doshmana-nash raa keifar dahad va Persepolis e derakhshaan raa besaazad! Aayaa emperaatoori ye jadidat dar asr haaye taarikh khaahad derakhshid?
