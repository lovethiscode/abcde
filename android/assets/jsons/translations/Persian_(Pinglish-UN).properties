Great King Alexander, leader of the mighty Greek nation, you are truly blessed by the gods. In 480 BC, quarrelsome city-states such as Athens, Sparta, Thebes, found a way to join their forces, allowing Greece to defeat the mighty Persia in the 5th century BC, both on land and sea. Following their example, you lead a Greek coalition and finally struck down the Persian Empire in 331 BC. You conquered almost all the known world, and from Europe to Africa to India, you built an empire unmatched by any before it. = Ey Shaah e bozorg Alexander, rahbar e mellat e niroomand e Yoonaan, to be raasti mored e mehr e khodaayaan hasti. Dar 480 pish az milaadi, shahr-dowlat haaye setizejoo chon Athens, Sparta va Thebes raahi baraaye ettehaad e niroo haa yaaftand, ke be Yoonaan emkaan daad dar sade ye 5 pish az milaadi Iran e niroomand raa ham dar khoshki va ham dar daryaa shekast dahad. Baa peyrovi az aanhaa, to ettehaad e Yoonaani raa rahbari kardi va sar-anjaam dar 331 pish az milaadi emperaatoori ye Iran raa sarnegoon kardi. Taghriban tamaam e jahaan e shenaakhte-shode raa taskhir kardi va az Ooroopaa taa Aafriqaa va Hend, emperaatoori yi saakhti ke pish az aan hich hamtaa nadaasht.
