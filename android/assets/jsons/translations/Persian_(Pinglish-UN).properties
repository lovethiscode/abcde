# Game Center achievements V2
A Thousand Lights = Hezaar Cheraagh
A civilization's spirit begins with its first principle. = Rooh e tamaddon baa nakhostin asl e aan aaghaaz mishavad.
A first belief becomes a lasting tradition. = Nakhostin baavar be sonnati paaydaar tabdil mishavad.
A first handshake brings the world a little closer. = Nakhostin dast daadan, jahaan raa kami nazdiktar mikonad.
A full treasury reflects years of patient stewardship. = Khazaane ye por, baaztaab e saalhaa sarparasti ye sabooraane ast.
A small nation chooses to stand beside you. = Mellati koochak entekhaab mikonad dar kenaar e shomaa biistad.
A small settlement now glows with countless lights. = Abaadi ye koochak halaa baa cheraaghhaaye bi shomaar miderakhshad.
A true crown is earned through a tested victory. = Taaj e vaaghe'i baa piroozi ye aazmoode be dast miaayad.
Achievement guide = Raahnamaa ye Dastaavardhaa
Achievement unlocked = Dastaavard baaz shod
Achievements = Dastâvardhâ
Across the ages, your monuments remain. = Yaadboodhaayat dar tool e asrhaa baaghi mimaanand.
Adopt a social policy, including a branch opener. = Yek siyaasat e ejtemaayi bepazirid; baazkonande ye shaakhe niz hesaab mishavad.
Adopt your first social policy. Opening a policy branch counts. = Nakhostin siyaasat e ejtemaayi raa bepazirid. Baaz kardan e shaakhe ye siyaasat hesaab mishavad.
Against mighty opponents, you still write your own ending. = Hatta dar baraabar e doshmanaane ghavi, paayaan e khod raa minevisid.
Age of Wonders = Asr e Ojoobehaa
An empire's greatness takes root in every city. = Bozorgi ye emperaatoori dar har shahr rishe midaavanad.
Art of Governance = Honar e Hokoomatdaari
As China, have the same Chu-Ko-Nu destroy 2 different military units belonging to other major civilizations during one of your turns. = Be onvaan e Chin, hamaan Chu-Ko-Nu dar yeki az nobathaaye shomaa 2 niroo ye nezaami ye motefaavet az tamaddonhaaye bozorg e digar raa naabood konad.
As Egypt, build 3 different World Wonders in one game. Winning is not required. = Be onvaan e Mesr, dar yek baazi 3 Ojoobe ye Jahaani ye motefaavet besaazid. Piroozi laazem nist.
As Persia, capture 3 different foreign cities in combat during one continuous Golden Age. Extending that Golden Age still counts as the same period. = Be onvaan e Iran, dar yek Asr e Talaai ye peyvaste 3 shahr e bigaane ye motefaavet raa dar nabard fath konid. Edaame daadan e hamaan Asr e Talaai, hamaan dore hesaab mishavad.
As Rome, simultaneously own 4 self-founded cities that each have a Monument and a Granary. The capital and purchased buildings count. = Be onvaan e Room, hamzamaan 4 shahr e khodsaakhte daashte baashid ke har yek Yaadbood va Anbaar e Ghalle daarad. Paaytakht va saakhtemaan e kharidshode hesaab mishavand.
Battle capture counts after combat and the occupation choice finish and the city belongs to you. Trades, gifts, direct liberation to a third party and city destruction do not count. Experience promotions exclude free and starting promotions; normal upgrades preserve the same unit's record. Simultaneous conditions cannot be added across different moments. = Fath e jangi faghat pas az takmil e nabard va entekhaab e eshghaal va maalikiyat e shahr hesaab mishavad. Tejaarat, hadiye, aazaadsaazi ye mostaghim be taraf e sevvom va naaboodi ye shahr hesaab nemishavand. Erteghaa ye tajrobe i, erteghaahaaye raaygaan va aaghaazin raa shaamel nemishavad; behsaazi ye mamooli saabeghe ye hamaan niroo raa hefz mikonad. Sharaayet e hamzamaan raa nemitavaan az lahzehaaye mokhtalef jam' kard.
Battle-Hardened = Battle-Hardened
Be allied with at least 3 City-States at the same time. = Hamzamaan baa hadd aghal 3 Shahr-dowlat mottahed baashid.
Become a City-State's ally. = Mottahed e yek Shahr-dowlat shavid.
Become the ally of a City-State. = Be hampeymaan e yek Shahr-dowlat tabdil shavid.
Before the bowstring rests, the enemy line has broken. = Pish az aaraam gereftan e zeh e kamaan, saf e doshman shekaste ast.
Belief crosses the border and takes root far away. = Baavar az marz migozarad va dar door dast rishe migirad.
Beyond the Stars = Faraasooye Setaaregaan
Beyond the border, another banner rises. = Faraatar az marz, parcham e digari bar miaayad.
Book of Civilizations = Ketaab e Tamaddonhaa
Border Guardian = Negahbaan e Marz
Build 8 different World Wonders across qualifying new games. Each type counts once, even across repeated saves. = Dar baazihaaye jadid e vaajed e sharaayet 8 Ojoobe ye Jahaani ye motefaavet besaazid. Har noe faghat yek baar hesaab mishavad, hatta dar zakhirehaaye tekraari.
Build 8 different World Wonders across qualifying new games; each type counts once. = Dar baazihaaye jadid e vaajed e sharaayet 8 Ojoobe ye Jahaani ye motefaavet besaazid; har noe yek baar hesaab mishavad.
Build World Wonders yourself in any city you own; Great Engineer acceleration is allowed. National Wonders and wonders already present in acquired cities do not count as built. Different wonders are counted by type. Foreign cities were founded by other major civilizations; repeated captures of the same city count once. = Dar har shahr e khod, Ojoobehaaye Jahaani raa khodetaan besaazid; tasri' baa Mohandes e Bozorg mojaaz ast. Ojoobehaaye Melli va ojoobehaaye az ghabl mojood dar shahr e kasbshode, saakhte hesaab nemishavand. Anvaa' e motefaavet e ojoobe hesaab mishavand. Shahr e bigaane raa tamaddon e bozorg e digar bonyan gozaashte; fath e tekraari ye hamaan shahr yek baar hesaab mishavad.
Build a World Wonder. Great Engineers count; National Wonders do not. = Yek Ojoobe ye Jahaani besaazid. Mohandes e Bozorg hesaab mishavad; Ojoobe ye Melli na.
Build your first World Wonder. Great Engineer acceleration counts; National Wonders do not. = Nakhostin Ojoobe ye Jahaani raa besaazid. Tasri' baa Mohandes e Bozorg hesaab mishavad; Ojoobe ye Melli na.
By the Nile, stone begins to tell the story of your age. = Kenaar e Nil, sang daastaan e asr e shomaa raa aaghaaz mikonad.
Capture 2 different foreign cities in combat during one of your turns. Losing military units does not disqualify you. = Dar yeki az nobathaaye khod 2 shahr e bigaane ye motefaavet raa dar nabard fath konid. Az dast daadan e niroo ye nezaami shomaa raa rad e salaahiyat nemikonad.
