Boudicca = Boodikaa
You shall stain this land no longer with your vileness! To arms, my countrymen. We ride to war! = Digar in sarzamin raa baa palidi at aaloode nakhaahi kard! Hammiha naan, be salaah! Be jang miravim!
Traitorous man! The Celtic peoples will not stand for such wanton abuse and slander - I shall have your balls! = Mard e khiyaanatkaar! Mardom e Selt in badraftaari va bohtaan e bi-dalil raa tahammol nakhaahand kard — tokhmhaayat raa khaaham gereft!
Vile ruler, know you have won this war in name alone. Your cities lie buried and your troops defeated. I have my own victory. = Farmaanravaa ye palid, bedaan ke faghat dar naam in jang raa borde i. Shahrhaayat zir e aavaarand va niroohaayat shekast khorde and. Man piroozi ye khod raa daaram.
Don't forget who you're dealing with. Arrogant moves can get you in danger. = Faraamoosh nakon baa che kasi taraf hasti. Harekat e maghrooraane mitavaanad to raa be khatar biandaazad.
I am Boudicca, Queen of the Celts. Let no-one underestimate me! = Man Boodikaa, malake ye Selthaa, hastam. Hich kas maraa dast e kam nagirad!
Let us join our forces together and reap the rewards. = Biyaayid niroohaayemaan raa yeki konim va paadaash begirim.
God has given good to you. = Khodaa be to neki bakhshide ast.
Druidic Lore = Daanesh e Drooidi
May glory and honor always be upon you, Warrior Queen! In a time dominated by men, you successfully claimed the throne and the power, but also valiantly defied the mighty Roman Empire. Punished and humiliated by the hand of the Roman bloody invaders, you united your people and led a terrible revolt, to seek revenge. Many legions fell under your fierce attacks and you burned the city of London with your anger. While the Romans still kept ownership of your land after your final defeat, your actions nonetheless showed Rome that this land could never be fully conquered, making Nero himself consider to withdraw all troops and leaving Britain forever. = Ey malake ye jangaavar, shokooh va eftekhaar hamishe baa to baad! Dar roozegaari ke mardaan hokoomat mikardand, baa movaffaghiyat takht va ghodrat raa be dast aavardi va deliraane dar baraabar e Emperaatoori ye niroomand e Room istaadi. Be dast e mohaajemaan e khoonriz e Room mojaazaat va tahghir shodi; mardomat raa mottahed kardi va baraaye enteghaam shooresh e bozorgi raah andaakhti. Legionhaaye besyaari dar hamlehaaye sakht e to foroo rikhtand va shahr e Landan raa baa khashmat soozaandi. Har chand Roomihaan pas az shekast e nahaayi at hamaana maalik e sarzaminat maandand, kaarhaayat be Room neshaan daad ke in sarzamin hargez be toor e kaamel fath shodani nist, taa jaayi ke khod e Nero be fekr e biroon keshidan e hame ye niroohaa va tark e hamishegi ye Britaaniyaa oftaad.
O raging lioness, will you lead the Celts again under the glory of your name, to spread the fires of liberty, and achieve a final victory? Will your new empire shine through the ages of history? = Ey shir e maade ye khashmgin, aayaa dobaare Selthaa raa dar shokooh e naamat rahbari mikoni taa aatashhaaye aazaadi raa begostaraanand va piroozi ye nahaayi be dast aavarand? Aayaa emperaatoori ye jadidat dar tool e asrhaaye taarikh khaahad derakhshid?
