Theodora = Teoodooraa
It is always a shame to destroy a thing of beauty. Happily, you are not one. = Naabood kardan e chizi zibaa hamishe afsoos daarad. Khoshbakhtaane to zibaa nisti.
Now darling, tantrums are most unbecoming. I shall have to teach you a lesson. = Halaa azizam, badkholghi aslan beraazande nist. Majbooram darsi be to bedaham.
Like a child playing with toys you are. My people will never love you, nor suffer this indignation gracefully. = Maanand e koodaki hasti ke baa asbaab-baazi baazi mikonad. Mardomam hargez doostat nakhaahand daasht va in tahghir raa baa aaraamesh tahammol nakhaahand kard.
My, isn't this a pleasant surprise - what may I call you, oh mysterious stranger? I am Theodora, beloved of Byzantium. = Oh, che ghaafelgiri ye delpaziri — to raa che benaamam, ey bigaane ye raazaalood? Man Teoodooraa, mahboob e Bizaans, hastam.
I have heard that you adept at certain kinds of ... interactions. Show me. = Shenide am ke dar barkhi az ... barhamkoneshhaa maaheri. Neshaanam bede.
Hello again. = Salaam e dobaare.
Patriarchate of Constantinople = Patriyaarkhneshini ye Ghestantaniye
Magnificent Empress Theodora, beloved of Byzantium and of Rome, your people salute you! With your beauty and intelligence, you rose up from actress and courtesan to the rank of the most powerful woman in the Roman Empire, as wife of Justinian I. In the late 520's AD, you helped your husband engage in spiritual and legal reforms, promugalting numerous laws to improve women's status and treatment in the empire. You also made of Constantinople the jewel of the Eastern Roman Empire with the restoration and construction of many aqueducts, bridges, and churches, its beauty culminating with the creation of the Hagia Sophia, one of the most splendid pieces of architecture in the world. = Emperaatorbaanoo ye baashokooh Teoodooraa, mahboob e Bizaans va Room, mardomat be to dorood migooyand! Baa zibaayi va hooshat, az baazigari va faaheshegi be jaaygaah e niroomandtarin zan e Emperaatoori ye Room, be onvaan e hamsar e Zhoostinian e I, residi. Dar avaakher e dahe ye 520 milaadi, be hamsarat dar eslaahaat e ma'navi va hoghooghi komak kardi va ghavaanin e besyaari baraaye behbood e jaaygaah va raftaar baa zanaan dar emperaatoori e'laam kardi. Hamchenin baa baazsaazi va saakht e aabrohaa, polhaa va kelisaa haaye besyaar, Ghestantaniye raa be gohar e Emperaatoori ye Room e Sharghi tabdil kardi; zibaayi ye aan baa saakht e Ayaa Soofyaa, yeki az baashokoohtarin aathaar e memaari ye jahaan, be ooj resid.
Beautiful Empress,the Byzantine Empire's magnificence is intact in all memories, and ready to reborn as the new jewel of humankind. Will your new empire shine through the ages of history? = Emperaatorbaanoo ye zibaa, shokooh e Emperaatoori ye Bizaans dar hame ye yaadhaa dastnakhoorde ast va aamaade ast taa be onvaan e gohar e jadid e bashariyat dobaare zaade shavad. Aayaa emperaatoori ye jadidat dar tool e asrhaaye taarikh khaahad derakhshid?
