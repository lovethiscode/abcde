Xi-miqa-can! Xi-miqa-can! Xi-miqa-can! (Die, die, die!) = Xi-miqa-can! Xi-miqa-can! Xi-miqa-can! (Bemir, bemir, bemir!)
Excellent! Let the blood flow in raging torrents! = Aali! Begozar khoon dar seyl haaye khorooshaan jaari shavad!
Monster! Who are you to destroy my greatness? = Heyoolaa! To kisti ke bozorgi ye man raa naabood koni?
What do I see before me? Another beating heart for my sacrificial fire. = Dar baraabaram che mibinam? Ghalbi tapande ye digar baraaye aatash e ghorbaani-am.
Accept this agreement or suffer the consequences. = In tavaafogh raa bepazir yaa payaamad haayash raa tahammol kon.
Welcome, friend. = Khosh aamadi, rafigh.
Sacrificial Captives = Asiraan e ghorbaani
O divine Montezuma, your people welcome you! May your magnificence inspire all living things! The mighty Aztecs were nomads until the 12th century, when they choose to settle in the mesa central, which would later be called Mexico. Wars were frequent with other tribes to control the rich land surrounding the sacred lakes of Texcoco, Xaltocan and Zampango. In some 200 years, double-sided alliances and martial prowess made of the Aztecs the dominant power in the Central American basin, forming a mighty empire stretching from sea to sea. Alas, the empire fell under the assault of foreign devils - the Spaniards and many curses they brought with them! Wars between tribes and weaponry of doom used by the invaders made the great Aztec civilization crumble in only a few decades. = Ey Montezuma ye khodaagoon, mardomat be to khosh-aamad migooyand! Shokooh e to ilhaambakhshe hame ye jaandaraan baad! Aztec haaye niroomand taa sade ye 12 kooch-neshin boodand; sepas dar falaat e markazi ke baadan Mexico naam gereft saaken shodand. Baraaye kontorol e zamin haaye ghani ye dore daryaache haaye moghaddas e Texcoco, Xaltocan va Zampango baa ghabile haaye digar jang haa besyaar bood. Dar hodood e 200 saal, ettehaad haaye dosooye va maharat e jang Aztec haa raa be ghodrat e mosallat e howze ye Aamrikaaye Markazi tabdil kard va emperaatoori yi niroomand az daryaa taa daryaa saakht. Afsos ke emperaatoori zire hamle ye sheytaan haaye bigaane, Espaaniyaayi haa va nafrin haaye besyaari ke baa khod aavardand, soghoot kard! Jang haaye beyn e ghabile haa va selaah haaye viraan-gar e hamlevaraan tamaddon e bozorg e Aztec raa tanhaa dar chand dahe foroo-paashid.
O mighty King Montezuma, do you hear the call of your people seeking for revenge? Will you lead them to victory under the light of the Five Suns? Will your new empire shine through the ages of history? = Ey Shaah Montezuma ye niroomand, aayaa sedaaye mardomat raa ke enteghaam mikhaahand mishenavi? Aayaa zire noor e Panj Khorshid aanhaa raa be piroozi rahbari mikoni? Aayaa emperaatoori ye jadidat dar asr haaye taarikh khaahad derakhshid?
