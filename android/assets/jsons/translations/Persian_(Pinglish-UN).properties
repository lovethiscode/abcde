# Refactored menu and window localization
1. Tap Create room, choose the rules and map, then share the invitation. = 1. «Saakhtan-e otaagh» raa bezanid, ghavaanin va naghshe raa entekhaab konid, sepas daavat raa be eshteraak begozaarid.
1. The Android player copies their Player ID from Multiplayer and sends it to the iOS host. = 1. Baazikon-e Android ID-ye khod raa az «Chand-nafare» kopi mikonad va baraaye mizbaan-e iOS mifrestad.
2. In an empty player seat, the host taps Add player manually, pastes the Player ID, taps the portrait to choose a civilization, then taps Mark ready. = 2. Dar yek jaaygaah-e khaali, mizbaan «Afzoodan-e dasti-ye baazikon» raa mizanad, ID-ye baazikon raa migozaarad, baraaye entekhaab-e tamaddon rooye tasvir mizanad va sepas «Aamaade» raa entekhaab mikonad.
2. Other iOS players open the invitation or paste it in Join by invitation, tap their civilization portrait to choose, then tap Ready. = 2. Baazikonhaaye digar-e iOS daavat raa baaz mikonand ya aan raa dar «Peyvastan baa daavat» migozaarand. Baraaye entekhaab-e tamaddon rooye tasvir mizanand va sepas «Aamaade» raa mizanand.
3. After starting, the Game ID is copied automatically. Send it to the Android player to add the game in Multiplayer. = 3. Pas az shoroo, ID-ye baazi khodkaar kopi mishavad. Aan raa baraaye baazikon-e Android befrestid taa baazi raa dar «Chand-nafare» ezaafe konad.
3. The host is ready automatically. When everyone is ready, the host taps Start game. No Player ID or Game ID exchange is needed. = 3. Mizbaan khodkaar aamaade ast. Vaghti hame aamaade shodand, mizbaan «Shoroo-e baazi» raa mizanad. Tabaadol-e ID-ye baazikon ya baazi laazem nist.
