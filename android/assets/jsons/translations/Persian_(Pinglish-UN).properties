Askia = Askia
You are an abomination to heaven and earth, the chief of ignorant savages! You must be destroyed! = To nafrin e aasemaan va zamin, sarvare vahshi haaye naadaan hasti! Baayad naabood shavi!
Fool! You have doomed your people to fire and destruction! = Naadaan! Mardomat raa be aatash va viraani mahkoom kardi!
We have been consumed by the fires of hatred and rage. Enjoy your victory in this world - you shall pay a heavy price in the next! = Aatash e nafrat va khashm maa raa bal'ide ast. Dar in jahaan az piroozi-at lezzat bebar; dar jahaan e baad hazine ye sangini khaahi pardaakht!
This insult shall cost you. = In tohin baraayat geraan tamaam khaahad shod.
I am Askia of the Songhai. We are a fair people - but those who cross us will find only destruction. You would do well to avoid repeating the mistakes others have made in the past. = Man Askia az Songhai hastam. Maa mardomi monsef hastim, amma aanhaa ke baa maa dar-oftand tanhaa viraani khaahand yaaft. Behtar ast eshtebaah haaye gozashte ye digaraan raa tekraar nakoni.
Can I interest you in this deal? = Mitavaanam shomaa raa be in mo'aamele alaaghemand konam?
River Warlord = Sepahbod e Daryaa haa
Askia, leader of the Songhai people and greatest of all, may God watch your path towards glory! Songhai was under the rule of the mighty West African state of Mali until the middle of the 14th century. Great King Sunni Ali Ber fought for independance, and showed to all Songhai's power, by conquering territories and repelling many foes who sought to destroy the rising kingdom. Ultimately, conquest of the wealthy cities of Timbuktu and Jenne made Songhai an empire with enough economic power to survive for a century, until the empire bowed down before foes with advanced technology - muskets against spearmen. = Ey Askia, rahbar e mardom e Songhai va bozorgtar az hame, Khodaa negaahbaan e raah e to be shokooh baad! Songhai taa miyaane ye sade ye 14 zire hokoomat e dowlat e niroomand e Maali dar Gharb e Aafriqaa bood. Shaah e bozorg Sunni Ali Ber baraaye esteghlaal jangid va baa taskhir e sarzamin haa va daf e doshmanaan e besyaari ke naaboodi ye paadeshaahi ye dar haal e roshd raa mikhaastand, ghodrat e Songhai raa be hame neshaan daad. Sar-anjaam taskhir e shahr haaye servatmand e Timbuktu va Jenne, Songhai raa be emperaatoori yi baa ghodrat e eghtesaadi ye kaafi baraaye yek sade baghaa tabdil kard, taa vaghti dar baraabar e doshmanaani baa teknoloji ye pishrafte sar kham kard: tofang haa dar baraabar e neyzedaar haa.
King Askia, your people know there's still hope, that the hour of revenge is coming. Give them wealth and power, give them mighty weapons of iron and fire, to destroy any foe, for Songhai to revive! Will your new empire shine through the ages of history? = Ey Shaah Askia, mardomat midaanand hanooz omid hast va zamaan e enteghaam miresad. Be aanhaa servat va ghodrat bede, selaah haaye niroomand e aahan va aatash bede taa har doshmani raa naabood konand va Songhai zende shavad! Aayaa emperaatoori ye jadidat dar asr haaye taarikh khaahad derakhshid?
