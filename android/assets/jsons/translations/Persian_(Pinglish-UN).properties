StoreKit is waiting for approval. If it completes later, Unciv will recover it automatically. = StoreKit montazer-e ta'yid ast. Agar ba'dan takmil shavad, Unciv aan raa khodkaar baazyaabi mikonad.
Purchase cancelled = Kharid laghv shod
No purchase was made. = Kharidi anjaam nashod.
StoreKit returned an unknown purchase result. No submission was created. = StoreKit natije-ye naashenakhte-i baraaye kharid bargardaand. Chizi baraaye ersaal saakhte nashod.
