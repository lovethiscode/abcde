Your purchase is complete. The public nickname is queued locally and will retry after you sign in to iCloud. = Kharid takmil shod. Naam-e mosteaar-e omoomi dar saf-e mahalli ast va pas az vorood be iCloud dobaare ersaal mishavad.
iCloud is unavailable = iCloud dar dastres nist
Your purchase is complete. The public nickname is queued locally and will retry automatically. = Kharid takmil shod. Naam-e mosteaar-e omoomi dar saf-e mahalli ast va khodkaar dobaare ersaal mishavad.
Your purchase is complete. The public nickname remains queued; reopen the support screen to retry. = Kharid takmil shod. Naam-e mosteaar-e omoomi dar saf maande ast; safhe-ye hemayat raa dobaare baaz konid.
Submission needs attention = Ersaal be tavajjoh niyaz daarad
A different CloudKit record already uses this transaction ID. The local submission was kept for a safe retry. = Yek record-e digar-e CloudKit az in transaction ID estefaade mikonad. Ersaal-e mahalli baraaye talaash-e dobaare-ye amn negah daashte shod.
Submission queued = Ersaal dar saf gharar gereft
The nickname choice could not be saved locally. Reopen Unciv to retry. = Entekhaab-e naam-e mosteaar mahalli zakhire nashod. Unciv raa dobaare baaz konid.
Enter a nickname, or choose Skip public nickname. = Naam-e mosteaar vared konid yaa Gozashtan az naam-e mosteaar-e omoomi raa entekhaab konid.
Nickname must be at most 30 characters. = Naam-e mosteaar baayad hadaaksar 30 neveshte baashad.
Nickname cannot contain line breaks or control characters. = Naam-e mosteaar nemitavaanad shekast-e khat yaa neveshte-ye kontrol daashte baashad.
