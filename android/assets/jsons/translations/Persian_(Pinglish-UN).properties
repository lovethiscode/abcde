# Campaign mode

1861 年 7 月 16 日，联邦军准备从华盛顿向南推进。你固定指挥联邦，保卫华盛顿并夺取里士满。地图与部队是基于历史地理的游戏化压缩，不强制重演历史战果。 = dar 16 zhuiyeh 1861, nirveyaye etehadieh baraye pisharvi bah samat jenob az Vashington amadeh mi shvand. shma bah etehadieh farman mi dehid: az Vashington dafa konid ve Richmond ra tasraf konid. naqsheh ve ertash ha jogharafiyaye tarikhi ra baraye gim peli feshardeh mi konand. netaij nabard tarikhi ejra nemi shod.
