# iOS maintenance support
Support iOS maintenance = Hemayat az negahdaari-ye iOS
Purchase records are unavailable. No purchase was started. Please reopen the app. = Savaabegh-e kharid dar dastres nist. Hich kharidi aaghaaz nashode ast. Barnaame raa dobaare baaz konid.
Congratulations on your victory! = Piruzitaan raa tabrik miguyim!
Enjoying this iOS version? Optional support helps with ongoing compatibility and maintenance. All game content and features stay the same whether you contribute or not. = Az in noskhe-ye iOS lezzat mibarid? Hemayat-e ekhtiyaari be saazegaari va negahdaari-ye peyvaste komak mikonad. Cheh komak konid cheh nakonid, hame-ye mohtavaa va emkaanaat-e baazi yeksaan mimaanad.
Learn about support = Aashnaayi baa hemayat
Continue playing = Edaame-ye baazi
Unciv is made by an open-source community. This iOS version needs ongoing work to adapt to new systems, fix issues, and improve the controls. = Unciv haasel-e kaar-e yek jaame'e-ye matn-baaz ast. In noskhe-ye iOS baraaye saazegaari baa sistemhaa-ye jadid, raf'-e moshkelaat va behbud-e kontrolhaa be kaar-e peyvaste niyaaz daarad.
If you enjoy playing, you can support future iOS maintenance with a voluntary, one-time contribution. All game content and features are the same for everyone. = Agar az baazi lezzat mibarid, mitavaanid baa yek komak-e ekhtiyaari va yekbaare az negahdaari-ye aayande-ye iOS hemayat konid. Hame-ye mohtavaa va emkaanaat-e baazi baraaye hame yeksaan ast.
Processing your purchase... = Kharid-e shomaa dar haal-e pardaazesh ast…
Thank you for supporting iOS maintenance! = Az hemayat-e shomaa az negahdaari-ye iOS sepaasgozaarim!
Purchase cancelled. No purchase was made. = Kharid laghv shod. Hich kharidi anjaam nashod.
Waiting for Apple's approval. If approved later, your support will be recorded automatically. = Dar entezar-e ta'yid-e Apple hastim. Agar ba'dan ta'yid shavad, hemayat-e shomaa khodkaar sabt mishavad.
The purchase could not be completed. Please try again later. = Kharid takmil nashod. Lotfan ba'dan dobaare talaash konid.
The purchase could not be verified. Reopen the app to retry recovery. = Kharid ta'yid nashod. Barnaame raa dobaare baaz konid taa baazyaabi-ye taraakonesh dobaare emtehaan shavad.
Your purchase needs local recovery. Do not pay again; reopen the app to retry saving and finishing the transaction. = In kharid be baazyaabi ru-ye dastgaah niyaaz daarad. Dobaare pardaakht nakonid; barnaame raa dobaare baaz konid taa zakhire va takmil-e taraakonesh dobaare emtehaan shavad.

