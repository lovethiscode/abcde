原创战役共有四章十六关。每关至少获得一颗星，解锁下一关。\n完成本章获得章节完成记录；全部三星可获得精通勋章。\n各关的局势与目标独立，已通关关卡可反复挑战。 = Kaarzaar e asli chahaar fasl va shaanzdah ma'mooriyat daarad. Hadd aghal yek setaare begirid taa ma'mooriyat e ba'adi baaz shavad.\nFasl raa takmil konid taa pishraft sabt shavad; hame ye setaarehaa raa baraaye medaal e ostaadi begirid.\nHar ma'mooriyat vaz'iyat va hadafhaaye khod raa daarad. Ma'mooriyathaaye takmilshode ghaabel e tekrar hastand.
让第一座城，在河谷中生根。 = Bogzaarid nakhostin shahr dar darre rishe begiraanad.
越过边境，建立繁荣的国家。 = Az marz bogzarid va mellati aabaad besaazid.
从第一场交锋，到夺取要塞。 = Az nakhostin dargiri taa fath e yek dezh.
把你的策略，连成完整的胜利。 = Raahbord raa baraaye piroozi yekpaarche konid.
