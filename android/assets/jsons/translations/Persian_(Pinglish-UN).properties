I greet you. I am Augustus, Imperator and Pontifex Maximus of Rome. If you are a friend of Rome, you are welcome. = Dorood bar to. Man Augustus, Imperator va Pontifex Maximus e Rom hastam. Agar doost e Rom hasti, khosh aamadid.
I offer this, for your consideration. = In raa baraaye barrasi ye shomaa pishnahaad mikonam.
Hail. = Dorood.
What do you want? = Chi mikhay?
The Glory of Rome = Shokooh e Rom
Ave Caesar Augustus, Emperor of Rome and Dominus of the Roman Empire! Your empire was the most powerful and feared of all in Western civilization. The Roman people crafted so brilliantly its culture, law, art, and warfare, that no one could contest the supremacy of Rome. Force and Honor led to glorious conquests, a domination of all the lands from Spain in the west to Syria in the east, even reaching the remote barbarian lands of England and Germany. Roman art and architecture have been praised for millenia and have been envied by all lesser civilizations who have followed. = Dorood bar Caesar Augustus, Emperaatoor e Rom va sarvare Emperaatoori ye Rom! Emperaatoori ye to niroomandtarin va tarsnaaktarin dar tamaddon e gharbi bood. Mardom e Rom Farhang, ghanoon, honar va honar e jang raa chonaan derakhshaan parvardand ke hich kas nemitavaanest bartari ye Rom raa be chalesh bekeshad. Zoor va sharaf be fath haaye baashokooh anjaamid: solte bar hame ye sarzamin haa az Espaaniyaa dar gharb taa Sooriye dar shargh, va hatta taa sarzamin haaye door e barbar e Engelestaan va Aalmaan. Honar va me'maari ye Rom hezaaraan saal setoode shode va hame ye tamaddon haaye koochaktar e baadi be aan hasrat khorde and.
O glorious Imperator, your people celebrate you and ask for the glory of Rome! In these times of darkness, the Pax Romana will be a beacon of light for all! Will your new empire shine through the ages of history? = Ey Imperator e baashokooh, mardomat to raa jashn migirand va shokooh e Rom raa mikhaahand! Dar in roozgaare taarik, Pax Romana cheraagh e roshanaayi baraaye hame khaahad bood! Aayaa emperaatoori ye jadidat dar asr haaye taarikh khaahad derakhshid?
