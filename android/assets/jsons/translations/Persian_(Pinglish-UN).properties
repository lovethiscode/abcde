# Capturing a city

What would you like to do with the city of [cityName]? = Baa shahr e [cityName] che mikhaahid bokonid?
Annex = Elhaagh
Annexed cities become part of your regular empire. = Shahr haaye elhaagh shode bakhshi az emperaatoori e aaddi e shomaa mishavand.
Their citizens generate 2x the unhappiness, unless you build a courthouse. = Shahrvandaan e aanhaa 2 baraabar Naarezaayati toolid mikonand, magar inke yek daadgaah besaazid
Your civilization may not annex this city. = Tamaddon e shomaa nemitavaanad in shahr raa zamime konad.
Puppet = Mosta’emere
Puppeted cities do not increase your tech or policy cost. = Shahr haaye dast-neshaande hazine ye teknoloji yaa siyaasat e shomaa raa afzaayesh nemidahand.
You have no control over the the production of puppeted cities. = Shomaa hich kontoroli be saakht-o-saaz e shahr haaye mosta’emere nadaarid.
Puppeted cities also generate 25% less Science and Culture. = Shahr haaye dast-neshaande hamchenin 25% Elm va Farhang e kamtar tolid mikonand.
A puppeted city can be annexed at any time. = Yek shahr e mosta’emere harvaghti mitavaanad elhaagh shavad.
Liberate (city returns to [originalOwner]) = Aazaadsazi (shahr be [originalOwner] barmigardad)
Liberating a city returns it to its original owner, giving you a massive relationship boost with them! = Aazaad kardan e yek shahr aan raa be saaheb e asli ash bar migardaanad, yek komak bozorg dar ravaabet e shomaa baa aanhaa mikonad!
Raze = Viraan Kardan
Razing the city annexes it, and starts burning the city to the ground. = Viraan karadn e shahr aanraa elhaagh mikonad, sepas shoro be viraan kardan mikonad taa baa khaak yeksaan shavad.
Razing the city puppets it, and starts burning the city to the ground. = Viraan kardan e shahr aan raa dast-neshaande mikonad va soozaandan e aan raa aaghaaz mikonad.
The population will gradually dwindle until the city is destroyed. = Jame’iat
Original capitals and holy cities cannot be razed. = Paaytakht haaye asli va shahr haaye moghaddas viraan nemishavand.
Destroy = Nabood kardan
Destroying the city instantly razes the city to the ground. = Naabood kardan e shahr bilaafaasele aan raa baa khaak yeksaan mikonad.
