Genghis Khan = Genghis Khan
You stand in the way of my armies. Let us solve this like warriors! = Kamu menghalang tenteraku. Mari selesaikan ini seperti pahlawan!
No more words. Today, Mongolia charges toward your defeat. = Tiada lagi kata-kata. Hari ini Mongolia menyerbu menuju kekalahanmu.
You have hobbled the Mongolian clans. My respect for you nearly matches the loathing. I am waiting for my execution. = Kamu telah melumpuhkan puak Mongol. Hormatku kepadamu hampir menyamai kebencianku. Aku menunggu hukuman matiku.
Your bravery must be commended. = Keberanianmu patut dipuji.
I am Temuujin, conqueror of cities and countries. Before me lie future Mongolian lands. Behind me is the only cavalry that matters. = Aku Temuujin, penakluk kota dan negara. Di hadapanku terbentang tanah Mongol masa depan. Di belakangku satu-satunya pasukan berkuda yang bermakna.
I am not always this generous, but we hope you take this rare opportunity we give you. = Aku tidak selalu semurah ini, tetapi kami berharap kamu mengambil peluang jarang ini yang kami berikan.
So what now? = Jadi apa sekarang?
Mongol Terror = Keganasan Mongol
O great Temuujin, immortal leader of the mighty Mongol Empire! Your name alone was enough to make cities crumble, and the sound of the mighty Mongol cavalry to make your enemies flee! O Great Khan! Once Northern Asia united into a mighty people, producing one of the greatest armies the world has ever known, your skillful mounted archers conquered in only a few years, most of China, Eastern Asia, and even reached the gates of Europe at the West. With cunning diplomacy and brilliant warfare, you swept your enemies one after another, creating the greatest empire ever seen, reducing Roman or Greek conquests to minor achievements. = Wahai Temuujin yang agung, pemimpin abadi Empayar Mongol yang perkasa! Namamu sahaja cukup meruntuhkan kota, dan bunyi pasukan berkuda Mongol yang hebat membuat musuh melarikan diri! Wahai Khan yang Agung! Setelah Asia Utara bersatu menjadi bangsa perkasa dengan salah satu tentera terhebat dunia, pemanah berkuda tuanku yang mahir menakluki sebahagian besar China dan Asia Timur dalam beberapa tahun sahaja, malah mencapai gerbang Eropah di barat. Dengan diplomasi licik dan peperangan cemerlang, tuanku menyapu musuh satu demi satu, mencipta empayar terbesar yang pernah dilihat dan menjadikan penaklukan Rom atau Yunani kelihatan kecil.
Divine Temuujin, battles and conquests run through the veins of the Mongols. Are you ready to shatter the will of your enemies? Will your cavalry ride in the steppes once again and strike as lightning and thunder? Will your new empire shine through the ages of history? = Temuujin yang mulia, pertempuran dan penaklukan mengalir dalam darah Mongol. Adakah tuanku bersedia menghancurkan tekad musuh? Akankah pasukan berkuda tuanku menunggang di padang rumput semula lalu menyerang bagai kilat dan guruh? Akankah empayar baharu tuanku bersinar sepanjang sejarah?
