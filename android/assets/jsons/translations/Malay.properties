How are you doing? = Bagaimana keadaanmu?
What do you want now? = Apa yang kamu mahu sekarang?
Great Andean Road = Jalan Agung Andes
King Pachacuti Sapa Inca, maker of the world and ruler of Tawantinsuyu and the Inca people, your loyal subjects greet you! In the beginning, the small state of Cusco already showed the Incans were promised for greatness. They won many wars against powerful enemies, relentlessly crushing any army that dared oppose them, and forged a mighty empire stretching from Ecuador to Chile, the greatest ever seen in pre-Columbian America. Not just undaunted soldiers, Inca people were accomplished builders and artists, their magnificient and unequalled culture still fascinating the world today. = Raja Pachacuti Sapa Inca, pembentuk dunia dan pemerintah Tawantinsuyu serta bangsa Inca, rakyat setia memberi salam kepada tuanku! Sejak awal, negara kecil Cusco sudah menunjukkan Inca ditakdirkan untuk kebesaran. Mereka memenangi banyak perang menentang musuh perkasa, tanpa henti menghancurkan tentera yang berani melawan dan membentuk empayar dari Ecuador hingga Chile, yang terbesar di Amerika sebelum Columbus. Bukan sahaja askar berani, rakyat Inca juga pembina dan seniman mahir; budaya mereka yang megah dan tiada tandingan masih mempesonakan dunia hari ini.
O Emperor Pachacuti, honor your name of 'Earth Shaker'! Will you once again summon the power of the earth to unite all Incan people under the protection of Sapa Inca, the Son of the Sun? Will your new empire shine through the ages of history? = Wahai Maharaja Pachacuti, tunaikan nama tuanku, 'Penggoncang Bumi'! Akankah tuanku sekali lagi menyeru kuasa bumi untuk menyatukan semua rakyat Inca di bawah perlindungan Sapa Inca, Putera Matahari? Akankah empayar baharu tuanku bersinar sepanjang sejarah?
