Ramkhamhaeng = Ramkhamhaeng
You lowly, arrogant fool! I will make you regret of your insolence! = Si bodoh yang hina dan angkuh! Aku akan membuatmu menyesali kebiadabanmu!
You scoundrel! I shall prepare to fend you off! = Bangsat! Aku akan bersedia menangkismu!
Although I lost, my honor shall endure. I wish you good luck. = Walaupun aku kalah, maruahku akan kekal. Semoga kamu berjaya.
I, Pho Kun Ramkhamhaeng, King of Siam, consider it a great honor that you have walked to visit my country of Siam. = Aku, Pho Kun Ramkhamhaeng, Raja Siam, amat berbesar hati kerana kamu datang melawat negaraku, Siam.
Greetings. I believe this is a fair proposal for both parties. What do you think? = Salam. Aku percaya cadangan ini adil bagi kedua-dua pihak. Apa pendapatmu?
Welcome. = Selamat datang.
Father Governs Children = Bapa Memerintah Anak
O Great King Ramkhamhaeng, the Siamese people obey you with respect and fear! The beautiful and mysterious land of Siam is an ancient country in the heart of Southeast Asia, which was besieged by many foes, plagued by bloody war and great poverty, but eventually the smart and loyal Siamese people have endured and triumphed. Siam was a part of the Khmer Empire until the 13th century AD, before its brave people took arms and led a revolution to form the small Sukhothai kingdom. After many battles and diplomacy prowess, this tiny kingdom became a mighty empire, which would dominate South East Asia for more than a century. = Wahai Raja Ramkhamhaeng yang agung, rakyat Siam mematuhi tuanku dengan hormat dan takut! Tanah Siam yang indah dan penuh misteri ialah negara purba di tengah Asia Tenggara yang dikepung pelbagai musuh, dilanda perang berdarah dan kemiskinan besar, tetapi akhirnya rakyat Siam yang pintar dan setia bertahan dan menang. Siam sebahagian daripada Empayar Khmer sehingga abad ke-13 M, sebelum rakyatnya yang berani mengangkat senjata dan memimpin revolusi untuk membentuk kerajaan kecil Sukhothai. Selepas banyak pertempuran dan kejayaan diplomasi, kerajaan kecil ini menjadi empayar perkasa yang menguasai Asia Tenggara lebih daripada satu abad.
Wise and powerful King Ramkhamhaeng, your people want to revive these days of glory! Can you make a new dawn break on Siam? Will your new empire shine through the ages of history? = Raja Ramkhamhaeng yang bijaksana dan perkasa, rakyat tuanku mahu menghidupkan kembali zaman gemilang itu! Mampukah tuanku membawa fajar baharu kepada Siam? Akankah empayar baharu tuanku bersinar sepanjang sejarah?
