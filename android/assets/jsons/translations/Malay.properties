Learn about support = Ketahui tentang sokongan
Continue playing = Teruskan bermain
Unciv is made by an open-source community. This iOS version needs ongoing work to adapt to new systems, fix issues, and improve the controls. = Unciv dihasilkan oleh komuniti sumber terbuka. Versi iOS ini memerlukan usaha berterusan untuk menyesuaikan diri dengan sistem baharu, membaiki masalah dan menambah baik kawalan.
If you enjoy playing, you can support future iOS maintenance with a voluntary, one-time contribution. All game content and features are the same for everyone. = Jika anda seronok bermain, anda boleh menyokong penyelenggaraan iOS pada masa hadapan dengan sumbangan sukarela sekali sahaja. Semua kandungan dan ciri permainan sama untuk semua orang.
