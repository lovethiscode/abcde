George Washington = George Washington
Your wanton aggression leaves us no choice. Prepare for war! = Pencerobohanmu yang melampau tidak memberi kami pilihan. Bersedialah untuk perang!
You have mistaken our love of peace for weakness. You shall regret this! = Kamu menyangka kecintaan kami kepada keamanan suatu kelemahan. Kamu akan menyesal!
The day...is yours. I hope you will be merciful in your triumph. = Hari ini...milikmu. Aku berharap kamu berbelas kasihan dalam kemenanganmu.
The people of the United States of America welcome you. = Rakyat Amerika Syarikat mengalu-alukan kamu.
Is the following trade of interest to you? = Adakah dagangan berikut menarik minatmu?
Well? = Jadi?
Manifest Destiny = Takdir Nyata
President Washington, we salute you and the proud American civilization! Freed from the British dominion in the 18th century, then cleansed and reborn after a terrible civil war, the United States nation was ready to play its great role in the 20th century. At the height of its power, triumphant after two terrible world wars, United States of America, a land of immigration, opportunities, optimism and determination, has risen above all other weakening nations, unable to equal such power. = Presiden Washington, kami memberi hormat kepada tuanku dan tamadun Amerika yang bangga! Bebas daripada penguasaan British pada abad ke-18, kemudian dibersihkan dan dilahirkan semula selepas perang saudara yang dahsyat, Amerika Syarikat bersedia memainkan peranan besarnya pada abad ke-20. Pada puncak kuasanya, berjaya selepas dua perang dunia yang dahsyat, Amerika Syarikat, tanah penghijrahan, peluang, optimisme dan tekad, mengatasi negara lain yang semakin lemah dan tidak mampu menandingi kuasanya.
President Washington, will you show to the world the legitimacy of the American way of life, and spread the flame of liberty to all mankind? Will your new empire shine through the ages of history? = Presiden Washington, akankah tuanku menunjukkan kesahihan cara hidup Amerika kepada dunia dan menyebarkan api kebebasan kepada seluruh umat manusia? Akankah empayar baharu tuanku bersinar sepanjang sejarah?
