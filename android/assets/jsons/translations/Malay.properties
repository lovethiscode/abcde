海峡两岸 = Merentasi Air
不限难度。自行在与当前首都不同的连通陆地区域建立分城，为其建成海港或等价建筑；己方回合结算时，该城通过包含海路的有效连接接通首都。允许首都经道路连接本土港口后出海，不要求首都沿海。 = Pada mana-mana kesukaran, asaskan bandar bukan ibu kota di daratan bersambung yang berbeza daripada daratan ibu kota semasa, dan bina Pelabuhan atau bangunan setara di situ. Pada pemprosesan akhir giliran anda, bandar mesti mempunyai hubungan ke ibu kota yang diiktiraf permainan dan merangkumi laluan laut. Ibu kota boleh dihubungkan melalui jalan ke pelabuhan domestik; ia tidak perlu di pantai.
在另一块陆地自建城市，建成海港，让海路将它接入首都。 = Asaskan bandar di daratan lain dan hubungkan ke ibu kota melalui laut dengan Pelabuhan.
让海洋连接你的城市 = Hubungkan bandar merentasi laut
选择值得投入的海外城址，安排港口和交通，让海洋成为发展通道。 = Imbangi peluasan merentasi laut dengan kos menghubungkan penempatan jauh.
互通有无 = Sesuatu untuk Didagangkan
不限难度。与一个主要文明完成一份有效交易：出口本国来源的重复奢侈品，换入交易前本国没有可用供应的一种奢侈品；交易后出口品仍至少保留一份，换入品已可用。允许金币等补差价，不要求总幸福非负或额外等待。 = Pada mana-mana kesukaran, lengkapkan dagangan berkesan dengan tamadun utama: eksport lebihan barangan mewah daripada sumber domestik dan import barangan mewah yang tiada bekalan boleh guna sebelum dagangan. Selepasnya, kekalkan sekurang-kurangnya satu salinan boleh guna barangan dieksport dan miliki bekalan boleh guna barangan diimport. Emas atau syarat pengimbang lain dibenarkan. Jumlah kegembiraan tidak perlu bukan negatif dan tiada penantian tambahan diperlukan.
用本国的重复奢侈品，换入此前没有供应的一种奢侈品，且出口后保留一份。 = Dagangkan lebihan barangan mewah domestik untuk barangan mewah yang belum dimiliki, sambil mengekalkan satu salinan barangan dieksport.
用富余资源换来新的选择 = Tukar lebihan untuk pilihan baharu
把富余资源转化为新的选择，寻找互利交易对象。阿拉伯可用大巴扎增加的资源份数达成。 = Jadikan lebihan sumber pilihan diplomatik yang berguna.
重归故土 = Kembali ke Tanah Air
不限难度。通过战斗夺取一座其他主要文明或城邦建立的城市，选择解放并完成归还原建立者的结算；玩家此前没有正式拥有过该城。直接解放流程中的临时归属不算此前占有；不要求结盟或后续存活。 = Pada mana-mana kesukaran, tawan melalui pertempuran bandar yang diasaskan tamadun utama lain atau negara kota, pilih pembebasan dan lengkapkan pemulangannya kepada pengasas asal. Anda mestilah tidak pernah memiliki bandar itu secara rasmi dahulu. Pemilikan sementara semasa pembebasan langsung tidak dikira sebagai pemilikan terdahulu. Perikatan atau kelangsungan kemudian tidak diperlukan.
战斗夺取一座从未正式拥有过的外国城市，将它解放归还原建立者。 = Tawan bandar asing yang tidak pernah dimiliki secara rasmi dan bebaskannya kepada pengasasnya.
将一座城市归还故土 = Pulangkan bandar kepada pengasasnya
在得到城市与归还城市之间作选择，留下外交意义上的战争故事。只在自然出现机会时尝试。 = Pilih pemulihan dan bukannya memasukkan setiap penaklukan ke empayar.
城下解围 = Bantuan di Gerbang
不限难度。己方回合开始时，一座自建城市的相邻格有可见的敌对主要文明军事单位；本回合由己方部队或城市击败其中至少一支。到下一己方回合开始，该城始终归己方，且相邻格已没有任何可见的敌对主要文明军事单位。若本局先取得正式胜利，则在胜利结算时核对剩余观察条件。 = Pada mana-mana kesukaran, unit tentera tamadun utama bermusuhan yang kelihatan mesti bersebelahan bandar diasaskan sendiri pada awal giliran anda. Unit atau bandar anda mesti mengalahkan sekurang-kurangnya satu unit sedemikian pada giliran itu. Menjelang awal giliran anda seterusnya, bandar mesti kekal milik anda tanpa putus dan tiada unit tentera tamadun utama bermusuhan yang kelihatan bersebelahan. Jika kemenangan rasmi menamatkan permainan dahulu, baki syarat pemerhatian disemak pada pemprosesan kemenangan itu.
击败回合开始时邻接自建城市的一支敌军，下一己方回合确认解围。 = Kalahkan musuh di sebelah bandar diasaskan sendiri dan sahkan pembebasannya daripada kepungan pada giliran berikutnya.
为城下的危机画上句号 = Tamatkan pengepungan
把兵力和城市火力集中到眼前危机，解除局部压力。不必等别人宣战、凑三杀或故意让城市受伤。 = Selaraskan serangan balas dan lindungi bandar sepanjang tindak balas musuh.
攻坚有序 = Gabungan Senjata
不限难度。在与守城主要文明的同一场战争中，先由己方攻城单位或远程海军对城市造成正数伤害，再由另一支具备近战占城能力的部队战斗占领该城并完成归属选择。允许跨回合；议和或城市中途转手后重新开始。交易取得、直接解放不计。 = Pada mana-mana kesukaran, dalam perang yang sama menentang tamadun utama pembela, mula-mula berikan kerosakan positif kepada bandar dengan unit pengepungan atau unit laut jarak jauh sendiri, kemudian tawan melalui pertempuran dengan unit lain yang mampu menyerang jarak dekat dan lengkapkan pilihan pemilikan. Tindakan boleh merentas giliran. Perdamaian atau perubahan pemilikan di antaranya menetapkan semula urutan. Dagangan dan pembebasan langsung tidak layak.
让攻城单位或远程海军先伤害敌城，再由另一支部队战斗占领。 = Rosakkan bandar musuh dengan pengepungan atau tembakan laut jarak jauh, kemudian tawan dengan unit lain.
让支援与攻城各司其职 = Gabungkan sokongan dan serbuan
选择支援火力和夺城部队，组织真正的联合攻坚；允许轮换和损失，不用留残血给指定兵种。 = Berikan peranan saling melengkapi kepada tembakan sokongan dan unit penawan.
战后新生 = Bandar Lahir Semula
不限难度。战斗取得一座其他主要文明建立的城市并持续保有；抵抗结束时记录人口基准。此后在该城已连接首都的结算中，以正常粮食增长使人口超过该基准。无抵抗时以收城结算后人口为基准；直接赠送人口不能单独完成。 = Pada mana-mana kesukaran, tawan melalui pertempuran bandar yang diasaskan tamadun utama lain dan kekalkannya tanpa putus. Rekod penduduk apabila penentangan tamat, atau selepas pemprosesan penawanan jika tiada penentangan. Dalam pemprosesan kemudian ketika terhubung ke ibu kota, pertumbuhan makanan biasa mesti menaikkan penduduk melebihi garis dasar itu. Penduduk yang diberikan terus tidak boleh melengkapkan syarat sendirian.
保有战斗取得的城市，抵抗结束后连接首都，并让人口以粮食增长超过基准。 = Kekalkan bandar ditakluki, tamatkan penentangan, hubungkan ke ibu kota dan kembangkan dengan makanan melebihi garis dasarnya.
让战后的城市重新生长 = Biarkan bandar berkembang semula selepas perang
从拿下城市转向让城市重新发展，安排交通、粮食和治理。无需同时维持全帝国财政、幸福等多重指标。 = Tukar kejayaan tentera kepada bandar yang berfungsi dan berkembang.
罗马传承 = Warisan Rom
不限难度，使用罗马。在两座不同自建分城各通过正常生产完成一座普通建筑；各自至少一次实际生产结算因首都已有相应建筑而获得罗马加成，完成时加成条件仍有效。建筑可不同；直接购买完成、世界及国家奇观不计。分城可以先开工，不必等首都先完成才排队。 = Sebagai Rom pada mana-mana kesukaran, lengkapkan bangunan biasa melalui pengeluaran normal di setiap satu daripada dua bandar bukan ibu kota berbeza yang diasaskan sendiri. Masing-masing mesti pernah menerima bonus Rom dalam pemprosesan pengeluaran sebenar kerana ibu kota memiliki bangunan sama; syarat itu mesti masih dipenuhi ketika siap. Bangunan boleh berbeza. Pembelian, keajaiban dunia dan keajaiban negara tidak dikira. Memulakan pembinaan sebelum ibu kota siap dibenarkan.
让两座自建分城各通过实际享受罗马加成的普通生产完成一座建筑。 = Lengkapkan bangunan yang dihasilkan secara normal di setiap dua bandar satelit diasaskan sendiri dengan bonus pengeluaran Rom.
让首都的积累惠及分城 = Biarkan ibu kota membantu bandar baharu
用首都积累带动分城建设，按各城需求选择建筑。体现罗马能力，不要求五城都造兵营或等十人口。 = Gunakan ibu kota untuk menyokong bandar dengan keperluan berbeza.
连弩初试 = Busur Silang Berulang
不限难度，使用中国。同一支诸葛弩在一个己方回合内，对主要文明军事单位或城市完成两次主动攻击，两次均造成正数伤害，并持续归己方、存活至下一己方回合开始。可以攻击同一目标，不要求击杀或实战晋升；两次攻击均须发生在诸葛弩形态。若本局先取得正式胜利，则在胜利结算时核对剩余观察条件。 = Sebagai China pada mana-mana kesukaran, satu Chu-Ko-Nu mesti melakukan dua serangan aktif dalam satu giliran terhadap unit tentera atau bandar tamadun utama, memberikan kerosakan positif setiap kali. Ia mesti hidup dan kekal milik anda tanpa putus sehingga giliran anda seterusnya bermula. Sasaran sama boleh diserang dua kali; pembunuhan dan kenaikan pangkat tidak diperlukan. Kedua-dua serangan mesti dilakukan dalam bentuk Chu-Ko-Nu. Jika kemenangan rasmi menamatkan permainan dahulu, baki syarat pemerhatian disemak pada pemprosesan kemenangan itu.
同一支诸葛弩本回合主动攻击两次并造成伤害，存活至下一己方回合。 = Lakukan dua serangan berkerosakan dengan satu Chu-Ko-Nu dalam satu giliran dan kekalkannya hingga giliran anda seterusnya.
让连弩接连出击，带它平安归来 = Serang dua kali dan bawa unit pulang
决定第二次攻击打谁，以及如何保护射击后的部队。直接体验连射能力，不用先养经验、喂两个残血目标。 = Pilih sasaran kedua sambil merancang perlindungan penyerang.
山间粮仓 = Jelapang Gunung
不限难度，使用印加。在自建城市可工作范围内完成一处邻接至少两座山脉的梯田，并让市民在至少一次实际粮食结算中工作该地块；结算时梯田未被掠夺、仍属己方。不限城市人口，不要求三处梯田。 = Sebagai Inca pada mana-mana kesukaran, lengkapkan Ladang Teres bersebelahan sekurang-kurangnya dua gunung dalam kawasan kerja bandar diasaskan sendiri. Seorang rakyat mesti mengerjakannya sekurang-kurangnya sekali pada pemprosesan makanan sebenar ketika ia kekal milik anda dan tidak dijarah. Tiada ambang penduduk atau ladang tambahan diperlukan.
建成一处邻接两座山脉的梯田，并让市民实际工作它一次。 = Bina Ladang Teres di sebelah sekurang-kurangnya dua gunung dan kerjakannya pada pemprosesan makanan sebenar.
在群山之间收获粮食 = Tuai makanan di antara gunung
识别合适的山间丘陵，把地形限制变为粮食优势。只在已经发现合适位置时推荐。 = Kenali rupa bumi yang menukar kekangan gunung menjadi makanan.
来去如风 = Menunggang Bagai Angin
不限难度，使用蒙古。同一支怯薛骑兵在一个己方回合中，先主动攻击主要文明军事单位或城市并造成正数伤害，再主动移动到另一格，并持续归己方、存活至下一己方回合开始。攻击和移动均发生在怯薛形态；强制传送不计。若本局先取得正式胜利，则在胜利结算时核对剩余观察条件。 = Sebagai Mongolia pada mana-mana kesukaran, satu Keshik mesti menyerang secara aktif unit tentera atau bandar tamadun utama untuk memberikan kerosakan positif, kemudian bergerak secara sukarela ke jubin berbeza pada giliran sama. Ia mesti hidup dan kekal milik anda tanpa putus hingga giliran anda seterusnya bermula. Kedua-dua tindakan mesti dilakukan dalam bentuk Keshik; teleportasi paksa tidak dikira. Jika kemenangan rasmi menamatkan permainan dahulu, baki syarat pemerhatian disemak pada pemprosesan kemenangan itu.
同一支怯薛骑兵攻击造成伤害后主动换格，存活至下一己方回合。 = Serang dengan satu Keshik, bergerak ke jubin lain dan kekalkannya hingga giliran anda seterusnya.
射击之后，寻找下一处阵地 = Cari kedudukan lain selepas menembak
预留移动力，在射击后选择撤离、侧移、让路或继续推进；完成一次即可，不把后撤规定为唯一正确解法。 = Simpan pergerakan untuk berundur, menempatkan semula, membuka laluan atau mara.
殊途同归 = Jalan Berbeza
不限难度。三个不同合格自由对局分别取得三种不同的非时间胜利，从科技、文化、征服、外交中任选三种。同一局游戏 只贡献首个正式终局结果；重载、复制存档不增加局数或胜利种类。 = Pada mana-mana kesukaran, raih tiga jenis kemenangan berbeza selain Masa daripada Saintifik, Kebudayaan, Dominasi dan Diplomatik, setiap satu dalam permainan bebas layak yang berbeza. Hanya keputusan akhir rasmi pertama bagi setiap ID permainan dikira. Simpanan dimuat semula atau disalin tidak menambah bilangan permainan atau jenis kemenangan.
在三个不同的合格对局中，取得三种不同的非时间胜利。 = Raih tiga jenis kemenangan berbeza selain Masa dalam tiga permainan layak yang berbeza.
用三种方式走向胜利 = Cari tiga laluan kemenangan
走出熟悉的一种打法，体验三种不同战略。次数对应策略种类，不是把同一局再刷两遍。 = Terokai strategi berbeza dan bukannya mengulangi satu laluan biasa.
五波之后 = Selepas Lima Gelombang
无尽，轻松或野蛮均可。同一次挑战首次在期限内清除第一关全部五波，进入关卡完成结算，且核心仍归己方。 = Dalam Tanpa Henti pada rentak Santai atau Ganas, hapuskan semua lima gelombang peringkat pertama dalam had masanya dalam satu cubaan dan capai pemprosesan penyelesaian peringkat sambil teras kekal milik anda.
在期限内清除第一关的五波敌军，并保有核心城市。 = Hapuskan semua lima gelombang peringkat satu sebelum had masa sambil mengekalkan teras.
守过第一关的五波来敌 = Bertahan sepanjang lima gelombang pertama
将布防、资源与波次处理贯穿一整个关卡，获得清楚的首次通关反馈。 = Urus penempatan, sumber dan gelombang sepanjang satu peringkat lengkap.
三城同守 = Tiga Bandar Bertahan
无尽，轻松或野蛮均可。已解锁三城容量；某关第一波出现前已拥有三座城市，从第一波出现到该关按时完成，这三城持续归己方。不限必须哪一关完成，不限制部队损失和关间奖励选择。 = Dalam Tanpa Henti pada mana-mana rentak, buka kapasiti tiga bandar dan miliki tiga bandar sebelum gelombang pertama sesuatu peringkat muncul. Kekalkan ketiga-tiganya tanpa putus sehingga peringkat itu selesai tepat pada masanya. Mana-mana peringkat boleh layak; kehilangan unit dan pilihan ganjaran antara peringkat tidak dihadkan.
一关首波来临前已有三城，持续保有这三城直到按时过关。 = Miliki tiga bandar sebelum peringkat bermula dan kekalkannya tanpa putus sehingga selesai tepat pada masanya.
让三座城市一同守到关末 = Kekalkan tiga bandar hingga akhir
主动扩张后承担更复杂的防线，安排机动支援与城市分工；不是要求所有玩家都建满三城。 = Terima pilihan pertahanan yang timbul daripada peluasan dan agihkan sokongan antara bandar.
不息战线 = Barisan Tanpa Putus
无尽，野蛮节奏。在同一次挑战中完成前三关。允许正常领取金币或增援；不同挑战的通关数不能相加。 = Dalam Tanpa Henti pada rentak Ganas, lengkapkan peringkat satu hingga tiga dalam cubaan yang sama. Ganjaran emas dan bantuan tentera biasa dibenarkan. Peringkat daripada cubaan berbeza tidak boleh dijumlahkan.
在同一次野蛮节奏挑战中，完成前三关。 = Lengkapkan tiga peringkat pertama dalam satu cubaan rentak Ganas.
在野蛮节奏中连过三关 = Selesaikan tiga peringkat pada rentak Ganas
在没有关间休整的节奏中管理资源与兵力，准备连续作战，而非跨局凑次数。 = Urus angkatan dan sumber sepanjang pertempuran berterusan.
