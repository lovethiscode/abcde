Hiawatha = Hiawatha
You are a plague upon Mother Earth! Prepare for battle! = Kamu bencana bagi Ibu Bumi! Bersedialah untuk bertempur!
You evil creature! My braves will slaughter you! = Makhluk jahat! Pahlawanku akan menyembelihmu!
You have defeated us... but our spirits will never be vanquished! We shall return! = Kamu telah mengalahkan kami... tetapi semangat kami tidak akan tunduk! Kami akan kembali!
Words alone cannot shake the roots of peace I have planted among my people. = Kata-kata sahaja tidak dapat menggoyahkan akar keamanan yang kutanam dalam kalangan rakyatku.
Greetings, stranger. I am Hiawatha, speaker for the Iroquois. We seek peace with all, but we do not shrink from war. = Salam, orang asing. Aku Hiawatha, jurucakap Iroquois. Kami mencari keamanan dengan semua, tetapi tidak gentar akan perang.
Does this trade work for you, my friend? = Adakah dagangan ini sesuai untukmu, sahabatku?
The Great Warpath = Jalan Perang Agung
Greetings, noble Hiawatha, leader of the mighty Iroquois nations! Your people lived near the great and holy lake Ontario since the ancient ages, on a land that will be later known as New York city. Long ago, the five peoples of Seneca, Onondaga, Mohawks, Cayugas and Oneida became one nation, the Haudenosaunee, the Iroquois. Although not having a written language, the wise Iroquois created the Great Law of Peace, which can be considered the first established constitution. For decades, your people fought powerful enemies, such as the Huron, and then the French and English colonists. With less warriors and inferior weaponry, the Iroquois still survived and walk on the path of peace and harmony, until their way of living faded away under the crush of the newborn United States nation. = Salam, Hiawatha yang mulia, pemimpin bangsa Iroquois yang perkasa! Rakyat tuanku tinggal berhampiran tasik Ontario yang besar dan suci sejak zaman purba, di tanah yang kelak dikenali sebagai bandar New York. Dahulu, lima bangsa Seneca, Onondaga, Mohawk, Cayuga dan Oneida bersatu menjadi Haudenosaunee, iaitu Iroquois. Walaupun tiada bahasa tulisan, Iroquois yang bijaksana mencipta Undang-undang Keamanan Agung yang boleh dianggap perlembagaan pertama. Selama berdekad-dekad, rakyat tuanku melawan musuh kuat seperti Huron, kemudian penjajah Perancis dan Inggeris. Dengan pahlawan yang lebih sedikit dan senjata lebih lemah, Iroquois masih bertahan dan berjalan di jalan keamanan dan keharmonian, hingga cara hidup mereka pudar di bawah tekanan negara Amerika Syarikat yang baru lahir.
Great Sachem Hiawatha, do you hear the complaints of your people? Can you light the path leading to the ancient Iroquois union? Will your new empire shine through the ages of history? = Sachem Hiawatha yang agung, adakah tuanku mendengar keluhan rakyat? Mampukah tuanku menerangi jalan menuju penyatuan Iroquois purba? Akankah empayar baharu tuanku bersinar sepanjang sejarah?
