If I am to be honest, I tire of those pointless charades. Why don't we settle our disputes on the field of battle, like true men? Perhaps the skalds will sing of your valor... or mine! = Sejujurnya, aku sudah bosan dengan sandiwara sia-sia itu. Mengapa tidak menyelesaikan pertikaian kita di medan perang seperti lelaki sejati? Mungkin penyair akan menyanyikan keberanianmu... atau keberanianku!
Ahahah! You seem to show some skills of a true Viking! Too bad that I'll probably kill you! = Ahahah! Kamu nampaknya mempunyai sedikit kemahiran Viking sejati! Sayangnya, aku mungkin akan membunuhmu!
Loki must have stood by you, for a common man alone could not have defeated me... Oh well! I will join the einherjar in Valhalla and feast, while you toil away here. = Loki pasti menyebelahimu, kerana manusia biasa tidak mungkin mengalahkanku sendirian... Baiklah! Aku akan menyertai einherjar di Valhalla untuk berpesta, sementara kamu membanting tulang di sini.
Our future battle will be glorious! = Pertempuran kita kelak akan gemilang!
Harald Bluetooth bids you welcome to his lands, a Viking unlike any the seas and lands have ever known! Hah, are you afraid? = Harald Bluetooth mengalu-alukan kamu ke tanahnya, seorang Viking yang tidak pernah ditandingi di laut mahupun darat! Hah, adakah kamu takut?
This is a fine deal! Even a drunk beggar would agree! = Ini urus niaga yang bagus! Pengemis mabuk pun akan setuju!
Hail to you. = Salam hormat kepadamu.
Viking Fury = Amukan Viking
Skal, Harald Bluetooth Gormsson, son of King Gorm of the Old and Thyra Dannebod! After crushing the armies of Norway, you achieved great construction projects all across the land of mighty Denmark. Numerous Ring Fortresses were built under your reign to protect the people from foreign invasions, but also from local quarrels. In 983 AD, you successfully repelled several waves of German settlers trying to colonize your land, and then always kept your kingdom free from any foreign pressure. = Skal, Harald Bluetooth Gormsson, putera Raja Gorm yang Tua dan Thyra Dannebod! Selepas menghancurkan tentera Norway, tuanku menyiapkan projek pembinaan besar di seluruh Denmark yang perkasa. Banyak Kubu Gelang dibina dalam pemerintahan tuanku untuk melindungi rakyat daripada pencerobohan asing dan pertelingkahan tempatan. Pada 983 M, tuanku berjaya menangkis beberapa gelombang peneroka Jerman yang cuba menjajah tanah tuanku, dan selepas itu sentiasa memastikan kerajaan bebas daripada tekanan asing.
As a true Viking, who knows not fear, time has come to unleash mighty armies of Northsmen to bring despair upon your enemies! By the will of the Gods, it will be either a glorious triumph or a sumptuous feast in the Valhalla! Will your new empire shine through the ages of history? = Sebagai Viking sejati yang tidak mengenal takut, tibalah masa melepaskan tentera Orang Utara yang perkasa untuk membawa keputusasaan kepada musuh! Dengan kehendak para Dewa, sama ada kemenangan gemilang atau jamuan mewah di Valhalla menanti! Akankah empayar baharu tuanku bersinar sepanjang sejarah?
