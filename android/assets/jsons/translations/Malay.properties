The world is pitiful! There's no beauty in it, no wisdom. I am almost glad to go. = Dunia ini menyedihkan! Tiada keindahan, tiada kebijaksanaan. Aku hampir gembira meninggalkannya.
The archduchess of Austria welcomes your Eminence to... Oh let's get this over with! I have a luncheon at four o'clock. = Archduchess Austria mengalu-alukan tuan yang mulia ke... Ah, mari selesaikan segera! Aku ada jamuan tengah hari pada pukul empat.
I see you admire my new damask. Nobody should say that I am an unjust woman. Let's reach an agreement! = Kulihat kamu mengagumi kain damask baharuku. Jangan sesiapa berkata aku wanita yang tidak adil. Mari capai persetujuan!
Oh, it's ye! = Oh, tuan hamba rupanya!
Diplomatic Marriage = Perkahwinan Diplomatik
Noble and pious Queen Maria Theresa, Holy Roman Empress and sovereign of Austria, the people revere your grace. After the death of your father King Charles VI, you inherited the throne of Austria during difficult economic and military times. But you used your wisdom and unflinching determination to fend off your foes and resolve any obstacles to stability and prosperity. With your husband Francis Stephen at your side as co-ruler, you assured your place as Empress of the Holy Roman Empire. During your reign, you reformed Austria in several domains, as you gifted it with a powerful army, a stable economic model, and an improved educational system. = Ratu Maria Theresa yang mulia dan warak, Maharani Rom Suci dan pemerintah Austria, rakyat menyanjung keanggunan tuanku. Selepas kemangkatan ayahanda Raja Charles VI, tuanku mewarisi takhta Austria ketika ekonomi dan ketenteraan sukar. Namun dengan kebijaksanaan dan tekad teguh, tuanku menangkis musuh dan menyelesaikan rintangan kepada kestabilan dan kemakmuran. Dengan suami Francis Stephen sebagai pemerintah bersama, tuanku memastikan kedudukan sebagai Maharani Empayar Rom Suci. Tuanku mereformasi Austria dalam pelbagai bidang, mengurniakan tentera kuat, model ekonomi stabil dan sistem pendidikan lebih baik.
O Great Queen, proud and dignified, by the will of God and the Divine right, can you reach the height of prosperity and splendor the kingdom of Austria deserves? Will your new empire shine through the ages of history? = Wahai Ratu yang agung, bangga dan bermaruah, dengan kehendak Tuhan dan hak ketuhanan, mampukah tuanku mencapai kemakmuran dan kemegahan yang layak bagi Austria? Akankah empayar baharu tuanku bersinar sepanjang sejarah?
