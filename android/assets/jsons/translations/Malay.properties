Suleiman I = Suleiman I
Your continued insolence and failure to recognize our preeminence leads us to war. = Keangkuhanmu yang berterusan dan keengganan mengakui keunggulan kami membawa kita ke medan perang.
Good. The world shall witness the incontestable might of my armies and the glory of the Empire. = Bagus. Dunia akan menyaksikan kekuatan tenteraku yang tidak dapat dipertikaikan dan kegemilangan Empayar.
Ruin! Ruin! Istanbul becomes Iram of the Pillars, remembered only by the melancholy poets. = Musnah! Musnah! Istanbul menjadi Iram Bertiang, hanya dikenang penyair yang berduka.
From the magnificence of Topkapi, the Ottoman nation greets you, stranger! I'm Suleiman, Kayser-I Rum, and I bestow upon you my welcome! = Dari keagungan Topkapi, bangsa Uthmaniyah memberi salam kepadamu, orang asing! Aku Suleiman, Kayser-I Rum, dan aku mengalu-alukan kamu!
Let us do business! Would you be interested? = Mari berniaga! Adakah kamu berminat?
Barbary Corsairs = Korsair Barbary
O Great Sultan Suleiman, may the God bless you! You are revered for your power, wealth and generosity, and you truly deserves to be called the 'Magnificent'! The Ottoman Empire was born in Bithynia, starting as a small country in Eastern Anatolia in 12th century, then expanded to west into Anatolia. Over the next century, your people vanquished the empire of Byzantium, annexing Turkey and the Balkans, and smartly assimilating all wonders and knowledge of the Byzantine civilization. In the mid 15th century, the Ottomans added Constantinople to their empire, establishing a strategic link between Europe and the Middle East. The Empire would continue to expand for centuries reaching North Africa, Middle East and Eastern Europe at its height, but brutally disappeared in the chaos of the first world war, in early 20th century. = Wahai Sultan Suleiman yang agung, semoga Tuhan memberkati tuanku! Tuanku disanjung kerana kuasa, kekayaan dan kemurahan hati, serta benar-benar layak digelar 'Yang Gemilang'! Empayar Uthmaniyah lahir di Bithynia, bermula sebagai negara kecil di Anatolia Timur pada abad ke-12, kemudian meluas ke barat dalam Anatolia. Sepanjang abad berikutnya, rakyat tuanku menewaskan Empayar Byzantine, mengilhak Turki dan Balkan, serta bijak menyerap segala keajaiban dan ilmu tamadun Byzantine. Pada pertengahan abad ke-15, Uthmaniyah menambah Constantinople ke dalam empayar, mewujudkan hubungan strategik antara Eropah dan Timur Tengah. Empayar terus berkembang selama berabad-abad hingga mencapai Afrika Utara, Timur Tengah dan Eropah Timur pada kemuncaknya, tetapi lenyap dengan dahsyat dalam kekacauan perang dunia pertama pada awal abad ke-20.
Mighty Caliph, your people ask you to build again the Empire, to the level of power and glory it once achieved, and beyond! Will you revive the Ottoman golden age? Will your new empire shine through the ages of history? = Khalifah yang perkasa, rakyat meminta tuanku membina semula Empayar ke tahap kuasa dan kegemilangan dahulu, malah melebihinya! Akankah tuanku menghidupkan kembali zaman kegemilangan Uthmaniyah? Akankah empayar baharu tuanku bersinar sepanjang sejarah?
