Sejong = Sejong
Jip-hyun-jun (Hall of Worthies) will no longer tolerate your irksome behavior. We will liberate the citizens under your oppression even with force, and enlighten them! = Jip-hyun-jun (Balai Cendekiawan) tidak lagi akan bertolak ansur dengan kelakuanmu yang menjengkelkan. Kami akan membebaskan rakyat yang kamu tindas, walaupun dengan kekerasan, dan mencelikkan mereka!
Foolish, miserable wretch! You will be crushed by this country's magnificent scientific power! = Si bodoh yang malang! Kamu akan dihancurkan oleh kekuatan sains negara ini yang hebat!
Now the question is who will protect my people. A dark age has come. = Kini persoalannya siapa akan melindungi rakyatku. Zaman gelap telah tiba.
Your words reveal more of your own prejudice than any fault in my own. = Kata-katamu lebih mendedahkan prasangkamu sendiri daripada sebarang kesalahanku.
Welcome to the palace of Choson, stranger. I am the learned King Sejong, who looks after his great people. = Selamat datang ke istana Choson, orang asing. Aku Raja Sejong yang berilmu, penjaga rakyatnya yang agung.
We have many things to discuss and have much to benefit from each other. = Banyak yang perlu kita bincangkan dan banyak manfaat yang boleh kita peroleh bersama.
Oh, it's you = Oh, kamu rupanya
Scholars of the Jade Hall = Cendekiawan Balai Jed
Greetings to you, King Sejong the Great, heir of the Choson Dynasty! Prosperity and benevolence towards the common man are the principles of your reign, and made of you the most beloved Korean king. You always aimed to provide a fair and equal society for all your people, and also to favor knowledge and technological discoveries. Your wisdom and intelligence imbued all the Korean society, and the scholars of the Jade Hall developed Korea's first written language, Hangul, sharing further literature and science to the people after centuries of darkness. = Salam kepada Raja Sejong yang Agung, pewaris Dinasti Choson! Kemakmuran dan kebajikan rakyat biasa ialah prinsip pemerintahan tuanku, menjadikan tuanku raja Korea paling disayangi. Tuanku sentiasa berusaha menyediakan masyarakat yang adil dan saksama bagi semua rakyat serta menggalakkan ilmu dan penemuan teknologi. Kebijaksanaan dan kecerdasan tuanku meresapi seluruh masyarakat Korea; cendekiawan Balai Jed membangunkan bahasa tulisan pertama Korea, Hangul, lalu menyebarkan lebih banyak sastera dan sains kepada rakyat selepas berabad-abad kegelapan.
Wise Sejong, will you gift your people with the radiance of harmony and knowledge to dispel the darkness once again? Will your new empire shine through the ages of history? = Sejong yang bijaksana, akankah tuanku mengurniakan sinar keharmonian dan ilmu untuk mengusir kegelapan sekali lagi? Akankah empayar baharu tuanku bersinar sepanjang sejarah?
