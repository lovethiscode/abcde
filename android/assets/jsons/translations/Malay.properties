I grow tired of this throne. I think I should like to have yours instead. = Aku semakin bosan dengan takhta ini. Rasanya aku mahu takhtamu pula.
Now what is this?! You ask me to add your riches to my great avails. The invitation is accepted. = Apa ini?! Kamu memintaku menambah kekayaanmu kepada keuntunganku yang besar. Jemputan diterima.
