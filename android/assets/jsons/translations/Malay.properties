Oda Nobunaga = Oda Nobunaga
I hereby inform you of our intention to wipe out your civilization from this world. = Dengan ini aku memaklumkan niat kami untuk menghapuskan tamadunmu dari dunia ini.
Pitiful fool! Now we shall destroy you! = Si bodoh yang menyedihkan! Kini kami akan memusnahkanmu!
You were much wiser than I thought. = Kamu jauh lebih bijak daripada sangkaanku.
I expected more for you from. = Aku mengharapkan lebih daripadamu.
We hope for a fair and just relationship with you, who are renowned for military bravery. = Kami mengharapkan hubungan yang adil dan saksama denganmu yang terkenal dengan keberanian tentera.
I would be grateful if you agreed on the following proposal. = Aku akan berterima kasih jika kamu menerima cadangan berikut.
Oh, it's you... = Oh, kamu rupanya...
Bushido = Bushido
Lord Oda Nobunaga, ruler of Japan, the land of the Rising Sun is at your command! Through history, Japanese people lived and died with honor, proud of their rich culture of arts and letters. Years of bloody civil wars, invasions of foreign powers, wealth but also great poverty, have never altered the strong will of the Rising Sun island, as the Bushido spirit has imbued the fields of battle and the Japanese society for millenia. At the end of the 19th century, under foreign influence, your people took the path of modernity, and in a few decades, made of Japan a land of technological innovation and powerful industry, with which only few nations can compete. = Tuan Oda Nobunaga, pemerintah Jepun, negeri Matahari Terbit berada di bawah perintah tuanku! Sepanjang sejarah, rakyat Jepun hidup dan mati dengan maruah, bangga dengan budaya seni dan kesusasteraan yang kaya. Perang saudara berdarah, pencerobohan kuasa asing, kekayaan serta kemiskinan besar tidak pernah mengubah tekad kuat pulau Matahari Terbit; semangat Bushido menyelubungi medan perang dan masyarakat Jepun selama ribuan tahun. Pada akhir abad ke-19, di bawah pengaruh asing, rakyat tuanku menempuh kemodenan dan dalam beberapa dekad menjadikan Jepun pusat inovasi teknologi dan industri kuat yang hanya mampu disaingi beberapa negara.
O great daimyo, will you take on your hands the Japan destiny, for the Rising Sun to light the world? Will your new empire shine through the ages of history? = Wahai daimyo yang agung, akankah tuanku menentukan takdir Jepun agar Matahari Terbit menerangi dunia? Akankah empayar baharu tuanku bersinar sepanjang sejarah?
