Resistance is futile! You cannot hope to stand against the mighty Incan empire. If you will not surrender immediately, then prepare for war! = Tentangan tidak berguna! Kamu tidak mampu menandingi Empayar Inca yang perkasa. Jika tidak menyerah serta-merta, bersedialah untuk perang!
Declare war on me?!? You can't, because I declare war on you first! = Isytihar perang terhadapku?!? Tidak boleh, kerana aku mengisytiharkan perang terhadapmu dahulu!
How did you darken the sun? I ruled with diligence and mercy—see that you do so as well. = Bagaimana kamu menggelapkan matahari? Aku memerintah dengan tekun dan belas kasihan — pastikan kamu juga begitu.
How are you? You stand before Pachacuti Inca Yupanqui. = Apa khabar? Kamu berdiri di hadapan Pachacuti Inca Yupanqui.
