Otto von Bismarck = Otto von Bismarck
I cannot wait until ye grow even mightier. Therefore, prepare for war! = Aku tidak boleh menunggu sehingga kamu semakin kuat. Maka bersedialah untuk perang!
Corrupted villain! We will bring you into the ground! = Penjahat yang korup! Kami akan menjatuhkanmu!
Germany has been destroyed. I weep for the future generations. = Jerman telah dimusnahkan. Aku menangisi generasi akan datang.
That wild bravado? It's a ticking time bomb, especially when you're all bark and no bite! = Keberanian melulu itu? Ia bom jangka, lebih-lebih lagi jika kamu hanya pandai menyalak tanpa menggigit!
Guten Tag. In the name of the great German people, I bid you welcome. = Selamat sejahtera. Atas nama rakyat Jerman yang agung, aku mengalu-alukan kamu.
It would be in your best interest, to carefully consider this proposal. = Demi kepentinganmu sendiri, pertimbangkan cadangan ini dengan teliti.
What now? = Apa pula sekarang?
So, out with it! = Jadi, katakanlah!
Furor Teutonicus = Amukan Teuton
All hail to Otto von Bismarck, first chancellor of Germany and its empire! During the ancient era, Germany was a land fragmented in several tribes but already showed great promise as the Roman Empire itself struggled to bend the Germans to its will. Germany, as one nation, was slowly built on the ruins of the Holy Roman Empire, and waited 1871 to be finally unified after the glorious victory on France and Napoleon III. The German people are creative, intelligent, industrious and proven to be talented warriors through history. Despite great catastrophes and failures in the first half of the 20th century, Germany can always rely on its people will and strength to be among the greatest and powerful nations in the world. = Salam hormat kepada Otto von Bismarck, canselor pertama Jerman dan empayarnya! Pada zaman purba, Jerman terpecah kepada beberapa suku tetapi sudah menunjukkan potensi besar; Empayar Rom sendiri sukar menundukkan mereka. Jerman sebagai sebuah bangsa perlahan-lahan terbina di atas runtuhan Empayar Rom Suci, dan menunggu hingga 1871 untuk akhirnya bersatu selepas kemenangan gemilang terhadap Perancis dan Napoleon III. Rakyat Jerman kreatif, pintar, rajin dan terbukti pahlawan berbakat sepanjang sejarah. Walaupun mengalami bencana dan kegagalan besar pada separuh pertama abad ke-20, Jerman sentiasa boleh bergantung pada tekad dan kekuatan rakyatnya untuk menjadi antara negara teragung dan terkuat dunia.
Great Prince Bismarck, glory and power are at the heart of the German nation. Your people are bright, and lend you their iron will to lead Germany once again. Will your new empire shine through the ages of history? = Putera Bismarck yang agung, kegemilangan dan kuasa menjadi nadi bangsa Jerman. Rakyat tuanku cemerlang dan meminjamkan tekad besi mereka untuk tuanku memimpin Jerman semula. Akankah empayar baharu tuanku bersinar sepanjang sejarah?
