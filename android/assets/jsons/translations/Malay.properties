It is always a shame to destroy a thing of beauty. Happily, you are not one. = Memusnahkan sesuatu yang indah sentiasa memalukan. Mujurlah kamu bukan sesuatu yang indah.
Now darling, tantrums are most unbecoming. I shall have to teach you a lesson. = Sayang, mengamuk itu sangat tidak manis. Aku terpaksa mengajarmu.
Like a child playing with toys you are. My people will never love you, nor suffer this indignation gracefully. = Kamu seperti kanak-kanak bermain alat mainan. Rakyatku tidak akan menyayangimu atau menerima penghinaan ini dengan rela.
My, isn't this a pleasant surprise - what may I call you, oh mysterious stranger? I am Theodora, beloved of Byzantium. = Wah, kejutan yang menyenangkan — apakah panggilanmu, orang asing yang penuh misteri? Aku Theodora, kesayangan Byzantium.
I have heard that you adept at certain kinds of ... interactions. Show me. = Aku dengar kamu mahir dalam sesetengah... interaksi. Tunjukkan kepadaku.
Hello again. = Helo sekali lagi.
Patriarchate of Constantinople = Patriarkat Constantinople
Magnificent Empress Theodora, beloved of Byzantium and of Rome, your people salute you! With your beauty and intelligence, you rose up from actress and courtesan to the rank of the most powerful woman in the Roman Empire, as wife of Justinian I. In the late 520's AD, you helped your husband engage in spiritual and legal reforms, promugalting numerous laws to improve women's status and treatment in the empire. You also made of Constantinople the jewel of the Eastern Roman Empire with the restoration and construction of many aqueducts, bridges, and churches, its beauty culminating with the creation of the Hagia Sophia, one of the most splendid pieces of architecture in the world. = Maharani Theodora yang megah, kesayangan Byzantium dan Rom, rakyat memberi hormat kepada tuanku! Dengan kecantikan dan kecerdasan, tuanku bangkit daripada pelakon dan wanita penghibur menjadi wanita paling berkuasa dalam Empayar Rom sebagai isteri Justinian I. Pada akhir 520-an M, tuanku membantu suami melaksanakan reformasi rohani dan undang-undang, menggubal banyak undang-undang untuk memperbaiki kedudukan serta layanan terhadap wanita. Tuanku juga menjadikan Constantinople permata Empayar Rom Timur melalui pemulihan dan pembinaan akueduk, jambatan dan gereja, dengan keindahan memuncak pada Hagia Sophia, antara seni bina paling indah dunia.
Beautiful Empress,the Byzantine Empire's magnificence is intact in all memories, and ready to reborn as the new jewel of humankind. Will your new empire shine through the ages of history? = Maharani yang jelita, keagungan Empayar Byzantine masih utuh dalam ingatan semua dan sedia lahir semula sebagai permata baharu umat manusia. Akankah empayar baharu tuanku bersinar sepanjang sejarah?
