Hi there! If you've played this far, you've probably seen that the game is currently incomplete.\n Unciv is meant to be open-source and free, forever.\n That means no ads or any other nonsense. = Hai! Jika anda sudah bermain sejauh ini, mungkin anda melihat permainan masih belum lengkap.\n Unciv dimaksudkan kekal sumber terbuka dan percuma selama-lamanya.\n Ertinya tiada iklan atau karenah lain.
Every rating and review that I get puts a smile on my face =)\n  So contact me! Send me an email, review, Github issue\n  or mail pigeon, and let's figure out how to make the game \n  even more awesome!\n(Contact info is in the Play Store) = Setiap penilaian dan ulasan yang saya terima membuat saya tersenyum =)\n  Jadi hubungilah saya! Hantar e-mel, ulasan, isu Github\n  atau merpati pos, dan mari fikirkan cara menjadikan permainan \n  lebih hebat lagi!\n(Maklumat hubungan ada di Play Store)
