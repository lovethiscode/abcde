A sacrifice unlike all others must be made! = Pengorbanan yang tidak seperti yang lain mesti dilakukan!
Muahahahahahaha! = Muahahahahahaha!
Today comes a great searing pain. With you comes the path to the black storm. = Hari ini tiba kesakitan membakar yang dahsyat. Bersamamu datang jalan menuju ribut hitam.
Greetings, wayward one. I am known as Pacal. = Salam, pengembara yang tersasar. Aku dikenali sebagai Pacal.
Friend, I believe I may have found a way to save us all! Look, look and accept my offering! = Sahabat, aku rasa telah menemukan cara menyelamatkan kita semua! Lihatlah dan terima persembahanku!
A fine day, it helps you. = Hari yang indah, ia membantumu.
The Long Count = Kiraan Panjang
Kneel before King Pacal the Great, son of the gods and protector of the Palenque domain! After your kingdom has been harassed for years by neighboring rivals, you struck back at the enemies of your people, defeating each of them and sacrificing their leaders as a retribution to the insults made to your ancestors. Your wisdom and hard will not only restored the glory of Palenque, but turned it into a magnificient city, as your people built the greatest monuments and architecture the world has ever known. = Berlututlah di hadapan Raja Pacal yang Agung, putera para dewa dan pelindung wilayah Palenque! Selepas kerajaan tuanku diganggu pesaing jiran bertahun-tahun, tuanku membalas musuh rakyat, mengalahkan setiap satu dan mengorbankan pemimpin mereka sebagai balasan penghinaan terhadap leluhur tuanku. Kebijaksanaan dan tekad kuat bukan sahaja memulihkan kegemilangan Palenque, malah menjadikannya kota megah; rakyat membina tugu dan seni bina teragung yang pernah diketahui dunia.
Absolute King, your people need you to save the great Mayan culture and knowledge. Will you be able to read the movement of the stars, and find in the heavens the power to repel any foes? Will your new empire shine through the ages of history? = Raja Mutlak, rakyat memerlukan tuanku untuk menyelamatkan budaya dan ilmu Maya yang agung. Mampukah tuanku membaca pergerakan bintang dan menemukan kuasa di langit untuk menangkis setiap musuh? Akankah empayar baharu tuanku bersinar sepanjang sejarah?
