Isabella = Isabella
God will probably forgive you... but I shall not. Prepare for war. = Tuhan mungkin mengampunimu... tetapi aku tidak. Bersedialah untuk perang.
Repugnant spawn of the devil! You will pay! = Keturunan syaitan yang menjijikkan! Kamu akan menerima balasannya!
If my defeat is, without any doubt, the will of God, then I will accept it. = Jika kekalahanku benar-benar kehendak Tuhan, aku akan menerimanya.
God blesses those who deserve it. I am Isabel of Spain. = Tuhan memberkati mereka yang layak. Aku Isabel dari Sepanyol.
I hope this deal will receive your blessing. = Aku berharap urus niaga ini mendapat restumu.
Seven Cities of Gold = Tujuh Kota Emas
Holy Isabella, envoy of God, Great Queen of Castille and León, your people celebrate you! Spain is a beautiful and ancient country, a link between Europe and Africa, one shore on the Mediterranean and the other on the mighty Atlantic Ocean. The Spanish culture had taken the best of the Christian and Muslim worlds, and was ready to dominate the world for centuries. Powerful Spanish military fleets and brave explorers found and conquered much of the New World. Exploiting a whole new continent and its riches, Spain reached a state of power few could compete with for hundreds of years. = Isabella yang suci, utusan Tuhan, Ratu Agung Castille dan León, rakyat menyanjung tuanku! Sepanyol ialah negara indah dan purba, penghubung Eropah dan Afrika, dengan satu pantai di Mediterranean dan satu lagi di Lautan Atlantik yang perkasa. Budaya Sepanyol mengambil yang terbaik daripada dunia Kristian dan Islam, lalu bersedia menguasai dunia selama berabad-abad. Armada tentera Sepanyol yang kuat dan penjelajah berani menemukan serta menakluki sebahagian besar Dunia Baharu. Dengan memanfaatkan seluruh benua baharu dan kekayaannya, Sepanyol mencapai kuasa yang hanya mampu disaingi segelintir negara selama beratus-ratus tahun.
O splendid and virtuous Isabella! By the will of the heavens, will Spain reborn to achieve its holy destiny and become a new El Dorado? Will your new empire shine through the ages of history? = Wahai Isabella yang gemilang dan berbudi! Dengan kehendak langit, akankah Sepanyol lahir semula untuk menunaikan takdir sucinya dan menjadi El Dorado baharu? Akankah empayar baharu tuanku bersinar sepanjang sejarah?
