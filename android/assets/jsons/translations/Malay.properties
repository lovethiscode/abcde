O divine Montezuma, your people welcome you! May your magnificence inspire all living things! The mighty Aztecs were nomads until the 12th century, when they choose to settle in the mesa central, which would later be called Mexico. Wars were frequent with other tribes to control the rich land surrounding the sacred lakes of Texcoco, Xaltocan and Zampango. In some 200 years, double-sided alliances and martial prowess made of the Aztecs the dominant power in the Central American basin, forming a mighty empire stretching from sea to sea. Alas, the empire fell under the assault of foreign devils - the Spaniards and many curses they brought with them! Wars between tribes and weaponry of doom used by the invaders made the great Aztec civilization crumble in only a few decades. = Wahai Montezuma yang mulia, rakyat mengalu-alukan tuanku! Semoga keagungan tuanku mengilhami segala yang hidup! Aztec yang perkasa ialah bangsa nomad sehingga abad ke-12, apabila memilih menetap di dataran tinggi tengah yang kelak dinamakan Mexico. Perang kerap berlaku dengan suku lain untuk menguasai tanah subur di sekitar tasik suci Texcoco, Xaltocan dan Zampango. Dalam kira-kira 200 tahun, perikatan bermuka dua dan kehandalan perang menjadikan Aztec kuasa utama lembangan Amerika Tengah, membentuk empayar perkasa dari laut ke laut. Malangnya, empayar tumbang diserang syaitan asing — orang Sepanyol dan pelbagai sumpahan yang mereka bawa! Perang antara suku dan senjata pembinasa penceroboh meruntuhkan tamadun Aztec dalam beberapa dekad sahaja.
O mighty King Montezuma, do you hear the call of your people seeking for revenge? Will you lead them to victory under the light of the Five Suns? Will your new empire shine through the ages of history? = Wahai Raja Montezuma yang perkasa, adakah tuanku mendengar seruan rakyat yang menuntut pembalasan? Akankah tuanku memimpin mereka menuju kemenangan di bawah cahaya Lima Matahari? Akankah empayar baharu tuanku bersinar sepanjang sejarah?
