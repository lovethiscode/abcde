Fastlane_short_description = Permainan 4X sumber terbuka untuk membina tamadun

# Documentation: https://f-droid.org/en/docs/Build_Metadata_Reference/#Description
# English to translate: https://github.com/yairm210/Unciv/blob/master/fastlane/metadata/android/en-US/full_description.txt
Fastlane_full_description = Pelaksanaan semula sumber terbuka bagi permainan pembinaan tamadun paling terkenal sepanjang zaman — pantas dan kecil!\n\nBina tamadun anda, selidik teknologi, luaskan bandar anda dan kalahkan musuh anda!\n\nAda permintaan atau pepijat? Mahu membantu pembangunan? Senarai tugasan aplikasi terdapat di https://github.com/jerry8870/Unciv4iOS\n\nAda soalan atau komen? Sertai kami di Discord: https://discord.gg/bjrB4Xw ;)\n\nMahu membantu menterjemahkan permainan ke dalam bahasa anda? Lihat https://yairm210.github.io/Unciv/Translating/Translating/\n\nDunia menanti! Adakah anda akan membina tamadun anda menjadi sebuah empayar yang mampu bertahan menghadapi ujian masa?\n\nKebenaran ‘akses rangkaian penuh’ diperlukan untuk muat turun yang dimulakan oleh pengguna dan ciri berbilang pemain. Semua kebenaran lain yang disenaraikan disertakan secara automatik oleh API yang digunakan untuk melaksanakan pemberitahuan giliran berbilang pemain. Kebenaran rangkaian digunakan untuk menyenaraikan mod, memuat turun mod dan muzik, serta memuat naik/memuat turun permainan berbilang pemain. Unciv tidak memulakan sebarang komunikasi internet yang lain.


