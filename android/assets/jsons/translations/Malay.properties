May the gods bless you, great Nebuchadnezzar, ruler of ancient Babylon! Built 5000 years ago, Babylon emerged as an empire in 1800 BC, thanks to godlike Hammurabi, The Giver of Law. Falling under the Kassites assaults then the Assyrian domination, Babylon was reborn from its ashes, gaining back its independance, and became the beacon for Arts and Learning in the ancient world. O Nebuchadnezzar, after your death, Babylon quickly fell, conquered by the mighty Persians, and then by the Greeks, until the great city disappeared forever in 141 BC. = Semoga para dewa memberkati tuanku, Nebuchadnezzar yang agung, pemerintah Babylon purba! Dibina 5000 tahun dahulu, Babylon muncul sebagai empayar pada 1800 SM berkat Hammurabi yang bak dewa, Pemberi Undang-undang. Setelah jatuh akibat serangan Kassite dan penguasaan Assyria, Babylon bangkit semula dari abu, memperoleh kemerdekaan dan menjadi pelita Seni dan Ilmu di dunia purba. Wahai Nebuchadnezzar, selepas kemangkatan tuanku, Babylon segera jatuh ditakluki Parsi yang perkasa, kemudian Yunani, sehingga kota agung itu lenyap selama-lamanya pada 141 SM.
