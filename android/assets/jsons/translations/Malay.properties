All hail Great King Gustavus Adolphus, founder of the Swedish Empire, and one of the most famous military tacticians. In the early 17th century, Sweden emerged as a great power in Europe under your reign, thanks to your wisdom, both in diplomacy and warfare. As king, you decided to reform Swedish laws to bring economic stability and prosperity to your people. Your allies, and also your enemies, called you the 'Lion of the North', witnessing your modern vision of warfare, and the prowess of your armies on the battlefield. As you triumphed in the Thirty Years' War, your name will be forever remembered as one of history's greatest generals. = Salam hormat kepada Raja Gustavus Adolphus yang Agung, pengasas Empayar Sweden dan antara ahli taktik tentera paling terkenal. Pada awal abad ke-17, Sweden muncul sebagai kuasa besar Eropah di bawah pemerintahan tuanku, berkat kebijaksanaan dalam diplomasi dan perang. Sebagai raja, tuanku mereformasi undang-undang Sweden untuk membawa kestabilan ekonomi dan kemakmuran rakyat. Sekutu dan musuh menggelar tuanku 'Singa Utara', menyaksikan wawasan peperangan moden dan kehebatan tentera di medan perang. Kejayaan tuanku dalam Perang Tiga Puluh Tahun memastikan nama tuanku dikenang selamanya sebagai antara jeneral terhebat sejarah.
O noble King, will you lend your leadership and brilliant ideas to Sweden once again, to conceive strategies never seen before? Will your new empire shine through the ages of history? = Wahai Raja yang mulia, akankah tuanku meminjamkan kepimpinan dan idea cemerlang kepada Sweden semula untuk mencipta strategi yang belum pernah dilihat? Akankah empayar baharu tuanku bersinar sepanjang sejarah?
