You shall stain this land no longer with your vileness! To arms, my countrymen. We ride to war! = Kamu tidak akan lagi mencemarkan tanah ini dengan kejijikanmu! Angkat senjata, sebangsaku. Kita menuju perang!
Traitorous man! The Celtic peoples will not stand for such wanton abuse and slander - I shall have your balls! = Pengkhianat! Bangsa Celt tidak akan menerima penganiayaan dan fitnah melampau ini — aku akan mengambil buah zakarmu!
Vile ruler, know you have won this war in name alone. Your cities lie buried and your troops defeated. I have my own victory. = Pemerintah keji, ketahuilah kamu menang perang ini pada nama sahaja. Bandar-bandar kamu tertimbus dan tenteramu kalah. Aku mempunyai kemenanganku sendiri.
Don't forget who you're dealing with. Arrogant moves can get you in danger. = Jangan lupa dengan siapa kamu berurusan. Tindakan angkuh boleh membahayakanmu.
I am Boudicca, Queen of the Celts. Let no-one underestimate me! = Aku Boudicca, Ratu Celt. Jangan sesiapa memandang rendah diriku!
Let us join our forces together and reap the rewards. = Mari gabungkan kekuatan dan nikmati ganjarannya.
God has given good to you. = Tuhan telah mengurniakan kebaikan kepadamu.
Druidic Lore = Ilmu Druid
May glory and honor always be upon you, Warrior Queen! In a time dominated by men, you successfully claimed the throne and the power, but also valiantly defied the mighty Roman Empire. Punished and humiliated by the hand of the Roman bloody invaders, you united your people and led a terrible revolt, to seek revenge. Many legions fell under your fierce attacks and you burned the city of London with your anger. While the Romans still kept ownership of your land after your final defeat, your actions nonetheless showed Rome that this land could never be fully conquered, making Nero himself consider to withdraw all troops and leaving Britain forever. = Semoga kegemilangan dan maruah sentiasa bersama tuanku, Ratu Pahlawan! Dalam zaman yang dikuasai lelaki, tuanku berjaya menuntut takhta dan kuasa serta gagah mencabar Empayar Rom yang perkasa. Dihukum dan dihina penceroboh Rom yang berdarah, tuanku menyatukan rakyat dan memimpin pemberontakan dahsyat untuk membalas dendam. Banyak legiun jatuh diserang tuanku dan kota London dibakar dalam kemarahan. Walaupun Rom masih menguasai tanah tuanku selepas kekalahan terakhir, tindakan tuanku menunjukkan tanah ini tidak mungkin ditakluki sepenuhnya, sehingga Nero sendiri mempertimbangkan menarik semua tentera dan meninggalkan Britain selama-lamanya.
O raging lioness, will you lead the Celts again under the glory of your name, to spread the fires of liberty, and achieve a final victory? Will your new empire shine through the ages of history? = Wahai singa betina yang mengamuk, akankah tuanku memimpin Celt semula di bawah kegemilangan nama tuanku, menyebarkan api kebebasan dan meraih kemenangan terakhir? Akankah empayar baharu tuanku bersinar sepanjang sejarah?
