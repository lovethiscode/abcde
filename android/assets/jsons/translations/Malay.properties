Differences from Civilization V = Perbezaan daripada Civilization V
Production Focus\nIn Civilization V, the Food yield in a city is calculated first, then population grows by consuming stored food (growth), then production is calculated, and so on one by one the other stats are calculated. Thus, citizens can produce yields in the same turn as they are born. The city focus is set to Production to assign the newborn citizen to a hill so they'll contribute Production, and then manually reassigned to a growth tile on the next turn. Alternatively, you can set city focus to Gold (e.g. with Cerro de Potosi), Faith (e.g. with Mount Sinai) or whatever gains the most yields. In Unciv, citizens only start producing yields on the next turn, so you can ignore this whole concept. = Tumpuan Pengeluaran\nDalam Civilization V, hasil Makanan bandar dikira dahulu, kemudian penduduk bertambah dengan memakan makanan tersimpan, diikuti Pengeluaran dan statistik lain satu demi satu. Maka rakyat boleh menghasilkan hasil pada giliran kelahirannya. Tumpuan bandar ditetapkan kepada Pengeluaran untuk menempatkan rakyat baharu di bukit supaya menyumbang Pengeluaran, kemudian dialihkan secara manual ke jubin pertumbuhan pada giliran berikutnya. Atau tetapkan tumpuan kepada Emas (contohnya Cerro de Potosi), Kepercayaan (contohnya Gunung Sinai) atau apa sahaja yang memberi hasil terbanyak. Dalam Unciv, rakyat hanya mula menghasilkan hasil pada giliran berikutnya, maka seluruh konsep ini boleh diabaikan.
Science Queueing\nIn Civilization V, Science yield is calculated after production, so if you finish an item and have Science (or Gold) queued as a perpetual construction, the Production overflow from item will be converted into Science (or Gold), but the Production is not consumed, as this will only happen again on the next turn. By immediately swapping out your perpetual construction for an item on the next turn, you'll get this Science (or Gold) for free. This doesn't apply to Unciv, so don't bother. = Baris Gilir Sains\nDalam Civilization V, hasil Sains dikira selepas pengeluaran. Maka jika item siap dan Sains atau Emas dibariskan sebagai pembinaan berterusan, lebihan Pengeluaran ditukar kepada Sains atau Emas tanpa menghabiskan Pengeluaran; ini berulang pada giliran berikutnya. Dengan segera menukar pembinaan berterusan kepada item lain pada giliran berikutnya, anda mendapat Sains atau Emas itu secara percuma. Ini tidak terpakai dalam Unciv, maka tidak perlu dicuba.
Double Aqueducts\nIn Civilization V, the game sells existing copies of the building for you before providing a free copy of the building. So, if you build an aqueduct in a city, and then in the turn of adopting Tradition Complete you sell a cheap building (e.g a shrine) beforehand, the game is unable to sell more than 1 building per turn, and thus you'll keep your aqueduct, together with the new free aqueduct. Not applicable to Unciv. = Akueduk Berganda\nDalam Civilization V, permainan menjual salinan bangunan sedia ada sebelum memberikan salinan percuma. Jika anda membina akueduk, kemudian menjual bangunan murah seperti tempat suci terlebih dahulu pada giliran menerima pakai Tradisi Lengkap, permainan tidak boleh menjual lebih daripada 1 bangunan setiap giliran; maka akueduk asal kekal bersama akueduk percuma baharu. Tidak terpakai dalam Unciv.
Legalism Oxford\nIn Civilization V, national wonders such as Oxford University are considered culture buildings, so you can get them for free with Legalism. Not applicable to Unciv. = Oxford Legalisme\nDalam Civilization V, keajaiban negara seperti Universiti Oxford dianggap bangunan budaya, maka boleh diperoleh percuma melalui Legalisme. Tidak terpakai dalam Unciv.
Roads and Forts\nIn Civilization V, you can't use roads and forts in enemy territory. In Unciv, you can use them, so instead of mindlessly constructing them everywhere when at war, you need to decide if and when they'll benefit you more than your opponents. = Jalan dan Kubu\nDalam Civilization V, anda tidak boleh menggunakan jalan dan kubu di wilayah musuh. Dalam Unciv, anda boleh, maka sebelum membinanya di mana-mana semasa perang, tentukan sama ada dan bila ia lebih menguntungkan anda berbanding lawan.
Citizen Conversion\nIn Civilization V, a citizen is born religious if the parent city is already converted. This is not the case in Unciv, which can lead to temporary deconversion of a city when it grows. = Agama Rakyat Baharu\nDalam Civilization V, rakyat lahir beragama jika bandarnya sudah memeluk agama. Ini tidak berlaku dalam Unciv, maka bandar boleh kehilangan status agama majoritinya buat sementara apabila berkembang.
Unassigned Citizens\nIn Civilization V, unassigned citizens are considered specialists, and subject to the same type of bonuses (e.g. Korea's ability). It can be worthwhile to leave citizens unassigned, instead of being assigned to a tile. Not applicable to Unciv. = Rakyat Tanpa Tugasan\nDalam Civilization V, rakyat tanpa tugasan dianggap pakar dan menerima bonus yang sama seperti keupayaan Korea. Membiarkan rakyat tanpa tugasan mungkin lebih berfaedah daripada menempatkannya pada jubin. Tidak terpakai dalam Unciv.
Settler Construction\nIn Civilization V, cities can't starve when constructing settlers, so you can assign all citizens to production tiles and none to food tiles. In Unciv, citizens keep consuming two food per turn. = Penghasilan Peneroka\nDalam Civilization V, bandar tidak boleh kebuluran semasa menghasilkan peneroka, maka semua rakyat boleh ditempatkan pada jubin pengeluaran tanpa jubin makanan. Dalam Unciv, rakyat terus memakan dua makanan setiap giliran.
Water Melee Attack\nAs result of a Discord poll, Water Melee units can attack military land units on the shore, unlike in Civilization V. = Serangan Jarak Dekat Laut\nHasil tinjauan Discord membolehkan unit Jarak Dekat Laut menyerang unit tentera darat di pantai, berbeza daripada Civilization V.
Tile improvements\nIn Civilzation V, workers start working on an improvement-under-construction at the beginning of movement. Unciv changes this, to allow players to assign workers to tiles, and then reconsider and change improvement or move them elsewhere. = Pembangunan Jubin\nDalam Civilzation V, pekerja mula mengerjakan pembangunan dalam pembinaan pada awal pergerakan. Unciv mengubahnya agar pemain boleh menempatkan pekerja, kemudian menimbang semula dan menukar pembangunan atau memindahkannya.
Forest and Jungle Visibility\nIn Unciv, forests and jungles are visible 1 tile outside visibility range. In Civilization V, this is the behaviour of hills and mountains, but not of forests and jungles, yet jungle and forest can block hills, and hill + forest can block mountain, indicating they're on the same elevation. This is considered to be a bug in the otherwise well-structured visibility logic in Civilization V. = Penglihatan Hutan dan Rimba\nDalam Unciv, hutan dan rimba kelihatan 1 jubin di luar julat penglihatan. Dalam Civilization V, ini terpakai kepada bukit dan gunung tetapi bukan hutan dan rimba; namun hutan serta rimba boleh menghalang bukit, dan bukit berhutan boleh menghalang gunung, menandakan ketinggiannya sama. Ini dianggap pepijat dalam logik penglihatan Civilization V yang selainnya tersusun baik.
City razing\nIn Civilization V, the player can never raze any of the cities he/she founded. Not applicable to Unciv. = Pemusnahan Bandar\nDalam Civilization V, pemain tidak boleh memusnahkan bandar yang diasaskan sendiri. Tidak terpakai dalam Unciv.

Founding Cities\nThe Settler is a unit that can found a new city. You can build a Settler unit in a city with at least 2 population, and then move them to a good location to found a new city. This will usually be your main way of acquiring more cities. = Mengasaskan Bandar\nPeneroka ialah unit yang boleh mengasaskan bandar baharu. Anda boleh menghasilkannya di bandar dengan sekurang-kurangnya 2 penduduk, kemudian menggerakkannya ke lokasi baik untuk mengasaskan bandar. Ini biasanya cara utama memperoleh lebih banyak bandar.
Food conversion to Production\nDuring the construction of a Settler, the city will not grow. Instead, the 1st, 2nd, 4th, and from there on every 4th, excess Food (Growth) is converted into Production, with the rest of the excess Food being lost. = Penukaran Makanan kepada Pengeluaran\nSemasa menghasilkan Peneroka, bandar tidak berkembang. Sebaliknya, Makanan lebihan (Pertumbuhan) yang ke-1, ke-2, ke-4 dan setiap ke-4 selepas itu ditukar kepada Pengeluaran, manakala baki lebihan Makanan hilang.

