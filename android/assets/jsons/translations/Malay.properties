#################### Lines from Global Tutorials ####################

Welcome to Unciv!\nBecause this is a complex game, there are basic tasks to help familiarize you with the game.\nThese are completely optional, and you're welcome to explore the game on your own! = Selamat datang ke Unciv!\nOleh sebab permainan ini rumit, tugasan asas disediakan untuk membantu anda membiasakan diri.\nSemuanya pilihan sahaja, dan anda bebas menerokai permainan sendiri!

Welcome to Unciv! = Selamat datang ke Unciv!
Because this is a complex game, there are some tutorials to help familiarize you with it. These can be disabled in the Options -> Display menu, but please hang on if you're new here! = Oleh sebab permainan ini rumit, tutorial disediakan untuk membantu anda membiasakan diri. Ia boleh dimatikan dalam menu Pilihan -> Paparan, tetapi teruskan membacanya jika anda pemain baharu!
Your first mission is to found your capital city. This is actually an important task because your capital city will probably be your most prosperous. Many game bonuses apply only to your capital city, and it will be the center of your empire. = Misi pertama anda ialah mengasaskan ibu kota. Ini sebenarnya tugas penting kerana ibu kota mungkin menjadi bandar paling makmur anda. Banyak bonus permainan hanya terpakai kepada ibu kota, dan ia akan menjadi pusat empayar anda.
How do you know a city location is appropriate? Luckily, the game has already chosen a good location for you. You can settle in this place, or maybe move a turn to found on a Hill (for Production and defence) or next to a Mountain (to gain access to the Observatory building later on). = Bagaimana mengetahui lokasi bandar sesuai? Mujurlah permainan telah memilih lokasi baik untuk anda. Anda boleh menetap di sini atau bergerak satu giliran untuk mengasas di Bukit (bagi Pengeluaran dan pertahanan) atau di sebelah Gunung (untuk membina Balai Cerap kemudian).
You'll likely want more cities later on. For these cities, you must go and find a good place. Looking for and founding on or near Luxury resources is a good rule of thumb. = Anda mungkin mahu lebih banyak bandar kemudian. Untuk bandar itu, anda perlu mencari tempat yang baik. Petua berguna ialah mencari dan mengasas di atas atau berhampiran sumber Mewah.
Luxury resources are tiles that have things like Gems, Cotton, or Silk (indicated by a yellow background of the resource icon). These resources make your civilization happy. You should also keep an eye out for resources needed to build units, such as Iron. Cities cannot be built within 3 tiles of existing cities, which is another thing to keep in mind! = Sumber mewah ialah jubin dengan barang seperti Permata, Kapas atau Sutera, ditandakan latar kuning pada ikon sumber. Sumber ini menggembirakan tamadun anda. Perhatikan juga sumber untuk menghasilkan unit seperti Besi. Ingat bahawa bandar tidak boleh dibina dalam lingkungan 3 jubin dari bandar sedia ada!
Cities will house Citizens, which can work tiles up to 3 tiles away from the city. This means you don’t have to settle cities right on or next to good tiles. Let’s say, for example, that you want access to some Iron – but the resource is in a desert area. You don’t have to settle your city in the desert. You can settle a few tiles away in more prosperous lands. Your city will grow and eventually gain access to the resource. You only need to settle right on top of resources if you need them immediately. = Bandar menempatkan Rakyat yang boleh mengerjakan jubin sehingga 3 jubin dari bandar. Maka anda tidak perlu mengasas betul-betul di atas atau di sebelah jubin yang baik. Contohnya, anda mahu Besi tetapi sumber itu di gurun. Anda tidak perlu membina bandar di gurun; bina beberapa jubin jauhnya di tanah lebih makmur. Bandar akan berkembang dan akhirnya mencapai sumber itu. Anda hanya perlu mengasas tepat di atas sumber jika memerlukannya serta-merta.
The first thing coming out of your city depends on the strategy you want to follow, but the 'classic' build order is to build first two Scouts, then a Shrine, and three Settlers, and adopt Tradition, to explore the map quickly (Scouts ignore terrain cost), and to get an early Pantheon (if you're playing with religion enabled). = Pengeluaran pertama bandar bergantung pada strategi anda, tetapi urutan 'klasik' ialah dua Peninjau dahulu, kemudian Tempat Suci dan tiga Peneroka, sambil menerima pakai Tradisi, untuk menerokai peta dengan cepat (Peninjau mengabaikan kos rupa bumi) dan mendapat Panteon awal jika agama diaktifkan.
But feel free to experiment with your own build orders! = Namun cubalah urutan pembinaan anda sendiri!

In your first couple of turns, you will have very little options, but as your civilization grows, so do the number of things requiring your attention. = Dalam beberapa giliran awal, pilihan anda sangat sedikit, tetapi apabila tamadun berkembang, semakin banyak perkara memerlukan perhatian.

Culture and Policies = Budaya dan Polisi
Each turn, the culture you gain from all your cities is added to your Civilization's culture.\nWhen you have enough culture, you may pick a Social Policy, each one giving you a certain bonus. = Setiap giliran, budaya daripada semua bandar ditambah kepada budaya Tamadun anda.\nApabila budaya mencukupi, anda boleh memilih Polisi Sosial yang memberikan bonus tertentu.
The policies are organized into branches, with each branch providing a bonus ability when all policies in the branch have been adopted. = Polisi disusun dalam cabang; setiap cabang memberikan keupayaan bonus apabila semua polisinya diterima pakai.
With each policy adopted, and with each city built,\n  the cost of adopting another policy rises - so choose wisely! = Setiap polisi yang diterima pakai dan setiap bandar yang dibina\n  meningkatkan kos polisi seterusnya — maka pilihlah dengan bijak!

City Expansion = Peluasan Bandar
Once a city has gathered enough Culture, it will expand into a neighboring tile.\nYou have no control over the tile it will expand into, but tiles with resources and higher yields are prioritized. = Apabila bandar mengumpulkan Budaya yang cukup, ia meluas ke jubin bersebelahan.\nAnda tidak boleh memilih jubin tersebut, tetapi jubin bersumber dan berhasil tinggi diutamakan.
Each additional tile will require more culture, but generally your first cities will eventually expand to a wide tile range. = Setiap jubin tambahan memerlukan lebih banyak budaya, tetapi bandar awal anda biasanya akhirnya meluas ke kawasan yang besar.
Although your city will keep expanding forever, your citizens can only work 3 tiles away from city center.\nThis should be taken into account when placing new cities. = Walaupun bandar terus meluas selama-lamanya, rakyat hanya boleh mengerjakan jubin sehingga 3 jubin dari pusat bandar.\nAmbil kira perkara ini apabila menempatkan bandar baharu.

Food is the resource fundamental to your Cities', and as a result Nation's, population and health. = Makanan ialah sumber asas bagi penduduk dan kesihatan Bandar anda, dan seterusnya Negara.
Every Citizen in each City consumes Food per turn. Any left over is considered Growth and is stored in the City Center. Once enough accumulates, the City Grows and a new Citizen is added. = Setiap Rakyat di setiap Bandar menggunakan Makanan setiap giliran. Bakinya dikira sebagai Pertumbuhan dan disimpan di Pusat Bandar. Apabila cukup terkumpul, Bandar Berkembang dan Rakyat baharu ditambah.
Initially your main source of Food is the City Center itself and working a surrounding tile with a Citizen. You can increase how much is generated by gaining more Citizens to work more tiles, improving the tiles so that they yield more Food, and eventually Buildings and Policies. = Pada awalnya, sumber Makanan utama ialah Pusat Bandar sendiri dan Rakyat yang mengerjakan jubin sekeliling. Anda boleh menambah pengeluaran dengan mendapatkan lebih ramai Rakyat untuk mengerjakan lebih banyak jubin, membangunkan jubin supaya menghasilkan lebih banyak Makanan, dan kemudian melalui Bangunan dan Polisi.
Since a city's number of Citizens, or Population, determines how many tiles a City can work, Food is often the most important Resource. = Oleh sebab bilangan Rakyat atau Penduduk menentukan jumlah jubin yang boleh dikerjakan Bandar, Makanan sering menjadi Sumber terpenting.

Production is the resource that lets a City Center build new things. = Pengeluaran ialah sumber yang membolehkan Pusat Bandar membina perkara baharu.
This can be new Buildings that are added to the City Center, or new Units that can go out across the World Map to advance your Nation's goals. = Ini boleh berupa Bangunan baharu di Pusat Bandar atau Unit baharu yang menjelajah Peta Dunia untuk memajukan matlamat Negara anda.
Everything you can build has a Production Cost. Every turn each City generates a certain amount of Production and puts it towards whatever is at the top of the Build Queue. Once the total cost is collected, the Building or Unit is built! = Segala yang boleh dibina mempunyai Kos Pengeluaran. Setiap giliran, setiap Bandar menjana sejumlah Pengeluaran untuk perkara di awal Baris Gilir Pembinaan. Apabila jumlah kos terkumpul, Bangunan atau Unit siap!
Any excess Production after something is built is overflowed to the next thing the City builds. Up to it's total Production Cost. = Lebihan Pengeluaran selepas sesuatu siap dibawa ke pembinaan seterusnya, sehingga jumlah Kos Pengeluarannya.
Since this determines how quickly you can build more stuff, your Nation's Production Capacity is crucial to it's advancement and survival. = Oleh sebab ini menentukan kepantasan anda membina, Keupayaan Pengeluaran Negara amat penting untuk kemajuan dan kelangsungannya.

⍾Science is the resource that unlocks new and exciting Technologies for your Nation. = ⍾Sains ialah sumber yang membuka Teknologi baharu yang menarik untuk Negara anda.
Once you've Founded your Capital, you'll be prompted to Pick a Technology to Research. = Selepas Mengasaskan Ibu Kota, anda akan diminta Memilih Teknologi untuk Dikaji.
Every Technology costs an amount of ⍾Science. Every turn the ⍾Science your Nation produces is paid towards Researching your chosen Technology. = Setiap Teknologi memerlukan sejumlah ⍾Sains. Setiap giliran, ⍾Sains Negara digunakan untuk Mengkaji Teknologi pilihan anda.
Once a Technology has it's cost fully paid, you unlock the benefits for your Nation! This could be new Units, Buildings, or other advantages. Any surplus will overflow into the next Technology you pick to Research. = Apabila kos Teknologi dibayar sepenuhnya, manfaatnya dibuka kepada Negara anda! Ini mungkin Unit, Bangunan atau kelebihan lain yang baharu. Lebihannya dibawa ke Teknologi seterusnya yang dipilih.
Researching a Technology in the next Era will advance you into that Era and trigger a notification to other Nations about how amazing you are! = Mengkaji Teknologi pada Era seterusnya memajukan anda ke Era itu dan memberitahu Negara lain betapa hebatnya anda!
Since new Technologies tend to give access to better Units, Buildings, and even unlock powerful new Policies, staying ahead of the competition is one of the best ways to secure your Victory! = Oleh sebab Teknologi baharu biasanya memberikan Unit dan Bangunan lebih baik, malah membuka Polisi baharu yang kuat, mendahului pesaing ialah antara cara terbaik menjamin Kemenangan!

Ah Gold. The Universal Medium of Exchange. Everyone loves Gold! They say it can't buy Happiness, but nuclear submarines are almost as good. = Ah, Emas. Alat Pertukaran Sejagat. Semua orang sukakan Emas! Katanya ia tidak boleh membeli Kegembiraan, tetapi kapal selam nuklear hampir sama baiknya.
You can earn more Gold from Tiles, Resources, Improvements, and eventually Buildings, Specialists, and Trade Routes. Ancient Ruins, meeting new City-States, and Pillaging are also great sources of Gold. During a Golden Age every Tile that already yields Gold will yield an additional Gold! = Anda boleh mendapat lebih banyak Emas daripada Jubin, Sumber, Pembangunan dan kemudian Bangunan, Pakar serta Laluan Dagangan. Runtuhan Purba, pertemuan dengan Negara Kota baharu dan Penjarahan juga sumber Emas yang baik. Semasa Zaman Kegemilangan, setiap Jubin yang sudah menghasilkan Emas akan menghasilkan satu Emas tambahan!
Gold is how you pay for Building Maintenance, Transportation Upkeep, and Unit Upkeep. If you run out of Gold, first you'll receive penalties to your ⍾Science production, then eventually your Units will start Disbanding as you can't pay their upkeep. = Emas membayar Penyelenggaraan Bangunan, Pengangkutan dan Unit. Jika Emas habis, mula-mula pengeluaran ⍾Sains dikenakan penalti, kemudian Unit mula Dibubarkan kerana anda tidak mampu menanggung penyelenggaraannya.
Gold can be used to Buy Buildings and Units, helping bring up a new City or quickly build an Army. It can also buy Tiles to add to your City. It's also used to Upgrade your units from their older, obsolete forms to new, stronger versions. And investing it into a Research Agreement is a great way to convert it into ⍾Science. = Emas boleh Membeli Bangunan dan Unit untuk memajukan Bandar baharu atau membentuk Tentera dengan cepat. Ia juga membeli Jubin untuk Bandar dan Menaik Taraf unit lama yang usang kepada versi baharu yang lebih kuat. Melabur dalam Perjanjian Penyelidikan juga cara baik menukarnya kepada ⍾Sains.
Gold is also very valuable in Diplomacy. You can directly Gift Gold to City-States to gain their favor. Use it to balance a Trade Deal with other Nations. Or demand every last drop after a successful war and your enemy sues for peace. = Emas juga sangat bernilai dalam Diplomasi. Anda boleh Menghadiahkan Emas terus kepada Negara Kota untuk meraih sokongan. Gunakannya untuk mengimbangi Dagangan dengan Negara lain, atau tuntut semuanya selepas menang perang apabila musuh meminta damai.
Ironically, some may consider Gold to be one of the less important Resources. But it's flexible nature and importance to keep your Nation running makes it a precious thing to pay attention to. After all, everyone loves Gold. = Ironinya, ada yang menganggap Emas antara Sumber kurang penting. Namun sifatnya yang fleksibel dan kepentingannya untuk menjalankan Negara menjadikannya berharga dan perlu diperhatikan. Lagipun, semua orang sukakan Emas.
Not to be confused with the Resource of the same name, Gold Ore = Jangan keliru dengan Sumber senama, Bijih Emas
Trade Route = Laluan Dagangan
See also: [param] = Lihat juga: [param]
Research Agreements = Perjanjian Penyelidikan

As cities grow in size and influence, you have to deal with a happiness mechanic that is no longer tied to each individual city.\nInstead, your entire empire shares the same level of satisfaction.\nAs your cities grow in population you’ll find that it is more and more difficult to keep your empire happy. = Apabila bandar bertambah besar dan berpengaruh, anda perlu mengurus kegembiraan yang tidak lagi terikat pada bandar individu.\nSebaliknya seluruh empayar berkongsi tahap kepuasan yang sama.\nApabila penduduk bandar bertambah, semakin sukar memastikan empayar gembira.
In addition, you can’t even build any city improvements that increase happiness until you’ve done the appropriate research.\nIf your empire’s happiness ever goes below zero the growth rate of your cities will be hurt.\nIf your empire becomes severely unhappy (as indicated by the smiley-face icon at the top of the interface)\n  your armies will have a big penalty slapped on to their overall combat effectiveness. = Selain itu, anda tidak boleh membina pembangunan bandar yang meningkatkan kegembiraan sehingga penyelidikan yang sesuai selesai.\nJika kegembiraan empayar jatuh di bawah sifar, kadar pertumbuhan bandar terjejas.\nJika empayar sangat tidak gembira, seperti ditunjukkan ikon wajah di bahagian atas antara muka,\n  tentera anda menerima penalti besar terhadap keberkesanan tempur keseluruhan.
This means that it is very difficult to expand quickly in Unciv.\nIt isn’t impossible, but as a new player you probably shouldn't do it.\nSo what should you do? Chill out, scout, and improve the land that you do have by building Workers.\nOnly build new cities once you have found a spot that you believe is appropriate. = Ini bermakna peluasan pantas amat sukar dalam Unciv.\nIa bukan mustahil, tetapi sebagai pemain baharu elok dielakkan.\nJadi apa patut dibuat? Bertenang, meninjau dan bangunkan tanah sedia ada dengan Pekerja.\nBina bandar baharu hanya setelah menemukan lokasi yang anda rasa sesuai.

 # Requires translation!
Unhappiness = Ketidakbahagiaan
It seems that your citizens are unhappy!\nWhile unhappy, your civilization will suffer many detrimental effects, increasing in severity as unhappiness gets higher. = Nampaknya rakyat anda tidak gembira!\nTamadun yang tidak gembira mengalami pelbagai kesan buruk yang semakin teruk apabila ketidakgembiraan meningkat.
Unhappiness has two main causes: Population and cities.\n  Each city causes 3 unhappiness, and each population, 1 = Ketidakgembiraan mempunyai dua sebab utama: Penduduk dan bandar.\n  Setiap bandar menyebabkan 3 ketidakgembiraan dan setiap penduduk, 1
There are 2 main ways to combat unhappiness:\n  by building happiness buildings for your population\n  or by having improved luxury resources within your borders. = Ada 2 cara utama mengatasi ketidakgembiraan:\n  membina bangunan kegembiraan untuk penduduk\n  atau mempunyai sumber mewah yang dibangunkan dalam sempadan anda.

You have entered a Golden Age!\nGolden age points are accumulated each turn by the total happiness \n  of your civilization\nWhen in a golden age, culture and production generation increases +20%,\n  and every tile already providing at least one gold will provide an extra gold. = Anda memasuki Zaman Kegemilangan!\nMata zaman kegemilangan terkumpul setiap giliran berdasarkan jumlah kegembiraan \n  tamadun anda\nSemasa zaman kegemilangan, pengeluaran budaya dan pengeluaran meningkat +20%,\n  dan setiap jubin yang sudah menghasilkan sekurang-kurangnya satu emas memberikan satu emas tambahan.

Roads and Railroads = Jalan dan Landasan Kereta Api
Roads reduce the Movement Points required to move between two tiles connected by Roads. = Jalan mengurangkan Mata Pergerakan yang diperlukan untuk bergerak antara dua jubin yang dihubungkan Jalan.
Railroads improve this reduction even more! = Landasan Kereta Api mengurangkannya lebih lagi!
This greatly improves the speed you can get Units around the map. = Ini sangat meningkatkan kelajuan pergerakan Unit di peta.
Until you research the technology that removes it, Roads do not cross Rivers = Sehingga teknologi berkaitan dikaji, Jalan tidak menyeberangi Sungai
Connecting your cities to the capital by Roads and/or Railroads will generate Gold via the Trade Route. = Menghubungkan bandar ke ibu kota melalui Jalan dan/atau Landasan Kereta Api menghasilkan Emas melalui Laluan Dagangan.
However, since each Road and Railroad have a Maintenance Cost, it may be more economical to wait until the cities grow and only place where needed. = Namun setiap Jalan dan Landasan Kereta Api mempunyai Kos Penyelenggaraan, maka lebih menjimatkan jika menunggu bandar berkembang dan membinanya hanya di tempat perlu.

Connecting your cities to the capital by Roads and/or Railroads will generate Gold via the Trade Route. You earn more Gold the more Population the City and your Capital has. = Menghubungkan bandar ke ibu kota melalui Jalan dan/atau Landasan Kereta Api menghasilkan Emas melalui Laluan Dagangan. Semakin ramai Penduduk Bandar dan Ibu Kota, semakin banyak Emas diperoleh.
Note that each road costs 1 Gold Maintenance per turn, and each Railroad costs 2 Gold, so it may be more economical to wait until the cities grow! = Setiap jalan memerlukan 1 Emas Penyelenggaraan setiap giliran, dan setiap Landasan Kereta Api memerlukan 2 Emas, maka mungkin lebih menjimatkan menunggu bandar berkembang!
Railroads connecting a city to the Capital also provide a 25% Production Boost to the City, but not the Capital. = Landasan Kereta Api yang menghubungkan bandar ke Ibu Kota juga memberikan peningkatan Pengeluaran 25% kepada Bandar itu, tetapi bukan Ibu Kota.
Trade Routes are also connected over Water via certain buildings like the Harbor. As long as there is a chain that can reach the Capital, there's a Trade Route. Look for this symbol in Yellow below the City Name to mean you have an active Trade Route to your Capital. = Laluan Dagangan juga terhubung melalui Air dengan bangunan tertentu seperti Pelabuhan. Selagi ada rangkaian yang mencapai Ibu Kota, Laluan Dagangan wujud. Lambang Kuning di bawah Nama Bandar menandakan Laluan Dagangan aktif ke Ibu Kota.
Trade Routes can get broken either by Blockades or by Removing/Pillaging the connecting Road/Railroad chain. = Laluan Dagangan boleh terputus akibat Sekatan atau Jalan/Landasan Kereta Api penghubung Dibuang atau Dijarah.
City Blockade = Sekatan Bandar

Once you’ve settled 3-4 cities and build universities, you’re probably already 100 to 150 turns into the game.\nNow is a good time to start thinking about how, exactly, you want to win – if you haven’t already. = Selepas mengasaskan 3-4 bandar dan membina universiti, anda mungkin sudah bermain 100 hingga 150 giliran.\nKini masa yang sesuai memikirkan cara tepat untuk menang, jika belum lagi.
There are four ways to win in Unciv. They are:\n - Cultural Victory: Complete 5 Social Policy Trees and build the Utopia Project\n - Domination Victory: Conquer the original capital of all other Major civs\n - Science Victory: Be the first to construct a Spaceship\n - Diplomatic Victory: Build the United Nations and win the vote = Ada empat cara menang dalam Unciv:\n - Kemenangan Kebudayaan: Lengkapkan 5 Pohon Polisi Sosial dan bina Projek Utopia\n - Kemenangan Dominasi: Takluki ibu kota asal semua tamadun utama lain\n - Kemenangan Saintifik: Menjadi yang pertama membina Kapal Angkasa\n - Kemenangan Diplomatik: Bina Pertubuhan Bangsa-Bangsa Bersatu dan menangi undian
So to sum it up, these are the basics of Unciv – Found a prosperous first city, expand slowly to manage happiness, and set yourself up for the victory condition you wish to pursue.\nObviously, there is much more to it than that, but it is important not to jump into the deep end before you know how to swim. = Itulah asas Unciv: asaskan bandar pertama yang makmur, meluas perlahan untuk mengurus kegembiraan, dan bersedia bagi syarat kemenangan pilihan anda.\nSudah tentu masih banyak lagi, tetapi jangan terjun ke air dalam sebelum pandai berenang.

Enemy City = Bandar Musuh
Cities can be conquered by reducing their health to 1, and entering the city with a melee unit.\nSince cities heal each turn, it is best to attack with ranged units and use your melee units to defend them until the city has been defeated! = Bandar boleh ditakluki dengan menurunkan kesihatannya kepada 1 dan memasukinya dengan unit jarak dekat.\nOleh sebab bandar pulih setiap giliran, sebaiknya serang dengan unit jarak jauh dan gunakan unit jarak dekat untuk melindunginya sehingga bandar ditewaskan!

Luxury Resource = Sumber Mewah
Luxury resources within your domain and with their specific improvement are connected to your trade network.\nEach unique Luxury resource you have adds 5 happiness to your civilization, but extra resources of the same type don't add anything, so use them for trading with other civilizations! = Sumber mewah dalam wilayah anda dengan pembangunan khususnya dihubungkan ke rangkaian dagangan.\nSetiap jenis Sumber Mewah memberikan 5 kegembiraan, tetapi salinan tambahan jenis sama tidak menambah apa-apa, maka gunakannya untuk berdagang dengan tamadun lain!

Strategic Resource = Sumber Strategik
Strategic resources within your domain and with their specific improvement are connected to your trade network.\nStrategic resources allow you to train units and construct buildings that require those specific resources, for example the Horseman requires Horses. = Sumber strategik dalam wilayah anda dengan pembangunan khususnya dihubungkan ke rangkaian dagangan.\nSumber strategik membolehkan anda melatih unit dan membina bangunan yang memerlukannya; misalnya Askar Berkuda memerlukan Kuda.
Unlike Luxury Resources, each Strategic Resource on the map provides more than one of that resource.\nThe top bar keeps count of how many unused strategic resources you own.\nA full drilldown of resources is available in the Resources tab in the Overview screen. = Tidak seperti Sumber Mewah, setiap Sumber Strategik pada peta menyediakan lebih daripada satu salinan.\nBar atas mengira sumber strategik yang anda miliki dan belum digunakan.\nPecahan penuh sumber tersedia dalam tab Sumber pada skrin Gambaran Keseluruhan.

The city can no longer put up any resistance!\nHowever, to conquer it, you must enter the city with a melee unit = Bandar tidak lagi mampu melawan!\nNamun untuk menaklukinya, anda mesti memasuki bandar dengan unit jarak dekat

After Conquering = Selepas Penaklukan
When conquering a city, you can choose to liberate, annex, puppet, or raze the city. = Apabila menakluki bandar, anda boleh memilih untuk membebaskan, mengilhak, membonekakan atau memusnahkannya.
\nLiberating the city will return it to its original owner, giving you a massive diplomatic boost with them!\n\nAnnexing the city will give you full control over it, but also increase the citizens' unhappiness to 2x!\nThis can be mitigated by building a courthouse in the city, returning the citizen's unhappiness to normal.\n\nPuppeting the city will mean that you have no control on the city's production.\nThe city will not increase your tech or policy cost.\nA puppeted city can be annexed at any time, but annexed cities cannot be returned to a puppeted state!\n\nRazing the city will lower its population by 1 each turn until the city is destroyed!\nYou cannot raze a city that is either the starting capital of a civilization or the holy city of a religion. = \nMembebaskan bandar memulangkannya kepada pemilik asal dan memberikan peningkatan diplomatik besar dengan mereka!\n\nMengilhak bandar memberikan kawalan penuh, tetapi turut meningkatkan ketidakgembiraan rakyat kepada 2x!\nIni boleh dikurangkan dengan membina mahkamah, mengembalikan ketidakgembiraan rakyat ke tahap biasa.\n\nMembonekakan bandar bermakna anda tidak mengawal pengeluarannya.\nBandar tidak meningkatkan kos teknologi atau polisi.\nBandar boneka boleh diilhak pada bila-bila masa, tetapi bandar yang diilhak tidak boleh dijadikan boneka semula!\n\nMemusnahkan bandar mengurangkan penduduk sebanyak 1 setiap giliran sehingga bandar lenyap!\nAnda tidak boleh memusnahkan ibu kota permulaan tamadun atau kota suci agama.

You have encountered a barbarian unit!\nBarbarians attack everyone indiscriminately, so don't let your \n  civilian units go near them, and be careful of your scout! = Anda menemui unit orang gasar!\nOrang Gasar menyerang semua tanpa memilih, maka jangan biarkan \n  unit awam menghampirinya dan berhati-hati dengan peninjau anda!

You have encountered another civilization!\nOther civilizations start out peaceful, and you can trade with them,\n  but they may choose to declare war on you later on = Anda menemui tamadun lain!\nTamadun lain bermula dengan aman dan anda boleh berdagang dengannya,\n  tetapi mereka mungkin mengisytiharkan perang kemudian

Injured Units = Unit Cedera
Injured units deal less damage, but recover after turns that they have been inactive.\nUnits heal 10 health per turn in enemy territory or neutral land,\n  20 inside your territory and 25 in your cities. = Unit cedera memberikan kurang kerosakan, tetapi pulih selepas giliran tanpa tindakan.\nUnit memulihkan 10 kesihatan setiap giliran di wilayah musuh atau tanah neutral,\n  20 di wilayah sendiri dan 25 di bandar sendiri.

Workers = Pekerja
Workers are vital to your cities' growth, since only they can construct improvements on tiles.\nImprovements raise the yield of your tiles, allowing your city to produce more and grow faster while working the same amount of tiles! = Pekerja penting untuk pertumbuhan bandar kerana hanya mereka boleh membina pembangunan pada jubin.\nPembangunan meningkatkan hasil jubin, membolehkan bandar menghasilkan lebih banyak dan berkembang lebih cepat dengan jumlah jubin kerja yang sama!

Embarking = Menaiki Kapal
Once a certain tech is researched, your land units can embark, allowing them to traverse water tiles.\nEntering or leaving water takes the entire turn. = Selepas teknologi tertentu dikaji, unit darat boleh menaiki kapal untuk merentasi jubin air.\nMemasuki atau meninggalkan air mengambil seluruh giliran.
Units are defenseless while embarked (cannot use modifiers), and have a fixed Defending Strength based on your tech Era, so be careful!\nRanged Units can't attack, Melee Units have a Strength penalty, and all have limited vision. = Unit tidak berdaya semasa menaiki kapal (tidak boleh menggunakan pengubah) dan mempunyai Kekuatan Pertahanan tetap mengikut Era teknologi, maka berhati-hatilah!\nUnit Jarak Jauh tidak boleh menyerang, Unit Jarak Dekat mengalami penalti Kekuatan dan semuanya mempunyai penglihatan terhad.

Idle Units = Unit Terbiar
Clicking 'Next unit' moves to the next idle unit in the queue (as listed in Overview -> Units). After issuing an order to a unit, if 'Auto Unit Cycle' in Options -> Gameplay is enabled, you will automatically select the next idle unit. = Menekan 'Unit seterusnya' memilih unit terbiar seterusnya dalam baris gilir seperti disenaraikan dalam Gambaran Keseluruhan -> Unit. Selepas memberi arahan, jika 'Kitar Unit Automatik' di Pilihan -> Permainan diaktifkan, unit terbiar seterusnya dipilih secara automatik.
If you don't want to move a unit this turn, you can skip it by clicking 'Next unit' again, or command the unit to 'Skip turn'. = Jika tidak mahu menggerakkan unit pada giliran ini, langkau dengan menekan 'Unit seterusnya' sekali lagi atau arahkan unit 'Langkau giliran'.
If you want to disable the 'Next unit' feature entirely, you can toggle it in Options -> Gameplay -> Check for idle units. = Jika mahu mematikan ciri 'Unit seterusnya' sepenuhnya, togol di Pilihan -> Permainan -> Semak unit terbiar.
If you'd rather 'Next unit' cycle the units and not mark them as Done, you can change it in the Options -> Gameplay menu. = Jika mahu 'Unit seterusnya' mengitar unit tanpa menandainya Selesai, ubah di menu Pilihan -> Permainan.
You can also cycle through the idle units using the left and right triangles on the Unit Table in the lower left of the screen. Or by default using the Cycle button next to the 'Next Unit' button. = Anda juga boleh mengitar unit terbiar dengan segi tiga kiri dan kanan pada Jadual Unit di kiri bawah skrin. Atau, secara lalai, gunakan butang Kitar di sebelah 'Unit Seterusnya'.

 # Requires translation!
Contact Me = Hubungi Saya
 # Requires translation!
Hi there! If you've played this far, you've probably seen that the game is currently incomplete.\n Unciv will remain open-source forever. = Hai! Jika anda telah bermain sejauh ini, anda mungkin sedar bahawa permainan ini masih belum lengkap.\n Unciv akan kekal sumber terbuka selama-lamanya.
 # Requires translation!
What motivates me to keep working on it, \n  besides the fact I think it's amazingly cool that I can,\n  is the support from the players - you guys are the best! = Apa yang mendorong saya untuk terus mengusahakannya, \n  selain hakikat bahawa saya rasa sangat hebat kerana saya mampu melakukannya,\n  ialah sokongan para pemain - anda semua memang terbaik!
 # Requires translation!
If you like Unciv, please rate and review it in the App Store.\n If you find a problem or have a suggestion, open a GitHub issue and help us make the game even better! = Jika anda menyukai Unciv, sila beri penilaian dan ulasan di App Store.\n Jika anda menemui masalah atau mempunyai cadangan, buka GitHub issue dan bantu kami menjadikan permainan ini lebih baik!

Pillaging = Penjarahan
Military units can pillage improvements, which heals them 25 health and ruins the improvement.\nThe tile can still be worked, but advantages from the improvement - stat bonuses and resources - will be lost.\nWorkers can repair these improvements, which takes less time than building the improvement from scratch.\nPillaging certain improvements will result in your units looting gold from the improvement. = Unit tentera boleh menjarah pembangunan, memulihkan 25 kesihatan dan merosakkan pembangunan itu.\nJubin masih boleh dikerjakan tetapi manfaat pembangunan, iaitu bonus statistik dan sumber, hilang.\nPekerja boleh membaikinya dalam masa lebih singkat daripada membina dari awal.\nMenjarah pembangunan tertentu membolehkan unit merampas emas daripadanya.

Experience = Pengalaman
Units that enter combat gain experience, which can then be used on promotions for that unit.\nUnits gain more experience when in Melee combat than Ranged, and more when attacking than when defending. = Unit yang bertempur mendapat pengalaman untuk digunakan pada kenaikan pangkat unit itu.\nUnit mendapat lebih pengalaman dalam pertempuran Jarak Dekat berbanding Jarak Jauh, dan lebih ketika menyerang berbanding bertahan.
Units can only gain up to 30 XP from Barbarian units - meaning up to 2 promotions. After that, Barbarian units will provide no experience. = Unit hanya boleh mendapat sehingga 30 XP daripada Orang Gasar, iaitu sehingga 2 kenaikan pangkat. Selepas itu, unit Orang Gasar tidak memberikan pengalaman.

Combat = Pertempuran
Unit and cities are worn down by combat, which is affected by a number of different values.\nEach unit has a certain 'base' combat value, which can be improved by certain conditions, promotions and locations. = Unit dan bandar dilemahkan oleh pertempuran yang dipengaruhi pelbagai nilai.\nSetiap unit mempunyai nilai tempur 'asas' yang boleh ditingkatkan oleh syarat, kenaikan pangkat dan lokasi tertentu.
Units use the 'Strength' value as the base combat value when melee attacking and when defending.\nWhen using a ranged attack, they will the use the 'Ranged Strength' value instead. = Unit menggunakan nilai 'Kekuatan' sebagai asas apabila menyerang jarak dekat atau bertahan.\nApabila menyerang jarak jauh, nilai 'Kekuatan Jarak Jauh' digunakan.
Ranged attacks can be done from a distance, dependent on the 'Range' value of the unit.\nWhile melee attacks allow the defender to damage the attacker in retaliation, ranged attacks do not. = Serangan jarak jauh boleh dilakukan dari jauh mengikut nilai 'Julat' unit.\nSerangan jarak dekat membolehkan pembela membalas kerosakan kepada penyerang, tetapi serangan jarak jauh tidak.

Embassies = Kedutaan
Establishing an embassy in other players' Capital city shows the location of their Capital, likewise other players who establish an embassy in your Capital can see location of your Capital. = Menubuhkan kedutaan di Ibu Kota pemain lain mendedahkan lokasinya. Begitu juga, pemain lain yang menubuhkan kedutaan di Ibu Kota anda boleh melihat lokasinya.
Embassies thus allow Spies to be placed in another players' Capital City if Espionage is enabled. = Kedutaan membolehkan Pengintip ditempatkan di Ibu Kota pemain lain jika Pengintipan diaktifkan.
Mutual embassies are required to allow trading open borders and to sign Research Agreement and Defensive Pact. = Kedutaan bersama diperlukan untuk memperdagangkan sempadan terbuka serta menandatangani Perjanjian Penyelidikan dan Pakatan Pertahanan.
Declaring war on another player or denouncing them will remove embassies from both players' Capitals. You will have to re-establish them to use their effect. = Mengisytiharkan perang atau mengecam pemain lain menyingkirkan kedutaan dari kedua-dua Ibu Kota. Anda perlu menubuhkannya semula untuk mendapat kesannya.
Re-establishing an embassy after denunciation from either side becomes available next turn, while re-establishing them when at war requires a peace treaty. = Kedutaan boleh ditubuhkan semula pada giliran berikutnya selepas kecaman oleh mana-mana pihak, tetapi ketika berperang perjanjian damai diperlukan dahulu.
Be cautious when accepting embassy from other players because they can spy on your capital, or worse may start planning to attack you. = Berhati-hati menerima kedutaan pemain lain kerana mereka boleh mengintip ibu kota atau lebih buruk, mula merancang serangan terhadap anda.
Note that before you can offer an embassy, you need the required Technology. = Sebelum menawarkan kedutaan, anda memerlukan Teknologi yang berkaitan.
Embassies are available using the Gods and Kings ruleset. = Kedutaan tersedia dengan set peraturan Gods and Kings.
Defensive Pacts = Pakatan Pertahanan

Open Borders from other player and vice versa allow units to freely pass through their territory. = Sempadan Terbuka daripada pemain lain dan sebaliknya membolehkan unit bebas melalui wilayah masing-masing.
They also let Missionaries to enter other players' territory without suffering attrition. = Ia juga membolehkan Mubaligh memasuki wilayah pemain lain tanpa kehilangan kekuatan agama.
Open Borders expire depending on game speed and are canceled upon Declaration of War, the closure however takes effect only after war ends and need to be traded again. = Sempadan Terbuka tamat mengikut kelajuan permainan dan dibatalkan apabila Perang Diisytiharkan, tetapi penutupan hanya berkuat kuasa selepas perang tamat dan perlu didagangkan semula.
You gain diplomatic boost with other AI player if you both have Open Borders to each other = Anda mendapat peningkatan diplomatik dengan pemain AI lain jika kedua-duanya saling mempunyai Sempadan Terbuka
Be cautious when giving Open Borders because other player may settle a City near your lands in an area you are planning to use, they may also use your territory to attack your friends or City State allies. = Berhati-hati memberikan Sempadan Terbuka kerana pemain lain mungkin mengasas Bandar berhampiran tanah anda di kawasan yang anda rancang gunakan, atau menggunakan wilayah anda untuk menyerang sahabat dan sekutu Negara Kota.
Note that before you can offer or accept open borders, both Nations need the required Technology. = Sebelum menawarkan atau menerima sempadan terbuka, kedua-dua Negara memerlukan Teknologi berkaitan.
When playing with the Gods and Kings ruleset mutual embassies need to be established before Open Borders can be traded. = Dengan set peraturan Gods and Kings, kedutaan bersama mesti ditubuhkan sebelum Sempadan Terbuka boleh didagangkan.

In Research Agreements, you and another civilization decide to jointly research technology.\nAt the end of the agreement, you will both receive a 'lump sum' of ⍾Science, which will go towards one of your unresearched technologies. = Dalam Perjanjian Penyelidikan, anda dan tamadun lain bersetuju mengkaji teknologi bersama.\nPada akhir perjanjian, kedua-duanya menerima sejumlah ⍾Sains sekaligus untuk salah satu teknologi yang belum dikaji.
The amount of ⍾Science you receive at the end is dependent on the ⍾Science generated by your cities and the other civilization's cities during the agreement - the more, the better! = Jumlah ⍾Sains yang diterima bergantung pada ⍾Sains yang dihasilkan bandar anda dan bandar tamadun lain semasa perjanjian — semakin banyak, semakin baik!
Note that before you can invest in a research agreement, you must have a Declaraction of Friendship, both Nations need the required Technology, and both Nations need enough Gold on hand for the agreement. = Sebelum melabur dalam perjanjian penyelidikan, anda mesti mempunyai Pengisytiharan Persahabatan, kedua-dua Negara memerlukan Teknologi berkaitan, dan kedua-duanya mesti mempunyai Emas yang cukup untuk perjanjian.
When playing with the Gods and Kings ruleset mutual embassies need to be established before a Research Agreement can be signed. = Dengan set peraturan Gods and Kings, kedutaan bersama mesti ditubuhkan sebelum Perjanjian Penyelidikan boleh ditandatangani.

Defensive pacts allow you and another civ to protect one another from aggressors.\nOnce the defensive pact is signed, you will be drawn into their future defensive wars, just as they will be drawn into your future defensive wars. Declaring war on any Civ will remove all of your defensive pacts. You will have to re-sign them to use their effect. = Pakatan pertahanan membolehkan anda dan tamadun lain saling melindungi daripada penceroboh.\nSelepas pakatan ditandatangani, anda akan menyertai perang pertahanan mereka kelak, dan mereka menyertai perang pertahanan anda. Mengisytiharkan perang terhadap mana-mana Tamadun membatalkan semua pakatan pertahanan anda. Anda mesti menandatanganinya semula untuk mendapat kesan.
Be cautious when signing defensive pacts because they can bring you into wars that you might not want to be in. = Berhati-hati menandatangani pakatan pertahanan kerana ia boleh membawa anda ke perang yang tidak anda ingini.
The AI is very careful and will not accept defensive pacts with less than 80 influence. = AI amat berhati-hati dan tidak akan menerima pakatan pertahanan dengan pengaruh kurang daripada 80.
Note that before you can sign a defensive pact, you must have a Declaraction of Friendship, and both Nations need the required Technology. = Sebelum menandatangani pakatan pertahanan, anda mesti mempunyai Pengisytiharan Persahabatan dan kedua-dua Negara memerlukan Teknologi berkaitan.
When playing with the Gods and Kings ruleset mutual embassies need to be established before a Defensive Pact can be signed. = Dengan set peraturan Gods and Kings, kedutaan bersama mesti ditubuhkan sebelum Pakatan Pertahanan boleh ditandatangani.

Not all nations are contending with you for victory.\nCity-States are nations that can't win, can't be traded with, and instead confer certain bonuses to friendly civilizations. = Bukan semua negara bersaing dengan anda untuk menang.\nNegara Kota tidak boleh menang atau didagangkan dengannya, tetapi memberikan bonus tertentu kepada tamadun mesra.
Instead, diplomatic relations with City-States are determined by Influence - a meter of 'how much the City-State likes you'.\nInfluence can be increased by attacking their enemies, liberating their city, and giving them sums of gold. = Hubungan diplomatik dengan Negara Kota ditentukan Pengaruh, ukuran 'betapa Negara Kota menyukai anda'.\nPengaruh boleh ditingkatkan dengan menyerang musuhnya, membebaskan bandarnya dan memberinya emas.
Certain bonuses are given when you are at above 30 influence.\nWhen you have above 60 Influence, and you have the highest influence with them of all civilizations, you are considered their 'Ally', and gain further bonuses and access to the Luxury and Strategic resources in their lands. = Bonus tertentu diberikan apabila pengaruh melebihi 30.\nApabila Pengaruh melebihi 60 dan tertinggi antara semua tamadun, anda dianggap 'Sekutu', menerima bonus tambahan dan akses kepada sumber Mewah serta Strategik di tanahnya.

While working the land is good, eventually your Citizens will want to Specialize. = Walaupun mengerjakan tanah itu baik, akhirnya Rakyat anda mahu Mengkhusus.
Certain Buildings will also provide Specialist Slots. These slots will show up in the Citizen Management within the City Screen under Specialists. Each slot can be filled with a Citizen which will then become a Specialist. = Bangunan tertentu menyediakan Ruang Pakar. Ruang ini dipaparkan dalam Pengurusan Rakyat pada Skrin Bandar di bawah Pakar. Setiap ruang boleh diisi seorang Rakyat yang kemudian menjadi Pakar.
Each Specialist will generate a certain amount of yield as indicated to the right of the available slots. = Setiap Pakar menjana hasil tertentu seperti ditunjukkan di sebelah kanan ruang tersedia.
While these are a great way to specialize the yield production of a City outside of the surrounding Tile Yields, Specialists have an additional value. Each one also generates Great Person Points each turn. With enough of them, a new Great Person will join your Nation. = Selain mengkhususkan pengeluaran hasil Bandar di luar Hasil Jubin sekitar, Pakar mempunyai nilai tambahan. Setiap pakar menjana Mata Tokoh setiap giliran. Setelah cukup terkumpul, Tokoh baharu menyertai Negara anda.
Great People = Tokoh

Certain buildings, and specialists in cities, generate Great Person points per turn.\nThere are several types of Great People, and their points accumulate separately.\nThe number of points per turn and accumulated points can be viewed in the Overview screen. = Bangunan tertentu dan pakar di bandar menjana mata Tokoh setiap giliran.\nTerdapat beberapa jenis Tokoh, dan mata masing-masing terkumpul secara berasingan.\nMata setiap giliran dan jumlah terkumpul boleh dilihat pada skrin Gambaran Keseluruhan.
Alternatively, the Great Person points breakdown per city can be viewed in each City Screen (see UI Tips article). = Sebagai alternatif, pecahan mata Tokoh bagi setiap bandar boleh dilihat pada Skrin Bandar masing-masing (lihat artikel Petua Antara Muka).
Once enough points have been accumulated, a Great Person of that type will be created!\nEach Great Person can construct a certain Great Improvement which gives large yields over time, or immediately consumed to provide a certain bonus now. = Setelah cukup mata terkumpul, Tokoh jenis itu akan dicipta!\nSetiap Tokoh boleh membina Pembangunan Ulung tertentu yang memberi hasil besar sepanjang masa, atau digunakan habis serta-merta untuk bonus tertentu sekarang.
Great Improvements also provide any strategic resources that are under them, so you don't need to worry if resources are revealed underneath your improvements! = Pembangunan Ulung juga menyediakan sumber strategik di bawahnya, maka tidak perlu bimbang jika sumber didedahkan di bawah pembangunan anda!

Removing Terrain Features = Membuang Ciri Rupa Bumi
Certain tiles have terrain features - like Flood plains or Forests -  on top of them. Some of these layers, like Jungle, Marsh and Forest, can be removed by workers.\nRemoving the terrain feature does not remove any resources in the tile, and is usually required in order to add improvements exploiting those resources. = Jubin tertentu mempunyai ciri rupa bumi seperti Dataran Banjir atau Hutan di atasnya. Sesetengah lapisan seperti Rimba, Paya dan Hutan boleh dibuang oleh pekerja.\nMembuang ciri rupa bumi tidak membuang sumber pada jubin, dan biasanya diperlukan untuk menambah pembangunan yang memanfaatkan sumber tersebut.

Natural Wonders, such as the Mt. Fuji, the Rock of Gibraltar and the Great Barrier Reef, are unique, impassable terrain features, masterpieces of mother Nature, which possess exceptional qualities that make them very different from the average terrain.\nThey benefit by giving you large sums of Culture, ⍾Science, Gold or Production if worked by your Cities, which is why you might need to bring them under your empire as soon as possible. = Keajaiban Alam seperti Gunung Fuji, Batu Gibraltar dan Terumbu Sawar Besar ialah ciri rupa bumi unik yang tidak boleh dilalui, karya agung alam dengan sifat luar biasa yang amat berbeza daripada rupa bumi biasa.\nIa memberikan sejumlah besar Budaya, ⍾Sains, Emas atau Pengeluaran jika dikerjakan Bandar, maka anda mungkin mahu memasukkannya ke dalam empayar secepat mungkin.

Keyboard = Papan Kekunci
If you have a keyboard, some shortcut keys become available. Unit command or improvement picker keys, for example, are shown directly in their corresponding buttons. = Jika mempunyai papan kekunci, beberapa kekunci pintasan tersedia. Contohnya, kekunci arahan unit atau pemilih pembangunan ditunjukkan terus pada butang berkaitan.
On the world screen the hotkeys are as follows: = Pada skrin dunia, kekunci pintasan ialah seperti berikut:
Space or 'N' - Next unit or turn\n'E' - Empire overview (last viewed page)\n'+', '-' - Zoom in / out\nHome - center on capital or open its City Screen if already centered = Space atau 'N' - Unit atau giliran seterusnya\n'E' - Gambaran empayar (halaman terakhir dilihat)\n'+', '-' - Zum masuk / keluar\nHome - pusatkan pada ibu kota atau buka Skrin Bandarnya jika sudah dipusatkan
F1 - Open Civilopedia\nF2 - Empire overview Trades\nF3 - Empire overview Units\nF4 - Empire overview Diplomacy\nF5 - Social policies\nF6 - Technologies\nF7 - Empire overview Cities\nF8 - Victory Progress\nF9 - Empire overview Stats\nF10 - Empire overview Resources\nF11 - Quicksave\nF12 - Quickload = F1 - Buka Civilopedia\nF2 - Gambaran empayar Dagangan\nF3 - Gambaran empayar Unit\nF4 - Gambaran empayar Diplomasi\nF5 - Polisi sosial\nF6 - Teknologi\nF7 - Gambaran empayar Bandar\nF8 - Kemajuan Kemenangan\nF9 - Gambaran empayar Statistik\nF10 - Gambaran empayar Sumber\nF11 - Simpan Pantas\nF12 - Muat Pantas
Ctrl-R - Toggle tile resource display\nCtrl-Y - Toggle tile yield display\nCtrl-O - Game options\nCtrl-S - Save game\nCtrl-L - Load game\nCtrl-U - Toggle UI (World Screen only) = Ctrl-R - Togol paparan sumber jubin\nCtrl-Y - Togol paparan hasil jubin\nCtrl-O - Pilihan permainan\nCtrl-S - Simpan permainan\nCtrl-L - Muat permainan\nCtrl-U - Togol antara muka (Skrin Dunia sahaja)
All of these can be reassigned. = Semua ini boleh ditetapkan semula.

This is where you spend most of your time playing Unciv. See the world, control your units, access other screens from here. = Di sinilah anda menghabiskan kebanyakan masa bermain Unciv. Lihat dunia, kawal unit dan akses skrin lain dari sini.
①: The menu button - civilopedia, save, load, options... = ①: Butang menu — Civilopedia, simpan, muat, pilihan...
②: The player/nation whose turn it is - click for diplomacy overview. = ②: Pemain/negara yang sedang bergiliran — tekan untuk gambaran diplomasi.
③: The Technology Button - shows the tech tree which allows viewing or researching technologies. = ③: Butang Teknologi — menunjukkan pohon teknologi untuk melihat atau mengkaji teknologi.
④: The Social Policies Button - shows enacted and selectable policies, and with enough culture points you can enact new ones. = ④: Butang Polisi Sosial — menunjukkan polisi diterima pakai dan yang boleh dipilih; dengan mata budaya mencukupi anda boleh menerima pakai polisi baharu.
⑤: The Diplomacy Button - shows the diplomacy manager where you can talk to other civilizations. = ⑤: Butang Diplomasi — menunjukkan pengurus diplomasi untuk bercakap dengan tamadun lain.
⑥: Unit Action Buttons - while a unit is selected its possible actions appear here. = ⑥: Butang Tindakan Unit — semasa unit dipilih, tindakan yang boleh dilakukan muncul di sini.
⑦: The unit/city info pane - shows information about a selected unit or city. = ⑦: Panel maklumat unit/bandar — menunjukkan maklumat unit atau bandar yang dipilih.
⑧: The name (and unit icon) of the selected unit or city, with current health if wounded. Clicking a unit name or icon will open its civilopedia entry. = ⑧: Nama dan ikon unit bagi unit atau bandar terpilih, bersama kesihatan semasa jika cedera. Menekan nama atau ikon unit membuka entrinya dalam Civilopedia.
⑨: The arrow buttons allow jumping to the next/previous idle unit. = ⑨: Butang anak panah melompat ke unit terbiar seterusnya/sebelumnya.
⑩: For a selected unit, its promotions appear here, and clicking leads to the promotions screen for that unit. = ⑩: Kenaikan pangkat unit terpilih muncul di sini; tekan untuk membuka skrin kenaikan pangkat unit itu.
⑪: Remaining/per turn movement points, strength and experience / XP needed for promotion. For cities, you get its combat strength. = ⑪: Mata pergerakan baki/setiap giliran, kekuatan dan pengalaman / XP diperlukan untuk kenaikan pangkat. Bagi bandar, kekuatan tempurnya ditunjukkan.
⑫: This button closes the selected unit/city info pane. = ⑫: Butang ini menutup panel maklumat unit/bandar terpilih.
⑬: This pane appears when you order a unit to attack an enemy. On top are attacker and defender with their respective base strengths. = ⑬: Panel ini muncul apabila anda mengarahkan unit menyerang musuh. Di atas ialah penyerang dan pembela bersama kekuatan asas masing-masing.
⑭: Below that are strength bonuses or penalties and health bars projecting before / after the attack. = ⑭: Di bawahnya ialah bonus atau penalti kekuatan dan bar kesihatan yang meramalkan sebelum / selepas serangan.
⑮: The Attack Button - let blood flow! = ⑮: Butang Serang — biar darah mengalir!
⑯: The minimap shows an overview over the world, with known cities, terrain and fog of war. Clicking will position the main map. = ⑯: Peta mini menunjukkan gambaran dunia dengan bandar diketahui, rupa bumi dan kabut perang. Tekan untuk mengubah kedudukan peta utama.
⑰: To the side of the minimap are display feature toggling buttons - tile yield, worked indicator, show/hide resources. These mirror setting on the options screen and are hidden if you deactivate the minimap. = ⑰: Di sisi peta mini ada butang togol paparan — hasil jubin, penunjuk kerja, tunjuk/sembunyi sumber. Ini mencerminkan tetapan skrin pilihan dan disembunyikan jika peta mini dimatikan.
⑱: Tile information for the selected hex - current or potential yield, terrain, effects, present units, city located there and such. Where appropriate, clicking a line opens the corresponding civilopedia entry. = ⑱: Maklumat heksagon terpilih — hasil semasa atau berpotensi, rupa bumi, kesan, unit, bandar di situ dan sebagainya. Jika berkenaan, tekan baris untuk membuka entri Civilopedia berkaitan.
⑲: Notifications - what happened during the last 'next turn' phase. Some are clickable to show a relevant place on the map, some even show several when you click repeatedly. = ⑲: Pemberitahuan — perkara yang berlaku semasa fasa 'giliran seterusnya' terakhir. Sesetengahnya boleh ditekan untuk menunjukkan lokasi berkaitan, malah beberapa lokasi jika ditekan berulang kali.
⑳: The Next Turn Button - unless there are things to do, in which case the label changes to 'next unit', 'pick policy' and so on. = ⑳: Butang Giliran Seterusnya — kecuali jika masih ada tugas; ketika itu label menjadi 'unit seterusnya', 'pilih polisi' dan sebagainya.
㉑: The Multiplayer Button - Here you can easily check your active multiplayer games. = ㉑: Butang Berbilang Pemain — semak permainan berbilang pemain aktif anda dengan mudah di sini.
ⓐ: The overview button leads to the empire overview screen with various tabs (the last one viewed is remembered) holding vital information about the state of your civilization in the world. = ⓐ: Butang gambaran keseluruhan membuka gambaran empayar dengan pelbagai tab yang mengandungi maklumat penting keadaan tamadun anda. Tab terakhir dilihat diingati.
ⓑ: The ♪Culture icon shows accumulated ♪Culture and ♪Culture needed for the next policy - in this case, the exclamation mark tells us a next policy can be enacted. Clicking is another way to the policies manager. = ⓑ: Ikon ♪Budaya menunjukkan ♪Budaya terkumpul dan yang diperlukan bagi polisi seterusnya. Di sini, tanda seru bermakna polisi baharu boleh diterima pakai. Menekannya juga membuka pengurus polisi.
ⓒ: Your known strategic resources are displayed here with the available (usage already deducted) number - click to go to the resources overview screen. = ⓒ: Sumber strategik yang diketahui dipaparkan di sini dengan bilangan tersedia selepas penggunaan ditolak. Tekan untuk gambaran sumber.
ⓓ: Happiness/unhappiness balance and either golden age with turns left or accumulated happiness with amount needed for a golden age is shown next to the smiley. Clicking also leads to the resources overview screen as luxury resources are a way to improve happiness. = ⓓ: Baki kegembiraan/ketidakgembiraan, serta baki giliran zaman kegemilangan atau kegembiraan terkumpul dan jumlah diperlukan untuk mencetuskannya ditunjukkan di sebelah wajah senyum. Tekan untuk gambaran sumber kerana sumber mewah meningkatkan kegembiraan.
ⓔ: The ⍾Science icon shows the number of ⍾Science points produced per turn. Clicking leads to the technology tree. = ⓔ: Ikon ⍾Sains menunjukkan mata ⍾Sains yang dihasilkan setiap giliran. Tekan untuk pohon teknologi.
ⓕ: Number of turns played with translation into calendar years. Click to see the victory overview. = ⓕ: Bilangan giliran dimainkan bersama penukaran kepada tahun kalendar. Tekan untuk gambaran kemenangan.
ⓖ: The number of gold coins in your treasury and income. Clicks lead to the Stats overview screen. = ⓖ: Bilangan syiling emas dalam perbendaharaan dan pendapatan. Tekan untuk gambaran Statistik.
ⓗ: The quantity of ☮Faith your citizens have generated, or 'off' if religion is disabled. Clicking it makes you go to the religion overview screen. = ⓗ: Jumlah ☮Kepercayaan yang dijana rakyat, atau 'dimatikan' jika agama dinyahaktifkan. Tekan untuk gambaran agama.
ⓧ: In the center of all this - the world map! Here, the "X" marks a spot outside the map. Yes, unless the wrap option was used, Unciv worlds are flat. Don't worry, your ships won't fall off the edge. = ⓧ: Di tengah semua ini ialah peta dunia! Di sini, "X" menandakan tempat di luar peta. Ya, kecuali pilihan peta bersambung digunakan, dunia Unciv rata. Jangan bimbang, kapal anda tidak akan jatuh dari pinggir.
ⓨ: By the way, here's how an empire border looks like - it's in the national colours of the nation owning the territory. = ⓨ: Beginilah rupa sempadan empayar — menggunakan warna kebangsaan negara yang memiliki wilayah.
ⓩ: And this is the red targeting circle that led to the attack pane back under ⑬. = ⓩ: Inilah bulatan sasaran merah yang membuka panel serangan pada ⑬.
What you don't see: The phone/tablet's back button will pop the question whether you wish to leave Unciv and go back to Real Life. On desktop versions, you can use the ESC key. = Yang tidak kelihatan: butang kembali telefon/tablet akan bertanya sama ada anda mahu meninggalkan Unciv dan kembali ke Kehidupan Sebenar. Pada versi desktop, gunakan kekunci ESC.

When at later stages of the game, you might have a lot of units but only a little to do. To help you we have implemented an AutoPlay feature that lets you use the AI to play part or all of your turn. = Pada peringkat lewat, anda mungkin mempunyai banyak unit tetapi sedikit tugas. Untuk membantu, ciri Main Automatik membolehkan AI memainkan sebahagian atau seluruh giliran anda.
To enable AutoPlay, go to options and open the AutoPlay tab and press "Show AutoPlay button". = Untuk mengaktifkan Main Automatik, pergi ke pilihan, buka tab Main Automatik dan tekan "Tunjukkan butang Main Automatik".
Clicking on the AutoPlay button opens a popup menue for choosing to AutoPlay parts or all of your turn. = Menekan butang Main Automatik membuka menu timbul untuk memilih sebahagian atau seluruh giliran dimainkan secara automatik.
Clicking Start AutoPlay in the pop-up menue or long pressing the AutoPlay button begins the multi-turn AutoPlay. This will play your next turns as if you were an AI. = Menekan Mula Main Automatik pada menu timbul atau menekan lama butang Main Automatik memulakan main automatik berbilang giliran. Giliran seterusnya dimainkan seolah-olah anda AI.
To cancel multi-turn AutoPlay you can press the AutoPlay button, next turn button or open the options menue. = Untuk membatalkan Main Automatik berbilang giliran, tekan butang Main Automatik, butang giliran seterusnya atau buka menu pilihan.
Multi-turn AutoPlay is not advised on harder difficulty levels as your AI will not play better against an AI with modifiers. = Main Automatik berbilang giliran tidak disarankan pada kesukaran tinggi kerana AI anda tidak lebih baik melawan AI yang mempunyai pengubah bonus.
Multi-turn AutoPlay for multiplayer is not yet supported. = Main Automatik berbilang giliran untuk permainan berbilang pemain belum disokong.

After building a shrine, your civilization will start generating ☮Faith. = Selepas membina tempat suci, tamadun anda mula menjana ☮Kepercayaan.
When enough ☮Faith has been generated, you will be able to found a pantheon. = Apabila cukup ☮Kepercayaan dijana, anda boleh mengasaskan panteon.
A pantheon will provide a small bonus for your civilization that will apply to all cities that have it as a majority religion. = Panteon memberikan bonus kecil kepada tamadun, terpakai pada semua bandar yang menjadikannya agama majoriti.
Each civilization can only choose a single pantheon belief, and each pantheon can only be chosen once. = Setiap tamadun hanya boleh memilih satu kepercayaan panteon, dan setiap panteon hanya boleh dipilih sekali.
Generating more ☮Faith will allow you to found a religion. = Menjana lebih ☮Kepercayaan membolehkan anda mengasaskan agama.

Keep generating ☮Faith, and eventually a great prophet will be born in one of your cities. = Terus jana ☮Kepercayaan, dan akhirnya nabi ulung lahir di salah satu bandar anda.
This great prophet can be used for multiple things: Constructing a holy site, founding a religion and spreading your religion. = Nabi ulung ini boleh membina tapak suci, mengasaskan agama atau menyebarkan agama anda.
When founding your religion, you may choose another two beliefs. The founder belief will only apply to you, while the follower belief will apply to all cities following your religion. = Semasa mengasaskan agama, anda boleh memilih dua lagi kepercayaan. Kepercayaan pengasas hanya terpakai kepada anda, manakala kepercayaan pengikut terpakai kepada semua bandar yang mengikuti agama itu.
Additionally, the city where you used your great prophet will become the holy city of that religion. = Selain itu, bandar tempat nabi ulung digunakan menjadi kota suci agama tersebut.
Once you have founded a religion, great prophets will keep being born every so often, though the amount of Faith☮ you have to save up will be higher. = Selepas mengasaskan agama, nabi ulung terus lahir dari semasa ke semasa, tetapi jumlah Kepercayaan☮ yang perlu dikumpulkan semakin tinggi.
One of these great prophets can then be used to enhance your religion. = Salah seorang nabi ulung ini boleh digunakan untuk memperkukuh agama anda.
This will allow you to choose another follower belief, as well as an enhancer belief, that only applies to you. = Ini membolehkan anda memilih satu lagi kepercayaan pengikut serta kepercayaan pengukuh yang hanya terpakai kepada anda.
Do take care founding a religion soon, only about half the players in the game are able to found a religion! = Segeralah mengasaskan agama kerana hanya kira-kira separuh pemain dalam permainan boleh berbuat demikian!

Religion inside cities = Agama dalam bandar
When founding a city, it won't follow a religion immediately. = Bandar yang baru diasaskan tidak terus mengikuti agama.
The religion a city follows depends on the total pressure each religion has within the city. = Agama yang diikuti bandar bergantung pada jumlah tekanan setiap agama di dalamnya.
Followers are allocated in the same proportions as these pressures, and these followers can be viewed in the City Screen. = Pengikut dibahagikan mengikut nisbah tekanan ini dan boleh dilihat pada Skrin Bandar.
You are allowed to check religious followers and pressures in cities you do not own by selecting them. = Anda boleh menyemak pengikut dan tekanan agama di bandar yang bukan milik anda dengan memilihnya.
In both places, a tap/click on the icon of a religion will show detailed information with its effects. = Di kedua-dua tempat, tekan ikon agama untuk menunjukkan maklumat terperinci dan kesannya.
Based on this, you can get a feel for which religions have a lot of pressure built up in the city, and which have almost none. = Berdasarkan ini, anda boleh mengetahui agama yang mempunyai banyak tekanan dalam bandar dan yang hampir tiada.
The city follows a religion if a majority of its population follows that religion, and will only then receive the effects of Follower and Pantheon beliefs of that religion. = Bandar mengikuti agama jika majoriti penduduk mengikutinya; hanya selepas itu bandar menerima kesan kepercayaan Pengikut dan Panteon agama tersebut.

Spreading Religion = Menyebarkan Agama
Spreading religion happens naturally, but can be sped up using missionaries or great prophets. = Agama merebak secara semula jadi, tetapi boleh dipercepat dengan mubaligh atau nabi ulung.
Missionaries can be bought in cities following a major religion, and will take the religion of that city. = Mubaligh boleh dibeli di bandar yang mengikuti agama utama dan akan mengikuti agama bandar itu.
So do take care where you are buying them! If another civilization has converted one of your cities to their religion, missionaries bought there will follow their religion. = Maka berhati-hati memilih tempat membeli! Jika tamadun lain menukar agama bandar anda, mubaligh yang dibeli di sana mengikuti agama mereka.
Great prophets always have your religion when they appear, even if they are bought in cities following other religions, but captured great prophets do retain their original religion. = Nabi ulung sentiasa mengikuti agama anda apabila muncul, walaupun dibeli di bandar beragama lain, tetapi nabi ulung yang ditawan mengekalkan agama asalnya.
Both great prophets and missionaries are able to spread religion to cities when they are inside its borders, even cities of other civilizations. = Nabi ulung dan mubaligh boleh menyebarkan agama apabila berada dalam sempadan bandar, termasuk bandar tamadun lain.
These two units can even enter tiles of civilizations with whom you don't have an open borders agreement! = Kedua-dua unit ini boleh memasuki jubin tamadun yang tidak mempunyai perjanjian sempadan terbuka dengan anda!
But do take care, missionaries will lose 250 religious strength each turn they end while in foreign lands. = Namun berhati-hati: mubaligh kehilangan 250 kekuatan agama setiap giliran yang diakhiri di tanah asing.
This diminishes their effectiveness when spreading religion, and if their religious strength ever reaches 0, they have lost their faith and disappear. = Ini mengurangkan keberkesanan penyebarannya; jika kekuatan agama mencapai 0, ia kehilangan kepercayaan lalu lenyap.
When you do spread your religion, the religious strength of the unit is added as pressure for that religion. = Apabila anda menyebarkan agama, kekuatan agama unit ditambah sebagai tekanan agama tersebut.
Cities also passively add pressure of their majority religion to nearby cities. = Bandar juga menambah tekanan agama majoritinya secara pasif ke bandar berhampiran.
Each city provides +6 pressure per turn to all cities within 10 tiles, though the exact amount of pressure depends on the game speed. = Setiap bandar memberikan +6 tekanan setiap giliran kepada semua bandar dalam lingkungan 10 jubin, tetapi jumlah tepat bergantung pada kelajuan permainan.
This pressure can also be seen in the City Screen, and gives you an idea of how religions in your cities will evolve if you don't do anything. = Tekanan ini juga boleh dilihat pada Skrin Bandar, memberikan gambaran perubahan agama jika anda tidak berbuat apa-apa.
Holy cities also provide +30 pressure of the religion founded there to themselves, making it very difficult to effectively convert a holy city. = Kota suci juga memberikan +30 tekanan agama yang diasaskan di situ kepada dirinya, menjadikannya amat sukar ditukar agama dengan berkesan.
Lastly, before founding a religion, new cities you settle will start with 200 pressure for your pantheon. = Akhir sekali, sebelum mengasaskan agama, bandar baharu anda bermula dengan 200 tekanan bagi panteon anda.
This way, all your cities will starting following your pantheon as long as you haven't founded a religion yet. = Dengan cara ini, semua bandar anda mula mengikuti panteon selagi anda belum mengasaskan agama.

Inquisitors = Penyiasat Agama
Inquisitors are the last religious unit, and their strength is removing other religions. = Penyiasat agama ialah unit keagamaan terakhir; kekuatannya menghapuskan agama lain.
They can remove all other religions from one of your own cities, removing any pressures built up. = Ia boleh menghapuskan semua agama lain daripada bandar milik anda, membuang semua tekanan yang terkumpul.
Great prophets also have this ability, and remove all other religions in the city when spreading their religion. = Nabi ulung juga mempunyai kebolehan ini dan menghapuskan semua agama lain dalam bandar apabila menyebarkan agamanya.
Often this results in the city immediately converting to their religion = Ini sering menyebabkan bandar serta-merta memeluk agamanya
Additionally, when an inquisitor is stationed in or directly next to a city center, units of other religions cannot spread their faith there, though natural spread is unaffected. = Selain itu, jika penyiasat agama ditempatkan di dalam atau betul-betul di sebelah pusat bandar, unit agama lain tidak boleh menyebarkan kepercayaan di sana, tetapi penyebaran semula jadi tidak terjejas.

The Mayan unique ability, 'The Long Count', comes with a side effect: = Keupayaan unik Maya, 'Kiraan Panjang', mempunyai kesan sampingan:
Once active, the game's year display will use mayan notation. = Setelah aktif, paparan tahun permainan menggunakan tatatanda Maya.
The Maya measured time in days from what we would call 11th of August, 3114 BCE. A day is called K'in, 20 days are a Winal, 18 Winals are a Tun, 20 Tuns are a K'atun, 20 K'atuns are a B'ak'tun, 20 B'ak'tuns a Piktun, and so on. = Maya mengukur masa dalam hari sejak tarikh yang kita panggil 11 Ogos 3114 SM. Satu hari ialah K'in, 20 hari ialah Winal, 18 Winal ialah Tun, 20 Tun ialah K'atun, 20 K'atun ialah B'ak'tun, 20 B'ak'tun ialah Piktun, dan seterusnya.
Unciv only displays ය B'ak'tuns, ඹ K'atuns and ම Tuns (from left to right) since that is enough to approximate gregorian calendar years. The Maya numerals are pretty obvious to understand. Have fun deciphering them! = Unciv hanya memaparkan ය B'ak'tun, ඹ K'atun dan ම Tun dari kiri ke kanan kerana itu cukup untuk menghampiri tahun kalendar Gregory. Angka Maya agak mudah difahami. Selamat menyahkodnya!

Your cities will periodically demand different luxury goods to satisfy their desire for new things in life. = Bandar anda akan meminta barangan mewah berbeza dari semasa ke semasa untuk memenuhi keinginan perkara baharu dalam hidup.
If you manage to acquire the demanded luxury by trade, expansion, or conquest, the city will celebrate We Love The King Day for 20 turns. = Jika anda memperoleh barangan mewah yang diminta melalui dagangan, peluasan atau penaklukan, bandar meraikan Hari Kami Sayang Raja selama 20 giliran.
During the We Love The King Day, the city will grow 25% faster. = Semasa Hari Kami Sayang Raja, bandar berkembang 25% lebih cepat.
This means exploration and trade is important to grow your cities! = Maka penjelajahan dan dagangan penting untuk pertumbuhan bandar!

Air Combat and Interception = Pertempuran Udara dan Pintasan
Air Combat is very similar to normal Combat, with a few wrinkles. Damage is still dealt using the same equations based on the relative Strength of the Attacking and Defending Unit. = Pertempuran Udara sangat serupa dengan Pertempuran biasa, dengan beberapa perbezaan. Kerosakan masih dikira menggunakan persamaan yang sama berdasarkan Kekuatan relatif Unit Penyerang dan Pembela.
However, before the Attacker and Defender fight, there is an added combat phase called Interception. If there is any unit with Interception Range that covers the target attacked tile, then it will attempt to Intercept the Attacking Air Unit. If multiple units can Intercept, the one with higher Intercept chance does it. = Namun sebelum Penyerang dan Pembela bertempur, ada fasa tambahan, Pintasan. Jika ada unit dengan Julat Pintasan yang meliputi jubin sasaran, ia cuba Memintas Unit Udara Penyerang. Jika beberapa unit boleh memintas, unit dengan peluang tertinggi melakukannya.
Generally Land/Naval Units have an Intercept Range of 2 Tiles, and Air Units have an Intercept Range of their Attack Range. = Biasanya Unit Darat/Laut mempunyai Julat Pintasan 2 Jubin, dan Unit Udara mempunyai Julat Pintasan sama dengan Julat Serangannya.
Ground and Naval Units don't require movement points to Intercept, just Attacks. Air Units cannot have moved nor attacked in the preceding turn. = Unit Darat dan Laut tidak memerlukan mata pergerakan untuk Memintas, hanya Serangan. Unit Udara tidak boleh sudah bergerak atau menyerang pada giliran sebelumnya.
The Intercepting Unit rolls to see if it hits. Whether it hits or not costs an Attack, and most units (without Promotions) can only Attack Once per Nation's Turn. It does NOT cost Movement Points, but Air Units that have used their Movement cannot Intercept between turns. = Unit Pemintas membuat penentuan rawak sama ada mengenai sasaran. Sama ada kena atau tidak, satu Serangan digunakan; kebanyakan unit tanpa Kenaikan Pangkat hanya boleh Menyerang Sekali setiap Giliran Negara. Mata Pergerakan TIDAK digunakan, tetapi Unit Udara yang sudah menggunakan Pergerakan tidak boleh Memintas antara giliran.
If the Intercepting Unit Hits, it deals damage according to the Combat Strength calculation to the Attacking Air Unit, potentially with any Strength Bonuses that apply to Interception. It does not receive damage from the Attacking Air Unit. = Jika Pemintas mengenai sasaran, ia memberikan kerosakan kepada Unit Udara Penyerang mengikut pengiraan Kekuatan Tempur, termasuk bonus Kekuatan yang terpakai kepada Pintasan. Ia tidak menerima kerosakan daripada Unit Udara Penyerang.
After Interception resolves, the Attacking Air Unit and the Defending Unit in the targeted tile do Combat as normal, with damage dealt to both sides. = Selepas Pintasan selesai, Unit Udara Penyerang dan Unit Pembela pada jubin sasaran bertempur seperti biasa, memberikan kerosakan kepada kedua-dua pihak.
To help deal with Interceptions, see Air Sweeps. = Untuk membantu menangani Pintasan, lihat Sapuan Udara.

Air Sweeps = Sapuan Udara
Fighter units are able to perform Air Sweeps over a tile helping clear out potential enemy Air, Sea, or Land Interceptions that can reach that tile. = Unit pejuang boleh melakukan Sapuan Udara pada jubin untuk menarik keluar Pintasan Udara, Laut atau Darat musuh yang boleh mencapai jubin itu.
While this Action will take an Attack, the benefit is drawing out Interceptions to help protect your other Air Units. Especially your Bombers. = Tindakan ini menggunakan satu Serangan, tetapi menarik keluar Pintasan untuk melindungi Unit Udara lain, khususnya Pengebom.
Your unit will always draw an Interception, if one can reach the target tile, even if the Intercepting unit has a chance to miss. = Unit anda sentiasa mencetuskan Pintasan jika ada yang boleh mencapai jubin sasaran, walaupun unit Pemintas berpeluang tersasar.
If the Interceptor is not an Air Unit (eg Land or Sea), the Air Sweeping unit and Interceptor take no damage! = Jika Pemintas bukan Unit Udara, contohnya Darat atau Laut, unit Sapuan Udara dan Pemintas tidak menerima kerosakan!
If the Interceptor is an Air Unit, the two units will damage each other in a straight fight with no Interception bonuses. And only the Attacking Air Sweep Unit gets any Air Sweep strength bonuses. = Jika Pemintas Unit Udara, kedua-dua unit saling memberikan kerosakan dalam pertempuran langsung tanpa bonus Pintasan. Hanya Unit Sapuan Udara Penyerang mendapat bonus kekuatan Sapuan Udara.

Fortify, Guard, Withdraw = Berkubu, Bertahan, Berundur
Most Land units have the ability to Fortify. As they spend time without moving, they will slowly gain a Fortification Bonus to their Combat Strength representing digging in and preparing in case of an attack. = Kebanyakan unit Darat boleh Berkubu. Apabila tidak bergerak untuk suatu masa, ia perlahan-lahan mendapat Bonus Kubu kepada Kekuatan Tempur, mencerminkan penggalian dan persediaan menghadapi serangan.
Some units have the ability to Withdraw before a melee attack is struck. However, perhaps you wish for them to stand their ground to protect a particular tile. If you do, then give them the Guard command and they will stay fixed until they die or you give them fresh orders. = Sesetengah unit boleh Berundur sebelum serangan jarak dekat mengenai sasaran. Namun anda mungkin mahu ia kekal mempertahankan jubin tertentu. Berikan arahan Bertahan dan ia kekal sehingga mati atau menerima arahan baharu.
This is NOT the same as Fortify but they will still gain the Fortification Bonus. They will simply not utilize their Withdraw ability. Fortified units with the Withdraw ability will try to flee when attacked. = Ini TIDAK sama dengan Berkubu, tetapi ia tetap mendapat Bonus Kubu. Ia cuma tidak menggunakan kebolehan Berundur. Unit berkubu yang mempunyai kebolehan Berundur akan cuba melarikan diri apabila diserang.

City Tile Blockade = Sekatan Jubin Bandar
One of your tiles is blocked by an enemy: when an enemy unit stands on a tile you own, the tile will not produce yields and cannot be worked by a city this turn. City will reallocate population from a blocked tile automatically. = Salah satu jubin anda disekat musuh: apabila unit musuh berada pada jubin milik anda, jubin itu tidak menghasilkan apa-apa dan tidak boleh dikerjakan bandar pada giliran ini. Bandar mengalihkan penduduk dari jubin disekat secara automatik.
Enemy military land units block tiles they are standing on. Enemy military naval units additionally block adjacent water tiles. To protect your tiles from blockade, place a friendly military unit on it or fight off invaders. = Unit tentera darat musuh menyekat jubin yang didudukinya. Unit tentera laut musuh turut menyekat jubin air bersebelahan. Untuk melindungi jubin daripada sekatan, tempatkan unit tentera mesra atau halau penceroboh.

One of your cities is under a naval blockade! When all adjacent water tiles of a coastal city are blocked - city loses harbor connection to all other cities, including capital. Make sure to de-blockade cities by deploying friendly military naval units to fight off invaders. = Salah satu bandar anda mengalami sekatan laut! Jika semua jubin air bersebelahan bandar pantai disekat, bandar kehilangan hubungan pelabuhan dengan semua bandar lain termasuk ibu kota. Kerahkan unit tentera laut mesra untuk menghalau penceroboh dan membuka sekatan.

Spies! = Pengintip
The first time a civ reaches the Renaissance era each nation gets one spy. Every time a civ reaches an era afterwards they get one more spy. = Apabila suatu tamadun pertama kali mencapai era Renaissance, setiap negara mendapat seorang pengintip. Setiap kali sesuatu tamadun mencapai era baharu selepas itu, ia mendapat seorang lagi pengintip.
Spies can be sent out to foreign cities to steal technology, rigging elections or stage coups. Place them in your own cities to do counter-intelligence work. = Pengintip boleh dihantar ke bandar asing untuk mencuri teknologi, memanipulasi pilihan raya atau melancarkan rampasan kuasa. Tempatkan di bandar sendiri untuk perisikan balas.
Only one spy per civ is allowed in each city. Spies that are not in any city are on vacation in your spy hideout. = Setiap bandar hanya membenarkan seorang pengintip bagi setiap tamadun. Pengintip yang tidak berada di mana-mana bandar bercuti di persembunyian pengintip anda.
Spies set up in cities of major civilizations will try to steal technology at a rate which is based off of the science production in the city. Succeeding to steal technology will level up your spy. Failing to succeed will level up the defending spy if it is present. = Pengintip di bandar tamadun utama cuba mencuri teknologi pada kadar berdasarkan pengeluaran sains bandar. Kejayaan menaikkan tahap pengintip anda. Kegagalan menaikkan tahap pengintip pembela jika ada.
Spies set in city-states will try to rig the elections in order to gain influence and reduce the influence of other civilizations. Only one spy partaking in rigging the election can win. = Pengintip di negara kota cuba memanipulasi pilihan raya untuk menambah pengaruh sendiri dan mengurangkan pengaruh tamadun lain. Hanya seorang pengintip yang menyertai manipulasi boleh menang.
A spy that is rigging an election in a city-state may also stage a coup. The likelihood of success for the coup depends on your relative influence to the current ally of the city-state, your spy level, and the level of the spy that the current ally has in the city-state if present. Succeeding a coup will make you their new ally and reduce the influence of all other civs. Failing a coup will kill your spy and level up the defending spy if present. = Pengintip yang memanipulasi pilihan raya di negara kota juga boleh melancarkan rampasan kuasa. Peluang berjaya bergantung pada pengaruh anda berbanding sekutu semasa negara kota, tahap pengintip anda dan tahap pengintip sekutu semasa di situ jika ada. Kejayaan menjadikan anda sekutu baharu dan mengurangkan pengaruh semua tamadun lain. Kegagalan membunuh pengintip anda serta menaikkan tahap pengintip pembela jika ada.
Spies that are set up in your own cities will be conducting counter-intelligence. They reduce the success chance of other spies trying to steal your technology. = Pengintip di bandar sendiri melakukan perisikan balas. Ia mengurangkan peluang pengintip lain berjaya mencuri teknologi anda.
Spies at a higher rank have a higher chance of success. The max rank a spy can reach is rank 3. After a spy is killed it will revive after a certain amount of turns back at rank 1. = Pengintip berpangkat tinggi mempunyai peluang berjaya lebih besar. Pangkat tertinggi ialah 3. Selepas terbunuh, pengintip hidup semula selepas beberapa giliran pada pangkat 1.
Building buildings like the constabulary and police station will reduce the technology steal rate of spies in that city. = Membina bangunan seperti pasukan polis dan balai polis mengurangkan kadar kecurian teknologi oleh pengintip di bandar itu.
Espionage is available using the Gods and Kings ruleset. To enable it in a new game click advanced settings, then click on the Enable Espionage option. = Pengintipan tersedia dengan set peraturan Gods and Kings. Untuk mengaktifkannya dalam permainan baharu, tekan tetapan lanjutan kemudian pilihan Aktifkan Pengintipan.

Keyboard Bindings = Ikatan Papan Kekunci
Limitations = Batasan
 # Requires translation!
This is a work in progress. = Ini adalah kerja yang sedang dijalankan.
For technical reasons, only direct keys or Ctrl-Letter combinations can be used. = Atas sebab teknikal, hanya kekunci langsung atau gabungan Ctrl-Huruf boleh digunakan.
Using the Keys page = Menggunakan halaman Kekunci
Each binding has a button with an image looking like this: = Setiap ikatan mempunyai butang dengan imej seperti ini:
While hovering the mouse over the key button, you can press a desired key directly to assign it. = Semasa tetikus berada di atas butang kekunci, anda boleh menekan kekunci yang dikehendaki untuk menetapkannya terus.
Double-click the image to reset the binding to default. = Klik dua kali imej untuk mengembalikan ikatan kepada lalai.
Bindings mapped to their default keys are displayed in gray, those reassigned by you in white. = Ikatan pada kekunci lalai berwarna kelabu; yang anda ubah berwarna putih.
Conflicting assignments are marked red. Conflicts can exist across categories, like World Screen / Unit Actions. Note that at the moment, the game does not prevent saving conflicting assignments, though the result may be unexpected. = Penetapan bercanggah ditandai merah. Percanggahan boleh merentas kategori seperti Skrin Dunia / Tindakan Unit. Buat masa ini permainan tidak menghalang penyimpanan penetapan bercanggah, walaupun hasilnya mungkin tidak dijangka.
For discussion about missing entries, see the linked github issue. = Untuk perbincangan entri yang tiada, lihat isu GitHub yang dipautkan.

Welcome to the Civilopedia! = Selamat datang ke Civilopedia!
Here you can find information - general help, rules, and what makes up the game world. = Di sini ada maklumat, bantuan umum, peraturan dan unsur dunia permainan.
How to find information = Cara mencari maklumat
Select categories with the buttons on top of the screen. Also up there is the button to leave Civilopedia and go back to where you were before. = Pilih kategori dengan butang di atas skrin. Di situ juga ada butang meninggalkan Civilopedia dan kembali ke tempat sebelumnya.
Each category has a list of entries on the left of the screen, sorted alphabetically (with few exceptions). Clicking an entry will update the center pane were you are currently reading this. = Setiap kategori mempunyai senarai entri di kiri skrin, disusun mengikut abjad dengan beberapa pengecualian. Menekan entri mengemas kini panel tengah tempat anda membaca ini.
Lines can link to other Civilopedia entries, they are marked with a chain link symbol like this one. You can click anywhere on the line to follow the link. = Baris boleh memaut ke entri Civilopedia lain, ditandai lambang rantai seperti ini. Tekan mana-mana bahagian baris untuk mengikuti pautan.
The current category is special - all articles on general concepts are here. It is called 'Tutorials' because you can revisit these here, too. = Kategori semasa istimewa: semua artikel konsep umum ada di sini. Namanya 'Tutorial' kerana anda juga boleh membacanya semula di sini.
What information can I find = Maklumat apa yang boleh ditemui
The data shown is not dependent on your current game's situation, e.g. bonuses for the nation you are playing or difficulty modifiers will not affect the numbers. = Data dipaparkan tidak bergantung pada keadaan permainan semasa; contohnya bonus negara anda atau pengubah kesukaran tidak mempengaruhi angka.
However, it will reflect the mods you are playing! The combination of base ruleset and extension mods you select define the rules of a game, what objects exist and how they interact, and the Civilopedia mirrors these rules. = Namun data mencerminkan mod yang anda mainkan! Gabungan set peraturan asas dan mod peluasan menentukan peraturan permainan, objek yang wujud serta interaksinya, dan Civilopedia mencerminkan peraturan ini.
If you opened the Civilopedia from the main menu, the "Ruleset" will be that of the last game you started. = Jika Civilopedia dibuka dari menu utama, "Set peraturan" ialah yang digunakan dalam permainan terakhir anda mulakan.
Letters can select categories, and when there are multiple categories matching the same letter, you can press that repeatedly to cycle between these. = Huruf boleh memilih kategori. Jika beberapa kategori sepadan dengan huruf sama, tekan berulang kali untuk mengitarnya.
The arrow keys allow navigation as well - left/right for categories, up/down for entries. = Kekunci anak panah juga membolehkan navigasi: kiri/kanan untuk kategori, atas/bawah untuk entri.

UI Tips = Petua Antara Muka
World screen = Skrin dunia
Skip all units to end a turn quickly = Langkau semua unit untuk menamatkan giliran dengan cepat
Right-click or long press the "Next unit" button to open a popup menu which allows to end a turn without having to cycle through all units. If some units are automated, a dedicated button is available to move them before ending the turn. = Klik kanan atau tekan lama butang "Unit seterusnya" untuk membuka menu timbul yang membolehkan giliran ditamatkan tanpa mengitar semua unit. Jika ada unit automatik, butang khusus tersedia untuk menggerakkannya sebelum menamatkan giliran.
Toggle notification list display = Togol paparan senarai pemberitahuan
On the World screen, swipe the notification list to the right to temporarily hide it. Click the "Bell" button to display them again. = Pada skrin Dunia, leret senarai pemberitahuan ke kanan untuk menyembunyikannya sementara. Tekan butang "Loceng" untuk memaparkannya semula.
The default state for the notification list can be set in Options > Display > UI - Notifications on world screen. = Keadaan lalai senarai pemberitahuan boleh ditetapkan di Pilihan > Paparan > Antara Muka - Pemberitahuan pada skrin dunia.
Entering a City Screen quickly = Memasuki Skrin Bandar dengan cepat
You can Right-click or long press a city button on the World screen. The result is the same as tapping it twice - once to select and move the button, again to trigger a reaction: show the City Screen (if the city is yours to inspect), or offer the foreign city info popup. = Klik kanan atau tekan lama butang bandar pada skrin Dunia. Hasilnya sama seperti menekan dua kali: pertama untuk memilih dan mengalihkan butang, kemudian mencetuskan reaksi — menunjukkan Skrin Bandar jika boleh diperiksa, atau menawarkan maklumat bandar asing.
Upgrade multiple units of the same type = Naik taraf beberapa unit jenis sama
On the World screen, select a unit that can be upgraded, then right-click or long press the "Upgrade" button to open a popup menu allowing to upgrade all units of this type at once. = Pada skrin Dunia, pilih unit yang boleh dinaik taraf, kemudian klik kanan atau tekan lama butang "Naik taraf" untuk membuka menu timbul bagi menaik taraf semua unit jenis ini sekali gus.
In the Units overview, the same upgrade menu is available by clicking the unit icon in the "Upgrade" column. When a unit is upgradeable, the icon is lit if conditions are met (enough gold and/or resources), otherwise it is dimmed. = Dalam gambaran Unit, menu sama tersedia dengan menekan ikon unit dalam lajur "Naik taraf". Jika unit boleh dinaik taraf, ikon terang apabila syarat dipenuhi, iaitu emas dan/atau sumber mencukupi; jika tidak, ia malap.
Additional controls for the construction queue = Kawalan tambahan baris gilir pembinaan
Right-click or long press a construction item to open a popup menu with additional controls, allowing to manage production of the same item in all cities, by issuing the commands from the same City Screen. = Klik kanan atau tekan lama item pembinaan untuk menu timbul dengan kawalan tambahan. Dari Skrin Bandar yang sama, anda boleh mengeluarkan arahan mengurus pengeluaran item itu di semua bandar.
The "Disable" option (in a single city or all cities) moves an item to a separated "Disabled" tab, to prevent its automatic queueing by the "Auto-assign city production" option or to remove irrelevant objects from the production planning. To move a disabled item back to its initial place, re-enter its popup menu, and choose "Enable". = Pilihan "Nyahaktifkan" di satu atau semua bandar memindahkan item ke tab "Dinyahaktifkan" berasingan, menghalang "Tetapkan pengeluaran bandar secara automatik" daripada menambahnya ke baris gilir atau membuang objek tidak berkaitan daripada rancangan pengeluaran. Untuk memulangkannya ke tempat asal, buka menu timbulnya semula dan pilih "Aktifkan".
Disabled items are set for the current game only and are carried over when founding a new city. = Item dinyahaktifkan ditetapkan untuk permainan semasa sahaja dan tetapan turut digunakan apabila bandar baharu diasaskan.
Show Great Person Points breakdown = Tunjukkan pecahan Mata Tokoh
In the right sidepanel, click a Great People row to display the details of Great Person Points (GPP) accumulated each turn by the current city, for this type of Great People. = Pada panel sisi kanan, tekan baris Tokoh untuk memaparkan butiran Mata Tokoh yang terkumpul setiap giliran oleh bandar semasa bagi jenis Tokoh itu.
Click any of the Great People icons to display all GPP accumulated each turn by the current city, for all types of Great People. = Tekan mana-mana ikon Tokoh untuk memaparkan semua Mata Tokoh yang terkumpul setiap giliran oleh bandar semasa bagi semua jenis Tokoh.
Tech screen = Skrin teknologi
Queue multiple technologies in different branches = Bariskan beberapa teknologi dalam cabang berbeza
On the Tech screen, right-click or long press a technology to automatically queue it, even if this tech is in another branch than the item currently researched. Prerequisite techs to research will also be automatically queued. = Pada skrin Teknologi, klik kanan atau tekan lama teknologi untuk menambahkannya ke baris gilir secara automatik walaupun cabangnya berbeza daripada kajian semasa. Teknologi prasyarat turut ditambah secara automatik.
Right-click or long press multiple techs to append them to the research queue, whatever their branch is. = Klik kanan atau tekan lama beberapa teknologi untuk menambahnya ke akhir baris gilir penyelidikan tanpa mengira cabang.
Overview screens = Skrin gambaran keseluruhan
Reveal known resources on world screen = Dedahkan sumber diketahui pada skrin dunia
In the Resources overview, click on a resource icon to center the world screen on tiles already discovered and providing this resource. = Dalam gambaran Sumber, tekan ikon sumber untuk memusatkan skrin dunia pada jubin yang sudah ditemui dan menyediakan sumber itu.
Alternatively, click on the "Unimproved" number to center the world screen only on owned (by you or your allied City-states) tiles where the resource is not improved. = Atau tekan angka "Belum dibangunkan" untuk memusatkan skrin hanya pada jubin milik anda atau Negara Kota sekutu yang sumbernya belum dibangunkan.
If more than one tile is available, click repeatedly on the notification to cycle through all of them. = Jika ada lebih satu jubin, tekan pemberitahuan berulang kali untuk mengitar semuanya.
Show diagram line colors = Tunjukkan warna garis rajah
In Politics overview > Show diagram, you can click anywhere inside the diagram to display a table listing all relationship line colors and their meaning. = Dalam gambaran Politik > Tunjukkan rajah, tekan mana-mana bahagian rajah untuk memaparkan jadual semua warna garis hubungan dan maknanya.
Reading "Toast" popups = Membaca pemberitahuan timbul ringkas
"Toasts" can be clicked to make them stay on the screen for easier reading. = Pemberitahuan ringkas boleh ditekan supaya kekal pada skrin untuk mudah dibaca.
Click it again to close (or use the close button). = Tekan semula untuk menutup atau gunakan butang tutup.
Miscellaneous = Pelbagai
External links = Pautan luar
External links support right-click or long press to copy the link to the clipboard instead of launching the browser. = Pautan luar menyokong klik kanan atau tekan lama untuk menyalin pautan ke papan keratan dan bukannya membuka pelayar.
