2. Other iOS players open the invitation or paste it in Join by invitation, tap their civilization portrait to choose, then tap Ready. = 2. Pemain iOS lain membuka jemputan atau tampalkannya dalam Sertai melalui jemputan, ketik potret tamadun mereka untuk memilih, kemudian ketik Sedia.
