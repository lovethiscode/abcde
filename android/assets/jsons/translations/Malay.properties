Kamehameha I = Kamehameha I
The ancient fire flashing across the sky is what proclaimed that this day would come, though I had foolishly hoped for a different outcome. = Api purba yang berkilau merentasi langit meramalkan hari ini akan tiba, walaupun aku dengan bodohnya mengharapkan pengakhiran yang lain.
It is obvious now that I misjudged you and your true intentions. = Kini jelas bahawa aku tersalah menilai dirimu dan niatmu yang sebenar.
The hard-shelled crab yields, and the lion lies down to sleep. Kanaloa comes for me now. = Ketam bercangkerang keras menyerah dan singa berbaring untuk tidur. Kanaloa kini datang menjemputku.
The ocean's tide may rise and fall, but my resolve stands steady. = Pasang surut lautan boleh berubah, tetapi tekadku tetap teguh.
Aloha! Greetings and blessings upon you, friend. I am Kamehameha, Great King of this strand of islands. = Aloha! Salam dan berkat untukmu, sahabat. Aku Kamehameha, Raja Agung gugusan pulau ini.
Come, let our people feast together! = Marilah, biar rakyat kita berpesta bersama!
Welcome, friend! = Selamat datang, kawan!
Wayfinding = Panduan Pelayaran
Aloha to Kamehameha the Great, who the heavens allowed to unite your people! O great King, under your reign, the Big Island of Hawai'i became one in 1791 AD, and many other islands joined your vision of union in 1810. As the first King of Hawai'i, law and taxation systems were stabilized, and you promoted the Kanawai Mamalahoe, an edict to protect civilian people in times of war. Unification and sovereignty of all the islands continued thanks to your fair laws and deeds, even after you joined your ancestors in paradise in 1819. = Aloha kepada Kamehameha yang Agung, yang diizinkan langit menyatukan rakyatnya! Wahai Raja yang agung, di bawah pemerintahan tuanku, Pulau Besar Hawai'i bersatu pada 1791 M, dan banyak pulau lain menyertai wawasan penyatuan tuanku pada 1810. Sebagai Raja pertama Hawai'i, sistem undang-undang dan cukai distabilkan, dan tuanku memperkenalkan Kanawai Mamalahoe, titah melindungi orang awam semasa perang. Penyatuan dan kedaulatan semua pulau berterusan berkat undang-undang dan tindakan adil tuanku, walaupun selepas tuanku menyertai leluhur di syurga pada 1819.
Wise and benevolent King, will you unite your people once again by wearing the bright mantle of the Lion of the Pacific? Will your new empire shine through the ages of history? = Raja yang bijaksana dan baik hati, akankah tuanku menyatukan rakyat sekali lagi dengan menyarung jubah gemilang Singa Pasifik? Akankah empayar baharu tuanku bersinar sepanjang sejarah?
