Askia = Askia
You are an abomination to heaven and earth, the chief of ignorant savages! You must be destroyed! = Kamu kekejian bagi langit dan bumi, ketua puak gasar yang jahil! Kamu mesti dimusnahkan!
Fool! You have doomed your people to fire and destruction! = Bodoh! Kamu telah menjerumuskan rakyatmu ke dalam api dan kemusnahan!
We have been consumed by the fires of hatred and rage. Enjoy your victory in this world - you shall pay a heavy price in the next! = Kami telah dimakan api kebencian dan kemarahan. Nikmatilah kemenanganmu di dunia ini — kamu akan membayar harga yang berat di alam seterusnya!
This insult shall cost you. = Penghinaan ini akan membawa padah kepadamu.
I am Askia of the Songhai. We are a fair people - but those who cross us will find only destruction. You would do well to avoid repeating the mistakes others have made in the past. = Aku Askia dari Songhai. Kami bangsa yang adil, tetapi sesiapa menentang kami hanya akan menemui kemusnahan. Eloklah kamu tidak mengulangi kesilapan orang terdahulu.
Can I interest you in this deal? = Bolehkah aku menarik minatmu dengan urus niaga ini?
River Warlord = Panglima Sungai
Askia, leader of the Songhai people and greatest of all, may God watch your path towards glory! Songhai was under the rule of the mighty West African state of Mali until the middle of the 14th century. Great King Sunni Ali Ber fought for independance, and showed to all Songhai's power, by conquering territories and repelling many foes who sought to destroy the rising kingdom. Ultimately, conquest of the wealthy cities of Timbuktu and Jenne made Songhai an empire with enough economic power to survive for a century, until the empire bowed down before foes with advanced technology - muskets against spearmen. = Askia, pemimpin bangsa Songhai dan yang paling agung, semoga Tuhan menjaga jalan tuanku menuju kegemilangan! Songhai di bawah pemerintahan negara Mali yang perkasa di Afrika Barat hingga pertengahan abad ke-14. Raja Sunni Ali Ber yang agung berjuang untuk kemerdekaan dan menunjukkan kekuatan Songhai dengan menakluki wilayah serta menangkis ramai musuh yang mahu memusnahkan kerajaan yang bangkit itu. Akhirnya, penaklukan kota kaya Timbuktu dan Jenne menjadikan Songhai empayar yang cukup kuat ekonominya untuk bertahan selama satu abad, hingga tunduk kepada musuh berteknologi maju — senapang musket melawan askar tombak.
King Askia, your people know there's still hope, that the hour of revenge is coming. Give them wealth and power, give them mighty weapons of iron and fire, to destroy any foe, for Songhai to revive! Will your new empire shine through the ages of history? = Raja Askia, rakyat tuanku tahu harapan masih ada dan saat pembalasan semakin tiba. Berikan mereka kekayaan, kuasa serta senjata besi dan api yang perkasa untuk memusnahkan setiap musuh agar Songhai bangkit semula! Akankah empayar baharu tuanku bersinar sepanjang sejarah?
