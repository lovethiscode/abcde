You have won, congratulations. My palace is now in your possession, and I beg that you care well for the peacock. = Kamu menang, tahniah. Istanaku kini milikmu, dan aku mohon kamu menjaga merak itu dengan baik.
Our future battle will be glorious. = Pertempuran kita kelak akan gemilang.
Welcome foreigner, I am Harun Al-Rashid, Caliph of the Arabs. Come and tell me about your empire. = Selamat datang, orang asing. Aku Harun Al-Rashid, Khalifah Arab. Marilah ceritakan tentang empayarmu.
Come forth, let's do business. = Marilah kita berniaga.
Peace be upon you. = Selamat sejahtera ke atas kamu.
Trade Caravans = Kafilah Dagangan
Blessings of the Great God be upon you, O great caliph Harun al-Rashid, leader of the mighty Arabian people! The Muslim Empire, the Caliphate, born from chaos after the death of the prophet Muhammad in 632 AD, intended to apply the rule of God to all Earth. And by the will of God, the caliphate reached its full power, ruling Spain, North Africa, the Middle East, Anatolia, the Balkans and Persia, to even surpass the Great Roman Empire. The arts and sciences were a holy gift of Arabia during the Middle Ages, as the infidel lands of Europe delved deep into ignorance and chaos. Lasting for six hundred years, the Caliphate finally fell before the Mongols, the plague of the civilized world. = Semoga Allah Yang Maha Agung memberkati tuanku, Khalifah Harun al-Rashid yang agung, pemimpin bangsa Arab yang perkasa! Empayar Islam, iaitu Kekhalifahan, lahir daripada kekacauan selepas kewafatan Nabi Muhammad pada 632 M, berhasrat menerapkan hukum Tuhan ke seluruh Bumi. Dengan kehendak Tuhan, kekhalifahan mencapai puncak kuasa, memerintah Sepanyol, Afrika Utara, Timur Tengah, Anatolia, Balkan dan Parsi, malah mengatasi Empayar Rom Agung. Seni dan sains ialah anugerah suci Arab pada Zaman Pertengahan, ketika tanah Eropah yang bukan Islam tenggelam dalam kejahilan dan kekacauan. Setelah bertahan enam ratus tahun, Kekhalifahan akhirnya tumbang kepada Mongol, bencana dunia bertamadun.
Great Caliph Harun al Rashid, all Arabian people long for greatness! Arabia must be once again the land of arts and knowledge, which under the radiant law of God, will fear no enemy! Will your new empire shine through the ages of history? = Khalifah Harun al Rashid yang agung, seluruh rakyat Arab mendambakan kebesaran! Arab mesti kembali menjadi tanah seni dan ilmu, yang di bawah hukum Tuhan yang bercahaya tidak takut akan musuh! Akankah empayar baharu tuanku bersinar sepanjang sejarah?
