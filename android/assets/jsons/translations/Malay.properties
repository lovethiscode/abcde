Tell me, do you all know how numerous my armies, elephants and the gdadons are? No? Today, you shall find out! = Beritahu aku, tahukah kamu betapa ramainya tentera, gajah dan gdadonku? Tidak? Hari ini kamu akan tahu!
Fate is against you. You earned the animosity of Carthage in your exploration. Your days are numbered. = Takdir menentangmu. Dalam penjelajahanmu, kamu mendapat permusuhan Carthage. Hari-harimu semakin suntuk.
The fates became to hate me. This is it? You wouldn't destroy us so without their help. = Takdir mula membenciku. Inikah akhirnya? Kamu tidak akan mampu memusnahkan kami begini tanpa bantuannya.
You aren't meeting my expectations. You can do so much better. = Kamu tidak memenuhi jangkaanku. Kamu boleh buat jauh lebih baik.
The Phoenicians welcome you to this most pleasant kingdom. I am Dido, the queen of Carthage and all that belongs to it. = Bangsa Phoenicia mengalu-alukan kamu ke kerajaan yang menyenangkan ini. Aku Dido, ratu Carthage dan segala miliknya.
I just had the marvelous idea, and I think you'll appreciate it too. = Aku baru mendapat idea hebat, dan rasanya kamu juga akan menghargainya.
What is it now? = Apa pula sekarang?
Phoenician Heritage = Warisan Phoenicia
Greetings to you, revered Queen Dido, ruler of the legendary kingdom of Carthage. The great poet Virgil related your great history, how your husband Acerbas was murdered by your own brother, King Pygmalion of Tyre, to steal the treasures of your family that were rightfully yours. But you endured his pressure until you and your compatriots decided to flee and sail for new lands. The gods led you to the shores of North Africa, and with cunning diplomacy, you expanded the territory of your new home, and laid the basis for the future kingdom of Carthage. = Salam kepada Ratu Dido yang dihormati, pemerintah kerajaan Carthage yang legenda. Penyair agung Virgil mengisahkan sejarah tuanku, bagaimana suami Acerbas dibunuh saudara sendiri, Raja Pygmalion dari Tyre, untuk mencuri harta keluarga yang menjadi hak tuanku. Namun tuanku menahan tekanannya hingga bersama rakyat senegara memutuskan untuk melarikan diri dan belayar mencari tanah baharu. Para dewa membawa tuanku ke pantai Afrika Utara; dengan diplomasi licik, tuanku meluaskan wilayah kediaman baharu dan meletakkan asas kerajaan Carthage masa depan.
Clever and proud Dido, the storm is coming and your people look for a shelter under your wise and powerful protection. Can you create a new and radiant Carthage able to cleave the darkness? Will your new empire shine through the ages of history? = Dido yang cerdik dan bangga, ribut semakin tiba dan rakyat mencari perlindungan di bawah naungan tuanku yang bijaksana dan kuat. Mampukah tuanku mencipta Carthage baharu yang bersinar menembusi kegelapan? Akankah empayar baharu tuanku bersinar sepanjang sejarah?
