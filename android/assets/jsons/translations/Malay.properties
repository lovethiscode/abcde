尚无符合条件的解放归还记录。 = Tiada pembebasan dan pemulangan yang layak direkodkan.
本关发生归属中断，可在后续关卡重新尝试。 = Pemilikan terputus; cuba lagi pada peringkat kemudian.
三城连续归属观察中，按时完成本关后核对。 = Memerhati pemilikan berterusan; disemak apabila peringkat diselesaikan tepat pada masanya.
达到三城容量并在首波前建立三城，可在后续关卡尝试。 = Buka kapasiti tiga bandar dan miliki tiga bandar sebelum gelombang pertama peringkat akan datang.
把长期发展转化为完整终局，纪念第一次亲自完成一场胜利。 = Bawa pembangunan jangka panjang ke pengakhiran lengkap dan kenang kemenangan pertama.
选择第二座城的位置，在资源、地形和扩张成本之间作第一次取舍。 = Pilih tapak bandar kedua dan imbangi sumber, rupa bumi serta kos peluasan.
第一次为文明选择发展方向，感受政策带来的长期差异。 = Pilih arah tamadun dan temui kesan polisi yang berkekalan.
协调两座城市的生产与黄金时代时机；争夺奇观的风险，让排期本身成为决策。 = Selaraskan pengeluaran dua bandar dengan masa Zaman Kegemilangan. Persaingan keajaiban menjadikan penjadualan pilihan strategik.
围绕一座奇观安排科技和生产，体验与其他文明争夺同一目标。 = Rancang teknologi dan pengeluaran berasaskan keajaiban, lalu bersaing dengan tamadun lain untuk membinanya.
认识移动、攻击与生存的基本关系，获得第一次真实交锋的反馈。 = Pelajari gabungan pergerakan, serangan dan kelangsungan melalui pertempuran sebenar pertama.
把地图上的土地变成实际产出，理解工人与城市发展的关系。 = Jadikan tanah jubin produktif dan pelajari cara Pekerja menyokong pembangunan bandar.
把分散的城市组织成网络，选择道路、海港或两者组合，而非只追求城市数量。 = Hubungkan bandar berselerak dengan jalan, Pelabuhan atau kedua-duanya, bukan hanya menumpukan bilangan bandar.
让粮食、人口与教育设施相互支持，形成一座有清楚用途的学术中心。 = Gabungkan makanan, penduduk dan bangunan pendidikan untuk mewujudkan pusat pembelajaran khusus.
比较不同城邦类型的收益，决定把有限外交投入放在哪里。 = Bandingkan manfaat jenis negara kota berbeza dan tentukan tempat melaburkan sumber diplomatik yang terhad.
把创教转为本土社会的共同信仰，体验城市布局、自然传播和主动传教的配合。 = Sebarkan agama yang anda asaskan di dalam negara dengan menggabungkan penempatan bandar, penyebaran semula jadi dan penukaran agama aktif.
在未知地图中获得发现的惊喜。作为自然探索纪念，不要求为三处奇观反复重开。 = Nikmati penemuan pada peta asing. Pencapaian penjelajahan ini tidak memerlukan anda memulakan semula berulang kali untuk mencari tiga keajaiban.
以有限城市投入科研，依靠质量和发展效率完成太空目标。允许防卫战争，限制的是指定战斗占城。 = Tumpukan bandar yang terhad pada penyelidikan cekap untuk mencapai angkasa. Perang pertahanan dibenarkan; sekatan berkaitan penawanan tentera yang dinyatakan.
在有限城市规模下集中积累文化，安排政策、建设与胜利项目的先后。 = Tumpukan budaya dalam empayar kecil dan rancang urutan polisi, bangunan serta projek kemenangan.
改变扩张来源：不继续自行建城，以军事实力和占领后的管理建立帝国。 = Meluaskan wilayah melalui penaklukan dan bukannya mengasaskan lebih banyak bandar, lalu bina empayar dengan kekuatan tentera dan pengurusan bandar.
用有限城市支撑政策专精，选择两条适合当前战略的政策路线。 = Sokong pembangunan polisi terarah dengan bandar terhad dan pilih dua cabang sesuai dengan strategi.
围绕外国首都组织宗教影响力，选择传播对象与时机，承担跨国竞争。 = Bina pengaruh agama di sekitar ibu kota asing, memilih tempat dan masa penyebaran dalam persaingan antarabangsa.
利用埃及建造优势，把一座城市经营成奇观中心，在科技、生产与抢建风险之间取舍。自选重投入专项。 = Gunakan kelebihan pembinaan Mesir untuk menjadikan satu bandar pusat keajaiban, mengimbangi penyelidikan, pengeluaran dan persaingan. Cabaran pilihan ini memerlukan pelaburan besar.
预先协调多条战线和占城部队，让几场局部战斗汇成同一回合的战略突破。 = Selaraskan beberapa medan dan unit penawan supaya pertempuran berasingan menjadi penembusan strategik dalam satu giliran.
围绕波斯黄金时代的持续时间与战斗优势准备攻势，在有效窗口集中兑现实力。自选进阶专项。 = Sediakan serangan berdasarkan tempoh dan kelebihan tempur Zaman Kegemilangan Parsi. Ini cabaran lanjutan pilihan.
用小国规模应对更高难度，挑选一条适合的非时间胜利路线，而非依靠不断扩张。 = Hadapi kesukaran lebih tinggi dengan empayar kecil dan pilih kemenangan selain Masa, bukan bergantung pada peluasan berterusan.
检验对整体战略、时机和局势判断的掌握；是玩家主动选择的高手目标。 = Uji penguasaan strategi, masa dan keadaan. Cabaran pakar ini pilihan sahaja.
让唯一城市承担科研、经济与防卫，寻找单城条件下的完整发展解法。 = Gunakan satu bandar untuk penyelidikan, ekonomi dan pertahanan, lalu bina strategi lengkap dalam batas itu.
主动放弃世界奇观这条优势来源，探索政策、城市发展与文化胜利之间的其他组合。 = Lupakan Keajaiban Dunia dan terokai cara lain menggabungkan polisi, pembangunan bandar dan kemenangan kebudayaan.
