Haile Selassie = Haile Selassie
I have tried all other avenues, but yet you persist in this madness. I hope, for your sake, your end is swift. = Aku telah mencuba segala jalan lain, tetapi kamu terus dalam kegilaan ini. Demi dirimu, aku berharap pengakhiranmu cepat.
It is silence that allows evil to triumph. We will not stand mute and allow you to continue on this mad quest unchecked. = Sikap diam membolehkan kejahatan menang. Kami tidak akan membisu dan membiarkanmu meneruskan usaha gila ini tanpa tentangan.
God and history will remember your actions this day. I hope you are ready for your impending judgment. = Tuhan dan sejarah akan mengingati tindakanmu hari ini. Aku berharap kamu bersedia menghadapi pengadilan yang bakal tiba.
What a waste of time. = Sungguh membuang masa.
A thousand welcomes to our fair nation. I am Selassie, the Ras Tafari Makonnen and Emperor of Ethiopia, your humble servant. = Seribu ucapan selamat datang ke negara kami yang indah. Aku Selassie, Ras Tafari Makonnen dan Maharaja Ethiopia, hambamu yang rendah hati.
I request that you consider this offer between our two peoples. I believe it will do us both good. = Aku meminta kamu mempertimbangkan tawaran antara dua bangsa kita ini. Aku percaya ia baik untuk kedua-duanya.
Spirit of Adwa = Semangat Adwa
May God bless you, wise and righteous Emperor of Ethiopia, Haile Selassie. As one of Ethiopia's greatest rulers and a spiritual leader of the Rastafarian movement, your good influence on diplomacy and political cooperation are praised throughout the world. You created Ethiopia's first written constitution, and favorized democracy for years to come, your great wisdom making Ethiopia enter as a charter member in the United Nations. Always aiming to reform and modernize your nation, you changed Ethiopian destiny for the best. = Semoga Tuhan memberkati tuanku, Maharaja Ethiopia Haile Selassie yang bijaksana dan adil. Sebagai antara pemerintah terhebat Ethiopia dan pemimpin rohani gerakan Rastafari, pengaruh baik tuanku dalam diplomasi dan kerjasama politik dipuji seluruh dunia. Tuanku mencipta perlembagaan bertulis pertama Ethiopia dan menggalakkan demokrasi untuk tahun-tahun mendatang; kebijaksanaan tuanku membawa Ethiopia menjadi anggota pengasas Pertubuhan Bangsa-Bangsa Bersatu. Sentiasa berusaha mereformasi dan memodenkan negara, tuanku mengubah takdir Ethiopia menjadi lebih baik.
Revered King, your knowledge and intelligence are required once again to protect your people from many threats in the world. Will you secure peace and stability, with benevolence and authority, in the radiance of the Kebra Nagast? Will your new empire shine through the ages of history? = Raja yang dihormati, ilmu dan kecerdasan tuanku diperlukan semula untuk melindungi rakyat daripada pelbagai ancaman dunia. Akankah tuanku menjamin keamanan dan kestabilan dengan kebajikan serta kewibawaan, dalam sinar Kebra Nagast? Akankah empayar baharu tuanku bersinar sepanjang sejarah?
