Great King Alexander, leader of the mighty Greek nation, you are truly blessed by the gods. In 480 BC, quarrelsome city-states such as Athens, Sparta, Thebes, found a way to join their forces, allowing Greece to defeat the mighty Persia in the 5th century BC, both on land and sea. Following their example, you lead a Greek coalition and finally struck down the Persian Empire in 331 BC. You conquered almost all the known world, and from Europe to Africa to India, you built an empire unmatched by any before it. = Raja Alexander yang agung, pemimpin bangsa Yunani yang perkasa, tuanku benar-benar diberkati para dewa. Pada 480 SM, negara kota yang sering bertelingkah seperti Athens, Sparta dan Thebes berjaya menyatukan kekuatan, membolehkan Yunani mengalahkan Parsi yang perkasa pada abad ke-5 SM, di darat dan di laut. Mengikuti teladan itu, tuanku memimpin gabungan Yunani dan akhirnya menumbangkan Empayar Parsi pada 331 SM. Tuanku menakluki hampir seluruh dunia yang diketahui, membina empayar dari Eropah ke Afrika hingga India yang tidak tertandingi sebelumnya.
Megalexandros, son of Zeus, will you ride Bucephalas again, to gift the world with the brightness of the Greek culture? Will your new empire shine through the ages of history? = Megalexandros, putera Zeus, akankah tuanku menunggang Bucephalas semula untuk mengurniakan sinar budaya Yunani kepada dunia? Akankah empayar baharu tuanku bersinar sepanjang sejarah?
