I believe I have something that may be of some importance to you. = Aku percaya ada sesuatu yang mungkin penting bagimu.
Once again, greetings. = Sekali lagi, salam.
Dutch East India Company = Syarikat Hindia Timur Belanda
Greetings to the wise and brave Prince William of Orange, who freed the Netherlands and gave strength to the Dutch people. In 1568, you led a rebellion against Spanish dominion, to gain freedom for your people, and therefore starting the Eighty Years' War. Your actions were all aimed to create one of Europe's first modern republics, the Seven United Provinces. The rebellion was the meaning of your very life and death, as it was also the cause of your assassination in 1584. But your death has given even more pride and courage to your people, to fight for liberty against any oppressors. Carved in history as the 'Father of the Fatherland', your name is a symbol of Dutch independence for eternity. = Salam kepada Putera William of Orange yang bijaksana dan berani, pembebas Belanda dan pemberi kekuatan kepada rakyatnya. Pada 1568, tuanku memimpin pemberontakan terhadap penguasaan Sepanyol demi kebebasan rakyat, lalu memulakan Perang Lapan Puluh Tahun. Segala tindakan tuanku bertujuan mencipta salah satu republik moden pertama Eropah, Tujuh Wilayah Bersatu. Pemberontakan memberi makna kepada hidup dan mati tuanku, kerana ia juga membawa kepada pembunuhan tuanku pada 1584. Namun kemangkatan tuanku menambah kebanggaan dan keberanian rakyat untuk berjuang menentang setiap penindas. Terukir dalam sejarah sebagai 'Bapa Tanah Air', nama tuanku lambang kemerdekaan Belanda selama-lamanya.
Brave Prince, your people ask for your wisdom to gain its freedom once more, and to illuminate the world with progressive and modern ideas. Will your new empire shine through the ages of history? = Putera yang berani, rakyat memohon kebijaksanaan tuanku untuk meraih kebebasan semula dan menerangi dunia dengan idea progresif serta moden. Akankah empayar baharu tuanku bersinar sepanjang sejarah?
