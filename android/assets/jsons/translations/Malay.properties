 # Requires translation!
Entering a City Screen quickly = 
 # Requires translation!
You can Right-click or long press a city button on the World screen. The result is the same as tapping it twice - once to select and move the button, again to trigger a reaction: show the City Screen (if the city is yours to inspect), or offer the foreign city info popup. = 
 # Requires translation!
Upgrade multiple units of the same type = 
 # Requires translation!
On the World screen, select a unit that can be upgraded, then right-click or long press the "Upgrade" button to open a popup menu allowing to upgrade all units of this type at once. = 
 # Requires translation!
In the Units overview, the same upgrade menu is available by clicking the unit icon in the "Upgrade" column. When a unit is upgradeable, the icon is lit if conditions are met (enough gold and/or resources), otherwise it is dimmed. = 
