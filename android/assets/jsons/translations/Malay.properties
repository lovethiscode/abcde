Darius I = Darius I
Your continue existence is an embarrassment to all leaders everywhere! You must be destroyed! = Kewujudanmu memalukan semua pemimpin di mana-mana! Kamu mesti dimusnahkan!
Curse you! You are beneath me, son of a donkey driver! I will crush you! = Celaka kamu! Kamu lebih rendah daripadaku, anak pengendali keldai! Aku akan menghancurkanmu!
You mongrel! Cursed be you! The world will long lament your heinous crime! = Bangsat! Terkutuklah kamu! Dunia akan lama meratapi jenayah kejimu!
Peace be on you! I am Darius, the great and outstanding king of kings of great Persia... but I suppose you knew that. = Salam sejahtera! Aku Darius, raja segala raja Parsi yang agung dan terbilang... tetapi aku rasa kamu sudah tahu.
In my endless magnanimity, I am making you this offer. You agree, of course? = Dengan kemurahan hatiku yang tiada batas, aku mengemukakan tawaran ini. Tentunya kamu setuju?
Good day to you! = Selamat sejahtera kepadamu!
Ahh... you... = Ahh... kamu...
Achaemenid Legacy = Warisan Achaemenid
Great King Darius of Persia, the heaven casts its light upon you! Persian people are strong and wise, as their leader. In old ages, the great Persian king Cyrus fought back the mighty Median empire and finally destroyed the Medes in 550 BC. Cunning diplomacy and military achievements helped then to conquer the wealthy Lydia and the powerful Babylon, Cyrus' son conquering the eternal Egypt some years later. At the height of its power, the Persian Empire reached the shores of Macedonia, at the very door of the upstart Greek city-states. Persia would have prospered for centuries if Alexander of Macedon hadn't brutally destroyed the great empire in one violent strike. = Raja Darius dari Parsi yang agung, langit menyinarkan cahayanya kepada tuanku! Rakyat Parsi kuat dan bijaksana seperti pemimpinnya. Pada zaman dahulu, Raja Cyrus melawan Empayar Media yang perkasa dan akhirnya memusnahkannya pada 550 SM. Diplomasi licik dan kejayaan tentera kemudian membantu menakluki Lydia yang kaya dan Babylon yang kuat; putera Cyrus menakluki Mesir yang abadi beberapa tahun kemudian. Pada puncak kuasanya, Empayar Parsi mencapai pantai Macedonia, di ambang negara kota Yunani yang baru bangkit. Parsi pasti makmur berabad-abad sekiranya Alexander dari Macedon tidak memusnahkan empayar agung itu dengan satu serangan ganas.
King Darius, the people of Persia await, longing for its past glory and power! Persia of the Immortals must reborn, to punish its foes and rebuild the gleaming Persepolis! Will your new empire shine through the ages of history? = Raja Darius, rakyat Parsi menanti, mendambakan kegemilangan dan kuasa silam! Parsi bangsa Abadi mesti lahir semula untuk menghukum musuh dan membina semula Persepolis yang bersinar! Akankah empayar baharu tuanku bersinar sepanjang sejarah?
