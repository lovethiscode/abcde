Gandhi = Gandhi
I have just received a report that large numbers of my troops have crossed your borders. = Aku baru menerima laporan bahawa sejumlah besar tenteraku telah melintasi sempadanmu.
My attempts to avoid violence have failed. An eye for an eye only makes the world blind. = Usahaku mengelakkan keganasan telah gagal. Mata dibalas mata hanya membutakan dunia.
You can chain me, you can torture me, you can even destroy this body, but you will never imprison my mind. = Kamu boleh merantaiku, menyeksaku, malah memusnahkan tubuh ini, tetapi kamu tidak akan sekali-kali memenjarakan fikiranku.
Curious. = Menarik.
Hello, I am Mohandas Gandhi. My people call me Bapu, but please, call me friend. = Helo, aku Mohandas Gandhi. Rakyatku memanggilku Bapu, tetapi panggillah aku sahabat.
My friend, are you interested in this arrangement? = Sahabatku, adakah kamu berminat dengan persetujuan ini?
I wish you peace. = Semoga kamu sejahtera.
Population Growth = Pertumbuhan Penduduk
Wise Mahatma Gandhi, great leader of India, we honor you! India is one of the oldest countries in the world with 10,000 years of history, built on spirit and religion, as three of the world's great religions - Hinduism, Buddhism and Jainism - appeared on this sacred land. Every aspect of India society reveres art, music and color, showing great wealth but also grinding poverty. For centuries, India was torn between local kingdoms fighting each other but also repelling invaders. In the 12th century AD, Muslim Turks tried to conquer India, then the Mongols took their place. In the early 17th century, India, still fragmented, was colonized by the English and their diplomacy and technological superiority. After two centuries of British dominion, Indian nationalism woke up, and you, Great Mahatma, have led a peaceful and victorious rebellion never seen anywhere in history! = Mahatma Gandhi yang bijaksana, pemimpin agung India, kami menghormatimu! India antara negara tertua dunia dengan sejarah 10,000 tahun, dibina atas semangat dan agama; tiga agama besar dunia — Hindu, Buddha dan Jain — lahir di tanah suci ini. Setiap aspek masyarakat India memuliakan seni, muzik dan warna, menampilkan kekayaan besar tetapi juga kemiskinan yang menyeksakan. Selama berabad-abad, India terpecah antara kerajaan tempatan yang saling berperang sambil menangkis penceroboh. Pada abad ke-12 M, orang Turki Muslim cuba menakluki India, kemudian Mongol mengambil tempat mereka. Pada awal abad ke-17, India yang masih berpecah dijajah oleh Inggeris melalui diplomasi dan kelebihan teknologi. Selepas dua abad penguasaan British, nasionalisme India bangkit, dan kamu, Mahatma yang agung, memimpin pemberontakan aman yang berjaya, sesuatu yang belum pernah dilihat dalam sejarah!
Gandhi, your people ask again to be led on the path of freedom. Under protection of Ganesha and Surya, can India accomplish its great potential? Will your new empire shine through the ages of history? = Gandhi, rakyatmu sekali lagi meminta dipimpin ke jalan kebebasan. Di bawah perlindungan Ganesha dan Surya, mampukah India mencapai potensi besarnya? Akankah empayar baharumu bersinar sepanjang sejarah?
