Do you know who you're dealing with? = Tahukah kamu dengan siapa kamu berurusan?
You are in the presence of Attila, scourge of Rome. Do not let hubris be your downfall as well. = Kamu berada di hadapan Attila, pembawa bencana Rom. Jangan biarkan keangkuhan turut menjatuhkanmu.
This is better than you deserve, but let it not be said that I am an unfair man. = Ini lebih baik daripada yang layak kamu terima, tetapi jangan katakan aku tidak adil.
Good day to you. = Selamat sejahtera kepadamu.
Scourge of God = Bencana Tuhan
Great Attila, mighty warrior and leader of the Hunnic empire, your men bow down before you. During the 5th century, you and your brother Bleda have conquered many lands, forged a mighty empire and commanded the most powerful and frightening force of antiquity. You inspired fear to the Roman Emperors themselves, who called you 'Flagellum Dei', the 'Scourge of God', as you took kingdom after kingdom in the Balkans, invaded Eastern Roman Empire, into Gaul and Northern Italy, and planned to conquer Rome itself. Your empire didn't survive long after your death, but your name and your legend have, for millenia to come. = Attila yang agung, pahlawan perkasa dan pemimpin empayar Hun, rakyat tunduk di hadapan tuanku. Pada abad ke-5, tuanku dan saudara Bleda menakluki banyak tanah, membentuk empayar perkasa dan memimpin pasukan paling kuat serta menakutkan zaman purba. Tuanku menakutkan Maharaja Rom sendiri yang menggelar tuanku 'Flagellum Dei', 'Bencana Tuhan', apabila menawan kerajaan demi kerajaan di Balkan, menyerang Empayar Rom Timur hingga ke Gaul dan Itali Utara, serta merancang menakluki Rom sendiri. Empayar tidak bertahan lama selepas kemangkatan tuanku, tetapi nama dan legenda tuanku kekal selama ribuan tahun.
Fearsome General, your mighty hordes are at your command, waiting to crush your foes once again and to conquer all the riches the world has to offer! Will your new empire shine through the ages of history? = Jeneral yang digeruni, gerombolan perkasa tuanku menunggu perintah untuk sekali lagi menghancurkan musuh dan menakluki segala kekayaan dunia! Akankah empayar baharu tuanku bersinar sepanjang sejarah?
