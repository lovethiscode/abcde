获得文化胜利，且整局从未拥有过任何世界奇观，包括占领或接收城市带来的奇观；国家奇观不受限制。 = Raih kemenangan Kebudayaan tanpa pernah memiliki apa-apa Keajaiban Dunia sepanjang permainan, termasuk keajaiban di bandar ditakluki atau diperoleh; Keajaiban Negara tidak dihadkan.
