Tutorial Task: [Move unit] = Tugasan Tutorial: [Move unit]
Move a unit! = Gerakkan unit!
Click on a unit → Click on a destination → Click the arrow popup. = Tekan unit → Tekan destinasi → Tekan anak panah timbul.

Found a city! = Asaskan bandar!
Select the Settler → Click on 'Found city'. = Pilih Peneroka → Tekan 'Asaskan bandar'.

Enter the city screen! = Masuki skrin bandar!
Click the city button twice. = Tekan butang bandar dua kali.

Pick a technology to research! = Pilih teknologi untuk dikaji!
Click on the tech button → Select technology → Click 'Research' (bottom right). = Tekan butang teknologi → Pilih teknologi → Tekan 'Kaji' (kanan bawah).

Pick a construction! = Pilih pembinaan!
Enter city screen → Click on a unit or building → Click 'add to queue'. = Masuki skrin bandar → Tekan unit atau bangunan → Tekan 'tambah ke baris gilir'.

Pass a turn! = Lalukan satu giliran!
Cycle through units with 'Next unit' → Click 'Next turn'. = Kitar antara unit dengan 'Unit seterusnya' → Tekan 'Giliran seterusnya'.

Reassign worked tiles! = Tukar jubin yang dikerjakan!
Enter city screen → Click the assigned tile to unassign → Click an unassigned tile to assign population. = Masuki skrin bandar → Tekan jubin yang ditugaskan untuk membatalkannya → Tekan jubin tanpa tugasan untuk menempatkan penduduk.

 # Requires translation!
Got it = Faham
Meet another civilization! = Temui tamadun lain!
Explore the map until you encounter another civilization! = Terokai peta sehingga bertemu tamadun lain!

Open the options dialog! = Buka dialog pilihan!
Click the menu button (top left) → Click 'Options'. = Tekan butang menu (kiri atas) → Tekan 'Pilihan'.

Construct an improvement! = Bina pembangunan!
Construct a Worker unit → Move it to a Plains or Grassland tile → Click 'Construct improvement' → Choose the farm → Leave the worker there until it's finished. = Hasilkan unit Pekerja → Gerakkan ke jubin Dataran atau Padang Rumput → Tekan 'Bina pembangunan' → Pilih ladang → Biarkan pekerja di situ sehingga siap.

Create a trade route! = Wujudkan laluan dagangan!
Construct roads between your capital and another city. Or, automate your worker and let him get to that eventually. = Bina jalan antara ibu kota anda dengan bandar lain. Atau automasikan pekerja dan biarkan dia menyiapkannya kemudian.

Conquer a city! = Takluk sebuah bandar!
Bring an enemy city down to low health → Enter the city with a melee unit. = Rendahkan kesihatan bandar musuh → Masuki bandar dengan unit jarak dekat.

Move an air unit! = Gerakkan unit udara!
Select an air unit → Select another city within range → Move the unit to the other city. = Pilih unit udara → Pilih bandar lain dalam julat → Gerakkan unit ke bandar itu.

See your stats breakdown! = Lihat pecahan statistik anda!
