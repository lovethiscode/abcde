Ave Caesar Augustus, Emperor of Rome and Dominus of the Roman Empire! Your empire was the most powerful and feared of all in Western civilization. The Roman people crafted so brilliantly its culture, law, art, and warfare, that no one could contest the supremacy of Rome. Force and Honor led to glorious conquests, a domination of all the lands from Spain in the west to Syria in the east, even reaching the remote barbarian lands of England and Germany. Roman art and architecture have been praised for millenia and have been envied by all lesser civilizations who have followed. = Salam Caesar Augustus, Maharaja Rom dan Penguasa Empayar Rom! Empayar tuanku yang paling perkasa dan ditakuti dalam tamadun Barat. Rakyat Rom membentuk budaya, undang-undang, seni dan peperangannya dengan begitu cemerlang sehingga tiada siapa mampu mencabar keunggulan Rom. Kekuatan dan Maruah membawa penaklukan gemilang, menguasai tanah dari Sepanyol di barat hingga Syria di timur, malah mencapai tanah gasar England dan Jerman yang jauh. Seni dan seni bina Rom dipuji selama ribuan tahun dan dicemburui tamadun lebih kecil yang menyusul.
