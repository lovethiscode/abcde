原创战役共有四章十六关。每关至少获得一颗星，解锁下一关。\n完成本章获得章节完成记录；全部三星可获得精通勋章。\n各关的局势与目标独立，已通关关卡可反复挑战。 = Kempen asal mempunyai empat bab dan enam belas misi. Dapatkan sekurang-kurangnya satu bintang untuk membuka misi seterusnya.\nLengkapkan bab untuk merekod kemajuan; dapatkan semua bintang untuk pingat penguasaannya.\nSetiap misi mempunyai keadaan dan objektif tersendiri. Misi lengkap boleh dimainkan semula.
