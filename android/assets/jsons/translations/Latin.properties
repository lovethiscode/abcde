Isabella = Isabella
God will probably forgive you... but I shall not. Prepare for war. = Deus probabiliter ignoscet tibi... Sed ego non ignoscam. Ad bellum para.
Repugnant spawn of the devil! You will pay! = Fœda diaboli progenies! Pœnas dabis!
If my defeat is, without any doubt, the will of God, then I will accept it. = Si clades mea sine dubio Dei voluntas est, eam accipiam.
God blesses those who deserve it. I am Isabel of Spain. = Deus beat eos qui mereant. Isabella de Hispania sum.
I hope this deal will receive your blessing. = Spero hanc pactionem benedictionem tuam accepturam.
Seven Cities of Gold = Septem Urbes Aureae
Holy Isabella, envoy of God, Great Queen of Castille and León, your people celebrate you! Spain is a beautiful and ancient country, a link between Europe and Africa, one shore on the Mediterranean and the other on the mighty Atlantic Ocean. The Spanish culture had taken the best of the Christian and Muslim worlds, and was ready to dominate the world for centuries. Powerful Spanish military fleets and brave explorers found and conquered much of the New World. Exploiting a whole new continent and its riches, Spain reached a state of power few could compete with for hundreds of years. = Isabella sancta, nuntia Dei, Regina magna Castellae et Legionis, populus tuus celebrat te! Hispania est terra pulchra atque antiqua, est nexus inter Europam et Africam, uno litore ad Mare Mediterraneum et uno ad potentem Oceanum Atlanticum. Cultura Hispanica ceperat optimas mundorum Christiani et Musulmani, paraverat ad dominandum mundum saeculorum. Classes potentes Hispanicae et indagatores fortes invenerunt et vicerunt multum mundi novi. Usurpaverat novam continentem omnem et copiam illius, Hispania attigit statum potentiae, ut pauci possent in saeculis concertare.
O splendid and virtuous Isabella! By the will of the heavens, will Spain reborn to achieve its holy destiny and become a new El Dorado? Will your new empire shine through the ages of history? = O Isabella splendida atque virtuosa! Per voluntatem caelorum renasceturne Hispania ut attingat fatum sanctum ejus et fiat novus El Dorado? Per aetates historiae lucebitne tuum novum imperium?
