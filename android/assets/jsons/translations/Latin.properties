Montezuma I = Montezuma I
Xi-miqa-can! Xi-miqa-can! Xi-miqa-can! (Die, die, die!) = Xi-miqa-can! Xi-miqa-can! Xi-miqa-can! (Morere, morere, morere!)
Excellent! Let the blood flow in raging torrents! = Perbene! Cruor torrentibus saevis fluat!
Monster! Who are you to destroy my greatness? = Monstrum! Quis es, et rupisti magnitatem meam?
What do I see before me? Another beating heart for my sacrificial fire. = Quid coram me video? Aliud cor pulsans igni meo sacrificii.
Accept this agreement or suffer the consequences. = Hanc pactionem accipe aut consequentias patere.
Welcome, friend. = Salve, amice.
Sacrificial Captives = Captus Sacrificus
O divine Montezuma, your people welcome you! May your magnificence inspire all living things! The mighty Aztecs were nomads until the 12th century, when they choose to settle in the mesa central, which would later be called Mexico. Wars were frequent with other tribes to control the rich land surrounding the sacred lakes of Texcoco, Xaltocan and Zampango. In some 200 years, double-sided alliances and martial prowess made of the Aztecs the dominant power in the Central American basin, forming a mighty empire stretching from sea to sea. Alas, the empire fell under the assault of foreign devils - the Spaniards and many curses they brought with them! Wars between tribes and weaponry of doom used by the invaders made the great Aztec civilization crumble in only a few decades. = O divine Montezuma, populus tuus te salutat! Magnificentia tua omnia viventia inspiret! Potentes Azteci nomades erant usque ad sæculum 12, cum in planitie media sedere elegerunt, quæ postea Mexico appellaretur. Bella cum aliis tribubus crebra erant pro terra divite circa sacros lacus Texcoco, Xaltocan et Zampango. Per circiter 200 annos societates ancipites et ars militaris Aztecos summam potestatem in pelvi Americæ Centralis fecerunt, imperium potens a mari ad mare tendens. Eheu, imperium sub impetu externorum dæmonum, Hispanorum multarumque pestium ab eis allatarum, cecidit! Bella inter tribus et arma exitii invasorum magnam civilitatem Aztecam paucis tantum decenniis ruere fecerunt.
O mighty King Montezuma, do you hear the call of your people seeking for revenge? Will you lead them to victory under the light of the Five Suns? Will your new empire shine through the ages of history? = O potens Rex Montezuma, audisne vocem populi ultionem petentis? Ducesne eos ad victoriam sub luce Quinque Solium? Splendebitne novum imperium tuum per ætates historiæ?
