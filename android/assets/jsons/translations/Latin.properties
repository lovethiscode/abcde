Otto von Bismarck = Otho de Bismarck
I cannot wait until ye grow even mightier. Therefore, prepare for war! = Non possum manere te augeri ut potentior fias. Sic para ad bellum!
Corrupted villain! We will bring you into the ground! = Sceleste corrupte! Te in terram deiciemus!
Germany has been destroyed. I weep for the future generations. = Germania deleta est. Pro futuris generationibus fleo.
That wild bravado? It's a ticking time bomb, especially when you're all bark and no bite! = Illa ferox iactantia? Est bomba mox explosura, præsertim cum tantum latres nec mordeas!
Guten Tag. In the name of the great German people, I bid you welcome. = Salve. Nomine magni populi Germanici te excipio.
It would be in your best interest, to carefully consider this proposal. = Tibi maxime expediret hanc propositionem diligenter considerare.
What now? = Quid nunc?
So, out with it! = Age, effare!
Furor Teutonicus = Furor Teutonicus
All hail to Otto von Bismarck, first chancellor of Germany and its empire! During the ancient era, Germany was a land fragmented in several tribes but already showed great promise as the Roman Empire itself struggled to bend the Germans to its will. Germany, as one nation, was slowly built on the ruins of the Holy Roman Empire, and waited 1871 to be finally unified after the glorious victory on France and Napoleon III. The German people are creative, intelligent, industrious and proven to be talented warriors through history. Despite great catastrophes and failures in the first half of the 20th century, Germany can always rely on its people will and strength to be among the greatest and powerful nations in the world. = Salve Otto von Bismarck, prime cancellarie Germaniæ eiusque imperii! Ætate antiqua Germania inter plures tribus divisa erat, sed iam magnam spem ostendebat, cum ipsum Imperium Romanum Germanos in suam potestatem redigere ægre posset. Germania ut una gens lente super ruinas Sacri Romani Imperii orta est et usque ad 1871 exspectavit ut post gloriosam victoriam de Gallia et Napoleon III tandem uniretur. Populus Germanicus est inventivus, intellegens, industrius et per historiam bellandi peritus. Quamvis magnæ clades et casus in prima parte sæculi 20 evenerint, Germania voluntate et robore populi sui semper niti potest ut inter maximas potentissimasque mundi gentes sit.
Great Prince Bismarck, glory and power are at the heart of the German nation. Your people are bright, and lend you their iron will to lead Germany once again. Will your new empire shine through the ages of history? = Magne Princeps Bismarck, gloria et potestas in corde gentis Germanicæ sunt. Populus tuus ingeniosus est et ferream suam voluntatem tibi præbet ut Germaniam iterum ducas. Splendebitne novum imperium tuum per ætates historiæ?
