Catherine = Catharina
You've behaved yourself very badly, you know it. Now it's payback time. = Pessime te gessisti, id scis. Nunc pœnas dabis.
You've mistaken my passion for a weakness, you'll regret about this. = Ardorem meum pro infirmitate habuisti; huius te pænitebit.
We were defeated, so this makes me your prisoner. I suppose there are worse fates. = Victi sumus, itaque captivus tuus sum. Credo peiora fata esse.
Fine then. It's your call. = Bene igitur. Tu decernis.
I greet you, stranger! If you are as intelligent and tactful as you are attractive, we'll get along just fine. = Ave, hospes! Si tam intelligens ac sensatus es quam attractivus es, belle consistamus.
How would you like it if I propose this kind of exchange? = Placeretne tibi si hanc commutationem proponerem?
Hello! = Salve!
What do you need?! = Quid requiris?!
Siberian Riches = Copia Siberiae
Hail to Imperial Majesty Catherine, Empress of all Russians. Living in the largest country in the world, from the Pacific Ocean in the east to the Baltic Sea in the west, your people endured wars, droughts, and many disasters, imbuing the Russian society with heroism and tenacity, and producing artists and scientists among the best in the world. Russia is a powerful empire which rightfully claims its place in the world concert of superpowers. = Salve Maiestas Imperialis Catharina, Imperatrix omnium Russorum. In maxima mundi terra habitantes, ab Oceano Pacifico in oriente ad Mare Balticum in occidente, tui populi bella, siccitates multasque clades pertulerunt; ita societas Russica virtute et constantia imbuta est atque artifices doctosque inter optimos mundi produxit. Russia potens imperium est quod iure locum inter maximas potestates mundi postulat.
Empress Catherine, your people are eager for Russian glory, to revive the sacred light of the Motherland. Will your new empire shine through the ages of history? = Imperatrix Catharina, tui populi gloriam Russicam et sanctum patriæ lumen renovare cupiunt. Splendebitne novum imperium tuum per ætates historiæ?
