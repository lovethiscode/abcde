# Capturing a city

What would you like to do with the city of [cityName]? = Quod facere vis urbe quæ est [cityName]?
Annex = Affigere
Annexed cities become part of your regular empire. = Urbes affixae fiant pars imperii assidui tui.
Their citizens generate 2x the unhappiness, unless you build a courthouse. = Cives earum generent duplam iram nisi aedifices jus.
Your civilization may not annex this city. = Non licet populo tuo hanc urbem affigere.
Puppet = Municipium facere
Puppeted cities do not increase your tech or policy cost. = Municipia non augeant sumptum tuum technologiae vel dictati.
You have no control over the the production of puppeted cities. = Sine imperio sis de producto municipiorum.
Puppeted cities also generate 25% less Science and Culture. = Municipia etiam 25% minore generant scientiam et culturam.
A puppeted city can be annexed at any time. = Municipium potest aliquando affigi.
Liberate (city returns to [originalOwner]) = Liberare (urbs [originalOwner](e/o/is) reddatur)
Liberating a city returns it to its original owner, giving you a massive relationship boost with them! = Urbem liberare reddat eam possessori initiali ejus, det tibi additionem permagnam ad propinquitatem cum eis!
Raze = Exscindere
Razing the city annexes it, and starts burning the city to the ground. = Urbem exscindere affigat eam, incipiat eam ad humum adaequare.
Razing the city puppets it, and starts burning the city to the ground. = Urbem exscindere faciat eam municipium, et incipiat id ad humum adaequare.
The population will gradually dwindle until the city is destroyed. = Multitudo sensim decrescat donec urbs exscissa sit.
Original capitals and holy cities cannot be razed. = Metropolis initialis et urbes sanctae non possunt exscindi.
Destroy = Destruere
Destroying the city instantly razes the city to the ground. = Urbem destruere confestim adaequet urbem ad humum.
Keep it = Detineo id.
Remove your troops in our border immediately! = Statim emove copias tuas ex finibus nostris!
Sorry. = Me paenitet.
Never! = Numquam faciam!
Those lands were not yours to take. This has not gone unnoticed. = Illi agri non erant vobis. Hoc neque est sine annotatione factum.

