All hail Great King Gustavus Adolphus, founder of the Swedish Empire, and one of the most famous military tacticians. In the early 17th century, Sweden emerged as a great power in Europe under your reign, thanks to your wisdom, both in diplomacy and warfare. As king, you decided to reform Swedish laws to bring economic stability and prosperity to your people. Your allies, and also your enemies, called you the 'Lion of the North', witnessing your modern vision of warfare, and the prowess of your armies on the battlefield. As you triumphed in the Thirty Years' War, your name will be forever remembered as one of history's greatest generals. = Salve Magne Rex Gustavus Adolphus, conditor Imperii Suecici et unus clarissimorum artis militaris peritorum. Ineunte sæculo 17 Suecia sub tuo regno magna potestas Europæ facta est propter sapientiam tuam tam in rebus externis quam in bello. Ut rex leges Suecicas reformare decrevisti ad stabilitatem œconomicam prosperitatemque populo ferendam. Socii tui atque hostes quoque te «Leonem Septentrionis» appellaverunt, novam belli visionem et virtutem exercituum in acie testantes. Cum in Bello Triginta Annorum triumphaveris, nomen tuum semper ut unius maximorum ducum historiæ memorabitur.
O noble King, will you lend your leadership and brilliant ideas to Sweden once again, to conceive strategies never seen before? Will your new empire shine through the ages of history? = O nobilis Rex, dabisne iterum Sueciæ imperium tuum præclarasque ideas ad consilia numquam ante visa excogitanda? Splendebitne novum imperium tuum per ætates historiæ?
