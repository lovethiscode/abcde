Kamehameha I = Kamehameha I
The ancient fire flashing across the sky is what proclaimed that this day would come, though I had foolishly hoped for a different outcome. = Ignis antiquus trans cælum fulgens clamavit hunc diem venturum esse, etsi ego stulte sperabam effectum alium futurum esse.
It is obvious now that I misjudged you and your true intentions. = Manifestum jam est quod ego errato censui te et tuam intentionem.
The hard-shelled crab yields, and the lion lies down to sleep. Kanaloa comes for me now. = Cancer testaceus succumbit, et leo cubat ut dormiat. Kanaloa nunc ad me venit.
The ocean's tide may rise and fall, but my resolve stands steady. = Æstus oceani crescere minuique potest, sed propositum meum firmum manet.
Aloha! Greetings and blessings upon you, friend. I am Kamehameha, Great King of this strand of islands. = Aloha! Salutationes et benedictiones tibi, amice. Sum Kamehameha, Magnus Rex huius insularum seriei.
Come, let our people feast together! = Veni, populi nostri una epulentur!
Welcome, friend! = Salve, amice!
Wayfinding = Inventio Viae
Aloha to Kamehameha the Great, who the heavens allowed to unite your people! O great King, under your reign, the Big Island of Hawai'i became one in 1791 AD, and many other islands joined your vision of union in 1810. As the first King of Hawai'i, law and taxation systems were stabilized, and you promoted the Kanawai Mamalahoe, an edict to protect civilian people in times of war. Unification and sovereignty of all the islands continued thanks to your fair laws and deeds, even after you joined your ancestors in paradise in 1819. = Aloha Kamehameha Magne, cui cælum permisit populum tuum unire! O magne Rex, sub tuo regno Magna Insula Hawai'i anno 1791 post Christum unita est, multæque aliæ insulæ consilio tuo unionis anno 1810 accesserunt. Ut primo Rege Hawai'i, legum tributorumque systemata stabilita sunt et Kanawai Mamalahoe promovisti, edictum civiles tempore belli protegens. Unitas libertasque omnium insularum propter iustas leges factaque tua perduraverunt etiam postquam maioribus tuis in paradiso anno 1819 adiunctus es.
Wise and benevolent King, will you unite your people once again by wearing the bright mantle of the Lion of the Pacific? Will your new empire shine through the ages of history? = Rex sapiens et benevole, uniesne populum tuum iterum fulgido Leonis Pacifici pallio indutus? Splendebitne novum imperium tuum per ætates historiæ?
