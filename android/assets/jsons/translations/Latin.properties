Askia = Askia
You are an abomination to heaven and earth, the chief of ignorant savages! You must be destroyed! = Abominatio es cælo terræque, princeps ignarorum barbarorum! Delendus es!
Fool! You have doomed your people to fire and destruction! = Stulte! Populum tuum igni et exitio destinavisti!
We have been consumed by the fires of hatred and rage. Enjoy your victory in this world - you shall pay a heavy price in the next! = Ignibus odii furorisque consumpti sumus. Fruere victoria in hoc mundo; in proximo magnum pretium solves!
This insult shall cost you. = Hæc contumelia tibi constabit.
I am Askia of the Songhai. We are a fair people - but those who cross us will find only destruction. You would do well to avoid repeating the mistakes others have made in the past. = Sum Askia Songhai. Iusti sumus, sed qui nobis obsistunt solum exitium invenient. Tibi expediet errores a ceteris olim commissos non repetere.
Can I interest you in this deal? = Placetne tibi hæc pactio?
River Warlord = Dominus Bellicus Fluvialis
Askia, leader of the Songhai people and greatest of all, may God watch your path towards glory! Songhai was under the rule of the mighty West African state of Mali until the middle of the 14th century. Great King Sunni Ali Ber fought for independance, and showed to all Songhai's power, by conquering territories and repelling many foes who sought to destroy the rising kingdom. Ultimately, conquest of the wealthy cities of Timbuktu and Jenne made Songhai an empire with enough economic power to survive for a century, until the empire bowed down before foes with advanced technology - muskets against spearmen. = Askia, dux populi Songhai et omnium maxime, Deus viam tuam ad gloriam custodiat! Songhai sub potenti civitate Mali Africæ Occidentalis regebatur usque ad medium sæculum 14. Magnus Rex Sunni Ali Ber pro libertate pugnavit et omnibus potentiam Songhai ostendit, terras capiens multosque hostes repellens qui regnum oriens delere volebant. Tandem captio divitum urbium Timbuktu et Jenne Songhai imperium fecit satis potens opibus ut sæculum superesset, donec hostibus technologia provectiore cederet: sclopetis contra hastatos.
King Askia, your people know there's still hope, that the hour of revenge is coming. Give them wealth and power, give them mighty weapons of iron and fire, to destroy any foe, for Songhai to revive! Will your new empire shine through the ages of history? = Rex Askia, populus tuus scit spem adhuc esse, horam ultionis venire. Da eis opes et potestatem, da eis valida arma ferri et ignis ut quemlibet hostem deleant et Songhai renascatur! Splendebitne novum imperium tuum per ætates historiæ?
