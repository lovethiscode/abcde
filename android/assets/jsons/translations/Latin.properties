Gandhi = Gandhi
I have just received a report that large numbers of my troops have crossed your borders. = Modo nuntium accepi magnam copiarum mearum partem fines tuos transisse.
My attempts to avoid violence have failed. An eye for an eye only makes the world blind. = Conatus mei vim vitandi defecerunt. Oculus pro oculo totum mundum cæcum facit.
You can chain me, you can torture me, you can even destroy this body, but you will never imprison my mind. = Potes nectere me, potes cruciare me, tu etiam potes rumpere hoc corpus, sed meum animum incarcerare numquam potes.
Curious. = Mirum.
Hello, I am Mohandas Gandhi. My people call me Bapu, but please, call me friend. = Salve, sum Mohandas Gandhi. Populus me Bapu vocat, sed tu me amicum voca.
My friend, are you interested in this arrangement? = Amice, placetne tibi hæc pactio?
I wish you peace. = Pacem tibi.
Population Growth = Auctus Multitudinis
Wise Mahatma Gandhi, great leader of India, we honor you! India is one of the oldest countries in the world with 10,000 years of history, built on spirit and religion, as three of the world's great religions - Hinduism, Buddhism and Jainism - appeared on this sacred land. Every aspect of India society reveres art, music and color, showing great wealth but also grinding poverty. For centuries, India was torn between local kingdoms fighting each other but also repelling invaders. In the 12th century AD, Muslim Turks tried to conquer India, then the Mongols took their place. In the early 17th century, India, still fragmented, was colonized by the English and their diplomacy and technological superiority. After two centuries of British dominion, Indian nationalism woke up, and you, Great Mahatma, have led a peaceful and victorious rebellion never seen anywhere in history! = Sapiens Mahatma Gandhi, magne dux Indiæ, te honoramus! India est una antiquissimarum mundi terrarum cum 10,000 annis historiæ, spiritu et religione fundata, nam tres magnæ mundi religiones, Hinduismus, Buddhismus et Jainismus, in hac sacra terra ortæ sunt. Omnis pars societatis Indicæ artem, musicam coloremque veneratur, magnas divitias sed etiam gravem paupertatem ostendens. Per sæcula regna localia inter se pugnantia Indiam diviserunt, sed invasores quoque repulerunt. Sæculo 12 post Christum Turci Musulmani Indiam expugnare conati sunt; deinde Mongoli successerunt. Ineunte sæculo 17, India adhuc divisa ab Anglis eorumque arte rerum externarum et technologiæ præstantia subacta est. Post duo sæcula dominii Britannici studium nationis Indicæ experrectum est, et tu, Magne Mahatma, seditionem pacificam victricemque nusquam antea in historia visam duxisti!
Gandhi, your people ask again to be led on the path of freedom. Under protection of Ganesha and Surya, can India accomplish its great potential? Will your new empire shine through the ages of history? = Gandhi, populus tuus iterum se in via libertatis duci rogat. Sub tutela Ganesha et Surya, potestne India magnam facultatem suam explere? Splendebitne novum imperium tuum per ætates historiæ?
