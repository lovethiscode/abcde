'The unleashed power of the atom has changed everything save our modes of thinking, and we thus drift toward unparalleled catastrophes.' - Albert Einstein = «Soluta atomi potestas omnia præter cogitandi modos nostros mutavit; ita ad clades incomparabiles derivamus.» — Albert Einstein
Atomic Theory = Theoria Atomica

'Only within the moment of time represented by the present century has one species, man, acquired significant power to alter the nature of his world.' - Rachel Carson = «Tantum intra temporis punctum hoc sæculo repræsentatum una species, homo, magnam potestatem naturam mundi sui mutandi acquisivit.» — Rachel Carson
