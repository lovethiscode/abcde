Genghis Khan = Cingis Chan
You stand in the way of my armies. Let us solve this like warriors! = Exercitibus meis obstas. Hoc ut bellatores solvamus!
No more words. Today, Mongolia charges toward your defeat. = Nulla plura verba. Hodie Mongolia in cladem tuam irruit.
You have hobbled the Mongolian clans. My respect for you nearly matches the loathing. I am waiting for my execution. = Gentes Mongolicas debilitasti. Reverentia mea erga te paene odio par est. Supplicium meum exspecto.
Your bravery must be commended. = Fortitudo tua laudanda est.
I am Temuujin, conqueror of cities and countries. Before me lie future Mongolian lands. Behind me is the only cavalry that matters. = Sum Temuujin, expugnator urbium terrarumque. Ante me iacent futuræ terræ Mongolicæ. Post me est solus equitatus qui valet.
I am not always this generous, but we hope you take this rare opportunity we give you. = Non semper tam liberalis sum, sed speramus te hanc raram occasionem quam damus accepturum.
So what now? = Quid nunc igitur?
Mongol Terror = Terror Mongolicus
O great Temuujin, immortal leader of the mighty Mongol Empire! Your name alone was enough to make cities crumble, and the sound of the mighty Mongol cavalry to make your enemies flee! O Great Khan! Once Northern Asia united into a mighty people, producing one of the greatest armies the world has ever known, your skillful mounted archers conquered in only a few years, most of China, Eastern Asia, and even reached the gates of Europe at the West. With cunning diplomacy and brilliant warfare, you swept your enemies one after another, creating the greatest empire ever seen, reducing Roman or Greek conquests to minor achievements. = O magne Temuujin, immortalis dux potentis Imperii Mongolici! Solum nomen tuum satis erat ut urbes corruerent, sonitusque magni equitatus Mongolici ut hostes fugerent! O Magne Khan! Postquam Asia Septentrionalis in potentem populum unita est, unum maximorum exercituum umquam notorum producens, periti equites sagittarii tui paucis tantum annis maximam partem Sinæ Asiæque Orientalis ceperunt, ad portas etiam Europæ in occidente pervenientes. Callidis rebus externis et præclara arte belli hostes alium post alium abstulisti, maximum imperium umquam visum creans, quo res Romanorum Græcorumque minores viderentur.
Divine Temuujin, battles and conquests run through the veins of the Mongols. Are you ready to shatter the will of your enemies? Will your cavalry ride in the steppes once again and strike as lightning and thunder? Will your new empire shine through the ages of history? = Divine Temuujin, pugnæ et expugnationes per venas Mongolorum currunt. Paratusne es voluntatem hostium frangere? Iterumne equitatus tuus per campestria equitabit et ut fulgur tonitruque feriet? Splendebitne novum imperium tuum per ætates historiæ?
