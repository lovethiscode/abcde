Theodora = Theodora
It is always a shame to destroy a thing of beauty. Happily, you are not one. = Semper triste est rem pulchram delere. Feliciter tu talis non es.
Now darling, tantrums are most unbecoming. I shall have to teach you a lesson. = Nunc, care, iræ impetus maxime dedecent. Te docere debebo.
Like a child playing with toys you are. My people will never love you, nor suffer this indignation gracefully. = Ut puer cum ludibriis ludens es. Populus meus te numquam amabit nec hanc indignitatem patienter feret.
My, isn't this a pleasant surprise - what may I call you, oh mysterious stranger? I am Theodora, beloved of Byzantium. = O, quam iucunda admiratio! Quomodo te appellem, arcane hospes? Sum Theodora, Byzantio dilecta.
I have heard that you adept at certain kinds of ... interactions. Show me. = Audivi te peritum quorundam generum…commercii esse. Ostende mihi.
Hello again. = Iterum salve.
Patriarchate of Constantinople = Patriarchatus Constantinopolitanus
Magnificent Empress Theodora, beloved of Byzantium and of Rome, your people salute you! With your beauty and intelligence, you rose up from actress and courtesan to the rank of the most powerful woman in the Roman Empire, as wife of Justinian I. In the late 520's AD, you helped your husband engage in spiritual and legal reforms, promugalting numerous laws to improve women's status and treatment in the empire. You also made of Constantinople the jewel of the Eastern Roman Empire with the restoration and construction of many aqueducts, bridges, and churches, its beauty culminating with the creation of the Hagia Sophia, one of the most splendid pieces of architecture in the world. = Theodora, Imperatrix magna, amaris Byzantio et Roma. Populus tuus salutat te! Cum tua pulchritudine et intellegentia, ab actrice ac meretrice ad feminam potentissimam in Imperio Romano surrexisti, ut marita Iustiniani I eras. In fine DXXX annorum Domini, maritum tuum ad reformationes spiritales et justa adjuvisti, jura meliorationis status et curationis feminarum in imperio promulgavisti. Etiam fecisti Constantinopolim lapidem Imperii Romani Orientalis cum refectio constructioneque aquaeductuum, pontium, ecclesiarumque. Pulchritudo sua surrexit ad altissimam cum creatione Sanctae Sapientiae, quae est unum de aedificiis pulcherrimis in mundo.
Beautiful Empress,the Byzantine Empire's magnificence is intact in all memories, and ready to reborn as the new jewel of humankind. Will your new empire shine through the ages of history? = Imperatrix pulchra, magnificentia Imperii Byzantini est servata in memoriis omnibus, et est adornata ad renascendum ut fiat novus lapis hominum. Per aetates historiae lucebitne tuum novum imperium?
