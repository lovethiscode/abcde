'Every particle of matter is attracted by or gravitates to every other particle of matter with a force inversely proportional to the squares of their distances.' - Isaac Newton = «Omnis materiæ particula ad omnem aliam trahitur sive gravitat vi quadratis distantiarum inverse proportionali.» — Isaac Newton
Particle Physics = Physica de Particulis
'The release of atomic energy has not created a new problem. It has readily made more urgent the necessity of solving an existing one.' - Albert Einstein = «Solutio energiæ atomicæ novam difficultatem non creavit. Necessitatem iam exsistentem solvendi urgentiorem reddidit.» — Albert Einstein
