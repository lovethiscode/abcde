George Washington = Georgius Washingtonius
Your wanton aggression leaves us no choice. Prepare for war! = Petulans aggressio tua nullam nobis electionem relinquit. Ad bellum te para!
You have mistaken our love of peace for weakness. You shall regret this! = Pacis amorem nostrum pro infirmitate habuisti. Huius te pænitebit!
The day...is yours. I hope you will be merciful in your triumph. = Dies…tuus est. Spero te in triumpho clementem fore.
The people of the United States of America welcome you. = Populus Civitatum Unitarum Americæ te salutat.
Is the following trade of interest to you? = Tibine hæc commutatio placet?
Well? = Quid igitur?
Manifest Destiny = Fatum Manifestum
President Washington, we salute you and the proud American civilization! Freed from the British dominion in the 18th century, then cleansed and reborn after a terrible civil war, the United States nation was ready to play its great role in the 20th century. At the height of its power, triumphant after two terrible world wars, United States of America, a land of immigration, opportunities, optimism and determination, has risen above all other weakening nations, unable to equal such power. = Praesidens Washingtonie, nos salutamus te et civilizationem superbientem Americanam! In saeculo XVIII, a dominatione Britannicâ liberatus, et tum colatus et renatus post bellum terribile civile, populus Civitatum Foederatarum paraverat agere personam magnam suam in saeculo XX. In excelsitate potentiae suae, postquam triumphaverunt post duo bella mundi terribilia, Civitates Foederatae Americae, ac terra immigrationis, opportunitatis, optimismi et determinationis, surrexerunt super populos alios minutos omnes, qui non poterant cum ista potentia adaequare.
President Washington, will you show to the world the legitimacy of the American way of life, and spread the flame of liberty to all mankind? Will your new empire shine through the ages of history? = Praesidens Washingtonie, ad mundum ostendesne legitimitatem modi vitae Americani? Et sternesne ignem libertatis ad homines omnes? Per aetates historiae lucebitne tuum novum imperium?
