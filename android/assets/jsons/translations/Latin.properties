Augustus Caesar = Augustus Caesar
My treasury contains little and my soldiers are getting impatient... (sigh) ...therefore you must die. = Ærarium meum parum continet et milites impatientiam ostendunt… (suspirat) …ideo tibi moriendum est.
So brave, yet so stupid! If only you had a brain similar to your courage. = Tam fortis, tam stultus! Utinam tibi ingenium esset audaciæ par.
The gods have deprived Rome of their favour. We have been defeated. = Di Romæ favorem abstulerunt. Victi sumus.
I wasn't sure, but it seems you do have some grit. = Dubitabam, sed videtur tibi aliquam constantiam esse.
I greet you. I am Augustus, Imperator and Pontifex Maximus of Rome. If you are a friend of Rome, you are welcome. = Ave. Ego sum Augustus, Imperator ac Pontifex Maximus Romae. Si amicus Romae es, gratus es.
I offer this, for your consideration. = Hoc tibi considerandum offero.
Hail. = Have.
What do you want? = Quod vis?
The Glory of Rome = Roma invicta
Ave Caesar Augustus, Emperor of Rome and Dominus of the Roman Empire! Your empire was the most powerful and feared of all in Western civilization. The Roman people crafted so brilliantly its culture, law, art, and warfare, that no one could contest the supremacy of Rome. Force and Honor led to glorious conquests, a domination of all the lands from Spain in the west to Syria in the east, even reaching the remote barbarian lands of England and Germany. Roman art and architecture have been praised for millenia and have been envied by all lesser civilizations who have followed. = Ave Caesar Auguste, Imperator Romae ac Domine Imperii Romani! Imperium tuum erat potentissimum ac maxime veritum de omnibus in civilizatione occidentali. Populus romanus suam eruditionem, jus, artem, bellaturumque fulgenter aedificaverit, ut nullus possit cum primatu Romano certare. Potentia et honor derexerunt ad victorias gloriosas, ad dominandas terras ab Hispania in occidente ad Syriam in oriente, et accessit terras barbaras remotas Angliae et Germaniae. Romana ars architecturaque sunt laudatae in millenniis et sunt imitatae civilizationibus minoribus secutis.
O glorious Imperator, your people celebrate you and ask for the glory of Rome! In these times of darkness, the Pax Romana will be a beacon of light for all! Will your new empire shine through the ages of history? = O gloriose imperator, populus tuus celebrat te et quaerit gloriam Romanam! In temporibus tenebrarum, Pax Romana erit pharus lucis omnibus! Per aetates historiae lucebitne tuum novum imperium?
