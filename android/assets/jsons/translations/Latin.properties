A sacrifice unlike all others must be made! = Sacrificium dissimile omnium aliorum debet fieri!
Muahahahahahaha! = Muahahahahahaha!
Today comes a great searing pain. With you comes the path to the black storm. = Hodie venit magnus dolor fervens. Tecum venit via ad turbidinem atram.
Greetings, wayward one. I am known as Pacal. = Salve, errabunde. Pacal nominor.
Friend, I believe I may have found a way to save us all! Look, look and accept my offering! = Amice, credo me viam omnes nos servandi invenisse! Vide, vide et oblationem meam accipe!
A fine day, it helps you. = Dies pulcher tibi prosit.
The Long Count = Numeratio Longinqua
Kneel before King Pacal the Great, son of the gods and protector of the Palenque domain! After your kingdom has been harassed for years by neighboring rivals, you struck back at the enemies of your people, defeating each of them and sacrificing their leaders as a retribution to the insults made to your ancestors. Your wisdom and hard will not only restored the glory of Palenque, but turned it into a magnificient city, as your people built the greatest monuments and architecture the world has ever known. = Genua flectite coram Rege Pacal Magno, filio deorum et tutore regni Palenque! Postquam regnum tuum annos a vicinis rivalibus vexatum est, hostes populi tui vicissim percussisti, singulos vincens eorumque duces sacrificans ut contumelias maioribus tuis illatas ulciscareris. Sapientia et firma voluntas tua non solum gloriam Palenque restituerunt, sed eam magnificam urbem fecerunt, cum populus maxima monumenta operaque architecturæ umquam nota ædificaret.
Absolute King, your people need you to save the great Mayan culture and knowledge. Will you be able to read the movement of the stars, and find in the heavens the power to repel any foes? Will your new empire shine through the ages of history? = Rex supreme, populus tuus te requirit ad magnam culturam scientiamque Mayanam servandam. Poterisne motum stellarum legere et in cælis potestatem quoslibet hostes repellendi invenire? Splendebitne novum imperium tuum per ætates historiæ?
