#################### Lines from Global Tutorials ####################

Welcome to Unciv!\nBecause this is a complex game, there are basic tasks to help familiarize you with the game.\nThese are completely optional, and you're welcome to explore the game on your own! = Salve in Unciv!\nQuia ludus multiplex est, munera simplicia te cum ludo familiarem reddunt.\nHæc omnino voluntaria sunt; libere ludum ipse explora!

Welcome to Unciv! = Salve in Unciv!
Because this is a complex game, there are some tutorials to help familiarize you with it. These can be disabled in the Options -> Display menu, but please hang on if you're new here! = Quia ludus multiplex est, doctrinæ aliquot te ei assuefaciunt. In Optiones -> Ostensio debilitari possunt, sed quæso eas serva si novus es!
Your first mission is to found your capital city. This is actually an important task because your capital city will probably be your most prosperous. Many game bonuses apply only to your capital city, and it will be the center of your empire. = Primum munus tuum est caput condere. Hoc magni momenti est, quia caput verisimiliter urbs tua florentissima erit. Multa ludi beneficia soli capiti valent et centrum imperii tui erit.
How do you know a city location is appropriate? Luckily, the game has already chosen a good location for you. You can settle in this place, or maybe move a turn to found on a Hill (for Production and defence) or next to a Mountain (to gain access to the Observatory building later on). = Quomodo scis locum urbis idoneum esse? Feliciter ludus bonum locum tibi iam elegit. Hic sedere potes, aut unum gressum moveri ut in Colle condas (ad Fabricationem et defensionem) vel iuxta Montem (ut postea Observatorium ædificare possis).
You'll likely want more cities later on. For these cities, you must go and find a good place. Looking for and founding on or near Luxury resources is a good rule of thumb. = Plures urbes postea verisimiliter voles. Eis bonum locum invenire debes. Bona regula est merces Luxuriosas quærere et super eas vel prope eas condere.
Luxury resources are tiles that have things like Gems, Cotton, or Silk (indicated by a yellow background of the resource icon). These resources make your civilization happy. You should also keep an eye out for resources needed to build units, such as Iron. Cities cannot be built within 3 tiles of existing cities, which is another thing to keep in mind! = Merces Luxuriosæ sunt areæ rebus ut Gemmis, Bombace aut Serico, fundo flavo signi mercis indicatæ. Hæ merces civilitatem tuam felicem faciunt. Merces etiam centuriis construendis necessarias, ut Ferrum, observa. Urbes intra 3 areas urbium exsistentium condi non possunt: hoc quoque memento!
Cities will house Citizens, which can work tiles up to 3 tiles away from the city. This means you don’t have to settle cities right on or next to good tiles. Let’s say, for example, that you want access to some Iron – but the resource is in a desert area. You don’t have to settle your city in the desert. You can settle a few tiles away in more prosperous lands. Your city will grow and eventually gain access to the resource. You only need to settle right on top of resources if you need them immediately. = Urbes Cives continent qui areas usque ad 3 areas ab urbe colere possunt. Itaque non necesse est urbes directe super bonis areis aut iuxta eas condere. Exempli gratia, si Ferrum cupis sed merx in deserto est, urbem in deserto condere non debes: paucis areis ab ea in terra fertiliore condere potes. Urbs crescet tandemque mercem attinget. Tantum si mercem statim requiris directe super eam condere debes.
The first thing coming out of your city depends on the strategy you want to follow, but the 'classic' build order is to build first two Scouts, then a Shrine, and three Settlers, and adopt Tradition, to explore the map quickly (Scouts ignore terrain cost), and to get an early Pantheon (if you're playing with religion enabled). = Primum urbis opus a consilio tuo pendet; ordo tamen «classicus» est primum duos Exploratores, deinde Sacellum et tres Colonos construere et Traditionem adoptare, ut tabulam celeriter explores (Exploratores pretium soli neglegunt) et Pantheum mature obtineas, si religio habilitata est.
But feel free to experiment with your own build orders! = Libere tamen tuos ordines constructionis experire!

In your first couple of turns, you will have very little options, but as your civilization grows, so do the number of things requiring your attention. = Primis paucis gressibus paucissimæ optiones erunt; crescente tamen civilitate plura attentionem tuam requirent.

Culture and Policies = Cultura et Dictata
Each turn, the culture you gain from all your cities is added to your Civilization's culture.\nWhen you have enough culture, you may pick a Social Policy, each one giving you a certain bonus. = Quoque gressu cultura ex omnibus urbibus tuis culturæ Civilitatis additur.\nCum satis culturæ habes, Dictatum Sociale eligere potes, quod beneficium certum dat.
The policies are organized into branches, with each branch providing a bonus ability when all policies in the branch have been adopted. = Dictata in ramos disponuntur; quisque ramus facultatem additam præbet cum omnia eius dictata adoptata sunt.
With each policy adopted, and with each city built,\n  the cost of adopting another policy rises - so choose wisely! = Quoque dictato adoptato et quaque urbe ædificata,\n  pretium dictati proximi adoptandi crescit: sapienter elige!

City Expansion = Amplificatio Urbis
Once a city has gathered enough Culture, it will expand into a neighboring tile.\nYou have no control over the tile it will expand into, but tiles with resources and higher yields are prioritized. = Cum urbs satis Culturæ collegit, in aream vicinam crescit.\nAream eligere non potes, sed areæ mercibus et maioribus proventibus præferuntur.
Each additional tile will require more culture, but generally your first cities will eventually expand to a wide tile range. = Quæque area addita plus culturæ requirit; primæ tamen urbes tuæ tandem plerumque late crescent.
Although your city will keep expanding forever, your citizens can only work 3 tiles away from city center.\nThis should be taken into account when placing new cities. = Quamvis urbs tua sine fine crescat, cives tantum usque ad 3 areas a centro urbis laborare possunt.\nHoc memento cum novas urbes collocas.

Food is the resource fundamental to your Cities', and as a result Nation's, population and health. = Cibus est merx fundamentalis de  multitudine et salute urbium tuarum et cur populi tui.
Every Citizen in each City consumes Food per turn. Any left over is considered Growth and is stored in the City Center. Once enough accumulates, the City Grows and a new Citizen is added. = Civis omnis in omni urbe omni gressu consumit cibum. Si qui reliquus est, videatur "auctus" et servetur in centro urbis. Quando satis accumulentur, urbs augeatur, et nova multitudo addatur.
Initially your main source of Food is the City Center itself and working a surrounding tile with a Citizen. You can increase how much is generated by gaining more Citizens to work more tiles, improving the tiles so that they yield more Food, and eventually Buildings and Policies. = Fons cibi tuus principalis in principio est centrum urbis ipsum, et cive operare tegulam de circumcurrentibus. Potes quantitatem adicere per acquisitionem civium plurium ad operandum plures tegulas, per meliorandum tegulas, quo producant plus cibi, et postremo, per aedificia et dictata.
Since a city's number of Citizens, or Population, determines how many tiles a City can work, Food is often the most important Resource. = Quoniam urbis numerus civium, sive multitudo, decernit tegulas quantas urbs potest operare, cibus cotidie est merx gravissima.

Production is the resource that lets a City Center build new things. = Fabricatio est materia qua centrum urbis aedificat res novas.
This can be new Buildings that are added to the City Center, or new Units that can go out across the World Map to advance your Nation's goals. = Hae fortasse sint aedificia, quae ad centrum urbis addantur, aut centuriae novae, quae possint ire per tabulam mundi, ad destinatum populi tui.
Everything you can build has a Production Cost. Every turn each City generates a certain amount of Production and puts it towards whatever is at the top of the Build Queue. Once the total cost is collected, the Building or Unit is built! = Id quod cumque aedificare potes, habet sumptum de fabricatione. In omni gressu urbes singulae generant aliquantum fabricationis et ponunt id ad illud quod cumque in capite agminis est. Quando sumptus totus colligitur, illud aedificium sive centuria, erit aedificatum!
Any excess Production after something is built is overflowed to the next thing the City builds. Up to it's total Production Cost. = Quaecumque sit fabricatio superflua postquam aliquod sit aedificatum, superfluitur ad rem secundam quam haec urbs aedificet, usque ad totum sumptum fabricationis ejus.
Since this determines how quickly you can build more stuff, your Nation's Production Capacity is crucial to it's advancement and survival. = Quia hoc celeritatem novarum rerum construendarum definit, facultas Fabricationis gentis tuæ progressui et saluti maximi momenti est.

⍾Science is the resource that unlocks new and exciting Technologies for your Nation. = ⍾Scientia est materia quae pro populo tuo disserat technologias novas atque excitantes.
Once you've Founded your Capital, you'll be prompted to Pick a Technology to Research. = Postquam condis metropolim tuam, admonearis technologiam inveniendam eligere.
Every Technology costs an amount of ⍾Science. Every turn the ⍾Science your Nation produces is paid towards Researching your chosen Technology. = Technologia omnis sumit aliquantum ⍾scientiae. In omni gressu ⍾scientia, quam populus tuus producat, impenditur ad inveniendum technologiam a te electam.
Once a Technology has it's cost fully paid, you unlock the benefits for your Nation! This could be new Units, Buildings, or other advantages. Any surplus will overflow into the next Technology you pick to Research. = Quando unius technologiae sumptus totus impenditur, benefacta populo tuo disseras! Ea possint esse centuriam novam vel aedificium novum, vel aliqua alia bona. Si qua superflua est, superfluit in technologiam posteriorem cognoscendam electam.
Researching a Technology in the next Era will advance you into that Era and trigger a notification to other Nations about how amazing you are! = Assectatio technologiae in posteriore aetate faciet te ingressum in eam aetatem et faciet aliis populis nutium de quanto mirus es!
Since new Technologies tend to give access to better Units, Buildings, and even unlock powerful new Policies, staying ahead of the competition is one of the best ways to secure your Victory! = Quoniam nova technologia cottidie dat aditum ad meliores centurias, aedificia et quoque disserat nova dictata potentia, prae certamen consistere est unum de modis optimis ad firmandum tuam victoriam!

Ah Gold. The Universal Medium of Exchange. Everyone loves Gold! They say it can't buy Happiness, but nuclear submarines are almost as good. = A, aurum. Medium universale commercii. Quisque amat aurum! Aliqui dixerunt eo emere felicitatem non posse, sed naves subaquaneae nucleares fere tam bonae sunt!
You can earn more Gold from Tiles, Resources, Improvements, and eventually Buildings, Specialists, and Trade Routes. Ancient Ruins, meeting new City-States, and Pillaging are also great sources of Gold. During a Golden Age every Tile that already yields Gold will yield an additional Gold! = Plus Solidorum ex Areis, Mercibus, Emendationibus, postea Ædificiis, Peritis et Itineribus Commercii obtinere potes. Ruinæ Antiquæ, novi congressus cum Civitatibus Urbanis et Direptio etiam magni fontes Solidorum sunt. Sæculo Aureo quæque Area iam Solidos præbens unum Solidum additum dabit!
Gold is how you pay for Building Maintenance, Transportation Upkeep, and Unit Upkeep. If you run out of Gold, first you'll receive penalties to your ⍾Science production, then eventually your Units will start Disbanding as you can't pay their upkeep. = Solidi sunt ei quibus tu pendis ad aedificia tuenda, tuendum vecturae, et centurias tuendas. Si solidi tibi desunt, primitus accipias poenas ad effectum ⍾scientiae tibi, et tandem centuriae tuae incipiant dimitti, quia non possis pendere ad eas tuendas.
Gold can be used to Buy Buildings and Units, helping bring up a new City or quickly build an Army. It can also buy Tiles to add to your City. It's also used to Upgrade your units from their older, obsolete forms to new, stronger versions. And investing it into a Research Agreement is a great way to convert it into ⍾Science. = Solidi ad Ædificia et Centurias emenda adhiberi possunt, adiuvantes novam Urbem augere vel Exercitum cito creare. Eis Areas quoque Urbi addendas emere potes. Etiam Centurias ex vetustis formis in novas fortioresque emendant. Pecunia in Concordiam de Scientia collocata optime in ⍾Scientiam convertitur.
Gold is also very valuable in Diplomacy. You can directly Gift Gold to City-States to gain their favor. Use it to balance a Trade Deal with other Nations. Or demand every last drop after a successful war and your enemy sues for peace. = Solidi in Rebus Externis quoque valde pretiosi sunt. Civitatibus Urbanis eos directe donare potes ut favorem earum obtineas, pactionem Commercii cum aliis Gentibus æquare, aut post bellum prosperum ab hoste pacem petente usque ad ultimum nummum exigere.
Ironically, some may consider Gold to be one of the less important Resources. But it's flexible nature and importance to keep your Nation running makes it a precious thing to pay attention to. After all, everyone loves Gold. = Ironice aliqui Solidos inter minus necessarias Merces habent. Sed usus eorum multiplex et necessitas gentem tuam operantem servandi eos pretiosos attentione dignos faciunt. Denique omnes Solidos amant.
Not to be confused with the Resource of the same name, Gold Ore = Ne confundas cum Merce similis nominis, Aurum
Trade Route = Via commercii
See also: [param] = Et videas: [param]
Research Agreements = Concordiae de Scientia

As cities grow in size and influence, you have to deal with a happiness mechanic that is no longer tied to each individual city.\nInstead, your entire empire shares the same level of satisfaction.\nAs your cities grow in population you’ll find that it is more and more difficult to keep your empire happy. = Crescentibus urbibus magnitudine auctoritateque, rationem felicitatis curare debes quæ singulis urbibus non iam adnectitur.\nTotum potius imperium tuum eundem satisfactionis gradum participat.\nCrescente in urbibus multitudine difficilius invenies imperium felicem servare.
In addition, you can’t even build any city improvements that increase happiness until you’ve done the appropriate research.\nIf your empire’s happiness ever goes below zero the growth rate of your cities will be hurt.\nIf your empire becomes severely unhappy (as indicated by the smiley-face icon at the top of the interface)\n  your armies will have a big penalty slapped on to their overall combat effectiveness. = Præterea emendationes urbium felicitatem augentes construere ne potes quidem antequam necessaria investigaveris.\nSi felicitas imperii infra nihil cadit, incrementum urbium læditur.\nSi imperium graviter infelix fit, ut vultus signum in summa interfacie ostendit,\n  exercitus tui magnam pœnam in universa facultate pugnandi accipient.
This means that it is very difficult to expand quickly in Unciv.\nIt isn’t impossible, but as a new player you probably shouldn't do it.\nSo what should you do? Chill out, scout, and improve the land that you do have by building Workers.\nOnly build new cities once you have found a spot that you believe is appropriate. = Ita in Unciv celeriter crescere difficillimum est.\nNon impossibile est, sed ut novus lusor id fortasse facere non debes.\nQuid igitur facias? Quiesce, explora et terram quam habes Opificibus construendis emenda.\nNovas urbes tantum conde cum locum idoneum invenisti.

 # Requires translation!
Unhappiness = infelicitas
It seems that your citizens are unhappy!\nWhile unhappy, your civilization will suffer many detrimental effects, increasing in severity as unhappiness gets higher. = Cives tui infelices esse videntur!\nDum infelices sunt, civilitas tua multos effectus noxios patietur, eo graviores quo maior infelicitas est.
Unhappiness has two main causes: Population and cities.\n  Each city causes 3 unhappiness, and each population, 1 = Duae præcipuæ causæ Infelicitatis sunt: Multitudo et urbes.\n  Quæque urbs 3 infelicitatis, quisque civis 1 efficit
There are 2 main ways to combat unhappiness:\n  by building happiness buildings for your population\n  or by having improved luxury resources within your borders. = Sunt 2 præcipuæ rationes infelicitatem pugnandi:\n  ædificia felicitatis populo construere\n  aut merces luxuriosas emendatas intra fines habere.

You have entered a Golden Age!\nGolden age points are accumulated each turn by the total happiness \n  of your civilization\nWhen in a golden age, culture and production generation increases +20%,\n  and every tile already providing at least one gold will provide an extra gold. = Sæculum Aureum iniisti!\nPuncta sæculi aurei quoque gressu ex universa felicitate \n  civilitatis tuæ colliguntur.\nSæculo aureo fabricatio culturæ et operum +20% crescit,\n  et quæque area iam saltem unum solidum dans unum additum dabit.

Roads and Railroads = Viae et Viae Ferreae
Roads reduce the Movement Points required to move between two tiles connected by Roads. = Via minuit requirendos calculos movendi ad movendum trans duas tegulas concatenatas per vias.
Railroads improve this reduction even more! = Via ferrea jam majore meliorat hoc minuendum!
This greatly improves the speed you can get Units around the map. = Hoc multo meliorat celeritatem qua centurias circumvehentes tebulam habere possis.
Until you research the technology that removes it, Roads do not cross Rivers = Usque donec invenis technologiam quae emovet id, viae non trans fluvios transeunt.
Connecting your cities to the capital by Roads and/or Railroads will generate Gold via the Trade Route. = Urbes tuas per vias vel vias ferreas cum metropoli concatenare generet solidos per viam commercii.
However, since each Road and Railroad have a Maintenance Cost, it may be more economical to wait until the cities grow and only place where needed. = Autem, singulae viae et viae ferreae habent sumptum tuendi, cur efficientius sit manere donec urbes augentur et modo ibi ponere ubi necessaria sit.

Connecting your cities to the capital by Roads and/or Railroads will generate Gold via the Trade Route. You earn more Gold the more Population the City and your Capital has. = Urbes tuas per vias vel vias ferreas cum metropoli concatenare generet solidos per viam commercii. Plus multitudinis tua urbs et metropolis habent, plures solidos mereas.
Note that each road costs 1 Gold Maintenance per turn, and each Railroad costs 2 Gold, so it may be more economical to wait until the cities grow! = Adnota singulas vias omni gressu sumere 1 solidum, et singulas vias sumere 2 solidos, cur efficientius sit manere donec urbes augentur!
Railroads connecting a city to the Capital also provide a 25% Production Boost to the City, but not the Capital. = Viae ferreae quae concatenant urbem cum metropoli etiam praebent urbi 25% additionem fabricationis, sed non metropoli.
Trade Routes are also connected over Water via certain buildings like the Harbor. As long as there is a chain that can reach the Capital, there's a Trade Route. Look for this symbol in Yellow below the City Name to mean you have an active Trade Route to your Capital. = Viae commercii etiam per aliqua aedificia portibus similia per aquam concatenatur. Via commercii ibi est, ubi catena potest metropolim attingere. Investiges symbolum flavum sub nomine urbis, quod indicat te habere actuosam viam commercii ad metropolim tuam.
Trade Routes can get broken either by Blockades or by Removing/Pillaging the connecting Road/Railroad chain. = Viae commercii possunt abrumpi per obsidionem aut per summotionem aut direptionem catenae viarum aut viarum ferrearum.
City Blockade = Obsidio Urbis

Once you’ve settled 3-4 cities and build universities, you’re probably already 100 to 150 turns into the game.\nNow is a good time to start thinking about how, exactly, you want to win – if you haven’t already. = Cum 3-4 urbes condideris et universitates ædificaveris, fortasse iam 100 ad 150 gressus lusisti.\nNunc tempus est cogitare quomodo exacte vincere velis, nisi iam decrevisti.
There are four ways to win in Unciv. They are:\n - Cultural Victory: Complete 5 Social Policy Trees and build the Utopia Project\n - Domination Victory: Conquer the original capital of all other Major civs\n - Science Victory: Be the first to construct a Spaceship\n - Diplomatic Victory: Build the United Nations and win the vote = Quattuor modis in Unciv vincere potes:\n - Victoria Eruditionis: 5 arbores Dictatorum Socialium perfice et Propositum Utopiæ ædifica\n - Victoria Dominationis: originalia capita omnium aliarum civilitatum Maiorum expugna\n - Victoria Scientifica: primus Navem Astralem construe\n - Victoria Diplomatica: Nationes Unitas ædifica et suffragium vince
So to sum it up, these are the basics of Unciv – Found a prosperous first city, expand slowly to manage happiness, and set yourself up for the victory condition you wish to pursue.\nObviously, there is much more to it than that, but it is important not to jump into the deep end before you know how to swim. = Hæc igitur fundamenta Unciv sunt: primam urbem florentem conde, lente cresce ad felicitatem regendam et ad condicionem victoriæ quam petis te para.\nMulto plura quidem sunt, sed ne in altum salias antequam natare scias.

Enemy City = Urbs Hostilis
Cities can be conquered by reducing their health to 1, and entering the city with a melee unit.\nSince cities heal each turn, it is best to attack with ranged units and use your melee units to defend them until the city has been defeated! = Urbes possunt capi per minuendum salutem earum ad 1 et imperandum centuriam propinquitatis ingredi in urbem.\nQuoniam urbes omni gressu medentur, optime est quod centuriae longinquitatis oppugnent cum centuriae propinquitatis defendant eas donec urbs sit victa!

Luxury Resource = Merx Luxuriosa
Luxury resources within your domain and with their specific improvement are connected to your trade network.\nEach unique Luxury resource you have adds 5 happiness to your civilization, but extra resources of the same type don't add anything, so use them for trading with other civilizations! = Merces luxuriae cum meliorationibus specialibus suis intra fines tuos sunt concatenatae in tuum reticulum commerciale.\nMerx unica tua omnis dat 5 felicitatem civilizationi tuae, sed merces addititiae generis aequi dat nullam, sic eis utaris ad commercium cum aliis civilizationibus!

Strategic Resource = Merx Strategica
Strategic resources within your domain and with their specific improvement are connected to your trade network.\nStrategic resources allow you to train units and construct buildings that require those specific resources, for example the Horseman requires Horses. = Merces strategematicae cum meliorationibus specialibus suis intra fines tuos sunt concatenatae in tuum reticulum commerciale.\nMerces strategematicae habilitant te educare centurias, quae requirant has merces speciales, et aedificare aedificia, quae requirant eas, e. g., caballarius requirat equos.
Unlike Luxury Resources, each Strategic Resource on the map provides more than one of that resource.\nThe top bar keeps count of how many unused strategic resources you own.\nA full drilldown of resources is available in the Resources tab in the Overview screen. = Dissimilis Mercibus Luxuriosis, quæque Merx Strategica in tabula plus quam unum eius mercis dat.\nRegula superior numerum mercium strategicarum nondum adhibitarum tuarum servat.\nPlena enarratio mercium in parte Merces paginæ Summarii invenitur.

The city can no longer put up any resistance!\nHowever, to conquer it, you must enter the city with a melee unit = Urbs nullam iam resistentiam præstare potest!\nUt tamen eam capias, cum centuria comminus pugnante intrare debes

After Conquering = Post Expugnationem
When conquering a city, you can choose to liberate, annex, puppet, or raze the city. = Quando urbem capias, possis eligere sic urbem liberes aut affigas aut exscindas aut municipium facias.
\nLiberating the city will return it to its original owner, giving you a massive diplomatic boost with them!\n\nAnnexing the city will give you full control over it, but also increase the citizens' unhappiness to 2x!\nThis can be mitigated by building a courthouse in the city, returning the citizen's unhappiness to normal.\n\nPuppeting the city will mean that you have no control on the city's production.\nThe city will not increase your tech or policy cost.\nA puppeted city can be annexed at any time, but annexed cities cannot be returned to a puppeted state!\n\nRazing the city will lower its population by 1 each turn until the city is destroyed!\nYou cannot raze a city that is either the starting capital of a civilization or the holy city of a religion. = \nUrbem liberare reddat eam eae possessori, det tibi additionem diplomaticam magnam cum eo!\n\nUrbem affigere det tibi omne imperium eae, sed etiam duplicet iram civium!\nHoc potest mitigari per aedificandum jus in urbe, quo ira civium reficiatur cottidiana.\n\nUrbem municipium facere indicet te sine imperio esse de productio de urbe.\nIsta urbs non augeat sumptum tuum technologiae vel dictati.\nMunicipium potest aliquando affigi, sed urbs affixa non potest refici municipium!\n\nUrbem exscindere omni gressu faciat eae multitudinem uno minorem donec exscissa sit!\nNon potes exscindere urbem quae est metropolis initialis alicujus civilizationis aut urbs sancta alicujus religionis.

You have encountered a barbarian unit!\nBarbarians attack everyone indiscriminately, so don't let your \n  civilian units go near them, and be careful of your scout! = Centuriam barbaram oppetivisti!\nBarbari indiscrete appugnant aliquem omnem,\nsic non permittas centuriis paganis tuis prope eos ire,\net cures exploratores tuos!

You have encountered another civilization!\nOther civilizations start out peaceful, and you can trade with them,\n  but they may choose to declare war on you later on = Civilizationem aliam oppetivisti!\nCivilizationes aliae pacate incipiunt, et potes cum eis mercari,\n sed fortasse posteriore eligant bellum contra te indicere.

Injured Units = Centuriæ Vulneratæ
Injured units deal less damage, but recover after turns that they have been inactive.\nUnits heal 10 health per turn in enemy territory or neutral land,\n  20 inside your territory and 25 in your cities. = Centuriae plagatae dant minus damnum, sed medentur post gressûs quibus non agant.\nCenturiae medentur contra 10 damnum gressu quo cumque sit in terra hostili vel neutrali,\n  20 in terra tua et 25 in urbibus tuis.

Workers = Opifices
Workers are vital to your cities' growth, since only they can construct improvements on tiles.\nImprovements raise the yield of your tiles, allowing your city to produce more and grow faster while working the same amount of tiles! = Opfices sunt graves pro auctu urbis tuae, quia nonnisi ei possunt meliorationem in tegulis construere.\nMeliorationes augent productum de tegulis tuis, habilitant urbem tuam plures producere et celeriter augeri cum operentur tegulas quarum numerus aequus sit!

Embarking = Conscensio Navium
Once a certain tech is researched, your land units can embark, allowing them to traverse water tiles.\nEntering or leaving water takes the entire turn. = Postquam technologia certa sit inventa, centuriae tuae possint conscendere, sic habilitent eas trans tegulas aquae ire.\nAquam ingredi aut aqua egredi sumat gressum omnem.
Units are defenseless while embarked (cannot use modifiers), and have a fixed Defending Strength based on your tech Era, so be careful!\nRanged Units can't attack, Melee Units have a Strength penalty, and all have limited vision. = Centuriae sine defensione sint quom in navibus sint (non possit mutari), et habeant potentiam certam de defensione de aetate tua technologiarum, sic evigiles.\nCenturiae longinquitatis non possint appugnare. Centuriae propinquitatis cum poena de potentia sint. Etiam habeant visionem finitam.

Idle Units = Centuriæ Otiosæ
Clicking 'Next unit' moves to the next idle unit in the queue (as listed in Overview -> Units). After issuing an order to a unit, if 'Auto Unit Cycle' in Options -> Gameplay is enabled, you will automatically select the next idle unit. = Bulla «Centuria proxima» proxima centuria otiosa in agmine eligitur, ut in Summarium -> Centuriæ numeratur. Post mandatum datum, si «Circulus automatus centuriarum» in Optiones -> Ludendi Ratio habilitatus est, proxima centuria otiosa sua sponte eligitur.
If you don't want to move a unit this turn, you can skip it by clicking 'Next unit' again, or command the unit to 'Skip turn'. = Si hac vice centuriam movere non vis, iterum «Centuria proxima» premendo eam omittere potes, aut «Gressum omittere» imperare.
If you want to disable the 'Next unit' feature entirely, you can toggle it in Options -> Gameplay -> Check for idle units. = Si «Centuria proxima» omnino debilitare vis, in Optiones -> Ludendi Ratio -> Centurias otiosas examinare commutare potes.
If you'd rather 'Next unit' cycle the units and not mark them as Done, you can change it in the Options -> Gameplay menu. = Si mavis «Centuria proxima» centurias tantum circumire nec Perfectas notare, hoc in Optiones -> Ludendi Ratio mutare potes.
You can also cycle through the idle units using the left and right triangles on the Unit Table in the lower left of the screen. Or by default using the Cycle button next to the 'Next Unit' button. = Centurias otiosas etiam triangulis sinistro dextroque in Tabula Centuriæ infra sinistra percurrere potes, aut bulla Circuli quæ prædefinite iuxta «Centuria Proxima» est.

 # Requires translation!
Contact Me = Mecum communica
Hi there! If you've played this far, you've probably seen that the game is currently incomplete.\n Unciv will remain open-source forever. = Salve! Ut lusisti ad hoc, probabiliter videris hunc ludum incompletum esse.\n Unciv aperti fontis semper manebit.
 # Requires translation!
What motivates me to keep working on it, \n  besides the fact I think it's amazingly cool that I can,\n  is the support from the players - you guys are the best! = Quod me movet ut huic operi pergam, \n  praeterquam quod mihi mirifice videtur me id facere posse,\n  est auxilium lusorum — vos optimi estis!
 # Requires translation!
If you like Unciv, please rate and review it in the App Store.\n If you find a problem or have a suggestion, open a GitHub issue and help us make the game even better! = Si Unciv tibi placet, quaeso aestima atque recense in App Store.\nSi vitium invenis aut consilium habes, quaestionem in GitHub aperi et nos ad ludum meliorem faciendum adiuva!

Pillaging = Direptio
Military units can pillage improvements, which heals them 25 health and ruins the improvement.\nThe tile can still be worked, but advantages from the improvement - stat bonuses and resources - will be lost.\nWorkers can repair these improvements, which takes less time than building the improvement from scratch.\nPillaging certain improvements will result in your units looting gold from the improvement. = Centuriae militares possunt meliorationes diripere, quo eae medeantur contra 25 damnum, et melioratio ruat.\nTegula etiam possit operari, sed bona de melioratione - statisticae addititiae et merces - amittantur.\nOpfices possunt has meliorationes reparare, quod sumat tempus pauciorius quam meliorationem a nihilo aedificare.\nDiripere aliquas meliorationes faciat quod centuriae tuae a melioratione auferant solidos.

Experience = Experientia
Units that enter combat gain experience, which can then be used on promotions for that unit.\nUnits gain more experience when in Melee combat than Ranged, and more when attacking than when defending. = Centuriae quae ingredintur proelium acquirunt experientiam, quae deinde potest sumi ad promovendam eam centuriam.\nCenturiae acquirunt plus experientiae ob proelium propinquum quam longinquum et plus ob oppugnationem quam defensionem.
Units can only gain up to 30 XP from Barbarian units - meaning up to 2 promotions. After that, Barbarian units will provide no experience. = Centuriae non possunt plus experientiae quam 30 ob barbaros acquirere, id est, non plures quam 2 promotiones. Postea, barbari praebeant nullam experientiam.

Combat = Pugna
Unit and cities are worn down by combat, which is affected by a number of different values.\nEach unit has a certain 'base' combat value, which can be improved by certain conditions, promotions and locations. = Centuriae et urbes interficuntur proelio, quod aliquantis variis aestimationibus afficitur.\nCenturia omnis habet aestimationem 'fundamentalem' certam proelii, quae potest aliqualibus condicionibus, promotionibus et locis meliorari.
Units use the 'Strength' value as the base combat value when melee attacking and when defending.\nWhen using a ranged attack, they will the use the 'Ranged Strength' value instead. = Cum faciunt propinquitatis oppugnationem et defensionem, centuriae utuntur aestimatione 'potentiae,' quae tum fiat aestimatio fundamentalis proelii.\nCum faciunt oppugnationem longinquitatis, utantur 'potentiâ oppugnationis longinquæ.'
Ranged attacks can be done from a distance, dependent on the 'Range' value of the unit.\nWhile melee attacks allow the defender to damage the attacker in retaliation, ranged attacks do not. = Oppugnationes longinquitatis possunt ex longinquo fieri, dependent de aestimatione 'ambitûs.'\nCum oppugnationes propinquitatis permittunt defensori retaliando damnare oppugnatorem, oppugnationes longinquitatis non permittunt.

Embassies = Legationes
Establishing an embassy in other players' Capital city shows the location of their Capital, likewise other players who establish an embassy in your Capital can see location of your Capital. = Legatio in Capite alterius lusoris locum Capitis eius aperit; similiter alii lusores qui legationem in tuo Capite instituunt locum Capitis tui vident.
Embassies thus allow Spies to be placed in another players' Capital City if Espionage is enabled. = Legationes igitur Exploratores Occultos in Capite alterius lusoris collocare permittunt si Exploratio Occulta habilitata est.
Mutual embassies are required to allow trading open borders and to sign Research Agreement and Defensive Pact. = Legationes mutuæ requiruntur ad fines apertos commutandos et Concordiam de Scientia Fœdusque Defensionis sanciendum.
Declaring war on another player or denouncing them will remove embassies from both players' Capitals. You will have to re-establish them to use their effect. = Bellum alteri lusori indicere vel eum criminari legationes e Capitibus utriusque lusoris removet. Eas restituere debes ut effectum earum utaris.
Re-establishing an embassy after denunciation from either side becomes available next turn, while re-establishing them when at war requires a peace treaty. = Legationes post criminationem ab alterutra parte proximo gressu restitui possunt; durante bello fœdus pacis ad restituendum requiritur.
Be cautious when accepting embassy from other players because they can spy on your capital, or worse may start planning to attack you. = Cave legationem ab aliis lusoribus accipiendo, quia caput tuum explorare vel, peius, te oppugnare parare possunt.
Note that before you can offer an embassy, you need the required Technology. = Memento Technologiam necessariam requiri antequam legationem offerre possis.
Embassies are available using the Gods and Kings ruleset. = Legationes cum regulis Dei et Reges parabiles sunt.
Defensive Pacts = Foedera de Defensione

Open Borders from other player and vice versa allow units to freely pass through their territory. = Fines Aperti alterius lusoris et vicissim centurias libere per terras transire permittunt.
They also let Missionaries to enter other players' territory without suffering attrition. = Missionarios quoque sine detrimento terras aliorum lusorum intrare sinunt.
Open Borders expire depending on game speed and are canceled upon Declaration of War, the closure however takes effect only after war ends and need to be traded again. = Fines Aperti secundum celeritatem partis exspirant et Indictione Belli rescinduntur; clausura tamen tantum finito bello valet et iterum commutandi sunt.
You gain diplomatic boost with other AI player if you both have Open Borders to each other = Beneficium in rebus externis cum alio lusore artificiali accipis si ambo Fines Apertos mutuos habetis
Be cautious when giving Open Borders because other player may settle a City near your lands in an area you are planning to use, they may also use your territory to attack your friends or City State allies. = Cave Fines Apertos dando: alius lusor Urbem prope terras tuas in loco quem adhibere paras condere potest, aut terras tuas ad amicos vel Civitates Urbanas socias oppugnandos adhibere.
Note that before you can offer or accept open borders, both Nations need the required Technology. = Memento ambas Gentes necessariam Technologiam requirere antequam fines apertos offeras vel accipias.
When playing with the Gods and Kings ruleset mutual embassies need to be established before Open Borders can be traded. = Cum regulis Dei et Reges luditur, legationes mutuæ instituendæ sunt antequam Fines Aperti commutari possint.

In Research Agreements, you and another civilization decide to jointly research technology.\nAt the end of the agreement, you will both receive a 'lump sum' of ⍾Science, which will go towards one of your unresearched technologies. = In Concordiis de Scientia tu aliaque civilitas technologiam una investigare decernitis.\nFinita concordia ambo summam ⍾Scientiæ accipietis quæ ad unam technologiarum nondum investigatarum conferetur.
The amount of ⍾Science you receive at the end is dependent on the ⍾Science generated by your cities and the other civilization's cities during the agreement - the more, the better! = Quantitas ⍾Scientiæ in fine accepta ex ⍾Scientia urbium tuarum et alterius civilitatis per tempus concordiæ producta pendet: quo plus, eo melius!
Note that before you can invest in a research agreement, you must have a Declaraction of Friendship, both Nations need the required Technology, and both Nations need enough Gold on hand for the agreement. = Memento ante collocationem in concordia de scientia Declarationem Amicitiæ necessariam esse, ambas Gentes necessariam Technologiam et satis Solidorum ad concordiam in promptu habere debere.
When playing with the Gods and Kings ruleset mutual embassies need to be established before a Research Agreement can be signed. = Cum regulis Dei et Reges luditur, legationes mutuæ instituendæ sunt antequam Concordia de Scientia sanciri possit.

Defensive pacts allow you and another civ to protect one another from aggressors.\nOnce the defensive pact is signed, you will be drawn into their future defensive wars, just as they will be drawn into your future defensive wars. Declaring war on any Civ will remove all of your defensive pacts. You will have to re-sign them to use their effect. = Fœdera defensionis te aliamque civilitatem ab aggressoribus invicem protegere permittunt.\nFœdere sancito, futuris eorum bellis defensivis adiungeris sicut illi tuis. Bellum cuiquam Civilitati indicere omnia fœdera defensionis tua removet. Ea iterum sancire debes ut eorum effectum utaris.
Be cautious when signing defensive pacts because they can bring you into wars that you might not want to be in. = Cave fœdera defensionis sanciendo, quia in bella quæ gerere non vis te trahere possunt.
The AI is very careful and will not accept defensive pacts with less than 80 influence. = Intelligentia artificialis cautissima est et fœdera defensionis cum auctoritate infra 80 non accipiet.
Note that before you can sign a defensive pact, you must have a Declaraction of Friendship, and both Nations need the required Technology. = Memento ante fœdus defensionis sanciendum Declarationem Amicitiæ necessariam esse et ambas Gentes necessariam Technologiam requirere.
When playing with the Gods and Kings ruleset mutual embassies need to be established before a Defensive Pact can be signed. = Cum regulis Dei et Reges luditur, legationes mutuæ instituendæ sunt antequam Fœdus Defensionis sanciri possit.

Not all nations are contending with you for victory.\nCity-States are nations that can't win, can't be traded with, and instead confer certain bonuses to friendly civilizations. = Ne omnes populi cum te pro victoria contendunt.\nCivitates urbium sunt populi qui non possunt ferre victoriam nec possunt commercari sed magis donant amicis praemia aliqualia.
Instead, diplomatic relations with City-States are determined by Influence - a meter of 'how much the City-State likes you'.\nInfluence can be increased by attacking their enemies, liberating their city, and giving them sums of gold. = Propinquitates diplomaticae cum civitatibus urbium magis cernuntur per influentiam - metrum de quantitate qua civitates urbium amant te.\nInfluentia potest adici per oppugnandum hostes eorum, liberandum urbis eorum, et dandum eis aliquantum solidorum.
Certain bonuses are given when you are at above 30 influence.\nWhen you have above 60 Influence, and you have the highest influence with them of all civilizations, you are considered their 'Ally', and gain further bonuses and access to the Luxury and Strategic resources in their lands. = Aliqualia praemia dentur quom sis super 30 influentiam.\nQuom habeas influentiam super 60 atque maximam cum eis, in civilizationibus omnibus, videaris socius eorum, et mereas ampliora praemia et accessionem mercium luxuriarum, et mercium strategematicae, in terris eorum.

While working the land is good, eventually your Citizens will want to Specialize. = Cum operari agrum est bonum, cives tui tandem volent fieri specialistae.
Certain Buildings will also provide Specialist Slots. These slots will show up in the Citizen Management within the City Screen under Specialists. Each slot can be filled with a Citizen which will then become a Specialist. = Aliquanta aedificia etiam praebent spatia specialistarum. Haec spatia appeant sub "specialistis" in  "administratione civium" in "ostentu urbis." Spatium omne potest impleri cive, qui tum fiat specialista.
Each Specialist will generate a certain amount of yield as indicated to the right of the available slots. = Specialista omnis generet tantum producti, quantum indicatur in loco dextro spatiorum parabilium.
While these are a great way to specialize the yield production of a City outside of the surrounding Tile Yields, Specialists have an additional value. Each one also generates Great Person Points each turn. With enough of them, a new Great Person will join your Nation. = Cum haec sunt modus bonus quo productum urbis fiat speciale extra producta tegularum circumcurrentium, specialistae habent aestimationem addititiam. Omnis etiam omni gressu generat calculos personarum magnarum. Satis cum eis, nova persona magna cum populo tuo coeat.
Great People = Personæ Magnæ

Certain buildings, and specialists in cities, generate Great Person points per turn.\nThere are several types of Great People, and their points accumulate separately.\nThe number of points per turn and accumulated points can be viewed in the Overview screen. = Aliquanta aedificia, et specialistae in urbibus, omni gressu generant calculos personarum magnarum.\nAliquanta sunt genera personarum magnarum, et calculi earum seorsum accumulantur.\nNumerus calculorum omnis gressûs et calculi accumulati possunt in ostentu breviarii videri.
Alternatively, the Great Person points breakdown per city can be viewed in each City Screen (see UI Tips article). = Aliter enarratio punctorum Magnarum Personarum per urbem in quaque Pagina Urbis videri potest (vide articulum Consilia Interfaciei).
Once enough points have been accumulated, a Great Person of that type will be created!\nEach Great Person can construct a certain Great Improvement which gives large yields over time, or immediately consumed to provide a certain bonus now. = Quando satis calculi sint accumulati, persona magna ejus generis creetur!\nPersona magna omnis potest construere aliqualem meliorationem magnam, quae paulatim det productum magnum, aut nunc confestim sumi ad praebendum praemium aliquale.
Great Improvements also provide any strategic resources that are under them, so you don't need to worry if resources are revealed underneath your improvements! = Meliorationes magnae etiam praebent mercem strategematicam quae cumque subest eis, sic tibi necesse non est sollicitari, num merces sub meliorationibus tuis patefaciantur!

Removing Terrain Features = Summovere Adjuncta Humorum
Certain tiles have terrain features - like Flood plains or Forests -  on top of them. Some of these layers, like Jungle, Marsh and Forest, can be removed by workers.\nRemoving the terrain feature does not remove any resources in the tile, and is usually required in order to add improvements exploiting those resources. = Aliquantae tegulae habent adjuncta humorum - similia sunt campis alluvialibus vel silvis - super se. Aliquantum horum coriorum, e.g. silva tropica, palus et silva, possunt ab opificibus summovere.\nSummovere adjunctum humi non summoveat mercem quae cumque in ea tegula est, et vulgo requiritur ad addendum meliorationes quo hae merces usurpentur.

Natural Wonders, such as the Mt. Fuji, the Rock of Gibraltar and the Great Barrier Reef, are unique, impassable terrain features, masterpieces of mother Nature, which possess exceptional qualities that make them very different from the average terrain.\nThey benefit by giving you large sums of Culture, ⍾Science, Gold or Production if worked by your Cities, which is why you might need to bring them under your empire as soon as possible. = Miracula Naturæ, ut Mons Fuji, Rupes Gibraltar et Magnum Claustrum Corallinum, sunt proprietates soli unicæ, intransitabiles, præclara opera Naturæ matris, qualitatibus singularibus multum a solo ordinario differentes.\nMagnas quantitates Culturæ, ⍾Scientiæ, Solidorum vel Fabricationis præbent si ab Urbibus tuis coluntur; ideo ea quam primum imperio adiungere cupere possis.

Keyboard = Plectrologium
If you have a keyboard, some shortcut keys become available. Unit command or improvement picker keys, for example, are shown directly in their corresponding buttons. = Si clavile habes, aliquot claves compendiariæ parabiles fiunt. Exempli gratia claves mandatorum centuriæ vel emendationum eligendarum in bullis suis directe ostenduntur.
On the world screen the hotkeys are as follows: = In pagina mundi claves compendiariæ sunt:
Space or 'N' - Next unit or turn\n'E' - Empire overview (last viewed page)\n'+', '-' - Zoom in / out\nHome - center on capital or open its City Screen if already centered = Spatium vel «N» — Centuria vel gressus proximus\n«E» — Summarium imperii (pagina ultima visa)\n«+», «-» — Ampliare / minuere\nHome — in capite centra vel Paginam Urbis eius aperi si iam centratum est
F1 - Open Civilopedia\nF2 - Empire overview Trades\nF3 - Empire overview Units\nF4 - Empire overview Diplomacy\nF5 - Social policies\nF6 - Technologies\nF7 - Empire overview Cities\nF8 - Victory Progress\nF9 - Empire overview Stats\nF10 - Empire overview Resources\nF11 - Quicksave\nF12 - Quickload = F1 — Civilopediam aperire\nF2 — Summarium imperii: Commercia\nF3 — Summarium imperii: Centuriæ\nF4 — Summarium imperii: Res Externæ\nF5 — Dictata Socialia\nF6 — Technologiæ\nF7 — Summarium imperii: Urbes\nF8 — Progressus Victoriæ\nF9 — Summarium imperii: Statisticæ\nF10 — Summarium imperii: Merces\nF11 — Cito servare\nF12 — Cito onerare
Ctrl-R - Toggle tile resource display\nCtrl-Y - Toggle tile yield display\nCtrl-O - Game options\nCtrl-S - Save game\nCtrl-L - Load game\nCtrl-U - Toggle UI (World Screen only) = Ctrl-R — Ostensionem mercium arearum commutare\nCtrl-Y — Ostensionem proventuum arearum commutare\nCtrl-O — Optiones partis\nCtrl-S — Partem servare\nCtrl-L — Partem onerare\nCtrl-U — Interfaciem commutare (sola Pagina Mundi)
All of these can be reassigned. = Omnia de his possunt denuo assignari.

This is where you spend most of your time playing Unciv. See the world, control your units, access other screens from here. = Hic maximam partem temporis in Unciv ages. Hinc mundum vide, centurias rege et alias paginas adi.
①: The menu button - civilopedia, save, load, options... = ①: Bulla indicis — Civilopedia, servare, onerare, optiones…
②: The player/nation whose turn it is - click for diplomacy overview. = ②: Lusor/gens cuius gressus est — preme ad summarium rerum externarum.
③: The Technology Button - shows the tech tree which allows viewing or researching technologies. = ③: Bulla Technologiæ — arborem technologiarum ostendit ad eas videndas vel investigandas.
④: The Social Policies Button - shows enacted and selectable policies, and with enough culture points you can enact new ones. = ④: Bulla Dictatorum Socialium — dictata adoptata et eligenda ostendit; satis culturæ punctis habitis nova adoptare potes.
⑤: The Diplomacy Button - shows the diplomacy manager where you can talk to other civilizations. = ⑤: Bulla Rerum Externarum — administratorem rerum externarum ostendit ubi cum aliis civilitatibus colloqui potes.
⑥: Unit Action Buttons - while a unit is selected its possible actions appear here. = ⑥: Bullæ Actionum Centuriæ — dum centuria eligitur actiones eius possibiles hic apparent.
⑦: The unit/city info pane - shows information about a selected unit or city. = ⑦: Tabula informationis centuriæ/urbis — notitias centuriæ vel urbis electæ ostendit.
⑧: The name (and unit icon) of the selected unit or city, with current health if wounded. Clicking a unit name or icon will open its civilopedia entry. = ⑧: Nomen (et signum centuriæ) centuriæ vel urbis electæ, cum præsenti valetudine si vulnerata est. Nomen vel signum centuriæ preme ad eius articulum Civilopediæ aperiendum.
⑨: The arrow buttons allow jumping to the next/previous idle unit. = ⑨: Bullæ sagittarum ad proximam/priorem centuriam otiosam salire permittunt.
⑩: For a selected unit, its promotions appear here, and clicking leads to the promotions screen for that unit. = ⑩: Promotiones centuriæ electæ hic apparent; preme ad paginam promotionum eius.
⑪: Remaining/per turn movement points, strength and experience / XP needed for promotion. For cities, you get its combat strength. = ⑪: Puncta motus restantia/per gressum, robur et experientia / experientia ad promotionem necessaria. Urbibus robur pugnæ ostenditur.
⑫: This button closes the selected unit/city info pane. = ⑫: Hæc bulla tabulam informationis centuriæ/urbis electæ claudit.
⑬: This pane appears when you order a unit to attack an enemy. On top are attacker and defender with their respective base strengths. = ⑬: Hæc tabula apparet cum centuriæ hostem oppugnare imperas. Supra sunt aggressor et defensor cum suis roboribus fundamentalibus.
⑭: Below that are strength bonuses or penalties and health bars projecting before / after the attack. = ⑭: Infra sunt beneficia pœnæve roboris et regulæ valetudinis statum ante / post impetum prædicentes.
⑮: The Attack Button - let blood flow! = ⑮: Bulla Impetus — sanguis fluat!
⑯: The minimap shows an overview over the world, with known cities, terrain and fog of war. Clicking will position the main map. = ⑯: Tabula parva summarium mundi cum urbibus notis, solo et nebula belli ostendit. Preme ad tabulam principalem collocandam.
⑰: To the side of the minimap are display feature toggling buttons - tile yield, worked indicator, show/hide resources. These mirror setting on the options screen and are hidden if you deactivate the minimap. = ⑰: Iuxta tabulam parvam sunt bullæ ostensionis: proventus areæ, index culturæ, merces ostendere/abscondere. Optiones paginæ optionum imitantur et absconduntur si tabulam parvam debilitas.
⑱: Tile information for the selected hex - current or potential yield, terrain, effects, present units, city located there and such. Where appropriate, clicking a line opens the corresponding civilopedia entry. = ⑱: Notitiæ areæ hexagonæ electæ: proventus præsens vel possibilis, solum, effectus, centuriæ præsentes, urbs ibi sita et similia. Ubi convenit, linea pressa articulum Civilopediæ respondentem aperit.
⑲: Notifications - what happened during the last 'next turn' phase. Some are clickable to show a relevant place on the map, some even show several when you click repeatedly. = ⑲: Nuntii — quæ in ultima fase «Gressus proximus» evenerunt. Quidam premi possunt ad locum pertinentem in tabula ostendendum; alii etiam plures locos repetitis pressionibus ostendunt.
⑳: The Next Turn Button - unless there are things to do, in which case the label changes to 'next unit', 'pick policy' and so on. = ⑳: Bulla Gressus Proximi — nisi aliqua facienda sunt; tum inscriptio in «Centuria proxima», «Dictatum eligere» et similia mutatur.
㉑: The Multiplayer Button - Here you can easily check your active multiplayer games. = ㉑: Bulla Plurium Lusorum — hic partes tuas plurium lusorum activas facile examinare potes.
ⓐ: The overview button leads to the empire overview screen with various tabs (the last one viewed is remembered) holding vital information about the state of your civilization in the world. = ⓐ: Bulla summarii ad paginam summarii imperii ducit cum variis partibus (ultima visa memoria tenetur) notitias necessarias de statu civilitatis tuæ in mundo continentibus.
ⓑ: The ♪Culture icon shows accumulated ♪Culture and ♪Culture needed for the next policy - in this case, the exclamation mark tells us a next policy can be enacted. Clicking is another way to the policies manager. = ⓑ: Signum ♪Culturæ culturam collectam et ad proximum dictatum necessariam ostendit; hic nota exclamationis novum dictatum adoptari posse indicat. Pressio alia via ad administratorem dictatorum est.
ⓒ: Your known strategic resources are displayed here with the available (usage already deducted) number - click to go to the resources overview screen. = ⓒ: Merces strategicæ tuæ notæ hic cum numero parabili, usu iam detracto, ostenduntur; preme ad summarium mercium.
ⓓ: Happiness/unhappiness balance and either golden age with turns left or accumulated happiness with amount needed for a golden age is shown next to the smiley. Clicking also leads to the resources overview screen as luxury resources are a way to improve happiness. = ⓓ: Iuxta vultum ostenditur ratio felicitatis/infelicitatis et aut ætas aurea cum gressibus restantibus aut felicitas collecta cum quantitate ad sæculum aureum necessaria. Pressio etiam ad summarium mercium ducit, quia merces luxuriosæ felicitatem augent.
ⓔ: The ⍾Science icon shows the number of ⍾Science points produced per turn. Clicking leads to the technology tree. = ⓔ: Signum ⍾Scientiæ numerum punctorum ⍾Scientiæ per gressum productorum ostendit. Pressio ad arborem technologiarum ducit.
ⓕ: Number of turns played with translation into calendar years. Click to see the victory overview. = ⓕ: Numerus gressuum lusorum cum conversione in annos calendarii. Preme ad summarium victoriæ.
ⓖ: The number of gold coins in your treasury and income. Clicks lead to the Stats overview screen. = ⓖ: Numerus nummorum aureorum in ærario et reditus. Pressio ad summarium Statisticarum ducit.
ⓗ: The quantity of ☮Faith your citizens have generated, or 'off' if religion is disabled. Clicking it makes you go to the religion overview screen. = ⓗ: Quantitas ☮Fidei a civibus producta, aut «debilitata» si religio debilitata est. Pressio ad summarium religionis ducit.
ⓧ: In the center of all this - the world map! Here, the "X" marks a spot outside the map. Yes, unless the wrap option was used, Unciv worlds are flat. Don't worry, your ships won't fall off the edge. = ⓧ: In medio omnium: tabula mundi! Hic «X» locum extra tabulam notat. Ita, nisi circumvolutio adhibita est, mundi Unciv plani sunt. Noli timere: naves tuæ de margine non cadent.
ⓨ: By the way, here's how an empire border looks like - it's in the national colours of the nation owning the territory. = ⓨ: Ceterum sic limes imperii apparet: coloribus gentis terram possidentis.
ⓩ: And this is the red targeting circle that led to the attack pane back under ⑬. = ⓩ: Hic autem est ruber circulus destinandi qui ad tabulam impetus sub ⑬ duxit.
What you don't see: The phone/tablet's back button will pop the question whether you wish to leave Unciv and go back to Real Life. On desktop versions, you can use the ESC key. = Quod non vides: bulla retro telephoni/tabellæ rogabit num Unciv relinquere et ad Vitam Veram redire velis. In computatris clave ESC uti potes.

When at later stages of the game, you might have a lot of units but only a little to do. To help you we have implemented an AutoPlay feature that lets you use the AI to play part or all of your turn. = In posterioribus partis temporibus multas centurias sed pauca facienda habere potes. Ut te adiuvemus, Ludus Automatus intelligentiam artificialem partem vel totum gressum tuum agere permittit.
To enable AutoPlay, go to options and open the AutoPlay tab and press "Show AutoPlay button". = Ad Ludum Automatum habilitandum optiones adi, partem Ludi Automati aperi et «Bullam Ludi Automati ostendere» preme.
Clicking on the AutoPlay button opens a popup menue for choosing to AutoPlay parts or all of your turn. = Bulla Ludi Automati pressa indicem emergentem aperit ad partes vel totum gressum tuum automatice agendum eligendum.
Clicking Start AutoPlay in the pop-up menue or long pressing the AutoPlay button begins the multi-turn AutoPlay. This will play your next turns as if you were an AI. = «Ludum Automatum incipere» in indice emergente premendo aut bullam Ludi Automati diu tenendo Ludum Automatum plurium gressuum incipis. Proximi gressus tui ut a lusore artificiali agentur.
To cancel multi-turn AutoPlay you can press the AutoPlay button, next turn button or open the options menue. = Ad Ludum Automatum plurium gressuum rescindendum bullam Ludi Automati vel gressus proximi premere aut indicem optionum aperire potes.
Multi-turn AutoPlay is not advised on harder difficulty levels as your AI will not play better against an AI with modifiers. = Ludus Automatus plurium gressuum in difficultatibus maioribus non commendatur, quia intelligentia tua artificialis contra intelligentiam cum modificatoribus non melius ludet.
Multi-turn AutoPlay for multiplayer is not yet supported. = Ludus Automatus plurium gressuum in partibus plurium lusorum nondum sustentatur.

After building a shrine, your civilization will start generating ☮Faith. = Postquam aedem aedificas, civilizatio tua incipiet generare ☮fidem.
When enough ☮Faith has been generated, you will be able to found a pantheon. = Quando ☮fides satis generata sit, possis Pantheum fundare.
A pantheon will provide a small bonus for your civilization that will apply to all cities that have it as a majority religion. = Pantheum praebeat civilizationi tuae praemium parvum, quod applicetur omnibus urbibus quibus illud est religio majoritatis.
Each civilization can only choose a single pantheon belief, and each pantheon can only be chosen once. = Nec ulla civilizatio potest opiniones Panthei plures quam unam eligere, nec ulla opinio Panthei potest aliquotiens pluribus quam semel eligi.
Generating more ☮Faith will allow you to found a religion. = Generare ☮fidem majorem habilitet te fundare religionem.

Keep generating ☮Faith, and eventually a great prophet will be born in one of your cities. = Adsidue generes ☮fidem, ut tandem propheta magnus in una de urbibus tuis oriatur.
This great prophet can be used for multiple things: Constructing a holy site, founding a religion and spreading your religion. = Hæc propheta magnus possit ad nonnullas adhiberi: ad constructionem sitûs sancti, ad fundationem religionis et ad stratum religionis tuae.
When founding your religion, you may choose another two beliefs. The founder belief will only apply to you, while the follower belief will apply to all cities following your religion. = Quando fundas religionem, potes duas opiniones alias eligere. Opinio institutoris modo applicetur vobis, autem opinio assectatorum applicetur omnibus urbibus quae sequuntur religionem tuam.
Additionally, the city where you used your great prophet will become the holy city of that religion. = Et urbs, qua (con-)sumas prophetam magnum tuam, fiat urbs sancta illius religionis.
Once you have founded a religion, great prophets will keep being born every so often, though the amount of Faith☮ you have to save up will be higher. = Postquam fundas religionem, prophetae magni nonnumquam oriantur, sed fides☮, quantam necesse est tibi retinere, sit major.
One of these great prophets can then be used to enhance your religion. = Unus de his prophetis magnis tum possit religionem tuam amplificare.
This will allow you to choose another follower belief, as well as an enhancer belief, that only applies to you. = Hoc permittat tibi eligere aliam opinionem assectatorum, et opinionem amplificatoris, quae modo applicetur tibi.
Do take care founding a religion soon, only about half the players in the game are able to found a religion! = Cures ut celeriter fundes religionem. Tantum ferme dimidii lusores in ludo possint religionem fundare!

Religion inside cities = Religio intra urbes
When founding a city, it won't follow a religion immediately. = Cum urbs conditur, ea non statim sequetur unam religionem.
The religion a city follows depends on the total pressure each religion has within the city. = Religio quam urbs sequitur dependet de toto impulsu quem omnis religio in urbe habet.
Followers are allocated in the same proportions as these pressures, and these followers can be viewed in the City Screen. = Assectatores disponuntur in proportionibus aequis cum his impulsibus, et hi assectatores possunt in ostentu urbis videri.
You are allowed to check religious followers and pressures in cities you do not own by selecting them. = Tibi licet per eligedum urbes quas non possides cernere assectatores et impulsûs religiosos in eis.
In both places, a tap/click on the icon of a religion will show detailed information with its effects. = In ambobus locis, attingere symbolum religionis ostendat indicia concisa de effectibus ejus.
Based on this, you can get a feel for which religions have a lot of pressure built up in the city, and which have almost none. = Per hoc fundamentum, possis sentire eas quae religiones in urbe habent impulsum magnum aedificatum, et eas quae fere habent nullum.
The city follows a religion if a majority of its population follows that religion, and will only then receive the effects of Follower and Pantheon beliefs of that religion. = Urbs sequitur unam religionem si majoritas multitudinis sequitur eam, et solummodo tum accipiet effectûs opinionum assectatorum et Panthei illius religionis.

Spreading Religion = Religionem Sternere
Spreading religion happens naturally, but can be sped up using missionaries or great prophets. = Religionem sternere naturaliter evenit, sed potest properari per usum missionarii vel prophetae magni.
Missionaries can be bought in cities following a major religion, and will take the religion of that city. = Missionarii possunt emi in urbe quae sequitur religionem pleram, et asciscet religionem illius urbis.
So do take care where you are buying them! If another civilization has converted one of your cities to their religion, missionaries bought there will follow their religion. = Sic cures locum ubi emis eos! Si qua alia civilizatio convertit unam de urbibus tuis ad religionem eorum, missionarius ibi emptus sequitur religionem eorum.
Great prophets always have your religion when they appear, even if they are bought in cities following other religions, but captured great prophets do retain their original religion. = Propheta magnus semper habet religionem tuam quom is apparet, etsi emitur in urbibus quae sequuntur religiones alias, sed prophetae magni capti vero retinent suam religionem originalem.
Both great prophets and missionaries are able to spread religion to cities when they are inside its borders, even cities of other civilizations. = Utrique prophetarum magnorum et missionariorum possunt sternere religionem ad urbes quom sunt intra fines earum etsi urbium civilizationum aliarum.
These two units can even enter tiles of civilizations with whom you don't have an open borders agreement! = Hae duae centuriae etiam possunt ingredi tegulas civilizationum, cum quibus non habes concordiam de apertione finium!
But do take care, missionaries will lose 250 religious strength each turn they end while in foreign lands. = Sed cures, missionarii amittant 250 potentiam religiosam gressu quo cumque in terris alienis sunt quom gressus perficitur.
This diminishes their effectiveness when spreading religion, and if their religious strength ever reaches 0, they have lost their faith and disappear. = Hoc minuat efficaciam eorum quom sternunt religionem. Si potentia religiosa eorum quando attingit 0, amiserint fidem suam et disparebunt.
When you do spread your religion, the religious strength of the unit is added as pressure for that religion. = Quando sternis religionem tuam, potentia religiosa centuriae addatur ut fiat impulsus pro ista religione.
Cities also passively add pressure of their majority religion to nearby cities. = Urbes quoque passive addunt urbibus propinquis impulsum suae religionis majoritatis.
Each city provides +6 pressure per turn to all cities within 10 tiles, though the exact amount of pressure depends on the game speed. = Omnis urbs omni gressu praebet +6 impulsum omnibus urbibus quae non pluribus quam 10 tegulis absunt, sed exacta quantitas impulsûs dependet de celeritate ludi.
This pressure can also be seen in the City Screen, and gives you an idea of how religions in your cities will evolve if you don't do anything. = Hic impulsus quoque potest in ostentu urbis videri, et det tibi imaginem de religionibus, quantae in tua urbe volvent si non agis quid.
Holy cities also provide +30 pressure of the religion founded there to themselves, making it very difficult to effectively convert a holy city. = Urbes sanctae etiam praebent sibi +30 impulsum de religione ibi fundatâ, faciunt admodum difficile conversu urbis sanctae.
Lastly, before founding a religion, new cities you settle will start with 200 pressure for your pantheon. = Postremo, antequam fundas religionem, urbes a te conditae cum 200 impulsu pro Pantheo tuo incipient.
This way, all your cities will starting following your pantheon as long as you haven't founded a religion yet. = Sic, omnes urbes tuae incipient sequi Pantheum tuum quamdiu non fundavisti religionem.

Inquisitors = Inquisitores
Inquisitors are the last religious unit, and their strength is removing other religions. = Inquisitores sunt centuriae religiosae postremae, et sua potentia est alias religiones emovere.
They can remove all other religions from one of your own cities, removing any pressures built up. = Ei possunt emovere alias religiones omnes ex una de urbibus tuis, emoveant impulsum qui cumque aedificatus est.
Great prophets also have this ability, and remove all other religions in the city when spreading their religion. = Prophetae magni quoque habent hanc facultatem, et emovent alias religiones omnes ex urbe cum sternunt suam religionem.
Often this results in the city immediately converting to their religion = Hoc frequenter facit urbem statim conversam ad religionem eorum.
Additionally, when an inquisitor is stationed in or directly next to a city center, units of other religions cannot spread their faith there, though natural spread is unaffected. = Praeterea, quom inquisitor positus in sive immediato ad urbem est, centuriae religionum aliarum non possunt ibi sternere fidem suam, quamquam sternere naturale non est affectum.

The Mayan unique ability, 'The Long Count', comes with a side effect: = Facultas unica Mayensis, 'Numeratio Longinqua', est cum effectu secundo:
Once active, the game's year display will use mayan notation. = Quando vegeta sit, ostentus anni ludi utatur notis Mayensibus.
The Maya measured time in days from what we would call 11th of August, 3114 BCE. A day is called K'in, 20 days are a Winal, 18 Winals are a Tun, 20 Tuns are a K'atun, 20 K'atuns are a B'ak'tun, 20 B'ak'tuns a Piktun, and so on. = Mayenses metiebantur tempus in diebus ab eo quem vocemus undecimum Augusti, 3114 a.C.n. Dies vocatur K'in; 20 dies sunt 1 Winal; 18 Winal sunt 1 Tun; 20 Tun sunt 1 B'ak'tun; 20 B'ak'tun sunt 1 Piktun, et cetera.
Unciv only displays ය B'ak'tuns, ඹ K'atuns and ම Tuns (from left to right) since that is enough to approximate gregorian calendar years. The Maya numerals are pretty obvious to understand. Have fun deciphering them! = Unciv modo ostendit ය B'ak'tun, ඹ K'atun et ම Tun (a laeva ad dextram), quia satis sunt ad approximandum annos Calendarii Gregoriani. Notae numerorum Mayenses sunt bene manifestae ad intellegendum. Beeris cum interpreteris eas!

Your cities will periodically demand different luxury goods to satisfy their desire for new things in life. = Urbes tuae periodo poscent merces luxurias varias ut satisfaciant suum desiderium rerum novarum.
If you manage to acquire the demanded luxury by trade, expansion, or conquest, the city will celebrate We Love The King Day for 20 turns. = Si tibi mercando, expandendo aut vincendo succedit luxuriam quæsitam acquirere, urbs celebrabit Festum de Amore Regis Nostri in 20 gressibus sequentibus.
During the We Love The King Day, the city will grow 25% faster. = In Festo de Amore Regis Nostri, urbs 25% addititiâ celeritate augeatur.
This means exploration and trade is important to grow your cities! = Hoc indicat explorationem et mercatum esse graves ad auctum tuarum urbium!

Air Combat and Interception = Proelium Aerium et Interceptio Aeria
Air Combat is very similar to normal Combat, with a few wrinkles. Damage is still dealt using the same equations based on the relative Strength of the Attacking and Defending Unit. = Proelium aërium est maxime simile proelio cotidiano cum nonnullis differentiis. Damnum etiam detur per aequationem aequam cujus fundamentum sit potentia comparativa centuriae appugnantis et defendentis.
However, before the Attacker and Defender fight, there is an added combat phase called Interception. If there is any unit with Interception Range that covers the target attacked tile, then it will attempt to Intercept the Attacking Air Unit. If multiple units can Intercept, the one with higher Intercept chance does it. = Autem, antequam oppugnator et defensor pugnent, spatium, dicitur interceptio, intra proelium addatur. Si qua centuria est cum ambitu interceptionis, intra quem est tegula intenta appugnanda, ea tentet intercipere centuriam aëriam appugnantem. Si centuriae plurales possunt intercipere, ibi quae cum probabilitate majore faciat, faciet.
Generally Land/Naval Units have an Intercept Range of 2 Tiles, and Air Units have an Intercept Range of their Attack Range. = Centuriae marinae/terrae generaliter habent ambitum interceptionis qui est 2 tegulae, et aëriae habent ambitûs interceptionis aequos ambituum oppugnationis suorum.
Ground and Naval Units don't require movement points to Intercept, just Attacks. Air Units cannot have moved nor attacked in the preceding turn. = Centuriae marinae et terrae non requirant calculos movendi ad intercipiendum, sed ad oppugnationem. Centuriae aëriae nec appugnare nec moveri potuerint in gressu priore.
The Intercepting Unit rolls to see if it hits. Whether it hits or not costs an Attack, and most units (without Promotions) can only Attack Once per Nation's Turn. It does NOT cost Movement Points, but Air Units that have used their Movement cannot Intercept between turns. = Centuria intercipiens volvat, ut contactusne cernatur. Sive contingat sive non contingat, una oppugnatio consumatur, et plurimae centuriae (sine promotione) modo possunt in omni gressu omnis populi semel appugnare. Ea NON sumat calculos movendi, sed centuriae aëriae, quarum momentum sit in gressu priore sumptum, non possint inter gressûs intercipere.
If the Intercepting Unit Hits, it deals damage according to the Combat Strength calculation to the Attacking Air Unit, potentially with any Strength Bonuses that apply to Interception. It does not receive damage from the Attacking Air Unit. = Si centuria intercipiens contingit, dat centuriae aëriae appugnanti damnum ob calculum potentiae de proelio cum praemio potentiae quod cumque applicetur interceptioni. Ea non accipiet damnum de centuria aëria appugnante.
After Interception resolves, the Attacking Air Unit and the Defending Unit in the targeted tile do Combat as normal, with damage dealt to both sides. = Postquam interceptio sit certa, centuria aëria appugnans et centuria defendens in tegula intenta faciant proelium acsi cotidianum sit, ut damnum duabus detur.
To help deal with Interceptions, see Air Sweeps. = Ut adjuveris contra interceptiones, Aëra Verrere videas.

Air Sweeps = Aëra Verrere
Fighter units are able to perform Air Sweeps over a tile helping clear out potential enemy Air, Sea, or Land Interceptions that can reach that tile. = Centuriae quae sunt aëroplana pugnantia possunt aëra super tegulam verrere, adjuvent emovere interceptiones quae fortasse possint illam tegulam contingere sive a terra aut aqua, sive de aëre.
While this Action will take an Attack, the benefit is drawing out Interceptions to help protect your other Air Units. Especially your Bombers. = Cum haec actio sumat unam oppugnationem, emolumentum sit quod exceptio interceptionis adjuvet defendere tuas alias centurias, in primis, bomboplana.
Your unit will always draw an Interception, if one can reach the target tile, even if the Intercepting unit has a chance to miss. = Centuria tua semper adducat unam interceptionem si qua potest tegulam intentam contingere, etsi centuria intercipiens cum probabilitate ad defectum sit.
If the Interceptor is not an Air Unit (eg Land or Sea), the Air Sweeping unit and Interceptor take no damage! = Si Interceptor non est centuria aëria (e.g. sive marina sive terrae), Interceptor et centuria, quae verrit aëra, accipiunt nullum damnum!
If the Interceptor is an Air Unit, the two units will damage each other in a straight fight with no Interception bonuses. And only the Attacking Air Sweep Unit gets any Air Sweep strength bonuses. = Si Interceptor est centuria aëria, duae centuriae sine praemio interceptionis dabunt damnum utri in pugna directa. Et nonnisi centuria, quae verrit aëra, accipiat ullum praemium potentiae de verrendo aëra.

Fortify, Guard, Withdraw = Fortificare, Custodire et Abscedere
Most Land units have the ability to Fortify. As they spend time without moving, they will slowly gain a Fortification Bonus to their Combat Strength representing digging in and preparing in case of an attack. = Centuriae plurimae terrae habent facultatem ad fortificandum. Quando sumunt tempus ne moveant, lente mereant praemium fortificationis suae potentiae proelii, quod repraesentat defodiendum et parandum contra oppugnationem.
Some units have the ability to Withdraw before a melee attack is struck. However, perhaps you wish for them to stand their ground to protect a particular tile. If you do, then give them the Guard command and they will stay fixed until they die or you give them fresh orders. = Aliquantae centuriae habent facultatem ad abscedendum antequam una oppugnatio propinquitatis attingit. Sed fortasse velis eas sistere in sua humo ut progetant unam tegulam certam. Si ita vis, des eis jussionem custodiae, et tum manebunt ut fixae fiant donec mortuae sint sive des eis jussionem novam.
This is NOT the same as Fortify but they will still gain the Fortification Bonus. They will simply not utilize their Withdraw ability. Fortified units with the Withdraw ability will try to flee when attacked. = Hoc NON est aequum quam fortificare sed eae etiam mereant praemium fortificationis. Eae simpliciter non utantur facultate suâ ad abscedendum. Centuriae fortificantes cum facultate abscessionis tentent abscedere cum appugnantur.

City Tile Blockade = Obsidio Areæ Urbis
One of your tiles is blocked by an enemy: when an enemy unit stands on a tile you own, the tile will not produce yields and cannot be worked by a city this turn. City will reallocate population from a blocked tile automatically. = Una de tegulis tuis obsidetur hoste: quom centuria hostilis sistit in tegula a te possessa, ea tegula non producat res et non possit urbe operari in hoc gressu. Urbs per automataria denuo assignet multitudinem a tegula quae obsidetur.
Enemy military land units block tiles they are standing on. Enemy military naval units additionally block adjacent water tiles. To protect your tiles from blockade, place a friendly military unit on it or fight off invaders. = Centuriae militares hostiles terrae obsident tegulas quibus sistunt. Centuriae marinae militares hostiles additis obsident tegulas adjacentes aquae. Ut protegas tegulas tuas ab obsidione, ponas centuriam amicam militarem in illam vel expellas incurrentes.

One of your cities is under a naval blockade! When all adjacent water tiles of a coastal city are blocked - city loses harbor connection to all other cities, including capital. Make sure to de-blockade cities by deploying friendly military naval units to fight off invaders. = Una de urbibus tuis est in marina obsidione! Quom omnes adjacentes tegulae aquae urbis littoralis obsidentur, urbs amittat catenationem portus cum urbibus aliis et metropoli. Cures emovere obsidionem per ponendum centurias marinas militares amicas ad expellendum incurrentes.

Spies! = Curiosi!
The first time a civ reaches the Renaissance era each nation gets one spy. Every time a civ reaches an era afterwards they get one more spy. = Quando primitus aliqua civilizatio attingit aetatem renascentiae, populus omnis mereat unum emissarium. Quandocumque aliqua civilizatio attingit aetatem post eam, omnis pluribus mereat emissarium.
Spies can be sent out to foreign cities to steal technology, rigging elections or stage coups. Place them in your own cities to do counter-intelligence work. = Exploratores Occulti in urbes externas mitti possunt ad technologiam furandam, comitia corrumpenda vel rerum conversiones faciendas. In urbibus tuis eos ad contraexplorationem colloca.
Only one spy per civ is allowed in each city. Spies that are not in any city are on vacation in your spy hideout. = Solus unus explorator occultus per civilitatem in quaque urbe permittitur. Qui in nulla urbe sunt ferias in latebra exploratorum agunt.
Spies set up in cities of major civilizations will try to steal technology at a rate which is based off of the science production in the city. Succeeding to steal technology will level up your spy. Failing to succeed will level up the defending spy if it is present. = Exploratores occulti in urbibus magnarum civilitatum technologiam furari conantur celeritate ex fabricatione scientiæ urbis pendente. Furtum prosperum exploratorem tuum promovet. Defectus exploratorem defensorem, si adest, promovet.
Spies set in city-states will try to rig the elections in order to gain influence and reduce the influence of other civilizations. Only one spy partaking in rigging the election can win. = Exploratores occulti in civitatibus urbanis comitia corrumpere conantur ad auctoritatem obtinendam aliarumque civilitatum auctoritatem minuendam. Unus tantum explorator comitia corrumpens vincere potest.
A spy that is rigging an election in a city-state may also stage a coup. The likelihood of success for the coup depends on your relative influence to the current ally of the city-state, your spy level, and the level of the spy that the current ally has in the city-state if present. Succeeding a coup will make you their new ally and reduce the influence of all other civs. Failing a coup will kill your spy and level up the defending spy if present. = Explorator comitia in civitate urbana corrumpens etiam rerum conversionem facere potest. Spes prosperi exitus ex auctoritate tua comparata cum præsenti socio civitatis urbanæ, gradu exploratoris tui et gradu exploratoris præsentis socii, si adest, pendet. Successus te novum socium facit omniumque aliarum civilitatum auctoritatem minuit. Defectus exploratorem tuum necat et defensorem, si adest, promovet.
Spies that are set up in your own cities will be conducting counter-intelligence. They reduce the success chance of other spies trying to steal your technology. = Exploratores occulti in urbibus tuis contraexplorationem agent. Spem aliorum exploratorum technologiam tuam furandi minuunt.
Spies at a higher rank have a higher chance of success. The max rank a spy can reach is rank 3. After a spy is killed it will revive after a certain amount of turns back at rank 1. = Exploratores superioris gradus maiorem spem prosperi exitus habent. Summus gradus est 3. Explorator occisus post aliquot gressus gradu 1 reviviscet.
Building buildings like the constabulary and police station will reduce the technology steal rate of spies in that city. = Ædificia ut custodia et statio vigilum celeritatem furandæ technologiæ exploratorum in ea urbe minuunt.
Espionage is available using the Gods and Kings ruleset. To enable it in a new game click advanced settings, then click on the Enable Espionage option. = Exploratio Occulta cum regulis Dei et Reges parabilis est. Ut in nova parte eam habilites, optiones provectas preme, deinde Habilitare Explorationem Occultam.

Keyboard Bindings = Compages Plectrologii
Limitations = Limitationes
 # Requires translation!
This is a work in progress. = Hoc est opus in progressu.
For technical reasons, only direct keys or Ctrl-Letter combinations can be used. = Causis technicis solæ claves singulæ vel coniunctiones Ctrl-Littera adhiberi possunt.
Using the Keys page = Usus paginae plectrorum
Each binding has a button with an image looking like this: = Quæque assignatio bullam imagine tali habet:
While hovering the mouse over the key button, you can press a desired key directly to assign it. = Dum cursor muris super bullam clavis est, clavem desideratam directe premere potes ut eam assignes.
Double-click the image to reset the binding to default. = Imaginem bis preme ad assignationem prædefinitam restituendam.
Bindings mapped to their default keys are displayed in gray, those reassigned by you in white. = Assignationes clavibus prædefinitis congruentes griseæ ostenduntur, a te mutatæ albæ.
Conflicting assignments are marked red. Conflicts can exist across categories, like World Screen / Unit Actions. Note that at the moment, the game does not prevent saving conflicting assignments, though the result may be unexpected. = Assignationes inter se pugnantes rubro notantur. Conflictus inter categorias esse possunt, ut Pagina Mundi / Actiones Centuriæ. Nunc ludus eas servare non impedit, quamvis exitus inexspectatus esse possit.
For discussion about missing entries, see the linked github issue. = De elementis deficientibus disserendum vide in coniuncta quæstione GitHub.

Welcome to the Civilopedia! = Bene venisti ad Civilopædiam!
Here you can find information - general help, rules, and what makes up the game world. = Hic potes investigare indicia - adjumentum commune, regulas et id quo mundus ludi consistit.
How to find information = Ut investiges indicia
Select categories with the buttons on top of the screen. Also up there is the button to leave Civilopedia and go back to where you were before. = Categorias bullis in summa pagina elige. Ibi etiam bulla est ad Civilopediam relinquendam et ad priorem locum redeundum.
Each category has a list of entries on the left of the screen, sorted alphabetically (with few exceptions). Clicking an entry will update the center pane were you are currently reading this. = Quæque categoria indicem articulorum a sinistra habet, ordine alphabetico dispositum, paucis exceptis. Articulum pressum tabulam mediam, ubi hæc legis, renovat.
Lines can link to other Civilopedia entries, they are marked with a chain link symbol like this one. You can click anywhere on the line to follow the link. = Lineæ ad alios articulos Civilopediæ ducere possunt; signo catenæ tali notantur. Quamlibet partem lineæ premere potes ad nexum sequendum.
The current category is special - all articles on general concepts are here. It is called 'Tutorials' because you can revisit these here, too. = Categoria præsens specialis est: omnes articuli de notionibus generalibus hic sunt. «Doctrinæ» vocatur quia has quoque hic relegere potes.
What information can I find = Quod indicium investigare possim
The data shown is not dependent on your current game's situation, e.g. bonuses for the nation you are playing or difficulty modifiers will not affect the numbers. = Indicia data non dependent de tui ludi præsente statu, e. g., sive additio de populo, quem ludis, sive coefficiens de asperitate non afficiet numeros.
However, it will reflect the mods you are playing! The combination of base ruleset and extension mods you select define the rules of a game, what objects exist and how they interact, and the Civilopedia mirrors these rules. = Mutationes tamen quibus ludis repræsentat! Coniunctio regularum fundamentalium et mutationum additarum quas eligis definit regulas partis, quæ res exsistant et quomodo inter se agant; Civilopedia has regulas refert.
If you opened the Civilopedia from the main menu, the "Ruleset" will be that of the last game you started. = Si Civilopediam ex indice principali aperuisti, «Regulæ» ex ultima parte a te incepta erunt.
Letters can select categories, and when there are multiple categories matching the same letter, you can press that repeatedly to cycle between these. = Litteræ categorias eligere possunt; si plures eidem litteræ congruunt, eam repetite premere potes ad eas percurrendas.
The arrow keys allow navigation as well - left/right for categories, up/down for entries. = Claves sagittarum quoque navigationem permittunt: sinistra/dextra categorias, sursum/deorsum articulos.

UI Tips = Ars de Re inter Facies
World screen = Ostentus mundi
Skip all units to end a turn quickly = Omnes centurias omittere ad gressum cito finiendum
Right-click or long press the "Next unit" button to open a popup menu which allows to end a turn without having to cycle through all units. If some units are automated, a dedicated button is available to move them before ending the turn. = «Centuria proxima» dextro muris preme aut diu tene ad indicem emergentem aperiendum, qui gressum sine omnibus centuriis percurrendis finire permittit. Si aliquæ centuriæ automatæ sunt, bulla propria eas movere potest ante finem gressus.
Toggle notification list display = Ostensionem indicis nuntiorum commutare
On the World screen, swipe the notification list to the right to temporarily hide it. Click the "Bell" button to display them again. = In Pagina Mundi indicem nuntiorum dextrorsum trahe ut ad tempus abscondas. Bullam «Campana» preme ut iterum ostendas.
The default state for the notification list can be set in Options > Display > UI - Notifications on world screen. = Status prædefinitus indicis nuntiorum in Optiones > Ostensio > Interfacies — Nuntii in pagina mundi statui potest.
Entering a City Screen quickly = Paginam Urbis cito intrare
You can Right-click or long press a city button on the World screen. The result is the same as tapping it twice - once to select and move the button, again to trigger a reaction: show the City Screen (if the city is yours to inspect), or offer the foreign city info popup. = Bullam urbis in Pagina Mundi dextro muris premere aut diu tenere potes. Idem efficitur ac duplici pressione: prima eligit bullamque movet, altera actionem excitat, Paginam Urbis ostendens si tua ad inspiciendum est aut informationes urbis externæ offerens.
Upgrade multiple units of the same type = Plures centurias eiusdem generis emendare
On the World screen, select a unit that can be upgraded, then right-click or long press the "Upgrade" button to open a popup menu allowing to upgrade all units of this type at once. = In Pagina Mundi centuriam emendabilem elige, deinde «Emendare» dextro muris preme aut diu tene ad indicem aperiendum qui omnes huius generis centurias simul emendare permittit.
In the Units overview, the same upgrade menu is available by clicking the unit icon in the "Upgrade" column. When a unit is upgradeable, the icon is lit if conditions are met (enough gold and/or resources), otherwise it is dimmed. = In summario Centuriarum idem index emendationis signo centuriæ in columna «Emendare» presso aperitur. Si centuria emendari potest, signum lucet condicionibus expletis, satis solidis et/vel mercibus; aliter obscuratur.
Additional controls for the construction queue = Moderamina addita agminis constructionis
Right-click or long press a construction item to open a popup menu with additional controls, allowing to manage production of the same item in all cities, by issuing the commands from the same City Screen. = Rem construendam dextro muris preme aut diu tene ad indicem cum moderaminibus additis aperiendum, quibus fabricationem eiusdem rei in omnibus urbibus ex eadem Pagina Urbis regere potes.
The "Disable" option (in a single city or all cities) moves an item to a separated "Disabled" tab, to prevent its automatic queueing by the "Auto-assign city production" option or to remove irrelevant objects from the production planning. To move a disabled item back to its initial place, re-enter its popup menu, and choose "Enable". = Optio «Debilitare», in una vel omnibus urbibus, rem ad partem separatam «Debilitata» movet, ne ab optione «Fabricationem urbis automatice assignare» in agmen addatur aut ut res inutiles e consilio fabricationis removeas. Ut rem debilitatam ad pristinum locum remittas, indicem eius iterum aperi et «Habilitare» elige.
Disabled items are set for the current game only and are carried over when founding a new city. = Res debilitatæ soli præsenti parti statuuntur et ad novam urbem conditam transferuntur.
Show Great Person Points breakdown = Enarrationem Punctorum Magnarum Personarum ostendere
In the right sidepanel, click a Great People row to display the details of Great Person Points (GPP) accumulated each turn by the current city, for this type of Great People. = In tabula laterali dextra lineam Magnarum Personarum preme ad puncta Magnarum Personarum huius generis a præsenti urbe quoque gressu collecta enarranda.
Click any of the Great People icons to display all GPP accumulated each turn by the current city, for all types of Great People. = Quodlibet signum Magnarum Personarum preme ad omnia puncta omnium generum a præsenti urbe quoque gressu collecta ostendenda.
Tech screen = Ostentus technologiarum
Queue multiple technologies in different branches = Plures technologias diversorum ramorum in agmen ponere
On the Tech screen, right-click or long press a technology to automatically queue it, even if this tech is in another branch than the item currently researched. Prerequisite techs to research will also be automatically queued. = In pagina Technologiæ technologiam dextro muris preme aut diu tene ut automatice in agmen addatur, etiamsi in alio ramo quam præsens investigatio est. Technologiæ prærequiritæ investigandæ quoque automatice addentur.
Right-click or long press multiple techs to append them to the research queue, whatever their branch is. = Plures technologias dextro muris preme aut diu tene ut ad finem agminis investigationis addas, quocumque ramo sunt.
Overview screens = Ostentus breviarii
Reveal known resources on world screen = Merces notas in pagina mundi aperire
In the Resources overview, click on a resource icon to center the world screen on tiles already discovered and providing this resource. = In summario Mercium signum mercis preme ad paginam mundi in areis iam inventis hanc mercem præbentibus centrandam.
Alternatively, click on the "Unimproved" number to center the world screen only on owned (by you or your allied City-states) tiles where the resource is not improved. = Vel numerum «Non emendatæ» preme ad paginam mundi solum in areis possessis a te vel Civitatibus Urbanis sociis, ubi merx non emendata est, centrandam.
If more than one tile is available, click repeatedly on the notification to cycle through all of them. = Si plus quam una area parabilis est, nuntium repetite preme ad omnes percurrendas.
Show diagram line colors = Ostendere colores linearum diagrammatis
In Politics overview > Show diagram, you can click anywhere inside the diagram to display a table listing all relationship line colors and their meaning. = In summario Politicæ > Diagramma ostendere, ubivis intra diagramma premere potes ad tabellam omnium colorum linearum necessitudinum et significationum ostendendam.
Reading "Toast" popups = Breves nuntios emergentes legere
"Toasts" can be clicked to make them stay on the screen for easier reading. = Breves nuntii premi possunt ut in pagina maneant et facilius legantur.
Click it again to close (or use the close button). = Iterum preme ad claudendum, aut bulla claudendi utere.
Miscellaneous = Res miscellaneae
External links = Nexus externi
External links support right-click or long press to copy the link to the clipboard instead of launching the browser. = Nexūs externi dextro muris premi aut diu teneri possunt ad nexum in latibulum duplicandum potius quam navigatrum aperiendum.
Example: The 'Open Github page' button on the Mod management screen. = Exemplum: bulla «Paginam GitHub aperire» in pagina administrationis Mutationum.
View change log = Indicem mutationum videre
After updating, you might want to see what has changed. The "About" in "Options" has the version number linked to the change log. You can also see that info by clicking the version number on the main menu. = Post renovationem quæ mutata sint videre velis. Numerus versionis in «De Ludo» intra «Optiones» ad indicem mutationum ducit. Eadem informatione etiam numero versionis in indice principali presso uti potes.

Differences from Civilization V = Differentiae a Civilization V
Production Focus\nIn Civilization V, the Food yield in a city is calculated first, then population grows by consuming stored food (growth), then production is calculated, and so on one by one the other stats are calculated. Thus, citizens can produce yields in the same turn as they are born. The city focus is set to Production to assign the newborn citizen to a hill so they'll contribute Production, and then manually reassigned to a growth tile on the next turn. Alternatively, you can set city focus to Gold (e.g. with Cerro de Potosi), Faith (e.g. with Mount Sinai) or whatever gains the most yields. In Unciv, citizens only start producing yields on the next turn, so you can ignore this whole concept. = Intentio Fabricationis\nIn Civilization V primum proventus Cibi urbis computatur, deinde cives cibo servato consumpto crescunt, postea Fabricatio et singulæ reliquæ statisticæ computantur. Ita cives eodem gressu quo nascuntur proventus dare possunt. Intentio urbis ad Fabricationem statuitur ut novus civis colli assignetur et Fabricationem conferat, deinde proximo gressu manu in aream incrementi transfertur. Vel ad Solidos, exempli gratia cum Cerro de Potosi, Fidem, exempli gratia cum Monte Sinai, aut quidquid maximos proventus dat intendere potes. In Unciv cives proventus tantum proximo gressu dare incipiunt, ideo hanc totam rationem neglegere potes.
Science Queueing\nIn Civilization V, Science yield is calculated after production, so if you finish an item and have Science (or Gold) queued as a perpetual construction, the Production overflow from item will be converted into Science (or Gold), but the Production is not consumed, as this will only happen again on the next turn. By immediately swapping out your perpetual construction for an item on the next turn, you'll get this Science (or Gold) for free. This doesn't apply to Unciv, so don't bother. = Agmen Scientiæ\nIn Civilization V proventus Scientiæ post fabricationem computatur; si rem perficis et Scientiam vel Solidos ut constructionem perpetuam in agmine habes, superflua Fabricatio in Scientiam vel Solidos convertitur, sed Fabricatio non consumitur, quia id tantum proximo gressu iterum fiet. Proximo gressu constructionem perpetuam statim pro re mutando hanc Scientiam vel Solidos gratis accipies. Hoc in Unciv non valet; noli laborare.
Double Aqueducts\nIn Civilization V, the game sells existing copies of the building for you before providing a free copy of the building. So, if you build an aqueduct in a city, and then in the turn of adopting Tradition Complete you sell a cheap building (e.g a shrine) beforehand, the game is unable to sell more than 1 building per turn, and thus you'll keep your aqueduct, together with the new free aqueduct. Not applicable to Unciv. = Duplices Aquæductus\nIn Civilization V ludus exemplaria ædificii exsistentia tibi vendit antequam exemplum gratuitum det. Si igitur aquæductum in urbe ædificas et in gressu Traditionis Perfectæ adoptandæ prius vile ædificium, ut sacellum, vendis, ludus plus quam 1 ædificium per gressum vendere non potest; ideo aquæductum tuum cum novo gratuito servabis. In Unciv non valet.
Legalism Oxford\nIn Civilization V, national wonders such as Oxford University are considered culture buildings, so you can get them for free with Legalism. Not applicable to Unciv. = Legalismus Oxoniensis\nIn Civilization V miracula nationalia ut Universitas Oxoniensis ædificia culturæ habentur; ideo ea gratis per Legalismum accipere potes. In Unciv non valet.
Roads and Forts\nIn Civilization V, you can't use roads and forts in enemy territory. In Unciv, you can use them, so instead of mindlessly constructing them everywhere when at war, you need to decide if and when they'll benefit you more than your opponents. = Viæ et Castella\nIn Civilization V viis et castellis in hostium terra uti non potes. In Unciv potes; ideo pro insipida constructione ubique durante bello decernere debes utrum et quando tibi plus quam hostibus prosint.
Citizen Conversion\nIn Civilization V, a citizen is born religious if the parent city is already converted. This is not the case in Unciv, which can lead to temporary deconversion of a city when it grows. = Conversio Civium\nIn Civilization V civis religiosus nascitur si urbs mater iam conversa est. Hoc in Unciv non fit, quod ad temporalem religionis amissionem urbis crescentis ducere potest.
Unassigned Citizens\nIn Civilization V, unassigned citizens are considered specialists, and subject to the same type of bonuses (e.g. Korea's ability). It can be worthwhile to leave citizens unassigned, instead of being assigned to a tile. Not applicable to Unciv. = Cives Non Assignati\nIn Civilization V cives non assignati periti habentur et eadem genera beneficiorum accipiunt, ut facultatem Coreæ. Utile esse potest cives non assignatos relinquere potius quam areæ assignare. In Unciv non valet.
Settler Construction\nIn Civilization V, cities can't starve when constructing settlers, so you can assign all citizens to production tiles and none to food tiles. In Unciv, citizens keep consuming two food per turn. = Constructio Colonorum\nIn Civilization V urbes colonos construendo fame laborare non possunt; omnes igitur cives areis fabricationis, nullos cibi assignare potes. In Unciv cives duo cibi quoque gressu adhuc consumunt.
Water Melee Attack\nAs result of a Discord poll, Water Melee units can attack military land units on the shore, unlike in Civilization V. = Impetus Comminus in Aqua\nEx suffragio Discord, centuriæ comminus in Aqua pugnantes centurias militares terrestres in litore oppugnare possunt, aliter quam in Civilization V.
Tile improvements\nIn Civilzation V, workers start working on an improvement-under-construction at the beginning of movement. Unciv changes this, to allow players to assign workers to tiles, and then reconsider and change improvement or move them elsewhere. = Emendationes arearum\nIn Civilization V opifices emendationem nondum perfectam initio motus laborare incipiunt. Unciv hoc mutat ut lusores opifices areis assignare, deinde rem reputare et emendationem mutare aut alio movere possint.
Forest and Jungle Visibility\nIn Unciv, forests and jungles are visible 1 tile outside visibility range. In Civilization V, this is the behaviour of hills and mountains, but not of forests and jungles, yet jungle and forest can block hills, and hill + forest can block mountain, indicating they're on the same elevation. This is considered to be a bug in the otherwise well-structured visibility logic in Civilization V. = Visibilitas Silvæ et Saltus\nIn Unciv silvæ saltusque 1 area ultra spatium visibilitatis apparent. In Civilization V hoc collibus montibusque accidit, non silvis saltibusque; tamen saltus et silva colles, collis cum silva montem occultare possunt, quod eandem altitudinem indicat. Hoc vitium in alioquin bene ordinata ratione visibilitatis Civilization V habetur.
City razing\nIn Civilization V, the player can never raze any of the cities he/she founded. Not applicable to Unciv. = Eversio urbis\nIn Civilization V lusor nullam urbem a se conditam umquam evertere potest. In Unciv non valet.

Founding Cities\nThe Settler is a unit that can found a new city. You can build a Settler unit in a city with at least 2 population, and then move them to a good location to found a new city. This will usually be your main way of acquiring more cities. = Urbem condere\nColonus est centuria quae potest novam urbem condere. Potes in urbe cum multitudine non pauciore quam 2 aedificare colonum, et tum movere eum ad locum bonum ad condendum novam urbem. Hoc vulgo sit modus tuus principalis de acquirendo plures urbes.
Food conversion to Production\nDuring the construction of a Settler, the city will not grow. Instead, the 1st, 2nd, 4th, and from there on every 4th, excess Food (Growth) is converted into Production, with the rest of the excess Food being lost. = Versio a cibo ad fabricationem\nQuom colonus construitur, urbs non augeatur. Autem primus, secundus et quartus cibus ("auctus") superfluus, et quartus de quaternis usque dehinc, in fabricationem vertantur, cum eo quod alius cibus amittatur.

