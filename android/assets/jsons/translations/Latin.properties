达到三城容量并在首波前建立三城，可在后续关卡尝试。 = Capacitatem trium urbium resera et tres urbes ante primam undam gradus futuri posside.
把长期发展转化为完整终局，纪念第一次亲自完成一场胜利。 = Progressum diuturnum ad plenum finem duc et primam victoriam commemora.
选择第二座城的位置，在资源、地形和扩张成本之间作第一次取舍。 = Locum secundæ urbis elige et merces, solum pretiaque amplificationis æqua.
第一次为文明选择发展方向，感受政策带来的长期差异。 = Directionem civilitatis tuæ elige et effectus dictatorum diuturnos inveni.
协调两座城市的生产与黄金时代时机；争夺奇观的风险，让排期本身成为决策。 = Fabricationem in duabus urbibus cum tempore Sæculi Aurei compone. Certamen miraculorum ordinationem electionem strategicam facit.
围绕一座奇观安排科技和生产，体验与其他文明争夺同一目标。 = Technologiam fabricationemque circa miraculum para et cum aliis civilitatibus ad illud ædificandum certa.
认识移动、攻击与生存的基本关系，获得第一次真实交锋的反馈。 = Per primam veram pugnam disce quomodo motus, impetus et salus inter se conveniant.
把地图上的土地变成实际产出，理解工人与城市发展的关系。 = Terram in areas productivas converte et disce quomodo Opifices progressum urbis adiuvent.
把分散的城市组织成网络，选择道路、海港或两者组合，而非只追求城市数量。 = Urbes dispersas viis, Portibus aut utrisque in rete coniunge potius quam soli numero urbium intendere.
让粮食、人口与教育设施相互支持，形成一座有清楚用途的学术中心。 = Cibum, multitudinem et ædificia educationis coniunge ut proprium centrum doctrinæ crees.
比较不同城邦类型的收益，决定把有限外交投入放在哪里。 = Beneficia diversorum generum civitatum urbanarum compara et ubi limitatas opes rerum externarum colloces decerne.
把创教转为本土社会的共同信仰，体验城市布局、自然传播和主动传教的配合。 = Religionem a te conditam domi propaga situ urbium, propagatione naturali et conversione activa coniunctis.
在未知地图中获得发现的惊喜。作为自然探索纪念，不要求为三处奇观反复重开。 = Inventis in tabula ignota fruere. Hic progressus explorationis non requirit ut sæpius denuo incipias ad tria miracula invenienda.
以有限城市投入科研，依靠质量和发展效率完成太空目标。允许防卫战争，限制的是指定战斗占城。 = Limitatum numerum urbium efficaci investigationi intende ad spatium attingendum. Bella defensiva permittuntur; restrictio ad certas captiones militares pertinet.
在有限城市规模下集中积累文化，安排政策、建设与胜利项目的先后。 = Culturam in parvo imperio concentra et ordinem dictatorum, ædificiorum et propositi victoriæ para.
改变扩张来源：不继续自行建城，以军事实力和占领后的管理建立帝国。 = Expugnando potius quam plures urbes condendo cresce et imperium robore militari administrationeque urbium ædifica.
用有限城市支撑政策专精，选择两条适合当前战略的政策路线。 = Progressum dictatorum intentum limitato numero urbium adiuva et duos ramos consilio tuo convenientes elige.
围绕外国首都组织宗教影响力，选择传播对象与时机，承担跨国竞争。 = Auctoritatem religionis circa externa capita ædifica, inter certamen gentium ubi et quando propages eligens.
利用埃及建造优势，把一座城市经营成奇观中心，在科技、生产与抢建风险之间取舍。自选重投入专项。 = Commodum constructionis Ægypti adhibe ut una urbs centrum miraculorum fiat, investigatione, fabricatione certamineque æquatis. Hæc provocatio voluntaria magnam collocationem requirit.
预先协调多条战线和占城部队，让几场局部战斗汇成同一回合的战略突破。 = Plures acies et centurias capientes compone ut pugnæ separatæ progressus strategicus in uno gressu fiant.
围绕波斯黄金时代的持续时间与战斗优势准备攻势，在有效窗口集中兑现实力。自选进阶专项。 = Impetum circa durationem et commoda pugnæ Sæculi Aurei Persiæ para. Hæc provocatio provecta voluntaria est.
用小国规模应对更高难度，挑选一条适合的非时间胜利路线，而非依靠不断扩张。 = Maiorem difficultatem cum parvo imperio obi et idoneam viam victoriæ non Temporis elige potius quam continua amplificatione niti.
检验对整体战略、时机和局势判断的掌握；是玩家主动选择的高手目标。 = Peritiam consilii, temporis statusque tui experire. Hæc provocatio peritorum voluntaria est.
让唯一城市承担科研、经济与防卫，寻找单城条件下的完整发展解法。 = Una urbe ad investigationem, œconomiam defensionemque utere et plenum consilium intra illum terminum evolve.
主动放弃世界奇观这条优势来源，探索政策、城市发展与文化胜利之间的其他组合。 = Miraculis Mundi renuntia et alias vias dictata, progressum urbium victoriamque culturæ coniungendi explora.
