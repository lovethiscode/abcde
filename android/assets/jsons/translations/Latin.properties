Ramkhamhaeng = Ramkhamhaeng
You lowly, arrogant fool! I will make you regret of your insolence! = Humilis superbe stulte! Faciam ut insolentiæ tuæ te pæniteat!
You scoundrel! I shall prepare to fend you off! = Sceleste! Ad te repellendum me parabo!
Although I lost, my honor shall endure. I wish you good luck. = Quamvis viceris, honor meus manebit. Bonam tibi fortunam opto.
I, Pho Kun Ramkhamhaeng, King of Siam, consider it a great honor that you have walked to visit my country of Siam. = Ego, Pho Kun Ramkhamhaeng, Rex Siam, magno honori habeo quod venisti ut terram meam Siam viseres.
Greetings. I believe this is a fair proposal for both parties. What do you think? = Salve. Hanc iustam utrique parti propositionem esse credo. Quid censes?
Welcome. = Salve.
Father Governs Children = Pater Praesidet Liberos
O Great King Ramkhamhaeng, the Siamese people obey you with respect and fear! The beautiful and mysterious land of Siam is an ancient country in the heart of Southeast Asia, which was besieged by many foes, plagued by bloody war and great poverty, but eventually the smart and loyal Siamese people have endured and triumphed. Siam was a part of the Khmer Empire until the 13th century AD, before its brave people took arms and led a revolution to form the small Sukhothai kingdom. After many battles and diplomacy prowess, this tiny kingdom became a mighty empire, which would dominate South East Asia for more than a century. = O Magne Rex Ramkhamhaeng, populus Siam te cum reverentia metuque sequitur! Pulchra arcanaque terra Siam antiqua est in corde Asiæ Austrorientalis, a multis hostibus obsessa, cruento bello magnaque paupertate vexata; tandem tamen callidus fidelisque populus Siam toleravit et vicit. Siam pars Imperii Khmer fuit usque ad sæculum 13 post Christum, antequam fortis populus arma caperet et seditione parvum regnum Sukhothai conderet. Post multas pugnas et callidas res externas, hoc parvum regnum potens imperium factum est quod Asiam Austrorientalem plus quam sæculum dominaretur.
Wise and powerful King Ramkhamhaeng, your people want to revive these days of glory! Can you make a new dawn break on Siam? Will your new empire shine through the ages of history? = Rex sapiens potensque Ramkhamhaeng, populus tuus hos dies gloriæ renovare vult! Potesne novam auroram super Siam facere? Splendebitne novum imperium tuum per ætates historiæ?
