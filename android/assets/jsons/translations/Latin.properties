皇帝及以上难度，开局至少4个 AI 对手。使用波斯，在同一段连续黄金时代内，通过战斗攻占四座不同城市，且这些城市的建立者包含至少两个其他主要文明；延长黄金时代有效，中断后重新计算。 = Difficultas Imperatoris vel superior; incipe cum saltem 4 adversariis artificialibus. Ut Persia, per unam continuam Sæculum Aureum 4 diversas urbes in pugna cape, quarum conditores saltem 2 aliæ magnæ civilitates sunt. Protractio Sæculi Aurei numeratur; computatio restituitur si finitur.
使用波斯，在同一段连续黄金时代内，通过战斗攻占四座不同城市，且这些城市的建立者包含至少两个其他主要文明；延长黄金时代有效，中断后重新计算。 = Ut Persia, per unam continuam Sæculum Aureum 4 diversas urbes in pugna cape, quarum conditores saltem 2 aliæ magnæ civilitates sunt. Protractio Sæculi Aurei numeratur; computatio restituitur si finitur.
在波斯长昼中夺取四城 = Quattuor urbes in longo die Persiæ cape
让波斯的黄金时代，\n见证跨越两个文明的四城远征。 = Sæculum Aureum Persiæ testetur\nexpeditionem quattuor urbium per duas civilitates.
小国问鼎 = Triumphus Parvæ Gentis
皇帝及以上难度，开局至少4个 AI 对手。获得一次非时间胜利，整局同时拥有的城市从未超过三座，且从未通过战斗攻占其他主要文明建立的城市。 = Difficultas Imperatoris vel superior; incipe cum saltem 4 adversariis artificialibus. Victoriam præter Temporis obtine sine plus quam 3 urbibus simul umquam possessis aut urbe ab alia magna civilitate condita in pugna capta per totam partem.
获得一次非时间胜利，整局同时拥有的城市从未超过三座，且从未通过战斗攻占其他主要文明建立的城市。 = Victoriam præter Temporis obtine sine plus quam 3 urbibus simul umquam possessis aut urbe ab alia magna civilitate condita in pugna capta per totam partem.
以至多三城问鼎世界 = Cum non plus quam tribus urbibus triumpha
不越三城，不靠攻城，\n在时间之外，赢下一场胜利。 = Non plus quam tres urbes posside; nullas in pugna cape.\nVictoriam præter Temporis obtine.
逆神而胜 = Victoria Contra Deos
天神及以上难度，开局至少4个 AI 对手。获得一次非时间胜利；科技、文化、征服和外交胜利均可。 = Difficultas Deitatis vel superior; incipe cum saltem 4 adversariis artificialibus. Victoriam præter Temporis obtine; victoriæ Scientificæ, Eruditionis, Dominationis et Diplomaticæ omnes numerantur.
获得一次非时间胜利；科技、文化、征服和外交胜利均可。 = Victoriam præter Temporis obtine; victoriæ Scientificæ, Eruditionis, Dominationis et Diplomaticæ omnes numerantur.
在天神难度战胜列国 = Rivales in Deitate vince
从天神难度的起点，\n赢得一场非时间胜利。 = In difficultate Deitatis incipe\net victoriam præter Temporis obtine.
一城群星 = Una Urbs Inter Stellas
皇帝及以上难度，开局至少4个 AI 对手。开启单城挑战并获得科技胜利，整局同时拥有的城市从未超过一座；短暂获得第二座城市也不符合条件。 = Difficultas Imperatoris vel superior; incipe cum saltem 4 adversariis artificialibus. Provocationem Unius Urbis habilita et victoriam Scientificam obtine sine plus quam 1 urbe simul umquam possessa per totam partem; etiam secundam urbem breviter acquirere partem excludit.
开启单城挑战并获得科技胜利，整局同时拥有的城市从未超过一座；短暂获得第二座城市也不符合条件。 = Provocationem Unius Urbis habilita et victoriam Scientificam obtine sine plus quam 1 urbe simul umquam possessa per totam partem; etiam secundam urbem breviter acquirere partem excludit.
在单城挑战中走向群星 = Stellas in Provocatione Unius Urbis attinge
在单城挑战中，\n让唯一的城市赢得科技胜利。 = In Provocatione Unius Urbis\nsola urbs tua victoriam Scientificam obtineat.
无碑华章 = Cultura Sine Miraculis
皇帝及以上难度，开局至少4个 AI 对手。获得文化胜利，且整局从未拥有过任何世界奇观，包括占领或接收城市带来的奇观；国家奇观不受限制。 = Difficultas Imperatoris vel superior; incipe cum saltem 4 adversariis artificialibus. Victoriam Eruditionis obtine sine ullo Miraculo Mundi umquam possesso per totam partem, etiam miraculis in urbibus captis aut acquisitis; Miracula Nationalia non limitantur.
获得文化胜利，且整局从未拥有过任何世界奇观，包括占领或接收城市带来的奇观；国家奇观不受限制。 = Victoriam Eruditionis obtine sine ullo Miraculo Mundi umquam possesso per totam partem, etiam miraculis in urbibus captis aut acquisitis; Miracula Nationalia non limitantur.
不拥奇观，赢得文化胜利 = Cultura vince sine Miraculis Mundi possessis
一座世界奇观也不曾拥有。\n让文化本身带你走向胜利。 = Numquam ullum Miraculum Mundi posside.\nIpsa cultura te ad victoriam ferat.
海峡两岸 = Trans Aquam
不限难度。自行在与当前首都不同的连通陆地区域建立分城，为其建成海港或等价建筑；己方回合结算时，该城通过包含海路的有效连接接通首都。允许首都经道路连接本土港口后出海，不要求首都沿海。 = In qualibet difficultate urbem non capitalem in massa terræ coniuncta diversa ab ea præsentis capitis conde et Portum vel æquivalens ibi ædifica. In computatione finis gressus tui urbs coniunctionem ad caput a ludo agnitam cum itinere maritimo habere debet. Caput via portui domestico coniungi potest; maritimum esse non debet.
在另一块陆地自建城市，建成海港，让海路将它接入首都。 = Urbem in alia massa terræ conde et per Portum mari capiti coniunge.
让海洋连接你的城市 = Urbes tuas trans mare coniunge
选择值得投入的海外城址，安排港口和交通，让海洋成为发展通道。 = Amplificationem trans mare cum pretio coniungendæ coloniæ longinquæ æqua.
互通有无 = Aliquid ad Commercium
不限难度。与一个主要文明完成一份有效交易：出口本国来源的重复奢侈品，换入交易前本国没有可用供应的一种奢侈品；交易后出口品仍至少保留一份，换入品已可用。允许金币等补差价，不要求总幸福非负或额外等待。 = In qualibet difficultate commercium efficax cum magna civilitate perfice: mercem luxuriosam duplicem e fontibus domesticis exporta et mercem luxuriosam cuius nulla copia utilis tibi ante commercium erat importa. Postea saltem unum exemplar utile mercis exportatæ retine et copiam utilem importatæ habe. Solidi aliæve condiciones æquantes permittuntur. Felicitas universa non negativa et exspectatio addita non requiruntur.
用本国的重复奢侈品，换入此前没有供应的一种奢侈品，且出口后保留一份。 = Luxum domesticum superfluum pro luxu quem non habebas commuta, uno exemplari exportati retento.
用富余资源换来新的选择 = Superfluum pro nova electione commuta
把富余资源转化为新的选择，寻找互利交易对象。阿拉伯可用大巴扎增加的资源份数达成。 = Merces superfluas in utilem electionem rerum externarum converte.
重归故土 = Reditus in Patriam
不限难度。通过战斗夺取一座其他主要文明或城邦建立的城市，选择解放并完成归还原建立者的结算；玩家此前没有正式拥有过该城。直接解放流程中的临时归属不算此前占有；不要求结盟或后续存活。 = In qualibet difficultate urbem ab alia magna civilitate aut civitate urbana conditam pugnando cape, liberationem elige et reditum originali conditori perfice. Urbem antea numquam officialiter possedisse debes. Possessio temporaria durante liberatione directa non numeratur ut possessio prior. Societas aut salus posterior non requiritur.
战斗夺取一座从未正式拥有过的外国城市，将它解放归还原建立者。 = Urbem externam quam numquam officialiter possedisti cape et conditori libera.
将一座城市归还故土 = Urbem conditori redde
在得到城市与归还城市之间作选择，留下外交意义上的战争故事。只在自然出现机会时尝试。 = Restitutionem elige pro quaque expugnatione imperio tuo addenda.
城下解围 = Auxilium ad Portas
不限难度。己方回合开始时，一座自建城市的相邻格有可见的敌对主要文明军事单位；本回合由己方部队或城市击败其中至少一支。到下一己方回合开始，该城始终归己方，且相邻格已没有任何可见的敌对主要文明军事单位。若本局先取得正式胜利，则在胜利结算时核对剩余观察条件。 = In qualibet difficultate centuria militaris hostilis visibilis magnæ civilitatis urbi a te conditæ initio gressus tui adiacere debet. Centuriæ tuæ aut urbs saltem unam talem centuriam eo gressu vincere debent. Usque ad initium proximi gressus tui urbs tua continue mansisse debet et nullæ centuriæ militares hostiles visibiles magnæ civilitatis adiacere debent. Si victoria officialis partem prius finit, reliquæ condiciones observationis in computatione illius victoriæ examinantur.
击败回合开始时邻接自建城市的一支敌军，下一己方回合确认解围。 = Hostem iuxta urbem a te conditam vince et liberationem obsidionis proximo gressu confirma.
为城下的危机画上句号 = Obsidionem ad finem duc
把兵力和城市火力集中到眼前危机，解除局部压力。不必等别人宣战、凑三杀或故意让城市受伤。 = Contrarium impetum compone et urbem per responsum hostium protege.
不限难度。在与守城主要文明的同一场战争中，先由己方攻城单位或远程海军对城市造成正数伤害，再由另一支具备近战占城能力的部队战斗占领该城并完成归属选择。允许跨回合；议和或城市中途转手后重新开始。交易取得、直接解放不计。 = In qualibet difficultate, durante eodem bello contra magnam civilitatem defensorem, primum urbi damnum positivum centuria obsidionali aut navali eminus pugnante infer, deinde alia centuria comminus pugnare capace pugnando cape et electionem possessionis perfice. Actiones plures gressus complecti possunt. Pax aut interposita mutatio possessionis ordinem restituit. Commercia et directa liberatio non valent.
让攻城单位或远程海军先伤害敌城，再由另一支部队战斗占领。 = Urbem hostilem igne obsidionali aut navali eminus læde, deinde alia centuria cape.
让支援与攻城各司其职 = Auxilium et impetus una agant
选择支援火力和夺城部队，组织真正的联合攻坚；允许轮换和损失，不用留残血给指定兵种。 = Igni auxiliari et centuriæ capienti munera inter se complentia da.
战后新生 = Urbs Renata
不限难度。战斗取得一座其他主要文明建立的城市并持续保有；抵抗结束时记录人口基准。此后在该城已连接首都的结算中，以正常粮食增长使人口超过该基准。无抵抗时以收城结算后人口为基准；直接赠送人口不能单独完成。 = In qualibet difficultate urbem ab alia magna civilitate conditam pugnando cape et continue retine. Multitudinem inscribe cum resistentia finitur, aut post computationem captionis si nulla resistentia est. In computatione posteriore, dum capiti coniungitur, incrementum ordinarium a cibo multitudinem supra illud fundamentum augere debet. Multitudo directe data sola condicionem perficere non potest.
保有战斗取得的城市，抵抗结束后连接首都，并让人口以粮食增长超过基准。 = Urbem captam retine, resistentiam fini, capiti coniunge et cibo supra fundamentum eius auge.
让战后的城市重新生长 = Urbs post bellum iterum crescat
从拿下城市转向让城市重新发展，安排交通、粮食和治理。无需同时维持全帝国财政、幸福等多重指标。 = Successum militarem in urbem operantem crescentemque converte.
罗马传承 = Hereditas Romana
不限难度，使用罗马。在两座不同自建分城各通过正常生产完成一座普通建筑；各自至少一次实际生产结算因首都已有相应建筑而获得罗马加成，完成时加成条件仍有效。建筑可不同；直接购买完成、世界及国家奇观不计。分城可以先开工，不必等首都先完成才排队。 = Ut Roma in qualibet difficultate ædificium ordinarium fabricatione ordinaria in utraque duarum diversarum urbium non capitalium a te conditarum perfice. Quæque beneficium Romanum in vera computatione fabricationis accepisse debet quia caput ædificium respondens possidebat; hæc condicio in perfectione adhuc valere debet. Ædificia differre possunt. Emptiones, miracula mundi et miracula nationalia non numerantur. Constructionem ante caput perficiens incipere permittitur.
让两座自建分城各通过实际享受罗马加成的普通生产完成一座建筑。 = Ædificium ordinario modo productum in utraque duarum urbium satellitum a te conditarum beneficio fabricationis Romano perfice.
让首都的积累惠及分城 = Caput novas urbes adiuvet
用首都积累带动分城建设，按各城需求选择建筑。体现罗马能力，不要求五城都造兵营或等十人口。 = Capite utere ad urbes diversis necessitatibus adiuvandas.
连弩初试 = Ballista Repetens
不限难度，使用中国。同一支诸葛弩在一个己方回合内，对主要文明军事单位或城市完成两次主动攻击，两次均造成正数伤害，并持续归己方、存活至下一己方回合开始。可以攻击同一目标，不要求击杀或实战晋升；两次攻击均须发生在诸葛弩形态。若本局先取得正式胜利，则在胜利结算时核对剩余观察条件。 = Ut Sina in qualibet difficultate una Chu-Ko-Nu duos impetus activos in uno gressu contra centurias militares aut urbes magnæ civilitatis facere debet, quoque damnum positivum inferens. Viva et continue tua manere debet usque ad initium proximi gressus tui. Eadem meta bis oppugnari potest; cædes et promotiones acquisitæ non requiruntur. Ambo impetus in forma Chu-Ko-Nu fieri debent. Si victoria officialis partem prius finit, reliquæ condiciones observationis in computatione illius victoriæ examinantur.
同一支诸葛弩本回合主动攻击两次并造成伤害，存活至下一己方回合。 = Duos impetus damnosos una Chu-Ko-Nu in gressu fac et eam usque ad proximum gressum tuum retine.
让连弩接连出击，带它平安归来 = Bis feri et centuriam domum reduc
决定第二次攻击打谁，以及如何保护射击后的部队。直接体验连射能力，不用先养经验、喂两个残血目标。 = Alteram metam elige dum protectionem aggressoris paras.
山间粮仓 = Granarium Montanum
不限难度，使用印加。在自建城市可工作范围内完成一处邻接至少两座山脉的梯田，并让市民在至少一次实际粮食结算中工作该地块；结算时梯田未被掠夺、仍属己方。不限城市人口，不要求三处梯田。 = Ut Incæ in qualibet difficultate Agrum Scalarum saltem duobus montibus adiacentem in area colenda urbis a te conditæ perfice. Civis eum saltem per unam veram computationem cibi colere debet dum tuus et non direptus manet. Nullus terminus multitudinis aut agri additi requiruntur.
建成一处邻接两座山脉的梯田，并让市民实际工作它一次。 = Agrum Scalarum iuxta saltem duos montes ædifica et per veram computationem cibi cole.
在群山之间收获粮食 = Cibum inter montes mete
识别合适的山间丘陵，把地形限制变为粮食优势。只在已经发现合适位置时推荐。 = Solum agnosce quod impedimenta montium in cibum convertit.
来去如风 = Ut Ventus Equitare
不限难度，使用蒙古。同一支怯薛骑兵在一个己方回合中，先主动攻击主要文明军事单位或城市并造成正数伤害，再主动移动到另一格，并持续归己方、存活至下一己方回合开始。攻击和移动均发生在怯薛形态；强制传送不计。若本局先取得正式胜利，则在胜利结算时核对剩余观察条件。 = Ut Mongolia in qualibet difficultate una Keshik centuriam militarem aut urbem magnæ civilitatis active oppugnare et damnum positivum inferre debet, deinde sponte in aliam aream eodem gressu moveri. Viva et continue tua manere debet usque ad initium proximi gressus tui. Ambæ actiones in forma Keshik fieri debent; translatio coacta non numeratur. Si victoria officialis partem prius finit, reliquæ condiciones observationis in computatione illius victoriæ examinantur.
同一支怯薛骑兵攻击造成伤害后主动换格，存活至下一己方回合。 = Una Keshik oppugna, in aliam aream move et eam usque ad proximum gressum tuum retine.
射击之后，寻找下一处阵地 = Alium locum post iaculandum inveni
预留移动力，在射击后选择撤离、侧移、让路或继续推进；完成一次即可，不把后撤规定为唯一正确解法。 = Motum ad recessum, recollocationem, viam aperiendam aut progressum serva.
殊途同归 = Diversæ Viæ
不限难度。三个不同合格自由对局分别取得三种不同的非时间胜利，从科技、文化、征服、外交中任选三种。同一局游戏 只贡献首个正式终局结果；重载、复制存档不增加局数或胜利种类。 = In qualibet difficultate tria diversa genera victoriæ non Temporis ex Scientifica, Eruditionis, Dominationis et Diplomatica obtine, quodque in alia parte liberi ludi idonea. Solus primus exitus officialis finalis cuiusque identificatorii partis numeratur. Servata iterum onerata aut duplicata nec partes nec genera victoriæ addunt.
在三个不同的合格对局中，取得三种不同的非时间胜利。 = Tria diversa genera victoriæ non Temporis in tribus diversis partibus idoneis obtine.
用三种方式走向胜利 = Tres vias ad victoriam inveni
走出熟悉的一种打法，体验三种不同战略。次数对应策略种类，不是把同一局再刷两遍。 = Diversa consilia explora potius quam unam viam notam repetere.
五波之后 = Post Quinque Undas
无尽，轻松或野蛮均可。同一次挑战首次在期限内清除第一关全部五波，进入关卡完成结算，且核心仍归己方。 = In Infinito celeritate Relaxata aut Brutali omnes quinque undas primi gradus intra terminum uno conatu dele et computationem perfectionis gradus attinge dum nucleus tuus manet.
在期限内清除第一关的五波敌军，并保有核心城市。 = Omnes quinque undas primi gradus ante terminum eius dele nucleo retento.
守过第一关的五波来敌 = Per primas quinque undas sustine
将布防、资源与波次处理贯穿一整个关卡，获得清楚的首次通关反馈。 = Copiarum ordinationem, merces et undas regendas per totum gradum duc.
三城同守 = Tres Urbes Stant
无尽，轻松或野蛮均可。已解锁三城容量；某关第一波出现前已拥有三座城市，从第一波出现到该关按时完成，这三城持续归己方。不限必须哪一关完成，不限制部队损失和关间奖励选择。 = In Infinito utraque celeritate capacitatem trium urbium resera et tres urbes ante primam undam gradus apparentem posside. Omnes tres continue retine donec ille gradus tempore perficitur. Quilibet gradus valere potest; damna centuriarum et electiones præmiorum inter gradus non limitantur.
一关首波来临前已有三城，持续保有这三城直到按时过关。 = Tres urbes ante initium gradus posside et continue retine donec tempore perficias.
让三座城市一同守到关末 = Tres urbes usque ad finem stantes serva
主动扩张后承担更复杂的防线，安排机动支援与城市分工；不是要求所有玩家都建满三城。 = Electiones defensivas ab amplificatione creatas accipe et auxilium inter urbes divide.
不息战线 = Acies Non Fracta
无尽，野蛮节奏。在同一次挑战中完成前三关。允许正常领取金币或增援；不同挑战的通关数不能相加。 = In Infinito celeritate Brutali gradus primum ad tertium in eodem conatu perfice. Præmia ordinaria solidorum et supplementorum permittuntur. Gradus ex diversis conatibus addi non possunt.
在同一次野蛮节奏挑战中，完成前三关。 = Primos tres gradus in uno conatu celeritate Brutali perfice.
在野蛮节奏中连过三关 = Tres gradus celeritate Brutali perfice
在没有关间休整的节奏中管理资源与兵力，准备连续作战，而非跨局凑次数。 = Copias et merces per pugnas continuas administra.
