I am William of Orange, stadtholder of The Netherlands. Did you need anything? I still have a lot to do. = Sum Gulielmus Arausionensis, præfectus Nederlandiæ. Aliquid eges? Multa adhuc mihi facienda sunt.
I believe I have something that may be of some importance to you. = Credo me aliquid habere quod tibi magni momenti esse possit.
Once again, greetings. = Iterum salve.
Dutch East India Company = Societas Batava Indiae Orientalis
Greetings to the wise and brave Prince William of Orange, who freed the Netherlands and gave strength to the Dutch people. In 1568, you led a rebellion against Spanish dominion, to gain freedom for your people, and therefore starting the Eighty Years' War. Your actions were all aimed to create one of Europe's first modern republics, the Seven United Provinces. The rebellion was the meaning of your very life and death, as it was also the cause of your assassination in 1584. But your death has given even more pride and courage to your people, to fight for liberty against any oppressors. Carved in history as the 'Father of the Fatherland', your name is a symbol of Dutch independence for eternity. = Salve sapiens fortisque Princeps Gulielmus Arausionensis, qui Nederlandiam liberavisti populumque Batavum firmavisti. Anno 1568 seditionem contra dominium Hispanicum duxisti ut libertatem populo tuo acquireres, sic Bellum Octoginta Annorum incipiens. Omnia facta tua ad unam primarum rerum publicarum recentium Europæ creandam spectabant: Septem Provincias Unitas. Seditio fuit sensus vitæ ipsius tuæ mortisque, cum etiam causa cædis tuæ anno 1584 esset. Sed mors tua etiam maiorem superbiam audaciamque populo dedit ut pro libertate contra quemlibet oppressorem pugnaret. In historia ut «Pater Patriæ» incisum, nomen tuum libertatis Batavæ signum in æternum est.
Brave Prince, your people ask for your wisdom to gain its freedom once more, and to illuminate the world with progressive and modern ideas. Will your new empire shine through the ages of history? = Fortis Princeps, populus tuus sapientiam tuam petit ut libertatem iterum acquirat mundumque ideis novis recentibusque illuminet. Splendebitne novum imperium tuum per ætates historiæ?
