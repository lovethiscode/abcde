Napoleon = Neapolio I
You're disturbing us, prepare for war. = Nos vexas; te ad bellum para.
You've fallen into my trap. I'll bury you. = In insidias meas incidisti. Te sepeliam.
I congratulate you for your victory. = Tibi de victoria gratulor.
Welcome. I'm Napoleon, of France; the smartest military man in world history. = Salve. Sum Napoleon Galliæ, sollertissimus miles historiæ mundi.
France offers you this exceptional proposition. = Gallia hanc singularem condicionem tibi offert.
Hello. = Salve.
It's you. = Tu es.
Ancien Régime = Vetus Regimen
Vive Napoleon I, First Consul and Emperor of France! After the glorious Revolution which suppressed the centuries-old monarchy, the French nation stood at the heart of Europe as a Republic, and intended to export its ideals to the entire European continent, either by diplomacy or war. The French Capital Paris was more than ever the world center of Culture, Arts, and Letters. With its Great Army, reputed as one of the greatest in the History, France fought gloriously all surrounding enemies, but eventually fell against the coalition of other European powers. = Vivat Napoleon I, Primus Consul et Imperator Galliæ! Post gloriosam Revolutionem quæ monarchiam sæculorum delevit, gens Gallica in corde Europæ stetit ut Res Publica, suaque exempla toti Europæ rebus externis aut bello propagare voluit. Caput Gallicum Lutetia magis quam umquam centrum mundi Culturæ, Artium et Litterarum fuit. Magno Exercitu, inter maximos historiæ habito, Gallia contra omnes vicinos hostes gloriose pugnavit, tandem tamen contra coalitionem ceterarum potestatum Europæ cecidit.
Napoleon Bonaparte, ruler of the French people, will you rebuild the Empire to take revenge on your foes, and make again of its Capital the City of Lights? Will your new empire shine through the ages of history? = Napoleon Bonaparte, populi Gallici rector, restituesne Imperium ut hostes ulciscaris et Caput iterum Urbem Luminum facias? Splendebitne novum imperium tuum per ætates historiæ?
