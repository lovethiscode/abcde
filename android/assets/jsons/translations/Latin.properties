Pachacuti = Pachacuti
Resistance is futile! You cannot hope to stand against the mighty Incan empire. If you will not surrender immediately, then prepare for war! = Resistere inutile est! Spem contra potens imperium Incarum standi non habes. Nisi statim te dedis, ad bellum te para!
Declare war on me?!? You can't, because I declare war on you first! = Bellum contra me indicere?!? Tu non potes, quia ego primitus indico bellum contra te!
How did you darken the sun? I ruled with diligence and mercy—see that you do so as well. = Ut obscuravisti solem? Cum diligentia et clementia regebam—videam te ita facere.
How are you? You stand before Pachacuti Inca Yupanqui. = Ut vales? Statis ante Pachacuti Inca Yupanqui.
The Incan people offer this fair trade. = Populus Incarum offert hanc justam mercaturam.
How are you doing? = Ut vales?
What do you want now? = Quod vis jam?
Great Andean Road = Via Magna Andium
King Pachacuti Sapa Inca, maker of the world and ruler of Tawantinsuyu and the Inca people, your loyal subjects greet you! In the beginning, the small state of Cusco already showed the Incans were promised for greatness. They won many wars against powerful enemies, relentlessly crushing any army that dared oppose them, and forged a mighty empire stretching from Ecuador to Chile, the greatest ever seen in pre-Columbian America. Not just undaunted soldiers, Inca people were accomplished builders and artists, their magnificient and unequalled culture still fascinating the world today. = Rex Pachacuti Sapa Inca, mundi factor et rector Tawantinsuyu populique Incarum, fideles subditi te salutant! Initio parva civitas Cusco iam ostendit Incas magnitudini destinatos esse. Multa bella contra potentes hostes vicerunt, quemlibet exercitum obsistere ausum sine requie conterentes, et potens imperium ab Ecuador ad Chile tendens fecerunt, maximum in America præ-Columbiana visum. Non tantum milites intrepidi, Incæ etiam periti ædificatores artificesque erant; magnifica inæqualisque eorum cultura mundum hodie adhuc allicit.
O Emperor Pachacuti, honor your name of 'Earth Shaker'! Will you once again summon the power of the earth to unite all Incan people under the protection of Sapa Inca, the Son of the Sun? Will your new empire shine through the ages of history? = O Imperator Pachacuti, honora nomen tuum «Terræ Quassator»! Iterumne potestatem terræ evocabis ut omnes Incas sub tutela Sapa Inca, Filii Solis, unias? Splendebitne novum imperium tuum per ætates historiæ?
