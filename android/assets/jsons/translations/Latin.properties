If the city doesn't have enough XP it will not apply all the promotions. And default promotions doesn't affect the civ AI in anyway. = Si urbs satis experientiæ non habet, non omnes promotiones adhibentur. Promotiones prædefinitæ intelligentiam artificialem civilitatis nullo modo afficiunt.
