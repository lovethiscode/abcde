Harald Bluetooth = Haraldus Dens Cæruleus
If I am to be honest, I tire of those pointless charades. Why don't we settle our disputes on the field of battle, like true men? Perhaps the skalds will sing of your valor... or mine! = Ut verum dicam, harum ineptarum simulationum tædet. Cur controversias in acie, ut veri viri, non solvimus? Fortasse poetæ virtutem tuam canent…aut meam!
Ahahah! You seem to show some skills of a true Viking! Too bad that I'll probably kill you! = Ahahah! Aliquam veri Vicingi artem ostendere videris! Malum est quod te verisimiliter occidam!
Loki must have stood by you, for a common man alone could not have defeated me... Oh well! I will join the einherjar in Valhalla and feast, while you toil away here. = Loki tibi adstitisse debet, nam homo vulgaris solus me vincere non potuisset…Bene! In Valhalla cum einherjar epulabor, dum tu hic laboras.
Our future battle will be glorious! = Pugna nostra futura gloriosa erit!
Harald Bluetooth bids you welcome to his lands, a Viking unlike any the seas and lands have ever known! Hah, are you afraid? = Haraldus Dens Cæruleus te in terras suas salutat, Vicingus qualem maria terræque numquam viderunt! Ha, timesne?
This is a fine deal! Even a drunk beggar would agree! = Hæc bona pactio est! Etiam mendicus ebrius assentiretur!
Hail to you. = Have.
Viking Fury = Furor Vicingorum
Skal, Harald Bluetooth Gormsson, son of King Gorm of the Old and Thyra Dannebod! After crushing the armies of Norway, you achieved great construction projects all across the land of mighty Denmark. Numerous Ring Fortresses were built under your reign to protect the people from foreign invasions, but also from local quarrels. In 983 AD, you successfully repelled several waves of German settlers trying to colonize your land, and then always kept your kingdom free from any foreign pressure. = Skal, Haraldus Dens Cæruleus Gormsson, fili Regis Gorm Veteris et Thyra Dannebod! Exercitibus Norvegiæ oppressis, magna opera constructionis per totam potentem Daniam perfecisti. Multæ arces anulares sub tuo regno ædificatæ sunt ut populum ab externis invasionibus et localibus quoque discordiis protegerent. Anno 983 post Christum plures fluctus colonorum Germanorum terram tuam occupare conantium prospere repulisti atque regnum semper liberum ab omni externa vi servavisti.
As a true Viking, who knows not fear, time has come to unleash mighty armies of Northsmen to bring despair upon your enemies! By the will of the Gods, it will be either a glorious triumph or a sumptuous feast in the Valhalla! Will your new empire shine through the ages of history? = Ut verus Vicingus metum nesciens, tempus est magnos exercitus Septentrionalium emittere ut hostes desperent! Voluntate Deorum aut gloriosus triumphus aut magnificum convivium in Valhalla erit! Splendebitne novum imperium tuum per ætates historiæ?
