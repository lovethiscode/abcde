原创战役共有四章十六关。每关至少获得一颗星，解锁下一关。\n完成本章获得章节完成记录；全部三星可获得精通勋章。\n各关的局势与目标独立，已通关关卡可反复挑战。 = Expeditio originalis quattuor capita et sedecim munera habet. Saltem unam stellam acquire ad proximum munus reserandum.\nCaput perfice ut progressum serves; omnes stellas acquire ad numisma peritiæ eius.\nQuodque munus suum statum propositaque habet. Munera perfecta iterum ludi possunt.
