You aren't meeting my expectations. You can do so much better. = Spem meam non exples. Multo melius facere potes.
The Phoenicians welcome you to this most pleasant kingdom. I am Dido, the queen of Carthage and all that belongs to it. = Phœnices te in hoc iucundissimo regno salutant. Sum Dido, regina Carthaginis et omnium ad eam pertinentium.
I just had the marvelous idea, and I think you'll appreciate it too. = Modo miram ideam habui, quam tibi quoque placituram puto.
What is it now? = Quid nunc est?
Phoenician Heritage = Hereditas Phoenicia
Greetings to you, revered Queen Dido, ruler of the legendary kingdom of Carthage. The great poet Virgil related your great history, how your husband Acerbas was murdered by your own brother, King Pygmalion of Tyre, to steal the treasures of your family that were rightfully yours. But you endured his pressure until you and your compatriots decided to flee and sail for new lands. The gods led you to the shores of North Africa, and with cunning diplomacy, you expanded the territory of your new home, and laid the basis for the future kingdom of Carthage. = Salve veneranda Regina Dido, rectrix fabulosi regni Carthaginis. Magnus poeta Vergilius magnam historiam tuam narravit: quomodo maritus tuus Acerbas a fratre tuo, Rege Pygmalione Tyri, occisus sit ut thesauros familiæ iure tuos auferret. Sed vim eius pertulisti donec tu civesque tui fugere et ad novas terras navigare decrevistis. Di vos ad litora Africæ Septentrionalis duxerunt; callidis rebus externis fines novæ domus ampliasti et fundamenta futuri regni Carthaginis posuisti.
Clever and proud Dido, the storm is coming and your people look for a shelter under your wise and powerful protection. Can you create a new and radiant Carthage able to cleave the darkness? Will your new empire shine through the ages of history? = Callida superbaque Dido, tempestas venit et populus tuus sub sapienti potentique tutela tua refugium quærit. Potesne novam fulgentemque Carthaginem creare quæ tenebras scindat? Splendebitne novum imperium tuum per ætates historiæ?
