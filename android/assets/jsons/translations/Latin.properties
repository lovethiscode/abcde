Maria Theresa = Maria Theresia
Shame that it has come this far. But ye wished it so. Next time, be so good, choose your words more wisely. = Dedecet res tam longe progressas esse. Sed sic voluisti. Proximo tempore, quæso, verba sapientius elige.
What a fool ye are! Ye will end swiftly and miserably. = Quam stultus es! Cito misereque finieris.
The world is pitiful! There's no beauty in it, no wisdom. I am almost glad to go. = Mundus miserandus est! Nulla in eo pulchritudo, nulla sapientia. Paene gaudeo abire.
The archduchess of Austria welcomes your Eminence to... Oh let's get this over with! I have a luncheon at four o'clock. = Archiducissa Austriæ Eminentiam tuam salutat in…O, hoc perficiamus! Prandium hora quarta habeo.
