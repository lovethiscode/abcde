# These will be automatically copied to the fastlane descriptions used by F-Droid. Their keys are not as usual the english original, please read those directly as linked.

# Documentation: https://f-droid.org/en/docs/Build_Metadata_Reference/#Summary
# English to translate: https://github.com/yairm210/Unciv/blob/master/fastlane/metadata/android/en-US/short_description.txt
Fastlane_short_description = Ludus apertus quattuor-X aedificationis civilizationis

# Documentation: https://f-droid.org/en/docs/Build_Metadata_Reference/#Description
# English to translate: https://github.com/yairm210/Unciv/blob/master/fastlane/metadata/android/en-US/full_description.txt
Fastlane_full_description = Versio fonte aperto recreata celeberrimi omnium temporum ludi de civilizationibus aedificandis — celeris et exigua!\n\nExstrue civilizationem tuam, investiga technologias, amplifica urbes tuas et hostes vince!\n\nRogata? Errores? Visne progressionem adiuvare? Index rerum faciendarum ad https://github.com/jerry8870/Unciv4iOS invenitur.\n\nQuaestiones? Sententiae? Nobiscum in Discord coniungere potes ad https://discord.gg/bjrB4Xw ;)\n\nVisne ludum in linguam tuam transferre? Vide https://yairm210.github.io/Unciv/Translating/Translating/\n\nMundus te exspectat! Exstruesne civilizationem tuam in imperium quod temporis probationem sustineat?\n\nPermissio «plenum aditum ad rete habere» necessaria est ad recepta ab usuario inchoata atque ad ludum plurium lusorum. Omnes aliae permissiones enumeratae automatice ab API includuntur, quo notificationes vicium in ludo plurium lusorum efficiuntur. Permissiones retis adhibentur ad mutationes enumerandas et recipiendas, musicam recipiendam atque ludos plurium lusorum mittendos et recipiendos. Unciv nullam aliam communicationem per interrete inchoat.


