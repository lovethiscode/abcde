Sejong = Sejong
Jip-hyun-jun (Hall of Worthies) will no longer tolerate your irksome behavior. We will liberate the citizens under your oppression even with force, and enlighten them! = Jip-hyun-jun (Aula Dignorum) mores tuos molestos diutius non tolerabit. Cives a te oppressos etiam vi liberabimus et illuminabimus!
Foolish, miserable wretch! You will be crushed by this country's magnificent scientific power! = Stulte miser infelix! Magnifica huius terræ potestate scientifica contereris!
Now the question is who will protect my people. A dark age has come. = Nunc quæstio est quis proteget populum meum. Sæculum obscurum appropinquavit.
Your words reveal more of your own prejudice than any fault in my own. = Verba tua plus de tuo præiudicio quam de mea culpa aperiunt.
Welcome to the palace of Choson, stranger. I am the learned King Sejong, who looks after his great people. = Salve in palatio Choson, hospes. Sum doctus Rex Sejong, qui magnum populum suum curat.
We have many things to discuss and have much to benefit from each other. = Multa nobis disserenda sunt et multum alter ab altero lucrari possumus.
Oh, it's you = O, tu es
Scholars of the Jade Hall = Discipuli Aulae Lapidis Pulchri
Greetings to you, King Sejong the Great, heir of the Choson Dynasty! Prosperity and benevolence towards the common man are the principles of your reign, and made of you the most beloved Korean king. You always aimed to provide a fair and equal society for all your people, and also to favor knowledge and technological discoveries. Your wisdom and intelligence imbued all the Korean society, and the scholars of the Jade Hall developed Korea's first written language, Hangul, sharing further literature and science to the people after centuries of darkness. = Salve Rex Sejong Magne, heres dynastiæ Choson! Prosperitas et benevolentia erga vulgum sunt principia regni tui et te regem Coreanum maxime dilectum fecerunt. Societatem omnibus iustam æquamque semper præbere voluisti, scientiæ et inventis technologicis favens. Sapientia et ingenium tuum totam societatem Coreanam imbuerunt; docti Aulæ Iaspidis primam Coreæ scripturam, Hangul, creaverunt, litteras scientiamque populo post sæcula tenebrarum latius dantes.
Wise Sejong, will you gift your people with the radiance of harmony and knowledge to dispel the darkness once again? Will your new empire shine through the ages of history? = Sapiens Sejong, dabisne populo tuo concordiæ et scientiæ splendorem ut tenebræ iterum fugentur? Splendebitne novum imperium tuum per ætates historiæ?
