Click on the tech button → Select technology → Click 'Research' (bottom right). = Bullam technologiæ preme → Technologiam elige → «Investigare» preme (infra dextra).

Pick a construction! = Elige constructionem!
Enter city screen → Click on a unit or building → Click 'add to queue'. = Paginam urbis intra → Centuriam vel ædificium preme → «Ad agmen adde» preme.

Pass a turn! = Gressum perficias!
Cycle through units with 'Next unit' → Click 'Next turn'. = Centurias percurre per «Centuria proxima» → «Gressus proximus» preme.

Reassign worked tiles! = Muta tegulas operandas!
Enter city screen → Click the assigned tile to unassign → Click an unassigned tile to assign population. = Paginam urbis intra → Aream assignatam preme ut eam liberes → Aream liberam preme ut cives assignes.

Got it = Scio
Meet another civilization! = Aliam civilitatem conveni!
Explore the map until you encounter another civilization! = Tabulam explora donec aliam civilitatem convenias!

Open the options dialog! = Evoca dialogum optionum!
Click the menu button (top left) → Click 'Options'. = Bullam indicis preme (supra sinistra) → «Optiones» preme.

Construct an improvement! = Construe meliorationem!
Construct a Worker unit → Move it to a Plains or Grassland tile → Click 'Construct improvement' → Choose the farm → Leave the worker there until it's finished. = Centuriam Opificis construe → In aream Camporum vel Prati move → «Emendationem construere» preme → Agrum elige → Opificem ibi relinque donec perficiatur.

Create a trade route! = Viam commercii facias!
Construct roads between your capital and another city. Or, automate your worker and let him get to that eventually. = Vias inter caput tuum et aliam urbem construe. Vel opificem automatum fac et sine eum tandem ad hoc pervenire.

Conquer a city! = Vincas urbem!
Bring an enemy city down to low health → Enter the city with a melee unit. = Valetudinem urbis hostilis ad humilem gradum redige → Cum centuria comminus pugnante urbem intra.

Move an air unit! = Move centuriam aeriam!
Select an air unit → Select another city within range → Move the unit to the other city. = Centuriam aeriam elige → Aliam urbem intra spatium elige → Centuriam in aliam urbem move.

See your stats breakdown! = Enarrationem statisticarum tuarum vide!
Enter the Overview screen (top right corner) → Click on 'Stats'. = Paginam Summarii intra (angulo dextro superiore) → «Statisticæ» preme.


