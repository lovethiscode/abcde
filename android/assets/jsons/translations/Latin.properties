Hiawatha = Hiawatha
You are a plague upon Mother Earth! Prepare for battle! = Pestis es in Terra Matre! Ad pugnam te para!
You evil creature! My braves will slaughter you! = Creatura mala! Bellatores mei te trucidabunt!
You have defeated us... but our spirits will never be vanquished! We shall return! = Vicisti nos... sed spiriti nostri numquam evincentur! Nos revertamur!
Words alone cannot shake the roots of peace I have planted among my people. = Sola verba radices pacis inter populum meum plantatas quassare non possunt.
Greetings, stranger. I am Hiawatha, speaker for the Iroquois. We seek peace with all, but we do not shrink from war. = Salve, hospes. Sum Hiawatha, orator Iroquesorum. Pacem cum omnibus quærimus, sed bellum non refugimus.
Does this trade work for you, my friend? = Placetne tibi hæc commutatio, amice?
The Great Warpath = Via Magna Bellica
Greetings, noble Hiawatha, leader of the mighty Iroquois nations! Your people lived near the great and holy lake Ontario since the ancient ages, on a land that will be later known as New York city. Long ago, the five peoples of Seneca, Onondaga, Mohawks, Cayugas and Oneida became one nation, the Haudenosaunee, the Iroquois. Although not having a written language, the wise Iroquois created the Great Law of Peace, which can be considered the first established constitution. For decades, your people fought powerful enemies, such as the Huron, and then the French and English colonists. With less warriors and inferior weaponry, the Iroquois still survived and walk on the path of peace and harmony, until their way of living faded away under the crush of the newborn United States nation. = Salve nobilis Hiawatha, dux potentium gentium Iroquesarum! Populus tuus prope magnum sanctumque lacum Ontario ab antiquis ætatibus habitavit, in terra quæ postea urbs Novum Eboracum nominaretur. Olim quinque populi Seneca, Onondaga, Mohawks, Cayugas et Oneida una gens facti sunt: Haudenosaunee, Iroquesi. Etsi scripturam non habebant, sapientes Iroquesi Magnam Legem Pacis creaverunt, quæ prima constitutio stabilita haberi potest. Per decennia populus tuus contra potentes hostes ut Huron, deinde colonos Francos Anglosque pugnavit. Paucioribus bellatoribus et inferioribus armis Iroquesi tamen superfuerunt viamque pacis et concordiæ secuti sunt, donec vivendi modus sub vi novæ gentis Civitatum Unitarum evanesceret.
Great Sachem Hiawatha, do you hear the complaints of your people? Can you light the path leading to the ancient Iroquois union? Will your new empire shine through the ages of history? = Magne Sachem Hiawatha, audisne querelas populi tui? Potesne viam ad antiquam unionem Iroquesorum illuminare? Splendebitne novum imperium tuum per ætates historiæ?
