#################### Lines from VictoryTypes from Civ V - Vanilla ####################

Complete all the spaceship parts to win! = Perficias omnes partes astronavis ut victoriam feras!
spaceship parts = partes astronavis
You have achieved victory through mastery of Science! You have conquered the mysteries of nature and led your people on a voyage to a brave new world! Your triumph will be remembered as long as the stars burn in the night sky! = Victoriam dominio Scientiæ consecutus es! Mysteria naturæ vicisti et populum tuum in iter ad novum audacem mundum duxisti! Triumphus tuus memorabitur dum stellæ in cælo nocturno ardent!

Complete 5 policy branches and build the Utopia Project to win! = Compleas 5 ramos dictati et aedifices Propositum Utopiae ut victoriam feras!
You have achieved victory through the awesome power of your Culture. Your civilization's greatness - the magnificence of its monuments and the power of its artists - have astounded the world! Poets will honor you as long as beauty brings gladness to a weary heart. = Victoriam mira potestate Culturæ tuæ consecutus es. Magnitudo civilitatis tuæ, magnificentia monumentorum et potestas artificum, mundum obstupefecit! Poetæ te honorabunt dum pulchritudo cordi fesso gaudium affert.

Capture all enemy Capitals to win! = Omnes metropoles hostiles capias ut victoriam feras!
The world has been convulsed by war. Many great and powerful civilizations have fallen, but you have survived - and emerged victorious! The world will long remember your glorious triumph! = Mundus bello convulsus est. Multæ magnæ potentesque civilitates ceciderunt, sed tu superfuisti et victor emersisti! Mundus gloriosum triumphum tuum diu memorabit!

Build the UN and be voted world leader to win! = Aedifices UN et sufficiaris dux mundi ut victoriam feras!
Anyone should build [buildingFilter] = Aliquis ædificet [buildingFilter](m/s/um/os)
Win diplomatic vote = In suffragatione diplomatica vincas
You have triumphed over your foes through the art of diplomacy! Your cunning and wisdom have earned you great friends - and divided and sown confusion among your enemies! Forever will you be remembered as the leader who brought peace to this weary world! = Hostes tuos arte rerum externarum superavisti! Calliditas sapientiaque magnos tibi amicos paraverunt atque hostes diviserunt confusioneque compleverunt! Semper memoraberis ut dux qui pacem huic mundo fesso attulit!

Do things to win! = Res facias ut victoriam feras!
Have highest score after max turns = Habeas plurimos calculos indicis post maximum numerum gressuum


