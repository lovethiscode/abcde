Darius I = Darius I
Your continue existence is an embarrassment to all leaders everywhere! You must be destroyed! = Vestra continua exsistentia omnibus ubique rectoribus dedecori est! Delendi estis!
Curse you! You are beneath me, son of a donkey driver! I will crush you! = Maledictus sis! Infra me es, fili asinarii! Te conteram!
You mongrel! Cursed be you! The world will long lament your heinous crime! = Hybrida! Maledictus sis! Mundus diu scelus tuum nefandum lugebit!
Peace be on you! I am Darius, the great and outstanding king of kings of great Persia... but I suppose you knew that. = Pax tibi! Ego sum Darius rex regum magnus atque insignis magnæ Persiæ... sed censeo te scire.
In my endless magnanimity, I am making you this offer. You agree, of course? = Infinita mea magnanimitate hanc tibi facio oblationem. Assentiris sane?
Good day to you! = Bonus tibi dies sit!
Ahh... you... = A... tu...
Achaemenid Legacy = Hereditas Achaemenidarum
Great King Darius of Persia, the heaven casts its light upon you! Persian people are strong and wise, as their leader. In old ages, the great Persian king Cyrus fought back the mighty Median empire and finally destroyed the Medes in 550 BC. Cunning diplomacy and military achievements helped then to conquer the wealthy Lydia and the powerful Babylon, Cyrus' son conquering the eternal Egypt some years later. At the height of its power, the Persian Empire reached the shores of Macedonia, at the very door of the upstart Greek city-states. Persia would have prospered for centuries if Alexander of Macedon hadn't brutally destroyed the great empire in one violent strike. = Magne Rex Darius Persarum, cælum lumen in te fundit! Persæ fortes sapientesque sunt sicut dux eorum. Olim magnus rex Cyrus potenti imperio Medorum restitit eosque tandem anno 550 ante Christum delevit. Callida ars rerum externarum et res militares feliciter gestæ eum adiuvaverunt ut divitem Lydiam potentemque Babylonem vinceret; filius Cyri æternam Ægyptum paucis annis post subegit. Summo vigore Imperium Persicum litora Macedoniæ attigit, ad ipsas portas novarum civitatum urbanarum Græcarum. Persia per sæcula floruisset nisi Alexander Macedo magnum imperium uno violento ictu crudeliter delevisset.
King Darius, the people of Persia await, longing for its past glory and power! Persia of the Immortals must reborn, to punish its foes and rebuild the gleaming Persepolis! Will your new empire shine through the ages of history? = Rex Darius, Persæ exspectant, præteritam gloriam potestatemque desiderantes! Persia Immortalium renasci debet ut hostes puniat et fulgentem Persepolim restituat! Splendebitne novum imperium tuum per ætates historiæ?
