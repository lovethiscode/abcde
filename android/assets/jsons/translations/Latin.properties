Oh, it's ye! = O, tu es!
Diplomatic Marriage = Conubium Diplomaticum
Noble and pious Queen Maria Theresa, Holy Roman Empress and sovereign of Austria, the people revere your grace. After the death of your father King Charles VI, you inherited the throne of Austria during difficult economic and military times. But you used your wisdom and unflinching determination to fend off your foes and resolve any obstacles to stability and prosperity. With your husband Francis Stephen at your side as co-ruler, you assured your place as Empress of the Holy Roman Empire. During your reign, you reformed Austria in several domains, as you gifted it with a powerful army, a stable economic model, and an improved educational system. = Maria Theresia, Regina pia ac nobilis, Imperatrix Sacri Romani Imperii et majestatis Austriae, populus reveretur tuam gratiam. Postquam Rex, Carolus VI, pater tuus, erat mortuus, hereditavisti archiducatum Austriae in saeculo difficili de oeconomia et militia. Sed tuâ prudentiâ, destinatione interritâque usa es ad expugnandos hostes tuos et solvisti obstacula cumque ad stabilitem prosperitemque. Cum Francisco Stephano, tuo marito ac pari rectore, tu confirmavisti statum tuum ut Imperatrix Sacri Romani Imperii eras. In dominatione tua, reformavisti Austriam de conspectibus nonnullis, ut donavisti ei legionem potentem, typum stabilem de oeconomia et systema melioratum de eruditione.
O Great Queen, proud and dignified, by the will of God and the Divine right, can you reach the height of prosperity and splendor the kingdom of Austria deserves? Will your new empire shine through the ages of history? = O Regina magna, superbiens ac dignificata, per voluntatem Dei et jus divinum, possisne attingere excelsitatem salutis et decoris quam regnum Austriae mereat? Per aetates historiae lucebitne tuum novum imperium?
