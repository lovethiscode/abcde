Tutorial Task: [Move unit] = Заданя наукы: [Move unit]
Move a unit! = Рушіт формованя!
Click on a unit → Click on a destination → Click the arrow popup. = Натисніт на формованя → Натисніт на ціль → Натисніт на выскакуючу стрілку.

Found a city! = Заложіт варош!
Select the Settler → Click on 'Found city'. = Уберіт поселенця → Натисніт на «Заложити варош».

Enter the city screen! = Войдіт на екран вароша!
Click the city button twice. = Натисніт два раз на кнопку вароша.

Pick a technology to research! = Уберіт технолоґію на изученя!
Click on the tech button → Select technology → Click 'Research' (bottom right). = Натисніт на кнопку технолоґії → Уберіт технолоґію → Натисніт «Изучити» (долов направо).

Pick a construction! = Уберіт проєкт!
Enter city screen → Click on a unit or building → Click 'add to queue'. = Войдіт на екран вароша → Натисніт на формованя ци будову → Натисніт «Додати ид шорови».

Pass a turn! = Пропустіт тяг!
Cycle through units with 'Next unit' → Click 'Next turn'. = Переходьте меджі формованями через «Друге формованя» → Натисніт «Другый тяг».

Reassign worked tiles! = Перерозділіт оброблювані поля!
Enter city screen → Click the assigned tile to unassign → Click an unassigned tile to assign population. = Войдіт на екран вароша → Натисніт на приділене поле, обы го удділити → Натисніт на неприділене поле, обы приділити жытелів.

 # Requires translation!
Got it = Розумію
Meet another civilization! = Стрітіт другу цівілізацію!
Explore the map until you encounter another civilization! = Досліджуйте мапу, докы не стрітите другу цівілізацію!

Open the options dialog! = Удопріт облак наставлінь!
Click the menu button (top left) → Click 'Options'. = Натисніт кнопку меню (горі наліво) → Натисніт «Наставліня».

Construct an improvement! = Створіт поліпшіня!
Construct a Worker unit → Move it to a Plains or Grassland tile → Click 'Construct improvement' → Choose the farm → Leave the worker there until it's finished. = Створіт формованя Робітник → Перемістіт го на поле рівнины ци травника → Натисніт «Створити поліпшіня» → Уберіт ферму → Нехайте там робітника, докы не скінчит.

Create a trade route! = Створіт торговельну путь!
Construct roads between your capital and another city. Or, automate your worker and let him get to that eventually. = Поставте дорогы меджі своїм головным варошом тай другым варошом. Або автоматізуйте робітника тай нехайте го сесе помалы зробити.

Conquer a city! = Добудьте варош!
Bring an enemy city down to low health → Enter the city with a melee unit. = Знижьте здоровля неприятельского вароша → Войдіт до вароша из формованём ближнього боя.

Move an air unit! = Рушіт повітряне формованя!
Select an air unit → Select another city within range → Move the unit to the other city. = Уберіт повітряне формованя → Уберіт другый варош у досягу → Перемістіт формованя до другого вароша.

See your stats breakdown! = Увидьте розпис своїх вартостей!
Enter the Overview screen (top right corner) → Click on 'Stats'. = Войдіт на екран перегляда (правый горішній кут) → Натисніт «Статістіка».


