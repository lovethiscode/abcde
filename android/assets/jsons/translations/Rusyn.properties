You leave us no choice. War it must be. = Не лишили-сьте нам выбора. Буде война.
Very well, this shall not be forgotten. = Добрі-добрі. Сесе мы ніґда не забудеме.
I guess you weren't here for the sprouts after all... = Догадав-им ся, ож вы туйкы не спозад брусельської капусты...
Brussels = Брусел

Bucharest = Bucharest

And so the flower of Florence falls to barbaric hands... = Шкода, ож цвітучі зимні Флоренції трафили до рук варварув...
Florence = Флоренція

Geneva = Geneva

Unacceptable! = Неслобудно!

We... defeated? No... we had so much work to do! = Мы... побіджені? Ні... іще сьме мали тілько роботы!
Kathmandu = Катманду

Today, the Malay people obey you, but do not think this is over... = Ниськы наруд Малайзії пудкорят ся тобі, айбо не думай, ож исе кунець!
Kuala Lumpur = Куала-Лумпур

Perhaps now we will find peace in death... = Може найдеме спокуй у смерти?..
Lhasa = Лгаса

You fiend! History shall remember this! = Ты діявол! Гісторія сесе не забуде!
Milan = Милан

Monaco = Monaco

I have failed. May you, at least, know compassion towards our people. = Я пройграв. Надіву ся, ты будеш добрый ид мому народови.
Cape Town = Кейптаун

How barbaric. Those who live by the sword shall perish by the sword. = Яке варварство. Хто жыє мечом, мечом і згине.
Genoa = Ґенуя

The day of judgement has come to us. But rest assured, the same will go for you! = Исе наш послідній час. Не храбри ся, сесь час буде і у тебе.
Helsinki = Гельсинкі

Ah, Gods! Why have you forsaken us? = Йой, богы! Зашто забыли-сьте за нас?..
Manila = Маніла

Congratulations, conqueror. This tribe serves you now. = Вінчуву, завойовнику. Зараз исе племня у твоюй службі.
Mogadishu = Могадішу

We were too weak to protect ourselves... = Были-сьме но дуже слабинькі, обы ся удбити...
Quebec City = Квебек

Ragusa = Ragusa

I have to do this, for the sake of progress if nothing else. You must be opposed! = Мушу сяк учинити, маймало про проґрес! Тебе мусай зоперти!
You can see how fruitless this will be for you... right? = Видиш, накулько бесплодна твоя ідея... ба ци не так?
May God grant me these last wishes - peace and prosperity for Brazil. = Най Бог исповнит послідньоє мойоє прошеня – мир і процвітаня народови Бразилії!
Rio de Janeiro = Ріо-де-Жанейро

Perhaps, in another world, we could have been friends... = Може, у другум світі бы сьме могли быти приятелями...
Singapore = Сінґапур

After thorough deliberation, Australia finds itself at a crossroads. Prepare yourself, for war is upon us. = По докладнум розважованю ся Австралія нашла на роздоріжю. Готовте ся, бо на нас пришла война.
We will mobilize every means of resistance to stop this transgression against our nation! = Запоїме каждый способ упору, обы заставити сесе нарушіня нашого народа!
The principles for which we have fought will survive longer than any nation you could ever build. = Прінціпы, про котрі сьме боёвали, выжыют довше як котрыйколвек народ, котрый бы сьте могли створити.
Sydney = Сідней

I will enjoy hearing your last breath as you witness the destruction of your realm! = Буду ся тішити из вашого остатнього дыху, покы будете видіти знищіня свойой державы!
Why do we fight? Because Inanna demands it. Now, witness the power of the Sumerians! = Чом боёєме? Бо Інана сесе вымагат. Дораз увидьте силу Шумерів!
What treachery has struck us? No, what evil? = Яка зрада нас трафила? Ні, яке зло?
Ur = Ур

In responding to the unstinting malignancy that has heretofore defined your relationship with Canada, we can have no recourse but war! = На безмірну злобу, котра дотеперь означовала ваші удносины из Канадов, не можеме одповісти ніяк, лем войнов!
As we can reach no peaceful resolution with you, Canada must turn, with reluctance, to war. = Бо из вами не можеме досягнути мирне розрішіня, Канада ся мусит нерадо обернути ид войні.
I regret not defending my country to the last, although it was not of use. = Баную, же єм свою державу не боронив до кінця, хоць сесе не было хосенне.
Vancouver = Ванкувер

You have revealed your purposes a bit too early, my friend... = Крехта-сь зарано удкрыв ся ми, цімборику
A wrong calculation, on my part. = Неправильноє обчекованя 
Venice = Венеція

They will write songs of this.... pray that they shall be in your favor. = Будуть о сём писати співанкы....моліт ся, обы были на вашу хвалу.
Antwerp = Антверпы

May the Heavens forgive you for inflicting this humiliation to our people. = Най вам небеса удпустят, же сьте принесли сю потупу нашому народу.
Zanzibar = Занзібар

How could we fall to the likes of you?! = Як сьме могли упасти перед такыма, як вы?!
Almaty = Алматы

Let's have a nice little War, shall we? = Дайме собі добру малу войну, добрі?
If you need your nose bloodied, we'll happily serve. = Кідь вам треба розбити нус, ради послужиме.
The serbian guerilla will never stop haunting you! = Сербскі партізаны вас ніґда не перестанут переслідовати!
Belgrade = Білоґрад

Budapest = Budapest

War lingers in our hearts. Why carry on with a false peace? = Война зостає у нашых сердцях. Чом продовжовати фалшивый мир?
You gormless radger! You'll dine on your own teeth before you set foot in Ireland! = Ты безрозумный дурню! Будеш вечеряти власні зубы скорше, як ступиш до Ірландії!
A lonely wind blows through the highlands today. A dirge for Ireland. Can you hear it? = Днесь по горах віє осамотілий вітер. Похоронный спів про Ірландію. Ци го чуєш?
Dublin = Даблін

You shall stain this land no longer with your vileness! To arms, my countrymen - we ride to war! = Уже не будете ганьбити сю землю свойов підлостёв! До зброї, мої землякы — ідеме до войны!
Traitorous man! The Celtic peoples will not stand for such wanton abuse and slander - I shall have your head! = Зрадливый чоловіче! Келтскі народы не вытримают таке безпричінне знущаня тай оговаряння — возьму вам голову!
Vile ruler, know that you 'won' this war in name only! = Підлый володарю, знай, же єсь «выграв» сю войну лем подля мена!
Edinburgh = Единбурґ

So this is how it feels to die... = Но та што... от як ото... умерти...
Hanoi = Ганой

Do you really think you can walk over us so easily? I will not let it happen. Not to Kongo - not to my people! = Ци направду думаєте, же нас так легко потопчете? Не позволю сесе. Не Конґо — не моєму народу!
We are no strangers to war. You have strayed from the right path, and now we will correct it. = Война нам не є чужа. Зыйшли сьте из правой пути, тай дораз сесе направиме.
You are nothing but a glorified barbarian. Cruel, and ruthless. = Вы сьте лем ославеный варвар. Жорстокый тай немилосердный.
M'Banza-Kongo = М'Банза-Конґо

What a fine battle! Sidon is willing to serve you! = Яка добра битва! Сідон є охотный вам служити!
Sidon = Сідон

We never fully trusted you from the start. = Уд сам початку сьме вам ніґда повно не довіряли.
Tyre = Сур

We don't like your face. To arms! = Нам ся не любит твоє лице. До зброї!
You will see you have just bitten off more than you can chew. = Увидите, же сьте удкусили веце, як можете прожувати.
This ship may sink, but our spirits will linger. = Ся лодь ся може потопити, айбо наші духы зостанут.
Valletta = Валетта


