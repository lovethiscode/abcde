Maria Theresa = Марія-Терезія
Shame that it has come this far. But ye wished it so. Next time, be so good, choose your words more wisely. = Шкода, же сесе зашло так далеко. Айбо вы сьте сесе хотіли. Другый раз, будьте добрі, уберайте слова мудріше.
What a fool ye are! Ye will end swiftly and miserably. = Якы сьте дурні! Скінчите скоро тай нікчемно.
The world is pitiful! There's no beauty in it, no wisdom. I am almost glad to go. = Світ є жалосный! Неє у нём краса ани мудрость. Майже єм рад, же уйду гет.
The archduchess of Austria welcomes your Eminence to... Oh let's get this over with! I have a luncheon at four o'clock. = Ерцгерцоґіня Австрії вітат Вашу Высокость до... О, скінчіме уже сесе! О штирёх мам обід.
I see you admire my new damask. Nobody should say that I am an unjust woman. Let's reach an agreement! = Виджу, же любуєте мій новый дамаст. Нихто не сміє повісти, же єм неправедна жена. Дойдіме до угоды!
Oh, it's ye! = Ой, це ти!
Diplomatic Marriage = Діпломатічна женитва
Noble and pious Queen Maria Theresa, Holy Roman Empress and sovereign of Austria, the people revere your grace. After the death of your father King Charles VI, you inherited the throne of Austria during difficult economic and military times. But you used your wisdom and unflinching determination to fend off your foes and resolve any obstacles to stability and prosperity. With your husband Francis Stephen at your side as co-ruler, you assured your place as Empress of the Holy Roman Empire. During your reign, you reformed Austria in several domains, as you gifted it with a powerful army, a stable economic model, and an improved educational system. = Благородна тай побожна королёво Маріє Терезіє, цісарёво Святой Римской імперії тай володарко Австрії, народ чистує вашу милость. По смерти вашого отця, короля Карла VI, сьте наслідили австрійскый трон у тяжкых господарскых тай воєнных часах. Айбо сьте выхосновали свою мудрость тай непохытну рішимость, обы удбити неприятелів тай зрушити вшиткі перешкоды сталости тай процвітаня. Из мужом Франтішком Штефаном коло себе як сполуволодарём сьте убезпечили своє місто як цісарёва Святой Римской імперії. За свого панованя сьте направили Австрію у дакілько областях, даруючи єй силну армію, сталый господарскый модел тай поліпшену сістему образованя.
O Great Queen, proud and dignified, by the will of God and the Divine right, can you reach the height of prosperity and splendor the kingdom of Austria deserves? Will your new empire shine through the ages of history? = О велика королёво, горда тай достойна, ци можете з Божой волі тай божеского права досягнути вершок процвітаня тай велеліпности, котрый королівство Австрії заслужит? Ци ваша нова імперія буде світити через вікы історії?
