# iOS maintenance support
Support iOS maintenance = Підпорити утримованя iOS
Purchase records are unavailable. No purchase was started. Please reopen the app. = Записы куплї недоступны. Купля не зачала ся. Одкрый аплікацію знова.
Congratulations on your victory! = Вітаєме з побідов!
Enjoying this iOS version? Optional support helps with ongoing compatibility and maintenance. All game content and features stay the same whether you contribute or not. = Любиш тоту верзію про iOS? Добровольна підпора помагать далшому пристосованю і утримованю. Вшыток обсяг і функції бавкы зістають єднакы, ці приспіватимеш, або нї.
Learn about support = Дізнати ся о підпорі
Continue playing = Продовжити бавку
Unciv is made by an open-source community. This iOS version needs ongoing work to adapt to new systems, fix issues, and improve the controls. = Unciv творить сполочность отвореного коду. Тота верзія про iOS потребує сталу роботу: пристосованя ку новым сістемам, направлїня хыб і злїпшованя овладаня.
If you enjoy playing, you can support future iOS maintenance with a voluntary, one-time contribution. All game content and features are the same for everyone. = Кідь тя бавка тїшыть, можеш підпорити далше утримованя iOS добровольным єдноразовым приспівком. Вшыток обсяг і функції бавкы суть єднакы про вшыткых.
Processing your purchase... = Оброблїня куплї…
Thank you for supporting iOS maintenance! = Дякуєме за підпору утримованя iOS!
Purchase cancelled. No purchase was made. = Купля одкликана. Нич не было куплене.
Waiting for Apple's approval. If approved later, your support will be recorded automatically. = Чекать ся на схвалїня од Apple. Кідь буде схвалене пізнїше, твоя підпора ся запише автоматічно.
The purchase could not be completed. Please try again later. = Куплю не вдало ся докінчити. Спробуй знова пізнїше.
The purchase could not be verified. Reopen the app to retry recovery. = Куплю не вдало ся перевірити. Одкрый аплікацію знова про повторїня обновы трансакції.
Your purchase needs local recovery. Do not pay again; reopen the app to retry saving and finishing the transaction. = Тота купля потребує обнову на пристрою. Не плать знова; одкрый аплікацію знова про повторїня уложіня і докінчіня трансакції.

