Askia = Аскіа
You are an abomination to heaven and earth, the chief of ignorant savages! You must be destroyed! = Вы сьте огавность про небо тай землю, начальник невченых диваків! Мусите быти знищені!
Fool! You have doomed your people to fire and destruction! = Дурню! Одсудив єсь свій народ на огінь тай знищіня!
We have been consumed by the fires of hatred and rage. Enjoy your victory in this world - you shall pay a heavy price in the next! = Спотребили нас огні ненависти тай гніва. Тіште ся из свойой побіды у сём світі — у другум заплатите тяжку ціну!
This insult shall cost you. = Ся образа вас буде коштовати.
I am Askia of the Songhai. We are a fair people - but those who cross us will find only destruction. You would do well to avoid repeating the mistakes others have made in the past. = Я єм Аскія из Сонґая. Сьме праведный народ — айбо тых, котрі нам шкодят, чекат лем знищіня. Добрі бы сьте учинили, кобы сьте не повторяли хыбы, котрі у минулости зробили другі.
Can I interest you in this deal? = Ци вас може інтересовати ся угода?
River Warlord = Річный войвода
Askia, leader of the Songhai people and greatest of all, may God watch your path towards glory! Songhai was under the rule of the mighty West African state of Mali until the middle of the 14th century. Great King Sunni Ali Ber fought for independance, and showed to all Songhai's power, by conquering territories and repelling many foes who sought to destroy the rising kingdom. Ultimately, conquest of the wealthy cities of Timbuktu and Jenne made Songhai an empire with enough economic power to survive for a century, until the empire bowed down before foes with advanced technology - muskets against spearmen. = Аскіє, вождю сонґайского народа тай найвекшый из вшиткых, най Бог стражит вашу путь ид славі! Сонґай быв пуд панованём силной западоафріцькой державы Малі аж до середины 14. столітя. Великый король Сунні Алі Бер боёвав за незалежность тай указав вшиткым силу Сонґая, добываючи теріторії тай удбиваючи многых неприятелів, котрі хотіли знищити зростаюче королівство. Наконець добытя богатых варошів Тімбукту тай Дженне учинило из Сонґая імперію из доста господарсков силов, обы выжыла столітя, аж ся пудклонила неприятелям из новішов технолоґійов — мушкетами проти копійників.
King Askia, your people know there's still hope, that the hour of revenge is coming. Give them wealth and power, give them mighty weapons of iron and fire, to destroy any foe, for Songhai to revive! Will your new empire shine through the ages of history? = Королю Аскіє, ваш народ знає, же іще є надія, же приходит година помсты. Дайте им богатство тай силу, дайте им силну зброю из желіза тай огня, обы знищити каждого неприятеля тай обы ся Сонґай обновив! Ци ваша нова імперія буде світити через вікы історії?
