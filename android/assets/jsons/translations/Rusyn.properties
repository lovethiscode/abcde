Gustavus Adolphus = Густавус Адолфус
The Hakkapeliittas will ride again and your men will fall just at the sight of my cavalry! God with us! = Гакапеліты знову погонят, тай ваші люде упадут лем при погляді на мою конницю! Бог из нами!
Ha ha ha, captain Gars will be very glad to head out to war again. = Га га га, капітан Ґарс буде барз рад знову іти до войны.
I am Sweden's king. You can take my lands, my people, my kingdom, but you will never reach the House of Vasa. = Я єм шведскый король. Можете взяти мої землі, мій народ, моє королівство, айбо до роду Ваза ніґда не досягнете.
You actually seem sharper than what I had originally thought. = Направду ся видите бистріші, як єм спочатку думав.
Stranger, welcome to the Snow King's kingdom! I am Gustavus Adolphus, member of the esteemed House of Vasa = Чужинче, вітам у королівстві Снігового короля! Я єм Ґустав Адольф, член чистованого роду Ваза
My friend, it is my belief that this settlement can benefit both our peoples. = Приятелю мій, вірю, же ся угода може хосновати обом нашым народам.
Oh, welcome! = О, вітаю!
Oh, it is you. = Их, исе ты.
Nobel Prize = Нобелова награда
All hail Great King Gustavus Adolphus, founder of the Swedish Empire, and one of the most famous military tacticians. In the early 17th century, Sweden emerged as a great power in Europe under your reign, thanks to your wisdom, both in diplomacy and warfare. As king, you decided to reform Swedish laws to bring economic stability and prosperity to your people. Your allies, and also your enemies, called you the 'Lion of the North', witnessing your modern vision of warfare, and the prowess of your armies on the battlefield. As you triumphed in the Thirty Years' War, your name will be forever remembered as one of history's greatest generals. = Слава великому королёви Ґуставови Адольфови, заснователёви Шведской імперії тай єдному из найславнішых воєнных тактіків. На початку 17. столітя ся Шведско стало великов силов у Европі пуд вашым панованём вдяка вашуй мудрости, у діпломатії і у войні. Як король сьте розрішыли направити шведскі законы, обы принести господарску сталость тай процвітаня свому народу. Ваші союзникы, ай і неприятелі вас звали «Лев севера», видячи ваше новочасне видіня войны тай зручность вашых армій на боіщи. Бо сьте побідили у Трідцятьрічнуй войні, ваше мено ся буде навхтема памятати як єдно из найвекшых ґенералів історії.
O noble King, will you lend your leadership and brilliant ideas to Sweden once again, to conceive strategies never seen before? Will your new empire shine through the ages of history? = О благородный королю, ци знову дате Шведску своє воджіня тай мудрі думкы, обы створити стратеґії, котрі іще нихто не видів? Ци ваша нова імперія буде світити через вікы історії?
