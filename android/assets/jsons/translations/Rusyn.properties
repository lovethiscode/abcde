Pachacuti = Пачакуті
Resistance is futile! You cannot hope to stand against the mighty Incan empire. If you will not surrender immediately, then prepare for war! = Упір є даремный! Не можете дуфати вытримати проти силной інкской імперії. Кідь ся такой не здасте, готовте ся на войну!
Declare war on me?!? You can't, because I declare war on you first! = Выголосити мі войну?!? Не можете, бо я вам першый выголошую войну!
How did you darken the sun? I ruled with diligence and mercy—see that you do so as well. = Як сьте затемнили сонце? Панував єм старанно тай милосердно — старайтесь так учинити і вы.
How are you? You stand before Pachacuti Inca Yupanqui. = Як ся маєте? Стоїте перед Пачакуті Інка Юпанкі.
The Incan people offer this fair trade. = Інкскый народ понукат сю праведну торговельну угоду.
How are you doing? = Як ти діла?
What do you want now? = Што дораз хочете?
Great Andean Road = Великый Андськый Чиненик
King Pachacuti Sapa Inca, maker of the world and ruler of Tawantinsuyu and the Inca people, your loyal subjects greet you! In the beginning, the small state of Cusco already showed the Incans were promised for greatness. They won many wars against powerful enemies, relentlessly crushing any army that dared oppose them, and forged a mighty empire stretching from Ecuador to Chile, the greatest ever seen in pre-Columbian America. Not just undaunted soldiers, Inca people were accomplished builders and artists, their magnificient and unequalled culture still fascinating the world today. = Королю Пачакуті Сапа Інка, творителю світа тай володарю Тавантінсую тай інкского народа, ваші вірні пуддані вас здоровят! На початку уже мала держава Куско указала, же Інків чекат великость. Выграли многі войны проти силных неприятелів, невпинно друшаючи кажду армію, котра ся сміла им противити, тай створили силну імперію уд Еквадора до Чіле, найвекшу, яку коли виділа предколумбова Амеріка. Інкскый народ быв не лем смілыма вояками, ай і зручныма будователями тай умелцями, тай их велеліпна тай непорівнателна култура і днесь чарує світ.
O Emperor Pachacuti, honor your name of 'Earth Shaker'! Will you once again summon the power of the earth to unite all Incan people under the protection of Sapa Inca, the Son of the Sun? Will your new empire shine through the ages of history? = О цісарю Пачакуті, уддайте честь свому мену «Трасучый землёв»! Ци знову призвете силу землі, обы споїти вшыток інкскый народ пуд охранов Сапа Інка, Сына сонця? Ци ваша нова імперія буде світити через вікы історії?
