Harald Bluetooth = Гаральд Синьозубый
If I am to be honest, I tire of those pointless charades. Why don't we settle our disputes on the field of battle, like true men? Perhaps the skalds will sing of your valor... or mine! = Кідь мам быти щірный, уставав єм ся уд тых даремных комедій. Чом бы сьме не розрішили наші споры на боіщи, як правдиві хлопы? Може, скалды будуть співати о вашуй смілости... або мойой!
Ahahah! You seem to show some skills of a true Viking! Too bad that I'll probably kill you! = Агагаг! Выходит, же маєте даякі зручности правдивого вікінґа! Шкода, же вас, певно, убию!
Loki must have stood by you, for a common man alone could not have defeated me... Oh well! I will join the einherjar in Valhalla and feast, while you toil away here. = Локі мусив стояти при вас, бо сам обычайный чоловік бы ня не міг побідити... Та добрі! Прикапчам ся ид ейнгеріям у Валгаллі тай буду гостити, покы вы туй будете тяжко робити.
Our future battle will be glorious! = Наш будучій бій буде славный!
Harald Bluetooth bids you welcome to his lands, a Viking unlike any the seas and lands have ever known! Hah, are you afraid? = Гаральд Синьозубый вас вітат у своїх землях, вікінґ, якого іще моря тай землі не знали! Га, ци ся боїте?
This is a fine deal! Even a drunk beggar would agree! = Сесе є добра угода! І пяный жебрак бы згодив ся!
Hail to you. = Вітаня вам.
Viking Fury = Люті вікінґы
Skal, Harald Bluetooth Gormsson, son of King Gorm of the Old and Thyra Dannebod! After crushing the armies of Norway, you achieved great construction projects all across the land of mighty Denmark. Numerous Ring Fortresses were built under your reign to protect the people from foreign invasions, but also from local quarrels. In 983 AD, you successfully repelled several waves of German settlers trying to colonize your land, and then always kept your kingdom free from any foreign pressure. = Скол, Гаральде Синьозубый Ґормсоне, сыну короля Ґорма Старого тай Тіры Данебод! По здрушіню норвезькых армій сьте выповнили великі будователні проєкты по цілій земли силной Данії. За вашого панованя ся поставили многі круглі тверды, обы боронити народ уд чужых нападів, ай і уд містных свар. У 983 році н. е. сьте успішно удбили дакілько хвиль німецькых поселенців, котрі хотіли колонізовати вашу землю, тай потім сьте усе держали своє королівство вольне уд чужого натиска.
As a true Viking, who knows not fear, time has come to unleash mighty armies of Northsmen to bring despair upon your enemies! By the will of the Gods, it will be either a glorious triumph or a sumptuous feast in the Valhalla! Will your new empire shine through the ages of history? = Як правдивый вікінґ, котрый не знає страху, дораз пришов час выпустити силні армії северян, обы принести роспач вашым неприятелям! З волі богів сесе буде або славна побіда, або велеліпна гостина у Валгаллі! Ци ваша нова імперія буде світити через вікы історії?
