在新城区域建城并连接首都，让幸福度连续 3 个完整回合不低于 0 = Заложте місто в области Нового міста, спойте го з головным містом і держте щастя хоць 0 за 3 цїлы ходы за собов.
在本关战斗中，最多损失 1 支军事单位 = Стратьте найвеце 1 войскову єдиницю в бою того рівня.
在本关战斗中，最多损失 2 支军事单位 = Стратьте найвеце 2 войсковы єдиницї в бою того рівня.
在本关战斗中，最多损失 4 支军事单位 = Стратьте найвеце 4 войсковы єдиницї в бою того рівня.
