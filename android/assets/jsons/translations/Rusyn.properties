Genghis Khan = Джинґіс-хан
You stand in the way of my armies. Let us solve this like warriors! = Стоїте у пути моїм арміям. Розрішіме сесе як воякы!
No more words. Today, Mongolia charges toward your defeat. = Доста слів. Днесь Монголія рушат наперед до вашой поразкы.
You have hobbled the Mongolian clans. My respect for you nearly matches the loathing. I am waiting for my execution. = Спутали сьте монголскі роды. Моє чистованя про вас майже дорівнат моєму огавованю. Чекам на свою казнь.
Your bravery must be commended. = Вашу смілость треба похвалити.
I am Temuujin, conqueror of cities and countries. Before me lie future Mongolian lands. Behind me is the only cavalry that matters. = Я єм Темуджін, добиватель варошів тай держав. Передо мнов лежат будучі монголскі землі. За мнов є єдина конниця, котра має значіня.
I am not always this generous, but we hope you take this rare opportunity we give you. = Не усе єм так щедрый, айбо дуфаме, же выхоснуєте сю рідку можность, котру вам даєме.
So what now? = Та што дораз?
Mongol Terror = Страхота посперед монголами
O great Temuujin, immortal leader of the mighty Mongol Empire! Your name alone was enough to make cities crumble, and the sound of the mighty Mongol cavalry to make your enemies flee! O Great Khan! Once Northern Asia united into a mighty people, producing one of the greatest armies the world has ever known, your skillful mounted archers conquered in only a few years, most of China, Eastern Asia, and even reached the gates of Europe at the West. With cunning diplomacy and brilliant warfare, you swept your enemies one after another, creating the greatest empire ever seen, reducing Roman or Greek conquests to minor achievements. = О великый Темуджіне, безсмертный вождю силной Монголской імперії! Саме ваше мено доста було, обы ся варошы розпадали, тай звук силной монголской конниці, обы ваші неприятелі утікали! О великый хане! Коли ся північна Азія споїла у силный народ, котрый створив єдну из найвекшых армій, які світ коли знав, ваші зручні кінні лучникы за лем пару років добили векшыну Кітая, выходну Азію тай досягли аж браны Европы на заході. Хытров діпломатійов тай мудрым воєнництвом сьте змітли своїх неприятелів єдного по другум, створившы найвекшу імперію, котру світ коли видів, тай римскі ци ґрецькі добытя попри ній были лем малым успіхом.
Divine Temuujin, battles and conquests run through the veins of the Mongols. Are you ready to shatter the will of your enemies? Will your cavalry ride in the steppes once again and strike as lightning and thunder? Will your new empire shine through the ages of history? = Божескый Темуджіне, бої тай добытя течут жылами Монголів. Ци сьте готовый зломити волю своїх неприятелів? Ци ваша конниця знову погонит степами тай ударит як блискавка тай грім? Ци ваша нова імперія буде світити через вікы історії?
