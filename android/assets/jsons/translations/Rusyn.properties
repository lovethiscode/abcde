You won't ever be able to bother me again. Go meet Yama. = Уже мі ніґда не будете мішати. Идіт стрітити Яму.
Fool! I will disembowel you all! = Дурню! Вшиткым вам выпущу нутра!
You have proven to be a cunning and competent adversary. I congratulate you on your victory. = Указали сьте ся як хытрый тай здатный неприятель. Вінчую вас из побідов.
Greetings, I am Empress Wu Zetian. China desires peace and development. You leave us alone, we'll leave you alone. = Здоровлю, я єм цісарёва У Цзе-тянь. Кітай жадат мир тай розвой. Нехайте нас на покої, тай мы вас нехаме на покої.
My friend, do you think you can accept this request? = Приятелю мій, ци думаєте, же можете прийняти сю просьбу?
