Theodora = Фтеодора
It is always a shame to destroy a thing of beauty. Happily, you are not one. = Так журно нищити красиві речі. На щастя, ты не из такых.
Now darling, tantrums are most unbecoming. I shall have to teach you a lesson. = Дораз, дорогенькый, гнівливі выпады вам барз не пасуют. Буду вас мусити навчіти.
Like a child playing with toys you are. My people will never love you, nor suffer this indignation gracefully. = Вы сьте як дітвак, котрый ся бавит играчками. Мій народ вас ніґда не буде любити ани спокійно терпіти сю потупу.
My, isn't this a pleasant surprise - what may I call you, oh mysterious stranger? I am Theodora, beloved of Byzantium. = О, ци сесе не є мила несподіванка — як вас можу звати, о тайный чужинче? Я єм Теодора, люблена Бізантійов.
I have heard that you adept at certain kinds of ... interactions. Show me. = Чула єм, же сьте зручны у даякых тіпах... взаємодії. Укажіт мі.
Hello again. = Зась серус.
Patriarchate of Constantinople = Патріархат Цариграда
Magnificent Empress Theodora, beloved of Byzantium and of Rome, your people salute you! With your beauty and intelligence, you rose up from actress and courtesan to the rank of the most powerful woman in the Roman Empire, as wife of Justinian I. In the late 520's AD, you helped your husband engage in spiritual and legal reforms, promugalting numerous laws to improve women's status and treatment in the empire. You also made of Constantinople the jewel of the Eastern Roman Empire with the restoration and construction of many aqueducts, bridges, and churches, its beauty culminating with the creation of the Hagia Sophia, one of the most splendid pieces of architecture in the world. = Велеліпна цісарёво Теодоро, люблена Бізантійов тай Римом, ваш народ вас здоровит! Своёв красотов тай розумом сьте ся підняли из акторкы тай куртізаны на ступінь найсилнішой жены у Римскуй імперії як жена Юстініана I. На кінци 520-х років н. е. сьте помогли мужови у духовных тай правных реформах, выголошуючи многі законы про поліпшіня положіня тай обходжіня из женами у імперії. І сьте учинили из Константінополя драгоцінность Выходной Римской імперії обновованём тай ставлянём многых водопроводів, мостів тай церьков, а єго краса досягла вершок поставлінём Гаґії Софії, єдной из найвелеліпнішых будов світа.
Beautiful Empress,the Byzantine Empire's magnificence is intact in all memories, and ready to reborn as the new jewel of humankind. Will your new empire shine through the ages of history? = Крашна цісарёво, велеліпность Бізантійской імперії є цілковита у вшиткых памятях тай готова знову ся народити як нова драгоцінность людства. Ци ваша нова імперія буде світити через вікы історії?
