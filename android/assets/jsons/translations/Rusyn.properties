Two rising banners mark one decisive advance. = Дві здвигнуты заставы значать єден рїшаючій поступ.
Uncrowned Summit = Некорунованый вершок
Unlock the other 39 achievements in this catalog. Old-catalog medals do not count. = Одомкнїть другы 39 досягнінь у тім каталоґу. Медайлы старого каталоґу ся не рахують.
Unlock the other 39 achievements in this new catalog. This achievement itself and old-catalog medals do not count. = Одомкнїть другы 39 досягнінь у тім новім каталоґу. Само то досягнїня і медайлы старого каталоґу ся не рахують.
Wealth of a Nation = Богатство народа
Win a Cultural Victory by completing the required policy branches and the Utopia Project under the built-in rules. = Здобудьте културне побіджіня докончінём потрібных галузей інстітуцій і Проєкту утопії подля вбудованых правил.
Win a Cultural Victory through policy branches and the Utopia Project. = Здобудьте културне побіджіня через галузї інстітуцій і Проєкт утопії.
Win a Diplomatic Victory. = Здобудьте діпломатічне побіджіня.
Win a Domination Victory. = Здобудьте добувательске побіджіня.
Win a Scientific Victory. = Здобудьте научне побіджіня.
Win any formal victory, including Time, on any difficulty. = Здобудьте котреколвек офіціалне побіджіня вєдно з часовым на котрійколвек тяжкости.
Win any victory, including Time, on any difficulty. = Здобудьте котреколвек побіджіня вєдно з часовым на котрійколвек тяжкости.
Wonder Collector = Збератель чудес
Working the Land = Оброблїня земли
World's Choice = Выбор світа
You have changed the skyline of an age. = Змінили сьте обрис віку.
You have left your first monument to this age. = Лишыли сьте тому віку свій першый памятник.
Your army learns the meaning of victory. = Ваше войско ся учіть значіня побіджіня.
Your banner rises above a foreign city for the first time. = Ваша застава першыраз росте над чужым містом.
Your civilization belongs to more than one world. = Ваша цівілізація належыть веце як єдному світу.
Your civilization has found its first victory. = Ваша цівілізація нашла своє перше побіджіня.
Your friends give you strength beyond your borders. = Вашы приятелї вам давуть силу за вашыма граніцями.
Your frontier grows a little more peaceful. = Ваша погранічна земля є о кусок мирнїша.
Your ideas leave an echo that outlives an age. = Вашы думкы лишають озвук, котрый пережыє вік.
Your journey has become a book of civilizations. = Ваша путь ся стала книгов цівілізацій.
Your people begin to understand the world through a shared belief. = Вашы люде зачинають розуміти світ через сполочну віру.
Your religion is the majority in 10 cities at once, with 3 owned by other major civilizations. Passive spread counts. = Ваша реліґія є векшостнов в 10 містах нараз, з котрых 3 належать іншым великым цівілізаціям. Пасівне шырїня ся рахує.

Default Promotions = Початочны повышіня
Allow the player to apply a set of promotions when a unit is built. = Дозволити бавлячови хосновати набір повышінь при вытворїню формованя.
To make a promotion the default, check 'Default promotions for [unit]' then click 'Pick promotions'. = Про наставлїня повышіня як початочного означте «Початочны повышіня про [unit]» і пак натиснїть «Выбрати повышіня».
To disable default promotions for a unit, uncheck 'Use default promotions' under the buy button for the unit. = Про вылучіня початочных повышінь формованя одзначте «Хосновати початочны повышіня» під кнопков купованя формованя.
Default promotion only applies to the same units that you selected. It only applies per cities. It can't be used In puppeted cities or cities that you don't own. = Початочне повышіня платить лем про тоты самы формованя, котры сьте выбрали. Платить окреме про кажде місто. Не мож го хосновати в маріонетковых або чужых містах.
If the city doesn't have enough XP it will not apply all the promotions. And default promotions doesn't affect the civ AI in anyway. = Кідь місто немає досить скушености, не вшыткы повышіня ся ужыють. Початочны повышіня нияк не впливають на компютерного бавляча цівілізації.


# Campaign mode

1861 年 7 月 16 日，联邦军准备从华盛顿向南推进。你固定指挥联邦，保卫华盛顿并夺取里士满。地图与部队是基于历史地理的游戏化压缩，不强制重演历史战果。 = 16. юла 1861 року войска Унії ся готують поступовати з Вашінґтона на юг. Вы командуєте Уніёв: хороньте Вашінґтон і здобудьте Річмонд. Мапа і войска є зменшеным ігровым подобом історічной ґеоґрафії; історічны выслїдкы битв не мусять ся повторити.
Abraham Lincoln = Абрагам Лінколн
Alexandria Depot = Склад Александрії
Artillery Improvement = Злїпшіня артилерії
Baltimore Depot = Склад Балтімора
Campaign challenges = Выкликы кампанії
Campaign could not be loaded. Your saved progress has been kept. = Кампанію ся не подарило начітати. Вашы збережены ігры і выслїдкы остали.
