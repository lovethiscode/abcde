George Washington = Джордж Вошінґтон
Your wanton aggression leaves us no choice. Prepare for war! = Ваша безпричінна аґресія нам не нехат другой можливости. Готовте ся на войну!
You have mistaken our love of peace for weakness. You shall regret this! = Вы сьте нашу любов ид мирови взяли за слабость. Будете сесе бановати!
The day...is yours. I hope you will be merciful in your triumph. = Сесь день...є ваш. Дуфам, же при своїм тріумфі будете милосердні.
The people of the United States of America welcome you. = Народ Зъєднаных держав Амерікы вас вітат.
Is the following trade of interest to you? = Ци вас інтересує слідувуча торговельна угода?
Well? = Ну?
Manifest Destiny = Явноє предназначеня
President Washington, we salute you and the proud American civilization! Freed from the British dominion in the 18th century, then cleansed and reborn after a terrible civil war, the United States nation was ready to play its great role in the 20th century. At the height of its power, triumphant after two terrible world wars, United States of America, a land of immigration, opportunities, optimism and determination, has risen above all other weakening nations, unable to equal such power. = Президенте Вашінґтоне, здоровиме вас тай горду амеріцьку цівілізацію! Высвободженый из брітанского панованя у 18. столітю, потім очіщеный тай знову народженый по страшнуй гражданскуй войні, народ Зъєднаных держав быв готовый грати свою велику ролю у 20. столітю. На вершку свойой силы, побідный по двох страшных світовых войнах, Зъєднані державы Амерікы, земля приселіня, можностей, надії тай рішимости, подняли ся понад вшиткі другі ослаблюючі народы, котрі не могли дорівнати таку силу.
President Washington, will you show to the world the legitimacy of the American way of life, and spread the flame of liberty to all mankind? Will your new empire shine through the ages of history? = Президенте Вашінґтоне, ци укажете світови оправненость амеріцького способа жывота тай росшырите огінь свободы на ціле людство? Ци ваша нова імперія буде світити через вікы історії?
