So you're not real, but a phantom. = Так вы не сьте справжні, лем привид.
Are you real or a phantom? = Ты направдишньий вадь просто мара?
It appears that you do have a reason for existing – to make this deal with me. = Меня ся видит, ож смысл ва
Greetings. = Мої привітання.
What do YOU want?! = Та што ТЫ хочеш?!
Ingenuity = Выгадливость
May the gods bless you, great Nebuchadnezzar, ruler of ancient Babylon! Built 5000 years ago, Babylon emerged as an empire in 1800 BC, thanks to godlike Hammurabi, The Giver of Law. Falling under the Kassites assaults then the Assyrian domination, Babylon was reborn from its ashes, gaining back its independance, and became the beacon for Arts and Learning in the ancient world. O Nebuchadnezzar, after your death, Babylon quickly fell, conquered by the mighty Persians, and then by the Greeks, until the great city disappeared forever in 141 BC. = Най вас богы благословлят, великый Навуходоносоре, володарю давнього Вавилона! Поставленый перед 5000 роками, Вавилон став імперійов у 1800 році до н. е. вдяка богоподобному Хаммурапі, Дарователю закона. По нападох Касітів тай потім асірійскум панованю Вавилон знову встав из попела, здобыв назад свою незалежность тай став світлом про уменя тай ученость давнього світа. О Навуходоносоре, по вашуй смерти Вавилон скоро упав, добытый силныма Перзянами тай потім Ґреками, аж великый варош навхтема изчезнув у 141 році до н. е.
Great Nebuchadnezzar, Babylon's glory still lives through you and your people. Will you create a spark to enlighten the world again? Will your new empire shine through the ages of history? = Великый Навуходоносоре, слава Вавилона іще жыє через вас тай ваш народ. Ци створите іскру, обы знову освітила світ? Ци ваша нова імперія буде світити через вікы історії?
