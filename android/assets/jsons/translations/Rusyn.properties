Suleiman I = Соліман I
Your continued insolence and failure to recognize our preeminence leads us to war. = Ваша неперестаюча дръзость тай неузнаня нашого первенства нас ведут до войны.
Good. The world shall witness the incontestable might of my armies and the glory of the Empire. = Добрі. Світ буде свідком неспірной силы моїх армій тай славы імперії.
Ruin! Ruin! Istanbul becomes Iram of the Pillars, remembered only by the melancholy poets. = Руїна! Руїна! Істанбул ся стає Ірамом стовпів, споминаным лем сумныма поетами.
From the magnificence of Topkapi, the Ottoman nation greets you, stranger! I'm Suleiman, Kayser-I Rum, and I bestow upon you my welcome! = Із велеліпности Топкапы вас здоровит османскый народ, чужинче! Я єм Сулейман, Кайсер-і Рум, тай вас вітам!
Let us do business! Would you be interested? = Заторгуйме! Интересно ти?
Barbary Corsairs = Берберійські корсары
O Great Sultan Suleiman, may the God bless you! You are revered for your power, wealth and generosity, and you truly deserves to be called the 'Magnificent'! The Ottoman Empire was born in Bithynia, starting as a small country in Eastern Anatolia in 12th century, then expanded to west into Anatolia. Over the next century, your people vanquished the empire of Byzantium, annexing Turkey and the Balkans, and smartly assimilating all wonders and knowledge of the Byzantine civilization. In the mid 15th century, the Ottomans added Constantinople to their empire, establishing a strategic link between Europe and the Middle East. The Empire would continue to expand for centuries reaching North Africa, Middle East and Eastern Europe at its height, but brutally disappeared in the chaos of the first world war, in early 20th century. = О великый султане Сулеймане, най вас Бог благословит! Чистуют вас про вашу силу, богатство тай щедрость, тай правдиво сьте годен мена «Велеліпный»! Османска імперія ся народила у Бітінії, зачавшы як мала держава у выходнуй Анатолії у 12. столітю, потім ся росшырила на запад до Анатолії. За наступне столітя ваш народ побідив Бізантійску імперію, прикапчав Турецько тай Балканы тай мудро перебрав вшиткі чуда тай знаня бізантійской цівілізації. У середці 15. столітя Османы придали Константінополь ид своїй імперії, створившы стратеґічне споїня меджі Европов тай Близкым выходом. Імперія ся іще столітями росшырёвала, на вершку досягла північну Афріку, Близкый выход тай выходну Европу, айбо жорстоко изчезла у хаосі першой світовой войны на початку 20. столітя.
Mighty Caliph, your people ask you to build again the Empire, to the level of power and glory it once achieved, and beyond! Will you revive the Ottoman golden age? Will your new empire shine through the ages of history? = Силный халіфе, ваш народ просит, обы сьте знову поставили імперію на ступінь силы тай славы, котрый коли досягла, тай іще вышше! Ци обновите османскый Золотый вік? Ци ваша нова імперія буде світити через вікы історії?
