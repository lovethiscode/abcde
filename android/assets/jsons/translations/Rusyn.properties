Alexander the Great, born in Macedon, was one of the most skilled generals, even more by his young age, and in only 17 years he conquered all the Greek known world. = Александр Великый, народженый у Македонії, быв єден из найзручнішых ґенералів, особливо зважуючи єго молодый вік, тай за лем 17 років добыв вшыток Ґрекам знаний світ.

