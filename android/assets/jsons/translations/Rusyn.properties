# Capturing a city

What would you like to do with the city of [cityName]? = Што хочете учинити из варошом [cityName]?
Annex = Прикапчати
Annexed cities become part of your regular empire. = Прикапчані варошы ся станут обычайнов частьов вашой імперії.
Their citizens generate 2x the unhappiness, unless you build a courthouse. = Их жытелі вытворюют 2x нещастя, кідь не поставите суд.
Your civilization may not annex this city. = Ваша цівілізація не сміє прикапчати сесь варош.
Puppet = Маріонетка
Puppeted cities do not increase your tech or policy cost. = Маріонеткові варошы не підвышуют ціну вашых технолоґій ци інституцій.
You have no control over the the production of puppeted cities. = Не маєте власть над выробов маріонетковых варошів.
Puppeted cities also generate 25% less Science and Culture. = Маріонеткові варошы і вытворюют о 25% менше наукы тай културы.
A puppeted city can be annexed at any time. = Маріонетковый варош мож кедьколвек прикапчати.
Liberate (city returns to [originalOwner]) = Высвободити (варош ся верне ид [originalOwner])
Liberating a city returns it to its original owner, giving you a massive relationship boost with them! = Высвободжіня вароша го вертат ид первому властникови, што дуже поліпшыть ваші удносины из ним!
Raze = Спалити
Razing the city annexes it, and starts burning the city to the ground. = Спаліня вароша го прикапчат тай зачне палити аж до землі.
Razing the city puppets it, and starts burning the city to the ground. = Спаліня вароша го зробит маріонетковым тай зачне палити аж до землі.
The population will gradually dwindle until the city is destroyed. = Жытелів буде поступно убувати, докы варош не буде знищеный.
Original capitals and holy cities cannot be razed. = Перші головні варошы тай святі варошы не мож спалити.
Destroy = Знищити
Destroying the city instantly razes the city to the ground. = Знищіня вароша го такой зровнат из землёв.
Keep it = Нехати собі
Remove your troops in our border immediately! = Такой выведіт свої войска из нашых границь!
Sorry. = Перебачте.
Never! = Ніґда-шуга!
Those lands were not yours to take. This has not gone unnoticed. = Ті землі не были ваші, обы сьте их брали. Сесе не зістало неповшымнуте.

