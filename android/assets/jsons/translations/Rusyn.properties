Pacal = Пакал
A sacrifice unlike all others must be made! = Мусит ся принести жертва, як жадна друга!
Muahahahahahaha! = Муахахахахахаха!
Today comes a great searing pain. With you comes the path to the black storm. = Днесь приходит велика палюча боль. Из вами приходит путь ид чорнуй бурі.
Greetings, wayward one. I am known as Pacal. = Здоровлю, заблудженый. Знают ня як Пакал.
Friend, I believe I may have found a way to save us all! Look, look and accept my offering! = Приятелю, думаю, же єм, може, нашов путь спасіня про нас вшиткых! Позеріт, позеріт тай прийміт мій дар!
A fine day, it helps you. = Крашный день, помагат вам.
The Long Count = Довга лічба
Kneel before King Pacal the Great, son of the gods and protector of the Palenque domain! After your kingdom has been harassed for years by neighboring rivals, you struck back at the enemies of your people, defeating each of them and sacrificing their leaders as a retribution to the insults made to your ancestors. Your wisdom and hard will not only restored the glory of Palenque, but turned it into a magnificient city, as your people built the greatest monuments and architecture the world has ever known. = Клякніт перед королём Пакалом Великым, сыном богів тай охранителём державы Паленке! Коли ваше королівство роками непокоїли сусідні супірі, сьте удповіли неприятелям свого народа, побідили каждого из них тай обітовали их вождів як удплату за образы ваших предків. Ваша мудрость тай тверда воля не лем обновили славу Паленке, айбо го і змінили на велеліпный варош, бо ваш народ поставив найвекші памятникы тай будовы, котрі світ коли знав.
Absolute King, your people need you to save the great Mayan culture and knowledge. Will you be able to read the movement of the stars, and find in the heavens the power to repel any foes? Will your new empire shine through the ages of history? = Всемогучій королю, ваш народ вас потребує, обы сьте спасили велику майску културу тай знаня. Ци будете здатні прочітати рух гвізд тай найти у небесах силу удбити каждого неприятеля? Ци ваша нова імперія буде світити через вікы історії?
