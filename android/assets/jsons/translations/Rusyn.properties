You are but a pest on this Earth, prepare to be eliminated! = Вы сьте лем шкідник на сюй земли, готовте ся на знищіня!
You are a fool who evokes pity. You have brought my hostility upon yourself and your repulsive civilization! = Вы сьте дурень, котрый будит жаль. Сами сьте на себе тай свою огавну цівілізацію привели мій гнів!
Strike me down and my soul will torment yours forever, you have won nothing. = Убийте ня, тай моя душа буде навхтема мучити вашу, нич сьте не выграли.
Greetings, I am Ramesses the god. I am the living embodiment of Egypt, mother and father of all civilizations. = Здоровлю, я єм бог Рамзес. Я єм жыве воплощіня Еґипта, матери тай отця вшиткых цівілізацій.
Generous Egypt makes you this offer. = Щедрый Еґипет вам дават сю понуку.
Good day. = Добрый день.
Oh, it's you. = Ах, се ты.
Monument Builders = Ставбарі монументув
O great Ramesses, Pharaoh of Egypt, bright as the Sun and mighty as the Nile! Lord of all living things, you lead the greatest of all civilizations, which has gifted the world with writing, advanced mathematics, sculpture, and architecture. Egyptian monuments and culture will continue to amaze the world for thousands of years. = О великый Рамзесе, фараоне Еґипта, ясный як Сонце тай силный як Ніл! Пане вшиткого жывого, ведете найвекшу из вшиткых цівілізацій, котра даровала світови писмо, розвинену математіку, сохарство тай архітектуру. Еґипетскі памятникы тай култура будуть іще тісячі років дивити світ.
Mighty and eternal Ramesses, Egypt lasted for millenia, whereas other civilisations disappeared into dust after a few centuries. Amun-Ra blesses you again to lead Egypt and its people on the path of light. Will your new empire shine through the ages of history? = Силный тай вічный Рамзесе, Еґипет тырвав тісячолітя, покы другі цівілізації по пару столітях ся змінили на порох. Амон-Ра вас знову благословлят вести Еґипет тай єго народ путёв світла. Ци ваша нова імперія буде світити через вікы історії?
