Oh. It's you? = О. То сьте вы?
Art of War = Кумшт войны
Heaven itself bends before your beauty, Empress Wu Zetian, ruler of eternal China! You lead one of the oldest and greatest civilization of humanity. In your time, China stood at the forefront of science and technology, bringing the world such contributions as gunpowder, the printing press, and the world of Confucius, and this, long before the rest of the world was mature enough to make the same discoveries! = І саме небо ся скланят перед вашов красотов, цісарёво У Цзе-тянь, володарко вічного Кітая! Ведете єдну из найдавнішых тай найвекшых цівілізацій людства. У вашум часі Кітай стояв на передку наукы тай технолоґії, даючи світови такі дары як пушный порох, друкарскый прес тай світ Конфуція, тай сесе довго перед тым, як другый світ дозрів доста на єднакі обявы!
Great Queen, can you make China prevail again, using your divine intelligence and beauty? China stands for greatness, and all its enemies will be dazzled soon enough! Will your new empire shine through the ages of history? = Велика королёво, ци можете знову довести Кітай ид побіді своїм божескым розумом тай красотов? Кітай значит великость, тай вшиткі єго неприятелі скоро будуть осліплені! Ци ваша нова імперія буде світити через вікы історії?
