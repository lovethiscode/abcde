You shall stain this land no longer with your vileness! To arms, my countrymen. We ride to war! = Уже не будете ганьбити сю землю свойов підлостёв! До зброї, мої землякы. Ідеме до войны!
Traitorous man! The Celtic peoples will not stand for such wanton abuse and slander - I shall have your balls! = Зрадливый чоловіче! Келтскі народы не вытримают таке безпричінне знущаня тай оговаряння — возьму вам яйця!
Vile ruler, know you have won this war in name alone. Your cities lie buried and your troops defeated. I have my own victory. = Підлый володарю, знай, же єсь выграв сю войну лем подля мена. Твої варошы лежат похоронені тай твої войска побіджені. Мам свою власну побіду.
Don't forget who you're dealing with. Arrogant moves can get you in danger. = Не забывайте, из кым маєте справу. Пышні крокы вас можуть увалити до небезпекы.
I am Boudicca, Queen of the Celts. Let no-one underestimate me! = Я єм Боудікка, королёва Келтів. Най ня нихто не підцінює!
Let us join our forces together and reap the rewards. = Спойме свої силы тай зберіме удміны.
God has given good to you. = Бог вам дав добро.
Druidic Lore = Сохташ друїдув
May glory and honor always be upon you, Warrior Queen! In a time dominated by men, you successfully claimed the throne and the power, but also valiantly defied the mighty Roman Empire. Punished and humiliated by the hand of the Roman bloody invaders, you united your people and led a terrible revolt, to seek revenge. Many legions fell under your fierce attacks and you burned the city of London with your anger. While the Romans still kept ownership of your land after your final defeat, your actions nonetheless showed Rome that this land could never be fully conquered, making Nero himself consider to withdraw all troops and leaving Britain forever. = Най слава тай честь будуть усе над вами, королёво-воячко! У часі, котрым панували хлопы, сьте успішно здобыли трон тай власть, айбо і сміло протистали силнуй Римскуй імперії. Покарана тай потуплена руками кровавых римскых нападників сьте споїли свій народ тай повели страшне повстаня, обы здобыти помсту. Многі леґії упали пуд вашыма дикима нападами, тай сьте своїм гнівом спалили варош Лондон. Хоць Римляне по вашуй конечнуй поразці здержали власть над вашов землёв, ваші діла вшерівно указали Римови, же ся сю землю ніґда не подасть цілковито добыти, што самого Нерона привело ид розважованю выведіня вшиткых войск тай навхтема опущіня Брітанії.
O raging lioness, will you lead the Celts again under the glory of your name, to spread the fires of liberty, and achieve a final victory? Will your new empire shine through the ages of history? = О гнівлива левіце, ци знову поведете Келтів пуд славов свого мена, обы росшырити огні свободы тай здобыти конечну побіду? Ци ваша нова імперія буде світити через вікы історії?
