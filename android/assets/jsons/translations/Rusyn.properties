Prosperity and conquest march beneath one golden banner. = Добробут і добуваня маршують під єднов золотов заставов.
Prosperity reaches beyond one city and across your land. = Добробут ся шырить за єдно місто і по вашій землї.
Prosperity shines across your land for the first time. = Добробут першыраз світить по вашій землї.
Qualifying new game. Full conditions are in the achievement guide. = Нова бавка сповняюча умовы. Повны умовы суть в провіднику досягнїнями.
Roads to Prosperity = Дорогы до добробуту
Rome: Imperial Foundations = Рим: Імперскы основы
Rome: have 4 self-founded cities with a Monument and Granary in each. Capital and purchases count. = Рим: майте 4 вами заложены міста, кажде з монументом і сыпанцём. Головне місто і купованя ся рахують.
Seeds of Culture = Зернятка културы
