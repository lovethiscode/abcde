Hi there! If you've played this far, you've probably seen that the game is currently incomplete.\n Unciv is meant to be open-source and free, forever.\n That means no ads or any other nonsense. = Здравлю! Кідь сьте добавили аж дотыль, віроятно сьте видїли, же бавка іщі неє докончена.\n Unciv має быти з одкрытым кодом і задурно навсе.\n То значіть без реклам і іншых глупостей.
