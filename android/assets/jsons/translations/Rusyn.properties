Haile Selassie = Гайлє Сєлассє
I have tried all other avenues, but yet you persist in this madness. I hope, for your sake, your end is swift. = Пробовав єм вшиткі другі путі, айбо вы вшерівно продовжуєте у сём шаленстві. Про ваше добро дуфам, же ваш конець буде скорый.
It is silence that allows evil to triumph. We will not stand mute and allow you to continue on this mad quest unchecked. = Мовчаня позволює злу побідити. Не будеме стояти німи тай позволяти вам продовжовати сю шалену путь без перепоны.
God and history will remember your actions this day. I hope you are ready for your impending judgment. = Бог тай історія будуть памятати ваші днесьні діла. Дуфам, же сьте готові на свій близкый суд.
What a waste of time. = Яка страта часу.
A thousand welcomes to our fair nation. I am Selassie, the Ras Tafari Makonnen and Emperor of Ethiopia, your humble servant. = Тісяч раз вітаме до нашого крашного народа. Я єм Селассіє, Рас Тафарі Меконнен тай цісарь Етіопії, ваш покорный слуга.
I request that you consider this offer between our two peoples. I believe it will do us both good. = Прошу вас розважити сю понуку меджі нашыма двома народами. Вірю, же нам обом принесе добро.
Spirit of Adwa = Дух Адва
May God bless you, wise and righteous Emperor of Ethiopia, Haile Selassie. As one of Ethiopia's greatest rulers and a spiritual leader of the Rastafarian movement, your good influence on diplomacy and political cooperation are praised throughout the world. You created Ethiopia's first written constitution, and favorized democracy for years to come, your great wisdom making Ethiopia enter as a charter member in the United Nations. Always aiming to reform and modernize your nation, you changed Ethiopian destiny for the best. = Най вас Бог благословит, мудрый тай праведный цісарю Етіопії, Гайле Селассіє. Як єдному из найвекшых володарів Етіопії тай духовному вождёви растафаріянского руху вам по цілум світі хвалят ваш добрый вплыв на діпломатію тай політічну сполупрацу. Створили сьте першу писану констітуцію Етіопії тай пудпоровали демокрацію про будучі рокы, а ваша велика мудрость учинила, же Етіопія вступила як засноваючій член до Орґанізації зъєднаных народів. Усе жадаючи направити тай обновити свій народ, сьте змінили осуд Етіопії на ліпше.
Revered King, your knowledge and intelligence are required once again to protect your people from many threats in the world. Will you secure peace and stability, with benevolence and authority, in the radiance of the Kebra Nagast? Will your new empire shine through the ages of history? = Чистованый королю, ваші знаня тай розум суть знову потрібні про охрану свого народа уд многых грозеб світа. Ци убезпечите мир тай сталость добротов тай авторітетов у світлости Кебра Наґаст? Ци ваша нова імперія буде світити через вікы історії?
