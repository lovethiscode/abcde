Sejong = Седжонґ
Jip-hyun-jun (Hall of Worthies) will no longer tolerate your irksome behavior. We will liberate the citizens under your oppression even with force, and enlighten them! = Чіпхьонджон (Сінь достойных) уже не буде терпіти ваше докучливе справованя. Высвободиме жытелів спід вашого гнёта і силов тай их освітиме!
Foolish, miserable wretch! You will be crushed by this country's magnificent scientific power! = Дурный, нікчемный біднику! Будете здрушені велеліпнов науковов силов сьой державы!
Now the question is who will protect my people. A dark age has come. = Дораз є звіданка, хто буде боронити мій народ. Пришов темный вік.
Your words reveal more of your own prejudice than any fault in my own. = Ваші слова указуют веце на ваші власні передсудкы як на мою хыбу.
Welcome to the palace of Choson, stranger. I am the learned King Sejong, who looks after his great people. = Вітам у палаці Чосона, чужинче. Я єм ученый король Седжон, котрый ся старат о свій великый народ.
We have many things to discuss and have much to benefit from each other. = Маєме о чім бесідовати тай много хісна єден из другого.
Oh, it's you = Йой, сесе ты...
Scholars of the Jade Hall = Нефритовый терем
Greetings to you, King Sejong the Great, heir of the Choson Dynasty! Prosperity and benevolence towards the common man are the principles of your reign, and made of you the most beloved Korean king. You always aimed to provide a fair and equal society for all your people, and also to favor knowledge and technological discoveries. Your wisdom and intelligence imbued all the Korean society, and the scholars of the Jade Hall developed Korea's first written language, Hangul, sharing further literature and science to the people after centuries of darkness. = Здоровиме вас, королю Седжоне Великый, насліднику дінастії Чосон! Просперіта тай доброта ид простому чоловікови суть основы вашого панованя тай учинили вас найлюбленішым корейскым королём. Усе сьте хотіли дати праведну тай рівну сполочность про цілий свій народ тай пудпоровати знаня тай технолоґічні обявы. Ваша мудрость тай розум наповнили цілу корейску сполочность, тай учені Нефрітовой сіні створили першый корейскый писаный язык, ханґыль, тай іще веце давали народу писменство тай науку по столітях темноты.
Wise Sejong, will you gift your people with the radiance of harmony and knowledge to dispel the darkness once again? Will your new empire shine through the ages of history? = Мудрый Седжоне, ци даруєте свому народу світлость згоды тай знаня, обы знову розогнати темноту? Ци ваша нова імперія буде світити через вікы історії?
