# Game Center achievements V2
A Thousand Lights = Тысяча світел
A civilization's spirit begins with its first principle. = Дух цівілізації зачінать з єй першой засады.
A first belief becomes a lasting tradition. = Перша віра ся стане трвалов традіціёв.
A first handshake brings the world a little closer. = Перше стиснутя рук приближыть світ о кусок.
A full treasury reflects years of patient stewardship. = Повна скарбніця одражать рокы терпезливого ґаздованя.
A small nation chooses to stand beside you. = Малый народ ся рїшыть стати коло вас.
A small settlement now glows with countless lights. = Мале осїдлїня теперь світить несчісленныма світлами.
A true crown is earned through a tested victory. = Правдиву корону здобыть перевірене побіджіня.
Achievement guide = Провідник досягнїнями
Achievement unlocked = Досягнїня одомкнуте
Achievements = Досягніня
Across the ages, your monuments remain. = Вашы памятникы остають через вікы.
Adopt a social policy, including a branch opener. = Прийміть інстітуцію; одкрытя галузи ся тіж рахує.
Adopt your first social policy. Opening a policy branch counts. = Прийміть свою першу інстітуцію. Одкрытя галузи інстітуцій ся рахує.
Against mighty opponents, you still write your own ending. = І проти могучім суперям пишете свій властный конець.
Age of Wonders = Вік чудес
An empire's greatness takes root in every city. = Великость імперії пущать корїнї в каждїм містї.
Art of Governance = Куменя управлїня
As China, have the same Chu-Ko-Nu destroy 2 different military units belonging to other major civilizations during one of your turns. = Як Китай, знищте тым самым Чу-Ко-Ну 2 різны войсковы формованя, котры належать іншым великым цівілізаціям, за єден свій тяг.
As Egypt, build 3 different World Wonders in one game. Winning is not required. = Як Еґіпет, збудуйте 3 різны світовы чуда в єдній бавцї. Побіджіня неє потрібне.
As Persia, capture 3 different foreign cities in combat during one continuous Golden Age. Extending that Golden Age still counts as the same period. = Як Перзія, добудьте 3 різны чужы міста в бою за єден непрерваный золотый вік. Продолжіня того золотого віку ся все рахує як тот самый період.
As Rome, simultaneously own 4 self-founded cities that each have a Monument and a Granary. The capital and purchased buildings count. = Як Рим, майте нараз 4 вами заложены міста, кажде з монументом і сыпанцём. Головне місто і куплены будовы ся рахують.
Battle capture counts after combat and the occupation choice finish and the city belongs to you. Trades, gifts, direct liberation to a third party and city destruction do not count. Experience promotions exclude free and starting promotions; normal upgrades preserve the same unit's record. Simultaneous conditions cannot be added across different moments. = Добутя в бою ся рахує по бою і докончіню выбору окупації, кідь місто належыть вам. Торговля, дары, пряме вызволїня третїй сторонї і знищіня міста ся не рахують. Скушеностны повышіня не рахують дарованы і початочны повышіня; обычайны полїпшеня лишають запис того самого формованя. Умовы, котры мають платити нараз, не мож счытувати з різных моментів.
Battle-Hardened = Battle-Hardened
Be allied with at least 3 City-States at the same time. = Будьте союзником щонайменше 3 міст-держав нараз.
Become a City-State's ally. = Станьте союзником міста-державы.
Become the ally of a City-State. = Станьте союзником єдного міста-державы.
Before the bowstring rests, the enemy line has broken. = Перед тым, як тятива одпочіне, ворожскый ряд уж є проломаный.
Belief crosses the border and takes root far away. = Віра переходить граніцю і пущать корїнї далеко.
Beyond the Stars = За гвіздами
Beyond the border, another banner rises. = За граніцёв ся здвигать далша застава.
Book of Civilizations = Книга цівілізацій
Border Guardian = Сторож граніць
Build 8 different World Wonders across qualifying new games. Each type counts once, even across repeated saves. = Збудуйте 8 різных світовых чудес через сповняючі умовы новы бавкы. Кождовый тіп ся рахує лем раз, і через повторены всокоченя.
Build 8 different World Wonders across qualifying new games; each type counts once. = Збудуйте 8 різных світовых чудес через сповняючі умовы новы бавкы; кождовый тіп ся рахує раз.
Build World Wonders yourself in any city you own; Great Engineer acceleration is allowed. National Wonders and wonders already present in acquired cities do not count as built. Different wonders are counted by type. Foreign cities were founded by other major civilizations; repeated captures of the same city count once. = Світовы чуда будуйте самы в даку вашім містї; приспішіня великым міряником є позволене. Народны чуда і чуда уж присутны в здобытых містах ся не рахують як збудованы. Різны чуда ся рахують подля тіпу. Чужы міста были заложены іншыма великыма цівілізаціями; повторне добутя того самого міста ся рахує раз.
Build a World Wonder. Great Engineers count; National Wonders do not. = Збудуйте світове чудо. Великы міряникы ся рахують; народны чуда нї.
Build your first World Wonder. Great Engineer acceleration counts; National Wonders do not. = Збудуйте своє перше світове чудо. Приспішіня великым міряником ся рахує; народны чуда нї.
By the Nile, stone begins to tell the story of your age. = Коло Нілу камінь зачінать росказовати історію вашого віку.
Capture 2 different foreign cities in combat during one of your turns. Losing military units does not disqualify you. = Добудьте 2 різны чужы міста в бою за єден свій тяг. Страта войсковых формовань вас невылучує.
Capture 2 different foreign cities in combat in one turn. Military losses are allowed. = Добудьте 2 різны чужы міста в бою за єден тяг. Войсковы страты суть позволены.
Capture a city founded by another major civilization in combat. = В бою добудьте місто, котре заложыла інша велика цівілізація.
Capture in combat a city founded by another major civilization. = Добудьте в бою місто заложене іншов великов цівілізаційов.
China: Breaking the Line = Китай: Проломіня ряда
China: one Chu-Ko-Nu destroys 2 different military units of other major civilizations in one turn. = Китай: єдно Чу-Ко-Ну знищіть 2 різны войсковы формованя іншых великых цівілізацій за єден тяг.
Circle of Allies = Коло союзників
City-State Friend = Приятель міста-державы
Clear a Barbarian encampment. = Знищте варварьскый табор.
Complete a trade with another major civilization containing Gold, Gold per turn, resources or Open Borders. = Докончіте торговлю з іншов великов цівілізаційов, котра містить золото, золото за тяг, здрої або одкрыты граніцї.
Complete an entire social policy branch. = Докончіте цїлу галузь інстітуцій.
Complete any entire social policy branch. = Докончіте котруколвек цїлу галузь інстітуцій.
Connect a self-founded city to your capital by road or Harbor. = Спойте вами заложене місто з головным містом дорогов або гаванёв.
Connect a self-founded non-capital city to your capital through a game-recognized road or Harbor connection. = Спойте вами заложене неголовне місто з головным містом споєнём дорогов або гаванёв, котре бавка признать.
Conqueror = Conqueror
Cross-game records are synced with iCloud. = Записы меджі бавками суть синхронізованы з iCloud.
Cross-game records are waiting to sync with iCloud. = Записы меджі бавками чекають на синхронізацію з iCloud.
Defying the Gods = Наперек богам
Deity: win any victory, including Time. = Божество: здобудьте котреколвек побіджіня вєдно з часовым.
