The general Askia turned the Songhai nation into the most powerful state of West Africa, bringing a golden age of religion and knowledge. = Ґенерал Аскія змінив сонґайскый народ на найсилнішу державу западной Афрікы, приносячи Золотый вік реліґії тай знаня.

'The Scourge of God' united the Hunnic tribes, and led them to great wealth and glory, antagonizing the Romans across his borders relentlessly. = «Біч Божый» споїв гунскі роды тай их повів ид великому богатству тай славі, безперестанно протистоячи Римлянам за своїма границями.

The creator of the Pax Romana and the Roman Empire, who ended a long civil war and brought peace to the entire Mediterranean, possibly the greatest emperor of Rome. = Творитель Pax Romana тай Римской імперії, котрый скінчив довгу гражданску войну тай приніс мир цілому Середземноморю, може, найвекшый цісарь Рима.

The successful political career of the Iron Chancellor cannot be undermined, for he united Germany as we know it today, in his own way. = Успішну політічну карієру Желізного канцляра не мож зневажити, бо своїм способом споїв Німецько, як го днесь знаєме.

