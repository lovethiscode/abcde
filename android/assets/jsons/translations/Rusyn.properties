Darius I = Дарій I
Your continue existence is an embarrassment to all leaders everywhere! You must be destroyed! = Ваше далше існованя є ганбов про вшиткых вождів усокот! Мусите быти знищені!
Curse you! You are beneath me, son of a donkey driver! I will crush you! = Будьте прокляті! Вы сьте пудо мнов, сыну ослячого погонича! Здрушу вас!
You mongrel! Cursed be you! The world will long lament your heinous crime! = Мішанцю! Будь проклятый! Світ буде довго оплаковати твій огавный злочін!
Peace be on you! I am Darius, the great and outstanding king of kings of great Persia... but I suppose you knew that. = Мир вам! Я єм Дарій, великый тай вынятковый король королів великой Перзії... айбо думаю, же сесе знаєте.
In my endless magnanimity, I am making you this offer. You agree, of course? = У своїй безконечнуй великодушности вам даю сю понуку. Правда, згодите ся?
Good day to you! = Добрый вам день!
Ahh... you... = Агххх... вы...
Achaemenid Legacy = Дідузнина Ахеменідув
Great King Darius of Persia, the heaven casts its light upon you! Persian people are strong and wise, as their leader. In old ages, the great Persian king Cyrus fought back the mighty Median empire and finally destroyed the Medes in 550 BC. Cunning diplomacy and military achievements helped then to conquer the wealthy Lydia and the powerful Babylon, Cyrus' son conquering the eternal Egypt some years later. At the height of its power, the Persian Empire reached the shores of Macedonia, at the very door of the upstart Greek city-states. Persia would have prospered for centuries if Alexander of Macedon hadn't brutally destroyed the great empire in one violent strike. = Великый королю Дарію Перзькый, небо на вас ввергат своє світло! Перзькый народ є силный тай мудрый, як єго вождь. У давніх часах великый перзькый король Кір удбив силну Мідійску імперію тай наконець знищив Мідійців у 550 році до н. е. Хытра діпломатія тай воєнні успіхы потім помогли добыти богату Лідію тай силный Вавилон, а Кіров сын дакілько років потім добыв вічный Еґипет. На вершку свойой силы Перзька імперія досягла береги Македонії, просто коло дверей новых ґрецькых варошів-держав. Перзія бы процвітала столітями, кобы Александр Македоньскый жорстоко не знищив велику імперію єдным силным ударом.
King Darius, the people of Persia await, longing for its past glory and power! Persia of the Immortals must reborn, to punish its foes and rebuild the gleaming Persepolis! Will your new empire shine through the ages of history? = Королю Дарію, народ Перзії чекат, жадаючи єй давню славу тай силу! Перзія Безсмертных мусит ся знову народити, обы покарати своїх неприятелів тай обновити світлый Персеполь! Ци ваша нова імперія буде світити через вікы історії?
