Augustus Caesar = Цезарь Аугустус
My treasury contains little and my soldiers are getting impatient... (sigh) ...therefore you must die. = Моя скарбниця має мало, а мої воякы страчают терпливость... (вздых) ...зато мусите умерти.
So brave, yet so stupid! If only you had a brain similar to your courage. = Так смілый, айбо так дурный! Кобы сьте мали розум подобный вашуй смілости.
The gods have deprived Rome of their favour. We have been defeated. = Богы лишили нас. Пройграли-сьме.
I wasn't sure, but it seems you do have some grit. = Не быв єм певный, айбо выходить, же маєте даяку удвагу.
I greet you. I am Augustus, Imperator and Pontifex Maximus of Rome. If you are a friend of Rome, you are welcome. = Здоровлю вас. Я єм Авґуст, імператор тай Pontifex Maximus Рима. Кідь сьте приятель Рима, сьте вітаны.
I offer this, for your consideration. = Пропоную исе на твуй розсуд.
Hail. = Привіт.
What do you want? = Що ти хочеш?
The Glory of Rome = Ґлорія Романа
Ave Caesar Augustus, Emperor of Rome and Dominus of the Roman Empire! Your empire was the most powerful and feared of all in Western civilization. The Roman people crafted so brilliantly its culture, law, art, and warfare, that no one could contest the supremacy of Rome. Force and Honor led to glorious conquests, a domination of all the lands from Spain in the west to Syria in the east, even reaching the remote barbarian lands of England and Germany. Roman art and architecture have been praised for millenia and have been envied by all lesser civilizations who have followed. = Слава цісарёви Авґустови, імператорови Рима тай панови Римской імперії! Ваша імперія была найсилніша тай найбояніша из вшиткых у западнуй цівілізації. Римскый народ так мудро створив свою културу, право, уменя тай воєнництво, же нихто не міг спірити первенство Рима. Сила тай честь довели ид славным добытям, панованю над вшиткыма землями уд Іспанії на заході до Сірії на выході, тай аж до далекых варварскых земель Анґлії тай Ґерманії. Римске уменя тай архітектура были хвалені тісячолітями, тай вшиткі менші цівілізації, котрі пришли потім, им завиділи.
O glorious Imperator, your people celebrate you and ask for the glory of Rome! In these times of darkness, the Pax Romana will be a beacon of light for all! Will your new empire shine through the ages of history? = О славный імператоре, ваш народ вас ославує тай просит славу Рима! У тых темных часах Pax Romana буде світлом про вшиткых! Ци ваша нова імперія буде світити через вікы історії?
