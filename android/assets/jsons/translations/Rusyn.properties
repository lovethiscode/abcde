存够 100 金币，并让每回合净收入达到 +3 = Назберайте 100 золота і досягнїть чистый приход хоць +3 за ход.
守住开局首都，直到第 20 轮所有电脑行动结束 = Заховайте початкове головне місто, докы вшыткы компютерны грачі не скінчать дїї в 20. цїлім ходї.
安排生产队列，让首都成长。 = Наставте порядок продукованя і розвивайте головне місто.
完成游戏的征服胜利条件后自动结算。想拿经济挑战星，应在最后一战前，先连续保持 3 轮收入与幸福度都至少为 0。 = Рівень скінчіть автоматічно по перемозї панованьом. Про економічну звізду держте приход і щастя хоць 0 за 3 цїлы ходы за собов перед послїднім боём.
完成通关目标后可结算 = По сповнїню головной цїлї можете завершити рівень.
