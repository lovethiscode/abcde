原创战役共有四章十六关。每关至少获得一颗星，解锁下一关。\n完成本章获得章节完成记录；全部三星可获得精通勋章。\n各关的局势与目标独立，已通关关卡可反复挑战。 = Оріґінална кампанія має штири главы і шістнадцять місій. Здобудьте хоць єдну гвіздку, обы одомкнути далшу місію.\nДокончіте главу, обы записати поступ; здобудьте вшыткы гвіздкы про єй майстерьску медайлу.\nКажда місія має свою сітуацію і цїлї. Докончены місії можете бавити знова.
让第一座城，在河谷中生根。 = Нех ваше перше місто пустить корїнї в долинї.
越过边境，建立繁荣的国家。 = Перейдьте граніцю і збудуйте процвітаючій народ.
从第一场交锋，到夺取要塞。 = Од першой сутычкы до добутя твердзы.
把你的策略，连成完整的胜利。 = Спойте свою стратеґію про побіджіня.
