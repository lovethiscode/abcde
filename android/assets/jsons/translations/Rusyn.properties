Otto von Bismarck = Отто фон Бісмарк
I cannot wait until ye grow even mightier. Therefore, prepare for war! = Ми не можемо допустити вашого посилення. Тож готуйтесь до війни!
Corrupted villain! We will bring you into the ground! = Лиходію! Ми зрівняємо вас з землею!
Germany has been destroyed. I weep for the future generations. = Німеччина була знищена. Мені шкода наступні покоління.
That wild bravado? It's a ticking time bomb, especially when you're all bark and no bite! = Така дика хвальба? Сесе є часова бомба, особливо коли лем гавкате, айбо не кусате!
Guten Tag. In the name of the great German people, I bid you welcome. = Гутен таг. Від імені великого німецького народу, я вітаю вас.
It would be in your best interest, to carefully consider this proposal. = У твоїх інтересах уважно розглянути цю пропозицію.
What now? = Но та што тепирь?
So, out with it! = Вон удсі!
Furor Teutonicus = Ярость Тевтонув
All hail to Otto von Bismarck, first chancellor of Germany and its empire! During the ancient era, Germany was a land fragmented in several tribes but already showed great promise as the Roman Empire itself struggled to bend the Germans to its will. Germany, as one nation, was slowly built on the ruins of the Holy Roman Empire, and waited 1871 to be finally unified after the glorious victory on France and Napoleon III. The German people are creative, intelligent, industrious and proven to be talented warriors through history. Despite great catastrophes and failures in the first half of the 20th century, Germany can always rely on its people will and strength to be among the greatest and powerful nations in the world. = Слава Оттови фон Бісмаркови, першому канцлярови Німецька тай єго імперії! У давнуй епосі Німецько было землёв розділенов меджі дакілько родів, айбо уже указовало великі можности, бо самій Римскуй імперії ся не подавало пудкорити Німців своїй волі. Німецько як єден народ ся помалы ставило на руїнах Святой Римской імперії тай чекало аж до 1871, коли ся наконець споїло по славнуй побіді над Франційов тай Наполеоном III. Німецькый народ є творивый, розумный, трудолюбивый тай через історію указав надалость про войну. Наперек великым бідам тай невдачам у першуй половині 20. столітя ся Німецько усе може оперти на волю тай силу свого народа, обы належати меджі найвекшы тай найсилнішы народы світа.
Great Prince Bismarck, glory and power are at the heart of the German nation. Your people are bright, and lend you their iron will to lead Germany once again. Will your new empire shine through the ages of history? = Великый князю Бісмарку, слава тай сила суть у сердці німецького народа. Ваш народ є розумный тай вам дават свою желізну волю, обы сьте знову повели Німецько. Ци ваша нова імперія буде світити через вікы історії?
