Alternatively, click on the "Unimproved" number to center the world screen only on owned (by you or your allied City-states) tiles where the resource is not improved. = Або натиснїть чісло «Неполїпшены», обы выцентровати світовый екран лем на властны поля (вашы або вашых союзных міст-держав), де здрой неє полїпшеный.
If more than one tile is available, click repeatedly on the notification to cycle through all of them. = Кідь є доступне веце як єдно поле, повторно натискайте ознам, обы перейти через вшыткы.
