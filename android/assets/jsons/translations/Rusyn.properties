在第 4 个行动回合结束前建立首都 = Заложте головне місто перед кінцьом 4. ходу дїї.
在粮食候选区或产能候选区，任选一处建立首都 = Выберте їдлове або продукчне місто про заложіня головного міста.
在精心设计的局势中，探索属于你的策略。 = Продуманый стан. Ваша стратеґія.
