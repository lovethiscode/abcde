William of Orange = Вілгелм Оранж
As much as I despise war, I consider it a, hahaha, contribution to the common cause to erase your existence. = Хоць войну ненавиджу, вважаю истертя вашого існованя за, гагага, вклад до сполочной справы.
You call yourself an exalted ruler, but I see nothing more than a smartly dressed barbarian! = Звете ся высокым володарём, айбо я не виджу нич веце як добре облеченого варвара!
My God, be merciful to my soul. My God, feel pity for this... my poor people! = Боже мій, будь милосердный ид мойуй душі. Боже мій, май жаль над сым... моїм бідным народом!
I am William of Orange, stadtholder of The Netherlands. Did you need anything? I still have a lot to do. = Я єм Вілем Оранжскый, штатгалтер Нідерландів. Ци сьте дашто потребовали? Іще мам много роботы.
I believe I have something that may be of some importance to you. = Думаю, же мам дашто, што бы про вас могло мати значіня.
Once again, greetings. = Ще раз вітаю.
Dutch East India Company = Голандійська Ост-Індійська Компанія
Greetings to the wise and brave Prince William of Orange, who freed the Netherlands and gave strength to the Dutch people. In 1568, you led a rebellion against Spanish dominion, to gain freedom for your people, and therefore starting the Eighty Years' War. Your actions were all aimed to create one of Europe's first modern republics, the Seven United Provinces. The rebellion was the meaning of your very life and death, as it was also the cause of your assassination in 1584. But your death has given even more pride and courage to your people, to fight for liberty against any oppressors. Carved in history as the 'Father of the Fatherland', your name is a symbol of Dutch independence for eternity. = Здоровля мудрому тай смілому князёви Вілемови Оранжскому, котрый высвободив Нідерланды тай дав силу голандскому народу. У 1568 сьте повели повстаня проти іспанского панованя, обы здобыти свободу про свій народ, тай так зачали Восемдесятрічну войну. Вшиткі ваші діла были замірені на створіня єдной из першых новочасных европейскых републік, Седем споєных провінцій. Повстаня было смыслом вашого самого жывота тай смерти, бо было і причінов вашого убитя у 1584. Айбо ваша смерть дала іще веце гордости тай смілости вашому народу, обы боёвав за свободу проти каждого угнітователя. Вырізане в історії як «Отець отчізны», ваше мено є навічно сімволом голандской незалежности.
Brave Prince, your people ask for your wisdom to gain its freedom once more, and to illuminate the world with progressive and modern ideas. Will your new empire shine through the ages of history? = Смілый князю, ваш народ просит вашу мудрость, обы знову здобыти свою свободу тай освітити світ поступныма тай новочасныма думками. Ци ваша нова імперія буде світити через вікы історії?
