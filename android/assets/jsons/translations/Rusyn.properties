Montezuma I = Монтесума I
Xi-miqa-can! Xi-miqa-can! Xi-miqa-can! (Die, die, die!) = Ксі-міква-кан! Ксі-міква-кан! Ксі-міква-кан! (Умри, умри, умри!)
Excellent! Let the blood flow in raging torrents! = Барз добрі! Най кров тече дикима потоками!
Monster! Who are you to destroy my greatness? = Бестіє! Хто сьте, же знищуєте мою великость?
What do I see before me? Another beating heart for my sacrificial fire. = Што виджу перед собов? Друге биюче сердце про мій жертвенный огінь.
Accept this agreement or suffer the consequences. = Прийміт сю угоду або терпіт наслідкы.
Welcome, friend. = Вітам, приятелю.
Sacrificial Captives = Жертвоприношеня заятых
O divine Montezuma, your people welcome you! May your magnificence inspire all living things! The mighty Aztecs were nomads until the 12th century, when they choose to settle in the mesa central, which would later be called Mexico. Wars were frequent with other tribes to control the rich land surrounding the sacred lakes of Texcoco, Xaltocan and Zampango. In some 200 years, double-sided alliances and martial prowess made of the Aztecs the dominant power in the Central American basin, forming a mighty empire stretching from sea to sea. Alas, the empire fell under the assault of foreign devils - the Spaniards and many curses they brought with them! Wars between tribes and weaponry of doom used by the invaders made the great Aztec civilization crumble in only a few decades. = О божескый Монтесумо, ваш народ вас вітат! Най ваша велеліпность надыхне вшитко жыве! Силні Ацтекы были кочовниками аж до 12. столітя, коли ся рішыли усадити на середній вышині, котру потім звали Мексіко. Войны из другыма родами были часті про власть над богатов землёв кругом святых озер Тескоко, Хальтокан тай Сампанґо. За даяких 200 років двосторонні союзы тай воєнна зручность учинили из Ацтеків головну силу середнёамеріцькой котлины, створившы силну імперію уд моря до моря. На жаль, імперія упала пуд нападом чужых діяволів — Іспанців тай многых проклятств, котрі принесли из собов! Войны меджі родами тай згубна зброя нападників учинили, же велика ацтецька цівілізація упала за лем пару десятиліть.
O mighty King Montezuma, do you hear the call of your people seeking for revenge? Will you lead them to victory under the light of the Five Suns? Will your new empire shine through the ages of history? = О силный королю Монтесумо, ци чуєте кликаня свого народа, котрый глядат помсту? Ци поведете их ид побіді пуд світлом Пятьох сонць? Ци ваша нова імперія буде світити через вікы історії?
