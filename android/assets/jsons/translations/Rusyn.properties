Isabella = Изабелла
God will probably forgive you... but I shall not. Prepare for war. = Бог вам, може, удпустить... айбо я ні. Готовте ся на войну.
Repugnant spawn of the devil! You will pay! = Огавне диявлове порідя! Заплатите!
If my defeat is, without any doubt, the will of God, then I will accept it. = Кідь є моя поразка без жадной похыбности Божов волёв, та ю прийму.
God blesses those who deserve it. I am Isabel of Spain. = Бог благословлят тых, котрі сесе заслужат. Я єм Ізабела Іспанска.
I hope this deal will receive your blessing. = Дуфам, же ся сюй угоді дустане ваше благословіня.
Seven Cities of Gold = Сім Золотых Варошув
Holy Isabella, envoy of God, Great Queen of Castille and León, your people celebrate you! Spain is a beautiful and ancient country, a link between Europe and Africa, one shore on the Mediterranean and the other on the mighty Atlantic Ocean. The Spanish culture had taken the best of the Christian and Muslim worlds, and was ready to dominate the world for centuries. Powerful Spanish military fleets and brave explorers found and conquered much of the New World. Exploiting a whole new continent and its riches, Spain reached a state of power few could compete with for hundreds of years. = Свята Ізабело, посланко Божа, велика королёво Кастілії тай Леона, ваш народ вас ославує! Іспанія є крашна тай давня держава, споїня меджі Европов тай Афріков, из єдным берегом на Середземнум мори тай другым на силнум Атлантічнум океані. Іспанска култура перебрала найлїпше из хрістіянского тай мусулманского світа тай была готова столітями панувати над світом. Силні іспанскі воєнні флотілы тай смілі досліджователі нашли тай добили велику часть Нового світа. Хоснуючи цілый новый контінент тай єго богатства, Іспанія досягла силу, котру мало хто міг дорівнати через соткы років.
O splendid and virtuous Isabella! By the will of the heavens, will Spain reborn to achieve its holy destiny and become a new El Dorado? Will your new empire shine through the ages of history? = О велеліпна тай доброчінна Ізабело! Ци ся Іспанія з волі небес знову народит, обы выповнити свій святый осуд тай стати новым Ельдорадом? Ци ваша нова імперія буде світити через вікы історії?
