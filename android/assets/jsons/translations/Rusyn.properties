Share a medal = Здїляти медайлу
Shared prosperity begins to flow between your cities. = Сполочный добробут зачінать течі меджі вашыма містами.
Sign in to Game Center in Settings to view and sync achievements. Offline achievements remain saved on this device. = Приголосьте ся до Game Center в Наставлїнях про перегляданя і синхронізованя досягнінь. Досягнїня без споєня остають всокочены на тім приладї.
Sign in to iCloud to sync unfinished cross-game challenges between devices. = Приголосьте ся до iCloud, обы синхронізовати недокончены вызвы меджі бавками і приладами.
Simultaneously own 4 self-founded cities with at least 15 population each, while your civilization's Happiness is at least 0. = Майте нараз 4 вами заложены міста зо щонайменше 15 обывателями в каждїм, причім щастя вашой цівілізації є щонайменше 0.
Small acts of stewardship build a generous reserve. = Малы чіны ґаздованя творять богату запасу.
Some earned medals are waiting to sync. You can keep playing. = Даякы здобыты медайлы чекають на синхронізацію. Можете далше бавити.
The first Game Center sign-in claims unbound offline medals once. Later offline results belong to the last bound player; switching accounts does not transfer games or queues. Game Center syncs completed medals. iCloud syncs extra cross-game facts when configured; use the same accounts on both devices. Medal sharing never invents game dates, turns or battle results. = Перше приголошіня до Game Center раз придїлить непривязаны медайлы здобыты без споєня. Пізнїшы выслідкы без споєня належать послїднёму привязаному бавлячови; зміна контів не перенесе бавкы анї чергы. Game Center синхронізує докончены медайлы. iCloud при наставлїню синхронізує далшы факты меджі бавками; на обидвох приладах хоснуйте єднакы конта. Здїляня медайл николи не выдумує дати бавкы, тягы або выслідкы боїв.
The land begins to reward its people's care. = Земля зачінать одмінёвати старостливость своїх людей.
The lights of one city can still reach the stars. = Світла єдного міста можуть досягнути і гвізды.
The share image could not be created. Please try again. = Образ на здїляня ся не подарило створити. Попробуйте знова.
The world answers your leadership with its own choice. = Світ одповідать на ваше ведїня своїм властным выбором.
The world keeps a wonder for those who explore. = Світ лишать чудо тым, котры го розвідують.
This Game Center player's records belong to a different iCloud account. Return to that iCloud account to resume syncing. = Записы того бавляча Game Center належать іншому конту iCloud. Вернїть ся до того конта iCloud про обновлїня синхронізації.
Thriving Metropolis = Процвітаюча метропола
Time changes a veteran's armor, but never their honor. = Час мінить панцїр ветерана, але николи ёго честь.
Trade Gold, Gold per turn, resources or Open Borders with another major civilization. = Торгуйте золотом, золотом за тяг, здроями або одкрытыма граніцями з іншов великов цівілізаційов.
Triumphant Banner = Побідна застава
