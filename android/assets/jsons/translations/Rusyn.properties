Oda Nobunaga = Ода Нобунаґа
I hereby inform you of our intention to wipe out your civilization from this world. = Я тут для того, щоб поінформувати тебе про наші наміри винищити вашу цивілізацію з цього світу.
Pitiful fool! Now we shall destroy you! = Жалюгідний дурень! Тепер ми тебе знищимо!
You were much wiser than I thought. = Ти був мудрішим, аніж я гадав.
I expected more for you from. = Чекав єм уд вас веце.
We hope for a fair and just relationship with you, who are renowned for military bravery. = Ми сподіваємось на чесні та справедливі стосунки з тобою, відомим за свою військову сміливість.
I would be grateful if you agreed on the following proposal. = Я буду вдячний, якщо ти погодишся на наступну пропозицію.
Oh, it's you... = Ой, це ти...
Bushido = Бушідо
Lord Oda Nobunaga, ruler of Japan, the land of the Rising Sun is at your command! Through history, Japanese people lived and died with honor, proud of their rich culture of arts and letters. Years of bloody civil wars, invasions of foreign powers, wealth but also great poverty, have never altered the strong will of the Rising Sun island, as the Bushido spirit has imbued the fields of battle and the Japanese society for millenia. At the end of the 19th century, under foreign influence, your people took the path of modernity, and in a few decades, made of Japan a land of technological innovation and powerful industry, with which only few nations can compete. = Пане Ода Нобунаґа, володарю Японії, земля Восходячого сонця є пуд вашым велінём! Через історію японскый народ жыв тай умирав из честёв, гордый на свою богату културу уменя тай писменства. Рокы кровавых гражданскых войн, напады чужых сил, богатство, ай і велика біднота, ніґда не змінили силну волю острова Восходячого сонця, бо дух бушідо наповняв боіща тай японску сполочность через тісячолітя. На кінци 19. столітя, пуд чужым вплывом, ваш народ вступив на путь новочасности тай за пару десятиліть учинив из Японії землю технолоґічного обновованя тай силного промыслу, из котров ся може порівнати лем мало народів.
O great daimyo, will you take on your hands the Japan destiny, for the Rising Sun to light the world? Will your new empire shine through the ages of history? = О великый даймё, ци візьмете до своїх рук осуд Японії, обы Восходяче сонце освітило світ? Ци ваша нова імперія буде світити через вікы історії?
