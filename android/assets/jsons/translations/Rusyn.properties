解放归还已完成。 = Вызволїня і вернутя докончене.
尚无符合条件的解放归还记录。 = Жадне сповняюче умовы вызволїня і вернутя неє записане.
本关发生归属中断，可在后续关卡重新尝试。 = Властнїня было перерване; попробуйте знова в далшій фазї.
三城连续归属观察中，按时完成本关后核对。 = Слїдує ся непрерване властнїня; контролює ся при вчаснім докончіню фазы.
达到三城容量并在首波前建立三城，可在后续关卡尝试。 = Одомкнїть капаціту трёх міст і майте три міста перед першов хвилёв даякой будучой фазы.
把长期发展转化为完整终局，纪念第一次亲自完成一场胜利。 = Приведьте довгочасный розвиток до повного кінця і припомяньте своє перше побіджіня.
选择第二座城的位置，在资源、地形和扩张成本之间作第一次取舍。 = Выберте місце другого міста і выважте здрої, терен і цїны росшырїня.
第一次为文明选择发展方向，感受政策带来的长期差异。 = Выберте напрям своёй цівілізації і спознайте трвалы ефекты інстітуцій.
协调两座城市的生产与黄金时代时机；争夺奇观的风险，让排期本身成为决策。 = Скоордінуйте продукованя в двох містах з часованём золотого віку. Змаганя о чуда робить з розвргу стратеґічный выбор.
围绕一座奇观安排科技和生产，体验与其他文明争夺同一目标。 = Плануйте технолоґію і продукованя около чуда і змагайте з іншыма цівілізаціями о ёго збудованя.
认识移动、攻击与生存的基本关系，获得第一次真实交锋的反馈。 = У своїм першім правдивім бою ся научте, як сполу діють рух, атака і пережытя.
把地图上的土地变成实际产出，理解工人与城市发展的关系。 = Переміньте землю на продукчны поля і научте ся, як робутникы підпорують розвиток міста.
把分散的城市组织成网络，选择道路、海港或两者组合，而非只追求城市数量。 = Спойте россыпаны міста до сїтї дорогами, гаванями або обидвома, намісто зосереджіня лем на чісло міст.
让粮食、人口与教育设施相互支持，形成一座有清楚用途的学术中心。 = Спойте їдіня, населїня і учебны будовы, обы створити особитный центр учіня.
比较不同城邦类型的收益，决定把有限外交投入放在哪里。 = Порівняйте выгоды різных тіпів міст-держав і рїште, де вложыти свої обмежены діпломатічны здрої.
把创教转为本土社会的共同信仰，体验城市布局、自然传播和主动传教的配合。 = Шырте свою заложену реліґію дома споєнём положіня міст, природного шырїня і актівного навертаня.
在未知地图中获得发现的惊喜。作为自然探索纪念，不要求为三处奇观反复重开。 = Тїште ся з одкрыть на незнамім мапі. Тот розвідный міджник не потребує повторне зачинаня про найденя трёх чудес.
以有限城市投入科研，依靠质量和发展效率完成太空目标。允许防卫战争，限制的是指定战斗占城。 = Зосередьте обмежене чісло міст на учінне баданя про досягнутя космосу. Оборонны войны суть позволены; обмежіня ся тыкать указаных войсковых добутів.
在有限城市规模下集中积累文化，安排政策、建设与胜利项目的先后。 = Сустрїдьте културу в малій імперії і плануйте порядок інстітуцій, будов і проєкту побіджіня.
改变扩张来源：不继续自行建城，以军事实力和占领后的管理建立帝国。 = Росшыряйте ся добуванём намісто закладаня далшых міст і збудуйте імперію войсковов силов і справованём міст.
用有限城市支撑政策专精，选择两条适合当前战略的政策路线。 = Підпорте зосередженый розвиток інстітуцій обмеженым чіслом міст і выберте дві галузї, котры ся годять вашій стратеґії.
围绕外国首都组织宗教影响力，选择传播对象与时机，承担跨国竞争。 = Будуйте реліґійный вплив около чужых головных міст і выбирайте, де і коли го шырити спомеджі меджінародного змаганя.
利用埃及建造优势，把一座城市经营成奇观中心，在科技、生产与抢建风险之间取舍。自选重投入专项。 = Хоснуйте будовляну выгоду Еґіпта, обы зробити єдно місто центром чудес, з вываженым баданём, продукованём і змаганём. То є вольна вызва, котра потребує значный вклад.
预先协调多条战线和占城部队，让几场局部战斗汇成同一回合的战略突破。 = Коордінуйте веце фронтів і формованя на добутя, обы ся окремы бої стали стратеґічным проломом за єден тяг.
围绕波斯黄金时代的持续时间与战斗优势准备攻势，在有效窗口集中兑现实力。自选进阶专项。 = Приготовте офензиву подля трваня і бойовых выгод золотого віку Перзії. То є вольна покрочіла вызва.
用小国规模应对更高难度，挑选一条适合的非时间胜利路线，而非依靠不断扩张。 = Поставте ся высшій тяжкости з малов імперійов і выберте пригодный способ побіджіня окрем часового, намісто сполїганя на постійне росшырїня.
检验对整体战略、时机和局势判断的掌握；是玩家主动选择的高手目标。 = Перевірте своє овладаня стратеґії, часованя і сітуації. Тота експертна вызва є вольна.
让唯一城市承担科研、经济与防卫，寻找单城条件下的完整发展解法。 = Хоснуйте єдно місто на баданя, економію і оборону і розвиньте повну стратеґію в тім лімітї.
主动放弃世界奇观这条优势来源，探索政策、城市发展与文化胜利之间的其他组合。 = Зречте ся світовых чудес і розвідуйте іншы способы споєня інстітуцій, розвитку міста і културного побіджіня.
