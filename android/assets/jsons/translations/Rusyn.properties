You're disturbing us, prepare for war. = Вы нас непокоїте, готовте ся на войну.
You've fallen into my trap. I'll bury you. = Упали сьте до мойой пасті. Похороню вас.
I congratulate you for your victory. = Вінчую вас из вашов побідов.
Welcome. I'm Napoleon, of France; the smartest military man in world history. = Вітам. Я єм Наполеон, из Франції; найрозумнішый вояк у світовуй історії.
France offers you this exceptional proposition. = Франція вам дават сю выняткову понуку.
Hello. = Привіт.
It's you. = Це ти.
Ancien Régime = Старый ріхт
Vive Napoleon I, First Consul and Emperor of France! After the glorious Revolution which suppressed the centuries-old monarchy, the French nation stood at the heart of Europe as a Republic, and intended to export its ideals to the entire European continent, either by diplomacy or war. The French Capital Paris was more than ever the world center of Culture, Arts, and Letters. With its Great Army, reputed as one of the greatest in the History, France fought gloriously all surrounding enemies, but eventually fell against the coalition of other European powers. = Най жыє Наполеон I, першый конзул тай цісарь Франції! По славнуй революції, котра зрушила столітну монархію, францзускый народ став у сердці Европы републіков тай хотів росшырити свої ідеалы на цілый европейскый контінент, діпломатійов або войнов. Францзускый головный варош Паріж быв веце як коли світовым центром културы, уменя тай писменства. Из свойов Великов армійов, знанов як єдна из найвекшых у історії, Франція славно боёвала проти вшиткых околишніх неприятелів, айбо наконець упала проти союза другых европейскых сил.
Napoleon Bonaparte, ruler of the French people, will you rebuild the Empire to take revenge on your foes, and make again of its Capital the City of Lights? Will your new empire shine through the ages of history? = Наполеоне Бонапарте, володарю францзуского народа, ци обновите імперію, обы ся помстити своїм неприятелям тай знову учинити из єй головного вароша Варош світла? Ци ваша нова імперія буде світити через вікы історії?
