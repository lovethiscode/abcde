Restore saves from iCloud now?\nSaves deleted only on this device return\nif they still exist in iCloud.\nOther changes still sync both ways;\na same-named version may be replaced.\nConflicts are kept separately. = Обновити всокочіня із iCloud теперь?\nВсокочіня істертї лем на тім заряджіню ся вернуть, кедь іщі суть в iCloud.\nІншы зміны ся сінхронізують в обох напрямах; верзія з тым самым іменом може быти замінена.\nКонфліктны верзії ся хранять окремо.
Checking iCloud availability... = Перевірює ся доступность iCloud…
