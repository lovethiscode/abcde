My people will mourn me not with tears, but with human blood. = Мій народ ня буде оплаковати людсков кровёв місто сліз.
Do you know who you're dealing with? = Ци знаєте, из кым маєте справу?
You are in the presence of Attila, scourge of Rome. Do not let hubris be your downfall as well. = Вы сьте перед Атілом, каров Рима. Не дайте, обы і вас пыха згубила.
This is better than you deserve, but let it not be said that I am an unfair man. = Сесе є ліпше, як заслужите, айбо най ся не повідат, же єм неправедный чоловік.
Good day to you. = Добридень.
Scourge of God = Кара Божа
Great Attila, mighty warrior and leader of the Hunnic empire, your men bow down before you. During the 5th century, you and your brother Bleda have conquered many lands, forged a mighty empire and commanded the most powerful and frightening force of antiquity. You inspired fear to the Roman Emperors themselves, who called you 'Flagellum Dei', the 'Scourge of God', as you took kingdom after kingdom in the Balkans, invaded Eastern Roman Empire, into Gaul and Northern Italy, and planned to conquer Rome itself. Your empire didn't survive long after your death, but your name and your legend have, for millenia to come. = Великый Атіло, силный вояку тай вождю гунской імперії, ваші люде ся перед вами кланяют. Через 5. столітя сьте из братом Бледом добили многі землі, створили силну імперію тай управовали найсилнішым тай найстрашнішым войском давніх часів. Будили сьте страх у самых римскых цісарів, котрі вас звали «Flagellum Dei», «Біч Божый», коли сьте брали королівство по королівстві на Балканах, напали на Выходну Римску імперію, Ґалію тай північну Італію тай плановали добыти сам Рим. Ваша імперія по вашуй смерти довго не выжыла, айбо ваше мено тай ваша повість выжыли на будучі тісячолітя.
Fearsome General, your mighty hordes are at your command, waiting to crush your foes once again and to conquer all the riches the world has to offer! Will your new empire shine through the ages of history? = Страшный ґенерале, ваші силні орды суть пуд вашым велінём, чекаючи знову здрушити ваших неприятелів тай добыти вшиткі богатства, котрі світ понукат! Ци ваша нова імперія буде світити через вікы історії?
