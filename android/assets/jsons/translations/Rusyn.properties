Hello, again. = Зась серус.
Oh, it's you! = О, ты!
Sun Never Sets = Сонце ніґда не сідат
Long live to Your Highness, Queen Elizabeth Gloriana, leader and protector of the glorious England! Through history, enduring many invasions, England strengthened its will, playing smartly with diplomacy, cunning, and military power, to eventually rose as one of the most dominant Empires the world has ever known. Their matchless navy, brilliant scientists and artists, and powerful merchants, have shaped the known world for centuries. = Най довго жыє Ваша Высокость, королёва Алжбета Ґлоріана, володарка тай охранителька славной Анґлії! Через історію, перетерпівшы многі напады, Анґлія утвердила свою волю, розумно хоснуючи діпломатію, хытрость тай воєнну силу, аж ся стала єднов из найсилнішых імперій, котрі світ когда знав. Их непорівнателне морске войско, мудрі учені тай умелці тай силні торговникы формовали знаный світ через столітя.
Queen Elizabeth, will England cast once more its brightness upon all lands and seas of the world? Will your new empire shine through the ages of history? = Королёво Алжбето, ци Анґлія знову вверже свою світлость на вшиткі землі тай моря світа? Ци ваша нова імперія буде світити через вікы історії?
