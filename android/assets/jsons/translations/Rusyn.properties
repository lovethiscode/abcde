Alexander = Александер Великый
You are in my way, you must be destroyed. = Вы мі стоїте у пути, мусите быти знищені.
As a matter of fact I too grow weary of peace. = По правді, і я ся уже уставав уд мира.
You have somehow become my undoing! What kind of beast are you? = Вы сьте ся даяк стали мойов згубов! Яка сьте бестія?
The Gods frown upon your foolishness. = Богы ся мрачат над вашов дурнотов.
Hello stranger! I am Alexandros, son of kings and grandson of the gods! = Здоровлю, чужинче! Я єм Александрос, сын королів тай внук богів!
My friend, does this seem reasonable to you? = Приятелю мій, ци ся вам сесе видит розумне?
Greetings! = Здоровлю!
What? = Што?
Hellenic League = Елінічна Ліґа
Great King Alexander, leader of the mighty Greek nation, you are truly blessed by the gods. In 480 BC, quarrelsome city-states such as Athens, Sparta, Thebes, found a way to join their forces, allowing Greece to defeat the mighty Persia in the 5th century BC, both on land and sea. Following their example, you lead a Greek coalition and finally struck down the Persian Empire in 331 BC. You conquered almost all the known world, and from Europe to Africa to India, you built an empire unmatched by any before it. = Великый королю Александре, вождю силного ґрецького народа, вы сьте правдиво благословленый богами. У 480 році до н. е. сварливі варошы-державы, як Атены, Спарта тай Тебы, нашли способ споїти свої силы, што позволило Ґреції побідити силну Перзію у 5. столітю до н. е., на земли і на мори. За их прикладом сьте повели ґрецькый союз тай наконець побідили Перзьку імперію у 331 році до н. е. Добили сьте майже цілый знаный світ тай уд Европы через Афріку аж до Індії поставили імперію, котру жадна попередня не дорівнала.
Megalexandros, son of Zeus, will you ride Bucephalas again, to gift the world with the brightness of the Greek culture? Will your new empire shine through the ages of history? = Меґалександре, сыну Зевса, ци знову сядете на Буцефала, обы даровати світови світлость ґрецькой културы? Ци ваша нова імперія буде світити через вікы історії?
