Discover a Natural Wonder; entering its tile is unnecessary. = Одкрыйте природне чудо; вступ на ёго поле неє потрібный.
Earn a medal in a qualifying new game to share it here. = Здобудьте медайлу в новій бавцї сповняючій умовы, обы єй туй здїляти.
Egypt: Epic in Stone = Еґіпет: Епос в каменї
Egypt: build 3 different World Wonders in one game; no victory required. = Еґіпет: збудуйте 3 різны світовы чуда в єдній бавцї; побіджіня неє потрібне.
Emperor+: win Culture without ever owning a World Wonder. National Wonders are allowed. = Імператор+: здобудьте културне побіджіня без того, обы сьте даколи мали світове чудо. Народны чуда суть позволены.
Emperor+: win Science with One City Challenge enabled, never owning a second city, even briefly. = Імператор+: здобудьте научне побіджіня з уволенов Вызвов єдного міста, причім николи, ани на хвілю, немайте друге місто.
Emperor+: win any victory, including Time. = Імператор+: здобудьте котреколвек побіджіня вєдно з часовым.
Enter a Golden Age for the first time, through any normal game mechanism. = Першыраз вступте до золотого віку через котрыйколвек обычайный механізм бавкы.
Enter a Golden Age. = Вступте до золотого віку.
Even without a wonder to crown it, your civilization shines. = І без чуда на корунованя ваша цівілізація світить.
Every capital bears witness to your journey. = Кажде головне місто свідчіть о вашій пути.
Except N26 and N40, complete each achievement in one game. Process achievements do not require victory. All numerical targets are minimums. Population, Gold, connections, allies and religious majorities are checked together at your turn end or the settled game ending. Other actions count only after the entire operation finishes. = Окрем N26 і N40 сповнїть кажде досягнїня в єдній бавцї. Поступовы досягнїня не потребують побіджіня. Вшыткы чіселны цїлї суть мінімум. Населїня, золото, споєня, союзници і реліґійны векшости ся контролюють нараз на кінцю вашого тягу або по докончіню бавкы. Іншы дїї ся рахують лем по докончіню цїлой операції.
Faith Beyond Borders = Віра за граніцями
Faith Fulfilled = Сповнена віра
First Blood = First Blood
First Envoy = First Envoy
First Faith = First Faith
First Taste of Victory = Першый смак побіджіня
First Wonder = First Wonder
Found a Pantheon in a game with religion enabled. = Заложте пантеон у бавцї з уволенов реліґійов.
Found a Pantheon with religion enabled. = Заложте пантеон з уволенов реліґійов.
Found a religion and finish enhancing that same religion, with religion enabled. = Заложте реліґію і докончіте пудпираня той самой реліґії з уволенов реліґійов.
Found a second city after your first capital. = Заложте друге місто по своїм першім головнім містї.
Found and enhance your own religion. = Заложте і пудопріть свою властну реліґію.
Found your second city after founding your first capital. = Заложте своє друге місто по заложіню першого головного міста.
Four Flourishing Cities = Штири процвітаючі міста
Game Center is connected. Completed medals sync with this player account. = Game Center є припоїный. Докончены медайлы ся синхронізують з тым контом бавляча.
Game Center is offline. Earned medals are saved locally and will be submitted after reconnection. = Game Center є без споєня. Здобыты медайлы суть всокочены локално і будуть одосланы по обновлїню споєня.
Golden Dawn = Golden Dawn
Growing Treasury = Растуча скарбніця
Have 3 City-State allies at once. = Майте 3 союзны міста-державы нараз.
Have 4 self-founded cities with 15 population each and nonnegative Happiness. = Майте 4 вами заложены міста, кажде зо 15 обывателями, і незапорне щастя.
Have a city reach 10 population. = Досягнїть у містї 10 обывателїв.
Have a city reach 20 population. = Досягнїть у містї 20 обывателїв.
Have one living military unit earn 5 XP promotions. Free ones do not count; upgrades preserve progress. = Нех єдно жыве войскове формованя здобыть 5 повышінь за скушеность. Дарованы ся не рахують; полїпшеня лишають поступ.
Have one living military unit earn 5 experience promotions. Free and starting promotions do not count; normal upgrades preserve its record. = Нех єдно жыве войскове формованя здобыть 5 скушеностных повышінь. Дарованы і початочны ся не рахують; обычайны полїпшеня лишають ёго запис.
Have your Worker build a new Farm, Mine or Pasture. = Нех ваш робутник збудує нову ферму, баню або пасовиско.
Have your own Worker build a new Farm, Mine or Pasture. Repairs do not count. = Нех ваш властный робутник збудує нову ферму, баню або пасовиско. Оправы ся не рахують.
Have your own founded religion be the majority religion in 10 cities at once, including 3 currently owned by other major civilizations. Passive spread counts. = Майте свою властну заложену реліґію як векшостну реліґію в 10 містах нараз, вєдно зо 3 містами теперь властненами іншыма великыма цівілізаціями. Пасівне шырїня ся рахує.
Hold 2,000 Gold at once. = Майте нараз 2,000 золота.
Hold 500 Gold at once. = Майте нараз 500 золота.
Hold at least 2,000 Gold at once. Historical income does not count. = Майте нараз щонайменше 2,000 золота. Минулы приходы ся не рахують.
Hold at least 500 Gold at once. Previously spent Gold does not count. = Майте нараз щонайменше 500 золота. Уже спотребоване золото ся не рахує.
Light of Civilization = Світло цівілізації
Most achievements allow any difficulty and need at least 1 AI opponent. Only N30, N36, N37, N38 and N39 require the stated difficulty and at least 3 AI opponents. You need not enable all victory routes. All game speeds are allowed. Any victory includes Time. Religion achievements require religion to be enabled. = Векшость досягнінь дозволює каждую тяжкость і потребує щонайменше 1 компютерного суперя. Лем N30, N36, N37, N38 і N39 потребують указаный уровень тяжкости і щонайменше 3 компютерных суперїв. Не мусите уволити вшыткы способы побіджіня. Вшыткы скорости бавкы суть позволены. Котреколвек побіджіня містить і часове. Реліґійны досягнїня потребують уволену реліґію.
N38 forbids ever owning a second city, including founding, conquest, puppets, trades and brief ownership. N39 forbids ever owning a World Wonder by any means; losing it later does not erase that branch's history. N26 collects 8 distinct self-built World Wonders across qualifying new games. N40 requires the other 39 new medals; old medals never substitute for them. = N38 заборонює даколи мати друге місто, вєдно зо заложінём, добутём, маріонетками, торговлёв і краткым властнїнём. N39 заборонює даколи мати світове чудо котрымколвек способом; пізнїша страта не стерть історію той галузи. N26 зберать 8 різных самостатно збудованых світовых чудес через сповняючі умовы новы бавкы. N40 потребує другых 39 новых медайл; стары медайлы їх николи не замінять.
Nature's Gift = Дар природы
On Deity difficulty, win any formal victory, including Time. = На тяжкости Божество здобудьте котреколвек офіціалне побіджіня вєдно з часовым.
On Emperor difficulty or higher, enable One City Challenge and win a Scientific Victory without ever owning a second city, even temporarily. = На тяжкости Імператор або высше уволте Вызву єдного міста і здобудьте научне побіджіня без того, обы сьте даколи мали друге місто, ани дочасно.
On Emperor difficulty or higher, win a Cultural Victory without ever owning a World Wonder, whether built, captured or received. National Wonders are allowed. = На тяжкости Імператор або высше здобудьте културне побіджіня без того, обы сьте даколи мали світове чудо — збудоване, добуте або дароване. Народны чуда суть позволены.
On Emperor difficulty or higher, win any formal victory, including Time. = На тяжкости Імператор або высше здобудьте котреколвек офіціалне побіджіня вєдно з часовым.
On Prince difficulty or higher, build 8 different World Wonders in one game. = На тяжкости Принц або высше збудуйте 8 різных світовых чудес в єдній бавцї.
One City, Many Stars = Єдно місто, много гвізд
One city holds the dreams of countless people. = Єдно місто несе сны несчісленных людей.
Only qualifying new games started with this new achievement catalog count. Old saves cannot gain eligibility by copying, importing or resaving. Use a built-in ruleset, one human major civilization, a generated map and an Ancient-era start, without mods or editor scenarios. = Рахуют ся лем придатні нові бавкы, зачаті из сым новым каталоґом успіхів. Старі всокочіня не можуть здобыти придатность копійованём, імпортованём ци повторным всокочінём. Хоснуйте встроєный набор правил, єдну велику цівілізацію управовану чоловіком, створену мапу тай початок у давнуй епосі, без модів ци сценаріїв едітора.
Ordinary save loading restores that branch's challenge history; earned medals stay unlocked. God mode, state-changing debug commands and full AI autoplay permanently disqualify that game, even after loading an older save. Normal Worker automation and exploration are allowed. The first formal victory or your defeat ends contributions; playing another turn does not count. = Обычайне начітаня всокоченя обновить історію вызвы той галузи; здобыты медайлы остануть одомкнуты. Божскый режим, ладячі приказы міняючі стан і повне компютерне автобавлїня навсе вылучують ту бавку, і по начітаню старшого всокоченя. Обычайна автоматізація робутників і розвідованя суть позволены. Перше офіціалне побіджіня або ваша поражка скінчать придованя; бавлїня далшого тягу ся не рахує.
Own a city with at least 10 population. = Майте місто зо щонайменше 10 обывателями.
