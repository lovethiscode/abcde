In Politics overview > Show diagram, you can click anywhere inside the diagram to display a table listing all relationship line colors and their meaning. = В Перегляд політікы > Указати діаґрам можете натиснути десь в діаґрамі, обы указати таблічку фарб ліній одношінь і їх значіня.
Reading "Toast" popups = Чітаня короткых ознамів
"Toasts" can be clicked to make them stay on the screen for easier reading. = Короткы ознамы можете натиснути, обы остали на екрані і лїпше ся чітали.
Click it again to close (or use the close button). = Натиснїть іщі раз про завжаня (або хоснуйте кнопку завжаня).
