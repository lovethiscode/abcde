Dido = Дідона
Tell me, do you all know how numerous my armies, elephants and the gdadons are? No? Today, you shall find out! = Повідайте, ци вшиткі знаєте, які многі суть мої армії, слоны тай ґдадоны? Ні? Днесь ся дознаєте!
Fate is against you. You earned the animosity of Carthage in your exploration. Your days are numbered. = Осуд є проти вас. Своїм досліджованём сьте здобыли ворожость Картаґена. Ваші дні суть пораховані.
The fates became to hate me. This is it? You wouldn't destroy us so without their help. = Осуды ня зачали ненавидіти. Сесе є конець? Без их помочі бы сьте нас так не знищили.
You aren't meeting my expectations. You can do so much better. = Не выповнюєте мої чеканя. Можете много ліпше.
The Phoenicians welcome you to this most pleasant kingdom. I am Dido, the queen of Carthage and all that belongs to it. = Фінічане вас вітат у сём наймилішум королівстві. Я єм Дідо, королёва Картаґена тай вшиткого, што ид нёму належит.
I just had the marvelous idea, and I think you'll appreciate it too. = Лем дораз єм дустала дивну думку тай думаю, же ю і вы оціните.
What is it now? = Що тепер?
Phoenician Heritage = Фінікійська спадщина
Greetings to you, revered Queen Dido, ruler of the legendary kingdom of Carthage. The great poet Virgil related your great history, how your husband Acerbas was murdered by your own brother, King Pygmalion of Tyre, to steal the treasures of your family that were rightfully yours. But you endured his pressure until you and your compatriots decided to flee and sail for new lands. The gods led you to the shores of North Africa, and with cunning diplomacy, you expanded the territory of your new home, and laid the basis for the future kingdom of Carthage. = Здоровиме вас, чистована королёво Дідо, володарко леґендарного королівства Картаґен. Великый поет Верґілій выповідав вашу велику історію, як вашого мужа Акерба убив ваш власный брат, король Піґмаліон Тірскый, обы украсти поклады вашой родины, котрі правом належали вам. Айбо сьте вытримали єго натиск, докы сьте ся из земляками не розрішыли утікти тай плыти до новых земель. Богы вас привели на береги північной Афрікы тай хытров діпломатійов сьте росшырили теріторію свого нового домова тай положили основы будучого королівства Картаґен.
Clever and proud Dido, the storm is coming and your people look for a shelter under your wise and powerful protection. Can you create a new and radiant Carthage able to cleave the darkness? Will your new empire shine through the ages of history? = Розумна тай горда Дідо, буря приходит тай ваш народ глядат сховок пуд вашов мудров тай силнов охранов. Ци можете створити новый тай світлый Картаґен, котрый буде здатный розтяти темноту? Ци ваша нова імперія буде світити через вікы історії?
