# Refactored menu and window localization
1. Tap Create room, choose the rules and map, then share the invitation. = 1. Натисніть «Створити кімнату», выберіть правила і мапу, потім поширьте запрошіня.
1. The Android player copies their Player ID from Multiplayer and sends it to the iOS host. = 1. Грач на Android копірує свій ID грача з розділу «Бавка у рокаши» і посылать го господарьови на iOS.
2. In an empty player seat, the host taps Add player manually, pastes the Player ID, taps the portrait to choose a civilization, then taps Mark ready. = 2. На вольнім місці господарь натисне «Додати грача ручні», вставить ID грача, натисне на портрет, жебы выбрати цівілізацію, а потім «Означити готовым».
2. Other iOS players open the invitation or paste it in Join by invitation, tap their civilization portrait to choose, then tap Ready. = 2. Другы грачі на iOS удкрывають запрошіня або вставляють го в «Приєднати ся за запрошінём», натискають на портрет цівілізації, а потім «Готовый».
3. After starting, the Game ID is copied automatically. Send it to the Android player to add the game in Multiplayer. = 3. По зачатю бавкы ID бавкы копірує ся автоматічні. Пошліть го грачови на Android, жебы додав бавку в розділі «Бавка у рокаши».
3. The host is ready automatically. When everyone is ready, the host taps Start game. No Player ID or Game ID exchange is needed. = 3. Господарь готовый автоматічні. Кідь вшыткы готовы, господарь натисне «Зачати бавку». Обмін ID грачів або бавкы не треба.
