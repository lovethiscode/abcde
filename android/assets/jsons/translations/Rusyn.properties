After updating, you might want to see what has changed. The "About" in "Options" has the version number linked to the change log. You can also see that info by clicking the version number on the main menu. = По обновлїню можете хотїти видїти, што ся змінило. «О бавцї» в «Наставлїнях» має чісло верзії з одказом на список змін. Тоты інформації можете видїти і натиснїнём чісла верзії в головнім меню.

Differences from Civilization V = Роздїлы од Civilization V
Production Focus\nIn Civilization V, the Food yield in a city is calculated first, then population grows by consuming stored food (growth), then production is calculated, and so on one by one the other stats are calculated. Thus, citizens can produce yields in the same turn as they are born. The city focus is set to Production to assign the newborn citizen to a hill so they'll contribute Production, and then manually reassigned to a growth tile on the next turn. Alternatively, you can set city focus to Gold (e.g. with Cerro de Potosi), Faith (e.g. with Mount Sinai) or whatever gains the most yields. In Unciv, citizens only start producing yields on the next turn, so you can ignore this whole concept. = Зосереджіня на продукованя\nВ Civilization V ся найперше вырахує вынос їдіня міста, пак населїня выросте спотребованём всокоченого їдіня (приросту), пак ся рахує продукованя і по єднім іншы штатістікы. Так обывателї можуть давати выносы уж в тягу народжіня. Зосереджіня міста ся наставить на продукованя, обы нового обывателя придїлити на горб і придати продукованя, а далшого тягу ся ручнї перенесе на поле приросту. Або можете наставити зосереджіня на золото (напр. з Cerro de Potosi), віру (напр. з горов Сінай) або што давать найвеце выносів. В Unciv зачнуть обывателї давати выносы лем далшого тягу, тож цїлый тот поступ можете іґноровати.
Science Queueing\nIn Civilization V, Science yield is calculated after production, so if you finish an item and have Science (or Gold) queued as a perpetual construction, the Production overflow from item will be converted into Science (or Gold), but the Production is not consumed, as this will only happen again on the next turn. By immediately swapping out your perpetual construction for an item on the next turn, you'll get this Science (or Gold) for free. This doesn't apply to Unciv, so don't bother. = Черга наукы\nВ Civilization V ся вынос наукы рахує по продукованю, тож кідь докончіте положку і маєте науку (або золото) в черзї як безконечне будованя, звышок продукованя ся перемінить на науку (або золото), але продукованя ся не спотребує, бо то ся стане знова лем далшого тягу. Кідь далшого тягу одразу заміните безконечне будованя на положку, дістанете тоту науку (або золото) задурно. В Unciv то не платить, тож ся тым нетрапте.
Double Aqueducts\nIn Civilization V, the game sells existing copies of the building for you before providing a free copy of the building. So, if you build an aqueduct in a city, and then in the turn of adopting Tradition Complete you sell a cheap building (e.g a shrine) beforehand, the game is unable to sell more than 1 building per turn, and thus you'll keep your aqueduct, together with the new free aqueduct. Not applicable to Unciv. = Двойты акведукты\nВ Civilization V бавка продасть єствуючі копії будовы перед тым, як дасть копію задурно. Тож кідь в містї збудуєте акведукт і в тягу принятя Сповненой традіції наперед продасте дешеву будову (напр. святыню), бавка не може продати веце як 1 будову за тяг і лишыть вам акведукт вєдно з новым акведуктом задурно. В Unciv то не платить.
Legalism Oxford\nIn Civilization V, national wonders such as Oxford University are considered culture buildings, so you can get them for free with Legalism. Not applicable to Unciv. = Леґалізм і Оксфорд\nВ Civilization V суть народны чуда, як Оксфордска університета, рахованы за културны будовы, тож їх можете здобыти задурно через Леґалізм. В Unciv то не платить.
Roads and Forts\nIn Civilization V, you can't use roads and forts in enemy territory. In Unciv, you can use them, so instead of mindlessly constructing them everywhere when at war, you need to decide if and when they'll benefit you more than your opponents. = Дорогы і твердзы\nВ Civilization V не можете хосновати дорогы і твердзы на ворожскій землї. В Unciv можете, тож намісто бездумного будованя вшаде за войны мусите рїшыти, ці і коли вам дадуть веце хосну як вашым ворогам.
Citizen Conversion\nIn Civilization V, a citizen is born religious if the parent city is already converted. This is not the case in Unciv, which can lead to temporary deconversion of a city when it grows. = Навернутя обывателїв\nВ Civilization V ся обыватель народить віруючій, кідь є ёго місто уж навернуте. В Unciv то так неє, што може причінити дочасну страту реліґії міста при ёго ростї.
Unassigned Citizens\nIn Civilization V, unassigned citizens are considered specialists, and subject to the same type of bonuses (e.g. Korea's ability). It can be worthwhile to leave citizens unassigned, instead of being assigned to a tile. Not applicable to Unciv. = Непридїлены обывателї\nВ Civilization V суть непридїлены обывателї рахованы за шпецїалістів і дістають єднакы тіпы бонусів (напр. способность Кореї). Може ся хоснувати лишыти обывателїв непридїленых намісто роботы на полї. В Unciv то не платить.
Settler Construction\nIn Civilization V, cities can't starve when constructing settlers, so you can assign all citizens to production tiles and none to food tiles. In Unciv, citizens keep consuming two food per turn. = Будованя поселенця\nВ Civilization V міста при будованю поселенців не можуть голодовати, тож можете вшыткых обывателїв придїлити на продукчне поле і жадного на їдіня. В Unciv обывателї далше спотребують два їдіня за тяг.
Water Melee Attack\nAs result of a Discord poll, Water Melee units can attack military land units on the shore, unlike in Civilization V. = Водна близька атака\nПодля голосованя на Discord можуть водны близькобуйны формованя атакувати войсковы сухоземны формованя на березї, інакше як в Civilization V.
Tile improvements\nIn Civilzation V, workers start working on an improvement-under-construction at the beginning of movement. Unciv changes this, to allow players to assign workers to tiles, and then reconsider and change improvement or move them elsewhere. = Полїпшеня поль\nВ Civilization V робутникы зачнуть робити на недоконченім полїпшеню на початку руху. Unciv то мінить, обы бавлячі могли придїлити робутників на поля і пак передумати, змінити полїпшеня або їх порушати інакуде.
Forest and Jungle Visibility\nIn Unciv, forests and jungles are visible 1 tile outside visibility range. In Civilization V, this is the behaviour of hills and mountains, but not of forests and jungles, yet jungle and forest can block hills, and hill + forest can block mountain, indicating they're on the same elevation. This is considered to be a bug in the otherwise well-structured visibility logic in Civilization V. = Видимость лїсів і джунґлїв\nВ Unciv суть лїсы і джунґлї видимы 1 поле за досягом видимости. В Civilization V то так є при горбах і горах, але не при лїсах і джунґлях, гоц джунґля і лїс можуть скрывати горбы, а горб з лїсом може скрывати гору, што указує єднаку вышку. То ся рахує за хыбу в інакше добрій лоґіцї видимости Civilization V.
City razing\nIn Civilization V, the player can never raze any of the cities he/she founded. Not applicable to Unciv. = Палїня міста\nВ Civilization V бавляч николи не може спалити місто, котре сам заложыв. В Unciv то не платить.

Founding Cities\nThe Settler is a unit that can found a new city. You can build a Settler unit in a city with at least 2 population, and then move them to a good location to found a new city. This will usually be your main way of acquiring more cities. = Закладаня міст\nПоселенець є формованя, котре може заложыти нове місто. Поселенця можете збудовати в містї зо щонайменше 2 обывателями і пак го порушати на добре місце про заложіня нового міста. То буде обычайно ваш головный способ здобываня далшых міст.
Food conversion to Production\nDuring the construction of a Settler, the city will not grow. Instead, the 1st, 2nd, 4th, and from there on every 4th, excess Food (Growth) is converted into Production, with the rest of the excess Food being lost. = Переміна їдіня на продукованя\nЗа будованя поселенця місто не росте. Намісто того ся 1., 2., 4. і пак кажде 4. звышне їдіня (прирост) перемінить на продукованя; решта звышного їдіня ся стратить.

