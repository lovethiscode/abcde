Catherine = Катарина
You've behaved yourself very badly, you know it. Now it's payback time. = Справовали сьте ся барз недобрі, знаєте то. Дораз пришов час заплаты.
You've mistaken my passion for a weakness, you'll regret about this. = Помылили сьте ся, коли сьте мою горячость узяли за слабость, будете сесе бановати.
We were defeated, so this makes me your prisoner. I suppose there are worse fates. = Были сьме побіджені, так єм дораз ваш полоненик. Думаю, же є і гіршый осуд.
Fine then. It's your call. = Та добрі. Сесе є ваше розрішіня.
I greet you, stranger! If you are as intelligent and tactful as you are attractive, we'll get along just fine. = Здоровлю вас, чужинче! Кідь сьте так розумні тай тактні, як сьте привабливі, будеме добрі выходити.
How would you like it if I propose this kind of exchange? = Як бы ся вам любило, кідь бы єм понукнула такый обмін?
Hello! = Привіт!
What do you need?! = Що тобі потрібно?!
Siberian Riches = Заможна Сібірія
Hail to Imperial Majesty Catherine, Empress of all Russians. Living in the largest country in the world, from the Pacific Ocean in the east to the Baltic Sea in the west, your people endured wars, droughts, and many disasters, imbuing the Russian society with heroism and tenacity, and producing artists and scientists among the best in the world. Russia is a powerful empire which rightfully claims its place in the world concert of superpowers. = Слава цісарскуй Высокости Катерині, цісарёвій вшиткых Росіян. Жыючи у найвекшуй державі світа, уд Тіхого океана на выході до Балтійского моря на заході, ваш народ вытримав войны, сухоты тай многі біды, што наповнило російску сполочность геройством тай вытривалостёв, тай дало умелців тай ученых меджі найліпшыма у світі. Росія є силна імперія, котра правом жадат своє місто у світовум зборі велесил.
Empress Catherine, your people are eager for Russian glory, to revive the sacred light of the Motherland. Will your new empire shine through the ages of history? = Цісарёво Катерино, ваш народ жадат російску славу, обы обновити святе світло отчізны. Ци ваша нова імперія буде світити через вікы історії?
