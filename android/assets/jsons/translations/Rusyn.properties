Ramkhamhaeng = Рамакхамхаенг
You lowly, arrogant fool! I will make you regret of your insolence! = Ты низкый, пышный дурню! Учиню, же побануєш свою дръзость!
You scoundrel! I shall prepare to fend you off! = Подляче! Приготовлю ся тя удбити!
Although I lost, my honor shall endure. I wish you good luck. = Хоць єм програв, моя честь зостане. Жадаю вам щастя.
I, Pho Kun Ramkhamhaeng, King of Siam, consider it a great honor that you have walked to visit my country of Siam. = Я, Пхо Кхун Рамкхамгенґ, король Сіяма, вважаю за велику честь, же сьте пришли навщівити мою державу Сіям.
Greetings. I believe this is a fair proposal for both parties. What do you think? = Здоровлю. Думаю, же сесе є праведна понука про обі страны. Што думаєте?
Welcome. = Ласкаво просимо.
Father Governs Children = Няньо правит дітваками
O Great King Ramkhamhaeng, the Siamese people obey you with respect and fear! The beautiful and mysterious land of Siam is an ancient country in the heart of Southeast Asia, which was besieged by many foes, plagued by bloody war and great poverty, but eventually the smart and loyal Siamese people have endured and triumphed. Siam was a part of the Khmer Empire until the 13th century AD, before its brave people took arms and led a revolution to form the small Sukhothai kingdom. After many battles and diplomacy prowess, this tiny kingdom became a mighty empire, which would dominate South East Asia for more than a century. = О великый королю Рамкхамгенґ, сіямскый народ вас слухат из чистованём тай страхом! Крашна тай тайна земля Сіяма є давня держава у сердці юговыходной Азії, котру облягали многі неприятелі, мучили кровава война тай велика біднота, айбо наконець розумный тай вірный сіямскый народ вытримав тай побідив. Сіям быв частьов Кхмерской імперії аж до 13. столітя н. е., перед тым, як єго смілый народ узяв зброю тай повів революцію, обы створити мале королівство Сукхотхай. По многых боях тай мудруй діпломатії ся сесе мале королівство стало силнов імперійов, котра панувала над юговыходнов Азійов веце як столітя.
Wise and powerful King Ramkhamhaeng, your people want to revive these days of glory! Can you make a new dawn break on Siam? Will your new empire shine through the ages of history? = Мудрый тай силный королю Рамкхамгенґ, ваш народ хоче обновити тыя славні дні! Ци можете принести новый світанок на Сіям? Ци ваша нова імперія буде світити через вікы історії?
