Harun al-Rashid = Гарун ал-Рашід
The world will be more beautiful without you. Prepare for war. = Світ буде крашый без вас. Готовте ся на войну.
Fool! You will soon regret dearly! I swear it! = Дурню! Скоро сесе тяжко побануєте! Присягаю!
You have won, congratulations. My palace is now in your possession, and I beg that you care well for the peacock. = Вы сьте выграли, вінчую. Мій палац є дораз ваш, тай прошу, обы сьте ся добрі старали о пава.
Our future battle will be glorious. = Наш будучій бій буде славный.
Welcome foreigner, I am Harun Al-Rashid, Caliph of the Arabs. Come and tell me about your empire. = Вітам, чужинче, я єм Гарун ар-Рашід, халіф Арабів. Прийдіт тай повіджте мі о вашуй імперії.
Come forth, let's do business. = Підійди, давай поторгуємось.
Peace be upon you. = Мир вам.
Trade Caravans = Торгові караваны
Blessings of the Great God be upon you, O great caliph Harun al-Rashid, leader of the mighty Arabian people! The Muslim Empire, the Caliphate, born from chaos after the death of the prophet Muhammad in 632 AD, intended to apply the rule of God to all Earth. And by the will of God, the caliphate reached its full power, ruling Spain, North Africa, the Middle East, Anatolia, the Balkans and Persia, to even surpass the Great Roman Empire. The arts and sciences were a holy gift of Arabia during the Middle Ages, as the infidel lands of Europe delved deep into ignorance and chaos. Lasting for six hundred years, the Caliphate finally fell before the Mongols, the plague of the civilized world. = Най благословіня Великого Бога буде над вами, о великый халіфе Гаруне ар-Рашіде, вождю силного арабского народа! Мусулманска імперія, халіфат, народжена из хаоса по смерти пророка Мухаммеда у 632 році н. е., хотіла принести Боже панованя на цілу землю. Тай Божов волёв халіфат досягнув повну силу, пануючи над Іспанійов, північнов Афріков, Близкым выходом, Анатолійов, Балканами тай Перзійов, аж превзышав Велику Римску імперію. Уменя тай наукы были святым даром Арабії у середніх віках, покы невірні землі Европы глубоко падали до невчености тай хаоса. По шестисто роках тырваня халіфат наконець упав перед Монголами, каров цівілізованого світа.
Great Caliph Harun al Rashid, all Arabian people long for greatness! Arabia must be once again the land of arts and knowledge, which under the radiant law of God, will fear no enemy! Will your new empire shine through the ages of history? = Великый халіфе Гаруне ар-Рашіде, вшыток арабскый народ жадат великость! Арабія мусит знову стати землёв уменя тай знаня, котра ся пуд світлым Божым законом не буде бояти жадного неприятеля! Ци ваша нова імперія буде світити через вікы історії?
