#################### Lines from VictoryTypes from Civ V - Gods & Kings ####################


#################### Lines from Global Tutorials ####################

Welcome to Unciv!\nBecause this is a complex game, there are basic tasks to help familiarize you with the game.\nThese are completely optional, and you're welcome to explore the game on your own! = Вітаме до Unciv!\nБо є сесе зложена бавка, суть туй основні заданя, обы вам помогли ю спознати.\nСуть цілком добровольні, тай можете бавку сміло обявлёвати сами!

Welcome to Unciv! = Вітаме до Unciv!
Because this is a complex game, there are some tutorials to help familiarize you with it. These can be disabled in the Options -> Display menu, but please hang on if you're new here! = Бо є сесе зложена бавка, суть туй даякі наукы, обы вам помогли ю спознати. Можете их вылучити у меню Наставліня -> Указованя, айбо кідь сьте туй нові, іще выдержіт!
Your first mission is to found your capital city. This is actually an important task because your capital city will probably be your most prosperous. Many game bonuses apply only to your capital city, and it will be the center of your empire. = Ваша перша місія є заложити свій головный варош. Сесе є правдиво важне заданя, бо ваш головный варош буде, певно, найпроцвітаючій. Многі бонусы бавкы діют лем про ваш головный варош, тай буде центром вашой імперії.
How do you know a city location is appropriate? Luckily, the game has already chosen a good location for you. You can settle in this place, or maybe move a turn to found on a Hill (for Production and defence) or next to a Mountain (to gain access to the Observatory building later on). = Як знаєте, же є місто про варош добре? Нащастя, бавка уже убрала добре місто про вас. Можете ся усадити туй, або ся рушити єден тяг, обы заложити на пагорку (про выробу тай оборону) ци коло горы (про пізнішый доступ ид будові обсерваторії).
You'll likely want more cities later on. For these cities, you must go and find a good place. Looking for and founding on or near Luxury resources is a good rule of thumb. = Пізніше, певно, будете хотіти веце варошів. Про ті варошы мусите іти тай найти добре місто. Глядати роскішні ресурсы тай закладати варошы на них ци коло них є добре правило.
Luxury resources are tiles that have things like Gems, Cotton, or Silk (indicated by a yellow background of the resource icon). These resources make your civilization happy. You should also keep an eye out for resources needed to build units, such as Iron. Cities cannot be built within 3 tiles of existing cities, which is another thing to keep in mind! = Роскішні ресурсы суть поля из такыма справами як драгоцінні камені, баволна ци гудваб (означені жовтым позадём іконы ресурса). Ті ресурсы чинят вашу цівілізацію щастливов. Мали бы сьте і давати позор на ресурсы потрібні про творіня формовань, як желізо. Варошы ся не можуть ставити у досягу 3 полів уд існуючых варошів, што і треба памятати!
Cities will house Citizens, which can work tiles up to 3 tiles away from the city. This means you don’t have to settle cities right on or next to good tiles. Let’s say, for example, that you want access to some Iron – but the resource is in a desert area. You don’t have to settle your city in the desert. You can settle a few tiles away in more prosperous lands. Your city will grow and eventually gain access to the resource. You only need to settle right on top of resources if you need them immediately. = У варошах жыют жытелі, котрі можуть обробляти поля аж 3 поля уд вароша. Сесе значит, же не мусите закладати варошы просто на добрых полях ци коло них. Повіджме, наприклад, же хочете доступ ид желізу — айбо ресурс є у пустыннуй области. Не мусите заложити варош у пустыні. Можете го заложити пару полів далі у процвітаючішых землях. Ваш варош выросте тай помалы здобыват доступ ид ресурсови. Просто на ресурсах мусите закладати лем кідь их потребуєте такой.
The first thing coming out of your city depends on the strategy you want to follow, but the 'classic' build order is to build first two Scouts, then a Shrine, and three Settlers, and adopt Tradition, to explore the map quickly (Scouts ignore terrain cost), and to get an early Pantheon (if you're playing with religion enabled). = Перше, што ваш варош выробит, залежит уд стратеґії, котру хочете хосновати, айбо «класічный» шор поставліня є найперше два розвідникы, потім святыня тай три поселенці, тай прийнятя Традіції, обы фрішно дослідити мапу (розвідникы не зважуют на ціну терена) тай здобыти ранній пантеон (кідь ся бавите из позволенов реліґійов).
But feel free to experiment with your own build orders! = Айбо сміло пробуйте свої власні шоры поставліня!

In your first couple of turns, you will have very little options, but as your civilization grows, so do the number of things requiring your attention. = При своїх першых дакілько тягах будете мати барз мало можностей, айбо як ваша цівілізація зростає, так зростає і рахунок справ, котрі потребуют вашу увагу.

Culture and Policies = Култура тай інституції
Each turn, the culture you gain from all your cities is added to your Civilization's culture.\nWhen you have enough culture, you may pick a Social Policy, each one giving you a certain bonus. = Кождого тягу ся культура, здобыта зо вшыткых вашых міст, придать ку културі вашой цівілізації.\nКідь маєте досить културы, можете выбрати інстітуцію, котра вам дасть певный бонус.
The policies are organized into branches, with each branch providing a bonus ability when all policies in the branch have been adopted. = Інстітуції суть поділены до галузей; кідь приймете вшыткы інстітуції галузи, дістанете особитну бонусову способность.
With each policy adopted, and with each city built,\n  the cost of adopting another policy rises - so choose wisely! = З кождов прийнятов інстітуційов і з кождовым збудованым містом\n  росте цїна принятя далшой інстітуції — тож выбирайте мудро!

City Expansion = Росшырїня міста
Once a city has gathered enough Culture, it will expand into a neighboring tile.\nYou have no control over the tile it will expand into, but tiles with resources and higher yields are prioritized. = Кідь місто назберать досить културы, росшырить ся на сусїднє поле.\nПоле росшырїня не можете выбрати, але поля зо здроями і высшыма выносами мають передность.
Each additional tile will require more culture, but generally your first cities will eventually expand to a wide tile range. = Кожде далше поле потребує веце културы, але вашы першы міста ся часом обычайно росшырять на велику область.
Although your city will keep expanding forever, your citizens can only work 3 tiles away from city center.\nThis should be taken into account when placing new cities. = Гоц ся ваше місто буде росшыряти без кінця, обывателї можуть робити лем до 3 поль од центра міста.\nНа то треба памятати при закладаню новых міст.

Food is the resource fundamental to your Cities', and as a result Nation's, population and health. = Їдіня є основный здрой про населїня і здоровля вашых міст, а тым і цїлого народа.
Every Citizen in each City consumes Food per turn. Any left over is considered Growth and is stored in the City Center. Once enough accumulates, the City Grows and a new Citizen is added. = Кождовый обыватель кождого міста спотребує їдіня за тяг. Звышок ся рахує як прирост і всокотить ся в центрї міста. Кідь ся го назберать досить, місто выросте і прибуде новый обыватель.
Initially your main source of Food is the City Center itself and working a surrounding tile with a Citizen. You can increase how much is generated by gaining more Citizens to work more tiles, improving the tiles so that they yield more Food, and eventually Buildings and Policies. = Спочатку є головным здроём їдіня сам центр міста і сусїднє поле, на котрім робить обыватель. Вынос можете звышыти веце обывателями, котры оброблять веце поль, полїпшенями поль про веце їдіня, а пізнїше і будовами та інстітуціями.
Since a city's number of Citizens, or Population, determines how many tiles a City can work, Food is often the most important Resource. = Бо чісло обывателїв, ціже населїня міста, урчує, кілько поль може місто обробляти, їдіня часто є найважнїшый здрой.

Production is the resource that lets a City Center build new things. = Продукованя є здрой, котрый дозволює центру міста будовати новы рїчі.
This can be new Buildings that are added to the City Center, or new Units that can go out across the World Map to advance your Nation's goals. = Можуть то быти новы будовы в центрї міста або новы формованя, котры пуйдуть по світовій мапі сповняти цїлї вашого народа.
Everything you can build has a Production Cost. Every turn each City generates a certain amount of Production and puts it towards whatever is at the top of the Build Queue. Once the total cost is collected, the Building or Unit is built! = Вшытко, што можете збудовати, має цїну в продукованю. Кождого тягу кажде місто вытворить певне множство продукованя і вкладать го до першой положкы в будовляній черзї. Кідь ся назберать повна цїна, будова або формованя буде готове!
Any excess Production after something is built is overflowed to the next thing the City builds. Up to it's total Production Cost. = Звышне продукованя по докончіню будовы ся перенесе на далшу рїч, котру місто будує, найвеце до єй повной цїны продукованя.
Since this determines how quickly you can build more stuff, your Nation's Production Capacity is crucial to it's advancement and survival. = Бо то урчує, як скоро можете будовати далшы рїчі, продукчна способность вашого народа є рїшаюча про ёго розвиток і пережытя.

⍾Science is the resource that unlocks new and exciting Technologies for your Nation. = ⍾Наука є здрой, котрый одомыкать вашому народу новы і цїкавы технолоґії.
Once you've Founded your Capital, you'll be prompted to Pick a Technology to Research. = Кідь заложыте головне місто, бавка вас вызве выбрати технолоґію на баданя.
Every Technology costs an amount of ⍾Science. Every turn the ⍾Science your Nation produces is paid towards Researching your chosen Technology. = Кажда технолоґія стоїть певне множство ⍾наукы. Кождого тягу ся ⍾наука, котру ваш народ вытворить, вкладать до баданя выбраной технолоґії.
Once a Technology has it's cost fully paid, you unlock the benefits for your Nation! This could be new Units, Buildings, or other advantages. Any surplus will overflow into the next Technology you pick to Research. = Кідь ся цїла цїна технолоґії заплатить, одомкнете выгоды про свій народ! Можуть то быти новы формованя, будовы або іншы выгоды. Звышок ся перенесе до далшой технолоґії, котру выберете бадати.
Researching a Technology in the next Era will advance you into that Era and trigger a notification to other Nations about how amazing you are! = Выбаданя технолоґії далшой еры вас посуне до той еры і ознамить іншым народам, якы вы сьте чудесны!
Since new Technologies tend to give access to better Units, Buildings, and even unlock powerful new Policies, staying ahead of the competition is one of the best ways to secure your Victory! = Бо новы технолоґії обычайно давуть приступ ку лїпшым формованям, будовам, ба і силным новым інстітуціям, передстигнути суперїв є єден з найліпшых способів забезпечіти своє побіджіня!

Ah Gold. The Universal Medium of Exchange. Everyone loves Gold! They say it can't buy Happiness, but nuclear submarines are almost as good. = Ах, золото. Вшесвітный обмінный средок. Каждому ся любить золото! Говорять, же за нёго не купите щастя, але ядерны поноркы суть майже так добры.
You can earn more Gold from Tiles, Resources, Improvements, and eventually Buildings, Specialists, and Trade Routes. Ancient Ruins, meeting new City-States, and Pillaging are also great sources of Gold. During a Golden Age every Tile that already yields Gold will yield an additional Gold! = Веце золота можете здобыти з поль, здроїв, полїпшень, а часом із будов, шпецїалістів і торговых путей. Стародавны руїны, стрїчаня новых міст-держав і граблїня суть тіж добры здрої золота. За золотого віку кажде поле, котре уж давать золото, дасть іщі єдно золото!
Gold is how you pay for Building Maintenance, Transportation Upkeep, and Unit Upkeep. If you run out of Gold, first you'll receive penalties to your ⍾Science production, then eventually your Units will start Disbanding as you can't pay their upkeep. = Золотом платите за утримованя будов, транспорту і формовань. Кідь вам золото дойде, найперше ся знизить вытворёваня ⍾наукы, а пізнїше ся вашы формованя зачнуть роспущати, бо не можете платити за їх утримованя.
Gold can be used to Buy Buildings and Units, helping bring up a new City or quickly build an Army. It can also buy Tiles to add to your City. It's also used to Upgrade your units from their older, obsolete forms to new, stronger versions. And investing it into a Research Agreement is a great way to convert it into ⍾Science. = За золото можете куповати будовы і формованя, обы розвинути нове місто або скоро поставити войско. Можете за нёго куповати і поля про місто. Ужывать ся тіж на полїпшованя старых, застарїлых формовань на новы, силнїшы верзії. Вклад до дослїдной договоры є добрый способ перемінити го на ⍾науку.
Gold is also very valuable in Diplomacy. You can directly Gift Gold to City-States to gain their favor. Use it to balance a Trade Deal with other Nations. Or demand every last drop after a successful war and your enemy sues for peace. = Золото є дуже цїнне і в діпломатії. Можете го даровати містам-державам, обы здобыти їх прихыльность, дорівнати торгову договору з іншыма народами або по успішній войнї жадати послїдню монету од ворога, котрый просить мир.
Ironically, some may consider Gold to be one of the less important Resources. But it's flexible nature and importance to keep your Nation running makes it a precious thing to pay attention to. After all, everyone loves Gold. = Іронічно, дехто може раховати золото за єден з менше важных здроїв. Але ёго широка хосенність і значіня про функціонованя народа роблять з нёго цїнну рїч, котрій треба дати увагу. Напокон, золото ся любить каждому.
Not to be confused with the Resource of the same name, Gold Ore = Не плетіть із здроём того самого мена — золотов рудов
Trade Route = Торговый путь
See also: [param] = Позерайте тіж: [param]
Research Agreements = Здружені изученя

As cities grow in size and influence, you have to deal with a happiness mechanic that is no longer tied to each individual city.\nInstead, your entire empire shares the same level of satisfaction.\nAs your cities grow in population you’ll find that it is more and more difficult to keep your empire happy. = Як міста ростуть і здобывають вплив, мусите рїшати щастя, котре уж неє вязане на кажде окреме місто.\nНамісто того має цїла ваша імперія єднакый ступінь спокійности.\nЧім веце обывателїв у вашых містах, тым тяжше утримати імперію щастливов.
In addition, you can’t even build any city improvements that increase happiness until you’ve done the appropriate research.\nIf your empire’s happiness ever goes below zero the growth rate of your cities will be hurt.\nIf your empire becomes severely unhappy (as indicated by the smiley-face icon at the top of the interface)\n  your armies will have a big penalty slapped on to their overall combat effectiveness. = До того не можете будовати полїпшеня міста, котры звышують щастя, покы не выбадаєте потрібне.\nКідь щастя вашой імперії упаде під нулу, прирост вашых міст спомалить.\nКідь імперія буде дуже нещастлива (як указує значка тварї вгорї інтерфейса),\n  ваше войско дістане великый постиг на цїлкову бойову учінность.
This means that it is very difficult to expand quickly in Unciv.\nIt isn’t impossible, but as a new player you probably shouldn't do it.\nSo what should you do? Chill out, scout, and improve the land that you do have by building Workers.\nOnly build new cities once you have found a spot that you believe is appropriate. = То значіть, же скоро ся росшыряти в Unciv є дуже тяжко.\nНеє то неможне, але як новый бавляч бы-сьте то скорше не мали робити.\nШто теды робити? Спомальте, розвідовуйте і полїпшуйте свою землю помочов робутників.\nНовы міста закладайте лем кідь найдете місце, котре рахуєте за пригодне.

 # Requires translation!
Unhappiness = Нещастя
It seems that your citizens are unhappy!\nWhile unhappy, your civilization will suffer many detrimental effects, increasing in severity as unhappiness gets higher. = Вызерать, же вашы обывателї суть нещастливы!\nПокы суть нещастливы, ваша цівілізація трпить многы злї впливы, котры суть тяжшы, чім векше є нещастя.
Unhappiness has two main causes: Population and cities.\n  Each city causes 3 unhappiness, and each population, 1 = Нещастя має дві головны причіны: населїня і міста.\n  Кажде місто причінить 3 нещастя і кождовый обыватель 1.
There are 2 main ways to combat unhappiness:\n  by building happiness buildings for your population\n  or by having improved luxury resources within your borders. = Суть 2 головны способы боёвати проти нещастю:\n  будовати будовы щастя про населїня\n  або мати в своїх граніцях полїпшены луксусны здрої.

You have entered a Golden Age!\nGolden age points are accumulated each turn by the total happiness \n  of your civilization\nWhen in a golden age, culture and production generation increases +20%,\n  and every tile already providing at least one gold will provide an extra gold. = Вступили сьте до золотого віку!\nБоды золотого віку ся зберають кождого тягу подля цїлкового щастя \n  вашой цівілізації.\nЗа золотого віку вытворёваня културы і продукованя выросте на +20%,\n  а кажде поле, котре уж давать хоць єдно золото, дасть іщі єдно золото.

Roads and Railroads = Чиненикы тай Штрекы
Roads reduce the Movement Points required to move between two tiles connected by Roads. = Дорогы знижують потребны боды руху на переход меджі двома полями споєныма дорогами.
Railroads improve this reduction even more! = Желїзніцї то зниженя іщі звекшують!
This greatly improves the speed you can get Units around the map. = То дуже приспішує пересуваня формовань по мапі.
Until you research the technology that removes it, Roads do not cross Rivers = Покы не выбадаєте технолоґію, котра то уможнить, дорогы не переходять через рїкы.
Connecting your cities to the capital by Roads and/or Railroads will generate Gold via the Trade Route. = Споєня вашых міст з головным містом дорогами і/або желїзніцями вам принесе золото з торгового путя.
However, since each Road and Railroad have a Maintenance Cost, it may be more economical to wait until the cities grow and only place where needed. = Але бо кажда дорога і желїзніця має кошты утримованя, може быти выгоднїше почекати, покы міста выростуть, і ставляти їх лем там, де суть потрібны.

Connecting your cities to the capital by Roads and/or Railroads will generate Gold via the Trade Route. You earn more Gold the more Population the City and your Capital has. = Споєня вашых міст з головным містом дорогами і/або желїзніцями вам принесе золото з торгового путя. Чім веце населїня має місто і головне місто, тым веце золота здобывате.
Note that each road costs 1 Gold Maintenance per turn, and each Railroad costs 2 Gold, so it may be more economical to wait until the cities grow! = Памятайте, же кажда дорога стоїть 1 золото за тяг на утримованя, а кажда желїзніця 2 золота, тож може быти выгоднїше почекати, покы міста выростуть!
Railroads connecting a city to the Capital also provide a 25% Production Boost to the City, but not the Capital. = Желїзніця споююча місто з головным містом тіж звышує продукованя міста на 25%, але не в головнім містї.
Trade Routes are also connected over Water via certain buildings like the Harbor. As long as there is a chain that can reach the Capital, there's a Trade Route. Look for this symbol in Yellow below the City Name to mean you have an active Trade Route to your Capital. = Торговы путї ся споюють і по водї через будовы, як є гавань. Кідь є споєня, котре досягне головне місто, є і торговый путь. Жовтый сімбол під меном міста значіть, же маєте актівный торговый путь до головного міста.
Trade Routes can get broken either by Blockades or by Removing/Pillaging the connecting Road/Railroad chain. = Торговы путї можуть быти перерваны блокадов або одстранїням/выграблїнём споєных дорог/желїзніць.
City Blockade = Блокада міста

Once you’ve settled 3-4 cities and build universities, you’re probably already 100 to 150 turns into the game.\nNow is a good time to start thinking about how, exactly, you want to win – if you haven’t already. = Кідь сьте заложыли 3–4 міста і збудовали університеты, віроятно сьте уж на 100 аж 150 тягу бавкы.\nТеперь є добрый час думати над тым, як точно хочете побідити, кідь сьте іщі не рїшыли.
There are four ways to win in Unciv. They are:\n - Cultural Victory: Complete 5 Social Policy Trees and build the Utopia Project\n - Domination Victory: Conquer the original capital of all other Major civs\n - Science Victory: Be the first to construct a Spaceship\n - Diplomatic Victory: Build the United Nations and win the vote = В Unciv суть штири способы побіджіня:\n - Културне побіджіня: сповнити 5 дерев інстітуцій і збудовати Проєкт утопії\n - Добувательске побіджіня: добути початочны головны міста вшыткых другых великых цівілізацій\n - Научне побіджіня: першы збудовати космічный корабель\n - Діпломатічне побіджіня: збудовати Зъєднаны народы і выїграти голосованя
So to sum it up, these are the basics of Unciv – Found a prosperous first city, expand slowly to manage happiness, and set yourself up for the victory condition you wish to pursue.\nObviously, there is much more to it than that, but it is important not to jump into the deep end before you know how to swim. = То суть основы Unciv: заложте процвітаюче перше місто, росшыряйте ся помалы, обы удержати щастя, і приготовте ся на способ побіджіня, котрый хочете досягнути.\nПравдаже, бавка має і многе інше, але важне є не скакати до глубины, покы не знаєте плавати.

Enemy City = Ворожске місто
Cities can be conquered by reducing their health to 1, and entering the city with a melee unit.\nSince cities heal each turn, it is best to attack with ranged units and use your melee units to defend them until the city has been defeated! = Міста мож добути зниженём їх здоровля на 1 і вступом близькобуйного формованя до міста.\nБо ся міста лїчать кождого тягу, найліпше є атакувати далекострільныма формованями, а близькобуйныма їх хоронити, покы місто не буде побіджене!

Luxury Resource = Луксусный здрой
Luxury resources within your domain and with their specific improvement are connected to your trade network.\nEach unique Luxury resource you have adds 5 happiness to your civilization, but extra resources of the same type don't add anything, so use them for trading with other civilizations! = Луксусны здрої у вашых граніцях з відповідным полїпшенём суть припоїны до вашой торговой сїтї.\nКождовый різный луксусный здрой придать вашій цівілізації 5 щастя, але далшы здрої того самого тіпу нич не придать, тож торгуйте з нима з іншыма цівілізаціями!

Strategic Resource = Стратеґічный здрой
Strategic resources within your domain and with their specific improvement are connected to your trade network.\nStrategic resources allow you to train units and construct buildings that require those specific resources, for example the Horseman requires Horses. = Стратеґічны здрої у вашых граніцях з відповідным полїпшенём суть припоїны до вашой торговой сїтї.\nСтратеґічны здрої дозволюють цвічіти формованя і ставляти будовы, котры їх потребують; наприклад, їздець потребує конї.
Unlike Luxury Resources, each Strategic Resource on the map provides more than one of that resource.\nThe top bar keeps count of how many unused strategic resources you own.\nA full drilldown of resources is available in the Resources tab in the Overview screen. = Опроти луксусным здроям дає кажде поле стратеґічного здроя веце як єден кус того здроя.\nГорїшня штафлїчка рахує, кілько нехоснованых стратеґічных здроїв маєте.\nПовный перегляд здроїв є в картї Здрої на екрані Перегляд.

The city can no longer put up any resistance!\nHowever, to conquer it, you must enter the city with a melee unit = Місто ся уж не може боронити!\nАле на ёго добутя мусите вступити до міста близькобуйным формованём.

After Conquering = По добутю
When conquering a city, you can choose to liberate, annex, puppet, or raze the city. = При добутю міста можете выбрати, ці го вызволити, приєднати, зробити маріонетков або спалити.
\nLiberating the city will return it to its original owner, giving you a massive diplomatic boost with them!\n\nAnnexing the city will give you full control over it, but also increase the citizens' unhappiness to 2x!\nThis can be mitigated by building a courthouse in the city, returning the citizen's unhappiness to normal.\n\nPuppeting the city will mean that you have no control on the city's production.\nThe city will not increase your tech or policy cost.\nA puppeted city can be annexed at any time, but annexed cities cannot be returned to a puppeted state!\n\nRazing the city will lower its population by 1 each turn until the city is destroyed!\nYou cannot raze a city that is either the starting capital of a civilization or the holy city of a religion. = \nВизволення міста поверне його справжньому власнику, та сильно покращить ваші дипломатичні відносини!\n\nАнексувавши місто, ви отримаєте повний контроль над ним, але його жителі створюватимуть у 2 рази більше нещастя!\nЦе можна компенсувати, побудувавши в місті суд.\n\nВи можете зробити це місто містом-маріонеткою, але тоді не зможете керувати його виробництвом.\nТаке місто не збільшуватиме вартість політик та нових технологій.\nМісто-маріонетка можна анексувати у будь-який час, але повернути йому статус маріонетки не вийде!\n\nЗнищення міста зменшуватиме його населення на 1 кожен хід, доки місто не буде знищено!\nВи не можете зруйнувати місто, яке є початковою столицею цивілізації або Святим містом релігії.

You have encountered a barbarian unit!\nBarbarians attack everyone indiscriminately, so don't let your \n  civilian units go near them, and be careful of your scout! = Стрїтили сьте варварьске формованя!\nВарвары атакують каждого без роздїлу, тож не пушчайте свої \n  цівілны формованя близко них і давайте позор на розвідника!

You have encountered another civilization!\nOther civilizations start out peaceful, and you can trade with them,\n  but they may choose to declare war on you later on = Стрїтили сьте далшу цівілізацію!\nІншы цівілізації зачинають мирно і можете з нима торговати,\n  але пізнїше можуть выповісти вам войну.

Injured Units = Поранены формованя
Injured units deal less damage, but recover after turns that they have been inactive.\nUnits heal 10 health per turn in enemy territory or neutral land,\n  20 inside your territory and 25 in your cities. = Поранены формованя роблять менше шкоды, але ся одновлюють по тягах без актівности.\nФормованя ся лїчать на 10 здоровля за тяг на ворожскій або неутралній землї,\n  на 20 на вашій землї і на 25 у вашых містах.

Workers = Робутникы
Workers are vital to your cities' growth, since only they can construct improvements on tiles.\nImprovements raise the yield of your tiles, allowing your city to produce more and grow faster while working the same amount of tiles! = Робутникы суть потрібны про розвиток вашых міст, бо лем они можуть будовати полїпшеня поль.\nПолїпшеня звышують выносы поль, тож місто може веце вытворяти і скорше рости при оброблїню того самого чісла поль!

Embarking = Налоджіня
Once a certain tech is researched, your land units can embark, allowing them to traverse water tiles.\nEntering or leaving water takes the entire turn. = По выбаданю певной технолоґії ся вашы сухоземны формованя можуть налодити і переходити водны поля.\nВступ до воды або выход з нёй забере цїлый тяг.
Units are defenseless while embarked (cannot use modifiers), and have a fixed Defending Strength based on your tech Era, so be careful!\nRanged Units can't attack, Melee Units have a Strength penalty, and all have limited vision. = Налоджены формованя суть безборонны (не можуть хосновати модіфікаторы) і мають сталу оборонну силу подля вашой технолоґічной еры, тож давайте позор!\nДалекострільны формованя не можуть атакувати, близькобуйны мають постиг силы і вшыткы мають обмеженый догляд.

Idle Units = Неактівны формованя
Clicking 'Next unit' moves to the next idle unit in the queue (as listed in Overview -> Units). After issuing an order to a unit, if 'Auto Unit Cycle' in Options -> Gameplay is enabled, you will automatically select the next idle unit. = Натиснїня «Далше формованя» выбере далше неактівне формованя в черзї (подля Перегляд -> Формованя). По выданю приказа формованю ся автоматічно выбере далше неактівне формованя, кідь є уволена «Автоматічна зміна формовань» у Наставлїня -> Бавлїня.
If you don't want to move a unit this turn, you can skip it by clicking 'Next unit' again, or command the unit to 'Skip turn'. = Кідь сьте не хочете тым тягом формованём рушати, можете го прескочіти новым натиснїнём «Далше формованя» або приказом «Прескочіти тяг».
If you want to disable the 'Next unit' feature entirely, you can toggle it in Options -> Gameplay -> Check for idle units. = Кідь хочете цїлком вылучіти функцію «Далше формованя», можете то зробити в Наставлїня -> Бавлїня -> Контролёвати неактівны формованя.
If you'd rather 'Next unit' cycle the units and not mark them as Done, you can change it in the Options -> Gameplay menu. = Кідь хочете, обы «Далше формованя» лем переміняло формованя і не значіло їх як готовы, можете то змінити в меню Наставлїня -> Бавлїня.
You can also cycle through the idle units using the left and right triangles on the Unit Table in the lower left of the screen. Or by default using the Cycle button next to the 'Next Unit' button. = Меджі неактівныма формованями можете тіж переходити лївым і правым тройкутником на панелї формованя долї влїво на екрані або обычайно кнопков переходу коло кнопкы «Далше формованя».

 # Requires translation!
Contact Me = Звязати ся зо мнов
 # Requires translation!
Hi there! If you've played this far, you've probably seen that the game is currently incomplete.\n Unciv will remain open-source forever. = Вітайте! Кедь сьте дохтори дограли, певно сьте видїли, же бавка іщі не є докінчена.\nUnciv навсе остане з одкрытым кодом.
 # Requires translation!
What motivates me to keep working on it, \n  besides the fact I think it's amazingly cool that I can,\n  is the support from the players - you guys are the best! = До далшой роботы над ньов мене мотивує, \n  окрім того, же можу робити штось таке фантастічне,\n  підпора грачів — вы найліпшы!
 # Requires translation!
If you like Unciv, please rate and review it in the App Store.\n If you find a problem or have a suggestion, open a GitHub issue and help us make the game even better! = Кедь ся вам Unciv любить, оцїньте го і напиште рецензію в App Store.\nКедь найдете проблему або маєте пропозицію, одкрийте повідомлїня на GitHub і поможте нам зробити бавку іщі лїпшов!

Pillaging = Граблїня
Military units can pillage improvements, which heals them 25 health and ruins the improvement.\nThe tile can still be worked, but advantages from the improvement - stat bonuses and resources - will be lost.\nWorkers can repair these improvements, which takes less time than building the improvement from scratch.\nPillaging certain improvements will result in your units looting gold from the improvement. = Військові підрозділи можуть грабувати покращення, така дія знищить його та збільшить здоров'я підрозділу на 25 одиниць.\nКлітинку все ще можна обробляти, проте бонуси від покращень, стратегічні ресурси та ресурси розкоші - все це буде втрачено.\nРобітники можуть відремонтувати пограбовані покращення, це займає менше часу, ніж будівництво з нуля.\nЦивілізація, яка вчинила грабунок, отримає деяку суму ¤Золота.

Experience = Скушеность
Units that enter combat gain experience, which can then be used on promotions for that unit.\nUnits gain more experience when in Melee combat than Ranged, and more when attacking than when defending. = Формованя в бою здобывають скушеность, котру пак можуть хосновати на повышіня.\nФормованя здобывають веце скушености в близькім бою як при далекій стрільбї і веце при атакованю як при оборонї.
Units can only gain up to 30 XP from Barbarian units - meaning up to 2 promotions. After that, Barbarian units will provide no experience. = Формованя можуть од варварьскых формовань здобыти найвеце 30 бодів скушености, ціже 2 повышіня. Пак уж варварьскы формованя не давуть скушеность.

Combat = Буй
Unit and cities are worn down by combat, which is affected by a number of different values.\nEach unit has a certain 'base' combat value, which can be improved by certain conditions, promotions and locations. = Формованя і міста ся в бою опотребовують; на то впливають розлічны вартости.\nКажде формованя має певну «основну» бойову вартость, котру можуть полїпшыти певны условія, повышіня і положіня.
Units use the 'Strength' value as the base combat value when melee attacking and when defending.\nWhen using a ranged attack, they will the use the 'Ranged Strength' value instead. = Формованя хоснують вартость «Сила» як основу боя при близькій атацї і оборонї.\nПри далекій атацї намісто того хоснують вартость «Далекострільна сила».
Ranged attacks can be done from a distance, dependent on the 'Range' value of the unit.\nWhile melee attacks allow the defender to damage the attacker in retaliation, ranged attacks do not. = Далекострільны атакы мож робити з далекости подля «Досягу» формованя.\nПри близькій атацї може оборонця одповісти атакуючому шкодов, але при далекій атацї нї.

Embassies = Посольства
Establishing an embassy in other players' Capital city shows the location of their Capital, likewise other players who establish an embassy in your Capital can see location of your Capital. = Заложіня посольства в головнім містї іншого бавляча одкрыє вам положіня ёго головного міста; рівнако іншы бавлячі з посольством у вас видять положіня вашого головного міста.
Embassies thus allow Spies to be placed in another players' Capital City if Espionage is enabled. = Посольства так дозволюють умістити шпіґунів у головнім містї іншого бавляча, кідь є шпїонаж уволеный.
Mutual embassies are required to allow trading open borders and to sign Research Agreement and Defensive Pact. = Взаємны посольства суть потрібны про торговлю з одкрытыма граніцями і підписаня дослїдной договоры та оборонного пакту.
Declaring war on another player or denouncing them will remove embassies from both players' Capitals. You will have to re-establish them to use their effect. = Выповіджіня войны іншому бавлячу або ёго осуджіня зрушыть посольства в обидвох головных містах. Про їх учінок їх мусите заложыти знова.
Re-establishing an embassy after denunciation from either side becomes available next turn, while re-establishing them when at war requires a peace treaty. = По осуджіню з котройколвек стороны можете посольство обновити далшого тягу; за войны треба найперше мирну договору.
Be cautious when accepting embassy from other players because they can spy on your capital, or worse may start planning to attack you. = Давайте позор при приниманю посольства од другых бавлячів, бо можуть шпїґовати у вашім головнім містї або іщі горше — плановати атаку на вас.
Note that before you can offer an embassy, you need the required Technology. = Памятайте, же перед понукнутём посольства потребуєте відповідну технолоґію.
Embassies are available using the Gods and Kings ruleset. = Посольства суть доступны з правилами Богы тай Королі.
Defensive Pacts = Боронительні пакты

Open Borders from other player and vice versa allow units to freely pass through their territory. = Одкрыты граніцї од іншого бавляча і наоборот дозволюють формованям вольно переходити через їх теріторію.
They also let Missionaries to enter other players' territory without suffering attrition. = Тіж дозволюють місіонарям вступати на теріторію іншых бавлячів без вычерпованя.
Open Borders expire depending on game speed and are canceled upon Declaration of War, the closure however takes effect only after war ends and need to be traded again. = Одкрыты граніцї скінчать подля скорости бавкы і зрушать ся выповіджінём войны; замкнутя але платить лем по кінцю войны і требують нову договору.
You gain diplomatic boost with other AI player if you both have Open Borders to each other = Кідь маєте з іншым компютерным бавлячом взаємно одкрыты граніцї, полїпшыть то вашы діпломатічны одношіня.
Be cautious when giving Open Borders because other player may settle a City near your lands in an area you are planning to use, they may also use your territory to attack your friends or City State allies. = Давайте позор при даваню одкрытых граніць: іншый бавляч може заложыти місто коло вашой земли на місцї, котре сьте хотїли хосновати, або через вашу землю атакувати вашых приятелїв ці союзны міста-державы.
Note that before you can offer or accept open borders, both Nations need the required Technology. = Памятайте, же на понукнутя або принятя одкрытых граніць обидва народы потребують відповідну технолоґію.
When playing with the Gods and Kings ruleset mutual embassies need to be established before Open Borders can be traded. = При правилах Богы тай Королі треба перед договоров о одкрытых граніцях заложыти взаємны посольства.

In Research Agreements, you and another civilization decide to jointly research technology.\nAt the end of the agreement, you will both receive a 'lump sum' of ⍾Science, which will go towards one of your unresearched technologies. = У дослїдных договорах ся вы і далша цівілізація договорите сполочно бадати технолоґії.\nНа кінцю договоры дістанете обидва разове множство ⍾наукы, котре піде на єдну з вашых невыбаданых технолоґій.
The amount of ⍾Science you receive at the end is dependent on the ⍾Science generated by your cities and the other civilization's cities during the agreement - the more, the better! = Множство ⍾наукы, котре на кінцю дістанете, залежыть од ⍾наукы вытвореной вашыма містами і містами другой цівілізації за час договоры — чім веце, тым лїпше!
Note that before you can invest in a research agreement, you must have a Declaraction of Friendship, both Nations need the required Technology, and both Nations need enough Gold on hand for the agreement. = Памятайте, же перед вкладом до дослїдной договоры мусите мати заявлїня приятельства, обидва народы відповідну технолоґію і досить золота на договору.
When playing with the Gods and Kings ruleset mutual embassies need to be established before a Research Agreement can be signed. = При правилах Богы тай Королі треба перед підписанём дослїдной договоры заложыти взаємны посольства.

Defensive pacts allow you and another civ to protect one another from aggressors.\nOnce the defensive pact is signed, you will be drawn into their future defensive wars, just as they will be drawn into your future defensive wars. Declaring war on any Civ will remove all of your defensive pacts. You will have to re-sign them to use their effect. = Оборонны пакты дозволюють вам і другій цівілізації хоронити єден другого перед нападниками.\nПо підписаню пакту вступите до їх будучіх оборонных войн так, як они до вашых. Выповіджіня войны котрійколвек цівілізації зрушыть вшыткы вашы оборонны пакты. Про їх учінок їх мусите підписати знова.
Be cautious when signing defensive pacts because they can bring you into wars that you might not want to be in. = Давайте позор при підписованю оборонных пактів, бо вас можуть втягнути до войн, котры нехочете вести.
The AI is very careful and will not accept defensive pacts with less than 80 influence. = Компютерный бавляч є дуже осторожный і не прийме оборонный пакт при впливі меншім як 80.
Note that before you can sign a defensive pact, you must have a Declaraction of Friendship, and both Nations need the required Technology. = Памятайте, же перед підписанём оборонного пакту мусите мати заявлїня приятельства і обидва народы відповідну технолоґію.
When playing with the Gods and Kings ruleset mutual embassies need to be established before a Defensive Pact can be signed. = При правилах Богы тай Королі треба перед підписанём оборонного пакту заложыти взаємны посольства.

Not all nations are contending with you for victory.\nCity-States are nations that can't win, can't be traded with, and instead confer certain bonuses to friendly civilizations. = Не вшыткы народы з вами змагають о побіджіня.\nМіста-державы суть народы, котры не можуть побідити, не мож з нима торговати, але давуть певны бонусы дружным цівілізаціям.
Instead, diplomatic relations with City-States are determined by Influence - a meter of 'how much the City-State likes you'.\nInfluence can be increased by attacking their enemies, liberating their city, and giving them sums of gold. = Діпломатічны одношіня з містами-державами урчує вплив — міра того, як вас місто-держава має радо.\nВплив можете звышыти атакованём їх ворогів, вызволїнём їх міста і дарами золота.
Certain bonuses are given when you are at above 30 influence.\nWhen you have above 60 Influence, and you have the highest influence with them of all civilizations, you are considered their 'Ally', and gain further bonuses and access to the Luxury and Strategic resources in their lands. = Певны бонусы дістанете при впливі над 30.\nКідь маєте вплив над 60 і найвысшый спомеджі вшыткых цівілізацій, станете їх «союзником» і дістанете далшы бонусы та приступ до луксусных і стратеґічных здроїв на їх землї.

While working the land is good, eventually your Citizens will want to Specialize. = Гоц є оброблїня земли добре, вашы обывателї ся часом будуть хотїти шпецїалізовати.
Certain Buildings will also provide Specialist Slots. These slots will show up in the Citizen Management within the City Screen under Specialists. Each slot can be filled with a Citizen which will then become a Specialist. = Певны будовы давуть місця про шпецїалістів. Тоты місця ся укажуть у справованю обывателїв на екрані міста під Шпецїалістами. На кажде місце можете поставити обывателя, котрый ся стане шпецїалістом.
Each Specialist will generate a certain amount of yield as indicated to the right of the available slots. = Кождовый шпецїаліста вытворить певне множство выносу, указаного вправо од доступных місць.
While these are a great way to specialize the yield production of a City outside of the surrounding Tile Yields, Specialists have an additional value. Each one also generates Great Person Points each turn. With enough of them, a new Great Person will join your Nation. = Окрем того, же можете так шпецїалізовати выносы міста поза выносами сусїднїх поль, шпецїалісты мають далшу цїну. Кождого тягу вытворюють і боды великих особ. Кідь їх є досить, до вашого народа прибуде нова велика особа.
Great People = Проміненты

Certain buildings, and specialists in cities, generate Great Person points per turn.\nThere are several types of Great People, and their points accumulate separately.\nThe number of points per turn and accumulated points can be viewed in the Overview screen. = Певны будовы і шпецїалісты в містах вытворюють боды великих особ за тяг.\nЄ веце тіпів великих особ і їх боды ся зберають окреме.\nЧісло бодів за тяг і назбераны боды можете видїти на екрані Перегляд.
Alternatively, the Great Person points breakdown per city can be viewed in each City Screen (see UI Tips article). = Роспис бодів великих особ за місто можете тіж видїти на екрані кождого міста (позерайте статью Рады до інтерфейса).
Once enough points have been accumulated, a Great Person of that type will be created!\nEach Great Person can construct a certain Great Improvement which gives large yields over time, or immediately consumed to provide a certain bonus now. = Кідь ся назберать досить бодів, вытворить ся велика особа того тіпу!\nКажда велика особа може збудовати певне велике полїпшеня, котре довгочасно давать великы выносы, або ся одразу спотребовати на певный моменталный бонус.
Great Improvements also provide any strategic resources that are under them, so you don't need to worry if resources are revealed underneath your improvements! = Великы полїпшеня давуть і вшыткы стратеґічны здрої під нима, тож ся не треба бояти, кідь ся під вашыма полїпшенями одкрыють здрої!

Removing Terrain Features = Стребити особитості терена
Certain tiles have terrain features - like Flood plains or Forests -  on top of them. Some of these layers, like Jungle, Marsh and Forest, can be removed by workers.\nRemoving the terrain feature does not remove any resources in the tile, and is usually required in order to add improvements exploiting those resources. = Певны поля мають знакы терену, як суть наплавны рівнины або лїсы. Даякы з тых верств, як джунґля, мочар і лїс, можуть робутникы одстранити.\nОдстранїня знака терену не одстранить жадны здрої поля і обычайно є потрібне на будованя полїпшень, котры хоснують тоты здрої.

Natural Wonders, such as the Mt. Fuji, the Rock of Gibraltar and the Great Barrier Reef, are unique, impassable terrain features, masterpieces of mother Nature, which possess exceptional qualities that make them very different from the average terrain.\nThey benefit by giving you large sums of Culture, ⍾Science, Gold or Production if worked by your Cities, which is why you might need to bring them under your empire as soon as possible. = Природны чуда, як Фуджі, Ґібралтарьска скала і Великый кораловый ріф, суть єдинечны, непроходны знакы терену, майстерьскы дїла природы з вынятковыма властностями, котры їх роблять дуже іншакыма од обычайной земли.\nКідь їх обробляють вашы міста, давуть великы множства културы, ⍾наукы, золота або продукованя, про што їх можете хотїти чім скорше приєднати до своёй імперії.

Keyboard = Клавіатура
If you have a keyboard, some shortcut keys become available. Unit command or improvement picker keys, for example, are shown directly in their corresponding buttons. = Кідь маєте клавіатуру, можете хосновати дашто клавішовых скорочінь. Наприклад, клавішы приказів формованя або выбору полїпшень суть указаны прямо на їх кнопках.
On the world screen the hotkeys are as follows: = На світовім екрані суть тоты клавішовы скорочіня:
Space or 'N' - Next unit or turn\n'E' - Empire overview (last viewed page)\n'+', '-' - Zoom in / out\nHome - center on capital or open its City Screen if already centered = Меджерник або «N» — далше формованя або тяг\n«E» — перегляд імперії (послїдня одкрыта сторінка)\n«+», «-» — приближыти / оддалити\nHome — центровати на головне місто або одкрыти ёго екран, кідь уж є выцентроване
F1 - Open Civilopedia\nF2 - Empire overview Trades\nF3 - Empire overview Units\nF4 - Empire overview Diplomacy\nF5 - Social policies\nF6 - Technologies\nF7 - Empire overview Cities\nF8 - Victory Progress\nF9 - Empire overview Stats\nF10 - Empire overview Resources\nF11 - Quicksave\nF12 - Quickload = F1 — одкрыти Цівілопедію\nF2 — перегляд імперії: Торговля\nF3 — перегляд імперії: Формованя\nF4 — перегляд імперії: Діпломатія\nF5 — Інстітуції\nF6 — Технолоґії\nF7 — перегляд імперії: Міста\nF8 — Поступ побіджіня\nF9 — перегляд імперії: Статістікы\nF10 — перегляд імперії: Здрої\nF11 — фрішно всокотити\nF12 — фрішно начітати
Ctrl-R - Toggle tile resource display\nCtrl-Y - Toggle tile yield display\nCtrl-O - Game options\nCtrl-S - Save game\nCtrl-L - Load game\nCtrl-U - Toggle UI (World Screen only) = Ctrl-R — переключіти указованя здроїв поль\nCtrl-Y — переключіти указованя выносів поль\nCtrl-O — наставлїня бавкы\nCtrl-S — всокотити бавку\nCtrl-L — начітати бавку\nCtrl-U — переключіти інтерфейс (лем світовый екран)
All of these can be reassigned. = Вшыткы тоты клавішы можете перенаставити.

This is where you spend most of your time playing Unciv. See the world, control your units, access other screens from here. = Туй проведете векшость часу бавлїня Unciv. Позерайте світ, ведьте свої формованя і переходьте одтыль на іншы екраны.
①: The menu button - civilopedia, save, load, options... = ①: 
②: The player/nation whose turn it is - click for diplomacy overview. = ②: Бавляч/народ, котрый є на тягу — натиснїть про діпломатічный перегляд.
③: The Technology Button - shows the tech tree which allows viewing or researching technologies. = ③: 
④: The Social Policies Button - shows enacted and selectable policies, and with enough culture points you can enact new ones. = ④: 
⑤: The Diplomacy Button - shows the diplomacy manager where you can talk to other civilizations. = ⑤: 
⑥: Unit Action Buttons - while a unit is selected its possible actions appear here. = ⑥: 
⑦: The unit/city info pane - shows information about a selected unit or city. = ⑦: 
⑧: The name (and unit icon) of the selected unit or city, with current health if wounded. Clicking a unit name or icon will open its civilopedia entry. = ⑧: 
⑨: The arrow buttons allow jumping to the next/previous idle unit. = ⑨: Стрїлковы кнопкы дозволюють перескочіти на далше/передошле неактівне формованя.
⑩: For a selected unit, its promotions appear here, and clicking leads to the promotions screen for that unit. = ⑩: Туй суть повышіня выбраного формованя; натиснїня одкрыє екран повышінь того формованя.
⑪: Remaining/per turn movement points, strength and experience / XP needed for promotion. For cities, you get its combat strength. = ⑪: 
⑫: This button closes the selected unit/city info pane. = ⑫: Ися ґомбичка закрыват інформацію за убраноє формованя
⑬: This pane appears when you order a unit to attack an enemy. On top are attacker and defender with their respective base strengths. = ⑬: 
⑭: Below that are strength bonuses or penalties and health bars projecting before / after the attack. = ⑭: 
⑮: The Attack Button - let blood flow! = ⑮: Ґомбичка атакованя – най ся пруллє кров!
⑯: The minimap shows an overview over the world, with known cities, terrain and fog of war. Clicking will position the main map. = ⑯: 
⑰: To the side of the minimap are display feature toggling buttons - tile yield, worked indicator, show/hide resources. These mirror setting on the options screen and are hidden if you deactivate the minimap. = ⑰: 
⑱: Tile information for the selected hex - current or potential yield, terrain, effects, present units, city located there and such. Where appropriate, clicking a line opens the corresponding civilopedia entry. = ⑱: Інформації о выбранім шестикутнім полї: теперїшнї або можны выносы, терен, ефекты, присутствны формованя, місто і подобне. Кідь ся то годить, натиснїня рядка одкрыє відповідну статью Цівілопедії.
⑲: Notifications - what happened during the last 'next turn' phase. Some are clickable to show a relevant place on the map, some even show several when you click repeatedly. = ⑲: Ознамы — што ся стало за послїднёго переходу до далшого тягу. Даякы мож натиснути про указованя відповідного місця на мапі; даякы при повторнім натисканю указують і веце місць.
⑳: The Next Turn Button - unless there are things to do, in which case the label changes to 'next unit', 'pick policy' and so on. = ⑳: 
㉑: The Multiplayer Button - Here you can easily check your active multiplayer games. = ㉑: 
ⓐ: The overview button leads to the empire overview screen with various tabs (the last one viewed is remembered) holding vital information about the state of your civilization in the world. = ⓐ: 
ⓑ: The ♪Culture icon shows accumulated ♪Culture and ♪Culture needed for the next policy - in this case, the exclamation mark tells us a next policy can be enacted. Clicking is another way to the policies manager. = ⓑ: 
ⓒ: Your known strategic resources are displayed here with the available (usage already deducted) number - click to go to the resources overview screen. = ⓒ: Туй суть указаны вашы знамы стратеґічны здрої з доступным чіслом (по одрахованю спотребы) — натиснїть про перегляд здроїв.
ⓓ: Happiness/unhappiness balance and either golden age with turns left or accumulated happiness with amount needed for a golden age is shown next to the smiley. Clicking also leads to the resources overview screen as luxury resources are a way to improve happiness. = ⓓ: 
ⓔ: The ⍾Science icon shows the number of ⍾Science points produced per turn. Clicking leads to the technology tree. = ⓔ: 
ⓕ: Number of turns played with translation into calendar years. Click to see the victory overview. = ⓕ: 
ⓖ: The number of gold coins in your treasury and income. Clicks lead to the Stats overview screen. = ⓖ: 
ⓗ: The quantity of ☮Faith your citizens have generated, or 'off' if religion is disabled. Clicking it makes you go to the religion overview screen. = ⓗ:
ⓧ: In the center of all this - the world map! Here, the "X" marks a spot outside the map. Yes, unless the wrap option was used, Unciv worlds are flat. Don't worry, your ships won't fall off the edge. = ⓧ: 
ⓨ: By the way, here's how an empire border looks like - it's in the national colours of the nation owning the territory. = ⓨ: 
ⓩ: And this is the red targeting circle that led to the attack pane back under ⑬. = ⓩ: 
What you don't see: The phone/tablet's back button will pop the question whether you wish to leave Unciv and go back to Real Life. On desktop versions, you can use the ESC key. = Што не видите: кнопка Назад телефона/таблета одкрыє звіданя, ці хочете уйти з Unciv і вернути ся до дїйсного жывота. В компютерных верзіях можете хосновати клавіш ESC.

When at later stages of the game, you might have a lot of units but only a little to do. To help you we have implemented an AutoPlay feature that lets you use the AI to play part or all of your turn. = В пізнїшых фазах бавкы можете мати много формовань, але мало роботы. Про поміч є туй Автобавлїня, котре дозволює компютеру одбавити часть або цїлый ваш тяг.
To enable AutoPlay, go to options and open the AutoPlay tab and press "Show AutoPlay button". = Про уволїня Автобавлїня пуйдьте до наставлїнь, одкрыйте карту Автобавлїня і натиснїть «Указовати кнопку Автобавлїня».
Clicking on the AutoPlay button opens a popup menue for choosing to AutoPlay parts or all of your turn. = Натиснїня кнопкы Автобавлїня одкрыє меню про выбор автобавлїня части або цїлого вашого тягу.
Clicking Start AutoPlay in the pop-up menue or long pressing the AutoPlay button begins the multi-turn AutoPlay. This will play your next turns as if you were an AI. = Натиснїня «Запустити автобавлїня» в меню або довге притриманя кнопкы Автобавлїня запустить автобавлїня на веце тягів. Вашы далшы тягы будуть одбавены як компютерным бавлячом.
To cancel multi-turn AutoPlay you can press the AutoPlay button, next turn button or open the options menue. = Про зрушіня автобавлїня на веце тягів можете натиснути кнопку Автобавлїня, кнопку далшого тягу або одкрыти наставлїня.
Multi-turn AutoPlay is not advised on harder difficulty levels as your AI will not play better against an AI with modifiers. = Автобавлїня на веце тягів ся не дораджує при тяжшых уровнях, бо ваш компютерный бавляч не буде бавити лїпше проти компютерному бавлячу з бонусами.
Multi-turn AutoPlay for multiplayer is not yet supported. = Автобавлїня на веце тягів про совмістну бавку іщі неє підпороване.

After building a shrine, your civilization will start generating ☮Faith. = По збудованю святынї ваша цівілізація зачне вытворяти ☮віру.
When enough ☮Faith has been generated, you will be able to found a pantheon. = Кідь ся вытворить досить ☮віры, можете заложыти пантеон.
A pantheon will provide a small bonus for your civilization that will apply to all cities that have it as a majority religion. = Пантеон дасть вашій цівілізації малый бонус, котрый буде платити про вшыткы міста, де є векшостнов реліґійов.
Each civilization can only choose a single pantheon belief, and each pantheon can only be chosen once. = Кажда цівілізація може выбрати лем єдну віру пантеону і кождовый пантеон мож выбрати лем раз.
Generating more ☮Faith will allow you to found a religion. = Вытворёваня веце ☮віры вам дозволить заложыти реліґію.

Keep generating ☮Faith, and eventually a great prophet will be born in one of your cities. = Вытворюйте далше ☮віру і часом ся в єднім із вашых міст народить великый пророк.
This great prophet can be used for multiple things: Constructing a holy site, founding a religion and spreading your religion. = Тот великый пророк ся може хосновати на веце рїчей: поставити святе місце, заложыти реліґію і шырити вашу реліґію.
When founding your religion, you may choose another two beliefs. The founder belief will only apply to you, while the follower belief will apply to all cities following your religion. = При закладаню реліґії можете выбрати далшы дві віры. Віра основателя буде платити лем про вас, а віра наслїдователїв про вшыткы міста, котры наслїдують вашу реліґію.
Additionally, the city where you used your great prophet will become the holy city of that religion. = Окрем того ся місто, де сьте хосновали великого пророка, стане святым містом той реліґії.
Once you have founded a religion, great prophets will keep being born every so often, though the amount of Faith☮ you have to save up will be higher. = По заложіню реліґії ся великы пророци будуть далше час од часу родити, але потребне назберане множство віры☮ буде высше.
One of these great prophets can then be used to enhance your religion. = Єдного з тых великых пророків можете пак хосновати на пудпираня своёй реліґії.
This will allow you to choose another follower belief, as well as an enhancer belief, that only applies to you. = То вам дозволить выбрати далшу віру наслїдователїв і віру пудпирача, котра платить лем про вас.
Do take care founding a religion soon, only about half the players in the game are able to found a religion! = Старайте ся заложыти реліґію скоро, бо лем коло половины бавлячів у бавцї може реліґію заложыти!

Religion inside cities = Реліґія у варошах
When founding a city, it won't follow a religion immediately. = Варош не зачинат сповідовати реліґію нараз по закладованю.
The religion a city follows depends on the total pressure each religion has within the city. = Реліґія, котру місто наслїдує, залежыть од цїлкового тиску каждой реліґії в містї.
Followers are allocated in the same proportions as these pressures, and these followers can be viewed in the City Screen. = Наслїдователї суть роздїлены подля поміру тых тисків і можете їх видїти на екрані міста.
You are allowed to check religious followers and pressures in cities you do not own by selecting them. = Выбранём чужых міст можете контролёвати їх реліґійных наслїдователїв і тискы.
In both places, a tap/click on the icon of a religion will show detailed information with its effects. = На обидвох місцях натиснїня значкы реліґії укаже подробны інформації з єй ефектами.
Based on this, you can get a feel for which religions have a lot of pressure built up in the city, and which have almost none. = Подля того можете видїти, котры реліґії мають у містї великый тиск і котры майже жадный.
The city follows a religion if a majority of its population follows that religion, and will only then receive the effects of Follower and Pantheon beliefs of that religion. = Місто наслїдує реліґію, кідь єй наслїдує векшость ёго населїня, і лем теды дістане ефекты віры наслїдователїв і пантеону той реліґії.

Spreading Religion = Ширеня реліґії
Spreading religion happens naturally, but can be sped up using missionaries or great prophets. = Реліґія ся шырить природно, але можете то приспішыти місіонарями або великыма пророками.
Missionaries can be bought in cities following a major religion, and will take the religion of that city. = Місіонарїв мож купити в містах наслїдуючіх головну реліґію і переймуть реліґію того міста.
So do take care where you are buying them! If another civilization has converted one of your cities to their religion, missionaries bought there will follow their religion. = Тож давайте позор, де їх купуєте! Кідь інша цівілізація обернула єдно з вашых міст на свою реліґію, місіонарї куплены там будуть наслїдувати єй реліґію.
Great prophets always have your religion when they appear, even if they are bought in cities following other religions, but captured great prophets do retain their original religion. = Великы пророци при появлїню завше мають вашу реліґію, хоць суть куплены в містах з іншов реліґійов; але схоплены великы пророци сі лишають свою початочну реліґію.
Both great prophets and missionaries are able to spread religion to cities when they are inside its borders, even cities of other civilizations. = Великы пророци і місіонарї можуть шырити реліґію в містах, кідь суть в їх граніцях, і то і в містах іншых цівілізацій.
These two units can even enter tiles of civilizations with whom you don't have an open borders agreement! = Тоты два формованя можуть вступати і на поля цівілізацій, з котрыма немаєте договору о одкрытых граніцях!
But do take care, missionaries will lose 250 religious strength each turn they end while in foreign lands. = Але давайте позор: місіонарї стратять 250 реліґійной силы кождого тягу, котрый скінчать на чужій землї.
This diminishes their effectiveness when spreading religion, and if their religious strength ever reaches 0, they have lost their faith and disappear. = То знижує їх учінность при шырїню реліґії, і кідь їх реліґійна сила досягне 0, стратили віру і зникнуть.
When you do spread your religion, the religious strength of the unit is added as pressure for that religion. = При шырїню реліґії ся реліґійна сила формованя придать як тиск той реліґії.
Cities also passively add pressure of their majority religion to nearby cities. = Міста тіж пасівно придають тиск своёй векшостной реліґії близкым містам.
Each city provides +6 pressure per turn to all cities within 10 tiles, though the exact amount of pressure depends on the game speed. = Кажде місто давать +6 тиску за тяг вшыткым містам до 10 поль, але точне множство тиску залежыть од скорости бавкы.
This pressure can also be seen in the City Screen, and gives you an idea of how religions in your cities will evolve if you don't do anything. = Тот тиск видите і на екрані міста; указує, як ся будуть реліґії у вашых містах розвивати, кідь нич не зробите.
Holy cities also provide +30 pressure of the religion founded there to themselves, making it very difficult to effectively convert a holy city. = Святы міста тіж самы собі давуть +30 тиску реліґії, котра там была заложена, тож є дуже тяжко святе місто навернути.
Lastly, before founding a religion, new cities you settle will start with 200 pressure for your pantheon. = Напокон, перед заложінём реліґії зачнуть новы міста, котры заложыте, з 200 тиску вашого пантеону.
This way, all your cities will starting following your pantheon as long as you haven't founded a religion yet. = Так вшыткы вашы міста зачнуть наслїдувати ваш пантеон, покы іщі немаєте заложену реліґію.

Inquisitors = Інквізішты
Inquisitors are the last religious unit, and their strength is removing other religions. = Інквізіторы суть послїднє реліґійне формованя і їх сила є одстранёваня іншых реліґій.
They can remove all other religions from one of your own cities, removing any pressures built up. = Можуть одстранити вшыткы іншы реліґії з єдного вашого міста і зрушити вшыток їх назбераный тиск.
Great prophets also have this ability, and remove all other religions in the city when spreading their religion. = Великы пророци мають тіж тоту способность і при шырїню своёй реліґії одстранюють вшыткы іншы реліґії в містї.
Often this results in the city immediately converting to their religion = То часто веде до моменталного навернутя міста на їх реліґію.
Additionally, when an inquisitor is stationed in or directly next to a city center, units of other religions cannot spread their faith there, though natural spread is unaffected. = Окрем того, кідь інквізітор стоїть в центрї міста або прямо коло нёго, формованя іншых реліґій там не можуть шырити свою віру; природне шырїня але неє овпливнене.

The Mayan unique ability, 'The Long Count', comes with a side effect: = Особитна способность Маїв «Довге рахованя» має боковый ефект:
Once active, the game's year display will use mayan notation. = По єй актівованю буде бавка указовати рокы майскым записом.
The Maya measured time in days from what we would call 11th of August, 3114 BCE. A day is called K'in, 20 days are a Winal, 18 Winals are a Tun, 20 Tuns are a K'atun, 20 K'atuns are a B'ak'tun, 20 B'ak'tuns a Piktun, and so on. = Маї міряли час у днях од того, што бы-сьме назвали 11. авґустом 3114 перед нашым лїтопочтом. День ся кличе K'in, 20 днїв є Winal, 18 Winal є Tun, 20 Tun є K'atun, 20 K'atun є B'ak'tun, 20 B'ak'tun є Piktun і так далше.
Unciv only displays ය B'ak'tuns, ඹ K'atuns and ම Tuns (from left to right) since that is enough to approximate gregorian calendar years. The Maya numerals are pretty obvious to understand. Have fun deciphering them! = Unciv указує лем ය B'ak'tun, ඹ K'atun і ම Tun (злїва вправо), бо то достачує на приближне выражіня років ґреґоріанского календаря. Майскы чісла мож досить легко порозуміти. Приємну забаву при їх лущіню!

Your cities will periodically demand different luxury goods to satisfy their desire for new things in life. = Вашы міста будуть час од часу жадати різный луксусный товар, обы сповнити жаданя новых рїчей у жывотї.
If you manage to acquire the demanded luxury by trade, expansion, or conquest, the city will celebrate We Love The King Day for 20 turns. = Кідь ся вам подарить здобыти жаданый луксус торговлёв, росшырїнём або добутём, місто буде 20 тягів святковати День любови ку королёви.
During the We Love The King Day, the city will grow 25% faster. = Перебігом Сята Любови ид Правителю, варош росте на 25% май читаво.
This means exploration and trade is important to grow your cities! = То значіть, же розвідованя і торговля суть важны про рост вашых міст!

Air Combat and Interception = Воздушный буй і перехоплїня
Air Combat is very similar to normal Combat, with a few wrinkles. Damage is still dealt using the same equations based on the relative Strength of the Attacking and Defending Unit. = Воздушный буй є дуже подобный обычайному бою, з дакількома роздїлами. Шкода ся все рахує тыма самыма формулами подля взаємной силы атакуючого і оборонного формованя.
However, before the Attacker and Defender fight, there is an added combat phase called Interception. If there is any unit with Interception Range that covers the target attacked tile, then it will attempt to Intercept the Attacking Air Unit. If multiple units can Intercept, the one with higher Intercept chance does it. = Але перед боём атакуючого з оборонцёв є додаточна фаза боя звана перехоплїня. Кідь досяг перехоплїня даякого формованя покрывать атаковане поле, покусить ся перехопити атакуюче воздушне формованя. Кідь може перехопити веце формовань, зробить то формованя з найвысшов шансов перехоплїня.
Generally Land/Naval Units have an Intercept Range of 2 Tiles, and Air Units have an Intercept Range of their Attack Range. = Обычайно мають сухоземны/морьскы формованя досяг перехоплїня 2 поля, а воздушны формованя досяг своёй атакы.
Ground and Naval Units don't require movement points to Intercept, just Attacks. Air Units cannot have moved nor attacked in the preceding turn. = Сухоземны і морьскы формованя на перехоплїня не потребують боды руху, лем атакы. Воздушны формованя ся в передошлїм тягу не сміли рушати анї атакувати.
The Intercepting Unit rolls to see if it hits. Whether it hits or not costs an Attack, and most units (without Promotions) can only Attack Once per Nation's Turn. It does NOT cost Movement Points, but Air Units that have used their Movement cannot Intercept between turns. = Перехоплююче формованя выжребує, ці трафить. Атаку спотребує без огляду на то, ці трафило, і векшость формовань без повышінь може атакувати лем раз за тяг народа. Боды руху то НЕ спотребує, але воздушны формованя, котры уж рух хосновали, не можуть перехоплёвати меджі тягами.
If the Intercepting Unit Hits, it deals damage according to the Combat Strength calculation to the Attacking Air Unit, potentially with any Strength Bonuses that apply to Interception. It does not receive damage from the Attacking Air Unit. = Кідь перехоплююче формованя трафить, зробить атакуючому воздушному формованю шкоду подля вырахунку бойовой силы, вєдно з платныма бонусами силы на перехоплїня. Само од атакуючого воздушного формованя шкоду не дістане.
After Interception resolves, the Attacking Air Unit and the Defending Unit in the targeted tile do Combat as normal, with damage dealt to both sides. = По вырїшіню перехоплїня атакуюче воздушне формованя і оборонне формованя на цїлёвім полї боюють обычайно, зо шкодов на обидвох сторонах.
To help deal with Interceptions, see Air Sweeps. = Про поміч проти перехоплїнём позерайте Воздушны прочіщіня.

Air Sweeps = Воздушні захарьованя
Fighter units are able to perform Air Sweeps over a tile helping clear out potential enemy Air, Sea, or Land Interceptions that can reach that tile. = Стїгачі можуть робити воздушне прочіщіня над полём, обы вычерпали можны ворожскы воздушны, морьскы або сухоземны перехоплїня, котры то поле досягнуть.
While this Action will take an Attack, the benefit is drawing out Interceptions to help protect your other Air Units. Especially your Bombers. = Тота дія спотребує атаку, але выволать перехоплїня і поможе хоронити вашы іншы воздушны формованя, головно бомбардеры.
Your unit will always draw an Interception, if one can reach the target tile, even if the Intercepting unit has a chance to miss. = Ваше формованя завше выволать перехоплїня, кідь може досягнути цїлёве поле, і кідь перехоплююче формованя має шансу нетрафити.
If the Interceptor is not an Air Unit (eg Land or Sea), the Air Sweeping unit and Interceptor take no damage! = Кідь перехоплююче формованя неє воздушне (напр. сухоземне або морьске), прочіщуюче анї перехоплююче формованя недістануть шкоду!
If the Interceptor is an Air Unit, the two units will damage each other in a straight fight with no Interception bonuses. And only the Attacking Air Sweep Unit gets any Air Sweep strength bonuses. = Кідь є перехоплююче формованя воздушне, обидва формованя зроблять єдно другому шкоду в прямім бою без бонусів перехоплїня. Лем атакуюче прочіщуюче формованя дістане бонусы силы воздушного прочіщіня.

Fortify, Guard, Withdraw = Укрїпити, сторожыти, уступити
Most Land units have the ability to Fortify. As they spend time without moving, they will slowly gain a Fortification Bonus to their Combat Strength representing digging in and preparing in case of an attack. = Векшость сухоземных формовань ся може укрїпити. Кідь даякий час стоять без руху, помалы здобывають укрїплёвательный бонус бойовой силы, котрый представляє окопаня і приготову на атаку.
Some units have the ability to Withdraw before a melee attack is struck. However, perhaps you wish for them to stand their ground to protect a particular tile. If you do, then give them the Guard command and they will stay fixed until they die or you give them fresh orders. = Даякы формованя можуть уступити перед близьков атаков. Але може хочете, обы хранили певне поле і остали на місцї. Теды їм дайте приказ Сторожыти і будуть стояти, покы не погынуть або їм недасте новы приказы.
This is NOT the same as Fortify but they will still gain the Fortification Bonus. They will simply not utilize their Withdraw ability. Fortified units with the Withdraw ability will try to flee when attacked. = То НЕє то саме як Укрїпити, але укрїплёвательный бонус все дістануть. Лем не будуть хосновати способность уступу. Укрїплены формованя зо способностёв уступу ся при атацї покусять утечі.

City Tile Blockade = Блокада поля міста
One of your tiles is blocked by an enemy: when an enemy unit stands on a tile you own, the tile will not produce yields and cannot be worked by a city this turn. City will reallocate population from a blocked tile automatically. = Єдно з вашых поль блокує ворог: кідь ворожске формованя стоїть на вашім полї, поле того тягу недавать выносы і місто го не може обробляти. Місто автоматічно перенесе населїня з блокованого поля.
Enemy military land units block tiles they are standing on. Enemy military naval units additionally block adjacent water tiles. To protect your tiles from blockade, place a friendly military unit on it or fight off invaders. = Ворожскы войсковы сухоземны формованя блокують поле, на котрім стоять. Ворожскы войсковы морьскы формованя блокують і сусїднї водны поля. Про охорону поля од блокады на нёго поставте дружне войскове формованя або одбийте нападників.

One of your cities is under a naval blockade! When all adjacent water tiles of a coastal city are blocked - city loses harbor connection to all other cities, including capital. Make sure to de-blockade cities by deploying friendly military naval units to fight off invaders. = Єдно з вашых міст є під морьсков блокадов! Кідь суть вшыткы сусїднї водны поля побережного міста блокованы, місто стратить споєня гаванёв зо вшыткыма іншыма містами вєдно з головным. Зрушыте блокаду высланём дружных морьскых войсковых формовань проти нападникам.

Spies! = Шпіґуны!
The first time a civ reaches the Renaissance era each nation gets one spy. Every time a civ reaches an era afterwards they get one more spy. = Кідь цівілізація першыраз досягне ренесанцію, кождовый народ дістане єдного шпіґуна. Кідь пак цівілізація досягне далшу еру, дістане іщі єдного шпіґуна.
Spies can be sent out to foreign cities to steal technology, rigging elections or stage coups. Place them in your own cities to do counter-intelligence work. = Шпіґунів можете послати до чужых міст красти технолоґії, фалшовати выборы або приготовляти превороты. В своїх містах їх умістїть на контрашпїонаж.
Only one spy per civ is allowed in each city. Spies that are not in any city are on vacation in your spy hideout. = В каждїм містї може быти лем єден шпіґун од каждой цівілізації. Шпіґуны, котры не суть в жаднім містї, суть на доволенцї у вашім шпіґунскім скрывку.
Spies set up in cities of major civilizations will try to steal technology at a rate which is based off of the science production in the city. Succeeding to steal technology will level up your spy. Failing to succeed will level up the defending spy if it is present. = Шпіґуны в містах великых цівілізацій ся будуть пытати украсти технолоґію швидкостёв подля вытворёваня наукы в містї. Успішна крадїж звышыть уровень вашого шпіґуна. Неуспіх звышыть уровень оборонного шпіґуна, кідь там є.
Spies set in city-states will try to rig the elections in order to gain influence and reduce the influence of other civilizations. Only one spy partaking in rigging the election can win. = Шпіґуны в містах-державах ся будуть пытати фалшовати выборы, обы здобыти вплив і знижыти вплив іншых цівілізацій. Лем єден шпіґун участный на фалшованю выборів може выїграти.
A spy that is rigging an election in a city-state may also stage a coup. The likelihood of success for the coup depends on your relative influence to the current ally of the city-state, your spy level, and the level of the spy that the current ally has in the city-state if present. Succeeding a coup will make you their new ally and reduce the influence of all other civs. Failing a coup will kill your spy and level up the defending spy if present. = Шпіґун фалшуючій выборы в містї-державі може тіж зробити преворот. Шанса успіху залежыть од вашого впливу опроти теперїшнёму союзникови міста-державы, уровня вашого шпіґуна і уровня шпіґуна теперїшнёго союзника в містї-державі, кідь там є. Успішный преворот вас зробить новым союзником і знизить вплив вшыткых іншых цівілізацій. Неуспішный преворот убє вашого шпіґуна і звышыть уровень оборонного шпіґуна, кідь там є.
Spies that are set up in your own cities will be conducting counter-intelligence. They reduce the success chance of other spies trying to steal your technology. = Шпіґуны у вашых містах будуть робити контрашпїонаж. Знижують шансу успіху чужых шпіґунів при крадїжы вашых технолоґій.
Spies at a higher rank have a higher chance of success. The max rank a spy can reach is rank 3. After a spy is killed it will revive after a certain amount of turns back at rank 1. = Шпіґуны з высшов ранґов мають высшу шансу успіху. Найвысша ранґа шпіґуна є 3. По смерти ся шпіґун по певнім чіслї тягів одновить з ранґов 1.
Building buildings like the constabulary and police station will reduce the technology steal rate of spies in that city. = Будовы як жандармерія і поліційна станіця спомалюють крадїж технолоґій шпіґунами в тім містї.
Espionage is available using the Gods and Kings ruleset. To enable it in a new game click advanced settings, then click on the Enable Espionage option. = Шпїонаж є доступный з правилами Богы тай Королі. Про ёго уволїня в новій бавцї натиснїть росшырены наставлїня і пак выбор Уволити шпїонаж.

Keyboard Bindings = Штімованя клавішув
Limitations = Рестрікції
This is a work in progress. = Робота над сим ище іде.
For technical reasons, only direct keys or Ctrl-Letter combinations can be used. = З технічных причін мож хосновати лем самостатны клавішы або споєня Ctrl з буквою.
Using the Keys page = Хоснованя сторінкы Клавішы
Each binding has a button with an image looking like this: = Кажде придїлїня має кнопку з такым образом:
While hovering the mouse over the key button, you can press a desired key directly to assign it. = Кідь курсор мышы стоїть над кнопков клавіша, можете прямо натиснути жаданый клавіш і так го придїлити.
Double-click the image to reset the binding to default. = Двойтым натиснїнём образа обновите початочне придїлїня.
Bindings mapped to their default keys are displayed in gray, those reassigned by you in white. = Початочны придїлїня клавішів суть указаны сїров, вами змінены білов фарбов.
Conflicting assignments are marked red. Conflicts can exist across categories, like World Screen / Unit Actions. Note that at the moment, the game does not prevent saving conflicting assignments, though the result may be unexpected. = Конфліктны придїлїня суть червены. Конфлікты можуть быти меджі катеґоріями, напр. Світовый екран / Дїї формованя. Теперь бавка не боронить всокотити конфліктны придїлїня, але выслідок може быти нечеканый.
For discussion about missing entries, see the linked github issue. = Про діскузію о хыбуючіх положках позерайте припоїну задачу на GitHub.

Welcome to the Civilopedia! = Вітаєме у Цівілопедії!
Here you can find information - general help, rules, and what makes up the game world. = Туй найдете інформації: вшеобецну поміч, правила і склад бавкового світа.
How to find information = Як знайти інформацію
Select categories with the buttons on top of the screen. Also up there is the button to leave Civilopedia and go back to where you were before. = Выбирайте катеґорії кнопками вгорї екрана. Там є і кнопка на одход з Цівілопедії і ворот до передошлого місця.
Each category has a list of entries on the left of the screen, sorted alphabetically (with few exceptions). Clicking an entry will update the center pane were you are currently reading this. = Кажда катеґорія має влїво список статей, зрядженый подля азбукы (з малыма вынятками). Натиснїня статьї обновить среднїй панел, де теперь чітате тот текст.
Lines can link to other Civilopedia entries, they are marked with a chain link symbol like this one. You can click anywhere on the line to follow the link. = Рядкы можуть одказовати на іншы статьї Цівілопедії і суть означены такым сімболом ланця. Натиснїть десь на рядок, обы одкрыти одказ.
The current category is special - all articles on general concepts are here. It is called 'Tutorials' because you can revisit these here, too. = Теперїшня катеґорія є особитна: туй суть вшыткы статьї о основных поятях. Кличе ся «Учіня», бо туй можете знова перечітати і учебны статьї.
What information can I find = Яку інформацію муг бы-м найти
The data shown is not dependent on your current game's situation, e.g. bonuses for the nation you are playing or difficulty modifiers will not affect the numbers. = Указаны дані не залежать од стану вашой теперїшнёї бавкы; напр. бонусы народа, за котрый бавите, або модіфікаторы тяжкости не овпливнять чісла.
However, it will reflect the mods you are playing! The combination of base ruleset and extension mods you select define the rules of a game, what objects exist and how they interact, and the Civilopedia mirrors these rules. = Але будут одражати моды, з котрыма бавите! Споєня основных правил і выбраных росшырюючіх модів урчує правила бавкы, котры предметы єствують і як на себе впливають; Цівілопедія тоты правила одражать.
If you opened the Civilopedia from the main menu, the "Ruleset" will be that of the last game you started. = Кідь сьте одкрыли Цівілопедію з головного меню, «Правила» будуть з послїднёї бавкы, котру сьте зачали.
Letters can select categories, and when there are multiple categories matching the same letter, you can press that repeatedly to cycle between these. = Буквами можете выбирати катеґорії; кідь є веце катеґорій на ту саму букву, повторным натисканём будете меджі нима переходити.
The arrow keys allow navigation as well - left/right for categories, up/down for entries. = Стрїлковы клавішы тіж дозволюють переходити: влїво/вправо меджі катеґоріями, вгору/долу меджі статьями.

UI Tips = Рады до інтерфейса
World screen = Світовый екран
Skip all units to end a turn quickly = Прескочіти вшыткы формованя про фрішне докончіня тягу
Right-click or long press the "Next unit" button to open a popup menu which allows to end a turn without having to cycle through all units. If some units are automated, a dedicated button is available to move them before ending the turn. = Правым натиснїнём або довгым притриманём кнопкы «Далше формованя» одкрыйте меню, котре дозволює скінчіти тяг без переходу через вшыткы формованя. Кідь суть даякы формованя автоматізованы, особитна кнопка їх порушать перед кінцём тягу.
Toggle notification list display = Переключіти указованя списка ознамів
On the World screen, swipe the notification list to the right to temporarily hide it. Click the "Bell" button to display them again. = На світовім екрані потягнїть список ознамів вправо, обы го дочасно скрыти. Натиснїть кнопку «Дзвонок», обы їх знова указати.
The default state for the notification list can be set in Options > Display > UI - Notifications on world screen. = Початочный стан списка ознамів можете наставити в Наставлїня > Зображіня > Інтерфейс — Ознамы на світовім екрані.
Entering a City Screen quickly = Фрішный вступ на екран міста
You can Right-click or long press a city button on the World screen. The result is the same as tapping it twice - once to select and move the button, again to trigger a reaction: show the City Screen (if the city is yours to inspect), or offer the foreign city info popup. = Можете право натиснути або довго притримати кнопку міста на світовім екрані. Выслідок є єднакый як двойте натиснїня: перше выбере і порушать кнопку, друге выволать дїю — укаже екран міста (кідь є ваше на перегляданя) або вікно інформацій чужого міста.
Upgrade multiple units of the same type = Полїпшыти веце формовань того самого тіпу
On the World screen, select a unit that can be upgraded, then right-click or long press the "Upgrade" button to open a popup menu allowing to upgrade all units of this type at once. = На світовім екрані выберте формованя, котре мож полїпшыти, пак право натиснїть або довго притримайте кнопку «Полїпшыти». Одкрыє ся меню на полїпшіня вшыткых формовань того тіпу нараз.
In the Units overview, the same upgrade menu is available by clicking the unit icon in the "Upgrade" column. When a unit is upgradeable, the icon is lit if conditions are met (enough gold and/or resources), otherwise it is dimmed. = В переглядї формовань є то саме меню полїпшіня доступне натиснїнём значкы формованя в стовпцї «Полїпшыти». Кідь є полїпшіня можне, значка світить при сповненых умовах (досить золота і/або здроїв), інакше є затемнена.
Additional controls for the construction queue = Далше справованя будовляной чергы
Right-click or long press a construction item to open a popup menu with additional controls, allowing to manage production of the same item in all cities, by issuing the commands from the same City Screen. = Право натиснїть або довго притримайте будовану положку про меню з далшыма приказами, котры дозволюють справовати продукованя той самой положкы у вшыткых містах з єдного екрана міста.
The "Disable" option (in a single city or all cities) moves an item to a separated "Disabled" tab, to prevent its automatic queueing by the "Auto-assign city production" option or to remove irrelevant objects from the production planning. To move a disabled item back to its initial place, re-enter its popup menu, and choose "Enable". = Выбор «Вылучіти» (в єднім або вшыткых містах) перенесе положку до окремой карты «Вылучены», обы єй автоматічно непридїлёвав выбор «Автоматічно придїлити продукованя міста» або обы одстранити непотрібны предметы з планованя продукованя. Про вернутя вылученой положкы на єй початочне місце знова одкрыйте єй меню і выберте «Уволити».
Disabled items are set for the current game only and are carried over when founding a new city. = Вылучены положкы платять лем про теперїшню бавку і перенесуть ся при заложіню нового міста.
Show Great Person Points breakdown = Указати роспис бодів великих особ
In the right sidepanel, click a Great People row to display the details of Great Person Points (GPP) accumulated each turn by the current city, for this type of Great People. = В правім боковім панелї натиснїть рядок великих особ про подробности бодів великих особ, котры теперїшнє місто зберать кождого тягу про тот тіп великой особы.
Click any of the Great People icons to display all GPP accumulated each turn by the current city, for all types of Great People. = Натиснїть даяку значку великых особ, обы указати вшыткы боды великих особ, котры теперїшнє місто зберать кождого тягу про вшыткы тіпы великих особ.
Tech screen = Екран технолоґій
Queue multiple technologies in different branches = Дати до чергы веце технолоґій різных галузей
On the Tech screen, right-click or long press a technology to automatically queue it, even if this tech is in another branch than the item currently researched. Prerequisite techs to research will also be automatically queued. = На екрані технолоґій право натиснїть або довго притримайте технолоґію, обы єй автоматічно дати до чергы, і кідь є в іншій галузи як теперїшнє баданя. Потребны попереднї технолоґії ся тіж автоматічно придадуть до чергы.
Right-click or long press multiple techs to append them to the research queue, whatever their branch is. = Право натиснїть або довго притримайте веце технолоґій, обы їх придати на конець чергы баданя без огляду на їх галузь.
