Kamehameha I = Камехамеха I
The ancient fire flashing across the sky is what proclaimed that this day would come, though I had foolishly hoped for a different outcome. = Давній огінь, котрый ся блискав через небо, оголошовав, же сесь день прийде, хоць єм дурно дуфав у другый выслідок.
It is obvious now that I misjudged you and your true intentions. = Дораз є ясно, же єм вас тай ваші правдиві заміры неправилно осудив.
The hard-shelled crab yields, and the lion lies down to sleep. Kanaloa comes for me now. = Краб из твердым панцирём уступує, тай лев ся кладет спати. Каналоа дораз приходит по ня.
The ocean's tide may rise and fall, but my resolve stands steady. = Морскый прилив може підняти ся тай упасти, айбо моя рішимость стоїт твердо.
Aloha! Greetings and blessings upon you, friend. I am Kamehameha, Great King of this strand of islands. = Алога! Здоровля тай благословіня вам, приятелю. Я єм Камегамега, великый король сього ряда островів.
Come, let our people feast together! = Прийдіт, най наші народы вєдно гостят!
Welcome, friend! = Вінчую, цімборе!
Wayfinding = Гляданя пути
Aloha to Kamehameha the Great, who the heavens allowed to unite your people! O great King, under your reign, the Big Island of Hawai'i became one in 1791 AD, and many other islands joined your vision of union in 1810. As the first King of Hawai'i, law and taxation systems were stabilized, and you promoted the Kanawai Mamalahoe, an edict to protect civilian people in times of war. Unification and sovereignty of all the islands continued thanks to your fair laws and deeds, even after you joined your ancestors in paradise in 1819. = Алога Камегамезі Великому, котрому небеса позволили споїти свій народ! О великый королю, пуд вашым панованём Великый острів Гаваї ся споїв у 1791 році н. е., тай многі другі островы ся прикапчали ид вашому видіню союза у 1810. Як першый король Гаваїв сьте усталили сістемы права тай даней тай пудпоровали Канаваї Мамалагое, приказ про охрану цівілного люду у часі войны. Споїня тай самовлада вшиткых островів продовжовали вдяка вашым праведным законам тай ділам і по тым, як сьте ся прикапчали ид своїм предкам у раю в 1819.
Wise and benevolent King, will you unite your people once again by wearing the bright mantle of the Lion of the Pacific? Will your new empire shine through the ages of history? = Мудрый тай добротливый королю, ци знову споїте свій народ, облечены у ясный плащ Лева Тіхого океана? Ци ваша нова імперія буде світити через вікы історії?
