Hiawatha = Гайавата
You are a plague upon Mother Earth! Prepare for battle! = Вы сьте каров про Матір Землю! Готовте ся на бій!
You evil creature! My braves will slaughter you! = Ты зле створіня! Мої смілці тя поріжут!
You have defeated us... but our spirits will never be vanquished! We shall return! = Вы сьте нас побідили... айбо наші духы ніґда не будуть побіджені! Вернеме ся!
Words alone cannot shake the roots of peace I have planted among my people. = Самі слова не можуть струсити коріні мира, котрі єм засадив меджі своїм народом.
Greetings, stranger. I am Hiawatha, speaker for the Iroquois. We seek peace with all, but we do not shrink from war. = Здоровлю, чужинче. Я єм Гайавата, бесідник Ірокезів. Глядаме мир из вшиткыма, айбо ся не боїме войны.
Does this trade work for you, my friend? = Ци вам пасує ся торговельна угода, приятелю мій?
The Great Warpath = Велика воєнна путь
Greetings, noble Hiawatha, leader of the mighty Iroquois nations! Your people lived near the great and holy lake Ontario since the ancient ages, on a land that will be later known as New York city. Long ago, the five peoples of Seneca, Onondaga, Mohawks, Cayugas and Oneida became one nation, the Haudenosaunee, the Iroquois. Although not having a written language, the wise Iroquois created the Great Law of Peace, which can be considered the first established constitution. For decades, your people fought powerful enemies, such as the Huron, and then the French and English colonists. With less warriors and inferior weaponry, the Iroquois still survived and walk on the path of peace and harmony, until their way of living faded away under the crush of the newborn United States nation. = Здоровиме тя, благородный Гайавато, вождю силных ірокезькых народів! Твій народ уд давніх віків жыв коло великого тай святого озера Онтаріо на земли, котра ся пізніше буде звати варош Ню-Йорк. Давно ся пять народів, Сенека, Онондаґа, Могавкы, Каюґа тай Онейда, споїли у єден народ, Гауденосауні, Ірокезів. Хоць не мали писаный язык, мудрі Ірокезы створили Великый закон мира, котрый мож вважати за першу установлену констітуцію. Десятилітями твій народ боёвав из силныма неприятелями, як Гуроны тай потім францзускі тай анґліцькі колоністы. Из менше вояками тай слабшов зброёв Ірокезы вшерівно выжыли тай шли путёв мира тай згоды, докы их способ жывота не изчезнув пуд натиском новонародженых Зъєднаных держав.
Great Sachem Hiawatha, do you hear the complaints of your people? Can you light the path leading to the ancient Iroquois union? Will your new empire shine through the ages of history? = Великый сачем Гайавато, ци чуєш скаргы свого народа? Ци можеш освітити путь до давнього ірокезького союза? Ци твоя нова імперія буде світити через вікы історії?
