Install the same version of every required ruleset and mod before joining. Automatic mod downloads are unavailable in this build. = Перед приєднаньом установте єднаку верзію каждого потребного набору правил і моду. Автоматічне стирьхованя модів у тій зборцї недоступне.
Online multiplayer servers are operated by third parties. The selected server receives your player ID, IP address, and game save data. Its availability, retention, deletion, and remote game saves are not guaranteed by Unciv. All players must use the same Unciv version and have the exact same versions of every mod installed. = Серверы онлайновых бавок у сїти управляють треті стороны. Выбраный сервер дістане ваш ID грача, IP-адресу і даны всокочіня бавкы. Unciv не ґарантує його доступность, хранїня, істертя ани оддалены всокочіня бавок. Вшыткы грачі мусять хосновати єднаку верзію Unciv і мати установлены точно єднак верзії каждого моду.
Recovery saved = Копія про обновлїня всокочена
Creation stopped before upload because a local recovery copy could not be saved. = Створіня ся заставило перед одосланьом, бо не вдало ся всокотити локалну копію про обновлїня.
Remote creation could not be confirmed. The Game ID was copied and a local recovery copy was saved. Open that Multiplayer entry to resume this exact game; do not start another one. = Оддалене створіня не вдало ся потвердити. ID бавкы скопіровано і локалну копію про обновлїня всокочено. Одкрийте тот запис бавкы у сїти, жебы продовжовати точно тоту бавку; не зачінайте іншу.
Server limit reached! Please wait for [time] seconds. The Game ID was copied; open its saved Multiplayer entry to retry. = Досягнутый ліміт сервера! Почекайте [time] секунд. ID бавкы скопіровано; одкрийте її всокоченый запис бавкы у сїти і спробуйте знова.
Creation was interrupted and the Game ID was copied, but a local recovery copy could not be saved. = Створіня было перерване і ID бавкы скопіровано, але локалну копію про обновлїня не вдало ся всокотити.
The full game was uploaded before creation was interrupted. The Game ID was copied and a local recovery copy was saved. = Цїлу бавку одослано перед перерваньом створіня. ID бавкы скопіровано і локалну копію про обновлїня всокочено.
Remote creation could not be confirmed. The Game ID was copied and a local recovery copy was saved. Open that Multiplayer entry to resume this exact game. = Оддалене створіня не вдало ся потвердити. ID бавкы скопіровано і локалну копію про обновлїня всокочено. Одкрийте тот запис бавкы у сїти, жебы продовжовати точно тоту бавку.
Could not upload game. The Game ID was copied; open its saved Multiplayer entry to retry this exact game. = Бавку не вдало ся одослати. ID бавкы скопіровано; одкрийте її всокоченый запис бавкы у сїти, жебы знова спробовати тоту саму бавку.
Game created and ID copied, but its turn preview is not confirmed. Submitting the first turn will retry it. = Бавку створено і ID скопіровано, але перегляд її ходу не потвердженый. Одосланя першого ходу повторить спробу.
Could not persist the latest server state locally. = Не вдало ся локално всокотити остатнїй стан сервера.
Turn upload is unconfirmed because its background time expired. Retry after returning to the game. = Одосланя ходу не потверджене, бо скінчив ся час роботы на позадї. Вернувши ся до бавкы, спробуйте знова.
Server limit reached! Please wait for [time] seconds before retrying. = Досягнутый ліміт сервера! Перед повторнов спробов почекайте [time] секунд.
Turn upload is unconfirmed. Reason: [reason] = Одосланя ходу не потверджене. Причіна: [reason]
Could not open authentication. The turn upload is unconfirmed. = Не вдало ся одкрыти потверджіня особности. Одосланя ходу не потверджене.
Authentication was cancelled. The turn upload is unconfirmed. = Потверджіня особности было одкликане. Одосланя ходу не потверджене.
The server no longer has the game. The pending turn was kept and was not uploaded. = На серверї уж нема той бавкы. Чекаючий ход зостав всокоченый і не быв одосланый.
Could not confirm the previous turn upload. Reason: [reason] = Не вдало ся потвердити одосланя попереднього ходу. Причіна: [reason]
The server's full game could not be verified. The pending turn was kept and was not uploaded. = Цїлу бавку на серверї не вдало ся перевірити. Чекаючий ход зостав всокоченый і не быв одосланый.
The server confirmed the turn, but it could not be saved locally. Retry to recover safely. = Сервер потвердив ход, але локално го не вдало ся всокотити. Спробуйте знова про безпечне обновлїня.
The pending turn could not be stored or recovered safely. It was not uploaded. = Чекаючий ход не вдало ся безпечно всокотити ани обновити. Не быв одосланый.
Dropbox storage is no longer available. Use an Unciv API v1 server instead. = Хранилище Dropbox уж недоступне. Намісто нього хоснуйте сервер Unciv API v1.
Could not persist the multiplayer server for this game. = Не вдало ся всокотити сервер бавкы у сїти про тоту бавку.
The multiplayer server address is invalid. = Адреса сервера бавкы у сїти є неважна.
This build requires a public HTTPS multiplayer server address. = Тота зборка жадать публічну HTTPS-адресу сервера бавкы у сїти.
The multiplayer server attempted an unsafe redirect. = Сервер бавкы у сїти спробовав небезпечне перенапрямлїня.
The multiplayer server redirected too many times. = Сервер бавкы у сїти перенапрямив запрос надто много раз.
The multiplayer server address could not be resolved. = Адресу сервера бавкы у сїти не вдало ся розрїшити.
A secure connection to the multiplayer server could not be established. = Не вдало ся установити безпечне злучіня із сервером бавкы у сїти.
Connecting to the multiplayer server timed out. = Вышов час на злучіня із сервером бавкы у сїти.
The multiplayer server took too long to respond. = Сервер бавкы у сїти одповідав надто довго.
The multiplayer request was cancelled. = Запрос бавкы у сїти быв одкликаный.
The multiplayer server could not be reached. = Не вдало ся злучити із сервером бавкы у сїти.
The multiplayer server returned an invalid response. = Сервер бавкы у сїти вернув неважну одповідь.
The multiplayer server failed with status [statusCode]. = Сервер бавкы у сїти скінчив хыбов із статусом [statusCode].
The multiplayer server rejected the request with status [statusCode]. = Сервер бавкы у сїти одкинув запрос із статусом [statusCode].
Authentication validation was cancelled = Перевірка потверджіня особности была одкликана
The game was uploaded, but its multiplayer preview is not confirmed. = Бавку одослано, але її перегляд бавкы у сїти не потвердженый.
The multiplayer server may have stored the game, but did not confirm the upload. = Сервер бавкы у сїти міг всокотити бавку, але не потвердив одосланя.
