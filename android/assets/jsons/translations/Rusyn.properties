Gandhi = Ґанді
I have just received a report that large numbers of my troops have crossed your borders. = Я тільки-но дізнався, що велика кількість моїх воїнів перейшла через ваші кордони.
My attempts to avoid violence have failed. An eye for an eye only makes the world blind. = Мої спроби уникати насильства зазнали невдачі. Око за око лиш робить світ сліпим.
You can chain me, you can torture me, you can even destroy this body, but you will never imprison my mind. = Ви можете мене прикувати, катувати мене, можете навіть знищити моє тіло. Але вам ніколи не здолати мій дух.
Curious. = Інтересно.
Hello, I am Mohandas Gandhi. My people call me Bapu, but please, call me friend. = Привіт, я Магатма Ґанді. Мої люди звуть мене Бапу, але будь-ласка, називай мене другом.
My friend, are you interested in this arrangement? = Мій друже, ти зацікавлений у цій пропозиції?
I wish you peace. = Я бажаю вам миру.
Population Growth = Помноженя людове
Wise Mahatma Gandhi, great leader of India, we honor you! India is one of the oldest countries in the world with 10,000 years of history, built on spirit and religion, as three of the world's great religions - Hinduism, Buddhism and Jainism - appeared on this sacred land. Every aspect of India society reveres art, music and color, showing great wealth but also grinding poverty. For centuries, India was torn between local kingdoms fighting each other but also repelling invaders. In the 12th century AD, Muslim Turks tried to conquer India, then the Mongols took their place. In the early 17th century, India, still fragmented, was colonized by the English and their diplomacy and technological superiority. After two centuries of British dominion, Indian nationalism woke up, and you, Great Mahatma, have led a peaceful and victorious rebellion never seen anywhere in history! = Мудрый Махатма Ґанді, великый вождю Індії, чистуєме вас! Індія є єдна из найдавнішых держав світа из 10,000 роками історії, поставлена на духу тай реліґії, бо три великі світові реліґії — гіндуізм, буддізм тай джайнізм — ся появили на сюй святуй земли. Кажда часть індійской сполочности чистує уменя, музыку тай фарбы, указуючи велике богатство, ай і тяжку бідноту. Через столітя Індія была розірвана меджі містныма королівствами, котрі боёвали меджі собов, айбо і удбивали нападників. У 12. столітю н. е. мусулманскі Туркы пробовали добыти Індію, потім на их місто пришли Монголы. На початку 17. столітя Індію, іще розділену, колонізовали Анґлічане свойов діпломатійов тай технолоґічнов превагов. По двох столітях брітанского панованя ся індійске народне свідомя пробудило, тай вы, Великый Махатма, сьте повели мирне тай побідне повстаня, якого іще нигде в історії не было!
Gandhi, your people ask again to be led on the path of freedom. Under protection of Ganesha and Surya, can India accomplish its great potential? Will your new empire shine through the ages of history? = Ґанді, ваш народ знову просит, обы сьте го повели путёв свободы. Пуд охранов Ґанешы тай Сур'ї, ци може Індія выповнити свої великі можности? Ци ваша нова імперія буде світити через вікы історії?
