Ancien Régime = Ancien Regime
Vive Napoleon I, First Consul and Emperor of France! After the glorious Revolution which suppressed the centuries-old monarchy, the French nation stood at the heart of Europe as a Republic, and intended to export its ideals to the entire European continent, either by diplomacy or war. The French Capital Paris was more than ever the world center of Culture, Arts, and Letters. With its Great Army, reputed as one of the greatest in the History, France fought gloriously all surrounding enemies, but eventually fell against the coalition of other European powers. = Vive Napoleon I, eerste konsul en keiser van Frankryk! Na die glorieryke Rewolusie wat die eeue-oue monargie onderdruk het, het die Franse nasie in die hart van Europa gestaan ​​as 'n Republiek, en was van plan om sy ideale na die hele Europese vasteland uit te voer, hetsy deur diplomasie of oorlog. Die Franse hoofstad Parys was meer as ooit die wêreldsentrum van Kultuur, Kuns en Lettere. Met sy Groot Leër, bekend as een van die grootstes in die Geskiedenis, het Frankryk glorieryk teen alle omliggende vyande geveg, maar uiteindelik teen die koalisie van ander Europese moondhede geval.
Napoleon Bonaparte, ruler of the French people, will you rebuild the Empire to take revenge on your foes, and make again of its Capital the City of Lights? Will your new empire shine through the ages of history? = Napoleon Bonaparte, heerser van die Franse volk, sal jy die Ryk herbou om wraak te neem op jou vyande, en weer van sy Hoofstad die Stad van Ligte maak? Sal jou nuwe ryk deur die eeue van die geskiedenis skyn?
