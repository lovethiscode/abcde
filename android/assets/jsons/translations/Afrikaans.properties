I hereby inform you of our intention to wipe out your civilization from this world. = Hiermee lig ek jou in van ons voorneme om jou beskawing uit hierdie wêreld uit te wis.
Pitiful fool! Now we shall destroy you! = Jammerlike dwaas! Nou sal ons jou vernietig!
