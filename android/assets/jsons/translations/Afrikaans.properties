If you like Unciv, please rate and review it in the App Store.\n If you find a problem or have a suggestion, open a GitHub issue and help us make the game even better! = As jy van Unciv hou, gradeer en beoordeel dit asseblief in die App Store.\n As jy 'n probleem vind of 'n voorstel het, open 'n GitHub issue en help ons om die speletjie nog beter te maak!

