I have just received a report that large numbers of my troops have crossed your borders. = Ek het pas 'n berig ontvang dat groot getalle van my troepe jou grense oorgesteek het.
My attempts to avoid violence have failed. An eye for an eye only makes the world blind. = My pogings om geweld te vermy het misluk. ’n Oog vir ’n oog maak die wêreld net blind.
You can chain me, you can torture me, you can even destroy this body, but you will never imprison my mind. = Jy kan my vasketting, jy kan my martel, jy kan selfs hierdie liggaam vernietig, maar jy sal nooit my verstand gevange hou nie.
Curious. = Nuuskierig.
