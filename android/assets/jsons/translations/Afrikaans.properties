Your wanton aggression leaves us no choice. Prepare for war! = Jou moedswillige aggressie laat ons geen keuse nie. Berei voor vir oorlog!
You have mistaken our love of peace for weakness. You shall regret this! = Jy het ons liefde vir vrede vir swakheid verwar. Jy sal spyt wees hieroor!
The day...is yours. I hope you will be merciful in your triumph. = Die dag...is joune. Ek hoop jy sal genadig wees in jou triomf.
The people of the United States of America welcome you. = Die mense van die Verenigde State van Amerika verwelkom jou.
Is the following trade of interest to you? = Is die volgende ambag van belang vir jou?
Well? = Wel?
