You've behaved yourself very badly, you know it. Now it's payback time. = Jy het jouself baie sleg gedra, jy weet dit. Nou is dit terugbetaaltyd.
You've mistaken my passion for a weakness, you'll regret about this. = Jy het my passie vir 'n swakheid verwar, jy sal spyt wees hieroor.
We were defeated, so this makes me your prisoner. I suppose there are worse fates. = Ons is verslaan, so dit maak my jou gevangene. Ek veronderstel daar is erger lotgevalle.
Fine then. It's your call. = Goed dan. Dit is jou oproep.
I greet you, stranger! If you are as intelligent and tactful as you are attractive, we'll get along just fine. = Ek groet jou, vreemdeling! As jy so intelligent en taktvol is as wat jy aantreklik is, sal ons goed oor die weg kom.
How would you like it if I propose this kind of exchange? = Hoe sal jy daarvan hou as ek hierdie soort ruil voorstel?
Hello! = Hallo!
What do you need?! = Wat het jy nodig?!
Siberian Riches = Siberiese Rykdom
Hail to Imperial Majesty Catherine, Empress of all Russians. Living in the largest country in the world, from the Pacific Ocean in the east to the Baltic Sea in the west, your people endured wars, droughts, and many disasters, imbuing the Russian society with heroism and tenacity, and producing artists and scientists among the best in the world. Russia is a powerful empire which rightfully claims its place in the world concert of superpowers. = Geluk aan die Keiserlike Majesteit Catherine, Keiserin van alle Russe. Deur in die grootste land ter wêreld, van die Stille Oseaan in die ooste tot die Oossee in die weste, te woon, het jou mense oorloë, droogtes en baie rampe verduur, die Russiese samelewing met heldhaftigheid en vasbyt deurdrenk, en kunstenaars en wetenskaplikes opgelewer onder die beste in die wêreld. Rusland is 'n magtige ryk wat met reg sy plek in die wêreldkonsert van supermoondhede opeis.
Empress Catherine, your people are eager for Russian glory, to revive the sacred light of the Motherland. Will your new empire shine through the ages of history? = Keiserin Catherine, jou mense is gretig vir Russiese glorie, om die heilige lig van die Moederland te laat herleef. Sal jou nuwe ryk deur die eeue van die geskiedenis skyn?
