The world will be more beautiful without you. Prepare for war. = Die wêreld sal mooier wees sonder jou. Berei voor vir oorlog.
Fool! You will soon regret dearly! I swear it! = Dwaas! Jy sal binnekort baie spyt wees! Ek sweer dit!
You have won, congratulations. My palace is now in your possession, and I beg that you care well for the peacock. = Jy het gewen, baie geluk. My paleis is nou in jou besit, en ek smeek dat jy goed vir die pou omgee.
Our future battle will be glorious. = Ons toekomstige stryd sal glorieryk wees.
Welcome foreigner, I am Harun Al-Rashid, Caliph of the Arabs. Come and tell me about your empire. = Welkom vreemdeling, ek is Harun Al-Rashid, Kalief van die Arabiere. Kom vertel my van jou ryk.
Come forth, let's do business. = Kom na vore, kom ons doen besigheid.
Peace be upon you. = Vrede met jou.
Trade Caravans = Handel Karavane
Blessings of the Great God be upon you, O great caliph Harun al-Rashid, leader of the mighty Arabian people! The Muslim Empire, the Caliphate, born from chaos after the death of the prophet Muhammad in 632 AD, intended to apply the rule of God to all Earth. And by the will of God, the caliphate reached its full power, ruling Spain, North Africa, the Middle East, Anatolia, the Balkans and Persia, to even surpass the Great Roman Empire. The arts and sciences were a holy gift of Arabia during the Middle Ages, as the infidel lands of Europe delved deep into ignorance and chaos. Lasting for six hundred years, the Caliphate finally fell before the Mongols, the plague of the civilized world. = Seëninge van die Groot God wees op jou, o groot kalief Harun al-Rashid, leier van die magtige Arabiese volk! Die Moslem-ryk, die Kalifaat, gebore uit chaos na die dood van die profeet Mohammed in 632 nC, was van plan om die heerskappy van God op die hele aarde toe te pas. En deur die wil van God het die kalifaat sy volle mag bereik deur Spanje, Noord-Afrika, die Midde-Ooste, Anatolië, die Balkan en Persië te regeer, om selfs die Groot Romeinse Ryk te oortref. Die kunste en wetenskap was 'n heilige gawe van Arabië gedurende die Middeleeue, aangesien die ongelowige lande van Europa diep in onkunde en chaos gedelf het. Die kalifaat het seshonderd jaar lank geduur en uiteindelik voor die Mongole, die plaag van die beskaafde wêreld, geval.
Great Caliph Harun al Rashid, all Arabian people long for greatness! Arabia must be once again the land of arts and knowledge, which under the radiant law of God, will fear no enemy! Will your new empire shine through the ages of history? = Groot Kalief Harun al Rashid, alle Arabiese mense smag na grootheid! Arabië moet weer die land van kunste en kennis wees, wat onder die stralende wet van God, geen vyand sal vrees nie! Sal jou nuwe ryk deur die eeue van die geskiedenis skyn?
