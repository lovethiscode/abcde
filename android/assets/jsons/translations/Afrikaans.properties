Greetings, I am Empress Wu Zetian. China desires peace and development. You leave us alone, we'll leave you alone. = Groete, ek is keiserin Wu Zetian. China begeer vrede en ontwikkeling. Laat jy ons alleen, ons sal jou alleen los.
My friend, do you think you can accept this request? = My vriend, dink jy jy kan hierdie versoek aanvaar?
