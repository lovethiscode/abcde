My friend, are you interested in this arrangement? = My vriend, stel jy belang in hierdie reëling?
I wish you peace. = Ek wens jou vrede toe.
Population Growth = Bevolkingsgroei
Wise Mahatma Gandhi, great leader of India, we honor you! India is one of the oldest countries in the world with 10,000 years of history, built on spirit and religion, as three of the world's great religions - Hinduism, Buddhism and Jainism - appeared on this sacred land. Every aspect of India society reveres art, music and color, showing great wealth but also grinding poverty. For centuries, India was torn between local kingdoms fighting each other but also repelling invaders. In the 12th century AD, Muslim Turks tried to conquer India, then the Mongols took their place. In the early 17th century, India, still fragmented, was colonized by the English and their diplomacy and technological superiority. After two centuries of British dominion, Indian nationalism woke up, and you, Great Mahatma, have led a peaceful and victorious rebellion never seen anywhere in history! = Wyse Mahatma Gandhi, groot leier van Indië, ons eer jou! Indië is een van die oudste lande ter wêreld met 10 000 jaar se geskiedenis, gebou op gees en godsdiens, aangesien drie van die wêreld se groot godsdienste – Hindoeïsme, Boeddhisme en Djainisme – op hierdie heilige land verskyn het. Elke aspek van die Indiese samelewing vereer kuns, musiek en kleur, wat groot rykdom toon, maar ook knaende armoede. Vir eeue was Indië verskeur tussen plaaslike koninkryke wat teen mekaar geveg het, maar ook indringers afgeweer het. In die 12de eeu nC het Moslem-Turke probeer om Indië te verower, toe neem die Mongole hul plek in. In die vroeë 17de eeu is Indië, steeds gefragmenteerd, gekoloniseer deur die Engelse en hul diplomasie en tegnologiese meerderwaardigheid. Na twee eeue van Britse heerskappy het Indiese nasionalisme wakker geword, en jy, Groot Mahatma, het 'n vreedsame en seëvierende rebellie gelei wat nog nooit in die geskiedenis gesien is nie!
Gandhi, your people ask again to be led on the path of freedom. Under protection of Ganesha and Surya, can India accomplish its great potential? Will your new empire shine through the ages of history? = Gandhi, jou mense vra weer om gelei te word op die pad van vryheid. Onder beskerming van Ganesha en Surya, kan Indië sy groot potensiaal bereik? Sal jou nuwe ryk deur die eeue van die geskiedenis skyn?
