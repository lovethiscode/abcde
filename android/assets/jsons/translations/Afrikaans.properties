Art of War = Kuns van Oorlog
Heaven itself bends before your beauty, Empress Wu Zetian, ruler of eternal China! You lead one of the oldest and greatest civilization of humanity. In your time, China stood at the forefront of science and technology, bringing the world such contributions as gunpowder, the printing press, and the world of Confucius, and this, long before the rest of the world was mature enough to make the same discoveries! = Die hemel self buig voor jou skoonheid, keiserin Wu Zetian, heerser van die ewige China! Jy lei een van die oudste en grootste beskawings van die mensdom. In jou tyd het China aan die voorpunt van wetenskap en tegnologie gestaan ​​en die wêreld bydraes gebring soos buskruit, die drukpers en die wêreld van Confucius, en dit, lank voordat die res van die wêreld volwasse genoeg was om dieselfde ontdekkings te maak!
Great Queen, can you make China prevail again, using your divine intelligence and beauty? China stands for greatness, and all its enemies will be dazzled soon enough! Will your new empire shine through the ages of history? = Groot Koningin, kan jy China weer laat seëvier deur jou goddelike intelligensie en skoonheid te gebruik? China staan ​​vir grootsheid, en al sy vyande sal gou genoeg verblind word! Sal jou nuwe ryk deur die eeue van die geskiedenis skyn?
