President Washington, we salute you and the proud American civilization! Freed from the British dominion in the 18th century, then cleansed and reborn after a terrible civil war, the United States nation was ready to play its great role in the 20th century. At the height of its power, triumphant after two terrible world wars, United States of America, a land of immigration, opportunities, optimism and determination, has risen above all other weakening nations, unable to equal such power. = President Washington, ons salueer jou en die trotse Amerikaanse beskawing! Bevry van die Britse heerskappy in die 18de eeu, toe gereinig en hergebore na 'n verskriklike burgeroorlog, was die Verenigde State-nasie gereed om sy groot rol in die 20ste eeu te speel. Op die hoogtepunt van sy mag, triomfantelik na twee verskriklike wêreldoorloë, het die Verenigde State van Amerika, 'n land van immigrasie, geleenthede, optimisme en vasberadenheid, bo alle ander verswakkende nasies uitgestyg, nie in staat om sulke mag te ewenaar nie.
President Washington, will you show to the world the legitimacy of the American way of life, and spread the flame of liberty to all mankind? Will your new empire shine through the ages of history? = President Washington, sal u aan die wêreld die legitimiteit van die Amerikaanse lewenswyse wys en die vlam van vryheid na die hele mensdom versprei? Sal jou nuwe ryk deur die eeue van die geskiedenis skyn?
