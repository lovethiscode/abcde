You are but a pest on this Earth, prepare to be eliminated! = Jy is maar 'n plaag op hierdie aarde, maak gereed om uitgeskakel te word!
You are a fool who evokes pity. You have brought my hostility upon yourself and your repulsive civilization! = Jy is 'n dwaas wat jammerte wek. Jy het my vyandigheid oor jouself en jou afstootlike beskawing gebring!
Strike me down and my soul will torment yours forever, you have won nothing. = Slaan my neer en my siel sal joune vir altyd pynig, jy het niks gewen nie.
Greetings, I am Ramesses the god. I am the living embodiment of Egypt, mother and father of all civilizations. = Groete, ek is Ramses die god. Ek is die lewende beliggaming van Egipte, moeder en vader van alle beskawings.
Generous Egypt makes you this offer. = Vrygewige Egipte maak vir jou hierdie aanbod.
Good day. = Goeie dag.
Oh, it's you. = O, dis jy.
Monument Builders = Monumentbouers
O great Ramesses, Pharaoh of Egypt, bright as the Sun and mighty as the Nile! Lord of all living things, you lead the greatest of all civilizations, which has gifted the world with writing, advanced mathematics, sculpture, and architecture. Egyptian monuments and culture will continue to amaze the world for thousands of years. = O groot Ramses, Farao van Egipte, helder soos die Son en magtig soos die Nyl! Here van alle lewende dinge, U lei die grootste van alle beskawings, wat die wêreld begaafd het met skryfwerk, gevorderde wiskunde, beeldhoukuns en argitektuur. Egiptiese monumente en kultuur sal voortgaan om die wêreld vir duisende jare te verstom.
Mighty and eternal Ramesses, Egypt lasted for millenia, whereas other civilisations disappeared into dust after a few centuries. Amun-Ra blesses you again to lead Egypt and its people on the path of light. Will your new empire shine through the ages of history? = Magtige en ewige Ramses, Egipte het vir millennia geduur, terwyl ander beskawings na 'n paar eeue in stof verdwyn het. Amun-Ra seën jou weer om Egipte en sy mense op die pad van lig te lei. Sal jou nuwe ryk deur die eeue van die geskiedenis skyn?
