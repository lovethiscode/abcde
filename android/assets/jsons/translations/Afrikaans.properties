# Capturing a city

What would you like to do with the city of [cityName]? = Wat wil jy met die stad [cityName] doen?
Annex = Bylae
Annexed cities become part of your regular empire. = Geannekseerde stede word deel van jou gewone ryk.
Their citizens generate 2x the unhappiness, unless you build a courthouse. = Hulle burgers genereer 2x die ongelukkigheid, tensy jy 'n hofgebou bou.
Your civilization may not annex this city. = Jou beskawing mag nie hierdie stad annekseer nie.
Puppet = Poppie
Puppeted cities do not increase your tech or policy cost. = Poppestede verhoog nie jou tegnologie- of poliskoste nie.
You have no control over the the production of puppeted cities. = Jy het geen beheer oor die produksie van poppe-stede nie.
Puppeted cities also generate 25% less Science and Culture. = Poppestede genereer ook 25% minder Wetenskap en Kultuur.
A puppeted city can be annexed at any time. = ’n Poppestad kan enige tyd geannekseer word.
Liberate (city returns to [originalOwner]) = Bevry (stad keer terug na [originalOwner])
Liberating a city returns it to its original owner, giving you a massive relationship boost with them! = Om 'n stad te bevry, gee dit terug aan sy oorspronklike eienaar, wat jou 'n massiewe hupstoot in verhouding met hulle gee!
Raze = Raze
Razing the city annexes it, and starts burning the city to the ground. = Die vernietiging van die stad annekseer dit en begin die stad tot op die grond afbrand.
Razing the city puppets it, and starts burning the city to the ground. = Die vernietiging van die stad maak dit marionette en begin die stad tot op die grond afbrand.
The population will gradually dwindle until the city is destroyed. = Die bevolking sal geleidelik afneem totdat die stad vernietig word.
Original capitals and holy cities cannot be razed. = Oorspronklike hoofstede en heilige stede kan nie vernietig word nie.
Destroy = Vernietig
Destroying the city instantly razes the city to the ground. = Deur die stad te vernietig, word die stad onmiddellik met die grond gelykgemaak.
Keep it = Hou dit
Remove your troops in our border immediately! = Verwyder jou troepe onmiddellik in ons grens!
Sorry. = Jammer.
Never! = Nooit!
Those lands were not yours to take. This has not gone unnoticed. = Daardie lande was nie joune om te neem nie. Dit het nie ongesiens verbygegaan nie.

