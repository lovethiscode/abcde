Hi there! If you've played this far, you've probably seen that the game is currently incomplete.\n Unciv will remain open-source forever. = Hallo! As jy so ver gespeel het, het jy waarskynlik gesien dat die speletjie tans onvolledig is.\n Unciv sal vir altyd oopbron bly.
