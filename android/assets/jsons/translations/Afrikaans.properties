Lord Oda Nobunaga, ruler of Japan, the land of the Rising Sun is at your command! Through history, Japanese people lived and died with honor, proud of their rich culture of arts and letters. Years of bloody civil wars, invasions of foreign powers, wealth but also great poverty, have never altered the strong will of the Rising Sun island, as the Bushido spirit has imbued the fields of battle and the Japanese society for millenia. At the end of the 19th century, under foreign influence, your people took the path of modernity, and in a few decades, made of Japan a land of technological innovation and powerful industry, with which only few nations can compete. = Here Oda Nobunaga, heerser van Japan, die land van die Opkomende Son is op u bevel! Deur die geskiedenis het Japannese mense met eer geleef en gesterf, trots op hul ryk kultuur van kuns en letters. Jare van bloedige burgeroorloë, invalle van buitelandse moondhede, rykdom maar ook groot armoede, het nog nooit die sterk wil van die Rising Sun-eiland verander nie, aangesien die Bushido-gees die velde van stryd en die Japannese samelewing vir millennia deurdrenk het. Aan die einde van die 19de eeu, onder buitelandse invloed, het jou mense die pad van moderniteit geneem en in 'n paar dekades van Japan 'n land van tegnologiese innovasie en kragtige industrie gemaak, waarmee slegs min nasies kan meeding.
O great daimyo, will you take on your hands the Japan destiny, for the Rising Sun to light the world? Will your new empire shine through the ages of history? = O groot daimyo, sal jy die bestemming van Japan op jou hande neem, vir die Opkomende Son om die wêreld te verlig? Sal jou nuwe ryk deur die eeue van die geskiedenis skyn?
