Long live to Your Highness, Queen Elizabeth Gloriana, leader and protector of the glorious England! Through history, enduring many invasions, England strengthened its will, playing smartly with diplomacy, cunning, and military power, to eventually rose as one of the most dominant Empires the world has ever known. Their matchless navy, brilliant scientists and artists, and powerful merchants, have shaped the known world for centuries. = Lank lewe tot U Hoogheid, Koningin Elizabeth Gloriana, leier en beskermer van die glorieryke Engeland! Deur die geskiedenis, wat baie invalle verduur het, het Engeland sy wil versterk, slim gespeel met diplomasie, listigheid en militêre mag, om uiteindelik op te staan ​​as een van die mees dominante Ryke wat die wêreld nog ooit geken het. Hul weergalose vloot, briljante wetenskaplikes en kunstenaars, en magtige handelaars, het die bekende wêreld vir eeue gevorm.
Queen Elizabeth, will England cast once more its brightness upon all lands and seas of the world? Will your new empire shine through the ages of history? = Koningin Elizabeth, sal Engeland weer sy glans op alle lande en seë van die wêreld werp? Sal jou nuwe ryk deur die eeue van die geskiedenis skyn?
