Alexander = Alexander
You are in my way, you must be destroyed. = Jy is in my pad, jy moet vernietig word.
As a matter of fact I too grow weary of peace. = Trouens, ek word ook moeg vir vrede.
You have somehow become my undoing! What kind of beast are you? = Jy het op een of ander manier my ondergang geword! Watter soort dier is jy?
The Gods frown upon your foolishness. = Die gode frons oor jou dwaasheid.
Hello stranger! I am Alexandros, son of kings and grandson of the gods! = Hallo vreemdeling! Ek is Alexandros, seun van konings en kleinseun van die gode!
My friend, does this seem reasonable to you? = My vriend, lyk dit vir jou redelik?
Greetings! = Groete!
What? = Wat?
Hellenic League = Helleense Liga
Great King Alexander, leader of the mighty Greek nation, you are truly blessed by the gods. In 480 BC, quarrelsome city-states such as Athens, Sparta, Thebes, found a way to join their forces, allowing Greece to defeat the mighty Persia in the 5th century BC, both on land and sea. Following their example, you lead a Greek coalition and finally struck down the Persian Empire in 331 BC. You conquered almost all the known world, and from Europe to Africa to India, you built an empire unmatched by any before it. = Groot koning Alexander, leier van die magtige Griekse nasie, jy is waarlik deur die gode geseën. In 480 vC het twisgierige stadstate soos Athene, Sparta, Thebe 'n manier gevind om hul magte saam te snoer, wat Griekeland in staat gestel het om die magtige Persië in die 5de eeu vC te verslaan, beide op land en see. Na hul voorbeeld lei jy 'n Griekse koalisie en het uiteindelik die Persiese Ryk in 331 vC platgeslaan. Jy het byna die hele bekende wêreld verower, en van Europa tot Afrika tot Indië, jy het 'n ryk gebou wat ongeëwenaard is deur enige voor dit.
Megalexandros, son of Zeus, will you ride Bucephalas again, to gift the world with the brightness of the Greek culture? Will your new empire shine through the ages of history? = Megalexandros, seun van Zeus, sal jy weer Bucephalas ry, om die wêreld te gee met die helderheid van die Griekse kultuur? Sal jou nuwe ryk deur die eeue van die geskiedenis skyn?
