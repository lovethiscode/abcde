What motivates me to keep working on it, \n  besides the fact I think it's amazingly cool that I can,\n  is the support from the players - you guys are the best! = Wat my motiveer om daaraan te bly werk, \n  buiten die feit dat ek dink dit is ongelooflik gaaf dat ek kan,\n  is die ondersteuning van die spelers – julle is die beste!
