Augustus Caesar = Augustus Caesar
My treasury contains little and my soldiers are getting impatient... (sigh) ...therefore you must die. = My skatkis bevat min en my soldate raak ongeduldig ... (sug) ... daarom moet jy sterf.
So brave, yet so stupid! If only you had a brain similar to your courage. = So dapper, maar tog so dom! As jy net 'n brein gehad het soortgelyk aan jou moed.
The gods have deprived Rome of their favour. We have been defeated. = Die gode het Rome van hul guns ontneem. Ons is verslaan.
I wasn't sure, but it seems you do have some grit. = Ek was nie seker nie, maar dit lyk of jy 'n bietjie sarsie het.
I greet you. I am Augustus, Imperator and Pontifex Maximus of Rome. If you are a friend of Rome, you are welcome. = Ek groet jou. Ek is Augustus, Imperator en Pontifex Maximus van Rome. As jy 'n vriend van Rome is, is jy welkom.
I offer this, for your consideration. = Ek bied dit aan, vir u oorweging.
Hail. = Gegroet.
What do you want? = Wat wil jy hê?
The Glory of Rome = Die Glorie van Rome
Ave Caesar Augustus, Emperor of Rome and Dominus of the Roman Empire! Your empire was the most powerful and feared of all in Western civilization. The Roman people crafted so brilliantly its culture, law, art, and warfare, that no one could contest the supremacy of Rome. Force and Honor led to glorious conquests, a domination of all the lands from Spain in the west to Syria in the east, even reaching the remote barbarian lands of England and Germany. Roman art and architecture have been praised for millenia and have been envied by all lesser civilizations who have followed. = Ave Caesar Augustus, Keiser van Rome en Dominus van die Romeinse Ryk! Jou ryk was die magtigste en mees gevreesde van almal in die Westerse beskawing. Die Romeinse volk het sy kultuur, wette, kuns en oorlogvoering so briljant vervaardig dat niemand die oppergesag van Rome kon betwis nie. Mag en Eer het gelei tot glorieryke verowerings, 'n oorheersing van al die lande van Spanje in die weste tot Sirië in die ooste, en selfs die afgeleë barbaarse lande van Engeland en Duitsland bereik. Romeinse kuns en argitektuur is al millennia lank geprys en is beny deur alle mindere beskawings wat gevolg het.
O glorious Imperator, your people celebrate you and ask for the glory of Rome! In these times of darkness, the Pax Romana will be a beacon of light for all! Will your new empire shine through the ages of history? = O glorieryke Imperator, u mense vier u en vra vir die eer van Rome! In hierdie tye van duisternis sal die Pax Romana 'n baken van lig vir almal wees! Sal jou nuwe ryk deur die eeue van die geskiedenis skyn?
