# Refactored menu and window localization
1. Tap Create room, choose the rules and map, then share the invitation. = 1. Tik Skep kamer, kies die reëls en kaart, en deel dan die uitnodiging.
1. The Android player copies their Player ID from Multiplayer and sends it to the iOS host. = 1. Die Android-speler kopieer hul speler-ID vanaf Multiplayer en stuur dit na die iOS-gasheer.
2. In an empty player seat, the host taps Add player manually, pastes the Player ID, taps the portrait to choose a civilization, then taps Mark ready. = 2. In 'n leë spelersitplek tik die gasheer Voeg speler by, plak die speler-ID, tik op die portret om 'n beskawing te kies, en tik dan Merk gereed.
2. Other iOS players open the invitation or paste it in Join by invitation, tap their civilization portrait to choose, then tap Ready. = 2. Ander iOS-spelers maak die uitnodiging oop of plak dit in Sluit aan op uitnodiging, tik op hul beskawingsportret om te kies en tik dan Gereed.
