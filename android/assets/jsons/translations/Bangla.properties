Scourge of God = ঈশ্বরের চাবুক
Great Attila, mighty warrior and leader of the Hunnic empire, your men bow down before you. During the 5th century, you and your brother Bleda have conquered many lands, forged a mighty empire and commanded the most powerful and frightening force of antiquity. You inspired fear to the Roman Emperors themselves, who called you 'Flagellum Dei', the 'Scourge of God', as you took kingdom after kingdom in the Balkans, invaded Eastern Roman Empire, into Gaul and Northern Italy, and planned to conquer Rome itself. Your empire didn't survive long after your death, but your name and your legend have, for millenia to come. = মহান আতিলা, হুন সাম্রাজ্যের শক্তিশালী যোদ্ধা ও নেতা, আপনার সেনারা আপনার সামনে মাথা নত করে। 5ম শতকে আপনি ও আপনার ভাই Bleda বহু দেশ জয় করেন, এক শক্তিশালী সাম্রাজ্য গড়েন এবং প্রাচীন যুগের সবচেয়ে শক্তিশালী ও ভয়ংকর বাহিনীর নেতৃত্ব দেন। রোমান সম্রাটেরাও আপনাকে ভয় পেতেন; তাঁরা আপনাকে «Flagellum Dei», «ঈশ্বরের চাবুক» বলতেন। আপনি বলকানে একের পর এক রাজ্য দখল করেন, পূর্ব রোমান সাম্রাজ্য, গল ও উত্তর ইতালি আক্রমণ করেন এবং রোম জয়ের পরিকল্পনা করেন। আপনার মৃত্যুর পর সাম্রাজ্য বেশিদিন টেকেনি, কিন্তু আপনার নাম ও কিংবদন্তি পরবর্তী সহস্রাব্দগুলোতে টিকে আছে।
