Hi there! If you've played this far, you've probably seen that the game is currently incomplete.\n Unciv is meant to be open-source and free, forever.\n That means no ads or any other nonsense. = নমস্কার! এত দূর খেলে থাকলে হয়তো দেখেছেন খেলা এখনও অসম্পূর্ণ।\n Unciv চিরকাল উন্মুক্ত উৎসের এবং বিনা মূল্যের থাকবে।\n অর্থাৎ কোনো বিজ্ঞাপন বা অন্য বিরক্তিকর কিছু থাকবে না।
Every rating and review that I get puts a smile on my face =)\n  So contact me! Send me an email, review, Github issue\n  or mail pigeon, and let's figure out how to make the game \n  even more awesome!\n(Contact info is in the Play Store) = আপনাদের প্রতিটি মূল্যায়ন ও পর্যালোচনা আমার মুখে হাসি ফোটায় =)\n তাই যোগাযোগ করুন! ইমেইল, পর্যালোচনা, GitHub ইস্যু\n বা চিঠির পায়রা পাঠান। একসঙ্গে ভাবি কীভাবে খেলাটিকে\n আরও চমৎকার করা যায়!\n(যোগাযোগের তথ্য Play Store-এ আছে)
