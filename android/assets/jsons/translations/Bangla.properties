God and history will remember your actions this day. I hope you are ready for your impending judgment. = ঈশ্বর ও ইতিহাস আজকের তোমার কাজ মনে রাখবে। আশা করি আসন্ন বিচারের জন্য প্রস্তুত আছ।
What a waste of time. = সময়ের কী অপচয়।
A thousand welcomes to our fair nation. I am Selassie, the Ras Tafari Makonnen and Emperor of Ethiopia, your humble servant. = আমাদের সুন্দর দেশে হাজারো স্বাগতম। আমি Selassie, Ras Tafari Makonnen ও ইথিওপিয়ার সম্রাট, আপনার বিনীত সেবক।
I request that you consider this offer between our two peoples. I believe it will do us both good. = আমাদের দুই জনগোষ্ঠীর মধ্যে এই প্রস্তাব বিবেচনা করার অনুরোধ করছি। বিশ্বাস করি এতে উভয়েরই মঙ্গল হবে।
Spirit of Adwa = Adwa-র চেতনা
May God bless you, wise and righteous Emperor of Ethiopia, Haile Selassie. As one of Ethiopia's greatest rulers and a spiritual leader of the Rastafarian movement, your good influence on diplomacy and political cooperation are praised throughout the world. You created Ethiopia's first written constitution, and favorized democracy for years to come, your great wisdom making Ethiopia enter as a charter member in the United Nations. Always aiming to reform and modernize your nation, you changed Ethiopian destiny for the best. = ঈশ্বর আপনার মঙ্গল করুন, ইথিওপিয়ার জ্ঞানী ও ন্যায়পরায়ণ সম্রাট Haile Selassie। ইথিওপিয়ার শ্রেষ্ঠ শাসকদের একজন ও রাস্তাফারি আন্দোলনের আধ্যাত্মিক নেতা হিসেবে কূটনীতি ও রাজনৈতিক সহযোগিতায় আপনার সুপ্রভাব বিশ্বজুড়ে প্রশংসিত। আপনি ইথিওপিয়ার প্রথম লিখিত সংবিধান রচনা করেন, পরবর্তী বছরগুলোতে গণতন্ত্রের পক্ষে থাকেন; আপনার প্রজ্ঞায় ইথিওপিয়া জাতিসংঘের প্রতিষ্ঠাতা সদস্য হয়। দেশকে সংস্কার ও আধুনিক করার লক্ষ্যে আপনি ইথিওপিয়ার ভাগ্য উন্নত করেছেন।
Revered King, your knowledge and intelligence are required once again to protect your people from many threats in the world. Will you secure peace and stability, with benevolence and authority, in the radiance of the Kebra Nagast? Will your new empire shine through the ages of history? = শ্রদ্ধেয় রাজা, বিশ্বের বহু হুমকি থেকে জনগণকে রক্ষায় আবার আপনার জ্ঞান ও বুদ্ধিমত্তা দরকার। Kebra Nagast-এর দীপ্তিতে কল্যাণ ও কর্তৃত্ব দিয়ে কি শান্তি ও স্থিতি নিশ্চিত করবেন? আপনার নতুন সাম্রাজ্য কি ইতিহাসের যুগে যুগে দীপ্তি ছড়াবে?
