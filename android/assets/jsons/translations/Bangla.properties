Kneel before King Pacal the Great, son of the gods and protector of the Palenque domain! After your kingdom has been harassed for years by neighboring rivals, you struck back at the enemies of your people, defeating each of them and sacrificing their leaders as a retribution to the insults made to your ancestors. Your wisdom and hard will not only restored the glory of Palenque, but turned it into a magnificient city, as your people built the greatest monuments and architecture the world has ever known. = দেবতাদের পুত্র ও Palenque-এর রক্ষক মহান রাজা Pacal-এর সামনে নতজানু হও! প্রতিবেশী প্রতিদ্বন্দ্বীরা বহু বছর আপনার রাজ্যকে হয়রান করার পর আপনি জনগণের শত্রুদের পাল্টা আঘাত করেন, প্রত্যেককে পরাস্ত করেন এবং পূর্বপুরুষদের অপমানের প্রতিশোধে তাদের নেতাদের বলি দেন। আপনার প্রজ্ঞা ও অটল ইচ্ছা শুধু Palenque-এর গৌরব ফেরায়নি, তাকে এক মহিমান্বিত শহরে পরিণত করেছে। আপনার জনগণ বিশ্বের শ্রেষ্ঠ মনুমেন্ট ও স্থাপনা নির্মাণ করেছে।
