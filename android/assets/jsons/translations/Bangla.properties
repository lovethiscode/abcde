Hiawatha = হিয়াওথা
You are a plague upon Mother Earth! Prepare for battle! = তুমি পৃথিবীর মাতার উপর মহামারী! যুদ্ধের জন্য প্রস্তুত!
You evil creature! My braves will slaughter you! = তুমি দুষ্ট জীব! আমার সাহসীরা তোমাকে বধ করবে!
You have defeated us... but our spirits will never be vanquished! We shall return! = আপনি আমাদের পরাজিত করেছেন... কিন্তু আমাদের আত্মা কখনই পরাজিত হবে না! আমরা ফিরব!
Words alone cannot shake the roots of peace I have planted among my people. = আমার মানুষের মধ্যে আমি যে শান্তির শিকড় রোপণ করেছি তা একা শব্দগুলি নাড়া দিতে পারে না।
Greetings, stranger. I am Hiawatha, speaker for the Iroquois. We seek peace with all, but we do not shrink from war. = শুভেচ্ছা, অপরিচিত। আমি হিয়াওয়াথা, ইরোকুয়েসের স্পিকার। আমরা সবার সাথে শান্তি চাই, কিন্তু আমরা যুদ্ধ থেকে সঙ্কুচিত হই না।
Does this trade work for you, my friend? = এই বাণিজ্য আপনার জন্য কাজ করে, আমার বন্ধু?
The Great Warpath = গ্রেট ওয়ারপথ
Greetings, noble Hiawatha, leader of the mighty Iroquois nations! Your people lived near the great and holy lake Ontario since the ancient ages, on a land that will be later known as New York city. Long ago, the five peoples of Seneca, Onondaga, Mohawks, Cayugas and Oneida became one nation, the Haudenosaunee, the Iroquois. Although not having a written language, the wise Iroquois created the Great Law of Peace, which can be considered the first established constitution. For decades, your people fought powerful enemies, such as the Huron, and then the French and English colonists. With less warriors and inferior weaponry, the Iroquois still survived and walk on the path of peace and harmony, until their way of living faded away under the crush of the newborn United States nation. = অভিবাদন, মহীয়ান হিয়াওয়াথা, শক্তিশালী ইরোকুইস জাতির নেতা! আপনার লোকেরা প্রাচীনকাল থেকে মহান এবং পবিত্র হ্রদ অন্টারিওর কাছে বাস করত, এমন একটি ভূমিতে যা পরে নিউ ইয়র্ক শহর হিসাবে পরিচিত হবে। অনেক আগে, সেনেকা, ওনোন্ডাগা, মোহাকস, ক্যায়ুগাস এবং ওনিডা-এর পাঁচটি মানুষ এক জাতি, হাউডেনোসাউনি, ইরোকুয়েস হয়ে ওঠে। লিখিত ভাষা না থাকলেও, জ্ঞানী ইরোকুইস শান্তির মহান আইন তৈরি করেছিলেন, যা প্রথম প্রতিষ্ঠিত সংবিধান হিসাবে বিবেচিত হতে পারে। কয়েক দশক ধরে, আপনার লোকেরা শক্তিশালী শত্রুদের সাথে লড়াই করেছে, যেমন হুরন, এবং তারপরে ফরাসি এবং ইংরেজ উপনিবেশবাদীদের সাথে। কম যোদ্ধা এবং নিকৃষ্ট অস্ত্রের সাথে, ইরোকুয়েস এখনও বেঁচে ছিল এবং শান্তি ও সম্প্রীতির পথে হাঁটছিল, যতক্ষণ না তাদের জীবনযাত্রার পথ নবজাতক মার্কিন যুক্তরাষ্ট্রের রাষ্ট্রের চাপে বিবর্ণ হয়ে যায়।
Great Sachem Hiawatha, do you hear the complaints of your people? Can you light the path leading to the ancient Iroquois union? Will your new empire shine through the ages of history? = গ্রেট সাচেম হিয়াওয়াথা, আপনি কি আপনার লোকদের অভিযোগ শুনতে পাচ্ছেন? আপনি প্রাচীন Iroquois ইউনিয়ন নেতৃস্থানীয় পথ আলো করতে পারেন? আপনার নতুন সাম্রাজ্য কি ইতিহাসের যুগে উজ্জ্বল হবে?
