Vile ruler, know you have won this war in name alone. Your cities lie buried and your troops defeated. I have my own victory. = নীচ শাসক, জেনে রাখো, কেবল নামেই তুমি এ যুদ্ধ জিতেছ। তোমার শহর ধ্বংসস্তূপে চাপা, সৈন্যরা পরাজিত। আমার নিজের বিজয় হয়েছে।
Don't forget who you're dealing with. Arrogant moves can get you in danger. = কার সঙ্গে কথা বলছ ভুলে যেয়ো না। উদ্ধত পদক্ষেপ তোমাকে বিপদে ফেলতে পারে।
I am Boudicca, Queen of the Celts. Let no-one underestimate me! = আমি Boudicca, কেল্টদের রানি। কেউ যেন আমাকে তুচ্ছ না ভাবে!
Let us join our forces together and reap the rewards. = আমাদের শক্তি এক করি, তার সুফল ভোগ করি।
God has given good to you. = ঈশ্বর তোমার মঙ্গল করেছেন।
Druidic Lore = ড্রুইডদের জ্ঞান
May glory and honor always be upon you, Warrior Queen! In a time dominated by men, you successfully claimed the throne and the power, but also valiantly defied the mighty Roman Empire. Punished and humiliated by the hand of the Roman bloody invaders, you united your people and led a terrible revolt, to seek revenge. Many legions fell under your fierce attacks and you burned the city of London with your anger. While the Romans still kept ownership of your land after your final defeat, your actions nonetheless showed Rome that this land could never be fully conquered, making Nero himself consider to withdraw all troops and leaving Britain forever. = যোদ্ধা রানি, গৌরব ও সম্মান সর্বদা আপনার সঙ্গে থাকুক! পুরুষপ্রধান যুগে আপনি শুধু সিংহাসন ও ক্ষমতা অর্জন করেননি, শক্তিশালী রোমান সাম্রাজ্যেরও সাহসিকতার সঙ্গে বিরোধিতা করেছেন। রক্তপিপাসু রোমান আক্রমণকারীদের হাতে শাস্তি ও অপমানের পর জনগণকে ঐক্যবদ্ধ করে প্রতিশোধ নিতে ভয়ংকর বিদ্রোহে নেতৃত্ব দেন। আপনার তীব্র আক্রমণে বহু লিজিয়ন পরাজিত হয়; ক্রোধে লন্ডন পুড়িয়ে দেন। চূড়ান্ত পরাজয়ের পরও রোমানরা আপনার দেশ দখলে রাখে, কিন্তু আপনার কর্মকাণ্ড প্রমাণ করে এ দেশ কখনও পুরোপুরি জয় করা যাবে না। স্বয়ং Nero-ও সব সৈন্য সরিয়ে চিরতরে ব্রিটেন ছাড়ার কথা ভাবেন।
O raging lioness, will you lead the Celts again under the glory of your name, to spread the fires of liberty, and achieve a final victory? Will your new empire shine through the ages of history? = হে ক্রুদ্ধ সিংহী, আপনার নামের মহিমায় আবার কি কেল্টদের নেতৃত্ব দিয়ে স্বাধীনতার আগুন ছড়াবেন এবং চূড়ান্ত বিজয় অর্জন করবেন? আপনার নতুন সাম্রাজ্য কি ইতিহাসের যুগে যুগে দীপ্তি ছড়াবে?
