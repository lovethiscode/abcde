Darius I = দারিয়াস আই
Your continue existence is an embarrassment to all leaders everywhere! You must be destroyed! = আপনার অবিরত অস্তিত্ব সর্বত্র সমস্ত নেতাদের জন্য বিব্রতকর! তোমাকে ধ্বংস করতে হবে!
Curse you! You are beneath me, son of a donkey driver! I will crush you! = অভিশাপ! তুমি আমার নিচে, গাধা ড্রাইভারের ছেলে! আমি তোমাকে পিষ্ট করব!
You mongrel! Cursed be you! The world will long lament your heinous crime! = তুমি মংগল! অভিশপ্ত তুমি! পৃথিবী তোমার জঘন্য অপরাধে বিলাপ করবে!
Peace be on you! I am Darius, the great and outstanding king of kings of great Persia... but I suppose you knew that. = আপনার উপর শান্তি বর্ষিত হোক! আমি দারিয়াস, মহান পারস্যের রাজাদের মহান এবং অসামান্য রাজা... কিন্তু আমি মনে করি আপনি তা জানতেন।
In my endless magnanimity, I am making you this offer. You agree, of course? = আমার অফুরন্ত উদারতায়, আমি আপনাকে এই অফারটি করছি। আপনি অবশ্যই একমত?
Good day to you! = আপনার জন্য শুভ দিন!
Ahh... you... = আহহ... তুমি...
Achaemenid Legacy = আচেমেনিড উত্তরাধিকার
Great King Darius of Persia, the heaven casts its light upon you! Persian people are strong and wise, as their leader. In old ages, the great Persian king Cyrus fought back the mighty Median empire and finally destroyed the Medes in 550 BC. Cunning diplomacy and military achievements helped then to conquer the wealthy Lydia and the powerful Babylon, Cyrus' son conquering the eternal Egypt some years later. At the height of its power, the Persian Empire reached the shores of Macedonia, at the very door of the upstart Greek city-states. Persia would have prospered for centuries if Alexander of Macedon hadn't brutally destroyed the great empire in one violent strike. = পারস্যের মহান রাজা দারিয়াস, স্বর্গ আপনার উপর আলো ফেলেছে! পারস্যের লোকেরা তাদের নেতা হিসাবে শক্তিশালী এবং জ্ঞানী। বৃদ্ধ বয়সে, মহান পারস্য রাজা সাইরাস শক্তিশালী মিডিয়ান সাম্রাজ্যের বিরুদ্ধে লড়াই করেছিলেন এবং শেষ পর্যন্ত 550 খ্রিস্টপূর্বাব্দে মেডিসদের ধ্বংস করেছিলেন। ধূর্ত কূটনীতি এবং সামরিক কৃতিত্ব তখন ধনী লিডিয়া এবং শক্তিশালী ব্যাবিলনকে জয় করতে সাহায্য করেছিল, সাইরাসের পুত্র কিছু বছর পরে চিরন্তন মিশর জয় করেছিলেন। তার ক্ষমতার উচ্চতায়, পারস্য সাম্রাজ্য মেসিডোনিয়ার উপকূলে পৌঁছেছিল, গ্রীক শহর-রাষ্ট্রগুলির একেবারে দরজায়। ম্যাসেডনের আলেকজান্ডার যদি একটি সহিংস স্ট্রাইকে নিষ্ঠুরভাবে মহান সাম্রাজ্যকে ধ্বংস না করতেন তবে পারস্য বহু শতাব্দী ধরে সমৃদ্ধ হত।
King Darius, the people of Persia await, longing for its past glory and power! Persia of the Immortals must reborn, to punish its foes and rebuild the gleaming Persepolis! Will your new empire shine through the ages of history? = রাজা দারিয়াস, পারস্যের লোকেরা অপেক্ষা করছে, এর অতীত গৌরব এবং ক্ষমতার জন্য আকুল! অমরদের পারস্যকে অবশ্যই পুনর্জন্ম করতে হবে, তার শত্রুদের শাস্তি দিতে এবং জ্বলজ্বলে পারসেপোলিসকে পুনর্নির্মাণ করতে হবে! আপনার নতুন সাম্রাজ্য কি ইতিহাসের যুগে উজ্জ্বল হবে?
