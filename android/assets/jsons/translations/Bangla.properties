Once again, greetings. = আবারও শুভেচ্ছা।
Dutch East India Company = ডাচ ইস্ট ইন্ডিয়া কোম্পানি
Greetings to the wise and brave Prince William of Orange, who freed the Netherlands and gave strength to the Dutch people. In 1568, you led a rebellion against Spanish dominion, to gain freedom for your people, and therefore starting the Eighty Years' War. Your actions were all aimed to create one of Europe's first modern republics, the Seven United Provinces. The rebellion was the meaning of your very life and death, as it was also the cause of your assassination in 1584. But your death has given even more pride and courage to your people, to fight for liberty against any oppressors. Carved in history as the 'Father of the Fatherland', your name is a symbol of Dutch independence for eternity. = জ্ঞানী ও সাহসী রাজকুমার অরেঞ্জের উইলিয়ামকে অভিবাদন, যিনি নেদারল্যান্ডসকে মুক্ত করে ডাচ জনগণকে শক্তি দিয়েছিলেন। 1568 সালে জনগণের স্বাধীনতার জন্য আপনি স্পেনীয় শাসনের বিরুদ্ধে বিদ্রোহে নেতৃত্ব দেন, যার মাধ্যমে আশি বছরের যুদ্ধ শুরু হয়। আপনার সব প্রচেষ্টার লক্ষ্য ছিল ইউরোপের প্রথমদিককার আধুনিক প্রজাতন্ত্রগুলোর একটি—সাত যুক্ত প্রদেশ—গড়া। এই বিদ্রোহই আপনার জীবন ও মৃত্যুর অর্থ ছিল; এর কারণেই 1584 সালে আপনাকে হত্যা করা হয়। কিন্তু আপনার মৃত্যু জনগণকে যেকোনো অত্যাচারীর বিরুদ্ধে স্বাধীনতার লড়াইয়ে আরও গর্ব ও সাহস দিয়েছে। ইতিহাসে «জাতির জনক» নামে অমর আপনার নাম চিরকাল ডাচ স্বাধীনতার প্রতীক।
Brave Prince, your people ask for your wisdom to gain its freedom once more, and to illuminate the world with progressive and modern ideas. Will your new empire shine through the ages of history? = সাহসী রাজকুমার, জনগণ আবার স্বাধীনতা পেতে ও প্রগতিশীল আধুনিক ভাবনা দিয়ে বিশ্বকে আলোকিত করতে আপনার প্রজ্ঞা চায়। আপনার নতুন সাম্রাজ্য কি ইতিহাসের যুগে যুগে দীপ্তি ছড়াবে?
