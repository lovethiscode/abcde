# Refactored menu and window localization
1. Tap Create room, choose the rules and map, then share the invitation. = 1. রুম তৈরি করুন আলতো চাপুন, নিয়ম এবং মানচিত্র চয়ন করুন, তারপর আমন্ত্রণ ভাগ করুন৷
1. The Android player copies their Player ID from Multiplayer and sends it to the iOS host. = 1. অ্যান্ড্রয়েড প্লেয়ার মাল্টিপ্লেয়ার থেকে তাদের প্লেয়ার আইডি কপি করে এবং এটি iOS হোস্টে পাঠায়।
2. In an empty player seat, the host taps Add player manually, pastes the Player ID, taps the portrait to choose a civilization, then taps Mark ready. = 2. একটি খালি প্লেয়ার সিটে, হোস্ট ম্যানুয়ালি প্লেয়ার যোগ করুন ট্যাপ করে, প্লেয়ার আইডি পেস্ট করে, একটি সভ্যতা বেছে নিতে প্রতিকৃতিতে ট্যাপ করে, তারপরে প্রস্তুত মার্ক ট্যাপ করে।
2. Other iOS players open the invitation or paste it in Join by invitation, tap their civilization portrait to choose, then tap Ready. = 2. অন্যান্য iOS প্লেয়াররা আমন্ত্রণটি খুলুন বা আমন্ত্রণ দ্বারা যোগদানে পেস্ট করুন, বেছে নিতে তাদের সভ্যতার প্রতিকৃতিতে আলতো চাপুন, তারপরে প্রস্তুত আলতো চাপুন৷
3. After starting, the Game ID is copied automatically. Send it to the Android player to add the game in Multiplayer. = 3. শুরু করার পরে, গেম আইডি স্বয়ংক্রিয়ভাবে অনুলিপি করা হয়। মাল্টিপ্লেয়ারে গেমটি যোগ করতে এটি অ্যান্ড্রয়েড প্লেয়ারে পাঠান।
3. The host is ready automatically. When everyone is ready, the host taps Start game. No Player ID or Game ID exchange is needed. = 3. হোস্ট স্বয়ংক্রিয়ভাবে প্রস্তুত. সবাই প্রস্তুত হলে, হোস্ট গেম শুরু করুন ট্যাপ করুন। কোন প্লেয়ার আইডি বা গেম আইডি বিনিময় প্রয়োজন নেই.
