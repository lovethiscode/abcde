Rivers exist on tile edges, not as terrain feature per se. = নদীগুলি টালির প্রান্তে বিদ্যমান, ভূখণ্ডের বৈশিষ্ট্য হিসাবে নয়।
Tiles on both sides gain its benefits. These benefits do not stack. = উভয় পক্ষের টাইলস এর সুবিধা লাভ করে। এই সুবিধা স্ট্যাক না.
The tile has access to fresh water, allowing farming where it would otherwise not be possible (similar to Oases and Lakes). = টালিতে তাজা জলের অ্যাক্সেস রয়েছে, যেখানে এটি অন্যথায় সম্ভব হবে না (মরুদ্যান এবং হ্রদের মতো) চাষের অনুমতি দেয়।
Movement across rivers takes all remaining movement points of a unit unless there is a bridge. = নদী পেরিয়ে চলাচল একটি ইউনিটের সমস্ত অবশিষ্ট মুভমেন্ট পয়েন্ট নেয় যদি না একটি সেতু থাকে।
When attacking across a river, the attacker gets a -20% strength malus. = নদী পেরিয়ে আক্রমণ করার সময়, আক্রমণকারী একটি -20% শক্তি পায়।
