O divine Montezuma, your people welcome you! May your magnificence inspire all living things! The mighty Aztecs were nomads until the 12th century, when they choose to settle in the mesa central, which would later be called Mexico. Wars were frequent with other tribes to control the rich land surrounding the sacred lakes of Texcoco, Xaltocan and Zampango. In some 200 years, double-sided alliances and martial prowess made of the Aztecs the dominant power in the Central American basin, forming a mighty empire stretching from sea to sea. Alas, the empire fell under the assault of foreign devils - the Spaniards and many curses they brought with them! Wars between tribes and weaponry of doom used by the invaders made the great Aztec civilization crumble in only a few decades. = হে ঐশ্বরিক মন্টেজুমা, তোমার লোকেরা তোমাকে স্বাগত জানায়! আপনার মহিমা সমস্ত জীবন্ত জিনিসকে অনুপ্রাণিত করুক! শক্তিশালী অ্যাজটেকরা 12 শতক পর্যন্ত যাযাবর ছিল, যখন তারা মেসা সেন্ট্রালে বসতি স্থাপন করতে বেছে নেয়, যা পরে মেক্সিকো নামে পরিচিত হবে। টেক্সকোকো, জালটোকান এবং জাম্পাঙ্গোর পবিত্র হ্রদকে ঘিরে থাকা সমৃদ্ধ ভূমি নিয়ন্ত্রণ করতে অন্যান্য উপজাতিদের সাথে প্রায়শই যুদ্ধ হত। প্রায় 200 বছরে, মধ্য আমেরিকার বেসিনে প্রভাবশালী শক্তি অ্যাজটেকদের দ্বারা গঠিত দ্বি-পার্শ্বযুক্ত জোট এবং সামরিক শক্তি, সমুদ্র থেকে সমুদ্র পর্যন্ত প্রসারিত একটি শক্তিশালী সাম্রাজ্য গঠন করে। হায়রে, সাম্রাজ্য বিদেশী শয়তানদের আক্রমণে পড়েছিল - স্প্যানিয়ার্ড এবং অনেক অভিশাপ তারা তাদের সাথে নিয়ে এসেছিল! উপজাতিদের মধ্যে যুদ্ধ এবং আক্রমণকারীদের দ্বারা ব্যবহৃত ধ্বংসাত্মক অস্ত্র মাত্র কয়েক দশকের মধ্যে মহান অ্যাজটেক সভ্যতাকে বিধ্বস্ত করে দিয়েছিল।
