We have noticed substantial military activity near our borders. How should we interpret this? = আমরা আমাদের সীমান্তের কাছে যথেষ্ট সামরিক তৎপরতা লক্ষ্য করেছি। আমরা কিভাবে এই ব্যাখ্যা করা উচিত?
