If my defeat is, without any doubt, the will of God, then I will accept it. = যদি আমার পরাজয় হয়, কোন সন্দেহ ছাড়াই, ঈশ্বরের ইচ্ছা, তবে আমি তা মেনে নেব।
God blesses those who deserve it. I am Isabel of Spain. = যারা এটি প্রাপ্য তাদের ঈশ্বর আশীর্বাদ করেন। আমি স্পেনের ইসাবেল।
I hope this deal will receive your blessing. = আমি আশা করি এই চুক্তি আপনার আশীর্বাদ পাবেন.
Seven Cities of Gold = সোনার সাতটি শহর
Holy Isabella, envoy of God, Great Queen of Castille and León, your people celebrate you! Spain is a beautiful and ancient country, a link between Europe and Africa, one shore on the Mediterranean and the other on the mighty Atlantic Ocean. The Spanish culture had taken the best of the Christian and Muslim worlds, and was ready to dominate the world for centuries. Powerful Spanish military fleets and brave explorers found and conquered much of the New World. Exploiting a whole new continent and its riches, Spain reached a state of power few could compete with for hundreds of years. = পবিত্র ইসাবেলা, ঈশ্বরের দূত, ক্যাস্টিল এবং লিওনের মহান রাণী, আপনার লোকেরা আপনাকে উদযাপন করে! স্পেন একটি সুন্দর এবং প্রাচীন দেশ, ইউরোপ এবং আফ্রিকার মধ্যে একটি লিঙ্ক, একটি তীরে ভূমধ্যসাগরে এবং অন্যটি শক্তিশালী আটলান্টিক মহাসাগরে। স্প্যানিশ সংস্কৃতি খ্রিস্টান এবং মুসলিম বিশ্বের সেরাটি গ্রহণ করেছিল এবং শতাব্দী ধরে বিশ্বকে আধিপত্য করতে প্রস্তুত ছিল। শক্তিশালী স্প্যানিশ সামরিক নৌবহর এবং সাহসী অভিযাত্রীরা নিউ ওয়ার্ল্ডের অনেক অংশ খুঁজে পেয়েছে এবং জয় করেছে। একটি সম্পূর্ণ নতুন মহাদেশ এবং এর সম্পদকে কাজে লাগিয়ে, স্পেন এমন একটি ক্ষমতার রাজ্যে পৌঁছেছে যার সাথে কয়েকশ বছর ধরে প্রতিদ্বন্দ্বিতা করতে পারে।
O splendid and virtuous Isabella! By the will of the heavens, will Spain reborn to achieve its holy destiny and become a new El Dorado? Will your new empire shine through the ages of history? = হে অপূর্ব এবং গুণী ইসাবেলা! স্বর্গের ইচ্ছায়, স্পেন কি তার পবিত্র গন্তব্য অর্জনের জন্য পুনর্জন্ম নেবে এবং একটি নতুন এল ডোরাডো হয়ে উঠবে? আপনার নতুন সাম্রাজ্য কি ইতিহাসের যুগে উজ্জ্বল হবে?
