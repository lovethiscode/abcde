Father Governs Children = বাবা শিশুদের শাসন করেন
O Great King Ramkhamhaeng, the Siamese people obey you with respect and fear! The beautiful and mysterious land of Siam is an ancient country in the heart of Southeast Asia, which was besieged by many foes, plagued by bloody war and great poverty, but eventually the smart and loyal Siamese people have endured and triumphed. Siam was a part of the Khmer Empire until the 13th century AD, before its brave people took arms and led a revolution to form the small Sukhothai kingdom. After many battles and diplomacy prowess, this tiny kingdom became a mighty empire, which would dominate South East Asia for more than a century. = হে মহান রাজা রামখামহেং, সিয়ামের জনগণ আপনাকে শ্রদ্ধা ও ভয়ের সাথে মান্য করে! সিয়ামের সুন্দর এবং রহস্যময় ভূমি দক্ষিণ-পূর্ব এশিয়ার কেন্দ্রস্থলে একটি প্রাচীন দেশ, যা অনেক শত্রু দ্বারা অবরুদ্ধ ছিল, রক্তক্ষয়ী যুদ্ধ এবং মহান দারিদ্র্য দ্বারা জর্জরিত ছিল, কিন্তু শেষ পর্যন্ত স্মার্ট এবং অনুগত সিয়ামের লোকেরা সহ্য করেছে এবং বিজয়ী হয়েছে। সিয়াম খ্রিস্টীয় 13 শতক পর্যন্ত খেমার সাম্রাজ্যের একটি অংশ ছিল, এর সাহসী লোকেরা অস্ত্র হাতে নিয়ে ছোট সুখোথাই রাজ্য গঠনের জন্য একটি বিপ্লবের নেতৃত্ব দেওয়ার আগে। অনেক যুদ্ধ এবং কূটনীতির পরাক্রমের পরে, এই ক্ষুদ্র রাজ্যটি একটি শক্তিশালী সাম্রাজ্যে পরিণত হয়েছিল, যা এক শতাব্দীরও বেশি সময় ধরে দক্ষিণ পূর্ব এশিয়াকে আধিপত্য বিস্তার করবে।
Wise and powerful King Ramkhamhaeng, your people want to revive these days of glory! Can you make a new dawn break on Siam? Will your new empire shine through the ages of history? = জ্ঞানী এবং শক্তিশালী রাজা রামখামহেং, আপনার লোকেরা এই গৌরবময় দিনগুলিকে পুনরুজ্জীবিত করতে চায়! আপনি কি সিয়ামের উপর একটি নতুন ভোর করতে পারেন? আপনার নতুন সাম্রাজ্য কি ইতিহাসের যুগে উজ্জ্বল হবে?
