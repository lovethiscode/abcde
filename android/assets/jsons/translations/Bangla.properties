Jip-hyun-jun (Hall of Worthies) will no longer tolerate your irksome behavior. We will liberate the citizens under your oppression even with force, and enlighten them! = জিপ-হিউন-জুন (হল অফ ওয়ার্থিজ) আপনার বিরক্তিকর আচরণকে আর সহ্য করবে না। আমরা বলপ্রয়োগ করেও আপনার নিপীড়নের অধীনে থাকা নাগরিকদের মুক্ত করব এবং তাদের আলোকিত করব!
Foolish, miserable wretch! You will be crushed by this country's magnificent scientific power! = মূর্খ, হতভাগা! এই দেশের অসামান্য বৈজ্ঞানিক শক্তির কাছে আপনি পিষ্ট হয়ে যাবেন!
Now the question is who will protect my people. A dark age has come. = এখন প্রশ্ন আমার জনগণকে কে রক্ষা করবে। অন্ধকার যুগ এসেছে।
Your words reveal more of your own prejudice than any fault in my own. = আপনার কথায় আমার নিজের কোনো দোষের চেয়ে আপনার নিজের কুসংস্কার বেশি প্রকাশ পায়।
Welcome to the palace of Choson, stranger. I am the learned King Sejong, who looks after his great people. = চোসনের প্রাসাদে স্বাগতম, অপরিচিত। আমি একজন পণ্ডিত রাজা সেজং, যিনি তার মহান লোকদের দেখাশোনা করেন।
We have many things to discuss and have much to benefit from each other. = আমাদের আলোচনা করার অনেক কিছু আছে এবং একে অপরের থেকে উপকৃত হওয়ার অনেক কিছু আছে।
Oh, it's you = ওহ, এটা আপনি
Scholars of the Jade Hall = জেড হলের পণ্ডিতরা
Greetings to you, King Sejong the Great, heir of the Choson Dynasty! Prosperity and benevolence towards the common man are the principles of your reign, and made of you the most beloved Korean king. You always aimed to provide a fair and equal society for all your people, and also to favor knowledge and technological discoveries. Your wisdom and intelligence imbued all the Korean society, and the scholars of the Jade Hall developed Korea's first written language, Hangul, sharing further literature and science to the people after centuries of darkness. = আপনাকে অভিবাদন, রাজা সেজং দ্য গ্রেট, চোসন রাজবংশের উত্তরাধিকারী! সাধারণ মানুষের প্রতি সমৃদ্ধি এবং দানশীলতা আপনার রাজত্বের নীতি, এবং আপনাকে সবচেয়ে প্রিয় কোরিয়ান রাজা বানিয়েছে। আপনি সর্বদা আপনার সমস্ত লোকের জন্য একটি ন্যায্য এবং সমান সমাজ প্রদানের লক্ষ্য রেখেছিলেন এবং জ্ঞান এবং প্রযুক্তিগত আবিষ্কারের পক্ষেও ছিলেন। আপনার প্রজ্ঞা এবং বুদ্ধিমত্তা সমস্ত কোরিয়ান সমাজকে আচ্ছন্ন করেছে, এবং জেড হলের পণ্ডিতরা কোরিয়ার প্রথম লিখিত ভাষা, হাঙ্গুল তৈরি করেছেন, শতাব্দীর অন্ধকারের পর মানুষের কাছে আরও সাহিত্য এবং বিজ্ঞান ভাগ করে নিয়েছেন।
Wise Sejong, will you gift your people with the radiance of harmony and knowledge to dispel the darkness once again? Will your new empire shine through the ages of history? = বুদ্ধিমান সেজং, আপনি কি আপনার জনগণকে আবার অন্ধকার দূর করতে সম্প্রীতি ও জ্ঞানের দীপ্তি উপহার দেবেন? আপনার নতুন সাম্রাজ্য কি ইতিহাসের যুগে উজ্জ্বল হবে?
