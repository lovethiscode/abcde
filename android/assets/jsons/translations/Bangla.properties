As much as I despise war, I consider it a, hahaha, contribution to the common cause to erase your existence. = যুদ্ধকে যতই ঘৃণা করি, তোমার অস্তিত্ব মুছে দেওয়াকে, হা হা হা, সবার স্বার্থে এক অবদান মনে করি।
