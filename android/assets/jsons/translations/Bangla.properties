The ancient fire flashing across the sky is what proclaimed that this day would come, though I had foolishly hoped for a different outcome. = আকাশ জুড়ে প্রাচীন আগুনের ঝলকানিই ঘোষণা করেছিল যে এই দিনটি আসবে, যদিও আমি বোকামি করে একটি ভিন্ন ফলাফলের আশা করেছিলাম।
It is obvious now that I misjudged you and your true intentions. = এটা এখন স্পষ্ট যে আমি আপনাকে এবং আপনার সত্যিকারের উদ্দেশ্যগুলিকে ভুল ধারণা করেছি।
The hard-shelled crab yields, and the lion lies down to sleep. Kanaloa comes for me now. = শক্ত খোলসযুক্ত কাঁকড়া ফল দেয়, এবং সিংহ ঘুমাতে শুয়ে থাকে। কানালোয়া এখন আমার জন্য আসে।
The ocean's tide may rise and fall, but my resolve stands steady. = সমুদ্রের জোয়ার উঠতে পারে এবং পড়ে যেতে পারে, কিন্তু আমার সংকল্প স্থির থাকে।
Aloha! Greetings and blessings upon you, friend. I am Kamehameha, Great King of this strand of islands. = আলোহা! তোমাকে শুভেচ্ছা ও আশীর্বাদ, বন্ধু। আমি কামেহামেহা, এই দ্বীপের স্ট্র্যান্ডের মহান রাজা।
Come, let our people feast together! = আসুন, আমাদের লোকেরা একসাথে ভোজন করি!
Welcome, friend! = স্বাগতম, বন্ধু!
Wayfinding = ওয়েফাইন্ডিং
Aloha to Kamehameha the Great, who the heavens allowed to unite your people! O great King, under your reign, the Big Island of Hawai'i became one in 1791 AD, and many other islands joined your vision of union in 1810. As the first King of Hawai'i, law and taxation systems were stabilized, and you promoted the Kanawai Mamalahoe, an edict to protect civilian people in times of war. Unification and sovereignty of all the islands continued thanks to your fair laws and deeds, even after you joined your ancestors in paradise in 1819. = কামেহামেহা মহান, যিনি স্বর্গ আপনার লোকেদের একত্রিত করার অনুমতি দিয়েছেন! হে মহান রাজা, আপনার রাজত্বের অধীনে, হাওয়াইয়ের বিগ আইল্যান্ড 1791 খ্রিস্টাব্দে এক হয়ে ওঠে, এবং অন্যান্য অনেক দ্বীপ 1810 সালে আপনার মিলনের দৃষ্টিভঙ্গিতে যোগ দেয়। হাওয়াইয়ের প্রথম রাজা হিসাবে, আইন ও কর ব্যবস্থা স্থিতিশীল হয়েছিল এবং আপনি কানাওয়াই মামালাহোকে উন্নীত করেছিলেন, যুদ্ধের সময় বেসামরিক মানুষকে রক্ষা করার জন্য একটি আদেশ। আপনার ন্যায্য আইন এবং কাজের জন্য সমস্ত দ্বীপের একীকরণ এবং সার্বভৌমত্ব অব্যাহত রয়েছে, এমনকি আপনি 1819 সালে স্বর্গে আপনার পূর্বপুরুষদের সাথে যোগদানের পরেও।
Wise and benevolent King, will you unite your people once again by wearing the bright mantle of the Lion of the Pacific? Will your new empire shine through the ages of history? = জ্ঞানী ও পরোপকারী রাজা, আপনি কি আবার প্রশান্ত মহাসাগরের সিংহের উজ্জ্বল আবরণ পরিধান করে আপনার জনগণকে একত্রিত করবেন? আপনার নতুন সাম্রাজ্য কি ইতিহাসের যুগে উজ্জ্বল হবে?
