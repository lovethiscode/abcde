# Capturing a city

What would you like to do with the city of [cityName]? = আপনি [cityName] শহরের সাথে কি করতে চান?
Annex = অ্যানেক্স
Annexed cities become part of your regular empire. = সংযুক্ত শহরগুলি আপনার নিয়মিত সাম্রাজ্যের অংশ হয়ে ওঠে।
Their citizens generate 2x the unhappiness, unless you build a courthouse. = তাদের নাগরিকরা 2 গুণ অসুখ তৈরি করে, যদি না আপনি একটি আদালত নির্মাণ করেন।
Your civilization may not annex this city. = আপনার সভ্যতা এই শহরকে সংযুক্ত করতে পারে না।
Puppet = পুতুল
Puppeted cities do not increase your tech or policy cost. = পুতুল শহরগুলি আপনার প্রযুক্তি বা নীতি খরচ বাড়ায় না।
You have no control over the the production of puppeted cities. = পুতুল শহরগুলির উৎপাদনের উপর আপনার কোন নিয়ন্ত্রণ নেই।
Puppeted cities also generate 25% less Science and Culture. = পুতুল শহরগুলিও 25% কম বিজ্ঞান ও সংস্কৃতি তৈরি করে।
A puppeted city can be annexed at any time. = একটি পুতুল শহর যে কোনো সময় সংযুক্ত করা যেতে পারে.
Liberate (city returns to [originalOwner]) = মুক্ত করুন (শহর [originalOwner] এ ফিরে আসে)
Liberating a city returns it to its original owner, giving you a massive relationship boost with them! = একটি শহরকে মুক্ত করা সেটিকে তার আসল মালিকের কাছে ফিরিয়ে দেয়, আপনাকে তাদের সাথে একটি বিশাল সম্পর্ক বৃদ্ধি করে!
Raze = রেজ
Razing the city annexes it, and starts burning the city to the ground. = শহরটি ধ্বংস করে এটিকে সংযুক্ত করে এবং শহরটিকে মাটিতে পুড়িয়ে দেওয়া শুরু করে।
Razing the city puppets it, and starts burning the city to the ground. = শহরটিকে পুতুলে ধ্বংস করে, এবং শহরটিকে মাটিতে পুড়িয়ে দিতে শুরু করে।
The population will gradually dwindle until the city is destroyed. = শহরটি ধ্বংস না হওয়া পর্যন্ত জনসংখ্যা ধীরে ধীরে হ্রাস পাবে।
Original capitals and holy cities cannot be razed. = মূল রাজধানী এবং পবিত্র শহরগুলিকে ধ্বংস করা যাবে না।
Destroy = ধ্বংস করুন
Destroying the city instantly razes the city to the ground. = শহর ধ্বংস অবিলম্বে মাটিতে শহর ধ্বংস.
Keep it = রাখো
Remove your troops in our border immediately! = অবিলম্বে আমাদের সীমান্ত থেকে আপনার সৈন্যদের সরান!
Sorry. = দুঃখিত।
Never! = কখনই না!
Those lands were not yours to take. This has not gone unnoticed. = সেসব জমি তোমার নেওয়ার ছিল না। এই অলক্ষিত যায় নি.

