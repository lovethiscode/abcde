Alexander = আলেকজান্ডার
You are in my way, you must be destroyed. = তুমি আমার পথে আছ, তোমাকে ধ্বংস করতে হবে।
As a matter of fact I too grow weary of peace. = আসলে আমিও শান্তিতে ক্লান্ত হয়ে পড়ি।
You have somehow become my undoing! What kind of beast are you? = তুমি একরকম হয়ে গেছ আমার অনাবৃত! আপনি কি ধরনের জানোয়ার?
The Gods frown upon your foolishness. = তোমার মূর্খতা দেখে দেবতারা ভ্রুকুটি করে।
Hello stranger! I am Alexandros, son of kings and grandson of the gods! = হ্যালো অপরিচিত! আমি আলেকজান্দ্রোস, রাজাদের পুত্র এবং দেবতাদের নাতি!
My friend, does this seem reasonable to you? = আমার বন্ধু, এটা কি আপনার কাছে যুক্তিসঙ্গত বলে মনে হচ্ছে?
Greetings! = শুভেচ্ছা!
What? = কি?
Hellenic League = হেলেনিক লীগ
Great King Alexander, leader of the mighty Greek nation, you are truly blessed by the gods. In 480 BC, quarrelsome city-states such as Athens, Sparta, Thebes, found a way to join their forces, allowing Greece to defeat the mighty Persia in the 5th century BC, both on land and sea. Following their example, you lead a Greek coalition and finally struck down the Persian Empire in 331 BC. You conquered almost all the known world, and from Europe to Africa to India, you built an empire unmatched by any before it. = মহান রাজা আলেকজান্ডার, পরাক্রমশালী গ্রীক জাতির নেতা, আপনি সত্যিই দেবতাদের দ্বারা আশীর্বাদপ্রাপ্ত। 480 খ্রিস্টপূর্বাব্দে, এথেন্স, স্পার্টা, থিবসের মতো বিবাদমান শহর-রাজ্যগুলি তাদের বাহিনীতে যোগ দেওয়ার একটি উপায় খুঁজে পেয়েছিল, যার ফলে গ্রীস 5 ম শতাব্দীতে স্থল ও সমুদ্র উভয় ক্ষেত্রেই পরাক্রমশালী পারস্যকে পরাজিত করতে সক্ষম হয়েছিল। তাদের উদাহরণ অনুসরণ করে, আপনি একটি গ্রীক জোটের নেতৃত্ব দেন এবং অবশেষে 331 খ্রিস্টপূর্বাব্দে পারস্য সাম্রাজ্যকে ধ্বংস করেন। আপনি প্রায় সমস্ত পরিচিত বিশ্ব জয় করেছেন এবং ইউরোপ থেকে আফ্রিকা থেকে ভারত পর্যন্ত আপনি এমন এক সাম্রাজ্য গড়ে তুলেছেন যার কোন তুলনা নেই।
Megalexandros, son of Zeus, will you ride Bucephalas again, to gift the world with the brightness of the Greek culture? Will your new empire shine through the ages of history? = জিউসের ছেলে মেগালেক্সান্দ্রোস, আপনি কি আবার বুসেফালাসে চড়বেন, গ্রীক সংস্কৃতির উজ্জ্বলতা দিয়ে বিশ্বকে উপহার দিতে? আপনার নতুন সাম্রাজ্য কি ইতিহাসের যুগে উজ্জ্বল হবে?
