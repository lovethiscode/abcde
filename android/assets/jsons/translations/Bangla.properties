May the gods bless you, great Nebuchadnezzar, ruler of ancient Babylon! Built 5000 years ago, Babylon emerged as an empire in 1800 BC, thanks to godlike Hammurabi, The Giver of Law. Falling under the Kassites assaults then the Assyrian domination, Babylon was reborn from its ashes, gaining back its independance, and became the beacon for Arts and Learning in the ancient world. O Nebuchadnezzar, after your death, Babylon quickly fell, conquered by the mighty Persians, and then by the Greeks, until the great city disappeared forever in 141 BC. = দেবতারা আপনাকে আশীর্বাদ করুক, মহান নেবুচাদনেজার, প্রাচীন ব্যাবিলনের শাসক! 5000 বছর আগে নির্মিত, ব্যাবিলন 1800 খ্রিস্টপূর্বাব্দে একটি সাম্রাজ্য হিসাবে আবির্ভূত হয়েছিল, ঈশ্বরের মতো হাম্মুরাবি, আইন প্রদানকারীকে ধন্যবাদ। কাসাইটদের আক্রমণের পরে অ্যাসিরিয়ান আধিপত্যের অধীনে পড়ে, ব্যাবিলনের ছাই থেকে পুনর্জন্ম হয়েছিল, তার স্বাধীনতা ফিরে পেয়েছিল এবং প্রাচীন বিশ্বে শিল্প ও শিক্ষার আলোকবর্তিকা হয়ে ওঠে। হে নেবুচাদনেজার, আপনার মৃত্যুর পরে, ব্যাবিলনের দ্রুত পতন ঘটে, পরাক্রমশালী পারস্যদের দ্বারা এবং তারপর গ্রীকদের দ্বারা জয় করা হয়, যতক্ষণ না 141 খ্রিস্টপূর্বাব্দে মহান শহরটি চিরতরে অদৃশ্য হয়ে যায়।
Great Nebuchadnezzar, Babylon's glory still lives through you and your people. Will you create a spark to enlighten the world again? Will your new empire shine through the ages of history? = মহান নেবুচাদনেজার, ব্যাবিলনের গৌরব এখনও আপনার এবং আপনার লোকদের মধ্য দিয়ে বেঁচে আছে। আপনি কি আবার বিশ্বকে আলোকিত করার জন্য একটি স্ফুলিঙ্গ তৈরি করবেন? আপনার নতুন সাম্রাজ্য কি ইতিহাসের যুগে উজ্জ্বল হবে?
