You shall stain this land no longer with your vileness! To arms, my countrymen. We ride to war! = তোমার নীচতায় এ দেশ আর কলঙ্কিত হবে না! দেশবাসী, অস্ত্র ধরো। আমরা যুদ্ধে যাচ্ছি!
