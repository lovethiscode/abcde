Magnificent Empress Theodora, beloved of Byzantium and of Rome, your people salute you! With your beauty and intelligence, you rose up from actress and courtesan to the rank of the most powerful woman in the Roman Empire, as wife of Justinian I. In the late 520's AD, you helped your husband engage in spiritual and legal reforms, promugalting numerous laws to improve women's status and treatment in the empire. You also made of Constantinople the jewel of the Eastern Roman Empire with the restoration and construction of many aqueducts, bridges, and churches, its beauty culminating with the creation of the Hagia Sophia, one of the most splendid pieces of architecture in the world. = মহিমাময় সম্রাজ্ঞী Theodora, বাইজেন্টিয়াম ও রোমের প্রিয়পাত্রী, জনগণ আপনাকে অভিবাদন জানায়! সৌন্দর্য ও বুদ্ধিমত্তায় আপনি অভিনেত্রী ও গণিকা থেকে Justinian I-এর স্ত্রী হয়ে রোমান সাম্রাজ্যের সবচেয়ে ক্ষমতাশালী নারী হন। 520-এর দশকের শেষদিকে স্বামীকে আধ্যাত্মিক ও আইনি সংস্কারে সাহায্য করেন এবং সাম্রাজ্যে নারীদের অবস্থান ও আচরণ উন্নত করতে বহু আইন জারি করেন। বহু জলপ্রণালি, সেতু ও গির্জা সংস্কার ও নির্মাণ করে কনস্টান্টিনোপলকে পূর্ব রোমান সাম্রাজ্যের রত্নে পরিণত করেন। বিশ্বের অন্যতম জাঁকজমকপূর্ণ স্থাপনা Hagia Sophia নির্মাণে তার সৌন্দর্য চূড়ান্ত রূপ পায়।
Beautiful Empress,the Byzantine Empire's magnificence is intact in all memories, and ready to reborn as the new jewel of humankind. Will your new empire shine through the ages of history? = সুন্দরী সম্রাজ্ঞী, বাইজেন্টাইন সাম্রাজ্যের মহিমা স্মৃতিতে অমলিন, মানবজাতির নতুন রত্ন হয়ে পুনর্জন্মের জন্য প্রস্তুত। আপনার নতুন সাম্রাজ্য কি ইতিহাসের যুগে যুগে দীপ্তি ছড়াবে?
