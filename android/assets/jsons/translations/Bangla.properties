Blessings of the Great God be upon you, O great caliph Harun al-Rashid, leader of the mighty Arabian people! The Muslim Empire, the Caliphate, born from chaos after the death of the prophet Muhammad in 632 AD, intended to apply the rule of God to all Earth. And by the will of God, the caliphate reached its full power, ruling Spain, North Africa, the Middle East, Anatolia, the Balkans and Persia, to even surpass the Great Roman Empire. The arts and sciences were a holy gift of Arabia during the Middle Ages, as the infidel lands of Europe delved deep into ignorance and chaos. Lasting for six hundred years, the Caliphate finally fell before the Mongols, the plague of the civilized world. = মহান আল্লাহর আশীর্বাদ আপনার উপর বর্ষিত হোক, হে মহান খলিফা হারুন আল-রশিদ, পরাক্রমশালী আরব জনগণের নেতা! মুসলিম সাম্রাজ্য, খিলাফত, 632 খ্রিস্টাব্দে নবী মুহাম্মদের মৃত্যুর পরে বিশৃঙ্খলা থেকে জন্মগ্রহণ করে, সমস্ত পৃথিবীতে ঈশ্বরের শাসন প্রয়োগ করার উদ্দেশ্যে। এবং ঈশ্বরের ইচ্ছায়, খেলাফত তার পূর্ণ ক্ষমতায় পৌঁছেছিল, স্পেন, উত্তর আফ্রিকা, মধ্যপ্রাচ্য, আনাতোলিয়া, বলকান এবং পারস্য শাসন করে, এমনকি গ্রেট রোমান সাম্রাজ্যকেও ছাড়িয়ে যায়। কলা ও বিজ্ঞান মধ্যযুগে আরবের একটি পবিত্র উপহার ছিল, কারণ ইউরোপের কাফের দেশগুলি অজ্ঞতা ও বিশৃঙ্খলার গভীরে ডুবে গিয়েছিল। ছয়শত বছর ধরে চলা, খিলাফত অবশেষে মঙ্গোলদের সামনে পতন ঘটে, সভ্য বিশ্বের প্লেগ।
