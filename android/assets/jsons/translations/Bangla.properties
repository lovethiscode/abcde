You are an abomination to heaven and earth, the chief of ignorant savages! You must be destroyed! = তুমি স্বর্গ ও পৃথিবীর কাছে ঘৃণ্য, অজ্ঞ বর্বরদের প্রধান! তোমাকে ধ্বংস করতে হবে!
Fool! You have doomed your people to fire and destruction! = বোকা! তুমি তোমার লোকদের আগুন ও ধ্বংসের জন্য ধ্বংস করেছ!
We have been consumed by the fires of hatred and rage. Enjoy your victory in this world - you shall pay a heavy price in the next! = আমরা বিদ্বেষ আর ক্রোধের আগুনে পুড়ে খেয়েছি। এই পৃথিবীতে আপনার বিজয় উপভোগ করুন - আপনাকে পরবর্তীতে একটি ভারী মূল্য দিতে হবে!
This insult shall cost you. = এই অপমান তোমাকে দিতে হবে।
I am Askia of the Songhai. We are a fair people - but those who cross us will find only destruction. You would do well to avoid repeating the mistakes others have made in the past. = আমি সংঘাইয়ের আসকিয়া। আমরা ন্যায্য মানুষ - কিন্তু যারা আমাদের অতিক্রম করবে তারা কেবল ধ্বংস খুঁজে পাবে। অতীতে অন্যরা যে ভুলগুলো করেছে তার পুনরাবৃত্তি এড়াতে আপনার ভালো হবে।
