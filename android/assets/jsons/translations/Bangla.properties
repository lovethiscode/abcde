不限难度。战斗取得一座其他主要文明建立的城市并持续保有；抵抗结束时记录人口基准。此后在该城已连接首都的结算中，以正常粮食增长使人口超过该基准。无抵抗时以收城结算后人口为基准；直接赠送人口不能单独完成。 = যেকোনো জটিলতায় অন্য প্রধান সভ্যতার প্রতিষ্ঠিত শহর যুদ্ধে দখল করে ধারাবাহিকভাবে রাখুন। প্রতিরোধ শেষ হলে, অথবা প্রতিরোধ না থাকলে দখলের হিসাব নিষ্পত্তির পরে, জনসংখ্যা নথিভুক্ত করুন। পরে রাজধানীর সঙ্গে যুক্ত থাকা অবস্থায় কোনো হিসাব নিষ্পত্তিতে স্বাভাবিক খাদ্যভিত্তিক বৃদ্ধিতে জনসংখ্যা ওই প্রাথমিক মানের ওপরে যেতে হবে। সরাসরি দেওয়া জনসংখ্যা একাই শর্ত পূরণ করতে পারে না।
保有战斗取得的城市，抵抗结束后连接首都，并让人口以粮食增长超过基准。 = দখল করা শহর রাখুন, প্রতিরোধ শেষ করুন, রাজধানীর সঙ্গে যুক্ত করুন এবং খাদ্য দিয়ে প্রাথমিক জনসংখ্যার ওপরে বাড়ান।
让战后的城市重新生长 = যুদ্ধের পরে শহর আবার বেড়ে উঠুক
从拿下城市转向让城市重新发展，安排交通、粮食和治理。无需同时维持全帝国财政、幸福等多重指标。 = সামরিক সাফল্যকে কার্যকর, বেড়ে ওঠা শহরে বদলান।
罗马传承 = রোমের উত্তরাধিকার
不限难度，使用罗马。在两座不同自建分城各通过正常生产完成一座普通建筑；各自至少一次实际生产结算因首都已有相应建筑而获得罗马加成，完成时加成条件仍有效。建筑可不同；直接购买完成、世界及国家奇观不计。分城可以先开工，不必等首都先完成才排队。 = যেকোনো জটিলতায় রোম হিসেবে নিজের প্রতিষ্ঠিত দুটি ভিন্ন অরাজধানী শহরের প্রতিটিতে স্বাভাবিক উৎপাদনে সাধারণ ভবন সম্পূর্ণ করুন। রাজধানীতে একই ভবন থাকার কারণে প্রতিটিকে প্রকৃত উৎপাদন হিসাবে রোমের বোনাস পেতে হবে; নির্মাণ শেষেও সেই শর্ত বজায় থাকতে হবে। ভবন দুটি আলাদা হতে পারে। কেনা, বিশ্ব বিস্ময় ও জাতীয় বিস্ময় গণ্য হয় না। রাজধানীর ভবন শেষ হওয়ার আগে নির্মাণ শুরু করা চলে।
让两座自建分城各通过实际享受罗马加成的普通生产完成一座建筑。 = রোমের উৎপাদন বোনাস ব্যবহার করে নিজের প্রতিষ্ঠিত দুটি অরাজধানী শহরের প্রতিটিতে স্বাভাবিক উৎপাদনে ভবন সম্পূর্ণ করুন।
让首都的积累惠及分城 = রাজধানী নতুন শহরকে সাহায্য করুক
用首都积累带动分城建设，按各城需求选择建筑。体现罗马能力，不要求五城都造兵营或等十人口。 = ভিন্ন চাহিদার শহরগুলিকে সাহায্য করতে রাজধানী ব্যবহার করুন।
连弩初试 = বারবার ছোড়া ক্রসবো
不限难度，使用中国。同一支诸葛弩在一个己方回合内，对主要文明军事单位或城市完成两次主动攻击，两次均造成正数伤害，并持续归己方、存活至下一己方回合开始。可以攻击同一目标，不要求击杀或实战晋升；两次攻击均须发生在诸葛弩形态。若本局先取得正式胜利，则在胜利结算时核对剩余观察条件。 = যেকোনো জটিলতায় চীন হিসেবে একটি চু-কো-নু দিয়ে এক চালে প্রধান সভ্যতার সামরিক ইউনিট বা শহরের বিরুদ্ধে দুটি সক্রিয় আক্রমণ করে প্রতিবার শূন্যের বেশি ক্ষতি করুন। আপনার পরের চাল শুরু হওয়া পর্যন্ত সেটিকে জীবিত ও ধারাবাহিকভাবে নিজের রাখতে হবে। একই লক্ষ্যকে দুবার আক্রমণ করা যায়; হত্যা বা প্রমোশন অর্জন প্রয়োজন নেই। দুটি আক্রমণই চু-কো-নু রূপে করতে হবে। আগেই আনুষ্ঠানিক জয়ে খেলা শেষ হলে জয়ের হিসাব নিষ্পত্তিতে বাকি পর্যবেক্ষণ শর্ত যাচাই হয়।
同一支诸葛弩本回合主动攻击两次并造成伤害，存活至下一己方回合。 = এক চালে একটি চু-কো-নু দিয়ে ক্ষতিকর দুটি আক্রমণ করে পরের চাল পর্যন্ত রাখুন।
让连弩接连出击，带它平安归来 = দুবার আঘাত করে ইউনিটকে ঘরে আনুন
决定第二次攻击打谁，以及如何保护射击后的部队。直接体验连射能力，不用先养经验、喂两个残血目标。 = আক্রমণকারীকে রক্ষার পরিকল্পনা করেই দ্বিতীয় লক্ষ্য বাছুন।
山间粮仓 = পাহাড়ের শস্যভাণ্ডার
不限难度，使用印加。在自建城市可工作范围内完成一处邻接至少两座山脉的梯田，并让市民在至少一次实际粮食结算中工作该地块；结算时梯田未被掠夺、仍属己方。不限城市人口，不要求三处梯田。 = যেকোনো জটিলতায় ইনকা হিসেবে নিজের প্রতিষ্ঠিত শহরের কাজ করা যায় এমন এলাকায় অন্তত দুটি পর্বতের পাশে সোপান খামার সম্পূর্ণ করুন। নিজের মালিকানায় ও লুণ্ঠিত না থাকা অবস্থায় অন্তত একবার প্রকৃত খাদ্য হিসাবের সময় নাগরিককে সেখানে কাজ করতে হবে। নির্দিষ্ট জনসংখ্যা বা অতিরিক্ত খামার প্রয়োজন নেই।
建成一处邻接两座山脉的梯田，并让市民实际工作它一次。 = অন্তত দুটি পর্বতের পাশে সোপান খামার বানিয়ে প্রকৃত খাদ্য হিসাবের সময় সেখানে কাজ করান।
在群山之间收获粮食 = পর্বতের মাঝে খাদ্য ফলান
识别合适的山间丘陵，把地形限制变为粮食优势。只在已经发现合适位置时推荐。 = কোন ভূপ্রকৃতি পর্বতের বাধাকে খাদ্যে বদলায় তা চিনুন।
来去如风 = বাতাসের মতো সওয়ার
不限难度，使用蒙古。同一支怯薛骑兵在一个己方回合中，先主动攻击主要文明军事单位或城市并造成正数伤害，再主动移动到另一格，并持续归己方、存活至下一己方回合开始。攻击和移动均发生在怯薛形态；强制传送不计。若本局先取得正式胜利，则在胜利结算时核对剩余观察条件。 = যেকোনো জটিলতায় মঙ্গোলিয়া হিসেবে একটি কেশিক দিয়ে প্রধান সভ্যতার সামরিক ইউনিট বা শহরে সক্রিয় আক্রমণ করে শূন্যের বেশি ক্ষতি করুন, তারপর একই চালে স্বেচ্ছায় অন্য টালিতে সরান। আপনার পরের চাল শুরু হওয়া পর্যন্ত ইউনিটটি জীবিত ও ধারাবাহিকভাবে নিজের থাকতে হবে। দুটি কাজই কেশিক রূপে করতে হবে; জোর করে স্থানান্তর গণ্য হয় না। আগেই আনুষ্ঠানিক জয়ে খেলা শেষ হলে জয়ের হিসাব নিষ্পত্তিতে বাকি পর্যবেক্ষণ শর্ত যাচাই হয়।
同一支怯薛骑兵攻击造成伤害后主动换格，存活至下一己方回合。 = একটি কেশিক দিয়ে আক্রমণ করে অন্য টালিতে সরান এবং পরের চাল পর্যন্ত রাখুন।
射击之后，寻找下一处阵地 = গোলা ছোড়ার পরে অন্য অবস্থান নিন
预留移动力，在射击后选择撤离、侧移、让路或继续推进；完成一次即可，不把后撤规定为唯一正确解法。 = পশ্চাদপসরণ, অবস্থান বদল, পথ খোলা বা এগোনোর জন্য চলাচল বাঁচিয়ে রাখুন।
殊途同归 = ভিন্ন পথ
不限难度。三个不同合格自由对局分别取得三种不同的非时间胜利，从科技、文化、征服、外交中任选三种。同一局游戏 只贡献首个正式终局结果；重载、复制存档不增加局数或胜利种类。 = যেকোনো জটিলতায় তিনটি আলাদা উপযুক্ত মুক্ত খেলায় বৈজ্ঞানিক, সাংস্কৃতিক, বিশ্বজয় ও কূটনৈতিক জয়ের মধ্যে তিনটি ভিন্ন সময়ভিত্তিক নয় এমন জয় পান। প্রতি খেলার ID-এর শুধু প্রথম আনুষ্ঠানিক চূড়ান্ত ফল গণ্য হয়। সংরক্ষণ আবার লোড বা কপি করলে খেলার সংখ্যা বা জয়ের ধরন বাড়ে না।
在三个不同的合格对局中，取得三种不同的非时间胜利。 = তিনটি আলাদা উপযুক্ত খেলায় তিন ধরনের সময়ভিত্তিক নয় এমন জয় পান।
用三种方式走向胜利 = জয়ের তিন পথ খুঁজুন
走出熟悉的一种打法，体验三种不同战略。次数对应策略种类，不是把同一局再刷两遍。 = চেনা পথ বারবার না নিয়ে ভিন্ন কৌশল অন্বেষণ করুন।
五波之后 = পাঁচ ঢেউয়ের পরে
无尽，轻松或野蛮均可。同一次挑战首次在期限内清除第一关全部五波，进入关卡完成结算，且核心仍归己方。 = অন্তহীন মোডে স্বচ্ছন্দ বা বন্য গতিতে এক প্রচেষ্টায় প্রথম পর্যায়ের পাঁচটি ঢেউ সময়সীমার মধ্যে পরাস্ত করুন এবং কেন্দ্র নিজের রেখে পর্যায় সম্পূর্ণ হওয়ার হিসাব নিষ্পত্তিতে পৌঁছান।
在期限内清除第一关的五波敌军，并保有核心城市。 = কেন্দ্র ধরে রেখে সময়সীমার আগে প্রথম পর্যায়ের পাঁচটি ঢেউ পরাস্ত করুন।
守过第一关的五波来敌 = প্রথম পাঁচ ঢেউ টিকে থাকুন
将布防、资源与波次处理贯穿一整个关卡，获得清楚的首次通关反馈。 = একটি পূর্ণ পর্যায় জুড়ে মোতায়েন, সম্পদ ও ঢেউ সামলান।
三城同守 = তিন শহর অটল
无尽，轻松或野蛮均可。已解锁三城容量；某关第一波出现前已拥有三座城市，从第一波出现到该关按时完成，这三城持续归己方。不限必须哪一关完成，不限制部队损失和关间奖励选择。 = অন্তহীন মোডের যেকোনো গতিতে কোনো পর্যায়ের প্রথম ঢেউ আসার আগে তিন শহরের ধারণক্ষমতা খুলুন ও তিন শহরের মালিক হন। পর্যায় সময়মতো শেষ হওয়া পর্যন্ত তিনটিই ধারাবাহিকভাবে রাখুন। যেকোনো পর্যায় গণ্য হতে পারে; ইউনিট হারানো ও পর্যায়ের মাঝের পুরস্কার বাছায় বাধা নেই।
一关首波来临前已有三城，持续保有这三城直到按时过关。 = পর্যায় শুরুর আগে তিন শহরের মালিক হয়ে সময়মতো পর্যায় শেষ করা পর্যন্ত ধারাবাহিকভাবে রাখুন।
让三座城市一同守到关末 = শেষ পর্যন্ত তিন শহর অটল রাখুন
主动扩张后承担更复杂的防线，安排机动支援与城市分工；不是要求所有玩家都建满三城。 = সম্প্রসারণের ফলে আসা প্রতিরক্ষার সিদ্ধান্ত নিন এবং শহরগুলিতে সহায়তা ভাগ করুন।
