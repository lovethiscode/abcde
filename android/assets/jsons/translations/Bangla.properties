Build your economy, research fourteen technologies and protect the core city. Clear five waves to choose Gold, repairs or one reinforcement. = অর্থনীতি গড়ুন, চৌদ্দটি প্রযুক্তি গবেষণা করুন এবং মূল শহর রক্ষা করুন। প্রতি পাঁচটি ঢেউ পরাস্ত করার পর সোনা, মেরামত বা একটি সহায়ক ইউনিট বেছে নিন।
