#################### Lines from Global Tutorials ####################

Welcome to Unciv!\nBecause this is a complex game, there are basic tasks to help familiarize you with the game.\nThese are completely optional, and you're welcome to explore the game on your own! = Unciv-এ স্বাগতম!\nএটি জটিল খেলা বলে পরিচিত হতে সাহায্য করার জন্য কিছু প্রাথমিক কাজ রয়েছে।\nএগুলো সম্পূর্ণ ঐচ্ছিক; আপনি নিজেও খেলাটি ঘুরে দেখতে পারেন!

Welcome to Unciv! = Unciv-এ স্বাগতম!
Because this is a complex game, there are some tutorials to help familiarize you with it. These can be disabled in the Options -> Display menu, but please hang on if you're new here! = এই জটিল খেলাটির সঙ্গে পরিচিত হতে কিছু শিক্ষামূলক নির্দেশনা রয়েছে। সেটিংস -> প্রদর্শন মেনুতে এগুলো বন্ধ করা যায়, তবে নতুন হলে একটু ধৈর্য ধরুন!
Your first mission is to found your capital city. This is actually an important task because your capital city will probably be your most prosperous. Many game bonuses apply only to your capital city, and it will be the center of your empire. = আপনার প্রথম কাজ রাজধানী শহর স্থাপন করা। এটি গুরুত্বপূর্ণ, কারণ রাজধানী সম্ভবত আপনার সবচেয়ে সমৃদ্ধ শহর হবে। খেলার অনেক বোনাস শুধু রাজধানীতে প্রযোজ্য, আর সেটিই হবে সাম্রাজ্যের কেন্দ্র।
How do you know a city location is appropriate? Luckily, the game has already chosen a good location for you. You can settle in this place, or maybe move a turn to found on a Hill (for Production and defence) or next to a Mountain (to gain access to the Observatory building later on). = কীভাবে বুঝবেন শহরের স্থান উপযুক্ত? সৌভাগ্যবশত খেলা ইতিমধ্যে আপনার জন্য ভালো স্থান বেছেছে। এখানেই বসতি স্থাপন করতে পারেন, অথবা এক চাল এগিয়ে পাহাড়ে (উৎপাদন ও প্রতিরক্ষার জন্য) কিংবা পর্বতের পাশে (পরে মানমন্দির নির্মাণের সুযোগ পেতে) শহর গড়তে পারেন।
You'll likely want more cities later on. For these cities, you must go and find a good place. Looking for and founding on or near Luxury resources is a good rule of thumb. = পরে সম্ভবত আরও শহর চাইবেন। সেগুলোর জন্য ভালো স্থান খুঁজতে হবে। বিলাসসম্পদের ওপর বা কাছে শহর গড়ার জায়গা খোঁজা একটি ভালো সাধারণ নিয়ম।
Luxury resources are tiles that have things like Gems, Cotton, or Silk (indicated by a yellow background of the resource icon). These resources make your civilization happy. You should also keep an eye out for resources needed to build units, such as Iron. Cities cannot be built within 3 tiles of existing cities, which is another thing to keep in mind! = রত্ন, তুলা বা রেশমের মতো জিনিস থাকা টালিগুলো বিলাসসম্পদ বহন করে; প্রতীকের হলুদ পটভূমিতে সেগুলো চেনা যায়। এগুলো সভ্যতাকে সুখী করে। লোহার মতো ইউনিট তৈরির প্রয়োজনীয় সম্পদের দিকেও নজর রাখুন। বিদ্যমান শহরের 3 টালির মধ্যে নতুন শহর গড়া যায় না—এটিও মনে রাখবেন!
Cities will house Citizens, which can work tiles up to 3 tiles away from the city. This means you don’t have to settle cities right on or next to good tiles. Let’s say, for example, that you want access to some Iron – but the resource is in a desert area. You don’t have to settle your city in the desert. You can settle a few tiles away in more prosperous lands. Your city will grow and eventually gain access to the resource. You only need to settle right on top of resources if you need them immediately. = শহরে নাগরিক থাকে, যারা শহর থেকে 3 টালি দূর পর্যন্ত কাজ করতে পারে। তাই ভালো টালির ওপর বা একেবারে পাশে শহর বসাতেই হবে না। যেমন, লোহা চাইছেন, কিন্তু তা মরুভূমিতে আছে। শহরটি মরুভূমিতে না বসিয়ে কয়েক টালি দূরের সমৃদ্ধ ভূমিতে বসাতে পারেন। শহর বড় হলে একসময় সম্পদটিতে পৌঁছাবে। সঙ্গে সঙ্গে দরকার হলেই কেবল সম্পদের ওপর সরাসরি শহর বসানো প্রয়োজন।
The first thing coming out of your city depends on the strategy you want to follow, but the 'classic' build order is to build first two Scouts, then a Shrine, and three Settlers, and adopt Tradition, to explore the map quickly (Scouts ignore terrain cost), and to get an early Pantheon (if you're playing with religion enabled). = শহর থেকে প্রথমে কী তৈরি হবে তা আপনার কৌশলের ওপর নির্ভর করে। তবে প্রচলিত ক্রম হলো প্রথমে দুটো স্কাউট, তারপর একটি উপাসনালয় ও তিনজন বসতি স্থাপনকারী তৈরি করা এবং ঐতিহ্য গ্রহণ করা। এতে দ্রুত মানচিত্র ঘোরা যায়—স্কাউট ভূখণ্ডের চলাচল খরচ উপেক্ষা করে—এবং ধর্ম সক্রিয় থাকলে শুরুতেই প্যান্থিয়ন পাওয়া যায়।
But feel free to experiment with your own build orders! = অবশ্য নিজের নির্মাণক্রম নিয়ে পরীক্ষা করতে দ্বিধা করবেন না!

In your first couple of turns, you will have very little options, but as your civilization grows, so do the number of things requiring your attention. = প্রথম কয়েক চালে বিকল্প খুব কম থাকবে, কিন্তু সভ্যতা বড় হলে মনোযোগ দেওয়ার বিষয়ও বাড়বে।

Culture and Policies = সংস্কৃতি ও নীতি
Each turn, the culture you gain from all your cities is added to your Civilization's culture.\nWhen you have enough culture, you may pick a Social Policy, each one giving you a certain bonus. = প্রতি চালে সব শহর থেকে পাওয়া সংস্কৃতি সভ্যতার মোট সংস্কৃতিতে যোগ হয়।\nযথেষ্ট সংস্কৃতি হলে একটি সামাজিক নীতি বাছতে পারবেন; প্রতিটি আপনাকে নির্দিষ্ট বোনাস দেয়।
The policies are organized into branches, with each branch providing a bonus ability when all policies in the branch have been adopted. = নীতিগুলো বিভিন্ন শাখায় সাজানো। একটি শাখার সব নীতি গ্রহণ করলে সেই শাখা অতিরিক্ত একটি ক্ষমতা দেয়।
With each policy adopted, and with each city built,\n  the cost of adopting another policy rises - so choose wisely! = প্রতিটি নীতি গ্রহণ ও প্রতিটি শহর স্থাপনের সঙ্গে সঙ্গে\n  পরের নীতির খরচ বাড়ে—তাই বুঝে বেছে নিন!

City Expansion = শহরের সম্প্রসারণ
Once a city has gathered enough Culture, it will expand into a neighboring tile.\nYou have no control over the tile it will expand into, but tiles with resources and higher yields are prioritized. = শহরে যথেষ্ট সংস্কৃতি জমলে সেটি পাশের একটি টালিতে বিস্তৃত হয়।\nকোন টালিতে বাড়বে তা আপনি ঠিক করতে পারেন না, তবে সম্পদ ও বেশি ফলন থাকা টালি অগ্রাধিকার পায়।
Each additional tile will require more culture, but generally your first cities will eventually expand to a wide tile range. = প্রতিটি অতিরিক্ত টালির জন্য আরও সংস্কৃতি লাগে, কিন্তু সাধারণত প্রথম শহরগুলো শেষ পর্যন্ত বিস্তৃত এলাকা দখল করে।
Although your city will keep expanding forever, your citizens can only work 3 tiles away from city center.\nThis should be taken into account when placing new cities. = শহর অনন্তকাল বাড়তে থাকলেও নাগরিকেরা শহরকেন্দ্র থেকে শুধু 3 টালি দূর পর্যন্ত কাজ করতে পারে।\nনতুন শহর বসানোর সময় এটি মাথায় রাখুন।

Food is the resource fundamental to your Cities', and as a result Nation's, population and health. = শহরের জনসংখ্যা ও স্বাস্থ্য, আর তার মাধ্যমে দেশের জনসংখ্যা ও স্বাস্থ্যের মৌলিক সম্পদ হলো খাদ্য।
Every Citizen in each City consumes Food per turn. Any left over is considered Growth and is stored in the City Center. Once enough accumulates, the City Grows and a new Citizen is added. = প্রতিটি শহরের প্রতিটি নাগরিক প্রতি চালে খাদ্য খায়। অবশিষ্ট অংশ বৃদ্ধি হিসেবে শহরকেন্দ্রে জমে। যথেষ্ট জমলে শহর বড় হয় এবং নতুন নাগরিক যোগ হয়।
Initially your main source of Food is the City Center itself and working a surrounding tile with a Citizen. You can increase how much is generated by gaining more Citizens to work more tiles, improving the tiles so that they yield more Food, and eventually Buildings and Policies. = শুরুতে শহরকেন্দ্র এবং একজন নাগরিকের আশপাশের টালিতে কাজ করাই খাদ্যের প্রধান উৎস। বেশি নাগরিক দিয়ে বেশি টালিতে কাজ করিয়ে, টালির উন্নতি করে খাদ্যফলন বাড়িয়ে এবং পরে ভবন ও নীতির সাহায্যে খাদ্য উৎপাদন বাড়াতে পারেন।
Since a city's number of Citizens, or Population, determines how many tiles a City can work, Food is often the most important Resource. = শহরের নাগরিকসংখ্যা বা জনসংখ্যাই নির্ধারণ করে কত টালিতে কাজ করা যাবে, তাই খাদ্য প্রায়ই সবচেয়ে গুরুত্বপূর্ণ সম্পদ।

Production is the resource that lets a City Center build new things. = উৎপাদন হলো সেই সম্পদ যা দিয়ে শহরকেন্দ্র নতুন জিনিস তৈরি করে।
This can be new Buildings that are added to the City Center, or new Units that can go out across the World Map to advance your Nation's goals. = এগুলো শহরকেন্দ্রে যুক্ত হওয়া নতুন ভবন হতে পারে, অথবা নতুন ইউনিট—যারা বিশ্ব মানচিত্রে বেরিয়ে দেশের লক্ষ্য এগিয়ে নেবে।
Everything you can build has a Production Cost. Every turn each City generates a certain amount of Production and puts it towards whatever is at the top of the Build Queue. Once the total cost is collected, the Building or Unit is built! = যা কিছু তৈরি করা যায় তার উৎপাদন খরচ থাকে। প্রতি চালে শহরের নির্দিষ্ট উৎপাদন নির্মাণের সারির প্রথম জিনিসটিতে যোগ হয়। মোট খরচ জমা হলেই ভবন বা ইউনিট তৈরি হয়ে যায়!
Any excess Production after something is built is overflowed to the next thing the City builds. Up to it's total Production Cost. = কিছু তৈরির পর অবশিষ্ট উৎপাদন শহরের পরের নির্মাণে যোগ হয়, তবে সেই নির্মাণের মোট উৎপাদন খরচের বেশি নয়।
Since this determines how quickly you can build more stuff, your Nation's Production Capacity is crucial to it's advancement and survival. = কত দ্রুত নতুন জিনিস বানাতে পারবেন তা এর ওপর নির্ভর করে, তাই দেশের অগ্রগতি ও টিকে থাকার জন্য উৎপাদনক্ষমতা অত্যন্ত গুরুত্বপূর্ণ।

⍾Science is the resource that unlocks new and exciting Technologies for your Nation. = ⍾বিজ্ঞান দিয়ে দেশ নতুন ও আকর্ষণীয় প্রযুক্তি উন্মুক্ত করে।
Once you've Founded your Capital, you'll be prompted to Pick a Technology to Research. = রাজধানী স্থাপনের পর আপনাকে গবেষণার জন্য একটি প্রযুক্তি বাছতে বলা হবে।
Every Technology costs an amount of ⍾Science. Every turn the ⍾Science your Nation produces is paid towards Researching your chosen Technology. = প্রতিটি প্রযুক্তির নির্দিষ্ট ⍾বিজ্ঞান খরচ থাকে। প্রতি চালে দেশের উৎপাদিত ⍾বিজ্ঞান নির্বাচিত প্রযুক্তির গবেষণায় ব্যয় হয়।
Once a Technology has it's cost fully paid, you unlock the benefits for your Nation! This could be new Units, Buildings, or other advantages. Any surplus will overflow into the next Technology you pick to Research. = প্রযুক্তির পুরো খরচ মিটে গেলে দেশ তার সুবিধা পায়! তা নতুন ইউনিট, ভবন বা অন্য সুবিধা হতে পারে। অতিরিক্ত বিজ্ঞান পরের নির্বাচিত প্রযুক্তির গবেষণায় যোগ হয়।
Researching a Technology in the next Era will advance you into that Era and trigger a notification to other Nations about how amazing you are! = পরের যুগের কোনো প্রযুক্তি গবেষণা করলে আপনি সেই যুগে প্রবেশ করবেন এবং অন্য দেশগুলো আপনার অগ্রগতির বিজ্ঞপ্তি পাবে!
Since new Technologies tend to give access to better Units, Buildings, and even unlock powerful new Policies, staying ahead of the competition is one of the best ways to secure your Victory! = নতুন প্রযুক্তিতে উন্নত ইউনিট, ভবন, এমনকি শক্তিশালী নতুন নীতিও পাওয়া যায়। তাই প্রতিদ্বন্দ্বীদের চেয়ে এগিয়ে থাকা বিজয় নিশ্চিত করার অন্যতম সেরা উপায়!

Ah Gold. The Universal Medium of Exchange. Everyone loves Gold! They say it can't buy Happiness, but nuclear submarines are almost as good. = আহা সোনা, সর্বজনীন বিনিময়মাধ্যম। সবাই সোনা ভালোবাসে! বলে সোনায় সুখ কেনা যায় না, কিন্তু পারমাণবিক ডুবোজাহাজ প্রায় ততটাই ভালো।
You can earn more Gold from Tiles, Resources, Improvements, and eventually Buildings, Specialists, and Trade Routes. Ancient Ruins, meeting new City-States, and Pillaging are also great sources of Gold. During a Golden Age every Tile that already yields Gold will yield an additional Gold! = টালি, সম্পদ, ভূমির উন্নতি এবং পরে ভবন, বিশেষজ্ঞ ও বাণিজ্যপথ থেকে আরও সোনা আয় করতে পারেন। প্রাচীন ধ্বংসাবশেষ, নতুন শহর-রাজ্যের সঙ্গে সাক্ষাৎ ও লুটপাটও সোনার ভালো উৎস। স্বর্ণযুগে আগে থেকেই সোনা দেওয়া প্রতিটি টালি বাড়তি এক সোনা দেয়!
Gold is how you pay for Building Maintenance, Transportation Upkeep, and Unit Upkeep. If you run out of Gold, first you'll receive penalties to your ⍾Science production, then eventually your Units will start Disbanding as you can't pay their upkeep. = ভবন, পরিবহন ও ইউনিট রক্ষণাবেক্ষণে সোনা লাগে। সোনা ফুরিয়ে গেলে প্রথমে ⍾বিজ্ঞান উৎপাদনে শাস্তি পাবেন; পরে রক্ষণাবেক্ষণ মেটাতে না পারলে ইউনিট ভেঙে দেওয়া শুরু হবে।
Gold can be used to Buy Buildings and Units, helping bring up a new City or quickly build an Army. It can also buy Tiles to add to your City. It's also used to Upgrade your units from their older, obsolete forms to new, stronger versions. And investing it into a Research Agreement is a great way to convert it into ⍾Science. = সোনা দিয়ে ভবন ও ইউনিট কিনে নতুন শহর দ্রুত গড়ে তুলতে বা সেনাবাহিনী বানাতে পারেন। শহরে যোগ করার টালিও কেনা যায়। পুরোনো অচল ইউনিটকে নতুন শক্তিশালী রূপে উন্নীত করতেও সোনা লাগে। গবেষণা চুক্তিতে বিনিয়োগ করাও সোনাকে ⍾বিজ্ঞানে বদলানোর চমৎকার উপায়।
Gold is also very valuable in Diplomacy. You can directly Gift Gold to City-States to gain their favor. Use it to balance a Trade Deal with other Nations. Or demand every last drop after a successful war and your enemy sues for peace. = কূটনীতিতেও সোনা মূল্যবান। শহর-রাজ্যকে সরাসরি সোনা উপহার দিয়ে সুনজর পেতে পারেন, অন্য দেশের সঙ্গে বাণিজ্য চুক্তির ভারসাম্য আনতে পারেন, অথবা জয়ী যুদ্ধের পর শত্রু শান্তি চাইলে শেষ সোনাটুকুও দাবি করতে পারেন।
Ironically, some may consider Gold to be one of the less important Resources. But it's flexible nature and importance to keep your Nation running makes it a precious thing to pay attention to. After all, everyone loves Gold. = মজার বিষয়, কেউ কেউ সোনাকে তুলনামূলক কম গুরুত্বপূর্ণ সম্পদ মনে করেন। কিন্তু বহুমুখী ব্যবহার ও দেশ চালু রাখার প্রয়োজনে এটি মনোযোগ দেওয়ার মতো মূল্যবান। শেষ পর্যন্ত সবাই সোনা ভালোবাসে।
Not to be confused with the Resource of the same name, Gold Ore = একই নামের সম্পদ স্বর্ণ-আকরিকের সঙ্গে গুলিয়ে ফেলবেন না
Trade Route = বাণিজ্যপথ
See also: [param] = আরও দেখুন: [param]
Research Agreements = গবেষণা চুক্তি

As cities grow in size and influence, you have to deal with a happiness mechanic that is no longer tied to each individual city.\nInstead, your entire empire shares the same level of satisfaction.\nAs your cities grow in population you’ll find that it is more and more difficult to keep your empire happy. = শহর আকার ও প্রভাবে বাড়লে সুখের এমন একটি ব্যবস্থা সামলাতে হয় যা আর প্রতিটি শহরের সঙ্গে আলাদাভাবে যুক্ত থাকে না।\nবরং গোটা সাম্রাজ্য একই সন্তুষ্টির স্তর ভাগ করে।\nশহরের জনসংখ্যা যত বাড়বে, সাম্রাজ্যকে সুখী রাখা তত কঠিন হবে।
In addition, you can’t even build any city improvements that increase happiness until you’ve done the appropriate research.\nIf your empire’s happiness ever goes below zero the growth rate of your cities will be hurt.\nIf your empire becomes severely unhappy (as indicated by the smiley-face icon at the top of the interface)\n  your armies will have a big penalty slapped on to their overall combat effectiveness. = উপযুক্ত গবেষণা না করা পর্যন্ত সুখ বাড়ায় এমন শহরের উন্নয়নও তৈরি করতে পারবেন না।\nসাম্রাজ্যের সুখ শূন্যের নিচে নামলে শহরের বৃদ্ধির হার ক্ষতিগ্রস্ত হবে।\nসাম্রাজ্যে তীব্র অসন্তোষ দেখা দিলে—ওপরের হাসিমুখের প্রতীকে তা বোঝা যায়—\n  সেনাবাহিনীর সামগ্রিক যুদ্ধক্ষমতায় বড় শাস্তি আরোপ হবে।
This means that it is very difficult to expand quickly in Unciv.\nIt isn’t impossible, but as a new player you probably shouldn't do it.\nSo what should you do? Chill out, scout, and improve the land that you do have by building Workers.\nOnly build new cities once you have found a spot that you believe is appropriate. = তাই Unciv-এ খুব দ্রুত বিস্তার করা কঠিন।\nঅসম্ভব নয়, কিন্তু নতুন খেলোয়াড়ের সম্ভবত তা করা উচিত নয়।\nতাহলে কী করবেন? ধীরে চলুন, অনুসন্ধান করুন, কর্মী তৈরি করে নিজের বর্তমান জমি উন্নত করুন।\nউপযুক্ত মনে হয় এমন স্থান পেলেই শুধু নতুন শহর গড়ুন।

Unhappiness = অসন্তোষ
It seems that your citizens are unhappy!\nWhile unhappy, your civilization will suffer many detrimental effects, increasing in severity as unhappiness gets higher. = মনে হচ্ছে আপনার নাগরিকেরা অসন্তুষ্ট!\nঅসন্তোষ থাকলে সভ্যতা নানা ক্ষতিকর প্রভাব ভোগ করে; অসন্তোষ বাড়লে প্রভাবও তীব্র হয়।
Unhappiness has two main causes: Population and cities.\n  Each city causes 3 unhappiness, and each population, 1 = অসন্তোষের প্রধান কারণ দুটি: জনসংখ্যা ও শহর।\n  প্রতিটি শহর 3 অসন্তোষ এবং প্রতিটি নাগরিক 1 অসন্তোষ সৃষ্টি করে।
There are 2 main ways to combat unhappiness:\n  by building happiness buildings for your population\n  or by having improved luxury resources within your borders. = অসন্তোষ সামলানোর প্রধান উপায় 2টি:\n  জনগণের জন্য সুখদায়ক ভবন নির্মাণ করা\n  অথবা সীমান্তের মধ্যে উন্নত বিলাসসম্পদ রাখা।

You have entered a Golden Age!\nGolden age points are accumulated each turn by the total happiness \n  of your civilization\nWhen in a golden age, culture and production generation increases +20%,\n  and every tile already providing at least one gold will provide an extra gold. = আপনি স্বর্ণযুগে প্রবেশ করেছেন!\nসভ্যতার মোট সুখ অনুযায়ী প্রতি চালে স্বর্ণযুগের পয়েন্ট জমে\n  থাকে।\nস্বর্ণযুগে সংস্কৃতি ও উৎপাদন +20% বাড়ে,\n  আর আগে থেকেই অন্তত এক সোনা দেয় এমন প্রতিটি টালি অতিরিক্ত এক সোনা দেয়।

Roads and Railroads = সড়ক ও রেলপথ
Roads reduce the Movement Points required to move between two tiles connected by Roads. = সড়কে যুক্ত দুটি টালির মধ্যে যাতায়াতে প্রয়োজনীয় চলাচল পয়েন্ট সড়ক কমায়।
Railroads improve this reduction even more! = রেলপথে এই খরচ আরও কমে!
This greatly improves the speed you can get Units around the map. = ফলে মানচিত্রজুড়ে ইউনিট দ্রুত সরানো অনেক সহজ হয়।
Until you research the technology that removes it, Roads do not cross Rivers = বাধাটি দূর করার প্রযুক্তি গবেষণা না করা পর্যন্ত সড়ক নদী পার হয় না
Connecting your cities to the capital by Roads and/or Railroads will generate Gold via the Trade Route. = সড়ক এবং/অথবা রেলপথে শহরকে রাজধানীর সঙ্গে যুক্ত করলে বাণিজ্যপথ থেকে সোনা আসে।
However, since each Road and Railroad have a Maintenance Cost, it may be more economical to wait until the cities grow and only place where needed. = তবে প্রতিটি সড়ক ও রেলপথের রক্ষণাবেক্ষণ খরচ আছে। তাই শহর বড় হওয়া পর্যন্ত অপেক্ষা করে শুধু প্রয়োজনীয় জায়গায় নির্মাণ বেশি লাভজনক হতে পারে।

Connecting your cities to the capital by Roads and/or Railroads will generate Gold via the Trade Route. You earn more Gold the more Population the City and your Capital has. = সড়ক এবং/অথবা রেলপথে শহরকে রাজধানীর সঙ্গে যুক্ত করলে বাণিজ্যপথ থেকে সোনা আসে। শহর ও রাজধানীর জনসংখ্যা যত বেশি, আয়ও তত বেশি।
Note that each road costs 1 Gold Maintenance per turn, and each Railroad costs 2 Gold, so it may be more economical to wait until the cities grow! = মনে রাখুন, প্রতি চালে প্রতিটি সড়কের রক্ষণাবেক্ষণে 1 সোনা ও প্রতিটি রেলপথে 2 সোনা লাগে। তাই শহর বড় হওয়া পর্যন্ত অপেক্ষা করা বেশি লাভজনক হতে পারে!
Railroads connecting a city to the Capital also provide a 25% Production Boost to the City, but not the Capital. = কোনো শহরকে রেলপথে রাজধানীর সঙ্গে যুক্ত করলে সেই শহরের উৎপাদন 25% বাড়ে, তবে রাজধানীর নয়।
Trade Routes are also connected over Water via certain buildings like the Harbor. As long as there is a chain that can reach the Capital, there's a Trade Route. Look for this symbol in Yellow below the City Name to mean you have an active Trade Route to your Capital. = হারবারের মতো কিছু ভবন দিয়ে জলের ওপর দিয়েও বাণিজ্যপথ যুক্ত হয়। রাজধানী পর্যন্ত সংযোগের শৃঙ্খল থাকলেই বাণিজ্যপথ থাকে। শহরের নামের নিচে হলুদ রঙে এই প্রতীক থাকলে রাজধানীর সঙ্গে সক্রিয় বাণিজ্যপথ আছে।
Trade Routes can get broken either by Blockades or by Removing/Pillaging the connecting Road/Railroad chain. = অবরোধ অথবা সংযোগকারী সড়ক/রেলপথের অংশ সরানো বা লুট হলে বাণিজ্যপথ বিচ্ছিন্ন হতে পারে।
City Blockade = শহর অবরোধ

Once you’ve settled 3-4 cities and build universities, you’re probably already 100 to 150 turns into the game.\nNow is a good time to start thinking about how, exactly, you want to win – if you haven’t already. = 3-4টি শহর বসিয়ে বিশ্ববিদ্যালয় তৈরি করার সময় সম্ভবত 100 থেকে 150 চাল হয়ে গেছে।\nআগে না ভেবে থাকলে এখন ঠিক কোন পথে জিততে চান তা ভাবার ভালো সময়।
There are four ways to win in Unciv. They are:\n - Cultural Victory: Complete 5 Social Policy Trees and build the Utopia Project\n - Domination Victory: Conquer the original capital of all other Major civs\n - Science Victory: Be the first to construct a Spaceship\n - Diplomatic Victory: Build the United Nations and win the vote = Unciv-এ চারভাবে জেতা যায়:\n - সাংস্কৃতিক বিজয়: 5টি সামাজিক নীতির গাছ সম্পূর্ণ করে ইউটোপিয়া প্রকল্প নির্মাণ\n - বিশ্বজয়ের বিজয়: অন্য সব বড় সভ্যতার মূল রাজধানী দখল\n - বৈজ্ঞানিক বিজয়: সবার আগে মহাকাশযান নির্মাণ\n - কূটনৈতিক বিজয়: জাতিসংঘ নির্মাণ করে ভোটে জয়
So to sum it up, these are the basics of Unciv – Found a prosperous first city, expand slowly to manage happiness, and set yourself up for the victory condition you wish to pursue.\nObviously, there is much more to it than that, but it is important not to jump into the deep end before you know how to swim. = মূল কথা, Unciv-এর ভিত্তি হলো সমৃদ্ধ প্রথম শহর গড়া, সুখ সামলাতে ধীরে বিস্তার করা এবং কাঙ্ক্ষিত বিজয়ের শর্ত পূরণের প্রস্তুতি নেওয়া।\nএর বাইরেও অনেক কিছু আছে, কিন্তু সাঁতার শেখার আগেই গভীর জলে ঝাঁপ না দেওয়া জরুরি।

Enemy City = শত্রু শহর
Cities can be conquered by reducing their health to 1, and entering the city with a melee unit.\nSince cities heal each turn, it is best to attack with ranged units and use your melee units to defend them until the city has been defeated! = শহরের স্বাস্থ্য 1-এ নামিয়ে একটি কাছ থেকে লড়া ইউনিট শহরে ঢোকালে শহর দখল হয়।\nশহর প্রতি চালে সারে, তাই দূরপাল্লার ইউনিট দিয়ে আক্রমণ করে কাছ থেকে লড়া ইউনিট দিয়ে তাদের রক্ষা করুন, যতক্ষণ না শহর পরাস্ত হয়!

Luxury Resource = বিলাসসম্পদ
Luxury resources within your domain and with their specific improvement are connected to your trade network.\nEach unique Luxury resource you have adds 5 happiness to your civilization, but extra resources of the same type don't add anything, so use them for trading with other civilizations! = নিজের এলাকার বিলাসসম্পদে নির্দিষ্ট উন্নয়ন করা থাকলে তা বাণিজ্যজালে যুক্ত হয়।\nপ্রতিটি আলাদা ধরনের বিলাসসম্পদ সভ্যতাকে 5 সুখ দেয়। একই ধরনের অতিরিক্ত কপি আর সুখ দেয় না, তাই অন্য সভ্যতার সঙ্গে সেগুলো বাণিজ্যে ব্যবহার করুন!

Strategic Resource = কৌশলগত সম্পদ
Strategic resources within your domain and with their specific improvement are connected to your trade network.\nStrategic resources allow you to train units and construct buildings that require those specific resources, for example the Horseman requires Horses. = নিজের এলাকার কৌশলগত সম্পদে নির্দিষ্ট উন্নয়ন করা থাকলে তা বাণিজ্যজালে যুক্ত হয়।\nএসব সম্পদ দিয়ে সেগুলো প্রয়োজন এমন ইউনিট ও ভবন তৈরি করা যায়; যেমন অশ্বারোহীর জন্য ঘোড়া লাগে।
Unlike Luxury Resources, each Strategic Resource on the map provides more than one of that resource.\nThe top bar keeps count of how many unused strategic resources you own.\nA full drilldown of resources is available in the Resources tab in the Overview screen. = বিলাসসম্পদের বিপরীতে, মানচিত্রের প্রতিটি কৌশলগত সম্পদের উৎস একাধিক একক সরবরাহ করে।\nওপরের বার অব্যবহৃত কৌশলগত সম্পদের সংখ্যা দেখায়।\nসাম্রাজ্যের সারসংক্ষেপ পর্দার সম্পদ ট্যাবে পূর্ণ হিসাব পাওয়া যায়।

The city can no longer put up any resistance!\nHowever, to conquer it, you must enter the city with a melee unit = শহর আর প্রতিরোধ করতে পারছে না!\nতবে দখল করতে অবশ্যই কাছ থেকে লড়া ইউনিট নিয়ে শহরে ঢুকতে হবে।

After Conquering = দখলের পরে
When conquering a city, you can choose to liberate, annex, puppet, or raze the city. = শহর জয় করার পর মুক্ত করা, সংযুক্ত করা, পুতুল সরকার বসানো অথবা ধ্বংস করার মধ্যে বেছে নিতে পারেন।
\nLiberating the city will return it to its original owner, giving you a massive diplomatic boost with them!\n\nAnnexing the city will give you full control over it, but also increase the citizens' unhappiness to 2x!\nThis can be mitigated by building a courthouse in the city, returning the citizen's unhappiness to normal.\n\nPuppeting the city will mean that you have no control on the city's production.\nThe city will not increase your tech or policy cost.\nA puppeted city can be annexed at any time, but annexed cities cannot be returned to a puppeted state!\n\nRazing the city will lower its population by 1 each turn until the city is destroyed!\nYou cannot raze a city that is either the starting capital of a civilization or the holy city of a religion. = \nশহর মুক্ত করলে তা মূল মালিকের কাছে ফেরে এবং তাঁর সঙ্গে সম্পর্ক অনেক উন্নত হয়!\n\nসংযুক্ত করলে শহরের পূর্ণ নিয়ন্ত্রণ পাবেন, কিন্তু নাগরিকদের অসন্তোষ বেড়ে 2x হবে!\nশহরে আদালত বানালে তা কমিয়ে স্বাভাবিক করা যায়।\n\nপুতুল সরকার বসালে শহরের উৎপাদন আপনার নিয়ন্ত্রণে থাকবে না।\nশহর প্রযুক্তি বা নীতির খরচ বাড়াবে না।\nপুতুল শহর যেকোনো সময় সংযুক্ত করা যায়, কিন্তু সংযুক্ত শহরকে আবার পুতুল শহর করা যায় না!\n\nশহর ধ্বংস করলে প্রতি চালে জনসংখ্যা 1 কমে, যতক্ষণ না শহর সম্পূর্ণ বিলুপ্ত হয়!\nকোনো সভ্যতার শুরুর রাজধানী বা কোনো ধর্মের পবিত্র শহর ধ্বংস করা যায় না।

You have encountered a barbarian unit!\nBarbarians attack everyone indiscriminately, so don't let your \n  civilian units go near them, and be careful of your scout! = আপনি একটি বর্বর ইউনিটের মুখোমুখি হয়েছেন!\nবর্বররা নির্বিচারে সবাইকে আক্রমণ করে, তাই বেসামরিক ইউনিটগুলোকে\n  তাদের কাছে যেতে দেবেন না, স্কাউটের ব্যাপারেও সাবধান থাকুন!

You have encountered another civilization!\nOther civilizations start out peaceful, and you can trade with them,\n  but they may choose to declare war on you later on = আপনি আরেকটি সভ্যতার দেখা পেয়েছেন!\nঅন্য সভ্যতাগুলো শুরুতে শান্ত থাকে, তাদের সঙ্গে বাণিজ্যও করতে পারেন,\n  তবে পরে তারা আপনার বিরুদ্ধে যুদ্ধ ঘোষণা করতে পারে।

Injured Units = আহত ইউনিট
Injured units deal less damage, but recover after turns that they have been inactive.\nUnits heal 10 health per turn in enemy territory or neutral land,\n  20 inside your territory and 25 in your cities. = আহত ইউনিট কম ক্ষতি করে, তবে নিষ্ক্রিয় কাটানো চালের পর সেরে ওঠে।\nশত্রু বা নিরপেক্ষ ভূখণ্ডে প্রতি চালে 10 স্বাস্থ্য,\n  নিজের ভূখণ্ডে 20 এবং নিজের শহরে 25 স্বাস্থ্য সারে।

Workers = কর্মী
Workers are vital to your cities' growth, since only they can construct improvements on tiles.\nImprovements raise the yield of your tiles, allowing your city to produce more and grow faster while working the same amount of tiles! = শহরের বৃদ্ধির জন্য কর্মী অপরিহার্য, কারণ কেবল তারাই টালিতে উন্নয়ন তৈরি করতে পারে।\nউন্নয়নে টালির ফলন বাড়ে, তাই একই সংখ্যক টালিতে কাজ করেও শহর বেশি উৎপাদন ও দ্রুত বৃদ্ধি পায়!

Embarking = জলযাত্রা
Once a certain tech is researched, your land units can embark, allowing them to traverse water tiles.\nEntering or leaving water takes the entire turn. = নির্দিষ্ট প্রযুক্তি গবেষণার পর স্থল ইউনিট জলযাত্রা করতে পারে, ফলে জলের টালি পার হওয়া যায়।\nজলে প্রবেশ বা জল থেকে বেরোতে পুরো চাল লাগে।
Units are defenseless while embarked (cannot use modifiers), and have a fixed Defending Strength based on your tech Era, so be careful!\nRanged Units can't attack, Melee Units have a Strength penalty, and all have limited vision. = জলযাত্রার সময় ইউনিট প্রতিরক্ষাহীন থাকে—সংশোধক ব্যবহার করতে পারে না—এবং প্রযুক্তির যুগ অনুযায়ী নির্দিষ্ট প্রতিরক্ষা শক্তি থাকে, তাই সাবধান!\nদূরপাল্লার ইউনিট আক্রমণ করতে পারে না, কাছ থেকে লড়া ইউনিটের শক্তি কমে, আর সবার দৃষ্টিসীমা সীমিত থাকে।

Idle Units = নিষ্ক্রিয় ইউনিট
Clicking 'Next unit' moves to the next idle unit in the queue (as listed in Overview -> Units). After issuing an order to a unit, if 'Auto Unit Cycle' in Options -> Gameplay is enabled, you will automatically select the next idle unit. = «পরের ইউনিট»-এ ক্লিক করলে সারির পরের নিষ্ক্রিয় ইউনিটে যান; সারিটি সারসংক্ষেপ -> ইউনিট তালিকায় দেখা যায়। ইউনিটকে আদেশ দেওয়ার পর সেটিংস -> গেমপ্লে-তে «স্বয়ংক্রিয় ইউনিট আবর্তন» চালু থাকলে পরের নিষ্ক্রিয় ইউনিট নিজে থেকেই নির্বাচিত হবে।
If you don't want to move a unit this turn, you can skip it by clicking 'Next unit' again, or command the unit to 'Skip turn'. = এই চালে ইউনিট সরাতে না চাইলে আবার «পরের ইউনিট»-এ ক্লিক করে তাকে এড়িয়ে যেতে পারেন, অথবা «চাল এড়িয়ে যান» আদেশ দিতে পারেন।
If you want to disable the 'Next unit' feature entirely, you can toggle it in Options -> Gameplay -> Check for idle units. = «পরের ইউনিট» সম্পূর্ণ বন্ধ করতে চাইলে সেটিংস -> গেমপ্লে -> নিষ্ক্রিয় ইউনিট পরীক্ষা-তে তা বদলাতে পারেন।
If you'd rather 'Next unit' cycle the units and not mark them as Done, you can change it in the Options -> Gameplay menu. = «পরের ইউনিট» দিয়ে ইউনিটগুলো ঘুরে দেখতে চান, কিন্তু কাজ শেষ বলে চিহ্নিত করতে না চাইলে সেটিংস -> গেমপ্লে মেনুতে বদলাতে পারেন।
You can also cycle through the idle units using the left and right triangles on the Unit Table in the lower left of the screen. Or by default using the Cycle button next to the 'Next Unit' button. = পর্দার নিচের বাঁদিকে ইউনিট সারণির বাঁ ও ডান ত্রিভুজ দিয়ে নিষ্ক্রিয় ইউনিটগুলো ঘুরে দেখতে পারেন। সাধারণত «পরের ইউনিট» বোতামের পাশের আবর্তন বোতাম দিয়েও তা করা যায়।

