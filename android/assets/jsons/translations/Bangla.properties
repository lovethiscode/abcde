Multiplayer in three steps = তিন ধাপে মাল্টিপ্লেয়ার
There is no waiting lobby; the game starts as soon as the creator finishes setup. = কোনো অপেক্ষার লবি নেই; নির্মাতা সেটআপ শেষ করলেই খেলা শুরু হয়।
1. Each player copies their Player ID and sends it to the game creator. = 1. প্রত্যেক খেলোয়াড় নিজের Player ID কপি করে খেলার নির্মাতাকে পাঠান।
2. The creator opens New game, enables online multiplayer, and assigns each human civilization its Player ID. = 2. নির্মাতা নতুন খেলা খোলেন, অনলাইন মাল্টিপ্লেয়ার চালু করেন এবং প্রতিটি মানব সভ্যতাকে তার Player ID দেন।
3. The creator shares the Game ID; other players add it here and download the latest save. = 3. নির্মাতা Game ID শেয়ার করেন; অন্য খেলোয়াড়েরা এটি এখানে যোগ করে সর্বশেষ সেভ ডাউনলোড করেন।
