Ramesses II = রামেসিস ২
You are but a pest on this Earth, prepare to be eliminated! = আপনি এই পৃথিবীতে একটি কীটপতঙ্গ, নির্মূল করার জন্য প্রস্তুত!
You are a fool who evokes pity. You have brought my hostility upon yourself and your repulsive civilization! = তুমি একজন বোকা যে করুণা জাগায়। আপনি আমার শত্রুতা আপনার এবং আপনার বিদ্বেষপূর্ণ সভ্যতার উপর এনেছেন!
Strike me down and my soul will torment yours forever, you have won nothing. = আমাকে আঘাত কর এবং আমার আত্মা চিরকাল তোমার যন্ত্রণা দেবে, তুমি কিছুই জিতেনি।
Greetings, I am Ramesses the god. I am the living embodiment of Egypt, mother and father of all civilizations. = নমস্কার, আমি রামেসিস দেবতা। আমি মিশরের জীবন্ত মূর্ত প্রতীক, সকল সভ্যতার মা ও পিতা।
Generous Egypt makes you this offer. = উদার মিশর আপনাকে এই প্রস্তাব দেয়.
Good day. = শুভ দিন।
Oh, it's you. = ওহ, এটা আপনি.
Monument Builders = মনুমেন্ট নির্মাতারা
O great Ramesses, Pharaoh of Egypt, bright as the Sun and mighty as the Nile! Lord of all living things, you lead the greatest of all civilizations, which has gifted the world with writing, advanced mathematics, sculpture, and architecture. Egyptian monuments and culture will continue to amaze the world for thousands of years. = হে মহান রামেসিস, মিশরের ফারাও, সূর্যের মতো উজ্জ্বল এবং নীল নদের মতো শক্তিশালী! সমস্ত জীবের প্রভু, আপনি সমস্ত সভ্যতার সর্বশ্রেষ্ঠ নেতৃত্ব দেন, যা বিশ্বকে লেখালেখি, উন্নত গণিত, ভাস্কর্য এবং স্থাপত্য দিয়ে উপহার দিয়েছে। মিশরীয় স্মৃতিসৌধ এবং সংস্কৃতি হাজার হাজার বছর ধরে বিশ্বকে অবাক করে দেবে।
Mighty and eternal Ramesses, Egypt lasted for millenia, whereas other civilisations disappeared into dust after a few centuries. Amun-Ra blesses you again to lead Egypt and its people on the path of light. Will your new empire shine through the ages of history? = পরাক্রমশালী এবং শাশ্বত রামেসিস, মিশর সহস্রাব্দ ধরে চলেছিল, যেখানে অন্যান্য সভ্যতা কয়েক শতাব্দী পরে ধূলিকণাতে অদৃশ্য হয়ে গিয়েছিল। আমুন-রা আপনাকে মিশর এবং এর জনগণকে আলোর পথে নিয়ে যাওয়ার জন্য আবার আশীর্বাদ করে। আপনার নতুন সাম্রাজ্য কি ইতিহাসের যুগে উজ্জ্বল হবে?
