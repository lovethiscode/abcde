 # Requires translation!
Hi there! If you've played this far, you've probably seen that the game is currently incomplete.\n Unciv will remain open-source forever. = হ্যালো! আপনি যদি এত দূর খেলে থাকেন, তবে সম্ভবত দেখেছেন যে গেমটি বর্তমানে অসম্পূর্ণ।\n Unciv চিরকাল ওপেন-সোর্স থাকবে।
 # Requires translation!
What motivates me to keep working on it, \n  besides the fact I think it's amazingly cool that I can,\n  is the support from the players - you guys are the best! = এটি নিয়ে কাজ চালিয়ে যেতে আমাকে যা অনুপ্রাণিত করে, \n  আমি যে এটি করতে পারি সেটাই দারুণ মনে হয়—এটা ছাড়াও,\n  তা হলো খেলোয়াড়দের সমর্থন—আপনারাই সেরা!
 # Requires translation!
If you like Unciv, please rate and review it in the App Store.\n If you find a problem or have a suggestion, open a GitHub issue and help us make the game even better! = Unciv ভালো লাগলে App Store-এ রেটিং ও পর্যালোচনা দিন।\n কোনো সমস্যা খুঁজে পেলে বা কোনো পরামর্শ থাকলে একটি GitHub issue খুলুন এবং গেমটি আরও ভালো করতে আমাদের সাহায্য করুন!

Pillaging = লুটপাট
Military units can pillage improvements, which heals them 25 health and ruins the improvement.\nThe tile can still be worked, but advantages from the improvement - stat bonuses and resources - will be lost.\nWorkers can repair these improvements, which takes less time than building the improvement from scratch.\nPillaging certain improvements will result in your units looting gold from the improvement. = সামরিক ইউনিট ভূমির উন্নয়ন লুট করতে পারে; এতে তাদের 25 স্বাস্থ্য সারে এবং উন্নয়নটি নষ্ট হয়।\nটালিতে তখনও কাজ করা যায়, কিন্তু উন্নয়নের সুবিধা—অতিরিক্ত ফলন ও সম্পদ—হারায়।\nকর্মী এসব উন্নয়ন মেরামত করতে পারে; নতুন করে তৈরির চেয়ে কম সময় লাগে।\nকিছু উন্নয়ন লুট করলে ইউনিট সেখান থেকে সোনাও পায়।

Experience = অভিজ্ঞতা
Units that enter combat gain experience, which can then be used on promotions for that unit.\nUnits gain more experience when in Melee combat than Ranged, and more when attacking than when defending. = যুদ্ধে অংশ নেওয়া ইউনিট অভিজ্ঞতা পায়; তা দিয়ে সেই ইউনিটের প্রমোশন নেওয়া যায়।\nদূরপাল্লার তুলনায় কাছের যুদ্ধে বেশি অভিজ্ঞতা মেলে, আর রক্ষার তুলনায় আক্রমণে বেশি মেলে।
Units can only gain up to 30 XP from Barbarian units - meaning up to 2 promotions. After that, Barbarian units will provide no experience. = বর্বর ইউনিট থেকে সর্বোচ্চ 30 XP পাওয়া যায়—অর্থাৎ সর্বোচ্চ 2টি প্রমোশন। এরপর বর্বরদের থেকে আর অভিজ্ঞতা মেলে না।

Combat = যুদ্ধ
Unit and cities are worn down by combat, which is affected by a number of different values.\nEach unit has a certain 'base' combat value, which can be improved by certain conditions, promotions and locations. = যুদ্ধে ইউনিট ও শহর ক্ষয়প্রাপ্ত হয়; বিভিন্ন মান যুদ্ধের ফলকে প্রভাবিত করে।\nপ্রতিটি ইউনিটের নির্দিষ্ট মৌলিক যুদ্ধমান আছে, যা কিছু শর্ত, প্রমোশন ও অবস্থান দিয়ে বাড়ানো যায়।
Units use the 'Strength' value as the base combat value when melee attacking and when defending.\nWhen using a ranged attack, they will the use the 'Ranged Strength' value instead. = কাছ থেকে আক্রমণ ও প্রতিরক্ষায় ইউনিট «শক্তি»-কে মৌলিক যুদ্ধমান হিসেবে ব্যবহার করে।\nদূরপাল্লার আক্রমণে তার বদলে «দূরপাল্লার শক্তি» ব্যবহৃত হয়।
Ranged attacks can be done from a distance, dependent on the 'Range' value of the unit.\nWhile melee attacks allow the defender to damage the attacker in retaliation, ranged attacks do not. = ইউনিটের «পাল্লা» অনুযায়ী দূর থেকে আক্রমণ করা যায়।\nকাছের আক্রমণে রক্ষাকারী পাল্টা আঘাতে আক্রমণকারীকে ক্ষতি করতে পারে; দূরপাল্লার আক্রমণে তা হয় না।

Embassies = দূতাবাস
Establishing an embassy in other players' Capital city shows the location of their Capital, likewise other players who establish an embassy in your Capital can see location of your Capital. = অন্য খেলোয়াড়ের রাজধানীতে দূতাবাস করলে তার অবস্থান দেখা যায়। একইভাবে আপনার রাজধানীতে অন্যের দূতাবাস থাকলে সেও তার অবস্থান দেখতে পায়।
Embassies thus allow Spies to be placed in another players' Capital City if Espionage is enabled. = তাই গুপ্তচরবৃত্তি চালু থাকলে দূতাবাসের সাহায্যে অন্য খেলোয়াড়ের রাজধানীতে গুপ্তচর রাখা যায়।
Mutual embassies are required to allow trading open borders and to sign Research Agreement and Defensive Pact. = উন্মুক্ত সীমান্তের বাণিজ্য এবং গবেষণা চুক্তি ও প্রতিরক্ষা চুক্তি করতে পারস্পরিক দূতাবাস দরকার।
Declaring war on another player or denouncing them will remove embassies from both players' Capitals. You will have to re-establish them to use their effect. = অন্য খেলোয়াড়কে যুদ্ধ ঘোষণা বা নিন্দা করলে দুজনের রাজধানী থেকেই দূতাবাস সরে যায়। সুবিধা পেতে আবার স্থাপন করতে হবে।
Re-establishing an embassy after denunciation from either side becomes available next turn, while re-establishing them when at war requires a peace treaty. = যেকোনো পক্ষের নিন্দার পর পরের চাল থেকে দূতাবাস আবার স্থাপন করা যায়; যুদ্ধ চললে তা করতে শান্তিচুক্তি দরকার।
Be cautious when accepting embassy from other players because they can spy on your capital, or worse may start planning to attack you. = অন্য খেলোয়াড়ের দূতাবাস গ্রহণে সাবধান, কারণ সে রাজধানীতে গুপ্তচর পাঠাতে পারে, বা আরও খারাপ—আপনাকে আক্রমণের পরিকল্পনাও করতে পারে।
Note that before you can offer an embassy, you need the required Technology. = দূতাবাসের প্রস্তাব দেওয়ার আগে প্রয়োজনীয় প্রযুক্তি থাকতে হবে।
Embassies are available using the Gods and Kings ruleset. = দূতাবাস Gods and Kings নিয়মে পাওয়া যায়।
Defensive Pacts = প্রতিরক্ষা চুক্তি

Open Borders from other player and vice versa allow units to freely pass through their territory. = অন্য খেলোয়াড় আপনার জন্য এবং আপনি তার জন্য সীমান্ত খুলে দিলে ইউনিট অবাধে একে অন্যের ভূখণ্ডে চলতে পারে।
They also let Missionaries to enter other players' territory without suffering attrition. = এতে ধর্মপ্রচারকরাও ক্ষয় না ভোগ করে অন্য খেলোয়াড়ের ভূখণ্ডে ঢুকতে পারে।
Open Borders expire depending on game speed and are canceled upon Declaration of War, the closure however takes effect only after war ends and need to be traded again. = খেলার গতির ওপর উন্মুক্ত সীমান্তের মেয়াদ নির্ভর করে; যুদ্ধ ঘোষণায় চুক্তি বাতিল হয়। তবে সীমান্ত বন্ধ হওয়া কার্যকর হয় যুদ্ধ শেষ হওয়ার পরেই, এবং আবার বাণিজ্যের মাধ্যমে চুক্তি করতে হয়।
You gain diplomatic boost with other AI player if you both have Open Borders to each other = উভয়ের সীমান্ত পরস্পরের জন্য খোলা থাকলে অন্য AI খেলোয়াড়ের সঙ্গে কূটনৈতিক সম্পর্ক বাড়ে।
Be cautious when giving Open Borders because other player may settle a City near your lands in an area you are planning to use, they may also use your territory to attack your friends or City State allies. = সীমান্ত খুলে দেওয়ায় সাবধান: অন্য খেলোয়াড় আপনার ব্যবহারের পরিকল্পনা করা জমির কাছে শহর বসাতে পারে। আপনার ভূখণ্ড ব্যবহার করে আপনার বন্ধু বা মিত্র শহর-রাজ্যকেও আক্রমণ করতে পারে।
Note that before you can offer or accept open borders, both Nations need the required Technology. = উন্মুক্ত সীমান্তের প্রস্তাব দেওয়া বা গ্রহণের আগে উভয় দেশের প্রয়োজনীয় প্রযুক্তি থাকতে হবে।
When playing with the Gods and Kings ruleset mutual embassies need to be established before Open Borders can be traded. = Gods and Kings নিয়মে উন্মুক্ত সীমান্তের বাণিজ্যের আগে পারস্পরিক দূতাবাস স্থাপন করতে হয়।

In Research Agreements, you and another civilization decide to jointly research technology.\nAt the end of the agreement, you will both receive a 'lump sum' of ⍾Science, which will go towards one of your unresearched technologies. = গবেষণা চুক্তিতে আপনি ও আরেক সভ্যতা যৌথভাবে প্রযুক্তি গবেষণার সিদ্ধান্ত নেন।\nচুক্তির শেষে দুজনই এককালীন ⍾বিজ্ঞান পাবেন, যা আপনার কোনো অনাবিষ্কৃত প্রযুক্তির গবেষণায় যোগ হবে।
The amount of ⍾Science you receive at the end is dependent on the ⍾Science generated by your cities and the other civilization's cities during the agreement - the more, the better! = চুক্তি চলাকালীন আপনার ও অন্য সভ্যতার শহরগুলো কত ⍾বিজ্ঞান উৎপাদন করেছে তার ওপর শেষে প্রাপ্য ⍾বিজ্ঞানের পরিমাণ নির্ভর করে—যত বেশি, তত ভালো!
Note that before you can invest in a research agreement, you must have a Declaraction of Friendship, both Nations need the required Technology, and both Nations need enough Gold on hand for the agreement. = গবেষণা চুক্তিতে বিনিয়োগের আগে মৈত্রীর ঘোষণা থাকতে হবে, উভয় দেশের প্রয়োজনীয় প্রযুক্তি লাগবে এবং উভয়ের হাতে চুক্তির জন্য যথেষ্ট সোনা থাকতে হবে।
When playing with the Gods and Kings ruleset mutual embassies need to be established before a Research Agreement can be signed. = Gods and Kings নিয়মে গবেষণা চুক্তি স্বাক্ষরের আগে পারস্পরিক দূতাবাস স্থাপন করতে হয়।

Defensive pacts allow you and another civ to protect one another from aggressors.\nOnce the defensive pact is signed, you will be drawn into their future defensive wars, just as they will be drawn into your future defensive wars. Declaring war on any Civ will remove all of your defensive pacts. You will have to re-sign them to use their effect. = প্রতিরক্ষা চুক্তিতে আপনি ও অন্য সভ্যতা আগ্রাসীদের থেকে একে অন্যকে রক্ষা করেন।\nচুক্তির পরে তার ভবিষ্যৎ প্রতিরক্ষামূলক যুদ্ধে আপনি যোগ দেবেন, সেও আপনার এমন যুদ্ধে যোগ দেবে। যেকোনো সভ্যতার বিরুদ্ধে যুদ্ধ ঘোষণা করলে আপনার সব প্রতিরক্ষা চুক্তি সরে যায়। সুবিধা পেতে আবার স্বাক্ষর করতে হবে।
Be cautious when signing defensive pacts because they can bring you into wars that you might not want to be in. = প্রতিরক্ষা চুক্তি স্বাক্ষরে সাবধান, কারণ তা আপনাকে অনিচ্ছাকৃত যুদ্ধে টেনে নিতে পারে।
The AI is very careful and will not accept defensive pacts with less than 80 influence. = AI খুব সতর্ক; প্রভাব 80-এর কম হলে প্রতিরক্ষা চুক্তি গ্রহণ করবে না।
Note that before you can sign a defensive pact, you must have a Declaraction of Friendship, and both Nations need the required Technology. = প্রতিরক্ষা চুক্তির আগে মৈত্রীর ঘোষণা ও উভয় দেশের প্রয়োজনীয় প্রযুক্তি থাকতে হবে।
When playing with the Gods and Kings ruleset mutual embassies need to be established before a Defensive Pact can be signed. = Gods and Kings নিয়মে প্রতিরক্ষা চুক্তি স্বাক্ষরের আগে পারস্পরিক দূতাবাস স্থাপন করতে হয়।

Not all nations are contending with you for victory.\nCity-States are nations that can't win, can't be traded with, and instead confer certain bonuses to friendly civilizations. = সব দেশ আপনার সঙ্গে বিজয়ের প্রতিযোগিতা করে না।\nশহর-রাজ্য এমন দেশ যারা জিততে পারে না, যাদের সঙ্গে বাণিজ্য করা যায় না; বদলে তারা বন্ধু সভ্যতাকে নির্দিষ্ট বোনাস দেয়।
Instead, diplomatic relations with City-States are determined by Influence - a meter of 'how much the City-State likes you'.\nInfluence can be increased by attacking their enemies, liberating their city, and giving them sums of gold. = শহর-রাজ্যের সঙ্গে কূটনৈতিক সম্পর্ক প্রভাব দিয়ে নির্ধারিত হয়—শহর-রাজ্য আপনাকে কতটা পছন্দ করে তার মাপকাঠি।\nতাদের শত্রুকে আক্রমণ, তাদের শহর মুক্ত করা ও সোনা উপহার দিয়ে প্রভাব বাড়ানো যায়।
Certain bonuses are given when you are at above 30 influence.\nWhen you have above 60 Influence, and you have the highest influence with them of all civilizations, you are considered their 'Ally', and gain further bonuses and access to the Luxury and Strategic resources in their lands. = প্রভাব 30-এর বেশি হলে নির্দিষ্ট বোনাস মেলে।\nপ্রভাব 60-এর বেশি এবং সব সভ্যতার মধ্যে আপনার প্রভাব সর্বোচ্চ হলে আপনি তাদের «মিত্র» হন; আরও বোনাসের পাশাপাশি তাদের বিলাস ও কৌশলগত সম্পদও পান।

While working the land is good, eventually your Citizens will want to Specialize. = জমিতে কাজ করা ভালো, তবে একসময় নাগরিকেরা বিশেষজ্ঞ হতে চাইবে।
Certain Buildings will also provide Specialist Slots. These slots will show up in the Citizen Management within the City Screen under Specialists. Each slot can be filled with a Citizen which will then become a Specialist. = কিছু ভবনে বিশেষজ্ঞের খালি স্থানও থাকে। শহরের পর্দায় নাগরিক ব্যবস্থাপনার বিশেষজ্ঞ অংশে সেগুলো দেখা যায়। প্রতিটি স্থানে একজন নাগরিক বসালে তিনি বিশেষজ্ঞ হন।
Each Specialist will generate a certain amount of yield as indicated to the right of the available slots. = প্রতিটি বিশেষজ্ঞ নির্দিষ্ট ফলন দেন; খালি স্থানগুলোর ডানদিকে তা দেখানো থাকে।
While these are a great way to specialize the yield production of a City outside of the surrounding Tile Yields, Specialists have an additional value. Each one also generates Great Person Points each turn. With enough of them, a new Great Person will join your Nation. = চারপাশের টালির ফলনের বাইরেও শহরের উৎপাদনকে বিশেষায়িত করার চমৎকার উপায় এটি। বিশেষজ্ঞের আরও মূল্য আছে—প্রত্যেকে প্রতি চালে মহান ব্যক্তির পয়েন্টও দেন। যথেষ্ট পয়েন্ট হলে নতুন মহান ব্যক্তি দেশে যোগ দেন।
Great People = মহান ব্যক্তিরা

Certain buildings, and specialists in cities, generate Great Person points per turn.\nThere are several types of Great People, and their points accumulate separately.\nThe number of points per turn and accumulated points can be viewed in the Overview screen. = কিছু ভবন ও শহরের বিশেষজ্ঞ প্রতি চালে মহান ব্যক্তির পয়েন্ট তৈরি করে।\nমহান ব্যক্তির কয়েকটি ধরন আছে, প্রতিটির পয়েন্ট আলাদা জমে।\nপ্রতি চালে পয়েন্ট ও মোট জমা পয়েন্ট সারসংক্ষেপ পর্দায় দেখা যায়।
Alternatively, the Great Person points breakdown per city can be viewed in each City Screen (see UI Tips article). = প্রতিটি শহরের পর্দায়ও মহান ব্যক্তির পয়েন্টের শহরভিত্তিক হিসাব দেখা যায়; ইন্টারফেসের পরামর্শ অংশ দেখুন।
Once enough points have been accumulated, a Great Person of that type will be created!\nEach Great Person can construct a certain Great Improvement which gives large yields over time, or immediately consumed to provide a certain bonus now. = যথেষ্ট পয়েন্ট জমলে সেই ধরনের একজন মহান ব্যক্তি তৈরি হন!\nপ্রত্যেকে বিশেষ কোনো মহান উন্নয়ন তৈরি করতে পারেন, যা দীর্ঘদিন প্রচুর ফলন দেয়; অথবা সঙ্গে সঙ্গে ব্যবহার করে তাৎক্ষণিক বোনাস নেওয়া যায়।
Great Improvements also provide any strategic resources that are under them, so you don't need to worry if resources are revealed underneath your improvements! = মহান উন্নয়নের নিচে কৌশলগত সম্পদ থাকলেও তা পাওয়া যায়। তাই উন্নয়নের নিচে নতুন সম্পদ প্রকাশ পেলেও দুশ্চিন্তা নেই!

Removing Terrain Features = ভূখণ্ডের বৈশিষ্ট্য সরানো
Certain tiles have terrain features - like Flood plains or Forests -  on top of them. Some of these layers, like Jungle, Marsh and Forest, can be removed by workers.\nRemoving the terrain feature does not remove any resources in the tile, and is usually required in order to add improvements exploiting those resources. = কিছু টালির ওপর প্লাবনভূমি বা বনের মতো বৈশিষ্ট্য থাকে। জঙ্গল, জলাভূমি ও বনের মতো কিছু স্তর কর্মী সরাতে পারে।\nবৈশিষ্ট্য সরালে টালির কোনো সম্পদ সরে না; সেসব সম্পদ ব্যবহারের উন্নয়ন তৈরি করতে সাধারণত আগে বৈশিষ্ট্য সরাতে হয়।

Natural Wonders, such as the Mt. Fuji, the Rock of Gibraltar and the Great Barrier Reef, are unique, impassable terrain features, masterpieces of mother Nature, which possess exceptional qualities that make them very different from the average terrain.\nThey benefit by giving you large sums of Culture, ⍾Science, Gold or Production if worked by your Cities, which is why you might need to bring them under your empire as soon as possible. = ফুজি পর্বত, জিব্রাল্টারের শিলা ও গ্রেট ব্যারিয়ার রিফের মতো প্রাকৃতিক বিস্ময় অনন্য, অগম্য ভূখণ্ডের বৈশিষ্ট্য—প্রকৃতির শিল্পকর্ম। অসাধারণ গুণে এগুলো সাধারণ ভূখণ্ড থেকে আলাদা।\nশহর সেখানে কাজ করলে প্রচুর সংস্কৃতি, ⍾বিজ্ঞান, সোনা বা উৎপাদন মেলে। তাই যত তাড়াতাড়ি সম্ভব সাম্রাজ্যের অন্তর্ভুক্ত করা দরকার হতে পারে।

Keyboard = কীবোর্ড
If you have a keyboard, some shortcut keys become available. Unit command or improvement picker keys, for example, are shown directly in their corresponding buttons. = কীবোর্ড থাকলে কিছু শর্টকাট কী ব্যবহার করা যায়। যেমন ইউনিটের আদেশ বা উন্নয়ন বাছার কী সংশ্লিষ্ট বোতামেই দেখানো থাকে।
On the world screen the hotkeys are as follows: = বিশ্ব পর্দায় শর্টকাট কীগুলো হলো:
Space or 'N' - Next unit or turn\n'E' - Empire overview (last viewed page)\n'+', '-' - Zoom in / out\nHome - center on capital or open its City Screen if already centered = Space বা 'N' - পরের ইউনিট বা চাল\n'E' - সাম্রাজ্যের সারসংক্ষেপ (শেষ দেখা পৃষ্ঠা)\n'+', '-' - কাছে / দূরে দেখুন\nHome - রাজধানীতে কেন্দ্রীভূত করুন; আগে থেকেই কেন্দ্রীভূত হলে শহরের পর্দা খুলুন
F1 - Open Civilopedia\nF2 - Empire overview Trades\nF3 - Empire overview Units\nF4 - Empire overview Diplomacy\nF5 - Social policies\nF6 - Technologies\nF7 - Empire overview Cities\nF8 - Victory Progress\nF9 - Empire overview Stats\nF10 - Empire overview Resources\nF11 - Quicksave\nF12 - Quickload = F1 - সভ্যতাকোষ খুলুন\nF2 - সারসংক্ষেপে বাণিজ্য\nF3 - সারসংক্ষেপে ইউনিট\nF4 - সারসংক্ষেপে কূটনীতি\nF5 - সামাজিক নীতি\nF6 - প্রযুক্তি\nF7 - সারসংক্ষেপে শহর\nF8 - বিজয়ের অগ্রগতি\nF9 - সারসংক্ষেপে পরিসংখ্যান\nF10 - সারসংক্ষেপে সম্পদ\nF11 - দ্রুত সংরক্ষণ\nF12 - দ্রুত লোড
Ctrl-R - Toggle tile resource display\nCtrl-Y - Toggle tile yield display\nCtrl-O - Game options\nCtrl-S - Save game\nCtrl-L - Load game\nCtrl-U - Toggle UI (World Screen only) = Ctrl-R - টালির সম্পদ দেখানো চালু/বন্ধ\nCtrl-Y - টালির ফলন দেখানো চালু/বন্ধ\nCtrl-O - খেলার সেটিংস\nCtrl-S - খেলা সংরক্ষণ\nCtrl-L - খেলা লোড\nCtrl-U - ইন্টারফেস দেখানো চালু/বন্ধ (শুধু বিশ্ব পর্দায়)
All of these can be reassigned. = এসব কীর দায়িত্ব বদলানো যায়।

This is where you spend most of your time playing Unciv. See the world, control your units, access other screens from here. = Unciv খেলার বেশিরভাগ সময় এখানেই কাটবে। এখান থেকে বিশ্ব দেখুন, ইউনিট নিয়ন্ত্রণ করুন ও অন্য পর্দায় যান।
①: The menu button - civilopedia, save, load, options... = ①: মেনু বোতাম—সভ্যতাকোষ, সংরক্ষণ, লোড, সেটিংস…
②: The player/nation whose turn it is - click for diplomacy overview. = ②: যার চাল চলছে সেই খেলোয়াড়/দেশ—কূটনীতির সারসংক্ষেপ দেখতে ক্লিক করুন।
③: The Technology Button - shows the tech tree which allows viewing or researching technologies. = ③: প্রযুক্তি বোতাম—প্রযুক্তির গাছ দেখায়, যেখান থেকে প্রযুক্তি দেখা বা গবেষণা করা যায়।
④: The Social Policies Button - shows enacted and selectable policies, and with enough culture points you can enact new ones. = ④: সামাজিক নীতি বোতাম—গৃহীত ও বাছাইযোগ্য নীতি দেখায়; যথেষ্ট সংস্কৃতি থাকলে নতুন নীতি গ্রহণ করতে পারেন।
⑤: The Diplomacy Button - shows the diplomacy manager where you can talk to other civilizations. = ⑤: কূটনীতি বোতাম—কূটনীতি ব্যবস্থাপনা দেখায়, যেখানে অন্য সভ্যতার সঙ্গে কথা বলা যায়।
⑥: Unit Action Buttons - while a unit is selected its possible actions appear here. = ⑥: ইউনিটের কাজের বোতাম—ইউনিট নির্বাচিত থাকলে তার সম্ভাব্য কাজগুলো এখানে দেখা যায়।
⑦: The unit/city info pane - shows information about a selected unit or city. = ⑦: ইউনিট/শহরের তথ্যফলক—নির্বাচিত ইউনিট বা শহরের তথ্য দেখায়।
⑧: The name (and unit icon) of the selected unit or city, with current health if wounded. Clicking a unit name or icon will open its civilopedia entry. = ⑧: নির্বাচিত ইউনিট বা শহরের নাম ও ইউনিটের প্রতীক; আহত হলে বর্তমান স্বাস্থ্যও দেখায়। ইউনিটের নাম বা প্রতীকে ক্লিক করলে সভ্যতাকোষের সংশ্লিষ্ট নিবন্ধ খোলে।
⑨: The arrow buttons allow jumping to the next/previous idle unit. = ⑨: তির বোতামে পরের/আগের নিষ্ক্রিয় ইউনিটে যাওয়া যায়।
⑩: For a selected unit, its promotions appear here, and clicking leads to the promotions screen for that unit. = ⑩: নির্বাচিত ইউনিটের প্রমোশন এখানে থাকে; ক্লিক করলে সেই ইউনিটের প্রমোশন পর্দা খোলে।
⑪: Remaining/per turn movement points, strength and experience / XP needed for promotion. For cities, you get its combat strength. = ⑪: অবশিষ্ট/প্রতি চালের চলাচল পয়েন্ট, শক্তি ও প্রমোশনের জন্য দরকারি অভিজ্ঞতা/XP। শহরের ক্ষেত্রে যুদ্ধশক্তি দেখায়।
⑫: This button closes the selected unit/city info pane. = ⑫: এই বোতাম নির্বাচিত ইউনিট/শহরের তথ্যফলক বন্ধ করে।
⑬: This pane appears when you order a unit to attack an enemy. On top are attacker and defender with their respective base strengths. = ⑬: ইউনিটকে শত্রু আক্রমণের আদেশ দিলে এই ফলক দেখা যায়। ওপরে আক্রমণকারী ও রক্ষাকারী এবং তাদের মৌলিক শক্তি থাকে।
⑭: Below that are strength bonuses or penalties and health bars projecting before / after the attack. = ⑭: তার নিচে শক্তির বোনাস বা শাস্তি এবং আক্রমণের আগে/পরে সম্ভাব্য স্বাস্থ্যের বার থাকে।
⑮: The Attack Button - let blood flow! = ⑮: আক্রমণ বোতাম—রক্ত ঝরুক!
⑯: The minimap shows an overview over the world, with known cities, terrain and fog of war. Clicking will position the main map. = ⑯: ছোট মানচিত্রে পরিচিত শহর, ভূখণ্ড ও যুদ্ধের কুয়াশাসহ বিশ্বের সারসংক্ষেপ দেখা যায়। ক্লিক করলে মূল মানচিত্র সেই স্থানে যায়।
⑰: To the side of the minimap are display feature toggling buttons - tile yield, worked indicator, show/hide resources. These mirror setting on the options screen and are hidden if you deactivate the minimap. = ⑰: ছোট মানচিত্রের পাশে টালির ফলন, কাজের চিহ্ন ও সম্পদ দেখানো/লুকানোর বোতাম রয়েছে। এগুলো সেটিংস পর্দার বিকল্পগুলোর প্রতিরূপ। ছোট মানচিত্র বন্ধ করলে বোতামগুলোও লুকায়।
⑱: Tile information for the selected hex - current or potential yield, terrain, effects, present units, city located there and such. Where appropriate, clicking a line opens the corresponding civilopedia entry. = ⑱: নির্বাচিত ষড়ভুজের তথ্য—বর্তমান বা সম্ভাব্য ফলন, ভূখণ্ড, প্রভাব, উপস্থিত ইউনিট, শহর ইত্যাদি। প্রযোজ্য ক্ষেত্রে কোনো লাইনে ক্লিক করলে সভ্যতাকোষের সংশ্লিষ্ট নিবন্ধ খোলে।
⑲: Notifications - what happened during the last 'next turn' phase. Some are clickable to show a relevant place on the map, some even show several when you click repeatedly. = ⑲: বিজ্ঞপ্তি—শেষ «পরের চাল» পর্যায়ে কী ঘটেছে। কিছুতে ক্লিক করলে মানচিত্রে সংশ্লিষ্ট স্থান দেখা যায়; বারবার ক্লিক করলে কোনোটিতে একাধিক স্থানও দেখায়।
⑳: The Next Turn Button - unless there are things to do, in which case the label changes to 'next unit', 'pick policy' and so on. = ⑳: পরের চাল বোতাম—কাজ বাকি থাকলে তার নাম «পরের ইউনিট», «নীতি বাছুন» ইত্যাদিতে বদলে যায়।
㉑: The Multiplayer Button - Here you can easily check your active multiplayer games. = ㉑: মাল্টিপ্লেয়ার বোতাম—এখানে সক্রিয় মাল্টিপ্লেয়ার খেলাগুলো সহজে দেখতে পারেন।
ⓐ: The overview button leads to the empire overview screen with various tabs (the last one viewed is remembered) holding vital information about the state of your civilization in the world. = ⓐ: সারসংক্ষেপ বোতাম সাম্রাজ্যের সারসংক্ষেপ পর্দায় নিয়ে যায়। বিভিন্ন ট্যাবে বিশ্বের মধ্যে আপনার সভ্যতার অবস্থার গুরুত্বপূর্ণ তথ্য থাকে; শেষ দেখা ট্যাব মনে রাখা হয়।
ⓑ: The ♪Culture icon shows accumulated ♪Culture and ♪Culture needed for the next policy - in this case, the exclamation mark tells us a next policy can be enacted. Clicking is another way to the policies manager. = ⓑ: ♪সংস্কৃতি প্রতীকে জমা ♪সংস্কৃতি ও পরের নীতির জন্য প্রয়োজনীয় ♪সংস্কৃতি দেখা যায়। এখানে বিস্ময়চিহ্ন জানায় যে নতুন নীতি গ্রহণ করা যায়। ক্লিক করেও নীতি ব্যবস্থাপনায় যাওয়া যায়।
ⓒ: Your known strategic resources are displayed here with the available (usage already deducted) number - click to go to the resources overview screen. = ⓒ: পরিচিত কৌশলগত সম্পদ ও ব্যবহার বাদ দেওয়ার পর অবশিষ্ট পরিমাণ এখানে দেখা যায়। ক্লিক করলে সম্পদের সারসংক্ষেপ পর্দা খোলে।
ⓓ: Happiness/unhappiness balance and either golden age with turns left or accumulated happiness with amount needed for a golden age is shown next to the smiley. Clicking also leads to the resources overview screen as luxury resources are a way to improve happiness. = ⓓ: হাসিমুখের পাশে সুখ/অসন্তোষের ভারসাম্য এবং স্বর্ণযুগের বাকি চাল অথবা জমা সুখ ও স্বর্ণযুগের জন্য প্রয়োজনীয় পরিমাণ থাকে। ক্লিক করলে সম্পদের সারসংক্ষেপ খোলে, কারণ বিলাসসম্পদ সুখ বাড়ায়।
ⓔ: The ⍾Science icon shows the number of ⍾Science points produced per turn. Clicking leads to the technology tree. = ⓔ: ⍾বিজ্ঞান প্রতীকে প্রতি চালে উৎপাদিত ⍾বিজ্ঞান পয়েন্ট দেখা যায়। ক্লিক করলে প্রযুক্তির গাছ খোলে।
ⓕ: Number of turns played with translation into calendar years. Click to see the victory overview. = ⓕ: খেলা চালের সংখ্যা ও ক্যালেন্ডার বছরের সমতুল্য। বিজয়ের সারসংক্ষেপ দেখতে ক্লিক করুন।
ⓖ: The number of gold coins in your treasury and income. Clicks lead to the Stats overview screen. = ⓖ: কোষাগারের সোনার মুদ্রা ও আয়। ক্লিক করলে পরিসংখ্যানের সারসংক্ষেপ খোলে।
ⓗ: The quantity of ☮Faith your citizens have generated, or 'off' if religion is disabled. Clicking it makes you go to the religion overview screen. = ⓗ: নাগরিকদের তৈরি ☮বিশ্বাসের পরিমাণ; ধর্ম বন্ধ থাকলে «বন্ধ» দেখায়। ক্লিক করলে ধর্মের সারসংক্ষেপ পর্দা খোলে।
ⓧ: In the center of all this - the world map! Here, the "X" marks a spot outside the map. Yes, unless the wrap option was used, Unciv worlds are flat. Don't worry, your ships won't fall off the edge. = ⓧ: সবকিছুর মাঝে বিশ্ব মানচিত্র! এখানে «X» মানচিত্রের বাইরের স্থান দেখায়। হ্যাঁ, প্রান্ত জোড়ার বিকল্প ব্যবহার না করলে Unciv-এর পৃথিবী সমতল। চিন্তা নেই, জাহাজ কিনারা থেকে পড়ে যাবে না।
ⓨ: By the way, here's how an empire border looks like - it's in the national colours of the nation owning the territory. = ⓨ: সাম্রাজ্যের সীমান্ত দেখতে এমন—জমির মালিক দেশের জাতীয় রঙে আঁকা।
ⓩ: And this is the red targeting circle that led to the attack pane back under ⑬. = ⓩ: আর এটাই সেই লাল লক্ষ্যবৃত্ত, যা ⑬-এর আক্রমণফলক খুলেছিল।
What you don't see: The phone/tablet's back button will pop the question whether you wish to leave Unciv and go back to Real Life. On desktop versions, you can use the ESC key. = যা দেখা যাচ্ছে না: ফোন/ট্যাবলেটের ফিরে যাওয়ার বোতাম চাপলে Unciv ছেড়ে বাস্তব জীবনে ফিরতে চান কি না জিজ্ঞেস করবে। ডেস্কটপে ESC চাপতে পারেন।

When at later stages of the game, you might have a lot of units but only a little to do. To help you we have implemented an AutoPlay feature that lets you use the AI to play part or all of your turn. = খেলার শেষদিকে অনেক ইউনিট থাকলেও কাজ কম থাকতে পারে। সাহায্যের জন্য স্বয়ংক্রিয় খেলার ব্যবস্থা আছে, যা দিয়ে AI-কে আপনার চালের কিছু অংশ বা পুরোটা খেলানো যায়।
To enable AutoPlay, go to options and open the AutoPlay tab and press "Show AutoPlay button". = স্বয়ংক্রিয় খেলা চালু করতে সেটিংসে তার ট্যাব খুলে «স্বয়ংক্রিয় খেলার বোতাম দেখান» চাপুন।
Clicking on the AutoPlay button opens a popup menue for choosing to AutoPlay parts or all of your turn. = স্বয়ংক্রিয় খেলার বোতামে ক্লিক করলে চালের কিছু অংশ বা পুরোটা স্বয়ংক্রিয়ভাবে খেলানোর মেনু খোলে।
Clicking Start AutoPlay in the pop-up menue or long pressing the AutoPlay button begins the multi-turn AutoPlay. This will play your next turns as if you were an AI. = মেনুতে «স্বয়ংক্রিয় খেলা শুরু» চাপলে অথবা স্বয়ংক্রিয় খেলার বোতাম দীর্ঘক্ষণ ধরে রাখলে একাধিক চালের স্বয়ংক্রিয় খেলা শুরু হয়। পরের চালগুলো আপনার হয়ে AI-এর মতো খেলা হবে।
To cancel multi-turn AutoPlay you can press the AutoPlay button, next turn button or open the options menue. = একাধিক চালের স্বয়ংক্রিয় খেলা থামাতে তার বোতাম, পরের চাল বোতাম অথবা সেটিংস মেনু খুলুন।
Multi-turn AutoPlay is not advised on harder difficulty levels as your AI will not play better against an AI with modifiers. = উচ্চ জটিলতায় একাধিক চালের স্বয়ংক্রিয় খেলা ব্যবহার না করাই ভালো; অতিরিক্ত সুবিধাপ্রাপ্ত প্রতিপক্ষ AI-এর বিরুদ্ধে আপনার AI ভালো খেলবে না।
Multi-turn AutoPlay for multiplayer is not yet supported. = মাল্টিপ্লেয়ারে একাধিক চালের স্বয়ংক্রিয় খেলা এখনও সমর্থিত নয়।

After building a shrine, your civilization will start generating ☮Faith. = উপাসনালয় তৈরি করলে সভ্যতা ☮বিশ্বাস উৎপাদন শুরু করে।
When enough ☮Faith has been generated, you will be able to found a pantheon. = যথেষ্ট ☮বিশ্বাস জমলে প্যান্থিয়ন স্থাপন করতে পারবেন।
A pantheon will provide a small bonus for your civilization that will apply to all cities that have it as a majority religion. = প্যান্থিয়ন সভ্যতাকে ছোট বোনাস দেয়, যা সেটিকে সংখ্যাগরিষ্ঠ ধর্ম হিসেবে মানে এমন সব শহরে প্রযোজ্য।
Each civilization can only choose a single pantheon belief, and each pantheon can only be chosen once. = প্রতিটি সভ্যতা একটিমাত্র প্যান্থিয়ন বিশ্বাস বাছতে পারে, এবং প্রতিটি প্যান্থিয়ন একবারই বাছা যায়।
Generating more ☮Faith will allow you to found a religion. = আরও ☮বিশ্বাস তৈরি করলে ধর্ম প্রতিষ্ঠা করতে পারবেন।

Keep generating ☮Faith, and eventually a great prophet will be born in one of your cities. = ☮বিশ্বাস তৈরি করতে থাকুন; একসময় আপনার কোনো শহরে মহান ধর্মগুরু জন্মাবেন।
This great prophet can be used for multiple things: Constructing a holy site, founding a religion and spreading your religion. = মহান ধর্মগুরু দিয়ে একাধিক কাজ হয়: পবিত্র স্থান নির্মাণ, ধর্ম প্রতিষ্ঠা ও নিজের ধর্ম প্রচার।
When founding your religion, you may choose another two beliefs. The founder belief will only apply to you, while the follower belief will apply to all cities following your religion. = ধর্ম প্রতিষ্ঠার সময় আরও দুটি বিশ্বাস বাছতে পারেন। প্রতিষ্ঠাতার বিশ্বাস শুধু আপনার ক্ষেত্রে প্রযোজ্য; অনুসারীর বিশ্বাস আপনার ধর্ম অনুসরণকারী সব শহরে প্রযোজ্য।
Additionally, the city where you used your great prophet will become the holy city of that religion. = যে শহরে মহান ধর্মগুরু ব্যবহার করেছেন, সেটি ওই ধর্মের পবিত্র শহরও হবে।
Once you have founded a religion, great prophets will keep being born every so often, though the amount of Faith☮ you have to save up will be higher. = ধর্ম প্রতিষ্ঠার পর মাঝেমধ্যেই মহান ধর্মগুরু জন্মাতে থাকবেন, তবে জমা করতে হওয়া বিশ্বাস☮-এর পরিমাণ বাড়বে।
One of these great prophets can then be used to enhance your religion. = তাঁদের একজনকে দিয়ে ধর্ম উন্নত করা যায়।
This will allow you to choose another follower belief, as well as an enhancer belief, that only applies to you. = তখন আরও একটি অনুসারীর বিশ্বাস ও একটি উন্নয়নকারীর বিশ্বাস বাছতে পারবেন; শেষেরটি শুধু আপনার ক্ষেত্রে প্রযোজ্য।
Do take care founding a religion soon, only about half the players in the game are able to found a religion! = শিগগির ধর্ম প্রতিষ্ঠার চেষ্টা করুন; খেলায় প্রায় অর্ধেক খেলোয়াড়ই কেবল ধর্ম প্রতিষ্ঠা করতে পারে!

Religion inside cities = শহরের মধ্যে ধর্ম
When founding a city, it won't follow a religion immediately. = নতুন শহর স্থাপনের সঙ্গে সঙ্গেই কোনো ধর্ম অনুসরণ করে না।
The religion a city follows depends on the total pressure each religion has within the city. = শহরে প্রতিটি ধর্মের মোট চাপের ওপর নির্ভর করে শহর কোন ধর্ম অনুসরণ করবে।
Followers are allocated in the same proportions as these pressures, and these followers can be viewed in the City Screen. = চাপের অনুপাতে অনুসারী বরাদ্দ হয়; শহরের পর্দায় তাঁদের দেখা যায়।
You are allowed to check religious followers and pressures in cities you do not own by selecting them. = নিজের নয় এমন শহর বেছেও তার ধর্মীয় অনুসারী ও চাপ দেখতে পারেন।
In both places, a tap/click on the icon of a religion will show detailed information with its effects. = দুই জায়গাতেই ধর্মের প্রতীকে ট্যাপ/ক্লিক করলে প্রভাবসহ বিস্তারিত তথ্য দেখা যায়।
Based on this, you can get a feel for which religions have a lot of pressure built up in the city, and which have almost none. = এ থেকে বুঝতে পারবেন শহরে কোন ধর্মের চাপ বেশি জমেছে, আর কোনটির প্রায় নেই।
The city follows a religion if a majority of its population follows that religion, and will only then receive the effects of Follower and Pantheon beliefs of that religion. = জনসংখ্যার বেশিরভাগ কোনো ধর্ম মানলে শহরটি সেই ধর্ম অনুসরণ করে; তখনই ওই ধর্মের অনুসারী ও প্যান্থিয়ন বিশ্বাসের প্রভাব পায়।

Spreading Religion = ধর্মের প্রচার
Spreading religion happens naturally, but can be sped up using missionaries or great prophets. = ধর্ম স্বাভাবিকভাবেই ছড়ায়, তবে ধর্মপ্রচারক বা মহান ধর্মগুরু দিয়ে তা দ্রুত করা যায়।
Missionaries can be bought in cities following a major religion, and will take the religion of that city. = পূর্ণাঙ্গ ধর্ম অনুসরণকারী শহরে ধর্মপ্রচারক কেনা যায়; তিনি সেই শহরের ধর্ম গ্রহণ করেন।
So do take care where you are buying them! If another civilization has converted one of your cities to their religion, missionaries bought there will follow their religion. = তাই কোথায় কিনছেন সাবধান! অন্য সভ্যতা আপনার শহরকে নিজের ধর্মে ধর্মান্তরিত করলে সেখানে কেনা ধর্মপ্রচারক তাদের ধর্মই মানবেন।
Great prophets always have your religion when they appear, even if they are bought in cities following other religions, but captured great prophets do retain their original religion. = মহান ধর্মগুরু জন্মালে সবসময় আপনার ধর্মই পান, এমনকি অন্য ধর্মের শহরে কেনা হলেও। তবে বন্দী করা মহান ধর্মগুরু তাঁদের মূল ধর্ম ধরে রাখেন।
Both great prophets and missionaries are able to spread religion to cities when they are inside its borders, even cities of other civilizations. = মহান ধর্মগুরু ও ধর্মপ্রচারক দুজনেই শহরের সীমানার মধ্যে থেকে ধর্ম ছড়াতে পারেন, অন্য সভ্যতার শহরেও।
These two units can even enter tiles of civilizations with whom you don't have an open borders agreement! = এই দুই ইউনিট এমন সভ্যতার টালিতেও ঢুকতে পারে যার সঙ্গে আপনার উন্মুক্ত সীমান্ত চুক্তি নেই!
But do take care, missionaries will lose 250 religious strength each turn they end while in foreign lands. = তবে সাবধান, বিদেশে চাল শেষ করলে ধর্মপ্রচারক প্রতি চালে 250 ধর্মীয় শক্তি হারান।
This diminishes their effectiveness when spreading religion, and if their religious strength ever reaches 0, they have lost their faith and disappear. = এতে ধর্ম ছড়ানোর কার্যকারিতা কমে। ধর্মীয় শক্তি 0 হলে তিনি বিশ্বাস হারিয়ে বিলুপ্ত হন।
When you do spread your religion, the religious strength of the unit is added as pressure for that religion. = ধর্ম প্রচার করলে ইউনিটের ধর্মীয় শক্তি সেই ধর্মের চাপ হিসেবে যোগ হয়।
Cities also passively add pressure of their majority religion to nearby cities. = শহরও আশপাশের শহরে নিজের সংখ্যাগরিষ্ঠ ধর্মের চাপ স্বয়ংক্রিয়ভাবে যোগ করে।
Each city provides +6 pressure per turn to all cities within 10 tiles, though the exact amount of pressure depends on the game speed. = প্রতিটি শহর 10 টালির মধ্যে সব শহরে প্রতি চালে +6 চাপ দেয়, তবে সঠিক পরিমাণ খেলার গতির ওপর নির্ভর করে।
This pressure can also be seen in the City Screen, and gives you an idea of how religions in your cities will evolve if you don't do anything. = শহরের পর্দায় এ চাপ দেখা যায়। কিছু না করলে নিজের শহরে ধর্ম কীভাবে বদলাবে তার ধারণা পাওয়া যায়।
Holy cities also provide +30 pressure of the religion founded there to themselves, making it very difficult to effectively convert a holy city. = পবিত্র শহর নিজের প্রতিষ্ঠিত ধর্মের +30 চাপ নিজের ওপরও যোগ করে, তাই পবিত্র শহরকে কার্যকরভাবে ধর্মান্তরিত করা খুব কঠিন।
Lastly, before founding a religion, new cities you settle will start with 200 pressure for your pantheon. = শেষত, ধর্ম প্রতিষ্ঠার আগে নতুন শহরগুলোতে নিজের প্যান্থিয়নের জন্য 200 চাপ দিয়ে শুরু হয়।
This way, all your cities will starting following your pantheon as long as you haven't founded a religion yet. = এভাবে ধর্ম প্রতিষ্ঠা না করা পর্যন্ত সব নতুন শহর আপনার প্যান্থিয়ন অনুসরণ করতে শুরু করে।

Inquisitors = ধর্মবিচারকরা
Inquisitors are the last religious unit, and their strength is removing other religions. = শেষ ধর্মীয় ইউনিট ধর্মবিচারক; তাঁর শক্তি হলো অন্য ধর্ম দূর করা।
They can remove all other religions from one of your own cities, removing any pressures built up. = নিজের কোনো একটি শহর থেকে তিনি সব অন্য ধর্ম মুছে দিতে পারেন, জমা চাপও সরিয়ে দেন।
Great prophets also have this ability, and remove all other religions in the city when spreading their religion. = মহান ধর্মগুরুরও এই ক্ষমতা আছে; নিজের ধর্ম ছড়ালে শহরের সব অন্য ধর্ম মুছে দেন।
Often this results in the city immediately converting to their religion = এতে প্রায়ই শহর সঙ্গে সঙ্গে তাঁর ধর্মে ধর্মান্তরিত হয়।
Additionally, when an inquisitor is stationed in or directly next to a city center, units of other religions cannot spread their faith there, though natural spread is unaffected. = ধর্মবিচারক শহরকেন্দ্রে বা তার একেবারে পাশে থাকলে অন্য ধর্মের ইউনিট সেখানে ধর্ম ছড়াতে পারে না; তবে স্বাভাবিক বিস্তার বাধা পায় না।

The Mayan unique ability, 'The Long Count', comes with a side effect: = মায়াদের বিশেষ ক্ষমতা «দীর্ঘ গণনা»-র একটি পার্শ্বপ্রভাব আছে:
Once active, the game's year display will use mayan notation. = এটি সক্রিয় হলে খেলার বছর মায়া পদ্ধতিতে দেখানো হয়।
The Maya measured time in days from what we would call 11th of August, 3114 BCE. A day is called K'in, 20 days are a Winal, 18 Winals are a Tun, 20 Tuns are a K'atun, 20 K'atuns are a B'ak'tun, 20 B'ak'tuns a Piktun, and so on. = মায়ারা আমাদের হিসেবে খ্রিস্টপূর্ব 3114 সালের 11 আগস্ট থেকে দিন গুনত। এক দিনের নাম K'in, 20 দিন এক Winal, 18 Winal এক Tun, 20 Tun এক K'atun, 20 K'atun এক B'ak'tun, 20 B'ak'tun এক Piktun, এভাবে চলত।
Unciv only displays ය B'ak'tuns, ඹ K'atuns and ම Tuns (from left to right) since that is enough to approximate gregorian calendar years. The Maya numerals are pretty obvious to understand. Have fun deciphering them! = Unciv শুধু ය B'ak'tun, ඹ K'atun ও ම Tun দেখায়, বাঁ থেকে ডানে; গ্রেগরীয় বছরের কাছাকাছি হিসাবের জন্য তা যথেষ্ট। মায়া সংখ্যাগুলো বোঝা সহজ। পাঠোদ্ধার করে মজা নিন!

Your cities will periodically demand different luxury goods to satisfy their desire for new things in life. = জীবনে নতুন জিনিসের চাহিদা মেটাতে শহরগুলো মাঝেমধ্যেই বিভিন্ন বিলাসদ্রব্য চাইবে।
If you manage to acquire the demanded luxury by trade, expansion, or conquest, the city will celebrate We Love The King Day for 20 turns. = বাণিজ্য, সম্প্রসারণ বা জয়ের মাধ্যমে চাওয়া বিলাসসম্পদ পেলে শহর 20 চাল ধরে «আমরা রাজাকে ভালোবাসি» দিবস পালন করবে।
During the We Love The King Day, the city will grow 25% faster. = এই দিবস চলাকালীন শহর 25% দ্রুত বাড়ে।
This means exploration and trade is important to grow your cities! = তাই শহর বড় করতে অনুসন্ধান ও বাণিজ্য গুরুত্বপূর্ণ!

Air Combat and Interception = বিমানযুদ্ধ ও বাধাদান
Air Combat is very similar to normal Combat, with a few wrinkles. Damage is still dealt using the same equations based on the relative Strength of the Attacking and Defending Unit. = বিমানযুদ্ধ সাধারণ যুদ্ধের মতোই, তবে কিছু পার্থক্য আছে। আক্রমণকারী ও প্রতিরক্ষাকারী ইউনিটের আপেক্ষিক শক্তির ভিত্তিতে একই সমীকরণে ক্ষতি হিসাব করা হয়।
However, before the Attacker and Defender fight, there is an added combat phase called Interception. If there is any unit with Interception Range that covers the target attacked tile, then it will attempt to Intercept the Attacking Air Unit. If multiple units can Intercept, the one with higher Intercept chance does it. = তবে আক্রমণকারী ও প্রতিরক্ষাকারীর লড়াইয়ের আগে বাধাদান নামে একটি অতিরিক্ত ধাপ থাকে। আক্রমণের লক্ষ্য টালিটি কোনো ইউনিটের বাধাদানের পাল্লার মধ্যে থাকলে সেই ইউনিট আক্রমণকারী বিমানকে বাধা দেওয়ার চেষ্টা করে। একাধিক ইউনিট বাধা দিতে পারলে যার সফল হওয়ার সম্ভাবনা বেশি, সেটিই বাধা দেয়।
Generally Land/Naval Units have an Intercept Range of 2 Tiles, and Air Units have an Intercept Range of their Attack Range. = সাধারণত স্থল ও নৌ ইউনিটের বাধাদানের পাল্লা 2 টালি, আর বিমান ইউনিটের ক্ষেত্রে তা আক্রমণের পাল্লার সমান।
Ground and Naval Units don't require movement points to Intercept, just Attacks. Air Units cannot have moved nor attacked in the preceding turn. = স্থল ও নৌ ইউনিটের বাধা দিতে চলাচলের পয়েন্ট লাগে না, শুধু একটি আক্রমণের সুযোগ লাগে। বিমান ইউনিট আগের চালে চলাচল বা আক্রমণ করে থাকলে বাধা দিতে পারে না।
The Intercepting Unit rolls to see if it hits. Whether it hits or not costs an Attack, and most units (without Promotions) can only Attack Once per Nation's Turn. It does NOT cost Movement Points, but Air Units that have used their Movement cannot Intercept between turns. = বাধাদানকারী ইউনিটের আঘাত লাগবে কি না তা দৈবভাবে নির্ধারিত হয়। আঘাত লাগুক বা না লাগুক, একটি আক্রমণের সুযোগ খরচ হয়। বেশির ভাগ ইউনিট প্রমোশন ছাড়া প্রতিটি জাতির চালে একবারই আক্রমণ করতে পারে। এতে চলাচলের পয়েন্ট খরচ হয় না, তবে যে বিমান তার চলাচলের সুযোগ ব্যবহার করেছে সেটি দুই চালের মাঝখানে বাধা দিতে পারে না।
If the Intercepting Unit Hits, it deals damage according to the Combat Strength calculation to the Attacking Air Unit, potentially with any Strength Bonuses that apply to Interception. It does not receive damage from the Attacking Air Unit. = বাধাদানকারী ইউনিট আঘাত করতে পারলে যুদ্ধশক্তির হিসাব অনুযায়ী আক্রমণকারী বিমানের ক্ষতি করে। বাধাদানের জন্য প্রযোজ্য শক্তির বোনাস এতে যুক্ত হতে পারে। আক্রমণকারী বিমানের কাছ থেকে এটি কোনো ক্ষতি পায় না।
After Interception resolves, the Attacking Air Unit and the Defending Unit in the targeted tile do Combat as normal, with damage dealt to both sides. = বাধাদান শেষ হলে আক্রমণকারী বিমান এবং লক্ষ্য টালির প্রতিরক্ষাকারী ইউনিটের মধ্যে স্বাভাবিক যুদ্ধ হয়, যাতে উভয় পক্ষের ক্ষতি হয়।
To help deal with Interceptions, see Air Sweeps. = বাধাদান মোকাবিলার জন্য আকাশে টহল আক্রমণ দেখুন।

Air Sweeps = আকাশে টহল আক্রমণ
Fighter units are able to perform Air Sweeps over a tile helping clear out potential enemy Air, Sea, or Land Interceptions that can reach that tile. = ফাইটার ইউনিট কোনো টালির ওপর টহল আক্রমণ চালাতে পারে। এতে ওই টালিতে পৌঁছাতে পারে এমন শত্রুর বিমান, নৌ বা স্থল ইউনিটের বাধাদানের সুযোগ আগেই খরচ করানো যায়।
While this Action will take an Attack, the benefit is drawing out Interceptions to help protect your other Air Units. Especially your Bombers. = এই কাজে একটি আক্রমণের সুযোগ খরচ হয়, তবে শত্রুকে বাধা দিতে প্ররোচিত করে আপনার অন্য বিমান ইউনিট, বিশেষত বোমারু বিমানকে রক্ষা করা যায়।
Your unit will always draw an Interception, if one can reach the target tile, even if the Intercepting unit has a chance to miss. = লক্ষ্য টালিতে পৌঁছাতে পারে এমন বাধাদানকারী থাকলে আপনার ইউনিট অবশ্যই তাকে বাধা দিতে প্ররোচিত করবে, তার আঘাত ব্যর্থ হওয়ার সম্ভাবনা থাকলেও।
If the Interceptor is not an Air Unit (eg Land or Sea), the Air Sweeping unit and Interceptor take no damage! = বাধাদানকারী বিমান ইউনিট না হলে, যেমন স্থল বা নৌ ইউনিট হলে, টহল আক্রমণকারী এবং বাধাদানকারী কেউই ক্ষতি পায় না!
If the Interceptor is an Air Unit, the two units will damage each other in a straight fight with no Interception bonuses. And only the Attacking Air Sweep Unit gets any Air Sweep strength bonuses. = বাধাদানকারী বিমান হলে দুই ইউনিট সরাসরি লড়ে এবং একে অপরের ক্ষতি করে; বাধাদানের কোনো বোনাস প্রযোজ্য হয় না। শুধু আক্রমণকারী টহল বিমানই টহল আক্রমণের শক্তির বোনাস পায়।

Fortify, Guard, Withdraw = সুরক্ষিত অবস্থান, পাহারা ও পশ্চাদপসরণ
Most Land units have the ability to Fortify. As they spend time without moving, they will slowly gain a Fortification Bonus to their Combat Strength representing digging in and preparing in case of an attack. = বেশির ভাগ স্থল ইউনিট সুরক্ষিত অবস্থান নিতে পারে। চলাচল না করে সময় কাটালে তারা ধীরে ধীরে যুদ্ধশক্তিতে প্রতিরক্ষা বোনাস পায়, যা অবস্থান মজবুত করে সম্ভাব্য আক্রমণের প্রস্তুতি বোঝায়।
Some units have the ability to Withdraw before a melee attack is struck. However, perhaps you wish for them to stand their ground to protect a particular tile. If you do, then give them the Guard command and they will stay fixed until they die or you give them fresh orders. = কিছু ইউনিট হাতাহাতি আক্রমণের আঘাত লাগার আগে পশ্চাদপসরণ করতে পারে। তবে কোনো টালি রক্ষার জন্য আপনি তাদের অবস্থান ধরে রাখতে চাইতে পারেন। সে ক্ষেত্রে পাহারা দেওয়ার আদেশ দিন। তারা মারা যাওয়া বা নতুন আদেশ পাওয়া পর্যন্ত সেখানেই থাকবে।
This is NOT the same as Fortify but they will still gain the Fortification Bonus. They will simply not utilize their Withdraw ability. Fortified units with the Withdraw ability will try to flee when attacked. = এটি সুরক্ষিত অবস্থান নেওয়ার সমান নয়, তবে তারা প্রতিরক্ষা বোনাস পাবে। তারা শুধু পশ্চাদপসরণের ক্ষমতা ব্যবহার করবে না। সুরক্ষিত অবস্থানে থাকা পশ্চাদপসরণে সক্ষম ইউনিট আক্রমণের মুখে পালানোর চেষ্টা করবে।

City Tile Blockade = শহরের টালি অবরোধ
One of your tiles is blocked by an enemy: when an enemy unit stands on a tile you own, the tile will not produce yields and cannot be worked by a city this turn. City will reallocate population from a blocked tile automatically. = আপনার একটি টালি শত্রু অবরুদ্ধ করেছে: শত্রু ইউনিট আপনার মালিকানাধীন টালিতে দাঁড়ালে সেটি এই চালে কোনো ফলন দেয় না এবং শহরের নাগরিক সেখানে কাজ করতে পারে না। শহর স্বয়ংক্রিয়ভাবে অবরুদ্ধ টালি থেকে নাগরিককে অন্যত্র সরিয়ে দেয়।
Enemy military land units block tiles they are standing on. Enemy military naval units additionally block adjacent water tiles. To protect your tiles from blockade, place a friendly military unit on it or fight off invaders. = শত্রুর স্থল সামরিক ইউনিট যে টালিতে দাঁড়ায় সেটি অবরুদ্ধ করে। শত্রুর নৌ সামরিক ইউনিট পাশাপাশি জলভাগের টালিও অবরুদ্ধ করে। অবরোধ ঠেকাতে টালিতে মিত্র সামরিক ইউনিট রাখুন অথবা আক্রমণকারীদের পরাস্ত করুন।

One of your cities is under a naval blockade! When all adjacent water tiles of a coastal city are blocked - city loses harbor connection to all other cities, including capital. Make sure to de-blockade cities by deploying friendly military naval units to fight off invaders. = আপনার একটি শহর নৌ অবরোধের মুখে! উপকূলীয় শহরের পাশাপাশি সব জলভাগের টালি অবরুদ্ধ হলে শহরটি রাজধানীসহ অন্য সব শহরের সঙ্গে হারবার সংযোগ হারায়। মিত্র নৌ সামরিক ইউনিট পাঠিয়ে আক্রমণকারীদের হটিয়ে শহরের অবরোধ তুলুন।

Spies! = গুপ্তচর!
The first time a civ reaches the Renaissance era each nation gets one spy. Every time a civ reaches an era afterwards they get one more spy. = কোনো সভ্যতা প্রথমবার রেনেসাঁ যুগে পৌঁছালে প্রতিটি জাতি একজন গুপ্তচর পায়। এরপর কোনো সভ্যতা যখনই নতুন যুগে পৌঁছায়, সেই সভ্যতা আরও একজন গুপ্তচর পায়।
Spies can be sent out to foreign cities to steal technology, rigging elections or stage coups. Place them in your own cities to do counter-intelligence work. = প্রযুক্তি চুরি, নির্বাচনে কারচুপি বা অভ্যুত্থান ঘটাতে গুপ্তচরকে বিদেশি শহরে পাঠানো যায়। প্রতিগোয়েন্দা কাজের জন্য তাদের নিজের শহরে রাখুন।
Only one spy per civ is allowed in each city. Spies that are not in any city are on vacation in your spy hideout. = প্রতিটি শহরে প্রতি সভ্যতার সর্বোচ্চ একজন গুপ্তচর থাকতে পারে। কোনো শহরে নিযুক্ত না থাকা গুপ্তচর আপনার গোপন আস্তানায় ছুটিতে থাকে।
Spies set up in cities of major civilizations will try to steal technology at a rate which is based off of the science production in the city. Succeeding to steal technology will level up your spy. Failing to succeed will level up the defending spy if it is present. = প্রধান সভ্যতার শহরে থাকা গুপ্তচর প্রযুক্তি চুরির চেষ্টা করে। চুরির অগ্রগতির হার শহরের বিজ্ঞান উৎপাদনের ওপর নির্ভর করে। প্রযুক্তি চুরি সফল হলে আপনার গুপ্তচরের পদমর্যাদা বাড়ে। ব্যর্থ হলে সেখানে প্রতিরক্ষাকারী গুপ্তচর উপস্থিত থাকলে তার পদমর্যাদা বাড়ে।
Spies set in city-states will try to rig the elections in order to gain influence and reduce the influence of other civilizations. Only one spy partaking in rigging the election can win. = শহর-রাজ্যে থাকা গুপ্তচর প্রভাব বাড়াতে এবং অন্য সভ্যতার প্রভাব কমাতে নির্বাচনে কারচুপির চেষ্টা করে। কারচুপিতে অংশ নেওয়া গুপ্তচরদের মধ্যে কেবল একজনই জিততে পারে।
A spy that is rigging an election in a city-state may also stage a coup. The likelihood of success for the coup depends on your relative influence to the current ally of the city-state, your spy level, and the level of the spy that the current ally has in the city-state if present. Succeeding a coup will make you their new ally and reduce the influence of all other civs. Failing a coup will kill your spy and level up the defending spy if present. = শহর-রাজ্যের নির্বাচনে কারচুপি করা গুপ্তচর অভ্যুত্থানও ঘটাতে পারে। সাফল্যের সম্ভাবনা নির্ভর করে শহর-রাজ্যের বর্তমান মিত্রের তুলনায় আপনার প্রভাব, আপনার গুপ্তচরের পদমর্যাদা এবং সেখানে বর্তমান মিত্রের গুপ্তচর থাকলে তার পদমর্যাদার ওপর। অভ্যুত্থান সফল হলে আপনি নতুন মিত্র হবেন এবং অন্য সব সভ্যতার প্রভাব কমবে। ব্যর্থ হলে আপনার গুপ্তচর মারা যাবে এবং প্রতিরক্ষাকারী গুপ্তচর থাকলে তার পদমর্যাদা বাড়বে।
Spies that are set up in your own cities will be conducting counter-intelligence. They reduce the success chance of other spies trying to steal your technology. = আপনার নিজের শহরে নিযুক্ত গুপ্তচর প্রতিগোয়েন্দা কাজ করে। তারা অন্য গুপ্তচরদের আপনার প্রযুক্তি চুরিতে সফল হওয়ার সম্ভাবনা কমায়।
Spies at a higher rank have a higher chance of success. The max rank a spy can reach is rank 3. After a spy is killed it will revive after a certain amount of turns back at rank 1. = উচ্চ পদমর্যাদার গুপ্তচরের সাফল্যের সম্ভাবনা বেশি। গুপ্তচর সর্বোচ্চ 3 পদমর্যাদায় পৌঁছাতে পারে। গুপ্তচর মারা গেলে কিছু চাল পরে 1 পদমর্যাদায় পুনরুজ্জীবিত হয়।
Building buildings like the constabulary and police station will reduce the technology steal rate of spies in that city. = কনস্ট্যাবুলারি ও পুলিশ স্টেশনের মতো ভবন বানালে সেই শহরে গুপ্তচরদের প্রযুক্তি চুরির হার কমে।
Espionage is available using the Gods and Kings ruleset. To enable it in a new game click advanced settings, then click on the Enable Espionage option. = Gods and Kings নিয়মাবলিতে গুপ্তচরবৃত্তি পাওয়া যায়। নতুন খেলায় এটি চালু করতে উন্নত সেটিংসে গিয়ে গুপ্তচরবৃত্তি চালু করার বিকল্পে চাপুন।

Keyboard Bindings = কীবোর্ডের কী নির্ধারণ
Limitations = সীমাবদ্ধতা
 # Requires translation!
This is a work in progress. = এটি একটি কাজ চলছে।
For technical reasons, only direct keys or Ctrl-Letter combinations can be used. = প্রযুক্তিগত কারণে শুধু সরাসরি একটি কী অথবা Ctrl ও অক্ষরের সমন্বয় ব্যবহার করা যায়।
Using the Keys page = কী পাতার ব্যবহার
Each binding has a button with an image looking like this: = প্রতিটি নির্ধারণের জন্য এমন ছবিযুক্ত একটি বোতাম থাকে:
While hovering the mouse over the key button, you can press a desired key directly to assign it. = কী বোতামের ওপর মাউস রেখে কাঙ্ক্ষিত কী চাপলে সেটি সরাসরি নির্ধারিত হয়।
Double-click the image to reset the binding to default. = পূর্বনির্ধারিত কী ফিরিয়ে আনতে ছবিতে দুবার ক্লিক করুন।
Bindings mapped to their default keys are displayed in gray, those reassigned by you in white. = পূর্বনির্ধারিত কী ধূসর রঙে এবং আপনার বদলানো কী সাদা রঙে দেখানো হয়।
Conflicting assignments are marked red. Conflicts can exist across categories, like World Screen / Unit Actions. Note that at the moment, the game does not prevent saving conflicting assignments, though the result may be unexpected. = একই কী একাধিক কাজে নির্ধারিত হলে লাল দেখায়। বিশ্ব পর্দা ও ইউনিটের কাজের মতো ভিন্ন বিভাগের মধ্যেও দ্বন্দ্ব থাকতে পারে। বর্তমানে খেলা এমন নির্ধারণ সংরক্ষণে বাধা দেয় না, তবে ফল অপ্রত্যাশিত হতে পারে।
For discussion about missing entries, see the linked github issue. = কোনো নির্ধারণ অনুপস্থিত থাকলে আলোচনার জন্য সংযুক্ত GitHub ইস্যু দেখুন।

Welcome to the Civilopedia! = সিভিলোপিডিয়ায় স্বাগতম!
Here you can find information - general help, rules, and what makes up the game world. = এখানে সাধারণ সাহায্য, নিয়ম এবং খেলার জগতের উপাদান সম্পর্কে তথ্য পাবেন।
How to find information = তথ্য খুঁজে পাওয়ার উপায়
Select categories with the buttons on top of the screen. Also up there is the button to leave Civilopedia and go back to where you were before. = পর্দার ওপরের বোতাম দিয়ে বিভাগ বেছে নিন। সিভিলোপিডিয়া থেকে আগে যেখানে ছিলেন সেখানে ফেরার বোতামও ওপরে আছে।
Each category has a list of entries on the left of the screen, sorted alphabetically (with few exceptions). Clicking an entry will update the center pane were you are currently reading this. = প্রতিটি বিভাগের বাঁ দিকে নিবন্ধের তালিকা থাকে, যা কয়েকটি ব্যতিক্রম ছাড়া বর্ণানুক্রমে সাজানো। কোনো নিবন্ধে চাপলে মাঝের এই পড়ার অংশটি বদলে যাবে।
Lines can link to other Civilopedia entries, they are marked with a chain link symbol like this one. You can click anywhere on the line to follow the link. = কিছু সারি অন্য সিভিলোপিডিয়া নিবন্ধের সংযোগ দেয়; সেগুলিতে এমন শিকলের চিহ্ন থাকে। সংযোগে যেতে সারির যেকোনো জায়গায় চাপুন।
The current category is special - all articles on general concepts are here. It is called 'Tutorials' because you can revisit these here, too. = বর্তমান বিভাগটি বিশেষ: সাধারণ ধারণার সব নিবন্ধ এখানে আছে। এখানে শিক্ষামূলক নির্দেশনাগুলিও আবার পড়া যায়, তাই এর নাম ‘নির্দেশনা’।
What information can I find = কী তথ্য পাওয়া যায়
The data shown is not dependent on your current game's situation, e.g. bonuses for the nation you are playing or difficulty modifiers will not affect the numbers. = দেখানো তথ্য আপনার বর্তমান খেলার অবস্থার ওপর নির্ভর করে না। যেমন, আপনার জাতির বোনাস বা জটিলতার পরিবর্তক সংখ্যাগুলিকে প্রভাবিত করে না।
However, it will reflect the mods you are playing! The combination of base ruleset and extension mods you select define the rules of a game, what objects exist and how they interact, and the Civilopedia mirrors these rules. = তবে আপনার ব্যবহৃত মডের প্রভাব এখানে দেখা যাবে! নির্বাচিত মূল নিয়মাবলি ও সম্প্রসারণ মড মিলে খেলার নিয়ম, কোন উপাদান থাকবে এবং তারা কীভাবে কাজ করবে তা নির্ধারণ করে। সিভিলোপিডিয়া সেই নিয়মই দেখায়।
If you opened the Civilopedia from the main menu, the "Ruleset" will be that of the last game you started. = প্রধান মেনু থেকে সিভিলোপিডিয়া খুললে সর্বশেষ শুরু করা খেলার নিয়মাবলি ব্যবহৃত হবে।
Letters can select categories, and when there are multiple categories matching the same letter, you can press that repeatedly to cycle between these. = অক্ষরের কী দিয়ে বিভাগ বাছা যায়। একই অক্ষরের সঙ্গে একাধিক বিভাগ মিললে বারবার সেটি চেপে বিভাগগুলির মধ্যে ঘুরে যেতে পারেন।
The arrow keys allow navigation as well - left/right for categories, up/down for entries. = তীরের কী দিয়েও চলাচল করা যায়: বাঁ ও ডান দিয়ে বিভাগ, ওপর ও নিচ দিয়ে নিবন্ধ বাছুন।

UI Tips = ইন্টারফেস ব্যবহারের পরামর্শ
World screen = বিশ্ব পর্দা
Skip all units to end a turn quickly = সব ইউনিট এড়িয়ে দ্রুত চাল শেষ করুন
Right-click or long press the "Next unit" button to open a popup menu which allows to end a turn without having to cycle through all units. If some units are automated, a dedicated button is available to move them before ending the turn. = ‘পরবর্তী ইউনিট’ বোতামে ডান ক্লিক বা দীর্ঘক্ষণ চাপলে একটি মেনু খুলবে। সেখান থেকে সব ইউনিট ঘুরে না দেখেই চাল শেষ করতে পারেন। স্বয়ংক্রিয় ইউনিট থাকলে চাল শেষ করার আগে তাদের চালানোর জন্য আলাদা বোতাম থাকে।
Toggle notification list display = বিজ্ঞপ্তির তালিকা দেখান বা লুকান
On the World screen, swipe the notification list to the right to temporarily hide it. Click the "Bell" button to display them again. = বিশ্ব পর্দায় বিজ্ঞপ্তির তালিকা ডান দিকে সোয়াইপ করে সাময়িকভাবে লুকান। আবার দেখাতে ঘণ্টা বোতামে চাপুন।
The default state for the notification list can be set in Options > Display > UI - Notifications on world screen. = বিজ্ঞপ্তির তালিকার পূর্বনির্ধারিত অবস্থা বিকল্প > প্রদর্শন > ইন্টারফেস - বিশ্ব পর্দায় বিজ্ঞপ্তি থেকে নির্ধারণ করা যায়।
Entering a City Screen quickly = দ্রুত শহরের পর্দায় প্রবেশ
You can Right-click or long press a city button on the World screen. The result is the same as tapping it twice - once to select and move the button, again to trigger a reaction: show the City Screen (if the city is yours to inspect), or offer the foreign city info popup. = বিশ্ব পর্দায় শহরের বোতামে ডান ক্লিক বা দীর্ঘক্ষণ চাপতে পারেন। এটি দুবার চাপার সমান: প্রথমবার বোতাম নির্বাচন ও সরানো হয়, দ্বিতীয়বার কাজ হয়। শহরটি দেখার অধিকার থাকলে শহরের পর্দা খোলে, নইলে বিদেশি শহরের তথ্য দেখায়।
Upgrade multiple units of the same type = একই ধরনের একাধিক ইউনিট উন্নীত করুন
On the World screen, select a unit that can be upgraded, then right-click or long press the "Upgrade" button to open a popup menu allowing to upgrade all units of this type at once. = বিশ্ব পর্দায় উন্নীত করা যায় এমন একটি ইউনিট বাছুন। তারপর ‘উন্নীত করুন’ বোতামে ডান ক্লিক বা দীর্ঘক্ষণ চাপলে একই ধরনের সব ইউনিট একসঙ্গে উন্নীত করার মেনু খুলবে।
In the Units overview, the same upgrade menu is available by clicking the unit icon in the "Upgrade" column. When a unit is upgradeable, the icon is lit if conditions are met (enough gold and/or resources), otherwise it is dimmed. = ইউনিটের সংক্ষিপ্ত বিবরণে ‘উন্নীত করুন’ কলামের ইউনিট চিহ্নে চাপলেও একই মেনু পাওয়া যায়। উন্নীত করার উপযুক্ত ইউনিটের জন্য যথেষ্ট সোনা এবং/অথবা সম্পদ থাকলে চিহ্নটি উজ্জ্বল দেখায়, নইলে ম্লান থাকে।
Additional controls for the construction queue = নির্মাণের সারির অতিরিক্ত নিয়ন্ত্রণ
Right-click or long press a construction item to open a popup menu with additional controls, allowing to manage production of the same item in all cities, by issuing the commands from the same City Screen. = নির্মাণের কোনো উপাদানে ডান ক্লিক বা দীর্ঘক্ষণ চাপলে অতিরিক্ত নিয়ন্ত্রণের মেনু খোলে। একই শহরের পর্দা থেকে আদেশ দিয়ে সব শহরে ওই উপাদানের উৎপাদন নিয়ন্ত্রণ করা যায়।
The "Disable" option (in a single city or all cities) moves an item to a separated "Disabled" tab, to prevent its automatic queueing by the "Auto-assign city production" option or to remove irrelevant objects from the production planning. To move a disabled item back to its initial place, re-enter its popup menu, and choose "Enable". = একটি বা সব শহরের জন্য ‘নিষ্ক্রিয় করুন’ বাছলে উপাদানটি আলাদা ‘নিষ্ক্রিয়’ ট্যাবে যায়। এতে ‘শহরের উৎপাদন স্বয়ংক্রিয়ভাবে নির্ধারণ’ সেটিকে সারিতে যোগ করে না এবং অপ্রয়োজনীয় উপাদান উৎপাদন পরিকল্পনা থেকে সরানো যায়। আগের জায়গায় ফেরাতে আবার মেনু খুলে ‘সক্রিয় করুন’ বাছুন।
Disabled items are set for the current game only and are carried over when founding a new city. = নিষ্ক্রিয় উপাদানের সেটিং শুধু বর্তমান খেলার জন্য থাকে এবং নতুন শহর প্রতিষ্ঠা করলেও প্রযোজ্য হয়।
Show Great Person Points breakdown = মহান ব্যক্তির পয়েন্টের বিস্তারিত দেখুন
In the right sidepanel, click a Great People row to display the details of Great Person Points (GPP) accumulated each turn by the current city, for this type of Great People. = ডান পাশের প্যানেলে মহান ব্যক্তির সারিতে চাপলে বর্তমান শহর প্রতি চালে ওই ধরনের মহান ব্যক্তির জন্য কত পয়েন্ট জমায় তার বিস্তারিত দেখা যায়।
Click any of the Great People icons to display all GPP accumulated each turn by the current city, for all types of Great People. = মহান ব্যক্তির যেকোনো চিহ্নে চাপলে বর্তমান শহর প্রতি চালে সব ধরনের মহান ব্যক্তির জন্য যত পয়েন্ট জমায় তা দেখা যায়।
Tech screen = প্রযুক্তির পর্দা
Queue multiple technologies in different branches = ভিন্ন শাখার একাধিক প্রযুক্তি সারিতে যোগ করুন
On the Tech screen, right-click or long press a technology to automatically queue it, even if this tech is in another branch than the item currently researched. Prerequisite techs to research will also be automatically queued. = প্রযুক্তির পর্দায় কোনো প্রযুক্তিতে ডান ক্লিক বা দীর্ঘক্ষণ চাপলে সেটি স্বয়ংক্রিয়ভাবে সারিতে যুক্ত হয়, বর্তমানে গবেষণারত প্রযুক্তির শাখা থেকে আলাদা হলেও। প্রয়োজনীয় পূর্বশর্ত প্রযুক্তিগুলিও স্বয়ংক্রিয়ভাবে সারিতে যোগ হয়।
Right-click or long press multiple techs to append them to the research queue, whatever their branch is. = শাখা নির্বিশেষে একাধিক প্রযুক্তিতে ডান ক্লিক বা দীর্ঘক্ষণ চেপে গবেষণার সারির শেষে যোগ করুন।
Overview screens = সংক্ষিপ্ত বিবরণের পর্দা
Reveal known resources on world screen = বিশ্ব পর্দায় পরিচিত সম্পদ দেখুন
In the Resources overview, click on a resource icon to center the world screen on tiles already discovered and providing this resource. = সম্পদের সংক্ষিপ্ত বিবরণে কোনো সম্পদের চিহ্নে চাপলে বিশ্ব পর্দা সেই সম্পদ দেয় এমন ইতিমধ্যে আবিষ্কৃত টালিতে কেন্দ্রীভূত হয়।
Alternatively, click on the "Unimproved" number to center the world screen only on owned (by you or your allied City-states) tiles where the resource is not improved. = অথবা ‘অনুন্নত’ সংখ্যায় চাপলে শুধু আপনার বা মিত্র শহর-রাজ্যের মালিকানাধীন, সম্পদের উন্নয়ন না হওয়া টালিতে বিশ্ব পর্দা কেন্দ্রীভূত হয়।
If more than one tile is available, click repeatedly on the notification to cycle through all of them. = এমন একাধিক টালি থাকলে বিজ্ঞপ্তিতে বারবার চেপে সেগুলি ঘুরে দেখুন।
Show diagram line colors = চিত্রের রেখার রং দেখুন
In Politics overview > Show diagram, you can click anywhere inside the diagram to display a table listing all relationship line colors and their meaning. = রাজনীতির সংক্ষিপ্ত বিবরণ > চিত্র দেখান-এ চিত্রের যেকোনো জায়গায় চাপলে সব সম্পর্কের রেখার রং ও অর্থের তালিকা দেখা যায়।
Reading "Toast" popups = ক্ষণস্থায়ী বার্তা পড়া
"Toasts" can be clicked to make them stay on the screen for easier reading. = ক্ষণস্থায়ী বার্তায় চাপলে সেটি পর্দায় থেকে যায়, যাতে সহজে পড়া যায়।
Click it again to close (or use the close button). = বন্ধ করতে আবার চাপুন অথবা বন্ধ করার বোতাম ব্যবহার করুন।
Miscellaneous = বিবিধ
External links = বাহ্যিক সংযোগ
External links support right-click or long press to copy the link to the clipboard instead of launching the browser. = বাহ্যিক সংযোগে ডান ক্লিক বা দীর্ঘক্ষণ চাপলে ব্রাউজার না খুলে সংযোগটি ক্লিপবোর্ডে কপি হয়।
Example: The 'Open Github page' button on the Mod management screen. = উদাহরণ: মড পরিচালনার পর্দায় ‘GitHub পাতা খুলুন’ বোতাম।
View change log = পরিবর্তনের তালিকা দেখুন
After updating, you might want to see what has changed. The "About" in "Options" has the version number linked to the change log. You can also see that info by clicking the version number on the main menu. = হালনাগাদের পরে কী বদলেছে দেখতে চাইতে পারেন। ‘বিকল্প’-এর ‘সম্পর্কে’ অংশে সংস্করণ সংখ্যার সঙ্গে পরিবর্তনের তালিকার সংযোগ থাকে। প্রধান মেনুতে সংস্করণ সংখ্যায় চাপলেও সেই তথ্য পাওয়া যায়।

Differences from Civilization V = Civilization V-এর সঙ্গে পার্থক্য
Production Focus\nIn Civilization V, the Food yield in a city is calculated first, then population grows by consuming stored food (growth), then production is calculated, and so on one by one the other stats are calculated. Thus, citizens can produce yields in the same turn as they are born. The city focus is set to Production to assign the newborn citizen to a hill so they'll contribute Production, and then manually reassigned to a growth tile on the next turn. Alternatively, you can set city focus to Gold (e.g. with Cerro de Potosi), Faith (e.g. with Mount Sinai) or whatever gains the most yields. In Unciv, citizens only start producing yields on the next turn, so you can ignore this whole concept. = উৎপাদনে অগ্রাধিকার\nCivilization V-এ প্রথমে শহরের খাদ্য ফলন হিসাব হয়। তারপর মজুত খাদ্য খরচ করে জনসংখ্যা বাড়ে, এরপর উৎপাদন এবং একে একে অন্য পরিসংখ্যান হিসাব হয়। ফলে নতুন নাগরিক জন্মের চালেই ফলন দিতে পারে। শহরের অগ্রাধিকার উৎপাদনে রাখলে নতুন নাগরিক পাহাড়ে কাজ করে উৎপাদন দেয়; পরের চালে তাকে হাতে করে বৃদ্ধির টালিতে সরানো হয়। অথবা সোনা (যেমন Cerro de Potosi), বিশ্বাস (যেমন Mount Sinai) বা সর্বোচ্চ ফলন দেয় এমন অন্য কিছুতে অগ্রাধিকার দিতে পারেন। Unciv-এ নাগরিক পরের চাল থেকে ফলন দেওয়া শুরু করে, তাই এই পুরো কৌশলটি উপেক্ষা করতে পারেন।
Science Queueing\nIn Civilization V, Science yield is calculated after production, so if you finish an item and have Science (or Gold) queued as a perpetual construction, the Production overflow from item will be converted into Science (or Gold), but the Production is not consumed, as this will only happen again on the next turn. By immediately swapping out your perpetual construction for an item on the next turn, you'll get this Science (or Gold) for free. This doesn't apply to Unciv, so don't bother. = বিজ্ঞানের উৎপাদন সারি\nCivilization V-এ উৎপাদনের পরে বিজ্ঞান ফলন হিসাব হয়। তাই কোনো উপাদান শেষ করার পরে সারিতে অবিরাম বিজ্ঞান বা সোনা উৎপাদন থাকলে উদ্বৃত্ত উৎপাদন বিজ্ঞান বা সোনায় বদলে যায়। কিন্তু উৎপাদন খরচ হয় না, কারণ তা আবার পরের চালেই হওয়ার কথা। পরের চালের শুরুতেই অবিরাম উৎপাদনের বদলে কোনো উপাদান বসালে ওই বিজ্ঞান বা সোনা বিনা খরচে পাওয়া যায়। Unciv-এ এটি প্রযোজ্য নয়, তাই এই কৌশল দরকার নেই।
Double Aqueducts\nIn Civilization V, the game sells existing copies of the building for you before providing a free copy of the building. So, if you build an aqueduct in a city, and then in the turn of adopting Tradition Complete you sell a cheap building (e.g a shrine) beforehand, the game is unable to sell more than 1 building per turn, and thus you'll keep your aqueduct, together with the new free aqueduct. Not applicable to Unciv. = দুটি জলপ্রণালি\nCivilization V-এ কোনো ভবন বিনা মূল্যে দেওয়ার আগে খেলাটি সেই ভবনের বিদ্যমান কপি বিক্রি করে। তাই শহরে জলপ্রণালি বানিয়ে ঐতিহ্য নীতিশাখা সম্পূর্ণ করার চালে আগে একটি সস্তা ভবন, যেমন উপাসনালয়, বিক্রি করলে খেলা আরেকটি ভবন বিক্রি করতে পারে না, কারণ প্রতি চালে 1টির বেশি ভবন বিক্রি হয় না। ফলে আগের ও নতুন বিনা মূল্যের দুটি জলপ্রণালিই থাকে। Unciv-এ এটি প্রযোজ্য নয়।
Legalism Oxford\nIn Civilization V, national wonders such as Oxford University are considered culture buildings, so you can get them for free with Legalism. Not applicable to Unciv. = বৈধতা নীতি ও Oxford\nCivilization V-এ Oxford University-এর মতো জাতীয় বিস্ময় সংস্কৃতির ভবন হিসেবে গণ্য হয়। তাই বৈধতা নীতির সাহায্যে সেগুলি বিনা মূল্যে পাওয়া যায়। Unciv-এ এটি প্রযোজ্য নয়।
Roads and Forts\nIn Civilization V, you can't use roads and forts in enemy territory. In Unciv, you can use them, so instead of mindlessly constructing them everywhere when at war, you need to decide if and when they'll benefit you more than your opponents. = রাস্তা ও দুর্গ\nCivilization V-এ শত্রুর ভূখণ্ডে রাস্তা ও দুর্গ ব্যবহার করা যায় না। Unciv-এ যায়। তাই যুদ্ধের সময় সর্বত্র এগুলি বানানোর আগে ভেবে দেখুন কখন সেগুলি প্রতিপক্ষের চেয়ে আপনার বেশি উপকারে আসবে।
Citizen Conversion\nIn Civilization V, a citizen is born religious if the parent city is already converted. This is not the case in Unciv, which can lead to temporary deconversion of a city when it grows. = নাগরিকের ধর্মান্তর\nCivilization V-এ শহর ইতিমধ্যে ধর্মান্তরিত হলে নতুন নাগরিক জন্ম থেকেই সেই ধর্মের অনুসারী হয়। Unciv-এ তা হয় না। ফলে জনসংখ্যা বাড়লে সাময়িকভাবে শহর তার ধর্ম হারাতে পারে।
Unassigned Citizens\nIn Civilization V, unassigned citizens are considered specialists, and subject to the same type of bonuses (e.g. Korea's ability). It can be worthwhile to leave citizens unassigned, instead of being assigned to a tile. Not applicable to Unciv. = কাজ না দেওয়া নাগরিক\nCivilization V-এ কাজ না দেওয়া নাগরিক বিশেষজ্ঞ হিসেবে গণ্য হয় এবং একই ধরনের বোনাস পায়, যেমন কোরিয়ার ক্ষমতার বোনাস। তাই টালিতে কাজ দেওয়ার বদলে নাগরিককে বেকার রাখাও লাভজনক হতে পারে। Unciv-এ এটি প্রযোজ্য নয়।
Settler Construction\nIn Civilization V, cities can't starve when constructing settlers, so you can assign all citizens to production tiles and none to food tiles. In Unciv, citizens keep consuming two food per turn. = বসতি স্থাপনকারী তৈরি\nCivilization V-এ বসতি স্থাপনকারী তৈরির সময় শহরে অনাহার হয় না। তাই সব নাগরিককে উৎপাদনের টালিতে রাখা যায়, খাদ্যের টালিতে কাউকে না রেখেও। Unciv-এ নাগরিক প্রতি চালে দুই খাদ্য খরচ করতেই থাকে।
Water Melee Attack\nAs result of a Discord poll, Water Melee units can attack military land units on the shore, unlike in Civilization V. = জলভাগ থেকে হাতাহাতি আক্রমণ\nDiscord-এর ভোটের ফল অনুযায়ী, Civilization V-এর বিপরীতে Unciv-এ জলভাগের হাতাহাতি ইউনিট তীরে থাকা স্থল সামরিক ইউনিটকে আক্রমণ করতে পারে।
Tile improvements\nIn Civilzation V, workers start working on an improvement-under-construction at the beginning of movement. Unciv changes this, to allow players to assign workers to tiles, and then reconsider and change improvement or move them elsewhere. = টালির উন্নতি\nCivilization V-এ চলাচলের শুরুতেই কর্মীরা নির্মাণাধীন উন্নতিতে কাজ শুরু করে। Unciv-এ তা বদলানো হয়েছে, যাতে খেলোয়াড় কর্মীকে টালিতে পাঠিয়ে পরে মত বদলে অন্য উন্নতি বাছতে বা তাকে অন্যত্র সরাতে পারেন।
Forest and Jungle Visibility\nIn Unciv, forests and jungles are visible 1 tile outside visibility range. In Civilization V, this is the behaviour of hills and mountains, but not of forests and jungles, yet jungle and forest can block hills, and hill + forest can block mountain, indicating they're on the same elevation. This is considered to be a bug in the otherwise well-structured visibility logic in Civilization V. = বন ও জঙ্গলের দৃশ্যমানতা\nUnciv-এ দৃশ্যসীমার বাইরে আরও 1 টালি পর্যন্ত বন ও জঙ্গল দেখা যায়। Civilization V-এ পাহাড় ও পর্বতের ক্ষেত্রে এটি হয়, কিন্তু বন ও জঙ্গলে হয় না। অথচ বন ও জঙ্গল পাহাড়কে আড়াল করতে পারে এবং পাহাড়ের ওপর বন পর্বতকে আড়াল করতে পারে, যা তাদের একই উচ্চতায় থাকার ইঙ্গিত দেয়। Civilization V-এর অন্যথায় সুসংগঠিত দৃশ্যমানতার নিয়মে এটিকে ত্রুটি হিসেবে ধরা হয়।
City razing\nIn Civilization V, the player can never raze any of the cities he/she founded. Not applicable to Unciv. = শহর ধ্বংস\nCivilization V-এ খেলোয়াড় নিজের প্রতিষ্ঠিত কোনো শহর ধ্বংস করতে পারেন না। Unciv-এ এই বাধা নেই।

Founding Cities\nThe Settler is a unit that can found a new city. You can build a Settler unit in a city with at least 2 population, and then move them to a good location to found a new city. This will usually be your main way of acquiring more cities. = শহর প্রতিষ্ঠা\nবসতি স্থাপনকারী ইউনিট নতুন শহর প্রতিষ্ঠা করতে পারে। অন্তত 2 জনসংখ্যার শহরে এটি তৈরি করুন এবং উপযুক্ত স্থানে নিয়ে গিয়ে নতুন শহর প্রতিষ্ঠা করুন। আরও শহর পাওয়ার প্রধান উপায় সাধারণত এটিই।
Food conversion to Production\nDuring the construction of a Settler, the city will not grow. Instead, the 1st, 2nd, 4th, and from there on every 4th, excess Food (Growth) is converted into Production, with the rest of the excess Food being lost. = খাদ্য থেকে উৎপাদন\nবসতি স্থাপনকারী তৈরির সময় শহর বাড়ে না। তার বদলে উদ্বৃত্ত খাদ্যের (বৃদ্ধি) 1ম, 2য়, 4র্থ এবং তারপর প্রতি 4র্থ খাদ্য উৎপাদনে বদলে যায়। বাকি উদ্বৃত্ত খাদ্য হারিয়ে যায়।

