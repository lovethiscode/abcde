Wu Zetian = উ জেতিয়ান
You won't ever be able to bother me again. Go meet Yama. = তুমি আর কখনো আমাকে বিরক্ত করতে পারবে না। যাও যমের সাথে দেখা কর।
Fool! I will disembowel you all! = বোকা! আমি তোমাদের সবাইকে ছাড়িয়ে দেব!
You have proven to be a cunning and competent adversary. I congratulate you on your victory. = আপনি একটি ধূর্ত এবং উপযুক্ত প্রতিপক্ষ হিসাবে প্রমাণিত হয়েছে. আপনার বিজয়ের জন্য আমি আপনাকে অভিনন্দন জানাই।
Greetings, I am Empress Wu Zetian. China desires peace and development. You leave us alone, we'll leave you alone. = শুভেচ্ছা, আমি সম্রাজ্ঞী উ জেতিয়ান। চীন শান্তি ও উন্নয়ন চায়। তুমি আমাদের একা ছেড়ে দাও, আমরা তোমাকে একা রেখে যাব।
My friend, do you think you can accept this request? = আমার বন্ধু, আপনি কি মনে করেন আপনি এই অনুরোধ গ্রহণ করতে পারেন?
How are you today? = আজ কেমন আছেন?
Oh. It's you? = ওহ. এটা আপনি?
Art of War = যুদ্ধের শিল্প
Heaven itself bends before your beauty, Empress Wu Zetian, ruler of eternal China! You lead one of the oldest and greatest civilization of humanity. In your time, China stood at the forefront of science and technology, bringing the world such contributions as gunpowder, the printing press, and the world of Confucius, and this, long before the rest of the world was mature enough to make the same discoveries! = স্বর্গ নিজেই আপনার সৌন্দর্যের সামনে নত, সম্রাজ্ঞী উ জেতিয়ান, শাশ্বত চীনের শাসক! আপনি মানবতার প্রাচীনতম এবং সর্বশ্রেষ্ঠ সভ্যতার নেতৃত্ব দেন। আপনার সময়ে, চীন বিজ্ঞান ও প্রযুক্তির অগ্রভাগে দাঁড়িয়েছিল, বিশ্বকে গানপাউডার, ছাপাখানা এবং কনফুসিয়াসের বিশ্বের মতো অবদান এনেছিল, এবং এটি, বাকি বিশ্বের একই আবিষ্কারগুলি করার জন্য যথেষ্ট পরিপক্ক হওয়ার অনেক আগেই!
Great Queen, can you make China prevail again, using your divine intelligence and beauty? China stands for greatness, and all its enemies will be dazzled soon enough! Will your new empire shine through the ages of history? = মহান রাণী, আপনি কি আপনার ঐশ্বরিক বুদ্ধিমত্তা এবং সৌন্দর্য ব্যবহার করে চীনকে আবার বিজয়ী করতে পারেন? চীন মহানতার পক্ষে দাঁড়িয়েছে, এবং তার সমস্ত শত্রু শীঘ্রই চমকে উঠবে! আপনার নতুন সাম্রাজ্য কি ইতিহাসের যুগে উজ্জ্বল হবে?
