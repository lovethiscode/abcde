Greetings. I believe this is a fair proposal for both parties. What do you think? = শুভেচ্ছা। আমি বিশ্বাস করি এটি উভয় পক্ষের জন্য একটি ন্যায্য প্রস্তাব। আপনি কি মনে করেন?
