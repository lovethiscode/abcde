Muahahahahahaha! = মুয়াহাহাহাহাহা!
Today comes a great searing pain. With you comes the path to the black storm. = আজ আসছে তীব্র দহনযন্ত্রণা। তোমার সঙ্গে আসে কালো ঝড়ের পথ।
