I am William of Orange, stadtholder of The Netherlands. Did you need anything? I still have a lot to do. = আমি নেদারল্যান্ডসের স্ট্যাডহোল্ডার, অরেঞ্জের উইলিয়াম। কিছু চাইছিলেন? আমার এখনও অনেক কাজ বাকি।
