Kamehameha I = कामेहामेहा प्रथम
The ancient fire flashing across the sky is what proclaimed that this day would come, though I had foolishly hoped for a different outcome. = आकाश में चमकती प्राचीन अग्नि ने घोषणा की थी कि यह दिन आएगा, हालाँकि मैंने मूर्खतावश अलग परिणाम की आशा की थी।
It is obvious now that I misjudged you and your true intentions. = अब स्पष्ट है कि मैंने आपको और आपके वास्तविक इरादों को गलत समझा।
The hard-shelled crab yields, and the lion lies down to sleep. Kanaloa comes for me now. = कठोर खोल वाला केकड़ा झुकता है और सिंह सोने लेट जाता है। अब कानालोआ मुझे लेने आता है।
The ocean's tide may rise and fall, but my resolve stands steady. = समुद्र का ज्वार उठे और गिरे, मेरा संकल्प अटल रहता है।
Aloha! Greetings and blessings upon you, friend. I am Kamehameha, Great King of this strand of islands. = अलोहा! मित्र, आपको नमस्कार और आशीर्वाद। मैं इन द्वीपों का महान राजा कामेहामेहा हूँ।
Come, let our people feast together! = आइए, हमारे लोग साथ भोज करें!
Welcome, friend! = स्वागत है मित्र!
Wayfinding = मार्गज्ञान
Aloha to Kamehameha the Great, who the heavens allowed to unite your people! O great King, under your reign, the Big Island of Hawai'i became one in 1791 AD, and many other islands joined your vision of union in 1810. As the first King of Hawai'i, law and taxation systems were stabilized, and you promoted the Kanawai Mamalahoe, an edict to protect civilian people in times of war. Unification and sovereignty of all the islands continued thanks to your fair laws and deeds, even after you joined your ancestors in paradise in 1819. = महान कामेहामेहा को अलोहा, जिन्हें स्वर्ग ने अपने लोगों को एकजुट करने दिया! हे महान राजा, आपके शासन में हवाई का बड़ा द्वीप 1791 ईस्वी में एक हुआ और 1810 में अनेक अन्य द्वीप आपके एकता के स्वप्न में शामिल हुए। हवाई के प्रथम राजा के रूप में आपने कानून और कर प्रणालियाँ स्थिर कीं तथा कनावाई मामालाहोए को बढ़ावा दिया, जो युद्धकाल में नागरिकों की रक्षा का आदेश था। आपके न्यायपूर्ण कानूनों और कार्यों के कारण सभी द्वीपों की एकता और संप्रभुता बनी रही, यहाँ तक कि 1819 में स्वर्ग में अपने पूर्वजों से मिलने के बाद भी।
Wise and benevolent King, will you unite your people once again by wearing the bright mantle of the Lion of the Pacific? Will your new empire shine through the ages of history? = बुद्धिमान और दयालु राजा, क्या आप प्रशांत के सिंह का उज्ज्वल चोगा पहनकर अपने लोगों को फिर एकजुट करेंगे? क्या आपका नया साम्राज्य इतिहास के युगों में चमकेगा?
