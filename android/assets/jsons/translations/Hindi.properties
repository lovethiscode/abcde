Shame that it has come this far. But ye wished it so. Next time, be so good, choose your words more wisely. = लज्जा है कि बात यहाँ तक पहुँची। किंतु आपने यही चाहा। अगली बार कृपा करके अपने शब्द अधिक सोचकर चुनें।
What a fool ye are! Ye will end swiftly and miserably. = आप कितने मूर्ख हैं! आपका अंत जल्दी और दयनीय होगा।
The world is pitiful! There's no beauty in it, no wisdom. I am almost glad to go. = विश्व दयनीय है! इसमें न सुंदरता है, न बुद्धि। मुझे जाने की लगभग खुशी है।
The archduchess of Austria welcomes your Eminence to... Oh let's get this over with! I have a luncheon at four o'clock. = ऑस्ट्रिया की आर्चडचेस महामहिम का स्वागत करती है... ओह, इसे जल्दी निपटाएँ! मुझे चार बजे भोजन पर जाना है।
I see you admire my new damask. Nobody should say that I am an unjust woman. Let's reach an agreement! = देखती हूँ आप मेरे नए रेशमी कपड़े की प्रशंसा करते हैं। कोई न कहे कि मैं अन्यायी हूँ। आइए समझौता करें!
Oh, it's ye! = ओह, आप हैं!
Diplomatic Marriage = कूटनीतिक विवाह
Noble and pious Queen Maria Theresa, Holy Roman Empress and sovereign of Austria, the people revere your grace. After the death of your father King Charles VI, you inherited the throne of Austria during difficult economic and military times. But you used your wisdom and unflinching determination to fend off your foes and resolve any obstacles to stability and prosperity. With your husband Francis Stephen at your side as co-ruler, you assured your place as Empress of the Holy Roman Empire. During your reign, you reformed Austria in several domains, as you gifted it with a powerful army, a stable economic model, and an improved educational system. = श्रेष्ठ और धर्मपरायण महारानी मारिया थेरेसा, पवित्र रोमन साम्राज्ञी और ऑस्ट्रिया की शासक, लोग आपकी कृपा का सम्मान करते हैं। पिता राजा चार्ल्स षष्ठम की मृत्यु के बाद कठिन आर्थिक और सैन्य समय में आपको ऑस्ट्रिया का सिंहासन मिला। किंतु आपने बुद्धि और अडिग संकल्प से शत्रुओं को रोका तथा स्थिरता और समृद्धि की बाधाएँ दूर कीं। सहशासक पति फ़्रांसिस स्टीफ़न के साथ आपने पवित्र रोमन साम्राज्य की महारानी के रूप में अपना स्थान सुनिश्चित किया। अपने शासन में आपने ऑस्ट्रिया के अनेक क्षेत्रों में सुधार करके उसे शक्तिशाली सेना, स्थिर आर्थिक मॉडल और बेहतर शिक्षा व्यवस्था दी।
O Great Queen, proud and dignified, by the will of God and the Divine right, can you reach the height of prosperity and splendor the kingdom of Austria deserves? Will your new empire shine through the ages of history? = हे गर्वीली, गरिमामयी महान महारानी, ईश्वर की इच्छा और दैवी अधिकार से क्या आप ऑस्ट्रिया को उसकी योग्य समृद्धि और वैभव के शिखर तक पहुँचा सकती हैं? क्या आपका नया साम्राज्य इतिहास के युगों में चमकेगा?
