Ramesses II = रामसेस द्वितीय
You are but a pest on this Earth, prepare to be eliminated! = आप इस धरती पर केवल एक कीट हैं, मिटा दिए जाने के लिए तैयार रहें!
You are a fool who evokes pity. You have brought my hostility upon yourself and your repulsive civilization! = आप दया के पात्र मूर्ख हैं। आपने स्वयं और अपनी घृणित सभ्यता पर मेरी शत्रुता बुला ली है!
Strike me down and my soul will torment yours forever, you have won nothing. = मुझे मार दीजिए, मेरी आत्मा आपकी आत्मा को सदा सताएगी; आपने कुछ नहीं जीता।
Greetings, I am Ramesses the god. I am the living embodiment of Egypt, mother and father of all civilizations. = नमस्कार, मैं देवता रामसेस हूँ। मैं सभी सभ्यताओं की माता और पिता, मिस्र का जीवित अवतार हूँ।
Generous Egypt makes you this offer. = उदार मिस्र आपको यह प्रस्ताव देता है।
Good day. = शुभ दिन।
Oh, it's you. = ओह, आप हैं।
Monument Builders = स्मारक निर्माता
O great Ramesses, Pharaoh of Egypt, bright as the Sun and mighty as the Nile! Lord of all living things, you lead the greatest of all civilizations, which has gifted the world with writing, advanced mathematics, sculpture, and architecture. Egyptian monuments and culture will continue to amaze the world for thousands of years. = हे महान रामसेस, मिस्र के फ़राओ, सूर्य जैसे उज्ज्वल और नील जैसे शक्तिशाली! सभी जीवों के स्वामी, आप उस महानतम सभ्यता का नेतृत्व करते हैं जिसने विश्व को लेखन, उन्नत गणित, मूर्तिकला और वास्तुकला दी। मिस्री स्मारक और संस्कृति हज़ारों वर्षों तक विश्व को विस्मित करते रहेंगे।
Mighty and eternal Ramesses, Egypt lasted for millenia, whereas other civilisations disappeared into dust after a few centuries. Amun-Ra blesses you again to lead Egypt and its people on the path of light. Will your new empire shine through the ages of history? = शक्तिशाली और शाश्वत रामसेस, मिस्र सहस्राब्दियों तक बना रहा, जबकि अन्य सभ्यताएँ कुछ शताब्दियों बाद धूल में मिल गईं। अमुन-रा आपको फिर आशीर्वाद देते हैं कि आप मिस्र और उसके लोगों को प्रकाश के पथ पर ले जाएँ। क्या आपका नया साम्राज्य इतिहास के युगों में चमकेगा?
