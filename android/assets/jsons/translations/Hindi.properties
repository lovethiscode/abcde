You've behaved yourself very badly, you know it. Now it's payback time. = आपने बहुत बुरा व्यवहार किया है, यह आप जानते हैं। अब बदला चुकाने का समय है।
You've mistaken my passion for a weakness, you'll regret about this. = आपने मेरे उत्साह को कमजोरी समझा, आपको इसका पछतावा होगा।
We were defeated, so this makes me your prisoner. I suppose there are worse fates. = हम हार गए हैं, इसलिए मैं आपकी बंदी हूँ। मेरा अनुमान है कि इससे भी बुरी नियतियाँ होती हैं।
Fine then. It's your call. = ठीक है। निर्णय आपका है।
I greet you, stranger! If you are as intelligent and tactful as you are attractive, we'll get along just fine. = नमस्कार अजनबी! यदि आप जितने आकर्षक हैं उतने ही बुद्धिमान और व्यवहारकुशल भी हैं, तो हमारी खूब बनेगी।
How would you like it if I propose this kind of exchange? = यदि मैं इस तरह का विनिमय प्रस्तावित करूँ, तो आपको कैसा लगेगा?
Hello! = नमस्ते!
What do you need?! = आपको क्या चाहिए?!
Siberian Riches = साइबेरियाई संपदा
Hail to Imperial Majesty Catherine, Empress of all Russians. Living in the largest country in the world, from the Pacific Ocean in the east to the Baltic Sea in the west, your people endured wars, droughts, and many disasters, imbuing the Russian society with heroism and tenacity, and producing artists and scientists among the best in the world. Russia is a powerful empire which rightfully claims its place in the world concert of superpowers. = सभी रूसियों की महारानी, राजसी कैथरीन को नमन। पूर्व में प्रशांत महासागर से पश्चिम में बाल्टिक सागर तक फैले विश्व के सबसे बड़े देश में रहने वाले आपके लोगों ने युद्ध, सूखे और अनेक आपदाएँ सहन कीं। इससे रूसी समाज में वीरता और दृढ़ता समाई और उसने विश्व के श्रेष्ठतम कलाकार व वैज्ञानिक पैदा किए। रूस एक शक्तिशाली साम्राज्य है जो महाशक्तियों की विश्व सभा में अपना स्थान उचित रूप से माँगता है।
Empress Catherine, your people are eager for Russian glory, to revive the sacred light of the Motherland. Will your new empire shine through the ages of history? = महारानी कैथरीन, आपके लोग रूस के गौरव और मातृभूमि के पवित्र प्रकाश को फिर जगाने के लिए उत्सुक हैं। क्या आपका नया साम्राज्य इतिहास के युगों में चमकेगा?
