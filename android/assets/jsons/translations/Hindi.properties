Great Attila, mighty warrior and leader of the Hunnic empire, your men bow down before you. During the 5th century, you and your brother Bleda have conquered many lands, forged a mighty empire and commanded the most powerful and frightening force of antiquity. You inspired fear to the Roman Emperors themselves, who called you 'Flagellum Dei', the 'Scourge of God', as you took kingdom after kingdom in the Balkans, invaded Eastern Roman Empire, into Gaul and Northern Italy, and planned to conquer Rome itself. Your empire didn't survive long after your death, but your name and your legend have, for millenia to come. = महान अत्तिला, शक्तिशाली योद्धा और हूण साम्राज्य के नेता, आपके पुरुष आपके सामने झुकते हैं। 5वीं शताब्दी में आपने और आपके भाई ब्लेडा ने अनेक भूमियाँ जीतीं, शक्तिशाली साम्राज्य बनाया और प्राचीन काल की सबसे शक्तिशाली तथा भयावह सेना की कमान सँभाली। रोमन सम्राट भी आपसे भय खाते थे और आपको 'फ़्लैजेलम देई', अर्थात 'ईश्वर का प्रकोप' कहते थे। आपने बाल्कन में एक के बाद एक राज्य जीता, पूर्वी रोमन साम्राज्य, गॉल और उत्तरी इटली पर आक्रमण किया और स्वयं रोम जीतने की योजना बनाई। आपकी मृत्यु के बाद आपका साम्राज्य अधिक समय नहीं रहा, किंतु आपका नाम और गाथा आने वाली सहस्राब्दियों तक जीवित रहे।
