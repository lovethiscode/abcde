You won't ever be able to bother me again. Go meet Yama. = आप फिर कभी मुझे परेशान नहीं कर पाएँगे। यम से मिलने जाइए।
Fool! I will disembowel you all! = मूर्ख! मैं आप सबकी आँतें निकाल दूँगी!
You have proven to be a cunning and competent adversary. I congratulate you on your victory. = आप एक चतुर और सक्षम प्रतिद्वंद्वी साबित हुए हैं। आपकी विजय पर बधाई।
Greetings, I am Empress Wu Zetian. China desires peace and development. You leave us alone, we'll leave you alone. = नमस्कार, मैं महारानी वू ज़ेतियान हूँ। चीन शांति और विकास चाहता है। आप हमें अकेला छोड़ें, हम आपको अकेला छोड़ेंगे।
My friend, do you think you can accept this request? = मित्र, क्या आप यह अनुरोध स्वीकार कर सकते हैं?
How are you today? = आज आप कैसे हैं?
Oh. It's you? = ओह। आप हैं?
Art of War = युद्धकला
Heaven itself bends before your beauty, Empress Wu Zetian, ruler of eternal China! You lead one of the oldest and greatest civilization of humanity. In your time, China stood at the forefront of science and technology, bringing the world such contributions as gunpowder, the printing press, and the world of Confucius, and this, long before the rest of the world was mature enough to make the same discoveries! = अनंत चीन की शासक महारानी वू ज़ेतियान, स्वर्ग स्वयं आपकी सुंदरता के सामने झुकता है! आप मानवता की सबसे पुरानी और महानतम सभ्यताओं में से एक का नेतृत्व करती हैं। आपके समय में चीन विज्ञान और प्रौद्योगिकी में सबसे आगे था; उसने विश्व को बारूद, मुद्रण यंत्र और कन्फ्यूशियस का विचार संसार दिया, और यह सब शेष विश्व के उन खोजों के योग्य होने से बहुत पहले हुआ!
Great Queen, can you make China prevail again, using your divine intelligence and beauty? China stands for greatness, and all its enemies will be dazzled soon enough! Will your new empire shine through the ages of history? = महान महारानी, क्या आप अपनी दिव्य बुद्धि और सुंदरता से चीन को फिर विजयी बना सकती हैं? चीन महानता का प्रतीक है और जल्द ही उसके सभी शत्रु चकाचौंध हो जाएँगे! क्या आपका नया साम्राज्य इतिहास के युगों में चमकेगा?
