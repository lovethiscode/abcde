Oda Nobunaga = ओदा नोबुनागा
I hereby inform you of our intention to wipe out your civilization from this world. = मैं आपको सूचित करता हूँ कि हमारा इरादा आपकी सभ्यता को इस विश्व से मिटाने का है।
Pitiful fool! Now we shall destroy you! = दयनीय मूर्ख! अब हम आपको नष्ट करेंगे!
You were much wiser than I thought. = आप मेरी अपेक्षा कहीं अधिक बुद्धिमान थे।
I expected more for you from. = मुझे आपसे अधिक की आशा थी।
We hope for a fair and just relationship with you, who are renowned for military bravery. = सैन्य वीरता के लिए प्रसिद्ध आपके साथ हम निष्पक्ष और न्यायपूर्ण संबंध की आशा रखते हैं।
I would be grateful if you agreed on the following proposal. = यदि आप निम्न प्रस्ताव स्वीकार करें तो मैं आभारी रहूँगा।
Oh, it's you... = ओह, आप हैं...
Bushido = बुशिडो
Lord Oda Nobunaga, ruler of Japan, the land of the Rising Sun is at your command! Through history, Japanese people lived and died with honor, proud of their rich culture of arts and letters. Years of bloody civil wars, invasions of foreign powers, wealth but also great poverty, have never altered the strong will of the Rising Sun island, as the Bushido spirit has imbued the fields of battle and the Japanese society for millenia. At the end of the 19th century, under foreign influence, your people took the path of modernity, and in a few decades, made of Japan a land of technological innovation and powerful industry, with which only few nations can compete. = जापान के शासक स्वामी ओदा नोबुनागा, उगते सूर्य की भूमि आपकी आज्ञा की प्रतीक्षा करती है! पूरे इतिहास में जापानी लोग सम्मान के साथ जिए और मरे तथा कला और साहित्य की समृद्ध संस्कृति पर गर्व करते रहे। रक्तरंजित गृहयुद्धों, विदेशी आक्रमणों, संपदा और घोर गरीबी के वर्षों ने उगते सूर्य के द्वीप के दृढ़ संकल्प को कभी नहीं बदला; बुशिडो की भावना सहस्राब्दियों से युद्धभूमि और जापानी समाज में बसी है। 19वीं शताब्दी के अंत में विदेशी प्रभाव के अधीन आपके लोगों ने आधुनिकता का मार्ग अपनाया और कुछ दशकों में जापान को तकनीकी नवाचार और शक्तिशाली उद्योग की ऐसी भूमि बनाया जिसकी बराबरी कुछ ही राष्ट्र कर सकते हैं।
O great daimyo, will you take on your hands the Japan destiny, for the Rising Sun to light the world? Will your new empire shine through the ages of history? = हे महान दाइम्यो, क्या आप जापान की नियति अपने हाथों में लेंगे, ताकि उगता सूर्य विश्व को आलोकित करे? क्या आपका नया साम्राज्य इतिहास के युगों में चमकेगा?
