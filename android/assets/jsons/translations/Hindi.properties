Only qualifying new games started with this new achievement catalog count. Old saves cannot gain eligibility by copying, importing or resaving. Use a built-in ruleset, one human major civilization, a generated map and an Ancient-era start, without mods or editor scenarios. = केवल इस नई उपलब्धि सूची के साथ शुरू किए गए योग्य नए खेल गिने जाते हैं। पुराने खेल को कॉपी, आयात या फिर सेव करने से पात्रता नहीं मिलती। अंतर्निहित नियम, एक मानव प्रमुख सभ्यता, उत्पन्न नक्शा और प्राचीन युग की शुरुआत चुनें; मॉड या संपादक के परिदृश्य न लें।
Ordinary save loading restores that branch's challenge history; earned medals stay unlocked. God mode, state-changing debug commands and full AI autoplay permanently disqualify that game, even after loading an older save. Normal Worker automation and exploration are allowed. The first formal victory or your defeat ends contributions; playing another turn does not count. = सामान्य सेव लोड करने पर उस शाखा का इतिहास लौटता है; पाए गए पदक खुले रहते हैं। देव मोड, स्थिति बदलने वाले डिबग आदेश और पूरा AI स्वचालित खेल उस खेल को स्थायी रूप से अयोग्य बनाते हैं, पुराने सेव पर लौटने से भी नहीं सुधरता। सामान्य श्रमिक स्वचालन और स्वतः खोज मान्य हैं। पहली आधिकारिक विजय या आपकी हार के बाद योगदान बंद होता है; एक और बारी नहीं गिनी जाती।
