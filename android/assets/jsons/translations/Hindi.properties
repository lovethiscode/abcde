Hiawatha = हियावथा
You are a plague upon Mother Earth! Prepare for battle! = आप धरती माता पर एक महामारी हैं! युद्ध के लिए तैयार हों!
You evil creature! My braves will slaughter you! = दुष्ट प्राणी! मेरे वीर आपको काट डालेंगे!
You have defeated us... but our spirits will never be vanquished! We shall return! = आपने हमें हराया है... किंतु हमारी आत्माएँ कभी नहीं हारेंगी! हम लौटेंगे!
Words alone cannot shake the roots of peace I have planted among my people. = केवल शब्द मेरे लोगों के बीच बोई गई शांति की जड़ों को हिला नहीं सकते।
Greetings, stranger. I am Hiawatha, speaker for the Iroquois. We seek peace with all, but we do not shrink from war. = नमस्कार अजनबी। मैं इरोक्वॉय का प्रवक्ता हियावथा हूँ। हम सबके साथ शांति चाहते हैं, किंतु युद्ध से पीछे नहीं हटते।
Does this trade work for you, my friend? = मित्र, क्या यह व्यापार आपको उचित लगता है?
The Great Warpath = महान युद्धपथ
Greetings, noble Hiawatha, leader of the mighty Iroquois nations! Your people lived near the great and holy lake Ontario since the ancient ages, on a land that will be later known as New York city. Long ago, the five peoples of Seneca, Onondaga, Mohawks, Cayugas and Oneida became one nation, the Haudenosaunee, the Iroquois. Although not having a written language, the wise Iroquois created the Great Law of Peace, which can be considered the first established constitution. For decades, your people fought powerful enemies, such as the Huron, and then the French and English colonists. With less warriors and inferior weaponry, the Iroquois still survived and walk on the path of peace and harmony, until their way of living faded away under the crush of the newborn United States nation. = शक्तिशाली इरोक्वॉय राष्ट्रों के नेता, श्रेष्ठ हियावथा को नमस्कार! आपके लोग प्राचीन काल से महान पवित्र ओंटारियो झील के पास उस भूमि पर रहते थे जिसे बाद में न्यूयॉर्क शहर कहा जाएगा। बहुत पहले सेनेका, ओनोंडागा, मोहॉक, कायूगा और ओनाइडा के पाँच समुदाय मिलकर हौडेनोशोनी, अर्थात इरोक्वॉय राष्ट्र बने। लिखित भाषा न होने पर भी बुद्धिमान इरोक्वॉय ने शांति का महान कानून बनाया, जिसे पहला स्थापित संविधान माना जा सकता है। दशकों तक आपके लोगों ने ह्यूरॉन और फिर फ़्रांसीसी व अंग्रेज़ उपनिवेशवादियों जैसे शक्तिशाली शत्रुओं से युद्ध किया। कम योद्धाओं और कमज़ोर हथियारों के बावजूद इरोक्वॉय जीवित रहे और शांति व सद्भाव के पथ पर चले, जब तक कि नवजात संयुक्त राज्य राष्ट्र के दबाव में उनकी जीवनशैली लुप्त नहीं हो गई।
Great Sachem Hiawatha, do you hear the complaints of your people? Can you light the path leading to the ancient Iroquois union? Will your new empire shine through the ages of history? = महान प्रमुख हियावथा, क्या आप अपने लोगों की शिकायतें सुनते हैं? क्या आप प्राचीन इरोक्वॉय संघ की ओर जाने वाला मार्ग आलोकित कर सकते हैं? क्या आपका नया साम्राज्य इतिहास के युगों में चमकेगा?
