George Washington = जॉर्ज वॉशिंगटन
Your wanton aggression leaves us no choice. Prepare for war! = आपकी निरंकुश आक्रामकता ने हमारे पास कोई विकल्प नहीं छोड़ा। युद्ध के लिए तैयार हों!
You have mistaken our love of peace for weakness. You shall regret this! = आपने हमारे शांतिप्रेम को कमजोरी समझा। आपको इसका पछतावा होगा!
The day...is yours. I hope you will be merciful in your triumph. = आज का दिन...आपका है। आशा है आप विजय में दयालु रहेंगे।
The people of the United States of America welcome you. = संयुक्त राज्य अमेरिका के लोग आपका स्वागत करते हैं।
Is the following trade of interest to you? = क्या इस व्यापार में आपकी रुचि है?
Well? = तो?
Manifest Destiny = प्रकट नियति
President Washington, we salute you and the proud American civilization! Freed from the British dominion in the 18th century, then cleansed and reborn after a terrible civil war, the United States nation was ready to play its great role in the 20th century. At the height of its power, triumphant after two terrible world wars, United States of America, a land of immigration, opportunities, optimism and determination, has risen above all other weakening nations, unable to equal such power. = राष्ट्रपति वॉशिंगटन, हम आपको और गौरवशाली अमेरिकी सभ्यता को सलाम करते हैं! 18वीं शताब्दी में ब्रिटिश प्रभुत्व से मुक्त होने और फिर एक भयानक गृहयुद्ध में तपकर पुनर्जन्म लेने के बाद संयुक्त राज्य राष्ट्र 20वीं शताब्दी में अपनी महान भूमिका निभाने को तैयार था। दो भयानक विश्व युद्धों में विजयी होकर अपनी शक्ति के शिखर पर पहुँचा संयुक्त राज्य अमेरिका, आप्रवास, अवसर, आशावाद और दृढ़ निश्चय की भूमि, उन सभी कमज़ोर होते राष्ट्रों से ऊपर उठ गया जो उसकी शक्ति की बराबरी नहीं कर सके।
President Washington, will you show to the world the legitimacy of the American way of life, and spread the flame of liberty to all mankind? Will your new empire shine through the ages of history? = राष्ट्रपति वॉशिंगटन, क्या आप विश्व को अमेरिकी जीवनशैली की वैधता दिखाएँगे और पूरी मानवता में स्वतंत्रता की ज्वाला फैलाएँगे? क्या आपका नया साम्राज्य इतिहास के युगों में चमकेगा?
