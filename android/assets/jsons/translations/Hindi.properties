Suleiman I = सुलेमान प्रथम
Your continued insolence and failure to recognize our preeminence leads us to war. = आपकी निरंतर धृष्टता और हमारी श्रेष्ठता स्वीकार न करना हमें युद्ध की ओर ले जाता है।
Good. The world shall witness the incontestable might of my armies and the glory of the Empire. = अच्छा। विश्व मेरी सेनाओं की निर्विवाद शक्ति और साम्राज्य का गौरव देखेगा।
Ruin! Ruin! Istanbul becomes Iram of the Pillars, remembered only by the melancholy poets. = विनाश! विनाश! इस्तांबुल खंभों वाला इरम बन गया, जिसे केवल उदास कवि याद करेंगे।
From the magnificence of Topkapi, the Ottoman nation greets you, stranger! I'm Suleiman, Kayser-I Rum, and I bestow upon you my welcome! = अजनबी, तोपकापी की भव्यता से उस्मानी राष्ट्र आपका अभिवादन करता है! मैं सुलेमान, कैसर-ए-रूम हूँ, और आपका स्वागत करता हूँ!
Let us do business! Would you be interested? = आइए व्यापार करें! क्या आपकी रुचि होगी?
Barbary Corsairs = बार्बरी समुद्री लुटेरे
O Great Sultan Suleiman, may the God bless you! You are revered for your power, wealth and generosity, and you truly deserves to be called the 'Magnificent'! The Ottoman Empire was born in Bithynia, starting as a small country in Eastern Anatolia in 12th century, then expanded to west into Anatolia. Over the next century, your people vanquished the empire of Byzantium, annexing Turkey and the Balkans, and smartly assimilating all wonders and knowledge of the Byzantine civilization. In the mid 15th century, the Ottomans added Constantinople to their empire, establishing a strategic link between Europe and the Middle East. The Empire would continue to expand for centuries reaching North Africa, Middle East and Eastern Europe at its height, but brutally disappeared in the chaos of the first world war, in early 20th century. = हे महान सुल्तान सुलेमान, ईश्वर आपको आशीर्वाद दें! आपकी शक्ति, संपदा और उदारता के लिए आपका सम्मान होता है और आप सचमुच 'महान' कहलाने योग्य हैं! उस्मानी साम्राज्य बिथीनिया में जन्मा; 12वीं शताब्दी में पूर्वी अनातोलिया के छोटे देश से शुरू होकर वह अनातोलिया में पश्चिम की ओर फैला। अगली शताब्दी में आपके लोगों ने बीज़ेंटाइन साम्राज्य को हराया, तुर्की और बाल्कन का विलय किया और बीज़ेंटाइन सभ्यता के सभी अजूबों व ज्ञान को चतुराई से अपनाया। 15वीं शताब्दी के मध्य में उस्मानियों ने कॉन्स्टैंटिनोपल को अपने साम्राज्य में जोड़कर यूरोप और मध्य पूर्व के बीच एक रणनीतिक कड़ी स्थापित की। साम्राज्य शताब्दियों तक फैलता रहा और अपने शिखर पर उत्तर अफ्रीका, मध्य पूर्व तथा पूर्वी यूरोप तक पहुँचा, किंतु 20वीं शताब्दी के आरंभ में प्रथम विश्व युद्ध की अराजकता में क्रूरतापूर्वक मिट गया।
Mighty Caliph, your people ask you to build again the Empire, to the level of power and glory it once achieved, and beyond! Will you revive the Ottoman golden age? Will your new empire shine through the ages of history? = शक्तिशाली खलीफ़ा, आपके लोग चाहते हैं कि आप साम्राज्य को फिर उसकी पुरानी शक्ति और गौरव तक, बल्कि उससे भी आगे ले जाएँ! क्या आप उस्मानी स्वर्ण-युग को पुनर्जीवित करेंगे? क्या आपका नया साम्राज्य इतिहास के युगों में चमकेगा?
