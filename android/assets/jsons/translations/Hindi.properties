Otto von Bismarck = ओटो फ़ॉन बिस्मार्क
I cannot wait until ye grow even mightier. Therefore, prepare for war! = मैं आपके और शक्तिशाली होने की प्रतीक्षा नहीं कर सकता। इसलिए युद्ध के लिए तैयार हों!
Corrupted villain! We will bring you into the ground! = भ्रष्ट दुष्ट! हम आपको मिट्टी में मिला देंगे!
Germany has been destroyed. I weep for the future generations. = जर्मनी नष्ट हो गया है। मैं भावी पीढ़ियों के लिए रोता हूँ।
That wild bravado? It's a ticking time bomb, especially when you're all bark and no bite! = यह जंगली शेखी? यह फटने को तैयार बम है, खासकर जब आप केवल भौंकते हैं, काटते नहीं!
Guten Tag. In the name of the great German people, I bid you welcome. = शुभ दिन। महान जर्मन जनता के नाम पर आपका स्वागत करता हूँ।
It would be in your best interest, to carefully consider this proposal. = इस प्रस्ताव पर ध्यान से विचार करना आपके ही हित में होगा।
What now? = अब क्या?
So, out with it! = तो बोलिए!
Furor Teutonicus = ट्यूटनिक प्रकोप
All hail to Otto von Bismarck, first chancellor of Germany and its empire! During the ancient era, Germany was a land fragmented in several tribes but already showed great promise as the Roman Empire itself struggled to bend the Germans to its will. Germany, as one nation, was slowly built on the ruins of the Holy Roman Empire, and waited 1871 to be finally unified after the glorious victory on France and Napoleon III. The German people are creative, intelligent, industrious and proven to be talented warriors through history. Despite great catastrophes and failures in the first half of the 20th century, Germany can always rely on its people will and strength to be among the greatest and powerful nations in the world. = जर्मनी और उसके साम्राज्य के प्रथम चांसलर ओटो फ़ॉन बिस्मार्क की जय हो! प्राचीन युग में जर्मनी अनेक जनजातियों में बँटा था, किंतु उसमें महान संभावनाएँ दिखती थीं, क्योंकि रोमन साम्राज्य भी जर्मनों को अपनी इच्छा के अधीन करने में संघर्ष करता था। एक राष्ट्र के रूप में जर्मनी पवित्र रोमन साम्राज्य के खंडहरों पर धीरे-धीरे बना और फ़्रांस तथा नेपोलियन तृतीय पर गौरवशाली विजय के बाद अंततः 1871 में एकीकृत हुआ। जर्मन लोग सृजनशील, बुद्धिमान और परिश्रमी हैं तथा पूरे इतिहास में कुशल योद्धा सिद्ध हुए हैं। 20वीं शताब्दी के पहले आधे भाग की भयंकर आपदाओं और विफलताओं के बावजूद जर्मनी विश्व के महानतम और शक्तिशाली राष्ट्रों में बने रहने के लिए अपने लोगों के संकल्प और शक्ति पर सदा भरोसा कर सकता है।
Great Prince Bismarck, glory and power are at the heart of the German nation. Your people are bright, and lend you their iron will to lead Germany once again. Will your new empire shine through the ages of history? = महान राजकुमार बिस्मार्क, गौरव और शक्ति जर्मन राष्ट्र के हृदय में हैं। आपके प्रतिभाशाली लोग जर्मनी का फिर नेतृत्व करने के लिए आपको अपना लौह संकल्प देते हैं। क्या आपका नया साम्राज्य इतिहास के युगों में चमकेगा?
