Darius I = दारा प्रथम
Your continue existence is an embarrassment to all leaders everywhere! You must be destroyed! = आपका जीवित रहना हर जगह के सभी नेताओं के लिए शर्म की बात है! आपका नष्ट होना आवश्यक है!
Curse you! You are beneath me, son of a donkey driver! I will crush you! = आपको धिक्कार है! गधावाले के पुत्र, आप मुझसे बहुत नीचे हैं! मैं आपको कुचल दूँगा!
You mongrel! Cursed be you! The world will long lament your heinous crime! = दोगले! आपको शाप लगे! विश्व आपके जघन्य अपराध पर लंबे समय तक शोक करेगा!
Peace be on you! I am Darius, the great and outstanding king of kings of great Persia... but I suppose you knew that. = आप पर शांति हो! मैं महान फ़ारस का महान और अतुलनीय राजाओं का राजा दारा हूँ... पर मेरा अनुमान है कि आप यह जानते थे।
In my endless magnanimity, I am making you this offer. You agree, of course? = अपनी असीम उदारता में मैं आपको यह प्रस्ताव देता हूँ। निस्संदेह आप सहमत हैं?
Good day to you! = आपका दिन शुभ हो!
Ahh... you... = आह... आप...
Achaemenid Legacy = हख़ामनी विरासत
Great King Darius of Persia, the heaven casts its light upon you! Persian people are strong and wise, as their leader. In old ages, the great Persian king Cyrus fought back the mighty Median empire and finally destroyed the Medes in 550 BC. Cunning diplomacy and military achievements helped then to conquer the wealthy Lydia and the powerful Babylon, Cyrus' son conquering the eternal Egypt some years later. At the height of its power, the Persian Empire reached the shores of Macedonia, at the very door of the upstart Greek city-states. Persia would have prospered for centuries if Alexander of Macedon hadn't brutally destroyed the great empire in one violent strike. = फ़ारस के महान राजा दारा, स्वर्ग आप पर प्रकाश बरसाता है! फ़ारसी लोग अपने नेता की तरह शक्तिशाली और बुद्धिमान हैं। प्राचीन काल में महान फ़ारसी राजा साइरस ने शक्तिशाली मादी साम्राज्य का प्रतिरोध किया और अंततः 550 ईसा पूर्व में मादियों को नष्ट कर दिया। कुशल कूटनीति और सैन्य उपलब्धियों ने उसे समृद्ध लीडिया और शक्तिशाली बाबुल जीतने में मदद की; कुछ वर्षों बाद साइरस के पुत्र ने शाश्वत मिस्र को जीता। अपने शिखर पर फ़ारसी साम्राज्य मकदूनिया के तटों तक, उभरते यूनानी नगर-राज्यों के द्वार तक पहुँचा। यदि मकदूनिया के सिकंदर ने एक हिंसक प्रहार में इस महान साम्राज्य को क्रूरतापूर्वक नष्ट न किया होता, तो फ़ारस शताब्दियों तक समृद्ध रहता।
King Darius, the people of Persia await, longing for its past glory and power! Persia of the Immortals must reborn, to punish its foes and rebuild the gleaming Persepolis! Will your new empire shine through the ages of history? = राजा दारा, फ़ारस के लोग उसके पुराने गौरव और शक्ति की लालसा में प्रतीक्षा कर रहे हैं! अमर सैनिकों के फ़ारस को पुनर्जन्म लेना होगा, अपने शत्रुओं को दंड देने और चमकते पर्सेपोलिस को फिर बनाने के लिए! क्या आपका नया साम्राज्य इतिहास के युगों में चमकेगा?
