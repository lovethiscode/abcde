By the grace of God, your days are numbered. = ईश्वर की कृपा से आपके दिन गिने जा चुके हैं।
We shall never surrender. = हम कभी आत्मसमर्पण नहीं करेंगे।
You have triumphed over us. The day is yours. = आप हम पर विजयी हुए हैं। आज का दिन आपका है।
Watch yourself, your pride will be your downfall. = सावधान रहिए, आपका अहंकार आपके पतन का कारण बनेगा।
