Contest Faith = आस्था प्रतियोगिता
The civilization with the largest Faith growth will gain a reward. = जिस सभ्यता की आस्था सबसे अधिक बढ़ेगी, उसे पुरस्कार मिलेगा।

Contest Technologies = तकनीक प्रतियोगिता
The civilization with the largest number of new Technologies researched will gain a reward. = जो सभ्यता सबसे अधिक नई तकनीकों का अनुसंधान करेगी, उसे पुरस्कार मिलेगा।

Invest = निवेश करें
Our people are rejoicing thanks to a tourism boom. For a certain amount of time, any Gold donation will yield [50]% extra Influence. = पर्यटन में उछाल से हमारे लोग आनंदित हैं। एक निश्चित अवधि के लिए स्वर्ण का कोई भी दान [50]% अतिरिक्त प्रभाव देगा।

Bully City State = नगर-राज्य को धमकाएँ
We are tired of the pretensions of [cityState]. If someone were to put them in their place by Demanding Tribute from them, they would be rewarded. = हम [cityState] के दिखावे से तंग आ चुके हैं। यदि कोई उससे कर माँगकर उसे उसकी जगह दिखाए, तो उसे पुरस्कार मिलेगा।

Denounce Civilization = सभ्यता की निंदा करें
We have been forced to pay tribute to [civName]! We need you to tell the world of their ill deeds. = हमें [civName] को कर देने को मजबूर किया गया है! हमें चाहिए कि आप विश्व को उनके बुरे काम बताएँ।

We have heard the tenets of [religionName] and are most curious. Will you send missionaries to teach us about your religion? = हमने [religionName] के सिद्धांत सुने हैं और बहुत उत्सुक हैं। क्या आप हमें अपने धर्म की शिक्षा देने के लिए धर्मप्रचारक भेजेंगे?


