Theodora = थियोडोरा
It is always a shame to destroy a thing of beauty. Happily, you are not one. = सुंदर वस्तु को नष्ट करना सदा दुखद है। सौभाग्य से आप ऐसी वस्तु नहीं हैं।
Now darling, tantrums are most unbecoming. I shall have to teach you a lesson. = प्रिय, ऐसे नखरे शोभा नहीं देते। मुझे आपको पाठ पढ़ाना होगा।
Like a child playing with toys you are. My people will never love you, nor suffer this indignation gracefully. = आप खिलौनों से खेलते बच्चे जैसे हैं। मेरे लोग न आपसे प्रेम करेंगे, न यह अपमान सहजता से सहेंगे।
My, isn't this a pleasant surprise - what may I call you, oh mysterious stranger? I am Theodora, beloved of Byzantium. = वाह, कितना सुखद आश्चर्य — रहस्यमय अजनबी, मैं आपको क्या कहूँ? मैं बीज़ेंटियम की प्रिय थियोडोरा हूँ।
I have heard that you adept at certain kinds of ... interactions. Show me. = सुना है आप कुछ प्रकार के... मेलजोल में निपुण हैं। मुझे दिखाइए।
Hello again. = फिर नमस्ते।
Patriarchate of Constantinople = कॉन्स्टैंटिनोपल का पितृसत्तात्मक धर्मपीठ
Magnificent Empress Theodora, beloved of Byzantium and of Rome, your people salute you! With your beauty and intelligence, you rose up from actress and courtesan to the rank of the most powerful woman in the Roman Empire, as wife of Justinian I. In the late 520's AD, you helped your husband engage in spiritual and legal reforms, promugalting numerous laws to improve women's status and treatment in the empire. You also made of Constantinople the jewel of the Eastern Roman Empire with the restoration and construction of many aqueducts, bridges, and churches, its beauty culminating with the creation of the Hagia Sophia, one of the most splendid pieces of architecture in the world. = बीज़ेंटियम और रोम की प्रिय भव्य महारानी थियोडोरा, आपके लोग आपको सलाम करते हैं! अपनी सुंदरता और बुद्धि से आप अभिनेत्री और गणिका से उठकर जस्टिनियन प्रथम की पत्नी के रूप में रोमन साम्राज्य की सबसे शक्तिशाली महिला बनीं। 520 के दशक के अंत में आपने पति को धार्मिक और कानूनी सुधार करने में मदद की तथा साम्राज्य में महिलाओं की स्थिति और व्यवहार सुधारने के अनेक कानून जारी किए। अनेक जलसेतुओं, पुलों और चर्चों की मरम्मत व निर्माण से आपने कॉन्स्टैंटिनोपल को पूर्वी रोमन साम्राज्य का रत्न भी बनाया, जिसकी सुंदरता विश्व की सबसे भव्य वास्तुकृतियों में से एक हागिया सोफिया के निर्माण से चरम पर पहुँची।
Beautiful Empress,the Byzantine Empire's magnificence is intact in all memories, and ready to reborn as the new jewel of humankind. Will your new empire shine through the ages of history? = सुंदर महारानी, बीज़ेंटाइन साम्राज्य की भव्यता सबकी स्मृतियों में सुरक्षित है और मानवता के नए रत्न के रूप में पुनर्जन्म को तैयार है। क्या आपका नया साम्राज्य इतिहास के युगों में चमकेगा?
