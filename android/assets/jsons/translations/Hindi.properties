Haile Selassie = हाइले सेलासी
I have tried all other avenues, but yet you persist in this madness. I hope, for your sake, your end is swift. = मैंने सभी अन्य उपाय आज़माए, फिर भी आप इस पागलपन पर अड़े हैं। आपके लिए आशा करता हूँ कि आपका अंत शीघ्र हो।
It is silence that allows evil to triumph. We will not stand mute and allow you to continue on this mad quest unchecked. = मौन ही बुराई को जीतने देता है। हम चुप रहकर आपको इस पागल अभियान पर अनियंत्रित आगे नहीं बढ़ने देंगे।
God and history will remember your actions this day. I hope you are ready for your impending judgment. = ईश्वर और इतिहास आज के आपके कार्य याद रखेंगे। आशा है आप अपने निकट आते न्याय के लिए तैयार हैं।
What a waste of time. = समय की कितनी बर्बादी।
A thousand welcomes to our fair nation. I am Selassie, the Ras Tafari Makonnen and Emperor of Ethiopia, your humble servant. = हमारे सुंदर राष्ट्र में आपका हज़ार बार स्वागत है। मैं सेलासी, रास तफ़ारी मकोनेन और इथियोपिया का सम्राट, आपका विनम्र सेवक हूँ।
I request that you consider this offer between our two peoples. I believe it will do us both good. = अनुरोध है कि हमारे दोनों लोगों के बीच इस प्रस्ताव पर विचार करें। मानता हूँ कि इससे हम दोनों का भला होगा।
Spirit of Adwa = अडवा की भावना
May God bless you, wise and righteous Emperor of Ethiopia, Haile Selassie. As one of Ethiopia's greatest rulers and a spiritual leader of the Rastafarian movement, your good influence on diplomacy and political cooperation are praised throughout the world. You created Ethiopia's first written constitution, and favorized democracy for years to come, your great wisdom making Ethiopia enter as a charter member in the United Nations. Always aiming to reform and modernize your nation, you changed Ethiopian destiny for the best. = इथियोपिया के बुद्धिमान न्यायप्रिय सम्राट हाइले सेलासी, ईश्वर आपको आशीर्वाद दें। इथियोपिया के महानतम शासकों में से एक और रस्ताफ़ारी आंदोलन के आध्यात्मिक नेता के रूप में कूटनीति और राजनीतिक सहयोग पर आपके अच्छे प्रभाव की पूरे विश्व में प्रशंसा होती है। आपने इथियोपिया का पहला लिखित संविधान बनाया और आने वाले वर्षों के लिए लोकतंत्र को बढ़ावा दिया। आपकी महान बुद्धि से इथियोपिया संयुक्त राष्ट्र का संस्थापक सदस्य बना। राष्ट्र को सुधारने और आधुनिक बनाने के निरंतर लक्ष्य से आपने इथियोपिया की नियति बेहतर बनाई।
Revered King, your knowledge and intelligence are required once again to protect your people from many threats in the world. Will you secure peace and stability, with benevolence and authority, in the radiance of the Kebra Nagast? Will your new empire shine through the ages of history? = पूजनीय राजा, विश्व के अनेक खतरों से अपने लोगों को बचाने के लिए फिर आपके ज्ञान और बुद्धि की आवश्यकता है। क्या आप केब्रा नागस्त के प्रकाश में दया और अधिकार से शांति व स्थिरता सुरक्षित करेंगे? क्या आपका नया साम्राज्य इतिहास के युगों में चमकेगा?
