#################### Lines from VictoryTypes from Civ V - Vanilla ####################

Complete all the spaceship parts to win! = जीतने के लिए अंतरिक्षयान के सभी पुर्ज़े पूरे करें!
spaceship parts = अंतरिक्षयान के पुर्ज़े
You have achieved victory through mastery of Science! You have conquered the mysteries of nature and led your people on a voyage to a brave new world! Your triumph will be remembered as long as the stars burn in the night sky! = आपने विज्ञान में महारत से विजय प्राप्त की है! आपने प्रकृति के रहस्यों पर विजय पाई और अपने लोगों को साहसपूर्ण नए विश्व की यात्रा पर ले गए! जब तक रात के आकाश में तारे जलेंगे, आपकी विजय याद की जाएगी!

Complete 5 policy branches and build the Utopia Project to win! = जीतने के लिए 5 नीति शाखाएँ पूरी करें और आदर्शलोक परियोजना बनाएँ!
You have achieved victory through the awesome power of your Culture. Your civilization's greatness - the magnificence of its monuments and the power of its artists - have astounded the world! Poets will honor you as long as beauty brings gladness to a weary heart. = आपने अपनी संस्कृति की अद्भुत शक्ति से विजय प्राप्त की है। आपकी सभ्यता की महानता, उसके स्मारकों की भव्यता और कलाकारों की शक्ति ने विश्व को विस्मित कर दिया! जब तक सुंदरता थके हृदय को खुशी देती रहेगी, कवि आपका सम्मान करेंगे।

Capture all enemy Capitals to win! = जीतने के लिए सभी शत्रु राजधानियाँ जीतें!
The world has been convulsed by war. Many great and powerful civilizations have fallen, but you have survived - and emerged victorious! The world will long remember your glorious triumph! = विश्व युद्ध से हिल गया है। अनेक महान और शक्तिशाली सभ्यताएँ गिर गईं, किंतु आप बचे रहे और विजयी हुए! विश्व लंबे समय तक आपकी गौरवशाली विजय याद रखेगा!

Build the UN and be voted world leader to win! = जीतने के लिए संयुक्त राष्ट्र बनाएँ और मतदान में विश्व नेता चुने जाएँ!
Anyone should build [buildingFilter] = किसी को भी [buildingFilter] बनाना होगा
Win diplomatic vote = कूटनीतिक मतदान जीतें
You have triumphed over your foes through the art of diplomacy! Your cunning and wisdom have earned you great friends - and divided and sown confusion among your enemies! Forever will you be remembered as the leader who brought peace to this weary world! = आपने कूटनीति की कला से शत्रुओं पर विजय पाई! आपकी चतुराई और बुद्धि ने महान मित्र बनाए तथा शत्रुओं में फूट और भ्रम बोया! थके हुए विश्व में शांति लाने वाले नेता के रूप में आपको सदा याद किया जाएगा!

Do things to win! = जीतने के लिए कार्य करें!
Have highest score after max turns = अधिकतम चालों के बाद सर्वोच्च अंक पाएँ


