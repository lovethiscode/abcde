We are no strangers to war. You have strayed from the right path, and now we will correct it. = युद्ध हमारे लिए नया नहीं है। आप सही मार्ग से भटक गए हैं और अब हम इसे सुधारेंगे।
You are nothing but a glorified barbarian. Cruel, and ruthless. = आप महिमामंडित बर्बर के सिवा कुछ नहीं। क्रूर और निर्दयी।
