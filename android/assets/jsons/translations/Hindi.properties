Pachacuti = पचाकुति
Resistance is futile! You cannot hope to stand against the mighty Incan empire. If you will not surrender immediately, then prepare for war! = प्रतिरोध व्यर्थ है! आप शक्तिशाली इंका साम्राज्य का सामना करने की आशा नहीं कर सकते। यदि तुरंत आत्मसमर्पण नहीं करेंगे, तो युद्ध के लिए तैयार हों!
Declare war on me?!? You can't, because I declare war on you first! = मुझ पर युद्ध घोषित करेंगे?!? आप नहीं कर सकते, क्योंकि मैं पहले आप पर युद्ध घोषित करता हूँ!
How did you darken the sun? I ruled with diligence and mercy—see that you do so as well. = आपने सूर्य को कैसे अंधकारमय किया? मैंने परिश्रम और दया से शासन किया — ध्यान रखें कि आप भी ऐसा करें।
How are you? You stand before Pachacuti Inca Yupanqui. = आप कैसे हैं? आप पचाकुति इंका युपांकी के सामने खड़े हैं।
The Incan people offer this fair trade. = इंका लोग यह निष्पक्ष व्यापार प्रस्तुत करते हैं।
How are you doing? = आपका क्या हाल है?
What do you want now? = अब आपको क्या चाहिए?
Great Andean Road = महान एंडीज़ मार्ग
King Pachacuti Sapa Inca, maker of the world and ruler of Tawantinsuyu and the Inca people, your loyal subjects greet you! In the beginning, the small state of Cusco already showed the Incans were promised for greatness. They won many wars against powerful enemies, relentlessly crushing any army that dared oppose them, and forged a mighty empire stretching from Ecuador to Chile, the greatest ever seen in pre-Columbian America. Not just undaunted soldiers, Inca people were accomplished builders and artists, their magnificient and unequalled culture still fascinating the world today. = विश्व के निर्माता तथा तवांतिन्सुयू और इंका लोगों के शासक, राजा पचाकुति सापा इंका, आपकी वफ़ादार प्रजा आपको नमस्कार करती है! आरंभ में कुस्को के छोटे राज्य ने ही दिखा दिया कि इंका महानता के लिए बने हैं। उन्होंने शक्तिशाली शत्रुओं के विरुद्ध अनेक युद्ध जीते, विरोध करने का साहस करने वाली हर सेना को निरंतर कुचला और इक्वाडोर से चिली तक फैला शक्तिशाली साम्राज्य बनाया, जो कोलंबस-पूर्व अमेरिका का सबसे महान साम्राज्य था। केवल निर्भीक सैनिक ही नहीं, इंका लोग कुशल निर्माता और कलाकार भी थे; उनकी भव्य बेजोड़ संस्कृति आज भी विश्व को मोहित करती है।
O Emperor Pachacuti, honor your name of 'Earth Shaker'! Will you once again summon the power of the earth to unite all Incan people under the protection of Sapa Inca, the Son of the Sun? Will your new empire shine through the ages of history? = हे सम्राट पचाकुति, 'धरती हिलाने वाले' नाम का सम्मान करें! क्या आप सूर्य के पुत्र सापा इंका के संरक्षण में सभी इंका लोगों को एक करने के लिए फिर धरती की शक्ति बुलाएँगे? क्या आपका नया साम्राज्य इतिहास के युगों में चमकेगा?
