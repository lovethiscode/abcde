Harald Bluetooth = हेराल्ड ब्लूटूथ
If I am to be honest, I tire of those pointless charades. Why don't we settle our disputes on the field of battle, like true men? Perhaps the skalds will sing of your valor... or mine! = सच कहूँ तो मैं इन व्यर्थ नाटकों से ऊब गया हूँ। सच्चे पुरुषों की तरह अपने विवाद युद्धभूमि में क्यों न सुलझाएँ? शायद कवि आपकी वीरता गाएँ... या मेरी!
Ahahah! You seem to show some skills of a true Viking! Too bad that I'll probably kill you! = आहाहा! आपमें सच्चे वाइकिंग के कुछ कौशल दिखाई देते हैं! अफ़सोस कि मैं शायद आपको मार दूँगा!
Loki must have stood by you, for a common man alone could not have defeated me... Oh well! I will join the einherjar in Valhalla and feast, while you toil away here. = लोकी अवश्य आपके साथ था, क्योंकि अकेला सामान्य मनुष्य मुझे हरा नहीं सकता था... अच्छा! मैं वल्हल्ला में वीर आत्माओं के साथ भोज करूँगा, जबकि आप यहीं परिश्रम करते रहेंगे।
Our future battle will be glorious! = हमारा भावी युद्ध गौरवशाली होगा!
Harald Bluetooth bids you welcome to his lands, a Viking unlike any the seas and lands have ever known! Hah, are you afraid? = हेराल्ड ब्लूटूथ अपनी भूमि में आपका स्वागत करता है, ऐसा वाइकिंग जिसे समुद्र और धरती ने पहले कभी नहीं देखा! हा, क्या आप डर गए?
This is a fine deal! Even a drunk beggar would agree! = यह बढ़िया सौदा है! शराबी भिखारी भी मान जाएगा!
Hail to you. = आपको नमन।
Viking Fury = वाइकिंग प्रकोप
Skal, Harald Bluetooth Gormsson, son of King Gorm of the Old and Thyra Dannebod! After crushing the armies of Norway, you achieved great construction projects all across the land of mighty Denmark. Numerous Ring Fortresses were built under your reign to protect the people from foreign invasions, but also from local quarrels. In 983 AD, you successfully repelled several waves of German settlers trying to colonize your land, and then always kept your kingdom free from any foreign pressure. = राजा गॉर्म द ओल्ड और थाइरा दानेबोद के पुत्र हेराल्ड ब्लूटूथ गॉर्मसन को सलाम! नॉर्वे की सेनाओं को कुचलने के बाद आपने शक्तिशाली डेनमार्क में महान निर्माण परियोजनाएँ पूरी कीं। आपके शासन में विदेशी आक्रमणों और स्थानीय झगड़ों से लोगों की रक्षा के लिए अनेक वृत्ताकार किले बनाए गए। 983 ईस्वी में आपने अपनी भूमि को उपनिवेश बनाने का प्रयास कर रहे जर्मन बसनेवालों की कई लहरें सफलतापूर्वक खदेड़ीं और फिर अपने राज्य को विदेशी दबाव से सदा मुक्त रखा।
As a true Viking, who knows not fear, time has come to unleash mighty armies of Northsmen to bring despair upon your enemies! By the will of the Gods, it will be either a glorious triumph or a sumptuous feast in the Valhalla! Will your new empire shine through the ages of history? = भय से अनजान सच्चे वाइकिंग के रूप में अब समय है कि उत्तरवासियों की शक्तिशाली सेनाएँ छोड़कर अपने शत्रुओं में निराशा फैलाएँ! देवताओं की इच्छा से या तो गौरवशाली विजय होगी या वल्हल्ला में शानदार भोज! क्या आपका नया साम्राज्य इतिहास के युगों में चमकेगा?
