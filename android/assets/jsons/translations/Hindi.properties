After updating, you might want to see what has changed. The "About" in "Options" has the version number linked to the change log. You can also see that info by clicking the version number on the main menu. = अद्यतन के बाद आप देखना चाहेंगे कि क्या बदला। "विकल्प" के "परिचय" में संस्करण संख्या परिवर्तन सूची से जुड़ी है। मुख्य मेनू की संस्करण संख्या क्लिक करके भी वही जानकारी देख सकते हैं।

Differences from Civilization V = Civilization V से अंतर
Production Focus\nIn Civilization V, the Food yield in a city is calculated first, then population grows by consuming stored food (growth), then production is calculated, and so on one by one the other stats are calculated. Thus, citizens can produce yields in the same turn as they are born. The city focus is set to Production to assign the newborn citizen to a hill so they'll contribute Production, and then manually reassigned to a growth tile on the next turn. Alternatively, you can set city focus to Gold (e.g. with Cerro de Potosi), Faith (e.g. with Mount Sinai) or whatever gains the most yields. In Unciv, citizens only start producing yields on the next turn, so you can ignore this whole concept. = उत्पादन पर ध्यान\nCivilization V में पहले शहर की भोजन उपज गिनी जाती है, फिर जमा भोजन खर्च करके जनसंख्या बढ़ती है, फिर उत्पादन और अन्य आँकड़े एक-एक कर गिने जाते हैं। इसलिए नया नागरिक जन्म की चाल में ही उपज दे सकता है। शहर की प्राथमिकता उत्पादन रखने से नया नागरिक पहाड़ी पर लगता है और उत्पादन देता है; अगली चाल उसे हाथ से वृद्धि वाले टाइल पर लगाया जाता है। या प्राथमिकता स्वर्ण, जैसे सेरो दे पोतोसी के साथ, आस्था, जैसे सिनाई पर्वत के साथ, या सबसे अधिक उपज देने वाली चीज़ रख सकते हैं। Unciv में नागरिक अगली चाल से ही उपज देते हैं, इसलिए इस पूरी अवधारणा की उपेक्षा कर सकते हैं।
Science Queueing\nIn Civilization V, Science yield is calculated after production, so if you finish an item and have Science (or Gold) queued as a perpetual construction, the Production overflow from item will be converted into Science (or Gold), but the Production is not consumed, as this will only happen again on the next turn. By immediately swapping out your perpetual construction for an item on the next turn, you'll get this Science (or Gold) for free. This doesn't apply to Unciv, so don't bother. = विज्ञान कतार\nCivilization V में विज्ञान उपज उत्पादन के बाद गिनी जाती है। इसलिए वस्तु पूरी होने पर अगला सतत निर्माण विज्ञान या स्वर्ण हो, तो बचा उत्पादन विज्ञान या स्वर्ण में बदलता है, किंतु उत्पादन खर्च नहीं होता क्योंकि यह फिर केवल अगली चाल होगा। अगली चाल सतत निर्माण तुरंत हटाकर कोई वस्तु लगाने से वह विज्ञान या स्वर्ण मुफ़्त मिल जाता है। Unciv में ऐसा नहीं होता, इसलिए इसकी चिंता न करें।
Double Aqueducts\nIn Civilization V, the game sells existing copies of the building for you before providing a free copy of the building. So, if you build an aqueduct in a city, and then in the turn of adopting Tradition Complete you sell a cheap building (e.g a shrine) beforehand, the game is unable to sell more than 1 building per turn, and thus you'll keep your aqueduct, together with the new free aqueduct. Not applicable to Unciv. = दो जलसेतु\nCivilization V में मुफ़्त भवन देने से पहले खेल आपके मौजूदा उसी भवन को बेच देता है। इसलिए शहर में जलसेतु बनाएँ और परंपरा पूर्ण अपनाने वाली चाल में पहले कोई सस्ता भवन, जैसे देवस्थान, बेच दें, तो खेल प्रति चाल 1 से अधिक भवन नहीं बेच सकता और आपके पुराने जलसेतु के साथ नया मुफ़्त जलसेतु भी रहेगा। Unciv में लागू नहीं है।
Legalism Oxford\nIn Civilization V, national wonders such as Oxford University are considered culture buildings, so you can get them for free with Legalism. Not applicable to Unciv. = विधिवाद से ऑक्सफ़र्ड\nCivilization V में ऑक्सफ़र्ड विश्वविद्यालय जैसे राष्ट्रीय अजूबे सांस्कृतिक भवन माने जाते हैं, इसलिए विधिवाद से मुफ़्त मिल सकते हैं। Unciv में लागू नहीं है।
Roads and Forts\nIn Civilization V, you can't use roads and forts in enemy territory. In Unciv, you can use them, so instead of mindlessly constructing them everywhere when at war, you need to decide if and when they'll benefit you more than your opponents. = सड़कें और दुर्ग\nCivilization V में शत्रु क्षेत्र की सड़कें और दुर्ग उपयोग नहीं कर सकते। Unciv में कर सकते हैं, इसलिए युद्ध में बिना सोचे हर जगह बनाने के बजाय तय करें कि वे कब और क्या विरोधी से अधिक आपको लाभ देंगे।
Citizen Conversion\nIn Civilization V, a citizen is born religious if the parent city is already converted. This is not the case in Unciv, which can lead to temporary deconversion of a city when it grows. = नागरिक धर्मपरिवर्तन\nCivilization V में शहर का धर्मपरिवर्तन हो चुका हो तो नया नागरिक धार्मिक जन्म लेता है। Unciv में ऐसा नहीं है, जिससे शहर बढ़ने पर अस्थायी रूप से उसका बहुसंख्यक धर्म हट सकता है।
Unassigned Citizens\nIn Civilization V, unassigned citizens are considered specialists, and subject to the same type of bonuses (e.g. Korea's ability). It can be worthwhile to leave citizens unassigned, instead of being assigned to a tile. Not applicable to Unciv. = अनिर्धारित नागरिक\nCivilization V में अनिर्धारित नागरिक विशेषज्ञ माने जाते हैं और उसी प्रकार के बोनस, जैसे कोरिया की क्षमता, पाते हैं। उन्हें टाइल पर लगाने के बजाय अनिर्धारित छोड़ना लाभदायक हो सकता है। Unciv में लागू नहीं है।
Settler Construction\nIn Civilization V, cities can't starve when constructing settlers, so you can assign all citizens to production tiles and none to food tiles. In Unciv, citizens keep consuming two food per turn. = बसनेवाले का निर्माण\nCivilization V में बसनेवाले बनाते समय शहर में भुखमरी नहीं होती, इसलिए आप सभी नागरिकों को उत्पादन टाइलों पर लगा सकते हैं और भोजन टाइलों पर किसी को भी नहीं। Unciv में नागरिक प्रति चाल दो भोजन खाते रहते हैं।
Water Melee Attack\nAs result of a Discord poll, Water Melee units can attack military land units on the shore, unlike in Civilization V. = जलीय निकट युद्ध हमला\nDiscord मतदान के परिणामस्वरूप जलीय निकट युद्ध इकाइयाँ तट पर स्थलीय सैन्य इकाइयों पर हमला कर सकती हैं, जो Civilization V से अलग है।
Tile improvements\nIn Civilzation V, workers start working on an improvement-under-construction at the beginning of movement. Unciv changes this, to allow players to assign workers to tiles, and then reconsider and change improvement or move them elsewhere. = टाइलों के सुधार\nCivilization V में कार्यकर्ता चलना शुरू होते ही निर्माणाधीन सुधार पर काम शुरू करते हैं। Unciv इसे बदलता है, ताकि खिलाड़ी कार्यकर्ताओं को टाइलों पर लगाकर फिर पुनर्विचार कर सकें और सुधार बदलें या उन्हें कहीं और भेजें।
Forest and Jungle Visibility\nIn Unciv, forests and jungles are visible 1 tile outside visibility range. In Civilization V, this is the behaviour of hills and mountains, but not of forests and jungles, yet jungle and forest can block hills, and hill + forest can block mountain, indicating they're on the same elevation. This is considered to be a bug in the otherwise well-structured visibility logic in Civilization V. = वन और जंगल की दृश्यता\nUnciv में वन और जंगल दृष्टि दूरी से 1 टाइल बाहर तक दिखते हैं। Civilization V में यह पहाड़ियों और पर्वतों के लिए होता है, वन-जंगल के लिए नहीं; फिर भी वन-जंगल पहाड़ियों को और पहाड़ी + वन पर्वत को छिपा सकते हैं, जिससे वे समान ऊँचाई पर लगते हैं। Civilization V की अन्यथा सुव्यवस्थित दृश्यता व्यवस्था में इसे त्रुटि माना जाता है।
City razing\nIn Civilization V, the player can never raze any of the cities he/she founded. Not applicable to Unciv. = शहर ध्वस्त करना\nCivilization V में खिलाड़ी अपना बसाया कोई शहर कभी ध्वस्त नहीं कर सकता। Unciv में लागू नहीं है।

Founding Cities\nThe Settler is a unit that can found a new city. You can build a Settler unit in a city with at least 2 population, and then move them to a good location to found a new city. This will usually be your main way of acquiring more cities. = शहर बसाना\nबसनेवाला नया शहर बसाने वाली इकाई है। कम से कम 2 जनसंख्या वाले शहर में इसे बना सकते हैं और अच्छी जगह ले जाकर नया शहर बसा सकते हैं। अधिक शहर पाने का सामान्यतः यही मुख्य तरीका होगा।
Food conversion to Production\nDuring the construction of a Settler, the city will not grow. Instead, the 1st, 2nd, 4th, and from there on every 4th, excess Food (Growth) is converted into Production, with the rest of the excess Food being lost. = भोजन का उत्पादन में बदलना\nबसनेवाले के निर्माण के दौरान शहर नहीं बढ़ता। इसके बजाय अतिरिक्त भोजन, यानी वृद्धि, का 1वाँ, 2वाँ, 4वाँ और उसके बाद हर 4वाँ बिंदु उत्पादन में बदलता है; शेष अतिरिक्त भोजन खो जाता है।

