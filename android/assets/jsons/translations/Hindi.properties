Genghis Khan = चंगेज़ ख़ान
You stand in the way of my armies. Let us solve this like warriors! = आप मेरी सेनाओं के मार्ग में हैं। योद्धाओं की तरह इसका समाधान करें!
No more words. Today, Mongolia charges toward your defeat. = अब और शब्द नहीं। आज मंगोलिया आपकी पराजय की ओर धावा बोलता है।
You have hobbled the Mongolian clans. My respect for you nearly matches the loathing. I am waiting for my execution. = आपने मंगोल कुलों को पंगु कर दिया। आपके प्रति मेरा सम्मान लगभग मेरी घृणा जितना है। मैं अपने मृत्युदंड की प्रतीक्षा कर रहा हूँ।
Your bravery must be commended. = आपकी वीरता प्रशंसनीय है।
I am Temuujin, conqueror of cities and countries. Before me lie future Mongolian lands. Behind me is the only cavalry that matters. = मैं तेमूजिन हूँ, शहरों और देशों का विजेता। मेरे सामने भावी मंगोल भूमि है। मेरे पीछे वही घुड़सवार सेना है जिसका महत्व है।
I am not always this generous, but we hope you take this rare opportunity we give you. = मैं सदा इतना उदार नहीं होता, किंतु आशा है आप हमारा दिया यह दुर्लभ अवसर स्वीकार करेंगे।
So what now? = तो अब क्या?
Mongol Terror = मंगोल आतंक
O great Temuujin, immortal leader of the mighty Mongol Empire! Your name alone was enough to make cities crumble, and the sound of the mighty Mongol cavalry to make your enemies flee! O Great Khan! Once Northern Asia united into a mighty people, producing one of the greatest armies the world has ever known, your skillful mounted archers conquered in only a few years, most of China, Eastern Asia, and even reached the gates of Europe at the West. With cunning diplomacy and brilliant warfare, you swept your enemies one after another, creating the greatest empire ever seen, reducing Roman or Greek conquests to minor achievements. = हे महान तेमूजिन, शक्तिशाली मंगोल साम्राज्य के अमर नेता! आपका नाम भर शहरों को ध्वस्त करने के लिए पर्याप्त था और शक्तिशाली मंगोल घुड़सवारों की आवाज़ शत्रुओं को भगा देती थी! हे महान ख़ान! जब उत्तरी एशिया एक शक्तिशाली जनता में एकजुट हुआ और विश्व की महानतम सेनाओं में से एक बनी, आपके कुशल घुड़सवार तीरंदाज़ों ने कुछ ही वर्षों में चीन के अधिकांश भाग और पूर्वी एशिया को जीत लिया, यहाँ तक कि पश्चिम में यूरोप के द्वार तक पहुँचे। चतुर कूटनीति और शानदार युद्धकला से आपने एक के बाद एक शत्रु को हटाया और अब तक का सबसे महान साम्राज्य बनाया, जिसके सामने रोमन और यूनानी विजय छोटी उपलब्धियाँ लगती हैं।
Divine Temuujin, battles and conquests run through the veins of the Mongols. Are you ready to shatter the will of your enemies? Will your cavalry ride in the steppes once again and strike as lightning and thunder? Will your new empire shine through the ages of history? = दिव्य तेमूजिन, युद्ध और विजय मंगोलों की रगों में दौड़ते हैं। क्या आप अपने शत्रुओं का संकल्प तोड़ने को तैयार हैं? क्या आपकी घुड़सवार सेना फिर स्तेपी में दौड़ेगी और बिजली व गरज की तरह प्रहार करेगी? क्या आपका नया साम्राज्य इतिहास के युगों में चमकेगा?
