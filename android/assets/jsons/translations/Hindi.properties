来去如风 = हवा की तरह सवार हों
不限难度，使用蒙古。同一支怯薛骑兵在一个己方回合中，先主动攻击主要文明军事单位或城市并造成正数伤害，再主动移动到另一格，并持续归己方、存活至下一己方回合开始。攻击和移动均发生在怯薛形态；强制传送不计。若本局先取得正式胜利，则在胜利结算时核对剩余观察条件。 = किसी भी कठिनाई पर मंगोलिया के रूप में एक केशिक से प्रमुख सभ्यता की सैन्य इकाई या शहर पर सक्रिय हमला करके शून्य से अधिक क्षति दें, फिर उसी चाल स्वेच्छा से दूसरे टाइल पर जाएँ। अगली चाल शुरू होने तक वह जीवित और निरंतर आपका रहे। दोनों कार्रवाइयाँ केशिक रूप में हों; जबरन स्थानांतरण नहीं गिना जाता। आधिकारिक विजय पहले खेल समाप्त कर दे, तो बची निरीक्षण शर्तें उसी विजय की गणना पर जाँची जाती हैं।
同一支怯薛骑兵攻击造成伤害后主动换格，存活至下一己方回合。 = एक केशिक से हमला करें, दूसरे टाइल पर जाएँ और अगली चाल तक उसे रखें।
射击之后，寻找下一处阵地 = गोली चलाने के बाद दूसरा स्थान खोजें
