#################### Lines from Global Tutorials ####################

Welcome to Unciv!\nBecause this is a complex game, there are basic tasks to help familiarize you with the game.\nThese are completely optional, and you're welcome to explore the game on your own! = Unciv में स्वागत है!\nयह एक जटिल खेल है, इसलिए इससे परिचित कराने के लिए कुछ मूल कार्य दिए गए हैं।\nये पूरी तरह वैकल्पिक हैं और आप स्वयं भी खेल की खोज कर सकते हैं!

Welcome to Unciv! = Unciv में स्वागत है!
Because this is a complex game, there are some tutorials to help familiarize you with it. These can be disabled in the Options -> Display menu, but please hang on if you're new here! = यह एक जटिल खेल है, इसलिए इससे परिचित कराने के लिए कुछ प्रशिक्षण दिए गए हैं। इन्हें विकल्प -> प्रदर्शन मेनू में बंद किया जा सकता है, किंतु यदि आप नए हैं तो कृपया इन्हें देखें!
Your first mission is to found your capital city. This is actually an important task because your capital city will probably be your most prosperous. Many game bonuses apply only to your capital city, and it will be the center of your empire. = आपका पहला अभियान अपनी राजधानी बसाना है। यह महत्वपूर्ण है, क्योंकि आपकी राजधानी संभवतः सबसे समृद्ध शहर होगी। खेल के अनेक बोनस केवल राजधानी पर लागू होते हैं और यही आपके साम्राज्य का केंद्र होगी।
How do you know a city location is appropriate? Luckily, the game has already chosen a good location for you. You can settle in this place, or maybe move a turn to found on a Hill (for Production and defence) or next to a Mountain (to gain access to the Observatory building later on). = कैसे जानें कि शहर का स्थान उचित है? सौभाग्य से खेल ने आपके लिए पहले ही अच्छा स्थान चुना है। आप यहीं बस सकते हैं या एक चाल चलकर पहाड़ी पर, उत्पादन और रक्षा के लिए, अथवा पर्वत के पास बस सकते हैं, जिससे बाद में वेधशाला भवन बनाया जा सके।
You'll likely want more cities later on. For these cities, you must go and find a good place. Looking for and founding on or near Luxury resources is a good rule of thumb. = बाद में आप शायद और शहर चाहेंगे। उनके लिए आपको अच्छा स्थान खोजना होगा। विलासिता संसाधनों पर या उनके पास शहर बसाना एक अच्छा सामान्य नियम है।
Luxury resources are tiles that have things like Gems, Cotton, or Silk (indicated by a yellow background of the resource icon). These resources make your civilization happy. You should also keep an eye out for resources needed to build units, such as Iron. Cities cannot be built within 3 tiles of existing cities, which is another thing to keep in mind! = विलासिता संसाधन वे टाइलें हैं जिनमें रत्न, कपास या रेशम जैसी वस्तुएँ होती हैं, जिन्हें संसाधन चिह्न की पीली पृष्ठभूमि दर्शाती है। ये आपकी सभ्यता को खुश रखते हैं। लोहा जैसे इकाइयाँ बनाने के लिए आवश्यक संसाधनों पर भी नज़र रखें। मौजूदा शहरों के 3 टाइलों के भीतर शहर नहीं बनाए जा सकते; यह भी याद रखें!
Cities will house Citizens, which can work tiles up to 3 tiles away from the city. This means you don’t have to settle cities right on or next to good tiles. Let’s say, for example, that you want access to some Iron – but the resource is in a desert area. You don’t have to settle your city in the desert. You can settle a few tiles away in more prosperous lands. Your city will grow and eventually gain access to the resource. You only need to settle right on top of resources if you need them immediately. = शहरों में नागरिक रहते हैं, जो शहर से 3 टाइलों तक दूर काम कर सकते हैं। इसलिए अच्छे टाइलों पर या ठीक उनके पास शहर बसाना आवश्यक नहीं है। उदाहरण के लिए, आपको लोहा चाहिए, पर वह रेगिस्तान में है। शहर रेगिस्तान में बसाने की आवश्यकता नहीं; कुछ टाइलें दूर अधिक समृद्ध भूमि पर बसाएँ। आपका शहर बढ़ेगा और अंततः संसाधन तक पहुँचेगा। केवल तुरंत आवश्यकता होने पर संसाधन के ठीक ऊपर बसना ज़रूरी है।
The first thing coming out of your city depends on the strategy you want to follow, but the 'classic' build order is to build first two Scouts, then a Shrine, and three Settlers, and adopt Tradition, to explore the map quickly (Scouts ignore terrain cost), and to get an early Pantheon (if you're playing with religion enabled). = शहर में पहले क्या बनाएँ, यह आपकी रणनीति पर निर्भर है, किंतु 'पारंपरिक' क्रम है पहले दो टोही, फिर देवस्थान और तीन बसनेवाले बनाना तथा परंपरा अपनाना। इससे मानचित्र की तेज़ खोज होगी, क्योंकि टोही भूभाग लागत की उपेक्षा करते हैं, और जल्दी देवमंडल मिलेगा, यदि धर्म चालू है।
But feel free to experiment with your own build orders! = किंतु अपने निर्माण क्रम आज़माने में संकोच न करें!

In your first couple of turns, you will have very little options, but as your civilization grows, so do the number of things requiring your attention. = पहली कुछ चालों में विकल्प कम होंगे, किंतु आपकी सभ्यता के बढ़ने के साथ ध्यान माँगने वाले काम भी बढ़ेंगे।

Culture and Policies = संस्कृति और नीतियाँ
Each turn, the culture you gain from all your cities is added to your Civilization's culture.\nWhen you have enough culture, you may pick a Social Policy, each one giving you a certain bonus. = हर चाल आपके सभी शहरों की संस्कृति आपकी सभ्यता की संस्कृति में जुड़ती है।\nपर्याप्त संस्कृति होने पर आप सामाजिक नीति चुन सकते हैं; प्रत्येक नीति एक निश्चित बोनस देती है।
The policies are organized into branches, with each branch providing a bonus ability when all policies in the branch have been adopted. = नीतियाँ शाखाओं में व्यवस्थित हैं; किसी शाखा की सभी नीतियाँ अपनाने पर अतिरिक्त क्षमता मिलती है।
With each policy adopted, and with each city built,\n  the cost of adopting another policy rises - so choose wisely! = प्रत्येक अपनाई गई नीति और प्रत्येक नए शहर के साथ,\n  अगली नीति अपनाने की लागत बढ़ती है — इसलिए सोचकर चुनें!

City Expansion = शहर का विस्तार
Once a city has gathered enough Culture, it will expand into a neighboring tile.\nYou have no control over the tile it will expand into, but tiles with resources and higher yields are prioritized. = पर्याप्त संस्कृति जमा होने पर शहर पड़ोसी टाइल में फैलता है।\nआप तय नहीं कर सकते कि वह कौन सी टाइल होगा, किंतु संसाधनों और अधिक उपज वाले टाइलों को प्राथमिकता मिलती है।
Each additional tile will require more culture, but generally your first cities will eventually expand to a wide tile range. = हर अतिरिक्त टाइल के लिए अधिक संस्कृति चाहिए, किंतु सामान्यतः आपके पहले शहर अंततः बड़े क्षेत्र में फैल जाएँगे।
Although your city will keep expanding forever, your citizens can only work 3 tiles away from city center.\nThis should be taken into account when placing new cities. = यद्यपि शहर सदा फैलता रहेगा, नागरिक शहर के केंद्र से केवल 3 टाइलें दूर तक काम कर सकते हैं।\nनए शहर बसाते समय इसे ध्यान में रखें।

Food is the resource fundamental to your Cities', and as a result Nation's, population and health. = भोजन आपके शहरों और फलस्वरूप राष्ट्र की जनसंख्या तथा स्वास्थ्य का आधारभूत संसाधन है।
Every Citizen in each City consumes Food per turn. Any left over is considered Growth and is stored in the City Center. Once enough accumulates, the City Grows and a new Citizen is added. = हर शहर का प्रत्येक नागरिक प्रति चाल भोजन खाता है। बचा हुआ भोजन वृद्धि माना जाता है और शहर के केंद्र में जमा होता है। पर्याप्त जमा होने पर शहर बढ़ता है और एक नया नागरिक जुड़ता है।
Initially your main source of Food is the City Center itself and working a surrounding tile with a Citizen. You can increase how much is generated by gaining more Citizens to work more tiles, improving the tiles so that they yield more Food, and eventually Buildings and Policies. = आरंभ में भोजन का मुख्य स्रोत शहर का केंद्र और आसपास के टाइल पर काम करने वाला नागरिक है। अधिक नागरिकों से अधिक टाइलों पर काम कराकर, अधिक भोजन देने वाले सुधार बनाकर तथा बाद में भवनों और नीतियों से उत्पादन बढ़ा सकते हैं।
Since a city's number of Citizens, or Population, determines how many tiles a City can work, Food is often the most important Resource. = शहर के नागरिकों की संख्या, अर्थात जनसंख्या, तय करती है कि वह कितनी टाइलों पर काम कर सकता है, इसलिए भोजन अक्सर सबसे महत्वपूर्ण संसाधन होता है।

Production is the resource that lets a City Center build new things. = उत्पादन वह संसाधन है जिससे शहर का केंद्र नई चीज़ें बनाता है।
This can be new Buildings that are added to the City Center, or new Units that can go out across the World Map to advance your Nation's goals. = ये शहर के केंद्र में जुड़ने वाले नए भवन या विश्व मानचित्र पर जाकर आपके राष्ट्र के लक्ष्य आगे बढ़ाने वाली नई इकाइयाँ हो सकती हैं।
Everything you can build has a Production Cost. Every turn each City generates a certain amount of Production and puts it towards whatever is at the top of the Build Queue. Once the total cost is collected, the Building or Unit is built! = बनाई जा सकने वाली हर चीज़ की उत्पादन लागत होती है। हर चाल प्रत्येक शहर निश्चित उत्पादन करता है और उसे निर्माण कतार की सबसे ऊपर की वस्तु पर लगाता है। पूरी लागत जमा होते ही भवन या इकाई बन जाती है!
Any excess Production after something is built is overflowed to the next thing the City builds. Up to it's total Production Cost. = किसी वस्तु के बनने के बाद बचा उत्पादन अगली वस्तु में चला जाता है, अधिकतम उसकी पूरी उत्पादन लागत तक।
Since this determines how quickly you can build more stuff, your Nation's Production Capacity is crucial to it's advancement and survival. = यही तय करता है कि आप कितनी जल्दी और चीज़ें बना सकते हैं, इसलिए राष्ट्र की उत्पादन क्षमता उसकी प्रगति और अस्तित्व के लिए अत्यंत महत्वपूर्ण है।

⍾Science is the resource that unlocks new and exciting Technologies for your Nation. = ⍾विज्ञान वह संसाधन है जो आपके राष्ट्र के लिए नई रोमांचक तकनीकें खोलता है।
Once you've Founded your Capital, you'll be prompted to Pick a Technology to Research. = राजधानी बसाने के बाद आपको अनुसंधान के लिए तकनीक चुनने को कहा जाएगा।
Every Technology costs an amount of ⍾Science. Every turn the ⍾Science your Nation produces is paid towards Researching your chosen Technology. = प्रत्येक तकनीक की कुछ ⍾विज्ञान लागत होती है। हर चाल राष्ट्र का उत्पन्न ⍾विज्ञान चुनी तकनीक के अनुसंधान में लगता है।
Once a Technology has it's cost fully paid, you unlock the benefits for your Nation! This could be new Units, Buildings, or other advantages. Any surplus will overflow into the next Technology you pick to Research. = तकनीक की पूरी लागत चुकाने पर उसके लाभ आपके राष्ट्र के लिए खुल जाते हैं! इनमें नई इकाइयाँ, भवन या अन्य लाभ हो सकते हैं। बचा विज्ञान अगली चुनी तकनीक के अनुसंधान में चला जाता है।
Researching a Technology in the next Era will advance you into that Era and trigger a notification to other Nations about how amazing you are! = अगले युग की तकनीक का अनुसंधान आपको उस युग में पहुँचा देगा और अन्य राष्ट्रों को आपकी महानता की सूचना देगा!
Since new Technologies tend to give access to better Units, Buildings, and even unlock powerful new Policies, staying ahead of the competition is one of the best ways to secure your Victory! = नई तकनीकें आम तौर पर बेहतर इकाइयाँ, भवन और शक्तिशाली नई नीतियाँ खोलती हैं, इसलिए प्रतिस्पर्धियों से आगे रहना विजय सुनिश्चित करने के श्रेष्ठ तरीकों में है!

Ah Gold. The Universal Medium of Exchange. Everyone loves Gold! They say it can't buy Happiness, but nuclear submarines are almost as good. = आह, स्वर्ण। विनिमय का सार्वभौमिक माध्यम। स्वर्ण सबको प्रिय है! कहते हैं इससे खुशी नहीं खरीदी जा सकती, किंतु परमाणु पनडुब्बियाँ लगभग उतनी ही अच्छी हैं।
You can earn more Gold from Tiles, Resources, Improvements, and eventually Buildings, Specialists, and Trade Routes. Ancient Ruins, meeting new City-States, and Pillaging are also great sources of Gold. During a Golden Age every Tile that already yields Gold will yield an additional Gold! = आप टाइलों, संसाधनों, सुधारों और बाद में भवनों, विशेषज्ञों तथा व्यापार मार्गों से अधिक स्वर्ण कमा सकते हैं। प्राचीन खंडहर, नए नगर-राज्यों से मिलना और लूटपाट भी स्वर्ण के अच्छे स्रोत हैं। स्वर्ण-युग में पहले से स्वर्ण देने वाली हर टाइल एक अतिरिक्त स्वर्ण देगा!
Gold is how you pay for Building Maintenance, Transportation Upkeep, and Unit Upkeep. If you run out of Gold, first you'll receive penalties to your ⍾Science production, then eventually your Units will start Disbanding as you can't pay their upkeep. = स्वर्ण से भवनों का रखरखाव, परिवहन और इकाइयों का खर्च चुकाया जाता है। स्वर्ण खत्म होने पर पहले ⍾विज्ञान उत्पादन पर दंड मिलेगा, फिर खर्च न चुका पाने पर आपकी इकाइयाँ भंग होने लगेंगी।
Gold can be used to Buy Buildings and Units, helping bring up a new City or quickly build an Army. It can also buy Tiles to add to your City. It's also used to Upgrade your units from their older, obsolete forms to new, stronger versions. And investing it into a Research Agreement is a great way to convert it into ⍾Science. = स्वर्ण से भवन और इकाइयाँ खरीदकर नए शहर को बढ़ा सकते हैं या जल्दी सेना बना सकते हैं। इससे शहर में जोड़ने के लिए टाइलें भी खरीदी जा सकती हैं। पुरानी अप्रचलित इकाइयों को नए शक्तिशाली रूपों में उन्नत करने में भी यह लगता है। अनुसंधान समझौते में निवेश इसे ⍾विज्ञान में बदलने का अच्छा तरीका है।
Gold is also very valuable in Diplomacy. You can directly Gift Gold to City-States to gain their favor. Use it to balance a Trade Deal with other Nations. Or demand every last drop after a successful war and your enemy sues for peace. = कूटनीति में भी स्वर्ण बहुत मूल्यवान है। नगर-राज्यों की कृपा पाने के लिए उन्हें सीधे स्वर्ण भेंट करें। अन्य राष्ट्रों के व्यापार सौदे को संतुलित करने में इसका उपयोग करें। या सफल युद्ध के बाद शांति माँगते शत्रु से आखिरी सिक्के तक माँग लें।
Ironically, some may consider Gold to be one of the less important Resources. But it's flexible nature and importance to keep your Nation running makes it a precious thing to pay attention to. After all, everyone loves Gold. = विडंबना है कि कुछ लोग स्वर्ण को कम महत्वपूर्ण संसाधनों में गिनते हैं। किंतु उसका लचीला उपयोग और राष्ट्र चलाते रहने में महत्व उसे ध्यान देने योग्य मूल्यवान वस्तु बनाते हैं। आखिर स्वर्ण सबको प्रिय है।
Not to be confused with the Resource of the same name, Gold Ore = इसे समान नाम वाले स्वर्ण अयस्क संसाधन से न मिलाएँ
Trade Route = व्यापार मार्ग
See also: [param] = यह भी देखें: [param]
Research Agreements = अनुसंधान समझौते

As cities grow in size and influence, you have to deal with a happiness mechanic that is no longer tied to each individual city.\nInstead, your entire empire shares the same level of satisfaction.\nAs your cities grow in population you’ll find that it is more and more difficult to keep your empire happy. = शहरों के आकार और प्रभाव बढ़ने पर आपको खुशी की ऐसी व्यवस्था सँभालनी होती है जो किसी एक शहर से जुड़ी नहीं है।\nइसके बजाय आपके पूरे साम्राज्य का संतुष्टि स्तर एक होता है।\nशहरों की जनसंख्या बढ़ने पर साम्राज्य को खुश रखना अधिक कठिन होता जाएगा।
In addition, you can’t even build any city improvements that increase happiness until you’ve done the appropriate research.\nIf your empire’s happiness ever goes below zero the growth rate of your cities will be hurt.\nIf your empire becomes severely unhappy (as indicated by the smiley-face icon at the top of the interface)\n  your armies will have a big penalty slapped on to their overall combat effectiveness. = इसके अतिरिक्त, उचित अनुसंधान के बिना आप खुशी बढ़ाने वाले शहर के सुधार भी नहीं बना सकते।\nसाम्राज्य की खुशी शून्य से नीचे जाने पर शहरों की वृद्धि दर प्रभावित होगी।\nयदि साम्राज्य अत्यंत दुखी हो जाए, जैसा इंटरफ़ेस के ऊपर चेहरे के चिह्न से दिखता है,\n  तो आपकी सेनाओं की समग्र युद्ध क्षमता पर बड़ा दंड लगेगा।
This means that it is very difficult to expand quickly in Unciv.\nIt isn’t impossible, but as a new player you probably shouldn't do it.\nSo what should you do? Chill out, scout, and improve the land that you do have by building Workers.\nOnly build new cities once you have found a spot that you believe is appropriate. = इसका अर्थ है कि Unciv में तेज़ी से विस्तार करना बहुत कठिन है।\nयह असंभव नहीं है, किंतु नए खिलाड़ी को शायद ऐसा नहीं करना चाहिए।\nतो क्या करें? आराम से खोज करें और कार्यकर्ता बनाकर अपनी मौजूदा भूमि सुधारें।\nनए शहर तभी बसाएँ जब आपको उचित स्थान मिल गया हो।

 # Requires translation!
Unhappiness = दुःख
It seems that your citizens are unhappy!\nWhile unhappy, your civilization will suffer many detrimental effects, increasing in severity as unhappiness gets higher. = लगता है आपके नागरिक दुखी हैं!\nदुखी रहने पर आपकी सभ्यता पर अनेक हानिकारक प्रभाव पड़ेंगे, जो दुख बढ़ने पर और गंभीर होंगे।
Unhappiness has two main causes: Population and cities.\n  Each city causes 3 unhappiness, and each population, 1 = दुख के दो मुख्य कारण हैं: जनसंख्या और शहर।\n  प्रत्येक शहर 3 दुख और जनसंख्या का प्रत्येक व्यक्ति 1 दुख पैदा करता है
There are 2 main ways to combat unhappiness:\n  by building happiness buildings for your population\n  or by having improved luxury resources within your borders. = दुख से निपटने के 2 मुख्य तरीके हैं:\n  अपनी जनसंख्या के लिए खुशी देने वाले भवन बनाएँ\n  या अपनी सीमाओं में सुधारे गए विलासिता संसाधन रखें।

You have entered a Golden Age!\nGolden age points are accumulated each turn by the total happiness \n  of your civilization\nWhen in a golden age, culture and production generation increases +20%,\n  and every tile already providing at least one gold will provide an extra gold. = आप स्वर्ण-युग में प्रवेश कर गए हैं!\nहर चाल आपकी सभ्यता की कुल खुशी के आधार पर \n  स्वर्ण-युग अंक जमा होते हैं\nस्वर्ण-युग में संस्कृति और उत्पादन +20% बढ़ते हैं,\n  और पहले से कम से कम एक स्वर्ण देने वाली प्रत्येक टाइल एक अतिरिक्त स्वर्ण देती है।

Roads and Railroads = सड़कें और रेलमार्ग
Roads reduce the Movement Points required to move between two tiles connected by Roads. = सड़क से जुड़े दो टाइलों के बीच चलने के लिए आवश्यक गति अंक सड़कें कम करती हैं।
Railroads improve this reduction even more! = रेलमार्ग यह लागत और भी कम करते हैं!
This greatly improves the speed you can get Units around the map. = इससे आप मानचित्र पर इकाइयाँ बहुत तेज़ी से पहुँचा सकते हैं।
Until you research the technology that removes it, Roads do not cross Rivers = संबंधित तकनीक का अनुसंधान करने तक सड़कें नदियों को पार नहीं करतीं
Connecting your cities to the capital by Roads and/or Railroads will generate Gold via the Trade Route. = सड़कों और/या रेलमार्गों से शहरों को राजधानी से जोड़ने पर व्यापार मार्ग द्वारा स्वर्ण मिलता है।
However, since each Road and Railroad have a Maintenance Cost, it may be more economical to wait until the cities grow and only place where needed. = किंतु हर सड़क और रेलमार्ग की रखरखाव लागत होती है, इसलिए शहरों के बढ़ने की प्रतीक्षा करना और केवल ज़रूरत की जगह बनाना अधिक किफ़ायती हो सकता है।

Connecting your cities to the capital by Roads and/or Railroads will generate Gold via the Trade Route. You earn more Gold the more Population the City and your Capital has. = सड़कों और/या रेलमार्गों से शहरों को राजधानी से जोड़ने पर व्यापार मार्ग द्वारा स्वर्ण मिलता है। शहर और राजधानी की जनसंख्या जितनी अधिक होगी, उतना अधिक स्वर्ण मिलेगा।
Note that each road costs 1 Gold Maintenance per turn, and each Railroad costs 2 Gold, so it may be more economical to wait until the cities grow! = हर सड़क का प्रति चाल रखरखाव 1 स्वर्ण और हर रेलमार्ग का 2 स्वर्ण है, इसलिए शहरों के बढ़ने की प्रतीक्षा करना अधिक किफ़ायती हो सकता है!
Railroads connecting a city to the Capital also provide a 25% Production Boost to the City, but not the Capital. = शहर को राजधानी से जोड़ने वाला रेलमार्ग उस शहर को 25% उत्पादन बढ़त भी देता है, किंतु राजधानी को नहीं।
Trade Routes are also connected over Water via certain buildings like the Harbor. As long as there is a chain that can reach the Capital, there's a Trade Route. Look for this symbol in Yellow below the City Name to mean you have an active Trade Route to your Capital. = बंदरगाह जैसे कुछ भवनों से जल पर भी व्यापार मार्ग जुड़ते हैं। राजधानी तक पहुँचने वाली कड़ी हो तो व्यापार मार्ग है। शहर के नाम के नीचे पीला चिह्न राजधानी तक सक्रिय व्यापार मार्ग दर्शाता है।
Trade Routes can get broken either by Blockades or by Removing/Pillaging the connecting Road/Railroad chain. = नाकाबंदी या जोड़ने वाली सड़क/रेलमार्ग की कड़ी हटाने अथवा लूटने से व्यापार मार्ग टूट सकते हैं।
City Blockade = शहर की नाकाबंदी

Once you’ve settled 3-4 cities and build universities, you’re probably already 100 to 150 turns into the game.\nNow is a good time to start thinking about how, exactly, you want to win – if you haven’t already. = 3-4 शहर बसाने और विश्वविद्यालय बनाने तक आप संभवतः खेल में 100 से 150 चालें चल चुके होंगे।\nयदि अभी नहीं सोचा है, तो अब यह तय करने का अच्छा समय है कि आप वास्तव में कैसे जीतना चाहते हैं।
There are four ways to win in Unciv. They are:\n - Cultural Victory: Complete 5 Social Policy Trees and build the Utopia Project\n - Domination Victory: Conquer the original capital of all other Major civs\n - Science Victory: Be the first to construct a Spaceship\n - Diplomatic Victory: Build the United Nations and win the vote = Unciv में जीतने के चार तरीके हैं:\n - सांस्कृतिक विजय: 5 सामाजिक नीति वृक्ष पूरे करें और आदर्शलोक परियोजना बनाएँ\n - प्रभुत्व विजय: अन्य सभी प्रमुख सभ्यताओं की मूल राजधानी जीतें\n - वैज्ञानिक विजय: सबसे पहले अंतरिक्षयान बनाएँ\n - कूटनीतिक विजय: संयुक्त राष्ट्र बनाएँ और मतदान जीतें
So to sum it up, these are the basics of Unciv – Found a prosperous first city, expand slowly to manage happiness, and set yourself up for the victory condition you wish to pursue.\nObviously, there is much more to it than that, but it is important not to jump into the deep end before you know how to swim. = इस तरह Unciv के मूल सिद्धांत हैं: समृद्ध पहला शहर बसाएँ, खुशी सँभालने के लिए धीरे विस्तार करें और चुनी हुई विजय शर्त की तैयारी करें।\nनिस्संदेह खेल में बहुत कुछ और है, किंतु तैरना सीखे बिना गहरे पानी में कूदना उचित नहीं।

Enemy City = शत्रु शहर
Cities can be conquered by reducing their health to 1, and entering the city with a melee unit.\nSince cities heal each turn, it is best to attack with ranged units and use your melee units to defend them until the city has been defeated! = शहर का स्वास्थ्य 1 तक घटाकर और निकट युद्ध इकाई से उसमें प्रवेश करके उसे जीत सकते हैं।\nशहर हर चाल ठीक होते हैं, इसलिए दूरमार इकाइयों से हमला करना और शहर हारने तक निकट युद्ध इकाइयों से उनकी रक्षा करना अच्छा है!

Luxury Resource = विलासिता संसाधन
Luxury resources within your domain and with their specific improvement are connected to your trade network.\nEach unique Luxury resource you have adds 5 happiness to your civilization, but extra resources of the same type don't add anything, so use them for trading with other civilizations! = आपके क्षेत्र के विलासिता संसाधन अपने विशिष्ट सुधार के साथ आपके व्यापार जाल से जुड़ते हैं।\nहर अलग प्रकार का विलासिता संसाधन सभ्यता को 5 खुशी देता है; उसी प्रकार की अतिरिक्त प्रतियाँ कुछ नहीं जोड़तीं, इसलिए उनसे अन्य सभ्यताओं के साथ व्यापार करें!

Strategic Resource = रणनीतिक संसाधन
Strategic resources within your domain and with their specific improvement are connected to your trade network.\nStrategic resources allow you to train units and construct buildings that require those specific resources, for example the Horseman requires Horses. = आपके क्षेत्र के रणनीतिक संसाधन अपने विशिष्ट सुधार के साथ व्यापार जाल से जुड़ते हैं।\nइनसे आप वे इकाइयाँ और भवन बना सकते हैं जिन्हें उस संसाधन की आवश्यकता है; उदाहरण के लिए घुड़सवार को घोड़ों की आवश्यकता है।
Unlike Luxury Resources, each Strategic Resource on the map provides more than one of that resource.\nThe top bar keeps count of how many unused strategic resources you own.\nA full drilldown of resources is available in the Resources tab in the Overview screen. = विलासिता संसाधनों से अलग, मानचित्र का प्रत्येक रणनीतिक संसाधन उस संसाधन की एक से अधिक मात्रा देता है।\nऊपरी पट्टी आपके बिना उपयोग वाले रणनीतिक संसाधनों की संख्या रखती है।\nसंसाधनों का पूरा विवरण अवलोकन दृश्य के संसाधन टैब में मिलता है।

The city can no longer put up any resistance!\nHowever, to conquer it, you must enter the city with a melee unit = शहर अब कोई प्रतिरोध नहीं कर सकता!\nकिंतु उसे जीतने के लिए आपको निकट युद्ध इकाई से उसमें प्रवेश करना होगा

After Conquering = जीतने के बाद
When conquering a city, you can choose to liberate, annex, puppet, or raze the city. = शहर जीतने पर आप उसे मुक्त करने, विलय करने, कठपुतली बनाने या ध्वस्त करने का चुनाव कर सकते हैं।
\nLiberating the city will return it to its original owner, giving you a massive diplomatic boost with them!\n\nAnnexing the city will give you full control over it, but also increase the citizens' unhappiness to 2x!\nThis can be mitigated by building a courthouse in the city, returning the citizen's unhappiness to normal.\n\nPuppeting the city will mean that you have no control on the city's production.\nThe city will not increase your tech or policy cost.\nA puppeted city can be annexed at any time, but annexed cities cannot be returned to a puppeted state!\n\nRazing the city will lower its population by 1 each turn until the city is destroyed!\nYou cannot raze a city that is either the starting capital of a civilization or the holy city of a religion. = \nशहर मुक्त करने पर वह अपने मूल स्वामी को लौटेगा और उसके साथ आपके कूटनीतिक संबंध बहुत सुधरेंगे!\n\nविलय करने पर शहर का पूरा नियंत्रण मिलेगा, किंतु नागरिकों का दुख 2x हो जाएगा!\nशहर में न्यायालय बनाकर इसे कम कर सकते हैं, जिससे नागरिकों का दुख सामान्य हो जाएगा।\n\nकठपुतली बनाने पर शहर के उत्पादन पर आपका नियंत्रण नहीं होगा।\nशहर आपकी तकनीक या नीति की लागत नहीं बढ़ाएगा।\nकठपुतली शहर का कभी भी विलय किया जा सकता है, किंतु विलय किए शहर को फिर कठपुतली नहीं बना सकते!\n\nशहर ध्वस्त करने पर हर चाल जनसंख्या 1 घटेगी, जब तक शहर नष्ट न हो जाए!\nकिसी सभ्यता की प्रारंभिक राजधानी या किसी धर्म के पवित्र शहर को ध्वस्त नहीं कर सकते।

You have encountered a barbarian unit!\nBarbarians attack everyone indiscriminately, so don't let your \n  civilian units go near them, and be careful of your scout! = आपको बर्बर इकाई मिली है!\nबर्बर बिना भेदभाव सब पर हमला करते हैं, इसलिए अपनी \n  नागरिक इकाइयाँ उनके पास न जाने दें और टोही के प्रति सावधान रहें!

You have encountered another civilization!\nOther civilizations start out peaceful, and you can trade with them,\n  but they may choose to declare war on you later on = आप दूसरी सभ्यता से मिले हैं!\nअन्य सभ्यताएँ आरंभ में शांतिपूर्ण होती हैं और आप उनसे व्यापार कर सकते हैं,\n  किंतु बाद में वे आप पर युद्ध घोषित कर सकती हैं

Injured Units = घायल इकाइयाँ
Injured units deal less damage, but recover after turns that they have been inactive.\nUnits heal 10 health per turn in enemy territory or neutral land,\n  20 inside your territory and 25 in your cities. = घायल इकाइयाँ कम क्षति करती हैं, किंतु निष्क्रिय रही चालों के बाद ठीक होती हैं।\nशत्रु क्षेत्र या तटस्थ भूमि में इकाइयाँ प्रति चाल 10 स्वास्थ्य ठीक करती हैं,\n  आपके क्षेत्र में 20 और आपके शहरों में 25।

Workers = कार्यकर्ता
Workers are vital to your cities' growth, since only they can construct improvements on tiles.\nImprovements raise the yield of your tiles, allowing your city to produce more and grow faster while working the same amount of tiles! = शहरों की वृद्धि के लिए कार्यकर्ता आवश्यक हैं, क्योंकि केवल वे टाइलों पर सुधार बना सकते हैं।\nसुधार टाइलों की उपज बढ़ाते हैं, जिससे समान संख्या के टाइलों पर काम करके शहर अधिक उत्पादन और तेज़ वृद्धि कर सकता है!

Embarking = जलयात्रा पर चढ़ना
Once a certain tech is researched, your land units can embark, allowing them to traverse water tiles.\nEntering or leaving water takes the entire turn. = विशिष्ट तकनीक का अनुसंधान होने पर आपकी स्थलीय इकाइयाँ जलयात्रा पर चढ़कर जलीय टाइलें पार कर सकती हैं।\nजल में प्रवेश करने या बाहर निकलने में पूरी चाल लगती है।
Units are defenseless while embarked (cannot use modifiers), and have a fixed Defending Strength based on your tech Era, so be careful!\nRanged Units can't attack, Melee Units have a Strength penalty, and all have limited vision. = जलयात्रा में इकाइयाँ रक्षाहीन होती हैं, संशोधक उपयोग नहीं कर सकतीं, और उनकी रक्षा शक्ति आपके तकनीकी युग पर आधारित निश्चित होती है, इसलिए सावधान रहें!\nदूरमार इकाइयाँ हमला नहीं कर सकतीं, निकट युद्ध इकाइयों की शक्ति घटती है और सबकी दृष्टि सीमित होती है।

Idle Units = निष्क्रिय इकाइयाँ
Clicking 'Next unit' moves to the next idle unit in the queue (as listed in Overview -> Units). After issuing an order to a unit, if 'Auto Unit Cycle' in Options -> Gameplay is enabled, you will automatically select the next idle unit. = 'अगली इकाई' पर क्लिक करने से कतार की अगली निष्क्रिय इकाई चुनी जाती है, जैसा अवलोकन -> इकाइयाँ में सूचीबद्ध है। इकाई को आदेश देने पर, यदि विकल्प -> खेल में 'स्वचालित इकाई चक्र' चालू है, तो अगली निष्क्रिय इकाई स्वतः चुनी जाएगी।
If you don't want to move a unit this turn, you can skip it by clicking 'Next unit' again, or command the unit to 'Skip turn'. = यदि इस चाल इकाई नहीं चलानी है, तो फिर 'अगली इकाई' क्लिक करके उसे छोड़ सकते हैं या इकाई को 'चाल छोड़ें' का आदेश दे सकते हैं।
If you want to disable the 'Next unit' feature entirely, you can toggle it in Options -> Gameplay -> Check for idle units. = 'अगली इकाई' सुविधा पूरी बंद करना चाहें, तो विकल्प -> खेल -> निष्क्रिय इकाइयाँ जाँचें में बदल सकते हैं।
If you'd rather 'Next unit' cycle the units and not mark them as Done, you can change it in the Options -> Gameplay menu. = यदि चाहते हैं कि 'अगली इकाई' केवल इकाइयों में घूमे और उन्हें पूर्ण चिह्नित न करे, तो विकल्प -> खेल मेनू में बदल सकते हैं।
You can also cycle through the idle units using the left and right triangles on the Unit Table in the lower left of the screen. Or by default using the Cycle button next to the 'Next Unit' button. = आप नीचे बाएँ इकाई तालिका के बाएँ और दाएँ त्रिकोणों से भी निष्क्रिय इकाइयों में घूम सकते हैं। या मूल व्यवस्था में 'अगली इकाई' के पास चक्र बटन का उपयोग करें।

 # Requires translation!
Contact Me = मुझसे संपर्क करें
 # Requires translation!
Hi there! If you've played this far, you've probably seen that the game is currently incomplete.\n Unciv will remain open-source forever. = नमस्ते! अगर आपने यहाँ तक खेला है, तो शायद आपने देखा होगा कि खेल अभी अधूरा है।\n Unciv हमेशा ओपन-सोर्स रहेगा।
 # Requires translation!
What motivates me to keep working on it, \n  besides the fact I think it's amazingly cool that I can,\n  is the support from the players - you guys are the best! = इस पर काम करते रहने के लिए मुझे जो प्रेरित करता है, \n  इस बात के अलावा कि मैं इसे कर सकता हूँ और यह मुझे बेहद शानदार लगता है,\n  वह है खिलाड़ियों का समर्थन—आप लोग सबसे अच्छे हैं!
 # Requires translation!
If you like Unciv, please rate and review it in the App Store.\n If you find a problem or have a suggestion, open a GitHub issue and help us make the game even better! = अगर आपको Unciv पसंद है, तो कृपया App Store में इसे रेट करें और समीक्षा लिखें।\n अगर आपको कोई समस्या मिलती है या कोई सुझाव है, तो GitHub issue खोलें और खेल को और बेहतर बनाने में हमारी मदद करें!

Pillaging = लूटपाट
Military units can pillage improvements, which heals them 25 health and ruins the improvement.\nThe tile can still be worked, but advantages from the improvement - stat bonuses and resources - will be lost.\nWorkers can repair these improvements, which takes less time than building the improvement from scratch.\nPillaging certain improvements will result in your units looting gold from the improvement. = सैन्य इकाइयाँ सुधार लूट सकती हैं, जिससे उनका 25 स्वास्थ्य ठीक होता है और सुधार बर्बाद हो जाता है।\nटाइल पर काम फिर भी हो सकता है, किंतु सुधार के लाभ, यानी आँकड़ों के बोनस और संसाधन, खो जाएँगे।\nकार्यकर्ता इन सुधारों की मरम्मत कर सकते हैं, जिसमें नया सुधार बनाने से कम समय लगता है।\nकुछ सुधारों की लूटपाट से इकाइयाँ वहाँ से स्वर्ण भी लूटेंगी।

Experience = अनुभव
Units that enter combat gain experience, which can then be used on promotions for that unit.\nUnits gain more experience when in Melee combat than Ranged, and more when attacking than when defending. = युद्ध में उतरने वाली इकाइयों को अनुभव मिलता है, जिसे उनकी पदोन्नति में उपयोग कर सकते हैं।\nनिकट युद्ध में दूरमार युद्ध से अधिक और हमला करने पर रक्षा करने से अधिक अनुभव मिलता है।
Units can only gain up to 30 XP from Barbarian units - meaning up to 2 promotions. After that, Barbarian units will provide no experience. = इकाइयाँ बर्बरों से अधिकतम 30 XP, यानी अधिकतम 2 पदोन्नतियाँ पा सकती हैं। उसके बाद बर्बर इकाइयों से अनुभव नहीं मिलता।

Combat = युद्ध
Unit and cities are worn down by combat, which is affected by a number of different values.\nEach unit has a certain 'base' combat value, which can be improved by certain conditions, promotions and locations. = युद्ध से इकाइयाँ और शहर घिसते हैं; इसका प्रभाव कई अलग मानों पर निर्भर करता है।\nप्रत्येक इकाई का एक निश्चित 'मूल' युद्ध मान होता है, जिसे कुछ परिस्थितियाँ, पदोन्नतियाँ और स्थान बढ़ा सकते हैं।
Units use the 'Strength' value as the base combat value when melee attacking and when defending.\nWhen using a ranged attack, they will the use the 'Ranged Strength' value instead. = निकट युद्ध हमला और रक्षा करते समय इकाइयाँ 'शक्ति' को मूल युद्ध मान बनाती हैं।\nदूरमार हमला करते समय वे इसके बदले 'दूरमार शक्ति' का उपयोग करती हैं।
Ranged attacks can be done from a distance, dependent on the 'Range' value of the unit.\nWhile melee attacks allow the defender to damage the attacker in retaliation, ranged attacks do not. = दूरमार हमले इकाई की 'मारक दूरी' के अनुसार दूरी से किए जा सकते हैं।\nनिकट युद्ध हमले में रक्षक पलटकर हमलावर को क्षति दे सकता है, किंतु दूरमार हमले में नहीं।

Embassies = दूतावास
Establishing an embassy in other players' Capital city shows the location of their Capital, likewise other players who establish an embassy in your Capital can see location of your Capital. = दूसरे खिलाड़ी की राजधानी में दूतावास स्थापित करने से उसका स्थान दिखता है। इसी तरह आपकी राजधानी में दूतावास बनाने वाले खिलाड़ी आपकी राजधानी का स्थान देख सकते हैं।
Embassies thus allow Spies to be placed in another players' Capital City if Espionage is enabled. = इसलिए जासूसी चालू होने पर दूतावास दूसरे खिलाड़ी की राजधानी में जासूस रखने देते हैं।
Mutual embassies are required to allow trading open borders and to sign Research Agreement and Defensive Pact. = खुली सीमाओं का व्यापार करने तथा अनुसंधान समझौते और रक्षा संधि पर हस्ताक्षर करने के लिए पारस्परिक दूतावास आवश्यक हैं।
Declaring war on another player or denouncing them will remove embassies from both players' Capitals. You will have to re-establish them to use their effect. = दूसरे खिलाड़ी पर युद्ध घोषित करने या उसकी निंदा करने पर दोनों राजधानियों से दूतावास हट जाते हैं। प्रभाव पाने के लिए उन्हें फिर स्थापित करना होगा।
Re-establishing an embassy after denunciation from either side becomes available next turn, while re-establishing them when at war requires a peace treaty. = किसी पक्ष की निंदा के बाद अगली चाल दूतावास फिर स्थापित कर सकते हैं, जबकि युद्ध के दौरान इसके लिए शांति संधि आवश्यक है।
Be cautious when accepting embassy from other players because they can spy on your capital, or worse may start planning to attack you. = अन्य खिलाड़ियों के दूतावास स्वीकार करते समय सावधान रहें; वे आपकी राजधानी की जासूसी कर सकते हैं या उससे भी बुरा, हमले की योजना बना सकते हैं।
Note that before you can offer an embassy, you need the required Technology. = दूतावास का प्रस्ताव देने से पहले आवश्यक तकनीक चाहिए।
Embassies are available using the Gods and Kings ruleset. = दूतावास गॉड्स ऐंड किंग्स नियमसमूह में उपलब्ध हैं।
Defensive Pacts = रक्षा संधियाँ

Open Borders from other player and vice versa allow units to freely pass through their territory. = दूसरे खिलाड़ी से मिली खुली सीमाएँ और उसे दी गई खुली सीमाएँ इकाइयों को संबंधित क्षेत्र से स्वतंत्रता से गुज़रने देती हैं।
They also let Missionaries to enter other players' territory without suffering attrition. = वे धर्मप्रचारकों को भी बिना क्षय झेले अन्य खिलाड़ियों के क्षेत्र में जाने देती हैं।
Open Borders expire depending on game speed and are canceled upon Declaration of War, the closure however takes effect only after war ends and need to be traded again. = खुली सीमाओं की अवधि खेल की गति पर निर्भर है और युद्ध घोषित होने पर वे रद्द होती हैं; किंतु बंद होना युद्ध समाप्त होने के बाद ही प्रभावी होता है और उन्हें फिर व्यापार से लेना पड़ता है।
You gain diplomatic boost with other AI player if you both have Open Borders to each other = दूसरे AI खिलाड़ी के साथ दोनों ओर खुली सीमाएँ होने पर आपको कूटनीतिक लाभ मिलता है
Be cautious when giving Open Borders because other player may settle a City near your lands in an area you are planning to use, they may also use your territory to attack your friends or City State allies. = खुली सीमाएँ देते समय सावधान रहें; दूसरा खिलाड़ी आपकी भूमि के पास उस जगह शहर बसा सकता है जिसे आप उपयोग करना चाहते थे। वह आपके क्षेत्र से आपके मित्रों या सहयोगी नगर-राज्यों पर हमला भी कर सकता है।
Note that before you can offer or accept open borders, both Nations need the required Technology. = खुली सीमाएँ देने या स्वीकार करने से पहले दोनों राष्ट्रों के पास आवश्यक तकनीक होनी चाहिए।
When playing with the Gods and Kings ruleset mutual embassies need to be established before Open Borders can be traded. = गॉड्स ऐंड किंग्स नियमसमूह में खुली सीमाओं का व्यापार करने से पहले पारस्परिक दूतावास स्थापित होने चाहिए।

In Research Agreements, you and another civilization decide to jointly research technology.\nAt the end of the agreement, you will both receive a 'lump sum' of ⍾Science, which will go towards one of your unresearched technologies. = अनुसंधान समझौते में आप और दूसरी सभ्यता मिलकर तकनीक का अनुसंधान करने का निर्णय लेते हैं।\nसमझौते के अंत में दोनों को एकमुश्त ⍾विज्ञान मिलता है, जो किसी ऐसी तकनीक में लगता है जिसका अनुसंधान अभी नहीं हुआ।
The amount of ⍾Science you receive at the end is dependent on the ⍾Science generated by your cities and the other civilization's cities during the agreement - the more, the better! = अंत में मिलने वाला ⍾विज्ञान समझौते के दौरान आपके और दूसरी सभ्यता के शहरों द्वारा उत्पन्न ⍾विज्ञान पर निर्भर है — जितना अधिक, उतना अच्छा!
Note that before you can invest in a research agreement, you must have a Declaraction of Friendship, both Nations need the required Technology, and both Nations need enough Gold on hand for the agreement. = अनुसंधान समझौते में निवेश से पहले मित्रता की घोषणा, दोनों राष्ट्रों के पास आवश्यक तकनीक और समझौते के लिए पर्याप्त स्वर्ण होना आवश्यक है।
When playing with the Gods and Kings ruleset mutual embassies need to be established before a Research Agreement can be signed. = गॉड्स ऐंड किंग्स नियमसमूह में अनुसंधान समझौता करने से पहले पारस्परिक दूतावास स्थापित होने चाहिए।

Defensive pacts allow you and another civ to protect one another from aggressors.\nOnce the defensive pact is signed, you will be drawn into their future defensive wars, just as they will be drawn into your future defensive wars. Declaring war on any Civ will remove all of your defensive pacts. You will have to re-sign them to use their effect. = रक्षा संधियाँ आपको और दूसरी सभ्यता को आक्रमणकारियों से एक-दूसरे की रक्षा करने देती हैं।\nसंधि के बाद आप उनके भावी रक्षात्मक युद्धों में शामिल होंगे और वे आपके भावी रक्षात्मक युद्धों में। किसी भी सभ्यता पर युद्ध घोषित करने से आपकी सभी रक्षा संधियाँ हट जाती हैं। प्रभाव पाने के लिए उन्हें फिर करना होगा।
Be cautious when signing defensive pacts because they can bring you into wars that you might not want to be in. = रक्षा संधि करते समय सावधान रहें, क्योंकि वह आपको ऐसे युद्धों में खींच सकती है जिनमें आप नहीं जाना चाहते।
The AI is very careful and will not accept defensive pacts with less than 80 influence. = AI बहुत सावधान है और 80 से कम प्रभाव पर रक्षा संधि स्वीकार नहीं करेगा।
Note that before you can sign a defensive pact, you must have a Declaraction of Friendship, and both Nations need the required Technology. = रक्षा संधि करने से पहले मित्रता की घोषणा और दोनों राष्ट्रों के पास आवश्यक तकनीक होनी चाहिए।
When playing with the Gods and Kings ruleset mutual embassies need to be established before a Defensive Pact can be signed. = गॉड्स ऐंड किंग्स नियमसमूह में रक्षा संधि करने से पहले पारस्परिक दूतावास स्थापित होने चाहिए।

Not all nations are contending with you for victory.\nCity-States are nations that can't win, can't be traded with, and instead confer certain bonuses to friendly civilizations. = हर राष्ट्र विजय के लिए आपसे प्रतिस्पर्धा नहीं करता।\nनगर-राज्य ऐसे राष्ट्र हैं जो जीत नहीं सकते, जिनसे व्यापार नहीं हो सकता और जो मित्र सभ्यताओं को कुछ बोनस देते हैं।
Instead, diplomatic relations with City-States are determined by Influence - a meter of 'how much the City-State likes you'.\nInfluence can be increased by attacking their enemies, liberating their city, and giving them sums of gold. = नगर-राज्यों से कूटनीतिक संबंध प्रभाव से तय होते हैं — यह माप कि 'नगर-राज्य आपको कितना पसंद करता है'।\nउनके शत्रुओं पर हमला करके, उनका शहर मुक्त करके और स्वर्ण देकर प्रभाव बढ़ा सकते हैं।
Certain bonuses are given when you are at above 30 influence.\nWhen you have above 60 Influence, and you have the highest influence with them of all civilizations, you are considered their 'Ally', and gain further bonuses and access to the Luxury and Strategic resources in their lands. = 30 से अधिक प्रभाव पर कुछ बोनस मिलते हैं।\n60 से अधिक प्रभाव होने और सभी सभ्यताओं में आपके प्रभाव के सर्वोच्च होने पर आप उनके 'सहयोगी' माने जाते हैं तथा अतिरिक्त बोनस और उनकी भूमि के विलासिता व रणनीतिक संसाधन पाते हैं।

While working the land is good, eventually your Citizens will want to Specialize. = भूमि पर काम करना अच्छा है, किंतु अंततः नागरिक विशेषज्ञ बनना चाहेंगे।
Certain Buildings will also provide Specialist Slots. These slots will show up in the Citizen Management within the City Screen under Specialists. Each slot can be filled with a Citizen which will then become a Specialist. = कुछ भवन विशेषज्ञ स्थान भी देते हैं। ये शहर दृश्य में नागरिक प्रबंधन के विशेषज्ञ भाग में दिखते हैं। हर स्थान में एक नागरिक रख सकते हैं, जो विशेषज्ञ बन जाता है।
Each Specialist will generate a certain amount of yield as indicated to the right of the available slots. = हर विशेषज्ञ उपलब्ध स्थानों के दाएँ दर्शाई गई निश्चित उपज देता है।
While these are a great way to specialize the yield production of a City outside of the surrounding Tile Yields, Specialists have an additional value. Each one also generates Great Person Points each turn. With enough of them, a new Great Person will join your Nation. = आसपास के टाइलों की उपज से अलग शहर की उपज को विशेष बनाने के अलावा विशेषज्ञों का एक और महत्व है। प्रत्येक प्रति चाल महान व्यक्ति अंक भी देता है। पर्याप्त अंक होने पर नया महान व्यक्ति आपके राष्ट्र में आएगा।
Great People = महान व्यक्ति

Certain buildings, and specialists in cities, generate Great Person points per turn.\nThere are several types of Great People, and their points accumulate separately.\nThe number of points per turn and accumulated points can be viewed in the Overview screen. = शहरों के कुछ भवन और विशेषज्ञ प्रति चाल महान व्यक्ति अंक देते हैं।\nमहान व्यक्तियों के कई प्रकार हैं और उनके अंक अलग-अलग जमा होते हैं।\nप्रति चाल और कुल जमा अंक अवलोकन दृश्य में देख सकते हैं।
Alternatively, the Great Person points breakdown per city can be viewed in each City Screen (see UI Tips article). = वैकल्पिक रूप से प्रत्येक शहर के महान व्यक्ति अंकों का विवरण उसके शहर दृश्य में देख सकते हैं; इंटरफ़ेस सुझाव लेख देखें।
Once enough points have been accumulated, a Great Person of that type will be created!\nEach Great Person can construct a certain Great Improvement which gives large yields over time, or immediately consumed to provide a certain bonus now. = पर्याप्त अंक जमा होने पर उसी प्रकार का महान व्यक्ति पैदा होगा!\nहर महान व्यक्ति एक विशिष्ट महान सुधार बना सकता है जो समय के साथ बहुत उपज देता है, या उसे तुरंत खर्च करके अभी कोई बोनस पा सकते हैं।
Great Improvements also provide any strategic resources that are under them, so you don't need to worry if resources are revealed underneath your improvements! = महान सुधार अपने नीचे के रणनीतिक संसाधन भी देते हैं, इसलिए सुधार के नीचे संसाधन प्रकट होने पर चिंता नहीं करनी है!

Removing Terrain Features = भूभाग की विशेषताएँ हटाना
Certain tiles have terrain features - like Flood plains or Forests -  on top of them. Some of these layers, like Jungle, Marsh and Forest, can be removed by workers.\nRemoving the terrain feature does not remove any resources in the tile, and is usually required in order to add improvements exploiting those resources. = कुछ टाइलों पर बाढ़ के मैदान या वन जैसी भूभाग विशेषताएँ होती हैं। जंगल, दलदल और वन जैसी कुछ परतें कार्यकर्ता हटा सकते हैं।\nविशेषता हटाने से टाइल का कोई संसाधन नहीं हटता और उस संसाधन का उपयोग करने वाला सुधार बनाने से पहले अक्सर इसे हटाना आवश्यक होता है।

Natural Wonders, such as the Mt. Fuji, the Rock of Gibraltar and the Great Barrier Reef, are unique, impassable terrain features, masterpieces of mother Nature, which possess exceptional qualities that make them very different from the average terrain.\nThey benefit by giving you large sums of Culture, ⍾Science, Gold or Production if worked by your Cities, which is why you might need to bring them under your empire as soon as possible. = फ़ूजी पर्वत, जिब्राल्टर की चट्टान और ग्रेट बैरियर रीफ़ जैसे प्राकृतिक अजूबे अद्वितीय, अगम्य भूभाग विशेषताएँ और प्रकृति माता की उत्कृष्ट कृतियाँ हैं। उनकी असाधारण विशेषताएँ उन्हें सामान्य भूभाग से बहुत अलग बनाती हैं।\nआपके शहर उन पर काम करें तो वे बहुत संस्कृति, ⍾विज्ञान, स्वर्ण या उत्पादन देते हैं, इसलिए उन्हें शीघ्र अपने साम्राज्य में लाना उचित हो सकता है।

Keyboard = कीबोर्ड
If you have a keyboard, some shortcut keys become available. Unit command or improvement picker keys, for example, are shown directly in their corresponding buttons. = कीबोर्ड होने पर कुछ शॉर्टकट कुंजियाँ उपलब्ध होती हैं। उदाहरण के लिए इकाई के आदेश या सुधार चुनने की कुंजियाँ संबंधित बटनों पर सीधे दिखती हैं।
On the world screen the hotkeys are as follows: = विश्व दृश्य में शॉर्टकट कुंजियाँ इस प्रकार हैं:
Space or 'N' - Next unit or turn\n'E' - Empire overview (last viewed page)\n'+', '-' - Zoom in / out\nHome - center on capital or open its City Screen if already centered = Space या 'N' - अगली इकाई या चाल\n'E' - साम्राज्य अवलोकन, पिछला देखा पृष्ठ\n'+', '-' - ज़ूम बढ़ाएँ / घटाएँ\nHome - राजधानी पर केंद्रित करें या पहले से केंद्रित होने पर उसका शहर दृश्य खोलें
F1 - Open Civilopedia\nF2 - Empire overview Trades\nF3 - Empire overview Units\nF4 - Empire overview Diplomacy\nF5 - Social policies\nF6 - Technologies\nF7 - Empire overview Cities\nF8 - Victory Progress\nF9 - Empire overview Stats\nF10 - Empire overview Resources\nF11 - Quicksave\nF12 - Quickload = F1 - सिविलोपीडिया खोलें\nF2 - साम्राज्य अवलोकन में व्यापार\nF3 - साम्राज्य अवलोकन में इकाइयाँ\nF4 - साम्राज्य अवलोकन में कूटनीति\nF5 - सामाजिक नीतियाँ\nF6 - तकनीकें\nF7 - साम्राज्य अवलोकन में शहर\nF8 - विजय प्रगति\nF9 - साम्राज्य अवलोकन में आँकड़े\nF10 - साम्राज्य अवलोकन में संसाधन\nF11 - तुरंत सहेजें\nF12 - तुरंत लोड करें
Ctrl-R - Toggle tile resource display\nCtrl-Y - Toggle tile yield display\nCtrl-O - Game options\nCtrl-S - Save game\nCtrl-L - Load game\nCtrl-U - Toggle UI (World Screen only) = Ctrl-R - टाइल के संसाधन दिखाएँ/छिपाएँ\nCtrl-Y - टाइल की उपज दिखाएँ/छिपाएँ\nCtrl-O - खेल के विकल्प\nCtrl-S - खेल सहेजें\nCtrl-L - खेल लोड करें\nCtrl-U - इंटरफ़ेस दिखाएँ/छिपाएँ, केवल विश्व दृश्य में
All of these can be reassigned. = इन सभी कुंजियों को फिर निर्धारित किया जा सकता है।

This is where you spend most of your time playing Unciv. See the world, control your units, access other screens from here. = Unciv खेलते समय आपका अधिकांश समय यहीं बीतेगा। यहाँ से विश्व देखें, इकाइयाँ नियंत्रित करें और अन्य दृश्य खोलें।
①: The menu button - civilopedia, save, load, options... = ①: मेनू बटन — सिविलोपीडिया, सहेजना, लोड करना, विकल्प...
②: The player/nation whose turn it is - click for diplomacy overview. = ②: वह खिलाड़ी/राष्ट्र जिसकी चाल है — कूटनीति अवलोकन के लिए क्लिक करें।
③: The Technology Button - shows the tech tree which allows viewing or researching technologies. = ③: तकनीक बटन — प्रौद्योगिकी वृक्ष दिखाता है, जहाँ तकनीकें देख या उनका अनुसंधान कर सकते हैं।
④: The Social Policies Button - shows enacted and selectable policies, and with enough culture points you can enact new ones. = ④: सामाजिक नीति बटन — लागू और चुनी जा सकने वाली नीतियाँ दिखाता है। पर्याप्त संस्कृति अंकों पर नई नीतियाँ लागू कर सकते हैं।
⑤: The Diplomacy Button - shows the diplomacy manager where you can talk to other civilizations. = ⑤: कूटनीति बटन — कूटनीति प्रबंधक दिखाता है, जहाँ अन्य सभ्यताओं से बात कर सकते हैं।
⑥: Unit Action Buttons - while a unit is selected its possible actions appear here. = ⑥: इकाई कार्रवाई बटन — इकाई चुनी होने पर उसकी उपलब्ध कार्रवाइयाँ यहाँ दिखती हैं।
⑦: The unit/city info pane - shows information about a selected unit or city. = ⑦: इकाई/शहर सूचना पट — चुनी इकाई या शहर की जानकारी दिखाता है।
⑧: The name (and unit icon) of the selected unit or city, with current health if wounded. Clicking a unit name or icon will open its civilopedia entry. = ⑧: चुनी इकाई या शहर का नाम और इकाई चिह्न; घायल होने पर वर्तमान स्वास्थ्य भी। इकाई के नाम या चिह्न पर क्लिक करने से उसकी सिविलोपीडिया प्रविष्टि खुलती है।
⑨: The arrow buttons allow jumping to the next/previous idle unit. = ⑨: तीर बटन अगली/पिछली निष्क्रिय इकाई पर ले जाते हैं।
⑩: For a selected unit, its promotions appear here, and clicking leads to the promotions screen for that unit. = ⑩: चुनी इकाई की पदोन्नतियाँ यहाँ दिखती हैं; क्लिक करने पर उसी इकाई का पदोन्नति दृश्य खुलता है।
⑪: Remaining/per turn movement points, strength and experience / XP needed for promotion. For cities, you get its combat strength. = ⑪: शेष/प्रति चाल गति अंक, शक्ति और अनुभव / पदोन्नति के लिए आवश्यक XP। शहरों के लिए उसकी युद्ध शक्ति मिलती है।
⑫: This button closes the selected unit/city info pane. = ⑫: यह बटन चुनी इकाई/शहर का सूचना पट बंद करता है।
⑬: This pane appears when you order a unit to attack an enemy. On top are attacker and defender with their respective base strengths. = ⑬: इकाई को शत्रु पर हमला करने का आदेश देते समय यह पट दिखता है। ऊपर हमलावर और रक्षक अपनी-अपनी मूल शक्ति के साथ हैं।
⑭: Below that are strength bonuses or penalties and health bars projecting before / after the attack. = ⑭: उसके नीचे शक्ति के बोनस या दंड और हमले से पहले/बाद के अनुमानित स्वास्थ्य की पट्टियाँ हैं।
⑮: The Attack Button - let blood flow! = ⑮: हमला बटन — रक्त बहने दें!
⑯: The minimap shows an overview over the world, with known cities, terrain and fog of war. Clicking will position the main map. = ⑯: लघु मानचित्र विश्व का अवलोकन दिखाता है, जिसमें ज्ञात शहर, भूभाग और युद्ध का कोहरा हैं। क्लिक करने से मुख्य मानचित्र की स्थिति बदलती है।
⑰: To the side of the minimap are display feature toggling buttons - tile yield, worked indicator, show/hide resources. These mirror setting on the options screen and are hidden if you deactivate the minimap. = ⑰: लघु मानचित्र के पास प्रदर्शन बदलने वाले बटन हैं — टाइल की उपज, काम का संकेत, संसाधन दिखाना/छिपाना। ये विकल्प दृश्य की सेटिंग दर्शाते हैं और लघु मानचित्र बंद करने पर छिप जाते हैं।
⑱: Tile information for the selected hex - current or potential yield, terrain, effects, present units, city located there and such. Where appropriate, clicking a line opens the corresponding civilopedia entry. = ⑱: चुने षट्भुज की जानकारी — वर्तमान या संभावित उपज, भूभाग, प्रभाव, मौजूद इकाइयाँ, वहाँ का शहर आदि। जहाँ लागू हो, पंक्ति पर क्लिक करने से संबंधित सिविलोपीडिया प्रविष्टि खुलती है।
⑲: Notifications - what happened during the last 'next turn' phase. Some are clickable to show a relevant place on the map, some even show several when you click repeatedly. = ⑲: सूचनाएँ — पिछली 'अगली चाल' अवस्था में क्या हुआ। कुछ पर क्लिक करके मानचित्र पर संबंधित स्थान देख सकते हैं; कुछ पर बार-बार क्लिक करने से कई स्थान दिखते हैं।
⑳: The Next Turn Button - unless there are things to do, in which case the label changes to 'next unit', 'pick policy' and so on. = ⑳: अगली चाल बटन — जब तक कुछ काम शेष न हो; तब इसका नाम 'अगली इकाई', 'नीति चुनें' आदि हो जाता है।
㉑: The Multiplayer Button - Here you can easily check your active multiplayer games. = ㉑: बहुखिलाड़ी बटन — यहाँ अपने सक्रिय बहुखिलाड़ी खेल आसानी से देख सकते हैं।
ⓐ: The overview button leads to the empire overview screen with various tabs (the last one viewed is remembered) holding vital information about the state of your civilization in the world. = ⓐ: अवलोकन बटन साम्राज्य अवलोकन खोलता है। इसके विभिन्न टैब, जिनमें पिछला देखा टैब याद रहता है, विश्व में आपकी सभ्यता की स्थिति की महत्वपूर्ण जानकारी रखते हैं।
ⓑ: The ♪Culture icon shows accumulated ♪Culture and ♪Culture needed for the next policy - in this case, the exclamation mark tells us a next policy can be enacted. Clicking is another way to the policies manager. = ⓑ: ♪संस्कृति चिह्न जमा ♪संस्कृति और अगली नीति के लिए आवश्यक ♪संस्कृति दिखाता है। यहाँ विस्मयादिबोधक चिह्न बताता है कि नई नीति लागू हो सकती है। क्लिक करना नीति प्रबंधक तक पहुँचने का एक और तरीका है।
ⓒ: Your known strategic resources are displayed here with the available (usage already deducted) number - click to go to the resources overview screen. = ⓒ: आपके ज्ञात रणनीतिक संसाधन उपलब्ध संख्या के साथ यहाँ दिखते हैं; उपयोग घटाया जा चुका है। संसाधन अवलोकन के लिए क्लिक करें।
ⓓ: Happiness/unhappiness balance and either golden age with turns left or accumulated happiness with amount needed for a golden age is shown next to the smiley. Clicking also leads to the resources overview screen as luxury resources are a way to improve happiness. = ⓓ: चेहरे के पास खुशी/दुख का संतुलन तथा स्वर्ण-युग की बची चालें या जमा खुशी और स्वर्ण-युग के लिए आवश्यक मात्रा दिखती है। क्लिक करने से संसाधन अवलोकन भी खुलता है, क्योंकि विलासिता संसाधन खुशी बढ़ाने का एक तरीका हैं।
ⓔ: The ⍾Science icon shows the number of ⍾Science points produced per turn. Clicking leads to the technology tree. = ⓔ: ⍾विज्ञान चिह्न प्रति चाल उत्पन्न ⍾विज्ञान अंक दिखाता है। क्लिक करने पर प्रौद्योगिकी वृक्ष खुलता है।
ⓕ: Number of turns played with translation into calendar years. Click to see the victory overview. = ⓕ: खेली गई चालों की संख्या और उनके अनुसार कैलेंडर वर्ष। विजय अवलोकन देखने के लिए क्लिक करें।
ⓖ: The number of gold coins in your treasury and income. Clicks lead to the Stats overview screen. = ⓖ: आपके खज़ाने के स्वर्ण सिक्कों की संख्या और आय। क्लिक करने पर आँकड़े अवलोकन खुलता है।
ⓗ: The quantity of ☮Faith your citizens have generated, or 'off' if religion is disabled. Clicking it makes you go to the religion overview screen. = ⓗ: नागरिकों द्वारा उत्पन्न ☮आस्था की मात्रा, या धर्म बंद होने पर 'बंद'। क्लिक करने से धर्म अवलोकन खुलता है।
ⓧ: In the center of all this - the world map! Here, the "X" marks a spot outside the map. Yes, unless the wrap option was used, Unciv worlds are flat. Don't worry, your ships won't fall off the edge. = ⓧ: इस सबके बीच विश्व मानचित्र है! यहाँ "X" मानचित्र से बाहर का स्थान दर्शाता है। हाँ, लपेटने का विकल्प उपयोग न होने पर Unciv के विश्व सपाट हैं। चिंता न करें, आपके जहाज़ किनारे से नहीं गिरेंगे।
ⓨ: By the way, here's how an empire border looks like - it's in the national colours of the nation owning the territory. = ⓨ: वैसे, साम्राज्य की सीमा ऐसी दिखती है — क्षेत्र के स्वामी राष्ट्र के राष्ट्रीय रंगों में।
ⓩ: And this is the red targeting circle that led to the attack pane back under ⑬. = ⓩ: यह वही लाल निशाना वृत्त है जिसके कारण ⑬ के नीचे हमला पट खुला था।
What you don't see: The phone/tablet's back button will pop the question whether you wish to leave Unciv and go back to Real Life. On desktop versions, you can use the ESC key. = जो नहीं दिखता: फ़ोन/टैबलेट का वापस बटन पूछेगा कि क्या आप Unciv छोड़कर वास्तविक जीवन में लौटना चाहते हैं। डेस्कटॉप पर ESC कुंजी उपयोग कर सकते हैं।

When at later stages of the game, you might have a lot of units but only a little to do. To help you we have implemented an AutoPlay feature that lets you use the AI to play part or all of your turn. = खेल के बाद के चरणों में आपके पास बहुत इकाइयाँ पर थोड़ा काम हो सकता है। सहायता के लिए स्वचालित खेल सुविधा है, जो AI को आपकी चाल का कुछ या पूरा भाग खेलने देती है।
To enable AutoPlay, go to options and open the AutoPlay tab and press "Show AutoPlay button". = स्वचालित खेल चालू करने के लिए विकल्प खोलें, स्वचालित खेल टैब पर जाएँ और "स्वचालित खेल बटन दिखाएँ" दबाएँ।
Clicking on the AutoPlay button opens a popup menue for choosing to AutoPlay parts or all of your turn. = स्वचालित खेल बटन पर क्लिक करने से पॉपअप मेनू खुलता है, जहाँ चाल के कुछ या सभी भाग स्वचालित खेलने के लिए चुन सकते हैं।
Clicking Start AutoPlay in the pop-up menue or long pressing the AutoPlay button begins the multi-turn AutoPlay. This will play your next turns as if you were an AI. = पॉपअप मेनू में स्वचालित खेल शुरू करें क्लिक करने या स्वचालित खेल बटन देर तक दबाने से अनेक चालों का स्वचालित खेल शुरू होता है। आपकी अगली चालें AI की तरह खेली जाएँगी।
To cancel multi-turn AutoPlay you can press the AutoPlay button, next turn button or open the options menue. = अनेक चालों का स्वचालित खेल रोकने के लिए स्वचालित खेल बटन, अगली चाल बटन दबाएँ या विकल्प मेनू खोलें।
Multi-turn AutoPlay is not advised on harder difficulty levels as your AI will not play better against an AI with modifiers. = अधिक कठिन स्तरों पर अनेक चालों का स्वचालित खेल उचित नहीं है, क्योंकि आपका AI संशोधक वाले AI के विरुद्ध बेहतर नहीं खेलेगा।
Multi-turn AutoPlay for multiplayer is not yet supported. = बहुखिलाड़ी में अनेक चालों का स्वचालित खेल अभी समर्थित नहीं है।

After building a shrine, your civilization will start generating ☮Faith. = देवस्थान बनाने के बाद आपकी सभ्यता ☮आस्था उत्पन्न करने लगेगी।
When enough ☮Faith has been generated, you will be able to found a pantheon. = पर्याप्त ☮आस्था होने पर आप देवमंडल स्थापित कर सकेंगे।
A pantheon will provide a small bonus for your civilization that will apply to all cities that have it as a majority religion. = देवमंडल आपकी सभ्यता को छोटा बोनस देता है, जो उन सभी शहरों पर लागू होता है जहाँ वह बहुसंख्यक धर्म है।
Each civilization can only choose a single pantheon belief, and each pantheon can only be chosen once. = हर सभ्यता केवल एक देवमंडल विश्वास चुन सकती है और हर देवमंडल केवल एक बार चुना जा सकता है।
Generating more ☮Faith will allow you to found a religion. = अधिक ☮आस्था उत्पन्न करने से आप धर्म स्थापित कर सकेंगे।

Keep generating ☮Faith, and eventually a great prophet will be born in one of your cities. = ☮आस्था उत्पन्न करते रहें; अंततः आपके किसी शहर में महान पैगंबर जन्म लेगा।
This great prophet can be used for multiple things: Constructing a holy site, founding a religion and spreading your religion. = इस महान पैगंबर के कई उपयोग हैं: पवित्र स्थल बनाना, धर्म स्थापित करना और धर्म फैलाना।
When founding your religion, you may choose another two beliefs. The founder belief will only apply to you, while the follower belief will apply to all cities following your religion. = धर्म स्थापित करते समय आप दो और विश्वास चुन सकते हैं। संस्थापक विश्वास केवल आप पर लागू होगा, जबकि अनुयायी विश्वास आपके धर्म का पालन करने वाले सभी शहरों पर लागू होगा।
Additionally, the city where you used your great prophet will become the holy city of that religion. = इसके अतिरिक्त जिस शहर में आपने महान पैगंबर उपयोग किया, वह उस धर्म का पवित्र शहर बन जाएगा।
Once you have founded a religion, great prophets will keep being born every so often, though the amount of Faith☮ you have to save up will be higher. = धर्म स्थापित करने के बाद समय-समय पर महान पैगंबर जन्म लेते रहेंगे, किंतु हर बार अधिक आस्था☮ जमा करनी होगी।
One of these great prophets can then be used to enhance your religion. = फिर इनमें से एक महान पैगंबर से अपना धर्म सुदृढ़ कर सकते हैं।
This will allow you to choose another follower belief, as well as an enhancer belief, that only applies to you. = इससे आप एक और अनुयायी विश्वास तथा केवल आप पर लागू होने वाला सुदृढ़कर्ता विश्वास चुन सकते हैं।
Do take care founding a religion soon, only about half the players in the game are able to found a religion! = धर्म जल्दी स्थापित करने का ध्यान रखें; खेल के केवल लगभग आधे खिलाड़ी ही धर्म स्थापित कर सकते हैं!

Religion inside cities = शहरों में धर्म
When founding a city, it won't follow a religion immediately. = नया शहर बसाते ही वह तुरंत किसी धर्म का पालन नहीं करता।
The religion a city follows depends on the total pressure each religion has within the city. = शहर का धर्म उसमें प्रत्येक धर्म के कुल दबाव पर निर्भर करता है।
Followers are allocated in the same proportions as these pressures, and these followers can be viewed in the City Screen. = अनुयायी इन दबावों के समान अनुपात में बाँटे जाते हैं और उन्हें शहर दृश्य में देख सकते हैं।
You are allowed to check religious followers and pressures in cities you do not own by selecting them. = आप अपने स्वामित्व से बाहर के शहर चुनकर उनके धार्मिक अनुयायी और दबाव देख सकते हैं।
In both places, a tap/click on the icon of a religion will show detailed information with its effects. = दोनों जगह धर्म के चिह्न पर टैप/क्लिक करने से उसके प्रभावों सहित विस्तृत जानकारी दिखती है।
Based on this, you can get a feel for which religions have a lot of pressure built up in the city, and which have almost none. = इससे आप समझ सकते हैं कि शहर में किन धर्मों का अधिक दबाव जमा है और किनका लगभग नहीं है।
The city follows a religion if a majority of its population follows that religion, and will only then receive the effects of Follower and Pantheon beliefs of that religion. = शहर तभी किसी धर्म का पालन करता है जब उसकी अधिकांश जनसंख्या उसका पालन करे; तभी उसे उस धर्म के अनुयायी और देवमंडल विश्वासों के प्रभाव मिलेंगे।

Spreading Religion = धर्म फैलाना
Spreading religion happens naturally, but can be sped up using missionaries or great prophets. = धर्म स्वाभाविक रूप से फैलता है, किंतु धर्मप्रचारकों या महान पैगंबरों से इसे तेज़ कर सकते हैं।
Missionaries can be bought in cities following a major religion, and will take the religion of that city. = किसी प्रमुख धर्म का पालन करने वाले शहरों में धर्मप्रचारक खरीद सकते हैं और वे उसी शहर का धर्म अपनाएँगे।
So do take care where you are buying them! If another civilization has converted one of your cities to their religion, missionaries bought there will follow their religion. = इसलिए ध्यान रखें कि उन्हें कहाँ खरीद रहे हैं! दूसरी सभ्यता ने आपके शहर को अपने धर्म में बदल दिया हो, तो वहाँ खरीदे धर्मप्रचारक उसी के धर्म का पालन करेंगे।
Great prophets always have your religion when they appear, even if they are bought in cities following other religions, but captured great prophets do retain their original religion. = महान पैगंबर प्रकट होते समय सदा आपका धर्म रखते हैं, भले ही दूसरे धर्म वाले शहर में खरीदे गए हों; किंतु पकड़े गए महान पैगंबर अपना मूल धर्म बनाए रखते हैं।
Both great prophets and missionaries are able to spread religion to cities when they are inside its borders, even cities of other civilizations. = महान पैगंबर और धर्मप्रचारक दोनों शहर की सीमा के भीतर होने पर वहाँ धर्म फैला सकते हैं, दूसरी सभ्यता के शहरों में भी।
These two units can even enter tiles of civilizations with whom you don't have an open borders agreement! = ये दोनों इकाइयाँ उन सभ्यताओं के टाइलों में भी जा सकती हैं जिनसे खुली सीमाओं का समझौता नहीं है!
But do take care, missionaries will lose 250 religious strength each turn they end while in foreign lands. = किंतु सावधान रहें, विदेशी भूमि में चाल समाप्त करने पर धर्मप्रचारक हर चाल 250 धार्मिक शक्ति खोते हैं।
This diminishes their effectiveness when spreading religion, and if their religious strength ever reaches 0, they have lost their faith and disappear. = इससे धर्म फैलाने की उनकी प्रभावशीलता घटती है और धार्मिक शक्ति 0 होने पर उनकी आस्था समाप्त हो जाती है तथा वे गायब हो जाते हैं।
When you do spread your religion, the religious strength of the unit is added as pressure for that religion. = धर्म फैलाने पर इकाई की धार्मिक शक्ति उस धर्म के दबाव में जुड़ती है।
Cities also passively add pressure of their majority religion to nearby cities. = शहर अपने बहुसंख्यक धर्म का दबाव आसपास के शहरों में निष्क्रिय रूप से भी बढ़ाते हैं।
Each city provides +6 pressure per turn to all cities within 10 tiles, though the exact amount of pressure depends on the game speed. = हर शहर 10 टाइलों के भीतर के सभी शहरों को प्रति चाल +6 दबाव देता है; सटीक मात्रा खेल की गति पर निर्भर है।
This pressure can also be seen in the City Screen, and gives you an idea of how religions in your cities will evolve if you don't do anything. = यह दबाव शहर दृश्य में भी देख सकते हैं और इससे अनुमान मिलता है कि कुछ न करने पर शहरों के धर्म कैसे बदलेंगे।
Holy cities also provide +30 pressure of the religion founded there to themselves, making it very difficult to effectively convert a holy city. = पवित्र शहर वहाँ स्थापित धर्म का +30 दबाव स्वयं पर भी डालते हैं, जिससे पवित्र शहर का प्रभावी धर्मपरिवर्तन बहुत कठिन होता है।
Lastly, before founding a religion, new cities you settle will start with 200 pressure for your pantheon. = अंत में, धर्म स्थापित करने से पहले बसाए नए शहर आपके देवमंडल के 200 दबाव से शुरू होंगे।
This way, all your cities will starting following your pantheon as long as you haven't founded a religion yet. = इस तरह जब तक आपने धर्म स्थापित नहीं किया है, आपके सभी शहर आरंभ में आपके देवमंडल का पालन करेंगे।

Inquisitors = धर्माधिकारी
Inquisitors are the last religious unit, and their strength is removing other religions. = धर्माधिकारी अंतिम धार्मिक इकाई हैं और उनकी विशेषता अन्य धर्म हटाना है।
They can remove all other religions from one of your own cities, removing any pressures built up. = वे आपके अपने किसी शहर से सभी अन्य धर्म और उनका जमा दबाव हटा सकते हैं।
Great prophets also have this ability, and remove all other religions in the city when spreading their religion. = महान पैगंबरों में भी यह क्षमता है; अपना धर्म फैलाते समय वे शहर के सभी अन्य धर्म हटा देते हैं।
Often this results in the city immediately converting to their religion = इससे अक्सर शहर तुरंत उनका धर्म अपना लेता है
Additionally, when an inquisitor is stationed in or directly next to a city center, units of other religions cannot spread their faith there, though natural spread is unaffected. = इसके अतिरिक्त, शहर के केंद्र में या ठीक उसके पास धर्माधिकारी होने पर अन्य धर्मों की इकाइयाँ वहाँ अपनी आस्था नहीं फैला सकतीं, किंतु स्वाभाविक प्रसार प्रभावित नहीं होता।

The Mayan unique ability, 'The Long Count', comes with a side effect: = माया की विशिष्ट क्षमता 'दीर्घ गणना' का एक अतिरिक्त प्रभाव है:
Once active, the game's year display will use mayan notation. = सक्रिय होने पर खेल में वर्ष माया पद्धति से दिखेंगे।
The Maya measured time in days from what we would call 11th of August, 3114 BCE. A day is called K'in, 20 days are a Winal, 18 Winals are a Tun, 20 Tuns are a K'atun, 20 K'atuns are a B'ak'tun, 20 B'ak'tuns a Piktun, and so on. = माया समय की गणना उस दिन से करते थे जिसे हम 11 अगस्त 3114 ईसा पूर्व कहते हैं। एक दिन क'इन है, 20 दिन एक विनाल, 18 विनाल एक तुन, 20 तुन एक क'अतुन, 20 क'अतुन एक ब'अक'तुन, 20 ब'अक'तुन एक पिक्तुन, और इसी तरह आगे।
Unciv only displays ය B'ak'tuns, ඹ K'atuns and ම Tuns (from left to right) since that is enough to approximate gregorian calendar years. The Maya numerals are pretty obvious to understand. Have fun deciphering them! = Unciv बाएँ से दाएँ केवल ය ब'अक'तुन, ඹ क'अतुन और ම तुन दिखाता है, क्योंकि ग्रेगोरियन कैलेंडर के वर्षों का लगभग हिसाब देने के लिए यह पर्याप्त है। माया अंक समझना काफ़ी आसान है। उनका अर्थ निकालने का आनंद लें!

Your cities will periodically demand different luxury goods to satisfy their desire for new things in life. = आपके शहर समय-समय पर जीवन में नई वस्तुओं की चाह पूरी करने के लिए अलग विलासिता वस्तुएँ माँगेंगे।
If you manage to acquire the demanded luxury by trade, expansion, or conquest, the city will celebrate We Love The King Day for 20 turns. = व्यापार, विस्तार या विजय से माँगा गया विलासिता संसाधन प्राप्त करने पर शहर 20 चालों तक 'हमें राजा प्रिय है' दिवस मनाएगा।
During the We Love The King Day, the city will grow 25% faster. = 'हमें राजा प्रिय है' दिवस में शहर 25% तेज़ी से बढ़ेगा।
This means exploration and trade is important to grow your cities! = इसलिए शहर बढ़ाने के लिए खोज और व्यापार महत्वपूर्ण हैं!

Air Combat and Interception = हवाई युद्ध और अवरोधन
Air Combat is very similar to normal Combat, with a few wrinkles. Damage is still dealt using the same equations based on the relative Strength of the Attacking and Defending Unit. = हवाई युद्ध सामान्य युद्ध जैसा ही है, बस कुछ अंतर हैं। क्षति अब भी हमलावर और रक्षक इकाइयों की सापेक्ष शक्ति पर आधारित उन्हीं समीकरणों से तय होती है।
However, before the Attacker and Defender fight, there is an added combat phase called Interception. If there is any unit with Interception Range that covers the target attacked tile, then it will attempt to Intercept the Attacking Air Unit. If multiple units can Intercept, the one with higher Intercept chance does it. = किंतु हमलावर और रक्षक के लड़ने से पहले अवरोधन नाम का अतिरिक्त युद्ध चरण होता है। यदि किसी इकाई की अवरोधन दूरी लक्षित टाइल तक है, तो वह हमलावर वायु इकाई को रोकने की कोशिश करेगी। कई इकाइयाँ रोक सकती हों, तो सबसे अधिक अवरोधन संभावना वाली करेगी।
Generally Land/Naval Units have an Intercept Range of 2 Tiles, and Air Units have an Intercept Range of their Attack Range. = सामान्यतः स्थलीय/नौसैनिक इकाइयों की अवरोधन दूरी 2 टाइलें होती है और वायु इकाइयों की उनकी हमला दूरी जितनी।
Ground and Naval Units don't require movement points to Intercept, just Attacks. Air Units cannot have moved nor attacked in the preceding turn. = स्थलीय और नौसैनिक इकाइयों को अवरोधन के लिए गति अंक नहीं, केवल हमले चाहिए। वायु इकाइयों ने पिछली चाल में न चला होना चाहिए, न हमला किया होना चाहिए।
The Intercepting Unit rolls to see if it hits. Whether it hits or not costs an Attack, and most units (without Promotions) can only Attack Once per Nation's Turn. It does NOT cost Movement Points, but Air Units that have used their Movement cannot Intercept between turns. = अवरोधक इकाई की सफलता की संभावना जाँची जाती है। सफल हो या नहीं, एक हमला खर्च होता है; अधिकतर इकाइयाँ बिना पदोन्नति राष्ट्र की प्रति चाल केवल एक हमला कर सकती हैं। गति अंक खर्च नहीं होते, किंतु अपना चलना उपयोग कर चुकी वायु इकाई चालों के बीच अवरोधन नहीं कर सकती।
If the Intercepting Unit Hits, it deals damage according to the Combat Strength calculation to the Attacking Air Unit, potentially with any Strength Bonuses that apply to Interception. It does not receive damage from the Attacking Air Unit. = अवरोधक के सफल होने पर हमलावर वायु इकाई को युद्ध शक्ति की गणना के अनुसार क्षति मिलती है, जिसमें लागू अवरोधन शक्ति बोनस भी हो सकते हैं। अवरोधक को हमलावर वायु इकाई से क्षति नहीं मिलती।
After Interception resolves, the Attacking Air Unit and the Defending Unit in the targeted tile do Combat as normal, with damage dealt to both sides. = अवरोधन पूरा होने के बाद हमलावर वायु इकाई और लक्षित टाइल का रक्षक सामान्य युद्ध करते हैं और दोनों को क्षति होती है।
To help deal with Interceptions, see Air Sweeps. = अवरोधन से निपटने में सहायता के लिए हवाई सफ़ाई देखें।

Air Sweeps = हवाई सफ़ाई
Fighter units are able to perform Air Sweeps over a tile helping clear out potential enemy Air, Sea, or Land Interceptions that can reach that tile. = लड़ाकू विमान किसी टाइल के ऊपर हवाई सफ़ाई करके उस टाइल तक पहुँचने वाले शत्रु के संभावित हवाई, नौसैनिक या स्थलीय अवरोधन हटाने में सहायता कर सकते हैं।
While this Action will take an Attack, the benefit is drawing out Interceptions to help protect your other Air Units. Especially your Bombers. = इस कार्रवाई में एक हमला लगता है, किंतु इससे अवरोधन बाहर निकलते हैं और आपकी अन्य वायु इकाइयों, खासकर बमवर्षकों, की रक्षा होती है।
Your unit will always draw an Interception, if one can reach the target tile, even if the Intercepting unit has a chance to miss. = लक्षित टाइल तक कोई अवरोधन पहुँच सकता हो, तो आपकी इकाई उसे अवश्य आकर्षित करेगी, भले ही अवरोधक के चूकने की संभावना हो।
If the Interceptor is not an Air Unit (eg Land or Sea), the Air Sweeping unit and Interceptor take no damage! = अवरोधक वायु इकाई न हो, जैसे स्थलीय या नौसैनिक हो, तो हवाई सफ़ाई इकाई और अवरोधक दोनों को कोई क्षति नहीं होती!
If the Interceptor is an Air Unit, the two units will damage each other in a straight fight with no Interception bonuses. And only the Attacking Air Sweep Unit gets any Air Sweep strength bonuses. = अवरोधक वायु इकाई हो, तो दोनों अवरोधन बोनस के बिना सीधे युद्ध में एक-दूसरे को क्षति देते हैं। केवल हमलावर हवाई सफ़ाई इकाई को हवाई सफ़ाई के शक्ति बोनस मिलते हैं।

Fortify, Guard, Withdraw = मोर्चाबंदी, पहरा, पीछे हटना
Most Land units have the ability to Fortify. As they spend time without moving, they will slowly gain a Fortification Bonus to their Combat Strength representing digging in and preparing in case of an attack. = अधिकतर स्थलीय इकाइयाँ मोर्चाबंदी कर सकती हैं। बिना चले समय बिताने पर उनकी युद्ध शक्ति में धीरे-धीरे मोर्चाबंदी बोनस जुड़ता है, जो हमले की आशंका में खाई खोदने और तैयारी को दर्शाता है।
Some units have the ability to Withdraw before a melee attack is struck. However, perhaps you wish for them to stand their ground to protect a particular tile. If you do, then give them the Guard command and they will stay fixed until they die or you give them fresh orders. = कुछ इकाइयाँ निकट युद्ध प्रहार से पहले पीछे हट सकती हैं। किंतु किसी टाइल की रक्षा के लिए आप उन्हें डटे रहना चाहें, तो पहरे का आदेश दें; वे मृत्यु या नए आदेश तक स्थिर रहेंगी।
This is NOT the same as Fortify but they will still gain the Fortification Bonus. They will simply not utilize their Withdraw ability. Fortified units with the Withdraw ability will try to flee when attacked. = यह मोर्चाबंदी के समान नहीं है, किंतु मोर्चाबंदी बोनस फिर भी मिलेगा। वे केवल पीछे हटने की क्षमता का उपयोग नहीं करेंगी। पीछे हटने की क्षमता वाली मोर्चाबंद इकाइयाँ हमला होने पर भागने की कोशिश करेंगी।

City Tile Blockade = शहर के टाइल की नाकाबंदी
One of your tiles is blocked by an enemy: when an enemy unit stands on a tile you own, the tile will not produce yields and cannot be worked by a city this turn. City will reallocate population from a blocked tile automatically. = आपका एक टाइल शत्रु से अवरुद्ध है: शत्रु इकाई आपके टाइल पर खड़ी हो, तो इस चाल उससे उपज नहीं मिलेगी और शहर उस पर काम नहीं कर सकता। शहर अवरुद्ध टाइल की जनसंख्या स्वतः दूसरी जगह लगाएगा।
Enemy military land units block tiles they are standing on. Enemy military naval units additionally block adjacent water tiles. To protect your tiles from blockade, place a friendly military unit on it or fight off invaders. = शत्रु की स्थलीय सैन्य इकाइयाँ अपने नीचे की टाइल रोकती हैं। नौसैनिक सैन्य इकाइयाँ आसपास की जलीय टाइलें भी रोकती हैं। नाकाबंदी से बचाने के लिए टाइल पर मित्र सैन्य इकाई रखें या आक्रमणकारी को खदेड़ें।

One of your cities is under a naval blockade! When all adjacent water tiles of a coastal city are blocked - city loses harbor connection to all other cities, including capital. Make sure to de-blockade cities by deploying friendly military naval units to fight off invaders. = आपका एक शहर नौसैनिक नाकाबंदी में है! तटीय शहर के सभी पास की जलीय टाइलें अवरुद्ध होने पर राजधानी सहित सभी शहरों से उसका बंदरगाह संपर्क टूट जाता है। मित्र नौसैनिक सैन्य इकाइयाँ तैनात करके आक्रमणकारियों को खदेड़ें और नाकाबंदी हटाएँ।

Spies! = जासूस!
The first time a civ reaches the Renaissance era each nation gets one spy. Every time a civ reaches an era afterwards they get one more spy. = पहली बार कोई सभ्यता पुनर्जागरण युग में पहुँचे तो हर राष्ट्र को एक जासूस मिलता है। उसके बाद सभ्यता जब भी नए युग में पहुँचती है, उसे एक और जासूस मिलता है।
Spies can be sent out to foreign cities to steal technology, rigging elections or stage coups. Place them in your own cities to do counter-intelligence work. = जासूस विदेशी शहरों में तकनीक चुराने, चुनावों में धांधली या तख्तापलट करने भेज सकते हैं। अपने शहरों में रखकर प्रतिजासूसी कराएँ।
Only one spy per civ is allowed in each city. Spies that are not in any city are on vacation in your spy hideout. = हर शहर में प्रति सभ्यता केवल एक जासूस हो सकता है। किसी शहर में न रहने वाले जासूस आपके गुप्त ठिकाने में छुट्टी पर होते हैं।
Spies set up in cities of major civilizations will try to steal technology at a rate which is based off of the science production in the city. Succeeding to steal technology will level up your spy. Failing to succeed will level up the defending spy if it is present. = प्रमुख सभ्यताओं के शहरों में जासूस वहाँ के विज्ञान उत्पादन पर आधारित दर से तकनीक चुराने की कोशिश करेंगे। सफल चोरी से जासूस का स्तर बढ़ता है। विफलता पर वहाँ मौजूद रक्षक जासूस का स्तर बढ़ता है।
Spies set in city-states will try to rig the elections in order to gain influence and reduce the influence of other civilizations. Only one spy partaking in rigging the election can win. = नगर-राज्यों में जासूस प्रभाव बढ़ाने और अन्य सभ्यताओं का प्रभाव घटाने के लिए चुनावों में धांधली करेंगे। धांधली में भाग लेने वाला केवल एक जासूस जीत सकता है।
A spy that is rigging an election in a city-state may also stage a coup. The likelihood of success for the coup depends on your relative influence to the current ally of the city-state, your spy level, and the level of the spy that the current ally has in the city-state if present. Succeeding a coup will make you their new ally and reduce the influence of all other civs. Failing a coup will kill your spy and level up the defending spy if present. = नगर-राज्य में चुनाव धांधली करने वाला जासूस तख्तापलट भी कर सकता है। सफलता की संभावना वर्तमान सहयोगी के मुकाबले आपके प्रभाव, आपके जासूस के स्तर और वहाँ मौजूद वर्तमान सहयोगी के जासूस के स्तर पर निर्भर है। सफल तख्तापलट आपको नया सहयोगी बना देगा और बाकी सभी सभ्यताओं का प्रभाव घटाएगा। विफलता पर आपका जासूस मरेगा और मौजूद रक्षक जासूस का स्तर बढ़ेगा।
Spies that are set up in your own cities will be conducting counter-intelligence. They reduce the success chance of other spies trying to steal your technology. = अपने शहरों में रखे जासूस प्रतिजासूसी करते हैं। वे आपकी तकनीक चुराने की कोशिश करने वाले अन्य जासूसों की सफलता की संभावना घटाते हैं।
Spies at a higher rank have a higher chance of success. The max rank a spy can reach is rank 3. After a spy is killed it will revive after a certain amount of turns back at rank 1. = ऊँचे पद वाले जासूस की सफलता की संभावना अधिक होती है। जासूस अधिकतम पद 3 तक पहुँच सकता है। मारे जाने पर कुछ चालों बाद वह पद 1 पर फिर जीवित हो जाएगा।
Building buildings like the constabulary and police station will reduce the technology steal rate of spies in that city. = आरक्षी बल और पुलिस थाना जैसे भवन उस शहर में जासूसों की तकनीक चोरी की दर घटाते हैं।
Espionage is available using the Gods and Kings ruleset. To enable it in a new game click advanced settings, then click on the Enable Espionage option. = जासूसी गॉड्स ऐंड किंग्स नियमसमूह में उपलब्ध है। नए खेल में इसे चालू करने के लिए उन्नत सेटिंग खोलकर जासूसी चालू करें विकल्प क्लिक करें।

Keyboard Bindings = कीबोर्ड कुंजी निर्धारण
Limitations = सीमाएँ
 # Requires translation!
This is a work in progress. = यह कार्य प्रगति पर है.
For technical reasons, only direct keys or Ctrl-Letter combinations can be used. = तकनीकी कारणों से केवल सीधी कुंजियाँ या Ctrl-अक्षर संयोजन उपयोग किए जा सकते हैं।
Using the Keys page = कुंजी पृष्ठ का उपयोग
Each binding has a button with an image looking like this: = हर कुंजी निर्धारण में इस जैसी छवि वाला बटन है:
While hovering the mouse over the key button, you can press a desired key directly to assign it. = माउस कुंजी बटन पर रखते हुए इच्छित कुंजी सीधे दबाकर निर्धारित कर सकते हैं।
Double-click the image to reset the binding to default. = मूल निर्धारण लौटाने के लिए छवि पर दो बार क्लिक करें।
Bindings mapped to their default keys are displayed in gray, those reassigned by you in white. = मूल कुंजियों वाले निर्धारण धूसर और आपके बदले निर्धारण सफ़ेद दिखते हैं।
Conflicting assignments are marked red. Conflicts can exist across categories, like World Screen / Unit Actions. Note that at the moment, the game does not prevent saving conflicting assignments, though the result may be unexpected. = टकराते निर्धारण लाल चिह्नित होते हैं। विश्व दृश्य / इकाई कार्रवाइयों जैसी अलग श्रेणियों में भी टकराव हो सकता है। अभी खेल टकराते निर्धारण सहेजने से नहीं रोकता, किंतु परिणाम अनपेक्षित हो सकता है।
For discussion about missing entries, see the linked github issue. = छूटी प्रविष्टियों पर चर्चा के लिए जुड़ा GitHub मुद्दा देखें।

Welcome to the Civilopedia! = सिविलोपीडिया में स्वागत है!
Here you can find information - general help, rules, and what makes up the game world. = यहाँ सामान्य सहायता, नियम और खेल के विश्व की रचना की जानकारी मिलती है।
How to find information = जानकारी कैसे खोजें
Select categories with the buttons on top of the screen. Also up there is the button to leave Civilopedia and go back to where you were before. = ऊपर के बटनों से श्रेणियाँ चुनें। वहीं सिविलोपीडिया छोड़कर पिछली जगह लौटने का बटन भी है।
Each category has a list of entries on the left of the screen, sorted alphabetically (with few exceptions). Clicking an entry will update the center pane were you are currently reading this. = हर श्रेणी में बाएँ प्रविष्टियों की सूची है, जो कुछ अपवादों को छोड़कर वर्णक्रम में है। प्रविष्टि पर क्लिक करने से बीच का यह पट बदलता है, जहाँ अभी आप पढ़ रहे हैं।
Lines can link to other Civilopedia entries, they are marked with a chain link symbol like this one. You can click anywhere on the line to follow the link. = पंक्तियाँ अन्य सिविलोपीडिया प्रविष्टियों से जुड़ सकती हैं; उन पर इस जैसा कड़ी चिह्न होता है। पंक्ति पर कहीं भी क्लिक करके कड़ी खोल सकते हैं।
The current category is special - all articles on general concepts are here. It is called 'Tutorials' because you can revisit these here, too. = वर्तमान श्रेणी विशेष है — सामान्य अवधारणाओं के सभी लेख यहाँ हैं। इसे 'प्रशिक्षण' कहते हैं, क्योंकि इन प्रशिक्षणों को भी यहाँ फिर देख सकते हैं।
What information can I find = कौन सी जानकारी मिल सकती है
The data shown is not dependent on your current game's situation, e.g. bonuses for the nation you are playing or difficulty modifiers will not affect the numbers. = दिखाए गए आँकड़े वर्तमान खेल की स्थिति पर निर्भर नहीं हैं; जैसे आपके राष्ट्र के बोनस या कठिनाई संशोधक इन संख्याओं को प्रभावित नहीं करेंगे।
However, it will reflect the mods you are playing! The combination of base ruleset and extension mods you select define the rules of a game, what objects exist and how they interact, and the Civilopedia mirrors these rules. = किंतु वे आपके उपयोग किए मॉड दर्शाएँगे! मूल नियमसमूह और चुने विस्तार मॉड मिलकर खेल के नियम, मौजूद वस्तुएँ और उनकी पारस्परिक क्रिया तय करते हैं; सिविलोपीडिया वही नियम दर्शाता है।
If you opened the Civilopedia from the main menu, the "Ruleset" will be that of the last game you started. = मुख्य मेनू से सिविलोपीडिया खोलने पर "नियमसमूह" आपके पिछले शुरू किए खेल का होगा।
Letters can select categories, and when there are multiple categories matching the same letter, you can press that repeatedly to cycle between these. = अक्षरों से श्रेणियाँ चुन सकते हैं। एक ही अक्षर से कई श्रेणियाँ मिलें तो बार-बार दबाकर उनमें घूम सकते हैं।
The arrow keys allow navigation as well - left/right for categories, up/down for entries. = तीर कुंजियाँ भी उपयोग कर सकते हैं — बाएँ/दाएँ से श्रेणियाँ और ऊपर/नीचे से प्रविष्टियाँ।

UI Tips = इंटरफ़ेस सुझाव
World screen = विश्व दृश्य
Skip all units to end a turn quickly = जल्दी चाल समाप्त करने के लिए सभी इकाइयाँ छोड़ें
Right-click or long press the "Next unit" button to open a popup menu which allows to end a turn without having to cycle through all units. If some units are automated, a dedicated button is available to move them before ending the turn. = "अगली इकाई" बटन पर दायाँ क्लिक या देर तक दबाने से पॉपअप मेनू खुलता है, जिससे सभी इकाइयों में घूमे बिना चाल समाप्त कर सकते हैं। कुछ इकाइयाँ स्वचालित हों, तो चाल समाप्त करने से पहले उन्हें चलाने का अलग बटन उपलब्ध है।
Toggle notification list display = सूचना सूची दिखाएँ/छिपाएँ
On the World screen, swipe the notification list to the right to temporarily hide it. Click the "Bell" button to display them again. = विश्व दृश्य में सूचना सूची दाएँ स्वाइप करके अस्थायी रूप से छिपाएँ। फिर दिखाने के लिए "घंटी" बटन क्लिक करें।
The default state for the notification list can be set in Options > Display > UI - Notifications on world screen. = सूचना सूची की मूल स्थिति विकल्प > प्रदर्शन > इंटरफ़ेस - विश्व दृश्य में सूचनाएँ में तय कर सकते हैं।
Entering a City Screen quickly = शहर दृश्य तुरंत खोलना
You can Right-click or long press a city button on the World screen. The result is the same as tapping it twice - once to select and move the button, again to trigger a reaction: show the City Screen (if the city is yours to inspect), or offer the foreign city info popup. = विश्व दृश्य में शहर बटन पर दायाँ क्लिक या देर तक दबा सकते हैं। परिणाम दो बार टैप करने जैसा है: एक बार चुनकर बटन खिसकाना, दूसरी बार प्रतिक्रिया देना — अपना निरीक्षण योग्य शहर हो तो शहर दृश्य, अन्यथा विदेशी शहर का सूचना पॉपअप।
Upgrade multiple units of the same type = एक प्रकार की कई इकाइयाँ उन्नत करें
On the World screen, select a unit that can be upgraded, then right-click or long press the "Upgrade" button to open a popup menu allowing to upgrade all units of this type at once. = विश्व दृश्य में उन्नयन योग्य इकाई चुनें और "उन्नयन" बटन पर दायाँ क्लिक या देर तक दबाएँ। पॉपअप से इस प्रकार की सभी इकाइयाँ एक साथ उन्नत कर सकते हैं।
In the Units overview, the same upgrade menu is available by clicking the unit icon in the "Upgrade" column. When a unit is upgradeable, the icon is lit if conditions are met (enough gold and/or resources), otherwise it is dimmed. = इकाई अवलोकन में "उन्नयन" स्तंभ के इकाई चिह्न पर क्लिक करके यही मेनू मिलता है। इकाई उन्नत हो सकती हो तो पर्याप्त स्वर्ण और/या संसाधन होने पर चिह्न चमकता है, अन्यथा मंद होता है।
Additional controls for the construction queue = निर्माण कतार के अतिरिक्त नियंत्रण
Right-click or long press a construction item to open a popup menu with additional controls, allowing to manage production of the same item in all cities, by issuing the commands from the same City Screen. = निर्माण वस्तु पर दायाँ क्लिक या देर तक दबाकर अतिरिक्त नियंत्रणों का पॉपअप खोलें। एक ही शहर दृश्य से आदेश देकर सभी शहरों में उसी वस्तु का उत्पादन सँभाल सकते हैं।
The "Disable" option (in a single city or all cities) moves an item to a separated "Disabled" tab, to prevent its automatic queueing by the "Auto-assign city production" option or to remove irrelevant objects from the production planning. To move a disabled item back to its initial place, re-enter its popup menu, and choose "Enable". = एक या सभी शहरों में "अनुपलब्ध करें" विकल्प वस्तु को अलग "अनुपलब्ध" टैब में भेजता है, ताकि "शहर का उत्पादन स्वतः निर्धारित करें" उसे कतार में न जोड़े या अप्रासंगिक वस्तुएँ योजना से हटें। वापस लाने के लिए उसका पॉपअप फिर खोलकर "उपलब्ध करें" चुनें।
Disabled items are set for the current game only and are carried over when founding a new city. = अनुपलब्ध वस्तुओं की सेटिंग केवल वर्तमान खेल के लिए होती है और नया शहर बसाने पर भी लागू रहती है।
Show Great Person Points breakdown = महान व्यक्ति अंकों का विवरण दिखाएँ
In the right sidepanel, click a Great People row to display the details of Great Person Points (GPP) accumulated each turn by the current city, for this type of Great People. = दाएँ पार्श्वपट में महान व्यक्ति की पंक्ति पर क्लिक करने से वर्तमान शहर में उस प्रकार के लिए प्रति चाल जमा महान व्यक्ति अंकों का विवरण दिखता है।
Click any of the Great People icons to display all GPP accumulated each turn by the current city, for all types of Great People. = किसी भी महान व्यक्ति चिह्न पर क्लिक करने से वर्तमान शहर में सभी प्रकार के लिए प्रति चाल जमा सभी महान व्यक्ति अंक दिखते हैं।
Tech screen = तकनीक दृश्य
Queue multiple technologies in different branches = अलग शाखाओं की कई तकनीकें कतार में रखें
On the Tech screen, right-click or long press a technology to automatically queue it, even if this tech is in another branch than the item currently researched. Prerequisite techs to research will also be automatically queued. = तकनीक दृश्य में किसी तकनीक पर दायाँ क्लिक या देर तक दबाकर उसे स्वतः कतार में रखें, भले ही वह वर्तमान अनुसंधान से अलग शाखा में हो। उसकी पूर्वापेक्षित तकनीकें भी स्वतः कतार में जुड़ेंगी।
Right-click or long press multiple techs to append them to the research queue, whatever their branch is. = अलग-अलग शाखाओं की कई तकनीकों को अनुसंधान कतार में जोड़ने के लिए उन पर दायाँ क्लिक या देर तक दबाएँ।
Overview screens = अवलोकन दृश्य
Reveal known resources on world screen = विश्व दृश्य पर ज्ञात संसाधन दिखाएँ
In the Resources overview, click on a resource icon to center the world screen on tiles already discovered and providing this resource. = संसाधन अवलोकन में संसाधन चिह्न क्लिक करने से विश्व दृश्य पहले से खोजे और वह संसाधन देने वाले टाइलों पर केंद्रित होता है।
Alternatively, click on the "Unimproved" number to center the world screen only on owned (by you or your allied City-states) tiles where the resource is not improved. = या "असुधारित" संख्या क्लिक करें; विश्व दृश्य केवल आपके या सहयोगी नगर-राज्यों के उन टाइलों पर केंद्रित होगा जहाँ संसाधन सुधारा नहीं गया है।
If more than one tile is available, click repeatedly on the notification to cycle through all of them. = एक से अधिक टाइलें उपलब्ध हों तो सूचना पर बार-बार क्लिक करके सभी में घूम सकते हैं।
Show diagram line colors = आरेख की रेखाओं के रंग दिखाएँ
In Politics overview > Show diagram, you can click anywhere inside the diagram to display a table listing all relationship line colors and their meaning. = राजनीति अवलोकन > आरेख दिखाएँ में आरेख के भीतर कहीं भी क्लिक करके संबंध रेखाओं के सभी रंग और उनके अर्थ की तालिका देख सकते हैं।
