StoreKit returned an unknown purchase result. No submission was created. = StoreKit ने खरीद का अज्ञात परिणाम लौटाया। कोई प्रस्तुति नहीं बनाई गई।
Purchase could not be verified = खरीद सत्यापित नहीं की जा सकी
The transaction was not finished or submitted. Please try again later. = लेन-देन पूरा या प्रस्तुत नहीं हुआ। कृपया बाद में फिर प्रयास करें।
The verified transaction did not match an Unciv support product. = सत्यापित लेन-देन Unciv समर्थन उत्पाद से मेल नहीं खाता।
