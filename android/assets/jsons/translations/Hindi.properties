Boudicca = बौडिका
You shall stain this land no longer with your vileness! To arms, my countrymen. We ride to war! = आप अपनी दुष्टता से इस भूमि को अब और कलंकित नहीं करेंगे! देशवासियो, हथियार उठाओ। हम युद्ध को चलते हैं!
Traitorous man! The Celtic peoples will not stand for such wanton abuse and slander - I shall have your balls! = विश्वासघाती! केल्टिक लोग ऐसा अकारण दुर्व्यवहार और अपमान नहीं सहेंगे — मैं आपके अंडकोष काट लूँगी!
Vile ruler, know you have won this war in name alone. Your cities lie buried and your troops defeated. I have my own victory. = दुष्ट शासक, जान लें कि आपने यह युद्ध केवल नाम भर के लिए जीता। आपके शहर दबे पड़े हैं और सैनिक पराजित हैं। मेरी अपनी विजय है।
Don't forget who you're dealing with. Arrogant moves can get you in danger. = मत भूलिए किससे पाला पड़ा है। अहंकारी चालें आपको खतरे में डाल सकती हैं।
I am Boudicca, Queen of the Celts. Let no-one underestimate me! = मैं केल्टों की रानी बौडिका हूँ। कोई मुझे कम न आँके!
Let us join our forces together and reap the rewards. = अपनी शक्तियाँ मिलाएँ और फल पाएँ।
God has given good to you. = ईश्वर ने आपका भला किया है।
Druidic Lore = ड्रुइड ज्ञान
May glory and honor always be upon you, Warrior Queen! In a time dominated by men, you successfully claimed the throne and the power, but also valiantly defied the mighty Roman Empire. Punished and humiliated by the hand of the Roman bloody invaders, you united your people and led a terrible revolt, to seek revenge. Many legions fell under your fierce attacks and you burned the city of London with your anger. While the Romans still kept ownership of your land after your final defeat, your actions nonetheless showed Rome that this land could never be fully conquered, making Nero himself consider to withdraw all troops and leaving Britain forever. = योद्धा रानी, गौरव और सम्मान सदा आपके साथ हों! पुरुषों के प्रभुत्व वाले समय में आपने सिंहासन और शक्ति प्राप्त की तथा शक्तिशाली रोमन साम्राज्य को वीरता से चुनौती दी। रक्तपिपासु रोमन आक्रमणकारियों द्वारा दंडित और अपमानित होने पर आपने अपने लोगों को एकजुट करके बदले के लिए भयंकर विद्रोह का नेतृत्व किया। आपके भीषण हमलों में अनेक लीजन गिरे और आपने अपने क्रोध में लंदन जला दिया। अंतिम हार के बाद भी रोमन आपकी भूमि के स्वामी बने रहे, किंतु आपके कार्यों ने रोम को दिखा दिया कि यह भूमि कभी पूरी तरह नहीं जीती जा सकती; नीरो स्वयं सभी सैनिक हटाकर ब्रिटेन सदा के लिए छोड़ने पर विचार करने लगा।
O raging lioness, will you lead the Celts again under the glory of your name, to spread the fires of liberty, and achieve a final victory? Will your new empire shine through the ages of history? = हे क्रुद्ध सिंहनी, क्या आप अपने नाम के गौरव तले फिर केल्टों का नेतृत्व करके स्वतंत्रता की आग फैलाएँगी और अंतिम विजय पाएँगी? क्या आपका नया साम्राज्य इतिहास के युगों में चमकेगा?
