# Capturing a city

What would you like to do with the city of [cityName]? = आप [cityName] शहर के साथ क्या करना चाहेंगे?
Annex = विलय करें
Annexed cities become part of your regular empire. = विलय किए शहर आपके सामान्य साम्राज्य का भाग बन जाते हैं।
Their citizens generate 2x the unhappiness, unless you build a courthouse. = न्यायालय न बनाने तक उनके नागरिक 2x नाखुशी उत्पन्न करते हैं।
Your civilization may not annex this city. = आपकी सभ्यता इस शहर का विलय नहीं कर सकती।
Puppet = कठपुतली बनाएँ
Puppeted cities do not increase your tech or policy cost. = कठपुतली शहर आपकी तकनीक या नीति की लागत नहीं बढ़ाते।
You have no control over the the production of puppeted cities. = कठपुतली शहरों के उत्पादन पर आपका नियंत्रण नहीं होता।
Puppeted cities also generate 25% less Science and Culture. = कठपुतली शहर 25% कम विज्ञान और संस्कृति भी उत्पन्न करते हैं।
A puppeted city can be annexed at any time. = कठपुतली शहर का कभी भी विलय किया जा सकता है।
Liberate (city returns to [originalOwner]) = मुक्त करें (शहर [originalOwner] को लौटता है)
Liberating a city returns it to its original owner, giving you a massive relationship boost with them! = शहर मुक्त करने से वह अपने मूल स्वामी को लौटता है और उनके साथ आपके संबंध बहुत सुधरते हैं!
Raze = ध्वस्त करें
Razing the city annexes it, and starts burning the city to the ground. = शहर ध्वस्त करने से उसका विलय होता है और उसे जलाकर मिटाना शुरू होता है।
Razing the city puppets it, and starts burning the city to the ground. = शहर ध्वस्त करने से वह कठपुतली बनता है और उसे जलाकर मिटाना शुरू होता है।
The population will gradually dwindle until the city is destroyed. = आबादी धीरे-धीरे घटेगी, जब तक शहर नष्ट न हो जाए।
Original capitals and holy cities cannot be razed. = मूल राजधानियाँ और पवित्र शहर ध्वस्त नहीं किए जा सकते।
Destroy = नष्ट करें
Destroying the city instantly razes the city to the ground. = शहर नष्ट करने से वह तुरंत पूरी तरह मिट जाता है।
Keep it = अपने पास रखें
Remove your troops in our border immediately! = हमारी सीमा से अपने सैनिक तुरंत हटाएँ!
Sorry. = क्षमा करें।
Never! = कभी नहीं!
Those lands were not yours to take. This has not gone unnoticed. = वे ज़मीनें लेने का आपका अधिकार नहीं था। यह हमारी नज़र से बचा नहीं है।

