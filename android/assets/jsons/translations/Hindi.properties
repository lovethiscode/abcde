#################### Lines from Events from Civ V - Gods & Kings ####################

Tutorial Task: [Move unit] = प्रशिक्षण कार्य: [Move unit]
Move a unit! = इकाई चलाएँ!
Click on a unit → Click on a destination → Click the arrow popup. = इकाई पर क्लिक करें → गंतव्य पर क्लिक करें → तीर वाले पॉपअप पर क्लिक करें।

Found a city! = शहर बसाएँ!
Select the Settler → Click on 'Found city'. = बसनेवाले को चुनें → 'शहर बसाएँ' पर क्लिक करें।

Enter the city screen! = शहर दृश्य में जाएँ!
Click the city button twice. = शहर के बटन पर दो बार क्लिक करें।

Pick a technology to research! = अनुसंधान के लिए तकनीक चुनें!
Click on the tech button → Select technology → Click 'Research' (bottom right). = तकनीक बटन पर क्लिक करें → तकनीक चुनें → नीचे दाएँ 'अनुसंधान' पर क्लिक करें।

Pick a construction! = निर्माण चुनें!
Enter city screen → Click on a unit or building → Click 'add to queue'. = शहर दृश्य में जाएँ → इकाई या भवन पर क्लिक करें → 'कतार में जोड़ें' पर क्लिक करें।

Pass a turn! = एक चाल आगे बढ़ें!
Cycle through units with 'Next unit' → Click 'Next turn'. = 'अगली इकाई' से इकाइयों पर जाएँ → 'अगली चाल' पर क्लिक करें।

Reassign worked tiles! = काम की जाने वाली टाइलें फिर निर्धारित करें!
Enter city screen → Click the assigned tile to unassign → Click an unassigned tile to assign population. = शहर दृश्य में जाएँ → निर्धारित टाइल पर क्लिक करके उसे हटाएँ → अनिर्धारित टाइल पर क्लिक करके जनसंख्या निर्धारित करें।

 # Requires translation!
Got it = समझ गया
Meet another civilization! = दूसरी सभ्यता से मिलें!
Explore the map until you encounter another civilization! = दूसरी सभ्यता मिलने तक मानचित्र की खोज करें!

Open the options dialog! = विकल्प संवाद खोलें!
Click the menu button (top left) → Click 'Options'. = ऊपर बाएँ मेनू बटन पर क्लिक करें → 'विकल्प' पर क्लिक करें।

Construct an improvement! = सुधार बनाएँ!
Construct a Worker unit → Move it to a Plains or Grassland tile → Click 'Construct improvement' → Choose the farm → Leave the worker there until it's finished. = कार्यकर्ता इकाई बनाएँ → उसे मैदान या घासभूमि के टाइल पर ले जाएँ → 'सुधार बनाएँ' पर क्लिक करें → खेत चुनें → पूरा होने तक कार्यकर्ता को वहीं रहने दें।

Create a trade route! = व्यापार मार्ग बनाएँ!
Construct roads between your capital and another city. Or, automate your worker and let him get to that eventually. = अपनी राजधानी और दूसरे शहर के बीच सड़कें बनाएँ। या कार्यकर्ता को स्वचालित कर दें और उसे अंततः यह करने दें।

Conquer a city! = शहर जीतें!
Bring an enemy city down to low health → Enter the city with a melee unit. = शत्रु शहर का स्वास्थ्य कम करें → निकट युद्ध इकाई से शहर में प्रवेश करें।

Move an air unit! = वायु इकाई चलाएँ!
Select an air unit → Select another city within range → Move the unit to the other city. = वायु इकाई चुनें → उसकी दूरी के भीतर दूसरा शहर चुनें → इकाई को दूसरे शहर में ले जाएँ।

See your stats breakdown! = अपने आँकड़ों का विश्लेषण देखें!
Enter the Overview screen (top right corner) → Click on 'Stats'. = ऊपर दाएँ कोने में अवलोकन दृश्य खोलें → 'आँकड़े' पर क्लिक करें।


