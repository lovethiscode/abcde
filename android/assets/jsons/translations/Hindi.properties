Alexander = सिकंदर
You are in my way, you must be destroyed. = आप मेरे रास्ते में हैं, आपका नष्ट होना आवश्यक है।
As a matter of fact I too grow weary of peace. = सच तो यह है कि मैं भी शांति से ऊब रहा हूँ।
You have somehow become my undoing! What kind of beast are you? = किसी तरह आप मेरे विनाश का कारण बन गए! आप किस प्रकार के दैत्य हैं?
The Gods frown upon your foolishness. = देवता आपकी मूर्खता से अप्रसन्न हैं।
Hello stranger! I am Alexandros, son of kings and grandson of the gods! = नमस्कार अजनबी! मैं अलेक्ज़ान्द्रोस हूँ, राजाओं का पुत्र और देवताओं का पौत्र!
My friend, does this seem reasonable to you? = मित्र, क्या यह आपको उचित लगता है?
Greetings! = नमस्कार!
What? = क्या?
Hellenic League = हेलेनिक संघ
Great King Alexander, leader of the mighty Greek nation, you are truly blessed by the gods. In 480 BC, quarrelsome city-states such as Athens, Sparta, Thebes, found a way to join their forces, allowing Greece to defeat the mighty Persia in the 5th century BC, both on land and sea. Following their example, you lead a Greek coalition and finally struck down the Persian Empire in 331 BC. You conquered almost all the known world, and from Europe to Africa to India, you built an empire unmatched by any before it. = महान राजा सिकंदर, शक्तिशाली यूनानी राष्ट्र के नेता, आप सचमुच देवताओं के आशीर्वाद से संपन्न हैं। 480 ईसा पूर्व में एथेंस, स्पार्टा और थीब्स जैसे झगड़ालू नगर-राज्यों ने अपनी सेनाएँ मिलाने का मार्ग खोजा, जिससे यूनान ने 5वीं शताब्दी ईसा पूर्व में शक्तिशाली फ़ारस को भूमि और समुद्र दोनों पर हराया। उनके उदाहरण का अनुसरण करते हुए आपने यूनानी गठबंधन का नेतृत्व किया और अंततः 331 ईसा पूर्व में फ़ारसी साम्राज्य को गिरा दिया। आपने लगभग पूरे ज्ञात विश्व को जीता और यूरोप से अफ्रीका तथा भारत तक ऐसा साम्राज्य बनाया जिसकी पहले कोई बराबरी नहीं थी।
Megalexandros, son of Zeus, will you ride Bucephalas again, to gift the world with the brightness of the Greek culture? Will your new empire shine through the ages of history? = ज़ीउस के पुत्र महान सिकंदर, क्या आप यूनानी संस्कृति का प्रकाश विश्व को देने के लिए फिर बुसेफ़लस पर सवार होंगे? क्या आपका नया साम्राज्य इतिहास के युगों में चमकेगा?
