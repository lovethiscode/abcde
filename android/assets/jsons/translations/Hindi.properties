Most achievements allow any difficulty and need at least 1 AI opponent. Only N30, N36, N37, N38 and N39 require the stated difficulty and at least 3 AI opponents. You need not enable all victory routes. All game speeds are allowed. Any victory includes Time. Religion achievements require religion to be enabled. = अधिकांश उपलब्धियाँ हर कठिनाई पर मिलती हैं और कम से कम 1 AI प्रतिद्वंद्वी चाहती हैं। केवल N30, N36, N37, N38 और N39 को बताई गई कठिनाई तथा कम से कम 3 AI प्रतिद्वंद्वी चाहिए। सभी विजय मार्ग चालू करना आवश्यक नहीं। सभी खेल गतियाँ मान्य हैं। किसी भी विजय में समय विजय भी शामिल है। धार्मिक उपलब्धियों के लिए धर्म चालू होना चाहिए।
N38 forbids ever owning a second city, including founding, conquest, puppets, trades and brief ownership. N39 forbids ever owning a World Wonder by any means; losing it later does not erase that branch's history. N26 collects 8 distinct self-built World Wonders across qualifying new games. N40 requires the other 39 new medals; old medals never substitute for them. = N38 में दूसरा शहर रखना निषिद्ध है, चाहे स्थापना, विजय, कठपुतली, व्यापार या थोड़े समय के लिए हो। N39 में किसी भी तरह विश्व आश्चर्य रखना निषिद्ध है; बाद में खोना उस शाखा का इतिहास नहीं मिटाता। N26 योग्य नए खेलों में स्वयं बनाए 8 अलग प्रकार एकत्र करता है। N40 के लिए अन्य 39 नए पदक चाहिए; पुराने पदक उनका स्थान नहीं लेते।
