You've fallen into my trap. I'll bury you. = आप मेरे जाल में फँस गए हैं। मैं आपको दफ़ना दूँगा।
I congratulate you for your victory. = आपकी विजय पर बधाई।
Welcome. I'm Napoleon, of France; the smartest military man in world history. = स्वागत है। मैं फ़्रांस का नेपोलियन हूँ; विश्व इतिहास का सबसे बुद्धिमान सैन्य व्यक्ति।
France offers you this exceptional proposition. = फ़्रांस आपको यह असाधारण प्रस्ताव देता है।
Hello. = नमस्ते।
It's you. = आप हैं।
Ancien Régime = पुरानी शासन व्यवस्था
Vive Napoleon I, First Consul and Emperor of France! After the glorious Revolution which suppressed the centuries-old monarchy, the French nation stood at the heart of Europe as a Republic, and intended to export its ideals to the entire European continent, either by diplomacy or war. The French Capital Paris was more than ever the world center of Culture, Arts, and Letters. With its Great Army, reputed as one of the greatest in the History, France fought gloriously all surrounding enemies, but eventually fell against the coalition of other European powers. = फ़्रांस के प्रथम वाणिज्यदूत और सम्राट नेपोलियन प्रथम की जय! शताब्दियों पुरानी राजशाही समाप्त करने वाली गौरवशाली क्रांति के बाद फ़्रांसीसी राष्ट्र यूरोप के केंद्र में एक गणराज्य के रूप में खड़ा हुआ और उसने कूटनीति या युद्ध द्वारा पूरे यूरोपीय महाद्वीप में अपने आदर्श फैलाने का निश्चय किया। फ़्रांस की राजधानी पेरिस पहले से कहीं अधिक संस्कृति, कला और साहित्य का विश्व केंद्र बनी। इतिहास की महानतम सेनाओं में गिनी जाने वाली अपनी महान सेना के साथ फ़्रांस ने आसपास के सभी शत्रुओं से वीरतापूर्वक युद्ध किया, किंतु अंततः अन्य यूरोपीय शक्तियों के गठबंधन से हार गया।
Napoleon Bonaparte, ruler of the French people, will you rebuild the Empire to take revenge on your foes, and make again of its Capital the City of Lights? Will your new empire shine through the ages of history? = फ़्रांसीसी लोगों के शासक नेपोलियन बोनापार्ट, क्या आप अपने शत्रुओं से बदला लेने के लिए साम्राज्य पुनः बनाएँगे और उसकी राजधानी को फिर प्रकाश का शहर बनाएँगे? क्या आपका नया साम्राज्य इतिहास के युगों में चमकेगा?
