Augustus Caesar = ऑगस्टस सीज़र
My treasury contains little and my soldiers are getting impatient... (sigh) ...therefore you must die. = मेरा खज़ाना खाली हो रहा है और मेरे सैनिक अधीर हो रहे हैं... (आह) ...इसलिए आपको मरना होगा।
So brave, yet so stupid! If only you had a brain similar to your courage. = इतने बहादुर, फिर भी इतने मूर्ख! काश आपका मस्तिष्क भी आपके साहस जैसा होता।
The gods have deprived Rome of their favour. We have been defeated. = देवताओं ने रोम से अपनी कृपा छीन ली है। हम पराजित हुए हैं।
I wasn't sure, but it seems you do have some grit. = मुझे निश्चित नहीं था, पर लगता है आपमें कुछ दम है।
I greet you. I am Augustus, Imperator and Pontifex Maximus of Rome. If you are a friend of Rome, you are welcome. = नमस्कार। मैं ऑगस्टस हूँ, रोम का सम्राट और सर्वोच्च पुरोहित। यदि आप रोम के मित्र हैं, तो आपका स्वागत है।
I offer this, for your consideration. = मैं आपके विचार के लिए यह प्रस्ताव रखता हूँ।
Hail. = अभिवादन।
What do you want? = आप क्या चाहते हैं?
The Glory of Rome = रोम का गौरव
Ave Caesar Augustus, Emperor of Rome and Dominus of the Roman Empire! Your empire was the most powerful and feared of all in Western civilization. The Roman people crafted so brilliantly its culture, law, art, and warfare, that no one could contest the supremacy of Rome. Force and Honor led to glorious conquests, a domination of all the lands from Spain in the west to Syria in the east, even reaching the remote barbarian lands of England and Germany. Roman art and architecture have been praised for millenia and have been envied by all lesser civilizations who have followed. = रोम के सम्राट और रोमन साम्राज्य के स्वामी सीज़र ऑगस्टस को नमन! पश्चिमी सभ्यता में आपका साम्राज्य सबसे शक्तिशाली और भयप्रद था। रोमन लोगों ने अपनी संस्कृति, कानून, कला और युद्धकला को इतनी उत्कृष्टता से रचा कि कोई रोम की सर्वोच्चता को चुनौती न दे सका। शक्ति और सम्मान ने गौरवशाली विजय दिलाई और पश्चिम में स्पेन से पूर्व में सीरिया तक सभी भूमियों पर प्रभुत्व स्थापित किया, यहाँ तक कि इंग्लैंड और जर्मनी की दूरस्थ बर्बर भूमियों तक भी पहुँच गए। रोमन कला और वास्तुकला सहस्राब्दियों से प्रशंसित हैं और उसके बाद आई सभी कमज़ोर सभ्यताएँ उनसे ईर्ष्या करती रही हैं।
O glorious Imperator, your people celebrate you and ask for the glory of Rome! In these times of darkness, the Pax Romana will be a beacon of light for all! Will your new empire shine through the ages of history? = हे गौरवशाली सम्राट, आपके लोग आपका उत्सव मनाते हैं और रोम का गौरव माँगते हैं! अंधकार के इस समय में रोमन शांति सबके लिए प्रकाश का दीप बनेगी! क्या आपका नया साम्राज्य इतिहास के युगों में चमकेगा?
