# Refactored menu and window localization
1. Tap Create room, choose the rules and map, then share the invitation. = 1. कमरा बनाएं पर टैप करें, नियम और मानचित्र चुनें, फिर निमंत्रण साझा करें।
1. The Android player copies their Player ID from Multiplayer and sends it to the iOS host. = 1. एंड्रॉइड प्लेयर मल्टीप्लेयर से अपनी प्लेयर आईडी कॉपी करता है और इसे iOS होस्ट को भेजता है।
2. In an empty player seat, the host taps Add player manually, pastes the Player ID, taps the portrait to choose a civilization, then taps Mark ready. = 2. एक खाली खिलाड़ी सीट में, होस्ट मैन्युअल रूप से प्लेयर जोड़ें पर टैप करता है, प्लेयर आईडी चिपकाता है, एक सभ्यता चुनने के लिए पोर्ट्रेट पर टैप करता है, फिर मार्क रेडी पर टैप करता है।
2. Other iOS players open the invitation or paste it in Join by invitation, tap their civilization portrait to choose, then tap Ready. = 2. अन्य iOS खिलाड़ी आमंत्रण खोलें या उसे आमंत्रण द्वारा शामिल हों में पेस्ट करें, चुनने के लिए उनके सभ्यता चित्र पर टैप करें, फिर तैयार पर टैप करें।
3. After starting, the Game ID is copied automatically. Send it to the Android player to add the game in Multiplayer. = 3. शुरू करने के बाद गेम आईडी अपने आप कॉपी हो जाती है। गेम को मल्टीप्लेयर में जोड़ने के लिए इसे एंड्रॉइड प्लेयर पर भेजें।
3. The host is ready automatically. When everyone is ready, the host taps Start game. No Player ID or Game ID exchange is needed. = 3. होस्ट स्वचालित रूप से तैयार है. जब हर कोई तैयार हो जाता है, तो मेज़बान स्टार्ट गेम पर टैप करता है। किसी प्लेयर आईडी या गेम आईडी एक्सचेंज की आवश्यकता नहीं है।
