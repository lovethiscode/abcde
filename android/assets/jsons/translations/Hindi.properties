Default music download is unavailable in this build. = इस बिल्ड में डिफ़ॉल्ट संगीत डाउनलोड उपलब्ध नहीं है।
Sync saves now = सेव अभी सिंक करें
Restore saves from iCloud = iCloud से सेव पुनर्स्थापित करें
Sync local and iCloud saves now?\nA changed save may replace the same-named version\non the other side.\nConflicting versions are kept separately. = स्थानीय और iCloud सेव अभी सिंक करें?\nबदला हुआ सेव दूसरे पक्ष पर समान नाम वाले संस्करण को\nबदल सकता है।\nपरस्पर-विरोधी संस्करण अलग रखे जाते हैं।
Restore saves from iCloud now?\nSaves deleted only on this device return\nif they still exist in iCloud.\nOther changes still sync both ways;\na same-named version may be replaced.\nConflicts are kept separately. = iCloud से सेव अभी पुनर्स्थापित करें?\nकेवल इस डिवाइस से हटाए गए सेव वापस आ जाएँगे\nयदि वे अभी भी iCloud में मौजूद हैं।\nअन्य बदलाव दोनों दिशाओं में सिंक होते रहेंगे;\nसमान नाम वाला संस्करण बदला जा सकता है।\nविरोध अलग रखे जाते हैं।
Checking iCloud availability... = iCloud की उपलब्धता जाँची जा रही है...
