Isabella = इसाबेला
God will probably forgive you... but I shall not. Prepare for war. = ईश्वर शायद आपको क्षमा कर दे... किंतु मैं नहीं करूँगी। युद्ध के लिए तैयार हों।
Repugnant spawn of the devil! You will pay! = शैतान की घृणित संतान! आपको कीमत चुकानी होगी!
If my defeat is, without any doubt, the will of God, then I will accept it. = यदि मेरी हार निस्संदेह ईश्वर की इच्छा है, तो मैं उसे स्वीकार करूँगी।
God blesses those who deserve it. I am Isabel of Spain. = ईश्वर उन्हीं को आशीर्वाद देता है जो योग्य हैं। मैं स्पेन की इसाबेल हूँ।
I hope this deal will receive your blessing. = आशा है इस सौदे को आपका आशीर्वाद मिलेगा।
Seven Cities of Gold = स्वर्ण के सात शहर
Holy Isabella, envoy of God, Great Queen of Castille and León, your people celebrate you! Spain is a beautiful and ancient country, a link between Europe and Africa, one shore on the Mediterranean and the other on the mighty Atlantic Ocean. The Spanish culture had taken the best of the Christian and Muslim worlds, and was ready to dominate the world for centuries. Powerful Spanish military fleets and brave explorers found and conquered much of the New World. Exploiting a whole new continent and its riches, Spain reached a state of power few could compete with for hundreds of years. = ईश्वर की दूत, कैस्टिल और लियोन की महान महारानी पवित्र इसाबेला, आपके लोग आपका उत्सव मनाते हैं! स्पेन एक सुंदर प्राचीन देश है, यूरोप और अफ्रीका के बीच की कड़ी, जिसका एक तट भूमध्य सागर पर और दूसरा शक्तिशाली अटलांटिक महासागर पर है। स्पेनी संस्कृति ने ईसाई और मुस्लिम संसार की श्रेष्ठ बातें अपनाईं और शताब्दियों तक विश्व पर प्रभुत्व के लिए तैयार थी। शक्तिशाली स्पेनी नौसैनिक बेड़ों और वीर खोजकर्ताओं ने नए विश्व का बड़ा भाग खोजा और जीता। एक पूरे नए महाद्वीप और उसकी संपदा का दोहन करके स्पेन ऐसी शक्ति तक पहुँचा जिसकी सैकड़ों वर्षों तक कुछ ही बराबरी कर सके।
O splendid and virtuous Isabella! By the will of the heavens, will Spain reborn to achieve its holy destiny and become a new El Dorado? Will your new empire shine through the ages of history? = हे भव्य और सदाचारी इसाबेला! क्या स्वर्ग की इच्छा से स्पेन अपनी पवित्र नियति पूरी करने और नया एल डोराडो बनने के लिए पुनर्जन्म लेगा? क्या आपका नया साम्राज्य इतिहास के युगों में चमकेगा?
