External links support right-click or long press to copy the link to the clipboard instead of launching the browser. = बाहरी कड़ियों पर दायाँ क्लिक या देर तक दबाने से ब्राउज़र खोलने के बदले कड़ी क्लिपबोर्ड में कॉपी होती है।
Example: The 'Open Github page' button on the Mod management screen. = उदाहरण: मॉड प्रबंधन दृश्य का 'GitHub पृष्ठ खोलें' बटन।
