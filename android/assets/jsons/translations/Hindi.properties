Online multiplayer servers are operated by third parties. The selected server receives your player ID, IP address, and game save data. Its availability, retention, deletion, and remote game saves are not guaranteed by Unciv. All players must use the same Unciv version and have the exact same versions of every mod installed. = ऑनलाइन मल्टीप्लेयर सर्वर तीसरे पक्ष द्वारा संचालित किए जाते हैं। चयनित सर्वर आपका Player ID, IP पता और खेल के सेव का डेटा प्राप्त करता है। Unciv उसकी उपलब्धता, डेटा रखने या हटाने और दूरस्थ खेल सेव की गारंटी नहीं देता। सभी खिलाड़ियों को Unciv का समान संस्करण उपयोग करना और हर मॉड के बिल्कुल समान संस्करण इंस्टॉल करने होंगे।
Recovery saved = रिकवरी सेव हुई
Creation stopped before upload because a local recovery copy could not be saved. = अपलोड से पहले निर्माण रुक गया क्योंकि स्थानीय रिकवरी कॉपी सेव नहीं की जा सकी।
Remote creation could not be confirmed. The Game ID was copied and a local recovery copy was saved. Open that Multiplayer entry to resume this exact game; do not start another one. = दूरस्थ निर्माण की पुष्टि नहीं हो सकी। Game ID कॉपी किया गया और स्थानीय रिकवरी कॉपी सेव की गई। इसी खेल को जारी रखने के लिए वह मल्टीप्लेयर प्रविष्टि खोलें; दूसरा खेल शुरू न करें।
Server limit reached! Please wait for [time] seconds. The Game ID was copied; open its saved Multiplayer entry to retry. = सर्वर सीमा पूरी हो गई! कृपया [time] सेकंड प्रतीक्षा करें। Game ID कॉपी किया गया; फिर प्रयास करने के लिए उसकी सहेजी हुई मल्टीप्लेयर प्रविष्टि खोलें।
Creation was interrupted and the Game ID was copied, but a local recovery copy could not be saved. = निर्माण बाधित हुआ और Game ID कॉपी किया गया, लेकिन स्थानीय रिकवरी कॉपी सेव नहीं की जा सकी।
The full game was uploaded before creation was interrupted. The Game ID was copied and a local recovery copy was saved. = निर्माण बाधित होने से पहले पूरा खेल अपलोड हो गया था। Game ID कॉपी किया गया और स्थानीय रिकवरी कॉपी सेव की गई।
Remote creation could not be confirmed. The Game ID was copied and a local recovery copy was saved. Open that Multiplayer entry to resume this exact game. = दूरस्थ निर्माण की पुष्टि नहीं हो सकी। Game ID कॉपी किया गया और स्थानीय रिकवरी कॉपी सेव की गई। इसी खेल को जारी रखने के लिए वह मल्टीप्लेयर प्रविष्टि खोलें।
Could not upload game. The Game ID was copied; open its saved Multiplayer entry to retry this exact game. = खेल अपलोड नहीं हो सका। Game ID कॉपी किया गया; इसी खेल पर फिर प्रयास करने के लिए उसकी सहेजी हुई मल्टीप्लेयर प्रविष्टि खोलें।
Game created and ID copied, but its turn preview is not confirmed. Submitting the first turn will retry it. = खेल बनाया गया और ID कॉपी किया गया, लेकिन उसकी बारी का पूर्वावलोकन पुष्ट नहीं है। पहली बारी भेजने पर फिर प्रयास होगा।
Could not persist the latest server state locally. = सर्वर की नवीनतम स्थिति स्थानीय रूप से सेव नहीं की जा सकी।
Turn upload is unconfirmed because its background time expired. Retry after returning to the game. = पृष्ठभूमि समय समाप्त होने के कारण बारी का अपलोड पुष्ट नहीं है। खेल में लौटने के बाद फिर प्रयास करें।
Server limit reached! Please wait for [time] seconds before retrying. = सर्वर सीमा पूरी हो गई! फिर प्रयास करने से पहले [time] सेकंड प्रतीक्षा करें।
Turn upload is unconfirmed. Reason: [reason] = बारी का अपलोड पुष्ट नहीं है। कारण: [reason]
Could not open authentication. The turn upload is unconfirmed. = प्रमाणीकरण नहीं खोला जा सका। बारी का अपलोड पुष्ट नहीं है।
Authentication was cancelled. The turn upload is unconfirmed. = प्रमाणीकरण रद्द किया गया। बारी का अपलोड पुष्ट नहीं है।
The server no longer has the game. The pending turn was kept and was not uploaded. = सर्वर पर अब यह खेल नहीं है। लंबित बारी रखी गई और अपलोड नहीं की गई।
Could not confirm the previous turn upload. Reason: [reason] = पिछली बारी के अपलोड की पुष्टि नहीं हो सकी। कारण: [reason]
The server's full game could not be verified. The pending turn was kept and was not uploaded. = सर्वर पर पूरे खेल का सत्यापन नहीं हो सका। लंबित बारी रखी गई और अपलोड नहीं की गई।
The server confirmed the turn, but it could not be saved locally. Retry to recover safely. = सर्वर ने बारी की पुष्टि की, लेकिन वह स्थानीय रूप से सेव नहीं हो सकी। सुरक्षित रूप से वापस पाने के लिए फिर प्रयास करें।
The pending turn could not be stored or recovered safely. It was not uploaded. = लंबित बारी सुरक्षित रूप से संग्रहीत या वापस नहीं पाई जा सकी। उसे अपलोड नहीं किया गया।
Dropbox storage is no longer available. Use an Unciv API v1 server instead. = Dropbox संग्रहण अब उपलब्ध नहीं है। इसके बजाय Unciv API v1 सर्वर का उपयोग करें।
Could not persist the multiplayer server for this game. = इस खेल के मल्टीप्लेयर सर्वर को सेव नहीं किया जा सका।
The multiplayer server address is invalid. = मल्टीप्लेयर सर्वर का पता अमान्य है।
This build requires a public HTTPS multiplayer server address. = इस बिल्ड के लिए मल्टीप्लेयर सर्वर का सार्वजनिक HTTPS पता आवश्यक है।
The multiplayer server attempted an unsafe redirect. = मल्टीप्लेयर सर्वर ने असुरक्षित रीडायरेक्ट का प्रयास किया।
The multiplayer server redirected too many times. = मल्टीप्लेयर सर्वर ने बहुत अधिक बार रीडायरेक्ट किया।
The multiplayer server address could not be resolved. = मल्टीप्लेयर सर्वर का पता हल नहीं किया जा सका।
A secure connection to the multiplayer server could not be established. = मल्टीप्लेयर सर्वर से सुरक्षित कनेक्शन स्थापित नहीं किया जा सका।
Connecting to the multiplayer server timed out. = मल्टीप्लेयर सर्वर से कनेक्ट होने का समय समाप्त हो गया।
The multiplayer server took too long to respond. = मल्टीप्लेयर सर्वर ने उत्तर देने में बहुत समय लिया।
The multiplayer request was cancelled. = मल्टीप्लेयर अनुरोध रद्द किया गया।
The multiplayer server could not be reached. = मल्टीप्लेयर सर्वर तक नहीं पहुँचा जा सका।
The multiplayer server returned an invalid response. = मल्टीप्लेयर सर्वर ने अमान्य उत्तर दिया।
The multiplayer server failed with status [statusCode]. = मल्टीप्लेयर सर्वर [statusCode] स्थिति के साथ विफल हुआ।
The multiplayer server rejected the request with status [statusCode]. = मल्टीप्लेयर सर्वर ने [statusCode] स्थिति के साथ अनुरोध अस्वीकार किया।
Authentication validation was cancelled = प्रमाणीकरण सत्यापन रद्द किया गया
The game was uploaded, but its multiplayer preview is not confirmed. = खेल अपलोड हुआ, लेकिन उसका मल्टीप्लेयर पूर्वावलोकन पुष्ट नहीं है।
The multiplayer server may have stored the game, but did not confirm the upload. = मल्टीप्लेयर सर्वर ने शायद खेल संग्रहीत किया हो, लेकिन अपलोड की पुष्टि नहीं की।
Select a save to continue = जारी रखने के लिए सेव चुनें
Import save = सेव आयात करें
