Harun al-Rashid = हारून अल-रशीद
The world will be more beautiful without you. Prepare for war. = आपके बिना विश्व अधिक सुंदर होगा। युद्ध के लिए तैयार हों।
Fool! You will soon regret dearly! I swear it! = मूर्ख! आपको जल्द ही भारी पछतावा होगा! मैं शपथ लेता हूँ!
You have won, congratulations. My palace is now in your possession, and I beg that you care well for the peacock. = आप जीत गए, बधाई। मेरा महल अब आपके अधिकार में है, और मैं विनती करता हूँ कि मोर की अच्छी देखभाल करें।
Our future battle will be glorious. = हमारा भावी युद्ध गौरवशाली होगा।
Welcome foreigner, I am Harun Al-Rashid, Caliph of the Arabs. Come and tell me about your empire. = स्वागत है विदेशी, मैं अरबों का खलीफ़ा हारून अल-रशीद हूँ। आइए, मुझे अपने साम्राज्य के बारे में बताइए।
Come forth, let's do business. = आगे आइए, व्यापार करें।
Peace be upon you. = आप पर शांति हो।
Trade Caravans = व्यापारी कारवाँ
Blessings of the Great God be upon you, O great caliph Harun al-Rashid, leader of the mighty Arabian people! The Muslim Empire, the Caliphate, born from chaos after the death of the prophet Muhammad in 632 AD, intended to apply the rule of God to all Earth. And by the will of God, the caliphate reached its full power, ruling Spain, North Africa, the Middle East, Anatolia, the Balkans and Persia, to even surpass the Great Roman Empire. The arts and sciences were a holy gift of Arabia during the Middle Ages, as the infidel lands of Europe delved deep into ignorance and chaos. Lasting for six hundred years, the Caliphate finally fell before the Mongols, the plague of the civilized world. = हे शक्तिशाली अरब लोगों के नेता, महान खलीफ़ा हारून अल-रशीद, महान ईश्वर का आशीर्वाद आप पर हो! 632 ईस्वी में पैगंबर मुहम्मद की मृत्यु के बाद अराजकता से जन्मे मुस्लिम साम्राज्य, ख़िलाफ़त, का उद्देश्य पूरी धरती पर ईश्वर का शासन लागू करना था। ईश्वर की इच्छा से ख़िलाफ़त अपनी पूर्ण शक्ति तक पहुँची और स्पेन, उत्तर अफ्रीका, मध्य पूर्व, अनातोलिया, बाल्कन तथा फ़ारस पर शासन करते हुए महान रोमन साम्राज्य से भी आगे निकल गई। मध्य युग में कला और विज्ञान अरब का पवित्र उपहार थे, जबकि यूरोप की अविश्वासी भूमि अज्ञान और अराजकता में डूबी थी। छह सौ वर्षों तक रहने के बाद ख़िलाफ़त अंततः सभ्य विश्व की विपत्ति मंगोलों के सामने गिर गई।
Great Caliph Harun al Rashid, all Arabian people long for greatness! Arabia must be once again the land of arts and knowledge, which under the radiant law of God, will fear no enemy! Will your new empire shine through the ages of history? = महान खलीफ़ा हारून अल-रशीद, सभी अरब लोग महानता के लिए तरसते हैं! अरब को फिर कला और ज्ञान की भूमि बनना होगा, जो ईश्वर के उज्ज्वल कानून के अधीन किसी शत्रु से न डरे! क्या आपका नया साम्राज्य इतिहास के युगों में चमकेगा?
