Hello, again. = फिर से नमस्कार।
Oh, it's you! = ओह, आप हैं!
Sun Never Sets = सूर्य कभी नहीं डूबता
Long live to Your Highness, Queen Elizabeth Gloriana, leader and protector of the glorious England! Through history, enduring many invasions, England strengthened its will, playing smartly with diplomacy, cunning, and military power, to eventually rose as one of the most dominant Empires the world has ever known. Their matchless navy, brilliant scientists and artists, and powerful merchants, have shaped the known world for centuries. = गौरवशाली इंग्लैंड की नेता और रक्षक, महारानी एलिज़ाबेथ ग्लोरियाना की जय हो! इतिहास में अनेक आक्रमण सहकर इंग्लैंड ने अपना संकल्प मज़बूत किया और कूटनीति, चतुराई तथा सैन्य शक्ति का कुशल उपयोग करके अंततः विश्व के सबसे प्रभुत्वशाली साम्राज्यों में स्थान पाया। उसकी बेजोड़ नौसेना, प्रतिभाशाली वैज्ञानिकों व कलाकारों और शक्तिशाली व्यापारियों ने शताब्दियों तक ज्ञात विश्व को आकार दिया।
Queen Elizabeth, will England cast once more its brightness upon all lands and seas of the world? Will your new empire shine through the ages of history? = महारानी एलिज़ाबेथ, क्या इंग्लैंड एक बार फिर विश्व की सभी भूमियों और समुद्रों पर अपना प्रकाश फैलाएगा? क्या आपका नया साम्राज्य इतिहास के युगों में चमकेगा?
