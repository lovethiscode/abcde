Gandhi = गांधी
I have just received a report that large numbers of my troops have crossed your borders. = मेरे सैनिक बड़ी संख्या में आपकी सीमाएँ लाँघ चुके हैं—मुझे अभी-अभी यह सूचना मिली है।
My attempts to avoid violence have failed. An eye for an eye only makes the world blind. = हिंसा से विरत रहने के मेरे प्रयास निष्फल रहे। एक नेत्र के प्रतिशोध में दूसरा नेत्र लेने से समस्त संसार नेत्रहीन हो जाता है।
You can chain me, you can torture me, you can even destroy this body, but you will never imprison my mind. = आप मुझे शृंखलाबद्ध कर सकते हैं, मुझे यातना दे सकते हैं, इस देह को नष्ट भी कर सकते हैं; किन्तु मेरे मन को कभी पराधीन नहीं कर सकेंगे।
Curious. = विचित्र।
Hello, I am Mohandas Gandhi. My people call me Bapu, but please, call me friend. = नमस्कार, मैं मोहनदास गांधी हूँ। मेरे देशवासी मुझे बापू कहते हैं; किन्तु कृपया मुझे मित्र कहें।
My friend, are you interested in this arrangement? = मित्र, क्या इस व्यवस्था में आपकी रुचि है?
I wish you peace. = मैं आपके लिए शान्ति की कामना करता हूँ।
Population Growth = जनसंख्या वृद्धि
Wise Mahatma Gandhi, great leader of India, we honor you! India is one of the oldest countries in the world with 10,000 years of history, built on spirit and religion, as three of the world's great religions - Hinduism, Buddhism and Jainism - appeared on this sacred land. Every aspect of India society reveres art, music and color, showing great wealth but also grinding poverty. For centuries, India was torn between local kingdoms fighting each other but also repelling invaders. In the 12th century AD, Muslim Turks tried to conquer India, then the Mongols took their place. In the early 17th century, India, still fragmented, was colonized by the English and their diplomacy and technological superiority. After two centuries of British dominion, Indian nationalism woke up, and you, Great Mahatma, have led a peaceful and victorious rebellion never seen anywhere in history! = हे मनीषी महात्मा गांधी, भारत के महान नायक, हम आपका अभिनन्दन करते हैं! दस सहस्र वर्षों के इतिहास वाला भारत संसार के प्राचीनतम राष्ट्रों में से एक है। इसकी आधारशिला अध्यात्म और धर्म पर रखी गई; संसार की तीन महान धर्मपरम्पराएँ—सनातन धर्म, बौद्ध मत और जैन मत—इसी पवित्र धरा पर उदित हुईं। भारतीय समाज का प्रत्येक अंग कला, संगीत और वर्णों का आदर करता है; यहाँ अपार समृद्धि के साथ दारुण निर्धनता भी दिखाई देती है। शताब्दियों तक भारत परस्पर युद्धरत स्थानीय राज्यों में विभक्त रहा, यद्यपि वे विदेशी आक्रान्ताओं को भी प्रतिहत करते रहे। सामान्य संवत् की बारहवीं शताब्दी में तुरुष्कों ने भारत को अधीन करने का प्रयास किया; तत्पश्चात मंगोल आए। सत्रहवीं शताब्दी के आरम्भ में, जब भारत अभी भी विखण्डित था, समुद्रपार से आए विदेशियों ने अपनी राजनयिक कुशलता और प्रौद्योगिक श्रेष्ठता के बल पर उसे उपनिवेश बना लिया। दो शताब्दियों के विदेशी आधिपत्य के पश्चात भारतीय राष्ट्रचेतना जाग उठी; और आपने, हे महान महात्मा, ऐसे शान्तिपूर्ण तथा विजयी विद्रोह का नेतृत्व किया जिसका उदाहरण इतिहास में कहीं नहीं मिलता!
Gandhi, your people ask again to be led on the path of freedom. Under protection of Ganesha and Surya, can India accomplish its great potential? Will your new empire shine through the ages of history? = गांधी, आपकी प्रजा पुनः स्वतन्त्रता-पथ पर आपके नेतृत्व की अभिलाषी है। गणेश और सूर्य के संरक्षण में क्या भारत अपनी महान सामर्थ्य को साकार कर सकेगा? क्या आपका नवीन साम्राज्य इतिहास के युगों में दीप्तिमान रहेगा?
