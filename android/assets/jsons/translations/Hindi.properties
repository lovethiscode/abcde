"Toasts" can be clicked to make them stay on the screen for easier reading. = क्षणिक पॉपअप पर क्लिक करके उसे स्क्रीन पर रोक सकते हैं, जिससे पढ़ना आसान हो।
Click it again to close (or use the close button). = बंद करने के लिए फिर क्लिक करें या बंद करने का बटन उपयोग करें।
