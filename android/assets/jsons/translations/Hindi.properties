A public nickname submission is waiting for iCloud and will retry automatically. = सार्वजनिक उपनाम की प्रस्तुति iCloud की प्रतीक्षा कर रही है और स्वचालित रूप से फिर प्रयास करेगी।
Thank you for supporting Unciv! = Unciv का समर्थन करने के लिए धन्यवाद!
Your public nickname submission was saved. = आपके सार्वजनिक उपनाम की प्रस्तुति सेव हो गई।
Sign in to iCloud = iCloud में साइन इन करें
Your purchase is complete. The public nickname is queued locally and will retry after you sign in to iCloud. = आपकी खरीद पूरी हो गई है। सार्वजनिक उपनाम स्थानीय कतार में है और आपके iCloud में साइन इन करने के बाद फिर प्रयास करेगा।
iCloud is unavailable = iCloud उपलब्ध नहीं है
Your purchase is complete. The public nickname is queued locally and will retry automatically. = आपकी खरीद पूरी हो गई है। सार्वजनिक उपनाम स्थानीय कतार में है और स्वचालित रूप से फिर प्रयास करेगा।
Your purchase is complete. The public nickname remains queued; reopen the support screen to retry. = आपकी खरीद पूरी हो गई है। सार्वजनिक उपनाम कतार में बना हुआ है; फिर प्रयास करने के लिए समर्थन स्क्रीन दोबारा खोलें।
Submission needs attention = प्रस्तुति पर ध्यान देना आवश्यक है
A different CloudKit record already uses this transaction ID. The local submission was kept for a safe retry. = एक अन्य CloudKit रिकॉर्ड पहले से यह लेन-देन ID उपयोग करता है। सुरक्षित पुनः प्रयास के लिए स्थानीय प्रस्तुति रखी गई।
