Montezuma I = मोंतेज़ुमा प्रथम
Xi-miqa-can! Xi-miqa-can! Xi-miqa-can! (Die, die, die!) = शि-मिका-कान! शि-मिका-कान! शि-मिका-कान! (मरो, मरो, मरो!)
Excellent! Let the blood flow in raging torrents! = उत्तम! रक्त को उफनती धाराओं में बहने दो!
Monster! Who are you to destroy my greatness? = राक्षस! मेरी महानता नष्ट करने वाले आप कौन हैं?
What do I see before me? Another beating heart for my sacrificial fire. = अपने सामने मैं क्या देखता हूँ? मेरी बलि की अग्नि के लिए एक और धड़कता हृदय।
Accept this agreement or suffer the consequences. = यह समझौता स्वीकार करें या परिणाम भुगतें।
Welcome, friend. = स्वागत है मित्र।
Sacrificial Captives = बलि के बंदी
O divine Montezuma, your people welcome you! May your magnificence inspire all living things! The mighty Aztecs were nomads until the 12th century, when they choose to settle in the mesa central, which would later be called Mexico. Wars were frequent with other tribes to control the rich land surrounding the sacred lakes of Texcoco, Xaltocan and Zampango. In some 200 years, double-sided alliances and martial prowess made of the Aztecs the dominant power in the Central American basin, forming a mighty empire stretching from sea to sea. Alas, the empire fell under the assault of foreign devils - the Spaniards and many curses they brought with them! Wars between tribes and weaponry of doom used by the invaders made the great Aztec civilization crumble in only a few decades. = हे दिव्य मोंतेज़ुमा, आपके लोग आपका स्वागत करते हैं! आपकी भव्यता सभी जीवों को प्रेरित करे! शक्तिशाली एज़्टेक 12वीं शताब्दी तक घुमंतू थे, जब उन्होंने केंद्रीय पठार पर बसना चुना, जिसे बाद में मेक्सिको कहा जाएगा। तेशकोको, शालतोकान और ज़म्पांगो की पवित्र झीलों के आसपास की समृद्ध भूमि पर अधिकार के लिए अन्य जनजातियों से अक्सर युद्ध होते थे। लगभग 200 वर्षों में दोहरे गठबंधनों और युद्धकौशल ने एज़्टेकों को मध्य अमेरिकी घाटी की प्रमुख शक्ति बना दिया और समुद्र से समुद्र तक फैला शक्तिशाली साम्राज्य बना। अफ़सोस, साम्राज्य विदेशी दानवों — स्पेनियों और उनके साथ आए अनेक अभिशापों — के हमलों में गिर गया! जनजातीय युद्धों और आक्रमणकारियों के विनाशकारी हथियारों ने कुछ ही दशकों में महान एज़्टेक सभ्यता को ध्वस्त कर दिया।
O mighty King Montezuma, do you hear the call of your people seeking for revenge? Will you lead them to victory under the light of the Five Suns? Will your new empire shine through the ages of history? = हे शक्तिशाली राजा मोंतेज़ुमा, क्या आप बदला माँगते अपने लोगों की पुकार सुनते हैं? क्या आप पाँच सूर्यों के प्रकाश में उन्हें विजय की ओर ले जाएँगे? क्या आपका नया साम्राज्य इतिहास के युगों में चमकेगा?
