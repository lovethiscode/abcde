I agree that my nickname may be displayed publicly in Unciv and its GitHub supporter list. The nickname and verified purchase submission will be stored in the public CloudKit database. = मैं सहमत हूँ कि मेरा उपनाम Unciv और उसकी GitHub समर्थक सूची में सार्वजनिक रूप से दिखाया जा सकता है। उपनाम और सत्यापित खरीद की प्रस्तुति सार्वजनिक CloudKit डेटाबेस में संग्रहीत होगी।
Agree and submit = सहमत होकर भेजें
