Askia = अस्किया
You are an abomination to heaven and earth, the chief of ignorant savages! You must be destroyed! = आप स्वर्ग और धरती के लिए घृणित, अज्ञानी बर्बरों के प्रमुख हैं! आपका नष्ट होना आवश्यक है!
Fool! You have doomed your people to fire and destruction! = मूर्ख! आपने अपने लोगों को आग और विनाश के हवाले कर दिया!
We have been consumed by the fires of hatred and rage. Enjoy your victory in this world - you shall pay a heavy price in the next! = घृणा और क्रोध की अग्नि ने हमें निगल लिया है। इस संसार में अपनी विजय का आनंद लें — अगले संसार में आपको भारी कीमत चुकानी होगी!
This insult shall cost you. = इस अपमान की आपको कीमत चुकानी होगी।
I am Askia of the Songhai. We are a fair people - but those who cross us will find only destruction. You would do well to avoid repeating the mistakes others have made in the past. = मैं सोंघाई का अस्किया हूँ। हम न्यायप्रिय लोग हैं, किंतु जो हमसे वैर लेते हैं उन्हें केवल विनाश मिलता है। दूसरों की पुरानी गलतियाँ दोहराने से बचना आपके हित में होगा।
Can I interest you in this deal? = क्या इस सौदे में आपकी रुचि है?
River Warlord = नदी का युद्ध सरदार
Askia, leader of the Songhai people and greatest of all, may God watch your path towards glory! Songhai was under the rule of the mighty West African state of Mali until the middle of the 14th century. Great King Sunni Ali Ber fought for independance, and showed to all Songhai's power, by conquering territories and repelling many foes who sought to destroy the rising kingdom. Ultimately, conquest of the wealthy cities of Timbuktu and Jenne made Songhai an empire with enough economic power to survive for a century, until the empire bowed down before foes with advanced technology - muskets against spearmen. = सोंघाई लोगों के नेता और सर्वश्रेष्ठ अस्किया, ईश्वर गौरव के आपके पथ की रक्षा करें! 14वीं शताब्दी के मध्य तक सोंघाई शक्तिशाली पश्चिम अफ्रीकी राज्य माली के अधीन था। महान राजा सुन्नी अली बेर ने स्वतंत्रता के लिए युद्ध किया तथा क्षेत्र जीतकर और उभरते राज्य को नष्ट करना चाहने वाले अनेक शत्रुओं को खदेड़कर सबको सोंघाई की शक्ति दिखाई। अंततः समृद्ध टिम्बकटू और जेन्ने शहरों की विजय ने सोंघाई को इतनी आर्थिक शक्ति वाला साम्राज्य बनाया कि वह एक शताब्दी तक बना रहा, जब तक उसे उन्नत तकनीक वाले शत्रुओं के सामने झुकना नहीं पड़ा — भालेवालों के विरुद्ध बंदूकें।
King Askia, your people know there's still hope, that the hour of revenge is coming. Give them wealth and power, give them mighty weapons of iron and fire, to destroy any foe, for Songhai to revive! Will your new empire shine through the ages of history? = राजा अस्किया, आपके लोग जानते हैं कि अभी आशा है और बदले का समय आ रहा है। उन्हें संपदा और शक्ति दीजिए, लोहे और आग के शक्तिशाली हथियार दीजिए ताकि वे किसी भी शत्रु को नष्ट करें और सोंघाई फिर जी उठे! क्या आपका नया साम्राज्य इतिहास के युगों में चमकेगा?
