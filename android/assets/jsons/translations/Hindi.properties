Ramkhamhaeng = रामखामहेंग
You lowly, arrogant fool! I will make you regret of your insolence! = नीच, अहंकारी मूर्ख! मैं आपको अपनी धृष्टता पर पछताने को मजबूर करूँगा!
You scoundrel! I shall prepare to fend you off! = दुष्ट! मैं आपको खदेड़ने की तैयारी करूँगा!
Although I lost, my honor shall endure. I wish you good luck. = यद्यपि मैं हार गया, मेरा सम्मान बना रहेगा। आपको शुभकामनाएँ।
I, Pho Kun Ramkhamhaeng, King of Siam, consider it a great honor that you have walked to visit my country of Siam. = मैं, सियाम का राजा फो खुन रामखामहेंग, इसे बड़ा सम्मान मानता हूँ कि आप मेरे देश सियाम की यात्रा पर आए।
Greetings. I believe this is a fair proposal for both parties. What do you think? = नमस्कार। मेरा मानना है कि यह दोनों पक्षों के लिए निष्पक्ष प्रस्ताव है। आपका क्या विचार है?
Welcome. = स्वागत है।
Father Governs Children = पिता बच्चों का शासन करता है
O Great King Ramkhamhaeng, the Siamese people obey you with respect and fear! The beautiful and mysterious land of Siam is an ancient country in the heart of Southeast Asia, which was besieged by many foes, plagued by bloody war and great poverty, but eventually the smart and loyal Siamese people have endured and triumphed. Siam was a part of the Khmer Empire until the 13th century AD, before its brave people took arms and led a revolution to form the small Sukhothai kingdom. After many battles and diplomacy prowess, this tiny kingdom became a mighty empire, which would dominate South East Asia for more than a century. = हे महान राजा रामखामहेंग, सियाम के लोग सम्मान और भय से आपकी आज्ञा मानते हैं! सियाम की सुंदर रहस्यमयी भूमि दक्षिण पूर्व एशिया के केंद्र का एक प्राचीन देश है, जिसे अनेक शत्रुओं ने घेरा तथा रक्तरंजित युद्ध और भारी गरीबी ने सताया; किंतु अंततः चतुर और वफ़ादार सियामी लोग टिके रहे और विजयी हुए। 13वीं शताब्दी ईस्वी तक सियाम खमेर साम्राज्य का भाग था, फिर उसके वीर लोगों ने हथियार उठाकर क्रांति की और छोटा सुखोथाई राज्य बनाया। अनेक युद्धों और कूटनीतिक कौशल के बाद यह छोटा राज्य शक्तिशाली साम्राज्य बना, जिसने एक शताब्दी से अधिक दक्षिण पूर्व एशिया पर प्रभुत्व रखा।
Wise and powerful King Ramkhamhaeng, your people want to revive these days of glory! Can you make a new dawn break on Siam? Will your new empire shine through the ages of history? = बुद्धिमान और शक्तिशाली राजा रामखामहेंग, आपके लोग गौरव के उन दिनों को पुनर्जीवित करना चाहते हैं! क्या आप सियाम में नई भोर ला सकते हैं? क्या आपका नया साम्राज्य इतिहास के युगों में चमकेगा?
