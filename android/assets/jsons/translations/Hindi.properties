Pacal = पाकाल
A sacrifice unlike all others must be made! = अन्य सभी से अलग एक बलि देनी होगी!
Muahahahahahaha! = मुहाहाहाहाहा!
Today comes a great searing pain. With you comes the path to the black storm. = आज तीव्र जलती पीड़ा आती है। आपके साथ काले तूफ़ान का मार्ग आता है।
Greetings, wayward one. I am known as Pacal. = नमस्कार भटके हुए यात्री। मुझे पाकाल कहते हैं।
Friend, I believe I may have found a way to save us all! Look, look and accept my offering! = मित्र, लगता है मैंने हम सबको बचाने का मार्ग पा लिया! देखिए, देखिए और मेरी भेंट स्वीकार करें!
A fine day, it helps you. = सुंदर दिन आपकी सहायता करे।
The Long Count = दीर्घ गणना
Kneel before King Pacal the Great, son of the gods and protector of the Palenque domain! After your kingdom has been harassed for years by neighboring rivals, you struck back at the enemies of your people, defeating each of them and sacrificing their leaders as a retribution to the insults made to your ancestors. Your wisdom and hard will not only restored the glory of Palenque, but turned it into a magnificient city, as your people built the greatest monuments and architecture the world has ever known. = देवताओं के पुत्र और पालेन्के क्षेत्र के रक्षक महान राजा पाकाल के सामने घुटने टेकें! पड़ोसी प्रतिद्वंद्वियों द्वारा वर्षों सताए जाने के बाद आपने अपने लोगों के शत्रुओं पर पलटवार किया, प्रत्येक को हराया और पूर्वजों के अपमान का प्रतिशोध लेने के लिए उनके नेताओं की बलि दी। आपकी बुद्धि और दृढ़ इच्छा ने पालेन्के का गौरव लौटाया ही नहीं, उसे भव्य शहर बनाया, जहाँ आपके लोगों ने विश्व के महानतम स्मारक और वास्तुकृतियाँ बनाईं।
Absolute King, your people need you to save the great Mayan culture and knowledge. Will you be able to read the movement of the stars, and find in the heavens the power to repel any foes? Will your new empire shine through the ages of history? = निरंकुश राजा, महान माया संस्कृति और ज्ञान बचाने के लिए आपके लोगों को आपकी आवश्यकता है। क्या आप तारों की गति पढ़कर स्वर्ग में किसी भी शत्रु को खदेड़ने की शक्ति पा सकेंगे? क्या आपका नया साम्राज्य इतिहास के युगों में चमकेगा?
