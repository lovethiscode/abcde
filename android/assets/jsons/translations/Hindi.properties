Purchase pending = खरीद लंबित
StoreKit is waiting for approval. If it completes later, Unciv will recover it automatically. = StoreKit स्वीकृति की प्रतीक्षा कर रहा है। यदि यह बाद में पूरी होती है, तो Unciv इसे स्वचालित रूप से पुनर्प्राप्त करेगा।
