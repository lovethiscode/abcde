不限难度。三个不同合格自由对局分别取得三种不同的非时间胜利，从科技、文化、征服、外交中任选三种。同一局游戏 只贡献首个正式终局结果；重载、复制存档不增加局数或胜利种类。 = किसी भी कठिनाई पर वैज्ञानिक, सांस्कृतिक, प्रभुत्व और कूटनीतिक में से तीन अलग गैर-समय विजय प्रकार जीतें, हर एक अलग योग्य स्वतंत्र खेल में। प्रत्येक खेल ID का केवल पहला औपचारिक अंतिम परिणाम गिना जाता है। फिर लोड किए या कॉपी किए सहेजे खेल न नए खेल जोड़ते हैं, न विजय प्रकार।
在三个不同的合格对局中，取得三种不同的非时间胜利。 = तीन अलग योग्य खेलों में तीन अलग गैर-समय विजय प्रकार जीतें।
