Greetings to the wise and brave Prince William of Orange, who freed the Netherlands and gave strength to the Dutch people. In 1568, you led a rebellion against Spanish dominion, to gain freedom for your people, and therefore starting the Eighty Years' War. Your actions were all aimed to create one of Europe's first modern republics, the Seven United Provinces. The rebellion was the meaning of your very life and death, as it was also the cause of your assassination in 1584. But your death has given even more pride and courage to your people, to fight for liberty against any oppressors. Carved in history as the 'Father of the Fatherland', your name is a symbol of Dutch independence for eternity. = नीदरलैंड को मुक्त करने और डच लोगों को शक्ति देने वाले बुद्धिमान वीर राजकुमार विलियम ऑफ़ ऑरेंज को नमस्कार। 1568 में आपने अपने लोगों को स्वतंत्रता दिलाने के लिए स्पेनी प्रभुत्व के विरुद्ध विद्रोह का नेतृत्व किया और इस तरह अस्सी वर्षों का युद्ध शुरू किया। आपके सभी कार्य यूरोप के पहले आधुनिक गणराज्यों में से एक, सात संयुक्त प्रांतों, की स्थापना के लिए थे। विद्रोह आपके जीवन और मृत्यु का अर्थ था और 1584 में आपकी हत्या का कारण भी। किंतु आपकी मृत्यु ने लोगों को किसी भी उत्पीड़क से स्वतंत्रता के लिए लड़ने का और अधिक गर्व व साहस दिया। इतिहास में 'पितृभूमि के पिता' के रूप में अंकित आपका नाम सदा डच स्वतंत्रता का प्रतीक है।
Brave Prince, your people ask for your wisdom to gain its freedom once more, and to illuminate the world with progressive and modern ideas. Will your new empire shine through the ages of history? = वीर राजकुमार, आपके लोग फिर स्वतंत्रता पाने और प्रगतिशील आधुनिक विचारों से विश्व को आलोकित करने के लिए आपकी बुद्धि माँगते हैं। क्या आपका नया साम्राज्य इतिहास के युगों में चमकेगा?
