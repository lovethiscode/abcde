Sejong = सेजोंग
Jip-hyun-jun (Hall of Worthies) will no longer tolerate your irksome behavior. We will liberate the citizens under your oppression even with force, and enlighten them! = जिप-ह्योन-जुन, अर्थात विद्वानों का सभागार, अब आपका कष्टदायक व्यवहार सहन नहीं करेगा। हम आपके उत्पीड़न के अधीन नागरिकों को बल प्रयोग से भी मुक्त कराकर ज्ञान देंगे!
Foolish, miserable wretch! You will be crushed by this country's magnificent scientific power! = मूर्ख, दयनीय प्राणी! इस देश की अद्भुत वैज्ञानिक शक्ति आपको कुचल देगी!
Now the question is who will protect my people. A dark age has come. = अब प्रश्न यह है कि मेरे लोगों की रक्षा कौन करेगा। अंधकार युग आ गया है।
Your words reveal more of your own prejudice than any fault in my own. = आपके शब्द मेरी किसी कमी से अधिक आपके अपने पूर्वाग्रह प्रकट करते हैं।
Welcome to the palace of Choson, stranger. I am the learned King Sejong, who looks after his great people. = अजनबी, चोसोन के महल में स्वागत है। मैं विद्वान राजा सेजोंग हूँ, जो अपने महान लोगों की देखभाल करता है।
We have many things to discuss and have much to benefit from each other. = हमारे पास चर्चा करने को बहुत कुछ है और हम एक-दूसरे से बहुत लाभ पा सकते हैं।
Oh, it's you = ओह, आप हैं
Scholars of the Jade Hall = जेड सभागार के विद्वान
Greetings to you, King Sejong the Great, heir of the Choson Dynasty! Prosperity and benevolence towards the common man are the principles of your reign, and made of you the most beloved Korean king. You always aimed to provide a fair and equal society for all your people, and also to favor knowledge and technological discoveries. Your wisdom and intelligence imbued all the Korean society, and the scholars of the Jade Hall developed Korea's first written language, Hangul, sharing further literature and science to the people after centuries of darkness. = चोसोन राजवंश के उत्तराधिकारी, महान राजा सेजोंग को नमस्कार! सामान्य जन की समृद्धि और उनके प्रति दया आपके शासन के सिद्धांत हैं, जिन्होंने आपको सबसे प्रिय कोरियाई राजा बनाया। आपने सदैव सभी लोगों के लिए निष्पक्ष और समान समाज बनाने तथा ज्ञान और तकनीकी खोजों को प्रोत्साहन देने का लक्ष्य रखा। आपकी बुद्धिमत्ता पूरे कोरियाई समाज में समाई, और जेड सभागार के विद्वानों ने कोरिया की पहली लिपि हंगुल विकसित की, जिससे शताब्दियों के अंधकार के बाद साहित्य और विज्ञान लोगों तक और पहुँचे।
Wise Sejong, will you gift your people with the radiance of harmony and knowledge to dispel the darkness once again? Will your new empire shine through the ages of history? = बुद्धिमान सेजोंग, क्या आप एक बार फिर अंधकार दूर करने के लिए अपने लोगों को सद्भाव और ज्ञान का प्रकाश देंगे? क्या आपका नया साम्राज्य इतिहास के युगों में चमकेगा?
