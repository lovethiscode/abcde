All hail Great King Gustavus Adolphus, founder of the Swedish Empire, and one of the most famous military tacticians. In the early 17th century, Sweden emerged as a great power in Europe under your reign, thanks to your wisdom, both in diplomacy and warfare. As king, you decided to reform Swedish laws to bring economic stability and prosperity to your people. Your allies, and also your enemies, called you the 'Lion of the North', witnessing your modern vision of warfare, and the prowess of your armies on the battlefield. As you triumphed in the Thirty Years' War, your name will be forever remembered as one of history's greatest generals. = स्वीडिश साम्राज्य के संस्थापक और सबसे प्रसिद्ध सैन्य रणनीतिकारों में से एक, महान राजा गुस्तावस एडॉल्फस की जय हो। कूटनीति और युद्धकला दोनों में आपकी बुद्धि के कारण 17वीं शताब्दी के आरंभ में आपके शासन में स्वीडन यूरोप की महान शक्ति बना। राजा के रूप में आपने लोगों की आर्थिक स्थिरता और समृद्धि के लिए स्वीडिश कानून सुधारने का निर्णय लिया। युद्ध के प्रति आपके आधुनिक दृष्टिकोण और युद्धभूमि में सेनाओं का कौशल देखकर सहयोगियों और शत्रुओं दोनों ने आपको 'उत्तर का सिंह' कहा। तीस वर्षों के युद्ध में आपकी विजय के कारण आपका नाम इतिहास के महानतम सेनापतियों में सदा याद किया जाएगा।
O noble King, will you lend your leadership and brilliant ideas to Sweden once again, to conceive strategies never seen before? Will your new empire shine through the ages of history? = हे श्रेष्ठ राजा, क्या आप पहले कभी न देखी रणनीतियाँ रचने के लिए फिर स्वीडन को अपना नेतृत्व और शानदार विचार देंगे? क्या आपका नया साम्राज्य इतिहास के युगों में चमकेगा?
