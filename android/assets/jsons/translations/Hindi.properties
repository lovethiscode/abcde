Dido = डीडो
Tell me, do you all know how numerous my armies, elephants and the gdadons are? No? Today, you shall find out! = बताइए, क्या आप जानते हैं कि मेरी सेनाएँ, हाथी और गदादोन कितने हैं? नहीं? आज पता चल जाएगा!
Fate is against you. You earned the animosity of Carthage in your exploration. Your days are numbered. = भाग्य आपके विरुद्ध है। अपनी खोजयात्रा में आपने कार्थेज की शत्रुता अर्जित की। आपके दिन गिने जा चुके हैं।
The fates became to hate me. This is it? You wouldn't destroy us so without their help. = भाग्य मुझसे घृणा करने लगा। क्या यही अंत है? उसकी मदद के बिना आप हमें ऐसे नष्ट नहीं कर सकते थे।
You aren't meeting my expectations. You can do so much better. = आप मेरी अपेक्षाएँ पूरी नहीं कर रहे। आप बहुत बेहतर कर सकते हैं।
The Phoenicians welcome you to this most pleasant kingdom. I am Dido, the queen of Carthage and all that belongs to it. = फ़ोनीशियाई इस अत्यंत सुखद राज्य में आपका स्वागत करते हैं। मैं कार्थेज और उसके सभी क्षेत्रों की रानी डीडो हूँ।
I just had the marvelous idea, and I think you'll appreciate it too. = अभी मुझे एक अद्भुत विचार आया और लगता है आप भी उसकी सराहना करेंगे।
What is it now? = अब क्या है?
Phoenician Heritage = फ़ोनीशियाई विरासत
Greetings to you, revered Queen Dido, ruler of the legendary kingdom of Carthage. The great poet Virgil related your great history, how your husband Acerbas was murdered by your own brother, King Pygmalion of Tyre, to steal the treasures of your family that were rightfully yours. But you endured his pressure until you and your compatriots decided to flee and sail for new lands. The gods led you to the shores of North Africa, and with cunning diplomacy, you expanded the territory of your new home, and laid the basis for the future kingdom of Carthage. = प्रसिद्ध कार्थेज राज्य की शासक, पूजनीय रानी डीडो को नमस्कार। महान कवि वर्जिल ने आपकी महान कथा कही: आपके अपने भाई, टायर के राजा पिग्मेलियन ने आपके पति असेर्बास की हत्या कर दी, ताकि परिवार का वह खज़ाना चुरा सके जो उचित रूप से आपका था। आपने उसका दबाव सहा, जब तक आपने और आपके देशवासियों ने भागकर नई भूमि की ओर जहाज़ ले जाने का निर्णय नहीं लिया। देवताओं ने आपको उत्तर अफ्रीका के तटों तक पहुँचाया और चतुर कूटनीति से आपने अपने नए घर का क्षेत्र बढ़ाया तथा भावी कार्थेज राज्य की नींव रखी।
Clever and proud Dido, the storm is coming and your people look for a shelter under your wise and powerful protection. Can you create a new and radiant Carthage able to cleave the darkness? Will your new empire shine through the ages of history? = चतुर और गर्वीली डीडो, तूफ़ान आ रहा है और आपके लोग आपकी बुद्धिमान व शक्तिशाली रक्षा में आश्रय खोजते हैं। क्या आप अंधकार चीर सकने वाला नया उज्ज्वल कार्थेज बना सकती हैं? क्या आपका नया साम्राज्य इतिहास के युगों में चमकेगा?
