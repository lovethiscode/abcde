'A Horse! A Horse! My kingdom for a horse!' - Shakespeare (Richard III) = 'एक घोड़ा! एक घोड़ा! एक घोड़े के बदले मेरा राज्य!' - शेक्सपियर (रिचर्ड तृतीय)
Horseback Riding = घुड़सवारी
'Mathematics is the gate and key to the sciences.' - Roger Bacon = 'गणित विज्ञानों का द्वार और कुंजी है।' - रोजर बेकन
Mathematics = गणित
'Three things are to be looked to in a building: that it stands on the right spot; that it be securely founded; that it be successfully executed.' - Johann Wolfgang von Goethe = 'भवन में तीन बातें देखनी चाहिए: वह सही स्थान पर हो, उसकी नींव सुरक्षित हो और उसका निर्माण सफलतापूर्वक किया गया हो।' - योहान वोल्फगांग फ़ॉन गोएथे
Construction = निर्माण
'Do not wait to strike til the iron is hot, but make it hot by striking.' - William Butler Yeats = 'प्रहार करने के लिए लोहे के गर्म होने की प्रतीक्षा मत करो, प्रहार करके उसे गर्म करो।' - विलियम बटलर यीट्स
Iron Working = लौह शिल्प

'Three things are necessary for the salvation of man: to know what he ought to believe; to know what he ought to desire; and to know what he ought to do' - St. Thomas Aquinas = 'मनुष्य के उद्धार के लिए तीन बातें आवश्यक हैं: वह जाने कि उसे क्या मानना चाहिए, क्या चाहना चाहिए और क्या करना चाहिए।' - संत थॉमस एक्विनास
Theology = धर्मशास्त्र
'The only thing that saves us from the bureaucracy is its inefficiency' - Eugene McCarthy = 'नौकरशाही से हमें केवल उसकी अकुशलता बचाती है।' - यूजीन मैकार्थी
Civil Service = नागरिक सेवा
'Better is bread with a happy heart than wealth with vexation.' - Amenemope = 'व्याकुलता के साथ संपदा से प्रसन्न हृदय के साथ रोटी बेहतर है।' - अमेनेमोपे
Currency = मुद्रा
'Instrumental or mechanical science is the noblest and, above all others, the most useful.' - Leonardo da Vinci = 'यांत्रिक विज्ञान सबसे श्रेष्ठ और अन्य सभी से अधिक उपयोगी है।' - लियोनार्डो दा विंची
Engineering = अभियांत्रिकी
'When pieces of bronze or gold or iron break, the metal-smith welds them together again in the fire, and the bond is established.' - Sri Guru Granth Sahib = 'जब कांसे, सोने या लोहे के टुकड़े टूटते हैं, धातुकार उन्हें अग्नि में फिर जोड़ता है और बंधन स्थापित होता है।' - श्री गुरु ग्रंथ साहिब
Metal Casting = धातु ढलाई

'I find the great thing in this world is not so much where we stand, as in what direction we are moving.' - Oliver Wendell Holmes = 'इस संसार में बड़ी बात यह नहीं कि हम कहाँ खड़े हैं, बल्कि यह कि हम किस दिशा में बढ़ रहे हैं।' - ओलिवर वेंडेल होम्स
Compass = दिशासूचक
'Education is the best provision for old age.' - Aristotle = 'शिक्षा वृद्धावस्था की सर्वोत्तम व्यवस्था है।' - अरस्तू
Education = शिक्षा
'Whoso pulleth out this sword of this stone and anvil, is rightwise king born of all England.' - Malory = 'जो इस पत्थर और निहाई से यह तलवार निकालेगा, वही जन्म से पूरे इंग्लैंड का सच्चा राजा है।' - मैलरी
Chivalry = शूरवीरता
'The press is the best instrument for enlightening the mind of man, and improving him as a rational, moral and social being.' - Thomas Jefferson = 'मुद्रण यंत्र मनुष्य के मन को ज्ञान देने और उसे विवेकशील, नैतिक तथा सामाजिक प्राणी के रूप में सुधारने का सर्वोत्तम साधन है।' - थॉमस जेफ़रसन
Machinery = यंत्रकला
'Measure what is measurable, and make measurable what is not so.' - Galileo Galilei = 'जो मापने योग्य है उसे मापो और जो नहीं है उसे मापने योग्य बनाओ।' - गैलीलियो गैलिली
Physics = भौतिकी
'John Henry said to his Captain, / 'A man ain't nothin' but a man, / And before I'll let your steam drill beat me down, / I'll die with the hammer in my hand.'' - Anonymous: The Ballad of John Henry, the Steel-Drivin' Man = 'जॉन हेनरी ने अपने कप्तान से कहा, / मनुष्य केवल मनुष्य ही है, / और तुम्हारी भाप की ड्रिल से हारने से पहले, / मैं हाथ में हथौड़ा लिए मर जाऊँगा।' - अज्ञात: इस्पात पर प्रहार करने वाले जॉन हेनरी की गाथा
Steel = इस्पात

'Joyfully to the breeze royal Odysseus spread his sail, and with his rudder skillfully he steered.' - Homer = 'राजसी ओडिसियस ने प्रसन्नता से हवा में अपना पाल फैलाया और कुशलता से पतवार सँभाली।' - होमर
Astronomy = खगोलशास्त्र
'Their rising all at once was as the sound of thunder heard remote' - Milton = 'उन सबका एक साथ उठना दूर सुनाई देती गरज जैसा था।' - मिल्टन
Acoustics = ध्वनिकी
'Happiness: a good bank account, a good cook and a good digestion' - Jean Jacques Rousseau = 'खुशी: अच्छा बैंक खाता, अच्छा रसोइया और अच्छा पाचन।' - जाँ जाक रूसो
Banking = बैंकिंग
'It is a newspaper's duty to print the news and raise hell.' - The Chicago Times = 'समाचार छापना और हंगामा खड़ा करना अखबार का कर्तव्य है।' - द शिकागो टाइम्स
Printing Press = मुद्रण यंत्र
'The day when two army corps can annihilate each other in one second, all civilized nations, it is to be hoped, will recoil from war and discharge their troops.' - Alfred Nobel = 'जिस दिन दो सैन्य दल एक सेकंड में एक-दूसरे का विनाश कर सकेंगे, आशा है सभी सभ्य राष्ट्र युद्ध से पीछे हटेंगे और अपनी सेनाएँ भंग करेंगे।' - अल्फ्रेड नोबेल
Gunpowder = बारूद

'The winds and the waves are always on the side of the ablest navigators.' - Edward Gibbon = 'हवाएँ और लहरें सदा सबसे कुशल नाविकों के पक्ष में होती हैं।' - एडवर्ड गिबन
Navigation = नौवहन
'Compound interest is the most powerful force in the universe.' - Albert Einstein = 'चक्रवृद्धि ब्याज ब्रह्मांड की सबसे शक्तिशाली शक्ति है।' - अल्बर्ट आइंस्टीन
Economics = अर्थशास्त्र
'Wherever we look, the work of the chemist has raised the level of our civilization and has increased the productive capacity of the nation.' - Calvin Coolidge = 'हम जहाँ भी देखें, रसायनज्ञ के कार्य ने हमारी सभ्यता का स्तर ऊँचा किया है और राष्ट्र की उत्पादन क्षमता बढ़ाई है।' - कैल्विन कूलिज
Chemistry = रसायनशास्त्र
'There never was a good knife made of bad steel.' - Benjamin Franklin = 'खराब इस्पात से कभी अच्छा चाकू नहीं बना।' - बेंजामिन फ़्रैंकलिन
Metallurgy = धातुकर्म

'Those who cannot remember the past are condemned to repeat it.' - George Santayana = 'जो अतीत को याद नहीं रख सकते, वे उसे दोहराने को अभिशप्त हैं।' - जॉर्ज सांतायाना
Archaeology = पुरातत्व
'Every great advance in science has issued from a new audacity of imagination.' - John Dewey = 'विज्ञान की हर बड़ी प्रगति कल्पना के नए साहस से उत्पन्न हुई है।' - जॉन ड्यूई
Scientific Theory = वैज्ञानिक सिद्धांत
'Wars may be fought with weapons, but they are won by men. It is the spirit of the men who follow and of the man who leads that gains the victory.' - George S. Patton = 'युद्ध हथियारों से लड़े जा सकते हैं, पर मनुष्य उन्हें जीतते हैं। अनुसरण करने वालों और नेतृत्व करने वाले की भावना ही विजय दिलाती है।' - जॉर्ज एस. पैटन
Military Science = सैन्य विज्ञान
'The nation that destroys its soil destroys itself.' - Franklin Delano Roosevelt = 'जो राष्ट्र अपनी मिट्टी नष्ट करता है, वह स्वयं को नष्ट करता है।' - फ़्रैंकलिन डेलानो रूज़वेल्ट
Fertilizer = उर्वरक
'It is well that war is so terrible, or we should grow too fond of it.' - Robert E. Lee = 'अच्छा है कि युद्ध इतना भयानक है, वरना हमें उससे बहुत प्रेम हो जाता।' - रॉबर्ट ई. ली
Rifling = नाल की खाँचाकारी

'If the brain were so simple we could understand it, we would be so simple we couldn't.' - Lyall Watson = 'यदि मस्तिष्क इतना सरल होता कि हम उसे समझ लेते, तो हम इतने सरल होते कि समझ नहीं पाते।' - लायल वॉटसन
Biology = जीवविज्ञान
'The nations of the West hope that by means of steam communication all the world will become as one family.' - Townsend Harris = 'पश्चिम के राष्ट्र आशा करते हैं कि भाप से चलने वाले संचार के माध्यम से पूरा विश्व एक परिवार बन जाएगा।' - टाउनसेंड हैरिस
Steam Power = भाप की शक्ति
'As soon as men decide that all means are permitted to fight an evil, then their good becomes indistinguishable from the evil that they set out to destroy.' - Christopher Dawson = 'जैसे ही मनुष्य तय करते हैं कि किसी बुराई से लड़ने के लिए सभी साधन स्वीकार्य हैं, उनकी अच्छाई उस बुराई से अलग नहीं रह जाती जिसे वे नष्ट करना चाहते थे।' - क्रिस्टोफ़र डॉसन
Dynamite = डायनामाइट

'Is it a fact - or have I dreamt it - that, by means of electricity, the world of matter has become a great nerve, vibrating thousands of miles in a breathless point of time?' - Nathaniel Hawthorne = 'क्या यह सच है, या मैंने सपना देखा है, कि बिजली के माध्यम से भौतिक विश्व एक विशाल तंत्रिका बन गया है, जो एक क्षण में हज़ारों मील तक कंपन करती है?' - नथानिएल हॉथॉर्न
Electricity = विद्युत
'Nothing is particularly hard if you divide it into small jobs.' - Henry Ford = 'यदि किसी काम को छोटे कामों में बाँट दें तो कुछ भी विशेष कठिन नहीं रहता।' - हेनरी फ़ोर्ड
Replaceable Parts = बदले जा सकने वाले पुर्ज़े
'The introduction of so powerful an agent as steam to a carriage on wheels will make a great change in the situation of man.' - Thomas Jefferson = 'पहियों वाली गाड़ी में भाप जैसी शक्तिशाली शक्ति का उपयोग मनुष्य की स्थिति में बड़ा परिवर्तन करेगा।' - थॉमस जेफ़रसन
Railroads = रेलमार्ग

'And homeless near a thousand homes I stood, and near a thousand tables pined and wanted food.' - William Wordsworth = 'और मैं हज़ार घरों के पास बेघर खड़ा था, हज़ार मेज़ों के पास भूखा तड़पता था।' - विलियम वर्ड्सवर्थ
Refrigeration = प्रशीतन
'I once sent a dozen of my friends a telegram saying 'flee at once-all is discovered!' They all left town immediately.' - Mark Twain = 'एक बार मैंने अपने दर्जन भर मित्रों को तार भेजा: तुरंत भागो, सब पता चल गया! वे सभी तुरंत शहर छोड़ गए।' - मार्क ट्वेन
Telegraph = तार
'The whole country was tied together by radio. We all experienced the same heroes and comedians and singers. They were giants.' - Woody Allen = 'पूरा देश रेडियो से जुड़ गया था। हम सबने एक ही नायक, हास्य कलाकार और गायक सुने। वे दिग्गज थे।' - वुडी एलन
Radio = रेडियो
'Aeronautics was neither an industry nor a science. It was a miracle.' - Igor Sikorsky = 'विमानन न उद्योग था, न विज्ञान। वह एक चमत्कार था।' - इगोर सिकॉर्स्की
Flight = उड़ान
'Any man who can drive safely while kissing a pretty girl is simply not giving the kiss the attention it deserves.' - Albert Einstein = 'जो सुंदर लड़की को चूमते हुए सुरक्षित गाड़ी चला सकता है, वह चुंबन पर उतना ध्यान नहीं दे रहा जितना उसे देना चाहिए।' - अल्बर्ट आइंस्टीन
Combustion = दहन

'In nothing do men more nearly approach the gods than in giving health to men.' - Cicero = 'मनुष्य को स्वास्थ्य देने में जितना वह देवताओं के निकट आता है, उतना किसी और काम में नहीं।' - सिसरो
Pharmaceuticals = औषधि विज्ञान
'Ben, I want to say one word to you, just one word: plastics.' - Buck Henry and Calder Willingham, The Graduate = 'बेन, मैं तुमसे बस एक शब्द कहना चाहता हूँ: प्लास्टिक।' - बक हेनरी और कैल्डर विलिंघम, द ग्रैजुएट
Plastics = प्लास्टिक
'There's a basic principle about consumer electronics: it gets more powerful all the time and it gets cheaper all the time.' - Trip Hawkins = 'उपभोक्ता इलेक्ट्रॉनिक्स का मूल सिद्धांत है: वह लगातार अधिक शक्तिशाली और लगातार सस्ता होता जाता है।' - ट्रिप हॉकिन्स
Electronics = इलेक्ट्रॉनिक्स
'The speed of communications is wondrous to behold, it is also true that speed does multiply the distribution of information that we know to be untrue.' – Edward R. Murrow = 'संचार की गति अद्भुत है, किंतु यह भी सत्य है कि गति उन सूचनाओं का प्रसार बढ़ाती है जिन्हें हम असत्य जानते हैं।' - एडवर्ड आर. मरो
Mass Media = जनसंचार माध्यम
'Vision is the art of seeing things invisible.' - Jonathan Swift = 'दृष्टि अदृश्य चीज़ों को देखने की कला है।' - जोनाथन स्विफ़्ट
Radar = रडार
'The unleashed power of the atom has changed everything save our modes of thinking, and we thus drift toward unparalleled catastrophes.' - Albert Einstein = 'परमाणु की मुक्त शक्ति ने हमारी सोच को छोड़कर सब कुछ बदल दिया है, और इस तरह हम अभूतपूर्व आपदाओं की ओर बह रहे हैं।' - अल्बर्ट आइंस्टीन
Atomic Theory = परमाणु सिद्धांत

'Only within the moment of time represented by the present century has one species, man, acquired significant power to alter the nature of his world.' - Rachel Carson = 'वर्तमान शताब्दी के इस छोटे समय में ही एक प्रजाति, मनुष्य, ने अपने संसार की प्रकृति बदलने की पर्याप्त शक्ति प्राप्त की है।' - रेचल कार्सन
Ecology = पारिस्थितिकी
'Computers are like Old Testament gods: lots of rules and no mercy.' - Joseph Campbell = 'कंप्यूटर पुराने नियम के देवताओं जैसे हैं: बहुत सारे नियम और कोई दया नहीं।' - जोसेफ़ कैम्पबेल
Computers = कंप्यूटर
'A good rule for rocket experimenters to follow is this: always assume that it will explode.' - Astronautics Magazine, 1937 = 'रॉकेट के प्रयोगकर्ताओं के लिए अच्छा नियम है: सदा मानकर चलें कि वह फटेगा।' - एस्ट्रोनॉटिक्स पत्रिका, 1937
Rocketry = रॉकेट विज्ञान
'The night is far spent, the day is at hand: let us therefore cast off the works of darkness, and let us put on the armor of light.' - The Holy Bible: Romans, 13:12 = 'रात बहुत बीत गई, दिन निकट है; इसलिए हम अंधकार के कार्य छोड़ें और प्रकाश का कवच पहनें।' - पवित्र बाइबिल: रोमियों 13:12
Lasers = लेज़र
'I am become Death, the destroyer of worlds.' - J. Robert Oppenheimer = 'अब मैं मृत्यु बन गया हूँ, लोकों का विनाशक।' - जे. रॉबर्ट ओपेनहाइमर
Nuclear Fission = नाभिकीय विखंडन

'The new electronic interdependence recreates the world in the image of a global village.' - Marshall McLuhan = 'नई इलेक्ट्रॉनिक परस्पर निर्भरता विश्व को एक वैश्विक गाँव के रूप में फिर रचती है।' - मार्शल मैकलुहान
Globalization = वैश्वीकरण
'1. A robot may not injure a human being or, through inaction, allow a human being to come to harm. 2. A robot must obey any orders given to it by human beings, except when such orders would conflict with the First Law. 3. A robot must protect its own existence as long as such protection does not conflict with the First or Second Law.' - Isaac Asimov = '1. रोबोट किसी मनुष्य को चोट नहीं पहुँचा सकता या निष्क्रिय रहकर उसे हानि नहीं होने दे सकता। 2. रोबोट को मनुष्यों के दिए सभी आदेश मानने होंगे, सिवाय उन आदेशों के जो पहले नियम से टकराएँ। 3. रोबोट को अपना अस्तित्व बचाना होगा, जब तक ऐसा संरक्षण पहले या दूसरे नियम से न टकराए।' - आइज़ैक असिमोव
Robotics = रोबोट विज्ञान
'Now, somehow, in some new way, the sky seemed almost alien.' - Lyndon B. Johnson = 'अब किसी तरह, किसी नए रूप में, आकाश लगभग अपरिचित लगने लगा।' - लिंडन बी. जॉनसन
Satellites = उपग्रह
'Be extremely subtle, even to the point of formlessness, be extremely mysterious, even to the point of soundlessness. Thereby you can be the director of the opponent's fate.' - Sun Tzu = 'अत्यंत सूक्ष्म बनो, निराकार होने तक; अत्यंत रहस्यमय बनो, निःशब्द होने तक। तब तुम विरोधी की नियति के संचालक बन सकते हो।' - सुन त्ज़ू
Stealth = अदृश्यता तकनीक
'Our scientific power has outrun our spiritual power, we have guided missiles and misguided men.' – Martin Luther King Jr. = 'हमारी वैज्ञानिक शक्ति हमारी आध्यात्मिक शक्ति से आगे निकल गई है; हमारे पास निर्देशित मिसाइलें और भटके हुए मनुष्य हैं।' - मार्टिन लूथर किंग जूनियर
Advanced Ballistics = उन्नत प्रक्षेपिकी

'Every particle of matter is attracted by or gravitates to every other particle of matter with a force inversely proportional to the squares of their distances.' - Isaac Newton = 'पदार्थ का प्रत्येक कण दूसरे प्रत्येक कण को उनकी दूरी के वर्ग के व्युत्क्रमानुपाती बल से आकर्षित करता है।' - आइज़ैक न्यूटन
Particle Physics = कण भौतिकी
'The release of atomic energy has not created a new problem. It has readily made more urgent the necessity of solving an existing one.' - Albert Einstein = 'परमाणु ऊर्जा की मुक्ति ने नई समस्या पैदा नहीं की। उसने मौजूदा समस्या का समाधान और अधिक आवश्यक बना दिया है।' - अल्बर्ट आइंस्टीन
Nuclear Fusion = नाभिकीय संलयन

'The impact of nanotechnology is expected to exceed the impact that the electronics revolution has had on our lives.' - Richard Schwartz = 'आशा है नैनोप्रौद्योगिकी का प्रभाव हमारे जीवन पर इलेक्ट्रॉनिक क्रांति के प्रभाव से अधिक होगा।' - रिचर्ड श्वार्ट्ज़
Nanotechnology = नैनोप्रौद्योगिकी

'I think we agree, the past is over.' - George W. Bush = 'मुझे लगता है हम सहमत हैं कि अतीत समाप्त हो चुका है।' - जॉर्ज डब्ल्यू. बुश
Future Tech = भविष्य की तकनीक
Who knows what the future holds? = कौन जानता है भविष्य में क्या है?


